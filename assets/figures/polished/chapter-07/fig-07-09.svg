<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect x="0" y="0" width="1400" height="940" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- ========== 标题区 ========== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" font-size="22" font-weight="700" fill="#0F172A">图7-6 DriverTool 驱动配置时序图</text>
  <text x="82" y="72" font-size="12" fill="#64748B">从自然语言指令到驱动实例创建并启动的端到端组件交互路径（写操作需用户确认）</text>
  <g>
    <rect x="1278" y="24" width="92" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1324" y="41" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">SEQUENCE</text>
  </g>
  <line x1="40" y1="103" x2="1360" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ========== 参与者生命线 ========== -->
  <!-- lifelines x: 用户=160, AC=420, DT=700, DS=980, DB=1240 -->
  <line x1="160" y1="200" x2="160" y2="820" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="420" y1="200" x2="420" y2="820" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="700" y1="200" x2="700" y2="820" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="980" y1="200" x2="980" y2="820" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="1240" y1="200" x2="1240" y2="820" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ========== 参与者头 ========== -->
  <!-- 用户 (application/灰, actor) -->
  <g>
    <rect x="100" y="140" width="120" height="52" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="160" y="164" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">👤 用户</text>
    <text x="160" y="181" font-size="10" fill="#64748B" text-anchor="middle">application</text>
  </g>
  <!-- Agentic Center (ai/橙) -->
  <g>
    <rect x="360" y="140" width="120" height="52" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="420" y="164" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">🤖 Agentic Center</text>
    <text x="420" y="181" font-size="10" fill="#64748B" text-anchor="middle">intelligence</text>
  </g>
  <!-- DriverTool (platform/蓝) -->
  <g>
    <rect x="640" y="140" width="120" height="52" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="700" y="164" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">🔧 DriverTool</text>
    <text x="700" y="181" font-size="10" fill="#64748B" text-anchor="middle">platform · Bean</text>
  </g>
  <!-- DriverService (platform/蓝) -->
  <g>
    <rect x="920" y="140" width="120" height="52" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="980" y="164" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">📋 DriverService</text>
    <text x="980" y="181" font-size="10" fill="#64748B" text-anchor="middle">platform · 服务</text>
  </g>
  <!-- 数据库 (data/紫, 圆柱体) -->
  <g>
    <path d="M 1184,152 a 56,12 0 1,0 112,0 a 56,12 0 1,0 -112,0 z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <path d="M 1184,152 L 1184,188 a 56,12 0 0,0 112,0 L 1296,152" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <path d="M 1184,152 a 56,12 0 0,0 112,0" fill="none" stroke="#7C3AED" stroke-width="2"/>
    <text x="1240" y="173" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">🗄️ 数据库</text>
    <text x="1240" y="198" font-size="10" fill="#64748B" text-anchor="middle">data</text>
  </g>

  <!-- ========== alt 片段：确认分支 (覆盖写操作确认) ========== -->
  <g>
    <rect x="120" y="585" width="1140" height="180" rx="4" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="6 3"/>
    <path d="M 120,585 L 200,585 L 210,600 L 210,610 L 120,610 Z" fill="#2563EB" stroke="none"/>
    <text x="130" y="603" font-size="11" font-weight="700" fill="#FFFFFF">alt</text>
    <text x="220" y="603" font-size="11" fill="#475569">@WriteOperation 触发确认分支</text>
    <path d="M 120,720 L 200,720 L 210,735 L 210,745 L 120,745 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
    <text x="130" y="738" font-size="11" font-weight="700" fill="#2563EB">else</text>
    <text x="220" y="738" font-size="11" fill="#475569">用户拒绝 → 中止写操作</text>
  </g>

  <!-- ========== 消息 ========== -->
  <!-- msg 1: 用户 → AC  启用Modbus驱动 (主链路蓝) -->
  <text x="170" y="241" font-size="12" font-weight="600" fill="#0F172A">① 启用 Modbus 驱动（自然语言）</text>
  <line x1="160" y1="250" x2="416" y2="250" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- msg 2: AC → DT  listDriverTypes (读绿) -->
  <text x="430" y="281" font-size="12" font-weight="600" fill="#0F172A">② listDriverTypes()</text>
  <line x1="420" y1="290" x2="696" y2="290" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- msg 3: DT → DS  查询类型 (读绿) -->
  <text x="710" y="321" font-size="12" font-weight="600" fill="#0F172A">查询驱动类型</text>
  <line x1="700" y1="330" x2="976" y2="330" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- msg 4: DS → DB  SELECT (读绿) -->
  <text x="990" y="361" font-size="12" font-weight="600" fill="#0F172A">SELECT 驱动类型</text>
  <line x1="980" y1="370" x2="1236" y2="370" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- msg 5: DB → DS  返回 (灰虚) -->
  <text x="990" y="401" font-size="12" fill="#475569">类型列表</text>
  <line x1="1240" y1="410" x2="984" y2="410" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>

  <!-- msg 6: DS → DT  返回 (灰虚) -->
  <text x="710" y="441" font-size="12" fill="#475569">返回类型</text>
  <line x1="980" y1="450" x2="704" y2="450" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>

  <!-- msg 7: DT → AC  返回 (灰虚) -->
  <text x="430" y="481" font-size="12" fill="#475569">返回类型</text>
  <line x1="700" y1="490" x2="424" y2="490" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>

  <!-- msg 8: AC → 用户  提示选择 (灰虚) -->
  <text x="170" y="521" font-size="12" fill="#475569">请选择驱动类型</text>
  <line x1="420" y1="530" x2="164" y2="530" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>

  <!-- msg 9: 用户 → AC  提供参数 (主链路蓝) -->
  <text x="170" y="561" font-size="12" font-weight="600" fill="#0F172A">③ 提供驱动参数</text>
  <line x1="160" y1="570" x2="416" y2="570" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- msg 10: AC → DT  configureDriver (写红) -->
  <text x="430" y="621" font-size="12" font-weight="600" fill="#0F172A">④ configureDriver()</text>
  <line x1="420" y1="630" x2="696" y2="630" stroke="#E11D48" stroke-width="2" marker-end="url(#ah-red)"/>

  <!-- msg 11: DT → AC  @WriteOperation 确认请求 (蓝虚) -->
  <text x="430" y="661" font-size="12" font-weight="600" fill="#2563EB">@WriteOperation → 需确认</text>
  <line x1="700" y1="670" x2="424" y2="670" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-blue)"/>

  <!-- msg 12: AC → 用户  请求确认 (蓝虚) -->
  <text x="170" y="691" font-size="12" font-weight="600" fill="#2563EB">请求用户确认</text>
  <line x1="420" y1="700" x2="164" y2="700" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-blue)"/>

  <!-- msg 13: 用户 → AC  确认 (蓝实) -->
  <text x="170" y="731" font-size="12" font-weight="600" fill="#0F172A">⑤ 确认执行</text>
  <line x1="160" y1="740" x2="416" y2="740" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- msg 14: AC → DT  继续执行 (蓝实) -->
  <text x="430" y="771" font-size="12" font-weight="600" fill="#0F172A">继续执行 configureDriver</text>
  <line x1="420" y1="780" x2="696" y2="780" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- msg 15: DT → DS  INSERT 实例 (写红) -->
  <text x="710" y="801" font-size="12" font-weight="600" fill="#0F172A">INSERT 驱动实例</text>
  <line x1="700" y1="810" x2="976" y2="810" stroke="#E11D48" stroke-width="2" marker-end="url(#ah-red)"/>

  <!-- msg 16: AC → DT  toggleDriver(start) (写红) -->
  <text x="430" y="831" font-size="12" font-weight="600" fill="#0F172A">⑥ toggleDriver(start)</text>
  <line x1="420" y1="840" x2="696" y2="840" stroke="#E11D48" stroke-width="2" marker-end="url(#ah-red)"/>

  <!-- ========== 图例 ========== -->
  <line x1="40" y1="860" x2="1360" y2="860" stroke="#E2E8F0" stroke-width="1"/>
  <g font-size="11" fill="#475569">
    <!-- 实线/虚线 -->
    <line x1="60" y1="884" x2="92" y2="884" stroke="#64748B" stroke-width="2" marker-end="url(#ah-gray)"/>
    <text x="100" y="888">同步调用（实线）</text>
    <line x1="240" y1="884" x2="272" y2="884" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <text x="280" y="888">响应 / 确认请求（虚线）</text>

    <!-- 颜色语义 -->
    <rect x="450" y="878" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="472" y="888">只读操作</text>
    <rect x="556" y="878" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
    <text x="578" y="888">写操作</text>
    <rect x="650" y="878" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="672" y="888">用户确认相关</text>
    <rect x="772" y="878" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="794" y="888">返回 / 回传</text>

    <!-- 域 -->
    <rect x="900" y="878" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="922" y="888">智能决策域</text>
    <rect x="1020" y="878" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="1042" y="888">数据资产域</text>
    <rect x="1140" y="878" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1162" y="888">平台服务域</text>
  </g>

  <!-- ========== caption ========== -->
  <text x="700" y="922" font-size="10" fill="#94A3B8" text-anchor="middle">图7-6  DriverTool 处理用户「启用 Modbus 驱动」指令的完整交互流程；写操作（configureDriver / toggleDriver）经用户确认后才提交到数据库，防止误中断采集。</text>
</svg>
