<svg xmlns="http://www.w3.org/2000/svg" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif" width="1800" height="900" viewBox="0 0 1800 900">
  <rect x="0" y="0" width="1800" height="900" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
  </defs>

  <!-- ===== 标题区 ===== -->
  <circle cx="64" cy="44" r="6" fill="#2563EB"/>
  <text x="84" y="50" font-size="22" font-weight="700" fill="#0F172A">图 7-8　DeviceTool 调用链路</text>
  <text x="84" y="74" font-size="12" fill="#64748B">从自然语言输入到设备数据返回的主链路与责任边界</text>

  <g>
    <rect x="1620" y="28" width="150" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1695" y="46" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">ARCHITECTURE</text>
  </g>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 区域边界框 ===== -->
  <!-- 业务应用域 -->
  <rect x="60" y="270" width="980" height="210" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="76" y="258" width="150" height="24" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="151" y="274" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">业务应用域</text>
  <text x="236" y="274" font-size="10" fill="#64748B">业务价值交付边界</text>

  <!-- 设备与边缘域 -->
  <rect x="1090" y="270" width="650" height="210" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="1106" y="258" width="150" height="24" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  <text x="1181" y="274" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">设备与边缘域</text>
  <text x="1266" y="274" font-size="10" fill="#64748B">现场异构资源边界</text>

  <!-- ===== 组件卡 ===== -->
  <!-- 卡1 用户提问（actor，application/蓝） -->
  <g>
    <rect x="90" y="330" width="240" height="140" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <!-- actor badge -->
    <circle cx="210" cy="365" r="9" fill="none" stroke="#2563EB" stroke-width="2"/>
    <path d="M 194 392 C 194 378, 226 378, 226 392" fill="none" stroke="#2563EB" stroke-width="2"/>
    <text x="210" y="420" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">用户提问</text>
    <text x="210" y="440" font-size="10" fill="#64748B" text-anchor="middle">自然语言输入</text>
    <text x="210" y="458" font-size="9" fill="#94A3B8" text-anchor="middle">应用层 · 触发调用</text>
  </g>

  <!-- 卡2 意图识别（ai/橙） -->
  <g>
    <rect x="430" y="330" width="240" height="140" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <rect x="546" y="346" width="30" height="18" rx="4" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="561" y="359" font-size="10" font-weight="700" fill="#F59E0B" text-anchor="middle">AI</text>
    <text x="550" y="408" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">意图识别</text>
    <text x="550" y="428" font-size="10" fill="#64748B" text-anchor="middle">LLM 语义理解</text>
    <text x="550" y="446" font-size="9" fill="#94A3B8" text-anchor="middle">解析用户诉求</text>
  </g>

  <!-- 卡3 工具选择（ai/橙） -->
  <g>
    <rect x="770" y="330" width="240" height="140" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <rect x="886" y="346" width="30" height="18" rx="4" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="901" y="359" font-size="10" font-weight="700" fill="#F59E0B" text-anchor="middle">AI</text>
    <text x="890" y="408" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">工具选择</text>
    <text x="890" y="428" font-size="10" fill="#64748B" text-anchor="middle">DeviceTool 匹配</text>
    <text x="890" y="446" font-size="9" fill="#94A3B8" text-anchor="middle">决策调用哪个工具</text>
  </g>

  <!-- 卡4 DeviceTool 调用（platform/蓝） -->
  <g>
    <rect x="1110" y="330" width="240" height="140" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="1226" y="346" width="30" height="18" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="1232" y="352" width="6" height="6" fill="none" stroke="#2563EB" stroke-width="1.2"/>
    <rect x="1244" y="352" width="6" height="6" fill="none" stroke="#2563EB" stroke-width="1.2"/>
    <text x="1230" y="408" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">DeviceTool</text>
    <text x="1230" y="428" font-size="10" fill="#64748B" text-anchor="middle">平台服务调用</text>
    <text x="1230" y="446" font-size="9" fill="#94A3B8" text-anchor="middle">主链路核心枢纽</text>
  </g>

  <!-- 卡5 设备数据（database 圆柱体，edge/绿） -->
  <g>
    <!-- 圆柱体 -->
    <path d="M 1490 360 L 1490 450 A 80 14 0 0 0 1650 450 L 1650 360" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <ellipse cx="1570" cy="360" rx="80" ry="14" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1570" y="402" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">设备数据</text>
    <text x="1570" y="422" font-size="10" fill="#64748B" text-anchor="middle">边缘数据查询</text>
    <text x="1570" y="440" font-size="9" fill="#94A3B8" text-anchor="middle">异构现场资源</text>
  </g>

  <!-- ===== 主链路箭头（蓝实线） ===== -->
  <line x1="332" y1="400" x2="426" y2="400" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="379" y="392" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">①意图解析</text>

  <line x1="672" y1="400" x2="766" y2="400" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
  <text x="719" y="392" font-size="10" font-weight="600" fill="#F59E0B" text-anchor="middle">②工具匹配</text>

  <line x1="1012" y1="400" x2="1106" y2="400" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1059" y="392" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">③服务调用</text>

  <line x1="1352" y1="400" x2="1486" y2="400" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="1419" y="392" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">④数据查询</text>

  <!-- ===== 数据回传路径（灰虚线） ===== -->
  <path d="M 1570 470 L 1570 545 L 210 545 L 210 472" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <rect x="800" y="533" width="180" height="22" rx="4" fill="#FFFFFF"/>
  <text x="890" y="548" font-size="10" fill="#64748B" text-anchor="middle">设备数据原路回传</text>

  <!-- ===== callout ===== -->
  <g>
    <rect x="400" y="600" width="1000" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="900" y="624" font-size="11" fill="#334155" text-anchor="middle">主链路：用户提问 → 意图识别 → 工具选择 → DeviceTool 调用 → 设备数据查询，全程单向蓝/橙高亮。</text>
    <text x="900" y="648" font-size="11" fill="#334155" text-anchor="middle">责任边界：业务应用域负责理解与决策（LLM 推理），设备与边缘域负责资源落地（数据查询）。</text>
  </g>

  <!-- ===== 图例（分隔线后） ===== -->
  <line x1="60" y1="700" x2="1740" y2="700" stroke="#E2E8F0" stroke-width="1"/>
  <text x="60" y="724" font-size="11" font-weight="600" fill="#475569">图例</text>

  <g>
    <rect x="120" y="714" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="144" y="724" font-size="11" fill="#475569">主链路 / 核心平台</text>
  </g>
  <g>
    <rect x="300" y="714" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="324" y="724" font-size="11" fill="#475569">AI 智能决策</text>
  </g>
  <g>
    <rect x="440" y="714" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="464" y="724" font-size="11" fill="#475569">边缘设备域</text>
  </g>
  <g>
    <line x1="570" y1="720" x2="600" y2="720" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="608" y="724" font-size="11" fill="#475569">数据回传 / 异步</text>
  </g>
  <g>
    <rect x="760" y="714" width="16" height="12" rx="2" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
    <text x="784" y="724" font-size="11" fill="#475569">责任域边界</text>
  </g>

  <!-- ===== caption ===== -->
  <text x="900" y="870" font-size="10" fill="#94A3B8" text-anchor="middle">图 7-8　DeviceTool 调用链路：意图识别 → 工具选择 → 服务调用 → 设备数据查询</text>
</svg>
