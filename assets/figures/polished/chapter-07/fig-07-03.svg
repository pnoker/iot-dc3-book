<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-label="图7-3 RAG + Tool-Calling 联合工作流" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
<marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
</defs>

<rect x="0" y="0" width="1800" height="1080" fill="#FFFFFF"/>

<!-- 标题区 -->
<circle cx="64" cy="40" r="6" fill="#2563EB"/>
<text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图7-3 RAG + Tool-Calling 联合工作流</text>
<text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">运维任务经 LLM 推理 → RAG 检索 SOP → Tool-Calling 执行的完整链路与职责分层</text>
<rect x="1620" y="28" width="110" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="1675" y="45" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">FLOW</text>
<line x1="58" y1="103" x2="1742" y2="103" stroke="#E2E8F0" stroke-width="1"/>

<!-- 泳道 1：用户层（蓝） -->
<rect x="70" y="120" width="1670" height="160" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1" opacity="0.5"/>
<rect x="84" y="138" width="112" height="124" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="140" y="188" fill="#2563EB" font-size="13" font-weight="700" text-anchor="middle">用户层</text>
<text x="140" y="212" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle">操作员</text>
<text x="140" y="230" fill="#64748B" font-size="9" text-anchor="middle">发起任务</text>

<!-- 泳道 2：AI 推理层（橙） -->
<rect x="70" y="290" width="1670" height="160" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>
<rect x="84" y="308" width="112" height="124" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
<text x="140" y="358" fill="#F59E0B" font-size="13" font-weight="700" text-anchor="middle">AI 推理层</text>
<text x="140" y="382" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle">ChatClient</text>
<text x="140" y="400" fill="#64748B" font-size="9" text-anchor="middle">LLM</text>

<!-- 泳道 3：知识检索层（紫） -->
<rect x="70" y="460" width="1670" height="160" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>
<rect x="84" y="478" width="112" height="124" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="140" y="528" fill="#7C3AED" font-size="13" font-weight="700" text-anchor="middle">知识检索层</text>
<text x="140" y="552" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle">RAG</text>
<text x="140" y="570" fill="#64748B" font-size="9" text-anchor="middle">向量库</text>

<!-- 泳道 4：设备执行层（绿） -->
<rect x="70" y="630" width="1670" height="160" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1" opacity="0.5"/>
<rect x="84" y="648" width="112" height="124" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
<text x="140" y="698" fill="#10B981" font-size="13" font-weight="700" text-anchor="middle">设备执行层</text>
<text x="140" y="722" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle">Tool 执行器</text>
<text x="140" y="740" fill="#64748B" font-size="9" text-anchor="middle">物理设备</text>

<!-- 组件卡片 -->
<rect x="300" y="170" width="190" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="395" y="200" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">操作员</text>
<text x="395" y="222" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">自然语言发起运维任务</text>

<rect x="300" y="340" width="190" height="70" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<text x="395" y="370" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">ChatClient</text>
<text x="395" y="392" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">统一对话入口 · 拼装工具</text>

<rect x="580" y="340" width="190" height="70" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<text x="675" y="370" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">LLM 推理</text>
<text x="675" y="392" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">意图理解 · 判断需检索</text>

<rect x="860" y="510" width="190" height="70" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="955" y="540" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">RAG 检索</text>
<text x="955" y="562" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">向量检索匹配 SOP</text>

<!-- SOP 文档库（圆柱体） -->
<path d="M 1090 510 a 95 14 0 1 0 190 0 a 95 14 0 1 0 -190 0" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<path d="M 1090 510 L 1090 580 a 95 14 0 0 0 190 0 L 1280 510" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<path d="M 1090 510 a 95 14 0 0 0 190 0" fill="none" stroke="#7C3AED" stroke-width="2"/>
<text x="1185" y="548" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">SOP 文档库</text>
<text x="1185" y="568" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">设备操作规程 · 历史工单</text>

<rect x="1100" y="340" width="190" height="70" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<text x="1195" y="370" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">LLM 规划</text>
<text x="1195" y="392" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">拆解步骤 · 生成工具调用</text>

<rect x="1380" y="680" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<text x="1480" y="710" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">Tool 执行器</text>
<text x="1480" y="732" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">DeviceTool · PointValueTool</text>

<rect x="1600" y="680" width="130" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<text x="1665" y="710" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">物理设备</text>
<text x="1665" y="732" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">PLC · 传感器</text>

<!-- 主链路箭头（蓝，编号序） -->
<line x1="395" y1="240" x2="395" y2="336" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="410" y="292" fill="#2563EB" font-size="10" font-weight="600">① 发起任务</text>

<line x1="490" y1="375" x2="576" y2="375" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="533" y="365" fill="#2563EB" font-size="10" font-weight="600" text-anchor="middle">② 意图理解</text>

<line x1="675" y1="410" x2="930" y2="506" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="770" y="470" fill="#2563EB" font-size="10" font-weight="600">③ 检索 SOP</text>

<line x1="1050" y1="545" x2="1086" y2="545" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="1068" y="535" fill="#2563EB" font-size="10" font-weight="600" text-anchor="middle">④</text>

<!-- 返回步骤（灰虚线，向上） -->
<line x1="1195" y1="504" x2="1195" y2="414" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
<text x="1210" y="465" fill="#64748B" font-size="10" font-weight="600">⑤ 返回操作步骤</text>

<!-- Tool-Calling 下发 -->
<line x1="1240" y1="410" x2="1450" y2="676" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="1380" y="560" fill="#2563EB" font-size="10" font-weight="600">⑥ Tool-Calling</text>

<line x1="1580" y1="715" x2="1596" y2="715" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="1588" y="705" fill="#2563EB" font-size="10" font-weight="600" text-anchor="middle">⑦</text>

<!-- 结果回传（灰虚线，沿右侧返回操作员） -->
<path d="M 1665 680 L 1665 130 L 395 130 L 395 166" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
<text x="1030" y="122" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle">⑧ 执行结果与数据洞察回传操作员</text>

<!-- 图例区 -->
<line x1="58" y1="820" x2="1742" y2="820" stroke="#E2E8F0" stroke-width="1"/>
<rect x="80" y="845" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="104" y="855" fill="#64748B" font-size="11" font-weight="600">用户层</text>
<rect x="180" y="845" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
<text x="204" y="855" fill="#64748B" font-size="11" font-weight="600">AI 推理层</text>
<rect x="300" y="845" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="324" y="855" fill="#64748B" font-size="11" font-weight="600">知识检索层</text>
<rect x="430" y="845" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
<text x="454" y="855" fill="#64748B" font-size="11" font-weight="600">设备执行层</text>
<line x1="580" y1="851" x2="616" y2="851" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="624" y="855" fill="#64748B" font-size="11" font-weight="600">主链路（请求/执行）</text>
<line x1="800" y1="851" x2="836" y2="851" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
<text x="844" y="855" fill="#64748B" font-size="11" font-weight="600">回传（检索/结果）</text>

<!-- callout -->
<rect x="70" y="885" width="1670" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="905" y="910" fill="#334155" font-size="11" font-weight="500" text-anchor="middle">职责分层：LLM 只负责理解与规划，不直接碰设备；设备操作必须经 Tool-Calling 执行器走平台 API，权限与审计由平台兜底。</text>
<text x="905" y="930" fill="#64748B" font-size="10" text-anchor="middle">RAG 把"怎么做"的知识注入上下文，Tool-Calling 把"去做"的动作落到设备——二者衔接才构成可交付的运维闭环。</text>

<!-- caption -->
<text x="900" y="1015" fill="#94A3B8" font-size="10" text-anchor="middle">图7-3 运维任务从操作员发起，经 LLM 意图理解后由 RAG 检索 SOP 取回操作步骤，再由 Tool-Calling 驱动设备执行并回传结果；四层泳道清晰划分用户、推理、知识与执行的职责边界。</text>
</svg>
