<!-- caption -->
<text x="900" y="850" fill="#94A3B8" font-size="10" text-anchor="middle">图7-1 AIoT 从连接到自主决策的演进：设备上网汇聚数据 → LLM 理解语义并工具调用 → Agent 自主监测与闭环执行；算力下沉、大模型突破、边缘智能普及共同驱动跃迁。</text>
