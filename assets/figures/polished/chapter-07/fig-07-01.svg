<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图7-1 AIoT 演进阶段示意</title>
  <desc id="desc">AIoT 不是一蹴而就的技术堆叠，而是逐步将智能注入数据管道的系统工程。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图7-1 AIoT 演进阶段示意</text>
  <text x="82" y="70" fill="#64748B" font-size="12">AIoT 不是一蹴而就的技术堆叠，而是逐步将智能注入数据管道的系统工程。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">TIMELINE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="timeline">
  <!-- 时间轴水平线（从左向右演进） -->
  <line x1="120" y1="530" x2="1665" y2="530" stroke="#64748B" stroke-width="2" />
  <polygon points="1665,525 1680,530 1665,535" fill="#64748B" />

  <!-- 阶段竖线 -->
  <line x1="360" y1="510" x2="360" y2="530" stroke="#64748B" stroke-width="1.5" />
  <line x1="880" y1="510" x2="880" y2="530" stroke="#64748B" stroke-width="1.5" />
  <line x1="1400" y1="510" x2="1400" y2="530" stroke="#64748B" stroke-width="1.5" />
  <line x1="360" y1="340" x2="360" y2="510" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="880" y1="340" x2="880" y2="510" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="1400" y1="340" x2="1400" y2="510" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- 第一阶段区域 -->
  <rect x="120" y="170" width="480" height="350" rx="10" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6,3" />
  <text x="130" y="195" fill="#64748B" font-size="14" font-weight="600">连接采集（示意：约2010—2020）</text>

  <!-- 第二阶段区域 -->
  <rect x="640" y="170" width="480" height="350" rx="10" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6,3" />
  <text x="650" y="195" fill="#64748B" font-size="14" font-weight="600">智能分析（示意：约2020—2025）</text>

  <!-- 第三阶段区域 -->
  <rect x="1160" y="170" width="480" height="350" rx="10" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6,3" />
  <text x="1170" y="195" fill="#64748B" font-size="14" font-weight="600">自主决策（当前正在成形）</text>

  <!-- 特征卡片 c1 -->
  <rect x="130" y="220" width="460" height="120" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
  <text x="360" y="255" fill="#0F172A" font-size="18" font-weight="700" text-anchor="middle">连接采集</text>
  <text x="360" y="280" fill="#475569" font-size="12" text-anchor="middle">规则引擎、阈值告警</text>
  <text x="360" y="300" fill="#475569" font-size="12" text-anchor="middle">人看仪表盘</text>

  <!-- 特征卡片 c2 -->
  <rect x="650" y="220" width="460" height="120" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
  <text x="880" y="255" fill="#0F172A" font-size="18" font-weight="700" text-anchor="middle">智能分析</text>
  <text x="880" y="280" fill="#475569" font-size="12" text-anchor="middle">LLM+Tool-Calling</text>
  <text x="880" y="300" fill="#475569" font-size="12" text-anchor="middle">自然语言操作、人机协作</text>

  <!-- 特征卡片 c3 -->
  <rect x="1170" y="220" width="460" height="120" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
  <text x="1400" y="255" fill="#0F172A" font-size="18" font-weight="700" text-anchor="middle">自主决策</text>
  <text x="1400" y="280" fill="#475569" font-size="12" text-anchor="middle">Agent主动监测、多模型路由</text>
  <text x="1400" y="300" fill="#475569" font-size="12" text-anchor="middle">闭环执行</text>

  <!-- 驱动力卡片 driver1 -->
  <rect x="140" y="560" width="440" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
  <text x="360" y="585" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">算力下沉</text>
  <text x="360" y="605" fill="#64748B" font-size="11" text-anchor="middle">边缘GPU/NPU</text>

  <!-- 驱动力卡片 driver2 -->
  <rect x="670" y="560" width="440" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
  <text x="890" y="585" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">大模型突破</text>
  <text x="890" y="605" fill="#64748B" font-size="11" text-anchor="middle">LLM工具调用能力</text>

  <!-- 驱动力卡片 driver3 -->
  <rect x="1200" y="560" width="440" height="60" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
  <text x="1420" y="585" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">边缘智能普及</text>
  <text x="1420" y="605" fill="#64748B" font-size="11" text-anchor="middle">端侧推理落地</text>

  <!-- 驱动力接入各自阶段 -->
  <line x1="360" y1="560" x2="360" y2="530" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="890" y1="560" x2="890" y2="530" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="1400" y1="560" x2="1400" y2="530" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3" />
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">时间轴用实线两端箭头</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图7-1 AIoT 从连接到自主决策的演进示意。第一阶段设备上网，数据汇聚，人看仪表盘做判断；第二阶段 LLM 理解语义，通过工具调用查设备、写位号、下命令，人机协作；第三阶段 Agent 自主监测、诊断、规划、执行，人类从操作员变为监督员。驱动因素包括算力下沉、大模型突破和边</text>
  <text x="900" y="870" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">缘智能普及。</text>
</svg>
