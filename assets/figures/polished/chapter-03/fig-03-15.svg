<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect x="0" y="0" width="1600" height="1010" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- 标题区 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">物模型与设备实例的关系：属性、动作、事件的交互模式</text>
  <text x="84" y="70" font-size="12" fill="#64748B">物模型作为模板被实例化，设备经三类标准接口与平台应用通信</text>
  <rect x="1430" y="24" width="130" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1495" y="44" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="1">ARCHITECTURE</text>
  <line x1="60" y1="103" x2="1540" y2="103" stroke="#E2E8F0"/>

  <!-- ============ 区域边界 ============ -->
  <!-- 智能决策域 -->
  <rect x="560" y="120" width="480" height="148" rx="12" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="574" y="140" font-size="11" font-weight="600" fill="#F59E0B">智能决策域 · 模板边界</text>

  <!-- 设备与边缘域 -->
  <rect x="300" y="325" width="1000" height="168" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="314" y="345" font-size="11" font-weight="600" fill="#10B981">设备与边缘域 · 现场异构资源边界</text>

  <!-- 平台应用域 -->
  <rect x="90" y="640" width="1420" height="158" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="104" y="660" font-size="11" font-weight="600" fill="#2563EB">平台应用域 · 核心服务能力边界</text>

  <!-- ============ 第1层：物模型模板 ============ -->
  <rect x="610" y="150" width="380" height="98" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="800" y="176" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Model-T-100 物模型</text>
  <!-- 三类接口模板 chips -->
  <rect x="635" y="192" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="685" y="207" font-size="11" fill="#10B981" text-anchor="middle">属性</text>
  <rect x="750" y="192" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="800" y="207" font-size="11" fill="#2563EB" text-anchor="middle">动作</text>
  <rect x="865" y="192" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
  <text x="915" y="207" font-size="11" fill="#E11D48" text-anchor="middle">事件</text>
  <text x="800" y="234" font-size="9" fill="#64748B" text-anchor="middle">统一数据格式与协议模板</text>

  <!-- ============ 第2层：设备实例 ============ -->
  <!-- 设备A -->
  <rect x="340" y="365" width="280" height="105" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="480" y="395" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">设备 A</text>
  <text x="480" y="416" font-size="10" fill="#64748B" text-anchor="middle">实例化自 Model-T-100</text>
  <line x1="370" y1="430" x2="590" y2="430" stroke="#E2E8F0"/>
  <text x="480" y="450" font-size="9" fill="#94A3B8" text-anchor="middle">实例 #01 · 在线</text>

  <!-- 设备B -->
  <rect x="980" y="365" width="280" height="105" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1120" y="395" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">设备 B</text>
  <text x="1120" y="416" font-size="10" fill="#64748B" text-anchor="middle">实例化自 Model-T-100</text>
  <line x1="1010" y1="430" x2="1230" y2="430" stroke="#E2E8F0"/>
  <text x="1120" y="450" font-size="9" fill="#94A3B8" text-anchor="middle">实例 #02 · 在线</text>

  <!-- ============ 第3层：平台应用 ============ -->
  <!-- 数据存储（圆柱体） -->
  <ellipse cx="280" cy="678" rx="120" ry="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <path d="M160,678 V758" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <path d="M400,678 V758" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <ellipse cx="280" cy="758" rx="120" ry="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <ellipse cx="280" cy="678" rx="120" ry="12" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="280" y="715" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">数据存储</text>
  <text x="280" y="735" font-size="10" fill="#64748B" text-anchor="middle">属性值时序落盘</text>

  <!-- 远程控制 -->
  <rect x="660" y="675" width="280" height="92" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="800" y="705" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">远程控制</text>
  <text x="800" y="726" font-size="10" fill="#64748B" text-anchor="middle">动作指令下发</text>
  <text x="800" y="748" font-size="9" fill="#94A3B8" text-anchor="middle">同步调用 / 应答</text>

  <!-- 告警服务 -->
  <rect x="1180" y="675" width="280" height="92" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="1320" y="705" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">告警服务</text>
  <text x="1320" y="726" font-size="10" fill="#64748B" text-anchor="middle">事件订阅 / 阈值告警</text>
  <text x="1320" y="748" font-size="9" fill="#94A3B8" text-anchor="middle">异步推送</text>

  <!-- ============ 连线：复用（模板→设备，灰虚线） ============ -->
  <path d="M680,248 V300 H480 V365" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="560" y="294" font-size="10" fill="#64748B" text-anchor="middle">复用</text>
  <path d="M920,248 V300 H1120 V365" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="1040" y="294" font-size="10" fill="#64748B" text-anchor="middle">复用</text>

  <!-- ============ 连线：属性上报（设备→数据存储，绿实线） ============ -->
  <path d="M400,470 V540 H280 V666" fill="none" stroke="#10B981" stroke-width="1.8" marker-end="url(#ah-green)"/>
  <text x="300" y="534" font-size="10" fill="#10B981">上报属性值</text>
  <path d="M1000,470 V580 H360 V666" fill="none" stroke="#10B981" stroke-width="1.8" marker-end="url(#ah-green)"/>

  <!-- ============ 连线：动作下发（远程控制→设备，蓝实线） ============ -->
  <path d="M720,675 V600 H500 V470" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <path d="M880,675 V600 H1100 V470" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <text x="800" y="594" font-size="10" fill="#2563EB" text-anchor="middle">下发动作</text>

  <!-- ============ 连线：事件推送（设备→告警服务，红虚线） ============ -->
  <path d="M580,470 V520 H1260 V675" fill="none" stroke="#E11D48" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-red)"/>
  <text x="900" y="514" font-size="10" fill="#E11D48">推送事件</text>
  <path d="M1180,470 V560 H1380 V675" fill="none" stroke="#E11D48" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-red)"/>

  <!-- ============ 图例 ============ -->
  <line x1="60" y1="830" x2="1540" y2="830" stroke="#E2E8F0"/>
  <text x="60" y="852" font-size="11" font-weight="600" fill="#475569">图例</text>

  <line x1="120" y1="880" x2="160" y2="880" stroke="#64748B" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="168" y="884" font-size="11" fill="#475569">模板复用关系</text>

  <line x1="400" y1="880" x2="440" y2="880" stroke="#10B981" stroke-width="1.8"/>
  <text x="448" y="884" font-size="11" fill="#475569">属性上报（设备→平台）</text>

  <line x1="760" y1="880" x2="800" y2="880" stroke="#2563EB" stroke-width="1.8"/>
  <text x="808" y="884" font-size="11" fill="#475569">动作下发（平台→设备）</text>

  <line x1="1120" y1="880" x2="1160" y2="880" stroke="#E11D48" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="1168" y="884" font-size="11" fill="#475569">事件推送（异步）</text>

  <!-- 域色说明 -->
  <rect x="120" y="908" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="144" y="918" font-size="11" fill="#475569">数据资产</text>
  <rect x="400" y="908" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="424" y="918" font-size="11" fill="#475569">平台服务</text>
  <rect x="760" y="908" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
  <text x="784" y="918" font-size="11" fill="#475569">安全/告警</text>
  <rect x="1120" y="908" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="1144" y="918" font-size="11" fill="#475569">设备/边缘</text>

  <!-- ============ caption ============ -->
  <text x="800" y="985" font-size="10" fill="#94A3B8" text-anchor="middle">图3-24　物模型作为模板被多个设备实例复用，设备通过属性、动作、事件三类标准接口与平台应用通信——平台无需关心设备内部差异，</text>
  <text x="800" y="1000" font-size="10" fill="#94A3B8" text-anchor="middle">只需按物模型定义的数据格式与协议进行交互。</text>
</svg>
