<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图3-5 边缘节点数据预处理与过滤流程</title>
  <desc id="desc">读者应理解边缘节点数据预处理与过滤流程中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图3-5 边缘节点数据预处理与过滤流程</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解边缘节点数据预处理与过滤流程中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">FLOWCHART</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="flowchart">  <rect x="710" y="130" width="180" height="55" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>  <text x="800" y="152" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">原始传感器数据</text>  <text x="800" y="168" fill="#475569" font-size="11" text-anchor="middle">（时间序列）</text>  <rect x="710" y="205" width="180" height="55" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>  <text x="800" y="227" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">滑动平均滤波</text>  <text x="800" y="243" fill="#475569" font-size="11" text-anchor="middle">窗口长度N=5</text>  <rect x="710" y="280" width="180" height="55" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>  <text x="800" y="302" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">干净数值序列</text>  <text x="800" y="318" fill="#475569" font-size="11" text-anchor="middle"></text>  <rect x="710" y="355" width="180" height="55" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>  <text x="800" y="377" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">数据聚合</text>  <text x="800" y="393" fill="#475569" font-size="11" text-anchor="middle"></text>  <rect x="710" y="430" width="180" height="55" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>  <text x="800" y="452" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">压缩后的状态值</text>  <text x="800" y="468" fill="#475569" font-size="11" text-anchor="middle"></text>  <rect x="710" y="505" width="180" height="55" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>  <text x="800" y="527" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">异常判定</text>  <text x="800" y="543" fill="#475569" font-size="11" text-anchor="middle">判定条件：阈值</text>  <rect x="530" y="580" width="180" height="55" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>  <text x="620" y="602" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">正常数据</text>  <text x="620" y="618" fill="#475569" font-size="11" text-anchor="middle"></text>  <rect x="890" y="580" width="180" height="55" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>  <text x="980" y="602" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">异常事件</text>  <text x="980" y="618" fill="#475569" font-size="11" text-anchor="middle"></text>  <rect x="690" y="655" width="220" height="55" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>  <text x="800" y="677" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">云平台数据流/告警流</text>  <text x="800" y="693" fill="#475569" font-size="11" text-anchor="middle"></text>  <line x1="800" y1="185" x2="800" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>  <line x1="800" y1="260" x2="800" y2="280" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>  <line x1="800" y1="335" x2="800" y2="355" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>  <line x1="800" y1="410" x2="800" y2="430" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>  <line x1="800" y1="485" x2="800" y2="505" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>  <path d="M 800 560 L 800 570 L 620 570 L 620 580" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>  <path d="M 800 560 L 800 570 L 980 570 L 980 580" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#bp-arrow)"/>  <path d="M 620 635 L 620 645 L 770 645 L 770 655" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>  <path d="M 980 635 L 980 645 L 830 645 L 830 655" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#bp-arrow)"/>  <rect x="680" y="560" width="60" height="20" rx="3" fill="white" fill-opacity="0.9"/>  <text x="710" y="574" fill="#0F172A" font-size="12" text-anchor="middle">否（正常）</text>  <rect x="890" y="560" width="60" height="20" rx="3" fill="white" fill-opacity="0.9"/>  <text x="920" y="574" fill="#0F172A" font-size="12" text-anchor="middle">是（异常）</text>  <rect x="875" y="640" width="80" height="20" rx="3" fill="white" fill-opacity="0.9"/>  <text x="915" y="654" fill="#0F172A" font-size="12" text-anchor="middle">带事件编号</text></g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色=核心平台/主链路</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图3-5 边缘节点数据预处理与过滤流程。原始数据先经过滑动平均滤波去除噪声，再聚合为特征值，最后进行异常判定。正常数据按固定周期推送云平台；异常数据触发本地动作并打标上传。</text>
</svg>
