<svg xmlns="http://www.w3.org/2000/svg" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif" width="1600" height="1020" viewBox="0 0 1600 1020">
  <rect x="0" y="0" width="1600" height="1020" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
  </defs>

  <!-- ===== 标题区 ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" font-size="22" font-weight="700" fill="#0F172A">物模型驱动平台无关的应用开发（假设场景）</text>
  <text x="82" y="70" font-size="12" fill="#64748B">Thing Model as the adaptation layer — heterogeneous devices → unified model → applications</text>
  <rect x="1440" y="26" width="120" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1500" y="45" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">FLOWCHART</text>
  <line x1="40" y1="103" x2="1560" y2="103" stroke="#E2E8F0"/>

  <!-- ===== 层级分隔线 ===== -->
  <line x1="40" y1="275" x2="1560" y2="275" stroke="#E2E8F0" stroke-dasharray="4 4"/>
  <line x1="40" y1="415" x2="1560" y2="415" stroke="#E2E8F0" stroke-dasharray="4 4"/>
  <line x1="40" y1="640" x2="1560" y2="640" stroke="#E2E8F0" stroke-dasharray="4 4"/>

  <!-- ===== 层级标签 ===== -->
  <circle cx="56" cy="198" r="4" fill="#2563EB"/>
  <text x="70" y="202" font-size="12" font-weight="700" fill="#475569">应用层</text>
  <text x="70" y="218" font-size="9" fill="#94A3B8">Application</text>

  <circle cx="56" cy="358" r="4" fill="#2563EB"/>
  <text x="70" y="362" font-size="12" font-weight="700" fill="#475569">统一物模型层</text>
  <text x="70" y="378" font-size="9" fill="#94A3B8">Unified Thing Model</text>

  <circle cx="56" cy="533" r="4" fill="#2563EB"/>
  <text x="70" y="537" font-size="12" font-weight="700" fill="#475569">物模型适配层</text>
  <text x="70" y="553" font-size="9" fill="#94A3B8">Adaptation</text>

  <circle cx="56" cy="715" r="4" fill="#10B981"/>
  <text x="70" y="719" font-size="12" font-weight="700" fill="#475569">物理设备层</text>
  <text x="70" y="735" font-size="9" fill="#94A3B8">Physical Devices</text>

  <!-- ===== 平台服务域边界 ===== -->
  <rect x="315" y="298" width="1115" height="318" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="322" y="288" width="120" height="20" rx="4" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="382" y="302" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">平台服务域</text>

  <!-- ===== 应用层卡片 ===== -->
  <!-- app-report (col1, data) -->
  <rect x="335" y="160" width="190" height="70" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="430" y="188" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">app-report</text>
  <text x="430" y="206" font-size="10" fill="#475569" text-anchor="middle">历史数据聚合</text>
  <text x="430" y="220" font-size="9" fill="#94A3B8" text-anchor="middle">data</text>

  <!-- app-dashboard (col2, user/platform) -->
  <rect x="635" y="160" width="190" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="730" y="188" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">app-dashboard</text>
  <text x="730" y="206" font-size="10" fill="#475569" text-anchor="middle">实时位号面板</text>
  <text x="730" y="220" font-size="9" fill="#94A3B8" text-anchor="middle">application</text>

  <!-- app-alarm (col3, risk) -->
  <rect x="935" y="160" width="190" height="70" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="1030" y="188" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">app-alarm</text>
  <text x="1030" y="206" font-size="10" fill="#475569" text-anchor="middle">告警规则引擎</text>
  <text x="1030" y="220" font-size="9" fill="#94A3B8" text-anchor="middle">risk</text>

  <!-- ===== 统一物模型层卡片 ===== -->
  <!-- property-set (col1) -->
  <rect x="335" y="320" width="190" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="430" y="348" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">property-set</text>
  <text x="430" y="366" font-size="10" fill="#475569" text-anchor="middle">位号能力集</text>
  <text x="430" y="380" font-size="9" fill="#94A3B8" text-anchor="middle">设备能力集合</text>

  <!-- cmd-set (col2) -->
  <rect x="635" y="320" width="190" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="730" y="348" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">cmd-set</text>
  <text x="730" y="366" font-size="10" fill="#475569" text-anchor="middle">指令能力集</text>
  <text x="730" y="380" font-size="9" fill="#94A3B8" text-anchor="middle">设备能力集合</text>

  <!-- event-set (col3) -->
  <rect x="935" y="320" width="190" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1030" y="348" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">event-set</text>
  <text x="1030" y="366" font-size="10" fill="#475569" text-anchor="middle">事件能力集</text>
  <text x="1030" y="380" font-size="9" fill="#94A3B8" text-anchor="middle">设备能力集合</text>

  <!-- ===== 物模型适配层 ===== -->
  <!-- adapter-module 大卡 -->
  <rect x="370" y="470" width="720" height="120" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="390" y="495" font-size="15" font-weight="700" fill="#0F172A">adapter-module</text>
  <text x="390" y="512" font-size="10" fill="#475569">协议转换 · 语义映射 · 指令编码</text>
  <!-- 内部三协议子芯片 -->
  <rect x="400" y="528" width="200" height="44" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="1"/>
  <text x="500" y="548" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">原始报文解析</text>
  <text x="500" y="563" font-size="9" fill="#64748B" text-anchor="middle">raw payload</text>

  <rect x="630" y="528" width="200" height="44" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="1"/>
  <text x="730" y="548" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">KNX 帧解析</text>
  <text x="730" y="563" font-size="9" fill="#64748B" text-anchor="middle">knx frame</text>

  <rect x="860" y="528" width="200" height="44" rx="5" fill="#F8FAFC" stroke="#2563EB" stroke-width="1"/>
  <text x="960" y="548" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">DL/T645 解析</text>
  <text x="960" y="563" font-size="9" fill="#64748B" text-anchor="middle">dlt645 frame</text>

  <!-- device-shadow 影子（紫色虚线 + 内存缓冲意象） -->
  <rect x="1180" y="470" width="220" height="120" rx="8" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="1290" y="498" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">device-shadow</text>
  <text x="1290" y="516" font-size="10" fill="#475569" text-anchor="middle">设备影子</text>
  <text x="1290" y="534" font-size="9" fill="#94A3B8" text-anchor="middle">内存态缓冲 · 状态缓存</text>
  <text x="1290" y="552" font-size="9" fill="#94A3B8" text-anchor="middle">offline buffer</text>
  <text x="1290" y="574" font-size="9" font-style="italic" fill="#7C3AED" text-anchor="middle">运行于内存</text>

  <!-- ===== 物理设备层 ===== -->
  <!-- device-a (primary, 主链路起点) -->
  <rect x="340" y="680" width="180" height="64" rx="32" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
  <text x="430" y="708" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">device-a</text>
  <text x="430" y="726" font-size="10" fill="#475569" text-anchor="middle">原始报文设备</text>
  <circle cx="362" cy="694" r="3" fill="#10B981"/>

  <!-- device-b -->
  <rect x="640" y="680" width="180" height="64" rx="32" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="730" y="708" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">device-b</text>
  <text x="730" y="726" font-size="10" fill="#475569" text-anchor="middle">KNX 设备</text>

  <!-- device-c -->
  <rect x="940" y="680" width="180" height="64" rx="32" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1030" y="708" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">device-c</text>
  <text x="1030" y="726" font-size="10" fill="#475569" text-anchor="middle">DL/T645 电表</text>

  <!-- ======================================================== -->
  <!-- =====================  连线  =========================== -->
  <!-- ======================================================== -->

  <!-- 主链路高亮: device-a → adapter-module -->
  <line x1="430" y1="680" x2="490" y2="590" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <rect x="436" y="624" width="68" height="16" rx="3" fill="#FFFFFF"/>
  <text x="470" y="636" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">原始报文</text>

  <!-- device-b → adapter -->
  <line x1="730" y1="680" x2="730" y2="590" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <rect x="740" y="624" width="56" height="16" rx="3" fill="#FFFFFF"/>
  <text x="768" y="636" font-size="10" fill="#475569" text-anchor="middle">KNX 帧</text>

  <!-- device-c → adapter -->
  <line x1="1030" y1="680" x2="970" y2="590" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <rect x="978" y="624" width="64" height="16" rx="3" fill="#FFFFFF"/>
  <text x="1010" y="636" font-size="10" fill="#475569" text-anchor="middle">DL/T645</text>

  <!-- adapter ↔ device-shadow (缓存上行 / 同步回写) -->
  <line x1="1090" y1="510" x2="1180" y2="510" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1135" y="502" font-size="9" fill="#475569" text-anchor="middle">离线缓存</text>
  <line x1="1180" y1="556" x2="1090" y2="556" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1135" y="572" font-size="9" fill="#475569" text-anchor="middle">影子同步</text>

  <!-- adapter → property-set (语义化数据, 主上行) -->
  <line x1="490" y1="470" x2="430" y2="390" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="406" y="422" width="76" height="16" rx="3" fill="#FFFFFF"/>
  <text x="444" y="434" font-size="10" fill="#2563EB" text-anchor="middle">语义化数据</text>

  <!-- adapter → cmd-set (指令映射) -->
  <line x1="730" y1="470" x2="730" y2="390" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <rect x="742" y="422" width="56" height="16" rx="3" fill="#FFFFFF"/>
  <text x="770" y="434" font-size="10" fill="#475569" text-anchor="middle">指令映射</text>

  <!-- adapter → event-set (事件映射, 异步) -->
  <line x1="970" y1="470" x2="1030" y2="390" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <rect x="978" y="422" width="56" height="16" rx="3" fill="#FFFFFF"/>
  <text x="1006" y="434" font-size="10" fill="#475569" text-anchor="middle">事件映射</text>

  <!-- property-set → app-report (历史数据聚合, 直上) -->
  <line x1="410" y1="320" x2="410" y2="230" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <rect x="318" y="266" width="76" height="16" rx="3" fill="#FFFFFF"/>
  <text x="356" y="278" font-size="10" fill="#475569" text-anchor="middle">历史聚合</text>

  <!-- property-set → app-dashboard (读取位号值, 主读) -->
  <line x1="510" y1="320" x2="660" y2="230" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="528" y="266" width="76" height="16" rx="3" fill="#FFFFFF"/>
  <text x="566" y="278" font-size="10" fill="#2563EB" text-anchor="middle">读取位号值</text>

  <!-- event-set → app-alarm (触发告警规则, 高危) -->
  <line x1="1050" y1="320" x2="1050" y2="230" stroke="#E11D48" stroke-width="2" marker-end="url(#ah-red)"/>
  <rect x="1060" y="266" width="84" height="16" rx="3" fill="#FFFFFF"/>
  <text x="1102" y="278" font-size="10" font-weight="700" fill="#E11D48" text-anchor="middle">触发告警规则</text>

  <!-- app-dashboard → cmd-set (下发指令, 控制下行) -->
  <line x1="760" y1="230" x2="760" y2="320" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#ah-orange)"/>
  <rect x="770" y="266" width="56" height="16" rx="3" fill="#FFFFFF"/>
  <text x="798" y="278" font-size="10" fill="#475569" text-anchor="middle">下发指令</text>

  <!-- ===== 图例 ===== -->
  <line x1="40" y1="820" x2="1560" y2="820" stroke="#E2E8F0"/>
  <text x="60" y="846" font-size="12" font-weight="700" fill="#475569">图例</text>

  <!-- 图例项 -->
  <rect x="120" y="836" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="144" y="846" font-size="11" fill="#475569">软件模块 / 平台服务</text>

  <rect x="300" y="836" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="324" y="846" font-size="11" fill="#475569">物理设备 / 边缘接入</text>

  <rect x="480" y="836" width="16" height="12" rx="2" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="504" y="846" font-size="11" fill="#475569">设备影子 / 内存缓冲</text>

  <rect x="660" y="836" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="684" y="846" font-size="11" fill="#475569">告警 / 高危事件</text>

  <line x1="830" y1="842" x2="860" y2="842" stroke="#2563EB" stroke-width="2.5"/>
  <text x="868" y="846" font-size="11" fill="#475569">主链路（语义化数据上行）</text>

  <line x1="1060" y1="842" x2="1090" y2="842" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1098" y="846" font-size="11" fill="#475569">异步同步 / 影子缓存</text>

  <line x1="1300" y1="842" x2="1330" y2="842" stroke="#F59E0B" stroke-width="1.8"/>
  <text x="1338" y="846" font-size="11" fill="#475569">控制下行 / 指令下发</text>

  <!-- ===== callout ===== -->
  <rect x="40" y="876" width="1520" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="60" y="898" font-size="11" fill="#334155" font-weight="700">核心结论：</text>
  <text x="60" y="916" font-size="11" fill="#334155">物模型作为中间适配层，屏蔽底层协议差异（原始报文 / KNX / DL/T645）与厂商私有格式；设备影子在适配层与应用层之间建立缓冲，把同步问题转化为异步状态管理。应用开发人员只在统一物模型层面编程，不接触任何协议的十六进制细节。</text>

  <!-- ===== caption ===== -->
  <text x="800" y="968" font-size="10" fill="#94A3B8" text-anchor="middle">图 3-16　物模型驱动平台无关的应用开发（假设场景）：异构设备 → adapter-module 统一适配 → property/cmd/event 能力集 → 应用层</text>
  <text x="800" y="985" font-size="9" fill="#94A3B8" text-anchor="middle">fig-03-16 · chapter 03 · architecture-diagram-wireframe-white</text>
</svg>
