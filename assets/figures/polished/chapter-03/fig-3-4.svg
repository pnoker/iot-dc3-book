<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图3-4 感知层技术演进里程碑</title>
  <desc id="desc">读者应理解感知层技术演进里程碑中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图3-4 感知层技术演进里程碑</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解感知层技术演进里程碑中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">TIMELINE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="timeline">
  <rect x="420" y="300" width="240" height="140" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="540" y="325" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">M1: 传统传感器节点</text>
  <text x="540" y="348" fill="#0F172A" font-size="13" text-anchor="middle">
    <tspan x="540" dy="0">固定采样率、固定阈值</tspan>
  </text>
  <text x="540" y="366" fill="#0F172A" font-size="13" text-anchor="middle">纯MCU转发</text>
  <text x="540" y="420" fill="#64748B" font-size="11" text-anchor="middle">硬件示例：8位MCU</text>
  
  <rect x="720" y="300" width="240" height="140" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="840" y="325" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">M2: 智能边缘节点</text>
  <text x="840" y="348" fill="#0F172A" font-size="13" text-anchor="middle">
    <tspan x="840" dy="0">边缘侧滤波/聚合/异常初筛</tspan>
  </text>
  <text x="840" y="366" fill="#0F172A" font-size="13" text-anchor="middle">本地规则执行，以太网/Wi-Fi上行</text>
  <text x="840" y="420" fill="#64748B" font-size="11" text-anchor="middle">硬件示例：ARM Cortex-A系列</text>
  
  <rect x="1020" y="300" width="240" height="140" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1140" y="325" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">M3: 端侧AI感知节点</text>
  <text x="1140" y="348" fill="#0F172A" font-size="13" text-anchor="middle">
    <tspan x="1140" dy="0">TinyML模型推理</tspan>
  </text>
  <text x="1140" y="366" fill="#0F172A" font-size="13" text-anchor="middle">自适应采样，事件驱动通信</text>
  <text x="1140" y="420" fill="#64748B" font-size="11" text-anchor="middle">硬件示例：ARM Cortex-M（FPU/DSP）</text>
  
  <!-- 连线 M1 -> M2 -->
  <line x1="660" y1="370" x2="720" y2="370" stroke="#2563EB" stroke-width="2"/>
  <rect x="665" y="375" width="110" height="18" fill="white" rx="3" opacity="0.9"/>
  <text x="720" y="388" fill="#64748B" font-size="11" text-anchor="middle">演进：增加本地计算能力</text>
  
  <!-- 连线 M2 -> M3 -->
  <line x1="960" y1="370" x2="1020" y2="370" stroke="#2563EB" stroke-width="2"/>
  <rect x="965" y="375" width="110" height="18" fill="white" rx="3" opacity="0.9"/>
  <text x="1020" y="388" fill="#64748B" font-size="11" text-anchor="middle">演进：端侧AI与自适应采样</text>
  
  <!-- 底部决策点虚线 -->
  <line x1="420" y1="470" x2="1260" y2="470" stroke="#94A3B8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="840" y="485" fill="#64748B" font-size="11" text-anchor="middle">工程选型决策点：根据时延容限与功耗预算权衡</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">M1：传统传感器节点，做数据采集与转发</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">M2：智能边缘节点，在边缘侧增加本地数据处理能力</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">M3：端侧AI感知节点，将AI推理与自适应采样嵌入传感器节点</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图3-4展示感知层从‘只采不判’到‘边采边判’的三阶段演进。M1阶段仅做数据采集与转发；M2阶段在边缘侧增加本地数据处理能力；M3阶段将AI推理与自适应采样能力嵌入传感器节点。底部可见关键的工程选型决策点：根据时延容限与功耗预算，在M2与M3之间进行权衡选择。</text>
</svg>
