<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" width="1800" height="1100" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><polygon points="0 0,10 4,0 8" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><polygon points="0 0,10 4,0 8" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><polygon points="0 0,10 4,0 8" fill="#10B981"/></marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><polygon points="0 0,10 4,0 8" fill="#D97706"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1100" fill="#FFFFFF"/>

  <!-- ============ TITLE AREA ============ -->
  <circle cx="64" cy="42" r="6" fill="#2563EB"/>
  <text x="84" y="42" font-size="22" font-weight="700" fill="#0F172A" dominant-baseline="central">图11-1 V2X通信架构</text>
  <text x="84" y="70" font-size="12" fill="#64748B" dominant-baseline="central">车-路-人-云 四向辐射 · PC5 直连毫秒级安全消息 · Uu 蜂窝承载宽带服务</text>

  <!-- type label -->
  <rect x="1656" y="24" width="120" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1716" y="38" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" dominant-baseline="central" letter-spacing="1">ARCHITECTURE</text>

  <!-- separator -->
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ============ OUTER SYSTEM BOUNDARY ============ -->
  <rect x="60" y="118" width="1680" height="790" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="80" y="138" font-size="11" font-weight="600" fill="#94A3B8" dominant-baseline="central">车-路-云 协同闭环 · V2X</text>

  <!-- ============ LINKS (drawn before cards so cards overlay endpoints cleanly) ============ -->
  <!-- PC5 · V2V  (他车 <-> 本车) -->
  <line x1="383" y1="520" x2="782" y2="520" stroke="#2563EB" stroke-width="2.5" marker-start="url(#ah-blue)" marker-end="url(#ah-blue)"/>
  <!-- PC5 · V2I  (本车 <-> RSU) -->
  <line x1="1018" y1="520" x2="1417" y2="520" stroke="#2563EB" stroke-width="2.5" marker-start="url(#ah-blue)" marker-end="url(#ah-blue)"/>
  <!-- PC5 · V2P  (本车 <-> 行人) -->
  <line x1="900" y1="588" x2="900" y2="767" stroke="#2563EB" stroke-width="2.5" marker-start="url(#ah-blue)" marker-end="url(#ah-blue)"/>
  <!-- Uu 空口  (本车 <-> 基站) -->
  <line x1="900" y1="452" x2="900" y2="404" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#ah-gray)" marker-end="url(#ah-gray)"/>
  <!-- V2N 回传 (基站 <-> 云) -->
  <line x1="900" y1="300" x2="900" y2="240" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#ah-gray)" marker-end="url(#ah-gray)"/>

  <!-- ============ LINK LABELS ============ -->
  <!-- PC5 · V2V -->
  <rect x="542" y="510" width="80" height="20" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="582" y="520" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">PC5 · V2V</text>
  <!-- PC5 · V2I -->
  <rect x="1177" y="510" width="80" height="20" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1217" y="520" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">PC5 · V2I</text>
  <!-- PC5 · V2P -->
  <rect x="860" y="667" width="80" height="20" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="677" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">PC5 · V2P</text>
  <!-- Uu 空口 -->
  <rect x="872" y="418" width="56" height="20" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="900" y="428" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">Uu 空口</text>
  <!-- V2N 回传 -->
  <rect x="869" y="260" width="62" height="20" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="900" y="270" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle" dominant-baseline="central">V2N 回传</text>

  <!-- ============ CLOUD NODE (amber) ============ -->
  <rect x="770" y="124" width="260" height="108" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <g transform="translate(884,147)">
    <path d="M9 18 Q3 18 3 13 Q3 8 8 8 Q9 3 15 3 Q21 3 22 8 Q28 8 28 13 Q28 18 23 18 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <text x="900" y="188" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">云平台与应用服务</text>
  <text x="900" y="208" font-size="11" fill="#64748B" text-anchor="middle" dominant-baseline="central">V2N · 车-云</text>
  <text x="900" y="224" font-size="10" fill="#475569" text-anchor="middle" dominant-baseline="central">高精地图 / 远程调度 / OTA</text>

  <!-- ============ BASE STATION NODE (gray) ============ -->
  <rect x="790" y="308" width="220" height="88" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <g transform="translate(882,319)">
    <path d="M14 4 L6 26 L22 26 Z" fill="none" stroke="#64748B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M11 12 L17 12" stroke="#64748B" stroke-width="1.5"/>
    <path d="M9 20 L19 20" stroke="#64748B" stroke-width="1.5"/>
    <path d="M26 8 Q30 13 26 18" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M30 5 Q36 13 30 21" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="900" y="360" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">蜂窝基站 gNB</text>
  <text x="900" y="380" font-size="10" fill="#64748B" text-anchor="middle" dominant-baseline="central">Uu 空口接入点 · LTE / NR 双模</text>

  <!-- ============ HOST VEHICLE (center hub, blue) ============ -->
  <rect x="790" y="460" width="220" height="120" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
  <g transform="translate(877,472)">
    <path d="M4 18 L4 13 L10 13 L13 6 Q14 5 16 5 L30 5 Q32 5 33 6 L36 13 L42 13 L42 18" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M2 18 L44 18" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <circle cx="13" cy="20" r="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="33" cy="20" r="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <path d="M16 9 L30 9" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="900" y="518" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">本车 OBU</text>
  <text x="900" y="540" font-size="11" fill="#64748B" text-anchor="middle" dominant-baseline="central">On-Board Unit</text>
  <text x="900" y="560" font-size="10" fill="#475569" text-anchor="middle" dominant-baseline="central">C-V2X 车载终端 · 通信枢纽</text>

  <!-- ============ OTHER VEHICLE · V2V (blue) ============ -->
  <rect x="145" y="465" width="230" height="110" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <g transform="translate(237,473)">
    <path d="M4 18 L4 13 L10 13 L13 6 Q14 5 16 5 L30 5 Q32 5 33 6 L36 13 L42 13 L42 18" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M2 18 L44 18" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <circle cx="13" cy="20" r="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="33" cy="20" r="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <path d="M16 9 L30 9" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="260" y="518" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">他车</text>
  <text x="260" y="540" font-size="11" fill="#64748B" text-anchor="middle" dominant-baseline="central">V2V · 车-车</text>
  <text x="260" y="560" font-size="10" fill="#475569" text-anchor="middle" dominant-baseline="central">协同感知 / 防撞预警</text>

  <!-- ============ ROADSIDE UNIT · V2I (green) ============ -->
  <rect x="1425" y="465" width="230" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <g transform="translate(1520,474)">
    <rect x="13" y="3" width="14" height="7" rx="1.5" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <path d="M20 10 L20 25" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <path d="M15 25 L25 25" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <path d="M8 7 Q4 7 4 12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M32 7 Q36 7 36 12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M5 5 Q1 5 1 12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
    <path d="M35 5 Q39 5 39 12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  </g>
  <text x="1540" y="518" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">路侧单元 RSU</text>
  <text x="1540" y="540" font-size="11" fill="#64748B" text-anchor="middle" dominant-baseline="central">V2I · 车-路</text>
  <text x="1540" y="560" font-size="10" fill="#475569" text-anchor="middle" dominant-baseline="central">信号灯相位 / 盲区预警</text>

  <!-- ============ PEDESTRIAN · V2P (green) ============ -->
  <rect x="785" y="775" width="230" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <g transform="translate(888,786)">
    <circle cx="12" cy="5" r="3.2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <path d="M12 8 L12 18" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 12 L7 16" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 12 L17 16" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 18 L8 27" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 18 L16 27" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="900" y="830" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">行人与弱势用户</text>
  <text x="900" y="852" font-size="11" fill="#64748B" text-anchor="middle" dominant-baseline="central">V2P · 车-人</text>
  <text x="900" y="872" font-size="10" fill="#475569" text-anchor="middle" dominant-baseline="central">视野盲区碰撞预警</text>

  <!-- ============ LEGEND ============ -->
  <!-- PC5 直连链路 -->
  <line x1="540" y1="950" x2="566" y2="950" stroke="#2563EB" stroke-width="2.5" marker-start="url(#ah-blue)" marker-end="url(#ah-blue)"/>
  <text x="576" y="950" font-size="12" fill="#0F172A" dominant-baseline="central">PC5 直连链路（V2V / V2I / V2P）</text>
  <!-- Uu 蜂窝链路 -->
  <line x1="930" y1="950" x2="956" y2="950" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#ah-gray)" marker-end="url(#ah-gray)"/>
  <text x="966" y="950" font-size="12" fill="#0F172A" dominant-baseline="central">Uu 蜂窝链路（V2N）</text>
  <!-- 边缘接入域 -->
  <rect x="1240" y="944" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1264" y="950" font-size="12" fill="#0F172A" dominant-baseline="central">边缘接入域</text>
  <!-- 云端服务域 -->
  <rect x="1380" y="944" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="1404" y="950" font-size="12" fill="#0F172A" dominant-baseline="central">云端服务域</text>

  <!-- ============ FCC FOOTNOTES ============ -->
  <text x="900" y="1000" font-size="10" fill="#64748B" text-anchor="middle" dominant-baseline="central">频段裁决：2020 年 FCC 将 5.9 GHz 频段中 45 MHz（5.895–5.940 GHz）划归 C-V2X，DSRC 进入日落；2024 年过渡期到期，C-V2X 成为北美事实标准。</text>
  <text x="900" y="1020" font-size="10" fill="#64748B" text-anchor="middle" dominant-baseline="central">接口演进：C-V2X 的 PC5 由 LTE-V2X（3GPP Rel-14）平滑演进至 NR-V2X（Rel-16+），与 Uu 蜂窝接口长期共存、互补。</text>

  <!-- ============ CAPTION ============ -->
  <text x="900" y="1078" font-size="10" fill="#94A3B8" text-anchor="middle" dominant-baseline="central">图11-1 V2X通信架构：V2V/V2I/V2P 走 PC5 直连实现毫秒级安全消息，V2N 走 Uu 蜂窝接口承载宽带服务；C-V2X 在 PC5 上从 LTE 平滑演进到 NR，已成全球事实标准（DSRC 日落）。</text>
</svg>
