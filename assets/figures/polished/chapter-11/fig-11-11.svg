<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect x="0" y="0" width="1800" height="900" fill="#FFFFFF"/>

  <!-- ===== 标题区 ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">能耗数据对比图（智能照明 vs 传统照明，假设场景）</text>
  <text x="84" y="72" font-size="12" fill="#64748B">50W LED 路灯典型工作日功率曲线 · 传统定时全亮 vs DQN 动态调光</text>

  <rect x="1560" y="24" width="206" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1663" y="41" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">TIMELINE · QUANTITATIVE</text>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 图例（右上方） ===== -->
  <g id="legend">
    <rect x="1382" y="128" width="338" height="86" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1396" y="148" font-size="11" font-weight="700" fill="#475569" letter-spacing="1">LEGEND</text>
    <line x1="1402" y1="162" x2="1450" y2="162" stroke="#2563EB" stroke-width="2.5"/>
    <text x="1460" y="166" font-size="11" fill="#334155">DQN 策略功率曲线（实线）</text>
    <line x1="1402" y1="182" x2="1450" y2="182" stroke="#64748B" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="1460" y="186" font-size="11" fill="#334155">传统定时策略功率曲线（虚线）</text>
    <rect x="1402" y="196" width="48" height="12" rx="2" fill="#10B981" fill-opacity="0.4" stroke="#10B981" stroke-width="1"/>
    <text x="1460" y="206" font-size="11" fill="#334155">节省能耗区域（示意）</text>
  </g>

  <!-- ===== 绘图区背景 ===== -->
  <rect x="140" y="184" width="1512" height="516" fill="#F8FAFC" stroke="none"/>

  <!-- ===== 网格线（纵轴） ===== -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="140" y1="184" x2="1652" y2="184"/>
    <line x1="140" y1="270" x2="1652" y2="270"/>
    <line x1="140" y1="442" x2="1652" y2="442"/>
    <line x1="140" y1="571" x2="1652" y2="571"/>
    <line x1="140" y1="700" x2="1652" y2="700"/>
  </g>
  <!-- 网格线（横轴，每 2 小时） -->
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 4">
    <line x1="140" y1="184" x2="140" y2="700"/>
    <line x1="266" y1="184" x2="266" y2="700"/>
    <line x1="392" y1="184" x2="392" y2="700"/>
    <line x1="518" y1="184" x2="518" y2="700"/>
    <line x1="644" y1="184" x2="644" y2="700"/>
    <line x1="770" y1="184" x2="770" y2="700"/>
    <line x1="896" y1="184" x2="896" y2="700"/>
    <line x1="1022" y1="184" x2="1022" y2="700"/>
    <line x1="1148" y1="184" x2="1148" y2="700"/>
    <line x1="1274" y1="184" x2="1274" y2="700"/>
    <line x1="1400" y1="184" x2="1400" y2="700"/>
    <line x1="1526" y1="184" x2="1526" y2="700"/>
    <line x1="1652" y1="184" x2="1652" y2="700"/>
  </g>

  <!-- ===== 坐标轴 ===== -->
  <line x1="140" y1="700" x2="1652" y2="700" stroke="#64748B" stroke-width="1.5"/>
  <line x1="140" y1="184" x2="140" y2="700" stroke="#64748B" stroke-width="1.5"/>

  <!-- Y 轴刻度标签 -->
  <g font-size="11" fill="#475569" text-anchor="end">
    <text x="128" y="704">0</text>
    <text x="128" y="575">15</text>
    <text x="128" y="446">30</text>
    <text x="128" y="274">50</text>
    <text x="128" y="188">60</text>
  </g>
  <text x="92" y="178" font-size="11" font-weight="600" fill="#475569">功率 / W</text>

  <!-- X 轴刻度标签 -->
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="140" y="720">00:00</text>
    <text x="266" y="720">02:00</text>
    <text x="392" y="720">04:00</text>
    <text x="518" y="720">06:00</text>
    <text x="644" y="720">08:00</text>
    <text x="770" y="720">10:00</text>
    <text x="896" y="720">12:00</text>
    <text x="1022" y="720">14:00</text>
    <text x="1148" y="720">16:00</text>
    <text x="1274" y="720">18:00</text>
    <text x="1400" y="720">20:00</text>
    <text x="1526" y="720">22:00</text>
    <text x="1652" y="720">24:00</text>
  </g>
  <text x="896" y="752" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">时间（24 小时）</text>

  <!-- ===== 区间标注（顶部 bracket） ===== -->
  <g>
    <!-- 深夜低流量段 00:00–05:00 -->
    <line x1="140" y1="150" x2="455" y2="150" stroke="#10B981" stroke-width="1.5"/>
    <line x1="140" y1="150" x2="140" y2="158" stroke="#10B981" stroke-width="1.5"/>
    <line x1="455" y1="150" x2="455" y2="158" stroke="#10B981" stroke-width="1.5"/>
    <text x="297" y="142" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">深夜低流量段 · 节能核心区间</text>

    <!-- 清晨作业时段 05:00–06:00 -->
    <line x1="455" y1="150" x2="518" y2="150" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="455" y1="150" x2="455" y2="158" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="518" y1="150" x2="518" y2="158" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="486" y="138" font-size="10" font-weight="700" fill="#F59E0B" text-anchor="middle">环卫</text>

    <!-- 晚高峰段 18:00–20:00 -->
    <line x1="1274" y1="150" x2="1400" y2="150" stroke="#7C3AED" stroke-width="1.5"/>
    <line x1="1274" y1="150" x2="1274" y2="158" stroke="#7C3AED" stroke-width="1.5"/>
    <line x1="1400" y1="150" x2="1400" y2="158" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="1337" y="142" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">晚高峰段 · 功率持平</text>
  </g>

  <!-- ===== 节省能耗填充区域（绿色，40% 透明） ===== -->
  <polygon points="140,270 518,270 518,442 455,442 455,571 140,571" fill="#10B981" fill-opacity="0.4" stroke="none"/>
  <polygon points="1400,270 1652,270 1652,571 1589,571 1526,442 1400,442" fill="#10B981" fill-opacity="0.4" stroke="none"/>
  <!-- 填充区标注 -->
  <text x="297" y="540" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">节省能耗（示意）</text>
  <text x="1520" y="430" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">节省能耗</text>

  <!-- ===== 传统照明曲线（灰色虚线） ===== -->
  <polyline points="140,270 518,270 518,700 1274,700 1274,270 1652,270"
            fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="8 5" stroke-linejoin="round"/>

  <!-- ===== DQN 智能照明曲线（蓝色实线，主链路高亮） ===== -->
  <polyline points="140,571 455,571 455,442 518,442 518,700 1274,700 1274,270 1400,270 1400,442 1526,442 1589,571 1652,571"
            fill="none" stroke="#2563EB" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 关键节点小圆点（DQN） -->
  <g fill="#FFFFFF" stroke="#2563EB" stroke-width="2">
    <circle cx="140" cy="571" r="3.5"/>
    <circle cx="455" cy="571" r="3.5"/>
    <circle cx="455" cy="442" r="3.5"/>
    <circle cx="518" cy="442" r="3.5"/>
    <circle cx="1274" cy="270" r="3.5"/>
    <circle cx="1400" cy="270" r="3.5"/>
    <circle cx="1400" cy="442" r="3.5"/>
    <circle cx="1526" cy="442" r="3.5"/>
    <circle cx="1589" cy="571" r="3.5"/>
  </g>

  <!-- 曲线内联标签 -->
  <text x="1660" y="266" font-size="12" font-weight="700" fill="#64748B">传统（定时全亮）</text>
  <text x="1660" y="568" font-size="12" font-weight="700" fill="#2563EB">DQN（动态调光）</text>

  <!-- ===== callout 注解 ===== -->
  <g>
    <rect x="560" y="360" width="330" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="574" y="380" font-size="11" fill="#334155">05:00 功率短暂回升至 30W，</text>
    <text x="574" y="397" font-size="11" fill="#334155">说明 DQN 保留了突发响应机制。</text>
    <line x1="518" y1="442" x2="560" y2="392" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
  <g>
    <rect x="180" y="600" width="250" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="194" y="620" font-size="11" fill="#334155">传统深夜保持满功率 50W，</text>
    <text x="194" y="637" font-size="11" fill="#334155">DQN 可降至 30% 以下（15W）。</text>
  </g>

  <!-- ===== 底部分隔线 + caption ===== -->
  <line x1="60" y1="790" x2="1740" y2="790" stroke="#E2E8F0" stroke-width="1"/>
  <text x="900" y="820" font-size="10" fill="#94A3B8" text-anchor="middle">图11-9 假设场景下 50W LED 路灯在典型工作日的功率曲线示例。传统策略定时全亮；DQN 策略根据实时传感器反馈动态调光。实际节电比例因部署路段车流和天气条件而异，但定性上可表明低流量时段的调光节能效果。</text>
  <text x="900" y="838" font-size="9" fill="#94A3B8" text-anchor="middle">来源：本书假设场景，曲线仅用于说明控制策略差异。</text>
</svg>
