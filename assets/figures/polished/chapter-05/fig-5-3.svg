<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="图5-3 消息队列缓冲削峰示意" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
<marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
<marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
<marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
<marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
<marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
</defs>

<rect x="0" y="0" width="1600" height="1000" fill="#FFFFFF"/>

<circle cx="64" cy="40" r="6" fill="#2563EB"/>
<text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图5-3 消息队列缓冲削峰示意</text>
<text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">设备洪峰到来时，消息在队列分区中暂存，消费者按能力拉取，后端不承受瞬时冲击</text>
<rect x="1460" y="28" width="82" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="1501" y="44" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">DATAFLOW</text>

<line x1="58" y1="103" x2="1542" y2="103" stroke="#E2E8F0" stroke-width="1"/>

<!-- 区域边界 -->
<rect x="70" y="140" width="310" height="320" rx="12" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="8 4"/>
<text x="86" y="162" fill="#10B981" font-size="11" font-weight="600">设备与边缘域 · 现场异构资源边界</text>

<rect x="400" y="140" width="690" height="320" rx="12" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="8 4"/>
<text x="416" y="162" fill="#2563EB" font-size="11" font-weight="600">平台服务域 · 核心服务能力边界</text>

<rect x="1110" y="140" width="420" height="320" rx="12" fill="none" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="8 4"/>
<text x="1126" y="162" fill="#7C3AED" font-size="11" font-weight="600">数据资产域 · 数据沉淀与治理边界</text>

<rect x="70" y="490" width="1460" height="380" rx="12" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="8 4"/>
<text x="86" y="512" fill="#2563EB" font-size="11" font-weight="600">时间轴 · 正常与洪峰阶段</text>

<!-- 管道箭头（节点下层） -->
<line x1="312" y1="345" x2="438" y2="345" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
<text x="375" y="337" fill="#10B981" font-size="11" font-weight="600" text-anchor="middle">数据上报</text>

<line x1="682" y1="345" x2="798" y2="345" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
<text x="740" y="337" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle">负载均衡</text>

<line x1="1042" y1="345" x2="1178" y2="345" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="1110" y="337" fill="#2563EB" font-size="11" font-weight="600" text-anchor="middle">消费输出</text>

<!-- 主链路下行箭头：设备群→时间轴 -->
<line x1="220" y1="402" x2="220" y2="488" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
<text x="235" y="450" fill="#10B981" font-size="11" font-weight="600">瞬时洪峰</text>

<line x1="1290" y1="402" x2="1290" y2="488" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
<text x="1305" y="450" fill="#64748B" font-size="11" font-weight="600">平稳输出</text>

<!-- 节点 -->
<rect x="130" y="290" width="180" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<text x="220" y="328" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">设备群</text>
<text x="220" y="352" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">传感器 / PLC 等数据源</text>
<text x="220" y="378" fill="#94A3B8" font-size="9" font-weight="500" text-anchor="middle">高频上报 · 异构协议</text>

<rect x="440" y="290" width="240" height="110" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="560" y="316" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">Topic 分区</text>
<text x="560" y="334" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">Kafka 分区结构</text>
<line x1="520" y1="350" x2="520" y2="390" stroke="#2563EB" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="600" y1="350" x2="600" y2="390" stroke="#2563EB" stroke-width="1" stroke-dasharray="3 3"/>
<text x="480" y="378" fill="#2563EB" font-size="10" font-weight="600" text-anchor="middle">P0</text>
<text x="560" y="378" fill="#2563EB" font-size="10" font-weight="600" text-anchor="middle">P1</text>
<text x="640" y="378" fill="#2563EB" font-size="10" font-weight="600" text-anchor="middle">P2</text>

<rect x="800" y="290" width="240" height="110" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="920" y="316" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">消费者组</text>
<text x="920" y="334" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">C1 / C2 / C3 实例</text>
<rect x="832" y="352" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
<text x="857" y="372" fill="#2563EB" font-size="10" font-weight="600" text-anchor="middle">C1</text>
<rect x="895" y="352" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
<text x="920" y="372" fill="#2563EB" font-size="10" font-weight="600" text-anchor="middle">C2</text>
<rect x="958" y="352" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
<text x="983" y="372" fill="#2563EB" font-size="10" font-weight="600" text-anchor="middle">C3</text>

<rect x="1180" y="290" width="220" height="110" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="1290" y="328" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">后端服务</text>
<text x="1290" y="352" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">告警引擎 / 时序库 / 降采样</text>
<text x="1290" y="378" fill="#94A3B8" font-size="9" font-weight="500" text-anchor="middle">按固定速率处理</text>

<!-- 时间轴图表 -->
<line x1="160" y1="815" x2="1462" y2="815" stroke="#CBD5E1" stroke-width="1" marker-end="url(#ah-gray)"/>
<line x1="160" y1="815" x2="160" y2="588" stroke="#CBD5E1" stroke-width="1" marker-end="url(#ah-gray)"/>
<text x="1455" y="832" fill="#64748B" font-size="11" font-weight="500" text-anchor="end">时间 →</text>
<text x="130" y="600" fill="#64748B" font-size="11" font-weight="500" text-anchor="middle" transform="rotate(-90 130 600)">流量 / 水位 →</text>
<text x="360" y="834" fill="#64748B" font-size="11" font-weight="500" text-anchor="middle">正常</text>
<text x="710" y="834" fill="#E11D48" font-size="11" font-weight="600" text-anchor="middle">洪峰</text>
<text x="1160" y="834" fill="#64748B" font-size="11" font-weight="500" text-anchor="middle">消退</text>

<!-- 洪峰时刻标记 -->
<line x1="710" y1="590" x2="710" y2="815" stroke="#E11D48" stroke-width="1" stroke-dasharray="4 4"/>
<text x="710" y="582" fill="#E11D48" font-size="10" font-weight="600" text-anchor="middle">洪峰时刻</text>

<!-- 队列水位面积 -->
<path d="M 160,815 L 160,808 L 560,806 L 660,793 L 740,715 L 800,700 L 900,730 L 1060,775 L 1260,800 L 1460,806 L 1460,815 Z" fill="#2563EB" fill-opacity="0.08"/>
<path d="M 160,808 L 560,806 L 660,793 L 740,715 L 800,700 L 900,730 L 1060,775 L 1260,800 L 1460,806" fill="none" stroke="#2563EB" stroke-width="2"/>

<!-- 设备流量曲线 -->
<path d="M 160,795 L 520,793 L 620,755 L 680,655 L 710,620 L 760,675 L 840,770 L 920,793 L 1460,794" fill="none" stroke="#10B981" stroke-width="2"/>

<!-- 后端消费曲线 -->
<path d="M 160,785 L 1460,784" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="2 0"/>

<circle cx="710" cy="620" r="4" fill="#10B981"/>
<text x="725" y="614" fill="#10B981" font-size="10" font-weight="600">尖峰流量</text>
<circle cx="800" cy="700" r="4" fill="#2563EB"/>
<text x="815" y="694" fill="#2563EB" font-size="10" font-weight="600">水位峰值</text>
<text x="1000" y="772" fill="#7C3AED" font-size="10" font-weight="600">后端按能力平稳消费</text>

<!-- 图表内图例 -->
<rect x="1190" y="592" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
<text x="1210" y="601" fill="#64748B" font-size="11" font-weight="600">设备流量</text>
<rect x="1300" y="592" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="1320" y="601" fill="#64748B" font-size="11" font-weight="600">队列水位</text>
<rect x="1410" y="592" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="1430" y="601" fill="#64748B" font-size="11" font-weight="600">后端消费</text>

<!-- callout 标注 -->
<rect x="190" y="525" width="470" height="38" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="205" y="549" fill="#334155" font-size="11" font-weight="500">洪峰期间队列水位升高，消费者按能力拉取，后端不受瞬时冲击。</text>

<rect x="700" y="525" width="450" height="38" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="715" y="549" fill="#334155" font-size="11" font-weight="500">多个消费者组可独立消费同一 Topic，满足不同处理时效要求。</text>

<!-- 底部图例 -->
<line x1="58" y1="892" x2="1542" y2="892" stroke="#E2E8F0" stroke-width="1"/>
<rect x="80" y="911" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
<text x="100" y="921" fill="#64748B" font-size="11" font-weight="600">数据源</text>
<rect x="180" y="911" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="200" y="921" fill="#64748B" font-size="11" font-weight="600">消息队列 / 消费者</text>
<rect x="360" y="911" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="380" y="921" fill="#64748B" font-size="11" font-weight="600">后端服务</text>
<line x1="480" y1="916" x2="510" y2="916" stroke="#64748B" stroke-width="1.5"/>
<text x="516" y="921" fill="#64748B" font-size="11" font-weight="600">直接数据流</text>
<line x1="630" y1="916" x2="660" y2="916" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="666" y="921" fill="#64748B" font-size="11" font-weight="600">调度 / 分配</text>
<line x1="780" y1="916" x2="810" y2="916" stroke="#10B981" stroke-width="2"/>
<text x="816" y="921" fill="#64748B" font-size="11" font-weight="600">高流量主链路</text>
<rect x="940" y="911" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
<text x="960" y="921" fill="#64748B" font-size="11" font-weight="600">洪峰 / 风险标记</text>

<text x="800" y="968" fill="#94A3B8" font-size="10" text-anchor="middle">图5-3 消息队列缓冲削峰示意：洪峰到达时，消息在 Topic 分区中暂存，消费者组按积压数据逐步消费，后端服务不直接承受瞬时冲击。</text>
</svg>