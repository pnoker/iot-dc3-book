    <text x="1047" y="276" font-size="10" fill="#64748B">长连峰值与配额</text>
  </g>
  <!-- (设备接入,安全) 双向证书认证 ✗ -->
  <g>
    <circle cx="1397" cy="262" r="11" fill="#E11D48"/>
    <path d="M1392 257 l10 10 M1402 257 l-10 10" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
