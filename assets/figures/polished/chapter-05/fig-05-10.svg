  <text x="168" y="486" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">时序数据库</text>
  <text x="168" y="508" font-size="10" fill="#64748B" text-anchor="middle">data 域 · 存储</text>

  <!-- Row4 规则引擎 ai/orange -->
  <rect x="74" y="568" width="172" height="72" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <rect x="74" y="568" width="6" height="72" rx="3" fill="#F59E0B"/>
  <text x="168" y="598" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">规则引擎</text>
  <text x="168" y="620" font-size="10" fill="#64748B" text-anchor="middle">ai 域 · 计算</text>

  <!-- Row5 API网关 platform/blue -->
  <rect x="74" y="680" width="172" height="72" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <rect x="74" y="680" width="6" height="72" rx="3" fill="#2563EB"/>
  <text x="168" y="710" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">API 网关</text>
  <text x="168" y="732" font-size="10" fill="#64748B" text-anchor="middle">platform 域 · 入口</text>

