<svg xmlns="http://www.w3.org/2000/svg" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif" width="1800" height="980" viewBox="0 0 1800 980">
  <title>平台层工程检查矩阵</title>
  <desc>五维度（设备接入、消息队列、时序数据库、规则引擎、API网关）与四检查属性（功能完整性、容错与高可用、容量与性能边界、安全与合规）交叉的风险等级矩阵。安全与合规避为主链路高风险列。</desc>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1800" height="980" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="46" font-size="22" font-weight="700" fill="#0F172A">平台层工程检查矩阵</text>
  <text x="84" y="70" font-size="12" fill="#64748B">五维度 × 四检查属性 · 在交叉点定位平台层设计风险，红列（安全合规）为必须重点验证的主链路</text>

  <rect x="1640" y="24" width="120" height="32" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1700" y="44" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.5">MATRIX</text>

  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Main body: matrix table ===== -->
  <!-- Region boundary -->
  <rect x="52" y="120" width="1696" height="652" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"/>
  <rect x="64" y="112" width="120" height="20" rx="4" fill="#FFFFFF"/>
  <text x="124" y="126" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">平台服务域</text>

  <!-- Grid baseline -->
  <!-- tableX0=60 tableX1=1740 ; label col 200, 4 data cols x 370 -->
  <!-- tableY0=140 headerH=72 rowH=112 ; tableY1 = 140+72+5*112 = 772 -->

  <!-- Header row background -->
  <rect x="60" y="140" width="1680" height="72" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Data row separators -->
  <rect x="60" y="212" width="1680" height="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="324" width="1680" height="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="436" width="1680" height="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="548" width="1680" height="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="660" width="1680" height="112" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Column separators (vertical lines) -->
  <line x1="260" y1="140" x2="260" y2="772" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="630" y1="140" x2="630" y2="772" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="1000" y1="140" x2="1000" y2="772" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="1370" y1="140" x2="1370" y2="772" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Highlight: 安全与合规 column (red focal path) -->
  <rect x="1370" y="140" width="370" height="632" fill="#E11D48" opacity="0.04"/>
  <rect x="1371" y="141" width="368" height="630" fill="none" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.55"/>

  <!-- ===== Corner cell ===== -->
  <text x="160" y="170" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">维度 ▼ ／ 属性 ▶</text>
  <text x="160" y="192" font-size="10" fill="#94A3B8" text-anchor="middle">行=服务 · 列=检查属性</text>

  <!-- ===== Column headers ===== -->
  <g font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">
    <text x="445" y="172">功能完整性</text>
    <text x="815" y="172">容错与高可用</text>
    <text x="1185" y="172">容量与性能边界</text>
    <text x="1555" y="172" fill="#E11D48">安全与合规 ★</text>
  </g>
  <g font-size="10" fill="#94A3B8" text-anchor="middle">
    <text x="445" y="192">功能是否正确实现</text>
    <text x="815" y="192">故障下是否存活</text>
    <text x="1185" y="192">峰值是否扛得住</text>
    <text x="1555" y="192">权限与合规底线</text>
  </g>

  <!-- ===== Row label cards (domain colored) ===== -->
  <!-- Row1 设备接入 edge/green -->
  <rect x="74" y="232" width="172" height="72" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <rect x="74" y="232" width="6" height="72" rx="3" fill="#10B981"/>
  <text x="168" y="262" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">设备接入</text>
  <text x="168" y="284" font-size="10" fill="#64748B" text-anchor="middle">edge 域 · 协议层</text>

  <!-- Row2 消息队列 platform/blue -->
  <rect x="74" y="344" width="172" height="72" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <rect x="74" y="344" width="6" height="72" rx="3" fill="#2563EB"/>
  <text x="168" y="374" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">消息队列</text>
  <text x="168" y="396" font-size="10" fill="#64748B" text-anchor="middle">platform 域 · 解耦</text>

  <!-- Row3 时序数据库 data/purple -->
  <rect x="74" y="456" width="172" height="72" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
