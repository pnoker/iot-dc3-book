<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-label="图5-1 物联网平台分层架构示意" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
<marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
<marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
</defs>
<rect x="0" y="0" width="1500" height="950" fill="#FFFFFF"/>
<g id="title">
<circle cx="64" cy="40" r="6" fill="#2563EB"/>
<text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图5-1 物联网平台分层架构示意</text>
<text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">自下而上四层模型，平台层居中承担数据汇聚与应用使能的桥梁职责</text>
<rect x="1380" y="26" width="92" height="24" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="1426" y="42" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">LAYERED</text>
</g>
<line x1="58" y1="103" x2="1442" y2="103" stroke="#E2E8F0" stroke-width="1"/>

<g id="arrows-data" stroke="#10B981" stroke-width="2" fill="none">
<line x1="350" y1="700" x2="350" y2="642" marker-end="url(#ah-green)"/>
<line x1="350" y1="550" x2="350" y2="492" marker-end="url(#ah-green)"/>
<line x1="350" y1="290" x2="350" y2="232" marker-end="url(#ah-green)"/>
</g>
<g id="arrows-control" stroke="#2563EB" stroke-width="1.5" fill="none">
<line x1="1250" y1="230" x2="1250" y2="288" marker-end="url(#ah-blue)"/>
<line x1="1250" y1="490" x2="1250" y2="548" marker-end="url(#ah-blue)"/>
<line x1="1250" y1="640" x2="1250" y2="698" marker-end="url(#ah-blue)"/>
</g>
<g id="arrow-labels">
<text x="362" y="675" fill="#10B981" font-size="11" font-weight="600">数据流</text>
<text x="362" y="525" fill="#10B981" font-size="10" font-weight="600">数据</text>
<text x="362" y="265" fill="#10B981" font-size="10" font-weight="600">数据</text>
<text x="1238" y="263" fill="#2563EB" font-size="11" font-weight="600" text-anchor="end">控制流</text>
<text x="1238" y="523" fill="#2563EB" font-size="10" font-weight="600" text-anchor="end">控制</text>
<text x="1238" y="673" fill="#2563EB" font-size="10" font-weight="600" text-anchor="end">控制</text>
</g>

<g id="layer-application">
<rect x="200" y="140" width="1100" height="90" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<text x="240" y="180" fill="#0F172A" font-size="15" font-weight="700">应用层</text>
<text x="240" y="200" fill="#475569" font-size="10" font-weight="500">大屏·App·AI·系统</text>
<text x="1260" y="190" fill="#94A3B8" font-size="10" font-weight="500" text-anchor="end">可视化大屏 · 移动App · AI分析 · 业务系统</text>
</g>

<g id="layer-platform">
<rect x="200" y="290" width="1100" height="200" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="240" y="325" fill="#0F172A" font-size="15" font-weight="700">平台层</text>
<text x="240" y="345" fill="#475569" font-size="10" font-weight="500">数据汇聚·应用使能（桥梁层）</text>
<text x="750" y="372" fill="#F59E0B" font-size="11" font-weight="600" text-anchor="middle">平台内部处理顺序</text>
<g id="arrows-internal" stroke="#F59E0B" stroke-width="2" fill="none">
<line x1="462" y1="415" x2="518" y2="415" marker-end="url(#ah-orange)"/>
<line x1="722" y1="415" x2="778" y2="415" marker-end="url(#ah-orange)"/>
<line x1="982" y1="415" x2="1038" y2="415" marker-end="url(#ah-orange)"/>
</g>
<g id="platform-blocks">
<rect x="260" y="380" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="360" y="412" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">设备接入</text>
<text x="360" y="432" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">多协议接入</text>
<rect x="520" y="380" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="620" y="412" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">消息处理</text>
<text x="620" y="432" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">MQTT·规则引擎</text>
<rect x="780" y="380" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="880" y="412" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">数据存储</text>
<text x="880" y="432" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">时序·关系库</text>
<rect x="1040" y="380" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="1140" y="412" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">应用使能</text>
<text x="1140" y="432" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">API·开放服务</text>
</g>
</g>

<g id="layer-network">
<rect x="200" y="550" width="1100" height="90" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="240" y="590" fill="#0F172A" font-size="15" font-weight="700">网络层</text>
<text x="240" y="610" fill="#475569" font-size="10" font-weight="500">无线·WAN·有线</text>
<text x="1260" y="600" fill="#94A3B8" font-size="10" font-weight="500" text-anchor="end">NB-IoT · 4G · LoRa · Wi-Fi · 以太网</text>
</g>

<g id="layer-sensing">
<rect x="200" y="700" width="1100" height="90" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<text x="240" y="740" fill="#0F172A" font-size="15" font-weight="700">感知层</text>
<text x="240" y="760" fill="#475569" font-size="10" font-weight="500">传感器·执行器</text>
<text x="1260" y="750" fill="#94A3B8" font-size="10" font-weight="500" text-anchor="end">温度 · 湿度 · 光照 · 门禁 · 水表 · 执行器</text>
</g>

<line x1="58" y1="860" x2="1442" y2="860" stroke="#E2E8F0" stroke-width="1"/>
<g id="legend">
<line x1="120" y1="890" x2="150" y2="890" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
<text x="158" y="894" fill="#64748B" font-size="11" font-weight="600">数据流（上行）</text>
<line x1="370" y1="890" x2="400" y2="890" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ah-blue)"/>
<text x="408" y="894" fill="#64748B" font-size="11" font-weight="600">控制流（下行）</text>
<line x1="620" y1="890" x2="650" y2="890" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
<text x="658" y="894" fill="#64748B" font-size="11" font-weight="600">平台内部顺序</text>
<rect x="860" y="884" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
<text x="880" y="894" fill="#64748B" font-size="11" font-weight="600">感知</text>
<rect x="950" y="884" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
<text x="970" y="894" fill="#64748B" font-size="11" font-weight="600">网络</text>
<rect x="1040" y="884" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="1060" y="894" fill="#64748B" font-size="11" font-weight="600">平台</text>
<rect x="1130" y="884" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
<text x="1150" y="894" fill="#64748B" font-size="11" font-weight="600">应用</text>
</g>
<text x="750" y="925" fill="#94A3B8" font-size="10" text-anchor="middle">感知层采集物理信号并数字化，经网络层传输至平台层完成协议转换、消息缓冲与存储，再经API暴露给应用层提供交互与决策支持。</text>
</svg>