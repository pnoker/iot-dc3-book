<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-label="图5-2 设备认证与数据加密流程" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#FFFFFF"/>

  <!-- 标题区 -->
  <circle cx="64" cy="44" r="6" fill="#2563EB"/>
  <text x="82" y="52" fill="#0F172A" font-size="22" font-weight="700">图5-2 设备认证与数据加密流程</text>
  <text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">设备接入平台的证书/Token 认证与 TLS/DTLS 加密传输完整路径</text>
  <rect x="1462" y="32" width="110" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1517" y="49" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">FLOWCHART</text>
  <line x1="58" y1="103" x2="1542" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 泳道边界 -->
  <rect x="90" y="140" width="380" height="560" rx="12" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="106" y="166" fill="#10B981" font-size="11" font-weight="600">设备侧</text>
  <rect x="510" y="140" width="560" height="560" rx="12" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="526" y="166" fill="#64748B" font-size="11" font-weight="600">网络</text>
  <rect x="1110" y="140" width="400" height="560" rx="12" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="1126" y="166" fill="#2563EB" font-size="11" font-weight="600">平台侧</text>

  <!-- 连接箭头（先于节点绘制） -->
  <!-- ① 设备 → TLS/DTLS握手（主链路） -->
  <line x1="367" y1="262" x2="688" y2="262" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="527" y="252" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">① ClientHello / Token 请求</text>

  <!-- ② TLS/DTLS握手 → 认证服务（主链路） -->
  <line x1="852" y1="262" x2="1203" y2="262" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1027" y="252" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">② 转发握手消息</text>

  <!-- ③ 认证服务 → TLS/DTLS握手（返回，虚线） -->
  <line x1="1203" y1="282" x2="852" y2="282" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="1027" y="300" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle">③ 握手完成 / Token 签发</text>

  <!-- ④ TLS/DTLS握手 → 设备（返回，虚线） -->
  <line x1="688" y1="282" x2="367" y2="282" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="527" y="300" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle">④ 通道建立通知</text>

  <!-- ⑤ 设备 → 加密通道（主链路·数据流，L形） -->
  <path d="M280,306 L280,572 L678,572" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#ah-violet)"/>
  <text x="479" y="562" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">⑤ 加密数据流</text>

  <!-- ⑥ 加密通道 → 后端业务（主链路） -->
  <line x1="862" y1="572" x2="1203" y2="572" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1032" y="562" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">⑥ 解密后的数据</text>

  <!-- 节点 -->
  <!-- 设备 -->
  <rect x="195" y="240" width="170" height="64" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="280" y="268" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">设备</text>
  <text x="280" y="288" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">发起连接</text>

  <!-- TLS/DTLS握手（决策菱形） -->
  <polygon points="770,210 865,272 770,334 675,272" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="770" y="268" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">TLS/DTLS握手</text>
  <text x="770" y="288" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">协商加密密钥</text>

  <!-- 认证服务 -->
  <rect x="1205" y="240" width="170" height="64" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1290" y="268" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">认证服务</text>
  <text x="1290" y="288" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">验证身份</text>

  <!-- 加密通道（圆柱/数据） -->
  <rect x="680" y="545" width="180" height="54" fill="#FFFFFF" stroke="none"/>
  <path d="M680,545 L680,599 M860,545 L860,599" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <ellipse cx="770" cy="545" rx="90" ry="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <path d="M680,599 A90,10 0 0 0 860,599" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="770" y="572" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">加密通道</text>
  <text x="770" y="590" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">数据流加密</text>

  <!-- 后端业务 -->
  <rect x="1205" y="540" width="170" height="64" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1290" y="568" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">后端业务</text>
  <text x="1290" y="588" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">处理解密数据</text>

  <!-- 标注 callout（底部，边界框之外） -->
  <rect x="80" y="730" width="340" height="76" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="98" cy="750" r="4" fill="#10B981"/>
  <text x="112" y="754" fill="#0F172A" font-size="11" font-weight="700">设备侧</text>
  <text x="98" y="778" fill="#475569" font-size="10" font-weight="500">携带 X.509 证书或设备密钥发起连接请求</text>

  <rect x="440" y="730" width="400" height="76" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="458" cy="750" r="4" fill="#64748B"/>
  <text x="472" y="754" fill="#0F172A" font-size="11" font-weight="700">网络层</text>
  <text x="458" y="774" fill="#475569" font-size="10" font-weight="500">TLS 1.3 在 1RTT 内完成密钥协商</text>
  <text x="458" y="790" fill="#475569" font-size="10" font-weight="500">DTLS 需额外 1 次重传往返</text>

  <rect x="860" y="730" width="300" height="76" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="878" cy="750" r="4" fill="#2563EB"/>
  <text x="892" y="754" fill="#0F172A" font-size="11" font-weight="700">平台侧</text>
  <text x="878" y="774" fill="#475569" font-size="10" font-weight="500">验证证书链或 Token 签名</text>
  <text x="878" y="790" fill="#475569" font-size="10" font-weight="500">通过后建立加密通道</text>

  <rect x="1180" y="730" width="360" height="76" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="1198" cy="750" r="4" fill="#7C3AED"/>
  <text x="1212" y="754" fill="#0F172A" font-size="11" font-weight="700">Token 方案</text>
  <text x="1198" y="774" fill="#475569" font-size="10" font-weight="500">平台签发 JWT，设备侧存储</text>
  <text x="1198" y="790" fill="#475569" font-size="10" font-weight="500">配合 refresh token 与短有效期</text>

  <!-- 图例区 -->
  <line x1="58" y1="828" x2="1542" y2="828" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="90" y="846" width="14" height="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="110" y="855" fill="#64748B" font-size="11" font-weight="600">设备/接入</text>
  <rect x="210" y="846" width="14" height="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="230" y="855" fill="#64748B" font-size="11" font-weight="600">网络传输</text>
  <rect x="330" y="846" width="14" height="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="350" y="855" fill="#64748B" font-size="11" font-weight="600">平台核心</text>
  <rect x="450" y="846" width="14" height="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="470" y="855" fill="#64748B" font-size="11" font-weight="600">数据/加密</text>
  <line x1="590" y1="842" x2="590" y2="860" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="610" y1="851" x2="646" y2="851" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="654" y="855" fill="#64748B" font-size="11" font-weight="600">主链路：请求 / 数据流</text>
  <line x1="980" y1="851" x2="1016" y2="851" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="1024" y="855" fill="#64748B" font-size="11" font-weight="600">返回：握手完成 / Token 签发</text>

  <!-- caption -->
  <text x="800" y="950" fill="#94A3B8" font-size="10" text-anchor="middle">图5-2 设备认证与数据加密的主要流程，涵盖证书 / Token 方式与 TLS / DTLS 加密层</text>
</svg>