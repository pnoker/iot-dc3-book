<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图5-13 平台层延伸阅读工具链全景图</title>
  <desc id="desc">读者应理解平台层延伸阅读工具链全景图中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图5-13 平台层延伸阅读工具链全景图</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解平台层延伸阅读工具链全景图中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
  <!-- 虚线矩形：边缘与容器编排覆盖消息流和时序存储层 -->
  <rect x="180" y="240" width="1240" height="300" rx="10" fill="#FFF7ED" fill-opacity="0.3" stroke="#D97706" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- 连线：数据上报（设备→消息） -->
  <line x1="1420" y1="550" x2="1420" y2="330" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <!-- 连线：消费落库（消息→时序） -->
  <line x1="1420" y1="330" x2="1420" y2="450" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <!-- 连线：查询/告警（时序→可视化） -->
  <line x1="1420" y1="530" x2="1420" y2="230" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  
  <!-- 标签：数据上报 -->
  <rect x="1430" y="428" width="100" height="24" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <text x="1480" y="444" font-size="12" fill="#0F172A" text-anchor="middle">数据上报</text>
  <!-- 标签：消费落库 -->
  <rect x="1430" y="378" width="100" height="24" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <text x="1480" y="394" font-size="12" fill="#0F172A" text-anchor="middle">消费落库</text>
  <!-- 标签：查询/告警 -->
  <rect x="1430" y="328" width="100" height="24" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <text x="1480" y="344" font-size="12" fill="#0F172A" text-anchor="middle">查询/告警</text>
  
  <!-- 层：可视化与监控 -->
  <rect x="200" y="150" width="1200" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="700" y="165" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="800" y="196" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">可视化与监控</text>
  
  <!-- 层：消息与流处理 -->
  <rect x="200" y="250" width="1200" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="700" y="265" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="800" y="296" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">消息与流处理</text>
  
  <!-- 层：边缘与容器编排 -->
  <rect x="200" y="350" width="1200" height="80" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <rect x="700" y="365" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <text x="800" y="396" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">边缘与容器编排</text>
  
  <!-- 层：时序存储 -->
  <rect x="200" y="450" width="1200" height="80" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="700" y="465" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="800" y="496" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">时序存储</text>
  
  <!-- 层：设备接入 -->
  <rect x="200" y="550" width="1200" height="80" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="700" y="565" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="800" y="596" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">设备接入</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">数据流向</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">跨层编排（边缘与容器编排层）</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">独立组件或功能模块</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图中每个方框对应正文推荐的开源项目或功能模块；“设备接入”层延伸自5.1节网关层。</text>
</svg>
