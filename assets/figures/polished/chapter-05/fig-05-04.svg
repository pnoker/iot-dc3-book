<svg xmlns="http://www.w3.org/2000/svg" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1600" height="1000" fill="#FFFFFF"/>

  <!-- ===== Title ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="38" font-size="22" font-weight="700" fill="#0F172A">图5-5 边缘-云协同典型架构</text>
  <text x="84" y="62" font-size="12" fill="#64748B">设备边缘 → 网关边缘 → 区域边缘 → 云端：规则下发（虚线）与聚合上报（实线）两条主链路</text>
  <rect x="1410" y="22" width="150" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1485" y="40" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748B" text-anchor="middle">ARCHITECTURE</text>
  <line x1="40" y1="103" x2="1560" y2="103" stroke="#E2E8F0"/>

  <!-- ===== Left framework rail ===== -->
  <text x="46" y="140" font-size="11" font-weight="700" fill="#475569">边缘框架</text>
  <text x="46" y="156" font-size="9" fill="#94A3B8">典型部署位置</text>
  <line x1="170" y1="150" x2="170" y2="710" stroke="#CBD5E1" stroke-dasharray="3 4"/>
  <!-- tags -->
  <rect x="60" y="172" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#F59E0B"/>
  <text x="110" y="187" font-size="10" fill="#475569" text-anchor="middle">AI 模型训练</text>
  <rect x="60" y="322" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="110" y="337" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">KubeEdge</text>
  <rect x="60" y="472" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="110" y="487" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">EdgeX Foundry</text>
  <rect x="60" y="632" width="100" height="22" rx="4" fill="#FFFFFF" stroke="#10B981"/>
  <text x="110" y="647" font-size="10" fill="#475569" text-anchor="middle">MCU / PLC</text>

  <!-- ===== Cloud region ===== -->
  <rect x="200" y="120" width="1320" height="140" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="216" y="140" font-size="12" font-weight="700" fill="#2563EB">云端域</text>
  <text x="216" y="156" font-size="9" fill="#64748B">全局分析、模型训练与存储</text>

  <!-- rule_push diamond (orange, ai) -->
  <polygon points="570,140 670,185 570,230 470,185" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="570" y="182" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">规则下发</text>
  <text x="570" y="200" font-size="9" fill="#64748B" text-anchor="middle">云端 → 边缘</text>

  <!-- cloud_platform card (blue) -->
  <rect x="900" y="145" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1050" y="173" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">云端平台</text>
  <text x="1050" y="193" font-size="10" fill="#475569" text-anchor="middle">AI训练 + 时序库 + 规则下发</text>
  <text x="1050" y="210" font-size="9" fill="#94A3B8" text-anchor="middle">中心机房 / 云服务器</text>

  <!-- ===== Regional region ===== -->
  <rect x="380" y="280" width="1140" height="130" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="396" y="300" font-size="12" font-weight="700" fill="#10B981">区域 MEC 域</text>
  <text x="396" y="316" font-size="9" fill="#64748B">低时延决策与容器化推理</text>

  <!-- regional_edge card (blue) -->
  <rect x="900" y="305" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1050" y="333" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">区域边缘 (MEC)</text>
  <text x="1050" y="353" font-size="10" fill="#475569" text-anchor="middle">KubeEdge + 容器推理</text>
  <text x="1050" y="370" font-size="9" fill="#94A3B8" text-anchor="middle">MEC 服务器 / 汇聚节点</text>

  <!-- ===== Gateway region ===== -->
  <rect x="380" y="430" width="1140" height="130" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="396" y="450" font-size="12" font-weight="700" fill="#2563EB">网关边界</text>
  <text x="396" y="466" font-size="9" fill="#64748B">协议转换与本地实时控制</text>

  <!-- data_upload cylinder (purple, data) -->
  <path d="M 480 470 L 480 540 A 90 10 0 0 0 660 540 L 660 470 A 90 10 0 0 1 480 470 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <ellipse cx="570" cy="470" rx="90" ry="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="570" y="500" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">聚合上报</text>
  <text x="570" y="517" font-size="9" fill="#64748B" text-anchor="middle">边缘 → 云端</text>

  <!-- gateway_edge card (blue) -->
  <rect x="900" y="455" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1050" y="483" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">网关边缘</text>
  <text x="1050" y="503" font-size="10" fill="#475569" text-anchor="middle">EdgeX + 规则引擎</text>
  <text x="1050" y="520" font-size="9" fill="#94A3B8" text-anchor="middle">工控机 / 智能网关</text>

  <!-- ===== Device region ===== -->
  <rect x="380" y="580" width="1140" height="150" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="396" y="600" font-size="12" font-weight="700" fill="#10B981">现场设备域</text>
  <text x="396" y="616" font-size="9" fill="#64748B">异构传感器与执行器边界</text>

  <!-- device cards (green) -->
  <rect x="820" y="630" width="130" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="885" y="660" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">PLC</text>
  <text x="885" y="680" font-size="9" fill="#64748B" text-anchor="middle">可编程控制器</text>

  <rect x="975" y="630" width="130" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1040" y="660" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">传感器</text>
  <text x="1040" y="680" font-size="9" fill="#64748B" text-anchor="middle">MCU 采集节点</text>

  <rect x="1130" y="630" width="130" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1195" y="660" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">执行器</text>
  <text x="1195" y="680" font-size="9" fill="#64748B" text-anchor="middle">现场执行机构</text>

  <!-- ===== Flows: upload (solid green, bottom-up) on right side ===== -->
  <!-- device -> gateway -->
  <line x1="1195" y1="630" x2="1195" y2="537" stroke="#10B981" stroke-width="2.2" marker-end="url(#ah-green)"/>
  <text x="1208" y="588" font-size="10" fill="#10B981">Modbus/OPC UA</text>

  <!-- gateway -> data_upload (aggregated value) -->
  <line x1="900" y1="495" x2="664" y2="495" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#ah-purple)"/>
  <text x="782" y="486" font-size="10" fill="#7C3AED" text-anchor="middle">聚合值</text>

  <!-- data_upload -> regional (MQTT bridge) -->
  <path d="M 570 470 L 570 345 L 896 345" fill="none" stroke="#10B981" stroke-width="2.2" marker-end="url(#ah-green)"/>
  <text x="585" y="415" font-size="10" fill="#10B981">MQTT 桥接</text>

  <!-- regional -> cloud (long-term storage) -->
  <line x1="1195" y1="305" x2="1195" y2="229" stroke="#10B981" stroke-width="2.2" marker-end="url(#ah-green)"/>
  <text x="1208" y="270" font-size="10" fill="#10B981">长期存储</text>

  <!-- ===== Flows: rule push (dashed orange, top-down) on left side ===== -->
  <!-- rule_push -> regional (rule container) -->
  <path d="M 570 230 L 570 268 L 1050 268 L 1050 303" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah-orange)"/>
  <text x="760" y="260" font-size="10" fill="#F59E0B">规则容器</text>

  <!-- regional -> gateway (proxy push) -->
  <line x1="980" y1="385" x2="980" y2="453" stroke="#F59E0B" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah-orange)"/>
  <text x="892" y="424" font-size="10" fill="#F59E0B" text-anchor="end">代理下发</text>

  <!-- gateway -> device (execute command) -->
  <line x1="1040" y1="535" x2="1040" y2="628" stroke="#F59E0B" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah-orange)"/>
  <text x="1000" y="588" font-size="10" fill="#F59E0B" text-anchor="end">执行指令</text>

  <!-- ===== Callouts ===== -->
  <rect x="380" y="755" width="600" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="394" y="773" font-size="10" fill="#334155">• 规则下发仅在初始或规则更新时触发，执行过程不回云。</text>
  <text x="394" y="789" font-size="10" fill="#334155">• 聚合上报保留趋势信息，减少原始数据带宽消耗。</text>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="820" x2="1560" y2="820" stroke="#E2E8F0"/>
  <text x="48" y="848" font-size="11" font-weight="700" fill="#475569">图例</text>

  <rect x="100" y="838" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="122" y="849" font-size="10" fill="#475569">设备 / 边缘节点</text>

  <rect x="248" y="838" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="270" y="849" font-size="10" fill="#475569">网关 / 云平台</text>

  <rect x="384" y="838" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="406" y="849" font-size="10" fill="#475569">规则 / 智能流</text>

  <rect x="520" y="838" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="542" y="849" font-size="10" fill="#475569">数据聚合</text>

  <line x1="660" y1="844" x2="700" y2="844" stroke="#10B981" stroke-width="2.2" marker-end="url(#ah-green)"/>
  <text x="708" y="849" font-size="10" fill="#475569">数据 / 执行流（实线）</text>

  <line x1="892" y1="844" x2="932" y2="844" stroke="#F59E0B" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ah-orange)"/>
  <text x="940" y="849" font-size="10" fill="#475569">配置 / 指令下发（虚线）</text>

  <!-- ===== Caption ===== -->
  <text x="800" y="980" font-size="10" fill="#94A3B8" text-anchor="middle">图5-5 展示从设备边缘到云端的层次与协同模式，左侧标注 EdgeX / KubeEdge 的典型部署位置。</text>
</svg>
