<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="960" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="47" font-size="22" font-weight="700" fill="#0F172A">图5-5-3-1 Kappa架构示意图</text>
  <text x="88" y="72" font-size="12" fill="#64748B">单一流处理管道兼容实时与历史分析（Kappa Architecture）</text>
  <rect x="1658" y="24" width="118" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1717" y="44" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">DATAFLOW</text>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Region boundaries ===== -->
  <!-- data_domain -->
  <rect x="100" y="150" width="820" height="500" rx="12" fill="none" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="8 4"/>
  <rect x="120" y="138" width="200" height="26" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="220" y="156" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="middle">数据资产域</text>
  <text x="332" y="156" font-size="10" fill="#94A3B8">数据沉淀与治理边界</text>

  <!-- platform_domain -->
  <rect x="960" y="150" width="740" height="500" rx="12" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="8 4"/>
  <rect x="980" y="138" width="200" height="26" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="1080" y="156" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">平台服务域</text>
  <text x="1192" y="156" font-size="10" fill="#94A3B8">核心服务能力边界</text>

  <!-- ===== Components ===== -->
  <!-- r1: 数据源 (database cylinder, data domain purple) -->
  <rect x="135" y="386" width="190" height="88" fill="#FFFFFF"/>
  <line x1="135" y1="386" x2="135" y2="474" stroke="#7C3AED" stroke-width="2"/>
  <line x1="325" y1="386" x2="325" y2="474" stroke="#7C3AED" stroke-width="2"/>
  <path d="M 135 474 A 95 24 0 0 0 325 474" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <ellipse cx="230" cy="386" rx="95" ry="24" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="230" y="424" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">数据源</text>
  <text x="230" y="446" font-size="10" fill="#475569" text-anchor="middle">传感器 / 设备</text>
  <text x="230" y="461" font-size="10" fill="#475569" text-anchor="middle">MQTT 代理</text>

  <!-- r3: 消息总线 (card, data domain purple) -->
  <rect x="580" y="210" width="220" height="84" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="690" y="244" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">消息总线</text>
  <text x="690" y="266" font-size="10" fill="#475569" text-anchor="middle">Kafka Topic</text>
  <text x="690" y="281" font-size="9" fill="#64748B" text-anchor="middle">持久化事件日志</text>

  <!-- r4: 实时流处理 (diamond, platform/primary blue) -->
  <polygon points="1080,340 1220,430 1080,520 940,430" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.4"/>
  <text x="1080" y="424" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">实时流处理</text>
  <text x="1080" y="446" font-size="10" fill="#475569" text-anchor="middle">Flink / Kafka Streams</text>

  <!-- r6: 结果输出 (card, platform blue) -->
  <rect x="1420" y="378" width="200" height="104" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1520" y="410" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">结果输出</text>
  <text x="1520" y="432" font-size="10" fill="#475569" text-anchor="middle">告警系统</text>
  <text x="1520" y="448" font-size="10" fill="#475569" text-anchor="middle">Dashboard</text>
  <text x="1520" y="464" font-size="10" fill="#475569" text-anchor="middle">时序数据库</text>

  <!-- ===== Connections ===== -->
  <!-- 1) 数据源 -> 实时流处理 (实时数据流, main highlighted blue) -->
  <path d="M 325 440 L 932 430" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ah-blue)"/>
  <rect x="548" y="412" width="120" height="20" rx="4" fill="#FFFFFF"/>
  <text x="608" y="426" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">实时数据流</text>

  <!-- 2a) 数据源 -> 消息总线 (持久化入口) -->
  <path d="M 230 386 C 230 330, 480 330, 580 252" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- 2b) 消息总线 -> 实时流处理 (持久化数据流) -->
  <path d="M 800 252 C 940 252, 980 360, 1018 392" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="838" y="312" width="128" height="20" rx="4" fill="#FFFFFF"/>
  <text x="902" y="326" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">持久化数据流</text>

  <!-- 3) 实时流处理 -> 结果输出 (持续输出, main highlighted blue) -->
  <path d="M 1220 430 L 1412 430" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ah-blue)"/>
  <rect x="1276" y="412" width="92" height="20" rx="4" fill="#FFFFFF"/>
  <text x="1322" y="426" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">持续输出</text>

  <!-- 4) 实时流处理 -> 历史回放 self-loop (dashed gray, 事件时间回溯) -->
  <path d="M 1100 510 C 1100 628, 1268 628, 1150 472" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <rect x="1116" y="600" width="148" height="20" rx="4" fill="#FFFFFF"/>
  <text x="1190" y="614" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">历史回放（Time Travel）</text>
  <text x="1190" y="632" font-size="9" fill="#94A3B8" text-anchor="middle">事件时间回溯 replay</text>

  <!-- ===== Callout ===== -->
  <rect x="980" y="660" width="700" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1000" y="684" font-size="11" fill="#334155">主链路：数据源 → 流处理引擎 → 结果输出；历史分析通过回放同一 Kafka Topic 完成，无需离线批管道。</text>

  <!-- ===== Legend ===== -->
  <line x1="60" y1="728" x2="1740" y2="728" stroke="#E2E8F0" stroke-width="1"/>
  <text x="60" y="754" font-size="12" font-weight="700" fill="#475569">图例</text>

  <!-- solid blue arrow -->
  <line x1="120" y1="782" x2="168" y2="782" stroke="#2563EB" stroke-width="2.4" marker-end="url(#ah-blue)"/>
  <text x="184" y="786" font-size="11" fill="#475569">实线 · 实时数据流 / 持续输出</text>

  <!-- dashed gray arrow -->
  <line x1="460" y1="782" x2="508" y2="782" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="524" y="786" font-size="11" fill="#475569">虚线 · 历史数据回放</text>

  <!-- cylinder swatch -->
  <rect x="760" y="775" width="22" height="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <ellipse cx="771" cy="775" rx="11" ry="3.5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="792" y="786" font-size="11" fill="#475569">圆柱 · 数据源 / 数据槽</text>

  <!-- diamond swatch -->
  <polygon points="1000,774 1014,782 1000,790 986,782" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="1024" y="786" font-size="11" fill="#475569">菱形 · 核心计算引擎</text>

  <!-- purple card swatch -->
  <rect x="1240" y="774" width="22" height="16" rx="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="1272" y="786" font-size="11" fill="#475569">紫框 · 数据资产域</text>

  <!-- blue card swatch -->
  <rect x="1430" y="774" width="22" height="16" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="1462" y="786" font-size="11" fill="#475569">蓝框 · 平台服务域</text>

  <!-- ===== Caption ===== -->
  <text x="900" y="838" font-size="10" fill="#94A3B8" text-anchor="middle">Kappa 架构通过单一流处理管道完成所有计算，历史批量分析借由回放流（replay）实现，消除 Lambda 架构并行维护两条管道的成本。</text>
  <text x="900" y="856" font-size="9" fill="#CBD5E1" text-anchor="middle">fig-05-08 · chapter 5 · occurrence 8</text>
</svg>
