<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">从数据采集到告警触发的预测性维护流程</title>
  <desc id="desc">读者应理解从数据采集到告警触发的预测性维护流程中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">从数据采集到告警触发的预测性维护流程</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解从数据采集到告警触发的预测性维护流程中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">FLOWCHART</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="flowchart">
  <!-- 设备层节点（边缘域卡片） -->
  <rect x="125" y="360" width="150" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="200" y="390" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">设备层</text>
  <text x="200" y="415" fill="#475569" font-size="12" text-anchor="middle">电机电流采集</text>

  <!-- 数据管道节点（数据域圆柱） -->
  <rect x="390" y="350" width="120" height="100" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <ellipse cx="450" cy="350" rx="60" ry="15" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="450" y="390" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">数据管道</text>
  <text x="450" y="415" fill="#475569" font-size="12" text-anchor="middle">MQTT+时序DB</text>

  <!-- 模型层节点（智能域卡片） -->
  <rect x="625" y="360" width="150" height="80" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="700" y="390" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">模型层</text>
  <text x="700" y="415" fill="#475569" font-size="12" text-anchor="middle">Prophet预测</text>

  <!-- 评分层节点（平台域卡片） -->
  <rect x="875" y="360" width="150" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="950" y="390" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">评分层</text>
  <text x="950" y="415" fill="#475569" font-size="12" text-anchor="middle">滑动窗口异常评分</text>

  <!-- 决策层节点（智能域菱形） -->
  <polygon points="1140,400 1200,340 1260,400 1200,460" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1200" y="405" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">异常评分?</text>

  <!-- 数据流连线（绿色） -->
  <!-- 设备层 → 数据管道 -->
  <line x1="275" y1="400" x2="390" y2="400" stroke="#10B981" stroke-width="2"/>
  <polygon points="390,400 380,395 380,405" fill="#10B981"/>
  <rect x="310" y="382" width="70" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="345" y="394" fill="#0F172A" font-size="11" text-anchor="middle">电流数据上传</text>

  <!-- 数据管道 → 模型层 -->
  <line x1="510" y1="400" x2="625" y2="400" stroke="#10B981" stroke-width="2"/>
  <polygon points="625,400 635,395 635,405" fill="#10B981"/>
  <rect x="547" y="382" width="70" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="582" y="394" fill="#0F172A" font-size="11" text-anchor="middle">历史数据供训练</text>

  <!-- 模型层 → 评分层 -->
  <line x1="775" y1="400" x2="875" y2="400" stroke="#10B981" stroke-width="2"/>
  <polygon points="875,400 885,395 885,405" fill="#10B981"/>
  <rect x="805" y="382" width="70" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="840" y="394" fill="#0F172A" font-size="11" text-anchor="middle">输出预测区间</text>

  <!-- 评分层 → 决策层 -->
  <line x1="1025" y1="400" x2="1140" y2="400" stroke="#10B981" stroke-width="2"/>
  <polygon points="1140,400 1150,395 1150,405" fill="#10B981"/>
  <rect x="1063" y="382" width="70" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="1098" y="394" fill="#0F172A" font-size="11" text-anchor="middle">传递评分结果</text>

  <!-- 反馈回路（蓝色弧线）决策层 → 模型层 -->
  <path d="M 1140 400 C 1100 250, 800 250, 775 400" fill="none" stroke="#2563EB" stroke-width="2"/>
  <polygon points="775,400 765,395 765,405" fill="#2563EB"/>
  <rect x="870" y="240" width="80" height="16" rx="3" fill="white" opacity="0.9"/>
  <text x="910" y="252" fill="#0F172A" font-size="11" text-anchor="middle">增量更新</text>

  <!-- 反馈回路标签（线上方）已包含 -->
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">绿色箭头为数据流，红色箭头为告警流，蓝色箭头为模型更新流</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图5-16 预测性维护管道数据流示意</text>
</svg>
