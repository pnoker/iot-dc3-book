<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">工厂设备状态监控系统四层架构图（假设场景）</title>
  <desc id="desc">设备数据经边缘处理和消息队列进入云端分析，告警与控制使用独立通道。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">工厂设备状态监控系统四层架构图（假设场景）</text>
  <text x="82" y="70" fill="#64748B" font-size="12">设备数据逐层汇聚，紧急停机保留本地闭环，告警与参数下发使用独立异步通道。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
    <rect x="100" y="130" width="1600" height="110" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
    <rect x="100" y="260" width="1600" height="130" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
    <rect x="100" y="420" width="1600" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="100" y="570" width="1600" height="140" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="1665" y="152" fill="#0F766E" font-size="12" font-weight="600" text-anchor="end">L1 设备层</text>
    <text x="1665" y="282" fill="#0F766E" font-size="12" font-weight="600" text-anchor="end">L2 边缘层</text>
    <text x="1665" y="442" fill="#7C3AED" font-size="12" font-weight="600" text-anchor="end">L3 消息层</text>
    <text x="1665" y="592" fill="#D97706" font-size="12" font-weight="600" text-anchor="end">L4 云与应用层</text>

    <path d="M 800 220 V 240 H 615 V 290" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#bp-arrow-primary)"/>
    <path d="M 1000 220 V 245 H 1275 V 290" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#bp-arrow-primary)"/>
    <path d="M 500 320 H 400" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#bp-arrow)"/>
    <path d="M 285 290 V 235 H 760 V 220" fill="none" stroke="#F97316" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
    <path d="M 730 340 H 830" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#bp-arrow)"/>
    <path d="M 615 290 V 270 H 1275 V 290" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#bp-arrow)"/>

    <path d="M 1275 360 V 395 H 1080 V 445" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#bp-arrow-primary)"/>
    <path d="M 1150 445 V 415 H 1310 V 360" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>

