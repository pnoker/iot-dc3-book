    <path d="M 1545 600 V 550 H 1170 V 515" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>

    <path d="M 390 635 H 480" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#bp-arrow)"/>
    <path d="M 710 635 H 800" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#bp-arrow)"/>
    <path d="M 1030 635 H 1120" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#bp-arrow)"/>
    <path d="M 1350 635 H 1450" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>

    <rect x="650" y="228" width="88" height="18" rx="4" fill="#FFFFFF"/><text x="694" y="241" fill="#0F172A" font-size="10" text-anchor="middle">Modbus RTU</text>
    <rect x="1080" y="382" width="82" height="18" rx="4" fill="#FFFFFF"/><text x="1121" y="395" fill="#0F172A" font-size="10" text-anchor="middle">MQTT 上行</text>
    <rect x="1190" y="402" width="82" height="18" rx="4" fill="#FFFFFF"/><text x="1231" y="415" fill="#0F172A" font-size="10" text-anchor="middle">参数下发</text>
    <rect x="705" y="548" width="82" height="18" rx="4" fill="#FFFFFF"/><text x="746" y="561" fill="#0F172A" font-size="10" text-anchor="middle">告警事件</text>
    <rect x="1345" y="538" width="82" height="18" rx="4" fill="#FFFFFF"/><text x="1386" y="551" fill="#0F172A" font-size="10" text-anchor="middle">下行指令</text>

    <rect x="700" y="150" width="400" height="70" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="900" y="178" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">30× 电机状态节点</text>
    <text x="900" y="200" fill="#475569" font-size="11" text-anchor="middle">加速度 / 温度采集</text>

    <rect x="170" y="290" width="230" height="70" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="285" y="318" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">GPIO</text><text x="285" y="340" fill="#475569" font-size="11" text-anchor="middle">紧急停机输出</text>
    <rect x="500" y="290" width="230" height="70" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="615" y="318" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Node-RED</text><text x="615" y="340" fill="#475569" font-size="11" text-anchor="middle">两级阈值判断</text>
    <rect x="830" y="290" width="230" height="70" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="945" y="318" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">SQLite 缓存</text><text x="945" y="340" fill="#475569" font-size="11" text-anchor="middle">断网续传</text>
    <rect x="1160" y="290" width="230" height="70" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="1275" y="318" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Mosquitto</text><text x="1275" y="340" fill="#475569" font-size="11" text-anchor="middle">MQTT Broker</text>

    <rect x="390" y="445" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="490" y="486" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Kafka 1</text>
    <rect x="700" y="445" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="800" y="486" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Kafka 2</text>
    <rect x="1010" y="445" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="1110" y="486" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Kafka 3</text>

    <rect x="160" y="600" width="230" height="70" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="275" y="628" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">InfluxDB 2.x</text><text x="275" y="650" fill="#475569" font-size="11" text-anchor="middle">时序数据库</text>
    <rect x="480" y="600" width="230" height="70" rx="10" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
    <text x="595" y="628" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">AI 异常检测</text><text x="595" y="650" fill="#475569" font-size="11" text-anchor="middle">孤立森林</text>
    <rect x="800" y="600" width="230" height="70" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="915" y="628" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Grafana</text><text x="915" y="650" fill="#475569" font-size="11" text-anchor="middle">状态仪表盘</text>
    <rect x="1120" y="600" width="230" height="70" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
    <text x="1235" y="628" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">告警服务</text><text x="1235" y="650" fill="#475569" font-size="11" text-anchor="middle">SMTP / 短信 API</text>
    <rect x="1450" y="600" width="190" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="1545" y="640" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">值班工程师</text>
  </g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-weight="600">蓝色实线：设备数据上行</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-weight="600">橙色链路：本地紧急停机闭环</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-weight="600">虚线链路：告警事件与参数下发</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-weight="600" text-anchor="middle">图5-8 工厂设备状态监控系统四层架构图（假设场景）。</text>
</svg>
