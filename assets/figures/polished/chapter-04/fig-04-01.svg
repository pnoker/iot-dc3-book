<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图4‑1 NB‑IoT 网络架构示意</title>
  <desc id="desc">读者应理解图4‑1 NB‑IoT 网络架构示意中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图4‑1 NB‑IoT 网络架构示意</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解图4‑1 NB‑IoT 网络架构示意中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">TOPOLOGY</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="topology">
  <!-- 区域边界 -->
  <rect x="80" y="150" width="1640" height="80" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="90" y="170" font-size="12" fill="#64748B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">终端层</text>
  <rect x="80" y="260" width="1640" height="80" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="90" y="280" font-size="12" fill="#64748B">网络接入层</text>
  <rect x="80" y="370" width="1640" height="120" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="90" y="390" font-size="12" fill="#64748B">核心网层</text>
  <rect x="80" y="520" width="1640" height="80" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="90" y="540" font-size="12" fill="#64748B">IoT平台层</text>
  <rect x="80" y="630" width="1640" height="80" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="90" y="650" font-size="12" fill="#64748B">应用层</text>

  <!-- 箭头连线 -->
  <!-- 上行数据流 (实线蓝色) -->
  <line x1="300" y1="620" x2="300" y2="250" stroke="#2563EB" stroke-width="2"/>
  <polygon points="300,240 295,250 305,250" fill="#2563EB"/>
  <!-- 下行控制流 (虚线青绿) -->
  <line x1="400" y1="240" x2="400" y2="610" stroke="#0F766E" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="400,620 395,610 405,610" fill="#0F766E"/>

  <!-- 接口标签 -->
  <rect x="320" y="235" width="60" height="20" rx="4" fill="white" stroke="#94A3B8" stroke-width="1"/>
  <text x="350" y="249" font-size="11" fill="#0F172A" text-anchor="middle" font-weight="bold">Uu 空口</text>
  <rect x="320" y="345" width="60" height="20" rx="4" fill="white" stroke="#94A3B8" stroke-width="1"/>
  <text x="350" y="359" font-size="11" fill="#0F172A" text-anchor="middle" font-weight="bold">S1 接口</text>
  <rect x="320" y="495" width="60" height="20" rx="4" fill="white" stroke="#94A3B8" stroke-width="1"/>
  <text x="350" y="509" font-size="11" fill="#0F172A" text-anchor="middle" font-weight="bold">SGi 接口</text>

  <!-- 数据流标签 -->
  <rect x="310" y="418" width="80" height="24" rx="4" fill="white" stroke="#64748B" stroke-width="1"/>
  <text x="350" y="434" font-size="12" fill="#0F172A" text-anchor="middle" font-weight="600">上行数据</text>
  <rect x="410" y="418" width="80" height="24" rx="4" fill="white" stroke="#64748B" stroke-width="1"/>
  <text x="450" y="434" font-size="12" fill="#0F172A" text-anchor="middle" font-weight="600">下行指令</text>

  <!-- 终端层组件 -->
  <rect x="690" y="160" width="120" height="60" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="750" cy="175" r="8" fill="none" stroke="#0F766E" stroke-width="2"/>
  <line x1="750" y1="175" x2="750" y2="180" stroke="#0F766E" stroke-width="2"/>
  <text x="750" y="195" font-size="15" fill="#0F172A" text-anchor="middle" font-weight="600">智能水表</text>
  <text x="750" y="212" font-size="11" fill="#475569" text-anchor="middle">NB-IoT模组</text>

  <rect x="840" y="160" width="120" height="60" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="850" y="168" width="16" height="16" rx="2" fill="none" stroke="#0F766E" stroke-width="2"/>
  <text x="900" y="195" font-size="15" fill="#0F172A" text-anchor="middle" font-weight="600">智能井盖</text>
  <text x="900" y="212" font-size="11" fill="#475569" text-anchor="middle">NB-IoT模组</text>

  <rect x="990" y="160" width="120" height="60" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <polygon points="1050,165 1040,180 1060,180" fill="none" stroke="#0F766E" stroke-width="2"/>
  <line x1="1050" y1="180" x2="1050" y2="185" stroke="#0F766E" stroke-width="2"/>
  <text x="1050" y="195" font-size="15" fill="#0F172A" text-anchor="middle" font-weight="600">小型气象站</text>
  <text x="1050" y="212" font-size="11" fill="#475569" text-anchor="middle">NB-IoT模组</text>

  <!-- 接入层组件 -->
  <rect x="800" y="270" width="200" height="60" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <polygon points="900,275 885,290 915,290" fill="none" stroke="#0F766E" stroke-width="2"/>
  <line x1="900" y1="275" x2="900" y2="270" stroke="#0F766E" stroke-width="2"/>
  <text x="900" y="305" font-size="15" fill="#0F172A" text-anchor="middle" font-weight="600">eNodeB (LTE基站)</text>
  <text x="900" y="322" font-size="11" fill="#475569" text-anchor="middle">200 kHz带宽</text>

  <!-- 核心网层组件 -->
  <rect x="640" y="380" width="160" height="50" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="720" y="402" font-size="15" fill="#0F172A" text-anchor="middle" font-weight="600">MME</text>
  <text x="720" y="418" font-size="11" fill="#475569" text-anchor="middle">移动性管理实体</text>

  <rect x="820" y="380" width="160" height="50" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="402" font-size="15" fill="#0F172A" text-anchor="middle" font-weight="600">SGW</text>
  <text x="900" y="418" font-size="11" fill="#475569" text-anchor="middle">服务网关</text>

  <rect x="1000" y="380" width="160" height="50" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1080" y="402" font-size="15" fill="#0F172A" text-anchor="middle" font-weight="600">PGW</text>
  <text x="1080" y="418" font-size="11" fill="#475569" text-anchor="middle">分组数据网网关</text>

  <!-- IoT平台层组件 -->
  <rect x="770" y="530" width="260" height="60" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="800" cy="560" r="8" fill="none" stroke="#D97706" stroke-width="2"/>
  <line x1="800" y1="560" x2="805" y2="555" stroke="#D97706" stroke-width="2"/>
  <line x1="800" y1="560" x2="795" y2="565" stroke="#D97706" stroke-width="2"/>
  <line x1="800" y1="560" x2="805" y2="562" stroke="#D97706" stroke-width="2"/>
  <text x="900" y="555" font-size="15" fill="#0F172A" text-anchor="middle" font-weight="600">IoT平台</text>
  <text x="900" y="575" font-size="11" fill="#475569" text-anchor="middle">设备管理、数据汇聚、API暴露</text>

  <!-- 应用层组件 -->
  <rect x="770" y="640" width="260" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="800" cy="655" r="6" fill="none" stroke="#2563EB" stroke-width="2"/>
  <rect x="795" y="661" width="10" height="10" fill="none" stroke="#2563EB" stroke-width="2"/>
  <circle cx="830" cy="655" r="8" fill="none" stroke="#2563EB" stroke-width="2"/>
  <line x1="830" y1="655" x2="835" y2="650" stroke="#2563EB" stroke-width="2"/>
  <text x="900" y="665" font-size="15" fill="#0F172A" text-anchor="middle" font-weight="600">垂直行业应用</text>
  <text x="900" y="685" font-size="11" fill="#475569" text-anchor="middle">抄表、市政、环境</text>

  <!-- 右上角注释 -->
  <text x="1400" y="140" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">3GPP定义的NB-IoT空口仅支持</text>
  <text x="1400" y="156" font-size="12" fill="#475569">频分双工（FDD）半双工类型</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">浅灰色画布背景，各层用由深到浅蓝色区分：终端层最深，应用层最浅</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头=上行数据流，虚线箭头=下行指令流</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">接口标签使用加粗字体置于箭头旁</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图4‑1 NB‑IoT 从终端到应用的四层网络架构，展示上行数据与下行控制的完整路径，并标注关键 3GPP 接口。</text>
</svg>
