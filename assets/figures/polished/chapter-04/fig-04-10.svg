<svg xmlns="http://www.w3.org/2000/svg" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1600" height="1000" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" font-size="22" font-weight="700" fill="#0F172A">图4-5 IoT DC3 整体架构及驱动层位置</text>
  <text x="82" y="70" font-size="12" fill="#64748B">四层体系（前端 / 核心服务 / 驱动 / 设备）与驱动层的解耦位置、数据上行主链路</text>
  <rect x="1455" y="26" width="118" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1514" y="46" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">ARCHITECTURE</text>
  <line x1="40" y1="103" x2="1560" y2="103" stroke="#E2E8F0"/>

  <!-- ===== Platform region ===== -->
  <rect x="60" y="120" width="1480" height="335" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="76" y="111" width="118" height="20" rx="4" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="135" y="125" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">平台服务域</text>

  <!-- Layer 1: frontend -->
  <text x="90" y="160" font-size="11" font-weight="700" fill="#475569">L1 · 前端应用层</text>
  <rect x="620" y="160" width="360" height="68" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="800" y="190" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Vue.js Admin Console</text>
  <text x="800" y="210" font-size="10" fill="#64748B" text-anchor="middle">设备运维 · 监控大屏 · 规则配置</text>

  <!-- L1 -> L2 main link (blue) -->
  <line x1="800" y1="228" x2="800" y2="298" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="812" y="268" font-size="10" fill="#2563EB">HTTP / WebSocket</text>

  <!-- Layer 2: core services -->
  <text x="90" y="318" font-size="11" font-weight="700" fill="#475569">L2 · 平台核心服务层</text>
  <rect x="90" y="326" width="220" height="24" rx="4" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="200" y="342" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">Nacos + Spring Cloud Gateway</text>

  <!-- 4 service cards -->
  <g font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">
    <rect x="390" y="330" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="510" y="365">设备管理</text>
    <text x="510" y="390" font-size="10" font-weight="400" fill="#64748B">注册 · 影子 · 元模型</text>

    <rect x="670" y="330" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="790" y="365">数据服务</text>
    <text x="790" y="390" font-size="10" font-weight="400" fill="#64748B">时序 · 点表 · 落库</text>

    <rect x="950" y="330" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1070" y="365">告警服务</text>
    <text x="1070" y="390" font-size="10" font-weight="400" fill="#64748B">阈值 · 抑制 · 派单</text>

    <rect x="1230" y="330" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1350" y="365">网关管理</text>
    <text x="1350" y="390" font-size="10" font-weight="400" fill="#64748B">鉴权 · 路由 · 限流</text>
  </g>

  <!-- ===== Edge region ===== -->
  <rect x="60" y="470" width="1480" height="390" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="76" y="461" width="138" height="20" rx="4" fill="#FFFFFF" stroke="#10B981"/>
  <text x="145" y="475" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">设备与边缘域</text>

  <!-- L2 <-> L3 : MQ decoupling (dashed gray) -->
  <line x1="510" y1="412" x2="510" y2="500" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="455" y="460" font-size="10" fill="#475569">下发指令（MQ）</text>
  <line x1="1070" y1="500" x2="1070" y2="412" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1010" y="460" font-size="10" fill="#475569">上报数据（MQ）</text>

  <!-- Layer 3: driver focus box -->
  <rect x="100" y="500" width="1400" height="170" rx="12" fill="#FEF3C7" fill-opacity="0.45" stroke="#F59E0B" stroke-width="3"/>
  <rect x="116" y="491" width="210" height="20" rx="4" fill="#FFFFFF" stroke="#F59E0B"/>
  <text x="221" y="505" font-size="10" font-weight="700" fill="#F59E0B" text-anchor="middle">L3 · 驱动层（独立 JVM 进程 + Driver SDK）</text>

  <!-- 7 driver cards: centers 260,440,620,800,980,1160,1340 -->
  <g>
    <rect x="185" y="555" width="150" height="80" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="260" y="588" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Modbus 驱动</text>
    <text x="260" y="608" font-size="9" fill="#64748B" text-anchor="middle">TCP / RTU</text>
    <text x="260" y="622" font-size="9" fill="#64748B" text-anchor="middle">点采集</text>

    <rect x="365" y="555" width="150" height="80" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="440" y="588" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">LoRa 驱动</text>
    <text x="440" y="608" font-size="9" fill="#64748B" text-anchor="middle">LoRaWAN</text>
    <text x="440" y="622" font-size="9" fill="#64748B" text-anchor="middle">入网 / 解密</text>

    <rect x="545" y="555" width="150" height="80" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="620" y="588" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">NB-IoT 驱动</text>
    <text x="620" y="608" font-size="9" fill="#64748B" text-anchor="middle">CoAP / LwM2M</text>
    <text x="620" y="622" font-size="9" fill="#64748B" text-anchor="middle">低功耗</text>

    <rect x="725" y="555" width="150" height="80" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="800" y="588" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">BLE 驱动</text>
    <text x="800" y="608" font-size="9" fill="#64748B" text-anchor="middle">GATT</text>
    <text x="800" y="622" font-size="9" fill="#64748B" text-anchor="middle">短距接入</text>

    <rect x="905" y="555" width="150" height="80" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="980" y="588" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Zigbee 驱动</text>
    <text x="980" y="608" font-size="9" fill="#64748B" text-anchor="middle">ZCL</text>
    <text x="980" y="622" font-size="9" fill="#64748B" text-anchor="middle">协调器</text>

    <rect x="1085" y="555" width="150" height="80" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="1160" y="588" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">PLC S7 驱动</text>
    <text x="1160" y="608" font-size="9" fill="#64748B" text-anchor="middle">ISO-on-TCP</text>
    <text x="1160" y="622" font-size="9" fill="#64748B" text-anchor="middle">块读写</text>

    <rect x="1265" y="555" width="150" height="80" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="1340" y="588" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">MC 协议驱动</text>
    <text x="1340" y="608" font-size="9" fill="#64748B" text-anchor="middle">三菱串行</text>
    <text x="1340" y="622" font-size="9" fill="#64748B" text-anchor="middle">指令帧</text>
  </g>

  <!-- L3 -> L4 protocol uplinks (green, device -> driver, arrow up) -->
  <g font-size="10" fill="#10B981">
    <line x1="260" y1="775" x2="260" y2="638" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
    <text x="268" y="710" font-size="10" fill="#475569">Modbus TCP</text>

    <line x1="440" y1="775" x2="440" y2="638" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
    <text x="448" y="710" font-size="10" fill="#475569">LoRaWAN</text>

    <line x1="800" y1="775" x2="800" y2="638" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
    <text x="808" y="710" font-size="10" fill="#475569">BLE GATT</text>

    <line x1="1160" y1="775" x2="1160" y2="638" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
    <text x="1168" y="710" font-size="10" fill="#475569">S7comm</text>

    <line x1="1340" y1="775" x2="1340" y2="638" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
    <text x="1348" y="710" font-size="10" fill="#475569">MC 协议</text>
  </g>

  <!-- Layer 4: devices -->
  <text x="90" y="730" font-size="11" font-weight="700" fill="#475569">L4 · 物理设备层</text>
  <g>
    <rect x="200" y="775" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="260" y="802" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">PLC</text>
    <text x="260" y="822" font-size="9" fill="#64748B" text-anchor="middle">控制器</text>

    <rect x="380" y="775" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="440" y="802" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">水表</text>
    <text x="440" y="822" font-size="9" fill="#64748B" text-anchor="middle">智能计量</text>

    <rect x="740" y="775" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="800" y="802" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">传感器</text>
    <text x="800" y="822" font-size="9" fill="#64748B" text-anchor="middle">温湿 / 气体</text>

    <rect x="1100" y="775" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1160" y="802" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">工业仪表</text>
    <text x="1160" y="822" font-size="9" fill="#64748B" text-anchor="middle">电力 / 流量</text>

    <rect x="1280" y="775" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1340" y="802" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">执行器</text>
    <text x="1340" y="822" font-size="9" fill="#64748B" text-anchor="middle">阀门 / 电机</text>
  </g>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="888" x2="1560" y2="888" stroke="#E2E8F0"/>
  <g font-size="11" fill="#475569">
    <rect x="60" y="908" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB"/>
    <text x="84" y="918">蓝 · 平台主链路（前端 → 核心服务）</text>

    <line x1="350" y1="914" x2="380" y2="914" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <text x="392" y="918">灰虚线 · 消息队列异步解耦（MQ）</text>

    <line x1="660" y1="914" x2="690" y2="914" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
    <text x="702" y="918">绿实线 · 协议上行数据（设备 → 驱动）</text>

    <rect x="980" y="908" width="16" height="12" rx="2" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="1004" y="918">橙 · 驱动层焦点（独立 JVM，故障互不影响）</text>
  </g>

  <!-- caption -->
  <text x="800" y="978" font-size="10" fill="#94A3B8" text-anchor="middle">驱动层进程彼此独立、互不依赖，经消息队列与平台核心服务解耦——驱动故障不波及平台主体；新增驱动仅需在驱动层横向加框，其余各层无需变动。</text>
</svg>
