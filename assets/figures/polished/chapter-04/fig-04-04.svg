<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图4-4 协议适配器接口与驱动实现架构</title>
  <desc id="desc">读者应理解协议适配器接口与驱动实现架构中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图4-4 协议适配器接口与驱动实现架构</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解协议适配器接口与驱动实现架构中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
    <!-- 平台服务域边界 -->
    <rect x="80" y="120" width="1640" height="640" rx="14" fill="none" stroke="#D97706" stroke-dasharray="8,4" stroke-width="1.5"/>
    <text x="90" y="140" font-size="14" fill="#0F172A" font-weight="600">平台服务域</text>
    
    <!-- 接口层 -->
    <rect x="600" y="145" width="600" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="900" y="178" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">ProtocolAdapter</text>
    <text x="900" y="200" font-size="14" fill="#64748B" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>

    <!-- 实现类矩形 -->
    <rect x="120" y="280" width="320" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
    <text x="280" y="318" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">ModbusRtuAdapter</text>

    <rect x="500" y="280" width="320" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
    <text x="660" y="318" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">MqttAdapter</text>

    <rect x="880" y="280" width="320" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
    <text x="1040" y="318" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">BluetoothGattAdapter</text>

    <rect x="1260" y="280" width="320" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
    <text x="1420" y="318" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">LoRaWanAdapter</text>

    <!-- 虚线框 -->
    <rect x="120" y="365" width="320" height="60" rx="5" fill="none" stroke="#94A3B8" stroke-dasharray="5,3" stroke-width="1"/>
    <rect x="500" y="365" width="320" height="60" rx="5" fill="none" stroke="#94A3B8" stroke-dasharray="5,3" stroke-width="1"/>
    <rect x="880" y="365" width="320" height="60" rx="5" fill="none" stroke="#94A3B8" stroke-dasharray="5,3" stroke-width="1"/>
    <rect x="1260" y="365" width="320" height="60" rx="5" fill="none" stroke="#94A3B8" stroke-dasharray="5,3" stroke-width="1"/>

