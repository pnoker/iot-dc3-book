    <rect x="120" y="370" width="100" height="40" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <rect x="230" y="370" width="100" height="40" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <rect x="340" y="370" width="100" height="40" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <!-- Mqtt 组件 -->
    <rect x="555" y="370" width="100" height="40" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <rect x="665" y="370" width="100" height="40" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <!-- Bluetooth 组件 -->
    <rect x="880" y="370" width="100" height="40" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <rect x="990" y="370" width="100" height="40" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <rect x="1100" y="370" width="100" height="40" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <!-- LoRa 组件 -->
    <rect x="1260" y="370" width="100" height="40" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <rect x="1370" y="370" width="100" height="40" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <rect x="1480" y="370" width="100" height="40" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>

    <!-- 连线（泛化） -->
    <line x1="900" y1="225" x2="280" y2="280" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="280,280 273,286 287,286" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <line x1="900" y1="225" x2="660" y2="280" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="660,280 653,286 667,286" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <line x1="900" y1="225" x2="1040" y2="280" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="1040,280 1033,286 1047,286" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <line x1="900" y1="225" x2="1420" y2="280" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="1420,280 1413,286 1427,286" fill="none" stroke="#64748B" stroke-width="1.5"/>

    <!-- 连线（组合） -->
    <!-- Modbus 组合菱形和箭头 -->
    <polygon points="280,356 284,360 280,364 276,360" fill="#64748B"/>
    <line x1="280" y1="360" x2="170" y2="370" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="170,370 166,364 174,364" fill="#64748B"/>
    <line x1="280" y1="360" x2="280" y2="370" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="280,370 276,364 284,364" fill="#64748B"/>
    <line x1="280" y1="360" x2="390" y2="370" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="390,370 386,364 394,364" fill="#64748B"/>

    <!-- Mqtt 组合菱形和箭头 -->
    <polygon points="660,356 664,360 660,364 656,360" fill="#64748B"/>
    <line x1="660" y1="360" x2="605" y2="370" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="605,370 601,364 609,364" fill="#64748B"/>
    <line x1="660" y1="360" x2="715" y2="370" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="715,370 711,364 719,364" fill="#64748B"/>

    <!-- Bluetooth 组合菱形和箭头 -->
    <polygon points="1040,356 1044,360 1040,364 1036,360" fill="#64748B"/>
    <line x1="1040" y1="360" x2="930" y2="370" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="930,370 926,364 934,364" fill="#64748B"/>
    <line x1="1040" y1="360" x2="1040" y2="370" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="1040,370 1036,364 1044,364" fill="#64748B"/>
    <line x1="1040" y1="360" x2="1150" y2="370" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="1150,370 1146,364 1154,364" fill="#64748B"/>

    <!-- LoRa 组合菱形和箭头 -->
    <polygon points="1420,356 1424,360 1420,364 1416,360" fill="#64748B"/>
    <line x1="1420" y1="360" x2="1310" y2="370" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="1310,370 1306,364 1314,364" fill="#64748B"/>
    <line x1="1420" y1="360" x2="1420" y2="370" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="1420,370 1416,364 1424,364" fill="#64748B"/>
    <line x1="1420" y1="360" x2="1530" y2="370" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="1530,370 1526,364 1534,364" fill="#64748B"/>

    <!-- 文字 -->
    <text x="170" y="394" font-size="12" fill="#0F172A" text-anchor="middle">SerialPortManager</text>
    <text x="280" y="394" font-size="12" fill="#0F172A" text-anchor="middle">ModbusSlaveTable</text>
    <text x="390" y="394" font-size="12" fill="#0F172A" text-anchor="middle">TimeoutScheduler</text>
    <text x="605" y="394" font-size="12" fill="#0F172A" text-anchor="middle">MqttClient</text>
    <text x="715" y="394" font-size="12" fill="#0F172A" text-anchor="middle">TopicMapper</text>
    <text x="930" y="394" font-size="12" fill="#0F172A" text-anchor="middle">BleScanner</text>
    <text x="1040" y="394" font-size="12" fill="#0F172A" text-anchor="middle">BleGattConnection</text>
    <text x="1150" y="394" font-size="12" fill="#0F172A" text-anchor="middle">GattCharacteristicResolver</text>
    <text x="1310" y="394" font-size="12" fill="#0F172A" text-anchor="middle">LoraNetworkClient</text>
    <text x="1420" y="394" font-size="12" fill="#0F172A" text-anchor="middle">DevAddrMapper</text>
    <text x="1530" y="394" font-size="12" fill="#0F172A" text-anchor="middle">FPortDispatcher</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色：接口定义层，统一抽象</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">青绿色：具体协议驱动实现</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">空心三角箭头：泛化（实现）</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图4-4 协议适配器接口与驱动实现的架构示意。每个具体驱动通过组合持有底层通信组件，对上层只暴露通用接口。</text>
</svg>
