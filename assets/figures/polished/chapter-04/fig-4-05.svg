<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif" text-rendering="geometricPrecision">
  <title>图4-5 Driver SDK 适配器接口与驱动实现</title>
  <desc>Driver SDK 由业务注册、元数据、读写与协议能力接口组成，各协议 Driver 作为独立微服务实现所需 SPI，经 gRPC 与 RabbitMQ 对接 Manager 和 Data。</desc>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="980" fill="#FFFFFF"/>

  <!-- ============ 1. TITLE AREA ============ -->
  <g id="title">
    <circle cx="64" cy="42" r="6" fill="#2563EB"/>
    <text x="84" y="49" font-size="22" font-weight="700" fill="#0F172A">图4-5 Driver SDK 适配器接口与驱动实现</text>
    <text x="84" y="72" font-size="12" fill="#64748B">细粒度能力接口 · 多协议 Driver 独立部署 · gRPC 管理 + RabbitMQ 命令数据流</text>

    <rect x="1620" y="28" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1700" y="47" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">ARCHITECTURE</text>

    <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- ============ 2. BODY : REGION BOUNDARIES ============ -->
  <g id="regions">
    <!-- Driver SDK region (left, core/blue) -->
    <rect x="60" y="125" width="1140" height="665" rx="12" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="8 4"/>
    <rect x="80" y="113" width="220" height="24" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
    <text x="92" y="130" font-size="12" font-weight="700" fill="#2563EB">Driver SDK · 适配器层</text>

    <!-- IoT platform backend region (right, neutral) -->
    <rect x="1260" y="300" width="480" height="490" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="8 4"/>
    <rect x="1280" y="288" width="190" height="24" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="1292" y="305" font-size="12" font-weight="700" fill="#475569">IoT 平台后端</text>
  </g>

  <!-- ============ DRIVER SDK CONTRACTS ============ -->
  <g id="abstract-driver">
    <rect x="100" y="158" width="1060" height="180" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="120" y="188" font-size="17" font-weight="700" fill="#0F172A">Driver SDK 能力接口</text>
    <text x="120" y="210" font-size="11" fill="#64748B">当前没有 AbstractDriver 基类；协议实现按需组合生命周期、元数据、健康、读写与命令能力</text>
    <line x1="120" y1="222" x2="1140" y2="222" stroke="#E2E8F0" stroke-width="1"/>
    <text x="120" y="243" font-size="10" font-weight="700" fill="#2563EB">核心契约 ▸</text>

    <!-- method box 1 · connect -->
    <rect x="120" y="252" width="225" height="70" rx="4" fill="#F8FAFC" stroke="#2563EB" stroke-width="1"/>
    <text x="232.5" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">DriverRegisterService</text>
    <text x="232.5" y="303" text-anchor="middle" font-size="10" fill="#64748B">向 Manager 做业务注册</text>

    <!-- method box 2 · disconnect -->
    <rect x="385" y="252" width="225" height="70" rx="4" fill="#F8FAFC" stroke="#2563EB" stroke-width="1"/>
    <text x="497.5" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">DriverReadService</text>
    <text x="497.5" y="303" text-anchor="middle" font-size="10" fill="#64748B">校验元数据后读取</text>

    <!-- method box 3 · send -->
    <rect x="650" y="252" width="225" height="70" rx="4" fill="#F8FAFC" stroke="#2563EB" stroke-width="1"/>
    <text x="762.5" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">DriverWriteService</text>
    <text x="762.5" y="303" text-anchor="middle" font-size="10" fill="#64748B">校验元数据后写入</text>

    <!-- method box 4 · receive -->
    <rect x="915" y="252" width="225" height="70" rx="4" fill="#F8FAFC" stroke="#2563EB" stroke-width="1"/>
    <text x="1027.5" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">DriverProtocol</text>
    <text x="1027.5" y="303" text-anchor="middle" font-size="10" fill="#64748B">协议相关 read / write</text>
  </g>

  <!-- ============ INHERITANCE TREE (implements) ============ -->
  <g id="implements-tree" fill="none" stroke="#2563EB">
    <!-- trunk up into Driver SDK contracts -->
    <line x1="630" y1="402" x2="630" y2="340" stroke-width="2" marker-end="url(#ah-blue)"/>
    <!-- horizontal branch -->
    <line x1="217.5" y1="402" x2="1042.5" y2="402" stroke-width="1.6"/>
    <!-- drops to each driver -->
    <line x1="217.5" y1="402" x2="217.5" y2="410" stroke-width="1.6"/>
    <line x1="492.5" y1="402" x2="492.5" y2="410" stroke-width="1.6"/>
    <line x1="767.5" y1="402" x2="767.5" y2="410" stroke-width="1.6"/>
    <line x1="1042.5" y1="402" x2="1042.5" y2="410" stroke-width="1.6"/>
  </g>
  <text x="646" y="394" font-size="10" fill="#475569">implements · 各协议 Driver 实现所需能力接口</text>

  <!-- ============ DRIVER MICROSERVICES (4 protocols) ============ -->
  <g id="drivers">
    <!-- Modbus TCP -->
    <g>
      <rect x="100" y="410" width="235" height="200" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <rect x="283" y="420" width="50" height="18" rx="9" fill="#10B981"/>
      <text x="308" y="433" text-anchor="middle" font-size="9" font-weight="600" fill="#FFFFFF">微服务</text>
      <circle cx="124" cy="460" r="5" fill="#10B981"/>
      <text x="138" y="465" font-size="15" font-weight="700" fill="#0F172A">Modbus TCP</text>
      <text x="124" y="487" font-size="10" fill="#64748B">协议驱动适配器</text>
      <line x1="118" y1="499" x2="317" y2="499" stroke="#E2E8F0" stroke-width="1"/>
      <text x="124" y="517" font-size="9" fill="#94A3B8">实现所需 SPI</text>
      <text x="128" y="537" font-size="10" fill="#10B981">✓ read()</text>
      <text x="128" y="555" font-size="10" fill="#10B981">✓ write()</text>
      <text x="128" y="573" font-size="10" fill="#10B981">✓ lifecycle</text>
      <text x="128" y="591" font-size="10" fill="#10B981">✓ health</text>
    </g>

    <!-- OPC UA -->
    <g>
      <rect x="375" y="410" width="235" height="200" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <rect x="558" y="420" width="50" height="18" rx="9" fill="#10B981"/>
      <text x="583" y="433" text-anchor="middle" font-size="9" font-weight="600" fill="#FFFFFF">微服务</text>
      <circle cx="399" cy="460" r="5" fill="#F59E0B"/>
      <text x="413" y="465" font-size="15" font-weight="700" fill="#0F172A">OPC UA</text>
      <text x="399" y="487" font-size="10" fill="#64748B">协议驱动适配器</text>
      <line x1="393" y1="499" x2="592" y2="499" stroke="#E2E8F0" stroke-width="1"/>
      <text x="399" y="517" font-size="9" fill="#94A3B8">实现所需 SPI</text>
      <text x="403" y="537" font-size="10" fill="#10B981">✓ read()</text>
      <text x="403" y="555" font-size="10" fill="#10B981">✓ write()</text>
      <text x="403" y="573" font-size="10" fill="#10B981">✓ lifecycle</text>
      <text x="403" y="591" font-size="10" fill="#10B981">✓ health</text>
    </g>

    <!-- MQTT -->
    <g>
      <rect x="650" y="410" width="235" height="200" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <rect x="833" y="420" width="50" height="18" rx="9" fill="#10B981"/>
      <text x="858" y="433" text-anchor="middle" font-size="9" font-weight="600" fill="#FFFFFF">微服务</text>
      <circle cx="674" cy="460" r="5" fill="#2563EB"/>
      <text x="688" y="465" font-size="15" font-weight="700" fill="#0F172A">MQTT</text>
      <text x="674" y="487" font-size="10" fill="#64748B">协议驱动适配器</text>
      <line x1="668" y1="499" x2="867" y2="499" stroke="#E2E8F0" stroke-width="1"/>
      <text x="674" y="517" font-size="9" fill="#94A3B8">实现所需 SPI</text>
      <text x="678" y="537" font-size="10" fill="#10B981">✓ read()</text>
      <text x="678" y="555" font-size="10" fill="#10B981">✓ write()</text>
      <text x="678" y="573" font-size="10" fill="#10B981">✓ lifecycle</text>
      <text x="678" y="591" font-size="10" fill="#10B981">✓ health</text>
    </g>

    <!-- BACnet -->
    <g>
      <rect x="925" y="410" width="235" height="200" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <rect x="1108" y="420" width="50" height="18" rx="9" fill="#10B981"/>
      <text x="1133" y="433" text-anchor="middle" font-size="9" font-weight="600" fill="#FFFFFF">微服务</text>
      <circle cx="949" cy="460" r="5" fill="#7C3AED"/>
      <text x="963" y="465" font-size="15" font-weight="700" fill="#0F172A">BACnet</text>
      <text x="949" y="487" font-size="10" fill="#64748B">协议驱动适配器</text>
      <line x1="943" y1="499" x2="1142" y2="499" stroke="#E2E8F0" stroke-width="1"/>
      <text x="949" y="517" font-size="9" fill="#94A3B8">实现所需 SPI</text>
      <text x="953" y="537" font-size="10" fill="#10B981">✓ read()</text>
      <text x="953" y="555" font-size="10" fill="#10B981">✓ write()</text>
      <text x="953" y="573" font-size="10" fill="#10B981">✓ lifecycle</text>
      <text x="953" y="591" font-size="10" fill="#10B981">✓ health</text>
    </g>
  </g>

  <!-- ============ CH.14 ENTRY CALLOUT (points to Modbus) ============ -->
  <g id="callout-entry">
    <line x1="217.5" y1="610" x2="217.5" y2="650" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="100" y="650" width="520" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="100" y="650" width="6" height="74" fill="#F59E0B"/>
    <text x="124" y="678" font-size="12" font-weight="700" fill="#F59E0B">▸ 第 14 章实战入口</text>
    <text x="124" y="700" font-size="10" fill="#334155">从 DriverProtocol 的 read/write 入手，再接入业务注册、元数据缓存与 RabbitMQ 消息链路。</text>
  </g>

  <!-- ============ MESSAGE QUEUE (cylinder) ============ -->
  <g id="message-queue">
    <!-- bottom ellipse (full, back) -->
    <ellipse cx="1500" cy="590" rx="200" ry="24" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2"/>
    <!-- body fill covers upper half of bottom ellipse -->
    <rect x="1300" y="420" width="400" height="170" fill="#F8FAFC"/>
    <!-- side lines -->
    <line x1="1300" y1="420" x2="1300" y2="590" stroke="#7C3AED" stroke-width="2"/>
    <line x1="1700" y1="420" x2="1700" y2="590" stroke="#7C3AED" stroke-width="2"/>
    <!-- top ellipse (front) -->
    <ellipse cx="1500" cy="420" rx="200" ry="24" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>

    <text x="1500" y="492" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">消息队列</text>
    <text x="1500" y="512" text-anchor="middle" font-size="10" fill="#64748B">RabbitMQ · 当前唯一消息总线</text>

    <!-- topic chips -->
    <rect x="1340" y="533" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
    <text x="1405" y="549" text-anchor="middle" font-size="9" fill="#7C3AED">point.value / state</text>
    <rect x="1490" y="533" width="150" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
    <text x="1565" y="549" text-anchor="middle" font-size="9" fill="#7C3AED">point.command / result</text>
  </g>

  <!-- ============ DATA FLOW ARROWS ============ -->
  <g id="flows">
    <!-- publish: drivers region -> message queue -->
    <line x1="1200" y1="510" x2="1296" y2="510" stroke="#2563EB" stroke-width="2.4" marker-end="url(#ah-blue)"/>
    <text x="1248" y="502" text-anchor="middle" font-size="10" fill="#475569">publish · 各驱动上报</text>

    <!-- subscribe: MQ -> platform (down) -->
    <line x1="1460" y1="618" x2="1460" y2="664" stroke="#2563EB" stroke-width="2.4" marker-end="url(#ah-blue)"/>
    <text x="1452" y="645" text-anchor="end" font-size="10" fill="#475569">subscribe</text>

    <!-- downstream control: platform -> MQ (up, async) -->
    <line x1="1540" y1="664" x2="1540" y2="618" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <text x="1548" y="645" font-size="10" fill="#64748B">下行控制</text>
  </g>

  <!-- ============ IoT PLATFORM ============ -->
  <g id="platform">
    <rect x="1300" y="668" width="400" height="120" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1500" y="698" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Manager / Data</text>
    <text x="1500" y="718" text-anchor="middle" font-size="10" fill="#64748B">gRPC 元数据 · RabbitMQ 命令 / 位号值</text>
    <line x1="1320" y1="730" x2="1680" y2="730" stroke="#E2E8F0" stroke-width="1"/>

    <rect x="1330" y="743" width="104" height="26" rx="4" fill="#F8FAFC" stroke="#2563EB" stroke-width="1"/>
    <text x="1382" y="760" text-anchor="middle" font-size="9" fill="#2563EB">Manager</text>
    <rect x="1448" y="743" width="104" height="26" rx="4" fill="#F8FAFC" stroke="#2563EB" stroke-width="1"/>
    <text x="1500" y="760" text-anchor="middle" font-size="9" fill="#2563EB">Data</text>
    <rect x="1566" y="743" width="104" height="26" rx="4" fill="#F8FAFC" stroke="#2563EB" stroke-width="1"/>
    <text x="1618" y="760" text-anchor="middle" font-size="9" fill="#2563EB">PostgreSQL</text>
  </g>

  <!-- ============ 3. LEGEND ============ -->
  <g id="legend" font-size="11" fill="#475569">
    <rect x="60" y="822" width="1680" height="1" fill="#E2E8F0"/>

    <rect x="80" y="840" width="24" height="14" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="114" y="852">核心契约 · 主链路</text>

    <rect x="420" y="840" width="24" height="14" rx="3" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="454" y="852">边缘驱动（设备接入）</text>

    <rect x="760" y="840" width="24" height="14" rx="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="794" y="852">消息队列 · 数据解耦</text>

    <line x1="1100" y1="847" x2="1136" y2="847" stroke="#2563EB" stroke-width="2.4"/>
    <text x="1146" y="852">上行 publish / subscribe</text>

    <line x1="1450" y1="847" x2="1486" y2="847" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="1496" y="852">下行控制（异步回传）</text>
  </g>

  <!-- ============ 4. CAPTION ============ -->
  <text x="900" y="935" text-anchor="middle" font-size="11" fill="#94A3B8">图4-5 Driver SDK：协议 Driver 按需实现细粒度能力接口，经 gRPC 对接 Manager，并通过 RabbitMQ 与 Data 交换命令、回执和位号值。</text>
</svg>
