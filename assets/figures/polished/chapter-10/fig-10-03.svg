<rect x="0" y="0" width="1800" height="720" fill="#FFFFFF"/>
<circle cx="64" cy="40" r="6" fill="#2563EB"/>
<text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图10-3 三类维护策略长期运营效率对比（示意）</text>
<text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">成本（柱）与设备可用率（线）随运行周期的变化——预测性维护取得最优平衡</text>
<rect x="1660" y="28" width="80" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
