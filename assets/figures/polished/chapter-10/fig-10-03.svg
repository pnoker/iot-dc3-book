<text x="104" y="660" fill="#64748B" font-size="11" font-weight="600">被动维护（成本柱）</text>
<rect x="260" y="650" width="16" height="12" rx="2" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
<text x="284" y="660" fill="#64748B" font-size="11" font-weight="600">预防性维护</text>
<rect x="420" y="650" width="16" height="12" rx="2" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
<text x="444" y="660" fill="#64748B" font-size="11" font-weight="600">预测性维护</text>
<line x1="600" y1="656" x2="640" y2="656" stroke="#E11D48" stroke-width="2.5"/>
<text x="648" y="660" fill="#64748B" font-size="11" font-weight="600">被动·可用率骤降</text>
<line x1="820" y1="656" x2="860" y2="656" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="868" y="660" fill="#64748B" font-size="11" font-weight="600">预防·缓慢下滑</text>
<line x1="1030" y1="656" x2="1070" y2="656" stroke="#10B981" stroke-width="2.5" stroke-dasharray="12 4 3 4"/>
<text x="1078" y="660" fill="#64748B" font-size="11" font-weight="600">预测·长期高位</text>

<text x="900" y="700" fill="#94A3B8" font-size="10" text-anchor="middle">图10-3 三类维护策略效率对比（示意，纵轴仅高/中/低不含精确数值）：被动维护成本攀升、可用率骤降；预防性成本波动、可用率缓降；预测性成本稳定低位、可用率长期高位——代价是前期传感与建模投入。</text>
</svg>
