<text x="185" y="200" fill="#94A3B8" font-size="10" text-anchor="end">高</text>
<text x="185" y="365" fill="#94A3B8" font-size="10" text-anchor="end">中</text>
<text x="185" y="555" fill="#94A3B8" font-size="10" text-anchor="end">低</text>

