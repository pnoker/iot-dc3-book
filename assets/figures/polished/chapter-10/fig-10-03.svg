<line x1="200" y1="560" x2="1600" y2="560" stroke="#64748B" stroke-width="1.5"/>
<line x1="200" y1="160" x2="200" y2="560" stroke="#64748B" stroke-width="1.5"/>
<line x1="1600" y1="160" x2="1600" y2="560" stroke="#64748B" stroke-width="1.5"/>
<text x="160" y="360" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle" transform="rotate(-90 160 360)">运营成本</text>
<text x="1660" y="360" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle" transform="rotate(90 1660 360)">设备可用率</text>
