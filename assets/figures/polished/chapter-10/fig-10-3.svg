  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图10-3 三类维护策略效率对比（示意）。本图展示三种维护策略在长期运营中的成本与可用率相对趋势：被动维护成本快速攀升、可用率骤降；预防性维护成本周期性波动、可用率缓慢下滑；预测性维护成本逐步稳定、可用率长期维持高位。</text>
