<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1060" fill="#FFFFFF"/>

  <!-- ============ TITLE ============ -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图10-2 Modbus/OPC UA 工业分层采集链路</text>
  <text x="84" y="72" font-size="12" fill="#64748B">工业现场三层采集：现场总线 / 无线传感 → 边缘网关协议转换 → 平台驱动归一为带语义的 PointValue</text>

  <!-- type label -->
  <rect x="1658" y="26" width="114" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="1715" y="45" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">TOPOLOGY</text>

  <!-- separator -->
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ============ LAYER ③ PLATFORM ============ -->
  <rect x="90" y="135" width="1620" height="260" rx="12" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="8 4"/>
  <rect x="108" y="123" width="232" height="26" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="224" y="141" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">③ 平台层 · IoT 平台多协议驱动</text>

  <!-- driver sub-box -->
  <rect x="150" y="195" width="1100" height="180" rx="10" fill="#F8FAFC" stroke="#93C5FD" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="168" y="215" font-size="11" font-weight="700" fill="#2563EB">多协议驱动层 · 屏蔽协议异构性，统一归一为 PointValue</text>

  <!-- Modbus driver -->
  <rect x="190" y="225" width="260" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="320" y="252" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Modbus 驱动</text>
  <text x="320" y="274" font-size="11" fill="#475569" text-anchor="middle">寄存器轮询 · 协议本身无语义</text>
  <text x="320" y="293" font-size="9" fill="#94A3B8" text-anchor="middle">holding 40001 / input 30001</text>

  <!-- OPC UA driver -->
  <rect x="190" y="320" width="260" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="320" y="347" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">OPC UA 驱动</text>
  <text x="320" y="369" font-size="11" fill="#475569" text-anchor="middle">订阅信息模型 · 原生带语义</text>
  <text x="320" y="388" font-size="9" fill="#94A3B8" text-anchor="middle">PubSub over MQTT 订阅</text>

  <!-- convergence: PointValue -->
  <rect x="560" y="270" width="300" height="85" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="710" y="298" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">语义归一 → PointValue</text>
  <text x="710" y="320" font-size="11" fill="#475569" text-anchor="middle">协议无关统一抽象</text>
  <text x="710" y="340" font-size="9" fill="#94A3B8" text-anchor="middle">name / type / unit / quality / ts</text>

  <!-- Modbus -> PointValue -->
  <line x1="450" y1="265" x2="556" y2="295" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <!-- OPC UA -> PointValue -->
  <line x1="450" y1="360" x2="556" y2="330" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <!-- contrast annotations on the two feed arrows -->
  <text x="468" y="262" font-size="9" fill="#94A3B8">需点表补语义</text>
  <text x="468" y="378" font-size="9" fill="#94A3B8">信息模型自带</text>

  <!-- data center cylinder -->
  <ellipse cx="1430" cy="235" rx="95" ry="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <path d="M 1335 235 L 1335 375 A 95 16 0 0 0 1525 375 L 1525 235" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <ellipse cx="1430" cy="235" rx="95" ry="16" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="1430" y="270" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">数据中心</text>
  <text x="1430" y="300" font-size="11" fill="#475569" text-anchor="middle">PointValue 时序库</text>
  <text x="1430" y="330" font-size="10" fill="#64748B" text-anchor="middle">(带语义 / 时序)</text>

  <!-- PointValue -> data center -->
  <line x1="860" y1="312" x2="1333" y2="305" stroke="#7C3AED" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="1095" y="298" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">PointValue（带语义）</text>

  <!-- ============ LAYER ② EDGE / GATEWAY ============ -->
  <rect x="240" y="465" width="860" height="165" rx="12" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="8 4"/>
  <rect x="258" y="453" width="300" height="26" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="408" y="471" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">② 边缘层 · PLC / 边缘网关</text>

  <!-- PLC -->
  <rect x="320" y="505" width="320" height="100" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="480" y="538" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">PLC（可编程控制器）</text>
  <text x="480" y="561" font-size="11" fill="#475569" text-anchor="middle">本地协议转换 · 寄存器映射</text>
  <text x="480" y="583" font-size="9" fill="#94A3B8" text-anchor="middle">Modbus RTU 主站 / 4-20mA AI 模块</text>

  <!-- edge gateway -->
  <rect x="700" y="505" width="340" height="100" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="870" y="538" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">边缘网关</text>
  <text x="870" y="561" font-size="11" fill="#475569" text-anchor="middle">OPC UA 服务端 · 协议转换</text>
  <text x="870" y="583" font-size="9" fill="#94A3B8" text-anchor="middle">汇聚 PLC/仪表，PubSub over MQTT 上报</text>

  <!-- PLC -> gateway -->
  <line x1="640" y1="555" x2="696" y2="555" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="668" y="546" font-size="9" fill="#94A3B8" text-anchor="middle">内部映射</text>

  <!-- ============ LAYER ① FIELD ============ -->
  <rect x="90" y="705" width="1620" height="225" rx="12" fill="none" stroke="#10B981" stroke-width="1.6" stroke-dasharray="8 4"/>
  <rect x="108" y="693" width="250" height="26" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.4"/>
  <text x="233" y="711" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">① 现场层 · 设备 / 仪表 / 无线传感</text>

  <!-- Modbus slaves -->
  <rect x="180" y="775" width="260" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="310" y="809" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Modbus 从站</text>
  <text x="310" y="833" font-size="11" fill="#475569" text-anchor="middle">变频器 / 电表 / 下位 PLC</text>
  <text x="310" y="855" font-size="9" fill="#94A3B8" text-anchor="middle">Modbus RTU / TCP · 仅寄存器号</text>

  <!-- 4-20mA -->
  <rect x="490" y="775" width="260" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="620" y="809" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">4-20mA 仪表</text>
  <text x="620" y="833" font-size="11" fill="#475569" text-anchor="middle">压力 / 液位 / 温度变送器</text>
  <text x="620" y="855" font-size="9" fill="#94A3B8" text-anchor="middle">模拟量电流环 · 无协议语义</text>

  <!-- 5G RedCap -->
  <rect x="1420" y="775" width="280" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1560" y="809" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">5G RedCap 无线传感</text>
  <text x="1560" y="833" font-size="11" fill="#475569" text-anchor="middle">难布线场景 · 无线接入</text>
  <text x="1560" y="855" font-size="9" fill="#94A3B8" text-anchor="middle">IP 直连平台驱动 · 旁路网关</text>

  <!-- ============ CROSS-LAYER ARROWS ============ -->
  <!-- Modbus slave -> PLC (solid blue, wired) -->
  <polyline points="310,775 310,665 380,665 380,609" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="318" y="700" font-size="10" fill="#475569">Modbus RTU</text>

  <!-- 4-20mA -> PLC (solid blue, wired) -->
  <polyline points="620,775 620,665 560,665 560,609" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="570" y="700" font-size="10" fill="#475569">4-20mA AI</text>

  <!-- gateway -> OPC UA driver (solid blue, OPC UA uplink) -->
  <polyline points="870,505 870,420 320,420 320,404" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="595" y="411" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">OPC UA · PubSub over MQTT 上报</text>

  <!-- 5G RedCap -> platform driver (dashed gray, wireless bypass) -->
  <polyline points="1560,775 1560,450 1150,450 1150,379" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="1355" y="442" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">5G RedCap 无线回传（旁路网关）</text>

  <!-- ============ LEGEND ============ -->
  <line x1="60" y1="955" x2="1740" y2="955" stroke="#E2E8F0" stroke-width="1"/>

  <line x1="150" y1="985" x2="196" y2="985" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="206" y="989" font-size="11" fill="#475569">主链路 / 协议上报</text>

  <line x1="420" y1="985" x2="466" y2="985" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="476" y="989" font-size="11" fill="#475569">无线回传（5G RedCap · 旁路网关）</text>

  <rect x="828" y="979" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="852" y="989" font-size="11" fill="#475569">现场设备（edge 域）</text>

  <rect x="1040" y="979" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1064" y="989" font-size="11" fill="#475569">平台 / 网关组件</text>

  <ellipse cx="1272" cy="980" rx="10" ry="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <path d="M 1262 980 L 1262 992 A 10 3 0 0 0 1282 992 L 1282 980" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="1290" y="989" font-size="11" fill="#475569">数据 / 存储（data 域）</text>

  <!-- ============ CAPTION ============ -->
  <text x="900" y="1030" font-size="10" fill="#94A3B8" text-anchor="middle">图10-2 Modbus 补不上语义、OPC UA 补上了，二者共存而非替代；5G RedCap 解决难布线场景的无线接入，平台通过驱动层屏蔽协议异构性。</text>
</svg>
