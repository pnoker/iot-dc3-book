<svg xmlns="http://www.w3.org/2000/svg" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif" width="1800" height="1030" viewBox="0 0 1800 1030">
  <rect x="0" y="0" width="1800" height="1030" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-orange-s" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0,0 3.5,10 7" fill="#F59E0B"/></marker>
  </defs>

  <!-- ===== 标题区 ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" font-size="22" font-weight="700" fill="#0F172A">图10-7 IoT DC3平台微服务架构</text>
  <text x="82" y="70" font-size="12" fill="#64748B">五层结构 · 端到端数据闭环 · 模块职责边界</text>

  <rect x="1620" y="24" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1695" y="44" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">ARCHITECTURE</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 层级边界框 ===== -->
  <!-- L5 业务应用层 -->
  <rect x="150" y="110" width="1580" height="100" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="160" y="118" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="220" y="133" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">业务应用层</text>

  <!-- L4 智能决策层 -->
  <rect x="150" y="235" width="1580" height="100" rx="12" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="160" y="243" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="220" y="258" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle">智能决策层</text>

  <!-- L3 平台服务层 -->
  <rect x="150" y="365" width="1580" height="100" rx="12" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="160" y="373" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="220" y="388" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">平台服务层</text>

  <!-- L2 驱动接入层 -->
  <rect x="150" y="500" width="1580" height="100" rx="12" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="160" y="508" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="220" y="523" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">驱动接入层</text>

  <!-- L1 物理设备层 -->
  <rect x="150" y="635" width="1580" height="100" rx="12" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="160" y="643" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="220" y="658" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">物理设备层</text>

  <!-- ===== L1 物理设备节点 ===== -->
  <g>
    <circle cx="420" cy="685" r="42" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="420" y="690" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">PLC</text>
  </g>
  <g>
    <circle cx="720" cy="685" r="42" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="720" y="690" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">传感器</text>
  </g>
  <g>
    <circle cx="1020" cy="685" r="42" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1020" y="690" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">RTU</text>
  </g>
  <g>
    <circle cx="1320" cy="685" r="42" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1320" y="682" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">边缘</text>
    <text x="1320" y="697" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">网关</text>
  </g>

  <!-- ===== L2 驱动接入 ===== -->
  <g>
    <rect x="500" y="510" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="620" y="540" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Modbus 驱动</text>
    <text x="620" y="560" font-size="10" fill="#64748B" text-anchor="middle">Modbus TCP / RTU 实例</text>
  </g>
  <g>
    <rect x="960" y="510" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1080" y="540" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">OPC UA 驱动</text>
    <text x="1080" y="560" font-size="10" fill="#64748B" text-anchor="middle">OPC UA 独立实例</text>
  </g>

  <!-- ===== L3 平台服务 ===== -->
  <!-- 设备中心 -->
  <g>
    <rect x="360" y="380" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="480" y="410" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">设备中心</text>
    <text x="480" y="430" font-size="10" fill="#64748B" text-anchor="middle">注册 · 物模型 · 驱动映射</text>
  </g>
  <!-- 数据中心 (圆柱体) -->
  <g>
    <ellipse cx="900" cy="380" rx="100" ry="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <path d="M 800 380 L 800 450" stroke="#7C3AED" stroke-width="2" fill="none"/>
    <path d="M 1000 380 L 1000 450" stroke="#7C3AED" stroke-width="2" fill="none"/>
    <path d="M 800 450 A 100 12 0 0 0 1000 450" stroke="#7C3AED" stroke-width="2" fill="none"/>
    <path d="M 800 380 A 100 12 0 0 0 1000 380" stroke="#7C3AED" stroke-width="1" fill="none" opacity="0.5"/>
    <text x="900" y="412" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">数据中心</text>
    <text x="900" y="432" font-size="10" fill="#64748B" text-anchor="middle">时序入库 · 消息路由</text>
  </g>
  <!-- 规则引擎 -->
  <g>
    <rect x="1260" y="380" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1380" y="410" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">规则引擎</text>
    <text x="1380" y="430" font-size="10" fill="#64748B" text-anchor="middle">ECA · 告警 · 命令下发</text>
  </g>

  <!-- ===== L4 智能决策 ===== -->
  <g>
    <rect x="760" y="250" width="280" height="70" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="900" y="280" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">智能中心</text>
    <text x="900" y="300" font-size="10" fill="#64748B" text-anchor="middle">Agent 编排 · LLM 推理 · @Tool 绑定</text>
  </g>

  <!-- ===== L5 业务应用 ===== -->
  <g>
    <rect x="360" y="125" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="480" y="155" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">MES / ERP</text>
    <text x="480" y="175" font-size="10" fill="#64748B" text-anchor="middle">业务系统集成</text>
  </g>
  <g>
    <rect x="780" y="125" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="900" y="155" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">预测性维护</text>
    <text x="900" y="175" font-size="10" fill="#64748B" text-anchor="middle">健康度分析应用</text>
  </g>
  <g>
    <rect x="1260" y="125" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="1380" y="155" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">运维告警台</text>
    <text x="1380" y="175" font-size="10" fill="#64748B" text-anchor="middle">告警可视化 · 处置</text>
  </g>

  <!-- ===== 连接 ===== -->
  <!-- 1. 设备 → 驱动 协议接入 (绿实线) -->
  <line x1="430" y1="645" x2="600" y2="582" stroke="#10B981" stroke-width="1.8" marker-end="url(#ah-green)"/>
  <line x1="710" y1="645" x2="640" y2="582" stroke="#10B981" stroke-width="1.8" marker-end="url(#ah-green)"/>
  <line x1="1010" y1="645" x2="1060" y2="582" stroke="#10B981" stroke-width="1.8" marker-end="url(#ah-green)"/>
  <line x1="1310" y1="645" x2="1100" y2="582" stroke="#10B981" stroke-width="1.8" marker-end="url(#ah-green)"/>
  <text x="870" y="618" font-size="11" fill="#10B981" text-anchor="middle" font-weight="600">协议接入</text>

  <!-- 2. 驱动 → 数据中心 PointValue推送 (灰虚线 异步) -->
  <line x1="620" y1="510" x2="840" y2="455" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <line x1="1080" y1="510" x2="960" y2="455" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="700" y="490" font-size="11" fill="#64748B" text-anchor="middle">PointValue 推送 (MQTT)</text>

  <!-- 3. 数据中心 → 规则引擎 实时数据流 (蓝实线 主链路) -->
  <line x1="1000" y1="415" x2="1256" y2="415" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ah-blue)"/>
  <text x="1128" y="406" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="600">实时数据流</text>

  <!-- 6. 数据中心 → 设备中心 物模型查询 (紫虚线) -->
  <line x1="800" y1="415" x2="604" y2="415" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-purple)"/>
  <text x="702" y="434" font-size="11" fill="#7C3AED" text-anchor="middle">物模型查询</text>

  <!-- 4. 规则引擎 → 智能中心 快判转深析 (橙虚线) -->
  <line x1="1320" y1="380" x2="1044" y2="305" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <text x="1200" y="332" font-size="11" fill="#F59E0B" text-anchor="middle" font-weight="600">快判转深析</text>

  <!-- 5. 智能中心 ↔ 数据中心 @Tool 上下文 (橙虚线 双向) -->
  <line x1="900" y1="322" x2="900" y2="376" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-orange)" marker-start="url(#ah-orange-s)"/>
  <text x="950" y="354" font-size="11" fill="#F59E0B">@Tool 读写</text>

  <!-- 7. 规则引擎 → 运维告警台 HTTP回调 (蓝实线) -->
  <line x1="1380" y1="378" x2="1380" y2="197" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1416" y="290" font-size="11" fill="#2563EB" font-weight="600">HTTP 回调</text>

  <!-- ===== callouts ===== -->
  <g>
    <rect x="150" y="760" width="760" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="166" y="782" font-size="11" fill="#334155" font-weight="700">工程取舍</text>
    <text x="166" y="800" font-size="11" fill="#334155">规则引擎与智能中心之间用虚线分隔：快判不过 AI，深析不做毫秒响应，避免热点链路耦合。</text>
  </g>
  <g>
    <rect x="930" y="760" width="800" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="946" y="782" font-size="11" fill="#334155" font-weight="700">枢纽警示</text>
    <text x="946" y="800" font-size="11" fill="#334155">数据中心是数据流枢纽，同时服务规则引擎与智能中心，需关注写入带宽与消息反压瓶颈。</text>
  </g>
  <g>
    <rect x="540" y="826" width="720" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="556" y="848" font-size="11" fill="#334155" font-weight="700">配置旁路</text>
    <text x="556" y="866" font-size="11" fill="#334155">设备中心不参与运行时数据流，仅在物模型 / 驱动映射变更时影响驱动行为。</text>
  </g>

  <!-- ===== 分隔线 ===== -->
  <line x1="40" y1="895" x2="1760" y2="895" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 图例 ===== -->
  <text x="64" y="920" font-size="12" font-weight="700" fill="#0F172A">图例</text>
  <g font-size="11" fill="#475569">
    <rect x="120" y="911" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="142" y="921">平台服务</text>

    <rect x="230" y="911" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="252" y="921">设备接入 / 驱动</text>

    <rect x="380" y="911" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="402" y="921">AI 智能能力</text>

    <rect x="510" y="911" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="532" y="921">数据资产</text>

    <rect x="620" y="911" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <text x="642" y="921">外部应用</text>

    <line x1="730" y1="917" x2="772" y2="917" stroke="#2563EB" stroke-width="2.2"/>
    <text x="780" y="921">同步 / 强依赖</text>

    <line x1="900" y1="917" x2="942" y2="917" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="950" y="921">异步消息 / 可选依赖</text>
  </g>
  <g font-size="11" fill="#475569">
    <circle cx="128" cy="953" r="7" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="142" y="957">物理设备节点</text>

    <rect x="248" y="946" width="20" height="14" rx="0" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="276" y="957">圆柱体 = 数据 / 存储库</text>

    <rect x="448" y="946" width="20" height="14" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="476" y="957">callout 说明</text>
  </g>

  <!-- ===== caption ===== -->
  <text x="900" y="1005" font-size="10" fill="#94A3B8" text-anchor="middle">图10-7 IoT DC3平台微服务架构：从设备接入到智能决策的五层结构与数据闭环。</text>
</svg>
