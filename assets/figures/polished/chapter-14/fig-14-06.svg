<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="830" viewBox="0 0 1800 830" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="830" fill="#FFFFFF"/>

  <!-- ===== title ===== -->
  <circle cx="64" cy="44" r="6" fill="#2563EB"/>
  <text x="84" y="50" font-size="22" font-weight="700" fill="#0F172A">图14-14 物联网项目工程检查流程</text>
  <text x="84" y="74" font-size="12" fill="#64748B">全生命周期五阶段关键决策主链路与评审回退路径</text>
  <rect x="1680" y="30" width="100" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1730" y="47" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">FLOWCHART</text>
  <line x1="0" y1="103" x2="1800" y2="103" stroke="#E2E8F0"/>

  <!-- ===== rollback arcs (above cards) ===== -->
  <!-- arc1: gate1 -> card1 -->
  <path d="M 382.5 307 Q 296 150 214 220" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <!-- arc2: gate2 -> card2 -->
  <path d="M 727.5 307 Q 641 150 559 220" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <!-- arc3: gate3 -> card3 -->
  <path d="M 1072.5 307 Q 986 150 904 220" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <!-- arc4: gate4 -> card4 -->
  <path d="M 1417.5 307 Q 1331 150 1249 220" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <text x="296" y="143" font-size="10" fill="#F59E0B" text-anchor="middle">未通过·回退</text>
  <text x="641" y="143" font-size="10" fill="#F59E0B" text-anchor="middle">未通过·回退</text>
  <text x="986" y="143" font-size="10" fill="#F59E0B" text-anchor="middle">未通过·回退</text>
  <text x="1331" y="143" font-size="10" fill="#F59E0B" text-anchor="middle">未通过·回退</text>

  <!-- ===== forward arrows (between cards) ===== -->
  <line x1="355" y1="325" x2="410" y2="325" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="700" y1="325" x2="755" y2="325" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="1045" y1="325" x2="1100" y2="325" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="1390" y1="325" x2="1445" y2="325" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- decision gates (diamonds on forward path) -->
  <polygon points="382.5,308 405.5,325 382.5,342 359.5,325" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <text x="382.5" y="328" font-size="9" fill="#10B981" text-anchor="middle">评审</text>
  <polygon points="727.5,308 750.5,325 727.5,342 704.5,325" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <text x="727.5" y="328" font-size="9" fill="#10B981" text-anchor="middle">评审</text>
  <polygon points="1072.5,308 1095.5,325 1072.5,342 1049.5,325" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <text x="1072.5" y="328" font-size="9" fill="#10B981" text-anchor="middle">评审</text>
  <polygon points="1417.5,308 1440.5,325 1417.5,342 1394.5,325" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <text x="1417.5" y="328" font-size="9" fill="#10B981" text-anchor="middle">评审</text>
  <text x="382.5" y="362" font-size="9" fill="#64748B" text-anchor="middle">通过</text>
  <text x="727.5" y="362" font-size="9" fill="#64748B" text-anchor="middle">通过</text>
  <text x="1072.5" y="362" font-size="9" fill="#64748B" text-anchor="middle">通过</text>
  <text x="1417.5" y="362" font-size="9" fill="#64748B" text-anchor="middle">通过</text>

  <!-- ===== stage cards ===== -->
  <!-- card 1 -->
  <g>
    <rect x="65" y="220" width="290" height="210" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="65" y="220" width="290" height="6" fill="#F59E0B"/>
    <text x="81" y="252" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">阶段一</text>
    <text x="81" y="278" font-size="17" font-weight="700" fill="#0F172A">启动与需求</text>
    <line x1="81" y1="292" x2="339" y2="292" stroke="#E2E8F0"/>
    <text x="81" y="314" font-size="10" font-weight="700" fill="#94A3B8">输入</text>
    <text x="81" y="332" font-size="12" fill="#0F172A">业务范围</text>
    <text x="81" y="360" font-size="10" font-weight="700" fill="#94A3B8">决策</text>
    <text x="81" y="378" font-size="12" fill="#0F172A">MoSCoW 优先级排序</text>
    <text x="81" y="412" font-size="9" fill="#64748B">明确做什么、先做什么</text>
  </g>
  <!-- card 2 -->
  <g>
    <rect x="410" y="220" width="290" height="210" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="410" y="220" width="290" height="6" fill="#10B981"/>
    <text x="426" y="252" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">阶段二</text>
    <text x="426" y="278" font-size="17" font-weight="700" fill="#0F172A">架构设计</text>
    <line x1="426" y1="292" x2="684" y2="292" stroke="#E2E8F0"/>
    <text x="426" y="314" font-size="10" font-weight="700" fill="#94A3B8">输入</text>
    <text x="426" y="332" font-size="12" fill="#0F172A">物模型定义</text>
    <text x="426" y="360" font-size="10" font-weight="700" fill="#94A3B8">决策</text>
    <text x="426" y="378" font-size="12" fill="#0F172A">边缘/云部署范围</text>
    <text x="426" y="412" font-size="9" fill="#64748B">划清现场与云端边界</text>
  </g>
  <!-- card 3 -->
  <g>
    <rect x="755" y="220" width="290" height="210" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="755" y="220" width="290" height="6" fill="#F59E0B"/>
    <text x="771" y="252" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">阶段三</text>
    <text x="771" y="278" font-size="17" font-weight="700" fill="#0F172A">开发实现</text>
    <line x1="771" y1="292" x2="1029" y2="292" stroke="#E2E8F0"/>
    <text x="771" y="314" font-size="10" font-weight="700" fill="#94A3B8">输入</text>
    <text x="771" y="332" font-size="12" fill="#0F172A">架构图</text>
    <text x="771" y="360" font-size="10" font-weight="700" fill="#94A3B8">决策</text>
    <text x="771" y="378" font-size="12" fill="#0F172A">CI/CD 与测试粒度</text>
    <text x="771" y="412" font-size="9" fill="#64748B">自动化流水线与质量门</text>
  </g>
  <!-- card 4 -->
  <g>
    <rect x="1100" y="220" width="290" height="210" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="1100" y="220" width="290" height="6" fill="#F59E0B"/>
    <text x="1116" y="252" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">阶段四</text>
    <text x="1116" y="278" font-size="17" font-weight="700" fill="#0F172A">部署上线</text>
    <line x1="1116" y1="292" x2="1374" y2="292" stroke="#E2E8F0"/>
    <text x="1116" y="314" font-size="10" font-weight="700" fill="#94A3B8">输入</text>
    <text x="1116" y="332" font-size="12" fill="#0F172A">Docker / K8s 清单</text>
    <text x="1116" y="360" font-size="10" font-weight="700" fill="#94A3B8">决策</text>
    <text x="1116" y="378" font-size="12" fill="#0F172A">观测栈配置</text>
    <text x="1116" y="412" font-size="9" fill="#64748B">日志、指标、链路一体</text>
  </g>
  <!-- card 5 -->
  <g>
    <rect x="1445" y="220" width="290" height="210" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="1445" y="220" width="290" height="6" fill="#F59E0B"/>
    <text x="1461" y="252" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">阶段五</text>
    <text x="1461" y="278" font-size="17" font-weight="700" fill="#0F172A">运维迭代</text>
    <line x1="1461" y1="292" x2="1719" y2="292" stroke="#E2E8F0"/>
    <text x="1461" y="314" font-size="10" font-weight="700" fill="#94A3B8">输入</text>
    <text x="1461" y="332" font-size="12" fill="#0F172A">监控告警</text>
    <text x="1461" y="360" font-size="10" font-weight="700" fill="#94A3B8">决策</text>
    <text x="1461" y="378" font-size="12" fill="#0F172A">异常处理与安全基线</text>
    <text x="1461" y="412" font-size="9" fill="#64748B">闭环改进、守住基线</text>
  </g>

  <!-- ===== callout ===== -->
  <rect x="300" y="470" width="1200" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="328" cy="507" r="10" fill="#2563EB"/>
  <text x="328" y="511" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="352" y="498" font-size="12" font-weight="700" fill="#0F172A">主链路与回退约定</text>
  <text x="352" y="518" font-size="11" fill="#334155">主链路：阶段一 → 二 → 三 → 四 → 五，逐阶段通过评审决策推进；任一阶段评审未通过即沿虚线回退至上一阶段，</text>
  <text x="352" y="534" font-size="11" fill="#334155">修正输入与决策后再次送审，直至全链路贯通——确保物联网项目从需求到运维全生命周期可控。</text>

  <!-- ===== legend ===== -->
  <line x1="0" y1="590" x2="1800" y2="590" stroke="#E2E8F0"/>
  <text x="64" y="624" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">图例</text>
  <!-- row1 -->
  <rect x="130" y="614" width="22" height="14" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="160" y="625" font-size="11" fill="#475569">阶段节点（决策卡）</text>
  <line x1="320" y1="621" x2="360" y2="621" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="372" y="625" font-size="11" fill="#475569">通过路径·推进</text>
  <line x1="520" y1="621" x2="560" y2="621" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <text x="572" y="625" font-size="11" fill="#475569">回退路径·迭代</text>
  <polygon points="720,613 733,621 720,629 707,621" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <text x="745" y="625" font-size="11" fill="#475569">评审决策门</text>
  <!-- row2 -->
  <rect x="130" y="650" width="22" height="6" fill="#F59E0B"/>
  <text x="160" y="660" font-size="11" fill="#475569">智能决策域（橙顶条）</text>
  <rect x="320" y="650" width="22" height="6" fill="#10B981"/>
  <text x="350" y="660" font-size="11" fill="#475569">设备与边缘域（绿顶条）</text>

  <!-- ===== caption ===== -->
  <text x="900" y="800" font-size="10" fill="#94A3B8" text-anchor="middle">图14-14 物联网项目工程检查流程：以五阶段主链路串联关键决策，评审未通过即回退迭代，确保项目全生命周期可控。</text>
</svg>
