  <rect x="1100" y="720" width="500" height="38" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <text x="1350" y="744" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">异构设备 · 传感器 · 执行器 · 边缘网关</text>

  <!-- 右列主链路 (蓝色实线，上行) -->
  <!-- 设备 -> 接入 -->
  <line x1="1030" y1="700" x2="1030" y2="674" stroke="#2563EB" stroke-width="2.4" marker-end="url(#ah-blue)"/>
