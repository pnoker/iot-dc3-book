  <rect x="100" y="678" width="700" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="116" y="697" font-size="11" font-weight="700" fill="#334155">传统模式</text>
  <text x="116" y="714" font-size="11" fill="#334155">平台向智能层提供数据源 → 规则/固定模型产生告警与控制指令回注平台执行；智能与安全耦合在策略中。</text>

  <!-- ================================================================
       右列：AGI 时代  (x 990-1710)
