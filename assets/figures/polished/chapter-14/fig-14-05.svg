  <rect x="1250" y="275" width="220" height="50" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="1360" y="297" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">操作区间约束</text>
  <text x="1360" y="313" font-size="9" fill="#64748B" text-anchor="middle">边界 · 回滚 · 限流</text>
