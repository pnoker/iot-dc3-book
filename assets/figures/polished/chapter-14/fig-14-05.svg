  <!-- 智能层 (orange) -->
  <rect x="990" y="370" width="720" height="110" rx="10" fill="#F8FAFC" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="8 4"/>
  <rect x="1000" y="360" width="76" height="20" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="1038" y="374" font-size="10" font-weight="700" fill="#F59E0B" text-anchor="middle">智能层</text>

