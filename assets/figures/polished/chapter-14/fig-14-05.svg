  <rect x="1170" y="628" width="360" height="30" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="1350" y="648" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">MQTT · CoAP · Modbus</text>

