  <text x="1112" y="352" font-size="10" fill="#2563EB" font-weight="700">输出校验</text>

  <!-- 安全护栏 -> 平台 (指令回注执行，蓝色虚线，右侧 L 型) -->
  <path d="M 1700 295 L 1740 295 L 1740 545 L 1714 545" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-blue)"/>
  <text x="1748" y="420" font-size="10" fill="#2563EB" font-weight="700">通过后</text>
  <text x="1748" y="434" font-size="10" fill="#2563EB" font-weight="700">回注执行</text>

  <!-- 安全护栏 -> 应用 (人工确认独立通道，红色虚线) -->
  <line x1="1350" y1="250" x2="1350" y2="224" stroke="#E11D48" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-red)"/>
  <text x="1362" y="240" font-size="10" fill="#E11D48" font-weight="700">人工确认通道</text>

  <!-- 右列 callout -->
  <rect x="1000" y="790" width="700" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1016" y="809" font-size="11" font-weight="700" fill="#E11D48">AGI 模式</text>
  <text x="1016" y="826" font-size="11" fill="#334155">Agent 编排调用模型调度网关动态路由端/云模型；其输出必须经安全护栏层校验通过后才回注平台执行，高危决策走人工确认。</text>

  <!-- ============ 图例 ============ -->
