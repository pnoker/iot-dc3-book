  <!-- ============ 标题区 ============ -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图14-5 AGI 时代物联网架构演进</text>
  <text x="84" y="72" font-size="12" fill="#64748B">传统 IoT 平台 → AGI 时代自治平台：智能层升级为 Agent 编排 + 动态模型调度，安全护栏层独立并旁路所有自动决策</text>
  <rect x="1640" y="28" width="130" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1705" y="45" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">ARCHITECTURE</text>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0"/>

  <!-- ============ 列标题 ============ -->
  <text x="450" y="135" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">传统 IoT 平台架构</text>
  <text x="450" y="152" font-size="10" fill="#94A3B8" text-anchor="middle">规则引擎 + 固定预训练模型</text>
  <text x="1350" y="135" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">AGI 时代平台架构</text>
  <text x="1350" y="152" font-size="10" fill="#94A3B8" text-anchor="middle">Agent 编排 + 动态模型调度 + 安全护栏</text>

  <!-- ============ 中间演进箭头 ============ -->
  <line x1="830" y1="430" x2="965" y2="430" stroke="#2563EB" stroke-width="3" marker-end="url(#ah-blue)"/>
  <text x="897" y="418" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">架构演进</text>
  <text x="897" y="452" font-size="10" fill="#64748B" text-anchor="middle">自治化</text>

