  <rect x="480" y="275" width="250" height="50" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="605" y="297" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">预训练模型</text>
