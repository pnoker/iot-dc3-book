  <!-- 接入层 (blue) -->
  <rect x="990" y="610" width="720" height="60" rx="10" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="8 4"/>
  <rect x="1000" y="600" width="76" height="20" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
