  <!-- ============ caption ============ -->
  <text x="900" y="1000" font-size="10" fill="#94A3B8" text-anchor="middle">图14-5 AGI 时代物联网架构演进｜右侧独立的 Agent 编排层、动态模型调度网关与旁路所有自动决策的安全护栏层，是从「规则 + 固定模型」走向自治系统的关键结构变化。</text>
