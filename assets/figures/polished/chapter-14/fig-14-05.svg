  <rect x="340" y="395" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="440" y="417" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">设备管理</text>
  <text x="440" y="433" font-size="9" fill="#64748B" text-anchor="middle">影子 · 生命周期</text>
  <rect x="560" y="395" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="660" y="417" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">数据中心</text>
  <text x="660" y="433" font-size="9" fill="#64748B" text-anchor="middle">时序 · 历史存储</text>

  <!-- 接入层 (blue) -->
  <rect x="90" y="490" width="720" height="60" rx="10" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="8 4"/>
  <rect x="100" y="480" width="76" height="20" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="138" y="494" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">接入层</text>
  <rect x="270" y="508" width="360" height="30" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="450" y="528" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">MQTT · CoAP · Modbus</text>

  <!-- 设备层 (green) -->
  <rect x="90" y="580" width="720" height="70" rx="10" fill="#F8FAFC" stroke="#10B981" stroke-width="1.4" stroke-dasharray="8 4"/>
  <rect x="100" y="570" width="76" height="20" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
  <text x="138" y="584" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">设备层</text>
  <rect x="200" y="600" width="500" height="38" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <text x="450" y="624" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">异构设备 · 传感器 · 执行器 · 边缘网关</text>

  <!-- 左列内部箭头 -->
  <!-- 设备 -> 接入 -> 平台 (灰，数据上行) -->
  <line x1="450" y1="580" x2="450" y2="554" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah-gray)"/>
  <line x1="450" y1="490" x2="450" y2="464" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah-gray)"/>
  <!-- 平台 <-> 智能 -->
  <line x1="325" y1="370" x2="325" y2="344" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ah-blue)"/>
  <text x="300" y="362" font-size="10" fill="#2563EB" text-anchor="end" font-weight="600">数据源</text>
  <line x1="605" y1="340" x2="605" y2="366" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="630" y="358" font-size="10" fill="#64748B" font-weight="600">告警 / 控制</text>

