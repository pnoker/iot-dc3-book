  <rect x="1360" y="390" width="330" height="80" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1525" y="412" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">模型调度网关</text>
