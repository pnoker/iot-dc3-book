<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-blue-start" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0,0 3.5,10 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-green-start" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0,0 3.5,10 7" fill="#10B981"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <!-- ============ Title area ============ -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" font-size="22" font-weight="700" fill="#0F172A">图6-6 物联网微服务容器部署的端-边-云分层架构</text>
  <text x="82" y="70" font-size="12" fill="#64748B">端-边-云三层分层架构 · 从云端中心服务到端设备的主链路与责任边界</text>
  <rect x="1660" y="24" width="110" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="1715" y="44" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">LAYERED</text>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ============ Cloud layer (platform domain) ============ -->
  <rect x="70" y="128" width="1660" height="242" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="86" y="120" width="220" height="22" rx="4" fill="#FFFFFF"/>
  <text x="92" y="136" font-size="13" font-weight="700" fill="#2563EB">云端中心层 · 完整 Kubernetes 集群</text>

  <!-- control plane sub-card -->
  <rect x="100" y="168" width="500" height="186" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.4"/>
  <text x="118" y="192" font-size="13" font-weight="700" fill="#0F172A">控制平面 Control Plane</text>
  <text x="118" y="206" font-size="9" fill="#64748B">集群调度与状态协调</text>
  <!-- 3 control plane pods -->
  <rect x="116" y="218" width="149" height="124" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="190.5" y="258" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">API Server</text>
  <text x="190.5" y="278" font-size="10" fill="#475569" text-anchor="middle">统一入口</text>
  <text x="190.5" y="294" font-size="9" fill="#64748B" text-anchor="middle">REST / gRPC</text>

  <rect x="275" y="218" width="149" height="124" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="349.5" y="258" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Scheduler</text>
  <text x="349.5" y="278" font-size="10" fill="#475569" text-anchor="middle">Pod 调度</text>
  <text x="349.5" y="294" font-size="9" fill="#64748B" text-anchor="middle">资源/亲和</text>

  <rect x="434" y="218" width="149" height="124" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="508.5" y="252" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Controller</text>
  <text x="508.5" y="270" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Manager</text>
  <text x="508.5" y="290" font-size="10" fill="#475569" text-anchor="middle">期望状态 reconcile</text>

  <!-- center services sub-card -->
  <rect x="620" y="168" width="1090" height="186" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.4"/>
  <text x="638" y="192" font-size="13" font-weight="700" fill="#0F172A">中心服务 Pod（业务与消息中枢）</text>
  <text x="638" y="206" font-size="9" fill="#64748B">承载核心业务微服务，承接边缘上行数据并下发控制指令</text>

  <rect x="636" y="218" width="180" height="124" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="726" y="258" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">manager</text>
  <text x="726" y="278" font-size="10" fill="#475569" text-anchor="middle">业务编排</text>
  <text x="726" y="294" font-size="9" fill="#64748B" text-anchor="middle">设备/规则管理</text>

  <rect x="826" y="218" width="180" height="124" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="916" y="258" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">data</text>
  <text x="916" y="278" font-size="10" fill="#475569" text-anchor="middle">数据落库</text>
  <text x="916" y="294" font-size="9" fill="#64748B" text-anchor="middle">时序/关系存储</text>

  <rect x="1016" y="218" width="180" height="124" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1106" y="258" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">notify</text>
  <text x="1106" y="278" font-size="10" fill="#475569" text-anchor="middle">告警通知</text>
  <text x="1106" y="294" font-size="9" fill="#64748B" text-anchor="middle"> webhook/IM</text>

  <!-- MQTT broker hub - highlighted -->
  <rect x="1206" y="218" width="230" height="124" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <text x="1321" y="256" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">MQTT Broker</text>
  <text x="1321" y="278" font-size="10" fill="#475569" text-anchor="middle">消息中枢 · 主链路出入口</text>
  <text x="1321" y="294" font-size="9" fill="#64748B" text-anchor="middle">topic 路由 / QoS</text>

  <!-- cloud-side central store (cylinder) -->
  <ellipse cx="1556" cy="226" rx="92" ry="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <path d="M 1464 226 L 1464 338 Q 1464 350 1556 350 Q 1648 350 1648 338 L 1648 226" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <ellipse cx="1556" cy="226" rx="92" ry="12" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="1556" y="285" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">中心数据库</text>
  <text x="1556" y="303" font-size="9" fill="#64748B" text-anchor="middle">时序 + 关系</text>

  <!-- ============ Edge layer (edge domain) ============ -->
  <rect x="70" y="430" width="1660" height="240" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="86" y="422" width="260" height="22" rx="4" fill="#FFFFFF"/>
  <text x="92" y="438" font-size="13" font-weight="700" fill="#10B981">边缘计算层 · 多节点 k3s 轻量集群</text>

  <!-- Node A -->
  <rect x="100" y="460" width="800" height="196" rx="8" fill="#F8FAFC" stroke="#10B981" stroke-width="1.4"/>
  <rect x="116" y="472" width="150" height="24" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
  <text x="191" y="489" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">边缘节点-A · k3s</text>
  <text x="280" y="489" font-size="9" fill="#64748B">资源受限 · 本地自治</text>

  <rect x="116" y="510" width="170" height="134" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="201" y="548" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">边缘网关</text>
  <text x="201" y="568" font-size="10" fill="#475569" text-anchor="middle">MQTT 接入</text>
  <text x="201" y="584" font-size="9" fill="#64748B" text-anchor="middle">南北向桥接</text>
  <text x="201" y="600" font-size="9" fill="#64748B" text-anchor="middle">数据清洗</text>

  <rect x="296" y="510" width="170" height="134" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="381" y="548" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">协议适配</text>
  <text x="381" y="568" font-size="10" fill="#475569" text-anchor="middle">Modbus 驱动</text>
  <text x="381" y="584" font-size="10" fill="#475569" text-anchor="middle">MQTT 驱动</text>
  <text x="381" y="600" font-size="9" fill="#64748B" text-anchor="middle">多协议转换</text>

  <rect x="476" y="510" width="160" height="134" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="556" y="548" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">本地缓存</text>
  <text x="556" y="568" font-size="10" fill="#475569" text-anchor="middle">Redis 轻量</text>
  <text x="556" y="584" font-size="9" fill="#64748B" text-anchor="middle">断网续传缓冲</text>

  <rect x="646" y="510" width="240" height="134" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="766" y="548" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">边缘自治 Agent</text>
  <text x="766" y="568" font-size="10" fill="#475569" text-anchor="middle">本地决策 / 控制回路</text>
  <text x="766" y="584" font-size="9" fill="#64748B" text-anchor="middle">心跳上送 / 紧凑同步</text>
  <text x="766" y="600" font-size="9" fill="#64748B" text-anchor="middle">gRPC · MQTT QoS 1</text>

  <!-- Node B -->
  <rect x="920" y="460" width="800" height="196" rx="8" fill="#F8FAFC" stroke="#10B981" stroke-width="1.4"/>
  <rect x="936" y="472" width="150" height="24" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
  <text x="1011" y="489" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">边缘节点-B · k3s</text>
  <text x="1100" y="489" font-size="9" fill="#64748B">异地多副本 · 弹性扩容</text>

  <rect x="936" y="510" width="170" height="134" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1021" y="548" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">边缘网关</text>
  <text x="1021" y="568" font-size="10" fill="#475569" text-anchor="middle">MQTT 接入</text>
  <text x="1021" y="584" font-size="9" fill="#64748B" text-anchor="middle">南北向桥接</text>

  <rect x="1116" y="510" width="170" height="134" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1201" y="548" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">协议适配</text>
  <text x="1201" y="568" font-size="10" fill="#475569" text-anchor="middle">CAN / OPC UA</text>
  <text x="1201" y="584" font-size="9" fill="#64748B" text-anchor="middle">多协议转换</text>

  <rect x="1296" y="510" width="160" height="134" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1376" y="548" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">本地缓存</text>
  <text x="1376" y="568" font-size="10" fill="#475569" text-anchor="middle">Redis 轻量</text>
  <text x="1376" y="584" font-size="9" fill="#64748B" text-anchor="middle">断网续传缓冲</text>

  <rect x="1466" y="510" width="240" height="134" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1586" y="548" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">边缘自治 Agent</text>
  <text x="1586" y="568" font-size="10" fill="#475569" text-anchor="middle">本地决策 / 控制回路</text>
  <text x="1586" y="584" font-size="9" fill="#64748B" text-anchor="middle">心跳上送 / 紧凑同步</text>

  <!-- ============ Device layer (edge domain - field) ============ -->
  <rect x="70" y="730" width="1660" height="150" rx="12" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="86" y="722" width="270" height="22" rx="4" fill="#FFFFFF"/>
  <text x="92" y="738" font-size="13" font-weight="700" fill="#64748B">端设备层 · 现场总线 / 无线接入</text>

  <rect x="180" y="760" width="190" height="104" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="275" y="796" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">传感器</text>
  <text x="275" y="816" font-size="10" fill="#475569" text-anchor="middle">温湿度 / 压力</text>
  <text x="275" y="834" font-size="9" fill="#64748B" text-anchor="middle">Modbus RTU</text>

  <rect x="450" y="760" width="190" height="104" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="545" y="796" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">PLC</text>
  <text x="545" y="816" font-size="10" fill="#475569" text-anchor="middle">可编程控制器</text>
  <text x="545" y="834" font-size="9" fill="#64748B" text-anchor="middle">Modbus / CAN</text>

  <rect x="720" y="760" width="190" height="104" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="815" y="796" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">执行器</text>
  <text x="815" y="816" font-size="10" fill="#475569" text-anchor="middle">电机 / 阀门</text>
  <text x="815" y="834" font-size="9" fill="#64748B" text-anchor="middle">CAN / DO</text>

  <!-- bus annotation -->
  <rect x="990" y="760" width="620" height="104" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="1010" y="788" font-size="12" font-weight="700" fill="#334155">现场总线 / 无线承载</text>
  <text x="1010" y="810" font-size="10" fill="#475569">有线：Modbus RTU · CAN · RS-485</text>
  <text x="1010" y="828" font-size="10" fill="#475569">无线：Zigbee · LoRa · NB-IoT</text>
  <text x="1010" y="848" font-size="9" fill="#64748B">异构协议经边缘协议适配 Pod 统一归一化</text>

  <!-- ============ Inter-layer connections ============ -->
  <!-- Cloud <-> Edge : main link (blue highlighted, bidirectional via MQTT Broker) -->
  <line x1="1321" y1="342" x2="1321" y2="428" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ah-blue)" marker-start="url(#ah-blue-start)"/>
  <rect x="1350" y="368" width="232" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1360" y="384" font-size="10" font-weight="700" fill="#2563EB">MQTT Broker 异步双向</text>
  <text x="1360" y="398" font-size="9" fill="#64748B">上下行数据 / 指令分发</text>

  <!-- Edge Agent <-> Cloud : compact sync (dashed) -->
  <line x1="766" y1="430" x2="766" y2="354" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <rect x="540" y="372" width="212" height="36" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="550" y="388" font-size="10" font-weight="700" fill="#475569">gRPC / MQTT QoS 1 紧凑同步</text>
  <text x="550" y="402" font-size="9" fill="#64748B">心跳 / 状态 / 弱连接续传</text>

  <!-- Edge <-> Device : real-time loop (green bidirectional) -->
  <line x1="500" y1="672" x2="500" y2="758" stroke="#10B981" stroke-width="2.6" marker-end="url(#ah-green)" marker-start="url(#ah-green-start)"/>
  <line x1="900" y1="672" x2="900" y2="758" stroke="#10B981" stroke-width="2.6" marker-end="url(#ah-green)" marker-start="url(#ah-green-start)"/>
  <rect x="600" y="700" width="200" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="700" y="720" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">实时采集 / 控制回路（不经云端）</text>

  <!-- ============ Legend ============ -->
  <line x1="60" y1="892" x2="1740" y2="892" stroke="#E2E8F0" stroke-width="1"/>
  <text x="70" y="912" font-size="11" font-weight="700" fill="#475569">图例</text>

  <rect x="120" y="902" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="142" y="912" font-size="11" fill="#475569">核心平台中心服务</text>

  <rect x="280" y="902" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <text x="302" y="912" font-size="11" fill="#475569">边缘计算与设备接入</text>

  <rect x="450" y="902" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="472" y="912" font-size="11" fill="#475569">本地数据存储</text>

  <rect x="590" y="902" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
  <text x="612" y="912" font-size="11" fill="#475569">端设备与现场总线</text>

  <line x1="760" y1="908" x2="800" y2="908" stroke="#2563EB" stroke-width="2.4" marker-end="url(#ah-blue)"/>
  <text x="808" y="912" font-size="11" fill="#475569">同步调用 / 强依赖主链路</text>

  <line x1="1000" y1="908" x2="1040" y2="908" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1048" y="912" font-size="11" fill="#475569">异步消息 / 可选同步</text>

  <rect x="1240" y="902" width="16" height="12" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
  <text x="1262" y="912" font-size="11" fill="#475569">主链路枢纽（高亮）</text>

  <!-- ============ Caption ============ -->
  <text x="900" y="975" font-size="10" fill="#94A3B8" text-anchor="middle">图6-6 物联网微服务从端设备到边缘节点再到云端的容器部署分层架构：边缘层运行 k3s 轻量集群处理协议适配与本地缓存，云端运行完整 K8s 集群承载中心服务，主链路经 MQTT Broker 贯通端-边-云。</text>
</svg>
