  <ellipse cx="255" cy="388" rx="62" ry="7" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
  <path d="M 193,388 L 193,418 A 62,7 0 0 0 317,418 L 317,388" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
  <ellipse cx="255" cy="388" rx="62" ry="7" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
