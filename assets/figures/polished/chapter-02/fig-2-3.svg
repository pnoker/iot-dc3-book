<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">五层架构模型与传统四层架构的对比示意</title>
  <desc id="desc">读者应理解五层架构模型与传统四层架构的对比示意中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">五层架构模型与传统四层架构的对比示意</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解五层架构模型与传统四层架构的对比示意中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LAYERED</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="layered">
  <!-- 左侧箭头 -->
  <!-- 感知层→网络层 -->
  <line x1="400" y1="560" x2="400" y2="520" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="410" y="522" width="180" height="26" rx="4" fill="white" stroke="none"/>
  <text x="415" y="540" fill="#0F172A" font-size="12" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数据流（采集→存储→展示）</text>
  <!-- 网络层→平台层 -->
  <line x1="400" y1="440" x2="400" y2="400" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 平台层→应用层 -->
  <line x1="400" y1="320" x2="400" y2="280" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>

  <!-- 右侧箭头 -->
  <!-- 感知层→网络层 -->
  <line x1="1400" y1="550" x2="1400" y2="540" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 网络层→平台层 -->
  <line x1="1400" y1="470" x2="1400" y2="460" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 智能层→应用层 -->
  <line x1="1400" y1="290" x2="1400" y2="270" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1410" y="272" width="60" height="26" rx="4" fill="white" stroke="none"/>
  <text x="1415" y="290" fill="#0F172A" font-size="12" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数据流</text>
  <!-- 平台层→智能层（读取数据与分析）回路 -->
  <path d="M 1540 390 L 1570 390 L 1570 325 L 1540 325" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1550" y="350" width="110" height="26" rx="4" fill="white" stroke="none"/>
  <text x="1555" y="368" fill="#0F172A" font-size="12" font-family="'PingFang SC','Microsoft YaHei',sans-serif">读取数据与分析</text>
  <!-- 智能层→平台层（命令下发）回路 -->
  <path d="M 1260 360 L 1230 360 L 1230 425 L 1260 425" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1200" y="380" width="80" height="26" rx="4" fill="white" stroke="none"/>
  <text x="1205" y="398" fill="#0F172A" font-size="12" font-family="'PingFang SC','Microsoft YaHei',sans-serif">命令下发</text>
  <!-- 控制流：平台层→感知层（虚线） -->
  <line x1="1250" y1="460" x2="1250" y2="550" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1220" y="495" width="60" height="26" rx="4" fill="white" stroke="none"/>
  <text x="1225" y="513" fill="#0F172A" font-size="12" font-family="'PingFang SC','Microsoft YaHei',sans-serif">控制流</text>

  <!-- 左侧卡片 -->
  <!-- 应用层 -->
  <rect x="260" y="200" width="280" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="400" y="240" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">应用层</text>
  <!-- 平台层 -->
  <rect x="260" y="320" width="280" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="400" y="360" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">平台层</text>
  <!-- 网络层 -->
  <rect x="260" y="440" width="280" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="400" y="480" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">网络层</text>
  <!-- 感知层 -->
  <rect x="260" y="560" width="280" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="400" y="600" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">感知层</text>

  <!-- 右侧卡片 -->
  <!-- 应用层 -->
  <rect x="1260" y="200" width="280" height="70" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1400" y="235" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">应用层</text>
  <!-- 智能层（新增） -->
  <rect x="1260" y="290" width="280" height="70" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1400" y="325" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">智能层（新增）</text>
  <!-- 平台层 -->
  <rect x="1260" y="390" width="280" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1400" y="425" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">平台层</text>
  <!-- 网络层 -->
  <rect x="1260" y="470" width="280" height="70" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1400" y="505" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">网络层</text>
  <!-- 感知层 -->
  <rect x="1260" y="550" width="280" height="70" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1400" y="585" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">感知层</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">数据正向采集与传递方向</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">智能层产生的决策指令，通过平台层回流至底层设备</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">控制流，从平台层经过网络层下发至感知层</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">五层架构模型与经典四层架构的对比。左侧为经典四层架构：数据单向从感知层经平台层流向应用层，没有标准化的回写路径。右侧为五层架构：新增的智能层（紫色）嵌入在平台层与应用层之间，数据流形成闭环（感知层→网络层→平台层→智能层，然后智能层将执行指令返回平台层向下转发，同时将结果向上提</text>
  <text x="900" y="870" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">交应用层），实现了理解、决策、执行的逻辑收敛。</text>
</svg>
