<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-label="图2-5 智能层在闭环中的推理-规划-执行分工" data-style="architecture-diagram-wireframe-white" text-rendering="geometricPrecision" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <rect x="0" y="0" width="1500" height="930" fill="#FFFFFF"/>

  <g id="title">
    <circle cx="64" cy="40" r="6" fill="#F59E0B"/>
    <text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图2-5 智能层在闭环中的推理-规划-执行分工</text>
    <text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">智能层推理-规划-执行三模块构成闭环迭代，并经平台层向感知层下发协议命令</text>
    <rect x="1370" y="28" width="92" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1416" y="47" text-anchor="middle" fill="#64748B" font-size="11" font-weight="700">LAYERED</text>
  </g>

  <line x1="58" y1="103" x2="1442" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <g id="regions">
    <rect x="80" y="130" width="1340" height="230" rx="12" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="8 4"/>
    <text x="100" y="155" fill="#F59E0B" font-size="11" font-weight="600">智能决策域</text>
    <text x="180" y="155" fill="#94A3B8" font-size="10">模型、规则与 Agent 边界</text>

    <rect x="80" y="400" width="1340" height="180" rx="12" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="8 4"/>
    <text x="100" y="425" fill="#2563EB" font-size="11" font-weight="600">平台服务域</text>
    <text x="180" y="425" fill="#94A3B8" font-size="10">核心服务能力边界</text>

    <rect x="80" y="620" width="1340" height="170" rx="12" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="8 4"/>
    <text x="100" y="645" fill="#10B981" font-size="11" font-weight="600">感知接入域</text>
    <text x="180" y="645" fill="#94A3B8" font-size="10">设备协议与接入边界</text>
  </g>

  <g id="arrows">
    <line x1="422" y1="260" x2="648" y2="260" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
    <line x1="852" y1="260" x2="1078" y2="260" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
    <line x1="1180" y1="302" x2="1180" y2="468" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
    <line x1="1180" y1="552" x2="1180" y2="688" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
    <line x1="320" y1="302" x2="320" y2="468" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
    <path d="M 1180 218 L 1180 195 L 320 195 L 320 218" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#ah-gray)"/>
  </g>

  <g id="nodes">
    <rect x="220" y="220" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="320" y="255" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="700">推理模块</text>
    <text x="320" y="278" text-anchor="middle" fill="#475569" font-size="10" font-weight="500">意图解析 / 模型推理</text>

    <rect x="650" y="220" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="750" y="255" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="700">规划模块</text>
    <text x="750" y="278" text-anchor="middle" fill="#475569" font-size="10" font-weight="500">任务分解 / 策略生成</text>

    <rect x="1080" y="220" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="1180" y="255" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="700">执行模块</text>
    <text x="1180" y="278" text-anchor="middle" fill="#475569" font-size="10" font-weight="500">动作编排 / 指令生成</text>

    <rect x="220" y="470" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="320" y="505" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="700">数据中心</text>
    <text x="320" y="528" text-anchor="middle" fill="#475569" font-size="10" font-weight="500">时序数据 / 设备影子</text>

    <rect x="1080" y="470" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1180" y="505" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="700">管理中心</text>
    <text x="1180" y="528" text-anchor="middle" fill="#475569" font-size="10" font-weight="500">指令调度 / 设备管控</text>

    <rect x="1080" y="690" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1180" y="725" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="700">协议下发</text>
    <text x="1180" y="748" text-anchor="middle" fill="#475569" font-size="10" font-weight="500">MQTT/CoAP 指令</text>
  </g>

  <g id="callouts">
    <text x="535" y="252" text-anchor="middle" fill="#334155" font-size="10">规划输入</text>
    <text x="965" y="252" text-anchor="middle" fill="#334155" font-size="10">执行计划</text>
    <text x="1192" y="388" fill="#334155" font-size="10">下发指令</text>
    <text x="1192" y="615" fill="#334155" font-size="10">协议命令</text>
    <text x="328" y="388" fill="#334155" font-size="10">拉取数据</text>
    <text x="750" y="189" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">闭环迭代</text>
  </g>

  <line x1="58" y1="815" x2="1442" y2="815" stroke="#E2E8F0" stroke-width="1"/>

  <g id="legend">
    <rect x="90" y="847" width="14" height="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="110" y="856" fill="#64748B" font-size="11" font-weight="600">智能层认知</text>
    <rect x="290" y="847" width="14" height="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="310" y="856" fill="#64748B" font-size="11" font-weight="600">平台层基础</text>
    <rect x="490" y="847" width="14" height="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="510" y="856" fill="#64748B" font-size="11" font-weight="600">数据资产</text>
    <rect x="670" y="847" width="14" height="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="690" y="856" fill="#64748B" font-size="11" font-weight="600">感知接入</text>
    <line x1="850" y1="852" x2="874" y2="852" stroke="#64748B" stroke-width="1.5"/>
    <text x="884" y="856" fill="#64748B" font-size="11" font-weight="600">数据/指令流</text>
    <line x1="1080" y1="852" x2="1104" y2="852" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="1114" y="856" fill="#64748B" font-size="11" font-weight="600">闭环迭代</text>
  </g>

  <text x="750" y="905" text-anchor="middle" fill="#94A3B8" font-size="10">图2-5 智能层在闭环中的推理-规划-执行分工</text>
</svg>