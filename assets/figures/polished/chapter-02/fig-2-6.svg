<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图2-6 智能层在闭环中的推理-规划-执行分工图</title>
  <desc id="desc">读者应理解智能层在闭环中的推理-规划-执行分工图中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图2-6 智能层在闭环中的推理-规划-执行分工图</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解智能层在闭环中的推理-规划-执行分工图中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LAYERED</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="layered">
  <!-- 区域边界 -->
  <rect x="450" y="130" width="820" height="120" rx="14" fill="none" stroke="#94A3B8" stroke-dasharray="8,4" stroke-width="1.5"/>
  <text x="460" y="145" fill="#64748B" font-size="12" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">智能决策域</text>
  <rect x="450" y="300" width="820" height="120" rx="14" fill="none" stroke="#94A3B8" stroke-dasharray="8,4" stroke-width="1.5"/>
  <text x="460" y="315" fill="#64748B" font-size="12" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">平台服务域</text>
  <rect x="450" y="480" width="820" height="120" rx="14" fill="none" stroke="#94A3B8" stroke-dasharray="8,4" stroke-width="1.5"/>
  <text x="460" y="495" fill="#64748B" font-size="12" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">数据资产域</text>

  <!-- 智能层卡片 -->
  <rect x="480" y="155" width="240" height="70" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="600" y="180" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">推理模块</text>
  <text x="600" y="198" fill="#475569" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">状态评估</text>

  <rect x="740" y="155" width="240" height="70" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="860" y="180" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">规划模块</text>
  <text x="860" y="198" fill="#475569" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">动作序列</text>

  <rect x="1000" y="155" width="240" height="70" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1120" y="180" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">执行模块</text>
  <text x="1120" y="198" fill="#475569" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">指令下发与确认</text>

  <!-- 平台层卡片 -->
  <rect x="480" y="325" width="240" height="70" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="600" y="350" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">数据中心</text>
  <text x="600" y="368" fill="#475569" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">时序数据存取、命令路由</text>

  <rect x="740" y="325" width="240" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="860" y="350" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">管理中心</text>
  <text x="860" y="368" fill="#475569" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">设备元数据、生命周期</text>

  <rect x="1000" y="325" width="240" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1120" y="350" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">认证中心</text>
  <text x="1120" y="368" fill="#475569" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">身份鉴权、租户隔离</text>

  <!-- 感知与网络层卡片 -->
  <rect x="490" y="505" width="360" height="70" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="670" y="530" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">驱动服务</text>
  <text x="670" y="548" fill="#475569" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">协议转换、命令翻译</text>

  <rect x="870" y="505" width="360" height="70" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1050" y="530" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">现场设备</text>
  <text x="1050" y="548" fill="#475569" font-size="11" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">传感器、执行器</text>

  <!-- 连线（在卡片之后） -->
  <!-- 推理→规划（虚线） -->
  <line x1="720" y1="190" x2="740" y2="190" stroke="#2563EB" stroke-dasharray="8,4" stroke-width="1.5" marker-end="url(#bp-arrow)"/>
  <!-- 规划→执行（虚线） -->
  <line x1="980" y1="190" x2="1000" y2="190" stroke="#2563EB" stroke-dasharray="8,4" stroke-width="1.5" marker-end="url(#bp-arrow)"/>
  <!-- 执行→推理（虚线闭环） -->
  <path d="M 1240 190 L 1260 190 L 1260 135 L 720 135 L 720 190" fill="none" stroke="#2563EB" stroke-dasharray="8,4" stroke-width="1.5" marker-end="url(#bp-arrow)"/>
  <!-- 推理→数据中心（实线） -->
  <line x1="600" y1="225" x2="600" y2="325" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 规划→管理中心（实线） -->
  <line x1="860" y1="225" x2="860" y2="325" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 执行→数据中心（实线斜线） -->
  <path d="M 1120 225 L 1120 285 L 660 285 L 660 325" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 数据中心→驱动服务（实线） -->
  <path d="M 600 395 L 600 450 L 670 450 L 670 505" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 驱动服务→现场设备（实线） -->
  <line x1="850" y1="540" x2="870" y2="540" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>

  <!-- 连线标签 -->
  <!-- 闭环迭代标签 -->
  <rect x="960" y="118" width="60" height="16" rx="3" fill="white" stroke="#CBD5E1" stroke-width="0.5"/>
  <text x="990" y="130" fill="#0F172A" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">闭环迭代</text>

  <!-- 拉取位号值标签 -->
  <rect x="580" y="258" width="72" height="16" rx="3" fill="white" stroke="#CBD5E1" stroke-width="0.5"/>
  <text x="616" y="270" fill="#0F172A" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">拉取位号值</text>

  <!-- 查询元数据标签 -->
  <rect x="820" y="258" width="72" height="16" rx="3" fill="white" stroke="#CBD5E1" stroke-width="0.5"/>
  <text x="856" y="270" fill="#0F172A" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">查询元数据</text>

  <!-- 下发指令标签 -->
  <rect x="880" y="258" width="60" height="16" rx="3" fill="white" stroke="#CBD5E1" stroke-width="0.5"/>
  <text x="910" y="270" fill="#0F172A" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">下发指令</text>

  <!-- 消息队列标签 -->
  <rect x="615" y="440" width="60" height="16" rx="3" fill="white" stroke="#CBD5E1" stroke-width="0.5"/>
  <text x="645" y="452" fill="#0F172A" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">消息队列</text>

  <!-- 协议命令标签 -->
  <rect x="840" y="525" width="60" height="16" rx="3" fill="white" stroke="#CBD5E1" stroke-width="0.5"/>
  <text x="870" y="537" fill="#0F172A" font-size="10" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">协议命令</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝绿色模块：智能层认知能力</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色模块：平台层基础能力或设备接入层</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头：数据或指令流</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图2-6 智能层在闭环中的推理-规划-执行分工图，展示认知环节与平台层基础设施的边界。</text>
</svg>
