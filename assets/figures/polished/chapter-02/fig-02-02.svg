<text x="750" y="860" fill="#94A3B8" font-size="10" text-anchor="middle">图2-2 智能层闭环工作流：数据从物理世界采集，经平台层进入智能层推理与规划，结果通过平台层下发执行器，反馈回到传感器开启下一轮循环。</text>
