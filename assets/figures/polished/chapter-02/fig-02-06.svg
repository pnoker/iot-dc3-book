<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-label="图2-5 IoT DC3 五大中心逻辑关系" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1000" fill="#FFFFFF"/>

  <!-- 标题区 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图2-5 IoT DC3 五大中心逻辑关系</text>
  <text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">Gateway 为北向唯一入口，经 REST 调用四大中心，Agentic 内部回查 Data 与 Manager</text>
  <rect x="1372" y="28" width="112" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1428" y="45" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">ARCHITECTURE</text>

  <!-- 标题分隔线 -->
  <line x1="58" y1="103" x2="1442" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 区域边界框 -->
  <rect x="120" y="145" width="820" height="180" rx="12" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="140" y="170" fill="#2563EB" font-size="11" font-weight="600">平台服务域</text>

  <rect x="980" y="145" width="400" height="180" rx="12" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="1000" y="170" fill="#F59E0B" font-size="11" font-weight="600">智能决策域</text>

  <rect x="120" y="400" width="1260" height="180" rx="12" fill="none" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="140" y="425" fill="#7C3AED" font-size="11" font-weight="600">数据资产域</text>

  <rect x="120" y="720" width="1260" height="160" rx="12" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="140" y="745" fill="#64748B" font-size="11" font-weight="600">外部基础设施</text>

  <!-- 连接箭头（先于节点绘制） -->
  <!-- 主链路：Gateway 四条 REST 调用，蓝色 2px 加粗 -->
  <line x1="418" y1="245" x2="362" y2="245" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="390" y="237" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">REST · 令牌校验</text>

  <line x1="488" y1="307" x2="422" y2="446" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="398" y="392" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">REST · 查询元数据</text>

  <line x1="532" y1="307" x2="828" y2="446" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="720" y="370" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">REST · 查询/下发</text>

  <line x1="602" y1="245" x2="1048" y2="245" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="825" y="237" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">REST · AI 请求</text>

  <!-- 次链路：Agentic 内部回查，灰色 1.5px 虚线 -->
  <line x1="1100" y1="307" x2="922" y2="446" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <line x1="1150" y1="307" x2="522" y2="446" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>

  <!-- 外部基础设施连接 -->
  <!-- Data 与 消息队列：AMQP 双线双向 -->
  <line x1="763" y1="543" x2="663" y2="769" stroke="#64748B" stroke-width="1.2" marker-start="url(#ah-gray)" marker-end="url(#ah-gray)"/>
  <line x1="757" y1="541" x2="657" y2="767" stroke="#64748B" stroke-width="1.2"/>
  <text x="648" y="662" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">AMQP 双向</text>

  <!-- Data 到 时序数据库 -->
  <line x1="900" y1="543" x2="958" y2="768" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="1000" y="660" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">时序写入</text>

  <!-- 节点 -->
  <!-- 平台服务域 -->
  <rect x="200" y="210" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="280" y="246" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">鉴权中心</text>
  <text x="280" y="266" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">Auth · 令牌校验</text>

  <rect x="420" y="195" width="180" height="112" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.6"/>
  <text x="510" y="234" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">网关中心</text>
  <text x="510" y="256" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">Gateway · 北向入口</text>
  <text x="510" y="276" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">路由 · 鉴权代理</text>
  <circle cx="588" cy="207" r="8" fill="#2563EB"/>
  <text x="588" y="211" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">主</text>

  <!-- 智能决策域 -->
  <rect x="1050" y="195" width="200" height="112" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1150" y="234" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">智能中心</text>
  <text x="1150" y="256" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">Agentic · AI 能力</text>
  <text x="1150" y="276" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">模型推理 · Agent</text>

  <!-- 数据资产域 -->
  <rect x="320" y="450" width="200" height="90" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="420" y="486" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">元数据中心</text>
  <text x="420" y="506" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">Manager · 设备元数据</text>
  <text x="420" y="522" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">点位 · 设备模型</text>

  <rect x="720" y="450" width="220" height="90" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.6"/>
  <text x="830" y="486" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">数据中心</text>
  <text x="830" y="506" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">Data · 数据枢纽</text>
  <text x="830" y="522" fill="#475569" font-size="9" font-weight="500" text-anchor="middle">查询 · 命令下发</text>

  <!-- 外部基础设施 -->
  <rect x="560" y="770" width="200" height="90" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 3"/>
  <text x="660" y="806" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">消息队列</text>
  <text x="660" y="826" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">AMQP · 解耦采集/命令</text>

  <rect x="860" y="770" width="200" height="90" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 3"/>
  <text x="960" y="806" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">时序数据库</text>
  <text x="960" y="826" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">TSDB · 时序存储</text>

  <!-- 标注 callout -->
  <rect x="140" y="338" width="300" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="152" y="358" fill="#334155" font-size="10.5" font-weight="500">Gateway 北向唯一入口，统一鉴权路由</text>

  <rect x="1050" y="338" width="300" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1062" y="358" fill="#334155" font-size="10.5" font-weight="500">Agentic 内部经 REST 回查 Data/Manager</text>

  <!-- 图例区 -->
  <line x1="58" y1="895" x2="1442" y2="895" stroke="#E2E8F0" stroke-width="1"/>
  <text x="140" y="912" fill="#64748B" font-size="10" font-weight="700">图例</text>

  <rect x="140" y="922" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="166" y="932" fill="#64748B" font-size="11" font-weight="600">实线节点: DC3 微服务</text>

  <rect x="400" y="922" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8" stroke-dasharray="4 2"/>
  <text x="426" y="932" fill="#64748B" font-size="11" font-weight="600">虚线节点: 外部基础设施</text>

  <line x1="680" y1="928" x2="712" y2="928" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="720" y="932" fill="#64748B" font-size="11" font-weight="600">实线箭头: REST 调用</text>

  <line x1="140" y1="958" x2="172" y2="958" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah-gray)"/>
  <text x="180" y="962" fill="#64748B" font-size="11" font-weight="600">虚线箭头: 内部 REST</text>

  <line x1="470" y1="955" x2="502" y2="955" stroke="#64748B" stroke-width="1.2" marker-start="url(#ah-gray)" marker-end="url(#ah-gray)"/>
  <line x1="470" y1="961" x2="502" y2="961" stroke="#64748B" stroke-width="1.2"/>
  <text x="510" y="962" fill="#64748B" font-size="11" font-weight="600">双线箭头: AMQP 双向</text>

  <text x="760" y="962" fill="#64748B" font-size="11" font-weight="600">箭头标签: 标注协议或目的</text>

  <!-- caption -->
  <text x="750" y="988" fill="#94A3B8" font-size="10" text-anchor="middle">图 2-5 IoT DC3 五大中心逻辑关系。Gateway 北向唯一入口，Auth 鉴权，Manager 元数据，Data 数据枢纽，Agentic AI 能力层，消息队列解耦采集与命令下发。</text>
</svg>