<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620" role="img" aria-label="图2-5 Data 中心数据流" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
<marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
</defs>
<rect x="0" y="0" width="1800" height="620" fill="#FFFFFF"/>
<circle cx="64" cy="40" r="6" fill="#2563EB"/>
<text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图2-5 Data 中心数据流：从设备采集到时序存储</text>
<text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">一次接收、两处分发——异步写入时序库 + 即时推送实时订阅方</text>
<rect x="1620" y="28" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="1680" y="45" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">DATAFLOW</text>
<line x1="58" y1="103" x2="1742" y2="103" stroke="#E2E8F0" stroke-width="1"/>

<!-- 主链路节点 -->
<rect x="70" y="230" width="150" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="145" y="265" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">现场设备</text>
<text x="145" y="286" fill="#64748B" font-size="10" text-anchor="middle">传感器/PLC</text>

<rect x="290" y="230" width="150" height="80" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<text x="365" y="265" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">驱动</text>
<text x="365" y="286" fill="#64748B" font-size="10" text-anchor="middle">dc3-driver-*</text>

<rect x="510" y="230" width="150" height="80" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<text x="585" y="265" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">Gateway</text>
<text x="585" y="286" fill="#64748B" font-size="10" text-anchor="middle">统一入口</text>

<rect x="730" y="230" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="810" y="265" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">Data 中心</text>
<text x="810" y="286" fill="#64748B" font-size="10" text-anchor="middle">清洗·分流</text>

<!-- 消息队列（三竖线） -->
<rect x="970" y="230" width="160" height="80" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<line x1="1010" y1="248" x2="1010" y2="292" stroke="#64748B" stroke-width="2"/>
<line x1="1030" y1="248" x2="1030" y2="292" stroke="#64748B" stroke-width="2"/>
<line x1="1050" y1="248" x2="1050" y2="292" stroke="#64748B" stroke-width="2"/>
<text x="1085" y="266" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">RabbitMQ</text>
<text x="1085" y="285" fill="#64748B" font-size="10" text-anchor="middle">缓冲削峰</text>

<!-- 分流：上路时序库，下路实时订阅 -->
<rect x="1420" y="140" width="180" height="80" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<ellipse cx="1510" cy="150" rx="24" ry="7" fill="none" stroke="#F59E0B" stroke-width="1.6"/>
<text x="1510" y="180" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">时序数据库</text>
<text x="1510" y="199" fill="#64748B" font-size="10" text-anchor="middle">异步持久化</text>

<rect x="1420" y="320" width="180" height="80" rx="6" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
<text x="1510" y="355" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">实时订阅方</text>
<text x="1510" y="376" fill="#64748B" font-size="10" text-anchor="middle">告警·大屏推送</text>

<!-- 主链路箭头 -->
<line x1="220" y1="270" x2="286" y2="270" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<line x1="440" y1="270" x2="506" y2="270" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<line x1="660" y1="270" x2="726" y2="270" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<line x1="890" y1="270" x2="966" y2="270" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="928" y="260" fill="#2563EB" font-size="10" text-anchor="middle">PointValue</text>

<!-- 分流：Data → 时序库(上, 经队列异步)、Data → 实时订阅(下, 直推) -->
<path d="M 1130 250 L 1300 250 L 1300 175 L 1416 175" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="1300" y="240" fill="#B45309" font-size="10" text-anchor="middle">异步写入</text>
<path d="M 810 310 L 810 460 L 1350 460 L 1350 360 L 1416 360" fill="none" stroke="#0891B2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
<text x="1080" y="450" fill="#0891B2" font-size="10" text-anchor="middle">即时推送（旁路队列）</text>

<!-- 图例 -->
<line x1="58" y1="520" x2="1742" y2="520" stroke="#E2E8F0" stroke-width="1"/>
<line x1="80" y1="548" x2="116" y2="548" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="124" y="552" fill="#64748B" font-size="11" font-weight="600">主链路（采集）</text>
<line x1="280" y1="548" x2="316" y2="548" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="324" y="552" fill="#64748B" font-size="11" font-weight="600">异步持久化路径</text>
<line x1="500" y1="548" x2="536" y2="548" stroke="#0891B2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
<text x="544" y="552" fill="#64748B" font-size="11" font-weight="600">实时推送路径</text>

<text x="900" y="590" fill="#94A3B8" font-size="10" text-anchor="middle">图2-5 Data 中心"一次接收、两处分发"：一路进消息队列异步写时序库（持久化），一路即时推送实时订阅方（实时性），二者并行不阻塞。</text>
</svg>
