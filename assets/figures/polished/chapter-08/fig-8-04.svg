<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980"
  data-style="architecture-diagram-wireframe-white"
  font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect x="0" y="0" width="1800" height="980" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- ============ TITLE ============ -->
  <g id="title">
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="84" y="46" font-size="22" font-weight="700" fill="#0F172A">图8-4 多租户混合隔离架构</text>
    <text x="84" y="70" font-size="12" fill="#64748B">按租户敏感度采用不同隔离强度的混合策略 · Mixed-Tenant Isolation Topology</text>
    <rect x="1604" y="28" width="140" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1674" y="46" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="1.5">ARCHITECTURE</text>
    <line x1="0" y1="103" x2="1800" y2="103" stroke="#E2E8F0"/>
  </g>

  <!-- ============ SHARED GATEWAY ============ -->
  <g id="gateway">
    <rect x="620" y="130" width="560" height="72" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="900" y="160" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">API 网关 · 共享接入层</text>
    <text x="900" y="184" font-size="11" fill="#64748B" text-anchor="middle">JWT 解析 tenant_id · 路由分流 · 限流配额</text>
    <!-- split-routing arrows into each VPC -->
    <line x1="700" y1="202" x2="560" y2="247" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <line x1="1100" y1="202" x2="1380" y2="247" stroke="#E11D48" stroke-width="2.5" marker-end="url(#ah-red)"/>
    <text x="588" y="240" font-size="9" fill="#2563EB">低敏感路由</text>
    <text x="1290" y="240" font-size="9" fill="#E11D48">高敏感路由</text>
  </g>

  <!-- ============ VPC-1 (A/C shared) ============ -->
  <g id="vpc1">
    <rect x="110" y="250" width="900" height="610" rx="12" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8 4"/>
    <rect x="130" y="238" width="230" height="26" rx="4" fill="#FFFFFF" stroke="#64748B"/>
    <text x="245" y="256" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">VPC-1 · A/C 共享环境</text>

    <!-- tenant boundary -->
    <text x="180" y="287" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">租户边界</text>
    <rect x="200" y="295" width="260" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="330" y="325" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">租户 A</text>
    <text x="330" y="348" font-size="10" fill="#64748B" text-anchor="middle">低敏感 · 通用业务</text>

    <rect x="500" y="295" width="260" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="630" y="325" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">租户 C</text>
    <text x="630" y="348" font-size="10" fill="#64748B" text-anchor="middle">低敏感 · 通用业务</text>

    <line x1="330" y1="365" x2="330" y2="403" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <line x1="630" y1="365" x2="630" y2="403" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>

    <!-- microservice layer (shared, dashed) -->
    <text x="180" y="395" font-size="11" font-weight="700" fill="#475569">微服务层 · A/C 共享 Pod 池</text>
    <rect x="160" y="405" width="800" height="135" rx="10" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 4"/>

    <rect x="185" y="425" width="220" height="95" rx="6" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
    <text x="295" y="455" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Pod · 共享实例 #1</text>
    <text x="295" y="477" font-size="10" fill="#64748B" text-anchor="middle">多租户混跑</text>
    <text x="295" y="497" font-size="9" fill="#94A3B8" text-anchor="middle">tenant_id 上下文传播</text>

    <rect x="445" y="425" width="220" height="95" rx="6" fill="#F8FAFC" stroke="#10B981" stroke-width="1.5"/>
    <text x="555" y="455" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Pod · 共享实例 #2</text>
    <text x="555" y="477" font-size="10" fill="#64748B" text-anchor="middle">多租户混跑</text>
    <text x="555" y="497" font-size="9" fill="#94A3B8" text-anchor="middle">HPA 弹性扩缩</text>

    <rect x="705" y="425" width="220" height="95" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="815" y="465" font-size="12" fill="#64748B" text-anchor="middle">Pod · 弹性池 …</text>
    <text x="815" y="488" font-size="9" fill="#94A3B8" text-anchor="middle">按负载动态调度</text>

    <!-- pod -> db (data access, dashed) -->
    <line x1="560" y1="540" x2="560" y2="578" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-purple)"/>

    <!-- data layer (shared schema, dashed) -->
    <text x="180" y="572" font-size="11" font-weight="700" fill="#475569">数据层 · A/C 共享 Schema</text>
    <rect x="160" y="580" width="800" height="140" rx="10" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- cylinder DB (shared, dashed) -->
    <ellipse cx="320" cy="700" rx="90" ry="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 3"/>
    <rect x="230" y="620" width="180" height="80" fill="#FFFFFF"/>
    <line x1="230" y1="620" x2="230" y2="700" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 3"/>
    <line x1="410" y1="620" x2="410" y2="700" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 3"/>
    <ellipse cx="320" cy="620" rx="90" ry="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="320" y="654" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">共享数据库</text>
    <text x="320" y="676" font-size="10" fill="#475569" text-anchor="middle">Schema: tenant_a / tenant_c</text>
    <text x="320" y="694" font-size="9" fill="#64748B" text-anchor="middle">行级 RLS · tenant_id 隔离</text>

    <!-- RLS side callout -->
    <rect x="470" y="612" width="470" height="86" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="490" y="635" font-size="11" font-weight="700" fill="#334155">行级隔离策略（RLS）</text>
    <text x="490" y="656" font-size="10" fill="#475569">• 每行携带 tenant_id，查询自动注入过滤条件</text>
    <text x="490" y="675" font-size="10" fill="#475569">• 共享计算 / 存储资源，靠策略保证逻辑隔离</text>
    <text x="490" y="694" font-size="9" fill="#94A3B8">• 依赖应用层与数据库策略的正确性</text>

    <!-- bottom isolation callout -->
    <rect x="160" y="760" width="800" height="78" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="180" y="784" font-size="11" font-weight="700" fill="#334155">隔离手段</text>
    <text x="180" y="804" font-size="10" fill="#475569">tenant_id 上下文传播 · 行级 RLS 策略 · 每租户限流配额（防 noisy neighbor）</text>
    <text x="180" y="823" font-size="9" fill="#94A3B8">成本低 · 密度高 · 故障爆炸半径可控</text>
  </g>

  <!-- ============ VPC-2 (B dedicated) ============ -->
  <g id="vpc2">
    <rect x="1070" y="250" width="630" height="610" rx="12" fill="none" stroke="#E11D48" stroke-width="2"/>
    <rect x="1420" y="238" width="220" height="26" rx="4" fill="#FFFFFF" stroke="#E11D48"/>
    <text x="1530" y="256" font-size="11" font-weight="700" fill="#E11D48" text-anchor="middle">VPC-2 · B 独享环境</text>

    <!-- tenant boundary -->
    <text x="1130" y="287" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">租户边界</text>
    <rect x="1180" y="295" width="380" height="70" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
    <text x="1370" y="325" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">租户 B</text>
    <text x="1370" y="348" font-size="10" fill="#64748B" text-anchor="middle">高敏感 · 金融 / 合规</text>

    <line x1="1370" y1="365" x2="1370" y2="403" stroke="#E11D48" stroke-width="2.5" marker-end="url(#ah-red)"/>

    <!-- microservice layer (dedicated, solid) -->
    <text x="1130" y="395" font-size="11" font-weight="700" fill="#E11D48">微服务层 · B 独享 Pod</text>
    <rect x="1110" y="405" width="540" height="135" rx="10" fill="none" stroke="#E11D48" stroke-width="1.5"/>
    <rect x="1150" y="425" width="460" height="95" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
    <text x="1380" y="455" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Pod · 独享实例</text>
    <text x="1380" y="477" font-size="10" fill="#64748B" text-anchor="middle">单租户专用 · 资源配额独占</text>
    <text x="1380" y="497" font-size="9" fill="#94A3B8" text-anchor="middle">无跨租户调度</text>

    <!-- pod -> db (data access) -->
    <line x1="1380" y1="540" x2="1380" y2="578" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#ah-purple)"/>

    <!-- data layer (dedicated, solid) -->
    <text x="1130" y="572" font-size="11" font-weight="700" fill="#E11D48">数据层 · B 独享 DB 实例</text>
    <rect x="1110" y="580" width="540" height="140" rx="10" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
    <!-- cylinder DB (dedicated, solid) -->
    <ellipse cx="1380" cy="700" rx="100" ry="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="1280" y="620" width="200" height="80" fill="#FFFFFF"/>
    <line x1="1280" y1="620" x2="1280" y2="700" stroke="#7C3AED" stroke-width="1.5"/>
    <line x1="1480" y1="620" x2="1480" y2="700" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1380" cy="620" rx="100" ry="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="1380" y="654" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">独享数据库实例</text>
    <text x="1380" y="676" font-size="10" fill="#475569" text-anchor="middle">独立计算 / 存储 / 网络</text>
    <text x="1380" y="694" font-size="9" fill="#64748B" text-anchor="middle">物理隔离 · KMS 独立密钥</text>

    <!-- bottom isolation callout -->
    <rect x="1110" y="760" width="540" height="78" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="1130" y="784" font-size="11" font-weight="700" fill="#334155">隔离手段</text>
    <text x="1130" y="804" font-size="10" fill="#475569">独立 VPC · 独享 Pod / DB · 专属网络通道</text>
    <text x="1130" y="823" font-size="9" fill="#94A3B8">零跨租户共享 · 成本高 · 合规友好</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g id="legend">
    <line x1="0" y1="878" x2="1800" y2="878" stroke="#E2E8F0"/>
    <text x="60" y="905" font-size="11" font-weight="700" fill="#475569">图例</text>

    <rect x="110" y="895" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="132" y="905" font-size="11" fill="#475569">租户 A</text>

    <rect x="190" y="895" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
    <text x="212" y="905" font-size="11" fill="#475569">租户 B</text>

    <rect x="270" y="895" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="292" y="905" font-size="11" fill="#475569">租户 C</text>

    <line x1="375" y1="901" x2="405" y2="901" stroke="#0F172A" stroke-width="2"/>
    <text x="413" y="905" font-size="11" fill="#475569">实线框 = 独享（dedicated）</text>

    <line x1="630" y1="901" x2="660" y2="901" stroke="#0F172A" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="668" y="905" font-size="11" fill="#475569">虚线框 = 共享（shared）</text>

    <line x1="875" y1="901" x2="905" y2="901" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <text x="915" y="905" font-size="11" fill="#475569">主链路 / 请求</text>

    <line x1="1045" y1="901" x2="1075" y2="901" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-purple)"/>
    <text x="1085" y="905" font-size="11" fill="#475569">数据访问</text>

    <rect x="1190" y="895" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="1212" y="905" font-size="11" fill="#475569">VPC 边界</text>

    <rect x="1320" y="895" width="16" height="12" rx="2" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="1342" y="905" font-size="11" fill="#475569">数据存储（紫 = data 域）</text>
  </g>

  <!-- ============ CAPTION ============ -->
  <text x="900" y="955" font-size="10" fill="#94A3B8" text-anchor="middle">图8-4 混合策略：租户 B（高敏感）独享 DB / Pod / VPC，A/C（低敏感）共享 Schema 与 Pod 池靠 tenant_id 与限流隔离。实线框 = 独享，虚线框 = 共享。</text>
</svg>
