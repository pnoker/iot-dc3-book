<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>图8-1 TLS 1.3握手流程</title>
<style>html,body{margin:0;padding:0;background:#FFFFFF}body{min-height:100vh;display:flex;align-items:center;justify-content:center}svg{width:min(1600px,100vw);height:auto;display:block}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-label="图8-1 TLS 1.3握手流程" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
<marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
<marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
<marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
<marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
<marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="980" fill="#FFFFFF"/>
<!-- Title -->
<circle cx="64" cy="40" r="6" fill="#2563EB"/>
<text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图8-1 TLS 1.3握手流程</text>
<text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">从ClientHello明文到应用数据全加密的握手与双向认证</text>
<rect x="1472" y="30" width="104" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="1524" y="46" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">SEQUENCE</text>
<line x1="58" y1="103" x2="1542" y2="103" stroke="#E2E8F0" stroke-width="1"/>
<!-- Lifelines -->
<line x1="400" y1="183" x2="400" y2="780" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6 6"/>
<line x1="1050" y1="183" x2="1050" y2="780" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6 6"/>
<!-- Phase bands -->
<rect x="230" y="200" width="990" height="160" rx="12" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="8 4"/>
<text x="250" y="193" fill="#2563EB" font-size="11" font-weight="600">明文握手阶段</text>
<rect x="230" y="375" width="990" height="90" rx="12" fill="none" stroke="#E11D48" stroke-width="1.2" stroke-dasharray="8 4"/>
<text x="250" y="368" fill="#E11D48" font-size="11" font-weight="600">双向认证阶段</text>
<rect x="230" y="485" width="990" height="260" rx="12" fill="none" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="8 4"/>
<text x="250" y="478" fill="#7C3AED" font-size="11" font-weight="600">加密通道阶段</text>
<!-- Message 1: ClientHello (C→S, plaintext) -->
<line x1="402" y1="250" x2="1048" y2="250" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
<text x="725" y="238" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">① ClientHello</text>
<text x="725" y="266" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">版本 · 密码套件 · 随机数</text>
<!-- Message 2: ServerHello (S→C, plaintext) -->
<line x1="1048" y1="325" x2="402" y2="325" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
<text x="725" y="313" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">② ServerHello</text>
<text x="725" y="341" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">选定套件 · 证书 · 密钥参数</text>
<!-- Message 3: Client Certificate (C→S, mutual auth) -->
<line x1="402" y1="420" x2="1048" y2="420" stroke="#E11D48" stroke-width="1.5" marker-end="url(#ah-red)"/>
<text x="725" y="408" fill="#E11D48" font-size="13" font-weight="700" text-anchor="middle">③ 客户端证书</text>
<text x="725" y="436" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">双向认证 · ECDHE 密钥协商</text>
<!-- Message 4: Finished (C→S, encrypted, main chain) -->
<line x1="402" y1="535" x2="1048" y2="535" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="725" y="523" fill="#2563EB" font-size="13" font-weight="700" text-anchor="middle">④ Finished</text>
<text x="725" y="551" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">会话密钥加密验证</text>
<!-- Message 5: Finished (S→C, encrypted, main chain) -->
<line x1="1048" y1="610" x2="402" y2="610" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="725" y="598" fill="#2563EB" font-size="13" font-weight="700" text-anchor="middle">⑤ Finished</text>
<text x="725" y="626" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">会话密钥加密验证</text>
<!-- Message 6: Application Data (C↔S, encrypted, main chain, bidirectional) -->
<line x1="402" y1="710" x2="1048" y2="710" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)" marker-start="url(#ah-blue)"/>
<text x="725" y="698" fill="#2563EB" font-size="13" font-weight="700" text-anchor="middle">⑥ 应用数据</text>
<text x="725" y="726" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">全量会话密钥加密</text>
<!-- Participant nodes -->
<rect x="290" y="125" width="220" height="56" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<text x="400" y="150" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">客户端</text>
<text x="400" y="168" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">设备 / Device</text>
<rect x="940" y="125" width="220" height="56" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="1050" y="150" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">服务端</text>
<text x="1050" y="168" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">平台 / Platform</text>
<!-- Callouts -->
<line x1="1222" y1="284" x2="1255" y2="284" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="1255" y="258" width="305" height="52" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="1270" y="278" fill="#0F172A" font-size="11" font-weight="600">ClientHello / ServerHello</text>
<text x="1270" y="296" fill="#64748B" font-size="10" font-weight="500">明文交换，尚未建立加密</text>
<line x1="1222" y1="422" x2="1255" y2="422" stroke="#E11D48" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="1255" y="396" width="305" height="52" rx="4" fill="#FFFFFF" stroke="#E11D48" stroke-width="1"/>
<text x="1270" y="416" fill="#0F172A" font-size="11" font-weight="600">双向认证触发</text>
<text x="1270" y="434" fill="#64748B" font-size="10" font-weight="500">客户端需额外发送证书</text>
<line x1="1222" y1="624" x2="1255" y2="624" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="1255" y="598" width="305" height="52" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
<text x="1270" y="618" fill="#0F172A" font-size="11" font-weight="600">Finished 与应用数据</text>
<text x="1270" y="636" fill="#64748B" font-size="10" font-weight="500">均走会话密钥加密通道</text>
<!-- Legend -->
<line x1="58" y1="860" x2="1542" y2="860" stroke="#E2E8F0" stroke-width="1"/>
<text x="64" y="884" fill="#64748B" font-size="11" font-weight="700">图例</text>
<line x1="120" y1="900" x2="150" y2="900" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
<text x="158" y="904" fill="#64748B" font-size="11" font-weight="600">明文消息</text>
<line x1="250" y1="900" x2="280" y2="900" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="288" y="904" fill="#64748B" font-size="11" font-weight="600">加密主链路</text>
<line x1="395" y1="900" x2="425" y2="900" stroke="#E11D48" stroke-width="1.5" marker-end="url(#ah-red)"/>
<text x="433" y="904" fill="#64748B" font-size="11" font-weight="600">双向认证</text>
<rect x="525" y="894" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<text x="547" y="904" fill="#64748B" font-size="11" font-weight="600">客户端（设备）</text>
<rect x="675" y="894" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="697" y="904" fill="#64748B" font-size="11" font-weight="600">服务端（平台）</text>
<rect x="825" y="894" width="14" height="10" rx="2" fill="none" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="847" y="904" fill="#64748B" font-size="11" font-weight="600">阶段边界</text>
<!-- Caption -->
<text x="800" y="950" fill="#94A3B8" font-size="10" font-weight="500" text-anchor="middle">图8-1 TLS 1.3握手流程（含示意性双向认证）：展示从ClientHello到应用数据全加密的主要步骤</text>
</svg>
</body>
</html>
