<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <!-- ===== Title ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="46" font-size="22" font-weight="700" fill="#0F172A">物联网微隔离架构</text>
  <text x="84" y="70" font-size="12" fill="#64748B">四层分层模型 · 微分段通过 SDN 控制器实现逐设备级隔离，阻断横向移动</text>
  <rect x="1620" y="24" width="140" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="1690" y="46" font-size="12" fill="#64748B" text-anchor="middle" letter-spacing="1.5">ARCHITECTURE</text>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== platform_domain outer boundary ===== -->
  <rect x="110" y="120" width="1530" height="660" rx="12" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.55"/>
  <rect x="124" y="110" width="150" height="22" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
  <text x="199" y="126" font-size="11" fill="#64748B" text-anchor="middle">平台服务域</text>

  <!-- ===== Layer 4: 全局策略编排层 (purple) ===== -->
  <rect x="160" y="150" width="1430" height="120" rx="12" fill="#FAF7FF" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="8 4"/>
  <rect x="176" y="140" width="170" height="22" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="261" y="156" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">全局策略编排层</text>
  <!-- cards -->
  <g>
    <rect x="400" y="180" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="520" y="210" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">策略编排器</text>
    <text x="520" y="230" font-size="10" fill="#64748B" text-anchor="middle">全局分段策略定义</text>
  </g>
  <g>
    <rect x="760" y="180" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="880" y="210" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">身份与资产目录</text>
    <text x="880" y="230" font-size="10" fill="#64748B" text-anchor="middle">设备分组 / 标签</text>
  </g>
  <g>
    <rect x="1120" y="180" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="1240" y="210" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">审计与合规</text>
    <text x="1240" y="230" font-size="10" fill="#64748B" text-anchor="middle">策略变更追溯</text>
  </g>

  <!-- ===== Layer 3: 微分段控制层 (blue, core) ===== -->
  <rect x="160" y="290" width="1430" height="130" rx="12" fill="#F3F7FF" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="8 4"/>
  <rect x="176" y="280" width="200" height="22" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="276" y="296" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">微分段控制层（核心）</text>
  <!-- core highlighted card -->
  <g>
    <rect x="400" y="320" width="240" height="80" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.6"/>
    <text x="520" y="352" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">SDN 控制器</text>
    <text x="520" y="372" font-size="10" fill="#475569" text-anchor="middle">集中转发决策 · ACL 计算</text>
    <text x="520" y="388" font-size="9" fill="#64748B" text-anchor="middle">逐设备粒度规则</text>
  </g>
  <g>
    <rect x="760" y="320" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="880" y="352" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">微分段引擎</text>
    <text x="880" y="372" font-size="10" fill="#475569" text-anchor="middle">分组成员判定</text>
    <text x="880" y="388" font-size="9" fill="#64748B" text-anchor="middle">白名单 / 零信任</text>
  </g>
  <g>
    <rect x="1120" y="320" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1240" y="352" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">规则下发器</text>
    <text x="1240" y="372" font-size="10" fill="#475569" text-anchor="middle">流表 / 策略同步</text>
    <text x="1240" y="388" font-size="9" fill="#64748B" text-anchor="middle">增量热更新</text>
  </g>

  <!-- ===== Layer 2: 接入网关层 (green, edge) ===== -->
  <rect x="160" y="440" width="1430" height="120" rx="12" fill="#F1FCF7" stroke="#10B981" stroke-width="1.4" stroke-dasharray="8 4"/>
  <rect x="176" y="430" width="170" height="22" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  <text x="261" y="446" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">接入网关层</text>
  <g>
    <rect x="400" y="470" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="520" y="500" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">边缘网关</text>
    <text x="520" y="520" font-size="10" fill="#64748B" text-anchor="middle">南向协议接入</text>
  </g>
  <g>
    <rect x="760" y="470" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="880" y="500" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">协议适配</text>
    <text x="880" y="520" font-size="10" fill="#64748B" text-anchor="middle">MQTT / CoAP / Modbus</text>
  </g>
  <g>
    <rect x="1120" y="470" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1240" y="500" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">设备认证</text>
    <text x="1240" y="520" font-size="10" fill="#64748B" text-anchor="middle">证书 / 双向 mTLS</text>
  </g>

  <!-- ===== Layer 1: 物理设备层 (green, many) ===== -->
  <rect x="160" y="590" width="1430" height="170" rx="12" fill="#F1FCF7" stroke="#10B981" stroke-width="1.4" stroke-dasharray="8 4"/>
  <rect x="176" y="580" width="170" height="22" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  <text x="261" y="596" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">物理设备层</text>
  <text x="1000" y="612" font-size="9" fill="#64748B" text-anchor="middle">海量终端 · 与上层网关一对多</text>
  <!-- device cards -->
  <g font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">
    <rect x="320" y="630" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="400" y="657">传感器</text>
    <text x="400" y="676" font-size="9" font-weight="400" fill="#64748B">温湿度 / 振动</text>

    <rect x="540" y="630" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="620" y="657">摄像头</text>
    <text x="620" y="676" font-size="9" font-weight="400" fill="#64748B">视频流</text>

    <rect x="760" y="630" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="840" y="657">PLC 控制器</text>
    <text x="840" y="676" font-size="9" font-weight="400" fill="#64748B">工控 OT</text>

    <rect x="980" y="630" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1060" y="657">执行器</text>
    <text x="1060" y="676" font-size="9" font-weight="400" fill="#64748B">阀门 / 电机</text>

    <rect x="1200" y="630" width="160" height="60" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1280" y="657">智能终端</text>
    <text x="1280" y="676" font-size="9" font-weight="400" fill="#64748B">网关型设备</text>

    <rect x="1420" y="630" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1480" y="657">……</text>
    <text x="1480" y="676" font-size="9" font-weight="400" fill="#64748B">N 台</text>
  </g>

  <!-- ===== Connections ===== -->
  <!-- L1 -> L2 solid blue (data up, main chain) -->
  <line x1="320" y1="628" x2="320" y2="562" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="262" y="588" width="116" height="18" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="320" y="601" font-size="10" fill="#2563EB" text-anchor="middle">① 设备数据上报</text>

  <!-- L2 -> L3 dashed gray (policy query up) -->
  <line x1="520" y1="468" x2="520" y2="402" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <rect x="462" y="426" width="116" height="18" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <text x="520" y="439" font-size="10" fill="#475569" text-anchor="middle">② 策略咨询</text>

  <!-- L3 -> L2 solid blue (rule push down, main chain) -->
  <line x1="640" y1="402" x2="640" y2="468" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="582" y="426" width="116" height="18" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="640" y="439" font-size="10" fill="#2563EB" text-anchor="middle">③ 微分段规则下发</text>

  <!-- L4 -> L3 solid blue (orchestration down, main chain) -->
  <line x1="1240" y1="252" x2="1240" y2="318" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="1180" y="276" width="120" height="18" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="1240" y="289" font-size="10" fill="#2563EB" text-anchor="middle">④ 策略指令</text>

  <!-- L4 -> L1 dashed gray (global quarantine bypass, long right curve) -->
  <path d="M 1480 252 C 1680 360, 1680 560, 1540 628" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <rect x="1604" y="430" width="120" height="18" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <text x="1664" y="443" font-size="10" fill="#475569" text-anchor="middle">⑤ 全局隔离</text>

  <!-- ===== callout ===== -->
  <rect x="160" y="800" width="1430" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="184" y="827" font-size="11" fill="#334155">核心结论：微分段控制层（SDN 控制器）是唯一决策点，所有横向流量必须经其判定；L4→L1 的全局隔离通道可在失控时绕过逐层下发，直接对终端断流。</text>

  <!-- ===== Legend ===== -->
  <line x1="60" y1="868" x2="1740" y2="868" stroke="#E2E8F0" stroke-width="1"/>
  <text x="60" y="892" font-size="11" font-weight="700" fill="#0F172A">图例</text>

  <rect x="110" y="882" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="134" y="892" font-size="11" fill="#475569">平台 / 主链路（实线·蓝）</text>

  <rect x="330" y="882" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <text x="354" y="892" font-size="11" fill="#475569">设备 / 边缘接入</text>

  <rect x="490" y="882" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="514" y="892" font-size="11" fill="#475569">策略 / 知识域</text>

  <line x1="660" y1="888" x2="692" y2="888" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="700" y="892" font-size="11" fill="#475569">主链路数据流</text>

  <line x1="850" y1="888" x2="882" y2="888" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="890" y="892" font-size="11" fill="#475569">控制咨询 / 动态调整</text>

  <rect x="1090" y="882" width="16" height="12" rx="2" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="1114" y="892" font-size="11" fill="#475569">分层边界（虚线）</text>

  <!-- ===== caption ===== -->
  <text x="900" y="968" font-size="10" fill="#94A3B8" text-anchor="middle">图8-8 物联网微隔离架构示意图。四层模型从设备到策略编排依次递进，微分段控制层是核心决策点。</text>
</svg>
