<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">物联网微隔离架构示意图</title>
  <desc id="desc">读者应理解物联网微隔离架构示意图中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">物联网微隔离架构示意图</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解物联网微隔离架构示意图中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
  <!-- Region boundary: 平台服务域 -->
  <rect x="160" y="170" width="840" height="540" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="175" y="190" fill="#64748B" font-size="12" font-weight="600">平台服务域</text>

  <!-- Layer boxes -->
  <!-- 全局策略编排层 -->
  <rect x="200" y="200" width="600" height="90" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="500" y="235" fill="#0F172A" font-size="18" font-weight="600" text-anchor="middle">全局策略编排层</text>
  <text x="500" y="258" fill="#475569" font-size="12" text-anchor="middle">全局策略编排与同步</text>

  <!-- 微分段控制层 -->
  <rect x="200" y="330" width="600" height="90" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="500" y="365" fill="#0F172A" font-size="18" font-weight="600" text-anchor="middle">微分段控制层</text>
  <text x="500" y="388" fill="#475569" font-size="12" text-anchor="middle">微隔离策略控制器</text>

  <!-- 接入网关层 -->
  <rect x="200" y="460" width="600" height="90" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="500" y="495" fill="#0F172A" font-size="18" font-weight="600" text-anchor="middle">接入网关层</text>
  <text x="500" y="518" fill="#475569" font-size="12" text-anchor="middle">边缘接入与汇聚</text>

  <!-- 物理设备层 (primary) -->
  <rect x="200" y="590" width="600" height="90" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="500" y="625" fill="#0F172A" font-size="18" font-weight="600" text-anchor="middle">物理设备层</text>
  <text x="500" y="648" fill="#475569" font-size="12" text-anchor="middle">终端设备与传感器</text>

  <!-- Connections -->
  <!-- r1 -> r2 -->
  <path d="M 480 590 L 480 550" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- r2 -> r3 (dashed) -->
  <path d="M 460 460 L 460 420" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow-primary)"/>
  <!-- r3 -> r2 -->
  <path d="M 520 420 L 520 460" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- r4 -> r3 -->
  <path d="M 540 290 L 540 330" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- r4 -> r1 (dashed, via right channel) -->
  <path d="M 800 245 L 880 245 L 880 635 L 800 635" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow-primary)"/>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">分层组件，每个层包含多个功能实体</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">策略或配置数据的流向</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">控制咨询或动态调整的流向</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图8-7 物联网微隔离架构示意图。四层模型从设备到策略编排依次递进，微分段控制层是核心决策点。</text>
</svg>
