  <rect x="80" y="118" width="300" height="26" rx="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="230" y="136" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">云层 CLOUD · 训练与模型管理</text>

