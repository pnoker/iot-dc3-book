  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1080" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="42" r="6" fill="#2563EB"/>
  <text x="84" y="49" font-size="22" font-weight="700" fill="#0F172A">图1-4 AIoT 边-端-云三级协同架构</text>
  <text x="84" y="73" font-size="12" fill="#64748B">Cloud · Edge · Device 三层智能分工与数据流向 —— 边缘为实时推理枢纽，模型下沉形成闭环</text>
  <rect x="1610" y="30" width="130" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1675" y="47" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.6">ARCHITECTURE</text>
