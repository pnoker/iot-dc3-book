<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图1-5 物联网价值迁移路径</title>
  <desc id="desc">读者应看到价值重心从左到右迁移，智能层的利润率和增长潜力显著高于连接层。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图1-5 物联网价值迁移路径</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应看到价值重心从左到右迁移，智能层的利润率和增长潜力显著高于连接层。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">FLOWCHART</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="flowchart">
  <!-- 区域边界 -->
  <rect x="100" y="140" width="450" height="310" rx="14" fill="transparent" stroke="#D97706" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="115" y="160" fill="#D97706" font-size="13" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-weight="600">低价值区</text>
  
  <rect x="550" y="140" width="450" height="310" rx="14" fill="transparent" stroke="#D97706" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="565" y="160" fill="#D97706" font-size="13" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-weight="600">中价值区</text>
  
  <rect x="1000" y="140" width="450" height="310" rx="14" fill="transparent" stroke="#D97706" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="1015" y="160" fill="#D97706" font-size="13" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-weight="600">高价值区</text>
  
  <!-- 连线（先于节点绘制） -->
  <!-- 主节点间箭头 -->
  <line x1="475" y1="240" x2="620" y2="240" stroke="#2563EB" stroke-width="4" marker-end="url(#bp-arrow-primary)"/>
  <line x1="925" y1="240" x2="1070" y2="240" stroke="#2563EB" stroke-width="6" marker-end="url(#bp-arrow-primary)"/>
  
  <!-- 箭头标签 -->
  <rect x="510" y="227" width="80" height="22" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="550" y="242" fill="#0F172A" font-size="11" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" text-anchor="middle">价值汇聚</text>
  
  <rect x="965" y="227" width="80" height="22" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1005" y="242" fill="#0F172A" font-size="11" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" text-anchor="middle">数据驱动</text>
  
  <!-- 虚线对应连接 -->
  <line x1="325" y1="300" x2="325" y2="315" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#bp-arrow)"/>
  <line x1="775" y1="300" x2="775" y2="315" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#bp-arrow)"/>
  <line x1="1225" y1="300" x2="1225" y2="315" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#bp-arrow)"/>
  
  <!-- 虚线标签 -->
  <text x="335" y="312" fill="#64748B" font-size="10" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">对应</text>
  <text x="785" y="312" fill="#64748B" font-size="10" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">对应</text>
  <text x="1235" y="312" fill="#64748B" font-size="10" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">对应</text>
  
  <!-- 节点（后绘制，盖住部分连线） -->
  <!-- 连接层 -->
  <rect x="175" y="180" width="300" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="325" y="206" fill="#0F172A" font-size="15" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-weight="600" text-anchor="middle">连接层</text>
  <text x="325" y="226" fill="#475569" font-size="11" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" text-anchor="middle">模组、SIM、连接管理</text>
  
  <!-- 平台层 -->
  <rect x="625" y="180" width="300" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="775" y="206" fill="#0F172A" font-size="15" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-weight="600" text-anchor="middle">平台层</text>
  <text x="775" y="226" fill="#475569" font-size="11" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" text-anchor="middle">设备管理、规则引擎</text>
  
  <!-- 智能层 -->
  <rect x="1075" y="180" width="300" height="120" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1225" y="206" fill="#0F172A" font-size="15" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-weight="600" text-anchor="middle">智能层</text>
  <text x="1225" y="226" fill="#475569" font-size="11" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" text-anchor="middle">数据分析、AI决策</text>
  
  <!-- 商业模式节点 -->
  <rect x="225" y="320" width="200" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="325" y="346" fill="#0F172A" font-size="14" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-weight="600" text-anchor="middle">按连接计费</text>
  <text x="325" y="366" fill="#475569" font-size="11" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" text-anchor="middle">低毛利</text>
  
  <rect x="675" y="320" width="200" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="775" y="346" fill="#0F172A" font-size="14" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-weight="600" text-anchor="middle">按设备/消息计费</text>
  <text x="775" y="366" fill="#475569" font-size="11" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" text-anchor="middle">中等毛利</text>
  
  <rect x="1125" y="320" width="200" height="80" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1225" y="346" fill="#0F172A" font-size="14" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-weight="600" text-anchor="middle">按决策/效果计费</text>
  <text x="1225" y="366" fill="#475569" font-size="11" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" text-anchor="middle">高毛利</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色方框 = 平台/连接服务</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头 = 价值流向；宽度代表相对价值占比</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图1-5 物联网产业价值重心从连接层向平台层、最终向智能决策层迁移的路径。</text>
</svg>
