<text x="82" y="48" fill="#0F172A" font-size="22" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="700">图1-2 PC互联网时代连接架构</text>
<text x="82.0" y="78.0" fill="#64748B" font-size="12" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="500" text-anchor="start">展示PC互联网时代用户—PC—万维网—信息的连接链路， 突出物设备尚未纳入联网范围，为后续物联网连接范式对比做铺垫</text>
