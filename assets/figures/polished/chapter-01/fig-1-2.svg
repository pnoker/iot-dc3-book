  <!-- ===== caption ===== -->
  <text x="800" y="1060" font-size="10" fill="#94A3B8" text-anchor="middle">图1-2 四层参考架构：数据从感知层上行至应用层，指令反向下行形成闭环，安全贯穿所有层。</text>
