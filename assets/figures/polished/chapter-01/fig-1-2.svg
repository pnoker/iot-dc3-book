<text x="227.3" y="431.5" fill="#64748B" font-size="9" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="500" text-anchor="middle">一个抽象人体图标</text>
<rect x="820.3" y="216.0" width="304.7" height="68.0" rx="6.0" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
<text x="972.7" y="249.5" fill="#0F172A" font-size="13" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="700" text-anchor="middle">桌面PC</text>
<text x="972.7" y="267.5" fill="#64748B" font-size="9" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="500" text-anchor="middle">台式机图标，内部标注浏览器图标与文字</text>
<rect x="820.3" y="298.0" width="304.7" height="68.0" rx="6.0" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
<text x="972.7" y="331.5" fill="#0F172A" font-size="13" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="700" text-anchor="middle">万维网</text>
<text x="972.7" y="349.5" fill="#64748B" font-size="9" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="500" text-anchor="middle">一个灰色半透明圆形云，标注</text>
<rect x="820.3" y="380.0" width="304.7" height="68.0" rx="6.0" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
<text x="972.7" y="413.5" fill="#0F172A" font-size="13" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="700" text-anchor="middle">信息内容</text>
<text x="972.7" y="431.5" fill="#64748B" font-size="9" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="500" text-anchor="middle">多个白色小矩形叠放，代表不同网页</text>
<rect x="820.3" y="462.0" width="304.7" height="68.0" rx="6.0" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
<text x="972.7" y="495.5" fill="#0F172A" font-size="13" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="700" text-anchor="middle">TCP/IP协议族</text>
<text x="972.7" y="513.5" fill="#64748B" font-size="9" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="500" text-anchor="middle">位于底层的大矩形，使用蓝色系渐变，覆盖整个架构范围</text>
<rect x="820.3" y="544.0" width="304.7" height="68.0" rx="6.0" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
<text x="972.7" y="577.5" fill="#0F172A" font-size="13" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="700" text-anchor="middle">搜索引擎/门户</text>
<text x="972.7" y="595.5" fill="#64748B" font-size="9" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="500" text-anchor="middle">在万维网与信息内容之间标注一个竖框</text>
<rect x="447.7" y="380.0" width="304.7" height="68.0" rx="6.0" fill="#ECFEFF" stroke="#22D3EE" stroke-width="1.5"/>
<text x="600.0" y="413.5" fill="#0F172A" font-size="13" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="700" text-anchor="middle">物（未连接）</text>
<text x="600.0" y="431.5" fill="#64748B" font-size="9" font-family="'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-weight="500" text-anchor="middle">一个浅橙色虚线框，位于右下角，框内放置传感器图标与执行器图标</text>
