  <text x="84" y="48" font-size="22" font-weight="700" fill="#0F172A">图1-2 物联网四层参考架构</text>
  <text x="84" y="72" font-size="12" fill="#64748B">感知 / 网络 / 平台 / 应用 四层参考架构——数据上行、指令下行，安全贯穿全栈</text>
  <rect x="1450" y="30" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
