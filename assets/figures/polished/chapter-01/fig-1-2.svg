  <text x="140" y="180" font-size="16" font-weight="700" fill="#E11D48" text-anchor="middle">安全</text>
  <text x="140" y="199" font-size="9" font-weight="600" fill="#E11D48" text-anchor="middle" letter-spacing="1.5">SECURITY</text>
