  <text x="140" y="444" font-size="13" font-weight="700" fill="#E11D48" text-anchor="middle">数据安全</text>
  <text x="140" y="460" font-size="8.5" fill="#94A3B8" text-anchor="middle">Data</text>
  <text x="140" y="664" font-size="13" font-weight="700" fill="#E11D48" text-anchor="middle">通信安全</text>
  <text x="140" y="680" font-size="8.5" fill="#94A3B8" text-anchor="middle">Network</text>
  <text x="140" y="884" font-size="13" font-weight="700" fill="#E11D48" text-anchor="middle">设备安全</text>
  <text x="140" y="900" font-size="8.5" fill="#94A3B8" text-anchor="middle">Device</text>

