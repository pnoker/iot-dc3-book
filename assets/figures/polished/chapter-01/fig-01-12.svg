<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1700" height="1040" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="35" font-size="22" font-weight="700" fill="#0F172A">图1-5-2 边云协同AIoT三级架构示意</text>
  <text x="84" y="58" font-size="12" fill="#64748B">端 · 边 · 云 三层智能分工与数据流向，边缘为实时推理载体</text>
  <rect x="1490" y="22" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1575" y="41" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="1.5">ARCHITECTURE</text>
  <line x1="60" y1="103" x2="1640" y2="103" stroke="#E2E8F0"/>

  <!-- ===== Cloud band ===== -->
  <rect x="60" y="115" width="1580" height="150" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="60" y="115" width="110" height="150" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="115" y="185" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle">云层</text>
  <text x="115" y="207" font-size="9" fill="#64748B" text-anchor="middle" letter-spacing="1">CLOUD</text>
  <text x="115" y="224" font-size="8" fill="#94A3B8" text-anchor="middle">平台服务域</text>

  <!-- cloud components -->
  <rect x="200" y="140" width="420" height="110" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="410" y="178" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">模型训练与更新</text>
  <text x="410" y="200" font-size="10" fill="#64748B" text-anchor="middle">大模型训练 · 量化剪枝</text>
  <text x="410" y="218" font-size="9" fill="#94A3B8" text-anchor="middle">高算力 · 非实时 · 全局性</text>

  <rect x="700" y="140" width="420" height="110" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="910" y="178" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">模型管理与分发</text>
  <text x="910" y="200" font-size="10" fill="#64748B" text-anchor="middle">版本管理 · 安全信道下发</text>
  <text x="910" y="218" font-size="9" fill="#94A3B8" text-anchor="middle">轻量模型仓库</text>

  <rect x="1200" y="140" width="420" height="110" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1410" y="178" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">全局监控与运维</text>
  <text x="1410" y="200" font-size="10" fill="#64748B" text-anchor="middle">节点健康 · 指标聚合</text>
  <text x="1410" y="218" font-size="9" fill="#94A3B8" text-anchor="middle">样本入库与再训练</text>

  <!-- ===== Edge band ===== -->
  <rect x="60" y="335" width="1580" height="150" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="60" y="335" width="110" height="150" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="115" y="405" font-size="17" font-weight="700" fill="#10B981" text-anchor="middle">边缘层</text>
  <text x="115" y="427" font-size="9" fill="#64748B" text-anchor="middle" letter-spacing="1">EDGE</text>
  <text x="115" y="444" font-size="8" fill="#94A3B8" text-anchor="middle">设备与边缘域</text>

  <!-- edge components -->
  <rect x="200" y="360" width="420" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="410" y="398" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">本地数据缓存与预处理</text>
  <text x="410" y="420" font-size="10" fill="#64748B" text-anchor="middle">清洗 · 归一化 · 特征提取</text>
  <text x="410" y="438" font-size="9" fill="#94A3B8" text-anchor="middle">MQTT/CoAP 接入</text>

  <rect x="700" y="360" width="420" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="910" y="398" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">边缘推理节点</text>
  <text x="910" y="420" font-size="10" fill="#64748B" text-anchor="middle">NVIDIA Jetson · 华为 Atlas</text>
  <text x="910" y="438" font-size="9" fill="#94A3B8" text-anchor="middle">中等算力 · 实时推理</text>

  <rect x="1200" y="360" width="420" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1410" y="398" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">样本回传通道</text>
  <text x="1410" y="420" font-size="10" fill="#64748B" text-anchor="middle">低置信样本 · 新类别筛选</text>
  <text x="1410" y="438" font-size="9" fill="#94A3B8" text-anchor="middle">附带原始特征值</text>

  <!-- ===== Device band ===== -->
  <rect x="60" y="555" width="1580" height="150" rx="12" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="60" y="555" width="110" height="150" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="115" y="625" font-size="17" font-weight="700" fill="#F59E0B" text-anchor="middle">端层</text>
  <text x="115" y="647" font-size="9" fill="#64748B" text-anchor="middle" letter-spacing="1">DEVICE</text>
  <text x="115" y="664" font-size="8" fill="#94A3B8" text-anchor="middle">智能决策域</text>

  <!-- device components -->
  <rect x="200" y="580" width="420" height="110" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="410" y="618" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">智能传感器与执行器</text>
  <text x="410" y="640" font-size="10" fill="#64748B" text-anchor="middle">温湿 · 视觉 · 振动 · 运动</text>
  <text x="410" y="658" font-size="9" fill="#94A3B8" text-anchor="middle">超低功耗 · 本地响应</text>

  <rect x="700" y="580" width="420" height="110" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="910" y="618" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">数据采集与本地判断</text>
  <text x="910" y="640" font-size="10" fill="#64748B" text-anchor="middle">采样 · 事件触发 · 规则判断</text>
  <text x="910" y="658" font-size="9" fill="#94A3B8" text-anchor="middle">低时延自主决策</text>

  <rect x="1200" y="580" width="420" height="110" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1410" y="618" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">低功耗 AI 芯片</text>
  <text x="1410" y="640" font-size="10" fill="#64748B" text-anchor="middle">端侧轻量推理 · MCU NPU</text>
  <text x="1410" y="658" font-size="9" fill="#94A3B8" text-anchor="middle">mW 级功耗</text>

  <!-- ===== Connections ===== -->
  <!-- 1. 模型下发  cloud -> edge  (MAIN, blue solid, highlighted) -->
  <line x1="910" y1="250" x2="910" y2="356" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <rect x="935" y="282" width="150" height="34" rx="4" fill="#FFFFFF" stroke="#DBEAFE"/>
  <text x="945" y="298" font-size="11" font-weight="700" fill="#2563EB">模型下发</text>
  <text x="945" y="312" font-size="9" fill="#64748B">量化·剪枝·安全信道</text>

  <!-- 2. 推理结果反馈  edge -> device  (orange solid) -->
  <line x1="910" y1="470" x2="910" y2="576" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
  <rect x="935" y="502" width="150" height="34" rx="4" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="945" y="518" font-size="11" font-weight="700" fill="#D97706">推理结果反馈</text>
  <text x="945" y="532" font-size="9" fill="#64748B">供端侧本地决策参考</text>

  <!-- 3. 原始数据上报  device -> edge  (green dashed, uplink) -->
  <line x1="410" y1="578" x2="410" y2="472" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <rect x="265" y="502" width="140" height="34" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="400" y="518" font-size="11" font-weight="700" fill="#10B981" text-anchor="end">原始数据上报</text>
  <text x="400" y="532" font-size="9" fill="#64748B" text-anchor="end">预处理后 MQTT/CoAP</text>

  <!-- 4. 样本回传  edge -> cloud  (gray dashed, uplink) -->
  <line x1="1410" y1="358" x2="1410" y2="252" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <rect x="1435" y="282" width="150" height="34" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1445" y="298" font-size="11" font-weight="700" fill="#7C3AED">样本回传</text>
  <text x="1445" y="312" font-size="9" fill="#64748B">低置信·新类别样本</text>

  <!-- closed-loop callout -->
  <rect x="1340" y="725" width="300" height="60" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1490" y="748" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">训练 — 推理 — 反馈 闭环</text>
  <text x="1490" y="767" font-size="10" fill="#475569" text-anchor="middle">下行承载模型与决策，上行回传数据与样本</text>

  <!-- separator before legend -->
  <line x1="60" y1="815" x2="1640" y2="815" stroke="#E2E8F0"/>

  <!-- ===== Legend ===== -->
  <text x="60" y="842" font-size="12" font-weight="700" fill="#0F172A">图例</text>

  <rect x="120" y="832" width="20" height="14" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="148" y="844" font-size="11" fill="#334155">云层 · 高算力 · 非实时 · 全局任务</text>

  <rect x="410" y="832" width="20" height="14" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="438" y="844" font-size="11" fill="#334155">边缘层 · 实时推理 · 数据过滤</text>

  <rect x="700" y="832" width="20" height="14" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="728" y="844" font-size="11" fill="#334155">端层 · 超低功耗 · 本地响应</text>

  <line x1="990" y1="839" x2="1030" y2="839" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="1042" y="844" font-size="11" fill="#334155">模型 / 结果下行</text>

  <line x1="1230" y1="839" x2="1270" y2="839" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1282" y="844" font-size="11" fill="#334155">数据 / 样本上行</text>

  <!-- caption -->
  <text x="850" y="1015" font-size="10" fill="#94A3B8" text-anchor="middle">图1-5-2 边云协同AIoT三级架构。云侧负责模型训练与更新，边缘侧承担实时推理与数据过滤，端侧运行轻量模型实现本地自主响应，三层形成"训练—推理—反馈"闭环。</text>
</svg>
