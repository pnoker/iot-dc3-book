<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="940" viewBox="0 0 1800 940" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect x="0" y="0" width="1800" height="940" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-orange" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0,11 4,0 8" fill="#F59E0B"/></marker>
    <marker id="ah-blue" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0,11 4,0 8" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- ===== 标题区 ===== -->
  <circle cx="64" cy="44" r="6" fill="#2563EB"/>
  <text x="84" y="50" font-size="22" font-weight="700" fill="#0F172A">图13-6 供应链核心痛点与区块链价值点映射</text>
  <text x="84" y="74" font-size="12" fill="#64748B">Pain Point &#8594; Blockchain Value：虚线箭头宽度表示解决力度，信息孤岛→分布式账本为主链路</text>

  <rect x="1610" y="30" width="150" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1685" y="49" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">MATRIX · MAPPING</text>

  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0"/>

  <!-- ===== 区域边界框 ===== -->
  <!-- 左侧 痛点井 -->
  <rect x="118" y="128" width="478" height="610" rx="12" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="132" y="118" width="150" height="22" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="207" y="134" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">供应链痛点域</text>

  <!-- 右侧 价值塔 -->
  <rect x="1202" y="128" width="478" height="610" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="1216" y="118" width="170" height="22" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="1301" y="134" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">区块链价值点域</text>

  <!-- 中间映射区标签 -->
  <text x="899" y="134" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">MAPPING（映射 · 非数据流）</text>

  <!-- ===== 左侧痛点卡 (橙) ===== -->
  <!-- 1 信息孤岛 -->
  <g>
    <rect x="140" y="172" width="430" height="110" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="170" cy="202" r="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="170" y="206" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">1</text>
    <text x="192" y="207" font-size="17" font-weight="700" fill="#0F172A">信息孤岛</text>
    <text x="192" y="231" font-size="12" fill="#475569">各方系统割裂，订单/库存/物流数据不共享</text>
    <text x="192" y="252" font-size="11" fill="#64748B">对账依赖线下，多方一致性差，协同延迟高</text>
    <text x="192" y="270" font-size="10" fill="#94A3B8">痛点等级：高 · 信任成本最高</text>
  </g>

  <!-- 2 伪造与假冒 -->
  <g>
    <rect x="140" y="312" width="430" height="110" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="170" cy="342" r="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="170" y="346" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">2</text>
    <text x="192" y="347" font-size="17" font-weight="700" fill="#0F172A">伪造与假冒</text>
    <text x="192" y="371" font-size="12" fill="#475569">单据、产地、检验报告易被篡改或伪造</text>
    <text x="192" y="392" font-size="11" fill="#64748B">真伪举证困难，品牌与消费者信任受损</text>
    <text x="192" y="410" font-size="10" fill="#94A3B8">痛点等级：高</text>
  </g>

  <!-- 3 溯源与召回困难 -->
  <g>
    <rect x="140" y="452" width="430" height="110" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="170" cy="482" r="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="170" y="486" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">3</text>
    <text x="192" y="487" font-size="17" font-weight="700" fill="#0F172A">溯源与召回困难</text>
    <text x="192" y="511" font-size="12" fill="#475569">批次链路断点，无法定位责任环节</text>
    <text x="192" y="532" font-size="11" fill="#64748B">问题商品召回范围模糊，成本与时间双高</text>
    <text x="192" y="550" font-size="10" fill="#94A3B8">痛点等级：中</text>
  </g>

  <!-- 4 合规审计成本高 -->
  <g>
    <rect x="140" y="592" width="430" height="110" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="170" cy="622" r="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="170" y="626" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">4</text>
    <text x="192" y="627" font-size="17" font-weight="700" fill="#0F172A">合规审计成本高</text>
    <text x="192" y="651" font-size="12" fill="#475569">跨主体对账与审计依赖人工抽样核验</text>
    <text x="192" y="672" font-size="11" fill="#64748B">流程长、周期久，合规风险敞口难以收敛</text>
    <text x="192" y="690" font-size="10" fill="#94A3B8">痛点等级：中</text>
  </g>

  <!-- ===== 右侧价值点卡 (蓝) ===== -->
  <!-- 1 分布式账本 -->
  <g>
    <rect x="1230" y="172" width="430" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="1260" cy="202" r="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1260" y="206" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">A</text>
    <text x="1282" y="207" font-size="17" font-weight="700" fill="#0F172A">分布式账本</text>
    <text x="1282" y="231" font-size="12" fill="#475569">多方共享同一账本，数据一处写入处处可读</text>
    <text x="1282" y="252" font-size="11" fill="#64748B">共识保证一致性，消除对账环节与信息壁垒</text>
    <text x="1282" y="270" font-size="10" fill="#94A3B8">价值力度：强 · 主链路解耦点</text>
  </g>

  <!-- 2 时间戳+数字签名 -->
  <g>
    <rect x="1230" y="312" width="430" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="1260" cy="342" r="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1260" y="346" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">B</text>
    <text x="1282" y="347" font-size="17" font-weight="700" fill="#0F172A">时间戳 + 数字签名</text>
    <text x="1282" y="371" font-size="12" fill="#475569">哈希上链后数据不可篡改，改动即留痕</text>
    <text x="1282" y="392" font-size="11" fill="#64748B">密码学担保真伪，举证链可信可验证</text>
    <text x="1282" y="410" font-size="10" fill="#94A3B8">价值力度：强</text>
  </g>

  <!-- 3 全链路事件日志 -->
  <g>
    <rect x="1230" y="452" width="430" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="1260" cy="482" r="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1260" y="486" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">C</text>
    <text x="1282" y="487" font-size="17" font-weight="700" fill="#0F172A">全链路事件日志</text>
    <text x="1282" y="511" font-size="12" fill="#475569">生产-物流-销售事件按序上链，可追踪</text>
    <text x="1282" y="532" font-size="11" fill="#64748B">批次链路连续，召回定位精确到环节</text>
    <text x="1282" y="550" font-size="10" fill="#94A3B8">价值力度：中</text>
  </g>

  <!-- 4 智能合约 -->
  <g>
    <rect x="1230" y="592" width="430" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="1260" cy="622" r="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1260" y="626" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">D</text>
    <text x="1282" y="627" font-size="17" font-weight="700" fill="#0F172A">智能合约</text>
    <text x="1282" y="651" font-size="12" fill="#475569">规则代码化，满足条件自动执行审计动作</text>
    <text x="1282" y="672" font-size="11" fill="#64748B">流程自动化，降低人工核验与合规成本</text>
    <text x="1282" y="690" font-size="10" fill="#94A3B8">价值力度：中</text>
  </g>

  <!-- ===== 映射虚线箭头（错位排列：1/3 略高，2/4 略低，体现 mapping 节奏） ===== -->
  <!-- 主链路 1→A 最粗 蓝 -->
  <path d="M 570 215 C 760 215, 1040 222, 1224 222" fill="none" stroke="#2563EB" stroke-width="4" stroke-dasharray="10 5" marker-end="url(#ah-blue)"/>
  <rect x="818" y="196" width="162" height="22" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="899" y="212" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">主链路 · 去中心化共享</text>

  <!-- 2→B -->
  <path d="M 570 372 C 760 372, 1040 358, 1224 358" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah-gray)"/>
  <text x="899" y="352" font-size="11" fill="#475569" text-anchor="middle">不可篡改 · 担保真伪</text>

  <!-- 3→C -->
  <path d="M 570 498 C 760 498, 1040 505, 1224 505" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah-gray)"/>
  <text x="899" y="498" font-size="11" fill="#475569" text-anchor="middle">事件可追踪 · 定位召回</text>

  <!-- 4→D -->
  <path d="M 570 652 C 760 652, 1040 642, 1224 642" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ah-gray)"/>
  <text x="899" y="636" font-size="11" fill="#475569" text-anchor="middle">规则代码化 · 自动审计</text>

  <!-- 方向提示 -->
  <text x="899" y="160" font-size="10" fill="#94A3B8" text-anchor="middle">痛点（左） ── 解耦 ──▶ 价值（右）</text>

  <!-- ===== 图例 ===== -->
  <line x1="60" y1="768" x2="1740" y2="768" stroke="#E2E8F0"/>
  <text x="64" y="792" font-size="12" font-weight="700" fill="#475569">图例</text>

  <rect x="120" y="782" width="16" height="12" rx="2" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="144" y="792" font-size="11" fill="#475569">供应链痛点（问题侧）</text>

  <rect x="320" y="782" width="16" height="12" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="344" y="792" font-size="11" fill="#475569">区块链价值点（解耦侧）</text>

  <line x1="540" y1="788" x2="588" y2="788" stroke="#2563EB" stroke-width="4" stroke-dasharray="10 5"/>
  <text x="596" y="792" font-size="11" fill="#475569">主链路（解决力度最强）</text>

  <line x1="790" y1="788" x2="838" y2="788" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="846" y="792" font-size="11" fill="#475569">映射关系（非数据流）</text>

  <text x="1010" y="792" font-size="11" fill="#94A3B8">箭头线宽 ∝ 解决力度</text>

  <!-- callout -->
  <rect x="64" y="812" width="1676" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="80" y="832" font-size="11" fill="#334155">工程取舍：区块链并非银弹——其解耦的是"跨主体信任"，而非取代 ERP/WMS。</text>
  <text x="80" y="849" font-size="11" fill="#334155">上链数据需经预言机（Oracle）担保，链下治理与隐私（零知识证明）仍是工程重点。</text>

  <!-- ===== caption ===== -->
  <text x="900" y="924" font-size="10" fill="#94A3B8" text-anchor="middle">图13-6 供应链协同中"信任"是核心障碍；区块链通过去中心化共享与不可篡改记录提供解耦方案。</text>
</svg>
