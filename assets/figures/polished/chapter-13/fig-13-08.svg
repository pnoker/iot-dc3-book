<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="46" font-size="22" font-weight="700" fill="#0F172A">中心化 vs 去中心化物联网架构对比</text>
  <text x="82" y="68" font-size="12" fill="#64748B">Centralized vs. Decentralized IoT — 组件角色 / 通信模型 / 信任锚点 / 故障影响范围</text>

  <!-- type tag -->
  <rect x="1660" y="24" width="116" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1718" y="44" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">ARCHITECTURE</text>

  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- column divider -->
  <line x1="900" y1="130" x2="900" y2="850" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ================= LEFT COLUMN: Centralized ================= -->
  <text x="480" y="148" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">中心化架构 · Centralized</text>
  <text x="480" y="168" font-size="11" fill="#64748B" text-anchor="middle">星型汇聚 · 单一可信中介</text>

  <!-- device & edge region boundary -->
  <rect x="90" y="520" width="780" height="150" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="104" y="540" font-size="10" fill="#10B981" font-weight="600">设备与边缘域</text>

  <!-- fault boundary (red dashed) around platform -->
  <rect x="305" y="195" width="350" height="135" rx="12" fill="none" stroke="#E11D48" stroke-width="1.8" stroke-dasharray="8 4"/>
  <text x="640" y="188" font-size="10" fill="#E11D48" font-weight="600" text-anchor="end">故障影响边界</text>

  <!-- central platform -->
  <rect x="340" y="220" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="480" y="252" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">中心化云平台</text>
  <text x="480" y="272" font-size="10" fill="#475569" text-anchor="middle">认证中心 · 消息路由 · 数据汇聚</text>
  <text x="480" y="290" font-size="9" fill="#64748B" text-anchor="middle">single trust anchor · global bottleneck</text>

  <!-- star connections device -> platform -->
  <g stroke="#64748B" stroke-width="1.4" fill="none" marker-end="url(#ah-gray)">
    <line x1="180" y1="585" x2="370" y2="312"/>
    <line x1="330" y1="585" x2="430" y2="312"/>
    <line x1="480" y1="585" x2="480" y2="312"/>
    <line x1="630" y1="585" x2="530" y2="312"/>
    <line x1="780" y1="585" x2="590" y2="312"/>
  </g>

  <!-- devices (green) -->
  <g>
    <circle cx="180" cy="612" r="26" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="180" y="616" font-size="10" fill="#0F172A" text-anchor="middle">设备</text>
    <circle cx="330" cy="612" r="26" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="330" y="616" font-size="10" fill="#0F172A" text-anchor="middle">设备</text>
    <circle cx="480" cy="612" r="26" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="480" y="616" font-size="10" fill="#0F172A" text-anchor="middle">设备</text>
    <circle cx="630" cy="612" r="26" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="630" y="616" font-size="10" fill="#0F172A" text-anchor="middle">设备</text>
    <circle cx="780" cy="612" r="26" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="780" y="616" font-size="10" fill="#0F172A" text-anchor="middle">设备</text>
  </g>

  <!-- annotations left (red) -->
  <g font-size="11" fill="#334155">
    <rect x="110" y="720" width="210" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="110" y="720" width="4" height="56" fill="#E11D48"/>
    <text x="126" y="742" font-weight="700" fill="#0F172A">单点信任</text>
    <text x="126" y="760" font-size="10" fill="#64748B">所有身份与授权汇集一处</text>

    <rect x="375" y="720" width="210" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="375" y="720" width="4" height="56" fill="#E11D48"/>
    <text x="391" y="742" font-weight="700" fill="#0F172A">认证中心</text>
    <text x="391" y="760" font-size="10" fill="#64748B">设备必须经平台鉴权路由</text>

    <rect x="640" y="720" width="210" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="640" y="720" width="4" height="56" fill="#E11D48"/>
    <text x="656" y="742" font-weight="700" fill="#0F172A">全局瓶颈</text>
    <text x="656" y="760" font-size="10" fill="#64748B">平台失效则全网不可用</text>
  </g>

  <!-- ================= RIGHT COLUMN: Decentralized ================= -->
  <text x="1320" y="148" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">去中心化架构 · Decentralized</text>
  <text x="1320" y="168" font-size="11" fill="#64748B" text-anchor="middle">P2P 网状 · 分布式共识</text>

  <!-- uninterrupted region (green highlight) -->
  <rect x="1095" y="245" width="450" height="360" rx="12" fill="#10B981" fill-opacity="0.05" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="1110" y="265" font-size="10" fill="#10B981" font-weight="600">共识域 · 容错运行</text>

  <!-- mesh edges (gray thin) -->
  <g stroke="#94A3B8" stroke-width="1" fill="none">
    <!-- hexagon perimeter -->
    <line x1="1320" y1="290" x2="1433" y2="355"/>
    <line x1="1433" y1="355" x2="1433" y2="485"/>
    <line x1="1433" y1="485" x2="1320" y2="550"/>
    <line x1="1320" y1="550" x2="1207" y2="485"/>
    <line x1="1207" y1="485" x2="1207" y2="355"/>
    <line x1="1207" y1="355" x2="1320" y2="290"/>
    <!-- diagonals -->
    <line x1="1320" y1="290" x2="1320" y2="550"/>
    <line x1="1433" y1="355" x2="1207" y2="485"/>
    <line x1="1207" y1="355" x2="1433" y2="485"/>
  </g>

  <!-- consensus nodes (blue) -->
  <g>
    <circle cx="1320" cy="290" r="32" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="1320" y="288" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">共识</text>
    <text x="1320" y="300" font-size="9" fill="#475569" text-anchor="middle">节点</text>

    <circle cx="1433" cy="355" r="32" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="1433" y="353" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">共识</text>
    <text x="1433" y="365" font-size="9" fill="#475569" text-anchor="middle">节点</text>

    <circle cx="1433" cy="485" r="32" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="1433" y="483" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">共识</text>
    <text x="1433" y="495" font-size="9" fill="#475569" text-anchor="middle">节点</text>

    <circle cx="1320" cy="550" r="32" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="1320" y="548" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">共识</text>
    <text x="1320" y="560" font-size="9" fill="#475569" text-anchor="middle">节点</text>

    <circle cx="1207" cy="485" r="32" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="1207" y="483" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">共识</text>
    <text x="1207" y="495" font-size="9" fill="#475569" text-anchor="middle">节点</text>

    <circle cx="1207" cy="355" r="32" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="1207" y="353" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">共识</text>
    <text x="1207" y="365" font-size="9" fill="#475569" text-anchor="middle">节点</text>
  </g>

  <!-- ledger cylinder (data domain) under mesh -->
  <g>
    <ellipse cx="1320" cy="640" rx="48" ry="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/>
    <path d="M 1272,640 L 1272,672 A 48,10 0 0 0 1368,672 L 1368,640" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/>
    <ellipse cx="1320" cy="640" rx="48" ry="10" fill="none" stroke="#7C3AED" stroke-width="1.8"/>
    <text x="1320" y="660" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">分布式账本</text>
  </g>
  <line x1="1320" y1="582" x2="1320" y2="628" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- light-node devices (green) attached to mesh -->
  <g stroke="#2563EB" stroke-width="1.4" fill="none" marker-end="url(#ah-blue)">
    <line x1="1140" y1="690" x2="1190" y2="510"/>
    <line x1="1320" y1="690" x2="1320" y2="585"/>
    <line x1="1500" y1="690" x2="1430" y2="510"/>
  </g>
  <g>
    <circle cx="1140" cy="712" r="24" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1140" y="710" font-size="9" fill="#0F172A" text-anchor="middle">轻节点</text>
    <text x="1140" y="721" font-size="8" fill="#64748B" text-anchor="middle">设备</text>
    <circle cx="1320" cy="712" r="24" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1320" y="710" font-size="9" fill="#0F172A" text-anchor="middle">轻节点</text>
    <text x="1320" y="721" font-size="8" fill="#64748B" text-anchor="middle">设备</text>
    <circle cx="1500" cy="712" r="24" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1500" y="710" font-size="9" fill="#0F172A" text-anchor="middle">轻节点</text>
    <text x="1500" y="721" font-size="8" fill="#64748B" text-anchor="middle">设备</text>
  </g>

  <!-- annotations right (blue/green) -->
  <g font-size="11" fill="#334155">
    <rect x="950" y="720" width="210" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="950" y="720" width="4" height="56" fill="#2563EB"/>
    <text x="966" y="742" font-weight="700" fill="#0F172A">分布式共识</text>
    <text x="966" y="760" font-size="10" fill="#64748B">多节点共同验证交易</text>

    <rect x="1215" y="720" width="210" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="1215" y="720" width="4" height="56" fill="#2563EB"/>
    <text x="1231" y="742" font-weight="700" fill="#0F172A">P2P 通信</text>
    <text x="1231" y="760" font-size="10" fill="#64748B">设备间直连或中继</text>

    <rect x="1480" y="720" width="210" height="56" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="1480" y="720" width="4" height="56" fill="#10B981"/>
    <text x="1496" y="742" font-weight="700" fill="#0F172A">无单点失败</text>
    <text x="1496" y="760" font-size="10" fill="#64748B">单节点失效不影响全局</text>
  </g>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="872" x2="1760" y2="872" stroke="#E2E8F0" stroke-width="1"/>
  <text x="64" y="898" font-size="11" font-weight="700" fill="#475569">图例</text>

  <g font-size="11" fill="#475569">
    <rect x="120" y="888" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="144" y="898">服务器 / 共识节点</text>

    <rect x="300" y="888" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="324" y="898">物联网终端设备</text>

    <rect x="470" y="888" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="494" y="898">故障影响边界</text>

    <rect x="640" y="888" width="16" height="12" rx="2" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="664" y="898">不中断 / 容错区域</text>

    <rect x="820" y="888" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="844" y="898">分布式账本（数据域）</text>

    <line x1="1030" y1="894" x2="1060" y2="894" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <text x="1068" y="898">主链路 / 注册交易</text>

    <line x1="1240" y1="894" x2="1270" y2="894" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="1278" y="898">汇聚 / 异步回传</text>
  </g>

  <!-- ===== Caption ===== -->
  <text x="900" y="952" font-size="10" fill="#94A3B8" text-anchor="middle">图13-3 中心化与去中心化物联网架构的核心差异。中心化模型依赖单一可信中介，去中心化模型通过分布式账本与共识机制将信任分散到网络节点。</text>
</svg>
