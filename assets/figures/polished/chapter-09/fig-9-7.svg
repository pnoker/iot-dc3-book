<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">HTTP、MQTT、CoAP应用层协议角色对比</title>
  <desc id="desc">读者应理解HTTP、MQTT、CoAP应用层协议角色对比中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">HTTP、MQTT、CoAP应用层协议角色对比</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解HTTP、MQTT、CoAP应用层协议角色对比中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">MATRIX</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="matrix">
  <!-- Column-local arrows -->
  <line x1="360" y1="435" x2="360" y2="405" stroke="#0F172A" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <line x1="360" y1="315" x2="360" y2="285" stroke="#0F172A" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <line x1="880" y1="435" x2="880" y2="405" stroke="#0F172A" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <line x1="880" y1="315" x2="880" y2="285" stroke="#0F172A" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <line x1="1400" y1="435" x2="1400" y2="405" stroke="#0F172A" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <line x1="1400" y1="315" x2="1400" y2="285" stroke="#0F172A" stroke-width="2" marker-end="url(#bp-arrow)"/>

  <!-- HTTP column -->
  <rect x="120" y="200" width="480" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="360" y="230" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">设备配网 / 网关北向</text>
  <text x="360" y="250" font-size="12" fill="#475569" text-anchor="middle">HTTP · 典型场景</text>
  <rect x="120" y="320" width="480" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="360" y="350" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">请求/响应</text>
  <text x="360" y="370" font-size="12" fill="#475569" text-anchor="middle">HTTP · 通信模型</text>
  <rect x="120" y="440" width="480" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="360" y="470" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">TCP + TLS</text>
  <text x="360" y="490" font-size="12" fill="#475569" text-anchor="middle">HTTP · 传输层</text>
  <text x="360" y="600" font-size="24" fill="#0F172A" text-anchor="middle">⚡</text>
  <text x="360" y="625" font-size="14" fill="#0F172A" text-anchor="middle">AC供电网关</text>
  <!-- MQTT column -->
  <rect x="640" y="200" width="480" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="880" y="230" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">远程监控 / 双向指令</text>
  <text x="880" y="250" font-size="12" fill="#475569" text-anchor="middle">MQTT · 典型场景</text>
  <rect x="640" y="320" width="480" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="880" y="350" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">发布/订阅（Broker中转）</text>
  <text x="880" y="370" font-size="12" fill="#475569" text-anchor="middle">MQTT · 通信模型</text>
  <rect x="640" y="440" width="480" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="880" y="470" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">TCP</text>
  <text x="880" y="490" font-size="12" fill="#475569" text-anchor="middle">MQTT · 传输层</text>
  <text x="880" y="600" font-size="24" fill="#0F172A" text-anchor="middle">Wi-Fi</text>
  <text x="880" y="625" font-size="14" fill="#0F172A" text-anchor="middle">低功耗模组</text>
  <!-- CoAP column -->
  <rect x="1160" y="200" width="480" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1400" y="230" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">传感器采集 / 状态上报</text>
  <text x="1400" y="250" font-size="12" fill="#475569" text-anchor="middle">CoAP · 典型场景</text>
  <rect x="1160" y="320" width="480" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1400" y="350" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">请求/响应 + Observe</text>
  <text x="1400" y="370" font-size="12" fill="#475569" text-anchor="middle">CoAP · 通信模型</text>
  <rect x="1160" y="440" width="480" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1400" y="470" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">UDP + DTLS</text>
  <text x="1400" y="490" font-size="12" fill="#475569" text-anchor="middle">CoAP · 传输层</text>
  <text x="1400" y="600" font-size="24" fill="#0F172A" text-anchor="middle">🔋</text>
  <text x="1400" y="625" font-size="14" fill="#0F172A" text-anchor="middle">电池供电传感器</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">浅蓝矩形块：典型场景</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">浅绿矩形块：通信模型</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">浅黄矩形块：传输层</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">HTTP适合设备配网、平台API和网关北向通信，因为它利用现有Web基础设施，调试方便、安全成熟。MQTT和CoAP面向受限设备：MQTT擅长双向消息与大规模管理，CoAP聚焦最小功耗和单对单通信。</text>
</svg>
