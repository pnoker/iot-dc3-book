<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图9-6 CoAP/LwM2M与NB-IoT协议协同架构</title>
  <desc id="desc">读者应理解CoAP/LwM2M与NB-IoT协议协同架构中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图9-6 CoAP/LwM2M与NB-IoT协议协同架构</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解CoAP/LwM2M与NB-IoT协议协同架构中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
  <!-- 无线接入层 (NB-IoT) -->
  <rect x="200" y="440" width="1200" height="80" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="800" y="480" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">无线接入: NB-IoT (eDRX/PSM)</text>
  <text x="800" y="500" fill="#475569" font-size="12" text-anchor="middle">空口开销约几十字节</text>

  <!-- 消息协议层 (CoAP) -->
  <rect x="200" y="350" width="1200" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="800" y="390" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">消息协议: CoAP (CON/NON, 5683/5684)</text>
  <text x="800" y="410" fill="#475569" font-size="12" text-anchor="middle">4~20字节头部</text>

  <!-- 设备管理层 (LwM2M) -->
  <rect x="200" y="260" width="1200" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="800" y="300" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">设备管理: LwM2M对象树</text>
  <text x="800" y="320" fill="#475569" font-size="12" text-anchor="middle">以百字节为单位</text>

  <!-- 业务应用层 -->
  <rect x="200" y="170" width="1200" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="800" y="210" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">应用: 停车管理、计费系统</text>
  <text x="800" y="230" fill="#475569" font-size="12" text-anchor="middle">不固定</text>

  <!-- 垂直箭头连线 (从下到上) -->
  <!-- 无线->消息 -->
  <line x1="800" y1="440" x2="800" y2="435" stroke="#2563EB" stroke-width="3" marker-end="url(#bp-arrow-primary)"/>
  <rect x="810" y="420" width="80" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="850" y="434" fill="#0F172A" font-size="11" text-anchor="middle">承载无线帧</text>

  <!-- 消息->设备 -->
  <line x1="800" y1="350" x2="800" y2="345" stroke="#2563EB" stroke-width="3" marker-end="url(#bp-arrow-primary)"/>
  <rect x="810" y="330" width="100" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="860" y="344" fill="#0F172A" font-size="11" text-anchor="middle">携带LwM2M消息</text>

  <!-- 设备->应用 -->
  <line x1="800" y1="260" x2="800" y2="255" stroke="#2563EB" stroke-width="3" marker-end="url(#bp-arrow-primary)"/>
  <rect x="810" y="240" width="90" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="855" y="254" fill="#0F172A" font-size="11" text-anchor="middle">提供设备抽象</text>

  <!-- 左侧标准组织标注（竖排） -->
  <g fill="#64748B" font-size="12">
    <text x="130" y="215" text-anchor="middle" font-weight="600">业务系统</text>
    <text x="130" y="305" text-anchor="middle" font-weight="600">OMA</text>
    <text x="130" y="395" text-anchor="middle" font-weight="600">IETF</text>
    <text x="130" y="485" text-anchor="middle" font-weight="600">3GPP</text>
  </g>
  <text x="110" y="540" fill="#64748B" font-size="10" text-anchor="middle" transform="rotate(-90,110,540)">标准组织</text>

  <!-- 右侧典型报文大小标注（竖排） -->
  <g fill="#64748B" font-size="11">
    <text x="1470" y="215" text-anchor="middle">不固定</text>
    <text x="1470" y="305" text-anchor="middle">百字节</text>
    <text x="1470" y="395" text-anchor="middle">4~20字节头部</text>
    <text x="1470" y="485" text-anchor="middle">几十字节</text>
  </g>
  <text x="1490" y="540" fill="#64748B" font-size="10" text-anchor="middle" transform="rotate(90,1490,540)">典型报文大小</text>

  <!-- 底部场景说明 -->
  <text x="800" y="620" fill="#475569" font-size="11" text-anchor="middle">假设场景：共享停车位地磁传感器，NON消息用于周期性上报，CON消息用于远程配置和固件升级</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">中灰：业务应用层</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头表示‘承载/提供抽象’，方向从下到上</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">左侧标注标准组织，右侧标注典型报文大小边界</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图9-6 CoAP/LwM2M与NB-IoT协议协同架构。左侧标注各层标准组织，右侧标注典型报文字节大小边界。底部加注‘假设场景：共享停车位地磁传感器，NON消息用于周期性上报，CON消息用于远程配置和固件升级’。</text>
</svg>
