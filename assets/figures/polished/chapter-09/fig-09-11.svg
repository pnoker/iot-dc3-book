<svg xmlns="http://www.w3.org/2000/svg" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif" viewBox="0 0 1600 1100" width="1600" height="1100">
  <rect x="0" y="0" width="1600" height="1100" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#10B981"/></marker>
  </defs>

  <!-- ===== 标题区 ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="46" font-size="22" font-weight="700" fill="#0F172A">图9-11 MCP协议交互序列图</text>
  <text x="82" y="68" font-size="12" fill="#64748B">AI Agent 通过 MCP Broker 与 IoT 设备完成能力获取、动作执行与上下文更新的完整交互循环</text>
  <rect x="1430" y="26" width="120" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1490" y="44" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">SEQUENCE</text>
  <line x1="40" y1="93" x2="1560" y2="93" stroke="#E2E8F0"/>

  <!-- ===== 参与者生命线 ===== -->
  <!-- AI Agent (intelligence / 蓝) -->
  <g>
    <rect x="160" y="110" width="240" height="68" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="280" y="140" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">AI Agent</text>
    <text x="280" y="160" font-size="10" fill="#64748B" text-anchor="middle">意图识别与决策</text>
    <line x1="280" y1="184" x2="280" y2="985" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.55"/>
  </g>
  <!-- MCP Broker (platform / 灰) -->
  <g>
    <rect x="700" y="110" width="240" height="68" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="820" y="140" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">MCP Broker</text>
    <text x="820" y="160" font-size="10" fill="#64748B" text-anchor="middle">协议翻译 · 上下文管理</text>
    <line x1="820" y1="184" x2="820" y2="985" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.55"/>
  </g>
  <!-- IoT Device (device / 绿) -->
  <g>
    <rect x="1240" y="110" width="240" height="68" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1360" y="140" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">IoT Device</text>
    <text x="1360" y="160" font-size="10" fill="#64748B" text-anchor="middle">原生协议终端 (MQTT/CoAP)</text>
    <line x1="1360" y1="184" x2="1360" y2="985" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.55"/>
  </g>

  <!-- ===== 阶段区域带 ===== -->
  <!-- 阶段一：能力获取 -->
  <rect x="40" y="206" width="1520" height="366" rx="12" fill="#2563EB" fill-opacity="0.04" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="56" y="196" width="150" height="22" rx="4" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="131" y="212" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">阶段一 · 能力获取</text>

  <!-- 阶段二：意图识别与动作执行 -->
  <rect x="40" y="586" width="1520" height="272" rx="12" fill="#64748B" fill-opacity="0.045" stroke="#64748B" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="56" y="576" width="210" height="22" rx="4" fill="#FFFFFF" stroke="#64748B"/>
  <text x="161" y="592" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">阶段二 · 意图识别与动作执行</text>

  <!-- 阶段三：上下文更新 -->
  <rect x="40" y="872" width="1520" height="110" rx="12" fill="#10B981" fill-opacity="0.045" stroke="#10B981" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="56" y="862" width="170" height="22" rx="4" fill="#FFFFFF" stroke="#10B981"/>
  <text x="141" y="878" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">阶段三 · 上下文更新</text>

  <!-- ===== 消息序列 ===== -->
  <!-- 1. A→B 查询能力描述 -->
  <text x="550" y="244" font-size="12" fill="#0F172A" text-anchor="middle">① 查询能力描述 (Query Capabilities)</text>
  <line x1="280" y1="256" x2="816" y2="256" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- 2. B→A 返回能力描述JSON -->
  <text x="550" y="300" font-size="12" fill="#0F172A" text-anchor="middle">② 返回能力描述 JSON (tools/resources)</text>
  <line x1="820" y1="312" x2="284" y2="312" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>

  <!-- 3. A→B 查询当前上下文 -->
  <text x="550" y="356" font-size="12" fill="#0F172A" text-anchor="middle">③ 查询设备当前上下文 (Query Context)</text>
  <line x1="280" y1="368" x2="816" y2="368" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- 4. B→C 转发上下文请求 -->
  <text x="1090" y="412" font-size="12" fill="#0F172A" text-anchor="middle">④ 转发获取上下文请求</text>
  <line x1="820" y1="424" x2="1356" y2="424" stroke="#64748B" stroke-width="2" marker-end="url(#ah-gray)"/>

  <!-- 5. C→B 返回设备上下文JSON -->
  <text x="1090" y="468" font-size="12" fill="#0F172A" text-anchor="middle">⑤ 返回设备当前上下文 JSON</text>
  <line x1="1360" y1="480" x2="824" y2="480" stroke="#10B981" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-green)"/>

  <!-- 6. B→A 返回当前上下文 -->
  <text x="550" y="524" font-size="12" fill="#0F172A" text-anchor="middle">⑥ 返回当前上下文 (Context Snapshot)</text>
  <line x1="820" y1="536" x2="284" y2="536" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>

  <!-- 7. A 自环 意图识别 & 动作翻译 -->
  <path d="M 280 624 L 168 624 L 168 666 L 276 666" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="224" y="618" font-size="12" fill="#0F172A" text-anchor="middle">⑦ 意图识别 &amp; 动作翻译 (内部)</text>
  <text x="120" y="650" font-size="10" fill="#64748B">LLM 推理</text>

  <!-- 8. A→B 动作执行请求 -->
  <text x="550" y="696" font-size="12" fill="#0F172A" text-anchor="middle">⑧ 动作执行请求 (Action Request)</text>
  <line x1="280" y1="708" x2="816" y2="708" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- 9. B→C 协议翻译并转发 — 关键桥接高亮 -->
  <text x="1090" y="752" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">⑨ 协议翻译并转发 (MQTT/CoAP)</text>
  <line x1="820" y1="766" x2="1356" y2="766" stroke="#64748B" stroke-width="3" marker-end="url(#ah-gray)"/>
  <rect x="1010" y="775" width="160" height="20" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1090" y="789" font-size="10" fill="#334155" text-anchor="middle">★ 关键桥接：高层动作 → 原生协议</text>

  <!-- 10. C→B 设备执行并返回结果 -->
  <text x="1090" y="812" font-size="12" fill="#0F172A" text-anchor="middle">⑩ 设备执行并返回结果</text>
  <line x1="1360" y1="824" x2="824" y2="824" stroke="#10B981" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-green)"/>

  <!-- 11. B→A 返回执行结果 -->
  <text x="550" y="844" font-size="12" fill="#0F172A" text-anchor="middle">⑪ 返回执行结果 + 上下文 diff</text>
  <line x1="820" y1="856" x2="284" y2="856" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>

  <!-- 12. A→B 上下文更新通知（可选） -->
  <text x="550" y="900" font-size="12" fill="#0F172A" text-anchor="middle">⑫ 上下文更新通知 Notify (可选)</text>
  <line x1="280" y1="912" x2="816" y2="912" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-blue)"/>

  <!-- 13. B→C 同步上下文更新（可选） -->
  <text x="1090" y="948" font-size="12" fill="#0F172A" text-anchor="middle">⑬ 同步上下文更新 (可选)</text>
  <line x1="820" y1="960" x2="1356" y2="960" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>

  <!-- 生命线端点圆 -->
  <circle cx="280" cy="985" r="4" fill="#2563EB"/>
  <circle cx="820" cy="985" r="4" fill="#64748B"/>
  <circle cx="1360" cy="985" r="4" fill="#10B981"/>

  <!-- ===== 图例 ===== -->
  <line x1="40" y1="1000" x2="1560" y2="1000" stroke="#E2E8F0"/>
  <text x="40" y="1024" font-size="11" font-weight="700" fill="#475569">图例</text>

  <!-- 实线箭头 -->
  <line x1="120" y1="1038" x2="160" y2="1038" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="168" y="1042" font-size="11" fill="#475569">实线 = 请求 / 事件</text>

  <!-- 虚线箭头 -->
  <line x1="340" y1="1038" x2="380" y2="1038" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="388" y="1042" font-size="11" fill="#475569">虚线 = 响应 / 异步通知</text>

  <!-- 域色块 -->
  <rect x="600" y="1031" width="16" height="14" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="622" y="1042" font-size="11" fill="#475569">智能决策域 (AI Agent)</text>

  <rect x="820" y="1031" width="16" height="14" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="842" y="1042" font-size="11" fill="#475569">平台服务域 (MCP Broker)</text>

  <rect x="1050" y="1031" width="16" height="14" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1072" y="1042" font-size="11" fill="#475569">设备域 (IoT Device)</text>

  <!-- 阶段带说明 -->
  <rect x="1290" y="1031" width="16" height="14" rx="2" fill="none" stroke="#64748B" stroke-dasharray="3 2"/>
  <text x="1312" y="1042" font-size="11" fill="#475569">虚框 = 交互阶段</text>

  <!-- ===== caption ===== -->
  <text x="800" y="1078" font-size="10" fill="#94A3B8" text-anchor="middle">图9-11 MCP协议交互序列图：AI Agent 通过 MCP Broker 与物联网设备完成能力获取、动作执行与上下文更新的完整流程。</text>
</svg>
