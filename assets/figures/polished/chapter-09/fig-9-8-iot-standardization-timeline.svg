<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图9-8 物联网标准化演进时间线</title>
  <desc id="desc">应理解标准化从垂直割据→水平整合→语义统一的三阶段主线，以及MCP在当前阶段的定位。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图9-8 物联网标准化演进时间线</text>
  <text x="82" y="70" fill="#64748B" font-size="12">应理解标准化从垂直割据→水平整合→语义统一的三阶段主线，以及MCP在当前阶段的定位。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">TIMELINE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="timeline">
  <!-- Phase region 1: 标准割据期 -->
  <rect x="150" y="160" width="450" height="360" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="165" y="185" fill="#475569" font-size="14" font-weight="600">标准割据期 (2000-2010)</text>
  <text x="165" y="202" fill="#64748B" font-size="11">垂直标准各行其是</text>
  
  <!-- Phase region 2: 联盟整合期 -->
  <rect x="650" y="160" width="450" height="360" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="665" y="185" fill="#475569" font-size="14" font-weight="600">联盟整合期 (2010-2018)</text>
  <text x="665" y="202" fill="#64748B" font-size="11">水平平台与资源模型搭建</text>
  
  <!-- Phase region 3: 语义互操作期 -->
  <rect x="1150" y="160" width="450" height="360" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="1165" y="185" fill="#475569" font-size="14" font-weight="600">语义互操作期 (2018-)</text>
  <text x="1165" y="202" fill="#64748B" font-size="11">语义本体与AI交互展开</text>
  
  <!-- Arrows (drawn before cards) -->
  <!-- Modbus -> oneM2M -->
  <line x1="340" y1="225" x2="780" y2="225" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="540" y="213" width="60" height="18" fill="white" rx="4"/>
  <text x="570" y="226" fill="#0F172A" font-size="11" text-anchor="middle">接入抽象</text>
  
  <!-- ZigBee -> oneM2M -->
  <line x1="340" y1="325" x2="780" y2="225" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="540" y="263" width="60" height="18" fill="white" rx="4"/>
  <text x="570" y="276" fill="#0F172A" font-size="11" text-anchor="middle">接入抽象</text>
  
  <!-- OMA DM -> oneM2M -->
  <line x1="340" y1="425" x2="780" y2="225" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="540" y="313" width="60" height="18" fill="white" rx="4"/>
  <text x="570" y="326" fill="#0F172A" font-size="11" text-anchor="middle">接入抽象</text>
  
  <!-- oneM2M -> W3C WoT -->
  <line x1="900" y1="225" x2="1230" y2="325" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="1045" y="263" width="60" height="18" fill="white" rx="4"/>
  <text x="1075" y="276" fill="#0F172A" font-size="11" text-anchor="middle">语义对齐</text>
  
  <!-- IETF CoRE -> W3C WoT -->
  <line x1="900" y1="425" x2="1230" y2="325" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="1045" y="363" width="60" height="18" fill="white" rx="4"/>
  <text x="1075" y="376" fill="#0F172A" font-size="11" text-anchor="middle">语义对齐</text>
  
  <!-- W3C WoT -> MCP -->
  <line x1="1350" y1="325" x2="1450" y2="325" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1380" y="313" width="60" height="18" fill="white" rx="4"/>
  <text x="1410" y="326" fill="#0F172A" font-size="11" text-anchor="middle">融合演进</text>
  
  <!-- Cards -->
  <!-- Modbus -->
  <rect x="220" y="200" width="120" height="50" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="280" y="228" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Modbus</text>
  
  <!-- ZigBee -->
  <rect x="220" y="300" width="120" height="50" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="280" y="328" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">ZigBee</text>
  
  <!-- OMA DM -->
  <rect x="220" y="400" width="120" height="50" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="280" y="428" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">OMA DM</text>
  
  <!-- oneM2M -->
  <rect x="780" y="200" width="120" height="50" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="840" y="228" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">oneM2M</text>
  
  <!-- IETF CoRE -->
  <rect x="780" y="400" width="120" height="50" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="840" y="428" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">IETF CoRE</text>
  
  <!-- W3C WoT -->
  <rect x="1230" y="300" width="120" height="50" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1290" y="328" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">W3C WoT</text>
  
  <!-- MCP -->
  <rect x="1460" y="300" width="120" height="50" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1520" y="328" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">MCP</text>
  
  <!-- Timeline axis -->
  <line x1="150" y1="560" x2="1600" y2="560" stroke="#94A3B8" stroke-width="2"/>
  <text x="375" y="580" fill="#64748B" font-size="12" text-anchor="middle">2000-2010</text>
  <text x="875" y="580" fill="#64748B" font-size="12" text-anchor="middle">2010-2018</text>
  <text x="1375" y="580" fill="#64748B" font-size="12" text-anchor="middle">2018-</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">灰色：垂直领域标准（割据期）</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色：水平平台/中间层（整合期）</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">橙色：语义互操作与AI交互（语义期）</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图9-8 物联网标准化演进时间线（基于公开标准信息整理，时间范围与阶段起止年为示意性节点划分）。</text>
</svg>
