<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="825" viewBox="0 0 1280 825" role="img" aria-label="图4-1 NB-IoT 网络架构示意" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif" text-rendering="geometricPrecision">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- 1. 白底 -->
  <rect x="0" y="0" width="1280" height="825" fill="#FFFFFF"/>

  <!-- 3. 标题区 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图4-1 NB-IoT 网络架构示意</text>
  <text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">终端至应用的端到端通信路径与 3GPP 接口分工</text>
  <rect x="1162" y="28" width="86" height="24" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1205" y="45" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">TOPOLOGY</text>

  <!-- 4. 标题分隔线 -->
  <line x1="58" y1="103" x2="1222" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 5. 区域边界框 -->
  <!-- 业务交付域 (gray) -->
  <rect x="500" y="112" width="280" height="204" rx="12" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="512" y="130" fill="#64748B" font-size="11" font-weight="600">业务交付边界</text>
  <!-- 3GPP 核心网域 (blue) -->
  <rect x="300" y="336" width="680" height="114" rx="12" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="312" y="354" fill="#2563EB" font-size="11" font-weight="600">3GPP 核心网域（EPC）</text>
  <!-- 设备接入域 (green) -->
  <rect x="500" y="474" width="280" height="226" rx="12" fill="none" stroke="#10B981" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="512" y="492" fill="#10B981" font-size="11" font-weight="600">设备接入边界</text>

  <!-- 6. 连接箭头（先于节点绘制） -->
  <!-- 上行主链路（蓝 2px 加粗高亮） -->
  <!-- 终端 → 基站 -->
  <line x1="640" y1="624" x2="640" y2="566" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <!-- 基站 → S-GW -->
  <line x1="640" y1="496" x2="640" y2="438" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <!-- S-GW → P-GW（用户面） -->
  <line x1="722" y1="402" x2="778" y2="402" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <!-- P-GW → IoT 平台（L 弯，SGi） -->
  <path d="M 860 368 L 860 330 L 640 330 L 640 312" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <!-- IoT 平台 → 应用 -->
  <line x1="640" y1="242" x2="640" y2="190" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- MME 控制面（虚线灰） -->
  <line x1="502" y1="402" x2="556" y2="402" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 下行控制流（虚线灰，贯穿） -->
  <line x1="1015" y1="200" x2="1015" y2="618" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8 4" marker-end="url(#ah-gray)"/>

  <!-- 接口标注（加粗） -->
  <text x="654" y="598" fill="#334155" font-size="11" font-weight="700">Uu 空口</text>
  <text x="626" y="598" fill="#2563EB" font-size="10" font-weight="600" text-anchor="end">上行数据</text>
  <text x="654" y="470" fill="#334155" font-size="11" font-weight="700">S1 接口</text>
  <text x="750" y="394" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">用户面</text>
  <text x="750" y="322" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">SGi 接口</text>
  <text x="654" y="220" fill="#334155" font-size="11" font-weight="700">应用接口</text>
  <text x="530" y="394" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle">控制面</text>
  <text x="1030" y="412" fill="#64748B" font-size="11" font-weight="600">下行指令</text>
  <text x="1030" y="426" fill="#94A3B8" font-size="9" font-weight="500">应用 → 终端</text>

  <!-- 7. 节点 -->
  <!-- 业务应用 -->
  <rect x="540" y="124" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="640" y="152" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">业务应用</text>
  <text x="640" y="170" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">应用服务器</text>
  <!-- IoT 平台 -->
  <rect x="540" y="244" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="640" y="272" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">IoT 平台</text>
  <text x="640" y="290" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">设备接入与数据</text>
  <!-- MME -->
  <rect x="340" y="370" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="420" y="398" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">MME</text>
  <text x="420" y="416" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">移动性管理</text>
  <!-- S-GW -->
  <rect x="560" y="370" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="640" y="398" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">S-GW</text>
  <text x="640" y="416" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">服务网关</text>
  <!-- P-GW -->
  <rect x="780" y="370" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="860" y="398" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">P-GW</text>
  <text x="860" y="416" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">PDN 网关</text>
  <!-- 基站 -->
  <rect x="540" y="498" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="526" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">基站</text>
  <text x="640" y="544" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">NB-IoT eNodeB</text>
  <!-- 终端 -->
  <rect x="540" y="626" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="654" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">终端</text>
  <text x="640" y="672" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">传感器设备</text>

  <!-- 8. callout：FDD 半双工注记（置于 Uu 空口语义相关处） -->
  <rect x="800" y="560" width="190" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="895" y="578" fill="#334155" font-size="10" font-weight="500" text-anchor="middle">NB-IoT 空口仅支持</text>
  <text x="895" y="594" fill="#334155" font-size="10" font-weight="700" text-anchor="middle">FDD 半双工类型</text>

  <!-- 9. 图例区（所有边界框之外） -->
  <line x1="58" y1="722" x2="1222" y2="722" stroke="#E2E8F0" stroke-width="1"/>
  <!-- 颜色项 -->
  <rect x="80" y="744" width="22" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="110" y="754" fill="#64748B" font-size="11" font-weight="600">核心网 / 平台服务</text>
  <rect x="260" y="744" width="22" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="290" y="754" fill="#64748B" font-size="11" font-weight="600">终端 / 接入设备</text>
  <rect x="430" y="744" width="22" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="460" y="754" fill="#64748B" font-size="11" font-weight="600">业务应用</text>
  <!-- 箭头项 -->
  <line x1="570" y1="750" x2="604" y2="750" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="612" y="754" fill="#64748B" font-size="11" font-weight="600">上行数据流</text>
  <line x1="730" y1="750" x2="764" y2="750" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8 4" marker-end="url(#ah-gray)"/>
  <text x="772" y="754" fill="#64748B" font-size="11" font-weight="600">下行指令流</text>
  <text x="890" y="754" fill="#64748B" font-size="11" font-weight="600">加粗标签 = 3GPP 关键接口</text>

  <!-- 10. caption -->
  <text x="640" y="798" fill="#94A3B8" font-size="10" text-anchor="middle">图4-1 NB-IoT 从终端到应用的端到端网络架构，标注 Uu / S1 / SGi 关键 3GPP 接口与上下行路径。</text>
</svg>