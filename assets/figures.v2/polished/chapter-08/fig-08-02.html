<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>图8-2 物联网纵深防御多层模型</title>
<style>html,body{margin:0;padding:0;background:#FFFFFF}body{min-height:100vh;display:flex;align-items:center;justify-content:center}svg{width:min(1600px,100vw);height:auto;display:block}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-label="图8-2 物联网纵深防御多层模型" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
<marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
<marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
<marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
<marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
<marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
</defs>

<rect x="0" y="0" width="1600" height="970" fill="#FFFFFF"/>

<!-- 标题区 -->
<circle cx="64" cy="40" r="6" fill="#E11D48"/>
<text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图8-2 物联网纵深防御多层模型</text>
<text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">从物理到应用的逐层防御面，与跨层补偿控制共同构成纵深阻断</text>
<rect x="1480" y="28" width="96" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="1528" y="45" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">LAYERED</text>

<line x1="58" y1="103" x2="1542" y2="103" stroke="#E2E8F0" stroke-width="1"/>

<!-- 纵深防御边界 -->
<rect x="60" y="125" width="1480" height="705" rx="12" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="8 4"/>
<text x="80" y="148" fill="#64748B" font-size="11" font-weight="600">纵深防御边界</text>

<!-- 攻击路径（左侧红色，自底向上） -->
<line x1="105" y1="820" x2="105" y2="150" stroke="#E11D48" stroke-width="1.5" marker-end="url(#ah-red)"/>
<text x="88" y="485" fill="#E11D48" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(-90 88 485)">攻击路径 · 逐层突破</text>

<!-- 防御阻断（右侧绿色，自顶向下） -->
<line x1="1500" y1="150" x2="1500" y2="820" stroke="#10B981" stroke-width="1.5" marker-end="url(#ah-green)"/>
<text x="1517" y="485" fill="#10B981" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(90 1517 485)">防御阻断 · 反向拦截</text>

<!-- 补偿控制主链路（灰色虚线 2px，连接 L3 与 L2） -->
<path d="M 240 504 L 210 504 L 210 592 L 240 592" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 4"/>
<rect x="225" y="514" width="615" height="68" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="241" y="536" fill="#0F172A" font-size="11" font-weight="700">补偿控制（主链路 · 灰色虚线）</text>
<text x="241" y="556" fill="#334155" font-size="10" font-weight="500">示例：L2 缺硬件信任根时，L3 增设证书锁定与异常流量检测予以补偿；</text>
<text x="241" y="572" fill="#334155" font-size="10" font-weight="500">跨层补偿使单层失效不致全链失守。</text>

<!-- L5 应用安全 -->
<rect x="240" y="160" width="1060" height="88" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<text x="270" y="196" fill="#0F172A" font-size="14" font-weight="700">L5 · 应用安全</text>
<text x="270" y="218" fill="#475569" font-size="10" font-weight="500">业务接口鉴权 · 输入校验 · 越权防护</text>
<text x="1280" y="196" fill="#F59E0B" font-size="11" font-weight="600" text-anchor="end">应用域</text>

<!-- L4 平台服务 -->
<rect x="240" y="288" width="1060" height="88" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="270" y="324" fill="#0F172A" font-size="14" font-weight="700">L4 · 平台服务</text>
<text x="270" y="346" fill="#475569" font-size="10" font-weight="500">设备管理 · OTA 升级 · 权限策略</text>
<text x="1280" y="324" fill="#2563EB" font-size="11" font-weight="600" text-anchor="end">平台域</text>

<!-- L3 网络通信 -->
<rect x="240" y="416" width="1060" height="88" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<text x="270" y="452" fill="#0F172A" font-size="14" font-weight="700">L3 · 网络通信</text>
<text x="270" y="474" fill="#475569" font-size="10" font-weight="500">TLS 加密 · 证书锁定 · 异常流量检测</text>
<text x="1280" y="452" fill="#10B981" font-size="11" font-weight="600" text-anchor="end">接入域</text>

<!-- L2 硬件信任根 -->
<rect x="240" y="592" width="1060" height="88" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<text x="270" y="628" fill="#0F172A" font-size="14" font-weight="700">L2 · 硬件信任根</text>
<text x="270" y="650" fill="#475569" font-size="10" font-weight="500">安全启动 · 密钥存储 · 防回滚</text>
<text x="1280" y="628" fill="#10B981" font-size="11" font-weight="600" text-anchor="end">设备域</text>

<!-- L1 物理防护 -->
<rect x="240" y="720" width="1060" height="88" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
<text x="270" y="756" fill="#0F172A" font-size="14" font-weight="700">L1 · 物理防护</text>
<text x="270" y="778" fill="#475569" font-size="10" font-weight="500">防拆封 · 端口封闭 · 电磁屏蔽</text>
<text x="1280" y="756" fill="#E11D48" font-size="11" font-weight="600" text-anchor="end">物理域</text>

<!-- 图例 -->
<line x1="58" y1="855" x2="1542" y2="855" stroke="#E2E8F0" stroke-width="1"/>
<rect x="474" y="880" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="494" y="889" fill="#64748B" font-size="11" font-weight="600">防御层（按域着色）</text>
<line x1="644" y1="885" x2="662" y2="885" stroke="#E11D48" stroke-width="1.5" marker-end="url(#ah-red)"/>
<text x="668" y="889" fill="#64748B" font-size="11" font-weight="600">攻击者逐层突破路径</text>
<line x1="818" y1="885" x2="836" y2="885" stroke="#10B981" stroke-width="1.5" marker-end="url(#ah-green)"/>
<text x="842" y="889" fill="#64748B" font-size="11" font-weight="600">防御方反向阻断信号</text>
<line x1="992" y1="885" x2="1010" y2="885" stroke="#64748B" stroke-width="2" stroke-dasharray="5 3"/>
<text x="1016" y="889" fill="#64748B" font-size="11" font-weight="600">补偿控制（主链路）</text>

<text x="800" y="940" fill="#94A3B8" font-size="10" text-anchor="middle">图8-2 纵深防御的层次结构、攻击面与防御阻断方向，以及补偿控制的跨层连接。</text>
</svg>
</body>
</html>
