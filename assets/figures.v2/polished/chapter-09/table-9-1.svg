  <text x="180" y="168" fill="#0F172A" font-size="13" font-weight="700">对比维度</text>
  <text x="180" y="192" fill="#94A3B8" font-size="10" font-weight="500">↓ 维度 · → 协议</text>

  <text x="404" y="168" fill="#2563EB" font-size="16" font-weight="700">MQTT</text>
  <text x="404" y="193" fill="#475569" font-size="11" font-weight="500">发布订阅</text>
  <text x="652" y="168" fill="#10B981" font-size="16" font-weight="700">CoAP</text>
  <text x="652" y="193" fill="#475569" font-size="11" font-weight="500">受限设备 REST</text>
  <text x="900" y="168" fill="#64748B" font-size="16" font-weight="700">HTTP</text>
  <text x="900" y="193" fill="#475569" font-size="11" font-weight="500">请求响应</text>
  <text x="1148" y="168" fill="#7C3AED" font-size="16" font-weight="700">AMQP</text>
  <text x="1148" y="193" fill="#475569" font-size="11" font-weight="500">企业消息队列</text>
  <text x="1396" y="168" fill="#F59E0B" font-size="16" font-weight="700">LwM2M</text>
  <text x="1396" y="193" fill="#475569" font-size="11" font-weight="500">轻量设备管理</text>
</g>

<!-- 维度标签列 -->
<g text-anchor="middle" dominant-baseline="middle">
  <text x="180" y="257" fill="#0F172A" font-size="13" font-weight="700">传输层</text>
  <text x="180" y="279" fill="#94A3B8" font-size="10" font-weight="500">Transport</text>
  <text x="180" y="357" fill="#0F172A" font-size="13" font-weight="700">QoS 能力</text>
  <text x="180" y="379" fill="#94A3B8" font-size="10" font-weight="500">Quality of Service</text>
