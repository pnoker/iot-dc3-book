<rect x="0" y="0" width="1600" height="950" fill="#FFFFFF"/>

<!-- 标题区 -->
<circle cx="64" cy="40" r="6" fill="#2563EB"/>
<text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">协议选择对比表</text>
<text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">从传输层、QoS、延时、功耗、场景五维度横向对比主流应用层协议，辅助选型决策。</text>
<rect x="1430" y="28" width="110" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="1485" y="47" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">MATRIX</text>
<line x1="58" y1="103" x2="1542" y2="103" stroke="#E2E8F0" stroke-width="1"/>

<!-- 表格底色：表头行 + 维度列 -->
