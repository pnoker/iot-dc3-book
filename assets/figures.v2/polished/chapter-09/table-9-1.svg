<rect x="80" y="215" width="200" height="500" fill="#F8FAFC"/>

<!-- 表格边框 + 横竖网格 -->
<rect x="80" y="140" width="1440" height="575" fill="none" stroke="#CBD5E1" stroke-width="1"/>
