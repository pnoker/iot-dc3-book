  <text x="180" y="479" fill="#94A3B8" font-size="10" font-weight="500">Latency</text>
  <text x="180" y="557" fill="#0F172A" font-size="13" font-weight="700">功耗水平</text>
  <text x="180" y="579" fill="#94A3B8" font-size="10" font-weight="500">Power</text>
  <text x="180" y="657" fill="#0F172A" font-size="13" font-weight="700">典型场景</text>
  <text x="180" y="679" fill="#94A3B8" font-size="10" font-weight="500">Scenario</text>
</g>

<!-- 单元格文字 -->
<g text-anchor="middle" dominant-baseline="middle">
  <!-- 传输层 -->
  <text x="404" y="257" fill="#0F172A" font-size="13" font-weight="600">TCP</text>
  <text x="404" y="279" fill="#64748B" font-size="10" font-weight="500">长连接</text>
  <text x="652" y="265" fill="#0F172A" font-size="13" font-weight="600">UDP</text>
  <text x="900" y="257" fill="#0F172A" font-size="13" font-weight="600">TCP</text>
  <text x="900" y="279" fill="#64748B" font-size="10" font-weight="500">短连接</text>
  <text x="1148" y="257" fill="#0F172A" font-size="13" font-weight="600">TCP</text>
  <text x="1148" y="279" fill="#64748B" font-size="10" font-weight="500">长连接</text>
  <text x="1396" y="265" fill="#0F172A" font-size="13" font-weight="600">UDP / SMS</text>

  <!-- QoS 能力 -->
  <text x="404" y="357" fill="#0F172A" font-size="13" font-weight="600">QoS 0/1/2</text>
  <text x="404" y="379" fill="#64748B" font-size="10" font-weight="500">三级语义</text>
  <text x="652" y="357" fill="#0F172A" font-size="13" font-weight="600">CON / NON</text>
  <text x="652" y="379" fill="#64748B" font-size="10" font-weight="500">确认机制</text>
  <text x="900" y="357" fill="#0F172A" font-size="13" font-weight="600">无原生 QoS</text>
  <text x="900" y="379" fill="#64748B" font-size="10" font-weight="500">应用层重试</text>
  <text x="1148" y="357" fill="#0F172A" font-size="13" font-weight="600">事务确认</text>
  <text x="1148" y="379" fill="#64748B" font-size="10" font-weight="500">持久化可靠</text>
  <text x="1396" y="357" fill="#0F172A" font-size="13" font-weight="600">承载于 CoAP</text>
  <text x="1396" y="379" fill="#64748B" font-size="10" font-weight="500">无独立 QoS</text>

  <!-- 延时特征 -->
  <text x="404" y="457" fill="#0F172A" font-size="13" font-weight="600">中低</text>
  <text x="404" y="479" fill="#64748B" font-size="10" font-weight="500">10–100 ms</text>
  <text x="652" y="457" fill="#0F172A" font-size="13" font-weight="600">极低</text>
  <text x="652" y="479" fill="#64748B" font-size="10" font-weight="500">&lt; 10 ms</text>
  <text x="900" y="457" fill="#0F172A" font-size="13" font-weight="600">较高</text>
  <text x="900" y="479" fill="#64748B" font-size="10" font-weight="500">百 ms 级</text>
  <text x="1148" y="457" fill="#0F172A" font-size="13" font-weight="600">中等</text>
  <text x="1148" y="479" fill="#64748B" font-size="10" font-weight="500">10–50 ms</text>
  <text x="1396" y="457" fill="#0F172A" font-size="13" font-weight="600">低</text>
  <text x="1396" y="479" fill="#64748B" font-size="10" font-weight="500">10–50 ms</text>
</g>

