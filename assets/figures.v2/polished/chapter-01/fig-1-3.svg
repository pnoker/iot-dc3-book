<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-label="移动互联网应用生态示意" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <rect x="0" y="0" width="1500" height="950" fill="#FFFFFF"/>

  <g id="title">
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">移动互联网应用生态示意</text>
    <text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">以用户为中心的星形生态，人—应用—服务构成闭环</text>
    <rect x="1332" y="28" width="98" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1381" y="44" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">TOPOLOGY</text>
    <line x1="58" y1="103" x2="1442" y2="103" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <g id="boundary">
    <rect x="70" y="115" width="1360" height="717" rx="12" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="8 4"/>
    <text x="750" y="138" fill="#2563EB" font-size="11" font-weight="600" text-anchor="middle">业务应用域 · 以用户为中心的星形生态</text>
  </g>

  <g id="arrows" fill="none">
    <line x1="679" y1="468" x2="537" y2="367" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
    <line x1="740" y1="449" x2="800" y2="266" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
    <line x1="777" y1="500" x2="923" y2="500" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
    <line x1="740" y1="551" x2="800" y2="734" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
    <line x1="679" y1="532" x2="537" y2="633" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
    <line x1="832" y1="266" x2="981" y2="468" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  </g>

  <g id="nodes">
    <g>
      <rect x="419" y="305" width="156" height="60" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <text x="497" y="331" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">即时通信</text>
      <text x="497" y="349" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">熟人关系</text>
    </g>
    <g>
      <rect x="732" y="204" width="156" height="60" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <text x="810" y="230" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">社交媒体</text>
      <text x="810" y="248" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">社交半径</text>
    </g>
    <g>
      <rect x="925" y="470" width="156" height="60" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <text x="1003" y="496" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">移动支付</text>
      <text x="1003" y="514" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">交易闭环</text>
    </g>
    <g>
      <rect x="732" y="736" width="156" height="60" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <text x="810" y="762" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">地图/出行</text>
      <text x="810" y="780" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">物理移动</text>
    </g>
    <g>
      <rect x="419" y="635" width="156" height="60" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <text x="497" y="661" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">短视频</text>
      <text x="497" y="679" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">内容入口</text>
    </g>

    <g id="user">
      <circle cx="723" cy="500" r="52" fill="#FFFFFF" stroke="#64748B" stroke-width="2.5"/>
      <text x="723" y="496" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">用户</text>
      <text x="723" y="516" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle">生态原点</text>
    </g>
  </g>

  <g id="arrow-labels">
    <g><rect x="579" y="410" width="58" height="16" fill="#FFFFFF"/><text x="608" y="422" fill="#475569" font-size="10" text-anchor="middle">聊天/红包</text></g>
    <g><rect x="741" y="349" width="58" height="16" fill="#FFFFFF"/><text x="770" y="361" fill="#475569" font-size="10" text-anchor="middle">分享/点赞</text></g>
    <g><rect x="805" y="492" width="90" height="16" fill="#FFFFFF"/><text x="850" y="504" fill="#2563EB" font-size="10" font-weight="700" text-anchor="middle">扫码支付/转账</text></g>
    <g><rect x="741" y="635" width="58" height="16" fill="#FFFFFF"/><text x="770" y="647" fill="#475569" font-size="10" text-anchor="middle">导航/约车</text></g>
    <g><rect x="579" y="574" width="58" height="16" fill="#FFFFFF"/><text x="608" y="586" fill="#475569" font-size="10" text-anchor="middle">拍摄/发布</text></g>
    <g><rect x="878" y="359" width="58" height="16" fill="#FFFFFF"/><text x="907" y="371" fill="#475569" font-size="10" text-anchor="middle">内嵌支付</text></g>
  </g>

  <g id="callout">
    <rect x="928" y="542" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
    <text x="1003" y="562" fill="#2563EB" font-size="11" font-weight="700" text-anchor="middle">主链路：用户→移动支付</text>
    <text x="1003" y="580" fill="#475569" font-size="10" text-anchor="middle">社交关系延伸至交易</text>
  </g>

  <g id="legend">
    <line x1="70" y1="850" x2="1430" y2="850" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="88" cy="865" r="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="102" y="869" fill="#64748B" font-size="11" font-weight="600">中心节点：用户</text>
    <rect x="200" y="860" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="220" y="869" fill="#64748B" font-size="11" font-weight="600">外围节点：应用模块</text>
    <line x1="340" y1="865" x2="372" y2="865" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
    <text x="380" y="869" fill="#64748B" font-size="11" font-weight="600">主链路（用户→移动支付）</text>
    <line x1="540" y1="865" x2="572" y2="865" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
    <text x="580" y="869" fill="#64748B" font-size="11" font-weight="600">用户访问链路</text>
    <line x1="680" y1="865" x2="712" y2="865" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
    <text x="720" y="869" fill="#64748B" font-size="11" font-weight="600">模块间交叉连接</text>
  </g>

  <text x="750" y="912" fill="#94A3B8" font-size="10" text-anchor="middle">移动互联网以用户为中心：即时通信维系熟人关系，社交媒体扩大社交半径，移动支付将社交延伸至交易，地图/出行解决物理移动，短视频成为内容消费入口；模块交叉连接体现应用的复合功能集成。</text>
</svg>