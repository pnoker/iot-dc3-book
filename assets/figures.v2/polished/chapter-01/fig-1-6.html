<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>图1-6 四层物联网参考架构示意图</title>
<style>html,body{margin:0;padding:0;background:#FFFFFF}body{min-height:100vh;display:flex;align-items:center;justify-content:center}svg{width:min(1400px,100vw);height:auto;display:block}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-label="图1-6 四层物联网参考架构示意图" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
<marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
<marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
<marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
<marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
<marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
</defs>

<rect x="0" y="0" width="1400" height="950" fill="#FFFFFF"/>

<!-- 标题区 -->
<circle cx="60" cy="46" r="6" fill="#2563EB"/>
<text x="78" y="54" fill="#0F172A" font-size="22" font-weight="700">图1-6 四层物联网参考架构示意图</text>
<text x="78" y="80" fill="#64748B" font-size="12" font-weight="500">物联网四层架构自下而上分层，数据上行与指令下行构成闭环控制</text>
<rect x="1278" y="32" width="104" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="1330" y="50" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">LAYERED</text>

<!-- 标题分隔线 -->
<line x1="54" y1="100" x2="1346" y2="100" stroke="#E2E8F0" stroke-width="1"/>

<!-- 安全贯穿条带（左侧，跨越全部层次） -->
<rect x="125" y="215" width="58" height="605" rx="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
<rect x="125" y="215" width="58" height="605" rx="10" fill="#E11D48" fill-opacity="0.04"/>
<rect x="120" y="186" width="68" height="22" rx="4" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.2"/>
<text x="154" y="201" fill="#E11D48" font-size="11" font-weight="700" text-anchor="middle">安全</text>
<text x="154" y="380" fill="#E11D48" font-size="16" font-weight="700" text-anchor="middle">安</text>
<text x="154" y="425" fill="#E11D48" font-size="16" font-weight="700" text-anchor="middle">全</text>
<text x="154" y="470" fill="#E11D48" font-size="16" font-weight="700" text-anchor="middle">贯</text>
<text x="154" y="515" fill="#E11D48" font-size="16" font-weight="700" text-anchor="middle">穿</text>
<text x="154" y="560" fill="#E11D48" font-size="16" font-weight="700" text-anchor="middle">跨</text>
<text x="154" y="605" fill="#E11D48" font-size="16" font-weight="700" text-anchor="middle">层</text>
<text x="154" y="650" fill="#E11D48" font-size="16" font-weight="700" text-anchor="middle">治</text>
<text x="154" y="695" fill="#E11D48" font-size="16" font-weight="700" text-anchor="middle">理</text>

<!-- 安全条带到各层的虚线连接 -->
<line x1="183" y1="270" x2="228" y2="270" stroke="#E11D48" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="183" y1="435" x2="228" y2="435" stroke="#E11D48" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="183" y1="600" x2="228" y2="600" stroke="#E11D48" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="183" y1="765" x2="228" y2="765" stroke="#E11D48" stroke-width="1" stroke-dasharray="4 3"/>

<!-- 连接箭头（先于节点绘制，位于节点下层） -->
<!-- Gap3: 感知层 ↔ 网络层 (y=655~710) -->
<line x1="980" y1="708" x2="980" y2="657" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
<text x="992" y="683" fill="#334155" font-size="11" font-weight="600" dominant-baseline="middle">MQTT/CoAP 上行</text>
<line x1="450" y1="657" x2="450" y2="708" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="438" y="683" fill="#334155" font-size="11" font-weight="600" text-anchor="end" dominant-baseline="middle">执行指令</text>

<!-- Gap2: 网络层 ↔ 平台层 (y=490~545) -->
<line x1="980" y1="543" x2="980" y2="492" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
<text x="992" y="518" fill="#334155" font-size="11" font-weight="600" dominant-baseline="middle">上行数据</text>
<line x1="450" y1="492" x2="450" y2="543" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="438" y="518" fill="#334155" font-size="11" font-weight="600" text-anchor="end" dominant-baseline="middle">控制信令</text>

<!-- Gap1: 平台层 ↔ 应用层 (y=325~380) -->
<line x1="980" y1="378" x2="980" y2="327" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
<text x="992" y="353" fill="#334155" font-size="11" font-weight="600" dominant-baseline="middle">推送数据</text>
<line x1="450" y1="327" x2="450" y2="378" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="438" y="353" fill="#334155" font-size="11" font-weight="600" text-anchor="end" dominant-baseline="middle">业务指令</text>

<!-- 节点：应用层（顶层） -->
<rect x="230" y="215" width="970" height="110" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<text x="255" y="262" fill="#0F172A" font-size="15" font-weight="700">应用层</text>
<text x="255" y="286" fill="#475569" font-size="11" font-weight="500">仪表盘 · 移动App · 业务后端</text>
<text x="1178" y="270" fill="#F59E0B" font-size="11" font-weight="600" text-anchor="end" dominant-baseline="middle">业务应用域</text>

<!-- 节点：平台层 -->
<rect x="230" y="380" width="970" height="110" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="255" y="427" fill="#0F172A" font-size="15" font-weight="700">平台层</text>
<text x="255" y="451" fill="#475569" font-size="11" font-weight="500">设备管理 · 数据存储与流处理 · API网关</text>
<text x="1178" y="435" fill="#7C3AED" font-size="11" font-weight="600" text-anchor="end" dominant-baseline="middle">平台服务域</text>

<!-- 节点：网络层 -->
<rect x="230" y="545" width="970" height="110" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="255" y="592" fill="#0F172A" font-size="15" font-weight="700">网络层</text>
<text x="255" y="616" fill="#475569" font-size="11" font-weight="500">MQTT · CoAP · LoRaWAN · NB-IoT</text>
<text x="1178" y="600" fill="#2563EB" font-size="11" font-weight="600" text-anchor="end" dominant-baseline="middle">网络传输域</text>

<!-- 节点：感知层（底层） -->
<rect x="230" y="710" width="970" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<text x="255" y="757" fill="#0F172A" font-size="15" font-weight="700">感知层</text>
<text x="255" y="781" fill="#475569" font-size="11" font-weight="500">传感器 · 执行器</text>
<text x="1178" y="765" fill="#10B981" font-size="11" font-weight="600" text-anchor="end" dominant-baseline="middle">设备边缘域</text>

<!-- 图例区（置于所有边界框之外） -->
<line x1="54" y1="860" x2="1346" y2="860" stroke="#E2E8F0" stroke-width="1"/>
<rect x="130" y="876" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
<text x="158" y="886" fill="#64748B" font-size="11" font-weight="600" dominant-baseline="middle">上行数据流</text>
<rect x="290" y="876" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="318" y="886" fill="#64748B" font-size="11" font-weight="600" dominant-baseline="middle">下行指令流</text>
<rect x="450" y="876" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
<text x="478" y="886" fill="#64748B" font-size="11" font-weight="600" dominant-baseline="middle">安全贯穿线</text>
<rect x="610" y="876" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
<text x="638" y="886" fill="#64748B" font-size="11" font-weight="600" dominant-baseline="middle">设备/边缘</text>
<rect x="750" y="876" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="778" y="886" fill="#64748B" font-size="11" font-weight="600" dominant-baseline="middle">数据/平台</text>
<rect x="890" y="876" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
<text x="918" y="886" fill="#64748B" font-size="11" font-weight="600" dominant-baseline="middle">业务应用</text>

<!-- caption -->
<text x="700" y="925" fill="#94A3B8" font-size="10" text-anchor="middle">数据自感知层上行至应用层，指令反向下行构成闭环；安全条带自左侧贯穿全部层次，作为跨层治理约束存在。</text>

</svg>
</body>
</html>
