<!doctype html>
<html lang="zh-CN">

<title>图1-1 三次浪潮演进时间线示意</title>
<style>html,body{margin:0;padding:0;background:#FFFFFF}body{min-height:100vh;display:flex;align-items:center;justify-content:center}svg{width:min(1600px,100vw);height:auto;display:block}</style>

<defs>

<text x="800" y="398" fill="#475569" font-size="11.5" font-weight="600" text-anchor="middle">2007 — 2015</text>
<text x="1330" y="398" fill="#475569" font-size="11.5" font-weight="600" text-anchor="middle">2015 — 至今</text>

<text x="1065" y="207" fill="#10B981" font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">技术演进</text>

<text x="1330" y="472" fill="#10B981" font-size="16" font-weight="700" text-anchor="middle">百亿级（≈10¹⁰）</text>

<line x1="58" y1="560" x2="1542" y2="560" stroke="#E2E8F0" stroke-width="1"/>

<text x="800" y="636" fill="#94A3B8" font-size="10" text-anchor="middle">图1-1 三次浪潮演进时间线示意 · 横轴为时间，箭头标示技术演进方向，下方标注各阶段连接规模</text>
