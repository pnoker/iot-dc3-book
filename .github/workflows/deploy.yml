name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pnpm build = vitepress build book + 后处理；手稿即终稿，VitePress 直驱 book/
      - run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/.vitepress/dist

      - uses: actions/deploy-pages@v5
        id: deployment

      # --- 搜索引擎主动推送 ---

      # 百度主动推送：从 sitemap 提取 URL 批量提交
      - name: Push to Baidu
        if: success() && env.BAIDU_PUSH_TOKEN != ''
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          curl -s https://book.dc3.site/sitemap.xml \
            | grep -oP '<loc>\K[^<]+' \
            | curl -s -H 'Content-Type: text/plain' \
                --data-binary @- \
                "http://data.zz.baidu.com/urls?site=book.dc3.site&token=${BAIDU_PUSH_TOKEN}" || true

      # IndexNow 推送（Bing/Seznam/Naver 等）：key 文件在 book/public/ 下随站点部署
      - name: Ping IndexNow
        env:
          KEY: c9f59b3f24a3f95bf5118a8ca3ae3355
        run: |
          sleep 20
          URLS=$(curl -fsS --retry 3 "https://book.dc3.site/sitemap.xml" \
            | grep -oE '<loc>[^<]+</loc>' \
            | sed -E 's#</?loc>##g' \
            | jq -Rsc 'split("\n") | map(select(length > 0))')
          if [ -z "$URLS" ] || [ "$URLS" = "[]" ]; then
            echo "No URLs extracted from sitemap, skip IndexNow ping"
            exit 0
          fi
          jq -n --arg key "$KEY" --argjson urls "$URLS" \
            '{host: "book.dc3.site", key: $key, keyLocation: ("https://book.dc3.site/" + $key + ".txt"), urlList: $urls}' \
            > indexnow-payload.json
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" --retry 2 \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @indexnow-payload.json) || STATUS="request-failed"
          echo "IndexNow responded: $STATUS (202/200 = accepted)"

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
