name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Python + uv：web 转换脚本依赖 pyyaml（复用 book venv）
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Sync book deps
        run: uv sync --frozen

      # Chrome：book-builder 渲染封面 cover.png 需要
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 中文字体：book-builder 渲染封面/扉页中文需要（CI ubuntu 默认无 CJK 字体，否则中文变豆腐块）
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - run: pnpm install --frozen-lockfile

      # pnpm build = book-builder build(手稿→output) + build_web(output→docs) + VitePress；
      # 与本地 pnpm dev/build 同一条链，保证本地预览与线上一致
      - run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - uses: actions/deploy-pages@v5
        id: deployment

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
