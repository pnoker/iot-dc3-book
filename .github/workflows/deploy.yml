name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Python + uv：web 转换脚本依赖 pyyaml（复用 book venv）
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Sync book deps
        run: uv sync --frozen

      - run: pnpm install --frozen-lockfile

      # pnpm build = build_web(手稿→docs) + VitePress；手稿即终稿，无导出中间层
      - run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - uses: actions/deploy-pages@v5
        id: deployment

      # --- 搜索引擎主动推送 ---

      # 百度主动推送：从 sitemap 提取 URL 批量提交
      - name: Push to Baidu
        if: success() && env.BAIDU_PUSH_TOKEN != ''
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          curl -s https://book.dc3.site/sitemap.xml \
            | grep -oP '<loc>\K[^<]+' \
            | curl -s -H 'Content-Type: text/plain' \
                --data-binary @- \
                "http://data.zz.baidu.com/urls?site=book.dc3.site&token=${BAIDU_PUSH_TOKEN}" || true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
