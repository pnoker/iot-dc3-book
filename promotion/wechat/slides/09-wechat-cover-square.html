<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>公众号次图封面 1:1</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body {
    width:800px; height:800px; overflow:hidden; position:relative;
    font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
    background:linear-gradient(150deg,#EEF4FF 0%,#E0F2FE 38%,#F0FBFF 62%,#FEF6EC 100%);
    color:#0F172A; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:60px;
  }
  .glow{position:absolute;border-radius:50%;filter:blur(80px);z-index:0}
  .glow.a{width:460px;height:460px;top:-180px;left:-120px;background:radial-gradient(circle,rgba(59,130,246,.30),transparent 70%)}
  .glow.b{width:380px;height:380px;bottom:-140px;right:-100px;background:radial-gradient(circle,rgba(16,185,129,.24),transparent 70%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(37,99,235,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.05) 1px,transparent 1px);background-size:32px 32px;z-index:0}
  .wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
  .tag{display:inline-block;padding:9px 22px;border:1.5px solid rgba(37,99,235,.4);border-radius:22px;font-size:19px;letter-spacing:4px;color:#2563EB;font-weight:600;background:rgba(255,255,255,.5)}
  h1{font-size:64px;font-weight:800;line-height:1.22;margin:36px 0 16px;letter-spacing:3px;
     background:linear-gradient(120deg,#1D4ED8,#0891B2 55%,#059669);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:24px;color:#334155;letter-spacing:2px;max-width:600px;line-height:1.7}
  .divider{width:84px;height:6px;border-radius:4px;background:linear-gradient(90deg,#2563EB,#10B981,#F59E0B);margin:36px 0 30px}
  .meta{display:flex;align-items:center;gap:14px;font-size:21px;color:#475569;letter-spacing:1px}
  .meta .logo{width:40px;height:40px}
  .meta b{color:#0891B2}
</style>
</head>
<body data-w="800" data-h="800">
  <div class="glow a"></div><div class="glow b"></div><div class="grid"></div>
  <div class="wrap">
    <div class="tag">AI 原生 · 开源工业物联网</div>
    <h1>从工业软件<br>到 AI 智能体</h1>
    <div class="sub">构建面向智能体演进的多协议、云原生、开源工业物联网平台</div>
    <div class="divider"></div>
    <div class="meta">
      <span class="logo"><img src="../../../book/assets/logo.svg" width="40" height="40" alt="IoT DC3"></span>
      <span><b>14 章</b> · 200 张图表 · <b>book.dc3.site</b></span>
    </div>
  </div>
</body>
</html>
