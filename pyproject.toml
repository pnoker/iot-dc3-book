[project]
name = "book-writer"
version = "0.1.0"
description = "基于 LangGraph 的多 Agent 书籍写作系统"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "openai>=1.0.0",
    "json-repair>=0.30.0",
    "langchain-text-splitters>=0.3.0",
    "pymupdf4llm>=0.0.17",
    "pyyaml>=6.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.0.0",
    "typer>=0.12.0",
    "chromadb>=1.5.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
]

[project.scripts]
book-writer = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "graph"]
force-include = { "cli.py" = "cli.py", "main.py" = "main.py" }
artifacts = ["core/templates/*.md.j2"]

# ---- Ruff ----
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["core", "agents", "graph", "."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # type-checking imports
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter)
    "B008",   # function call in default argument
    "RUF001", # ambiguous fullwidth chars (Chinese content)
    "RUF002", # ambiguous fullwidth chars (Chinese content)
    "RUF003", # ambiguous fullwidth chars (Chinese content)
    "TC001",  # type-checking imports (runtime needed)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "agents", "graph"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---- Mypy ----
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# ---- Pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
