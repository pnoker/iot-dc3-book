[project]
name = "book-builder"
version = "0.1.0"
description = "纯手工写稿 + 自动组装成书"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0",
    "rich>=15.0.0",
    "pypdf>=6.14.2",
    "reportlab>=5.0.0",
]

[project.scripts]
book-builder = "book_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_builder"]
artifacts = ["src/book_builder/templates/*.md.j2", "src/book_builder/pdf_style.css"]
