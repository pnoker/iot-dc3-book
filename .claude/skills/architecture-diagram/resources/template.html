<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图X-Y 标题</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; }
    body { color: #0F172A; font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif; }
    .figure { width: 1200px; padding: 32px 40px 28px; background: #F8FAFC; }
    .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding-bottom: 18px; border-bottom: 1px solid #E2E8F0; }
    .title-row { display: flex; align-items: center; gap: 14px; }
    .title-mark { width: 12px; height: 12px; flex: 0 0 auto; border-radius: 50%; background: #2563EB; }
    h1 { margin: 0; font-size: 24px; line-height: 1.3; font-weight: 700; }
    .subtitle { margin: 8px 0 0 26px; color: #475569; font-size: 13px; line-height: 1.55; }
    .type { padding: 6px 12px; border: 1px solid #CBD5E1; border-radius: 6px; color: #64748B; background: #FFFFFF; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .diagram { margin-top: 20px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 8px; overflow: hidden; }
    .diagram svg { display: block; width: 100%; height: auto; }
    .caption { margin: 18px 4px 0; color: #475569; font-size: 11px; line-height: 1.6; text-align: center; }
  </style>
</head>
<body>
  <main class="figure" data-figure-root>
    <header class="header">
      <div>
        <div class="title-row"><span class="title-mark"></span><h1>图X-Y 标题</h1></div>
        <p class="subtitle">一句副标题，说明这张图要表达的核心结论</p>
      </div>
      <span class="type">architecture</span>
    </header>

    <section class="diagram">
      <svg viewBox="0 0 1120 420" role="img" aria-labelledby="diagram-title diagram-desc">
        <title id="diagram-title">图X-Y 标题</title>
        <desc id="diagram-desc">一句可验证的读者认知收获。</desc>
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="0.5" />
          </pattern>
        </defs>
        <rect width="1120" height="420" fill="url(#grid)" />

        <line x1="310" y1="210" x2="450" y2="210" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)" />
        <line x1="670" y1="210" x2="810" y2="210" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)" />

        <rect x="90" y="150" width="220" height="120" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
        <text x="200" y="202" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">设备接入</text>
        <text x="200" y="230" fill="#475569" font-size="12" text-anchor="middle">传感器 · 网关</text>

        <rect x="450" y="140" width="220" height="140" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
        <text x="560" y="202" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">平台服务</text>
        <text x="560" y="230" fill="#475569" font-size="12" text-anchor="middle">接入 · 消息 · 存储</text>

        <rect x="810" y="150" width="220" height="120" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
        <text x="920" y="202" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">业务应用</text>
        <text x="920" y="230" fill="#475569" font-size="12" text-anchor="middle">可视化 · AI · 控制</text>
      </svg>
    </section>

    <p class="caption">图X-Y 出版级图注：独立说明图表内容与主结论。</p>
  </main>
</body>
</html>
