<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图X-Y 标题</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      padding: 2rem;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    .header { margin-bottom: 1.5rem; }
    .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
    .subtitle { color: #475569; font-size: 0.95rem; margin-top: 0.35rem; }

    .diagram-container {
      background: #FFFFFF;
      border-radius: 1rem;
      border: 1px solid #E2E8F0;
      padding: 1.5rem;
      overflow-x: auto;
    }
    svg { width: 100%; min-width: 900px; display: block; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .card {
      background: #FFFFFF;
      border-radius: 0.75rem;
      border: 1px solid #E2E8F0;
      padding: 1.1rem 1.25rem;
    }
    .card-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
    .card-dot { width: 8px; height: 8px; border-radius: 50%; }
    .card-dot.blue { background: #2563EB; }
    .card-dot.teal { background: #0F766E; }
    .card-dot.violet { background: #7C3AED; }
    .card-dot.amber { background: #D97706; }
    .card-dot.orange { background: #F97316; }
    .card-dot.red { background: #DC2626; }
    .card h3 { font-size: 0.9rem; font-weight: 600; color: #0F172A; }
    .card ul { list-style: none; color: #475569; font-size: 0.82rem; }
    .card li { margin-bottom: 0.35rem; }

    .caption { margin-top: 1rem; color: #475569; font-size: 0.85rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>图X-Y 标题</h1>
      <p class="subtitle">一句副标题，说明这张图要表达的核心结论</p>
    </div>

    <!-- Main Diagram -->
    <div class="diagram-container">
      <svg viewBox="0 0 1000 620" role="img" aria-label="架构图">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748B" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- ===== 连线（先画，落在盒子背后） ===== -->
        <line x1="270" y1="300" x2="358" y2="300" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="314" y="292" fill="#475569" font-size="10" text-anchor="middle">主链路</text>
        <line x1="600" y1="300" x2="688" y2="300" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- ===== 组件盒子 ===== -->
        <!-- 边缘 / 接入 -->
        <rect x="150" y="270" width="120" height="60" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
        <text x="210" y="296" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">设备接入</text>
        <text x="210" y="314" fill="#475569" font-size="11" text-anchor="middle">传感器 / 网关</text>

        <!-- 核心平台 -->
        <rect x="360" y="265" width="240" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
        <text x="480" y="294" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">平台服务</text>
        <text x="480" y="314" fill="#475569" font-size="11" text-anchor="middle">接入 · 消息 · 存储 · 使能</text>

        <!-- 业务应用 -->
        <rect x="690" y="270" width="120" height="60" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
        <text x="750" y="296" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">业务应用</text>
        <text x="750" y="314" fill="#475569" font-size="11" text-anchor="middle">大屏 / App / AI</text>

        <!-- ===== 图例（放主体之外） ===== -->
        <rect x="150" y="420" width="16" height="12" rx="3" fill="#ECFDF5" stroke="#0F766E" stroke-width="1"/>
        <text x="174" y="430" fill="#475569" font-size="11">边缘接入</text>
        <rect x="270" y="420" width="16" height="12" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
        <text x="294" y="430" fill="#475569" font-size="11">核心平台</text>
        <rect x="390" y="420" width="16" height="12" rx="3" fill="#FFF7ED" stroke="#F97316" stroke-width="1"/>
        <text x="414" y="430" fill="#475569" font-size="11">业务应用</text>
      </svg>
    </div>

    <!-- Info Cards（可选，承载关键说明 / callouts） -->
    <div class="cards">
      <div class="card">
        <div class="card-header"><div class="card-dot blue"></div><h3>要点一</h3></div>
        <ul>
          <li>• 说明一</li>
          <li>• 说明二</li>
        </ul>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-dot teal"></div><h3>要点二</h3></div>
        <ul>
          <li>• 说明一</li>
          <li>• 说明二</li>
        </ul>
      </div>
    </div>

    <!-- Caption -->
    <p class="caption">图X-Y 出版级图注：一句话完整说明图表内容与主结论。</p>
  </div>
</body>
</html>
