# 出版级确定性质量门配置
enabled: true
mode: "release"
min_words_per_chapter: 9000
target_words_per_chapter: 12000
max_words_over_target_ratio: 1.2
min_heading_count: 8
require_summary: true
require_exercises: false
min_exercise_count: 0
min_figures_or_tables: 1
min_figures_per_section: 1
require_existing_local_images: true
forbid_placeholder_images: true
forbid_unsourced_statistics: true
forbid_unresolved_final_review: true
max_revision_rounds: 10
max_final_revision_rounds: 1
continue_on_failure: true
adversarial_review_enabled: true
# 原创性/相似度门：正文段落与参考书原文（label=books）字符 n-gram 重叠超阈值即判侵权风险
originality_check_enabled: true
originality_max_overlap: 0.35
originality_ngram: 5
originality_min_paragraph_chars: 80
