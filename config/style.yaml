# 写作风格规范
tone: "专业、克制、有工程判断力，面向 IoT 从业者、工程师、架构师和技术负责人；融入十多年物联网实践经验、方法论沉淀与 AI 时代的 AIoT 新范式"
perspective: "第三人称"

terminology:
  rule: "首次出现的专业术语需附英文原文和简要解释"
  example: "窄带物联网（Narrowband Internet of Things, NB-IoT）"

format:
  chapter_title: "第{id}章 {title}"
  section: "{part_prefix}.{chapter_id} {title}"
  subsection_l1: "{part_prefix}.{chapter_id}.{sub_id} {title}"
  subsection_l2: "{part_prefix}.{chapter_id}.{sub_id}.{sub_id2} {title}"
  subsection_l3: "{part_prefix}.{chapter_id}.{sub_id}.{sub_id2}.{sub_id3} {title}"
  figure: "图{chapter_id}-{seq} {caption}"
  table: "表{chapter_id}-{seq} {caption}"
  code_block: "使用 fenced code block，标注语言"

illustrations:
  marker: "book-figure"
  renderer: "ai-html-svg"
  ai_polish_rounds: 1
  ai_timeout_seconds: 150
  ai_max_tokens: 16384
  ai_retry_attempts: 2
  ai_json_retry_attempts: 2
  ai_circuit_breaker_failures: 5
  polished_assets_dir: "assets/figures/polished"
  polished_required_for_export: true
  polished_required_for_draft: false
  polished_min_png_bytes: 4096
  theme: "technical-publication-light"
  palette:
    canvas: "#F8FAFC"
    panel: "#FFFFFF"
    primary: "#2563EB"
    secondary: "#0F766E"
    accent: "#F97316"
    neutral: "#475569"
    line: "#94A3B8"
    text: "#0F172A"
    success: "#16A34A"
    warning: "#D97706"
    danger: "#DC2626"
  allowed_types:
    - "architecture"
    - "sequence"
    - "flowchart"
    - "dataflow"
    - "pyramid"
    - "layered"
    - "topology"
    - "lifecycle"
    - "matrix"
    - "timeline"
  required_fields:
    - "id"
    - "type"
    - "title"
    - "purpose"
    - "layout"
    - "elements"
    - "relationships"
    - "legend"
    - "caption"
    - "render_notes"
  professional_fields:
    - "audience_takeaway"
    - "visual_focus"
    - "design_level"
    - "components"
    - "connections"
    - "regions"
    - "callouts"
    - "visual_constraints"
  component_schema:
    id: "稳定英文/拼音短标识，用于 connections.from/to 引用，如 device_edge。"
    label: "图中可见的短标签，不超过 14 个汉字。"
    type: "edge|platform|data|ai|security|application|external|decision|process。"
    subtitle: "节点副说明，不超过 18 个汉字，只写职责或边界。"
    group: "所属 regions.id；没有边界时留空。"
    priority: "primary|normal|supporting|risk，决定视觉强调级别。"
    shape: "card|decision|database|bus|actor|boundary，按语义选择。"
  connection_schema:
    from: "源 components.id。"
    to: "目标 components.id。"
    label: "边标签，不超过 12 个汉字。"
    style: "solid|dashed|async|optional|risk。"
    direction: "left-to-right|bottom-to-top|request|response|event|feedback。"
  region_schema:
    id: "稳定英文/拼音短标识。"
    label: "边界名称，如 设备接入域、数据治理域。"
    role: "这个边界承担的工程职责，不超过 22 个汉字。"
  design_principles:
    - "先确定读者看图后必须得到的一个结论，再决定节点和连线。"
    - "每张图只表达一个主链路或一个判断框架，不把整节所有概念塞进一张图。"
    - "components 使用短标签，解释性文字放入 callouts 或正文，不放进节点。"
    - "connections 必须引用 components.id，禁止用一句话串联多条边。"
    - "regions 用来表达职责边界、系统边界或治理边界，不用来做装饰性分组。"
    - "visual_focus 必须说明高亮路径、关键瓶颈、风险节点或主决策链。"
  forbidden_labels:
    - "节点1"
    - "节点2"
    - "最右侧"
    - "container"
    - "service"
    - "user"
  legend:
    - "蓝色：核心平台、中心服务、主链路组件"
    - "青绿色：边缘节点、设备接入、数据采集组件"
    - "橙色：AI Agent、智能决策、自动化编排能力"
    - "灰色：外部系统、约束、边界和非核心依赖"
    - "绿色：成功路径、已验证能力、稳定状态"
    - "黄色：风险、告警、人工确认或降级路径"
    - "红色：故障、阻断、危险操作或安全边界"
    - "实线箭头：同步调用或强依赖；虚线箭头：异步消息、事件或可选依赖"
  constraints:
    - "正文不得直接插入 Markdown 图片占位，不生成本地图片路径。"
    - "需要配图时必须输出 fenced code block：```book-figure。"
    - "图表只描述设计规格，不绘制 Mermaid、SVG、ASCII 图或 HTML。"
    - "每个图表必须有专业图名、图注、图例、元素清单、关系清单、结构化 components/connections/regions 和渲染说明。"
    - "同一章图表编号使用 图{chapter_id}-{seq}，全书配色和视觉语义保持一致。"
    - "架构图强调层次、边界和职责；时序图强调参与者、消息和时间顺序；流程图强调决策分支；金字塔图强调层级与递进关系。"
  example: |
    ```book-figure
    id: "fig-02-01"
    type: "architecture"
    title: "图2-1 AIoT 平台分层架构"
    purpose: "说明设备接入、平台服务、智能编排与业务应用之间的边界和主链路。"
    audience_takeaway: "读者应理解 AIoT 平台不是单一服务，而是设备接入、数据治理、智能决策和业务应用之间的责任边界。"
    visual_focus: "从设备与边缘域进入平台服务域，再进入智能决策域的主链路；智能层用橙色强调。"
    design_level: "logical"
    layout: "自下而上分层架构，设备层→接入层→平台层→智能层→应用层。"
    elements:
      - "设备层：传感器、网关、PLC，使用青绿色节点。"
      - "平台层：认证、设备管理、数据中心，使用蓝色服务块。"
      - "智能层：Agent 编排、知识库、规则/模型推理，使用橙色服务块。"
    relationships:
      - "设备层通过 MQTT/Modbus/OPC UA 接入平台层，实线箭头。"
      - "平台层向智能层提供上下文和历史数据，虚线箭头。"
    regions:
      - id: "edge_domain"
        label: "设备与边缘域"
        role: "现场异构资源边界"
      - id: "platform_domain"
        label: "平台服务域"
        role: "设备、数据与规则能力"
      - id: "intelligence_domain"
        label: "智能决策域"
        role: "Agent 与模型编排"
      - id: "application_domain"
        label: "业务应用域"
        role: "价值交付边界"
    components:
      - id: "device_edge"
        label: "设备与边缘"
        type: "edge"
        subtitle: "传感器、PLC、网关"
        group: "edge_domain"
        priority: "normal"
        shape: "card"
      - id: "access_service"
        label: "协议接入"
        type: "platform"
        subtitle: "MQTT/Modbus/OPC UA"
        group: "platform_domain"
        priority: "primary"
        shape: "card"
      - id: "data_context"
        label: "数据上下文"
        type: "data"
        subtitle: "时序、状态、事件"
        group: "platform_domain"
        priority: "primary"
        shape: "database"
      - id: "agent_orchestration"
        label: "Agent 编排"
        type: "ai"
        subtitle: "规则、模型、工具调用"
        group: "intelligence_domain"
        priority: "primary"
        shape: "card"
      - id: "business_app"
        label: "业务应用"
        type: "application"
        subtitle: "运维、能耗、运营"
        group: "application_domain"
        priority: "normal"
        shape: "card"
    connections:
      - from: "device_edge"
        to: "access_service"
        label: "协议接入"
        style: "solid"
        direction: "bottom-to-top"
      - from: "access_service"
        to: "data_context"
        label: "状态沉淀"
        style: "solid"
        direction: "bottom-to-top"
      - from: "data_context"
        to: "agent_orchestration"
        label: "上下文供给"
        style: "dashed"
        direction: "event"
      - from: "agent_orchestration"
        to: "business_app"
        label: "决策输出"
        style: "solid"
        direction: "request"
    callouts:
      - "平台层的价值在于把异构设备抽象为稳定上下文。"
      - "智能层不能绕过平台治理直接控制现场设备。"
    legend:
      - "蓝色=核心平台服务；青绿色=设备与边缘；橙色=AI 智能能力。"
      - "实线=强依赖链路；虚线=事件或上下文供给。"
    caption: "图2-1 展示 AIoT 平台从设备接入到智能编排的主要层次和职责边界。"
    visual_constraints:
      - "最多 6 个主节点，节点标签短，解释放入 callouts。"
      - "图例放在图底部，不遮挡分组边界。"
      - "橙色只用于智能决策链路，避免全图都高亮。"
    render_notes: "HTML/SVG 渲染，浅色背景，圆角矩形，边界虚线，箭头带短标签，底部图例和出版级图注。"
    ```

forbidden_words:
  - "笔者认为"
  - "不言而喻"
  - "众所周知"
  - "毋庸置疑"
  - "简单来说"
  - "显而易见"

chapter_structure:
  - "自然开篇：不写教材式引言，可从工程现场、架构矛盾、行业变化或核心判断直接进入"
  - "正文：围绕工程判断、架构取舍、系统边界、实践经验和 AIoT 演进展开；知识库只用于事实校准，不模仿教材口吻"
  - "章节收束：按内容需要自然回扣方法论、实践边界、工程检查表、趋势判断或延伸阅读；不强制本章小结，不写课后练习题"

target_words_per_chapter: "9000-16000字"
