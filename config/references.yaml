# 参考书籍配置
top_k: 5
chunk_size: 1000
chunk_overlap: 200
# 本书检索限定的分类（空=全局检索所有分类）
query_categories: [ ]
# 混合检索（dense + BM25 + RRF）
hybrid: true
# rerank（默认关闭；开启需 LLM 额外调用）
rerank_enabled: false
rerank_candidates: 12
# 知识精炼 Contextual Retrieval（默认关闭；开启需对每个分块额外 LLM 调用）
contextualize: false
# 参考来源：PDF 书籍 + IoT DC3 官方中文文档（Markdown）
# categories 为来源基础标签；dir_categories 按子目录首段追加主题标签（多标签）
sources:
  - path: "../books"
    label: "books"
    language: "zh"
    categories: [ "iot" ]
    dir_categories:
      sensing-identification: [ "sensing", "hardware" ]
      communication-networking: [ "network", "protocol" ]
      platform-cloud-bigdata: [ "platform", "cloud", "bigdata" ]
      security-technology: [ "security" ]
      app-dev-programming: [ "development" ]
      industry-business-strategy: [ "industry", "business" ]
      introductions-overviews: [ "overview" ]
  - path: "/Users/pnoker/Code/pnoker/IoTDC3/github/iot-dc3/docs/zh"
    label: "dc3"
    language: "zh"
    categories: [ "iot", "dc3" ]
    dir_categories:
      ai: [ "ai", "agentic" ]
      architecture: [ "architecture" ]
      drivers: [ "driver", "protocol" ]
      development: [ "development" ]
      foundations: [ "foundation" ]
      operation: [ "operation" ]
      modules: [ "architecture" ]
      automation: [ "automation" ]
      quickstart: [ "overview" ]
      introduction: [ "overview" ]
