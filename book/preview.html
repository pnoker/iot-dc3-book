<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全书插图预览 · 153 张</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F7FB;--surface:#fff;--border:#E7EAF2;--border-hi:#D6DBE8;
  --ink:#1B2436;--soft:#5C6779;--faint:#939CB0;
  --accent:#4F46E5;--accent-2:#2563EB;--accent-soft:#EEF0FF;
  --ok:#16A34A;--warn:#DC2626;
  --sh-sm:0 1px 2px rgba(18,26,48,.05),0 1px 3px rgba(18,26,48,.05);
  --sh-md:0 6px 20px rgba(18,26,48,.10);
  --sh-lg:0 18px 50px rgba(12,18,38,.40);
  --r:14px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(1200px 500px at 15% -8%,#EEF1FE 0,transparent 60%),radial-gradient(1000px 480px at 100% 0,#E7F3FB 0,transparent 55%)}

/* Header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px 28px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:13px}
.brand-mark{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,#4F46E5,#2563EB);box-shadow:0 6px 16px rgba(79,70,229,.35)}
.brand-txt h1{font-size:19px;font-weight:700;letter-spacing:.2px}
.stats{display:inline-flex;align-items:center;gap:6px;color:var(--soft);font-size:12.5px;margin-top:2px}
.stats b{color:var(--ink);font-weight:700}
.stats .ok{color:var(--ok)}
.tools{display:flex;gap:10px;margin-left:auto;align-items:center;flex-wrap:wrap}
.tools input,.tools select{padding:8px 12px;border:1px solid var(--border-hi);border-radius:10px;font-size:13px;color:var(--ink);background:#fff;transition:border-color .15s,box-shadow .15s;outline:none}
.tools input{min-width:210px}
.tools input:focus,.tools select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tools input::placeholder{color:var(--faint)}

/* Sections */
main{padding:26px 28px 60px;max-width:1520px;margin:0 auto}
.chsec{margin-bottom:34px}
.chsec h2{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;margin-bottom:16px;color:var(--ink)}
.chsec h2::before{content:"";width:4px;height:17px;border-radius:3px;background:linear-gradient(180deg,#4F46E5,#2563EB)}
.chsec .cnt{font-weight:600;font-size:11.5px;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:999px}

/* Grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:zoom-in;box-shadow:var(--sh-sm);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh-md);border-color:var(--border-hi)}
.thumb{aspect-ratio:1200/760;background:linear-gradient(135deg,#F3F5FB,#EAEEF7);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--border)}
.thumb img{width:100%;height:100%;object-fit:contain;transition:transform .3s ease}
.card:hover .thumb img{transform:scale(1.03)}
.card figcaption{padding:12px 14px 13px}
.card .t{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;line-height:1.45;margin-bottom:9px;color:var(--ink)}
.card .tt{flex:1;min-width:0}
.card .meta{display:flex;gap:6px;font-size:10.5px;flex-wrap:wrap}
.card .meta span{background:#F1F3F9;color:var(--soft);padding:2.5px 8px;border-radius:6px;font-weight:500}
.card .meta .fid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.2px}
.card .type{font-weight:600}
.card[data-type="architecture"] .type{background:#EAF1FF;color:#2E5BD8}
.card[data-type="dataflow"] .type{background:#E5F7F4;color:#0E9384}
.card[data-type="flowchart"] .type{background:#EAF7EC;color:#2E9E4F}
.card[data-type="framework"] .type{background:#F1ECFE;color:#7C3AED}
.card[data-type="layered"] .type{background:#EBEEFF;color:#4F46E5}
.card[data-type="lifecycle"] .type{background:#FFF1E6;color:#E06412}
.card[data-type="matrix"] .type{background:#FDEBF3;color:#D6337F}
.card[data-type="pyramid"] .type{background:#FEF3E0;color:#C77A0A}
.card[data-type="sequence"] .type{background:#E4F6FB;color:#0E8BA8}
.card[data-type="timeline"] .type{background:#FDECEC;color:#DB4A4A}
.card[data-type="topology"] .type{background:#E9F3FE;color:#2B7FD4}
.noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--warn);background:#FEF2F2;font-size:12px}
.hidden{display:none !important}

/* copy button */
.copy-btn{background:#fff;border:1px solid var(--border-hi);border-radius:8px;padding:3px 8px;font-size:12px;line-height:1;cursor:pointer;flex-shrink:0;color:var(--soft);transition:all .15s}
.copy-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-1px)}
.copy-btn:active{transform:translateY(0)}

/* lightbox */
#lightbox{display:none;position:fixed;inset:0;background:rgba(13,18,33,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:100;padding:40px;overflow:auto}
#lightbox.open{display:flex;align-items:center;justify-content:center;flex-direction:column}
#lightbox img{max-width:90vw;max-height:74vh;background:#fff;border-radius:12px;box-shadow:var(--sh-lg)}
#lightbox .info{color:#EAEDF5;text-align:center;max-width:760px;margin-top:20px}
#lightbox .info h3{font-size:17px;font-weight:700;margin-bottom:8px;color:#fff}
#lightbox .info p{font-size:13px;color:#AEB6C9;line-height:1.65;margin-bottom:5px}
#lb-close{position:fixed;top:18px;right:26px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;cursor:pointer;background:rgba(255,255,255,.12);border:none;border-radius:50%;transition:background .15s}
#lb-close:hover{background:rgba(255,255,255,.25)}

/* toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:11px;font-size:13px;z-index:300;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:var(--sh-md)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* copy modal */
#copyModal{display:none;position:fixed;inset:0;background:rgba(13,18,33,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:400;align-items:center;justify-content:center;padding:20px}
#copyModal.open{display:flex}
.cm{background:#fff;border-radius:16px;padding:22px 24px;max-width:520px;width:100%;box-shadow:var(--sh-lg)}
.cm h3{margin:0 0 12px;font-size:15px;font-weight:700;color:var(--ink)}
.cm input{width:100%;padding:11px 13px;border:1px solid var(--border-hi);border-radius:10px;font-size:14px;box-sizing:border-box;margin-bottom:12px;background:var(--bg);color:var(--ink)}
.cm .hint{font-size:12.5px;color:var(--soft);margin-bottom:16px;line-height:1.55;word-break:break-all}
.cm button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 22px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.cm button:hover{background:#4338CA}
</style></head><body>

const data = [{"fid": "fig-01-01", "ch": 1, "title": "图1-1 三次浪潮演进时间线示意", "type": "timeline", "caption": "图1-1 三次浪潮演进时间线示意。时间轴下方标注连接规模数据，箭头表示演进方向。", "takeaway": "读者应理解三次浪潮的核心驱动力依次从信息数字化、人的移动性转向物的数字化,连接规模从约10亿、20亿跃升一个数量级至百亿级。", "img": "assets/images/chapter-01/fig-01-01.png"}, {"fid": "fig-01-02", "ch": 1, "title": "图1-2 PC互联网时代连接架构", "type": "architecture", "caption": "|", "takeaway": "", "img": "assets/images/chapter-01/fig-01-02.png"}, {"fid": "fig-01-03", "ch": 1, "title": "图1-3 移动互联网应用生态示意", "type": "topology", "caption": "该图展示移动互联网时代以用户为中心的应用生态。即时通信维系熟人关系，社交媒体扩大社交半径，移动支付将社交关系延伸至交易，地图/出行解决物理移动需求，短视频成为新的内容消费和社交入口。模块间交叉连接的含义是：一个应用内往往集成多种功能（例如社交媒体可以内嵌支付入口）。", "takeaway": "读者应理解移动互联网以用户为唯一中心,应用模块围绕用户辐射,且通过社交内嵌支付等交叉连接实现功能聚合而非各自孤立。", "img": "assets/images/chapter-01/fig-01-03.png"}, {"fid": "fig-01-04", "ch": 1, "title": "图1-4 智慧工厂设备连接拓扑示意", "type": "topology", "caption": "示意一场智慧工厂的典型物联连接拓扑。车间传感器每小时上报一次均方根振动值，边缘网关抓取异常波形后直接触发告警，同时上传至云平台做趋势分析。云平台模型判断当前设备即将失效，自动向传送带控制器下发减速指令，避免带病运行产生残次品。整个过程无需人工介入，数据在物与系统之间循环流动。", "takeaway": "读者应理解边缘网关只上传均方根等统计特征而非原始波形,云侧趋势分析后控制流反向下发减速指令,虚实双线构成无人介入的闭环决策。", "img": "assets/images/chapter-01/fig-01-04.png"}, {"fid": "fig-01-05", "ch": 1, "title": "图1-5 物联网系统五要素关系示意", "type": "architecture", "caption": "图1-5 物联网系统五要素关系示意", "takeaway": "读者应理解五要素之间的关系：数据从感知层经传输层到处理层和应用层，控制指令反向流动，安全机制贯穿全程。", "img": "assets/images/chapter-01/fig-01-05.png"}, {"fid": "fig-01-06", "ch": 1, "title": "图1-6 四层物联网参考架构示意图", "type": "layered", "caption": "图1-6 四层物联网参考架构。数据从感知层上行至应用层，指令以相反方向下行，形成闭环控制。安全条带从左侧贯穿，跨越所有层次。", "takeaway": "读者应理解物联网系统由四个职责清晰且相互依赖的层次构成，安全作为一个跨越所有层的约束条件存在。", "img": "assets/images/chapter-01/fig-01-06.png"}, {"fid": "fig-01-07", "ch": 1, "title": "图1-7 RFID 系统基本组成", "type": "architecture", "caption": "图1-7 RFID 系统基本组成：标签、读写器与后台系统的物理/逻辑关系。", "takeaway": "RFID 的核心组态是标签-读写器-后台系统，工程关键在于标签类型（有源/无源）和读写器部署方案的选择。", "img": "assets/images/chapter-01/fig-01-07.png"}, {"fid": "fig-01-08", "ch": 1, "title": "图1-8 物联网平台市场格局示意", "type": "flowchart", "caption": "图1-8 示意展示2020年前后物联网平台市场在生态完整性与运营商支持力度两个维度的差异化定位。气泡位置与大小仅为教学示意，不代表真实市场份额。", "takeaway": "读者应理解平台市场并非一家独大，差异化定位决定了不同场景下的选型优先级。", "img": "assets/images/chapter-01/fig-01-08.png"}, {"fid": "fig-01-09", "ch": 1, "title": "图1-9 物联网价值迁移路径", "type": "flowchart", "caption": "图1-9 物联网产业价值重心从连接层向平台层、最终向智能决策层迁移的路径。", "takeaway": "读者应看到价值重心从左到右迁移，智能层的利润率和增长潜力显著高于连接层。", "img": "assets/images/chapter-01/fig-01-09.png"}, {"fid": "fig-01-10", "ch": 1, "title": "图1-10 传统物联网与大模型驱动物联网的对比", "type": "flowchart", "caption": "图1-10 传统物联网与大模型驱动物联网的对比示意。左侧为规则驱动的“感知-响应”模式，右侧为推理驱动的“理解-决策-确认”模式。大模型在决策层增加上下文理解和概率推理的能力，同时引入了执行前二次确认的安全机制。", "takeaway": "读者应理解传统物联网靠静态规则精确匹配、被动响应,大模型驱动改为上下文概率推理并新增执行前用户二次确认,从被动转向主动。", "img": "assets/images/chapter-01/fig-01-10.png"}, {"fid": "fig-01-11", "ch": 1, "title": "图1-11 传统物联网端-云架构与AIoT边-端-云协同架构对比", "type": "architecture", "caption": "图1-11 传统物联网端-云架构与AIoT边-端-云协同架构对比。左侧传统架构为两层，数据流和控制流直接往返于端云之间。右侧AIoT新架构引入边缘侧作为实时推理和决策枢纽，端侧与云侧通过边缘侧间接交互，云侧主要负责模型训练与知识更新，并定期将更新下推至边缘侧。", "takeaway": "读者应理解传统架构端云直连数据上传、指令下发,AIoT在两者之间插入边缘侧承担实时推理与本地决策,端云改为经边缘间接交互、云侧退居模型训练与知识下推。", "img": "assets/images/chapter-01/fig-01-11.png"}, {"fid": "fig-01-12", "ch": 1, "title": "图1-12 AIoT数据闭环流程", "type": "flowchart", "caption": "图1-12 AIoT数据闭环流程——感知、学习、决策、执行形成持续自我优化的循环，区别于传统IoT的单向数据管道。", "takeaway": "读者应理解AIoT是感知-学习-决策-执行的循环,执行结果反馈回感知驱动持续自我优化,区别于传统IoT的单向数据管道。", "img": "assets/images/chapter-01/fig-01-12.png"}, {"fid": "fig-01-13", "ch": 1, "title": "图1-13 边云协同AIoT三级架构示意", "type": "architecture", "caption": "图1-13 边云协同AIoT三级架构。云侧负责模型训练与更新，边缘侧承担实时推理与数据过滤，端侧运行轻量模型实现本地自主响应。三层之间形成“训练-推理-反馈”闭环。", "takeaway": "读者应理解云侧只下发量化剪枝模型并回收低置信度样本,边缘负责实时推理,端侧靠低功耗AI芯片本地响应,三层形成训练-推理-反馈闭环。", "img": "assets/images/chapter-01/fig-01-13.png"}, {"fid": "fig-01-14", "ch": 1, "title": "图1-14 实践建议优先级矩阵", "type": "matrix", "caption": "图1-14 实践建议优先级矩阵。每个建议的投入产出和实施难度一目了然，优先从绿色单元格的条目开始。", "takeaway": "读者应理解应优先执行投入产出高且实施难度低的条目,如用三次浪潮框架重新定位项目、分隔感知值与推理值,而非先投原型搭建。", "img": "assets/images/chapter-01/fig-01-14.png"}, {"fid": "fig-02-01", "ch": 2, "title": "图2-1 物联网经典四层参考架构", "type": "layered", "caption": "图2-1 物联网经典四层参考架构。平台层相比早期三层模型是新增层，将设备管理、数据存储、规则引擎等公共能力从应用层剥离。数据向上、指令向下的单向流向，决定了经典架构在处理复杂决策时存在结构性短板。", "takeaway": "读者应理解物联网经典四层参考架构的主链路是数据单向向上、指令单向向下，平台层是三层模型下新增的公共能力层。", "img": "assets/images/chapter-02/fig-02-01.png"}, {"fid": "fig-02-02", "ch": 2, "title": "图2-2 数据采集→理解→决策→执行闭环", "type": "flowchart", "caption": "图2-2 智能层的闭环工作流：数据从物理世界采集，经平台层进入智能层进行推理与规划，规划结果通过平台层下发到执行器，执行反馈再回到传感器开始下一轮循环。", "takeaway": "读者应理解从数据采集到执行反馈的闭环如何跨越物理世界、平台层和应用层，智能层在其中承担推理、规划、执行的职责。", "img": "assets/images/chapter-02/fig-02-02.png"}, {"fid": "fig-02-03", "ch": 2, "title": "图2-3 五层架构与传统四层架构对比示意", "type": "layered", "caption": "图2-3 经典四层架构（左）与五层架构（右）的对比。左列数据流单向向上，右侧五层架构在平台层和智能层之间形成闭环：平台层向上提供数据，智能层向下发回命令。", "takeaway": "读者应看到智能层如何将单向数据流改为闭环，以及各层之间的标准化接口。", "img": "assets/images/chapter-02/fig-02-03.png"}, {"fid": "fig-02-04", "ch": 2, "title": "图2-4 传统数据模式与智能闭环模式的数据流程对比", "type": "flowchart", "caption": "图2-4 传统数据模式与智能闭环模式的数据流程对比", "takeaway": "读者应理解传统数据模式的单向线性链路与闭环模式回路结构的根本区别，并识别出“执行”环节是闭环模式的工程核心。", "img": "assets/images/chapter-02/fig-02-04.png"}, {"fid": "fig-02-05", "ch": 2, "title": "图2-5 智能楼宇节能闭环的组件间交互时序示意图（假设场景）", "type": "sequence", "caption": "图2-5 智能楼宇节能闭环的组件间交互时序示意图（假设场景）", "takeaway": "读者应理解闭环模式下智能层的“理解”与“决策”子组件如何协同，以及指令下行经过协议翻译才能在物理设备上执行。", "img": "assets/images/chapter-02/fig-02-05.png"}, {"fid": "fig-02-06", "ch": 2, "title": "图2-6 智能层在闭环中的推理-规划-执行分工", "type": "layered", "caption": "图2-6 智能层在闭环中的推理-规划-执行分工，展示三个认知环节如何与平台层协同完成数据驱动决策循环。", "takeaway": "读者应理解智能层内的三个环节形成闭环，且只与平台层的数据中心和管理中心交互，不直接连接设备驱动。", "img": "assets/images/chapter-02/fig-02-06.png"}, {"fid": "fig-02-07", "ch": 2, "title": "图2-7 IoT DC3 五大中心逻辑关系", "type": "architecture", "caption": "图2-7 IoT DC3 五大中心逻辑关系。Gateway 是北向唯一入口，Auth 提供鉴权上下文，Manager 提供元数据，Data 是数据核心枢纽，Agentic 是 AI 能力层。数据经由消息队列解耦采集与命令下发。", "takeaway": "读者应理解DC3五大中心的分工边界：Gateway收口、Auth管准入、Manager管定义、Data管流转、Agentic管推理；以及Agentic中心如何通过API调度Data和Manager实现理解→决策闭环。", "img": "assets/images/chapter-02/fig-02-07.png"}, {"fid": "fig-02-08", "ch": 2, "title": "图2-8 认证流程时序图：用户登录到设备列表访问", "type": "sequence", "caption": "图2-8 用户登录并访问设备列表的完整认证时序。Gateway负责拦截和路由，Auth中心统一处理所有认证和授权判断，Manager只基于用户上下文查询数据。图中展示了两层协作：第一步登录换取令牌，第二步验证令牌和权限并转发业务请求。", "takeaway": "读者应理解认证逻辑集中在Auth中心，Gateway只负责路由和验票，Manager基于已认证的上下文执行业务，不重复判断权限。", "img": "assets/images/chapter-02/fig-02-08.png"}, {"fid": "fig-02-09", "ch": 2, "title": "图2-9 设备生命周期状态机", "type": "lifecycle", "caption": "图2-9 展示设备从注册到退役的五个状态及迁移条件。", "takeaway": "读者应理解设备状态的迁移条件，以及状态变化如何触发规则引擎事件。", "img": "assets/images/chapter-02/fig-02-09.png"}, {"fid": "fig-02-10", "ch": 2, "title": "图2-10 规则引擎数据流：温度超标触发报警与自动控制", "type": "flowchart", "caption": "图2-10 展示规则引擎从事件输入到告警/命令输出的数据流。", "takeaway": "读者应理解规则引擎在数据闭环中的位置：不直接操作硬件，而是通过Data中心间接下发命令。", "img": "assets/images/chapter-02/fig-02-10.png"}, {"fid": "fig-02-11", "ch": 2, "title": "图2-11 Data中心数据流示意", "type": "dataflow", "caption": "图2-11 展示了IoT DC3 Data中心的核心数据流，以及消息队列如何解耦写入和分发。", "takeaway": "Data 中心是一个『一次接收、两处分发』的数据管道：一条路径进消息队列，另一条路径即时推送给实时订阅方。", "img": "assets/images/chapter-02/fig-02-11.png"}, {"fid": "fig-02-12", "ch": 2, "title": "图2-12 五大中心协同流程（智能灌溉场景）", "type": "sequence", "caption": "图2-12 展示五大中心协同完成从设备注册到智能控制的完整流程。箭头上的编号对应正文中的步骤说明。", "takeaway": "读者应看到五个中心不是独立运行的，它们通过JWT、PointValue和消息队列串联成一个完整的“感知-决策-执行”闭环。", "img": "assets/images/chapter-02/fig-02-12.png"}, {"fid": "fig-02-13", "ch": 2, "title": "图2-13 智能层引入决策流程", "type": "flowchart", "caption": "图2-13 智能层引入决策流程：通过规则穷尽性与路径可编程性两条关键轴判断是否需要AI介入，避免为新技术而硬套技术。", "takeaway": "读者应理解：规则引擎足以处理所有可穷举的业务规则；只有当规则无法穷尽或需要结合多源上下文时，才考虑引入AI层。", "img": "assets/images/chapter-02/fig-02-13.png"}, {"fid": "fig-02-14", "ch": 2, "title": "图2-14 学习路径三台阶与自检节点", "type": "lifecycle", "caption": "图2-14 学习路径三台阶与自检节点。每个台阶完成对应自检后才能进入下一阶段，防止基础不牢直接上手工程造成理解断层。", "takeaway": "读者应明确三个台阶的前后依赖关系：必须通过上一台阶的自检才能进入下一阶段，防止基础不牢直接上手工程造成理解断层。", "img": "assets/images/chapter-02/fig-02-14.png"}, {"fid": "fig-03-01", "ch": 3, "title": "图3-1 感知层在物联网多层参考架构中的位置", "type": "layered", "caption": "图3-1 感知层在物联网多层参考架构中的位置。感知层包含传感器、识别设备和定位模块三大组件，负责将物理世界信息转换为位号值流、身份码和坐标数据，通过网络层上传至平台层和应用层。实线箭头表示数据流方向，虚线箭头表示控制指令或事件驱动方向。", "takeaway": "读者应理解感知层是物理世界与数字系统的桥梁，其核心产出是带语义的位号值流，四层架构的数据流与控制流方向相反。", "img": "assets/images/chapter-03/fig-03-01.png"}, {"fid": "fig-03-02", "ch": 3, "title": "图3-2 模拟与数字信号路径架构对比", "type": "architecture", "caption": "图3-2 模拟与数字信号路径对比。左栏模拟路径需要工程师逐级设计放大、滤波和ADC配置；右栏数字路径由传感器厂商封装调理电路，工程师只需通过总线协议读取结果。", "takeaway": "模拟路径需要工程师逐级设计调理，数字路径由传感器厂商封装好，工程师只需处理总线读取。", "img": "assets/images/chapter-03/fig-03-02.png"}, {"fid": "fig-03-03", "ch": 3, "title": "图3-3 RFID系统工作示意图", "type": "architecture", "caption": "图3-3 RFID系统工作示意图，展示读写器、天线与三种标签之间的射频耦合关系。", "takeaway": "读者应理解RFID系统并非简单的一对一通信，天线是独立性能模块，读写器通过耦合能量与标签交换数据。", "img": "assets/images/chapter-03/fig-03-03.png"}, {"fid": "fig-03-04", "ch": 3, "title": "图3-4 RFID在智能仓储中的应用拓扑示意", "type": "topology", "caption": "图3-4 展示UHF RFID在仓储场景中固定式门禁与手持终端配合使用的典型部署模式。示意场景：固定式读写器在数秒内可批量读取通过门禁的货物标签。", "takeaway": "读者应理解RFID仓储方案由现场标签、固定式读写器、手持终端、RFID中间件和WMS五层组件构成，主链路从标签通过天线经中间件抵达业务系统。", "img": "assets/images/chapter-03/fig-03-04.png"}, {"fid": "fig-03-05", "ch": 3, "title": "图3-5 室内外定位技术覆盖与精度光谱（示意）", "type": "timeline", "caption": "图3-5 室内外定位技术覆盖与精度光谱示意。横轴为定位精度（米，对数刻度），各技术以水平矩形表示宽度对应的典型精度区间。背景色区分室外（浅蓝）、半室外过渡（浅黄）和室内（浅灰）三种环境域。", "takeaway": "读者应能通过此图快速判断：给定精度需求和部署环境，应优先考虑哪种定位技术。", "img": "assets/images/chapter-03/fig-03-05.png"}, {"fid": "fig-03-06", "ch": 3, "title": "图3-6 三角测量定位原理示意", "type": "architecture", "caption": "图3-6 三角测量定位原理示意图。三圆在理想条件下应精确交于一点，但实际测量存在RSSI波动或ToA时钟误差，导致交叠区域出现，可借助最小二乘法计算误差平方和最小的点作为最终坐标。", "takeaway": "读者应理解三点定位的几何原理以及实际测量噪声导致的交叠区域，引出最小二乘修正的必要性。", "img": "assets/images/chapter-03/fig-03-06.png"}, {"fid": "fig-03-07", "ch": 3, "title": "图3-7 TinyML模型训练与部署全流程", "type": "flowchart", "caption": "图3-7 展示了TinyML从数据采集到端侧推理的完整工程流程，其中模型优化与云端训练之间的回退反馈是保证落地精度的关键环节。", "takeaway": "TinyML流程不是一个单向管道——模型优化环节的精度验收会触发回退迭代，这是工程落地中的关键闭环。", "img": "assets/images/chapter-03/fig-03-07.png"}, {"fid": "fig-03-08", "ch": 3, "title": "图3-8 振动传感器自适应采样状态机（示意）", "type": "architecture", "caption": "图3-8 振动传感器自适应采样状态机（示意）。状态转移由模型预测误差的连续放大驱动，混合了事件驱动与变化率策略。", "takeaway": "振动传感器通过预测误差连续放大驱动状态切换，从稳态低功耗模式逐步跃迁到高速上传模式，从而在电池受限条件下捕捉早期故障窗口。", "img": "assets/images/chapter-03/fig-03-08.png"}, {"fid": "fig-03-09", "ch": 3, "title": "图3-9 物模型驱动设备互操作的示意图", "type": "architecture", "caption": "图3-9 物模型作为中间抽象层，将异构设备的能力映射到标准的属性、服务和事件，使上层应用可统一消费数据。", "takeaway": "读者应理解物模型的价值核心在于‘能力抽象’：上层应用只与物模型交互，无需感知底层设备是Modbus RTU、MQTT还是二进制协议。", "img": "assets/images/chapter-03/fig-03-09.png"}, {"fid": "fig-03-10", "ch": 3, "title": "图3-10 物模型与设备实例的关系：属性、动作、事件的交互模式", "type": "architecture", "caption": "图3-10 物模型作为模板被多个设备实例复用，设备通过标准的三类接口与平台应用通信。平台无需关心设备内部差异，只需按照物模型定义的数据格式和协议进行交互。", "takeaway": "读者应理解物模型是一类设备的能力契约，多个设备实例共享同一模板，平台无需关心设备内部差异。", "img": "assets/images/chapter-03/fig-03-10.png"}, {"fid": "fig-04-01", "ch": 4, "title": "图4-1 NB-IoT 网络架构示意", "type": "topology", "caption": "图4-1 NB-IoT 从终端到应用的四层网络架构，展示上行数据与下行控制的完整路径，并标注关键 3GPP 接口。", "takeaway": "读者应理解NB-IoT复用运营商LTE蜂窝网络,终端经Uu空口、S1/SGi接口直达核心网与平台,无需自建网关。", "img": "assets/images/chapter-04/fig-04-01.png"}, {"fid": "fig-04-02", "ch": 4, "title": "图4-2 LoRaWAN网络架构示意", "type": "topology", "caption": "图4-2 LoRaWAN网络架构示意。终端通过LoRa射频连接网关，网关透明转发至网络服务器，应用服务器通过API与NS交互。", "takeaway": "读者应理解LoRaWAN星形拓扑中网关仅做透明转发、不解析帧,去重校验与下行调度全部集中在网络服务器。", "img": "assets/images/chapter-04/fig-04-02.png"}, {"fid": "fig-04-03", "ch": 4, "title": "图4-3 5G网络切片IoT应用示意", "type": "layered", "caption": "图4-3 通过5G网络切片技术，同一物理网络可同时承载不同服务质量需求的IoT场景。uRLLC保障毫秒级时延，mMTC提供极高连接密度，eMBB提供Gbps级吞吐。平台侧仍需协议适配层归一异构终端。", "takeaway": "读者应理解同一张5G物理网经切片选择功能逻辑隔离出三类SLA业务,而NB-IoT/LTE-M只是mMTC切片的兼容子集。", "img": "assets/images/chapter-04/fig-04-03.png"}, {"fid": "fig-04-04", "ch": 4, "title": "图4-4 主流 IoT 无线技术选型雷达图（示意框架）", "type": "matrix", "caption": "图4-4 对六种技术基于五项工程约束的定性对比。所有描述基于工程经验归纳，非实测或标准化值。多边形面积越大不代表技术越优，只反映该技术在更多维度上处于高位。", "takeaway": "读者应理解雷达图面积大不代表技术更优,LoRa用自建网关换距离与低功耗,NB-IoT则复用运营商基站换部署便捷。", "img": "assets/images/chapter-04/fig-04-04.png"}, {"fid": "fig-04-05", "ch": 4, "title": "图4-5 多种协议设备的接入困境", "type": "layered", "caption": "图4-5 多种协议设备的接入困境示意图。每增加一种协议，重复工作的范围不是线性增长，而是几何级数增长——新协议不仅需要自身适配，还需与已有协议在数据模型、指令集上做桥接。", "takeaway": "读者应理解接入协议每增加一种,重复适配工作呈几何级数增长,新协议还需与既有协议在数据模型与指令集上桥接。", "img": "assets/images/chapter-04/fig-04-05.png"}, {"fid": "fig-04-06", "ch": 4, "title": "图4-6 统一接入层的逻辑定位与内部能力分层", "type": "layered", "caption": "图4-6 统一接入层的逻辑定位与内部能力分层，明确了从异构协议到标准化业务事件的三层加工路径。", "takeaway": "读者应理解统一接入层的逻辑定位——它不是一个单一服务，而是由协议转换、设备模型映射、安全认证三个子层组成的中间层。", "img": "assets/images/chapter-04/fig-04-06.png"}, {"fid": "fig-04-07", "ch": 4, "title": "图4-7 统一接入层四层架构", "type": "layered", "caption": "图4-7 统一接入层通过四层解耦将协议差异逐层收口，上层对下层是调用依赖，下层对上层通过回调上送数据。", "takeaway": "读者应理解四层架构把协议差异逐层收口到最底层,上层只见设备影子与标准载荷,调用向下、数据回调向上。", "img": "assets/images/chapter-04/fig-04-07.png"}, {"fid": "fig-04-08", "ch": 4, "title": "图4-8 设备抽象与物模型映射示意图", "type": "dataflow", "caption": "图4-8 三种协议传感器数据经过驱动解析和数据映射层，统一转换为相同结构的物模型实例，上层应用消费时无需感知底层协议的差异", "takeaway": "读者应理解驱动把原始字节解析为带类型值(0x0A加偏移15.3得25.3℃),映射层按Schema归一成统一物模型实例。", "img": "assets/images/chapter-04/fig-04-08.png"}, {"fid": "fig-04-09", "ch": 4, "title": "图4-9 协议适配器接口与驱动实现架构", "type": "architecture", "caption": "图4-9 协议适配器接口与驱动实现的架构示意。每个具体驱动通过组合持有底层通信组件，对上层只暴露通用接口。", "takeaway": "读者应理解同一接口下驱动组合的组件各异(Modbus配串口表与超时器,BLE靠GATT解析),异构差异被吸收在实现层。", "img": "assets/images/chapter-04/fig-04-09.png"}, {"fid": "fig-04-10", "ch": 4, "title": "图4-10 IoT DC3整体架构及驱动层位置", "type": "architecture", "caption": "驱动层进程彼此独立、互不依赖，通过消息队列与平台核心服务解耦，实现驱动故障时平台主体不中断。开发者新增驱动仅需在驱动层横向增加一个方框，平台其余层无需变化。", "takeaway": "读者应理解驱动层用独立JVM进程+Driver SDK、经MQ与核心服务解耦,新增驱动只需横向加框,故障不中断平台。", "img": "assets/images/chapter-04/fig-04-10.png"}, {"fid": "fig-04-11", "ch": 4, "title": "图4-11 智能路灯系统总体拓扑", "type": "architecture", "caption": "图4-11 智能路灯系统总体拓扑——展示混合使用NB-IoT和LoRa两种通信技术的路灯如何通过统一接入层实现异构协议融合，使上层应用无感知。", "takeaway": "读者应理解统一接入层如何将两套异构的物理链路抽象为一致的设备属性，业务层无需感知底层协议差异。", "img": "assets/images/chapter-04/fig-04-11.png"}, {"fid": "fig-04-12", "ch": 4, "title": "图4-12 协议碎片化→统一接入层→Driver SDK 架构映射", "type": "architecture", "caption": "图4-12 协议碎片化→统一接入层→Driver SDK 架构映射。四层水平布局，展示从设备到应用的解耦路径。", "takeaway": "读者应理解每个协议只需一个独立驱动,经Driver SDK固定接口接入统一接入层,再归一为统一设备影子。", "img": "assets/images/chapter-04/fig-04-12.png"}, {"fid": "fig-04-13", "ch": 4, "title": "图4-13 延伸阅读三圈学习路径", "type": "layered", "caption": "图4-13 延伸阅读三圈学习路径。从第一圈蓝底（官方标准）开始，反复验证后进入第二圈绿底（动手实践），最后拓展到第三圈橙底（行业视野）。每圈内的条目旁标注了与本章的对应关系。", "takeaway": "读者应理解本章延伸阅读按官方标准、动手实践、行业视野三圈递进,每圈需反复验证后再进入下一圈。", "img": "assets/images/chapter-04/fig-04-13.png"}, {"fid": "fig-05-01", "ch": 5, "title": "图5-1 物联网平台分层架构示意", "type": "layered", "caption": "图5-1 物联网平台分层架构示意。感知层采集物理信号并数字化，经网络层传输至平台层；平台层完成协议转换、消息缓冲、规则判断与存储，最后通过API暴露给应用层；应用层提供人机交互与决策支持。", "takeaway": "读者应理解物联网的四层职责边界，以及数据流和控制流的方向差异。", "img": "assets/images/chapter-05/fig-05-01.png"}, {"fid": "fig-05-02", "ch": 5, "title": "图5-2 设备认证与数据加密流程", "type": "flowchart", "caption": "图5-2 设备认证与数据加密的主要流程，涵盖证书/Token方式与TLS/DTLS加密层。", "takeaway": "读者应理解证书与Token两条认证路径并存：TLS 1.3握手1RTT完成，DTLS多1次往返做重传保护，Token需配合refresh与短有效期防泄漏。", "img": "assets/images/chapter-05/fig-05-02.png"}, {"fid": "fig-05-03", "ch": 5, "title": "图5-3 消息队列缓冲削峰示意", "type": "dataflow", "caption": "图5-3 消息队列缓冲削峰示意：洪峰到达时，消息在Topic分区中暂存，消费者组按积压数据逐步消费，后端服务不直接承受瞬时冲击。", "takeaway": "读者应理解洪峰时队列水位升高而下游不直接承压，消费者按自身能力拉取削峰，多个消费者组可独立消费同一Topic满足不同时效。", "img": "assets/images/chapter-05/fig-05-03.png"}, {"fid": "fig-05-04", "ch": 5, "title": "图5-4 边缘-云协同典型架构", "type": "architecture", "caption": "图5-4 展示从设备边缘到云端的层次与协同模式，左侧标注EdgeX/KubeEdge的典型部署位置。", "takeaway": "读者应理解设备边缘、网关边缘、区域边缘的边界以及规则下发和聚合上报两条数据主链路。", "img": "assets/images/chapter-05/fig-05-04.png"}, {"fid": "fig-05-05", "ch": 5, "title": "图5-5 云边协同三大挑战的关联与权衡三角架", "type": "framework", "caption": "图5-5 云边协同的难点在于三个维度互相牵制：强化安全性可能增加运维复杂度，追求强一致会影响系统弹性。工程设计的核心是找到项目可接受的平衡点。", "takeaway": "读者应理解数据一致性、安全性、运维三挑战互相牵制：强加密拖慢同步、放宽一致性引入漏洞、强化安全加重运维，工程须取平衡点。", "img": "assets/images/chapter-05/fig-05-05.png"}, {"fid": "fig-05-06", "ch": 5, "title": "图5-6 降采样数据流程与数据量对比（假设场景）", "type": "dataflow", "caption": "图5-6 假设场景：中等规模工厂设备上报温度和湿度。三级降采样策略：原始数据保留短暂时间，分钟聚合保留中期，小时聚合保留季度级，天聚合保留年。各阶段数据量比例为基于常见压缩比的定性描述，非精确数值。", "takeaway": "读者应理解降采样通过分层聚合将数据量逐步压缩，不同层服务于不同时效性需求。", "img": "assets/images/chapter-05/fig-05-06.png"}, {"fid": "fig-05-07", "ch": 5, "title": "图5-7 异常检测性能对比示意：规则 vs 机器学习", "type": "matrix", "caption": "图5-7 异常检测性能对比示意：规则检测、浅层机器学习、深度学习与混合策略在适应性和可解释性上的定位。", "takeaway": "机器学习在召回率和自适应方面占优，规则在低误报率（针对已知故障）和解释性上更强；混合策略结合两者优势。", "img": "assets/images/chapter-05/fig-05-07.png"}, {"fid": "fig-05-08", "ch": 5, "title": "图5-8 从数据采集到告警触发的预测性维护流程", "type": "flowchart", "caption": "图5-8 预测性维护管道数据流示意", "takeaway": "读者应理解预测性维护靠残差驱动：Prophet预测值与实际值求残差、滑动窗口打分，超阈值才告警，运维确认后回流触发模型增量更新。", "img": "assets/images/chapter-05/fig-05-08.png"}, {"fid": "fig-05-09", "ch": 5, "title": "图5-9 Kappa架构示意图", "type": "dataflow", "caption": "Kappa架构通过单一流处理管道完成所有计算，历史数据的批量分析通过回放流（replay）实现，消除了Lambda架构并行维护两条管道的成本。", "takeaway": "读者应理解Kappa用单一流管道同时覆盖实时与历史：消息总线持久化原始流，历史分析靠Time Travel回放而非另建批管道，省去Lambda双管道维护。", "img": "assets/images/chapter-05/fig-05-09.png"}, {"fid": "fig-05-10", "ch": 5, "title": "图5-10 工厂设备状态监控系统四层架构图（假设场景）", "type": "architecture", "caption": "图5-10 工厂设备状态监控系统四层架构图（假设场景）", "takeaway": "读者应理解边缘两级阈值把安全与智能分流：一级阈值本地GPIO直接停机不经云端，二级及以上才经MQTT/Kafka上云做AI分析。", "img": "assets/images/chapter-05/fig-05-10.png"}, {"fid": "fig-05-11", "ch": 5, "title": "图5-11 平台层工程检查矩阵", "type": "matrix", "caption": "图5-11 平台层工程检查矩阵。这些检查项来自多个企业级物联网项目设计阶段的复盘，帮助设计者在五个维度上快速定位风险点。", "takeaway": "读者应理解检查矩阵在五维×四属性交叉点给出可验证检查项并按绿黄红标风险等级，如消息队列须acks=all、复制因子≥2。", "img": "assets/images/chapter-05/fig-05-11.png"}, {"fid": "fig-05-12", "ch": 5, "title": "图5-12 平台层延伸阅读工具链全景图", "type": "architecture", "caption": "图中每个方框对应正文推荐的开源项目或功能模块；“设备接入”层延伸自5.1节网关层。", "takeaway": "读者应理解开源工具沿数据上报→消费落库→查询告警的数据流链条分层，且边缘与容器编排层以虚框横跨消息与时序两层。", "img": "assets/images/chapter-05/fig-05-12.png"}, {"fid": "fig-06-01", "ch": 6, "title": "图6-1 物联网REST API端点设计示例（示意）", "type": "dataflow", "caption": "图6-1 物联网REST API端点设计示例（示意）", "takeaway": "读者应理解API以带v1前缀的资源型端点组织，上报与指令下发走写路径(经接入层校验、去重、队列)，历史查询走读路径并按时间窗参数化。", "img": "assets/images/chapter-06/fig-06-01.png"}, {"fid": "fig-06-02", "ch": 6, "title": "图6-2 物联网平台协议分层架构", "type": "architecture", "caption": "图6-2 展示MQTT、REST、gRPC在物联网平台各层次中的部署位置与交互关系。", "takeaway": "读者应理解设备、平台、北向三个层次的责任边界，以及各层次应选择的“最佳”协议。", "img": "assets/images/chapter-06/fig-06-02.png"}, {"fid": "fig-06-03", "ch": 6, "title": "图6-3 智能楼宇物联网系统微服务参考架构（示意）", "type": "architecture", "caption": "图6-3 展示智能楼宇系统中，南向设备通过边缘节点驱动接入，微服务层按领域拆分且各自持有独立数据存储，以及数据流与控制流分离的设计（示意）。", "takeaway": "读者应理解楼宇中MQTT/Modbus/BACnet三类异种协议统一由边缘网关的协议驱动接入，微服务按领域边界拆分且各自独立存储，数据流与控制流分离传递。", "img": "assets/images/chapter-06/fig-06-03.png"}, {"fid": "fig-06-04", "ch": 6, "title": "图6-4 单体到微服务演进阶段图", "type": "lifecycle", "caption": "图6-4 展示从单体原型到微服务持续演进的四个典型阶段。", "takeaway": "读者应理解微服务演进由团队规模与协作摩擦驱动，每前进一步都要用新架构问题(单点故障、数据一致性、分布式事务成本)换取部署与分工的收益。", "img": "assets/images/chapter-06/fig-06-04.png"}, {"fid": "fig-06-05", "ch": 6, "title": "图6-5 物联网微服务容器部署的端-边-云分层架构", "type": "layered", "caption": "图6-5 展示物联网微服务从端设备到边缘节点再到云端的容器部署分层架构。边缘层运行 k3s 轻量集群处理协议适配和本地缓存，云端运行完整 K8s 集群承载中心服务。", "takeaway": "读者应理解边缘与云端采用不同规格容器编排(k3s vs 完整K8s)，时延敏感的采集控制回路在边缘本地闭环不经云端，云端仅经MQTT异步交换数据。", "img": "assets/images/chapter-06/fig-06-05.png"}, {"fid": "fig-06-06", "ch": 6, "title": "图6-6 IoT DC3 模块关系与数据流分层图", "type": "architecture", "caption": "图6-6 IoT DC3 模块关系与数据流：北向请求经 Gateway 进入四中心，Driver 经 gRPC 对接 Manager，命令与数据经 RabbitMQ 在 Data 和 Driver 之间异步流转。", "takeaway": "读者应理解北向统一路由、Driver 与 Manager 的 gRPC 管理调用，以及 Data 与 Driver 之间的 RabbitMQ 异步命令和数据流。", "img": "assets/images/chapter-06/fig-06-06.png"}, {"fid": "fig-06-07", "ch": 6, "title": "图6-7 IoT DC3 服务间通信架构图", "type": "architecture", "caption": "图6-7 IoT DC3 服务间通信架构：Gateway 与 gRPC 承担同步管理调用，命令、回执和上行数据经 RabbitMQ 异步流转。", "takeaway": "Gateway 与 gRPC 负责管理和元数据调用；点位命令、自定义命令、执行回执、位号值和状态事件统一经 RabbitMQ 流转。", "img": "assets/images/chapter-06/fig-06-07.png"}, {"fid": "fig-06-08", "ch": 6, "title": "图6-8 微服务可观测性分层架构", "type": "layered", "caption": "从代码规范到告警通知的完整监控链路", "takeaway": "读者应理解可观测性中服务主动暴露端点、Prometheus以pull模式拉取指标、日志与指标分通道存储(ES/Prometheus)，健康状态并入业务指标统一告警。", "img": "assets/images/chapter-06/fig-06-08.png"}, {"fid": "fig-06-09", "ch": 6, "title": "图6-9 物联网系统关键决策三元组", "type": "architecture", "caption": "图6-9 从原型到生产的三元决策矩阵。每一列展示了在语言、协议、架构层面，原型阶段和生产阶段分别采用的最佳选项，以及两者之间的最短迁移路径。图中元素来源于本章各节讨论（6.1 语言实践、6.2 协议实践、6.3 架构实践）。", "takeaway": "读者应理解物联网系统决策不是孤立选择，而是三个维度互相影响的系统工程。", "img": "assets/images/chapter-06/fig-06-09.png"}, {"fid": "fig-07-01", "ch": 7, "title": "图7-1 AIoT 演进阶段示意", "type": "timeline", "caption": "图7-1 AIoT 从连接到自主决策的演进示意。第一阶段设备上网，数据汇聚，人看仪表盘做判断；第二阶段 LLM 理解语义，通过工具调用查设备、写位号、下命令，人机协作；第三阶段 Agent 自主监测、诊断、规划、执行，人类从操作员变为监督员。驱动因素包括算力下沉、大模型突破和边缘智能普及。", "takeaway": "AIoT 不是一蹴而就的技术堆叠，而是逐步将智能注入数据管道的系统工程。", "img": "assets/images/chapter-07/fig-07-01.png"}, {"fid": "fig-07-02", "ch": 7, "title": "图7-2 ReAct 循环在物联网 Agent 中的工作示意", "type": "architecture", "caption": "图7-2  ReAct 循环在物联网 Agent 中的工作示意，展示自然语言指令如何通过推理-行动-观察循环完成多步任务。", "takeaway": "读者应理解 ReAct 循环中思考、行动、观察三个环节的交替逻辑，以及完成判断与结果输出之间的关系。", "img": "assets/images/chapter-07/fig-07-02.png"}, {"fid": "fig-07-03", "ch": 7, "title": "图7-3 RAG + Tool-Calling 联合工作流", "type": "dataflow", "caption": "图7-3 RAG + Tool-Calling 联合工作流图。操作员发起任务后，LLM 首先通过 RAG 检索设备 SOP 文档，获取操作步骤；随后按步骤依次调用 Tool-Calling 执行具体设备操作，直至任务完成。", "takeaway": "读者应理解 RAG 检索 SOP 步骤灌入模型，Tool-Calling 据此落成关泵指令，二者在泳道中职责分离。", "img": "assets/images/chapter-07/fig-07-03.png"}, {"fid": "fig-07-04", "ch": 7, "title": "图7-4 MCP 在物联网平台中的架构示意", "type": "architecture", "caption": "图7-4 IoT DC3 当前 MCP 边界：外部 Agent 经 initialize 协商后使用 tools/list 与 tools/call；Gateway 每次调用前经 Auth 校验，工具目录由 OpenAPI 规格汇聚，Resources 与 Prompts 当前未启用。", "takeaway": "当前端点只声明 Tools；Resources 与 Prompts 属于协议知识边界，尚未启用。", "img": "assets/images/chapter-07/fig-07-04.png"}, {"fid": "fig-07-05", "ch": 7, "title": "图7-5 Function Calling 交互流程：从自然语言到设备操作", "type": "sequence", "caption": "图7-5 展示了 Spring AI Function Calling 的完整调用链路，以“关A区灯”为例。操作员的自然语言请求首先到达 ChatClient，ChatClient 将消息连同 LightTool 的工具描述发送给", "takeaway": "读者应理解 LLM 全程不执行设备操作，只输出 JSON 函数调用请求，实际调用与结果回填都由 ChatClient 中转。", "img": "assets/images/chapter-07/fig-07-05.png"}, {"fid": "fig-07-06", "ch": 7, "title": "图7-6 Agentic Center 四层架构", "type": "layered", "caption": "图7-6 Agentic Center 四层架构：Tool 通过 Facade/gRPC 复用平台能力，会话与平台数据存于 PostgreSQL，设备命令和位号值经 Data、RabbitMQ 与 Driver 流转。", "takeaway": "读者应理解 Tool 经 Facade/gRPC 复用能力而非 Feign 旁路，会话与数据存于 PostgreSQL，不设命令服务。", "img": "assets/images/chapter-07/fig-07-06.png"}, {"fid": "fig-07-07", "ch": 7, "title": "图7-7 Agentic Center 当前能力与知识对齐边界", "type": "architecture", "caption": "图7-7 当前以 Tools、Web/HTTP 对话和 MCP Tools 端点为实现边界；Skills 与 CLI 用于对齐通用 Agent 工程知识，尚不是 IoT DC3 已实现功能。", "takeaway": "读者应理解当前只有 @Tool、Web/HTTP 与 MCP Tools 属已实现边界，Skills 与 CLI 仅作知识对齐概念。", "img": "assets/images/chapter-07/fig-07-07.png"}, {"fid": "fig-07-08", "ch": 7, "title": "图7-8 私有化与混合部署架构", "type": "architecture", "caption": "图7-8 展示私有化部署中 Agentic Center 与本地/云端推理引擎之间的路由关系。", "takeaway": "读者应理解私有化部署不是全量替代公有云，而是根据数据敏感度和任务复杂度分层选择推理后端。", "img": "assets/images/chapter-07/fig-07-08.png"}, {"fid": "fig-07-09", "ch": 7, "title": "图7-9 IoT DC3 Agentic Center 的 Copilot 到 Agent 三阶段演进路线", "type": "architecture", "caption": "图7-9-1: IoT DC3 Agentic Center 三阶段演进路线示意。自主程度逐步提升，但人工确认点从未消失，只是从“每步确认”转变为“关键节点确认”。", "takeaway": "读者应理解自主程度逐阶段升高，但人工确认点从未消失——从每步确认转为关键节点确认，高风险白名单始终不可绕过。", "img": "assets/images/chapter-07/fig-07-09.png"}, {"fid": "fig-08-01", "ch": 8, "title": "图8-1 物联网安全威胁分层分类", "type": "layered", "caption": "图8-1 物联网安全威胁分层分类，展示威胁从物理层到应用层的分布及跨层攻击向量。数据泄露和AI模型攻击作为横切面威胁纵贯多个层次。", "takeaway": "读者应理解物理接触可沿“提取固件密钥→伪造平台身份”逐层升级为跨租户数据窃取，威胁本质是跨层传导的链条，故安全必须全链路防御。", "img": "assets/images/chapter-08/fig-08-01.png"}, {"fid": "fig-08-02", "ch": 8, "title": "图8-2 物联网纵深防御多层模型", "type": "layered", "caption": "图8-2 展示了物联网系统中纵深防御的层次结构、攻击面与防御阻断方向，以及补偿控制的跨层连接。", "takeaway": "读者应理解单层防御失守可被相邻层补偿控制承接，如Layer2缺硬件信任根时由Layer3证书锁定与异常流量检测兜底。", "img": "assets/images/chapter-08/fig-08-02.png"}, {"fid": "fig-08-03", "ch": 8, "title": "图8-3 TLS 1.3与EDHOC握手流程对比", "type": "sequence", "caption": "图8-3 展示TLS 1.3双向认证与EDHOC轻量认证的握手流程对比。TLS需要两次往返且传输证书，EDHOC仅需3条消息，体积更小。", "takeaway": "读者应理解EDHOC仅3条消息即完成双向认证并协商出会话密钥，无需像TLS那样往返传输证书链，消息数与载荷均显著更小。", "img": "assets/images/chapter-08/fig-08-03.png"}, {"fid": "fig-08-04", "ch": 8, "title": "图8-4 安全启动多层信任链流程", "type": "flowchart", "caption": "图8-4 安全启动的多层信任链流程，展示从 BootROM 到文件系统的逐级签名验证关系。", "takeaway": "读者应理解信任链根植于不可篡改的BootROM（内含OTP公钥指纹），每一级只验证上一级签名，任一级失败即停机或回退恢复模式。", "img": "assets/images/chapter-08/fig-08-04.png"}, {"fid": "fig-08-05", "ch": 8, "title": "图8-5 防篡改设计的纵深防线", "type": "layered", "caption": "图8-5 防篡改设计的四层防线：从外壳到芯片内部依次递进，攻击者需要逐层突破并付出指数级增长的成本。安全元件内部闭环完成密钥派生与签名，私钥永不离开芯片。", "takeaway": "读者应理解密钥派生与签名全程在安全元件内部闭环，PUF派生私钥永不通过SPI暴露给主控，物理取芯也拿不到明文私钥。", "img": "assets/images/chapter-08/fig-08-05.png"}, {"fid": "fig-08-06", "ch": 8, "title": "图8-6 TLS 1.3握手流程", "type": "sequence", "caption": "图8-6 TLS 1.3握手流程（含示意性的双向认证）：展示从ClientHello到应用数据全加密的主要步骤。", "takeaway": "读者应理解TLS握手仅ClientHello与ServerHello为明文，Finished起即用会话密钥加密，双向认证时客户端须额外出示证书。", "img": "assets/images/chapter-08/fig-08-06.png"}, {"fid": "fig-08-07", "ch": 8, "title": "图8-7 CoAP 的 OSCORE 安全处理流程示意", "type": "dataflow", "caption": "OSCORE 处理模块先将 CoAP 请求载荷加密，再用 Client 与 Server 预共享的密钥计算基于 HMAC 的 MAC，然后将加密结果、密钥标识（Kid）和序列号打包为一条新的 CoAP 请求。Server 端解密并校验", "takeaway": "读者应理解OSCORE以“加密+MAC校验+序列号滑动窗口”一次打包完成机密性、完整性与防重放，序列号重复即拒绝并返回4.01。", "img": "assets/images/chapter-08/fig-08-07.png"}, {"fid": "fig-08-08", "ch": 8, "title": "图8-8 物联网微隔离架构示意图", "type": "architecture", "caption": "图8-8 物联网微隔离架构示意图。四层模型从设备到策略编排依次递进，微分段控制层是核心决策点。", "takeaway": "读者应理解微隔离把隔离规则下放到SDN微分段控制层，按设备级下发策略，使被攻陷设备无法在同一网络内横向移动。", "img": "assets/images/chapter-08/fig-08-08.png"}, {"fid": "fig-08-09", "ch": 8, "title": "图8-9 密钥生命周期管理与云边协同流程", "type": "flowchart", "caption": "图8-9 密钥生命周期管理与云边协同流程", "takeaway": "读者应理解密钥状态沿生成、分发、轮换、撤销、销毁迁移，云端与边缘经TLS加密通道协同管理，撤销即从可用态剔除。", "img": "assets/images/chapter-08/fig-08-09.png"}, {"fid": "fig-08-10", "ch": 8, "title": "图8-10 数据脱敏与匿名化决策流程", "type": "flowchart", "caption": "大多数项目的问题在于混淆脱敏和匿名化：做了一层掩盖就当成匿名化发布，导致重识别风险泄露。差异在于强匿名化必须通过重识别风险评估（资料：[S2]）。", "takeaway": "读者应理解脱敏只是弱保护，匿名化须注入差分隐私并通过重识别风险评估方可发布，仅掩盖一层即发布是重识别泄露的根源。", "img": "assets/images/chapter-08/fig-08-10.png"}, {"fid": "fig-08-11", "ch": 8, "title": "图8-11 物联网平台 JWT 认证与授权架构", "type": "layered", "caption": "图8-11 JWT 认证与授权架构:认证层颁发令牌、授权层执行 RBAC/ABAC 决策、审计日志记录上下文,租户边界贯穿始终。", "takeaway": "", "img": "assets/images/chapter-08/fig-08-11.png"}, {"fid": "fig-08-12", "ch": 8, "title": "图8-12 多租户隔离强度对比", "type": "matrix", "caption": "表8-5 多租户隔离强度对比（假设场景：智能家居平台“智家云”）", "takeaway": "读者应理解隔离强度与跨租户风险反向、与资源效率和运维复杂度也反向，强隔离必有成本代价，需按租户价值取舍。", "img": "assets/images/chapter-08/fig-08-12.png"}, {"fid": "fig-08-13", "ch": 8, "title": "图8-13 智能家居多租户系统架构", "type": "architecture", "caption": "图8-13 智能家居多租户系统架构（基于“智家云”假设场景）", "takeaway": "读者应理解混合隔离由网关解析tenant_id后分流，高价值租户B独占VPC、Pod池与MySQL实例，普通租户共享资源以摊薄成本。", "img": "assets/images/chapter-08/fig-08-13.png"}, {"fid": "fig-08-14", "ch": 8, "title": "图8-14 后门攻击流程图", "type": "flowchart", "caption": "图8-14 后门攻击的关键是触发器设计与毒化样本注入:模型经 OTA 分发到边缘设备后,后门一旦植入清理成本极高,且少量毒化样本常规测试集难以检出。", "takeaway": "", "img": "assets/images/chapter-08/fig-08-14.png"}, {"fid": "fig-08-15", "ch": 8, "title": "图8-15 模型注入攻击防御策略及适用场景对比表", "type": "matrix", "caption": "图8-15 模型注入防御需按攻击面组合策略:云端训练侧重数据溯源与对抗训练,设备端侧重验签与查询防护。", "takeaway": "", "img": "assets/images/chapter-08/fig-08-15.png"}, {"fid": "fig-08-16", "ch": 8, "title": "图8-16 LLM 驱动的 IoT 操作：安全威胁与可解释性反馈架构", "type": "architecture", "caption": "图8-16 LLM 驱动设备操作时,输入/输出两端安全过滤拦截攻击,模型层内嵌可解释性反馈,审计日志贯穿,形成可解释+可审计的安全闭环。", "takeaway": "", "img": "assets/images/chapter-08/fig-08-16.png"}, {"fid": "fig-08-17", "ch": 8, "title": "图8-17 物联网安全开发活动与阶段对应关系", "type": "lifecycle", "caption": "", "takeaway": "", "img": "assets/images/chapter-08/fig-08-17.png"}, {"fid": "fig-08-18", "ch": 8, "title": "图8-18 物联网安全日志收集与分析架构", "type": "architecture", "caption": "图8-18 物联网安全日志收集与分析架构", "takeaway": "", "img": "assets/images/chapter-08/fig-08-18.png"}, {"fid": "fig-08-19", "ch": 8, "title": "图8-19 安全应急响应与恢复流程", "type": "flowchart", "caption": "图8-19 物联网安全事件应急响应流程图", "takeaway": "", "img": "assets/images/chapter-08/fig-08-19.png"}, {"fid": "fig-08-20", "ch": 8, "title": "图8-20 本章参考资料分类导图", "type": "architecture", "caption": "本图将研究资料包中的 12 条参考资料按安全主题域分类映射。左侧为设备层安全（硬件、通信、协议），右侧为平台与数据层安全（权限、AI、测试），从上到下覆盖从物理层到应用层的全栈。", "takeaway": "读者应理解12条参考资料按六大主题域归档，其中协议安全问题仅[S5][S6]两条、AI安全仅[S4][S8]两条，可据此判断支撑密度。", "img": "assets/images/chapter-08/fig-08-20.png"}, {"fid": "fig-09-01", "ch": 9, "title": "图9-1 物联网协议栈与分类图", "type": "layered", "caption": "图9-1 应用层协议运行在 TCP/UDP 之上，与底层无线技术无关；LwM2M 作为 CoAP 上层协议，继承其传输特性。", "takeaway": "读者应理解物联网协议栈层间关系，以及应用层协议因通信模型不同而分为发布/订阅和请求/响应两大类。", "img": "assets/images/chapter-09/fig-09-01.png"}, {"fid": "fig-09-02", "ch": 9, "title": "图9-2 MQTT会话连接与心跳交互示意", "type": "sequence", "caption": "图9-2 MQTT会话连接与心跳交互示意。Client（sensor01）向Broker发起持久会话连接，完成订阅并与Broker维持60秒间隔的心跳。网络中断后Broker在90秒（1.5倍KA）超时后判定Client离线，执行遗嘱消息。Client通过指数退避策略重连，Broker识别出相同ClientID并恢复会话，随后推送断开期间缓存的消息。", "takeaway": "理解会话持久化、心跳超时判定以及重连策略如何配合恢复已缓存的消息。", "img": "assets/images/chapter-09/fig-09-02.png"}, {"fid": "fig-09-03", "ch": 9, "title": "图9-3 MQTT智能家居监控系统交互序列", "type": "sequence", "caption": "图9-3 展示了一个完整的MQTT智能家居监控交互序列。序列分三个阶段：Phase I连接建立与遗嘱设置，Phase II正常运行与告警触发，Phase III断连处理与遗嘱发布。重点突出QoS 1的周期数据、QoS 2的告警消息以及断连后的遗嘱消息三者的时序与角色差异。", "takeaway": "读者应理解MQTT设备、Broker、订阅端和手机App之间的消息时序，重点关注遗嘱消息和QoS 2告警消息在可靠性保障中的角色。", "img": "assets/images/chapter-09/fig-09-03.png"}, {"fid": "fig-09-04", "ch": 9, "title": "图9-4 CoAP消息格式与选项示意", "type": "architecture", "caption": "图9-4 CoAP消息格式与HTTP文本头部的体积对比，突出CoAP的紧凑二进制设计对受限设备的价值。", "takeaway": "读者应理解等效的GET请求，HTTP的文本头部大小通常远超CoAP的二进制头部，由此理解CoAP在受限网络中的核心优势。", "img": "assets/images/chapter-09/fig-09-04.png"}, {"fid": "fig-09-05", "ch": 9, "title": "图9-5 BLE GATT协议栈与服务-特征层次", "type": "layered", "caption": "图9-5 BLE GATT协议栈层次及Service-Characteristic-Descriptor嵌套结构，右半部分展示Notification与Indication的执行路径分叉。", "takeaway": "读者应看到GATT Profile是属性数据库的访问模型，Characteristic是数据点，Descriptor控制订阅行为。Notification无确认、功耗低但可能丢包；Indication有ACK、高可靠但功耗大。", "img": "assets/images/chapter-09/fig-09-05.png"}, {"fid": "fig-09-06", "ch": 9, "title": "图9-6 MCP协议交互序列图", "type": "sequence", "caption": "图9-6 MCP协议交互序列示意：AI Agent通过MCP Server与IoT平台及设备进行有状态、安全可控的工具调用。", "takeaway": "读者应理解MCP作为AI与IoT平台之间的互操作层，不直接操作设备，而是通过平台封装的安全上下文调用后端服务。", "img": "assets/images/chapter-09/fig-09-06.png"}, {"fid": "fig-09-07", "ch": 9, "title": "图9-7 协议适配网关分层架构", "type": "layered", "caption": "图9-7 协议适配网关通用三层架构。自下向上逐层抽象：适配层负责协议连接管理和字节流收发，路由与转换层做格式与语义映射，统一接口层向上屏蔽差异。", "takeaway": "读者应理解协议适配网关不是简单的协议转换器，而是具有分层职责边界：适配层负责协议特有收发，路由与转换层做语义映射，统一接口层屏蔽差异。", "img": "assets/images/chapter-09/fig-09-07.png"}, {"fid": "fig-09-08", "ch": 9, "title": "图9-8 物联网标准化演进时间线", "type": "timeline", "caption": "图9-8 展示了物联网标准化从独立垂直标准，到水平平台收敛，再到语义描述和AI交互接口的四个阶段。MCP在工程实践中融合了oneM2M和WoT的设计思路，而不是另起炉灶。", "takeaway": "标准化的趋势是语义统一和AI交互接口预留，这决定了平台架构演进的长期方向。", "img": "assets/images/chapter-09/fig-09-08.png"}, {"fid": "fig-10-01", "ch": 10, "title": "图10-1 工业4.0发展阶段时间线", "type": "timeline", "caption": "图10-1 展示了从工业化到数字化四个阶段的关键特征。阶段划分依据工业界公认的演进脉络。", "takeaway": "读者应理解工业4.0不是突然出现的概念，而是在前三次工业革命（机械化、电气化、自动化）基础上的范式跃迁。", "img": "assets/images/chapter-10/fig-10-01.png"}, {"fid": "fig-10-02", "ch": 10, "title": "图10-2 工业4.0与传统制造的核心特征对比", "type": "matrix", "caption": "图10-2 展示传统制造与工业4.0在关键维度上的本质差异。驱动要素和系统架构的转变是根本。", "takeaway": "读者应能明确区分传统制造（经验驱动、事后记录、刚性产线）与工业4.0（数据驱动、实时生产要素、柔性产线）的本质差异。", "img": "assets/images/chapter-10/fig-10-02.png"}, {"fid": "fig-10-03", "ch": 10, "title": "图10-3 数字孪生五维模型架构图", "type": "architecture", "caption": "五维模型架构图。连接层（CN）是数字孪生能否实时运转的关键：它决定了物理实体与虚拟模型之间的同步精度和指令可达性。数据与服务层和知识层则提供了从数据到决策的持续演进能力。", "takeaway": "读者应理解连接层是数字孪生枢纽:传感器值经CN上行、控制指令下行,模型输出沉淀为知识反哺业务,形成自我进化的双向闭环。", "img": "assets/images/chapter-10/fig-10-03.png"}, {"fid": "fig-10-04", "ch": 10, "title": "图10-4 三类维护策略长期运营效率对比（示意）", "type": "architecture", "caption": "图10-4 三类维护策略效率对比（示意）。本图展示三种维护策略在长期运营中的成本与可用率相对趋势：被动维护成本快速攀升、可用率骤降；预防性维护成本周期性波动、可用率缓慢下滑；预测性维护成本逐步稳定、可用率长期维持高位。", "takeaway": "读者应理解三类维护策略在长期运行中成本与可用率的相对走势：被动维护成本快速攀升、可用率骤降；预防性维护成本周期性波动、可用率缓慢下滑；预测性维护成本逐步稳定低位、可用率几乎不衰减。", "img": "assets/images/chapter-10/fig-10-04.png"}, {"fid": "fig-10-05", "ch": 10, "title": "图10-5 OPC UA地址空间树状结构", "type": "topology", "caption": "图10-5 OPC UA地址空间以树状节点组织，客户端连入后可直接遍历发现设备的数据结构。", "takeaway": "读者应理解OPC UA以三种引用类型区分层次:Organizes组织设备、HasComponent含变量/方法、HasProperty挂元数据。", "img": "assets/images/chapter-10/fig-10-05.png"}, {"fid": "fig-10-06", "ch": 10, "title": "图10-6 原始数据与清洗后数据对比", "type": "flowchart", "caption": "图10-6 某产线电机温度数据清洗前后的对比。左侧空白为通信中断导致的缺失，右侧尖峰为电磁干扰导致的毛刺。", "takeaway": "读者应理解清洗须先判异常成因:通信中断的缺失段用前向填充,电磁干扰的毛刺替换为平滑值,两类异常处理手段不同。", "img": "assets/images/chapter-10/fig-10-06.png"}, {"fid": "fig-10-07", "ch": 10, "title": "图10-7 AI模型部署架构（从训练到边缘推理）", "type": "architecture", "caption": "图10-7 AI模型部署架构：从训练环境到工业物联网平台的完整链路，涉及模型导出、推理服务化和与IoT DC3的集成。", "takeaway": "读者应理解模型仓库一份模型可同时服务REST与专用推理,边缘只跑裁剪模型且仅上报结果,与云端分工避免重复工单。", "img": "assets/images/chapter-10/fig-10-07.png"}, {"fid": "fig-10-08", "ch": 10, "title": "图10-8 预测性维护闭环数据流（示意）", "type": "flowchart", "caption": "图10-8 预测性维护闭环的典型数据流（示意）：从原始振动信号到维护工单生成，经过五层转换，每层都有明确的输入输出格式和系统边界。图中阈值和窗口为示例，需根据具体设备校准。", "takeaway": "读者应理解闭环中每层的职责边界与数据形态变化，工单生成不是终点而是反馈起点。", "img": "assets/images/chapter-10/fig-10-08.png"}, {"fid": "fig-10-09", "ch": 10, "title": "图10-9 IoT DC3平台微服务架构", "type": "architecture", "caption": "图10-9 IoT DC3平台微服务架构，展示从设备接入到智能决策闭环的五层结构与模块边界。", "takeaway": "读者应理解规则引擎毫秒级快判、LLM深析走异步互不阻塞,数据中心是唯一数据枢纽而设备中心不介入实时数据流。", "img": "assets/images/chapter-10/fig-10-09.png"}, {"fid": "fig-10-10", "ch": 10, "title": "图10-10 IoT DC3设备接入与数据采集数据流", "type": "dataflow", "caption": "图10-10 示意SMT产线场景下IoT DC3从设备接入到监控大屏的数据流。", "takeaway": "读者应理解原始位号到展示曲线需三层改造:驱动归一为语义PointValue、数据中心对齐时间戳与单位、时序库按设备+位号分区。", "img": "assets/images/chapter-10/fig-10-10.png"}, {"fid": "fig-10-11", "ch": 10, "title": "图10-11 规则引擎告警触发与预测性维护工单闭环流程", "type": "flowchart", "caption": "图10-11 展示了从温度数据判定到AI推理、工单创建、通知发送，以及基于工单状态回环的完整闭环流程。橙色部分表示升级路径，是在等待回复超时后触发的二次决策。", "takeaway": "读者应看到规则引擎在事件触发环节的可靠性价值，以及如何通过工单状态回环形成闭环控制，而非单向告警。", "img": "assets/images/chapter-10/fig-10-11.png"}, {"fid": "fig-10-12", "ch": 10, "title": "图10-12 本章知识体系图谱", "type": "layered", "caption": "图10-12 概述第10章的四层知识体系：从工业连接技术、数据平台、智能分析到IoT DC3实践，逐层递进。", "takeaway": "读者应理解本章四层知识逐级递进且每层落在IoT DC3具体模块上,分析决策经平台层下发设备,形成带返回线的闭环。", "img": "assets/images/chapter-10/fig-10-12.png"}, {"fid": "fig-11-01", "ch": 11, "title": "图11-1 V2X通信技术选型决策路径图", "type": "flowchart", "caption": "图11-1 V2X通信技术选型决策路径图", "takeaway": "读者应理解时延是首要维度:碰撞预警百毫秒级用DSRC,毫秒级编队须NR-V2X,稀疏覆盖靠Mode 4直连兜底。", "img": "assets/images/chapter-11/fig-11-01.png"}, {"fid": "fig-11-02", "ch": 11, "title": "图11-2 RSU与OBU通信流程", "type": "sequence", "caption": "图11-2 RSU与OBU通信流程图。展示了信号机、路侧雷达、RSU、OBU、车载HMI和ADAS域控制器之间的消息流向和时序。", "takeaway": "读者应理解RSU是路侧枢纽:信号机灯色经串口轮询编码SPAT,雷达目标经以太网编码RSI,OBU融合CAN数据供ADAS。", "img": "assets/images/chapter-11/fig-11-02.png"}, {"fid": "fig-11-03", "ch": 11, "title": "图11-3 智能路灯杆功能图（假设场景）", "type": "architecture", "caption": "图11-3 智能路灯杆功能图（假设场景），展示五类模块与边缘计算盒的数据流向关系。”", "takeaway": "读者应理解边缘计算盒的关键作用——视频等高频数据本地消失，低频和控制数据上传，这是城市级物联网带宽与管理成本的工程折中。", "img": "assets/images/chapter-11/fig-11-03.png"}, {"fid": "fig-11-04", "ch": 11, "title": "图11-4 城市应急响应物联网架构", "type": "architecture", "caption": "图11-4 展示城市应急响应系统从感知到指挥的四层职责边界与主数据流向。", "takeaway": "读者应理解应急响应系统的分层职责边界，以及边缘处理与事件路由对响应时间的压缩作用。", "img": "assets/images/chapter-11/fig-11-04.png"}, {"fid": "fig-11-05", "ch": 11, "title": "图11-5 火灾应急响应事件流转时序（假设场景）", "type": "sequence", "caption": "图11-5 自动化链路的关键在于边缘节点完成本地判定（第2步），云端协同层完成自动事件路由（第4步），两地均无人工转接环节。", "takeaway": "读者应理解自动化链路如何规避人工转接带来的延迟，以及边缘节点在压减感知到响应时间中的位置。", "img": "assets/images/chapter-11/fig-11-05.png"}, {"fid": "fig-11-06", "ch": 11, "title": "图11-6 城市物联网百万级接入系统架构图", "type": "architecture", "caption": "图11-6 城市物联网百万级接入系统架构图。负载均衡器按IP哈希分配设备连接到MQTT Broker集群；Broker将消息发布到Kafka分区；流处理引擎从Kafka消费并处理后写入时序数据库；业务微服务直接从Kafka消费特定主题处理非实时数据；虚线控制流表示Broker向设备侧发送心跳和订阅恢复指令。", "takeaway": "读者应理解百万级接入靠两段解耦:IP哈希维持设备-Broker长连接,MQTT转Kafka削峰后按实时与非实时分路消费。", "img": "assets/images/chapter-11/fig-11-06.png"}, {"fid": "fig-11-07", "ch": 11, "title": "图11-7 城市物联网消息队列与数据流处理架构", "type": "architecture", "caption": "图11-7 展示设备层、消息队列、流处理层与存储服务层之间的数据流动。设备上报到Kafka，Flink消费后聚合写入Redis/时序DB；AI推理微服务通过RocketMQ接收控制指令。", "takeaway": "读者应理解高频传感流走Kafka/Flink实时聚合入时序库,控制指令走RocketMQ事务管道,两类通道隔离避免互扰。", "img": "assets/images/chapter-11/fig-11-07.png"}, {"fid": "fig-11-08", "ch": 11, "title": "图11-8 云边协同分层架构示意", "type": "architecture", "caption": "图11-8 云边协同分层架构示意：设备层数据经路侧RSU实时处理后，聚合统计上传至区域汇聚节点，汇聚节点运行短期预测模型，并与云端进行训练数据交换。", "takeaway": "读者应理解云边协同不是简单地把计算下放，而是按延迟、数据量和算力三个维度进行任务卸载；每层有其清晰的职责边界。", "img": "assets/images/chapter-11/fig-11-08.png"}, {"fid": "fig-11-09", "ch": 11, "title": "图11-9 LSTM交通流预测模型架构图", "type": "layered", "caption": "图11-9 展示LSTM模型处理交通流量序列的层次结构，从多通道输入经LSTM特征提取后输出未来6步预测。", "takeaway": "读者应理解输入96步×3通道(流量/时刻/星期)经LSTM压缩为64维,Dropout防过拟合,Dense(6)输出未来6步。", "img": "assets/images/chapter-11/fig-11-09.png"}, {"fid": "fig-11-10", "ch": 11, "title": "图11-10 十字路口强化学习框架", "type": "flowchart", "caption": "图11-10 十字路口强化学习框架图。展示了RL智能体通过状态观测、动作执行、奖励反馈及经验回放训练DQN网络的闭环过程。", "takeaway": "读者应理解十字路口RL框架中，从环境到智能体目标网络的训练主链路，以及经验回放和双网络结构对训练稳定性的支撑作用。", "img": "assets/images/chapter-11/fig-11-10.png"}, {"fid": "fig-11-11", "ch": 11, "title": "图11-11 能耗数据对比图（智能照明 vs 传统照明，假设场景）", "type": "timeline", "caption": "图11-11 假设场景下 50W LED 路灯在典型工作日的功率曲线示例。传统策略定时全亮；DQN 策略根据实时传感器反馈动态调光。实际节电比例因部署路段车流和天气条件而异，但定性上可表明低流量时段的调光节能效果。", "takeaway": "读者应看到深夜低流量时段 DQN 策略可显著降低功率，但安全响应仍保留快速回弹能力。", "img": "assets/images/chapter-11/fig-11-11.png"}, {"fid": "fig-11-12", "ch": 11, "title": "图11-12 智慧交通系统集成部署工程检查流程", "type": "flowchart", "caption": "图11-12 智慧交通系统集成部署工程检查流程", "takeaway": "读者应理解四泳道检查须串行递进:先验设备制式与接口兼容,再验网关压测与QoS,继而PKI证书与签名,最后总线与灾备就绪方可上线。", "img": "assets/images/chapter-11/fig-11-12.png"}, {"fid": "fig-11-13", "ch": 11, "title": "图11-13 新区城市大脑系统部署架构图", "type": "architecture", "caption": "图11-13 新区城市大脑系统部署架构图（Project Horizon示意）。端-边-云三层结构，边缘节点承担推理与控制闭环，云层负责模型训练与跨部门协同。”", "takeaway": "读者应理解端-边-云职责切分:云端训练模型,12个边缘RSU内嵌推理引擎与控制Agent就地闭环,端层设备仅采集上报。", "img": "assets/images/chapter-11/fig-11-13.png"}, {"fid": "fig-12-01", "ch": 12, "title": "图12-1 环境传感网络部署拓扑示意", "type": "topology", "caption": "图12-1 环境传感网络部署拓扑示意，展示了从终端节点到云平台的星型连接关系。", "takeaway": "读者应理解终端节点与云端不直连——大量LoRa传感器先星型汇聚到单一网关,再由网关经4G/有线回传上云,网关承担隔离与汇聚中继角色。", "img": "assets/images/chapter-12/fig-12-01.png"}, {"fid": "fig-12-02", "ch": 12, "title": "图12-2 作物病害识别CNN处理流程（架构示意）", "type": "flowchart", "caption": "图12-2 展示作物病害识别CNN从输入到输出的主要网络层与数据变换过程。工程实践中，卷积核数量与网络深度依据训练数据集规模和计算资源调整。", "takeaway": "读者应理解CNN推理的主链路——从输入图像经多次卷积池化、展平到全连接分类，以及各层的数据尺寸变化。", "img": "assets/images/chapter-12/fig-12-02.png"}, {"fid": "fig-12-03", "ch": 12, "title": "图12-3 LoRa / NB-IoT / Sigfox 技术维度对比雷达图", "type": "matrix", "caption": "图12-3 六维度雷达图对比，各轴评分为定性相对值，非绝对性能指标。", "takeaway": "读者应理解三项技术功耗与速率反向取舍——NB-IoT速率最高(4)而功耗最差(2),Sigfox功耗最优(4)但速率最低(1),LoRa生态最开放(5)居中平衡。", "img": "assets/images/chapter-12/fig-12-03.png"}, {"fid": "fig-12-04", "ch": 12, "title": "图12-4 智慧果园综合监测系统架构（示意）", "type": "architecture", "caption": "图12-4 展示智慧果园混合组网的完整数据路径。土壤与气象数据通过LoRaWAN统一周期上报；图像数据在边缘完成病害推理后通过4G回传；灌溉指令由云端规则引擎通过LoRaWAN下行通道执行。", "takeaway": "读者应理解混合组网不是技术妥协，而是在低频小包和高频大包两类数据需求之间的理性切口。", "img": "assets/images/chapter-12/fig-12-04.png"}, {"fid": "fig-13-01", "ch": 13, "title": "图13-1 中心化物联网架构的信任困境", "type": "architecture", "caption": "图13-1 中心化物联网架构的信任困境。三个问题相互关联，共同指向单一信任锚点的结构性缺陷。", "takeaway": "读者应理解星型拓扑把信任全部压向唯一云平台，三个困境沿", "img": "assets/images/chapter-13/fig-13-01.png"}, {"fid": "fig-13-02", "ch": 13, "title": "图13-2 区块链与物联网融合的信任三角", "type": "pyramid", "caption": "图13-2 区块链与物联网融合的信任三角：分布式账本提供数据一致性，数字签名与共识机制确保身份真实性，智能合约自动化执行信任规则。三者协同重塑物联网信任体系。", "takeaway": "读者应理解信任三角三个维度各司其职：账本保数据一致、签名与共识保来源可信、合约保规则自动执行，缺一不可。", "img": "assets/images/chapter-13/fig-13-02.png"}, {"fid": "fig-13-03", "ch": 13, "title": "图13-3 设备DID注册与验证流程", "type": "sequence", "caption": "图13-3 展示设备从硬件密钥生成、DID注册到验证方自主验证的完整身份生命周期。链上操作以虚线区分。", "takeaway": "读者应理解验证方离线即可核验身份：仅凭签名用ecrecover反推签名地址并与链上owner比对，私钥终生不出安全飞地。", "img": "assets/images/chapter-13/fig-13-03.png"}, {"fid": "fig-13-04", "ch": 13, "title": "图13-4 数据上链流程图", "type": "flowchart", "caption": "图13-4 展示数据从传感器采样到链下存储和链上存证，最终验证方通过两侧数据比对确认完整性的典型流程。", "takeaway": "读者应理解存证是", "img": "assets/images/chapter-13/fig-13-04.png"}, {"fid": "fig-13-05", "ch": 13, "title": "图13-5 数据验证与溯源机制时序图", "type": "architecture", "caption": "数据验证与溯源时序图。数据从传感器经边缘节点上链，合约记录指纹并发出事件；验证者通过对比哈希确认完整性，同时利用事件追溯历史操作。", "takeaway": "读者应理解溯源依赖事件日志的链下索引：合约只存哈希与所有权映射，历史查询由监听器从DataStored事件重建而不重扫区块。", "img": "assets/images/chapter-13/fig-13-05.png"}, {"fid": "fig-13-06", "ch": 13, "title": "图13-6 供应链核心痛点与区块链价值点映射", "type": "matrix", "caption": "图13-6 供应链协同中‘信任’是核心障碍。区块链通过去中心化共享和不可篡改记录提供解耦方案。", "takeaway": "读者应理解每个痛点都有对应价值点且为线性映射，最粗箭头表明", "img": "assets/images/chapter-13/fig-13-06.png"}, {"fid": "fig-13-07", "ch": 13, "title": "图13-7 基于区块链的供应链溯源系统分层架构", "type": "layered", "caption": "图13-7 展示四层结构的职责边界和数据流向。边缘层将原始传感器数据哈希化后上链，原始数据保留在边缘存储或IPFS中。区块链网络层负责记录、共识与智能合约执行。", "takeaway": "读者应理解应用层无权直连感知层与边缘层，任何数据查询都须经区块链网络层中转，链上成为唯一可信数据出口。", "img": "assets/images/chapter-13/fig-13-07.png"}, {"fid": "fig-13-08", "ch": 13, "title": "图13-8 中心化 vs 去中心化物联网架构对比图", "type": "architecture", "caption": "图13-8 中心化与去中心化物联网架构的核心差异。中心化模型依赖单一可信中介，去中心化模型通过分布式账本和共识机制将信任分散到网络节点。", "takeaway": "读者应理解两者差异在故障影响域：中心化单点失效即全网瘫痪，去中心化任一共识节点失效不影响全局，代价是数据流由汇聚变P2P。", "img": "assets/images/chapter-13/fig-13-08.png"}, {"fid": "fig-13-09", "ch": 13, "title": "图13-9 AI+区块链+物联网三角范式关系图", "type": "architecture", "caption": "图13-9 展示AI、区块链、物联网三者如何形成数据可信→模型可靠→决策可审计的闭环。", "takeaway": "读者应理解三方构成闭环：IoT供数据、AI推理并上链存证、链上预言机回控设备，数据单向流入而信任反向锚定，闭环方可审计。", "img": "assets/images/chapter-13/fig-13-09.png"}, {"fid": "fig-14-01", "ch": 14, "title": "图14-1 物联网平台分层架构", "type": "architecture", "caption": "图14-1 物联网平台的四层分层架构，设备层通过边缘接入层的协议驱动与服务层解耦，各层之间以消息队列实现异步隔离。", "takeaway": "读者应理解物联网平台分层架构中的主链路、责任边界、以及协议驱动与消息队列带来的解耦效果。", "img": "assets/images/chapter-14/fig-14-01.png"}, {"fid": "fig-14-02", "ch": 14, "title": "图14-2 IoT DC3 系统分层架构", "type": "architecture", "caption": "图14-2 IoT DC3 四层架构：北向请求经 Gateway 进入四中心，Driver 经 gRPC 对接 Manager，命令与数据经 RabbitMQ 在 Data 与 Driver 之间异步流转。", "takeaway": "当前服务寻址依赖固定服务名、容器 DNS 和环境变量；RabbitMQ 是唯一消息总线。", "img": "assets/images/chapter-14/fig-14-02.png"}, {"fid": "fig-14-03", "ch": 14, "title": "图14-3 设备接入与数据流", "type": "dataflow", "caption": "图14-3 IoT DC3 设备数据链路：协议 Driver 将位号值经 RabbitMQ 交给 Data，Data 更新最新值缓存并写入 PostgreSQL；点位命令沿反向异步链路执行并回传结果。", "takeaway": "RabbitMQ 同时解耦上行位号值和下行命令，Data 负责持久化、最新值与告警处理。", "img": "assets/images/chapter-14/fig-14-03.png"}, {"fid": "fig-14-04", "ch": 14, "title": "图14-4 预测性维护扩展示例", "type": "flowchart", "caption": "图14-4 预测性维护扩展示例：模型在平台外训练和部署，授权任务把推理结果作为衍生位号写回 Data，复用已有规则与通知链路。", "takeaway": "AI 模型是外部扩展，平台通过标准 Data API、衍生位号和现有规则链路承接结果。", "img": "assets/images/chapter-14/fig-14-04.png"}, {"fid": "fig-14-05", "ch": 14, "title": "图14-5 IoT DC3 容器化部署架构", "type": "architecture", "caption": "图14-5 IoT DC3 当前容器化部署：PostgreSQL 与 RabbitMQ 提供基础设施，Gateway 和四中心组成平台，协议 Driver 按需启用并通过固定服务名与消息契约接入。", "takeaway": "服务通过 dc3net 固定服务名和环境变量寻址，Driver 经 RabbitMQ 与 Data 异步通信。", "img": "assets/images/chapter-14/fig-14-05.png"}, {"fid": "fig-14-06", "ch": 14, "title": "图14-6 AGI时代物联网架构演进", "type": "architecture", "caption": "图14-6 AGI时代物联网架构演进。右半部分突出了独立的Agent编排层、动态模型调度网关以及旁路所有自动决策的安全护栏层，这是从传统规则+固定模型向自治系统演变的关键结构变化。", "takeaway": "读者应理解AGI时代智能层由规则+固定模型升级为Agent编排与动态模型调度,自动决策须经独立安全护栏层校验后才可下发。", "img": "assets/images/chapter-14/fig-14-06.png"}];
const cards=[...document.querySelectorAll('.card')];
function applyFilter(){
  const q=document.getElementById('q').value.toLowerCase(),tf=document.getElementById('typeFilter').value,cf=document.getElementById('chFilter').value;
  cards.forEach(c=>{
    const t=c.querySelector('.t').textContent.toLowerCase(),fid=c.dataset.fid.toLowerCase(),type=c.dataset.type,ch=c.dataset.ch;
    c.classList.toggle('hidden',!!((q&&!t.includes(q)&&!fid.includes(q))||(tf&&type!==tf)||(cf&&ch!==cf)));
  });
  document.querySelectorAll('.chsec').forEach(s=>{
    const vis=[...s.querySelectorAll('.card')].some(c=>!c.classList.contains('hidden'));
    s.classList.toggle('hidden',!vis);
  });
}
function openLightbox(el){
  const d=data.find(x=>x.fid===el.dataset.fid);if(!d)return;
  document.getElementById('lb-img').src=d.img;
  document.getElementById('lb-title').textContent=d.title;
  document.getElementById('lb-caption').textContent=d.caption||'';
  document.getElementById('lb-meta').textContent='第'+d.ch+'章 · '+(d.type||'')+' · '+d.fid+(d.takeaway?' · '+d.takeaway:'');
  document.getElementById('lightbox').classList.add('open');
}
function closeLb(){document.getElementById('lightbox').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});
function copyName(ev,fid){
  if(ev){ev.stopPropagation();ev.preventDefault();}
  const d=data.find(x=>x.fid===fid);
  const txt=d?d.fid+' '+d.title:fid;
  // secure context(https / localhost)才用异步 Clipboard API;
  // file:// 下它必然 reject,而 reject 是异步回调、已脱离用户手势栈,
  // 会连累 execCommand 一起失效 —— 所以 file:// 下直接走同步 execCommand 保住手势。
  if(window.isSecureContext&&navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(
      ()=>showToast('✅ 已复制: '+txt),
      ()=>{ if(!legacyCopy(txt)) showCopyModal(txt); }
    );
    return;
  }
  if(!legacyCopy(txt)) showCopyModal(txt);
}
function legacyCopy(txt){
  const ta=document.createElement('textarea');
  ta.value=txt;ta.style.position='fixed';ta.style.left='-9999px';ta.style.top='0';
  ta.setAttribute('readonly','');
  document.body.appendChild(ta);
  ta.focus();ta.select();ta.setSelectionRange(0,txt.length);
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  if(ok)showToast('✅ 已复制: '+txt);
  return ok;
}
function showCopyModal(txt){
  // 3) 兜底:弹窗全选,手动 Ctrl+C / ⌘C
  const inp=document.getElementById('copyText');
  inp.value=txt;
  document.getElementById('copyHint').textContent='⚠ 自动复制被浏览器拦截,文本已全选,请按 Ctrl+C / ⌘C 复制。';
  document.getElementById('copyModal').classList.add('open');
  inp.focus();inp.select();inp.setSelectionRange(0,txt.length);
}
function closeCopyModal(){document.getElementById('copyModal').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCopyModal();});
function showToast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);}el.textContent=msg;el.className='show';clearTimeout(el._tm);el._tm=setTimeout(()=>el.className='',2000);}
</script></body></html>
