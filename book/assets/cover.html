<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AIoT 技术与实践</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  body {
    margin:0; width:210mm; height:297mm;
    contain:paint;
    font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
    /* 明亮·前途光明：晨曦浅蓝→青白→暖光渐变 */
    background:linear-gradient(150deg,#EEF4FF 0%,#E0F2FE 32%,#F0FBFF 60%,#FEF6EC 100%);
    color:#0F172A; display:flex; flex-direction:column; justify-content:space-between;
    padding:26mm 22mm; position:relative; overflow:hidden;
  }
  /* 顶部光晕（朝阳感） */
  .glow { position:absolute; border-radius:50%; filter:blur(60px); z-index:0; }
  .glow.a { width:420px; height:420px; top:-140px; right:-120px; background:radial-gradient(circle,rgba(59,130,246,.35),transparent 70%); }
  .glow.b { width:360px; height:360px; bottom:-120px; left:-100px; background:radial-gradient(circle,rgba(16,185,129,.28),transparent 70%); }
  .glow.c { width:300px; height:300px; top:44%; right:-80px; background:radial-gradient(circle,rgba(251,191,36,.22),transparent 70%); }
  /* 装饰网格（淡） */
  .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(37,99,235,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.06) 1px,transparent 1px); background-size:34px 34px; opacity:.7; z-index:0; }
  /* 星座式连接网络 */
  .constellation { position:absolute; z-index:1; pointer-events:none; }
  .constellation.primary { top:92px; right:14px; width:270px; height:330px; }
  .constellation.secondary { top:555px; right:0; width:360px; height:300px; opacity:.76; }
  .constellation svg { width:100%; height:100%; overflow:visible; }
  .constellation .link { fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .constellation .orbit { fill:none; stroke:#2563EB; stroke-width:1; stroke-dasharray:3 9; opacity:.13; }
  .constellation .halo { opacity:.18; }
  .constellation .star { stroke:#fff; stroke-width:1.5; }
  .top, .bottom { position:relative; z-index:2; }
  .tag { display:inline-block; padding:6px 18px; border:1.5px solid rgba(37,99,235,.4); border-radius:22px; font-size:12px; letter-spacing:3px; color:#2563EB; font-weight:600; background:rgba(255,255,255,.5); }
  .title { font-size:68px; font-weight:800; line-height:1.08; margin:34px 0 12px; color:#1D4ED8; background:linear-gradient(120deg,#1D4ED8,#0891B2 55%,#059669); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; -webkit-print-color-adjust:exact; print-color-adjust:exact; letter-spacing:3px; }
  /* print 模式下渐变裁剪可能失效，退化为纯蓝纯色文字（不出现色块） */
  @media print {
    .title { background:none; -webkit-text-fill-color:#1D4ED8; color:#1D4ED8; }
  }
  .subtitle { font-size:24px; font-weight:400; color:#334155; margin-top:8px; letter-spacing:2px; }
  .divider { width:80px; height:5px; background:linear-gradient(90deg,#2563EB,#10B981,#F59E0B); border-radius:3px; margin:42px 0 34px; }
  .highlights { font-size:15px; color:#475569; line-height:2.2; letter-spacing:.3px; font-weight:500; }
  .highlights .dot { margin-right:11px; font-size:11px; vertical-align:middle; color:#2563EB; }
  .highlights .dot.g { color:#10B981; }
  .highlights .dot.a { color:#F59E0B; }
  .bottom { display:flex; justify-content:space-between; align-items:flex-end; }
  /* 底部品牌区含 logo */
  .author-wrap { display:flex; align-items:center; gap:16px; }
  .logo-mark { width:52px; height:52px; flex-shrink:0; }
  .logo-mark svg, .logo-mark img { width:100%; height:100%; }
  .author { font-size:22px; font-weight:700; letter-spacing:1px; color:#0F172A; }
  .author small { display:block; font-size:13px; color:#64748B; font-weight:400; margin-top:6px; letter-spacing:.5px; }
  .brand { font-size:13px; color:#94A3B8; text-align:right; letter-spacing:2px; }
  .brand b { display:block; font-size:16px; color:#0891B2; margin-bottom:6px; font-weight:700; }
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="glow c"></div>
  <div class="grid"></div>

  <div class="constellation primary" aria-hidden="true">

      <defs>

          <stop offset="0" stop-color="#2563EB"/>

          <stop offset="1" stop-color="#10B981"/>

          <feGaussianBlur stdDeviation="5"/>

      </defs>
      <circle class="orbit" cx="139" cy="157" r="102"/>
      <path class="link" d="M28 74 L93 40 L154 76 L221 54 M154 76 L198 128 L132 158 L70 135 L28 74 M198 128 L178 232 L91 256 L36 205 L70 135 M132 158 L178 232" stroke="url(#primary-flow)" stroke-width="1.6" opacity=".34"/>

      <g fill="#0891B2"><circle class="halo" cx="154" cy="76" r="15" filter="url(#primary-glow)"/><circle class="star" cx="154" cy="76" r="5.5"/></g>

      <g fill="#2563EB"><circle class="halo" cx="132" cy="158" r="17" filter="url(#primary-glow)"/><circle class="star" cx="132" cy="158" r="6"/></g>
      <g fill="#10B981"><circle class="halo" cx="178" cy="232" r="13" filter="url(#primary-glow)"/><circle class="star" cx="178" cy="232" r="4.8"/></g>
      <g fill="#F59E0B"><circle class="halo" cx="91" cy="256" r="12" filter="url(#primary-glow)"/><circle class="star" cx="91" cy="256" r="4.3"/></g>
      <g fill="#2563EB"><circle class="halo" cx="36" cy="205" r="10" filter="url(#primary-glow)"/><circle class="star" cx="36" cy="205" r="3.6"/></g>
      <g fill="#0891B2"><circle class="halo" cx="70" cy="135" r="12" filter="url(#primary-glow)"/><circle class="star" cx="70" cy="135" r="4.4"/></g>
    </svg>
  </div>

  <div class="constellation secondary" aria-hidden="true">
    <svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="secondary-flow" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#10B981"/>
          <stop offset=".5" stop-color="#06B6D4"/>
          <stop offset="1" stop-color="#2563EB"/>
        </linearGradient>
        <filter id="secondary-glow" x="-300%" y="-300%" width="700%" height="700%">

      <path class="link" d="M267 86 L211 194 M316 150 L211 194 L152 251" stroke="#2563EB" stroke-width="1" stroke-dasharray="3 8" opacity=".14"/>

      <g fill="#10B981"><circle class="halo" cx="322" cy="24" r="12" filter="url(#secondary-glow)"/><circle class="star" cx="322" cy="24" r="4.5"/></g>
      <g fill="#06B6D4"><circle class="halo" cx="267" cy="86" r="10" filter="url(#secondary-glow)"/><circle class="star" cx="267" cy="86" r="3.8"/></g>
      <g fill="#F59E0B"><circle class="halo" cx="316" cy="150" r="11" filter="url(#secondary-glow)"/><circle class="star" cx="316" cy="150" r="4.2"/></g>
      <g fill="#0891B2"><circle class="halo" cx="211" cy="194" r="14" filter="url(#secondary-glow)"/><circle class="star" cx="211" cy="194" r="5.2"/></g>
      <g fill="#2563EB"><circle class="halo" cx="112" cy="161" r="11" filter="url(#secondary-glow)"/><circle class="star" cx="112" cy="161" r="4.2"/></g>
      <g fill="#10B981"><circle class="halo" cx="152" cy="251" r="9" filter="url(#secondary-glow)"/><circle class="star" cx="152" cy="251" r="3.4"/></g>
      <g fill="#2563EB"><circle class="halo" cx="32" cy="232" r="12" filter="url(#secondary-glow)"/><circle class="star" cx="32" cy="232" r="4.5"/></g>
    </svg>
  </div>

  <div class="top">
    <div class="tag">AI 原生</div>
    <div class="title">万物智联</div>
    <div class="subtitle">构建面向 AI 场景演进的分布式工业物联网平台</div>
    <div class="divider"></div>

</body>
