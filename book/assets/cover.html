<!DOCTYPE html>
<html lang="{{ language }}">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  @page { size: A4; margin: 0; }
  /* 封面主题变量：light 原色（PDF 渲染用），.dark 覆盖（web 暗色模式用）。
     变量命名 --cover-*，与正文插图 --fig-*、章扉页 --div-* 相互独立。 */
  :root {
    --cover-bg: linear-gradient(150deg, #EEF4FF 0%, #E0F2FE 32%, #F0FBFF 60%, #FEF6EC 100%);
    --cover-text: #0F172A;
    --cover-text-2: #334155;
    --cover-text-3: #475569;
    --cover-text-4: #64748B;
    --cover-text-5: #94A3B8;
    --cover-primary: #2563EB;
    --cover-primary-2: #3B82F6;
    --cover-primary-3: #1D4ED8;
    --cover-cyan: #0891B2;
    --cover-cyan-2: #06B6D4;
    --cover-green: #10B981;
    --cover-green-2: #059669;
    --cover-amber: #F59E0B;
    --cover-title-grad: linear-gradient(120deg, #1D4ED8, #0891B2 55%, #059669);
    --cover-divider-grad: linear-gradient(90deg, #2563EB, #10B981, #F59E0B);
    --cover-glow-a: rgba(59, 130, 246, .35);
    --cover-glow-b: rgba(16, 185, 129, .28);
    --cover-glow-c: rgba(251, 191, 36, .22);
    --cover-grid: rgba(37, 99, 235, .06);
    --cover-tag-border: rgba(37, 99, 235, .4);
    --cover-tag-bg: rgba(255, 255, 255, .5);
    --cover-orbit: #2563EB;
    --cover-star-stroke: #FFFFFF;
  }
  .dark {
    --cover-bg: linear-gradient(150deg, #0F172A 0%, #1E293B 32%, #0F172A 60%, #1E293B 100%);
    --cover-text: #F1F5F9;
    --cover-text-2: #CBD5E1;
    --cover-text-3: #94A3B8;
    --cover-text-4: #94A3B8;
    --cover-text-5: #64748B;
    --cover-primary: #60A5FA;
    --cover-primary-2: #60A5FA;
    --cover-primary-3: #60A5FA;
    --cover-cyan: #22D3EE;
    --cover-cyan-2: #22D3EE;
    --cover-green: #34D399;
    --cover-green-2: #34D399;
    --cover-amber: #FBBF24;
    --cover-title-grad: linear-gradient(120deg, #60A5FA, #22D3EE 55%, #34D399);
    --cover-divider-grad: linear-gradient(90deg, #60A5FA, #34D399, #FBBF24);
    --cover-glow-a: rgba(59, 130, 246, .18);
    --cover-glow-b: rgba(16, 185, 129, .14);
    --cover-glow-c: rgba(251, 191, 36, .10);
    --cover-grid: rgba(96, 165, 250, .06);
    --cover-tag-border: rgba(96, 165, 250, .4);
    --cover-tag-bg: rgba(30, 41, 59, .5);
    --cover-orbit: #3B82F6;
    --cover-star-stroke: #0F172A;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; width:210mm; height:297mm;
    contain:paint;
    font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
    /* 明亮·前途光明：晨曦浅蓝→青白→暖光渐变 */
    background:var(--cover-bg);
    color:var(--cover-text); display:flex; flex-direction:column; justify-content:space-between;
    padding:26mm 22mm; position:relative; overflow:hidden;
  }
  /* 顶部光晕（朝阳感） */
  .glow { position:absolute; border-radius:50%; filter:blur(60px); z-index:0; }
  .glow.a { width:420px; height:420px; top:-140px; right:-120px; background:radial-gradient(circle,var(--cover-glow-a),transparent 70%); }
  .glow.b { width:360px; height:360px; bottom:-120px; left:-100px; background:radial-gradient(circle,var(--cover-glow-b),transparent 70%); }
  .glow.c { width:300px; height:300px; top:44%; right:-80px; background:radial-gradient(circle,var(--cover-glow-c),transparent 70%); }
  /* 装饰网格（淡） */
  .grid { position:absolute; inset:0; background-image:linear-gradient(var(--cover-grid) 1px,transparent 1px),linear-gradient(90deg,var(--cover-grid) 1px,transparent 1px); background-size:34px 34px; opacity:.7; z-index:0; }
  /* 星座式连接网络 */
  .constellation { position:absolute; z-index:1; pointer-events:none; }
  .constellation.primary { top:92px; right:14px; width:270px; height:330px; }
  .constellation.secondary { top:555px; right:0; width:360px; height:300px; opacity:.76; }
  .constellation svg { width:100%; height:100%; overflow:visible; }
  .constellation .link { fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .constellation .orbit { fill:none; stroke:var(--cover-orbit); stroke-width:1; stroke-dasharray:3 9; opacity:.13; }
  .constellation .halo { opacity:.18; }
  .constellation .star { stroke:var(--cover-star-stroke); stroke-width:1.5; }
  .top, .bottom { position:relative; z-index:2; }
  .tag { display:inline-block; padding:6px 18px; border:1.5px solid var(--cover-tag-border); border-radius:22px; font-size:12px; letter-spacing:3px; color:var(--cover-primary); font-weight:600; background:var(--cover-tag-bg); }
  .title { font-size:68px; font-weight:800; line-height:1.08; margin:34px 0 12px; color:var(--cover-primary-3); background:var(--cover-title-grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; -webkit-print-color-adjust:exact; print-color-adjust:exact; letter-spacing:3px; }
  /* print 模式下渐变裁剪可能失效，退化为纯蓝纯色文字（不出现色块） */
  @media print {
    .title { background:none; -webkit-text-fill-color:var(--cover-primary-3); color:var(--cover-primary-3); }
  }
  .subtitle { font-size:24px; font-weight:400; color:var(--cover-text-2); margin-top:8px; letter-spacing:2px; }
  .divider { width:80px; height:5px; background:var(--cover-divider-grad); border-radius:3px; margin:42px 0 34px; }
  .highlights { font-size:15px; color:var(--cover-text-3); line-height:2.2; letter-spacing:.3px; font-weight:500; }
  .highlights .dot { margin-right:11px; font-size:11px; vertical-align:middle; color:var(--cover-primary); }
  .highlights .dot.g { color:var(--cover-green); }
  .highlights .dot.a { color:var(--cover-amber); }
  .bottom { display:flex; justify-content:space-between; align-items:flex-end; }
  /* 底部品牌区含 logo */
  .author-wrap { display:flex; align-items:center; gap:16px; }
  .logo-mark { width:52px; height:52px; flex-shrink:0; }
  .logo-mark svg, .logo-mark img { width:100%; height:100%; }
  .author { font-size:22px; font-weight:700; letter-spacing:1px; color:var(--cover-text); }
  .author small { display:block; font-size:13px; color:var(--cover-text-4); font-weight:400; margin-top:6px; letter-spacing:.5px; }
  .brand { font-size:13px; color:var(--cover-text-5); text-align:right; letter-spacing:2px; }
  .brand b { display:block; font-size:16px; color:var(--cover-cyan); margin-bottom:6px; font-weight:700; }
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="glow c"></div>
  <div class="grid"></div>

  <div class="constellation primary" aria-hidden="true">
    <svg viewBox="0 0 270 330" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="primary-flow" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--cover-primary)"/>
          <stop offset=".58" stop-color="var(--cover-cyan-2)"/>
          <stop offset="1" stop-color="var(--cover-green)"/>
        </linearGradient>
        <filter id="primary-glow" x="-300%" y="-300%" width="700%" height="700%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>
      </defs>
      <circle class="orbit" cx="139" cy="157" r="102"/>
      <path class="link" d="M28 74 L93 40 L154 76 L221 54 M154 76 L198 128 L132 158 L70 135 L28 74 M198 128 L178 232 L91 256 L36 205 L70 135 M132 158 L178 232" stroke="url(#primary-flow)" stroke-width="1.6" opacity=".34"/>
      <path class="link" d="M93 40 L132 158 M221 54 L198 128 M91 256 L70 135" stroke="var(--cover-primary)" stroke-width="1" stroke-dasharray="3 7" opacity=".18"/>

      <g fill="var(--cover-primary)"><circle class="halo" cx="28" cy="74" r="13" filter="url(#primary-glow)"/><circle class="star" cx="28" cy="74" r="4.8"/></g>
      <g fill="var(--cover-primary-2)"><circle class="halo" cx="93" cy="40" r="11" filter="url(#primary-glow)"/><circle class="star" cx="93" cy="40" r="3.8"/></g>
      <g fill="var(--cover-cyan)"><circle class="halo" cx="154" cy="76" r="15" filter="url(#primary-glow)"/><circle class="star" cx="154" cy="76" r="5.5"/></g>
      <g fill="var(--cover-green)"><circle class="halo" cx="221" cy="54" r="11" filter="url(#primary-glow)"/><circle class="star" cx="221" cy="54" r="3.8"/></g>
      <g fill="var(--cover-cyan-2)"><circle class="halo" cx="198" cy="128" r="16" filter="url(#primary-glow)"/><circle class="star" cx="198" cy="128" r="5.5"/></g>
      <g fill="var(--cover-primary)"><circle class="halo" cx="132" cy="158" r="17" filter="url(#primary-glow)"/><circle class="star" cx="132" cy="158" r="6"/></g>
      <g fill="var(--cover-green)"><circle class="halo" cx="178" cy="232" r="13" filter="url(#primary-glow)"/><circle class="star" cx="178" cy="232" r="4.8"/></g>
      <g fill="var(--cover-amber)"><circle class="halo" cx="91" cy="256" r="12" filter="url(#primary-glow)"/><circle class="star" cx="91" cy="256" r="4.3"/></g>
      <g fill="var(--cover-primary)"><circle class="halo" cx="36" cy="205" r="10" filter="url(#primary-glow)"/><circle class="star" cx="36" cy="205" r="3.6"/></g>
      <g fill="var(--cover-cyan)"><circle class="halo" cx="70" cy="135" r="12" filter="url(#primary-glow)"/><circle class="star" cx="70" cy="135" r="4.4"/></g>
    </svg>
  </div>

  <div class="constellation secondary" aria-hidden="true">
    <svg viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="secondary-flow" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--cover-green)"/>
          <stop offset=".5" stop-color="var(--cover-cyan-2)"/>
          <stop offset="1" stop-color="var(--cover-primary)"/>
        </linearGradient>
        <filter id="secondary-glow" x="-300%" y="-300%" width="700%" height="700%">
          <feGaussianBlur stdDeviation="4"/>
        </filter>
      </defs>
      <path class="link" d="M322 24 L267 86 L316 150 L211 194 L112 161 L32 232" stroke="url(#secondary-flow)" stroke-width="1.5" opacity=".28"/>
      <path class="link" d="M267 86 L211 194 M316 150 L211 194 L152 251" stroke="var(--cover-primary)" stroke-width="1" stroke-dasharray="3 8" opacity=".14"/>

      <g fill="var(--cover-green)"><circle class="halo" cx="322" cy="24" r="12" filter="url(#secondary-glow)"/><circle class="star" cx="322" cy="24" r="4.5"/></g>
      <g fill="var(--cover-cyan-2)"><circle class="halo" cx="267" cy="86" r="10" filter="url(#secondary-glow)"/><circle class="star" cx="267" cy="86" r="3.8"/></g>
      <g fill="var(--cover-amber)"><circle class="halo" cx="316" cy="150" r="11" filter="url(#secondary-glow)"/><circle class="star" cx="316" cy="150" r="4.2"/></g>
      <g fill="var(--cover-cyan)"><circle class="halo" cx="211" cy="194" r="14" filter="url(#secondary-glow)"/><circle class="star" cx="211" cy="194" r="5.2"/></g>
      <g fill="var(--cover-primary)"><circle class="halo" cx="112" cy="161" r="11" filter="url(#secondary-glow)"/><circle class="star" cx="112" cy="161" r="4.2"/></g>
      <g fill="var(--cover-green)"><circle class="halo" cx="152" cy="251" r="9" filter="url(#secondary-glow)"/><circle class="star" cx="152" cy="251" r="3.4"/></g>
      <g fill="var(--cover-primary)"><circle class="halo" cx="32" cy="232" r="12" filter="url(#secondary-glow)"/><circle class="star" cx="32" cy="232" r="4.5"/></g>
    </svg>
  </div>

  <div class="top">
    <div class="tag">AI 原生</div>
    <div class="title">{{ title }}</div>
    <div class="subtitle">{{ subtitle }}</div>
    <div class="divider"></div>
    <div class="highlights">
      <div><span class="dot">●</span>五层架构 · 智能层 · 物联网平台底座</div>
      <div><span class="dot g">●</span>大模型 · Agent · MCP · Tools · Skills · CLI · 智能运维</div>
      <div><span class="dot a">●</span>IoT DC3 开源项目贯穿全书</div>
      <div><span class="dot">●</span>14 章 · 155 张图表 · 工程方法论</div>
    </div>
  </div>

  <div class="bottom">
    <div class="author-wrap">
      <div class="logo-mark"><img src="logo.svg" alt="IoT DC3"></div>
      <div class="author">
        {{ author }}
        <small>架构师 &amp; 物联网专家</small>
      </div>
    </div>
    <div class="brand">
      <b>感知 · 理解 · 决策 · 执行</b>
      Sense · Understand · Decide · Act
    </div>
  </div>
</body>
</html>
