# 作者信息
profile:
  name: "张红元"
  title: "工业物联网架构师"
  bio: |
    工业物联网是我近十年深耕的领域。从多协议设备接入、平台架构到数据采集，我主导设计了开源物联网平台 IoT DC3，它已被智慧工厂、能源监控、农业物联网等行业用于真实生产。2024 年起，我把大语言模型引入这套平台，探索让 AI Agent 在明确的边界内参与运维与分析——不是让模型替代确定性控制，而是承担理解、归纳与受控执行。从“连得上”到“会思考”，这段实践催生了本书。
  project: "IoT DC3"
  project_url: "https://gitee.com/pnoker/iot-dc3"
  project_description: |
    IoT DC3 是一个开源的分布式工业物联网平台，基于 Spring Boot 与 Spring Cloud 构建，
    聚焦多协议设备接入、数据采集、权限隔离与 AI 运维。
    内置 Modbus、OPC UA、MQTT、CoAP、BLE 等协议驱动，并集成 Spring AI 实现 Agentic Center，
    让大模型在受控工具下参与设备查询、告警分析与可视化。
    项目自 2016 年启动，从最初的协议解析库逐步演进为覆盖设备接入、数据采集与 AI 运维的完整平台。
