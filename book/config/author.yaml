# 序言
preface:
  title: "序"
  content: |
    2016 年，我第一次尝试把一台 Modbus 协议的工业网关接入云端。那时的物联网还带着点科幻色彩，资料要么停在概念科普，要么散落在论坛里，缺一本能把工程实践讲透的系统性参考。一个工程师想入门，几乎只能自己蹚。

    2023 年，ChatGPT 让所有人重新审视软件该怎样与人协作。次年，我在 IoT DC3 中接入了大语言模型。当我第一次用一句自然语言，让 Agent 读到一台真实设备的温度，我意识到物联网正走进一个新的阶段——从人去操作界面，走向由 AI 帮我们理解、分析，甚至在授权范围内执行。

    但新的能力也意味着新的边界。让模型调用工具，不等于让它无条件操控设备；用 AI 编排能力，也不等于用它替代 MQTT、CoAP 这些设备协议。AI 能站稳脚跟的前提，是设备先被稳稳地连上来、数据被可靠地采集、传感器背后的物理含义被真正理解。

    正因为记得那种“只能自己蹚”的难，我才想写这样一本书。它不是一本追赶风口的“AI 物联网速成手册”，而是一条从基础走到前沿、从连接走到智能的完整路径：基础篇铺好物联网的全局认知，技术篇深入从软件开发到 AI 融合的核心栈，应用篇把这些能力放进真实的行业场景里检验。IoT DC3 会作为一条案例线索穿行其中，在抽象概念与工程现场之间架桥；但本书的主线始终是通用的架构、标准与方法，而不是某一个项目的使用说明。

    物联网真正迷人的地方，是它让数字世界第一次拥有了感知和操控物理世界的能力；而 AI 的加入，让这种能力从“被动响应”走向“主动智能”。如果这本书能成为你走进这个领域时的可靠同伴，那便是我最大的期待。

  theme: |
    本书的故事，围绕一条主线展开：**从连接到智能**。

    全书分为三篇，对应三个递进的问题。**基础篇**（第 1–5 章）回答“平台从哪里来”——从体系架构走到感知、通信与数据处理，搭起 AIoT 工程的底座。**技术篇**（第 6–9 章）回答“平台如何变智能”——从软件开发、智能体、安全到协议标准，掌握让平台长出 AI 能力的核心技术栈。**应用篇**（第 10–14 章）回答“智能如何落地”——把同一套底座投到工业、城市、农业等真实场景，并在第 14 章用 IoT DC3 项目实战收束全书。

    贯穿全书的，是三个朴素的信念：

    - **连接是一切的基础** —— 没有设备接入和数据采集，AI 只是空中楼阁。
    - **AI 重新定义了物联网** —— 从被动展示数据，走向主动理解与决策。
    - **架构决定生命力** —— 好的架构，能让一个原型稳步成长为生产级平台。
