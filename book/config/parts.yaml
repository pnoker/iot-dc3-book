# 全书篇章结构 - 三篇 14 章（description 用于篇章扉页概述）
# 全书主线：从工业软件到 AI 智能体，构建面向智能体演进的多协议、云原生、开源工业物联网平台

- name: "基础篇 · 从工业软件到物联网平台底座"
  prefix: "一"
  description: >
    以工业软件（SCADA/DCS/MES/PLC）的局限性为起点，阐述物联网平台如何补上数据归一、
    能力开放和闭环自动化三层能力。覆盖体系架构、感知、通信和平台数据处理。
  chapters:
    - id: 1
      title: "物联网概述：从工业软件到 AI 智能体"
      description: "从传统工业软件的能力边界出发，梳理物联网的定义、技术演进与 AIoT 重构，建立从设备连接到智能决策的全局认识。"
    - id: 2
      title: "物联网体系架构"
      description: "比较经典四层与 AI 时代五层架构，沿数据闭环理解各层职责，并用 IoT DC3 展示微服务之间的协作关系。"
    - id: 3
      title: "感知层技术基础"
      description: "从传感器、RFID 与定位技术讲到边缘节点、端侧 AI 和物模型，说明物理信号如何成为平台能够理解的数据。"
    - id: 4
      title: "网络层通信技术"
      description: "对比主流通信技术与适用场景，分析协议碎片化问题，并给出统一接入层、驱动框架和多协议网关的设计方法。"
    - id: 5
      title: "平台层与数据处理"
      description: "沿设备到云端的数据链路，讲解平台核心组件、云边协同、数据存储与智能处理，建立可靠数据底座的工程全貌。"

- name: "技术篇 · 云原生与 AI 智能体能力"
  prefix: "二"
  description: >
    在平台底座之上，注入软件工程（微服务、容器化、DevOps）、AI 智能体
    （Spring AI、Tool、MCP、RAG、Agent Runtime）、安全与标准化能力，
    完成从"连接平台"到"AI Native 平台"的能力跃迁。
  chapters:
    - id: 6
      title: "物联网软件开发技术"
      description: "从开发语言与通信方式进入微服务架构，讨论服务拆分、容器化和工程协作，并结合 IoT DC3 展示平台开发实践。"
    - id: 7
      title: "AIoT 与智能体应用"
      description: "从 Spring AI、RAG、Tool 与 MCP 进入工业 Agent Runtime，说明概率性决策如何经过状态、权限、Workflow、恢复与审计约束，逐级走向有界自治。"
    - id: 8
      title: "物联网安全技术"
      description: "覆盖设备身份、通信加密、数据与隐私保护，并进一步讨论提示注入、工具越权等 AI 时代的新型安全边界。"
    - id: 9
      title: "物联网协议与标准"
      description: "从 MQTT、CoAP、LwM2M、HTTP 和 BLE 走向 MCP 与语义互操作，理解不同协议所在层次、职责和选型条件。"

- name: "应用篇 · 多场景实践与可信协作"
  prefix: "三"
  description: >
    将同一套多协议、云原生、AI Native 技术底座投射到工业、城市、农业三个差异化场景，
    验证平台的跨场景适应性。以跨组织信任的进入条件为起点，比较 DID、可验证凭证、账本与隐私计算等候选机制，
    以 IoT DC3 项目实战收束全书。
  chapters:
    - id: 10
      title: "工业物联网与智能制造"
      description: "把平台能力带回工业现场，串联数字孪生、Modbus、OPC UA、时序数据、规则引擎与预测性维护的完整闭环。"
    - id: 11
      title: "智慧城市与车联网"
      description: "围绕交通、城市治理和车联网场景，分析海量设备接入、V2X 通信、容量治理以及 AI 预测优化的工程挑战。"
    - id: 12
      title: "农业物联网与环境监测"
      description: "从环境传感网络与精准农业出发，讨论低功耗广域网选型、边缘分析和 AI 应用如何服务长期、分散的农业现场。"
    - id: 13
      title: "可信数据协作、分布式身份与隐私计算"
      description: "从信任边界和进入条件出发，比较 DID、可验证凭证、账本与隐私计算，说明跨组织协作何时值得增加复杂度。"
    - id: 14
      title: "IoT DC3 项目实战：从平台到智能体应用"
      description: "通过端到端项目把设备接入、数据采集、平台部署和智能体应用连成一体，并总结实施过程中常见的陷阱与取舍。"
