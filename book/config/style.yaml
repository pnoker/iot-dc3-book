# 图表规格与视觉参考。全书写作规范见 book/WRITING_GUIDE.md。
# marker、allowed_types、required_fields 由构建器消费；theme、palette 供人工或外部制图工具参考。
illustrations:
  marker: "book-figure"
  theme: "technical-publication-light"
  palette:
    canvas: "#F8FAFC"
    panel: "#FFFFFF"
    primary: "#2563EB"
    secondary: "#0F766E"
    accent: "#F97316"
    neutral: "#475569"
    line: "#94A3B8"
    text: "#0F172A"
    success: "#16A34A"
    warning: "#D97706"
    danger: "#DC2626"
  canvas:
    logical_width: 1200
    export_width: 2400
    decorative_grid: false
    compact_height: [420, 520]
    standard_height: [560, 680]
    complex_height: [720, 900]
    min_content_width_ratio: 0.8
  typography:
    title: [22, 26]
    component: [14, 16]
    secondary: [11, 13]
    annotation_min: 11
    caption_min: 10
  caption:
    required_in_figure: true
    position: "bottom"
    prefix_with_figure_number: true
    text_anchor: "middle"
    font_size: 11
    color: "#475569"
  allowed_types:
    - "architecture"
    - "sequence"
    - "flowchart"
    - "dataflow"
    - "pyramid"
    - "layered"
    - "topology"
    - "lifecycle"
    - "matrix"
    - "timeline"
    - "framework"
  required_fields:
    - "id"
    - "type"
    - "title"
    - "purpose"
    - "layout"
    - "elements"
    - "relationships"
    - "caption"
    - "render_notes"
