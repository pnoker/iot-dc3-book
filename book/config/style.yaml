# 图表规格与视觉参考。全书写作规范见 book/WRITING_GUIDE.md。
# marker、allowed_types、required_fields 由构建器消费；theme、palette 供人工或外部制图工具参考。
illustrations:
  marker: "book-figure"
  theme: "technical-publication-light"
  palette:
    canvas: "#F8FAFC"
    panel: "#FFFFFF"
    primary: "#2563EB"
    secondary: "#0F766E"
    accent: "#F97316"
    neutral: "#475569"
    line: "#94A3B8"
    text: "#0F172A"
    success: "#16A34A"
    warning: "#D97706"
    danger: "#DC2626"
  allowed_types:
    - "architecture"
    - "sequence"
    - "flowchart"
    - "dataflow"
    - "pyramid"
    - "layered"
    - "topology"
    - "lifecycle"
    - "matrix"
    - "timeline"
    - "framework"
  required_fields:
    - "id"
    - "type"
    - "title"
    - "purpose"
    - "layout"
    - "elements"
    - "relationships"
    - "caption"
    - "render_notes"
