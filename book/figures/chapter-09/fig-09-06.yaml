callouts:
- MCP Server 不直接操作设备协议，而是通过 IoT 平台后端的安全链路。
- tools/list 返回的工具列表是经过鉴权和租户裁剪的。
- 物理设备侧协议不变（MQTT/CoAP），MCP 增加的是 AI 与平台之间的互操作层。
legend:
- 实线箭头 = 同步调用（请求/响应）。
- 虚线箭头在本文中未出现，保持图例统一。
visual_constraints:
- 参与者不超过6个，每条消息带简短标签。
- 突出显示 MCP Server 的鉴权和聚合，用橙色强调。
- 图例放在底部，不遮挡时序线。
render_notes: HTML/SVG 渲染，浅色背景，时间线自上而下，参与者列在左侧，消息线用直角折线段，箭头上标注标签。
caption:
  zh: 图9-6 MCP协议交互序列示意：AI Agent通过MCP Server与IoT平台及设备进行有状态、安全可控的工具调用。
  en: 'Figure 9-6 MCP interaction sequence: the AI Agent makes stateful, security-governed tool calls to the IoT platform and devices through the MCP Server.'
labels:
  en:
    图9-6 MCP协议交互序列图: Figure 9-6 MCP Interaction Sequence
    AI Agent 通过 MCP Server 发现并调用经身份、租户和风险策略裁剪的 IoT 平台能力，平台再通过原有协议链路访问设备并回传结果。: The AI Agent discovers and calls IoT platform capabilities scoped by identity, tenant, and risk policy through the MCP Server; the platform then reaches devices over the existing protocol path and returns results.
    MCP 是 AI 与 IoT 平台的互操作层，不绕过平台治理，也不替代 MQTT / CoAP 设备协议: 'MCP is the interop layer between AI and the IoT platform: it bypasses neither platform governance nor the MQTT / CoAP device protocols'
    身份 + 租户范围裁剪: Identity + tenant scoping
    鉴权 · 白名单 · 参数校验: Auth · whitelist · parameter checks
    风险分级 · 必要时人工确认: Risk tiers · human approval when needed
    session init · 能力协商: session init · capability negotiation
    session info · 版本与能力: session info · version & capabilities
    工具列表 · JSON Schema: Tool list · JSON Schema
    tools/call · 工具 + 参数: tools/call · tool + parameters
    平台服务调用 (REST): Platform service call (REST)
    按原链路下发 · MQTT / CoAP: Deliver via existing path · MQTT / CoAP
    操作指令: Action command
    响应 / 遥测: Response / telemetry
    结果回调: Result callback
    状态 + 数据 + 审计结果: Status + data + audit trail
    tools/call 响应: tools/call response
    会话与发现: Session & discovery
    受控工具调用: Governed tool call
    设备响应与审计回传: Device response & audit return
    AI 应用域: AI application domain
    IoT 平台安全域: IoT platform security domain
    设备通信域: Device communication domain
    Claude Desktop 等: Claude Desktop etc.
    会话 · 策略 · 工具路由: Session · policy · tool routing
    IoT 平台后端: IoT platform backend
    设备 / 数据服务: Device / data services
    协议适配层: Protocol adaptation layer
    MQTT / CoAP 网关: MQTT / CoAP gateway
    物理设备: Physical device
    传感器 / 执行器: Sensors / actuators
    实线：受控调用与响应: 'Solid: governed calls & responses'
    绿色：设备响应回传: 'Green: device response return'
    橙色框：安全决策点: 'Orange box: security decision point'
    虚线域边界：AI 与设备均不能绕过 IoT 平台安全域: 'Dashed domain boundary: neither AI nor devices bypass the platform security domain'
    图9-6 MCP 协议交互序列示意：AI Agent 通过 MCP Server 与 IoT 平台及设备进行有状态、安全可控的工具调用。: 'Figure 9-6 MCP interaction sequence: the AI Agent makes stateful, security-governed tool calls to the IoT platform and devices through the MCP Server.'
