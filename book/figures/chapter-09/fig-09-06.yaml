type: sequence
title: 图9-6 MCP协议交互序列图
purpose: 展示AI Agent通过MCP与IoT平台及设备的典型交互流程：资源发现、工具调用、状态反馈。
audience_takeaway: 读者应理解MCP作为AI与IoT平台之间的互操作层，不直接操作设备，而是通过平台封装的安全上下文调用后端服务。
visual_focus: 从AI Agent发起会话到MCP Server鉴权、工具发现、调用后端设备服务、写入MQTT/CoAP，最终返回结果给AI Agent的完整时间线。
design_level: logical
layout: 自上而下时间线，左侧参与者：AI Agent, MCP Server, IoT平台服务, 设备协议适配层, 物理设备。
elements:
- AI Agent（发起侧）
- MCP Server（会话管理、鉴权、工具路由）
- IoT平台后端（设备管理、数据服务、告警服务）
- 设备协议适配层（MQTT Broker / CoAP端节点）
- 物理设备（传感器/执行器）
relationships:
- 'AI Agent → MCP Server: session init (包括能力协商)'
- 'MCP Server → AI Agent: 返回session ID, 声明支持版本和能力'
- 'AI Agent → MCP Server: tools/list'
- 'MCP Server: 基于用户身份、租户范围聚合工具目录'
- 'MCP Server → AI Agent: 返回工具列表（每个含JSON Schema）'
- 'AI Agent → MCP Server: tools/call (选中的工具+参数)'
- 'MCP Server: 鉴权、白名单校验、风险分级'
- 'MCP Server → IoT平台后端: REST调用（设备服务/数据服务）'
- 'IoT平台后端 → 设备协议适配层: 按原链路下发（MQTT Publish / CoAP POST）'
- '设备协议适配层 → 物理设备: 执行操作'
- '物理设备 → 设备协议适配层: 响应/遥测上报'
- '设备协议适配层 → IoT平台后端: 回调结果'
- 'IoT平台后端 → MCP Server: 返回结果（含状态、数据）'
- 'MCP Server → AI Agent: tools/call 响应（包含操作结果）'
regions:
- id: ai_domain
  label: AI应用域
  role: 推理、会话管理、工具调用
- id: platform_domain
  label: IoT平台域
  role: 鉴权、设备管理、数据服务、安全策略
- id: device_domain
  label: 设备通信域
  role: 设备协议适配、物理设备操作
components:
