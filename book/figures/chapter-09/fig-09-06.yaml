  label: AI Agent
  type: application
  subtitle: Claude Desktop等
  group: ai_domain
  priority: primary
  shape: actor
- id: mcp_server
  label: MCP Server
  type: ai
  subtitle: 会话管理、鉴权路由
  group: platform_domain
  priority: primary
  shape: card
- id: iot_backend
  label: IoT平台后端
  type: platform
  subtitle: 设备/数据服务
  group: platform_domain
  priority: primary
  shape: card
- id: protocol_adapt
  label: 协议适配层
  type: edge
  subtitle: MQTT/CoAP网关
  group: device_domain
  priority: normal
  shape: card
- id: physical_device
  label: 物理设备
  type: edge
  subtitle: 传感器/执行器
  group: device_domain
  priority: normal
  shape: card
