<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图9-2 MQTT会话连接与心跳交互示意</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图9-2 MQTT会话连接与心跳交互示意</title>
  <desc id="desc">理解会话持久化、心跳超时判定以及重连策略如何配合恢复会话。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">

  
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图9-2 MQTT会话连接与心跳交互示意</text>
  <text x="82" y="70" fill="#64748B" font-size="12">理解会话持久化、心跳超时判定以及重连策略如何配合恢复会话。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">SEQUENCE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="sequence">
  <!-- life lines -->
  <line x1="250" y1="190" x2="250" y2="730" stroke="#94A3B8" stroke-dasharray="6,4" stroke-width="1.5"/>
  <line x1="900" y1="190" x2="900" y2="730" stroke="#94A3B8" stroke-dasharray="6,4" stroke-width="1.5"/>
  <line x1="1500" y1="190" x2="1500" y2="730" stroke="#94A3B8" stroke-dasharray="6,4" stroke-width="1.5"/>
  <!-- participants -->
  <rect x="200" y="130" width="100" height="60" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="250" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Client</text>
  <text x="250" y="168" text-anchor="middle" font-size="10" fill="#64748B">(sensor01)</text>
  <rect x="850" y="130" width="100" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Broker</text>
  <text x="900" y="168" text-anchor="middle" font-size="10" fill="#64748B">MQTT Server</text>
  <rect x="1450" y="130" width="100" height="60" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1500" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Subscriber</text>
  <text x="1500" y="168" text-anchor="middle" font-size="10" fill="#64748B">遗嘱订阅者</text>
  <!-- messages -->
  <!-- 1: CONNECT -->
  <line x1="250" y1="210" x2="900" y2="210" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <text x="575" y="205" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="500">CONNECT (CS=0, KA=60)</text>
  <!-- 2: CONNACK -->
  <line x1="900" y1="245" x2="250" y2="245" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <text x="575" y="240" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="500">CONNACK (SP=false)</text>
  <!-- 3: SUBSCRIBE -->
  <line x1="250" y1="280" x2="900" y2="280" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <text x="575" y="275" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="500">SUBSCRIBE (temp/room1, QoS1)</text>
  <!-- 4: SUBACK -->
  <line x1="900" y1="315" x2="250" y2="315" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <text x="575" y="310" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="500">SUBACK</text>
  <!-- 5: PUBLISH -->
  <line x1="250" y1="350" x2="900" y2="350" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <text x="575" y="345" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="500">PUBLISH (25.3°C, QoS1)</text>
  <!-- 6: PUBACK -->
  <line x1="900" y1="385" x2="250" y2="385" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <text x="575" y="380" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="500">PUBACK</text>
  <!-- 7: PINGREQ (self) -->
  <path d="M 250,420 L 280,420 L 280,435 L 250,435" fill="none" stroke="#64748B" stroke-dasharray="4,3" stroke-width="1.5" marker-end="url(#bp-arrow)"/>
  <text x="265" y="415" text-anchor="start" font-size="10" fill="#64748B">PINGREQ (60s)</text>
  <!-- 8: PINGRESP -->
  <line x1="900" y1="455" x2="250" y2="455" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <text x="575" y="450" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="500">PINGRESP</text>
  <!-- 9: 网络中断注释 -->
  <rect x="470" y="480" width="210" height="24" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="575" y="497" text-anchor="middle" font-size="11" fill="#64748B">网络中断，双方启动超时定时器</text>
  <!-- 10: Broker超时判定 (self) -->
  <path d="M 900,525 L 930,525 L 930,540 L 900,540" fill="none" stroke="#64748B" stroke-dasharray="4,3" stroke-width="1.5" marker-end="url(#bp-arrow)"/>
  <text x="915" y="520" text-anchor="start" font-size="10" fill="#64748B">超时判定 (90s)</text>
  <!-- 11: Will Message (Broker->Subscriber) -->
  <line x1="900" y1="560" x2="1500" y2="560" stroke="#64748B" stroke-dasharray="6,4" stroke-width="1.5" marker-end="url(#bp-arrow)"/>
  <text x="1200" y="555" text-anchor="middle" font-size="11" fill="#64748B">PUBLISH (Will Message)</text>
  <!-- 12: Client重连策略 (self) -->
  <path d="M 250,595 L 280,595 L 280,610 L 250,610" fill="none" stroke="#64748B" stroke-dasharray="4,3" stroke-width="1.5" marker-end="url(#bp-arrow)"/>
  <text x="265" y="590" text-anchor="start" font-size="10" fill="#64748B">指数退避 (1s,2s,4s)</text>
  <!-- 13: CONNECT (Reconnect) -->
  <line x1="250" y1="630" x2="900" y2="630" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="575" y="625" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="600">CONNECT (Reconnect, CS=0)</text>
  <!-- 14: CONNACK (SessionPresent=true) -->
  <line x1="900" y1="665" x2="250" y2="665" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <text x="575" y="660" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="500">CONNACK (SP=true)</text>
  <!-- 15: 离线缓存消息 -->
  <line x1="900" y1="700" x2="250" y2="700" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="575" y="695" text-anchor="middle" font-size="11" fill="#0F172A" font-weight="600">离线缓存消息 (QoS1/2)</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">青绿色：客户端；蓝色：Broker；灰色：第三方订阅者</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头：同步请求/响应；虚线箭头：异步广播或内部自消息</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图9-4 MQTT会话连接与心跳交互示意。展示Client（sensor01）与Broker之间从连接建立、心跳维持、网络断线、遗嘱执行到指数退避重连并恢复会话的完整过程。Keep Alive设为60秒，Broker以1.5倍超时判定离线（约90秒）。重连后Broker推送断线</text>
  <text x="900" y="870" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">期间缓存的QoS 1/2消息。</text>
  </svg>
</svg>
    <section class="meta" style="display:none">
      <div class="card"><div class="label">图表类型</div><div class="value">sequence</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">自上而下时间轴，左侧Client生命线，右侧Broker生命线，底部示意重连恢复。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
