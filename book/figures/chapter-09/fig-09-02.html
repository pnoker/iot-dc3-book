<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图9-2 MQTT会话连接与心跳交互示意</title><style>html,body{margin:0;background:#F8FAFC}svg{display:block;width:1200px;height:860px;margin:auto;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:25px;font-weight:700;fill:#0F172A}.sub,.note{font-size:12px;fill:#475569}.head{font-size:15px;font-weight:700;fill:#0F172A}.msg{font-size:12px;fill:#0F172A}.phase{font-size:12px;font-weight:700;fill:#475569}.cap{font-size:11px;fill:#475569}</style></head><body><svg data-figure-root="fig-09-02" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">图9-2 MQTT会话连接与心跳交互示意</title><desc id="desc">持久会话建立、心跳保活、超时触发遗嘱、指数退避重连与缓存消息恢复。</desc><defs><marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563EB"/></marker><marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#16A34A"/></marker><marker id="n" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#475569"/></marker></defs><rect width="1200" height="860" fill="#F8FAFC"/><text x="70" y="52" class="title">图9-2 MQTT会话连接与心跳交互示意</text><text x="70" y="78" class="sub">心跳超时清理连接但不必销毁会话；相同 Client ID 重连后可恢复订阅与离线缓存消息</text>
<rect x="90" y="110" width="260" height="55" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><rect x="470" y="110" width="260" height="55" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><rect x="850" y="110" width="260" height="55" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="220" y="142" class="head" text-anchor="middle">Client · sensor01</text><text x="600" y="142" class="head" text-anchor="middle">MQTT Broker</text><text x="980" y="142" class="head" text-anchor="middle">Subscriber</text><g stroke="#94A3B8" stroke-dasharray="6 5"><line x1="220" y1="165" x2="220" y2="720"/><line x1="600" y1="165" x2="600" y2="720"/><line x1="980" y1="165" x2="980" y2="720"/></g>
<text x="72" y="198" class="phase">建立持久会话</text><g stroke="#2563EB" stroke-width="2" marker-end="url(#b)"><line x1="220" y1="215" x2="600" y2="215"/><line x1="600" y1="255" x2="220" y2="255"/><line x1="220" y1="295" x2="600" y2="295"/><line x1="600" y1="335" x2="220" y2="335"/><line x1="220" y1="375" x2="600" y2="375"/><line x1="600" y1="415" x2="220" y2="415"/></g><text x="410" y="208" class="msg" text-anchor="middle">CONNECT · CleanSess=false · Keep Alive=60 s</text><text x="410" y="248" class="msg" text-anchor="middle">CONNACK · SessionPresent=false</text><text x="410" y="288" class="msg" text-anchor="middle">SUBSCRIBE · temp/room1</text><text x="410" y="328" class="msg" text-anchor="middle">SUBACK</text><text x="410" y="368" class="msg" text-anchor="middle">PUBLISH · 25.3 °C · QoS 1</text><text x="410" y="408" class="msg" text-anchor="middle">PUBACK</text>
<text x="72" y="448" class="phase">心跳与断线检测</text><line x1="220" y1="465" x2="600" y2="465" stroke="#2563EB" stroke-width="2" marker-end="url(#b)"/><line x1="600" y1="505" x2="220" y2="505" stroke="#2563EB" stroke-width="2" marker-end="url(#b)"/><text x="410" y="458" class="msg" text-anchor="middle">PINGREQ · 最长 60 s 无其他控制报文时发送</text><text x="410" y="498" class="msg" text-anchor="middle">PINGRESP</text><path d="M600 545h55v32h-55" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#n)"/><text x="670" y="566" class="msg">1.5 × KA 未收到控制报文：断开连接</text><line x1="600" y1="600" x2="980" y2="600" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#n)"/><text x="790" y="592" class="msg" text-anchor="middle">PUBLISH · Will Message</text>
<text x="72" y="638" class="phase">指数退避重连与恢复</text><path d="M220 650h45v28h-45" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#n)"/><text x="280" y="670" class="msg">指数退避 + 随机抖动</text><line x1="220" y1="700" x2="600" y2="700" stroke="#2563EB" stroke-width="2" marker-end="url(#b)"/><text x="410" y="693" class="msg" text-anchor="middle">CONNECT · 相同 Client ID</text><line x1="600" y1="735" x2="220" y2="735" stroke="#2563EB" stroke-width="2" marker-end="url(#b)"/><text x="410" y="728" class="msg" text-anchor="middle">CONNACK · SessionPresent=true</text><line x1="600" y1="770" x2="220" y2="770" stroke="#16A34A" stroke-width="3" marker-end="url(#g)"/><text x="410" y="763" class="msg" text-anchor="middle">推送断线期间缓存消息 · QoS 1/2</text>
<rect x="70" y="793" width="1060" height="38" rx="5" fill="#FFFFFF" stroke="#94A3B8"/><text x="90" y="817" class="note">实线：网络消息　　虚线：超时或本地策略　　</text><text x="465" y="817" class="note" fill="#16A34A">绿色：会话恢复后的缓存消息</text><text x="815" y="817" class="note">超时不等于会话删除</text><text x="600" y="850" class="cap" text-anchor="middle">Broker 在 90 秒超时后执行遗嘱；只要持久会话未过期，重连即可恢复订阅并接收缓存消息。</text></svg></body></html>
