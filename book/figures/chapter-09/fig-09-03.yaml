type: sequence
title: 图 9-3 MQTT会话连接与心跳交互示意
purpose: 展示客户端与Broker之间会话建立、心跳保活、断线检测、遗嘱执行、重连与会话恢复的完整流程。
audience_takeaway: 理解会话持久化、心跳超时判定以及重连策略如何配合恢复已缓存的消息。
visual_focus: 从Client重连到Broker推送离线缓存消息的主链路。
design_level: implementation
layout: 自上而下时间轴，左侧Client生命线，右侧Broker生命线，底部示意重连恢复。
elements:
- MQTT Client sensor01
- MQTT Broker
- 遗嘱消息订阅者
relationships:
- Client → Broker：以持久会话参数连接、订阅、发布并发送心跳
- Broker → Client：确认连接、订阅、发布和心跳请求
- Broker → Subscriber：心跳超时后代发遗嘱消息
- Client → Broker → Client：以相同 Client ID 重连并恢复会话与缓存消息
regions:
- id: client_domain
  label: 客户端域
  role: 发起连接与上报数据
- id: broker_domain
  label: Broker域
  role: 路由消息、管理会话与心跳
components:
- id: client
  label: Client (sensor01)
  type: edge
  subtitle: MQTT客户端设备
  group: client_domain
  priority: primary
  shape: actor
- id: broker
  label: Broker
  type: platform
  subtitle: MQTT代理服务器
  group: broker_domain
  priority: primary
  shape: card
- id: subscriber
  label: Subscriber
  type: external
  subtitle: 遗嘱消息接收者
  group: ''
  priority: normal
  shape: actor
connections:
- from: client
  to: broker
  label: CONNECT (CleanSess=false, KA=60s)
  style: solid
  direction: request
- from: broker
  to: client
  label: CONNACK (SessionPresent=false)
  style: solid
  direction: response
- from: client
  to: broker
  label: SUBSCRIBE (temp/room1)
  style: solid
  direction: request
- from: broker
  to: client
  label: SUBACK
  style: solid
  direction: response
- from: client
  to: broker
  label: PUBLISH (25.3°C, QoS1)
  style: solid
  direction: request
- from: broker
  to: client
  label: PUBACK
  style: solid
  direction: response
- from: client
  to: broker
  label: PINGREQ (每60s)
  style: solid
  direction: request
- from: broker
  to: client
  label: PINGRESP
  style: solid
  direction: response
- from: broker
  to: broker
  label: 1.5倍KA超时 (90s)
  style: dashed
  direction: event
- from: broker
  to: subscriber
  label: PUBLISH (Will Message)
  style: dashed
  direction: event
- from: client
  to: broker
  label: CONNECT (重连, 相同ClientID)
  style: solid
  direction: request
- from: broker
  to: client
  label: CONNACK (SessionPresent=true)
