<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图 9-3 LwM2M 协议栈与逻辑实体交互架构</title>
  <desc id="desc">读者应理解该架构中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">图 9-3 LwM2M 协议栈与逻辑实体交互架构</title>
  <desc id="desc">读者应理解该架构中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图 9-3 LwM2M 协议栈与逻辑实体交互架构</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解该架构中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
    <!-- 公网/无线接入边界虚线 -->
    <line x1="580" y1="130" x2="580" y2="620" stroke="#64748B" stroke-width="2" stroke-dasharray="8,4" />
    <text x="590" y="135" fill="#64748B" font-size="11" font-weight="600">公网/无线接入</text>

    <!-- LwM2M Client 设备端 -->
    <g id="c3">
        <rect x="150" y="200" width="350" height="360" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
        <text x="325" y="230" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">LwM2M Client</text>
        <text x="325" y="248" fill="#64748B" font-size="12" text-anchor="middle">设备端</text>
        
        <!-- Object 层 -->
        <rect x="160" y="260" width="330" height="50" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
        <text x="325" y="290" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">Object: /3303 Temperature Sensor</text>
        
        <!-- Instance 0 -->
        <rect x="170" y="330" width="140" height="100" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
        <text x="240" y="355" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">Instance 0</text>
        <circle cx="200" cy="390" r="8" fill="#0F766E" />
        <text x="215" y="394" fill="#0F172A" font-size="11">5700</text>
        <circle cx="250" cy="390" r="8" fill="#0F766E" />
        <text x="265" y="394" fill="#0F172A" font-size="11">5701</text>
        
        <!-- Instance 1 -->
        <rect x="330" y="330" width="140" height="100" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
        <text x="400" y="355" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">Instance 1</text>
        <circle cx="360" cy="390" r="8" fill="#0F766E" />
        <text x="375" y="394" fill="#0F172A" font-size="11">5700</text>
        <circle cx="410" cy="390" r="8" fill="#0F766E" />
        <text x="425" y="394" fill="#0F172A" font-size="11">5701</text>
    </g>

    <!-- Bootstrap Server 引导服务器 -->
    <g id="c1">
        <rect x="700" y="150" width="320" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
        <text x="860" y="185" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">Bootstrap Server</text>
        <text x="860" y="205" fill="#64748B" font-size="12" text-anchor="middle">引导服务器</text>
    </g>

    <!-- LwM2M Server 管理服务器 -->
    <g id="c2">
        <rect x="700" y="360" width="320" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
        <text x="860" y="395" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">LwM2M Server</text>
        <text x="860" y="415" fill="#64748B" font-size="12" text-anchor="middle">管理服务器</text>
    </g>

    <!-- 协议栈底座 -->
    <g id="c4">
        <!-- 无线接入 -->
        <rect x="120" y="620" width="1560" height="40" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
        <text x="900" y="645" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">NB-IoT / 5G / LoRaWAN</text>
        <!-- UDP/DTLS -->
        <rect x="120" y="660" width="1560" height="40" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
        <text x="900" y="685" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">UDP / DTLS</text>
        <!-- CoAP -->
        <rect x="120" y="700" width="1560" height="40" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
        <text x="900" y="725" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">CoAP (CON / NON / ACK / RST)</text>
    </g>

    <!-- 连线：引导配置 (Bootstrap->Client) -->
    <line x1="700" y1="200" x2="500" y2="260" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)" />
    <g>
        <rect x="570" y="210" width="80" height="20" rx="4" fill="white" stroke="none" />
        <text x="610" y="224" fill="#0F172A" font-size="11" font-weight="600" text-anchor="middle">引导配置</text>
    </g>

    <!-- 连线：注册/更新 (Client->LwM2M Server) -->
    <line x1="500" y1="400" x2="700" y2="400" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)" />
    <g>
        <rect x="570" y="385" width="80" height="20" rx="4" fill="white" stroke="none" />
        <text x="610" y="399" fill="#0F172A" font-size="11" font-weight="600" text-anchor="middle">注册/更新</text>
    </g>

    <!-- 连线：观察/读写/升级 (LwM2M Server->Client) 虚线 -->
    <line x1="700" y1="440" x2="500" y2="440" stroke="#0F766E" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#bp-arrow)" />
    <g>
        <rect x="560" y="425" width="110" height="20" rx="4" fill="white" stroke="none" />
        <text x="615" y="439" fill="#0F172A" font-size="11" font-weight="600" text-anchor="middle">观察/读写/升级</text>
    </g>

    <!-- 连线：通知/响应 (Client->LwM2M Server) -->
    <line x1="500" y1="480" x2="700" y2="480" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)" />
    <g>
        <rect x="570" y="465" width="80" height="20" rx="4" fill="white" stroke="none" />
        <text x="610" y="479" fill="#0F172A" font-size="11" font-weight="600" text-anchor="middle">通知/响应</text>
    </g>

    <!-- Callout 卡片 1 -->
    <g>
        <rect x="1100" y="170" width="520" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
        <text x="1130" y="195" fill="#0F172A" font-size="11">对象树的标准化使得不同厂商的设备</text>
        <text x="1130" y="215" fill="#0F172A" font-size="11">共享同一套读写接口。</text>
    </g>

    <!-- Callout 卡片 2 -->
    <g>
        <rect x="1100" y="270" width="520" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
        <text x="1130" y="295" fill="#0F172A" font-size="11">引导服务器仅在首次或重置时介入，</text>
        <text x="1130" y="315" fill="#0F172A" font-size="11">正常运行时设备直接与 LwM2M Server 交互。</text>
    </g>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色 = 平台侧实体</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线 = 同步请求/响应；虚线 = 观察/异步推送</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图 9-3 展示 LwM2M 协议栈层次以及三大实体之间的引导、注册、观察/通知、读写/配置、固件升级五种交互流程。</text>
  </svg>
</svg>