<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图 9-1 物联网协议栈与分类图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图 9-1 物联网协议栈与分类图</title>
  <desc id="desc">Wi-Fi 与蜂窝网络可直接承载 IP；BLE、Zigbee 与 LoRa 通常需经 IP 适配或网关后再进入 TCP、UDP 及应用协议。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <defs>
      <marker id="ar-blue" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L11 4.5L0 9Z" fill="#2563EB"/></marker>
      <marker id="ar-green" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#0F766E"/></marker>
      <marker id="ar-orange" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#F97316"/></marker>
    </defs>

    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 9-1 物联网协议栈与分类图</text>
    <text x="88" y="64" font-size="12" fill="#64748B">接入技术先按是否直接承载 IP 分流，再汇入统一的传输层与应用层</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 左侧竖排标签 -->
    <text x="62" y="520" font-size="24" font-weight="700" fill="#64748B" text-anchor="middle" transform="rotate(-90 62 520)">物联网协议栈</text>

    <!-- 连线（先画） -->
    <path d="M505 715V685" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#ar-green)"/>
    <path d="M1355 715V685" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#ar-green)"/>
    <path d="M505 605V470" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ar-blue)"/>
    <path d="M1355 605V570" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar-green)"/>
    <path d="M1355 505V470" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ar-blue)"/>
    <path d="M940 400V365" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ar-blue)"/>
    <path d="M485 295V260" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ar-blue)"/>
    <path d="M1355 295V260" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ar-blue)"/>
    <path d="M1370 195V170" fill="none" stroke="#F97316" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ar-orange)"/>

    <!-- 连线标签 -->
    <text x="515" y="702" font-size="15" fill="#475569">传感器数据</text>
    <text x="1365" y="702" font-size="15" fill="#475569">传感器数据</text>
    <text x="515" y="540" font-size="15" fill="#2563EB" font-weight="700">直接承载 IP</text>
    <text x="1365" y="592" font-size="15" fill="#0F766E">协议适配</text>
    <text x="1365" y="490" font-size="15" fill="#2563EB" font-weight="700">接入 IP 网络</text>
    <text x="950" y="385" font-size="15" fill="#475569">TCP / UDP 封装</text>
    <text x="495" y="280" font-size="15" fill="#2563EB">发布 / 订阅</text>
    <text x="1365" y="280" font-size="15" fill="#F97316">请求 / 响应</text>

    <!-- 应用层 -->
    <rect x="140" y="130" width="1600" height="130" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="168" y="158" font-size="20" font-weight="700" fill="#0F172A">应用层</text>
    <text x="168" y="180" font-size="14" fill="#64748B">设备消息格式与互操作边界</text>
    <rect x="180" y="195" width="610" height="55" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="200" y="219" font-size="20" font-weight="700" fill="#0F172A">发布 / 订阅</text>
    <text x="200" y="241" font-size="15" fill="#475569">MQTT · TCP 长连接</text>
    <rect x="990" y="195" width="730" height="55" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="1010" y="219" font-size="20" font-weight="700" fill="#0F172A">请求 / 响应</text>
    <text x="1010" y="241" font-size="15" fill="#475569">CoAP · UDP ｜ HTTP · TCP</text>
    <rect x="1220" y="138" width="300" height="34" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="1370" y="160" font-size="15" font-weight="700" fill="#F97316" text-anchor="middle">LwM2M · 架于 CoAP 之上</text>

    <!-- 传输层 -->
    <rect x="140" y="295" width="1600" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
    <text x="168" y="330" font-size="20" font-weight="700" fill="#0F172A">传输层</text>
    <text x="168" y="352" font-size="15" fill="#475569">TCP / UDP</text>
    <text x="560" y="338" font-size="16" font-weight="700" fill="#2563EB">TCP · 面向连接</text>
    <text x="1150" y="338" font-size="16" font-weight="700" fill="#2563EB">UDP · 无连接</text>

    <!-- 网络层 -->
    <rect x="140" y="400" width="1600" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
    <text x="168" y="435" font-size="20" font-weight="700" fill="#0F172A">网络层</text>
    <text x="168" y="457" font-size="15" fill="#475569">IP 分组 · 两类接入在此汇合</text>

    <!-- 边缘网关 -->
    <rect x="990" y="505" width="730" height="65" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="1355" y="533" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">IP 适配 / 边缘网关</text>
    <text x="1355" y="556" font-size="15" fill="#475569" text-anchor="middle">协议转换 · 组网与 IP 接入</text>

    <!-- 无线接入层 -->
    <rect x="140" y="605" width="730" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="168" y="636" font-size="20" font-weight="700" fill="#0F172A">常用 IP 承载</text>
    <text x="168" y="660" font-size="15" fill="#475569">Wi-Fi · 蜂窝（NB-IoT / 4G / 5G）</text>
    <rect x="990" y="605" width="730" height="80" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="1018" y="636" font-size="20" font-weight="700" fill="#0F172A">需 IP 适配 / 网关</text>
    <text x="1018" y="660" font-size="15" fill="#475569">BLE · Zigbee · LoRa</text>

    <!-- 感知层 -->
    <rect x="140" y="715" width="1600" height="85" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.4"/>
    <text x="168" y="750" font-size="20" font-weight="700" fill="#0F172A">感知层</text>
    <text x="168" y="774" font-size="15" fill="#475569">传感器 · 执行器 · 产生数据与接收控制指令</text>

    <!-- 图例 -->
    <rect x="150" y="838" width="16" height="16" rx="3" fill="#2563EB"/>
    <text x="174" y="852" font-size="15" fill="#475569">网络层 / 传输层 · 直接 IP 主链</text>
    <rect x="540" y="838" width="16" height="16" rx="3" fill="#0F766E"/>
    <text x="564" y="852" font-size="15" fill="#475569">感知层 / 无线接入 · 网关适配路径</text>
    <rect x="990" y="838" width="16" height="16" rx="3" fill="#F97316"/>
    <text x="1014" y="852" font-size="15" fill="#475569">请求 / 响应模型</text>
    <line x1="1360" y1="846" x2="1400" y2="846" stroke="#0F766E" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="1410" y="852" font-size="15" fill="#475569">适配 / 依赖边界</text>

    <!-- 图注 -->
    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图 9-1 Wi-Fi 与蜂窝常直接承载 IP；BLE、Zigbee、LoRa 通常经适配或网关接入 IP 网络。</text>
  </svg>
</svg>
  </main>
</body>
</html>
