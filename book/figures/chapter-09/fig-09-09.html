<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图 9-9 MCP协议交互序列图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图 9-9 MCP协议交互序列图</title>
  <desc id="desc">AI Agent 通过 MCP Server 发现并调用经身份、租户和风险策略裁剪的 IoT 平台能力，平台再通过原有协议链路访问设备并回传结果。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <defs>
      <marker id="ar-grey" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#475569"/></marker>
      <marker id="ar-orange" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#F97316"/></marker>
      <marker id="ar-green" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#0F766E"/></marker>
    </defs>

    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 9-9 MCP协议交互序列图</text>
    <text x="88" y="64" font-size="12" fill="#64748B">MCP 是 AI 与 IoT 平台的互操作层，不绕过平台治理，也不替代 MQTT / CoAP 设备协议</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 域边界 -->
    <rect x="180" y="120" width="240" height="700" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.4" stroke-dasharray="7 5"/>
    <rect x="500" y="120" width="600" height="700" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
    <rect x="1180" y="120" width="560" height="700" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4" stroke-dasharray="7 5"/>

    <!-- 生命线 -->
    <g stroke="#94A3B8" stroke-dasharray="6 5">
      <line x1="280" y1="205" x2="280" y2="800"/>
      <line x1="640" y1="205" x2="640" y2="800"/>
      <line x1="1000" y1="205" x2="1000" y2="800"/>
      <line x1="1330" y1="205" x2="1330" y2="800"/>
      <line x1="1620" y1="205" x2="1620" y2="800"/>
    </g>

    <!-- 消息连线 -->
    <g stroke="#475569" stroke-width="2" marker-end="url(#ar-grey)">
      <line x1="280" y1="240" x2="640" y2="240"/>
      <line x1="640" y1="276" x2="280" y2="276"/>
      <line x1="280" y1="312" x2="640" y2="312"/>
      <line x1="640" y1="392" x2="280" y2="392"/>
      <line x1="640" y1="532" x2="1000" y2="532"/>
      <line x1="1000" y1="570" x2="1330" y2="570"/>
      <line x1="1330" y1="608" x2="1620" y2="608"/>
    </g>
    <line x1="280" y1="452" x2="640" y2="452" stroke="#F97316" stroke-width="2" marker-end="url(#ar-orange)"/>
    <g stroke="#0F766E" stroke-width="2" marker-end="url(#ar-green)">
      <line x1="1620" y1="672" x2="1330" y2="672"/>
      <line x1="1330" y1="710" x2="1000" y2="710"/>
      <line x1="1000" y1="748" x2="640" y2="748"/>
      <line x1="640" y1="786" x2="280" y2="786"/>
    </g>

    <!-- 安全决策自循环框 -->
    <rect x="550" y="335" width="180" height="35" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.6"/>
    <text x="640" y="357" font-size="13" fill="#F97316" font-weight="700" text-anchor="middle">身份 + 租户范围裁剪</text>
    <rect x="520" y="470" width="240" height="50" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="640" y="491" font-size="13" fill="#F97316" font-weight="700" text-anchor="middle">鉴权 · 白名单 · 参数校验</text>
    <text x="640" y="511" font-size="13" fill="#F97316" font-weight="700" text-anchor="middle">风险分级 · 必要时人工确认</text>

    <!-- 消息标签 -->
    <g font-size="13" fill="#0F172A" text-anchor="middle">
      <text x="460" y="231">session init · 能力协商</text>
      <text x="460" y="267">session info · 版本与能力</text>
      <text x="460" y="303">tools/list</text>
      <text x="460" y="383">工具列表 · JSON Schema</text>
      <text x="460" y="443">tools/call · 工具 + 参数</text>
      <text x="820" y="523">平台服务调用 (REST)</text>
      <text x="1165" y="561">按原链路下发 · MQTT / CoAP</text>
      <text x="1475" y="599">操作指令</text>
      <text x="1475" y="663">响应 / 遥测</text>
      <text x="1165" y="701">结果回调</text>
      <text x="820" y="739">状态 + 数据 + 审计结果</text>
      <text x="460" y="777">tools/call 响应</text>
    </g>

    <!-- 阶段标签 -->
    <text x="120" y="228" font-size="16" font-weight="700" fill="#475569">会话与发现</text>
    <text x="120" y="434" font-size="16" font-weight="700" fill="#475569">受控工具调用</text>
    <text x="120" y="656" font-size="16" font-weight="700" fill="#475569">设备响应与审计回传</text>

    <!-- 域标签 -->
    <text x="300" y="140" font-size="14" font-weight="700" fill="#F97316" text-anchor="middle">AI 应用域</text>
    <text x="800" y="140" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">IoT 平台安全域</text>
    <text x="1460" y="140" font-size="14" font-weight="700" fill="#0F766E" text-anchor="middle">设备通信域</text>

    <!-- 参与者头部 -->
    <rect x="150" y="155" width="260" height="50" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.6"/>
    <text x="280" y="177" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">AI Agent</text>
    <text x="280" y="196" font-size="11" fill="#64748B" text-anchor="middle">Claude Desktop 等</text>
    <rect x="510" y="155" width="260" height="50" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.6"/>
    <text x="640" y="177" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">MCP Server</text>
    <text x="640" y="196" font-size="11" fill="#64748B" text-anchor="middle">会话 · 策略 · 工具路由</text>
    <rect x="870" y="155" width="260" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="1000" y="177" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">IoT 平台后端</text>
    <text x="1000" y="196" font-size="11" fill="#64748B" text-anchor="middle">设备 / 数据服务</text>
    <rect x="1200" y="155" width="260" height="50" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
    <text x="1330" y="177" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">协议适配层</text>
    <text x="1330" y="196" font-size="11" fill="#64748B" text-anchor="middle">MQTT / CoAP 网关</text>
    <rect x="1490" y="155" width="260" height="50" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
    <text x="1620" y="177" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">物理设备</text>
    <text x="1620" y="196" font-size="11" fill="#64748B" text-anchor="middle">传感器 / 执行器</text>

    <!-- 图例 -->
    <rect x="120" y="838" width="1560" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="140" y1="860" x2="175" y2="860" stroke="#475569" stroke-width="2"/>
    <text x="186" y="865" font-size="14" fill="#475569">实线：受控调用与响应</text>
    <line x1="480" y1="860" x2="515" y2="860" stroke="#0F766E" stroke-width="2"/>
    <text x="526" y="865" font-size="14" fill="#475569">绿色：设备响应回传</text>
    <rect x="800" y="852" width="16" height="16" rx="3" fill="#FFF7ED" stroke="#F97316"/>
    <text x="824" y="865" font-size="14" fill="#475569">橙色框：安全决策点</text>
    <text x="1060" y="865" font-size="14" fill="#64748B">虚线域边界：AI 与设备均不能绕过 IoT 平台安全域</text>

    <!-- 图注 -->
    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图 9-9 MCP 协议交互序列示意：AI Agent 通过 MCP Server 与 IoT 平台及设备进行有状态、安全可控的工具调用。</text>
  </svg>
</svg>
  </main>
</body>
</html>
