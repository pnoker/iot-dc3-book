type: sequence
title: 图9-12 MCP 消息模型与能力描述边界
audience_takeaway: 读者应理解 MCP 以 JSON-RPC 2.0 为载体，经 initialize 协商后暴露 tools/resources/prompts 三类能力，能力描述是安全代理的接口合约。
purpose: 展示 MCP 消息模型、能力协商与能力描述的责任边界
visual_focus: initialize 协商与三类能力卡片。
design_level: sequence
layout: 上半 Client-Server 能力协商，中部三类能力卡片，底部责任边界
elements:
- JSON-RPC 2.0 载体，initialize 请求开始能力协商
- tools：模型可调用动作 + JSON Schema 输入参数
- resources：client 读取的上下文资源
- prompts：可参数化提示模板
- 责任边界：WoT TD 负责属性/单位/协议，MCP 补充权限、风险等级、幂等策略
relationships:
- initialize 协商后进入操作阶段；三类能力由 Server 声明；能力描述是安全代理的接口合约
render_notes: HTML/SVG 渲染，Client-Server 协商 + 三类能力卡片 + 责任边界，蓝绿橙分层。
caption:
  zh: 图9-12 MCP 以 JSON-RPC 2.0 为载体，经 initialize 协商后暴露 tools/resources/prompts 三类能力；能力描述本质是安全代理的接口合约，权限、风险等级与幂等策略由平台层补充。
  en: Figure 9-12 MCP rides on JSON-RPC 2.0 and, after initialize negotiation, exposes three capability types — tools/resources/prompts; a capability description is essentially the interface contract for secure proxying, with permissions, risk levels, and idempotency policy supplied by the platform layer.
labels:
  en:
    图9-12 MCP 消息模型与能力描述边界: Figure 9-12 MCP Message Model and Capability Boundary
    MCP 以 JSON-RPC 2.0 为载体，经 initialize 协商后暴露 tools/resources/prompts 三类能力，能力描述是安全代理的接口合约。: MCP rides on JSON-RPC 2.0; after initialize negotiation it exposes tools/resources/prompts — capability descriptions are the interface contract for secure proxying.
    MCP 只解决一个问题：AI 应用如何发现并调用外部能力: 'MCP solves one problem: how AI apps discover and invoke external capabilities'
    发送协议版本与 capabilities: Sends protocol version and capabilities
    不持过期清单跨会话复用: No stale lists reused across sessions
    返回版本 + capabilities + 扩展: Returns version + capabilities + extensions
    每次新会话重新校验: Re-validated at every new session
    initialize 请求（JSON-RPC 2.0）: initialize request (JSON-RPC 2.0)
    响应：protocolVersion + capabilities: 'Response: protocolVersion + capabilities'
    Server 声明的三类核心能力: Three core capabilities declared by the server
    tools 工具: tools
    模型可调用的动作: Actions the model can call
    声明 name、description、JSON Schema 输入参数: Declares name, description, JSON Schema inputs
    例：iot_read_point(deviceId, pointId): e.g. iot_read_point(deviceId, pointId)
    resources 资源: resources
    client 读取的上下文资源: Context resources read by the client
    设备说明、历史摘要、文档: Device docs, history summaries, documents
    支持 URI 模式匹配: Supports URI pattern matching
    prompts 提示模板: prompts
    可发现、可参数化的提示模板: Discoverable, parameterizable prompt templates
    用于引导模型行为: Used to steer model behavior
    能力描述遵从 JSON Schema: Capability descriptions follow JSON Schema
    能力描述的责任边界：MCP 与 WoT TD 各管一段: 'Responsibility boundary: MCP and WoT TD each cover their part'
    WoT TD / OPC UA / LwM2M 对象负责：属性、事件、命令、数据类型、单位、协议绑定: WoT TD / OPC UA / LwM2M objects own properties, events, commands, data types, units, protocol bindings
    MCP server 基于上述模型适配生成 tools/resources，但必须额外补充三件事：: 'The MCP server derives tools/resources from those models but must add three things:'
    ① 用户权限（当前主体是否被授权） ② 动作风险等级（写操作是否需二次确认） ③ 幂等策略（重复调用是否安全）: ① user permission (is the principal authorized) ② action risk level (does a write need confirmation) ③ idempotency policy (is a repeat call safe)
    工具描述是不可信输入：限制 server 来源、审核 tool 名称与 schema 变化，防止诱导模型泄露或越权: 'Tool descriptions are untrusted input: restrict server sources, review tool names and schema changes to prevent leaks or privilege escalation'
    MCP 只定义 tools 的描述格式，不定义“温度”的单位、枚举范围或生命周期: MCP only defines the tools description format — not the unit, enum range, or lifecycle of "temperature"
    图9-12 MCP 以 JSON-RPC 2.0 为载体，经 initialize 协商后暴露 tools/resources/prompts 三类能力；能力描述本质是安全代理的接口合约，权限、风险等级与幂等策略由平台层补充。: Figure 9-12 MCP rides on JSON-RPC 2.0 and, after initialize negotiation, exposes three capability types — tools/resources/prompts; a capability description is essentially the interface contract for secure proxying, with permissions, risk levels, and idempotency policy supplied by the platform layer.
