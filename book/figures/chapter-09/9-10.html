<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">BLE GATT协议栈与服务-特征层次结构</title>
  <desc id="desc">读者应理解BLE GATT协议栈与服务-特征层次结构中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">BLE GATT协议栈与服务-特征层次结构</title>
  <desc id="desc">读者应理解BLE GATT协议栈与服务-特征层次结构中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">BLE GATT协议栈与服务-特征层次结构</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解BLE GATT协议栈与服务-特征层次结构中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LAYERED</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="layered">
  <!-- 层间连线 -->
  <line x1="600" y1="250" x2="600" y2="255" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <line x1="600" y1="350" x2="600" y2="355" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <line x1="600" y1="450" x2="600" y2="455" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>

  <!-- BLE射频层（PHY）与链路层 -->
  <rect x="250" y="140" width="700" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="600" y="180" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">BLE射频层（PHY）与链路层</text>
  <text x="600" y="205" fill="#475569" font-size="12" text-anchor="middle">硬件底层</text>

  <rect x="250" y="260" width="700" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="600" y="295" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">L2CAP</text>
  <text x="600" y="315" fill="#475569" font-size="12" text-anchor="middle">逻辑链路控制与适配协议</text>

  <!-- ATT -->
  <rect x="250" y="360" width="700" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="600" y="395" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">Attribute Protocol (ATT)</text>

  <text x="600" y="535" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">Service (0x180D 心率服务)</text>

  <rect x="350" y="570" width="500" height="50" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="600" y="595" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">Characteristic (0x2A37 心率测量)</text>

  <text x="600" y="655" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">Descriptor (0x2902 CCCD)</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>

  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图9-10 BLE GATT协议栈与服务-特征层次</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">layered</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">垂直分层，底部为BLE射频层（PHY）与链路层（Link Layer），向上依次为L2CAP、Attribute Protocol（ATT）、GATT Profile。GATT层内使用嵌套方块展示：一个Device包含多个Service（如0x180D心率服务），每个Service包含多个Characteristic（如0x2A37心率测量），每个Characteristic包含Properties位掩码、Value字段和可选的Descriptor（如0x2902客户端特征配置描述符）。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
