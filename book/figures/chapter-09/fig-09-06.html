  <title id="title">图9-6 MCP协议交互序列图</title>
  <desc id="desc">AI Agent 通过 MCP 与 IoT 平台及设备的典型交互流程：① 会话建立（session init + 能力协商）；② 工具发现（tools/list，MCP Server 按身份/租户聚合工具目录）；③ 工具调用与设备执行（tools/call 经鉴权白名单后 REST 调用 IoT 平台后端，按原链路经 MQTT/CoAP 下发物理设备）；④ 结果回传（遥测上报 → 回调 → 返回结果 → tools/call 响应）。参与者：AI Agent、MCP Server、IoT平台后端、设备协议适配层、物理设备。</desc>

  <svg x="0" y="0" width="1200" height="760" viewBox="0 0 1800 900" preserveAspectRatio="xMidYMid meet">

    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
