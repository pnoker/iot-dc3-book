<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图9-6 MCP协议交互序列图</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图9-6 MCP协议交互序列图</title>
  <desc id="desc">AI 控制灯光场景下的 MCP JSON-RPC 2.0 消息序列：①初始化（initialize 能力协商 + initialized 通知）；②运行（tools/list 目录、tools/call setBrightness 经 MQTT 下发灯设备并回传结果）；③sampling（Server 反向发 sampling/createMessage 借用 Host 的 LLM）。顶部四参与者生命线垂直，消息自上而下编号。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="82.182" y="24.000" width="1035.636" height="712.000" viewBox="0 0 1600.000 1100.000" preserveAspectRatio="xMidYMid meet">

  

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2563EB"/>
    </marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#10B981"/>
    </marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1600" height="1100" fill="#FFFFFF"/>

  <!-- ===== 标题区 ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="46" font-size="22" font-weight="700" fill="#0F172A">图9-6 MCP协议交互序列图</text>
  <text x="84" y="70" font-size="12" fill="#64748B">AI 控制灯光场景下的 JSON-RPC 2.0 消息序列 · initialize / tools / sampling</text>
  <rect x="1462" y="26" width="108" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1516" y="46" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">SEQUENCE</text>
  <line x1="40" y1="103" x2="1560" y2="103" stroke="#E2E8F0"/>

  <!-- ===== 三段相位带 ===== -->
  <rect x="40" y="195" width="1520" height="175" rx="8" fill="#2563EB" fill-opacity="0.05"/>
  <rect x="40" y="385" width="1520" height="385" rx="8" fill="#10B981" fill-opacity="0.05"/>
  <rect x="40" y="785" width="1520" height="220" rx="8" fill="#F59E0B" fill-opacity="0.07"/>

  <!-- 相位标签卡 -->
  <rect x="50" y="207" width="128" height="44" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="114" y="226" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">① 初始化</text>
  <text x="114" y="243" font-size="9.5" fill="#475569" text-anchor="middle">能力协商 initialize</text>

  <rect x="50" y="397" width="128" height="44" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="114" y="416" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">② 运行</text>
  <text x="114" y="433" font-size="9.5" fill="#475569" text-anchor="middle">工具调用 tools</text>

  <rect x="50" y="797" width="128" height="44" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="114" y="816" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">③ sampling</text>
  <text x="114" y="833" font-size="9.5" fill="#475569" text-anchor="middle">反向借用 LLM</text>

  <!-- ===== 参与者头（四列） ===== -->
  <!-- AI Agent（橙·AI 域） -->
  <rect x="120" y="130" width="160" height="54" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="200" y="156" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">AI Agent</text>
  <text x="200" y="174" font-size="10" fill="#64748B" text-anchor="middle">Host 内 LLM</text>

  <!-- MCP Client（蓝·平台） -->
  <rect x="480" y="130" width="160" height="54" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="560" y="156" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">MCP Client</text>
  <text x="560" y="174" font-size="10" fill="#64748B" text-anchor="middle">JSON-RPC 桥接</text>

  <!-- Smart Light MCP Server（绿·边缘） -->
  <rect x="920" y="130" width="160" height="54" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1000" y="154" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Smart Light MCP Server</text>
  <text x="1000" y="174" font-size="10" fill="#64748B" text-anchor="middle">工具暴露方</text>

  <!-- 灯设备 MQTT（绿·边缘设备） -->
  <rect x="1310" y="130" width="160" height="54" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1390" y="156" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">灯设备</text>
  <text x="1390" y="174" font-size="10" fill="#64748B" text-anchor="middle">MQTT 总线</text>

  <!-- 生命线 -->
  <line x1="200" y1="184" x2="200" y2="1005" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="560" y1="184" x2="560" y2="1005" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="1000" y1="184" x2="1000" y2="1005" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="1390" y1="184" x2="1390" y2="1005" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 激活条（谁在忙） -->
  <rect x="994" y="585" width="12" height="165" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="0.8"/>
  <rect x="1384" y="640" width="12" height="55" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="0.8"/>
  <rect x="194" y="880" width="12" height="55" fill="#F59E0B" fill-opacity="0.20" stroke="#F59E0B" stroke-width="0.8"/>

  <!-- ===================== ① 初始化（蓝） ===================== -->
  <!-- M1 initialize -->
  <circle cx="575" cy="230" r="9" fill="#2563EB"/>
  <text x="575" y="234" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <line x1="562" y1="230" x2="994" y2="230" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="778" y="221" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">initialize · id=1 · {protocolVersion, capabilities}</text>

  <!-- M2 result 回 serverInfo + capabilities -->
  <circle cx="985" cy="295" r="9" fill="#2563EB"/>
  <text x="985" y="299" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <line x1="998" y1="295" x2="566" y2="295" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-blue)"/>
  <text x="782" y="286" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">result · id=1 · serverInfo + capabilities{tools, resources}</text>

  <!-- M3 initialized 通知 -->
  <circle cx="575" cy="350" r="9" fill="#2563EB"/>
  <text x="575" y="354" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <line x1="562" y1="350" x2="994" y2="350" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="778" y="341" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">notifications/initialized（协商完成，进入就绪）</text>

  <!-- ===================== ② 运行（绿） ===================== -->
  <!-- M4 tools/list -->
  <circle cx="575" cy="420" r="9" fill="#10B981"/>
  <text x="575" y="424" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <line x1="562" y1="420" x2="994" y2="420" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="778" y="411" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">tools/list · id=2</text>

  <!-- M5 result 工具目录 -->
  <circle cx="985" cy="475" r="9" fill="#10B981"/>
  <text x="985" y="479" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <line x1="998" y1="475" x2="566" y2="475" stroke="#10B981" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-green)"/>
  <text x="782" y="466" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">result · id=2 · [setBrightness, setColor, toggle]</text>

  <!-- M6 模型决策 Agent → Client -->
  <circle cx="215" cy="530" r="9" fill="#10B981"/>
  <text x="215" y="534" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <line x1="202" y1="530" x2="558" y2="530" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="380" y="521" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">模型决策 · 选择调用 setBrightness(75)</text>

  <!-- M7 tools/call setBrightness -->
  <circle cx="575" cy="585" r="9" fill="#10B981"/>
  <text x="575" y="589" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <line x1="562" y1="585" x2="994" y2="585" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="778" y="576" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">tools/call · setBrightness(brightness=75) · id=3</text>

  <!-- M8 MQTT 下发 Server → 灯设备 -->
  <circle cx="1015" cy="640" r="9" fill="#10B981"/>
  <text x="1015" y="644" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
  <line x1="1002" y1="640" x2="1384" y2="640" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="1193" y="631" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">MQTT publish · cmnd/light/brightness 75</text>

  <!-- M9 MQTT 状态回传 -->
  <circle cx="1375" cy="695" r="9" fill="#10B981"/>
  <text x="1375" y="699" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
  <line x1="1384" y1="695" x2="1006" y2="695" stroke="#10B981" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-green)"/>
  <text x="1195" y="686" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">MQTT stat · brightness=75 OK</text>

  <!-- M10 result 返回 Client -->
  <circle cx="985" cy="750" r="9" fill="#10B981"/>
  <text x="985" y="754" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
  <line x1="998" y1="750" x2="566" y2="750" stroke="#10B981" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-green)"/>
  <text x="782" y="741" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">result · id=3 · {success, brightness:75}</text>

  <!-- ===================== ③ sampling（橙·虚线·反向） ===================== -->
  <!-- M11 sampling/createMessage Server → Client -->
  <circle cx="985" cy="830" r="9" fill="#F59E0B"/>
  <text x="985" y="834" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">11</text>
  <line x1="998" y1="830" x2="566" y2="830" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <text x="782" y="821" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">sampling/createMessage · id=4（反向借用 Host LLM）</text>

  <!-- M12 转交 LLM Client → Agent -->
  <circle cx="545" cy="885" r="9" fill="#F59E0B"/>
  <text x="545" y="889" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">12</text>
  <line x1="558" y1="885" x2="206" y2="885" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <text x="382" y="876" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">转交 Host LLM 推理</text>

  <!-- M13 LLM 结果回传 Agent → Client -->
  <circle cx="215" cy="935" r="9" fill="#F59E0B"/>
  <text x="215" y="939" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">13</text>
  <line x1="202" y1="935" x2="558" y2="935" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <text x="380" y="926" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">LLM 推理结果回传</text>

  <!-- M14 result 返回 Server -->
  <circle cx="575" cy="985" r="9" fill="#F59E0B"/>
  <text x="575" y="989" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">14</text>
  <line x1="562" y1="985" x2="994" y2="985" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <text x="778" y="976" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">result · id=4 · {role:assistant, content}</text>

  <!-- ===== 图例 ===== -->
  <line x1="40" y1="1025" x2="1560" y2="1025" stroke="#E2E8F0"/>
  <text x="50" y="1050" font-size="11" font-weight="600" fill="#64748B">图例</text>

  <line x1="108" y1="1046" x2="148" y2="1046" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="156" y="1050" font-size="11" fill="#475569">① 初始化（initialize / initialized）</text>

  <line x1="438" y1="1046" x2="478" y2="1046" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="486" y="1050" font-size="11" fill="#475569">② 运行（tools/list · tools/call · MQTT · result）</text>

  <line x1="888" y1="1046" x2="928" y2="1046" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <text x="936" y="1050" font-size="11" fill="#475569">③ sampling 反向借用 LLM</text>

  <line x1="1262" y1="1046" x2="1302" y2="1046" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-blue)"/>
  <text x="1310" y="1050" font-size="11" fill="#475569">虚线 = 响应 / 回传</text>

  <!-- ===== caption ===== -->
  <text x="800" y="1085" font-size="10" fill="#94A3B8" text-anchor="middle">图9-5 MCP 三阶段生命周期：初始化能力协商 → 运行期 tools/call 经 MQTT 下发灯设备 → sampling 反向借用 Host LLM；所有消息均为标准 JSON-RPC 2.0 结构。</text>
  </svg>
</svg>

      <div class="card"><div class="label">图表类型</div><div class="value">sequence</div></div>

  </main>
