<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图 9-6 LwM2M 对象树与引导注册</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">图 9-6 LwM2M 对象树与引导注册</title>
  <desc id="desc">LwM2M 把设备能力抽象为对象/实例/资源三级对象树，经引导、注册、更新注册接入平台。</desc>
  <rect width="1200" height="700" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="580" viewBox="0 0 1800 950" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="950" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
  </defs>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 9-6 LwM2M 对象树与引导注册</text>
  <text x="88" y="64" font-size="12" fill="#64748B">CoAP 管消息收发，LwM2M 管设备能力的抽象、注册、配置与维护</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 对象树 -->
  <text x="80" y="150" font-size="15" font-weight="700" fill="#334155">对象树三级结构：把设备能力变成可寻址路径</text>

  <rect x="80" y="172" width="520" height="150" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="340" y="206" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Object 对象</text>
  <text x="116" y="240" font-size="12" fill="#475569">代表一类能力</text>
  <text x="116" y="268" font-size="12" fill="#475569">3 设备 · 3303 温度 · 6 位置 · 5 固件更新</text>
  <text x="116" y="296" font-size="11" fill="#64748B">同对象 ID = 平台读写接口可复用</text>

  <rect x="640" y="172" width="520" height="150" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="900" y="206" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Instance 对象实例</text>
  <text x="676" y="240" font-size="12" fill="#475569">同一能力的多个副本</text>
  <text x="676" y="268" font-size="12" fill="#475569">三个温度传感器 = 三个 /3303/ 实例</text>
  <text x="676" y="296" font-size="11" fill="#64748B">编号从 0 开始</text>

  <rect x="1200" y="172" width="520" height="150" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1460" y="206" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Resource 资源</text>
  <text x="1236" y="240" font-size="12" fill="#475569">实例里的可读/写/执行项</text>
  <text x="1236" y="268" font-size="12" fill="#475569">/5700 当前读数 · /5601 最小量程</text>
  <text x="1236" y="296" font-size="11" fill="#64748B">R 只读 / W 可写 / E 可执行</text>

  <!-- 路径示例 -->
  <rect x="80" y="370" width="1640" height="80" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="402" font-size="13" font-weight="700" fill="#334155">访问路径示例</text>
  <text x="120" y="430" font-size="14" font-weight="700" fill="#2563EB">读第一个温度传感器的当前值：/3303/0/5700</text>
  <text x="820" y="430" font-size="12" fill="#475569">路径语义与 CoAP URI 天然对齐，客户端固件按路径查表找处理器函数</text>

  <!-- 引导注册三步 -->
  <text x="80" y="510" font-size="15" font-weight="700" fill="#334155">引导与注册：设备上平台的标准三步</text>

  <rect x="80" y="532" width="520" height="140" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="340" y="566" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">① 引导（Bootstrap）</text>
  <text x="116" y="600" font-size="12" fill="#475569">出厂预置信息联系引导服务器</text>
  <text x="116" y="626" font-size="12" fill="#475569">返回主服务器地址、端口、PSK/证书、初始配置</text>
  <text x="116" y="652" font-size="11" fill="#64748B">仅首次上电 / 恢复出厂 / 证书过期时发生</text>

  <line x1="600" y1="602" x2="640" y2="602" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="640" y="532" width="520" height="140" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="900" y="566" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">② 注册（Register）</text>
  <text x="676" y="600" font-size="12" fill="#475569">向 Server 发 CoAP POST</text>
  <text x="676" y="626" font-size="12" fill="#475569">携带对象 ID 列表与端点名</text>
  <text x="676" y="652" font-size="11" fill="#64748B">返回 CoAP 2.01 Created</text>

  <line x1="1160" y1="602" x2="1200" y2="602" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="1200" y="532" width="520" height="140" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1460" y="566" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">③ 更新注册（Update）</text>
  <text x="1236" y="600" font-size="12" fill="#475569">存活时间（Lifetime）到期前周期性 POST 续约</text>
  <text x="1236" y="626" font-size="12" fill="#475569">超时未更新 → 判定离线，释放注册资源</text>
  <text x="1236" y="652" font-size="11" fill="#64748B">NB-IoT 水表通电后自动完成全流程</text>

  <!-- 观察/通知 -->
  <rect x="80" y="720" width="1640" height="90" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="752" font-size="13" font-weight="700" fill="#334155">观察/通知：从轮询到推送</text>
  <text x="120" y="780" font-size="12" fill="#475569">平台发 GET + Observe:0 → 设备加入观察者列表 → 变化阈值 / 最小通知周期触发主动上报 → RST 取消观察，把通信主动权交给设备侧</text>

  <!-- Caption -->
  <text x="900" y="910" font-size="17" fill="#475569" text-anchor="middle">图 9-6 LwM2M 把设备能力抽象为对象/实例/资源三级对象树，路径与 CoAP URI 对齐；设备经引导、注册、更新注册接入平台，观察/通知机制实现推送式上报。</text>
  </svg>
</svg>
  </main>
</body>
</html>
