type: architecture
title: 图 9-5 CoAP消息格式与选项示意
purpose: 展示CoAP消息的紧凑二进制格式，与HTTP冗长的文本头部形成对比，直观解释CoAP如何实现轻量级传输。
audience_takeaway: 等效的GET请求，HTTP的文本头部大小通常远超CoAP的二进制头部，由此理解CoAP在受限网络中的核心优势。
visual_focus: 上半部分展示HTTP请求头部示例（文本格式），下半部分展示CoAP CON GET请求的二进制分段布局（Ver/T/TKL/Code/Message ID/Token/Options/Payload）。用连线和标注突出二者完成相同语义时的大小差异。
design_level: logical
layout: 从上到下分为两个并行区域：上方为HTTP请求头部，下方为CoAP CON GET请求的二进制分段布局。
elements:
- HTTP文本头部：包含请求行（GET /temperature HTTP/1.1）、Host、Content-Type等头部字段。
- CoAP二进制布局（按RFC 7252）：固定头（Ver 2b + T 2b + TKL 4b + Code 8b + Message ID 16b）、Token（可变长度）、Options（如Uri-Path）、Payload标记（0xFF）+ 载荷。
- 一条连线和标注：'等效语义，体积显著更小'。
- CoAP字段注释，说明关键字段的功能：Ver（版本号，当前固定为01）、T（消息类型，CON=0/NON=1）、Code（请求方法如GET=0.01）、MID（消息ID用于去重与匹配）。
- 底图注和图例，说明颜色方案：固定头（蓝色）、Token（绿色）、Options（橙色）、Payload（浅灰）。
relationships:
- HTTP 请求头部 → CoAP 二进制布局：用等效 GET 语义对比报文体积
- CoAP 固定头 → Token → Options → Payload：按解析顺序组织固定与可变字段
- Token → 请求与响应：关联同一交互
- Message ID → 报文处理：用于去重与匹配
regions: []
components:
- id: http_block
  label: HTTP请求头部
  type: external
  subtitle: 文本格式，通常数百字节
  group: ''
  priority: normal
  shape: card
- id: coap_block
  label: CoAP二进制布局
  type: platform
  subtitle: 4字节固定头 + Token + Options + Payload
  group: ''
  priority: primary
  shape: card
connections:
- from: http_block
  to: coap_block
  label: 等效语义，体积显著更小
  style: dashed
  direction: left-to-right
callouts:
- CoAP固定头仅4字节，典型请求头远小于HTTP；HTTP即使最简请求也远超过这个量级。
- CoAP头部各字段：Ver（2b）、T（2b）、TKL（4b）、Code（8b）、Message ID（16b）。
legend:
- 蓝色=固定头/元数据；绿色=Token/上下文关联；橙色=Options/路由与内容协商；浅灰=Payload/实际数据。
visual_constraints:
- 节点标签和subtitle简练，解释性文字放入callouts。
- 图例放置在底部，不应遮挡主体区域。
- 主要内容对比链路用一条带有标签的箭头强调。
render_notes: 采用上下两个并行条块布局，CoAP侧以分段着色表示字段，底部附图例和简短的RFC 7252参考标注。
caption:
  zh: 图 9-5 CoAP消息格式与HTTP文本头部的体积对比，突出CoAP的紧凑二进制设计对受限设备的价值。
  en: Figure 9-5 Size comparison between the CoAP message format and HTTP text headers, highlighting the value of CoAP's compact binary design for constrained devices.
labels:
  en:
    图 9-5 CoAP消息格式与选项示意: Figure 9-5 CoAP Message Format and Options
    HTTP 文本请求与 CoAP 紧凑二进制报文的等效语义对比。: Equivalent semantics of an HTTP text request and a compact CoAP binary message.
    等效 GET 语义下，CoAP 以 4 字节固定头和可变字段降低受限网络开销: For an equivalent GET, CoAP cuts constrained-network overhead with a 4-byte fixed header and variable fields
    等效语义，体积显著更小: Same semantics, far smaller
    HTTP 请求头部: HTTP request header
    文本格式，典型请求头通常远大于 CoAP 固定头: Text format; a typical header far exceeds the CoAP fixed header
    典型可达数百字节: Typically hundreds of bytes
    CoAP CON GET 二进制布局: CoAP CON GET binary layout
    固定头 4 B + Token + Options + 可选 Payload（字段定义参考 RFC 7252）: 4 B fixed header + Token + Options + optional Payload (RFC 7252)
    可变长度: Variable length
    路由与内容协商: Routing & content negotiation
    分隔: Separator
    实际载荷（可选）: Actual payload (optional)
    Ver：版本号，当前固定 01: 'Ver: version, currently 01'
    Code：请求方法（GET=0.01）: 'Code: request method (GET=0.01)'
    Message ID：报文去重与匹配: 'Message ID: deduplication & matching'
    Token：关联请求与响应: 'Token: pairs request and response'
    Options：路径与内容协商: 'Options: path & content negotiation'
    0xFF：仅在存在 Payload 时作为分隔标记: '0xFF: payload marker only when a payload exists'
    Payload：实际载荷，可选: 'Payload: actual data, optional'
    固定头 / 元数据: Fixed header / metadata
    Token / 上下文关联: Token / context pairing
    Options / 路由与内容协商: Options / routing & negotiation
    0xFF 分隔标记: 0xFF separator
    Payload / 实际数据: Payload / actual data
    图 9-5 CoAP 消息格式与 HTTP 文本头部的体积对比，突出 CoAP 的紧凑二进制设计对受限设备的价值。: Figure 9-5 Size comparison of the CoAP message format versus HTTP text headers, highlighting the value of CoAP's compact binary design for constrained devices.
