callouts:
- Service是功能组，Characteristic是数据点，Descriptor配置订阅行为。
- Notification无ACK，适合周期性数据；Indication有ACK，适合指令执行结果。
- 图中仅展示一个Service/Characteristic示例，实际设备通常包含多个Service。
legend:
- 青绿色：硬件与链路层
- 蓝色：协议栈核心
- 橙色：应用层模型
- 实线箭头：主执行路径
- 虚线箭头：配置或可选路径
visual_constraints:
- 最多9个主节点，标签简短，解释放入callouts。
- 图例位于图底部，不遮挡边界。
- 蓝色用于协议栈，橙色用于模型，青绿色用于硬件。
- Connection label不超过12个汉字。
render_notes: HTML/SVG渲染，浅色背景，圆角矩形。Characteristic节点标注Properties（如Read|Notify）。Notification和Indication为菱形节点。底部图例。
caption:
  zh: 图9-5 BLE GATT协议栈层次及Service-Characteristic-Descriptor嵌套结构，右半部分展示Notification与Indication的执行路径分叉。
  en: Figure 9-5 The BLE GATT stack layers and the Service-Characteristic-Descriptor nesting; the right half shows the fork between the Notification and Indication execution paths.
labels:
  en:
    图9-5 BLE GATT协议栈与服务-特征层次: Figure 9-5 BLE GATT Stack and Service-Characteristic Hierarchy
    ? BLE 从 PHY 和 Link Layer 经 L2CAP、ATT 到 GATT，右侧展示 Service、Characteristic、Descriptor 嵌套及 CCCD 控制的 Notification 和 Indication 分支。
    : BLE runs from PHY and Link Layer through L2CAP and ATT up to GATT; the right side shows Service, Characteristic, Descriptor nesting and the CCCD-controlled Notification and Indication branches.
    ATT 提供属性访问，GATT 组织服务数据模型；CCCD 选择无确认或带确认的推送路径: ATT provides attribute access and GATT organizes the service data model; CCCD selects the unconfirmed or confirmed push path
    承载: Carries
    复用: Multiplexes
    属性读写: Attribute R/W
    订阅 · 无确认: Subscribe · no ACK
    订阅 · 带确认: Subscribe · with ACK
    协议栈主链路: Main stack path
    服务 · 特征 · 描述符数据模型: Service · Characteristic · Descriptor data model
    属性数据库读写与通知承载: Attribute database R/W & notification transport
    逻辑通道复用: Logical channel multiplexing
    射频与链路管理: Radio & link management
    应用数据模型: Application data model
    服务：心率功能组: 'Service: heart-rate function group'
    Value：心率数值  Properties：Read | Notify: 'Value: heart rate  Properties: Read | Notify'
    推送使能配置: Push enable config
    包含关系：Device → Service → Characteristic → Descriptor: 'Nesting: Device → Service → Characteristic → Descriptor'
    无 ACK · 周期数据 · 低开销: No ACK · periodic data · low overhead
    逐包确认 · 关键结果 · 较高开销: Per-packet ACK · critical results · higher overhead
    硬件链路: Hardware link
    协议栈核心: Stack core
    实线：主路径: 'Solid: main path'
    虚线：配置 / 带确认路径: 'Dashed: config / confirmed path'
    图9-5 BLE GATT 协议栈层次及 Service-Characteristic-Descriptor 嵌套结构，右半部分展示 Notification 与 Indication 的执行路径分叉。: Figure 9-5 BLE GATT stack layers and Service-Characteristic-Descriptor nesting; the right half shows the fork between the Notification and Indication paths.
