    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>

    <text x="1080" y="528" font-size="14" fill="#475569">订阅 / 通知模型参考</text>

    <text x="1280" y="372" font-size="14" fill="#2563EB" font-weight="700" text-anchor="middle">AI 接口扩展</text>

    <text x="280" y="205" font-size="17" font-weight="700" fill="#475569" text-anchor="middle">垂直标准群</text>
    <text x="280" y="235" font-size="14" fill="#64748B" text-anchor="middle">工业 / 消费 / 电信</text>
    <text x="280" y="262" font-size="14" fill="#64748B" text-anchor="middle">各自独立演进</text>
    <text x="280" y="289" font-size="14" fill="#64748B" text-anchor="middle">适配成本随品类增长</text>

    <rect x="530" y="440" width="300" height="200" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="680" y="470" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">中间层阶段</text>
    <text x="680" y="505" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle">oneM2M</text>

    <text x="1480" y="535" font-size="14" fill="#64748B" text-anchor="middle">AI 交互接口扩展</text>

    <text x="1480" y="589" font-size="14" fill="#64748B" text-anchor="middle">补充层，不替代设备协议</text>

    <!-- 图例 -->
    <rect x="150" y="680" width="1500" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="170" y1="702" x2="205" y2="702" stroke="#2563EB" stroke-width="3"/>
    <text x="216" y="707" font-size="14" fill="#475569">实线主轴：概念阶段推进</text>
    <line x1="560" y1="702" x2="595" y2="702" stroke="#475569" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="606" y="707" font-size="14" fill="#475569">虚线：补充关系或设计参考（不表示标准继承或官方归属）</text>
    <circle cx="1300" cy="702" r="9" fill="#FFFFFF" stroke="#F97316" stroke-width="3"/>
    <text x="1320" y="707" font-size="14" fill="#475569">橙色：AI 交互层</text>

    <!-- 长期方向 -->
    <rect x="150" y="750" width="1500" height="70" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="900" y="780" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">长期方向</text>
    <text x="900" y="806" font-size="14" fill="#475569" text-anchor="middle">从「消息可传」推进到「含义可共享」，再为 AI 提供经过治理的能力发现与调用接口。</text>

    <!-- 图注 -->
    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图 9-14 展示了物联网标准化从独立垂直标准，到水平平台收敛，再到语义描述和 AI 交互接口的四个阶段。MCP 在工程实践中融合了 oneM2M 和 WoT 的设计思路，而不是另起炉灶。</text>
