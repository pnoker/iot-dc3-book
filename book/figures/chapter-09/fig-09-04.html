<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图9-4 CoAP消息格式与选项示意</title><style>html,body{margin:0;background:#F8FAFC}svg{display:block;width:1200px;height:720px;margin:auto;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:25px;font-weight:700;fill:#0F172A}.sub,.note{font-size:12px;fill:#475569}.head{font-size:17px;font-weight:700;fill:#0F172A}.mono{font-size:13px;fill:#0F172A;font-family:Consolas,Menlo,monospace}.field{font-size:12px;font-weight:700}.cap{font-size:11px;fill:#475569}</style></head><body><svg data-figure-root="fig-09-04" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">图9-4 CoAP消息格式与选项示意</title><desc id="desc">HTTP文本请求与CoAP紧凑二进制报文的等效语义对比。</desc><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563EB"/></marker></defs><rect width="1200" height="720" fill="#F8FAFC"/><text x="70" y="52" class="title">图9-4 CoAP消息格式与选项示意</text><text x="70" y="78" class="sub">等效 GET 语义下，CoAP 以 4 字节固定头和可变字段降低受限网络开销</text>
<rect x="70" y="110" width="1060" height="205" rx="7" fill="#FFFFFF" stroke="#94A3B8"/><text x="95" y="143" class="head">HTTP 请求头部</text><text x="95" y="166" class="note">文本格式，典型请求头通常远大于 CoAP 固定头</text><rect x="95" y="182" width="1010" height="110" rx="5" fill="#F8FAFC" stroke="#94A3B8"/><text x="120" y="210" class="mono">GET /temperature HTTP/1.1</text><text x="120" y="237" class="mono">Host: device.example　 Accept: text/plain</text><text x="120" y="264" class="mono">Content-Type: text/plain</text>
<line x1="600" y1="318" x2="600" y2="350" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="620" y="339" class="note">等效语义，体积显著更小</text><rect x="70" y="350" width="1060" height="260" rx="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="95" y="384" class="head">CoAP CON GET 二进制布局</text><text x="95" y="407" class="note">固定头 4 B + Token + Options + 可选 Payload（字段定义参考 RFC 7252）</text>
<g transform="translate(95 430)"><rect width="60" height="58" fill="#2563EB"/><rect x="60" width="60" height="58" fill="#2563EB"/><rect x="120" width="70" height="58" fill="#2563EB"/><rect x="190" width="130" height="58" fill="#2563EB"/><rect x="320" width="160" height="58" fill="#2563EB"/><rect x="480" width="130" height="58" fill="#16A34A"/><rect x="610" width="220" height="58" fill="#F97316"/><rect x="830" width="70" height="58" fill="#475569"/><rect x="900" width="110" height="58" fill="#FFFFFF" stroke="#94A3B8"/><g text-anchor="middle" fill="#FFFFFF"><text x="30" y="25" class="field">Ver</text><text x="30" y="45" class="field">2 b</text><text x="90" y="25" class="field">T</text><text x="90" y="45" class="field">2 b</text><text x="155" y="25" class="field">TKL</text><text x="155" y="45" class="field">4 b</text><text x="255" y="25" class="field">Code</text><text x="255" y="45" class="field">GET=0.01</text><text x="400" y="25" class="field">Message ID</text><text x="400" y="45" class="field">16 b</text><text x="545" y="35" class="field">Token</text><text x="720" y="35" class="field">Options · Uri-Path</text><text x="865" y="35" class="field">0xFF</text></g><text x="955" y="35" class="field" text-anchor="middle" fill="#0F172A">Payload</text></g>
<g class="note"><text x="95" y="525">Ver：版本号，当前固定为 01</text><text x="365" y="525">T：CON=0 / NON=1</text><text x="625" y="525">Code：请求方法</text><text x="860" y="525">MID：报文去重与匹配</text><text x="95" y="558">Token：关联请求与响应</text><text x="365" y="558">Options：路径与内容协商</text><text x="705" y="558">0xFF：仅在存在 Payload 时作为分隔标记</text></g>
<rect x="70" y="630" width="1060" height="42" rx="5" fill="#FFFFFF" stroke="#94A3B8"/><text x="95" y="656" class="note">蓝：固定头　　绿：Token　　橙：Options　　灰：Payload 标记　　边框：可选载荷</text><text x="600" y="704" class="cap" text-anchor="middle">CoAP 固定头仅 4 字节，后接可变 Token、Options 和可选 Payload，适合资源受限设备与网络。</text></svg></body></html>
