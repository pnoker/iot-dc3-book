<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图9-13 MCP 工程原型：AI 控制灯光的受控链路</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">图9-13 MCP 工程原型：AI 控制灯光的受控链路</title>
  <desc id="desc">AI Agent 不直连设备，经 MCP Server 校验权限与参数后，由 IoT 平台通过 MQTT 下发指令到智能灯。</desc>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="560" viewBox="0 0 1800 900" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="900" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
  </defs>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图9-13 MCP 工程原型：AI 控制灯光的受控链路</text>
  <text x="88" y="64" font-size="12" fill="#64748B">AI Agent 不直连设备 · 权限、校验、审计在 Server 与平台层落地</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 主链路 -->
  <rect x="80" y="150" width="340" height="180" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="250" y="190" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">AI Agent（MCP Client）</text>
  <text x="116" y="226" font-size="11" fill="#475569">语音解析：“卧室灯→暖黄→60%”</text>
  <text x="116" y="250" font-size="11" fill="#475569">命名实体识别 + 参数提取</text>
  <text x="116" y="274" font-size="11" fill="#475569">工具匹配：iot_set_light</text>
  <text x="116" y="306" font-size="11" fill="#64748B">只与 MCP Server 交互</text>

  <line x1="420" y1="240" x2="462" y2="240" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="462" y="150" width="340" height="180" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="632" y="190" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">MCP Server</text>
  <text x="498" y="226" font-size="11" fill="#475569">tools/call 解析与分发</text>
  <text x="498" y="250" font-size="11" fill="#475569">权限校验（会话用户是否授权）</text>
  <text x="498" y="274" font-size="11" fill="#475569">参数越界校验（0~100、颜色枚举）</text>
  <text x="498" y="306" font-size="11" fill="#64748B">拒绝调用时记录审计日志</text>

  <line x1="802" y1="240" x2="844" y2="240" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="844" y="150" width="340" height="180" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1014" y="190" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">IoT 平台（REST → MQTT）</text>
  <text x="880" y="226" font-size="11" fill="#475569">REST 接口接收工具调用</text>
  <text x="880" y="250" font-size="11" fill="#475569">平台侧设备状态管理</text>
  <text x="880" y="274" font-size="11" fill="#475569">通过 MQTT 下发真实指令</text>
  <text x="880" y="306" font-size="11" fill="#64748B">设备注册、能力、状态仍由平台管</text>

  <line x1="1184" y1="240" x2="1226" y2="240" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="1226" y="150" width="494" height="180" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1473" y="190" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">智能灯设备（light-bedroom-01）</text>
  <text x="1262" y="226" font-size="11" fill="#475569">接收 MQTT 指令，更新亮度与颜色</text>
  <text x="1262" y="250" font-size="11" fill="#475569">回报状态：brightness=60, color=暖黄</text>
  <text x="1262" y="274" font-size="11" fill="#475569">能力集：set_light / get_status</text>
  <text x="1262" y="306" font-size="11" fill="#64748B">设备侧仍是 MQTT，不经 MCP</text>

  <!-- 异常处理边界 -->
  <text x="80" y="410" font-size="15" font-weight="700" fill="#334155">Server 必须处理的异常与工程边界</text>

  <rect x="80" y="432" width="400" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="280" y="464" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">设备离线 / 参数越界</text>
  <text x="116" y="496" font-size="11" fill="#475569">返回结构化错误：device offline</text>
  <text x="116" y="520" font-size="11" fill="#475569">brightness out of range</text>

  <rect x="520" y="432" width="400" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="720" y="464" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">权限不足</text>
  <text x="556" y="496" font-size="11" fill="#475569">会话用户无权控制该设备</text>
  <text x="556" y="520" font-size="11" fill="#475569">拒绝调用并记录审计日志</text>

  <rect x="960" y="432" width="400" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1160" y="464" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">超时与重试</text>
  <text x="996" y="496" font-size="11" fill="#475569">MQTT 超时执行重试或状态回滚</text>
  <text x="996" y="520" font-size="11" fill="#475569">tools/call 支持幂等性键，防重复执行</text>

  <!-- 分层逻辑 -->
  <rect x="80" y="620" width="1640" height="120" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="652" font-size="14" font-weight="700" fill="#334155">核心分层逻辑</text>
  <text x="120" y="684" font-size="12" fill="#475569">设备注册、能力描述、命令执行、状态同步仍由 IoT 平台与 MQTT 完成，MCP Server 仅在 AI 与平台之间履行转换与管控职责</text>
  <text x="120" y="710" font-size="12" fill="#475569">这为安全审计、权限控制和工具版本管理提供明确执行点，降低 AI 接入对设备侧协议的感知成本</text>

  <!-- Caption -->
  <text x="900" y="860" font-size="17" fill="#475569" text-anchor="middle">图9-13 AI Agent 不直连设备：经 MCP Server 完成工具发现、权限校验与参数校验，由 IoT 平台通过 MQTT 下发指令到智能灯，异常场景返回结构化错误并保留审计记录。</text>
  </svg>
</svg>
  </main>
</body>
</html>
