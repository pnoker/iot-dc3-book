<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">MQTT 发布/订阅模型与内部机制</title>
  <desc id="desc">读者应理解MQTT 发布/订阅模型与内部机制中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">MQTT 发布/订阅模型与内部机制</title>
  <desc id="desc">读者应理解MQTT 发布/订阅模型与内部机制中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">MQTT 发布/订阅模型与内部机制</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解MQTT 发布/订阅模型与内部机制中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">DATAFLOW</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="分层数据流图：从左到右依次为发布者、Broker、订阅者">
  <!-- 底部链路层横条 -->
  <rect x="100" y="650" width="1600" height="60" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="900" y="684" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">TCP/UDP 传输层</text>
  <text x="900" y="700" fill="#64748B" font-size="12" text-anchor="middle">可靠的网络连接</text>

  <!-- 发布者 (左侧) -->
  <rect x="200" y="200" width="160" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="280" y="230" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">发布者</text>
  <text x="280" y="252" fill="#64748B" font-size="12" text-anchor="middle">传感器 / 设备</text>

  <rect x="200" y="320" width="160" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="280" y="350" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">发布者</text>
  <text x="280" y="372" fill="#64748B" font-size="12" text-anchor="middle">应用客户端</text>

  <rect x="200" y="440" width="160" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="280" y="470" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">发布者</text>
  <text x="280" y="492" fill="#64748B" font-size="12" text-anchor="middle">遥测设备</text>

  <!-- 订阅者 (右侧) -->
  <rect x="1350" y="200" width="160" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1430" y="230" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">订阅者</text>
  <text x="1430" y="252" fill="#64748B" font-size="12" text-anchor="middle">仪表盘应用</text>

  <rect x="1350" y="320" width="160" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1430" y="350" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">订阅者</text>
  <text x="1430" y="372" fill="#64748B" font-size="12" text-anchor="middle">移动客户端</text>

  <rect x="1350" y="440" width="160" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1430" y="470" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">订阅者</text>
  <text x="1430" y="492" fill="#64748B" font-size="12" text-anchor="middle">边缘设备</text>

  <!-- Broker 容器 -->
  <rect x="500" y="150" width="700" height="520" rx="14" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="8,4" />
  <text x="520" y="178" fill="#2563EB" font-size="20" font-weight="700">MQTT Broker</text>

  <!-- 主题树匹配模块 -->
  <rect x="550" y="200" width="240" height="90" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="670" y="230" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">主题树匹配</text>
  <text x="670" y="252" fill="#64748B" font-size="12" text-anchor="middle">支持 + / # 通配符</text>

  <!-- QoS 状态机模块 -->
  <rect x="850" y="200" width="180" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="940" y="226" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">QoS 0</text>
  <text x="940" y="244" fill="#64748B" font-size="11" text-anchor="middle">直接交付</text>

  <rect x="850" y="285" width="180" height="70" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="940" y="311" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">QoS 1</text>
  <text x="940" y="329" fill="#64748B" font-size="11" text-anchor="middle">握手确认</text>

  <rect x="850" y="370" width="180" height="70" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="940" y="396" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">QoS 2</text>
  <text x="940" y="414" fill="#64748B" font-size="11" text-anchor="middle">四步握手</text>

  <!-- 保留消息缓存区 -->
  <rect x="550" y="350" width="240" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="670" y="380" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">保留消息缓存</text>
  <text x="670" y="402" fill="#64748B" font-size="12" text-anchor="middle">存储最后一条 retain 消息</text>

  <!-- 遗嘱消息控制器 -->
  <rect x="550" y="470" width="240" height="80" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="670" y="498" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">遗嘱消息控制器</text>
  <text x="670" y="518" fill="#64748B" font-size="11" text-anchor="middle">客户端异常断开时触发</text>

  <!-- 连线：发布者 → Broker（常规消息） -->
  <!-- 发布者1 -->
  <path d="M 360 240 L 500 240" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="390" y="225" width="60" height="20" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="420" y="239" fill="#0F172A" font-size="11" text-anchor="middle">发布消息</text>

  <!-- 发布者2 -->
  <path d="M 360 360 L 500 360" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="390" y="345" width="60" height="20" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="420" y="359" fill="#0F172A" font-size="11" text-anchor="middle">发布消息</text>

  <!-- 发布者3 -->
  <path d="M 360 480 L 550 480" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="420" y="465" width="60" height="20" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="450" y="479" fill="#0F172A" font-size="11" text-anchor="middle">发布消息</text>

  <!-- 保留消息：从缓存到新订阅者（虚线紫色） -->
  <path d="M 790 395 L 1350 240" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>
  <rect x="1000" y="300" width="90" height="20" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="1045" y="314" fill="#7C3AED" font-size="11" text-anchor="middle">保留消息推送</text>

  <!-- 遗嘱消息：从遗嘱控制器广播（虚线红色） -->
  <path d="M 790 510 L 1350 440" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>
  <rect x="1000" y="465" width="90" height="20" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="1045" y="479" fill="#DC2626" font-size="11" text-anchor="middle">遗嘱消息广播</text>

  <!-- Broker → 订阅者（常规消息） -->
  <path d="M 1200 240 L 1350 240" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1240" y="225" width="60" height="20" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="1270" y="239" fill="#0F172A" font-size="11" text-anchor="middle">分发消息</text>

  <path d="M 1200 360 L 1350 360" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1240" y="345" width="60" height="20" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="1270" y="359" fill="#0F172A" font-size="11" text-anchor="middle">分发消息</text>

  <path d="M 1200 480 L 1350 440" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1240" y="465" width="60" height="20" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="1270" y="479" fill="#0F172A" font-size="11" text-anchor="middle">分发消息</text>

  <!-- 内部连线（简化：主题树→QoS→输出） -->
  <path d="M 790 245 L 850 235" fill="none" stroke="#64748B" stroke-width="1" marker-end="url(#bp-arrow)"/>
  <path d="M 790 395 L 850 390" fill="none" stroke="#64748B" stroke-width="1" marker-end="url(#bp-arrow)"/>
  <path d="M 850 315 L 790 395" fill="none" stroke="#64748B" stroke-width="1" marker-end="url(#bp-arrow)"/>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头：常规消息流</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">虚线箭头：遗嘱消息流</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色框：QoS 0 处理模块</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">MQTT 发布/订阅模型与内部机制</text>
  </svg>
</svg>