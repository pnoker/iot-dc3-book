<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图9-7 协议适配网关分层架构</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图9-7 协议适配网关分层架构</title>
  <desc id="desc">协议适配层、路由与转换层、统一接口层三层架构，上行消息逐层标准化，下行配置和控制按规则回到协议适配器。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <defs>
      <marker id="ar-blue" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L11 4.5L0 9Z" fill="#2563EB"/></marker>
      <marker id="ar-grey" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#475569"/></marker>
    </defs>

    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图9-7 协议适配网关分层架构</text>
    <text x="88" y="64" font-size="12" fill="#64748B">适配层收发协议报文，核心层执行格式与语义映射，统一接口向上屏蔽设备协议差异</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 连线（先画） -->
    <!-- 上行：适配器 → 转换引擎（汇流） -->
    <g stroke="#2563EB" stroke-width="2">
      <line x1="325" y1="605" x2="325" y2="500" marker-end="url(#ar-blue)"/>
      <line x1="695" y1="605" x2="695" y2="500" marker-end="url(#ar-blue)"/>
      <line x1="1065" y1="605" x2="1065" y2="500" marker-end="url(#ar-blue)"/>
      <line x1="1435" y1="605" x2="1435" y2="500" marker-end="url(#ar-blue)"/>
      <line x1="325" y1="500" x2="1435" y2="500"/>
      <line x1="750" y1="500" x2="750" y2="460" marker-end="url(#ar-blue)"/>
      <line x1="940" y1="420" x2="1050" y2="420" marker-end="url(#ar-blue)"/>
      <line x1="1240" y1="380" x2="1240" y2="250" marker-end="url(#ar-blue)"/>
    </g>
    <!-- 下行：配置 / 控制 -->
    <path d="M560 215H105V605H148" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#ar-grey)"/>

    <!-- 连线标签 -->
    <text x="335" y="552" font-size="14" fill="#475569">消息转发</text>
    <text x="760" y="482" font-size="14" fill="#475569">映射后消息</text>
    <text x="996" y="406" font-size="14" fill="#475569">映射后消息</text>
    <text x="1250" y="318" font-size="14" fill="#475569">标准化消息</text>
    <text x="115" y="400" font-size="14" fill="#475569" transform="rotate(-90 115 400)">配置 / 控制（统一接口 → 转换引擎 → 适配器）</text>

    <!-- 统一接口层 -->
    <rect x="150" y="130" width="1590" height="140" rx="10" fill="#FFFFFF" stroke="#F97316" stroke-width="1.6"/>
    <text x="178" y="160" font-size="20" font-weight="700" fill="#0F172A">统一接口层</text>
    <text x="178" y="182" font-size="14" fill="#64748B">面向上层应用的稳定契约</text>
    <rect x="560" y="180" width="680" height="70" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="900" y="210" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">统一 API / 消息入口</text>
    <text x="900" y="234" font-size="14" fill="#475569" text-anchor="middle">REST API · 标准化 Broker</text>

    <!-- 路由与转换层 -->
    <rect x="150" y="310" width="1590" height="180" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
    <text x="178" y="340" font-size="20" font-weight="700" fill="#0F172A">路由与转换层</text>
    <text x="178" y="362" font-size="14" fill="#64748B">格式与语义映射 · 路由决策</text>
    <rect x="560" y="380" width="380" height="80" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="750" y="415" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">转换引擎</text>
    <text x="750" y="440" font-size="14" fill="#475569" text-anchor="middle">Topic ↔ URI · QoS ↔ CON/NON</text>
    <rect x="1050" y="380" width="380" height="80" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="1240" y="415" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">消息路由器</text>
    <text x="1240" y="440" font-size="14" fill="#475569" text-anchor="middle">路由决策 · 负载分配</text>

    <!-- 协议适配层 -->
    <rect x="150" y="530" width="1590" height="210" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="178" y="560" font-size="20" font-weight="700" fill="#0F172A">协议适配层</text>
    <text x="178" y="582" font-size="14" fill="#64748B">协议特有连接管理 · 确认重传与字节流收发</text>
    <rect x="150" y="605" width="350" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="325" y="660" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">MQTT Adapter</text>
    <text x="325" y="684" font-size="14" fill="#475569" text-anchor="middle">TCP · QoS</text>
    <rect x="520" y="605" width="350" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="695" y="660" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">CoAP Adapter</text>
    <text x="695" y="684" font-size="14" fill="#475569" text-anchor="middle">UDP · CON/NON</text>
    <rect x="890" y="605" width="350" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="1065" y="660" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">HTTP Adapter</text>
    <text x="1065" y="684" font-size="14" fill="#475569" text-anchor="middle">请求响应 · 认证</text>
    <rect x="1260" y="605" width="350" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="1435" y="660" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">LwM2M Adapter</text>
    <text x="1435" y="684" font-size="14" fill="#475569" text-anchor="middle">对象 · 资源模型</text>

    <!-- 图例 -->
    <rect x="150" y="778" width="1590" height="44" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="170" y1="800" x2="205" y2="800" stroke="#2563EB" stroke-width="2"/>
    <text x="216" y="805" font-size="14" fill="#475569">实线：上行消息流</text>
    <line x1="420" y1="800" x2="455" y2="800" stroke="#475569" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="466" y="805" font-size="14" fill="#475569">虚线：下行配置 / 控制流</text>
    <rect x="720" y="792" width="16" height="16" rx="3" fill="#2563EB"/>
    <text x="744" y="805" font-size="14" fill="#475569">适配层</text>
    <rect x="860" y="792" width="16" height="16" rx="3" fill="#0F766E"/>
    <text x="884" y="805" font-size="14" fill="#475569">路由与转换层</text>
    <rect x="1040" y="792" width="16" height="16" rx="3" fill="#F97316"/>
    <text x="1064" y="805" font-size="14" fill="#475569">统一接口层</text>

    <!-- 图注 -->
    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图9-7 协议适配网关通用三层架构。自下向上逐层抽象：适配层负责协议连接管理和字节流收发，路由与转换层做格式与语义映射，统一接口层向上屏蔽差异。</text>
  </svg>
</svg>
  </main>
</body>
</html>
