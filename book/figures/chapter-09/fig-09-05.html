<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图9-5 BLE GATT协议栈与服务-特征层次</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图9-5 BLE GATT协议栈与服务-特征层次</title>
  <desc id="desc">BLE 从 PHY 和 Link Layer 经 L2CAP、ATT 到 GATT，右侧展示 Service、Characteristic、Descriptor 嵌套及 CCCD 控制的 Notification 和 Indication 分支。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <defs>
      <marker id="ar-grey" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#475569"/></marker>
      <marker id="ar-green" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#0F766E"/></marker>
      <marker id="ar-orange" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#F97316"/></marker>
    </defs>

    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图9-5 BLE GATT协议栈与服务-特征层次</text>
    <text x="88" y="64" font-size="12" fill="#64748B">ATT 提供属性访问，GATT 组织服务数据模型；CCCD 选择无确认或带确认的推送路径</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 连线（先画） -->
    <path d="M490 530V480" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar-grey)"/>
    <path d="M490 400V350" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar-grey)"/>
    <path d="M490 270V220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar-grey)"/>
    <text x="500" y="510" font-size="14" fill="#475569">承载</text>
    <text x="500" y="380" font-size="14" fill="#475569">复用</text>
    <text x="500" y="250" font-size="14" fill="#475569">属性读写</text>

    <path d="M1085 370V520" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#ar-green)"/>
    <path d="M1545 370V520" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar-orange)"/>
    <text x="1095" y="450" font-size="14" fill="#0F766E">订阅 · 无确认</text>
    <text x="1555" y="450" font-size="14" fill="#F97316">订阅 · 带确认</text>

    <!-- 左面板：协议栈主链路 -->
    <rect x="130" y="120" width="720" height="560" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.4"/>
    <text x="150" y="150" font-size="20" font-weight="700" fill="#0F172A">协议栈主链路</text>
    <rect x="220" y="140" width="540" height="80" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="490" y="175" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">GATT Profile</text>
    <text x="490" y="198" font-size="13" fill="#64748B" text-anchor="middle">服务 · 特征 · 描述符数据模型</text>
    <rect x="220" y="270" width="540" height="80" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="490" y="305" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">Attribute Protocol · ATT</text>
    <text x="490" y="328" font-size="13" fill="#64748B" text-anchor="middle">属性数据库读写与通知承载</text>
    <rect x="220" y="400" width="540" height="80" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="490" y="435" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">L2CAP</text>
    <text x="490" y="458" font-size="13" fill="#64748B" text-anchor="middle">逻辑通道复用</text>
    <rect x="220" y="530" width="540" height="80" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
    <text x="490" y="565" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">PHY + Link Layer</text>
    <text x="490" y="588" font-size="13" fill="#64748B" text-anchor="middle">射频与链路管理</text>

    <!-- 右面板：应用数据模型 -->
    <rect x="890" y="120" width="850" height="560" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="915" y="150" font-size="20" font-weight="700" fill="#0F172A">应用数据模型</text>
    <rect x="930" y="175" width="770" height="300" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="955" y="200" font-size="18" font-weight="700" fill="#0F172A">Device</text>
    <rect x="975" y="210" width="680" height="255" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.6"/>
    <text x="1000" y="235" font-size="17" font-weight="700" fill="#0F172A">Service · Heart Rate</text>
    <text x="1000" y="256" font-size="13" fill="#64748B">服务：心率功能组</text>
    <rect x="1020" y="250" width="590" height="200" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="1045" y="275" font-size="16" font-weight="700" fill="#0F172A">Characteristic · HRM</text>
    <text x="1045" y="296" font-size="13" fill="#64748B">Value：心率数值  Properties：Read | Notify</text>
    <rect x="1065" y="290" width="500" height="80" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="1090" y="315" font-size="16" font-weight="700" fill="#0F172A">Descriptor · CCCD</text>
    <text x="1090" y="338" font-size="13" fill="#64748B">推送使能配置</text>
    <text x="955" y="465" font-size="14" fill="#475569">包含关系：Device → Service → Characteristic → Descriptor</text>

    <!-- 分支卡片 -->
    <rect x="930" y="520" width="310" height="80" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="1085" y="552" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">Notification</text>
    <text x="1085" y="576" font-size="13" fill="#475569" text-anchor="middle">无 ACK · 周期数据 · 低开销</text>
    <rect x="1390" y="520" width="310" height="80" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="1545" y="552" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">Indication</text>
    <text x="1545" y="576" font-size="13" fill="#475569" text-anchor="middle">逐包确认 · 关键结果 · 较高开销</text>

    <!-- 图例 -->
    <rect x="130" y="730" width="1610" height="46" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="150" y="745" width="16" height="16" rx="3" fill="#0F766E"/>
    <text x="174" y="758" font-size="14" fill="#475569">硬件链路</text>
    <rect x="320" y="745" width="16" height="16" rx="3" fill="#2563EB"/>
    <text x="344" y="758" font-size="14" fill="#475569">协议栈核心</text>
    <rect x="490" y="745" width="16" height="16" rx="3" fill="#F97316"/>
    <text x="514" y="758" font-size="14" fill="#475569">应用数据模型</text>
    <line x1="720" y1="753" x2="755" y2="753" stroke="#475569" stroke-width="2"/>
    <text x="766" y="758" font-size="14" fill="#475569">实线：主路径</text>
    <line x1="940" y1="753" x2="975" y2="753" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="986" y="758" font-size="14" fill="#475569">虚线：配置 / 带确认路径</text>

    <!-- 图注 -->
    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图9-5 BLE GATT 协议栈层次及 Service-Characteristic-Descriptor 嵌套结构，右半部分展示 Notification 与 Indication 的执行路径分叉。</text>
  </svg>
</svg>
  </main>
