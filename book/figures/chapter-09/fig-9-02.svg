  <text x="900" y="936" font-size="10" fill="#94A3B8" text-anchor="middle">图9-2  MQTT 以 Broker 为中心：发布者按 QoS 等级投递并可选保留消息，Broker 用会话表维护订阅与离线缓存、用遗嘱表在客户端非正常断开时代发离线，</text>
  <text x="900" y="953" font-size="10" fill="#94A3B8" text-anchor="middle">Keep Alive 超时（1.5 倍）是触发遗嘱的判据——六类机制围绕 Broker 协同，共同支撑不可靠网络下的可控服务质量。</text>
