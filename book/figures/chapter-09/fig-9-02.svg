<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="60.000" width="1152.000" height="640.000" viewBox="0 0 1800.000 1000.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <!-- ============== TITLE AREA ============== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图9-2  MQTT 核心机制全景</text>
  <text x="84" y="70" font-size="12" fill="#64748B">以 Broker 为中心整合六类机制：发布/订阅 · 主题通配符 · QoS 三级 · 会话/心跳 · 遗嘱 · 保留消息</text>
  <text x="84" y="89" font-size="10" fill="#94A3B8">①发布/订阅  ②通配符  ③QoS  ④会话/心跳  ⑤遗嘱  ⑥保留 —— 编号对应图中徽章</text>

  <rect x="1658" y="28" width="122" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1719" y="47" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">ARCHITECTURE</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ============== PUBLISHER (edge / green) ============== -->
  <rect x="70" y="210" width="250" height="340" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="90" y="240" font-size="15" font-weight="700" fill="#0F172A">发布者 Publisher</text>
  <text x="90" y="258" font-size="10" fill="#64748B">边缘设备 / 传感器 · PUBLISH 客户端</text>

  <rect x="90" y="272" width="210" height="32" rx="4" fill="#F8FAFC" stroke="#10B981" stroke-width="1"/>
  <circle cx="106" cy="288" r="5" fill="none" stroke="#10B981" stroke-width="1.4"/>
  <line x1="106" y1="283" x2="106" y2="288" stroke="#10B981" stroke-width="1.4"/>
  <text x="120" y="292" font-size="11" fill="#0F172A">dev-01 · MQTT Client</text>

  <!-- message row QoS 0 -->
  <rect x="90" y="318" width="210" height="40" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="90" y="318" width="4" height="40" fill="#64748B"/>
  <text x="104" y="335" font-size="11" font-weight="700" fill="#0F172A">QoS 0   home/sensor/temp</text>
  <text x="104" y="350" font-size="9" fill="#64748B">payload 23.5 °C</text>

  <!-- message row QoS 1 + RETAIN -->
  <rect x="90" y="366" width="210" height="40" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="90" y="366" width="4" height="40" fill="#F59E0B"/>
  <text x="104" y="383" font-size="11" font-weight="700" fill="#0F172A">QoS 1   home/+/status</text>
  <rect x="234" y="372" width="56" height="15" rx="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="262" y="383" font-size="8" font-weight="700" fill="#7C3AED" text-anchor="middle">RETAIN</text>
  <text x="104" y="398" font-size="9" fill="#64748B">payload ONLINE</text>

  <!-- message row QoS 2 -->
  <rect x="90" y="414" width="210" height="40" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="90" y="414" width="4" height="40" fill="#7C3AED"/>
  <text x="104" y="431" font-size="11" font-weight="700" fill="#0F172A">QoS 2   cmd/home/light</text>
  <text x="104" y="446" font-size="9" fill="#64748B">payload ON</text>

  <text x="90" y="478" font-size="9" fill="#94A3B8">按 QoS 等级向 Broker 投递</text>
  <text x="90" y="492" font-size="9" fill="#94A3B8">RETAIN=1 时 Broker 持久化最新值</text>

  <!-- ============== PUBLISH ARROWS : publisher -> broker (QoS 三级 ③) ============== -->
  <circle cx="395" cy="268" r="11" fill="#F59E0B"/>
  <text x="395" y="272" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="412" y="272" font-size="10" font-weight="700" fill="#F59E0B">QoS 投递等级</text>

  <line x1="320" y1="338" x2="470" y2="338" stroke="#64748B" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="395" y="330" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">QoS 0 · 至多一次</text>

  <line x1="320" y1="386" x2="470" y2="386" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
  <text x="395" y="378" font-size="10" font-weight="600" fill="#F59E0B" text-anchor="middle">QoS 1 · 至少一次 (PUBACK)</text>

  <line x1="320" y1="434" x2="470" y2="434" stroke="#7C3AED" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="395" y="426" font-size="10" font-weight="600" fill="#7C3AED" text-anchor="middle">QoS 2 · 恰好一次 (四步)</text>

  <!-- ============== BROKER (platform / blue, dashed boundary) ============== -->
  <rect x="470" y="150" width="640" height="510" rx="12" fill="#FAFBFF" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 4"/>
  <!-- ① pub/sub -->
  <circle cx="490" cy="182" r="11" fill="#2563EB"/>
  <text x="490" y="186" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="510" y="188" font-size="16" font-weight="700" fill="#0F172A">MQTT Broker · 中心消息总线</text>
  <text x="510" y="205" font-size="10" fill="#64748B">按主题路由 · 解耦发布者与订阅者（发布/订阅 ①）</text>

  <!-- ② wildcard matching hint (right of broker title row) -->
  <circle cx="1004" cy="186" r="10" fill="#2563EB"/>
  <text x="1004" y="190" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="1020" y="190" font-size="10" fill="#64748B">通配符匹配</text>

  <!-- —— internal block 1: session table ④ —— -->
  <rect x="500" y="222" width="580" height="132" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="516" cy="244" r="10" fill="#7C3AED"/>
  <text x="516" y="248" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="534" y="248" font-size="13" font-weight="700" fill="#0F172A">会话表  Session Table</text>
  <text x="534" y="264" font-size="9" fill="#64748B">持久会话 · 维护订阅与离线消息缓存</text>
  <rect x="510" y="272" width="560" height="18" rx="3" fill="#F8FAFC"/>
  <text x="516" y="285" font-size="9" font-weight="700" fill="#475569">ClientID</text>
  <text x="620" y="285" font-size="9" font-weight="700" fill="#475569">订阅主题（含通配符）</text>
  <text x="930" y="285" font-size="9" font-weight="700" fill="#475569">离线队列</text>
  <text x="1030" y="285" font-size="9" font-weight="700" fill="#475569">在线</text>
  <line x1="510" y1="292" x2="1070" y2="292" stroke="#E2E8F0"/>
  <text x="516" y="309" font-size="10" fill="#0F172A">dev-01</text>
  <text x="620" y="309" font-size="10" fill="#7C3AED">home/+/temp</text>
  <text x="930" y="309" font-size="10" fill="#0F172A">3 条</text>
  <circle cx="1037" cy="306" r="3.5" fill="#10B981"/>
  <text x="1048" y="309" font-size="9" fill="#10B981">on</text>
  <text x="516" y="327" font-size="10" fill="#0F172A">app-02</text>
  <text x="620" y="327" font-size="10" fill="#7C3AED">home/#</text>
  <text x="930" y="327" font-size="10" fill="#0F172A">0</text>
  <circle cx="1037" cy="324" r="3.5" fill="#10B981"/>
  <text x="1048" y="327" font-size="9" fill="#10B981">on</text>
  <text x="516" y="345" font-size="10" fill="#0F172A">gw-03</text>
  <text x="620" y="345" font-size="10" fill="#7C3AED">home/sensor/temp</text>
  <text x="930" y="345" font-size="10" fill="#0F172A">1 条</text>
  <circle cx="1037" cy="342" r="3.5" fill="#E11D48"/>
  <text x="1048" y="345" font-size="9" fill="#E11D48">off</text>

  <!-- —— internal block 2: retained store ⑥ —— -->
  <rect x="500" y="366" width="580" height="100" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="516" cy="388" r="10" fill="#7C3AED"/>
  <text x="516" y="392" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="534" y="392" font-size="13" font-weight="700" fill="#0F172A">保留消息存储  Retained Store</text>
  <text x="534" y="408" font-size="9" fill="#64748B">每主题仅留最新一条；新订阅者上线即补推（冷启动状态补偿）</text>
  <line x1="510" y1="416" x2="1070" y2="416" stroke="#E2E8F0"/>
  <text x="516" y="433" font-size="10" fill="#0F172A">home/+/status</text>
  <text x="900" y="433" font-size="10" fill="#64748B">→</text>
  <text x="918" y="433" font-size="10" font-weight="700" fill="#7C3AED">"ONLINE"</text>
  <text x="516" y="451" font-size="10" fill="#0F172A">config/ver</text>
  <text x="900" y="451" font-size="10" fill="#64748B">→</text>
  <text x="918" y="451" font-size="10" font-weight="700" fill="#7C3AED">"2.1.0"</text>

  <!-- —— internal block 3: will registry ⑤ —— -->
  <rect x="500" y="478" width="580" height="162" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="516" cy="500" r="10" fill="#E11D48"/>
  <text x="516" y="504" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="534" y="504" font-size="13" font-weight="700" fill="#0F172A">遗嘱注册表  Will Registry (LWT)</text>
  <text x="534" y="520" font-size="9" fill="#64748B">CONNECT 时登记；客户端非正常断开由 Broker 代发</text>
  <rect x="510" y="528" width="560" height="18" rx="3" fill="#F8FAFC"/>
  <text x="516" y="541" font-size="9" font-weight="700" fill="#475569">ClientID</text>
  <text x="620" y="541" font-size="9" font-weight="700" fill="#475569">遗嘱 topic</text>
  <text x="860" y="541" font-size="9" font-weight="700" fill="#475569">payload</text>
  <text x="1040" y="541" font-size="9" font-weight="700" fill="#475569">QoS</text>
  <line x1="510" y1="548" x2="1070" y2="548" stroke="#E2E8F0"/>
  <text x="516" y="565" font-size="10" fill="#0F172A">dev-01</text>
  <text x="620" y="565" font-size="10" fill="#0F172A">status/dev-01</text>
  <text x="860" y="565" font-size="10" font-weight="700" fill="#E11D48">"OFFLINE"</text>
  <text x="1040" y="565" font-size="10" fill="#0F172A">1</text>
  <text x="516" y="583" font-size="10" fill="#0F172A">app-02</text>
  <text x="620" y="583" font-size="10" fill="#0F172A">status/app-02</text>
  <text x="860" y="583" font-size="10" font-weight="700" fill="#E11D48">"gone"</text>
  <text x="1040" y="583" font-size="10" fill="#0F172A">0</text>
  <text x="516" y="601" font-size="10" fill="#0F172A">gateway</text>
  <text x="620" y="601" font-size="10" fill="#0F172A">alert/gw</text>
  <text x="860" y="601" font-size="10" font-weight="700" fill="#E11D48">"DOWN"</text>
  <text x="1040" y="601" font-size="10" fill="#0F172A">2</text>
  <line x1="510" y1="612" x2="1070" y2="612" stroke="#F1F5F9"/>
  <text x="516" y="630" font-size="9" fill="#94A3B8">正常 DISCONNECT 不触发；TCP 异常 / 1.5× Keep Alive 超时 ⇒ 代发 LWT 后移除</text>

  <!-- ============== SUBSCRIBERS (edge / green) ============== -->
  <rect x="1340" y="210" width="210" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1356" y="236" font-size="14" font-weight="700" fill="#0F172A">订阅者 app-02</text>
  <text x="1356" y="254" font-size="9" fill="#64748B">手机 App · 全屋聚合</text>
  <rect x="1356" y="264" width="178" height="26" rx="4" fill="#F8FAFC" stroke="#10B981" stroke-width="1"/>
  <text x="1445" y="281" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">订阅  home/#</text>
  <text x="1356" y="307" font-size="9" fill="#94A3B8"># 匹配多层主题</text>

  <rect x="1340" y="350" width="210" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1356" y="376" font-size="14" font-weight="700" fill="#0F172A">订阅者 app-03</text>
  <text x="1356" y="394" font-size="9" fill="#64748B">数据看板 · 实时温度</text>
  <rect x="1356" y="404" width="178" height="26" rx="4" fill="#F8FAFC" stroke="#10B981" stroke-width="1"/>
  <text x="1445" y="421" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">订阅  home/+/temp</text>
  <text x="1356" y="447" font-size="9" fill="#94A3B8">+ 匹配单个主题层</text>

  <rect x="1340" y="490" width="210" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1356" y="516" font-size="14" font-weight="700" fill="#0F172A">订阅者 app-04</text>
  <text x="1356" y="534" font-size="9" fill="#64748B">单设备监控 · 告警</text>
  <rect x="1356" y="544" width="178" height="26" rx="4" fill="#F8FAFC" stroke="#10B981" stroke-width="1"/>
  <text x="1445" y="561" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">订阅  home/sensor/temp</text>
  <text x="1356" y="587" font-size="9" fill="#94A3B8">精确匹配</text>

  <!-- ============== BROKER -> SUBSCRIBERS (main path / blue, 通配符匹配 ②) ============== -->
  <line x1="1110" y1="265" x2="1340" y2="265" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1225" y="257" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">匹配 home/#</text>

  <line x1="1110" y1="405" x2="1340" y2="405" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1225" y="397" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">匹配 home/+/temp</text>

  <line x1="1110" y1="545" x2="1340" y2="545" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1225" y="537" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">精确匹配 home/sensor/temp</text>

  <!-- RETAIN back-push to newly-online subscriber (purple dashed) -->
  <path d="M 1080 416 Q 1200 360 1340 300" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-purple)"/>
  <text x="1186" y="356" font-size="9" fill="#7C3AED" text-anchor="middle">新订阅者补推保留消息</text>

  <!-- ============== MAIN-BODY SEPARATOR ============== -->
  <line x1="40" y1="688" x2="1760" y2="688" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ============== TIMELINE : Keep Alive & Will timeout ④ ============== -->
  <circle cx="500" cy="714" r="10" fill="#7C3AED"/>
  <text x="500" y="718" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="518" y="718" font-size="13" font-weight="700" fill="#0F172A">Keep Alive 心跳与遗嘱超时判定</text>
  <text x="518" y="735" font-size="10" fill="#64748B">客户端须在 Keep Alive 内发 PINGREQ；Broker 在 1.5× 内未收到 → 判定离线并代发遗嘱</text>

  <!-- axis -->
  <line x1="500" y1="832" x2="1110" y2="832" stroke="#64748B" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="1120" y="836" font-size="10" fill="#64748B">时间</text>

  <!-- tick 0s -->
  <circle cx="500" cy="832" r="4.5" fill="#64748B"/>
  <text x="500" y="858" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">0s</text>
  <text x="500" y="872" font-size="9" fill="#64748B" text-anchor="middle">CONNECT 登记遗嘱</text>

  <!-- tick 60s : PINGREQ -->
  <line x1="870" y1="824" x2="870" y2="840" stroke="#10B981" stroke-width="2"/>
  <rect x="836" y="800" width="68" height="18" rx="3" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  <text x="870" y="813" font-size="9" font-weight="700" fill="#10B981" text-anchor="middle">PINGREQ</text>
  <line x1="870" y1="818" x2="870" y2="824" stroke="#10B981" stroke-width="1.5"/>
  <text x="870" y="858" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">60s</text>
  <text x="870" y="872" font-size="9" fill="#64748B" text-anchor="middle">Keep Alive 周期</text>

  <!-- tick 90s : timeout (red) -->
  <line x1="1060" y1="820" x2="1060" y2="844" stroke="#E11D48" stroke-width="3"/>
  <text x="1060" y="858" font-size="10" font-weight="700" fill="#E11D48" text-anchor="middle">90s = 1.5×</text>
  <text x="1060" y="872" font-size="9" fill="#E11D48" text-anchor="middle">超时判定离线</text>

  <!-- no-heartbeat danger zone -->
  <rect x="870" y="828" width="190" height="8" fill="#E11D48" opacity="0.10"/>

  <!-- red dashed trigger line: 90s tick -> will registry -->
  <line x1="1060" y1="818" x2="1060" y2="648" stroke="#E11D48" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-red)"/>
  <rect x="868" y="660" width="184" height="30" rx="4" fill="#FFFFFF" stroke="#E11D48" stroke-width="1"/>
  <text x="960" y="679" font-size="10" font-weight="700" fill="#E11D48" text-anchor="middle">1.5× 超时 → 触发遗嘱代发</text>

  <!-- ============== LEGEND ============== -->
  <rect x="1180" y="708" width="580" height="168" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1196" y="732" font-size="12" font-weight="700" fill="#0F172A">图例  Legend</text>
  <line x1="1196" y1="740" x2="1744" y2="740" stroke="#E2E8F0" stroke-width="1"/>

  <!-- col 1 -->
  <line x1="1200" y1="762" x2="1234" y2="762" stroke="#64748B" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="1244" y="766" font-size="10" fill="#0F172A">QoS 0 · 至多一次</text>

  <line x1="1200" y1="788" x2="1234" y2="788" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
  <text x="1244" y="792" font-size="10" fill="#0F172A">QoS 1 · 至少一次 (PUBACK)</text>

  <line x1="1200" y1="814" x2="1234" y2="814" stroke="#7C3AED" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="1244" y="818" font-size="10" fill="#0F172A">QoS 2 · 恰好一次 (四步)</text>

  <rect x="1200" y="836" width="34" height="14" rx="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="1217" y="847" font-size="8" font-weight="700" fill="#7C3AED" text-anchor="middle">RTN</text>
  <text x="1244" y="847" font-size="10" fill="#0F172A">RETAIN · 保留最新消息</text>

  <!-- col 2 -->
