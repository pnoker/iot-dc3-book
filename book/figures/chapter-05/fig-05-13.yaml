legend:
- 实线箭头（浅灰）=传感器数据上行流
- 实线箭头（橙色，加粗）=本地紧急停机控制流（不经过云端）
- 虚线箭头（深灰）=告警事件下行流（通知工程师）
- 虚线箭头（蓝色，虚线点划线）=云端指令下行流（远程控制参数）
- 绿色圆点（在电机图标旁）=设备运行状态：正常
- 黄色圆点=设备运行状态：预警（二级阈值触发）
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: 使用四层分层布局，每层用浅色背景矩形框（浅蓝、浅绿、浅黄、浅灰）区分。组件框用圆角矩形，内填组件名称和简要功能文字。电机用简化圆形+M图。数据流箭头的颜色和样式严格遵循图例。橙色紧急停机流直接从边缘层指向电机，不可到达消息层和云层。下行指令流用蓝色虚线点画线，与上行实线区分。每层框右下角标注L1~L4层级编号。
