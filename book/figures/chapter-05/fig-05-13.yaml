type: architecture
title: 图 5-13 工厂设备状态监控系统四层架构图（例子）
audience_takeaway: 读者应理解边缘两级阈值把安全与智能分流：一级阈值本地GPIO直接停机不经云端，二级及以上才经MQTT/Kafka上云做AI分析。
purpose: 展示设备层、边缘层、消息层、云层四层架构，以及传感器数据从现场到告警的完整流经路径，包括本地紧急停机路径和云端AI分析路径。
visual_focus: 从起点到邮件/短信通知后采取行动的主链路。
design_level: logical
layout: 自上而下的四层结构，每层用浅色背景矩形框区分。层间箭头表示数据流方向，本地紧急停机路径用橙色粗箭头标出，与云端链路形成对比。
elements:
- L1 设备层：30台电机（简化圆形+M），每台下署三轴加速度计和PT100温度传感器，总线为Modbus RTU RS-485。
- L2 边缘层（x86工控机框）：内含Node-RED图标、Mosquitto图标、SQLite缓存图标、GPIO紧急停机输出图标。
- L3 消息层：Kafka集群（3节点），Topic分为 factory/vibration, factory/temperature, alarm-command, alarm-events；接入端为EMQX Edge桥接。
- L4 云层：InfluxDB 3.x、AI异常检测服务（Python scikit-learn）、Grafana仪表盘、告警服务（SMTP+短信API）。
relationships:
- 设备层通过Modbus RTU（9600bps）向边缘层推送传感器数据。
- 边缘层Node-RED解析并做两级阈值判断：超过一级阈值→GPIO输出紧急停机信号（橙色箭头，不经过消息层和云层）
- 超过二级阈值或正常→发布MQTT消息至Mosquitto。同时写入SQLite缓存。
- Mosquitto的MQTT消息通过EMQX Edge桥接转发至Kafka上行Topic。
- Kafka消费者服务（Python daemon）消费上行Topic，写入InfluxDB热分区
- InfluxDB持续查询触发降采样写入冷存储。
- AI服务从InfluxDB拉取最近2小时窗口数据，运行孤立森林模型，输出异常得分，低于阈值时生成告警事件并发布到Kafka的alarm-events Topic。
- 告警服务消费alarm-events，调用SMTP和短信API发送通知。
- Grafana从InfluxDB读取数据，绘制仪表盘，显示实时曲线、历史趋势和告警事件列表。
- 工程师通过Grafana查看仪表盘，或收到邮件/短信通知后采取行动。
- 云端下行指令（阈值更新、模型参数下发）由管理员发布到Kafka的alarm-command Topic，经MQTT Bridge下发到边缘层。
