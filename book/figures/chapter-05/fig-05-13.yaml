labels:
  en:
    图 5-13 工厂设备状态监控系统四层架构图（例子）: Figure 5-13 Four-Layer Factory Equipment Monitoring (Example)
    本地硬阈值保障安全，二级告警与常规数据上云进行 AI 分析。: Local hard thresholds keep it safe; level-2 alarms and routine data go to the cloud for AI analysis.
    数据上行: Data Uplink
    参数下发: Parameter Push
    一级阈值触发: Level-1 threshold tripped
    本地紧急停机（不经云端）: Local emergency stop (no cloud)
    云层: Cloud Layer
    时序存储 · 冷热分层: Time-Series Storage · Hot/Cold Tiers
    AI 异常检测: AI Anomaly Detection
    scikit-learn 孤立森林: scikit-learn Isolation Forest
    Grafana 仪表盘: Grafana Dashboards
    实时曲线 · 历史趋势: Real-Time Curves · Trends
    告警服务: Alarm Service
    SMTP + 短信 API: SMTP + SMS API
    消息层: Message Layer
    EMQX Edge 桥接: EMQX Edge Bridge
    MQTT → Kafka 上行: MQTT → Kafka uplink
    Kafka 集群（3 节点）: Kafka Cluster (3 nodes)
    下行指令 / 告警事件 Topic: Downlink Command / Alarm-Event Topics
    边缘层: Edge Layer
    解析 + 两级阈值判断: Parsing + Two-Level Thresholds
    SQLite 缓存: SQLite Cache
    断网本地缓存: Offline local cache
    GPIO 紧急停机: GPIO Emergency Stop
    一级阈值本地输出: Level-1 local output
    设备层: Device Layer
    ×30 台电机: ×30 Motors
    三轴加速度计: Triaxial Accelerometer
    振动采集: Vibration Acquisition
    PT100 温度传感器: PT100 Temperature Sensor
    温度采集: Temperature Acquisition
    9600 bps 总线: 9600 bps Bus
    传感器数据上行流: Sensor data uplink
    本地紧急停机控制流（不经云端）: Local emergency-stop flow (no cloud)
    云端指令下行流: Cloud command downlink
    正常: Normal
    预警（二级阈值）: Warning (level-2 threshold)
    图 5-13 工厂设备状态监控系统四层架构图：安全停机留在边缘确定性链路，云端负责长期分析、告警通知与参数管理。: 'Figure 5-13 Four-layer architecture of a factory equipment monitoring system: safety shutdowns stay on the deterministic edge path, while the cloud handles long-term analysis, alarm notification, and parameter management.'
