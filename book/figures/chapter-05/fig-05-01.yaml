caption:
  zh: 图 5-1 物联网平台分层架构示意。感知层采集物理信号并数字化，经网络层传输至平台层；平台层完成协议转换、消息缓冲、规则判断与存储，最后通过API暴露给应用层；应用层提供人机交互与决策支持。
  en: 'Figure 5-1 Layered architecture of an IoT platform. The sensing layer digitizes physical signals and transports them through the network layer to the platform layer; the platform layer performs protocol conversion, message buffering, rule evaluation, and storage, then exposes everything to the application layer through APIs; the application layer provides human-machine interaction and decision support.'
labels:
  en:
    图 5-1 物联网平台分层架构示意: Figure 5-1 Layered IoT Platform Architecture
    平台层承上启下：数据向上汇聚，控制指令向下传递。: 'The platform layer bridges: data converges upward, commands pass downward.'
    数据上行: Data up
    控制下行: Control down
    应用层: Application Layer
    监控大屏 · 移动 App · AI 模型 · 企业系统集成: Dashboards · Apps · AI Models · Enterprise Integration
    平台层: Platform Layer
    设备接入: Device Access
    协议适配: Protocol Adaptation
    消息处理: Message Processing
    队列缓冲: Queue Buffering
    存储: Storage
    时序 / 关系库: Time-Series / Relational DB
    应用使能: App Enablement
    API / 订阅: API / Subscription
    网络层: Network Layer
    无线局域网 · 蜂窝 / LPWAN · 有线: WLAN · Cellular / LPWAN · Wired
    感知层: Sensing Layer
    传感器 · 执行器 · RFID: Sensors · Actuators · RFID
    数据流（上行感知数据）: Data flow (upstream data)
    控制流（下行命令）: Control flow (downlink commands)
    平台层内部处理顺序: Platform-layer processing order
    图 5-1 物联网平台分层架构示意：感知层采集物理信号并数字化，经网络层传输至平台层完成协议转换、消息缓冲、规则判断与存储，再通过 API 暴露给应用层提供人机交互与决策支持。: 'Figure 5-1 Layered IoT platform architecture: the sensing layer digitizes physical signals and sends them through the network layer to the platform, which performs protocol conversion, message buffering, rule evaluation, and storage, then exposes them via APIs to the application layer for human-machine interaction and decision support.'
