type: layered
title: 图 5-1 物联网平台分层架构示意
purpose: 展示从感知层到应用层的标准四层模型，并明确平台层在这一模型中的桥梁位置
audience_takeaway: 物联网的四层职责边界，以及数据流和控制流的方向差异。
visual_focus: 数据流的绿色箭头从感知层向上贯穿至应用层，控制流的蓝色箭头反向；平台层内部组件顺序关系用水平箭头表示。
design_level: logical
layout: 自下而上四个矩形堆叠，每层宽度一致，颜色不同；平台层内部用四个更小的水平方块表示组件流程。
elements:
- '感知层（浅绿）: 传感器、执行器、RFID'
- '网络层：浅蓝: 无线局域网、蜂窝、LPWAN、有线'
- '平台层（浅橙）: 设备接入 → 消息处理 → 存储 → 应用使能'
- '应用层（浅紫）: 监控大屏、移动App、AI模型、企业系统集成'
relationships:
- '数据流（绿色实线箭头）: 感知层 → 网络层 → 平台层 → 应用层'
- '控制流（蓝色实线箭头）: 应用层 → 平台层 → 网络层 → 感知层'
- '平台内部流（橙色水平箭头）: 设备接入 → 消息处理 → 存储 → 应用使能'
legend:
- '绿色箭头: 数据流（上行感知数据）'
- '蓝色箭头: 控制流（下行命令）'
- '橙色水平箭头: 平台层内部处理顺序'
- 背景色：感知层-浅绿，网络层-浅蓝，平台层-浅橙，应用层-浅紫
visual_constraints:
- 节点标签使用短名词，解释性文字放入callouts或正文。
- 箭头线型统一，不出现多重交叉。
- 图例置于底部，不遮挡主体。
render_notes: HTML/SVG渲染，浅色背景，各层矩形宽度比例1:1:1:1，高度比例1:1.5:2:1.2；平台层内部四个方块宽度均匀，箭头使用标准三角头；图例使用小号字体。
