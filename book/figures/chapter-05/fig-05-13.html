<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图5-13 平台层核心组件：消息队列、时序数据库、规则引擎</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">图5-13 平台层核心组件：消息队列、时序数据库、规则引擎</title>
  <desc id="desc">消息队列缓冲流量、时序数据库高效存储、规则引擎智能判断，三组件选型相互影响。</desc>
  <rect width="1200" height="700" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="580" viewBox="0 0 1800 950" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="950" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
  </defs>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图5-13 平台层核心组件：消息队列、时序数据库、规则引擎</text>
  <text x="88" y="64" font-size="12" fill="#64748B">分别解决数据缓冲、高效存储、智能判决，选型决定吞吐、成本与时效</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 消息队列 -->
  <rect x="80" y="140" width="520" height="380" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="80" y="140" width="520" height="48" rx="12" fill="#2563EB"/>
  <rect x="80" y="168" width="520" height="20" fill="#2563EB"/>
  <text x="340" y="172" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">消息队列：数据缓冲带</text>
  <text x="116" y="232" font-size="12" fill="#475569">发布/订阅解耦生产与消费</text>
  <text x="116" y="258" font-size="12" fill="#475569">设备洪峰时后端不被瞬时冲垮</text>
  <text x="116" y="296" font-size="12" font-weight="700" fill="#0F172A">选型对比</text>
  <text x="116" y="322" font-size="11" fill="#475569">MQTT Broker：设备端轻量代理，长连接推模式</text>
  <text x="116" y="348" font-size="11" fill="#475569">Kafka：顺序写磁盘 + 分区，海量后端管道</text>
  <text x="116" y="374" font-size="11" fill="#475569">RabbitMQ：灵活路由 + 确认，业务集成</text>
  <text x="116" y="412" font-size="11" fill="#475569">三者不互斥：MQTT 收 → Kafka/RabbitMQ 分发</text>
  <text x="116" y="452" font-size="11" fill="#64748B">通常最先选型，决定抗洪峰能力</text>

  <line x1="600" y1="330" x2="632" y2="330" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- 时序数据库 -->
  <rect x="632" y="140" width="520" height="380" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="632" y="140" width="520" height="48" rx="12" fill="#16A34A"/>
  <rect x="632" y="168" width="520" height="20" fill="#16A34A"/>
  <text x="892" y="172" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">时序数据库：专为时间印记优化</text>
  <text x="668" y="232" font-size="12" fill="#475569">数据点 = 时间戳 + 标签 + 数值字段</text>
  <text x="668" y="258" font-size="12" fill="#475569">改存储引擎 + 极致写入压缩</text>
  <text x="668" y="296" font-size="12" font-weight="700" fill="#0F172A">两条技术路线</text>
  <text x="668" y="322" font-size="11" fill="#475569">InfluxDB：TSM 引擎（LSM 变体）+ WAL</text>
  <text x="668" y="348" font-size="11" fill="#475569">差分编码 + delta-of-delta 压缩，TICK 生态</text>
  <text x="668" y="374" font-size="11" fill="#475569">TimescaleDB：基于 PostgreSQL，超表按时间分 Chunk</text>
  <text x="668" y="412" font-size="11" fill="#475569">SQL 兼容好，查询只扫涉及分区</text>
  <text x="668" y="452" font-size="11" fill="#64748B">压缩比决定硬件成本与查询性能</text>

  <line x1="1152" y1="330" x2="1184" y2="330" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- 规则引擎 -->
  <rect x="1184" y="140" width="536" height="380" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <rect x="1184" y="140" width="536" height="48" rx="12" fill="#F97316"/>
  <rect x="1184" y="168" width="536" height="20" fill="#F97316"/>
  <text x="1452" y="172" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">规则引擎：从阈值到 CEP</text>
  <text x="1220" y="232" font-size="12" fill="#475569">简单阈值：温度超 80℃ 告警</text>
  <text x="1220" y="258" font-size="12" fill="#475569">CEP：时间窗口内多事件模式匹配</text>
  <text x="1220" y="296" font-size="12" font-weight="700" fill="#0F172A">两种部署形态</text>
  <text x="1220" y="322" font-size="11" fill="#475569">边缘：毫秒级响应（切断危险电源）</text>
  <text x="1220" y="348" font-size="11" fill="#475569">云端：分析跨度大、依赖历史数据</text>
  <text x="1220" y="374" font-size="11" fill="#475569">例：5 分钟内三次电流尖峰 + 温度上升 → 轴承故障</text>
  <text x="1220" y="412" font-size="11" fill="#475569">规则引擎解决确定性逻辑</text>
  <text x="1220" y="452" font-size="11" fill="#64748B">AI 解决非确定性模式，两者互补</text>

  <!-- 选型相互影响 -->
  <rect x="80" y="590" width="1640" height="160" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="622" font-size="14" font-weight="700" fill="#334155">三组件选型相互影响</text>
  <text x="120" y="656" font-size="12" fill="#475569">消息队列吞吐 → 决定时序数据库写入压力 · 规则引擎实时性 → 依赖队列延迟</text>
  <text x="120" y="682" font-size="12" fill="#475569">工程顺序：消息队列最先选型（抗洪峰）→ 时序数据库压缩比定硬件成本 → 规则引擎按延迟要求确认是否下放边缘</text>
  <text x="120" y="708" font-size="12" fill="#475569">IoT DC3 落地：采集值封装位号值对象 → 写入时序库 → 经消息队列缓冲 → 规则引擎消费</text>
  <text x="120" y="734" font-size="11" fill="#64748B">组件选型是通用工程决策，与具体平台无关；时序库权衡见 5.4 节，完整落地见第 14 章</text>

  <!-- Caption -->
  <text x="900" y="910" font-size="17" fill="#475569" text-anchor="middle">图5-13 消息队列缓冲流量、时序数据库高效存储、规则引擎智能判断，三组件选型相互影响：队列吞吐决定时序库写入压力，规则引擎实时性依赖队列延迟，通常消息队列最先选型。</text>
  </svg>
</svg>
  </main>

</html>
