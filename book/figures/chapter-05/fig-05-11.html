<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图 5-11 从数据采集到告警触发的预测性维护流程</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图 5-11 从数据采集到告警触发的预测性维护流程</title>
  <desc id="desc">采集数据经过预测和残差评分，连续异常触发告警，运维确认结果反馈到模型更新。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <defs>
      <marker id="mk-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
      <marker id="mk-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#DC2626"/></marker>
      <marker id="mk-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
      <marker id="mk-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    </defs>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 5-11 从数据采集到告警触发的预测性维护流程</text>
    <text x="88" y="64" font-size="12" fill="#64748B">实际值与预测区间形成残差；连续异常触发告警，确认结果进入反馈闭环。</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 主链路连线（先画） -->
    <line x1="290" y1="310" x2="338" y2="310" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="530" y1="310" x2="578" y2="310" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="770" y1="310" x2="818" y2="310" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="1010" y1="310" x2="968" y2="310" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="1170" y1="310" x2="1188" y2="310" stroke="#DC2626" stroke-width="2.4" marker-end="url(#mk-red)"/>
    <text x="1179" y="294" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">是</text>
    <line x1="1070" y1="365" x2="1070" y2="438" stroke="#64748B" stroke-width="2.2" marker-end="url(#mk-gray)"/>
    <text x="1088" y="410" font-size="14" font-weight="700" fill="#64748B" text-anchor="middle">否</text>

    <!-- 反馈回路连线（先画） -->
    <path d="M1295 360 L1120 500 L1030 598" fill="none" stroke="#0F766E" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#mk-teal)"/>
    <text x="1170" y="470" font-size="14" fill="#0F766E" text-anchor="middle">告警处置结果</text>
    <line x1="830" y1="645" x2="732" y2="645" stroke="#0F766E" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#mk-teal)"/>
    <text x="781" y="630" font-size="14" fill="#0F766E" text-anchor="middle">影子验证</text>
    <path d="M605 600 L660 480 L675 362" fill="none" stroke="#0F766E" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#mk-teal)"/>
    <text x="655" y="480" font-size="14" fill="#0F766E" text-anchor="middle">验证通过后更新</text>

    <!-- 电流采集 -->
    <rect x="100" y="260" width="190" height="100" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="195" y="298" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">电流采集</text>
    <text x="195" y="324" font-size="13" fill="#475569" text-anchor="middle">设备实际值</text>
    <text x="195" y="346" font-size="13" fill="#64748B" text-anchor="middle">电机电流</text>

    <!-- 数据管道 -->
    <rect x="340" y="260" width="190" height="100" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
    <text x="435" y="298" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">数据管道</text>
    <text x="435" y="324" font-size="13" fill="#475569" text-anchor="middle">MQTT · 时序库</text>
    <text x="435" y="346" font-size="13" fill="#64748B" text-anchor="middle">落库</text>

    <!-- Prophet 模型 -->
    <rect x="580" y="260" width="190" height="100" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="675" y="298" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">Prophet 模型</text>
    <text x="675" y="324" font-size="13" fill="#475569" text-anchor="middle">周期预测</text>
    <text x="675" y="346" font-size="13" fill="#64748B" text-anchor="middle">输出预测区间</text>

    <!-- 残差评分 -->
    <rect x="820" y="260" width="190" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="915" y="298" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">残差评分</text>
    <text x="915" y="324" font-size="13" fill="#475569" text-anchor="middle">实际值 - 预测值</text>
    <text x="915" y="346" font-size="13" fill="#64748B" text-anchor="middle">滑动窗口打分</text>

    <!-- 决策菱形 -->
    <polygon points="1070,255 1180,310 1070,365 960,310" fill="#FEFCE8" stroke="#D97706" stroke-width="1.8"/>
    <text x="1070" y="306" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">连续超阈值？</text>
    <text x="1070" y="330" font-size="12" fill="#475569" text-anchor="middle">且不在静默期</text>

    <!-- 告警推送 -->
    <rect x="1190" y="260" width="210" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
    <text x="1295" y="298" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">告警推送</text>
    <text x="1295" y="324" font-size="13" fill="#475569" text-anchor="middle">Webhook · SMTP</text>
    <text x="1295" y="346" font-size="13" fill="#64748B" text-anchor="middle">推送运维系统</text>

    <!-- 继续观测 -->
    <rect x="960" y="440" width="220" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="1070" y="474" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">继续观测</text>
    <text x="1070" y="500" font-size="13" fill="#475569" text-anchor="middle">保留评分与上下文</text>

    <!-- 运维确认与标注 -->
    <rect x="830" y="600" width="250" height="90" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="955" y="636" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">运维确认与标注</text>
    <text x="955" y="664" font-size="13" fill="#475569" text-anchor="middle">真故障 / 误报 / 工况变化</text>

    <!-- 模型增量更新 -->
    <rect x="480" y="600" width="250" height="90" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="605" y="636" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">模型增量更新</text>
    <text x="605" y="664" font-size="13" fill="#475569" text-anchor="middle">影子验证后切换</text>

    <!-- 数据流与反馈回路说明 -->
    <rect x="100" y="720" width="900" height="140" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="130" y="754" font-size="18" font-weight="700" fill="#334155">数据流与反馈回路</text>
    <circle cx="146" cy="786" r="4" fill="#2563EB"/>
    <text x="158" y="792" font-size="15" fill="#475569">① 设备层 → 数据管道：电流数据上传</text>
    <circle cx="146" cy="820" r="4" fill="#2563EB"/>
    <text x="158" y="826" font-size="15" fill="#475569">② 数据管道 → 模型层：历史数据供训练</text>
    <circle cx="600" cy="786" r="4" fill="#2563EB"/>
    <text x="612" y="792" font-size="15" fill="#475569">③ 模型层 → 评分层：输出预测区间</text>
    <circle cx="600" cy="820" r="4" fill="#2563EB"/>
    <text x="612" y="826" font-size="15" fill="#475569">④ 评分层 → 决策层：传递评分结果</text>

    <!-- 图例 -->
    <rect x="1020" y="720" width="680" height="140" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="1050" y="754" font-size="18" font-weight="700" fill="#334155">图例</text>
    <line x1="1050" y1="790" x2="1100" y2="790" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <text x="1112" y="796" font-size="15" fill="#475569">数据流</text>
    <line x1="1250" y1="790" x2="1300" y2="790" stroke="#DC2626" stroke-width="2.4" marker-end="url(#mk-red)"/>
    <text x="1312" y="796" font-size="15" fill="#475569">告警流</text>
    <line x1="1050" y1="826" x2="1100" y2="826" stroke="#0F766E" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#mk-teal)"/>
    <text x="1112" y="832" font-size="15" fill="#475569">模型更新流（反馈回路）</text>
    <polygon points="1275,816 1295,826 1275,836 1255,826" fill="#FEFCE8" stroke="#D97706" stroke-width="1.5"/>
    <text x="1312" y="832" font-size="15" fill="#475569">决策判断</text>

    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图 5-11 预测性维护管道由残差评分驱动：评分超过阈值才告警，告警处置结果经运维确认和影子验证后反馈到模型增量更新。</text>
  </svg>
</svg>
  </main>
</body>
</html>
