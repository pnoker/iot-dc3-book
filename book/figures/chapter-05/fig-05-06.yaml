  style: solid
  direction: bottom-to-top
- from: gateway_edge
  to: device_edge_node
  label: 执行指令
  style: dashed
  direction: top-to-bottom
- from: rule_push
  to: regional_edge
  label: 规则容器
  style: dashed
  direction: left-to-right
- from: regional_edge
  to: gateway_edge
  label: 代理下发
  style: dashed
  direction: bottom-to-top
- from: gateway_edge
  to: data_upload
  label: 聚合值
  style: solid
  direction: bottom-to-top
- from: data_upload
  to: regional_edge
  label: MQTT桥接
  style: solid
  direction: bottom-to-top
- from: regional_edge
  to: cloud_platform
  label: 长期存储
