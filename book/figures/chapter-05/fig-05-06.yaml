type: architecture
title: 图 5-6 边缘-云协同典型架构
purpose: 展示从设备边缘到云端的三层边缘节点、两种协同模式以及边缘计算框架的放置位置。
audience_takeaway: 设备边缘、网关边缘、区域边缘的边界以及规则下发和聚合上报两条数据主链路。
visual_focus: 从设备层向上经网关边缘、区域边缘到云端的两条数据流（规则下发用虚线、聚合上报用实线）；规则引擎和AI推理框用橙色强调。
design_level: logical
layout: 自下而上分层：设备边缘→网关边缘→区域边缘→云端；左侧标注边缘框架选项。
elements:
- 设备边缘层：传感器、执行器、PLC，采用MCU形态，青绿色卡片。
- 网关边缘层：工控机或智能网关，运行EdgeX Foundry，蓝色卡片。
- 区域边缘层：MEC服务器或汇聚节点，运行KubeEdge，蓝色卡片。
- 云端层：云服务器或中心机房，运行AI模型与时序数据库，蓝色卡片。
- 规则下发流：从云端→区域边缘→网关边缘→设备，虚线橙色。
- 聚合上报流：从设备→网关边缘→区域边缘→云端，实线绿色。
relationships:
- 设备边缘通过Modbus/OPC UA/CoAP上报网关边缘。
- 网关边缘运行EdgeX的Core Data与规则引擎，对设备执行规则。
- 网关边缘将聚合数据通过MQTT报区域边缘（MEC）或直接上报云端。
- 区域边缘运行KubeEdge，从云端接收容器化AI模型部署。
- 云端训练AI模型，通过KubeEdge的云端组件下发给区域边缘节点。
regions:
- id: device_region
  label: 现场设备域
  role: 异构传感器与执行器边界
- id: gateway_region
  label: 网关边界
  role: 协议转换与本地实时控制
- id: regional_region
  label: 区域MEC域
  role: 低时延决策与容器化推理
- id: cloud_region
  label: 云端域
  role: 全局分析、模型训练与存储
components:
- id: device_edge_node
  label: 设备边缘
  type: edge
  subtitle: MCU传感器/PLC
  group: device_region
  priority: normal
  shape: card
- id: gateway_edge
  label: 网关边缘
  type: edge
  subtitle: EdgeX + 规则引擎
  group: gateway_region
  priority: primary
  shape: card
- id: regional_edge
  label: 区域边缘 (MEC)
  type: edge
  subtitle: KubeEdge + 容器推理
  group: regional_region
  priority: primary
  shape: card
- id: cloud_platform
  label: 云端平台
  type: platform
  subtitle: AI训练 + 时序库 + 规则下发
  group: cloud_region
  priority: primary
  shape: card
- id: rule_push
