type: dataflow
title: 图5-6 降采样数据流程与数据量对比（例子）
purpose: 展示原始高精度数据经过三级降采样后数据量显著减少，说明分层策略的压缩效果。
audience_takeaway: 读者应理解降采样通过分层聚合将数据量逐步压缩，不同层服务于不同时效性需求。
visual_focus: 从原始数据桶到天聚合桶的主链路，突出数据量呈量级缩减。
design_level: implementation
layout: 从左至右的管道式数据流，包含原始数据桶、分钟聚合桶、小时聚合桶、天聚合桶，各桶下方标注相对数据量描述（如“原始数据量基准”、“显著减少”、“大幅降低”、“极小占比”）。
elements:
- 原始数据桶：10秒级精度，短保留窗口。
- 分钟聚合桶：每分钟均值，数据量显著减少。
- 小时聚合桶：每小时均值，数据量进一步大幅降低。
- 天聚合桶：每天均值，数据量降至极小占比。
relationships:
- 原始数据桶通过连续查询（CQ）管道输出至分钟聚合桶，实线箭头标注'CQ：每分钟聚合'。
- 分钟聚合桶通过下一级连续查询输出至小时聚合桶，实线箭头标注'CQ：每小时聚合'。
- 小时聚合桶通过下一级连续查询输出至天聚合桶，实线箭头标注'CQ：每天聚合'。
- 每个聚合桶还有一条虚线箭头指向'查询仪表盘'，表示应用层直接读取聚合数据。
regions:
- id: data_domain
  label: 数据资产域
  role: 数据沉淀与治理边界
components:
- id: c1
  label: 原始数据桶
  type: data
  subtitle: 10秒级精度，短保留窗口
  group: data_domain
  priority: primary
  shape: database
- id: c2
  label: 分钟聚合桶
  type: data
  subtitle: 每分钟均值，数据量显著减少
  group: data_domain
  priority: normal
  shape: database
- id: c3
  label: 小时聚合桶
  type: data
  subtitle: 每小时均值，数据量大幅降低
  group: data_domain
  priority: normal
  shape: database
- id: c4
  label: 天聚合桶
  type: data
  subtitle: 每天均值，数据量极小占比
  group: data_domain
  priority: normal
  shape: database
connections:
- from: c1
  to: c2
  label: CQ：每分钟聚合
  style: solid
  direction: left-to-right
- from: c2
  to: c3
  label: CQ：每小时聚合
  style: solid
  direction: left-to-right
- from: c3
  to: c4
  label: CQ：每天聚合
  style: solid
  direction: left-to-right
callouts:
- “原始层”保留窗口通常按天计，用于故障回放；“分钟层”支撑短时趋势；“小时层”服务日报；“天层”服务年度趋势。
legend:
- 各桶数据量描述基于例子估算，实际项目因设备数、上报频率、字段数量而异。
- 实线箭头：连续查询驱动自动化聚合。
- 虚线箭头：应用层查询路径。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: 使用流程图形式，从左至右排列桶节点，节点间有粗实线箭头连接。每个节点下方显示定性比例描述（如“原始基准”、“显著减少”、“大幅降低”、“极小”）。使用圆角矩形节点，配色按图例。
caption:
  zh: 图5-6 例子：中等规模工厂设备上报温度和湿度。三级降采样策略：原始数据保留短暂时间，分钟聚合保留中期，小时聚合保留季度级，天聚合保留年。各阶段数据量比例为基于常见压缩比的定性描述，非精确数值。
  en: 'Figure 5-6 Example: devices in a mid-sized factory report temperature and humidity. The three-level downsampling strategy keeps raw data only briefly, minute aggregates for the mid term, hourly aggregates at quarter scale, and daily aggregates for a year. Data-volume ratios at each stage are qualitative descriptions based on common compression ratios, not exact figures.'
labels:
  en:
    图5-6 降采样数据流程与数据量对比（例子）: Figure 5-6 Downsampling Pipeline & Data Volume (Example)
    四级数据桶由连续查询逐级聚合，数据量逐级降低并采用分层保留策略。: Four tiers of buckets aggregate step by step via continuous queries; volume drops level by level with tiered retention.
    连续查询逐级聚合；粒度变粗，数据量与长期存储成本同步下降。: Continuous queries aggregate level by level; as granularity coarsens, volume and long-term storage cost fall together.
    CQ：每分钟: 'CQ: per minute'
    CQ：每小时: 'CQ: hourly'
    CQ：每天: 'CQ: daily'
    原始数据桶: Raw Data Bucket
    10 秒级精度 · 短保留窗口: 10s Precision · Short Retention
    数据量：原始基准: 'Volume: raw baseline'
    分钟聚合桶: Minute Aggregate Bucket
    每分钟均值 · 短时趋势: Per-Minute Avg · Short-Term Trends
    数据量：显著减少: 'Volume: much reduced'
    小时聚合桶: Hourly Aggregate Bucket
    每小时均值 · 日报/周报: Hourly Avg · Daily/Weekly Reports
    数据量：大幅降低: 'Volume: sharply lower'
    天聚合桶: Daily Aggregate Bucket
    每天均值 · 年度趋势: Daily Avg · Yearly Trends
    数据量：极小占比: 'Volume: tiny fraction'
    查询仪表盘: Query Dashboards
    应用层直接读取聚合数据: Apps read aggregates directly
    分层保留策略: Tiered Retention Policy
    原始层: Raw Tier
    短期保留 · 故障回放: Short Retention · Fault Replay
    分钟层: Minute Tier
    中期保留 · 短时趋势: Mid-Term · Short-Term Trends
    小时层: Hourly Tier
    季度趋势 · 日报/周报: Quarterly Trends · Daily/Weekly Reports
    天层: Daily Tier
    长期保留 · 年度趋势: Long Retention · Yearly Trends
    实线箭头：连续查询驱动自动化聚合: 'Solid arrows: continuous-query auto-aggregation'
    虚线箭头：应用层查询路径: 'Dashed arrows: application query path'
    图5-6 降采样数据流程与数据量对比：三级降采样将数据量逐级压缩，原始层短保留用于故障回放，分钟/小时/天层分别支撑短时趋势、日报与年度趋势。: 'Figure 5-6 Downsampling pipeline and data-volume comparison: three downsampling levels compress data step by step — the raw tier is short-retention for fault replay, while minute/hourly/daily tiers serve short-term trends, daily reports, and yearly trends.'
