callouts:
- 规则下发仅在初始或规则更新时触发，执行过程中不依赖回云。
- 聚合上报保留趋势信息，减少原始数据带宽消耗。
legend:
- 青绿色=设备与边缘节点；蓝色=网关与云平台；橙色=规则/智能流。
- 实线=数据或执行流；虚线=配置或指令下发。
visual_constraints:
- 最多7个主节点，节点标签短。
- 虚线箭头只用于规则下发路径。
- 分组边界用虚线圆角矩形。
render_notes: HTML/SVG渲染，浅色背景，圆角矩形，箭头带短标签，底部图例和出版级图注。
caption:
  zh: 图 5-6 展示从设备边缘到云端的层次与协同模式，左侧标注EdgeX/KubeEdge的典型部署位置。云端与边缘双向协同：规则与模型经“规则下发”通道下沉到边缘，现场数据经“聚合上报”通道回流云端。
  en: 'Figure 5-6 Layers and collaboration modes from device edge to cloud, with the typical deployment positions of EdgeX/KubeEdge annotated on the left.'
labels:
  en:
    图 5-6 边缘-云协同典型架构: Figure 5-6 Typical Edge-Cloud Collaboration Architecture
    实时任务靠近现场，全局训练与长期分析留在云端。: Real-time tasks stay near the field; global training and long-term analysis stay in the cloud.
    聚合上报: Aggregated Upload
    规则 / 模型下发: Rule / Model Push
    容器编排: Container Orchestration
    设备接入框架: Device Access Framework
    云端平台: Cloud Platform
    全局分析 · AI 模型训练 · 时序存储 · 规则下发: Global Analysis · AI Training · Time-Series · Rule Push
    区域边缘（MEC）: Regional Edge (MEC)
    KubeEdge · 容器化 AI 推理: KubeEdge · Containerized AI Inference
    容器化推理: Containerized Inference
    网关边缘: Gateway Edge
    EdgeX · 协议转换 · 本地规则执行: EdgeX · Protocol Conversion · Local Rules
    本地规则引擎: Local Rule Engine
    设备边缘: Device Edge
    MCU · PLC · 传感器 / 执行器（Modbus / OPC UA / CoAP）: MCU · PLC · Sensors / Actuators (Modbus / OPC UA / CoAP)
    实线：聚合上报（数据流）: 'Solid: aggregated upload (data flow)'
    虚线：规则 / 模型下发（配置与指令）: 'Dashed: rule / model push (config & commands)'
    边缘框架部署位置: Edge Framework Deployment
    规则下发仅在初始或规则更新时触发，执行过程中不依赖回云。: Rule push fires only on init or rule updates; execution never depends on the cloud.
    聚合上报保留趋势信息，减少原始数据带宽消耗；边缘断网时仍可执行本地规则。: Aggregated uploads keep trend information and cut raw-data bandwidth; local rules keep running when the edge is offline.
    图 5-6 边缘-云协同典型架构：展示从设备边缘到云端的层次与协同模式，左侧标注 EdgeX/KubeEdge 的典型部署位置，规则下发与聚合上报构成双向协同。: 'Figure 5-6 Typical edge-cloud collaboration architecture: layers and collaboration modes from device edge to cloud, with the typical EdgeX/KubeEdge deployment positions annotated on the left; rule push and aggregated upload form the two-way collaboration.'
