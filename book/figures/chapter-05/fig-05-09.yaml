type: dataflow
title: 图5-9 Kappa架构示意图
audience_takeaway: 读者应理解Kappa用单一流管道同时覆盖实时与历史：消息总线持久化原始流，历史分析靠Time Travel回放而非另建批管道，省去Lambda双管道维护。
purpose: 展示Kappa架构如何通过单一流处理管道兼容实时与历史分析
visual_focus: 从数据源到结果输出：持续输出的主链路。
design_level: implementation
layout: 单行流向布局，左中右三列
elements:
- 左侧 '数据源' 圆角矩形节点（标记'传感器/设备/MQTT代理'），引出两条实线箭头。
- 第一条实线箭头直接向下连接到 '实时流处理' 菱形节点（标注'Flink / Kafka Streams'）。
- 第二条实线箭头从数据源出发，先指向一个中间存储（标记'消息总线 / Kafka Topic'），然后从该存储引出实线箭头同样汇入同一菱形节点。
- 菱形节点下方引出一条虚线箭头回头指向自己，标注'历史回放（Time Travel）'。
- 菱形节点右侧引出实线箭头指向 '结果输出' 圆角矩形（告警系统 / Dashboard / 时序数据库）。
relationships:
- 数据源→实时流处理：实时数据流
- 数据源→消息总线→实时流处理：持久化数据流
- 实时流处理→历史回放：事件时间回溯
- 实时流处理→结果输出：持续输出
regions:
- id: data_domain
  label: 数据资产域
  role: 数据沉淀与治理边界
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
