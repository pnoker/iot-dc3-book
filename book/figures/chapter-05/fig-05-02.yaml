- 时序数据库：InfluxDB TSM 引擎 vs TimescaleDB 超表分 Chunk
- 规则引擎：阈值到 CEP，边缘毫秒级 / 云端历史分析两种形态
relationships:
- 队列吞吐决定时序库写入压力，规则引擎实时性依赖队列延迟，消息队列最先选型
