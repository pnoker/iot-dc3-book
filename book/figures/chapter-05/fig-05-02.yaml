caption:
  zh: 图 5-2 消息队列缓冲流量、时序数据库高效存储、规则引擎智能判断，三组件选型相互影响：队列吞吐决定时序库写入压力，规则引擎实时性依赖队列延迟，通常消息队列最先选型。
  en: 'Figure 5-2 The message queue buffers traffic, the time-series DB stores efficiently, and the rule engine makes smart judgments; the three component selections influence each other — queue throughput sets the write pressure on the time-series DB, rule-engine real-time performance depends on queue latency, and the message queue is usually selected first.'
labels:
  en:
    图 5-2 平台层核心组件：消息队列、时序数据库、规则引擎: 'Figure 5-2 Platform Core: Message Queue, Time-Series DB, Rule Engine'
    消息队列缓冲流量、时序数据库高效存储、规则引擎智能判断，三组件选型相互影响。: The message queue buffers traffic, the time-series DB stores efficiently, the rule engine judges smartly — their selections influence each other.
    分别解决数据缓冲、高效存储、智能判决，选型决定吞吐、成本与时效: They solve buffering, efficient storage, and smart decisions; selections set throughput, cost, and timeliness
    消息队列：数据缓冲带: 'Message queue: data buffer'
    发布/订阅解耦生产与消费: Pub/sub decoupling
    设备洪峰时后端不被瞬时冲垮: Backend survives device bursts
    选型对比: Options Compared
    MQTT Broker：设备端轻量代理，长连接推模式: 'MQTT Broker: light device agent, persistent push'
    Kafka：顺序写磁盘 + 分区，海量后端管道: 'Kafka: sequential writes + partitions, bulk pipeline'
    RabbitMQ：灵活路由 + 确认，业务集成: 'RabbitMQ: flexible routing + acks, business integration'
    三者不互斥：MQTT 收 → Kafka/RabbitMQ 分发: 'Not exclusive: MQTT in → Kafka/RabbitMQ out'
    通常最先选型，决定抗洪峰能力: Usually chosen first; sets burst tolerance
    时序数据库：专为时间印记优化: 'Time-series DB: built for timestamps'
    数据点 = 时间戳 + 标签 + 数值字段: Data point = timestamp + tag + value field
    改存储引擎 + 极致写入压缩: Custom engine + write compression
    两条技术路线: Two Technical Routes
    InfluxDB：TSM 引擎（LSM 变体）+ WAL: 'InfluxDB: TSM engine (LSM variant) + WAL'
    差分编码 + delta-of-delta 压缩，TICK 生态: Delta encoding + delta-of-delta, TICK stack
    TimescaleDB：基于 PostgreSQL，超表按时间分 Chunk: 'TimescaleDB: PostgreSQL-based, hypertables chunked by time'
    SQL 兼容好，查询只扫涉及分区: SQL-friendly; scans only touched chunks
    压缩比决定硬件成本与查询性能: Compression sets HW cost & query speed
    规则引擎：从阈值到 CEP: 'Rule engine: from thresholds to CEP'
    简单阈值：温度超 80℃ 告警: 'Simple threshold: alarm > 80°C'
    CEP：时间窗口内多事件模式匹配: 'CEP: multi-event patterns in time windows'
    两种部署形态: Two Deployment Forms
    边缘：毫秒级响应（切断危险电源）: 'Edge: ms-level response (cut power)'
    云端：分析跨度大、依赖历史数据: 'Cloud: wide-span analysis over history'
    例：5 分钟内三次电流尖峰 + 温度上升 → 轴承故障: e.g. 3 current spikes + rising temp in 5 min → bearing fault
    规则引擎解决确定性逻辑: Rules handle deterministic logic
    AI 解决非确定性模式，两者互补: AI handles non-deterministic patterns
    三组件选型相互影响: The Three Selections Interlock
    消息队列吞吐 → 决定时序数据库写入压力 · 规则引擎实时性 → 依赖队列延迟: Queue throughput → DB write pressure · rule real-time → queue latency
    工程顺序：消息队列最先选型（抗洪峰）→ 时序数据库压缩比定硬件成本 → 规则引擎按延迟要求确认是否下放边缘: 'Order: queue first (burst tolerance) → time-series compression sets hardware cost → rules go edge per latency needs'
    IoT DC3 落地：采集值封装位号值对象 → 写入时序库 → 经消息队列缓冲 → 规则引擎消费: 'IoT DC3: values wrapped as point-value objects → time-series DB → buffered by message queue → consumed by rule engine'
    组件选型是通用工程决策，与具体平台无关；时序库权衡见 5.4 节，完整落地见第 14 章: Selection is generic engineering, platform-agnostic; time-series trade-offs in 5.4, full build in Chapter 14
    图 5-2 消息队列缓冲流量、时序数据库高效存储、规则引擎智能判断，三组件选型相互影响：队列吞吐决定时序库写入压力，规则引擎实时性依赖队列延迟，通常消息队列最先选型。: Figure 5-2 The message queue buffers traffic, the time-series DB stores efficiently, and the rule engine judges smartly; the three selections interlock — queue throughput sets write pressure, rule-engine real-time depends on queue latency, and the message queue is usually selected first.
