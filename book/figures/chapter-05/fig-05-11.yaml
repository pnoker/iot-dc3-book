type: flowchart
title: 图 5-11 从数据采集到告警触发的预测性维护流程
audience_takeaway: 读者应理解预测性维护靠残差驱动：Prophet预测值与实际值求残差、滑动窗口打分，超阈值才告警，运维确认后回流触发模型增量更新。
purpose: 展示预测性维护管道的完整阶段，以及数据流、告警流、模型更新流之间的交互关系
visual_focus: 从设备层到决策层：传递评分结果的主链路。
design_level: implementation
layout: 从左至右水平布局，进程使用圆角矩形，数据存储使用圆柱，判断使用菱形
elements:
- 设备层：电机电流采集
- 数据管道：MQTT 传输 + 时序数据库落库
- 模型层：Prophet 模型训练与周期预测
- 评分层：预测值与实际值残差计算，滑动窗口异常评分
- 决策层：评分超过阈值触发告警，通过 Webhook/SMTP 推送到运维系统
- 反馈回路：运维确认后触发模型增量更新
relationships:
- 设备层 → 数据管道：电流数据上传
- 数据管道 → 模型层：历史数据供训练
- 模型层 → 评分层：输出预测区间
- 评分层 → 决策层：传递评分结果
- 决策层 → 反馈回路 → 模型层：确认后执行增量更新
