caption:
  zh: 图 5-11 预测性维护管道数据流示意
  en: 'Figure 5-11 Data flow of the predictive maintenance pipeline.'
labels:
  en:
    图 5-11 从数据采集到告警触发的预测性维护流程: 'Figure 5-11 Predictive Maintenance: Collection to Alarm'
    采集数据经过预测和残差评分，连续异常触发告警，运维确认结果反馈到模型更新。: Collected data goes through forecasting and residual scoring; repeated anomalies trigger an alarm, and confirmed outcomes feed model updates.
    实际值与预测区间形成残差；连续异常触发告警，确认结果进入反馈闭环。: Actual values and forecast intervals form residuals; repeated anomalies trigger alarms, and confirmed outcomes enter the feedback loop.
    是: 'Yes'
    否: 'No'
    告警处置结果: Alarm outcome
    影子验证: Shadow validation
    验证通过后更新: Update after validation
    电流采集: Current Acquisition
    设备实际值: Device actual value
    电机电流: Motor current
    数据管道: Data Pipeline
    MQTT · 时序库: MQTT · Time-Series DB
    落库: Persist to DB
    Prophet 模型: Prophet Model
    周期预测: Periodic Forecasting
    输出预测区间: Output forecast interval
    残差评分: Residual Scoring
    实际值 - 预测值: Actual - Forecast
    滑动窗口打分: Sliding-Window Scoring
    连续超阈值？: Repeatedly over threshold?
    且不在静默期: Not in mute window
    告警推送: Alarm push
    推送运维系统: Push to ops system
    继续观测: Keep observing
    保留评分与上下文: Keep score & context
    运维确认与标注: Ops confirm & label
    真故障 / 误报 / 工况变化: True fault / false alarm / condition change
    模型增量更新: Incremental model update
    影子验证后切换: Switch after shadow validation
    数据流与反馈回路: Data Flow & Feedback Loop
    ① 设备层 → 数据管道：电流数据上传: '① Device → data pipeline: current upload'
    ② 数据管道 → 模型层：历史数据供训练: '② Pipeline → model: history for training'
    ③ 模型层 → 评分层：输出预测区间: '③ Model → scoring: forecast interval'
    ④ 评分层 → 决策层：传递评分结果: '④ Scoring → decision: pass score'
    图例: Legend
    数据流: Data flow
    告警流: Alarm flow
    模型更新流（反馈回路）: Model update flow (feedback loop)
    决策判断: Decision
    图 5-11 预测性维护管道由残差评分驱动：评分超过阈值才告警，告警处置结果经运维确认和影子验证后反馈到模型增量更新。: 'Figure 5-11 The predictive maintenance pipeline is residual-score driven: an alarm fires only when the score exceeds a threshold, and confirmed alarm outcomes feed incremental model updates after ops confirmation and shadow validation.'
