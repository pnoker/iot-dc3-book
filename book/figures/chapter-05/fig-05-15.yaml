type: layered
title: 图5-15 数据生命周期管理：保留策略与冷热分层
audience_takeaway: 读者应理解保留策略按数据粒度设定过期时长，冷热分层把数据按访问频率放到热/温/冷三级存储，分片迁移避免拖慢数据库。
purpose: 展示数据生命周期管理的保留策略与冷热分层
visual_focus: 保留策略三级与冷热分层三层。
design_level: layered
layout: 上半保留策略三级，下半冷热分层三层
elements:
- 保留策略：原始 10 秒级 7 天、分钟级 30 天、小时级 12 个月
- 热存储：最近 7 天 NVMe/SSD，毫秒级，实时大盘
- 温存储：8 天~3 个月 HDD/SSD，月度报表
- 冷存储：超 3 个月对象存储，Parquet/Avro 分区，批量训练
relationships:
- 数据价值随访问频率递减，按价值分层付费；分片迁移在低峰分批执行
render_notes: HTML/SVG 渲染，保留策略三级 + 冷热分层三层，红橙蓝分层。
caption:
  zh: 图5-15 保留策略按数据粒度设定过期时长，冷热分层把数据按访问频率放到热/温/冷三级存储；分片迁移在低峰分批执行并限速，避免迁移拖慢数据库响应。
  en: 'Figure 5-15 Retention policies set expiry per data granularity, and hot/warm/cold tiering places data by access frequency across three storage tiers; shard migration runs in throttled batches at off-peak hours so it never drags database response down.'
labels:
  en:
    图5-15 数据生命周期管理：保留策略与冷热分层: 'Figure 5-15 Data Lifecycle: Retention & Hot/Cold Tiering'
    保留策略按价值设定过期时长，冷热分层把数据按访问频率放到不同性价比的存储介质。: Retention sets expiry by value; tiering places data on storage media whose cost matches access frequency.
    让每一字节数据按它的查询价值来付费: Pay for every byte according to its query value
    保留策略：不同粒度设定独立保留时长: 'Retention: independent durations per granularity'
    原始 10 秒级数据: Raw 10-second data
    服务实时告警与故障排查: Real-time alarms, troubleshooting
    保留 7 天: Keep 7 days
    分钟级聚合数据: Minute-level aggregates
    用于周报: For weekly reports
    保留 30 天: Keep 30 days
    小时级聚合数据: Hourly aggregates
    用于年度趋势分析: For yearly trend analysis
    保留 12 个月: Keep 12 months
    冷热分层：按访问频率放在不同性价比的存储介质: 'Tiering: storage media matched to access frequency'
    热存储: Hot Storage
    最近 7 天 · 本地 NVMe / SSD: Last 7 Days · Local NVMe / SSD
    响应仪表盘毫秒级查询，访问频繁: Millisecond dashboard queries, frequent access
    时序数据库原生格式，单位成本相对较高: Native time-series format, higher unit cost
    实时大盘、告警触发: Live dashboards, alarm triggers
    温存储: Warm Storage
    8 天～3 个月 · 普通 HDD / SSD: 8 Days ~ 3 Months · HDD / SSD
    用于月度报表，访问频度中等: Monthly reports, medium access frequency
    月度报表: Monthly reports
    冷存储: Cold Storage
    超过 3 个月 · 对象存储（MinIO / S3 兼容）: Over 3 Months · Object Storage (MinIO / S3)
    Parquet / Avro 列式格式，按时间分区，查询只加载对应分区: Parquet / Avro columnar, time-partitioned; loads only needed partitions
    用于季度回顾或算法模型训练，访问极少: Quarterly reviews or model training, rarely accessed
    历史分析、批量训练: Historical analysis, batch training
    图5-15 保留策略按数据粒度设定过期时长，冷热分层把数据按访问频率放到热/温/冷三级存储；分片迁移在低峰分批执行并限速，避免迁移拖慢数据库响应。: Figure 5-15 Retention policies set expiry per data granularity, and hot/warm/cold tiering places data by access frequency across three storage tiers; shard migration runs in throttled batches at off-peak hours so it never drags database response down.
