type: flowchart
title: 图 5-3 设备认证与数据加密流程
audience_takeaway: 证书认证发生在TLS/mTLS握手内；Token路径必须先建立加密通道并完成通道内认证，再签发短期Token和refresh；混合模式按mTLS→Token→API执行。
purpose: 展示证书路径、Token路径与混合路径各自正确的认证和加密时序。
visual_focus: 证书在握手内认证、Token在加密通道内认证后签发，以及mTLS→Token→API混合主链路。
design_level: implementation
layout: 自上而下三条水平流程：证书路径、Token路径、混合路径。
regions:
- id: device_region
  label: 设备侧
  role: 设备发起连接，携带证书或Token
- id: network_region
  label: 网络
  role: TLS/DTLS握手，协商加密密钥
- id: platform_region
  label: 平台侧
  role: 验证证书链或Token签名，建立加密通道
components:
- id: device_client
  label: 设备
  type: edge
  subtitle: 发起连接
  group: device_region
  priority: primary
  shape: card
- id: tls_handshake
  label: TLS/DTLS握手
  type: process
  subtitle: 协商加密密钥
  group: network_region
  priority: primary
  shape: decision
- id: platform_auth
  label: 认证服务
  type: platform
  subtitle: 验证身份
  group: platform_region
  priority: primary
  shape: card
- id: encrypted_channel
  label: 加密通道
  type: data
  subtitle: 数据流加密传输
  group: network_region
  priority: normal
  shape: database
- id: platform_backend
  label: 后端业务
  type: platform
  subtitle: 处理解密后数据
  group: platform_region
  priority: normal
  shape: card
connections:
- from: device_client
  to: tls_handshake
  label: ClientHello / Token请求
  style: solid
  direction: request
- from: tls_handshake
  to: platform_auth
  label: 转发握手消息
  style: solid
  direction: request
- from: platform_auth
  to: tls_handshake
  label: 握手完成 / Token签发
  style: dashed
  direction: response
- from: tls_handshake
  to: device_client
  label: 加密通道建立通知
  style: dashed
  direction: response
- from: device_client
  to: encrypted_channel
  label: 加密数据流
  style: solid
  direction: request
- from: encrypted_channel
  to: platform_backend
  label: 解密后的数据
  style: solid
  direction: request
elements:
- 设备侧：设备携带X.509证书或设备密钥发起连接请求。
- 网络层：TLS 1.3握手在1RTT内完成，DTLS需额外1次往返。
- 平台侧：认证服务验证证书链或Token签名，通过后建立加密通道。
relationships:
- 证书路径：设备证书与私钥 -> TLS/mTLS握手内验证 -> 加密会话与受保护API
- Token路径：设备凭据 -> TLS加密通道 -> 通道内认证 -> 短期Token与refresh -> 受保护API
- 混合路径：mTLS设备认证 -> 短期Token -> 业务API
callouts:
- 证书认证是TLS/mTLS握手的一部分，不是握手前后的独立认证请求。
- Token认证请求必须先由TLS加密通道保护。
- Token通过通道内认证后签发，并以短有效期和refresh机制限制泄漏影响。
- 传输解密后的业务数据仍需访问控制与存储保护。
legend:
- 青绿色=设备侧；灰色=网络传输层；蓝色=平台核心服务。
- 实线箭头=请求/数据流；虚线箭头=握手完成/Token返回。
- 主链路从设备出发，经过TLS握手到达平台认证服务，后建立加密通道。
visual_constraints:
- 最多6个主节点，节点标签使用短名词短语，解释性文字放入callouts或正文。
- 图例放在底部，不遮挡主体结构。
- 泳道间隔12px，握手消息带序号，箭头文字标注协议类型（TLS 1.3 / DTLS）。
render_notes: HTML/SVG渲染，浅色背景，圆角矩形，泳道间隔12px，握手消息带序号，箭头文字标注协议类型（TLS 1.3 / DTLS）。
caption:
  zh: 图 5-3 证书在TLS/mTLS握手内完成认证；Token在加密通道内认证后签发，混合模式依次使用mTLS、短期Token和业务API。
  en: 'Figure 5-3 Certificates are authenticated within the TLS/mTLS handshake; tokens are issued only after in-channel authentication over an encrypted channel, and the hybrid mode uses mTLS, short-lived tokens, and business APIs in turn.'
labels:
  en:
    图 5-3 设备认证与数据加密流程: Figure 5-3 Device Authentication & Data Encryption Flow
    证书认证属于 TLS/mTLS 握手；Token 必须在加密通道内认证后签发，混合路径依次经过 mTLS、Token 和 API。: Certificate authentication happens inside the TLS/mTLS handshake; tokens are issued only after in-channel authentication, and the hybrid path runs mTLS → Token → API.
    认证凭据必须在正确的安全边界内使用；传输解密后仍需存储保护。: Credentials must be used within the right security boundary; storage protection is still needed after transport decryption.
    证书路径: Certificate Path
    设备证书与私钥在握手内完成身份验证: Device identity verified inside the handshake
    设备证书与私钥: Device Certificate & Private Key
    X.509 证书: X.509 Certificate
    TLS / mTLS 握手: TLS / mTLS Handshake
    握手内验证证书链与设备身份: Verify chain & identity in handshake
    加密会话 / 受保护 API: Encrypted Session / Protected API
    会话密钥保护后续通信: Session keys protect traffic
    握手完成: Handshake Complete
    Token 路径: Token Path
    先建立加密通道，再于通道内认证并签发短期 Token: Encrypt first, authenticate in channel, issue short-lived token
    设备凭据: Device Credentials
    预共享密钥等: e.g. pre-shared keys
    TLS 加密通道: TLS Encrypted Channel
    先保护认证请求: Protect auth requests first
    通道内认证: In-Channel Auth
    验证设备凭据: Verify credentials
    短期 Token + refresh: Short Token + refresh
    短有效期限制泄漏影响: Short TTL limits leak impact
    混合路径（主链路）: Hybrid Path (Main Link)
    依次使用 mTLS → 短期 Token → 业务 API: mTLS → Short Token → Business API
    mTLS 设备认证: mTLS Device Auth
    握手内完成: Done in handshake
    短期 Token: Short-Lived Token
    通道内签发: Issued in channel
    业务 API: Business API
    受保护调用: Protected calls
    关键要点: Key Takeaways
    证书认证是 TLS / mTLS 握手的一部分，不是握手前后的独立认证请求。: Certificate authentication is part of the TLS/mTLS handshake, not a separate request before or after it.
    Token 认证请求必须先由 TLS 加密通道保护，通过通道内认证后才签发。: Token authentication requests must first be protected by a TLS encrypted channel and are issued only after in-channel authentication.
    Token 以短有效期 + refresh 机制限制泄漏影响，传输解密后仍需访问控制与存储保护。: Short TTL plus refresh limits token leak impact; access control and storage protection are still needed after transport decryption.
    实线箭头：请求 / 数据流: 'Solid arrows: requests / data flow'
    虚线箭头：握手完成 / 返回: 'Dashed arrows: handshake done / return'
    主链路：mTLS → 短期 Token → 业务 API: 'Main link: mTLS → short-lived token → business API'
    图 5-3 设备认证与数据加密流程：证书在 TLS/mTLS 握手内完成认证，Token 在加密通道内认证后签发，混合模式依次使用 mTLS、短期 Token 与业务 API。: 'Figure 5-3 Device authentication and data encryption flow: certificates are authenticated within the TLS/mTLS handshake, tokens are issued after in-channel authentication over an encrypted channel, and the hybrid mode uses mTLS, short-lived tokens, and business APIs in turn.'
