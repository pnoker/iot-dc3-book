<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图5-4 边缘-云协同典型架构</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图5-4 边缘-云协同典型架构</title>
  <desc id="desc">实时任务靠近现场，全局训练与长期分析留在云端。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <defs>
      <marker id="mk-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
      <marker id="mk-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F97316"/></marker>
      <marker id="mk-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    </defs>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图5-4 边缘-云协同典型架构</text>
    <text x="88" y="64" font-size="12" fill="#64748B">实时任务靠近现场，全局训练与长期分析留在云端。</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 双向协同主链路（先画） -->
    <line x1="150" y1="533" x2="150" y2="188" stroke="#0F766E" stroke-width="2.4" marker-end="url(#mk-teal)"/>
    <text x="150" y="360" transform="rotate(-90 150 360)" font-size="18" font-weight="600" fill="#0F766E" text-anchor="middle">聚合上报</text>
    <line x1="1650" y1="188" x2="1650" y2="533" stroke="#F97316" stroke-width="2.4" stroke-dasharray="8 5" marker-end="url(#mk-orange)"/>
    <text x="1650" y="360" transform="rotate(90 1650 360)" font-size="18" font-weight="600" fill="#F97316" text-anchor="middle">规则 / 模型下发</text>

    <!-- 边缘框架标注（左列，紫） -->
    <line x1="250" y1="300" x2="268" y2="300" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="110" y="270" width="140" height="60" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="180" y="296" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">KubeEdge</text>
    <text x="180" y="318" font-size="12" fill="#64748B" text-anchor="middle">容器编排</text>
    <line x1="250" y1="415" x2="268" y2="415" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="110" y="385" width="140" height="60" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="180" y="411" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">EdgeX Foundry</text>
    <text x="180" y="433" font-size="12" fill="#64748B" text-anchor="middle">设备接入框架</text>

    <!-- 云端平台 -->
    <rect x="270" y="140" width="1260" height="95" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="900" y="178" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">云端平台</text>
    <text x="900" y="210" font-size="15" fill="#475569" text-anchor="middle">全局分析 · AI 模型训练 · 时序存储 · 规则下发</text>

    <!-- 区域边缘 MEC -->
    <rect x="270" y="255" width="1260" height="95" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="900" y="293" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">区域边缘（MEC）</text>
    <text x="900" y="325" font-size="15" fill="#475569" text-anchor="middle">KubeEdge · 容器化 AI 推理</text>
    <rect x="1280" y="272" width="150" height="40" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
    <text x="1355" y="298" font-size="14" font-weight="700" fill="#C2410C" text-anchor="middle">容器化推理</text>

    <!-- 网关边缘 -->
    <rect x="270" y="370" width="1260" height="95" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="900" y="408" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">网关边缘</text>
    <text x="900" y="440" font-size="15" fill="#475569" text-anchor="middle">EdgeX · 协议转换 · 本地规则执行</text>
    <rect x="1280" y="387" width="150" height="40" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
    <text x="1355" y="413" font-size="14" font-weight="700" fill="#C2410C" text-anchor="middle">本地规则引擎</text>

    <!-- 设备边缘 -->
    <rect x="270" y="485" width="1260" height="95" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="900" y="523" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">设备边缘</text>
    <text x="900" y="555" font-size="15" fill="#475569" text-anchor="middle">MCU · PLC · 传感器 / 执行器（Modbus / OPC UA / CoAP）</text>

    <!-- 图例 -->
    <line x1="300" y1="636" x2="360" y2="636" stroke="#0F766E" stroke-width="2.4" marker-end="url(#mk-teal)"/>
    <text x="372" y="642" font-size="15" fill="#475569">实线：聚合上报（数据流）</text>
    <line x1="700" y1="636" x2="760" y2="636" stroke="#F97316" stroke-width="2.4" stroke-dasharray="8 5" marker-end="url(#mk-orange)"/>
    <text x="772" y="642" font-size="15" fill="#475569">虚线：规则 / 模型下发（配置与指令）</text>
    <line x1="1240" y1="636" x2="1300" y2="636" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mk-purple)"/>
    <text x="1312" y="642" font-size="15" fill="#475569">边缘框架部署位置</text>

    <!-- 说明 -->
    <rect x="270" y="700" width="1260" height="130" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="302" cy="734" r="4" fill="#0F766E"/>
    <text x="316" y="740" font-size="15" fill="#475569">规则下发仅在初始或规则更新时触发，执行过程中不依赖回云。</text>
    <circle cx="302" cy="772" r="4" fill="#2563EB"/>
    <text x="316" y="778" font-size="15" fill="#475569">聚合上报保留趋势信息，减少原始数据带宽消耗；边缘断网时仍可执行本地规则。</text>

    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图5-4 边缘-云协同典型架构：展示从设备边缘到云端的层次与协同模式，左侧标注 EdgeX/KubeEdge 的典型部署位置，规则下发与聚合上报构成双向协同。</text>
  </svg>
</svg>
  </main>
