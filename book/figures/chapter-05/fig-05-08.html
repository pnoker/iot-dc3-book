<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图 5-8 降采样数据流程与数据量对比（例子）</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图 5-8 降采样数据流程与数据量对比（例子）</title>
  <desc id="desc">四级数据桶由连续查询逐级聚合，数据量逐级降低并采用分层保留策略。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <defs>
      <marker id="mk-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
      <marker id="mk-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    </defs>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 5-8 降采样数据流程与数据量对比（例子）</text>
    <text x="88" y="64" font-size="12" fill="#64748B">连续查询逐级聚合；粒度变粗，数据量与长期存储成本同步下降。</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- CQ 主链路（先画） -->
    <line x1="500" y1="270" x2="538" y2="270" stroke="#2563EB" stroke-width="2.4" marker-end="url(#mk-blue)"/>
    <text x="519" y="254" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">CQ：每分钟</text>
    <line x1="880" y1="270" x2="918" y2="270" stroke="#2563EB" stroke-width="2.4" marker-end="url(#mk-blue)"/>
    <text x="899" y="254" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">CQ：每小时</text>
    <line x1="1260" y1="270" x2="1298" y2="270" stroke="#2563EB" stroke-width="2.4" marker-end="url(#mk-blue)"/>
    <text x="1279" y="254" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">CQ：每天</text>

    <!-- 查询路径（虚线，先画） -->
    <line x1="330" y1="380" x2="700" y2="432" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#mk-gray)"/>
    <line x1="710" y1="380" x2="800" y2="432" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#mk-gray)"/>
    <line x1="1090" y1="380" x2="900" y2="432" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#mk-gray)"/>
    <line x1="1470" y1="380" x2="1000" y2="432" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#mk-gray)"/>

    <!-- 原始数据桶 -->
    <rect x="160" y="160" width="340" height="220" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
    <rect x="160" y="160" width="340" height="54" rx="10" fill="#7C3AED"/>
    <rect x="160" y="194" width="340" height="20" fill="#7C3AED"/>
    <text x="330" y="196" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">原始数据桶</text>
    <text x="330" y="248" font-size="14" fill="#475569" text-anchor="middle">10 秒级精度 · 短保留窗口</text>
    <rect x="185" y="276" width="290" height="18" rx="4" fill="#7C3AED"/>
    <text x="330" y="330" font-size="15" font-weight="600" fill="#475569" text-anchor="middle">数据量：原始基准</text>

    <!-- 分钟聚合桶 -->
    <rect x="540" y="160" width="340" height="220" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="540" y="160" width="340" height="54" rx="10" fill="#2563EB"/>
    <rect x="540" y="194" width="340" height="20" fill="#2563EB"/>
    <text x="710" y="196" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">分钟聚合桶</text>
    <text x="710" y="248" font-size="14" fill="#475569" text-anchor="middle">每分钟均值 · 短时趋势</text>
    <rect x="565" y="276" width="190" height="18" rx="4" fill="#2563EB"/>
    <text x="710" y="330" font-size="15" font-weight="600" fill="#475569" text-anchor="middle">数据量：显著减少</text>

    <!-- 小时聚合桶 -->
    <rect x="920" y="160" width="340" height="220" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <rect x="920" y="160" width="340" height="54" rx="10" fill="#0F766E"/>
    <rect x="920" y="194" width="340" height="20" fill="#0F766E"/>
    <text x="1090" y="196" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">小时聚合桶</text>
    <text x="1090" y="248" font-size="14" fill="#475569" text-anchor="middle">每小时均值 · 日报/周报</text>
    <rect x="945" y="276" width="120" height="18" rx="4" fill="#0F766E"/>
    <text x="1090" y="330" font-size="15" font-weight="600" fill="#475569" text-anchor="middle">数据量：大幅降低</text>

    <!-- 天聚合桶 -->
    <rect x="1300" y="160" width="340" height="220" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <rect x="1300" y="160" width="340" height="54" rx="10" fill="#F97316"/>
    <rect x="1300" y="194" width="340" height="20" fill="#F97316"/>
    <text x="1470" y="196" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">天聚合桶</text>
    <text x="1470" y="248" font-size="14" fill="#475569" text-anchor="middle">每天均值 · 年度趋势</text>
    <rect x="1325" y="276" width="70" height="18" rx="4" fill="#F97316"/>
    <text x="1470" y="330" font-size="15" font-weight="600" fill="#475569" text-anchor="middle">数据量：极小占比</text>

    <!-- 查询仪表盘 -->
    <rect x="560" y="434" width="680" height="72" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="900" y="464" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">查询仪表盘</text>
    <text x="900" y="492" font-size="14" fill="#475569" text-anchor="middle">应用层直接读取聚合数据</text>

    <!-- 分层保留策略 -->
    <rect x="160" y="555" width="1480" height="165" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="200" y="596" font-size="20" font-weight="700" fill="#334155">分层保留策略</text>
    <text x="330" y="640" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="middle">原始层</text>
    <text x="330" y="672" font-size="14" fill="#475569" text-anchor="middle">短期保留 · 故障回放</text>
    <text x="710" y="640" font-size="18" font-weight="700" fill="#2563EB" text-anchor="middle">分钟层</text>
    <text x="710" y="672" font-size="14" fill="#475569" text-anchor="middle">中期保留 · 短时趋势</text>
    <text x="1090" y="640" font-size="18" font-weight="700" fill="#0F766E" text-anchor="middle">小时层</text>
    <text x="1090" y="672" font-size="14" fill="#475569" text-anchor="middle">季度趋势 · 日报/周报</text>
    <text x="1470" y="640" font-size="18" font-weight="700" fill="#F97316" text-anchor="middle">天层</text>
    <text x="1470" y="672" font-size="14" fill="#475569" text-anchor="middle">长期保留 · 年度趋势</text>

    <!-- 图例 -->
    <line x1="300" y1="762" x2="360" y2="762" stroke="#2563EB" stroke-width="2.4" marker-end="url(#mk-blue)"/>
    <text x="372" y="768" font-size="15" fill="#475569">实线箭头：连续查询驱动自动化聚合</text>
    <line x1="830" y1="762" x2="890" y2="762" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#mk-gray)"/>
    <text x="902" y="768" font-size="15" fill="#475569">虚线箭头：应用层查询路径</text>

    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图 5-8 降采样数据流程与数据量对比：三级降采样将数据量逐级压缩，原始层短保留用于故障回放，分钟/小时/天层分别支撑短时趋势、日报与年度趋势。</text>
  </svg>
</svg>
  </main>
</body>
</html>
