<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图5-3 消息队列缓冲削峰示意</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图5-3 消息队列缓冲削峰示意</title>
  <desc id="desc">读者应理解设备认证与数据加密流程中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">

  
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图5-3 消息队列缓冲削峰示意</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解设备认证与数据加密流程中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">FLOWCHART</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="flowchart">
  <!-- 泳道区域 -->
  <rect x="120" y="160" width="460" height="500" rx="14" fill="none" stroke="#94A3B8" stroke-dasharray="8,4" stroke-width="1.5"/>
  <text x="140" y="185" fill="#64748B" font-size="14" font-weight="600">设备侧</text>
  
  <rect x="620" y="160" width="460" height="500" rx="14" fill="none" stroke="#94A3B8" stroke-dasharray="8,4" stroke-width="1.5"/>
  <text x="640" y="185" fill="#64748B" font-size="14" font-weight="600">网络</text>
  
  <rect x="1120" y="160" width="460" height="500" rx="14" fill="none" stroke="#94A3B8" stroke-dasharray="8,4" stroke-width="1.5"/>
  <text x="1140" y="185" fill="#64748B" font-size="14" font-weight="600">平台侧</text>

  <!-- 连接线 -->
  <path d="M450,260 L750,260" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <g>
    <rect x="460" y="240" width="280" height="20" fill="white" rx="4"/>
    <text x="600" y="254" fill="#0F172A" font-size="12" text-anchor="middle">1. ClientHello / Token请求</text>
  </g>

  <path d="M950,260 L1180,260" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <g>
    <rect x="990" y="240" width="150" height="20" fill="white" rx="4"/>
    <text x="1065" y="254" fill="#0F172A" font-size="12" text-anchor="middle">2. 转发握手消息</text>
  </g>

  <path d="M1180,280 L950,280" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>
  <g>
    <rect x="965" y="280" width="200" height="20" fill="white" rx="4"/>
    <text x="1065" y="294" fill="#0F172A" font-size="12" text-anchor="middle">3. 握手完成 / Token签发</text>
  </g>

  <path d="M750,280 L450,280" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>
  <g>
    <rect x="515" y="280" width="170" height="20" fill="white" rx="4"/>
    <text x="600" y="294" fill="#0F172A" font-size="12" text-anchor="middle">4. 加密通道建立通知</text>
  </g>

  <path d="M350,300 L350,440 L680,440" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <g>
    <rect x="415" y="430" width="200" height="20" fill="white" rx="4"/>
    <text x="515" y="444" fill="#0F172A" font-size="12" text-anchor="middle">5. 加密数据流 (DTLS)</text>
  </g>

  <path d="M880,440 L1180,440" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <g>
    <rect x="965" y="430" width="130" height="20" fill="white" rx="4"/>
    <text x="1030" y="444" fill="#0F172A" font-size="12" text-anchor="middle">6. 解密后的数据</text>
  </g>

  <!-- 组件 -->
  <rect x="250" y="220" width="200" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="350" y="246" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">设备</text>
  <text x="350" y="264" fill="#475569" font-size="11" text-anchor="middle">发起连接</text>

  <polygon points="750,260 850,210 950,260 850,310" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="850" y="252" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">TLS/DTLS握手</text>
  <text x="850" y="270" fill="#475569" font-size="11" text-anchor="middle">协商加密密钥</text>

  <rect x="1180" y="220" width="180" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1270" y="246" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">认证服务</text>
  <text x="1270" y="264" fill="#475569" font-size="11" text-anchor="middle">验证身份</text>

  <path d="M680,390 h200 v80 a40,40 0 0,1 -40,40 h-120 a40,40 0 0,1 -40,-40 z" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="780" y="435" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">加密通道</text>
  <text x="780" y="455" fill="#475569" font-size="11" text-anchor="middle">数据流加密传输</text>

  <rect x="1180" y="400" width="180" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1270" y="426" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">后端业务</text>
  <text x="1270" y="444" fill="#475569" font-size="11" text-anchor="middle">处理解密后数据</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">青绿色=设备侧；灰色=网络传输层；蓝色=平台核心服务</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头=请求/数据流；虚线箭头=握手完成/Token返回</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">主链路从设备出发，经过TLS握手到达平台认证服务，后建立加密通道</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图5-3 设备认证与数据加密的主要流程，涵盖证书/Token方式与TLS/DTLS加密层。</text>
  </svg>
</svg>
    <section class="meta" style="display:none">
      <div class="card"><div class="label">图表类型</div><div class="value">flowchart</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">从左到右泳道图，设备侧、网络、平台侧三个泳道。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
