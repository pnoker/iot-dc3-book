<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="60.000" width="1152.000" height="640.000" viewBox="0 0 1800.000 1000.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <!-- ========== title ========== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="86" y="48" font-size="22" font-weight="700" fill="#0F172A">图5-1 物联网平台分层架构与平台层中枢定位</text>
  <text x="86" y="72" font-size="12" fill="#64748B">IoT Platform Layered Architecture · 感知/网络/平台/应用四层 · 平台层承上启下</text>
  <rect x="1632" y="28" width="128" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1696" y="47" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.5">LAYERED</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0"/>

  <!-- ========== left gutter : two flow rails ========== -->
  <!-- control source tag (top, blue) -->
  <rect x="115" y="146" width="120" height="24" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="175" y="163" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">应用 · 控制源</text>
  <!-- blue rail : 控制流 downward -->
  <line x1="175" y1="174" x2="175" y2="828" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text transform="translate(202,500) rotate(90)" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">控制流 · 下行</text>

  <!-- data source tag (bottom, green) -->
  <rect x="25" y="836" width="120" height="24" rx="5" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="85" y="853" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">感知 · 数据源</text>
  <!-- green rail : 数据流 upward -->
  <line x1="85" y1="832" x2="85" y2="176" stroke="#10B981" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text transform="translate(58,500) rotate(-90)" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">数据流 · 上行</text>

  <!-- crossing dots where rails span each layer -->
  <circle cx="85" cy="197" r="3" fill="#10B981"/>
  <circle cx="85" cy="410" r="3" fill="#10B981"/>
  <circle cx="85" cy="622" r="3" fill="#10B981"/>
  <circle cx="85" cy="807" r="3" fill="#10B981"/>
  <circle cx="175" cy="197" r="3" fill="#2563EB"/>
  <circle cx="175" cy="410" r="3" fill="#2563EB"/>
  <circle cx="175" cy="622" r="3" fill="#2563EB"/>
  <circle cx="175" cy="807" r="3" fill="#2563EB"/>

  <!-- ========== L1 应用层 (purple) y=125-270 ========== -->
  <rect x="245" y="125" width="1525" height="145" rx="12" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="262" y="113" width="230" height="26" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="377" y="131" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">应用层 · Application</text>

  <rect x="320" y="175" width="440" height="75" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="540" y="205" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">可视化大屏</text>
  <text x="540" y="225" font-size="10" fill="#475569" text-anchor="middle">dashboard · BI</text>
  <text x="540" y="243" font-size="9" fill="#64748B" text-anchor="middle">实时态势 · 指标分析</text>

  <rect x="800" y="175" width="440" height="75" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1020" y="205" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">告警与工单</text>
  <text x="1020" y="225" font-size="10" fill="#475569" text-anchor="middle">alert · ticketing</text>
  <text x="1020" y="243" font-size="9" fill="#64748B" text-anchor="middle">阈值告警 · 闭环处置</text>

  <rect x="1280" y="175" width="440" height="75" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1500" y="205" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">开放 API 服务</text>
  <text x="1500" y="225" font-size="10" fill="#475569" text-anchor="middle">open api · saas</text>
  <text x="1500" y="243" font-size="9" fill="#64748B" text-anchor="middle">能力开放 · 第三方集成</text>

  <!-- ========== L2 平台层 (orange, HIGHLIGHTED) y=310-510 ========== -->
  <rect x="245" y="310" width="1525" height="200" rx="12" fill="#FEF3C7" fill-opacity="0.35" stroke="#F59E0B" stroke-width="2.5"/>
  <rect x="262" y="298" width="320" height="26" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="422" y="316" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">平台层 · Platform（中枢）</text>
  <!-- 中枢 badge -->
  <rect x="600" y="301" width="92" height="22" rx="11" fill="#F59E0B"/>
  <text x="646" y="317" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">承上启下</text>

  <!-- platform internal blocks (y=360-460) -->
  <!-- 1 设备接入 -->
  <rect x="305" y="360" width="310" height="100" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="460" y="395" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">设备接入</text>
  <text x="460" y="416" font-size="10" fill="#475569" text-anchor="middle">device access</text>
  <text x="460" y="438" font-size="9" fill="#64748B" text-anchor="middle">协议接入 · 设备影子</text>
  <!-- 2 消息处理 -->
  <rect x="670" y="360" width="310" height="100" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="825" y="395" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">消息处理</text>
  <text x="825" y="416" font-size="10" fill="#475569" text-anchor="middle">message broker</text>
  <text x="825" y="438" font-size="9" fill="#64748B" text-anchor="middle">规则引擎 · 流计算</text>
  <!-- 3 存储 (cylinder) -->
  <rect x="1035" y="360" width="310" height="100" fill="#FFFFFF" stroke="none"/>
  <line x1="1035" y1="368" x2="1035" y2="452" stroke="#F59E0B" stroke-width="2"/>
  <line x1="1345" y1="368" x2="1345" y2="452" stroke="#F59E0B" stroke-width="2"/>
  <ellipse cx="1190" cy="368" rx="155" ry="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <path d="M1035 452 A155 8 0 0 0 1345 452" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="1190" y="400" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">存储</text>
  <text x="1190" y="421" font-size="10" fill="#475569" text-anchor="middle">persistence</text>
  <text x="1190" y="443" font-size="9" fill="#64748B" text-anchor="middle">时序库 · 关系库</text>
  <!-- 4 应用使能 -->
  <rect x="1400" y="360" width="310" height="100" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1555" y="395" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">应用使能</text>
  <text x="1555" y="416" font-size="10" fill="#475569" text-anchor="middle">application enablement</text>
  <text x="1555" y="438" font-size="9" fill="#64748B" text-anchor="middle">API 网关 · 服务编排</text>

  <!-- orange internal arrows (设备接入 → 消息处理 → 存储 → 应用使能) -->
  <line x1="618" y1="410" x2="666" y2="410" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ah-orange)"/>
  <line x1="983" y1="410" x2="1033" y2="410" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ah-orange)"/>
  <line x1="1348" y1="410" x2="1396" y2="410" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ah-orange)"/>

  <!-- ========== L3 网络层 (blue) y=550-695 ========== -->
  <rect x="245" y="550" width="1525" height="145" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="262" y="538" width="220" height="26" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="372" y="556" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">网络层 · Network</text>

  <rect x="320" y="600" width="440" height="75" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="540" y="630" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">短距通信</text>
  <text x="540" y="650" font-size="10" fill="#475569" text-anchor="middle">short-range</text>
  <text x="540" y="668" font-size="9" fill="#64748B" text-anchor="middle">Zigbee · BLE · Wi-Fi</text>

  <rect x="800" y="600" width="440" height="75" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1020" y="630" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">蜂窝网络</text>
  <text x="1020" y="650" font-size="10" fill="#475569" text-anchor="middle">cellular</text>
  <text x="1020" y="668" font-size="9" fill="#64748B" text-anchor="middle">4G · 5G · NB-IoT</text>

  <rect x="1280" y="600" width="440" height="75" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1500" y="630" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">工业总线</text>
  <text x="1500" y="650" font-size="10" fill="#475569" text-anchor="middle">industrial bus</text>
  <text x="1500" y="668" font-size="9" fill="#64748B" text-anchor="middle">Modbus · OPC UA · Profinet</text>

  <!-- ========== L4 感知层 (green) y=735-880 ========== -->
  <rect x="245" y="735" width="1525" height="145" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="262" y="723" width="230" height="26" rx="5" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="377" y="741" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">感知层 · Perception</text>

  <rect x="320" y="785" width="440" height="75" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="540" y="815" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">智能传感器</text>
  <text x="540" y="835" font-size="10" fill="#475569" text-anchor="middle">smart sensors</text>
  <text x="540" y="853" font-size="9" fill="#64748B" text-anchor="middle">温 / 湿 / 振 / 流量采集</text>

  <rect x="800" y="785" width="440" height="75" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1020" y="815" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">控制器</text>
  <text x="1020" y="835" font-size="10" fill="#475569" text-anchor="middle">controllers</text>
  <text x="1020" y="853" font-size="9" fill="#64748B" text-anchor="middle">PLC · 嵌入式 MCU</text>

  <rect x="1280" y="785" width="440" height="75" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1500" y="815" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">执行器</text>
  <text x="1500" y="835" font-size="10" fill="#475569" text-anchor="middle">actuators</text>
  <text x="1500" y="853" font-size="9" fill="#64748B" text-anchor="middle">电机 / 阀门 / 报警终端</text>

  <!-- ========== legend ========== -->
  <line x1="40" y1="900" x2="1760" y2="900" stroke="#E2E8F0"/>
  <text x="40" y="924" font-size="11" font-weight="700" fill="#475569" letter-spacing="1">图例 LEGEND</text>

  <rect x="150" y="915" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="172" y="925" font-size="11" fill="#334155">感知层（设备/终端）</text>

  <rect x="340" y="915" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="362" y="925" font-size="11" fill="#334155">网络层（连接/传输）</text>

  <rect x="530" y="915" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="552" y="925" font-size="11" fill="#334155">平台层（中枢·高亮）</text>

  <rect x="720" y="915" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="742" y="925" font-size="11" fill="#334155">应用层（业务呈现）</text>

  <line x1="900" y1="921" x2="940" y2="921" stroke="#10B981" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="950" y="925" font-size="11" fill="#334155">数据流（上行）</text>

  <line x1="1100" y1="921" x2="1140" y2="921" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="1150" y="925" font-size="11" fill="#334155">控制流（下行）</text>

  <line x1="1300" y1="921" x2="1340" y2="921" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ah-orange)"/>
  <text x="1350" y="925" font-size="11" fill="#334155">平台内流转</text>

  <!-- ========== caption ========== -->
  <text x="900" y="962" font-size="10" fill="#94A3B8" text-anchor="middle">图5-1 数据流（绿色上行）从感知层贯穿至应用层，控制流（蓝色下行）反向；平台层是信息中枢，</text>
  <text x="900" y="980" font-size="10" fill="#94A3B8" text-anchor="middle">其内部按 设备接入 → 消息处理 → 存储 → 应用使能 顺序流转，构成数据链路闭环的骨干。</text>
  </svg>
</svg>