<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图5-1 物联网平台分层架构示意</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图5-1 物联网平台分层架构示意</title>
  <desc id="desc">平台层承上启下：数据向上汇聚，控制指令向下传递。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <defs>
      <marker id="mk-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
      <marker id="mk-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
      <marker id="mk-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F97316"/></marker>
    </defs>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图5-1 物联网平台分层架构示意</text>
    <text x="88" y="64" font-size="12" fill="#64748B">平台层承上启下：数据向上汇聚，控制指令向下传递。</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 数据流（上行，青绿）与控制流（下行，蓝）先画 -->
    <line x1="150" y1="720" x2="150" y2="185" stroke="#0F766E" stroke-width="2.4" marker-end="url(#mk-teal)"/>
    <text x="150" y="455" transform="rotate(-90 150 455)" font-size="18" font-weight="600" fill="#0F766E" text-anchor="middle">数据上行</text>
    <line x1="1650" y1="185" x2="1650" y2="720" stroke="#2563EB" stroke-width="2.4" marker-end="url(#mk-blue)"/>
    <text x="1650" y="455" transform="rotate(90 1650 455)" font-size="18" font-weight="600" fill="#2563EB" text-anchor="middle">控制下行</text>

    <!-- 应用层（浅紫） -->
    <rect x="270" y="140" width="1260" height="105" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
    <text x="900" y="180" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">应用层</text>
    <text x="900" y="215" font-size="15" fill="#475569" text-anchor="middle">监控大屏 · 移动 App · AI 模型 · 企业系统集成</text>

    <!-- 平台层（浅橙，最高，内含四个组件方块） -->
    <rect x="270" y="265" width="1260" height="240" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="900" y="300" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">平台层</text>
    <rect x="310" y="325" width="250" height="104" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.6"/>
    <text x="435" y="368" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">设备接入</text>
    <text x="435" y="398" font-size="12" fill="#64748B" text-anchor="middle">协议适配</text>
    <rect x="610" y="325" width="250" height="104" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.6"/>
    <text x="735" y="368" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">消息处理</text>
    <text x="735" y="398" font-size="12" fill="#64748B" text-anchor="middle">队列缓冲</text>
    <rect x="910" y="325" width="250" height="104" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.6"/>
    <text x="1035" y="368" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">存储</text>
    <text x="1035" y="398" font-size="12" fill="#64748B" text-anchor="middle">时序 / 关系库</text>
    <rect x="1210" y="325" width="250" height="104" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.6"/>
    <text x="1335" y="368" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">应用使能</text>
    <text x="1335" y="398" font-size="12" fill="#64748B" text-anchor="middle">API / 订阅</text>
    <line x1="564" y1="377" x2="606" y2="377" stroke="#F97316" stroke-width="2.2" marker-end="url(#mk-orange)"/>
    <line x1="864" y1="377" x2="906" y2="377" stroke="#F97316" stroke-width="2.2" marker-end="url(#mk-orange)"/>
    <line x1="1164" y1="377" x2="1206" y2="377" stroke="#F97316" stroke-width="2.2" marker-end="url(#mk-orange)"/>

    <!-- 网络层（浅蓝） -->
    <rect x="270" y="525" width="1260" height="110" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="900" y="565" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">网络层</text>
    <text x="900" y="600" font-size="15" fill="#475569" text-anchor="middle">无线局域网 · 蜂窝 / LPWAN · 有线</text>

    <!-- 感知层（浅绿） -->
    <rect x="270" y="655" width="1260" height="110" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="900" y="695" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">感知层</text>
    <text x="900" y="730" font-size="15" fill="#475569" text-anchor="middle">传感器 · 执行器 · RFID</text>

    <!-- 图例 -->
    <line x1="300" y1="818" x2="360" y2="818" stroke="#0F766E" stroke-width="2.4" marker-end="url(#mk-teal)"/>
    <text x="372" y="824" font-size="15" fill="#475569">数据流（上行感知数据）</text>
    <line x1="730" y1="818" x2="790" y2="818" stroke="#2563EB" stroke-width="2.4" marker-end="url(#mk-blue)"/>
    <text x="802" y="824" font-size="15" fill="#475569">控制流（下行命令）</text>
    <line x1="1140" y1="818" x2="1200" y2="818" stroke="#F97316" stroke-width="2.2" marker-end="url(#mk-orange)"/>
    <text x="1212" y="824" font-size="15" fill="#475569">平台层内部处理顺序</text>

    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图5-1 物联网平台分层架构示意：感知层采集物理信号并数字化，经网络层传输至平台层完成协议转换、消息缓冲、规则判断与存储，再通过 API 暴露给应用层提供人机交互与决策支持。</text>
  </svg>
</svg>
  </main>
</body>
</html>
