  <style>

  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图5-1 物联网平台分层架构示意</title>
  <desc id="desc">读者应理解物联网的四层职责边界，以及数据流和控制流的方向差异。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">

  
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图5-1 物联网平台分层架构示意</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解物联网的四层职责边界，以及数据流和控制流的方向差异。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LAYERED</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="layered">
  <!-- 连线: 数据流绿色，控制流蓝色，平台内部橙色 -->
  <!-- 数据流：感知层->网络层 -->
  <line x1="860" y1="655" x2="860" y2="635" stroke="#10B981" stroke-width="2" />
  <polygon points="860,631 856,639 864,639" fill="#10B981" />
  <!-- 数据流：网络层->平台层 -->
  <line x1="860" y1="485" x2="860" y2="465" stroke="#10B981" stroke-width="2" />
  <polygon points="860,461 856,469 864,469" fill="#10B981" />
  <!-- 数据流：平台层->应用层 -->
  <line x1="860" y1="265" x2="860" y2="245" stroke="#10B981" stroke-width="2" />
  <polygon points="860,241 856,249 864,249" fill="#10B981" />
  <!-- 控制流：应用层->平台层 -->
  <line x1="860" y1="245" x2="860" y2="265" stroke="#2563EB" stroke-width="2" />
  <polygon points="860,269 856,261 864,261" fill="#2563EB" />
  <!-- 控制流：平台层->网络层 -->
  <line x1="860" y1="465" x2="860" y2="485" stroke="#2563EB" stroke-width="2" />
  <polygon points="860,489 856,481 864,481" fill="#2563EB" />
  <!-- 控制流：网络层->感知层 -->
  <line x1="860" y1="635" x2="860" y2="655" stroke="#2563EB" stroke-width="2" />
  <polygon points="860,659 856,651 864,651" fill="#2563EB" />
  <!-- 平台内部箭头（橙色） -->
  <line x1="545" y1="345" x2="565" y2="345" stroke="#F97316" stroke-width="2" />
  <polygon points="569,345 561,341 561,349" fill="#F97316" />
  <line x1="850" y1="345" x2="870" y2="345" stroke="#F97316" stroke-width="2" />
  <polygon points="874,345 866,341 866,349" fill="#F97316" />
  <line x1="1155" y1="345" x2="1175" y2="345" stroke="#F97316" stroke-width="2" />
  <polygon points="1179,345 1171,341 1171,349" fill="#F97316" />
  
  <!-- 各层矩形 -->
  <!-- 应用层（浅紫） -->
  <rect x="260" y="125" width="1200" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" />
  <!-- 平台层（浅橙） -->
  <rect x="260" y="265" width="1200" height="200" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
  <!-- 网络层（浅蓝） -->
  <rect x="260" y="485" width="1200" height="150" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
  <!-- 感知层（浅绿） -->
  <rect x="260" y="655" width="1200" height="100" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
  
  <!-- 平台内部四个方块 -->
  <rect x="260" y="305" width="285" height="80" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1" />
  <rect x="565" y="305" width="285" height="80" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1" />
  <rect x="870" y="305" width="285" height="80" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1" />
  <rect x="1175" y="305" width="285" height="80" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1" />
  
  <!-- 层标题与副标题 -->
  <!-- 应用层 -->
  <text x="860" y="151" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" text-anchor="middle">应用层</text>
  <text x="860" y="169" fill="#64748B" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" text-anchor="middle">大屏/App/AI/系统</text>
  <!-- 平台层 -->
  <text x="860" y="291" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" text-anchor="middle">平台层</text>
  <!-- 网络层 -->
  <text x="860" y="511" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" text-anchor="middle">网络层</text>
  <text x="860" y="529" fill="#64748B" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" text-anchor="middle">无线/WAN/有线</text>
  <!-- 感知层 -->
  <text x="860" y="681" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" text-anchor="middle">感知层</text>
  <text x="860" y="699" fill="#64748B" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" text-anchor="middle">传感器、执行器</text>
  
  <!-- 平台内部方块文字 -->
  <text x="402.5" y="335" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="600" text-anchor="middle">设备接入</text>
  <text x="707.5" y="335" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="600" text-anchor="middle">消息处理</text>
  <text x="1012.5" y="335" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="600" text-anchor="middle">存储</text>
  <text x="1317.5" y="335" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="600" text-anchor="middle">应用使能</text>
  
  <!-- 连线上的短标签 -->
  <text x="870" y="645" fill="#10B981" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" text-anchor="start">数据</text>
  <text x="850" y="255" fill="#2563EB" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" text-anchor="end">控制</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">绿色箭头: 数据流（上行感知数据）</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色箭头: 控制流（下行命令）</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">橙色水平箭头: 平台层内部处理顺序</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图5-1 物联网平台分层架构示意。感知层采集物理信号并数字化，经网络层传输至平台层；平台层完成协议转换、消息缓冲、规则判断与存储，最后通过API暴露给应用层；应用层提供人机交互与决策支持。</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">layered</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">自下而上四个矩形堆叠，每层宽度一致，颜色不同；平台层内部用四个更小的水平方块表示组件流程。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
