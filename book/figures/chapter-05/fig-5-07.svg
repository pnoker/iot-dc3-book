  <!-- ===== Caption ===== -->
  <text x="900" y="990" font-size="10" fill="#94A3B8" text-anchor="middle">图5-7 四层架构：设备经 Modbus RTU 上报边缘网关；边缘做两级阈值判断，超硬阈值→GPIO 紧急停机（橙，不经云端），超软阈值或正常→MQTT 经桥接进 Kafka（4.0 KRaft）；云层消费者写入 InfluxDB 3.0，AI 孤立森林打分，告警经 SMTP/短信推送，Grafana 可视化；下行指令走独立 Topic。</text>
