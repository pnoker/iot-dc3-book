<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图 5-5 数据传输的 QoS 分级与容错机制</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">图 5-5 数据传输的 QoS 分级与容错机制</title>
  <desc id="desc">QoS只定义单个MQTT协议跳的报文语义；会话、幂等、顺序、效果回读与本地联锁共同构成完整边界。</desc>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="560" viewBox="0 0 1800 900" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 5-5 数据传输的 QoS 分级与容错机制</text>
  <text x="88" y="64" font-size="12" fill="#64748B">报文丢了怎么办？重复了怎么办？断了如何续接？</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- QoS 0 -->
  <rect x="80" y="140" width="520" height="220" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="340" y="178" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">QoS 0 · 至多一次</text>
  <text x="116" y="214" font-size="12" fill="#475569">发送方不等待协议确认，报文可能丢失</text>
  <text x="116" y="240" font-size="12" fill="#475569">交互最少；结果仍取决于链路与实现</text>
  <text x="116" y="278" font-size="12" font-weight="700" fill="#0F172A">适用：可容忍单点缺失的遥测</text>
  <text x="116" y="304" font-size="11" fill="#64748B">例：高频趋势值；缺失不影响安全与关键结算</text>
  <text x="116" y="338" font-size="11" fill="#64748B">1 步（发布即完成）</text>

  <!-- QoS 1 -->
  <rect x="640" y="140" width="520" height="220" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="178" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">QoS 1 · 至少一次</text>
  <text x="676" y="214" font-size="12" fill="#475569">等待 PUBACK；确认缺失时可能重发</text>
  <text x="676" y="240" font-size="12" fill="#475569">协议跳内至少一次，接收方可能见到重复</text>
  <text x="676" y="278" font-size="12" font-weight="700" fill="#0F172A">适用：可用业务幂等收敛的消息</text>
  <text x="676" y="304" font-size="11" fill="#64748B">例：充电宝开柜指令，ACK 丢失→重传→重复开锁</text>
  <text x="676" y="338" font-size="11" fill="#64748B">2 步（发布 + 确认 + 超时重传）</text>

  <!-- QoS 2 -->
  <rect x="1200" y="140" width="520" height="220" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1460" y="178" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">QoS 2 · 协议跳内交付一次</text>
  <text x="1236" y="214" font-size="12" fill="#475569">四步握手：PUBLISH → PUBREC → PUBREL → PUBCOMP</text>
  <text x="1236" y="240" font-size="12" fill="#475569">状态机消除该MQTT跳的重复交付</text>
  <text x="1236" y="278" font-size="12" font-weight="700" fill="#0F172A">适用：该协议跳必须消除重复且资源允许</text>
  <text x="1236" y="304" font-size="11" fill="#64748B">不保证数据库或物理动作只执行一次</text>
  <text x="1236" y="338" font-size="11" fill="#64748B">4 步（发布 + 三次握手）</text>

  <!-- 容错机制 -->
  <text x="80" y="420" font-size="15" font-weight="700" fill="#334155">QoS 之外的容错机制</text>

  <rect x="80" y="442" width="520" height="160" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="340" y="474" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">会话状态（MQTT 3.1.1 / 5.0）</text>
  <text x="116" y="510" font-size="12" fill="#475569">按会话过期、配额和消息过期保留状态</text>
  <text x="116" y="536" font-size="12" fill="#475569">重连需复用Client ID且会话尚未过期</text>
  <text x="116" y="562" font-size="12" fill="#475569">积压恢复要验证限流、重复与过期丢弃</text>
  <text x="116" y="588" font-size="11" fill="#64748B">持久会话不等于任意断网都无损</text>

  <rect x="640" y="442" width="520" height="160" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="474" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">幂等性设计（应用层去重）</text>
  <text x="676" y="510" font-size="12" fill="#475569">命令携带稳定ID，如 cmd-1234</text>
  <text x="676" y="536" font-size="12" fill="#475569">Inbox/唯一约束记录受理、状态与结果</text>
  <text x="676" y="562" font-size="12" fill="#475569">重复请求返回同一结果，不重复制造副作用</text>
  <text x="676" y="588" font-size="11" fill="#64748B">查重—执行—记账仍要处理崩溃原子性</text>

  <rect x="1200" y="442" width="520" height="160" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1460" y="474" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">数据乱序处理</text>
  <text x="1236" y="510" font-size="12" fill="#475569">跨连接/Broker无全局事件时间顺序</text>
  <text x="1236" y="536" font-size="12" fill="#475569">每设备序列号 + 源时间 + 接收时间</text>
  <text x="1236" y="562" font-size="12" fill="#475569">在明确窗口内重排、丢弃或合并</text>
  <text x="1236" y="588" font-size="11" fill="#64748B">同时定义序列重置与时钟漂移策略</text>

  <!-- 工程判断 -->
  <rect x="80" y="660" width="1640" height="80" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="692" font-size="14" font-weight="700" fill="#334155">工程判断：不要指望纯协议解决所有问题</text>
  <text x="120" y="720" font-size="12" fill="#475569">QoS按单跳丢失/重复容忍度选择；物理安全由本地联锁兜底，业务仍需授权、幂等、过期、效果回读与人工接管</text>

  <!-- Caption -->
  <text x="900" y="860" font-size="17" fill="#475569" text-anchor="middle">图 5-5 QoS限定单个MQTT跳的报文语义；会话、幂等、顺序和效果回读补齐业务边界，本地联锁守住安全底线。</text>
  </svg>
</svg>
  </main>
</body>
</html>
