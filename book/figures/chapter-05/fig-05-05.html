<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图5-5 云边协同三大挑战的关联与权衡三角架</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图5-5 云边协同三大挑战的关联与权衡三角架</title>
  <desc id="desc">一致性、安全性和运维相互牵制，不能孤立优化。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图5-5 云边协同三大挑战的关联与权衡三角架</text>
    <text x="88" y="64" font-size="12" fill="#64748B">一致性、安全性和运维相互牵制，不能孤立优化。</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 三角架（三边实线，先画） -->
    <polygon points="420,250 1380,250 900,720" fill="#F8FAFC" fill-opacity="0.6" stroke="#64748B" stroke-width="2"/>

    <!-- 三条边的牵制关系标签 -->
    <rect x="780" y="200" width="240" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="900" y="221" font-size="13" fill="#475569" text-anchor="middle">强加密拖慢同步 / 放宽一致引入漏洞</text>
    <rect x="1015" y="470" width="250" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="1140" y="491" font-size="13" fill="#475569" text-anchor="middle">安全策略加重运维 / 简化运维降低安全</text>
    <rect x="555" y="470" width="210" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="660" y="491" font-size="13" fill="#475569" text-anchor="middle">强一致加重运维 / 最终一致更简单</text>

    <!-- 顶点 -->
    <circle cx="420" cy="250" r="18" fill="#2563EB"/>
    <circle cx="1380" cy="250" r="18" fill="#DC2626"/>
    <circle cx="900" cy="720" r="18" fill="#0F766E"/>

    <!-- 中心权衡区 -->
    <circle cx="900" cy="400" r="92" fill="#FEFCE8" stroke="#D97706" stroke-width="2"/>
    <text x="900" y="392" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">工程权衡区</text>
    <text x="900" y="424" font-size="14" fill="#475569" text-anchor="middle">按后果、时延与成本取舍</text>

    <!-- 数据一致性（左，蓝） -->
    <line x1="420" y1="250" x2="420" y2="330" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="100" y="140" width="320" height="180" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="260" y="178" font-size="22" font-weight="700" fill="#2563EB" text-anchor="middle">数据一致性</text>
    <line x1="130" y1="200" x2="390" y2="200" stroke="#BFDBFE" stroke-width="1"/>
    <circle cx="142" cy="226" r="4" fill="#2563EB"/>
    <text x="154" y="232" font-size="15" fill="#475569">最终一致性模型</text>
    <circle cx="142" cy="256" r="4" fill="#2563EB"/>
    <text x="154" y="262" font-size="15" fill="#475569">版本向量 / 乐观锁</text>
    <circle cx="142" cy="286" r="4" fill="#2563EB"/>
    <text x="154" y="292" font-size="15" fill="#475569">冲突合并策略</text>

    <!-- 安全性（右，红） -->
    <line x1="1380" y1="250" x2="1380" y2="330" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="1380" y="140" width="320" height="180" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
    <text x="1540" y="178" font-size="22" font-weight="700" fill="#DC2626" text-anchor="middle">安全性</text>
    <line x1="1410" y1="200" x2="1670" y2="200" stroke="#FECACA" stroke-width="1"/>
    <circle cx="1422" cy="226" r="4" fill="#DC2626"/>
    <text x="1434" y="232" font-size="15" fill="#475569">硬件信任根（TPM）</text>
    <circle cx="1422" cy="256" r="4" fill="#DC2626"/>
    <text x="1434" y="262" font-size="15" fill="#475569">OTA 签名验签</text>
    <circle cx="1422" cy="286" r="4" fill="#DC2626"/>
    <text x="1434" y="292" font-size="15" fill="#475569">安全启动与运行时防护</text>

    <!-- 运维（底部，青绿） -->
    <line x1="900" y1="720" x2="900" y2="780" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="560" y="790" width="680" height="120" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="900" y="826" font-size="22" font-weight="700" fill="#0F766E" text-anchor="middle">运维</text>
    <line x1="590" y1="845" x2="1210" y2="845" stroke="#BBF7D0" stroke-width="1"/>
    <circle cx="720" cy="872" r="4" fill="#0F766E"/>
    <text x="732" y="878" font-size="15" fill="#475569">OTA 批量管理</text>
    <circle cx="960" cy="872" r="4" fill="#0F766E"/>
    <text x="972" y="878" font-size="15" fill="#475569">远程配置下发</text>
    <circle cx="1220" cy="872" r="4" fill="#0F766E"/>
    <text x="1232" y="878" font-size="15" fill="#475569">可观测性与自动告警</text>

    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图5-5 云边协同的难点在于三个维度互相牵制：强化安全性可能增加运维复杂度，追求强一致会影响系统弹性，工程设计的核心是找到项目可接受的平衡点。</text>
  </svg>
</svg>
  </main>
</body>
</html>
