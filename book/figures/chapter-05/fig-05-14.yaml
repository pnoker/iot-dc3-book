type: matrix
title: 图 5-14 平台层工程检查矩阵
audience_takeaway: 检查项覆盖功能、容量、容错和回滚，但确认等级、副本数、分区数、批大小等参数必须由风险目标和测试确定。
purpose: 用五个工程维度与四类质量属性建立可验证的评审矩阵，避免把案例参数误写成通用默认值。
visual_focus: 五行工程维度与四列质量属性的交叉检查项；红色表示失败边界，黄色表示上线前证据项。
design_level: decision
layout: 5 行 × 4 列矩阵，底部附文字与形状双重编码的风险图例。
elements:
- 设备接入：协议兼容、连接规模、重连会话、版本管理。
- 消息队列：Topic 隔离、峰值/分区压测、确认/副本联合验证、失败消息监控。
- 时序数据库：键/分区建模、批量/尾延迟压测、保留/降采样、冷热分层。
- 边缘节点：本地闭环、缓存上限、断网补传、OTA 回滚。
- AI 模型：特征契约、推理资源、离线对照评测、模型回退。
relationships:
- 每个行列交叉点是一项必须留下证据的检查，而不是静态配置答案。
- 风险等级由影响与不确定性决定，并应在目标场景中复核。
callouts:
- 消息确认、同步副本和故障域必须联合验证。
- 批大小同时受吞吐、尾延迟、请求字节数和重试成本约束。
- 模型回退依赖离线/在线证据与确定性发布控制。
legend:
- 绿色圆点与对勾：常规验证。
- 黄色圆点与三角：上线前给出证据。
- 红色圆点与叉号：重点验证的失败边界。
visual_constraints:
- 单元格短语不超过十五个中文字符。
- 颜色之外同时使用符号和文字表达风险。
- 表格线、单元格与表头保持统一描边和对齐。
render_notes: HTML/SVG 渲染，表格同列等宽、同行等高；不出现 acks、副本数或批大小的硬编码默认值。
caption:
  zh: 图 5-14 平台层工程检查矩阵——参数不设通用默认值；红点标出失败边界，黄点标出上线前必须给出证据的项目。
  en: 'Figure 5-14 Platform-layer engineering check matrix — parameters have no universal defaults; red marks failure boundaries and yellow marks items that require evidence before launch.'
