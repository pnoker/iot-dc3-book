type: flowchart
title: 图 5-5 数据传输的 QoS 分级与容错机制
audience_takeaway: QoS 只定义单个 MQTT 协议跳的报文交付语义；会话恢复、业务幂等、事件顺序、效果回读和本地安全联锁仍需分别设计。
purpose: 区分 MQTT QoS 的协议保证与跨 Broker、数据库、业务和物理设备的端到端责任。
visual_focus: 上半部分比较 QoS 0/1/2，下半部分展示会话状态、幂等和顺序处理，底部明确本地安全边界。
design_level: flowchart
layout: 上半部三张等宽 QoS 卡片，下半部三张等宽容错卡片，底部用横向判断框收束。
elements:
- QoS 0：至多一次；发送方不等待协议确认，可用于容许单点缺失的遥测。
- QoS 1：至少一次；确认缺失会重发，业务必须处理重复。
- QoS 2：四步状态机在单个 MQTT 协议跳内消除重复交付，不保证业务或物理副作用只发生一次。
- 会话状态：受协议版本、Client ID、会话过期、配额、消息过期和 Broker 持久化约束。
- 幂等：稳定 ID、持久化状态与结果，并处理查重、执行和记账之间的崩溃窗口。
- 顺序：按设备序列号、源时间、接收时间和业务窗口处理，不假定全局事件顺序。
relationships:
- QoS 等级只按单个 MQTT 跳的丢失/重复容忍度和端点资源选择。
- 会话、幂等与顺序机制补充业务可靠性，但都不能替代本地安全联锁。
callouts:
- 受理、Broker 确认、消费成功、设备确认与效果回读是不同证据层级。
- QoS 2 不能把云端远程控制变成安全回路。
visual_constraints:
- 三列卡片等宽、等高、等距；文字不溢出卡片。
- 协议语义与业务语义使用不同措辞，避免“全链路恰好一次”。
- 底部工程判断必须保留本地联锁、授权、幂等、过期、效果回读和人工接管。
render_notes: HTML/SVG 渲染，QoS 三级与三类配套机制使用灰、蓝、红、绿、橙区分，但结论同时用文字表达。
caption:
  zh: 图 5-5 QoS限定单个MQTT跳的报文语义；会话、幂等、顺序和效果回读补齐业务边界，本地联锁守住安全底线。
  en: 'Figure 5-5 QoS bounds message semantics on a single MQTT hop; sessions, idempotency, ordering, and effect readback complete the business boundary, while local interlocks protect the safety baseline.'
labels:
  en:
    图 5-5 数据传输的 QoS 分级与容错机制: 'Figure 5-5 QoS Levels and Fault-Tolerance Boundaries'
    QoS只定义单个MQTT协议跳的报文语义；会话、幂等、顺序、效果回读与本地联锁共同构成完整边界。: 'QoS defines message semantics only on one MQTT hop; sessions, idempotency, ordering, effect readback, and local interlocks complete the boundary.'
    报文丢了怎么办？重复了怎么办？断了如何续接？: 'What if a message is lost, duplicated, or interrupted?'
    QoS 0 · 至多一次: 'QoS 0 · At Most Once'
    发送方不等待协议确认，报文可能丢失: 'The sender waits for no protocol ACK; the message may be lost'
    交互最少；结果仍取决于链路与实现: 'Fewest exchanges; outcome still depends on the link and implementation'
    适用：可容忍单点缺失的遥测: 'For telemetry that tolerates an individual missing sample'
    例：高频趋势值；缺失不影响安全与关键结算: 'Example: high-rate trends whose gaps affect neither safety nor critical settlement'
    1 步（发布即完成）: '1 step (publish and continue)'
    QoS 1 · 至少一次: 'QoS 1 · At Least Once'
    等待 PUBACK；确认缺失时可能重发: 'Wait for PUBACK; a missing ACK may cause retransmission'
    协议跳内至少一次，接收方可能见到重复: 'At least once on the hop; the receiver may see duplicates'
    适用：可用业务幂等收敛的消息: 'For messages whose duplicates can converge through business idempotency'
    例：充电宝开柜指令，ACK 丢失→重传→重复开锁: 'Example: locker command; lost ACK → retransmit → duplicate unlock'
    2 步（发布 + 确认 + 超时重传）: '2 steps (publish + ACK + timeout retry)'
    QoS 2 · 协议跳内交付一次: 'QoS 2 · Deliver Once on the Protocol Hop'
    四步握手：PUBLISH → PUBREC → PUBREL → PUBCOMP: 'Four exchanges: PUBLISH → PUBREC → PUBREL → PUBCOMP'
    状态机消除该MQTT跳的重复交付: 'The state machine removes duplicate delivery on this MQTT hop'
    适用：该协议跳必须消除重复且资源允许: 'For a hop that must eliminate duplicates and has sufficient resources'
    不保证数据库或物理动作只执行一次: 'Does not guarantee one database write or physical action'
    4 步（发布 + 三次握手）: '4 steps (publish + three acknowledgments)'
    QoS 之外的容错机制: 'Fault Tolerance Beyond QoS'
    会话状态（MQTT 3.1.1 / 5.0）: 'Session State (MQTT 3.1.1 / 5.0)'
    按会话过期、配额和消息过期保留状态: 'Retain state subject to session expiry, quotas, and message expiry'
    重连需复用Client ID且会话尚未过期: 'Reconnect with the same Client ID before the session expires'
    积压恢复要验证限流、重复与过期丢弃: 'Test rate limits, duplicates, and expiry while draining backlog'
    持久会话不等于任意断网都无损: 'A persistent session is not lossless recovery from every outage'
    幂等性设计（应用层去重）: 'Idempotency (Application-Layer Deduplication)'
    命令携带稳定ID，如 cmd-1234: 'Commands carry a stable ID, such as cmd-1234'
    Inbox/唯一约束记录受理、状态与结果: 'An Inbox or uniqueness constraint records acceptance, state, and result'
    重复请求返回同一结果，不重复制造副作用: 'A duplicate returns the same result without repeating the side effect'
    查重—执行—记账仍要处理崩溃原子性: 'Check, act, and record must still handle crash atomicity'
    数据乱序处理: 'Handling Reordering'
    跨连接/Broker无全局事件时间顺序: 'No global event-time order exists across connections or brokers'
    每设备序列号 + 源时间 + 接收时间: 'Per-device sequence + source time + receive time'
    在明确窗口内重排、丢弃或合并: 'Reorder, drop, or merge within an explicit window'
    同时定义序列重置与时钟漂移策略: 'Also define sequence-reset and clock-drift policies'
    工程判断：不要指望纯协议解决所有问题: 'Engineering judgment: a protocol alone cannot solve every failure'
    QoS按单跳丢失/重复容忍度选择；物理安全由本地联锁兜底，业务仍需授权、幂等、过期、效果回读与人工接管: 'Choose QoS by single-hop loss and duplicate tolerance; local interlocks protect physical safety, while business logic still needs authorization, idempotency, expiry, effect readback, and human takeover'
    图 5-5 QoS限定单个MQTT跳的报文语义；会话、幂等、顺序和效果回读补齐业务边界，本地联锁守住安全底线。: 'Figure 5-5 QoS bounds message semantics on a single MQTT hop; sessions, idempotency, ordering, and effect readback complete the business boundary, while local interlocks protect the safety baseline.'
