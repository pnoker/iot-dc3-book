render_notes: '使用三个横向块垂直堆叠，每块内元素水平排列，元素间距 8px。第一块背景 #E3F2FD 边框 #1565C0，第二块 #E8F5E9 边框 #2E7D32，第三块 #FFF3E0 边框 #E65100。每块左上角标注层名。层间用带箭头竖线连接，箭头上加标注文字。图例水平排放在图框下方，每个图例距 16px。图宽自适应，建议最小宽 600px。'
caption:
  zh: 图4-13 延伸阅读三圈学习路径。从第一圈蓝底（官方标准）开始，反复验证后进入第二圈绿底（动手实践），最后拓展到第三圈橙底（行业视野）。每圈内的条目旁标注了与本章的对应关系。
  en: 'Figure 4-13 The three-circle further-reading path. Start from the first blue circle (official standards), verify repeatedly before entering the second green circle (hands-on practice), and finally expand into the third orange circle (industry outlook). Each entry is annotated with its related section in this chapter.'
