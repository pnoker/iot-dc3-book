type: architecture
title: 图4-10 IoT DC3整体架构及驱动层位置
audience_takeaway: Driver SDK 与消息契约限制协议扩展的改动范围，但故障隔离、容量与跨层复用必须由配置和测试证明。
purpose: 展示 IoT DC3 的前端、核心服务、Driver、设备与数据源边界，以及命令、位号值和回执的主要消息路径。
visual_focus: Driver 层作为可扩展适配边界，经消息队列连接 Data 等核心服务，并面对各自独立验收的协议或数据源接口。
design_level: logical
layout: 自上而下排列平台服务域、Driver 层和设备/数据源；同级 Driver 等宽等距，每个适配器与其外部接口垂直对齐。
elements:
- 前端应用层：Vue.js Admin Console。
- 核心服务层：Gateway、Auth、Manager、Data、Agentic；服务地址以固定名称、容器 DNS 与环境变量配置。
- Driver 层：独立部署进程通过 Driver SDK 和消息契约适配 Modbus、OPC UA、PLC、数据源、虚拟测试或私有协议。
- 设备与数据源层：现场仪表、OPC UA 服务、PLC、数据库/API、仿真器和私有设备。
relationships:
- Data 等核心服务通过消息队列向 Driver 投递受控命令。
- Driver 通过消息队列上报位号值与执行回执。
- 每个 Driver 与外部设备或数据源之间都有独立的协议边界和验收责任。
regions:
- id: platform_domain
  label: 平台服务域
  role: 前端与核心服务边界
- id: source_domain
  label: 设备与数据源域
  role: Driver、现场设备与外部数据源边界
components:
- id: frontend
  label: 前端应用层
  type: application
  subtitle: Vue.js Admin Console
  group: platform_domain
  priority: primary
  shape: card
- id: core
  label: 核心服务层
  type: platform
  subtitle: Gateway / Auth / Manager / Data / Agentic
  group: platform_domain
  priority: primary
  shape: card
- id: driver
  label: 驱动层
  type: platform
  subtitle: 独立部署进程 + Driver SDK + 消息契约
  group: source_domain
  priority: primary
  shape: card
- id: source
  label: 设备/数据源
  type: edge
  subtitle: 现场设备、工业服务、数据库、API 与仿真器
  group: source_domain
  priority: primary
  shape: card
connections:
- from: core
  to: driver
  label: 受控命令（MQ）
  style: dashed
  direction: request
- from: driver
  to: core
  label: 位号值/回执（MQ）
  style: dashed
  direction: response
- from: source
  to: driver
  label: 独立协议边界
  style: solid
  direction: bidirectional
callouts:
- 消息队列提供时间解耦与缓冲，不自动保证故障隔离。
- 新协议落在既有契约内时可主要修改 Driver；新增业务语义时仍可能跨层变更。
- SDK 统一接口不等于互操作性证明，仍需契约、真实设备和端到端测试。
legend:
- 实线箭头代表需独立验证的协议边界。
- 虚线箭头代表通过消息队列进行的异步解耦通信。
- 黄色区域突出 Driver 扩展边界。
visual_constraints:
- Driver 卡片和设备/数据源卡片等宽、等距、垂直对齐。
- 连线先绘制，节点后绘制，文字不与箭头或边框重叠。
- 不把示例 Driver 写成平台对所有协议的内置能力承诺。
- 图例位于底部，不遮挡主体结构。
render_notes: HTML/SVG 渲染，浅色技术出版风格；Driver 层使用黄色强调，主节点保持统一圆角和描边。
caption:
