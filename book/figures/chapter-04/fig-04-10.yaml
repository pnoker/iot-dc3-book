type: architecture
title: 图4-10 IoT DC3整体架构及驱动层位置
audience_takeaway: 驱动层用独立JVM进程+Driver SDK、经MQ与核心服务解耦,新增驱动只需横向加框,故障不中断平台。
purpose: 展示IoT DC3的四层体系（前端、核心服务、驱动层、设备层）和驱动层在其中的数据流向与解耦位置。
visual_focus: 自上而下四层（前端、核心服务、驱动、设备），驱动层经消息队列与核心服务解耦。
design_level: logical
layout: 自上而下四层布局，层与层之间用水平分隔线隔开，层内元素水平排列。整体居中，宽度按最长层设置。
elements:
- 顶层（Layer 1）：前端应用层。一个圆角方框，标记“Vue.js Admin Console”。颜色：#2d8cf0。
- 第二层（Layer 2）：平台核心服务层。一组紧密排列的圆角方框，分别标记“Gateway”、“Auth”、“Manager”、“Data”、“Agentic”。左上方标注“固定服务名 + 容器 DNS + 环境变量”。颜色：#19be6b。
- 第三层（Layer 3）：驱动层。一个横向的宽条框，内部并列排列多个小方框，分别标记“Modbus驱动”、“LoRa驱动”、“NB-IoT驱动”、“BLE驱动”、“Zigbee驱动”、“PLC S7驱动”、“MC协议驱动”等。驱动层大框左上方标注“独立JVM进程 + Driver SDK”。颜色：#e8a000。
- 第四层（Layer 4）：物理设备层。一组不规则的图标或小方框，分别标记“PLC”、“传感器”、“水表”、“工业仪表”、“执行器”。
relationships:
- 第二层与第三层之间：两条虚线箭头。从上到下的箭头标注“下发指令（MQ）”
- 从下到上的箭头标注“上报数据（MQ）”。箭头颜色为深灰色虚线。
- 第三层与第四层之间：从每个驱动方框向下连接一个或多个设备图标，用实线箭头表示，线缆上用短标注协议名（如“Modbus TCP”、“LoRaWAN”、“BLE GATT”）。箭头由设备指向驱动，表示数据上行方向。
regions:
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
- id: edge_domain
  label: 设备与边缘域
  role: 现场异构资源边界
components:
- id: frontend
  label: 前端应用层
  type: application
  subtitle: Vue.js Admin Console
  group: platform_domain
  priority: primary
  shape: card
- id: core
  label: 平台核心服务层
  type: platform
  subtitle: Gateway / Auth / Manager / Data / Agentic（固定服务名 + 容器 DNS + 环境变量）
  group: platform_domain
  priority: primary
  shape: card
- id: driver
  label: 驱动层
  type: platform
  subtitle: 独立 JVM 进程 + Driver SDK：Modbus、LoRa、NB-IoT、BLE、Zigbee、PLC S7、MC 等驱动
  group: platform_domain
  priority: primary
  shape: card
- id: device
  label: 物理设备层
  type: edge
  subtitle: PLC、传感器、水表、工业仪表、执行器
  group: edge_domain
  priority: primary
  shape: card
connections:
- from: core
  to: driver
  label: 下发指令（MQ）
  style: dashed
  direction: request
- from: driver
  to: core
  label: 上报数据（MQ）
  style: dashed
  direction: response
- from: device
  to: driver
  label: 原生协议（Modbus TCP/LoRaWAN/BLE GATT 等）
  style: solid
  direction: request
callouts:
- 第二层与第三层之间：两条虚线箭头。从上到下的箭头标注“下发指令（MQ）”
- 从下到上的箭头标注“上报数据（MQ）”。箭头颜色为深灰色虚线
- 第三层与第四层之间：从每个驱动方框向下连接一个或多个设备图标，用实线箭头表示，线缆上用短标注协议名（如“Modbus TCP”、“LoRaWAN”、“BLE GATT”）。箭头由设备指向驱动，表示数据上行方向。
legend:
- 实线箭头代表数据流（上行/下行）
- 虚线箭头代表通过消息队列进行的异步解耦通信
- 黄色背景的层代表驱动层，是整张图的焦点
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: 使用HTML/SVG渲染，浅色背景，圆角矩形，统一12px间距。驱动层的黄色边框应加粗以提高视觉优先级。元素间距均匀，整体画布宽高比建议16:9。
caption:
  zh: 图 4-10 驱动层进程彼此独立、互不依赖，通过消息队列与平台核心服务解耦，实现驱动故障时平台主体不中断。开发者新增驱动仅需在驱动层横向增加一个方框，平台其余层无需变化。
  en: 'Driver-layer processes are independent of one another and decoupled from core platform services through the message queue, so a driver failure does not interrupt the platform. Adding a new driver only means adding one more box in the driver layer — every other layer stays unchanged.'
