<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图4-2 统一接入层的逻辑定位与内部能力分层</title>
  <desc id="desc">读者应理解统一接入层的逻辑定位——它不是一个单一服务，而是由协议转换、设备模型映射、安全认证三个子层组成的中间层。</desc>
