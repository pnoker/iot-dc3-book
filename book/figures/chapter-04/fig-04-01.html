<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图4-1 NB-IoT 网络架构示意</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图4-1 NB-IoT 网络架构示意</title>
  <desc id="desc">终端经 Uu 空口接入 eNodeB，经 S1 接口进入核心网，经 SGi 接口直达 IoT 平台与应用；企业侧无需自建现场网关。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图4-1 NB-IoT 网络架构示意</text>
  <text x="88" y="64" font-size="12" fill="#64748B">终端直接接入运营商蜂窝网络，端到端链路不需要企业自建现场网关</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 应用层 ===== -->
  <rect x="260" y="130" width="1280" height="66" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/>
  <text x="280" y="158" font-size="15" font-weight="700" fill="#334155">应用层</text>
  <text x="900" y="158" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">垂直行业应用</text>
  <text x="900" y="180" font-size="11" fill="#475569" text-anchor="middle">抄表 · 市政 · 环境监测</text>

  <!-- ===== IoT 平台层 ===== -->
  <rect x="260" y="220" width="1280" height="66" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="280" y="248" font-size="15" font-weight="700" fill="#2563EB">IoT 平台层</text>
  <text x="900" y="248" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">IoT 平台</text>
  <text x="900" y="270" font-size="11" fill="#475569" text-anchor="middle">设备管理 · 数据汇聚 · API 暴露</text>

  <!-- 平台层 ↔ 核心网：SGi 接口 -->
  <line x1="900" y1="286" x2="900" y2="308" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="560" y="301" font-size="12" font-weight="700" fill="#2563EB">SGi 接口</text>

  <!-- ===== 核心网层 ===== -->
  <rect x="260" y="310" width="1280" height="104" rx="8" fill="#FFF7ED" stroke="#D97706" stroke-width="1.8"/>
  <text x="280" y="340" font-size="15" font-weight="700" fill="#B45309">核心网层</text>
  <rect x="300" y="350" width="380" height="50" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
  <text x="490" y="371" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">MME</text>
  <text x="490" y="391" font-size="11" fill="#475569" text-anchor="middle">移动性管理</text>
  <rect x="710" y="350" width="380" height="50" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
  <text x="900" y="371" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">SGW</text>
  <text x="900" y="391" font-size="11" fill="#475569" text-anchor="middle">服务网关</text>
  <rect x="1120" y="350" width="380" height="50" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
  <text x="1310" y="371" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">PGW</text>
  <text x="1310" y="391" font-size="11" fill="#475569" text-anchor="middle">分组数据网网关</text>

  <!-- 核心网 ↔ 接入层：S1 接口 -->
  <line x1="900" y1="414" x2="900" y2="434" stroke="#D97706" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="560" y="428" font-size="12" font-weight="700" fill="#B45309">S1 接口</text>

  <!-- ===== 网络接入层 ===== -->
  <rect x="260" y="436" width="1280" height="66" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.8"/>
  <text x="280" y="464" font-size="15" font-weight="700" fill="#0F766E">网络接入层</text>
  <text x="900" y="464" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">eNodeB（LTE 基站）</text>
  <text x="900" y="486" font-size="11" fill="#475569" text-anchor="middle">NB-IoT 200 kHz 载波</text>

  <!-- 接入层 ↔ 终端层：Uu 空口 -->
  <line x1="900" y1="502" x2="900" y2="524" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="560" y="517" font-size="12" font-weight="700" fill="#0F766E">Uu 空口</text>

  <!-- ===== 终端层 ===== -->
  <rect x="260" y="526" width="1280" height="90" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.8"/>
  <text x="280" y="560" font-size="15" font-weight="700" fill="#0F766E">终端层</text>
  <rect x="320" y="546" width="340" height="56" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
  <text x="490" y="572" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">智能水表</text>
  <text x="490" y="592" font-size="10.5" fill="#475569" text-anchor="middle">NB-IoT 模组</text>
  <rect x="730" y="546" width="340" height="56" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
  <text x="900" y="572" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">智能井盖</text>
  <text x="900" y="592" font-size="10.5" fill="#475569" text-anchor="middle">NB-IoT 模组</text>
  <rect x="1140" y="546" width="340" height="56" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
  <text x="1310" y="572" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">小型气象站</text>
  <text x="1310" y="592" font-size="10.5" fill="#475569" text-anchor="middle">NB-IoT 模组</text>

  <!-- ===== 上行 / 下行数据流（右侧贯穿） ===== -->
  <line x1="1620" y1="616" x2="1620" y2="130" stroke="#2563EB" stroke-width="2.3" marker-end="url(#ah-blue)"/>
  <text x="1642" y="380" font-size="12" font-weight="700" fill="#2563EB">上行数据</text>
  <line x1="1670" y1="130" x2="1670" y2="616" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="1692" y="380" font-size="12" font-weight="700" fill="#475569">下行指令</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图4-1 NB-IoT 复用运营商 LTE 基站与核心网，企业侧无需建设现场蜂窝网关。</text>
  </svg>
</svg>
  </main>
</body>
</html>
