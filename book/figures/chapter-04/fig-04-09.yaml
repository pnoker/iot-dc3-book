- 接口层通过泛化关系（空心三角箭头）指向每个实现层类，表示实现关系
- 每个实现层类通过组合关系（实心菱形+箭头）指向其依赖的组件，组件为矩形
legend:
- 蓝色：接口定义层，统一抽象
- 青绿色：具体协议驱动实现
- 空心三角箭头：泛化（实现）
- 实心菱形+箭头：组合（强依赖）
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: 使用HTML/SVG渲染，接口层使用浅蓝背景和<<interface>>标签，实现层使用浅青绿色背景，组件使用白色小方块，连接线使用标准UML箭头样式，颜色遵循全书统一配置。
caption:
  zh: 图4-9 协议适配器接口与驱动实现的架构示意。每个具体驱动通过组合持有底层通信组件，对上层只暴露通用接口。
  en: 'Figure 4-9 Architecture of the protocol adapter interface and driver implementations. Each concrete driver composes its own low-level communication components and exposes only the generic interface to upper layers.'
labels:
  en:
    图4-9 协议适配器接口与驱动实现架构: 'Figure 4-9 Protocol Adapter Interface and Driver Implementations'
    同一ProtocolAdapter接口下，各协议驱动组合不同的底层通信组件，异构差异被吸收在实现层。: 'Under one ProtocolAdapter interface, each protocol driver composes different low-level communication components; heterogeneity is absorbed in the implementation layer.'
    平台服务域: 'Platform Domain'
    蓝色：接口定义层，统一抽象: 'Blue: interface definition, unified abstraction'
    青绿色：具体协议驱动实现: 'Teal: concrete protocol driver implementations'
    空心三角箭头：泛化（实现）: 'Hollow triangle: generalization (realization)'
    图4-9 协议适配器接口与驱动实现的架构示意。每个具体驱动通过组合持有底层通信组件，对上层只暴露通用接口。: 'Figure 4-9 The protocol adapter interface and driver implementations. Each concrete driver holds its low-level communication components through composition and exposes only the generic interface upward.'
