<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图4-4 主流 IoT 无线技术选型雷达图（示意框架）</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图4-4 主流 IoT 无线技术选型雷达图（示意框架）</title>
  <desc id="desc">六种无线技术在距离、速率、低功耗、低成本和部署便捷性上各有折中，雷达面积不代表绝对优劣。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图4-4 主流 IoT 无线技术选型雷达图（示意框架）</text>
  <text x="88" y="64" font-size="12" fill="#64748B">各轴越靠外表示该维度越有利；功耗和成本轴已转换为“越低越优”</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 雷达图（中心 680,470，半径 220） ===== -->
  <g transform="translate(680 470)">
    <!-- 同心五边形网格 -->
    <polygon points="0,-220 209,-68 129,178 -129,178 -209,-68" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <polygon points="0,-176 167,-54 103,142 -103,142 -167,-54" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    <polygon points="0,-132 125,-41 77,107 -77,107 -125,-41" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    <polygon points="0,-88 84,-27 52,71 -52,71 -84,-27" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <!-- 五轴辐射线 -->
    <path d="M0 0 V-220 M0 0 L209 -68 M0 0 L129 178 M0 0 L-129 178 M0 0 L-209 -68" stroke="#94A3B8" stroke-width="1"/>

    <!-- 六种技术多边形 -->
    <polygon points="0,-88 167,-54 129,178 -103,142 -209,-68" fill="#2563EB" fill-opacity=".10" stroke="#2563EB" stroke-width="2.2"/>
    <polygon points="0,-88 125,-41 129,178 -103,142 -167,-54" fill="#0F766E" fill-opacity=".09" stroke="#0F766E" stroke-width="2.2" stroke-dasharray="10 4"/>
    <polygon points="0,-132 209,-68 26,36 -77,107 -209,-68" fill="#F97316" fill-opacity=".08" stroke="#F97316" stroke-width="2.2" stroke-dasharray="3 3"/>
    <polygon points="0,-220 42,-14 129,178 -77,107 -84,-27" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="14 5"/>
    <polygon points="0,-176 125,-41 103,142 -103,142 -209,-68" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2.2" stroke-dasharray="7 4"/>
    <polygon points="0,-176 209,-68 26,36 -26,36 -84,-27" fill="#475569" fill-opacity=".06" stroke="#475569" stroke-width="2.2" stroke-dasharray="2 5"/>

    <!-- 轴名 -->
    <text x="0" y="-238" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">距离</text>
    <text x="226" y="-72" font-size="14" font-weight="700" fill="#0F172A">速率</text>
    <text x="145" y="198" font-size="14" font-weight="700" fill="#0F172A">低功耗</text>
    <text x="-145" y="198" text-anchor="end" font-size="14" font-weight="700" fill="#0F172A">低成本</text>
    <text x="-226" y="-72" text-anchor="end" font-size="14" font-weight="700" fill="#0F172A">部署便捷性</text>
  </g>

  <!-- ===== 右侧图例 ===== -->
  <text x="1380" y="176" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">六种技术的相对工程画像</text>
  <g font-size="12.5" fill="#475569">
    <line x1="1080" y1="216" x2="1150" y2="216" stroke="#2563EB" stroke-width="3"/>
    <text x="1170" y="221">BLE：部署便捷、低功耗，覆盖距离有限</text>
    <line x1="1080" y1="256" x2="1150" y2="256" stroke="#0F766E" stroke-width="3" stroke-dasharray="10 4"/>
    <text x="1170" y="261">Zigbee：低功耗组网，依赖协调器与 Mesh 规划</text>
    <line x1="1080" y1="296" x2="1150" y2="296" stroke="#F97316" stroke-width="3" stroke-dasharray="3 3"/>
    <text x="1170" y="301">Wi-Fi：速率与部署便利突出，端侧功耗较高</text>
    <line x1="1080" y1="336" x2="1150" y2="336" stroke="#DC2626" stroke-width="3" stroke-dasharray="14 5"/>
    <text x="1170" y="341">LoRa：以自建网关换取远距离与低功耗</text>
    <line x1="1080" y1="376" x2="1150" y2="376" stroke="#7C3AED" stroke-width="3" stroke-dasharray="7 4"/>
    <text x="1170" y="381">NB-IoT：复用运营商基站，部署便捷但依赖覆盖</text>
    <line x1="1080" y1="416" x2="1150" y2="416" stroke="#475569" stroke-width="3" stroke-dasharray="2 5"/>
    <text x="1170" y="421">5G：速率与服务能力强，终端成本和功耗较高</text>
  </g>

  <!-- 读图边界 -->
  <rect x="1060" y="470" width="700" height="122" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.4"/>
  <text x="1090" y="502" font-size="14" font-weight="700" fill="#B45309">读图边界</text>
  <text x="1090" y="530" font-size="12" fill="#475569">此图为定性选型框架，不是标准化评分或实测结果。</text>
  <text x="1090" y="558" font-size="12" fill="#475569">多边形面积越大不代表技术越优，应按场景约束逐轴比较。</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图4-4 无线技术选型应先确定场景硬约束，再逐轴比较覆盖、速率、功耗、成本与生态折中。</text>
  </svg>
</svg>
  </main>
</body>
</html>
