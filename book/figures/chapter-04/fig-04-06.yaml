  subtitle: 位号→属性/事件/服务映射
  group: ''
  priority: primary
  shape: card
- id: security_auth
  label: 安全与认证
  type: security
  subtitle: 身份校验·TLS终结·密钥协商
  group: ''
  priority: primary
