callouts:
- 底层共享层水平承载三个切片，通过网络切片选择功能实现逻辑隔离
- mMTC切片底部与NB-IoT/eMTC兼容模式通过虚线相连，表明继承关系
- 三个切片使用虚线分隔，共享底层资源但逻辑隔离
legend:
- 红色：URLLC切片。
- 蓝色：eMBB切片。
- 绿色：mMTC切片。
- 灰色：共享基础设施（5G NR + 5G核心网）。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
render_notes: HTML/SVG渲染，底层为深灰色胶囊表示物理共享层，上方左、中、右三栏分别高亮渲染（红、蓝、绿）。终端图标使用简易矢量符号。mMTC切片底部标注“兼容NB-IoT/eMTC”标签。整体浅色背景，圆角矩形，统一间距。
caption:
  zh: 图4-3 通过5G网络切片技术，同一物理网络可同时承载不同服务质量需求的IoT场景。URLLC保障毫秒级时延，mMTC提供极高连接密度，eMBB提供Gbps级吞吐。平台侧仍需协议适配层归一异构终端。
  en: 'Figure 4-3 With 5G network slicing, a single physical network can carry IoT scenarios with different QoS requirements simultaneously. URLLC guarantees millisecond-level latency, mMTC delivers extremely high connection density, and eMBB provides Gbps-class throughput. The platform side still needs a protocol adaptation layer to unify heterogeneous devices.'
