type: architecture
title: 图4-12 协议碎片化→统一接入层→Driver SDK 架构映射
audience_takeaway: 每个协议只需一个独立驱动,经Driver SDK固定接口接入统一接入层,再归一为统一设备影子。
purpose: 展示从异构协议终端到业务应用层的分层架构，突出 Driver SDK 作为适配桥梁的作用，以及统一接入层如何屏蔽底层差异。
visual_focus: 从设备层经驱动层、统一接入层到业务应用层的主链路。
design_level: logical
layout: 水平分层（四层）：自下而上为设备层、驱动层、统一接入层、业务应用层。每层之间用带箭头的竖线连接，表示数据流转和指令转发。
elements:
- '设备层: 包含多种异构无线终端：NB-IoT 水表、LoRa 传感器、BLE 信标、Zigbee 灯控、Wi-Fi 摄像头等。每个设备图标旁标注其原生协议名称。'
- '驱动层: 由多个独立微服务（Driver 1…Driver N）组成，每个驱动对应一种协议类型（如 NB-IoT Driver、LoRa Driver、BLE Driver）。每个驱动内部用虚线框表示 Driver SDK 定义的接口：connect/disconnect/send/receive/parse。'
- '统一接入层: 包含设备注册管理、会话管理、消息路由、协议转换、物模型标准化等模块。该层暴露统一设备影子（Device Shadow）接口，支持属性/事件/服务。'
- '业务应用层: 包括数据存储、规则引擎、告警服务、可视化仪表盘等，通过 REST API 或消息队列与统一接入层交互。'
relationships:
- 设备层各终端通过各自无线协议连接到对应驱动服务（点对点箭头）。
- 驱动层每个驱动将其解析后的标准物模型数据上报给统一接入层（聚合箭头）。
- 统一接入层将标准化数据路由至业务应用层（单一箭头），并且接收来自业务层的指令，反向下发至驱动层。
- 驱动层内部，Driver SDK 规范了各驱动与统一接入层之间的交互契约。
regions:
- id: edge_domain
  label: 设备与边缘域
  role: 现场异构资源边界
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
- id: data_domain
  label: 数据资产域
  role: 数据沉淀与治理边界
components:
- id: c1
  label: 设备层
  type: edge
  subtitle: 异构无线终端：NB-IoT 水表、LoRa 传感器、BLE 信标、Zigbee 灯控、Wi-Fi 摄像头
  group: edge_domain
  priority: primary
  shape: card
- id: c2
  label: 驱动层
  type: platform
  subtitle: 多个独立驱动微服务，内部遵循 Driver SDK 的 connect/disconnect/send/receive/parse 接口
  group: platform_domain
  priority: normal
  shape: card
- id: c3
  label: 统一接入层
  type: platform
  subtitle: 设备注册、会话管理、消息路由、协议转换、物模型标准化，向上暴露设备影子
  group: edge_domain
  priority: normal
  shape: bus
- id: c4
  label: 业务应用层
  type: data
  subtitle: 数据存储、规则引擎、告警服务、可视化仪表盘
  group: data_domain
  priority: normal
  shape: database
connections:
- from: c1
  to: c2
  label: 原生协议接入
  style: solid
  direction: left-to-right
- from: c2
  to: c3
  label: 上报标准物模型数据
  style: solid
  direction: left-to-right
- from: c3
  to: c4
  label: 路由标准化数据
  style: solid
  direction: left-to-right
callouts:
- 设备层各终端通过各自无线协议连接到对应驱动服务（点对点箭头）
- 驱动层每个驱动将其解析后的标准物模型数据上报给统一接入层（聚合箭头）
- 统一接入层将标准化数据路由至业务应用层（单一箭头），并且接收来自业务层的指令，反向下发至驱动层
legend:
- 蓝色实线箭头：数据上报方向
- 红色虚线箭头：指令下发方向
- 灰色虚线框：Driver SDK 接口标准
- 绿色圆角矩形：统一接入层功能模块
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: 使用 SVG 绘制四层分层架构图。设备层底部左右排列 5 个设备图标；驱动层每个驱动用矩形表示，内部标注接口名；统一接入层用一个大矩形包含多个小方块；业务层用几个更小的矩形。层间用箭头连接。图例放置在右下角。
caption:
  zh: 图4-12 协议碎片化→统一接入层→Driver SDK 架构映射。四层水平布局，展示从设备到应用的解耦路径。
  en: 'Figure 4-12 Protocol fragmentation → unified access layer → Driver SDK architecture mapping. A four-layer horizontal layout showing the decoupled path from devices to applications.'
labels:
  en:
    图4-12 协议碎片化→统一接入层→Driver SDK 架构映射: 'Figure 4-12 Protocol Fragmentation → Unified Access Layer → Driver SDK Mapping'
    五类协议设备经统一 Driver 接口接入统一接入层，收敛为设备影子供业务应用读写。: 'Devices of five protocols enter the unified access layer through a common Driver interface and converge into a device shadow that business applications read and write.'
    NB-IoT 水表: 'NB-IoT Water Meter'
    LoRa 传感器: 'LoRa Sensor'
    BLE 信标: 'BLE Beacon'
    Zigbee 灯控: 'Zigbee Lighting'
    Wi-Fi 摄像头: 'Wi-Fi Camera'
    统一接入层: 'Unified Access Layer'
    设备注册管理: 'Device Registration'
    会话管理: 'Session Management'
    消息路由: 'Message Routing'
    协议转换: 'Protocol Conversion'
    物模型标准化: 'Thing Model Standardization'
    暴露统一设备影子接口 (Device Shadow): 'Exposes a unified Device Shadow interface'
    业务应用层: 'Business Application Layer'
    数据存储: 'Data Storage'
    规则引擎: 'Rule Engine'
    告警服务: 'Alarm Service'
    可视化仪表盘: 'Visualization Dashboard'
    设备层: 'Device Layer'
    驱动层: 'Driver Layer'
    蓝色实线箭头：数据上报方向: 'Blue solid arrows: data uplink'
    红色虚线箭头：指令下发方向: 'Red dashed arrows: command downlink'
    灰色虚线框：Driver SDK 接口标准: 'Gray dashed box: Driver SDK interface standard'
    图4-12 蓝色实线表示数据由设备经 Driver 与统一接入层上报至业务应用，红色虚线表示指令反向下发；各协议 Driver 以统一的 connect/send/receive/parse 接口接入，统一接入层对上层只暴露一份设备影子。: 'Figure 4-12 Blue solid lines show data reported from devices through drivers and the unified access layer to business applications; red dashed lines show commands issued in reverse. Each protocol driver plugs in via the common connect/send/receive/parse interface, and the unified access layer exposes a single device shadow upward.'
