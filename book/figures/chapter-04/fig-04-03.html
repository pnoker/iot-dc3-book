  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>

  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图4-3 通过5G网络切片技术，同一物理网络可同时承载不同服务质量需求的IoT场景。uRLLC保障毫秒级时延，mMTC提供极高连接密度，eMBB提供Gbps级吞吐。平台侧仍需协议适配层归一异构终端。</text>
