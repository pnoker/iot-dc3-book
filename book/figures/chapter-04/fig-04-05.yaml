type: layered
title: 图4-5 多种协议设备的接入困境
audience_takeaway: 读者应理解每增加一种接入协议，都需新增对应适配器，并在解析、模型映射与指令处理等跨层环节产生重复工作。
purpose: 展示在一个物联网网关或平台上，接入多种异构协议设备时各层所面临的复杂度和重复适配工作。
visual_focus: 从设备到平台：统一数据模型转换（转换逻辑因…的主链路。
design_level: logical
layout: 上下三层纵向排布：设备层→协议转换层→平台层。设备层多个图标水平排列，每个设备向下引出独立路径穿过转换层到达平台层。
elements:
- 设备层：NB-IoT水表、LoRa传感器、Zigbee灯控、BLE信标、WiFi摄像头、Modbus RTU仪表。
- 协议转换层：每个设备对应独立的协议适配器——NB-IoT完成AT指令解析与窄带帧重组；LoRaWAN负责Class A帧拆包与确认；ZCL/Zigbee做集群消息解析；BLE处理GATT（Generic Attribute Profile）配网与数据读取；WiFi完成HTTP/CoAP协商与媒体流分发；Modbus RTU负责寄存器读写与CRC校验。
- 平台层：IoT平台内部每个物模型映射、参数绑定、告警规则都需不同的处理路径。
relationships:
- 设备到对应适配器：专用协议连接（物理层+数据链路层），用实线箭头。
- 各适配器到平台：统一数据模型转换（转换逻辑因协议而异），用虚线箭头。
regions:
- id: edge_domain
  label: 设备与边缘域
  role: 现场异构资源边界
- id: data_domain
  label: 数据资产域
  role: 数据沉淀与治理边界
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
