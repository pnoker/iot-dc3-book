callouts:
- 设备到对应适配器：专用协议连接（物理层+数据链路层），用实线箭头
- 各适配器到平台：统一数据模型转换（转换逻辑因协议而异），用虚线箭头
legend:
- 设备图标代表一种协议族，适配器代表独立的协议转换逻辑。
- 颜色编码：设备层浅灰，协议转换层淡蓝，平台层深灰。
- 警告图标表示平台侧的重复开发风险。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
render_notes: 使用div.row flex布局，每层背景颜色递进。设备用SVG图标（如fa-water、fa-wi-fi等）表示。每个设备下方绘制纵向箭头和文字标签框。最底层添加平台图标和警告标签。整体色调偏冷灰蓝，适配层淡蓝边框以示强调。无真实设备供应商Logo或型号，仅使用占位图标。
caption:
  zh: 图4-5 多种协议设备的接入困境示意图。每增加一种协议，都要新增对应适配器，并在解析、模型映射与指令处理等跨层环节重复投入。
  en: 'Figure 4-5 The access dilemma of multi-protocol devices. Each additional protocol requires a new adapter and repeated investment in cross-layer work such as parsing, model mapping, and command handling.'
