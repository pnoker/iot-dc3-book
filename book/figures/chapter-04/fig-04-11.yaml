type: architecture
title: 图4-11 智能路灯系统总体拓扑
purpose: 展示 NB-IoT 与 LoRaWAN 路灯如何通过项目适配器收敛到统一语义，同时保留链路约束与行动治理边界。
audience_takeaway: 统一接入减少业务侧的协议分支，但时间、质量、可达性、回执层级和权限策略不能被抽象掉。
visual_focus: 从受控应用入口经语义与状态投影到两条真实网络路径；突出统一语义和异构链路的双重边界。
design_level: logical
layout: 三层结构：上为应用与行动治理，中为可选的语义/状态投影及两类项目适配器，下为 NB-IoT 与 LoRaWAN 的实际网络路径。
elements:
- 应用层：统一 API 与行动治理，负责身份、授权、策略和必要确认。
- 统一接入域：语义与状态投影保存位号值、时间和质量码；蜂窝协议适配以终端实际协议或平台 API 为准；LoRaWAN 适配面向 Network Server API。
- 网络与感知层：NB-IoT 路径经过运营商或厂商平台与蜂窝网络；LoRaWAN 路径经过 Network Server 与网关。
relationships:
- 上行状态与回执映射到统一语义，同时保留源时间、接收时间、质量码和链路类型。
- 受控命令先经行动治理，再由 Data、消息队列与 Driver 路由到相应适配器；发送回执不等于设备效果回读。
- 无线制式不直接决定应用协议，两个适配器都必须按项目真实接口实现和验收。
regions:
- id: access_domain
  label: 统一接入域
  role: 语义收敛、状态投影与行动治理边界
- id: nb_iot_path
  label: NB-IoT通信路径
  role: 运营商或厂商平台与蜂窝网络边界
- id: lorawan_path
  label: LoRaWAN通信路径
  role: Network Server、网关与区域参数边界
