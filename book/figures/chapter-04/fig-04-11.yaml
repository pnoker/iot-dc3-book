callouts:
- 统一语义层是项目架构选择，不代表 IoT DC3 核心服务天然提供通用 Device Shadow。
- NB-IoT 与 LoRaWAN 的时延、下行窗口、丢包和能耗仍需分别建模和验收。
- 受理、投递、设备确认与效果回读是不同证据层级。
legend:
- 蓝色表示 NB-IoT 相关路径。
- 橙色表示 LoRaWAN 相关路径。
- 绿色表示项目共享的语义与状态投影。
- 实线箭头表示协议路径，上下行语义需分别验收。
visual_constraints:
- 最多十个主节点，每个节点标签不超过14个字。
- 语义与状态投影节点使用绿色强调，两个适配器左右对齐。
- 通信路径走模块间空隙，不穿过文字或卡片。
- 感知层路灯用阵列简图与数量标注，不画2000个独立矩形。
- 图例位于底部，不遮挡主体。
render_notes: HTML/SVG 渲染，浅色背景，圆角矩形，统一描边；图中的语义与状态投影是项目可选组件，不使用 Device Shadow 标注。
