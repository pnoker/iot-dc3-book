  <title id="title">图2-12 DC3默认主链与受控智能扩展</title>
  <desc id="desc">默认遥测链路经协议 Driver、RabbitMQ 和 Data 持久化到 TimescaleDB；外部请求经 Gateway 和 Auth，Agentic 只通过授权工具查询，写操作经人工确认后进入 Data 命令链。</desc>
  <defs>

    <marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#F97316"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#F8FAFC"/>

  <text x="56" y="92" font-size="13" fill="#475569">遥测不经 Gateway，Agentic 不在实时数据主链</text>

  <rect x="52" y="126" width="1096" height="206" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>

    <rect x="300" y="190" width="164" height="72" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.5"/>

    <rect x="522" y="190" width="164" height="72" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>

    <rect x="966" y="190" width="154" height="72" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
    <text x="1043" y="220" font-weight="700" fill="#0F172A">TimescaleDB</text><text x="1043" y="244" font-size="12" fill="#475569">默认时序适配器</text>

    <line x1="242" y1="214" x2="300" y2="214"/><line x1="464" y1="214" x2="522" y2="214"/>

  </g>

  <text x="493" y="204" font-size="11" text-anchor="middle" fill="#475569">② 位号值</text>
  <text x="715" y="204" font-size="11" text-anchor="middle" fill="#475569">③ 消费</text>
  <text x="937" y="204" font-size="11" text-anchor="middle" fill="#475569">④ 持久化</text>
  <path d="M826 278 V302 H604 V278" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="715" y="318" font-size="11" text-anchor="middle" fill="#475569">⑩ 确认后的命令经 RabbitMQ 返回 Driver</text>

    <rect x="302" y="430" width="164" height="72" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="384" y="460" font-weight="700" fill="#0F172A">Gateway</text><text x="384" y="484" font-size="12" fill="#475569">外部 HTTP 入口</text>

    <text x="604" y="460" font-weight="700" fill="#0F172A">Auth</text><text x="604" y="484" font-size="12" fill="#475569">平台主体认证</text>
    <rect x="742" y="430" width="164" height="72" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>

    <rect x="962" y="430" width="164" height="72" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="1044" y="460" font-weight="700" fill="#0F172A">策略 / Workflow</text><text x="1044" y="484" font-size="12" fill="#475569">校验、审批与审计</text>
  </g>
  <g stroke="#F97316" stroke-width="2" fill="none" marker-end="url(#arrow-orange)">
    <line x1="246" y1="452" x2="302" y2="452"/><line x1="466" y1="452" x2="522" y2="452"/>
    <line x1="686" y1="480" x2="742" y2="480"/><line x1="906" y1="452" x2="962" y2="452"/>
  </g>
  <text x="274" y="442" font-size="11" text-anchor="middle" fill="#475569">⑤ 登录 / API</text>
  <text x="494" y="442" font-size="11" text-anchor="middle" fill="#475569">⑥ 认证</text>
  <text x="714" y="518" font-size="11" text-anchor="middle" fill="#475569">⑦ 受权 Tool</text>
  <text x="934" y="442" font-size="11" text-anchor="middle" fill="#475569">⑧ 候选 Action</text>
  <path d="M1044 502 V548 H826 V332" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>
  <text x="982" y="570" font-size="11" text-anchor="middle" fill="#475569">⑨ 确认后调用 Data 命令接口</text>
  <path d="M824 430 V396 H826 V332" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-teal)"/>
  <text x="844" y="374" font-size="11" fill="#475569">只读查询</text>

  <rect x="76" y="628" width="1048" height="34" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
  <text x="600" y="650" font-size="13" text-anchor="middle" fill="#475569">边界：PLC / SIS 承担硬实时与安全联锁；模型不能绕过策略、确认和平台命令链。</text>
  <text x="600" y="684" font-size="11" text-anchor="middle" fill="#475569">图2-12 遥测与外部访问分走两条链，智能建议只有经过策略和确认后才能进入设备命令链。</text>
