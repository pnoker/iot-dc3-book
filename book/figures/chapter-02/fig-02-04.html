<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图2-4 传统数据模式与智能闭环模式的数据流程对比</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图2-4 传统数据模式与智能闭环模式的数据流程对比</title>
  <desc id="desc">传统数据模式止于展示与人工操作；智能闭环以候选决策、策略校验、受控执行和结果回读形成回路。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

    <defs>
      <marker id="mk-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#2563EB"/></marker>
      <marker id="mk-gray" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#64748B"/></marker>
      <marker id="mk-green" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#16A34A"/></marker>
    </defs>

    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图2-4 传统数据模式与智能闭环模式的数据流程对比</text>
    <text x="88" y="64" font-size="12" fill="#64748B">传统终点是被看见，智能闭环以获准动作和结果验证回到现场</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 左列：传统数据模式 -->
    <rect x="140" y="165" width="480" height="680" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="380" y="198" font-size="22" font-weight="700" fill="#475569" text-anchor="middle">传统数据模式</text>

    <rect x="170" y="220" width="420" height="105" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <text x="380" y="266" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle">传感器采集</text>
    <text x="380" y="296" font-size="16" fill="#475569" text-anchor="middle">原始数值上报</text>
    <rect x="170" y="375" width="420" height="105" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <text x="380" y="421" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle">网络传输与存储</text>
    <text x="380" y="451" font-size="16" fill="#475569" text-anchor="middle">时序库落库</text>
    <rect x="170" y="530" width="420" height="105" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <text x="380" y="576" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle">大屏展示与告警</text>
    <text x="380" y="606" font-size="16" fill="#475569" text-anchor="middle">图表与通知</text>
    <rect x="170" y="685" width="420" height="105" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
    <text x="380" y="731" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle">人工操作</text>
    <text x="380" y="761" font-size="16" fill="#475569" text-anchor="middle">查看 → 判断 → 操作</text>

    <g stroke="#64748B" stroke-width="2.2" fill="none" marker-end="url(#mk-gray)">
      <line x1="380" y1="325" x2="380" y2="375"/>
      <line x1="380" y1="480" x2="380" y2="530"/>
    </g>
    <line x1="380" y1="635" x2="380" y2="685" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>
    <text x="392" y="354" font-size="15" font-weight="700" fill="#64748B">数据上行</text>
    <text x="392" y="509" font-size="15" font-weight="700" fill="#64748B">数据读取</text>
    <text x="392" y="664" font-size="15" font-weight="700" fill="#64748B">人工响应</text>
    <text x="380" y="820" font-size="15" fill="#64748B" text-anchor="middle">终点：被人看见（数据流终止于人工决策）</text>

    <!-- 右列：智能闭环模式 -->
    <rect x="1020" y="165" width="760" height="680" rx="12" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="1400" y="198" font-size="22" font-weight="700" fill="#16A34A" text-anchor="middle">智能闭环模式</text>

    <rect x="1080" y="220" width="240" height="110" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1200" y="266" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle">采集归一化</text>
    <text x="1200" y="296" font-size="16" fill="#475569" text-anchor="middle">异构数据→PointValue</text>
    <rect x="1420" y="220" width="240" height="110" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
    <text x="1540" y="266" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle">理解</text>
    <text x="1540" y="296" font-size="16" fill="#475569" text-anchor="middle">状态感知与趋势预测</text>
    <polygon points="1540,560 1690,615 1540,670 1390,615" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="1540" y="608" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle">候选决策</text>
    <text x="1540" y="634" font-size="14" fill="#475569" text-anchor="middle">规则 + AI 规划</text>
    <rect x="1080" y="560" width="240" height="110" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="1200" y="606" font-size="23" font-weight="700" fill="#0F172A" text-anchor="middle">受控执行</text>
    <text x="1200" y="636" font-size="16" fill="#475569" text-anchor="middle">策略校验 · 协议驱动</text>

    <g stroke="#2563EB" stroke-width="2.2" fill="none" marker-end="url(#mk-blue)">
      <line x1="1320" y1="275" x2="1420" y2="275"/>
      <line x1="1540" y1="330" x2="1540" y2="560"/>
      <line x1="1390" y1="615" x2="1320" y2="615"/>
    </g>
    <text x="1370" y="262" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">归一化数据</text>
    <text x="1552" y="450" font-size="15" font-weight="700" fill="#2563EB">状态摘要</text>
    <text x="1355" y="632" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">获准动作</text>

    <line x1="1200" y1="560" x2="1200" y2="330" stroke="#16A34A" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#mk-green)"/>
    <text x="1186" y="450" font-size="15" font-weight="700" fill="#16A34A" text-anchor="end">闭环回路</text>

    <!-- 图例 -->
    <rect x="150" y="852" width="30" height="22" rx="5" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/>
    <text x="190" y="868" font-size="16" fill="#475569">传统链路</text>
    <rect x="350" y="852" width="30" height="22" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="390" y="868" font-size="16" fill="#475569">采集归一化</text>
    <rect x="580" y="852" width="30" height="22" rx="5" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.6"/>
    <text x="620" y="868" font-size="16" fill="#475569">理解</text>
    <polygon points="800,863 830,852 860,863 830,874" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="872" y="868" font-size="16" fill="#475569">候选决策</text>
    <rect x="970" y="852" width="30" height="22" rx="5" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
    <text x="1010" y="868" font-size="16" fill="#475569">受控执行</text>

    <line x1="1180" y1="863" x2="1238" y2="863" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <text x="1250" y="868" font-size="16" fill="#475569">数据正向流</text>
    <line x1="1420" y1="863" x2="1478" y2="863" stroke="#16A34A" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#mk-green)"/>
    <text x="1490" y="868" font-size="16" fill="#475569">闭环反馈回路</text>

    <!-- 图注 -->
    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图2-4 智能闭环把理解转为候选决策，仅让获准动作进入确定性执行链，并以回读验证结果。</text>
  </svg>
</svg>
  </main>
</body>
</html>
