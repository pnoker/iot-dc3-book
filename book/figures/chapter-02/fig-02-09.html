<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>图2-9 设备生命周期参考状态机</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图2-9 设备生命周期参考状态机</title>
  <desc id="desc">一种通用设备生命周期设计，状态名称和迁移条件需要按实际平台字段、心跳来源和业务流程落地。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

    <defs>
      <marker id="mk-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#2563EB"/></marker>
      <marker id="mk-gray" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#64748B"/></marker>
    </defs>

    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图2-9 设备生命周期参考状态机</text>
    <text x="88" y="64" font-size="12" fill="#64748B">通用设计示例，不代表当前 Manager 已实现同名状态</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 连线：先画 -->
    <line x1="550" y1="510" x2="780" y2="510" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="1020" y1="490" x2="1250" y2="490" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="1250" y1="530" x2="1020" y2="530" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <path d="M900 460 V390 H720 V320" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <path d="M700 320 V350 H910 V460" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <path d="M430 560 V650 H780 V740" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>
    <line x1="900" y1="560" x2="900" y2="740" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>
    <path d="M1370 560 V650 H1020 V740" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>
    <line x1="600" y1="320" x2="900" y2="740" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>

    <!-- 连线标签 -->
    <text x="665" y="500" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">首次上报</text>
    <text x="1135" y="480" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">失联超阈值</text>
    <text x="1135" y="548" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">恢复上报</text>
    <text x="820" y="382" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">运维干预</text>
    <text x="820" y="342" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">运维恢复</text>

    <!-- 节点 -->
    <rect x="310" y="460" width="240" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="430" y="506" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">未激活</text>
    <text x="430" y="536" font-size="16" fill="#475569" text-anchor="middle">初始状态</text>

    <rect x="780" y="460" width="240" height="100" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="900" y="506" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">在线</text>
    <text x="900" y="536" font-size="16" fill="#475569" text-anchor="middle">正常工作</text>

    <rect x="1250" y="460" width="240" height="100" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="1370" y="506" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">离线</text>
    <text x="1370" y="536" font-size="16" fill="#475569" text-anchor="middle">失联超阈值</text>

    <rect x="480" y="220" width="240" height="100" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="600" y="266" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">维护中</text>
    <text x="600" y="296" font-size="16" fill="#475569" text-anchor="middle">运维干预</text>

    <rect x="780" y="740" width="240" height="100" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <text x="900" y="786" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">已注销</text>
    <text x="900" y="816" font-size="16" fill="#475569" text-anchor="middle">永久移除</text>

    <!-- 图例 -->
    <rect x="150" y="872" width="30" height="22" rx="5" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
    <text x="190" y="888" font-size="16" fill="#475569">在线 / 维护中</text>
    <rect x="410" y="872" width="30" height="22" rx="5" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="450" y="888" font-size="16" fill="#475569">离线</text>
    <rect x="580" y="872" width="30" height="22" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="620" y="888" font-size="16" fill="#475569">未激活</text>
    <rect x="760" y="872" width="30" height="22" rx="5" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/>
    <text x="800" y="888" font-size="16" fill="#475569">已注销</text>

    <line x1="980" y1="883" x2="1038" y2="883" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <text x="1050" y="888" font-size="16" fill="#475569">正常迁移</text>
    <line x1="1210" y1="883" x2="1268" y2="883" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>
    <text x="1280" y="888" font-size="16" fill="#475569">终结迁移（永久移除）</text>

    <!-- 图注 -->
    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图2-9 生命周期应区分配置、连接与业务状态；图中迁移需用实际心跳和管理流程验证。</text>
  </svg>
</svg>
  </main>
