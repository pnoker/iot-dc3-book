type: layered
title: 图2-1 物联网经典四层参考架构
purpose: 直观展示经典四层参考架构的垂直分层结构与每层核心职责，为后续阐述架构局限性建立视觉参照。
audience_takeaway: 物联网经典四层参考架构的主链路是数据单向向上、指令单向向下，平台层是三层模型下新增的公共能力层。
visual_focus: 从底部感知层向上经网络层、平台层到应用层的数据流（实线箭头），以及反向的指令流（虚线箭头）；左侧安全贯穿所有层。
design_level: logical
layout: 垂直叠放，自下而上依次为感知层、网络层、平台层、应用层；左侧竖列为安全贯穿层。
elements:
- 感知层、网络层、平台层、应用层四层主体
- 贯穿四层的安全能力
relationships:
- 感知层 → 网络层 → 平台层 → 应用层：数据逐层上行
- 应用层 → 平台层 → 网络层 → 感知层：控制指令逐层下行
- 安全能力 → 各层：提供鉴权与审计约束
components:
- id: perception_layer
  label: 感知层
  type: edge
  subtitle: 传感器、RFID、摄像头
  group: data_domain
  priority: primary
  shape: card
- id: network_layer
  label: 网络层
  type: platform
  subtitle: Wi-Fi / LoRaWAN / 5G
  group: platform_domain
  priority: primary
  shape: card
- id: platform_layer
  label: 平台层
  type: platform
  subtitle: 设备管理、数据存储
  group: platform_domain
  priority: primary
  shape: card
- id: application_layer
  label: 应用层
  type: application
  subtitle: MES、能源管理
  group: application_domain
  priority: primary
  shape: card
- id: security_layer
  label: 安全贯穿
  type: security
  subtitle: 鉴权、审计
  group: ''
  priority: normal
  shape: boundary
connections:
- from: perception_layer
  to: network_layer
  label: 数据上行
  style: solid
  direction: bottom-to-top
- from: network_layer
  to: platform_layer
  label: 数据上行
  style: solid
  direction: bottom-to-top
- from: platform_layer
  to: application_layer
  label: 数据上行
  style: solid
  direction: bottom-to-top
- from: application_layer
  to: platform_layer
  label: 指令下行
  style: dashed
  direction: top-to-bottom
- from: platform_layer
  to: network_layer
  label: 指令下行
  style: dashed
  direction: top-to-bottom
- from: network_layer
  to: perception_layer
  label: 指令下行
  style: dashed
  direction: top-to-bottom
regions:
- id: data_domain
  label: 数据资产域
  role: 感知数据产生与接入边界
- id: platform_domain
  label: 平台服务域
  role: 数据治理与核心服务能力
- id: application_domain
  label: 业务应用域
  role: 业务逻辑与价值交付
callouts:
- 数据单向向上：感知层→网络层→平台层→应用层（实线箭头）
- 指令单向向下：应用层→平台层→网络层→感知层（虚线箭头）
- 安全层（琥珀色竖线）贯穿所有层，但架构缺乏统一的策略点
legend:
- 青绿色矩形 = 感知层；橙色矩形 = 网络层
- 蓝色矩形 = 平台层；紫色矩形 = 应用层
- 琥珀色竖线 = 安全贯穿层
- 实线箭头（向上）= 数据流方向；虚线箭头（向下）= 命令/控制流方向
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文
- 图例放在底部，不遮挡主体结构
- 左侧安全竖线只体现概念，不画具体连线
render_notes: HTML绘制采用flexbox实现垂直叠放布局。每层内items以flex-wrap排列，换行后居中对齐。安全竖条使用绝对定位的竖线，通过左margin与各层边框对齐。使用SVG inline渲染箭头，颜色遵循Material Design色系。层高根据items数量自适应，整体宽高比建议保持4:3。字号统一13px，中文使用系统默认字体。
caption:
  zh: 图2-1 物联网经典四层参考架构。平台层相比早期三层模型是新增层，将设备管理、数据存储、规则引擎等公共能力从应用层剥离。数据向上、指令向下的单向流向，决定了经典架构在处理复杂决策时存在结构性短板。
  en: 'Figure 2-1 The classic four-layer IoT reference architecture. The platform layer is the new layer added over the earlier three-layer model, carving shared capabilities such as device management, data storage, and the rule engine out of the application layer. The one-way flow of data upward and commands downward leaves the classic architecture with structural shortcomings in complex decision-making.'
labels:
  en:
    图2-1 物联网经典四层参考架构: Figure 2-1 The Classic Four-Layer IoT Reference Architecture
    物联网经典四层参考架构由感知层、网络层、平台层和应用层组成，数据向上流动、指令向下执行，安全能力贯穿四层。: The classic four-layer IoT reference architecture consists of the sensing, network, platform, and application layers; data flows up, commands flow down, and security spans all four layers.
    平台层承接公共能力，数据向上、指令向下，安全贯穿四层: The platform layer hosts shared capabilities; data up, commands down, security spans all layers
    安全贯穿: Security
    鉴权 · 审计: Auth · Audit
    身份认证: Authentication
    访问控制: Access Control
    通信加密: Encryption
    审计追踪: Audit Trail
    横向贯穿能力: Cross-Cutting Capability
    应用层: Application Layer
    MES、能源管理、业务可视化: MES · Energy · Visualization
    平台层: Platform Layer
    设备管理、数据存储、规则引擎: Device Mgmt · Storage · Rule Engine
    公共能力层: Shared Capability Layer
    网络层: Network Layer
    感知层: Sensing Layer
    传感器、RFID、摄像头、执行器: Sensors · RFID · Cameras · Actuators
    数据上行: Data Up
    指令下行: Commands Down
    实线 = 数据上行: Solid = data up
    虚线 = 指令下行: Dashed = commands down
    图2-1 平台层是相较早期三层模型新增的公共能力层；数据向上、指令向下的单向流向，决定了经典架构的结构性短板。: Figure 2-1 The platform layer is the shared capability layer newly added over the earlier three-layer model; the one-way flow of data up and commands down defines the structural weakness of the classic architecture.
