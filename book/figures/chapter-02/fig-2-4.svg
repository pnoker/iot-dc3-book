<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图2-4 传统数据模式与智能闭环模式的数据流程对比</title>
  <desc id="desc">读者应理解传统数据模式与智能闭环模式的数据流程对比中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">图2-4 传统数据模式与智能闭环模式的数据流程对比</title>
  <desc id="desc">读者应理解传统数据模式与智能闭环模式的数据流程对比中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图2-4 传统数据模式与智能闭环模式的数据流程对比</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解传统数据模式与智能闭环模式的数据流程对比中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">FLOWCHART</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="flowchart">
  <!-- 左栏：传统模式（灰色调） -->
  <!-- c1: 传感器采集数据 -->
  <rect x="150" y="200" width="300" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="300" y="246" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">传感器采集数据</text>
  
  <!-- c2: 网络传输与平台存储 -->
  <rect x="150" y="350" width="300" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="300" y="396" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">网络传输与平台存储</text>
  
  <!-- c3: 大屏展示/告警通知 -->
  <rect x="150" y="500" width="300" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="300" y="546" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">大屏展示/告警通知</text>
  
  <!-- c4: 人工查看→手动操作设备（圆角矩形区分） -->
  <rect x="150" y="650" width="300" height="80" rx="15" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="300" y="696" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">人工查看→手动操作设备</text>
  
  <!-- 左栏连线 -->
  <line x1="300" y1="280" x2="300" y2="350" stroke="#94A3B8" stroke-width="2"/>
  <line x1="300" y1="430" x2="300" y2="500" stroke="#94A3B8" stroke-width="2"/>
  <line x1="300" y1="580" x2="300" y2="650" stroke="#94A3B8" stroke-width="2"/>
  
  <!-- 右栏：智能闭环模式 -->
  <!-- c5: 采集（蓝色） -->
  <rect x="1050" y="200" width="300" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1200" y="240" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">采集：异构数据归一化为PointValue流</text>
  <text x="1200" y="258" fill="#475569" font-size="11" text-anchor="middle">采集阶段</text>
  
  <!-- c6: 理解（浅蓝，仍用 #EFF6FF 但稍深？统一用 primary） -->
  <rect x="1050" y="350" width="300" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1200" y="390" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">理解：状态感知+趋势预测（模型推理）</text>
  <text x="1200" y="408" fill="#475569" font-size="11" text-anchor="middle">理解阶段</text>
  
  <!-- c7: 决策（橙色） -->
  <rect x="1050" y="500" width="300" height="80" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1200" y="540" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">决策：规则引擎+AI规划，输出结构化的动作序列</text>
  <text x="1200" y="558" fill="#475569" font-size="11" text-anchor="middle">决策阶段</text>
  
  <!-- c8: 执行（绿色） -->
  <rect x="1050" y="650" width="300" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1200" y="690" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">执行：指令调度+协议驱动，下发至设备并回执</text>
  <text x="1200" y="708" fill="#475569" font-size="11" text-anchor="middle">执行阶段</text>
  
  <!-- 右栏连线 -->
  <line x1="1200" y1="280" x2="1200" y2="350" stroke="#2563EB" stroke-width="2"/>
  <line x1="1200" y1="430" x2="1200" y2="500" stroke="#2563EB" stroke-width="2"/>
  <line x1="1200" y1="580" x2="1200" y2="650" stroke="#2563EB" stroke-width="2"/>
  
  <!-- 回路箭头：从c8右侧到c5右侧，深绿色加粗虚线 -->
  <path d="M 1350 690 L 1400 690 L 1400 240 L 1350 240" fill="none" stroke="#0F766E" stroke-width="3" stroke-dasharray="8,4"/>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">采集阶段</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">理解阶段</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">决策阶段</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图2-4 传统数据模式与智能闭环模式的数据流程对比</text>
  </svg>
</svg>