type: sequence
title: 图2-8 认证流程时序图：用户登录到设备列表访问
purpose: 展示Auth中心如何与Gateway、Manager协作，完成用户登录、令牌颁发、请求校验和权限判定的完整过程。
audience_takeaway: Auth 建立平台主体，Gateway 执行入口过滤，Manager 仍按租户、资源和动作语义做业务授权。
visual_focus: 用户→Gateway→Auth 的登录与 Token 签发，以及携带认证头访问 Manager 时三个授权边界的分工。
design_level: logical
layout: 四列自上而下排列，参与者从左到右：用户、Gateway、Auth中心、Manager中心。消息按时间顺序从上到下标注步骤编号。
elements:
- 用户或浏览器
- Gateway、Auth 中心与 Manager 中心
relationships:
- 用户 → Gateway → Auth 中心：提交凭证并请求登录
- Auth 中心 → Gateway → 用户：签发并返回平台 Token
- 用户 → Gateway ↔ Auth 中心：携带认证头请求设备列表并完成主体校验与入口过滤
- Gateway → Manager 中心 → Gateway → 用户：按认证上下文查询并返回设备列表
components:
- id: user
  label: 用户/浏览器
  type: external
  subtitle: ''
  group: ''
  priority: normal
  shape: actor
- id: gateway
  label: Gateway
  type: platform
  subtitle: dc3-gateway:8000
  group: ''
  priority: primary
  shape: card
- id: auth
  label: Auth中心
  type: platform
  subtitle: dc3-center-auth:9000
  group: ''
  priority: primary
  shape: card
- id: manager
  label: Manager中心
  type: platform
  subtitle: dc3-center-manager:9001
  group: ''
  priority: normal
  shape: card
connections:
- from: user
  to: gateway
  label: 1. POST /auth/login
  style: solid
  direction: left-to-right
- from: gateway
  to: auth
  label: 2. 透传认证请求
  style: solid
  direction: left-to-right
- from: auth
  to: auth
  label: 3. 核对凭证，生成Token
  style: dashed
  direction: feedback
- from: auth
  to: gateway
  label: 4. 返回access_token + refresh_token
  style: solid
  direction: right-to-left
- from: gateway
  to: user
  label: 5. 返回Token
  style: solid
  direction: right-to-left
- from: user
  to: gateway
  label: 6. GET /manager/device/list (Bearer Token)
  style: solid
  direction: left-to-right
- from: gateway
  to: auth
  label: 7. 验证Token有效性
  style: solid
  direction: left-to-right
- from: auth
  to: gateway
  label: 8. 令牌有效，返回角色+租户
  style: solid
  direction: right-to-left
- from: gateway
  to: auth
  label: 9. 校验 device:read 权限+租户
  style: solid
  direction: left-to-right
- from: auth
  to: gateway
  label: 10. 权限校验通过
  style: solid
  direction: right-to-left
- from: gateway
  to: manager
  label: 11. 转发请求（携带用户上下文）
  style: solid
  direction: left-to-right
- from: manager
  to: manager
  label: 12. 查询该租户下的设备列表
  style: dashed
  direction: feedback
- from: manager
  to: gateway
  label: 13. 返回设备列表JSON
  style: solid
  direction: right-to-left
- from: gateway
  to: user
  label: 14. 200 OK, 设备列表
  style: solid
  direction: right-to-left
callouts:
- Gateway在转发业务请求前完成Token验证和权限判断，Manager不再参与认证。
- 步骤3和12是内部操作，用虚线自反馈表示。
legend:
- 实线箭头：请求（Request）
- 虚线箭头：响应（Response）或内部操作
visual_constraints:
- 仅四个参与者：用户、Gateway、Auth中心、Manager中心，不要额外增加。
- 消息标签简洁，不超过15个汉字。
render_notes: HTML/SVG渲染，自上而下顺序图，参与者生命线为实线，消息箭头带步骤编号和简短标签，内部操作用矩形框标注在生命线旁。浅色背景，圆角矩形生命线。
caption:
  zh: 图2-8 Auth 建立平台主体，Gateway 执行入口策略，Manager 仍按租户与资源语义授权查询。
  en: 'Figure 2-8 Auth establishes the platform principal, Gateway applies entry policy, and Manager still authorizes the query by tenant and resource semantics.'
labels:
  en:
    图2-8 认证流程时序图：用户登录到设备列表访问: 'Figure 2-8 Authentication Sequence: Login to Device-List Access'
    用户经 Gateway 调用 Auth 换取平台 Token，再携带项目约定的认证头请求设备列表；Gateway 执行入口策略，Manager 仍校验资源边界。: The user calls Auth through Gateway to obtain a platform Token, then requests the device list with the project's authentication headers; Gateway applies entry policy, while Manager still validates resource boundaries.
    认证、入口过滤与资源授权是三个边界: Authentication, entry filtering, and resource authorization are three separate boundaries
    用户/浏览器: User / Browser
    客户端: Client
    Auth 中心: Auth Center
    Manager 中心: Manager Center
    3 核对凭证并签发 Token: 3 Verify Credentials, Issue Token
    12 校验资源并查询: 12 Validate Resource and Query
    1 登录请求: 1 Login Request
    2 透传认证: 2 Pass-Through Auth
    4 返回令牌: 4 Return Tokens
    5 返回 Token: 5 Return Token
    6 请求设备列表: 6 Request Device List
    7 验证 Token: 7 Verify Token
    8 返回角色与租户: 8 Return Role & Tenant
    9 执行入口策略: 9 Apply Entry Policy
    10 入口允许: 10 Entry Allowed
    11 转发（带用户上下文）: 11 Forward (with User Context)
    13 返回设备列表: 13 Return Device List
    请求（Request）: Request
    响应（Response）: Response
    内部操作（自循环）: Internal Operation (Self-Loop)
    图2-8 Auth 建立平台主体，Gateway 执行入口策略，Manager 仍按租户与资源语义授权查询。: Figure 2-8 Auth establishes the platform principal, Gateway applies entry policy, and Manager still authorizes the query by tenant and resource semantics.
