<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">图2-9 设备生命周期状态机</title>
  <desc id="desc">展示 Manager 中心管理的设备从注册到退役的五个状态及迁移条件。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">图2-9 设备生命周期状态机</text>
  <text x="82" y="70" fill="#64748B" font-size="12" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">展示设备从注册到退役的五个状态及迁移条件，终结路径表示管理员强制移除设备。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4" font-family="Arial,sans-serif">LIFECYCLE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>

  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">
  <!-- 状态节点 -->
  <!-- 未激活 (data 紫) -->
  <rect x="210" y="185" width="240" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="330" y="222" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">未激活</text>
  <text x="330" y="248" font-size="12" fill="#64748B" text-anchor="middle">初始状态</text>

  <!-- 在线 (primary 蓝, primary) -->
  <rect x="780" y="185" width="240" height="90" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="222" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">在线</text>
  <text x="900" y="248" font-size="12" fill="#64748B" text-anchor="middle">正常工作</text>

  <!-- 离线 (cloud 琥珀) -->
  <rect x="1350" y="185" width="240" height="90" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1470" y="222" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">离线</text>
  <text x="1470" y="248" font-size="12" fill="#64748B" text-anchor="middle">失联超阈值</text>

  <!-- 维护中 (edge 青绿) -->
  <rect x="210" y="445" width="240" height="90" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="330" y="482" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">维护中</text>
  <text x="330" y="508" font-size="12" fill="#64748B" text-anchor="middle">运维干预</text>

  <!-- 已注销 (external 灰, 终结) -->
  <rect x="780" y="615" width="240" height="90" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="900" y="652" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">已注销</text>
  <text x="900" y="678" font-size="12" fill="#64748B" text-anchor="middle">永久移除</text>

  <!-- 正常迁移（实线蓝） -->
  <!-- 1. 未激活 → 在线：首次上报 -->
  <line x1="450" y1="230" x2="775" y2="230" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="612" y="220" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="600">首次上报</text>

  <!-- 2. 在线 → 离线：失联超阈值 -->
  <line x1="1020" y1="230" x2="1345" y2="230" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="1182" y="220" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="600">失联超阈值</text>

  <!-- 3. 离线 → 在线：恢复上报（弧线，从顶部绕回） -->
  <path d="M 1350 210 Q 1187 130 1025 210" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="1187" y="122" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="600">恢复上报</text>

  <!-- 4. 在线 → 维护中：运维干预（弧线，向下偏左） -->
  <path d="M 780 255 Q 560 330 455 460" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="560" y="318" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="600">运维干预</text>

  <!-- 5. 维护中 → 在线：运维恢复（弧线，向上偏右） -->
  <path d="M 445 475 Q 665 400 775 270" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="665" y="418" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="600">运维恢复</text>

  <!-- 终结迁移（虚线红） -->
  <!-- 1. 未激活 → 已注销 -->
  <line x1="380" y1="275" x2="775" y2="635" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arrow-red)"/>
  <text x="540" y="465" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="600" transform="rotate(39 540 465)">永久移除</text>

  <!-- 2. 在线 → 已注销 -->
  <line x1="900" y1="275" x2="900" y2="610" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arrow-red)"/>
  <text x="912" y="445" font-size="12" fill="#DC2626" text-anchor="start" font-weight="600">永久移除</text>

  <!-- 3. 离线 → 已注销 -->
  <line x1="1420" y1="275" x2="1025" y2="635" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arrow-red)"/>
  <text x="1260" y="465" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="600" transform="rotate(-39 1260 465)">永久移除</text>

  <!-- 4. 维护中 → 已注销 -->
  <line x1="445" y1="535" x2="780" y2="650" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#arrow-red)"/>
  <text x="585" y="608" font-size="12" fill="#DC2626" text-anchor="middle" font-weight="600" transform="rotate(34 585 608)">永久移除</text>
  </g>

  <!-- 图例 -->
  <line x1="64" y1="780" x2="1736" y2="780" stroke="#E2E8F0"/>
  <g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="600">
    <rect x="80" y="797" width="16" height="12" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="104" y="808" fill="#64748B" text-anchor="start">蓝色 = 在线（正常工作）</text>

    <rect x="335" y="797" width="16" height="12" rx="2" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
    <text x="359" y="808" fill="#64748B" text-anchor="start">青绿色 = 维护中（运维干预）</text>

    <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="659" y="808" fill="#64748B" text-anchor="start">琥珀色 = 离线（失联）</text>

    <rect x="890" y="797" width="16" height="12" rx="2" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="914" y="808" fill="#64748B" text-anchor="start">紫色 = 未激活（初始）</text>

    <rect x="1150" y="797" width="16" height="12" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="1174" y="808" fill="#64748B" text-anchor="start">灰色 = 已注销（终结）</text>

    <line x1="1400" y1="803" x2="1440" y2="803" stroke="#2563EB" stroke-width="2"/>
    <text x="1450" y="808" fill="#64748B" text-anchor="start">实线 = 正常迁移</text>

    <line x1="80" y1="830" x2="120" y2="830" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="7,5"/>
    <text x="130" y="835" fill="#64748B" text-anchor="start">虚线（红） = 终结迁移（永久移除）</text>
  </g>

  <!-- 图注 -->
  <text x="900" y="870" fill="#94A3B8" font-size="10" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600" text-anchor="middle">图2-9 设备生命周期状态机。设备从未激活进入在线，与离线、维护中之间循环迁移；任意运行状态均可经红色虚线永久注销，注销为不可逆终结态。</text>
</svg>
