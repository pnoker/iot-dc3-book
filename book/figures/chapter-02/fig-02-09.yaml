type: lifecycle
title: 图2-9 设备生命周期状态机
purpose: 展示 Manager 中心管理的设备从注册到退役的完整状态流转。
audience_takeaway: 读者应理解设备状态的迁移条件，以及状态变化如何触发规则引擎事件。
visual_focus: 核心流转路径：未激活→在线→离线→在线（循环），以及任意状态→已注销的终结路径。
design_level: logical
layout: 五个状态节点呈环形分布，顺时针方向流转，终结节点放在底部中央。
elements:
- 未激活、在线、离线、维护中四个可迁移状态
- 已注销终结状态
relationships:
- 未激活 → 在线：首次上报后激活
- 在线 ↔ 离线：失联超阈值后离线，恢复上报后在线
- 在线 ↔ 维护中：运维干预进入，运维恢复退出
- 未激活、在线、离线、维护中 → 已注销：管理员永久移除设备
components:
- id: state_inactive
  label: 未激活
  type: process
  subtitle: 初始状态
  group: ''
  priority: normal
  shape: card
- id: state_online
  label: 在线
  type: process
  subtitle: 正常工作
  group: ''
  priority: primary
  shape: card
- id: state_offline
  label: 离线
  type: process
  subtitle: 失联超阈值
  group: ''
  priority: normal
  shape: card
- id: state_maintenance
  label: 维护中
  type: process
  subtitle: 运维干预
  group: ''
  priority: normal
  shape: card
- id: state_retired
  label: 已注销
  type: process
  subtitle: 永久移除
  group: ''
  priority: normal
  shape: card
connections:
- from: state_inactive
  to: state_online
  label: 首次上报
  style: solid
  direction: bottom-to-top
- from: state_online
  to: state_offline
  label: 失联超阈值
  style: solid
  direction: left-to-right
- from: state_offline
  to: state_online
  label: 恢复上报
  style: solid
  direction: left-to-right
- from: state_online
  to: state_maintenance
  label: 运维干预
  style: solid
  direction: right-to-left
- from: state_maintenance
  to: state_online
  label: 运维恢复
  style: solid
  direction: left-to-right
- from: state_inactive
  to: state_retired
  label: 永久移除
  style: dashed
  direction: bottom-to-top
- from: state_online
  to: state_retired
  label: 永久移除
  style: dashed
  direction: bottom-to-top
- from: state_offline
  to: state_retired
  label: 永久移除
  style: dashed
  direction: bottom-to-top
- from: state_maintenance
  to: state_retired
  label: 永久移除
  style: dashed
  direction: bottom-to-top
callouts:
- 状态变化是规则引擎触发事件的关键输入源。
- 从任意状态到'已注销'的路径表示管理员强制移除设备。
legend:
- 实线箭头：正常迁移路径
- 虚线箭头：终结迁移（永久移除）
- 绿色节点：在线与维护中；橙色：离线；蓝色：未激活；灰色：已注销
visual_constraints:
- 节点最多5个，标签短。
- 终结路径统一使用虚线，避免与正常流转混淆。
render_notes: 画布400×300，推荐使用有向图布局，顺时针。节点颜色按图例，箭头带条件短语，字号10px。
caption:
  zh: 图2-9 展示设备从注册到退役的五个状态及迁移条件。
  en: 'Figure 2-9 The five device states from registration to retirement and the transition conditions between them.'
labels:
  en:
    图2-9 设备生命周期状态机: Figure 2-9 Device Lifecycle State Machine
    设备从注册到退役的五个状态：未激活、在线、离线、维护中与已注销，以及状态间的迁移条件。: Five device states from registration to retirement — inactive, online, offline, in maintenance, and deregistered — plus the transition conditions between them.
    正常迁移形成在线循环，任意状态可终结为已注销: Normal transitions cycle through online; any state can end in deregistered
    首次上报: First Report
    失联超阈值: Offline Past Threshold
    恢复上报: Reporting Resumes
    运维干预: Ops Intervention
    运维恢复: Ops Restore
    未激活: Inactive
    初始状态: Initial State
    在线: Online
    正常工作: Working Normally
    离线: Offline
    维护中: In Maintenance
    已注销: Deregistered
    永久移除: Permanent Removal
    在线 / 维护中: Online / Maintenance
    正常迁移: Normal Transition
    终结迁移（永久移除）: Terminal Transition (Permanent Removal)
    图2-9 设备可在在线、离线和维护间恢复，管理员可从任意状态永久注销设备。: Figure 2-9 Devices move recoverably among online, offline, and maintenance; an admin can permanently deregister a device from any state.
