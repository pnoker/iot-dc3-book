type: lifecycle
title: 图2-9 设备生命周期参考状态机
purpose: 展示一种从配置、连接、维护到退役的通用状态设计，并强调实际字段、心跳来源和迁移条件需要单独验证。
audience_takeaway: 生命周期不能只用一个在线布尔值表示；图中状态是参考模型，不代表当前 Manager 已实现同名状态机或自动规则事件。
visual_focus: 核心流转路径：未激活→在线→离线→在线（循环），以及任意状态→已注销的终结路径。
design_level: logical
layout: 五个状态节点呈环形分布，顺时针方向流转，终结节点放在底部中央。
elements:
- 未激活、在线、离线、维护中四个可迁移状态
- 已注销终结状态
relationships:
- 未激活 → 在线：首次上报后激活
- 在线 ↔ 离线：失联超阈值后离线，恢复上报后在线
- 在线 ↔ 维护中：运维干预进入，运维恢复退出
- 未激活、在线、离线、维护中 → 已注销：管理员永久移除设备
components:
- id: state_inactive
  label: 未激活
  type: process
  subtitle: 初始状态
  group: ''
  priority: normal
  shape: card
- id: state_online
  label: 在线
  type: process
  subtitle: 正常工作
  group: ''
  priority: primary
  shape: card
- id: state_offline
  label: 离线
  type: process
  subtitle: 失联超阈值
  group: ''
  priority: normal
  shape: card
- id: state_maintenance
  label: 维护中
  type: process
  subtitle: 运维干预
  group: ''
  priority: normal
  shape: card
- id: state_retired
  label: 已注销
  type: process
  subtitle: 永久移除
  group: ''
  priority: normal
  shape: card
connections:
- from: state_inactive
  to: state_online
  label: 首次上报
  style: solid
  direction: bottom-to-top
- from: state_online
  to: state_offline
  label: 失联超阈值
  style: solid
  direction: left-to-right
- from: state_offline
  to: state_online
  label: 恢复上报
  style: solid
  direction: left-to-right
- from: state_online
  to: state_maintenance
  label: 运维干预
  style: solid
  direction: right-to-left
- from: state_maintenance
  to: state_online
  label: 运维恢复
  style: solid
  direction: left-to-right
- from: state_inactive
  to: state_retired
  label: 永久移除
  style: dashed
  direction: bottom-to-top
- from: state_online
  to: state_retired
  label: 永久移除
  style: dashed
  direction: bottom-to-top
- from: state_offline
  to: state_retired
  label: 永久移除
  style: dashed
  direction: bottom-to-top
- from: state_maintenance
  to: state_retired
  label: 永久移除
  style: dashed
  direction: bottom-to-top
callouts:
- 配置状态、连接状态和业务状态在实现中应分开记录。
- 从任意状态到'已注销'的路径表示管理员强制移除设备。
legend:
- 实线箭头：正常迁移路径
- 虚线箭头：终结迁移（永久移除）
- 绿色节点：在线与维护中；橙色：离线；蓝色：未激活；灰色：已注销
visual_constraints:
- 节点最多5个，标签短。
- 终结路径统一使用虚线，避免与正常流转混淆。
render_notes: 画布400×300，推荐使用有向图布局，顺时针。节点颜色按图例，箭头带条件短语，字号10px。
caption:
  zh: 图2-9 生命周期应区分配置、连接与业务状态；图中迁移需用实际心跳和管理流程验证。
  en: 'Figure 2-9 A lifecycle should separate configuration, connection, and business states; the illustrated transitions require validation against actual heartbeat and management processes.'
labels:
  en:
    图2-9 设备生命周期参考状态机: Figure 2-9 Reference Device Lifecycle State Machine
    一种通用设备生命周期设计，状态名称和迁移条件需要按实际平台字段、心跳来源和业务流程落地。: A generic device-lifecycle design whose state names and transitions must be implemented against actual platform fields, heartbeat sources, and business processes.
    通用设计示例，不代表当前 Manager 已实现同名状态: Generic design example; it does not imply that the current Manager implements states with these names
    首次上报: First Report
    失联超阈值: Offline Past Threshold
    恢复上报: Reporting Resumes
    运维干预: Ops Intervention
    运维恢复: Ops Restore
    未激活: Inactive
    初始状态: Initial State
    在线: Online
    正常工作: Working Normally
    离线: Offline
    维护中: In Maintenance
    已注销: Deregistered
    永久移除: Permanent Removal
    在线 / 维护中: Online / Maintenance
    正常迁移: Normal Transition
    终结迁移（永久移除）: Terminal Transition (Permanent Removal)
    图2-9 生命周期应区分配置、连接与业务状态；图中迁移需用实际心跳和管理流程验证。: Figure 2-9 A lifecycle should separate configuration, connection, and business states; the illustrated transitions require validation against actual heartbeat and management processes.
