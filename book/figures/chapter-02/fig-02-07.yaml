    查询/命令: Query / Command
    驱动上报/命令回执: Driver Reports / Command ACKs
    写入/查询: Write / Query
    Gateway 中心: Gateway Center
    路由 · 鉴权 · 限流: Routing · Auth · Throttling
    Auth 中心: Auth Center
    身份 · RBAC · 租户: Identity · RBAC · Tenants
    Manager 中心: Manager Center
    设备模板 · 位号定义: Device Templates · Point Definitions
    Data 中心: Data Center
    位号值写入 · 查询 · 命令: Point-Value Write · Query · Command
    Agentic 中心: Agentic Center
    大模型 · 工具调用: LLMs · Tool Calls
    消息队列: Message Queue
    时序数据库: Time-Series DB
    位号值存储: Point-Value Storage
    平台微服务节点: Platform Microservice Node
    外部基础设施: External Infrastructure
    Agentic（AI 层）: Agentic (AI Layer)
    REST 同步调用: REST Sync Call
    Agentic 内部调用: Agentic Internal Call
    AMQP 消息: AMQP Message
    图2-7 五大中心按入口、准入、定义、数据流转和智能推理分工协作，数据经消息队列解耦采集与命令下发。: Figure 2-7 The five centers divide the work across entry, admission, definitions, data flow, and reasoning, with the message queue decoupling collection from command delivery.
