legend:
- 蓝色实线卡片：平台微服务节点
- 灰色虚线数据库：外部基础设施
- 实线箭头：REST API 同步调用（外部请求入口）
- 虚线箭头：Agentic 中心发起的内部 REST 调用或 AMQP 消息
visual_constraints:
- 最多7个节点，节点标签短，解释放入正文。
- 图例放在图底部，不遮挡主体结构。
- 虚线箭头只用于 Agentic 中心调用和异步消息路径，避免全图都是虚线。
render_notes: HTML/SVG渲染，浅色背景。采用自上而下三层布局，Agentic 中心置于右侧并独立于主链路。Gateway、Auth、Manager、Data 使用蓝色系，Agentic 使用橙色，消息队列和 TSDB 使用灰色。箭头带短标签，底部图例。
caption:
  zh: 图2-7 IoT DC3 五大中心逻辑关系。Gateway 是北向唯一入口，Auth 提供鉴权上下文，Manager 提供元数据，Data 是数据核心枢纽，Agentic 是 AI 能力层。数据经由消息队列解耦采集与命令下发。
  en: 'Figure 2-7 Logical relationships among the five IoT DC3 centers. Gateway is the sole northbound entry, Auth provides the authorization context, Manager provides metadata, Data is the core data hub, and Agentic is the AI capability layer. The message queue decouples data collection from command delivery.'
labels:
  en:
    图2-7 IoT DC3 五大中心逻辑关系: Figure 2-7 Logical View of the Five IoT DC3 Centers
    Gateway 是北向唯一入口，Auth 提供鉴权上下文，Manager 提供元数据，Data 是数据核心枢纽，Agentic 是 AI 能力层，数据经消息队列解耦采集与命令下发。: Gateway is the sole northbound entry, Auth provides the authorization context, Manager provides metadata, Data is the core data hub, and Agentic is the AI capability layer; the message queue decouples collection from command delivery.
    Gateway 收口、Auth 管准入、Manager 管定义、Data 管流转、Agentic 管推理: Gateway routes, Auth admits, Manager defines, Data moves, Agentic reasons
