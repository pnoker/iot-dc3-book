audience_takeaway: DC3“一个网关 + 四个中心”（Auth/Manager/Data/Agentic）的分工边界：Gateway收口、Auth管准入、Manager管定义、Data管流转、Agentic管推理；以及Agentic
  Center如何通过API调度Data和Manager实现理解→决策闭环。
visual_focus: 从Gateway中心接收外部请求，经Auth校验后分发给Manager（元数据查询）和Data（数据读写）的主调用链路；Agentic
  Center作为独立智能层通过内部API调度Data和Manager。
design_level: logical
layout: 自下而上分层布局：存储层（时序数据库）→ 数据层（Data中心）→ 基础服务层（Auth、Manager中心）→ 接入层（Gateway中心），AI层（Agentic
  Center）横向挂接在数据层和基础服务层之间。
