- Gateway → Manager、Data、Agentic：路由元数据、数据与 AI 请求
- Agentic → Manager、Data：查询元数据并读取数据或提交命令
- Driver ↔ RabbitMQ ↔ Data：异步交换位号值、命令和回执；Data → PostgreSQL：持久化
