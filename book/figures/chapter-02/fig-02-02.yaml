type: flowchart
title: 图2-2 数据采集→理解→决策→执行闭环
purpose: 展示智能层在应用层内部的闭环流程，以及各系统边界。
audience_takeaway: 从数据采集到执行反馈的闭环如何跨越物理世界、平台层和应用层，智能层在其中承担推理、规划、执行的职责。
visual_focus: 智能层（橙色）作为闭环中枢，负责推理、规划到执行的链路，通过平台层与物理世界交互。
design_level: implementation
layout: 从左到右：左侧物理世界（传感器/执行器），中间平台层（数据存储、命令通道），右侧应用层内部（智能层与业务应用）。
elements:
- 传感器与执行器
- 时序数据、设备管理与命令通道
- 推理、规划、执行与业务应用
relationships:
- 传感器 → 时序数据 → 推理 → 规划 → 执行：采集数据形成动作计划
- 执行 → 命令通道 → 执行器：受控下发设备指令
- 执行器 → 传感器：物理状态反馈开启下一轮推理
regions:
- id: physical_domain
  label: 物理世界
  role: 传感器与执行器所在边界
- id: platform_domain
  label: 平台层
  role: 数据存储、命令通道与设备管理
- id: application_domain
  label: 应用层
  role: 业务逻辑与AI推理
components:
- id: sensor
  label: 传感器
  type: edge
  subtitle: 采集现场数据
  group: physical_domain
  priority: primary
  shape: card
- id: actuator
  label: 执行器
  type: edge
  subtitle: 接收设备指令
  group: physical_domain
  priority: primary
  shape: card
- id: data_store
  label: 时序数据 & 设备管理
  type: data
  subtitle: 位号值、元数据、事件
  group: platform_domain
  priority: primary
  shape: database
- id: command_channel
  label: 命令通道 & 协议驱动
  type: platform
  subtitle: 鉴权、路由、限流
  group: platform_domain
  priority: primary
  shape: card
- id: reasoning
  label: 推理
  type: ai
  subtitle: 状态理解、异常检测
  group: application_domain
  priority: primary
  shape: process
- id: planning
  label: 规划
  type: ai
  subtitle: 多目标动作序列
  group: application_domain
  priority: primary
  shape: process
- id: execution
  label: 执行
  type: ai
  subtitle: 指令生成与下发
  group: application_domain
  priority: primary
  shape: process
- id: business_app
  label: 业务应用
  type: application
  subtitle: 告警、报表、可视化
  group: application_domain
  priority: normal
  shape: card
connections:
- from: sensor
  to: data_store
  label: 上行采集
  style: solid
  direction: left-to-right
- from: data_store
  to: reasoning
  label: 上下文供给
  style: solid
  direction: left-to-right
- from: reasoning
  to: planning
  label: 状态传递
  style: solid
  direction: left-to-right
- from: planning
  to: execution
  label: 规划下发
  style: solid
  direction: left-to-right
- from: execution
  to: command_channel
  label: 指令写入
  style: dashed
  direction: left-to-right
- from: command_channel
  to: actuator
  label: 下行命令
  style: solid
  direction: left-to-right
- from: actuator
  to: sensor
  label: 执行反馈
  style: dashed
  direction: right-to-left
- from: execution
  to: business_app
  label: 决策输出
  style: dashed
  direction: bottom-to-top
callouts:
- 智能层三项职责（推理→规划→执行）在图中按从左到右顺序展示。
- 执行反馈通过虚线箭头回到传感器，形成闭环修正。
- 虚线表示异步或事件驱动，实线表示同步或强依赖。
legend:
- 青绿色=物理设备；蓝色=平台服务；橙色=智能层AI组件；灰色=业务应用。
- 实线箭头=同步/即时操作；虚线箭头=异步/事件驱动。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts。
- 图例放在底部，不遮挡主体结构。
- 橙色只用于智能层组件，避免全图都高亮。
render_notes: HTML/SVG渲染，浅色背景，圆角矩形。使用统一12px间距。应用层用虚线框表示边界。箭头带短标签。
caption:
  zh: 图2-2 智能层的闭环工作流：数据从物理世界采集，经平台层进入智能层进行推理与规划，规划结果通过平台层下发到执行器，执行反馈再回到传感器开始下一轮循环。
  en: 'Figure 2-2 The closed-loop workflow of the intelligence layer: data is collected from the physical world, enters the intelligence layer through the platform layer for reasoning and planning, and the resulting plan is delivered through the platform layer to actuators; execution feedback then returns to the sensors to start the next cycle.'
labels:
  en:
    图2-2 数据采集→理解→决策→执行闭环: Figure 2-2 Collect → Understand → Decide → Execute Loop
    数据从物理世界采集，经平台层进入智能层完成推理、规划与执行，指令经受控通道下发到执行器，执行反馈再回到传感器形成闭环。: Data is collected from the physical world and enters the intelligence layer through the platform layer for reasoning, planning, and execution; commands reach actuators through a controlled channel, and execution feedback returns to the sensors to close the loop.
    智能层承担推理、规划与执行编排，经平台层与物理世界交互: The intelligence layer handles reasoning, planning, and execution orchestration, and reaches the physical world through the platform layer
    物理世界: Physical World
    平台层: Platform Layer
    应用层（含智能层）: Application Layer (incl. Intelligence)
    传感器: Sensor
    采集现场数据: Collects field data
    执行器: Actuator
    改变物理状态: Changes physical state
    时序数据: Time-Series Data
    位号值 · 元数据: Point Values · Metadata
    命令通道: Command Channel
    鉴权 · 路由 · 限流: Auth · Routing · Throttling
    推理: Reasoning
    状态理解: State Understanding
    规划: Planning
    动作序列: Action Sequence
    执行: Execution
    指令生成: Command Generation
    业务应用: Business Apps
    告警 · 报表 · 可视化: Alarms · Reports · Dashboards
    上行采集: Uplink Collection
    上下文供给: Context Feed
    下行命令: Downlink Command
    指令写入: Command Write
    执行反馈: Execution Feedback
    决策输出: Decision Output
    物理设备: Physical Devices
    平台服务: Platform Services
    智能层: Intelligence Layer
    实线 = 同步/即时: Solid = sync / immediate
    虚线 = 异步/事件: Dashed = async / event
    图2-2 数据经平台层进入智能层完成推理与规划，指令经受控通道下发，执行反馈开启下一轮循环。: Figure 2-2 Data enters the intelligence layer through the platform layer for reasoning and planning; commands go out through a controlled channel, and execution feedback starts the next cycle.
