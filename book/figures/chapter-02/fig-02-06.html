<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图2-6 智能层在闭环中的推理-规划-执行分工</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图2-6 智能层在闭环中的推理-规划-执行分工</title>
  <desc id="desc">智能层内的推理、规划、执行三个环节形成闭环，通过平台层的数据中心与管理中心协同，不直接连接设备协议。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

    <defs>
      <marker id="mk-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#2563EB"/></marker>
      <marker id="mk-teal" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#0F766E"/></marker>
      <marker id="mk-orange" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#F97316"/></marker>
    </defs>

    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图2-6 智能层在闭环中的推理-规划-执行分工</text>
    <text x="88" y="64" font-size="12" fill="#64748B">智能层经平台层交互，不直接连接设备协议</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 三个域边界 -->
    <rect x="160" y="160" width="1480" height="190" rx="12" fill="none" stroke="#F97316" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="184" y="190" font-size="18" font-weight="700" fill="#F97316">智能决策域</text>
    <rect x="160" y="400" width="1480" height="190" rx="12" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="184" y="430" font-size="18" font-weight="700" fill="#2563EB">平台服务域</text>
    <rect x="160" y="650" width="1480" height="190" rx="12" fill="none" stroke="#0F766E" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="184" y="680" font-size="18" font-weight="700" fill="#0F766E">设备接入域</text>

    <!-- 智能层三模块 -->
    <rect x="220" y="200" width="320" height="120" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="380" y="252" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">推理</text>
    <text x="380" y="282" font-size="16" fill="#475569" text-anchor="middle">状态评估</text>
    <rect x="700" y="200" width="320" height="120" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="860" y="252" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">规划</text>
    <text x="860" y="282" font-size="16" fill="#475569" text-anchor="middle">动作序列</text>
    <rect x="1180" y="200" width="320" height="120" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="1340" y="252" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">执行</text>
    <text x="1340" y="282" font-size="16" fill="#475569" text-anchor="middle">指令下发</text>

    <!-- 平台层两模块 -->
    <rect x="220" y="440" width="320" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="380" y="492" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">数据中心</text>
    <text x="380" y="522" font-size="16" fill="#475569" text-anchor="middle">时序 / 命令</text>
    <rect x="1180" y="440" width="320" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1340" y="492" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">管理中心</text>
    <text x="1340" y="522" font-size="16" fill="#475569" text-anchor="middle">设备元数据</text>

    <!-- 设备接入层两模块 -->
    <rect x="220" y="690" width="320" height="120" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <text x="380" y="742" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">驱动服务</text>
    <text x="380" y="772" font-size="16" fill="#475569" text-anchor="middle">协议转换</text>
    <rect x="1180" y="690" width="320" height="120" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <text x="1340" y="742" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">现场设备</text>
    <text x="1340" y="772" font-size="16" fill="#475569" text-anchor="middle">传感器 / 执行器</text>

    <!-- 连线：先画线 -->
    <g stroke="#F97316" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#mk-orange)">
      <line x1="540" y1="260" x2="700" y2="260"/>
      <line x1="1020" y1="260" x2="1180" y2="260"/>
    </g>
    <path d="M1340 320 V360 H380 V440" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="380" y1="560" x2="380" y2="690" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="540" y1="750" x2="1180" y2="750" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <path d="M1180 690 V630 H540 V560" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-teal)"/>
    <line x1="340" y1="440" x2="340" y2="320" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <path d="M1180 440 V405 H540 V320" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>

    <!-- 连线标签 -->
    <text x="620" y="246" font-size="15" font-weight="700" fill="#F97316" text-anchor="middle">状态评估</text>
    <text x="1100" y="246" font-size="15" font-weight="700" fill="#F97316" text-anchor="middle">动作序列</text>
    <text x="860" y="352" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">指令写入</text>
    <text x="392" y="628" font-size="15" font-weight="700" fill="#2563EB">命令路由</text>
    <text x="860" y="738" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">协议命令</text>
    <text x="860" y="622" font-size="15" font-weight="700" fill="#0F766E" text-anchor="middle">遥测上报</text>
    <text x="328" y="382" font-size="15" font-weight="700" fill="#2563EB" text-anchor="end">数据拉取</text>
    <text x="860" y="397" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">模型 / 阈值</text>

    <!-- 图例 -->
    <rect x="150" y="870" width="30" height="22" rx="5" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="190" y="886" font-size="16" fill="#475569">智能层认知能力</text>
    <rect x="440" y="870" width="30" height="22" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="480" y="886" font-size="16" fill="#475569">平台层基础设施</text>
    <rect x="730" y="870" width="30" height="22" rx="5" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="770" y="886" font-size="16" fill="#475569">设备接入层</text>

    <line x1="1040" y1="881" x2="1098" y2="881" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <text x="1110" y="886" font-size="16" fill="#475569">实线 = 同步调用/强依赖</text>
    <line x1="1420" y1="881" x2="1478" y2="881" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-teal)"/>
    <text x="1490" y="886" font-size="16" fill="#475569">虚线 = 异步事件/反馈</text>

    <!-- 图注 -->
    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图2-6 推理、规划、执行三个认知环节经数据中心与管理中心协同完成数据驱动决策循环，不直接操作设备协议。</text>
  </svg>
</svg>
  </main>
