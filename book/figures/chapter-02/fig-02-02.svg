  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图2-2 智能层的闭环工作流：数据从物理世界采集，经平台层进入智能层进行推理与规划，规划结果通过平台层下发到执行器，执行反馈再回到传感器开始下一轮循环。</text>
