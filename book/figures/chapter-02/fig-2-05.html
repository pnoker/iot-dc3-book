<text x="900" y="590" fill="#94A3B8" font-size="10" text-anchor="middle">图2-5 Data 中心"一次接收、两处分发"：一路进消息队列异步写时序库（持久化），一路即时推送实时订阅方（实时性），二者并行不阻塞。</text>

    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">dataflow</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">从左到右水平流向。现场设备 → 驱动 dc3-driver-* → Gateway → Data 中心 → 消息队列（RabbitMQ）→ 时序数据库，同时消息队列将数据分发到订阅方（监控/Agentic/告警）。</div></div>
