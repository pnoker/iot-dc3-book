  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }

<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图2-3 五层架构与传统四层架构对比示意</title>
  <desc id="desc">经典四层架构数据流单向向上；五层架构在平台层与智能层之间形成双向接口，实现决策回写闭环。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>

    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

    <defs>
      <marker id="mk-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#2563EB"/></marker>
      <marker id="mk-orange" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#F97316"/></marker>
      <marker id="mk-gray" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#64748B"/></marker>

    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>

    <!-- 左列：经典四层 -->

    <text x="400" y="198" font-size="22" font-weight="700" fill="#475569" text-anchor="middle">经典四层</text>

    <rect x="210" y="215" width="380" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="400" y="261" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">应用层</text>
    <rect x="210" y="327" width="380" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>

    <rect x="210" y="551" width="380" height="80" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <text x="400" y="597" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">感知层</text>

    <g stroke="#2563EB" stroke-width="2.2" fill="none" marker-end="url(#mk-blue)">
      <line x1="400" y1="551" x2="400" y2="519"/>
      <line x1="400" y1="439" x2="400" y2="407"/>
      <line x1="400" y1="327" x2="400" y2="295"/>
    </g>
    <text x="408" y="539" font-size="15" font-weight="700" fill="#2563EB">数据采集</text>
    <text x="408" y="427" font-size="15" font-weight="700" fill="#2563EB">传输</text>
    <text x="408" y="315" font-size="15" font-weight="700" fill="#2563EB">存储与展示</text>
    <text x="400" y="695" font-size="15" fill="#64748B" text-anchor="middle">数据单向上行 · 终点是被看见</text>

    <!-- 右列：五层架构 -->
    <rect x="1150" y="165" width="460" height="610" rx="12" fill="none" stroke="#F97316" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="1380" y="198" font-size="22" font-weight="700" fill="#F97316" text-anchor="middle">五层架构</text>

    <rect x="1190" y="215" width="380" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="1380" y="261" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">应用层</text>

    <text x="1380" y="597" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">网络层</text>
    <rect x="1190" y="663" width="380" height="80" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <text x="1380" y="709" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">感知层</text>

    <g stroke="#2563EB" stroke-width="2.2" fill="none" marker-end="url(#mk-blue)">
      <line x1="1300" y1="663" x2="1300" y2="631"/>
      <line x1="1300" y1="551" x2="1300" y2="519"/>

    <text x="1308" y="539" font-size="15" font-weight="700" fill="#2563EB">传输</text>

    <g stroke="#F97316" stroke-width="2.4" fill="none">
      <line x1="1372" y1="439" x2="1372" y2="407" marker-end="url(#mk-orange)"/>
      <line x1="1388" y1="407" x2="1388" y2="439" marker-end="url(#mk-orange)"/>
    </g>
    <text x="1358" y="427" font-size="15" font-weight="700" fill="#F97316" text-anchor="end">读取数据</text>
    <text x="1396" y="427" font-size="15" font-weight="700" fill="#F97316">命令下发</text>

    <g stroke="#64748B" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#mk-gray)">
      <line x1="1460" y1="519" x2="1460" y2="551"/>

      <line x1="1460" y1="327" x2="1460" y2="295"/>

    <text x="1468" y="651" font-size="15" font-weight="700" fill="#64748B">执行</text>
    <text x="1468" y="315" font-size="15" font-weight="700" fill="#64748B">决策反馈</text>
    <text x="1380" y="800" font-size="15" font-weight="700" fill="#F97316" text-anchor="middle">智能层 ⇄ 平台层 · 决策回写闭环</text>

    <rect x="150" y="840" width="30" height="22" rx="5" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>

    <rect x="780" y="840" width="30" height="22" rx="5" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>

    <rect x="1040" y="840" width="30" height="22" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="1080" y="856" font-size="16" fill="#475569">应用层</text>

    <line x1="1300" y1="851" x2="1358" y2="851" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <text x="1370" y="856" font-size="16" fill="#475569">实线 = 数据/命令正向流</text>
    <line x1="1600" y1="851" x2="1658" y2="851" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>
    <text x="1670" y="856" font-size="16" fill="#475569">虚线 = 反馈/回写</text>

    <!-- 图注 -->
    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图2-3 经典四层数据流单向向上；五层架构在平台层与智能层之间形成闭环：平台层提供数据、智能层回写命令。</text>

</svg>
