  to: data_center
  label: 转发数据
  style: solid
  direction: left-to-right
- from: data_center
  to: mq
  label: 数据入队
  style: solid
  direction: left-to-right
- from: mq
  to: tsdb
  label: 异步写入
  style: dashed
