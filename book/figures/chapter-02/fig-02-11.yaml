type: dataflow
title: 图2-11 Data中心数据流示意
purpose: 展示IoT DC3 Data中心从设备采集到时序存储的核心数据流，说明消息队列如何缓冲和解耦。
audience_takeaway: Data 中心是一个『一次接收、两处分发』的数据管道：一条路径进消息队列，另一条路径即时推送给实时订阅方。
visual_focus: 从现场设备到消息队列的主链路，以及从消息队列分流到时序数据库和订阅方的分支路径。
design_level: implementation
layout: horizontal_left_to_right 从现场设备开始，经过驱动、Gateway、Data中心，到达消息队列，然后分流到时序数据库和订阅方。
elements:
- 现场设备与南向驱动
- Gateway、Data 中心与 RabbitMQ
- 时序数据库与实时订阅方
relationships:
- 现场设备 → 驱动 → Gateway → Data 中心：原始信号归一为 PointValue 并完成路由
- Data 中心 → RabbitMQ：数据入队以削峰解耦
- RabbitMQ → 时序数据库：异步持久化
- RabbitMQ → 订阅方：实时分发给监控、Agentic 与告警服务
regions:
- id: edge_domain
  label: 设备与边缘域
  role: 现场异构资源边界
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
- id: data_domain
  label: 数据资产域
  role: 数据沉淀与治理边界
components:
- id: field_device
  label: 现场设备
  type: edge
  subtitle: PLC、电表、传感器
  group: edge_domain
  priority: primary
  shape: card
- id: driver
  label: 驱动模块
  type: platform
  subtitle: 南向协议驱动
  group: edge_domain
  priority: normal
  shape: card
- id: gateway
  label: Gateway
  type: platform
  subtitle: 鉴权与路由
  group: platform_domain
  priority: primary
  shape: card
- id: data_center
  label: Data中心
  type: data
