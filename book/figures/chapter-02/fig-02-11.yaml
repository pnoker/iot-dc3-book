    图2-11 数据进入 Data 与消息队列后分流：一路异步写入时序库，一路实时推送给订阅方，互不阻塞。: Figure 2-11 Once data enters the Data center and the message queue, it splits — one branch writes asynchronously to the time-series DB, the other pushes to subscribers in real time, and neither blocks the other.
