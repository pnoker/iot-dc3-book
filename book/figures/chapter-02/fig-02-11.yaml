callouts:
- 数据先入队，再写入存储，保证了高并发下的平稳写入。
- 消息队列同时向订阅方实时推送，满足监控和告警的秒级需求。
- 实时路径和写入路径异步，互不依赖，提升了系统的整体可用性。
legend:
- 青绿色=设备与边缘；蓝色=平台服务与数据；橙色=缓冲层；灰色=外部消费方。
- 实线=同步/即时调用；虚线=异步/事件驱动。
- 橙色节点表示本数据流中的关键缓冲和解耦环节。
visual_constraints:
- 节点数量不超过8个，避免过多分支导致视觉混乱。
- 橙色只用于消息队列节点，不用于其他组件。
- 箭头标签使用短中文，不超过10个字。
- 图注放在底部，清晰说明颜色和线型的语义。
render_notes: HTML/SVG 渲染，浅色背景。使用水平从左到右布局，突出主链路。节点颜色严格按图例标注。箭头应有方向指示，消息队列用三条平行竖线表示缓冲。
caption:
  zh: 图2-11 展示了IoT DC3 Data中心的核心数据流，以及消息队列如何解耦写入和分发。
  en: 'Figure 2-11 The core data flow of the IoT DC3 Data center, showing how the message queue decouples persistence from distribution.'
labels:
  en:
    图2-11 Data中心数据流示意: Figure 2-11 Data Center Data Flow
    现场设备数据经驱动归一、Gateway 路由进入 Data 中心，写入消息队列后分流：一路异步持久化到时序数据库，另一路实时推送给订阅方。: 'Field-device data is normalized by drivers and routed through Gateway into the Data center, then enqueued and split: one branch persists asynchronously to the time-series DB, the other pushes to subscribers in real time.'
    消息队列把持久化写入与实时消费解耦: The message queue decouples persistent writes from real-time consumption
