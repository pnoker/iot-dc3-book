<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图2-1 物联网经典四层参考架构</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#F8FAFC}body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;color:#0F172A}.figure{width:1200px;height:620px;margin:0}.figure svg{display:block}
</style>
</head>
<body>
<main class="figure" data-figure-root>
<svg width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
<title id="title">图2-1 物联网经典四层参考架构</title>
<desc id="desc">物联网经典四层架构由感知层、网络层、平台层和应用层组成，数据向上流动、指令向下执行，安全能力贯穿四层。</desc>
<defs>
  <marker id="blueArrow" viewBox="0 0 12 8" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4 0 8Z" fill="#2563EB"/></marker>
  <marker id="tealArrow" viewBox="0 0 12 8" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4 0 8Z" fill="#0F766E"/></marker>
</defs>
<rect width="1200" height="620" fill="#F8FAFC"/>
<circle cx="46" cy="39" r="6" fill="#2563EB"/>
<text x="66" y="47" font-size="25" font-weight="750" fill="#0F172A">图2-1 物联网经典四层参考架构</text>
<text x="66" y="73" font-size="13" fill="#475569">平台层承接公共能力，数据向上、指令向下，安全贯穿四层</text>
<line x1="32" y1="96" x2="1168" y2="96" stroke="#D7DEE8"/>
<rect x="32" y="118" width="1136" height="452" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
<!-- security rail -->
<rect x="60" y="148" width="142" height="374" rx="14" fill="#FFF" stroke="#DC2626" stroke-width="1.7" stroke-dasharray="8 5"/>
<rect x="78" y="164" width="106" height="30" rx="8" fill="#FEF2F2"/>
<text x="131" y="184" text-anchor="middle" font-size="14" font-weight="750" fill="#DC2626">安全贯穿</text>
<text x="131" y="224" text-anchor="middle" font-size="12" fill="#475569">身份认证</text>
<text x="131" y="254" text-anchor="middle" font-size="12" fill="#475569">通信加密</text>
<text x="131" y="284" text-anchor="middle" font-size="12" fill="#475569">访问控制</text>
<text x="131" y="314" text-anchor="middle" font-size="12" fill="#475569">数据保护</text>
<text x="131" y="344" text-anchor="middle" font-size="12" fill="#475569">审计追踪</text>
<text x="131" y="374" text-anchor="middle" font-size="12" fill="#475569">故障隔离</text>
<text x="131" y="474" text-anchor="middle" font-size="11" fill="#DC2626">横向能力</text>
<!-- layers -->
<g>
  <rect x="250" y="142" width="724" height="76" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="250" y="242" width="724" height="76" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="250" y="342" width="724" height="76" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="250" y="442" width="724" height="76" rx="12" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="612" y="173" text-anchor="middle" font-size="19" font-weight="750" fill="#0F172A">应用层</text>
  <text x="612" y="198" text-anchor="middle" font-size="13" fill="#475569">仪表盘 · App · MES / 业务后端</text>
  <text x="612" y="273" text-anchor="middle" font-size="19" font-weight="750" fill="#0F172A">平台层</text>
  <text x="612" y="298" text-anchor="middle" font-size="13" fill="#475569">设备管理 · 数据存储 · API · 规则引擎</text>
  <rect x="796" y="255" width="156" height="28" rx="7" fill="#DBEAFE"/>
  <text x="874" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB">公共能力层</text>
  <text x="612" y="373" text-anchor="middle" font-size="19" font-weight="750" fill="#0F172A">网络层</text>
  <text x="612" y="398" text-anchor="middle" font-size="13" fill="#475569">MQTT · CoAP · LoRaWAN · 5G / Wi-Fi</text>
  <text x="612" y="473" text-anchor="middle" font-size="19" font-weight="750" fill="#0F172A">感知层</text>
  <text x="612" y="498" text-anchor="middle" font-size="13" fill="#475569">传感器 · RFID · 摄像头 · 执行器</text>
</g>
<!-- data arrows -->
<g stroke="#2563EB" stroke-width="2.5" fill="none" marker-end="url(#blueArrow)">
  <line x1="612" y1="442" x2="612" y2="423"/>
  <line x1="612" y1="342" x2="612" y2="323"/>
  <line x1="612" y1="242" x2="612" y2="223"/>
</g>
<g font-size="12" font-weight="700" fill="#2563EB">
  <text x="628" y="437">数据上行</text><text x="628" y="337">数据上行</text><text x="628" y="237">数据上行</text>
</g>
<!-- command path -->
<path d="M974 180H1060V480H974" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#tealArrow)"/>
<rect x="1022" y="311" width="76" height="27" rx="7" fill="#ECFDF5"/>
<text x="1060" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">指令下行</text>
<!-- legend -->
<line x1="250" y1="548" x2="276" y2="548" stroke="#2563EB" stroke-width="2.5" marker-end="url(#blueArrow)"/><text x="286" y="552" font-size="11" fill="#475569">数据流</text>
<line x1="354" y1="548" x2="380" y2="548" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#tealArrow)"/><text x="390" y="552" font-size="11" fill="#475569">指令流</text>
<text x="600" y="552" text-anchor="middle" font-size="11" fill="#475569">图2-1 经典四层是理解物联网系统职责边界的起点。</text>
</svg>
</main>
</body>
</html>
