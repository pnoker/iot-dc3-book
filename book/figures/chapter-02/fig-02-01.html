<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图2-1 物联网经典四层参考架构</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图2-1 物联网经典四层参考架构</title>
  <desc id="desc">物联网经典四层参考架构由感知层、网络层、平台层和应用层组成，数据向上流动、指令向下执行，安全能力贯穿四层。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

    <defs>
      <marker id="mk-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#2563EB"/></marker>
      <marker id="mk-gray" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#64748B"/></marker>
      <marker id="mk-teal" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#0F766E"/></marker>
      <marker id="mk-orange" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#F97316"/></marker>
      <marker id="mk-red" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#DC2626"/></marker>
    </defs>

    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图2-1 物联网经典四层参考架构</text>
    <text x="88" y="64" font-size="12" fill="#64748B">平台层承接公共能力，数据向上、指令向下，安全贯穿四层</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 安全贯穿层（左侧竖条） -->
    <rect x="150" y="150" width="190" height="621" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" stroke-dasharray="10 6"/>
    <text x="245" y="200" font-size="26" font-weight="700" fill="#DC2626" text-anchor="middle">安全贯穿</text>
    <text x="245" y="228" font-size="16" fill="#DC2626" text-anchor="middle">鉴权 · 审计</text>
    <line x1="190" y1="246" x2="300" y2="246" stroke="#FECACA" stroke-width="1"/>
    <text x="245" y="278" font-size="16" fill="#475569" text-anchor="middle">身份认证</text>
    <text x="245" y="310" font-size="16" fill="#475569" text-anchor="middle">访问控制</text>
    <text x="245" y="342" font-size="16" fill="#475569" text-anchor="middle">通信加密</text>
    <text x="245" y="374" font-size="16" fill="#475569" text-anchor="middle">审计追踪</text>
    <text x="245" y="700" font-size="15" fill="#DC2626" text-anchor="middle">横向贯穿能力</text>

    <!-- 四层主体（自下而上：感知层、网络层、平台层、应用层） -->
    <rect x="560" y="150" width="800" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="960" y="206" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">应用层</text>
    <text x="960" y="235" font-size="17" fill="#475569" text-anchor="middle">MES、能源管理、业务可视化</text>

    <rect x="560" y="317" width="800" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="960" y="373" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">平台层</text>
    <text x="960" y="402" font-size="17" fill="#475569" text-anchor="middle">设备管理、数据存储、规则引擎</text>
    <rect x="1210" y="330" width="150" height="34" rx="8" fill="#DBEAFE"/>
    <text x="1285" y="353" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">公共能力层</text>

    <rect x="560" y="484" width="800" height="120" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="960" y="540" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">网络层</text>
    <text x="960" y="569" font-size="17" fill="#475569" text-anchor="middle">Wi-Fi / LoRaWAN / 5G</text>

    <rect x="560" y="651" width="800" height="120" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <text x="960" y="707" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">感知层</text>
    <text x="960" y="736" font-size="17" fill="#475569" text-anchor="middle">传感器、RFID、摄像头、执行器</text>

    <!-- 数据上行（实线，蓝色） -->
    <g stroke="#2563EB" stroke-width="2.2" fill="none" marker-end="url(#mk-blue)">
      <line x1="820" y1="651" x2="820" y2="604"/>
      <line x1="820" y1="484" x2="820" y2="437"/>
      <line x1="820" y1="317" x2="820" y2="270"/>
    </g>

    <!-- 指令下行（虚线，灰色） -->
    <g stroke="#64748B" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#mk-gray)">
      <line x1="1100" y1="270" x2="1100" y2="317"/>
      <line x1="1100" y1="437" x2="1100" y2="484"/>
      <line x1="1100" y1="604" x2="1100" y2="651"/>
    </g>

    <text x="780" y="464" font-size="17" font-weight="700" fill="#2563EB" text-anchor="end">数据上行</text>
    <text x="1120" y="464" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">指令下行</text>

    <!-- 图例 -->
    <rect x="190" y="806" width="30" height="22" rx="5" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="230" y="822" font-size="16" fill="#475569">感知层</text>
    <rect x="430" y="806" width="30" height="22" rx="5" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="470" y="822" font-size="16" fill="#475569">网络层</text>
    <rect x="670" y="806" width="30" height="22" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="710" y="822" font-size="16" fill="#475569">平台层</text>
    <rect x="910" y="806" width="30" height="22" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
    <text x="950" y="822" font-size="16" fill="#475569">应用层</text>
    <rect x="1150" y="806" width="30" height="22" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="1190" y="822" font-size="16" fill="#475569">安全贯穿</text>

    <line x1="190" y1="856" x2="250" y2="856" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <text x="262" y="861" font-size="16" fill="#475569">实线 = 数据上行</text>
    <line x1="520" y1="856" x2="580" y2="856" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>
    <text x="592" y="861" font-size="16" fill="#475569">虚线 = 指令下行</text>

    <!-- 图注 -->
    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图2-1 平台层是相较早期三层模型新增的公共能力层；数据向上、指令向下的单向流向，决定了经典架构的结构性短板。</text>
  </svg>
</svg>
  </main>
</body>
</html>
