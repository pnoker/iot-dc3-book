</g>

  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>

  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图2-1 物联网经典四层参考架构。平台层相比早期三层模型是新增层，将设备管理、数据存储、规则引擎等公共能力从应用层剥离。数据向上、指令向下的单向流向，决定了经典架构在处理复杂决策时存在结构性短板。</text>
