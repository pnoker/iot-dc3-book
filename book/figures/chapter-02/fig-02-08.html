<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图2-8 认证流程时序图：用户登录到设备列表访问</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .page svg { width: 100%; height: auto; display: block; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">图2-8 认证流程时序图：用户登录到设备列表访问</title>
  <desc id="desc">展示Auth中心如何与Gateway、Manager协作，完成用户登录、令牌颁发、请求校验和权限判定的完整过程。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0F766E"/>
    </marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>

  <!-- 标题区 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图2-8 认证流程时序图：用户登录到设备列表访问</text>
  <text x="82" y="70" fill="#64748B" font-size="12">展示 Auth 中心如何与 Gateway、Manager 协作，完成用户登录、令牌颁发、请求校验和权限判定的完整过程。</text>
  <rect x="1606" y="28" width="140" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1676" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">SEQUENCE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>

  <g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">

    <!-- 阶段标签（左侧旋转） -->
    <text x="95" y="335" fill="#94A3B8" font-size="10" font-weight="600" text-anchor="middle" transform="rotate(-90, 95, 335)">阶段一 · 登录换令牌</text>
    <text x="95" y="600" fill="#94A3B8" font-size="10" font-weight="600" text-anchor="middle" transform="rotate(-90, 95, 600)">阶段二 · 验证与业务转发</text>

    <!-- 参与者卡片 -->
    <rect x="170" y="125" width="200" height="70" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="270" y="156" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">用户 / 浏览器</text>
    <text x="270" y="178" font-size="11" fill="#64748B" text-anchor="middle">External Client</text>

    <rect x="620" y="125" width="200" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="720" y="156" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Gateway</text>
    <text x="720" y="178" font-size="11" fill="#64748B" text-anchor="middle">dc3-gateway:8000</text>

    <rect x="1070" y="125" width="200" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1170" y="156" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Auth 中心</text>
    <text x="1170" y="178" font-size="11" fill="#64748B" text-anchor="middle">dc3-center-auth:9000</text>

    <rect x="1460" y="125" width="200" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1560" y="156" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Manager 中心</text>
    <text x="1560" y="178" font-size="11" fill="#64748B" text-anchor="middle">dc3-center-manager:9001</text>

    <!-- 生命线（虚线） -->
    <line x1="270" y1="195" x2="270" y2="790" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="720" y1="195" x2="720" y2="790" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="1170" y1="195" x2="1170" y2="790" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="1560" y1="195" x2="1560" y2="790" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- 激活条 -->
    <rect x="266" y="250" width="8" height="160" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.8" opacity="0.55"/>
    <rect x="266" y="450" width="8" height="320" rx="1" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.8" opacity="0.55"/>
    <rect x="716" y="250" width="8" height="520" rx="1" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8" opacity="0.55"/>
    <rect x="1166" y="290" width="8" height="80" rx="1" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8" opacity="0.55"/>
    <rect x="1166" y="490" width="8" height="120" rx="1" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8" opacity="0.55"/>
    <rect x="1556" y="650" width="8" height="80" rx="1" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8" opacity="0.55"/>

    <!-- 阶段分隔线 -->
    <line x1="160" y1="430" x2="1680" y2="430" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6,4"/>

    <!-- Step 1: user → gateway, POST /auth/login, solid blue -->
    <text x="495" y="242" fill="#0F172A" font-size="12" text-anchor="middle">1. POST /auth/login</text>
    <line x1="270" y1="250" x2="720" y2="250" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

    <!-- Step 2: gateway → auth, 透传认证请求, solid blue -->
    <text x="945" y="282" fill="#0F172A" font-size="12" text-anchor="middle">2. 透传认证请求</text>
    <line x1="720" y1="290" x2="1170" y2="290" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

    <!-- Step 3: auth → auth, 核对密码哈希生成JWT, dashed teal (self-feedback) -->
    <path d="M 1174,330 L 1212,330 L 1212,348 L 1178,348" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-teal)"/>
    <text x="1220" y="342" fill="#0F172A" font-size="12" text-anchor="start">3. 核对密码哈希，生成 JWT</text>

    <!-- Step 4: auth → gateway, 返回 access_token + refresh_token, dashed teal -->
    <text x="945" y="362" fill="#0F172A" font-size="12" text-anchor="middle">4. 返回 access_token + refresh_token</text>
    <line x1="1170" y1="370" x2="720" y2="370" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-teal)"/>

    <!-- Step 5: gateway → user, 返回 JWT 令牌, dashed teal -->
    <text x="495" y="402" fill="#0F172A" font-size="12" text-anchor="middle">5. 返回 JWT 令牌</text>
    <line x1="720" y1="410" x2="270" y2="410" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-teal)"/>

    <!-- Step 6: user → gateway, GET /manager/device/list, solid blue -->
    <text x="495" y="442" fill="#0F172A" font-size="12" text-anchor="middle">6. GET /manager/device/list (Bearer Token)</text>
    <line x1="270" y1="450" x2="720" y2="450" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

    <!-- Step 7: gateway → auth, 验证 Token 有效性, solid blue -->
    <text x="945" y="482" fill="#0F172A" font-size="12" text-anchor="middle">7. 验证 Token 有效性</text>
    <line x1="720" y1="490" x2="1170" y2="490" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

    <!-- Step 8: auth → gateway, 令牌有效返回角色+租户, dashed teal -->
    <text x="945" y="522" fill="#0F172A" font-size="12" text-anchor="middle">8. 令牌有效，返回角色 + 租户</text>
    <line x1="1170" y1="530" x2="720" y2="530" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-teal)"/>

    <!-- Step 9: gateway → auth, 校验 device:read 权限+租户, solid blue -->
    <text x="945" y="562" fill="#0F172A" font-size="12" text-anchor="middle">9. 校验 device:read 权限 + 租户</text>
    <line x1="720" y1="570" x2="1170" y2="570" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

    <!-- Step 10: auth → gateway, 权限校验通过, dashed teal -->
    <text x="945" y="602" fill="#0F172A" font-size="12" text-anchor="middle">10. 权限校验通过</text>
    <line x1="1170" y1="610" x2="720" y2="610" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-teal)"/>

    <!-- Step 11: gateway → manager, 转发请求, solid blue -->
    <text x="1140" y="642" fill="#0F172A" font-size="12" text-anchor="middle">11. 转发请求（携带用户上下文）</text>
    <line x1="720" y1="650" x2="1560" y2="650" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

    <!-- Step 12: manager → manager, 查询设备列表, dashed teal (self-feedback) -->
    <path d="M 1564,690 L 1602,690 L 1602,708 L 1568,708" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-teal)"/>
    <text x="1610" y="702" fill="#0F172A" font-size="12" text-anchor="start">12. 查询该租户下的设备列表</text>

    <!-- Step 13: manager → gateway, 返回设备列表 JSON, dashed teal -->
    <text x="1140" y="722" fill="#0F172A" font-size="12" text-anchor="middle">13. 返回设备列表 JSON</text>
    <line x1="1560" y1="730" x2="720" y2="730" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-teal)"/>

    <!-- Step 14: gateway → user, 200 OK 设备列表, dashed teal -->
    <text x="495" y="762" fill="#0F172A" font-size="12" text-anchor="middle">14. 200 OK, 设备列表</text>
    <line x1="720" y1="770" x2="270" y2="770" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-teal)"/>

  </g>

  <!-- 底部分隔线 -->
  <line x1="64" y1="795" x2="1736" y2="795" stroke="#E2E8F0"/>

  <!-- 图例 -->
  <g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">
    <line x1="80" y1="818" x2="120" y2="818" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
    <text x="130" y="822" fill="#64748B" font-size="10" font-weight="600">实线箭头 = 请求（Request）</text>

    <line x1="380" y1="818" x2="420" y2="818" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-teal)"/>
    <text x="430" y="822" fill="#64748B" font-size="10" font-weight="600">虚线箭头 = 响应 / 内部操作</text>

    <rect x="680" y="812" width="16" height="12" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="704" y="822" fill="#64748B" font-size="10" font-weight="600">蓝色矩形 = 平台微服务</text>

    <rect x="940" y="812" width="16" height="12" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="964" y="822" fill="#64748B" font-size="10" font-weight="600">灰色矩形 = 外部参与者</text>

    <line x1="1210" y1="810" x2="1210" y2="826" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="1222" y="822" fill="#64748B" font-size="10" font-weight="600">虚线竖线 = 参与者生命线</text>
  </g>

  <!-- 图注 -->
  <text x="900" y="860" fill="#94A3B8" font-size="10" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif" font-weight="600" text-anchor="middle">图2-3-3 用户登录并访问设备列表的完整认证时序。Gateway 负责拦截和路由，Auth 中心统一处理所有认证和授权判断，Manager 只基于用户上下文查询数据。图中展示了两层协作：第一步登录换取令牌，第二步验证令牌和权限并转发业务请求。</text>

</svg>
    <section class="meta" style="display:none">
      <div class="card"><div class="label">图表类型</div><div class="value">sequence</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">四列自上而下时序图，参与者从左到右：用户/浏览器、Gateway、Auth 中心、Manager 中心。14 步消息纵向均匀排列（间距 40px），生命线贯穿，主链路高亮，两阶段（登录换令牌 / 验证与业务转发）以虚线分隔。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
