<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图2-8 认证流程时序图：用户登录到设备列表访问</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图2-8 认证流程时序图：用户登录到设备列表访问</title>
  <desc id="desc">用户经 Gateway 调用 Auth 换取平台 Token，再携带项目约定的认证头请求设备列表；Gateway 执行入口策略，Manager 仍校验资源边界。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

    <defs>
      <marker id="mk-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#2563EB"/></marker>
      <marker id="mk-teal" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#0F766E"/></marker>
      <marker id="mk-gray" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#64748B"/></marker>
    </defs>

    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图2-8 认证流程时序图：用户登录到设备列表访问</text>
    <text x="88" y="64" font-size="12" fill="#64748B">认证、入口过滤与资源授权是三个边界</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 生命线（先画，在最底层） -->
    <line x1="280" y1="240" x2="280" y2="845" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="760" y1="240" x2="760" y2="845" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="1200" y1="240" x2="1200" y2="845" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="1560" y1="240" x2="1560" y2="845" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>

    <!-- 头部参与者 -->
    <rect x="155" y="150" width="250" height="90" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="280" y="194" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">用户/浏览器</text>
    <text x="280" y="218" font-size="15" fill="#475569" text-anchor="middle">客户端</text>

    <rect x="635" y="150" width="250" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <text x="760" y="194" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Gateway</text>
    <text x="760" y="218" font-size="15" fill="#475569" text-anchor="middle">dc3-gateway:8000</text>

    <rect x="1075" y="150" width="250" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="1200" y="194" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Auth 中心</text>
    <text x="1200" y="218" font-size="15" fill="#475569" text-anchor="middle">dc3-center-auth:9000</text>

    <rect x="1435" y="150" width="250" height="90" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="1560" y="194" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Manager 中心</text>
    <text x="1560" y="218" font-size="15" fill="#475569" text-anchor="middle">dc3-center-manager</text>

    <!-- 请求（实线，蓝） -->
    <g stroke="#2563EB" stroke-width="2.2" fill="none" marker-end="url(#mk-blue)">
      <line x1="280" y1="270" x2="760" y2="270"/>
      <line x1="760" y1="310" x2="1200" y2="310"/>
      <line x1="280" y1="475" x2="760" y2="475"/>
      <line x1="760" y1="515" x2="1200" y2="515"/>
      <line x1="760" y1="595" x2="1200" y2="595"/>
      <line x1="760" y1="675" x2="1560" y2="675"/>
    </g>

    <!-- 响应（虚线，青绿） -->
    <g stroke="#0F766E" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#mk-teal)">
      <line x1="1200" y1="390" x2="760" y2="390"/>
      <line x1="760" y1="430" x2="280" y2="430"/>
      <line x1="1200" y1="555" x2="760" y2="555"/>
      <line x1="1200" y1="635" x2="760" y2="635"/>
      <line x1="1560" y1="755" x2="760" y2="755"/>
      <line x1="760" y1="795" x2="280" y2="795"/>
    </g>

    <!-- 内部操作（自循环，灰虚线框） -->
    <rect x="1225" y="342" width="200" height="32" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="1325" y="362" font-size="14" fill="#475569" text-anchor="middle">3 核对凭证并签发 Token</text>
    <line x1="1200" y1="358" x2="1225" y2="358" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#mk-gray)"/>

    <rect x="1585" y="707" width="200" height="32" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="1685" y="727" font-size="14" fill="#475569" text-anchor="middle">12 校验资源并查询</text>
    <line x1="1560" y1="723" x2="1585" y2="723" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#mk-gray)"/>

    <!-- 消息标签 -->
    <text x="520" y="261" font-size="14" fill="#475569" text-anchor="middle">1 登录请求</text>
    <text x="980" y="301" font-size="14" fill="#475569" text-anchor="middle">2 透传认证</text>
    <text x="980" y="381" font-size="14" fill="#475569" text-anchor="middle">4 返回令牌</text>
    <text x="520" y="421" font-size="14" fill="#475569" text-anchor="middle">5 返回 Token</text>
    <text x="520" y="466" font-size="14" fill="#475569" text-anchor="middle">6 请求设备列表</text>
    <text x="980" y="506" font-size="14" fill="#475569" text-anchor="middle">7 验证 Token</text>
    <text x="980" y="546" font-size="14" fill="#475569" text-anchor="middle">8 返回角色与租户</text>
    <text x="980" y="586" font-size="14" fill="#475569" text-anchor="middle">9 执行入口策略</text>
    <text x="980" y="626" font-size="14" fill="#475569" text-anchor="middle">10 入口允许</text>
    <text x="1160" y="666" font-size="14" fill="#475569" text-anchor="middle">11 转发（带用户上下文）</text>
    <text x="1160" y="746" font-size="14" fill="#475569" text-anchor="middle">13 返回设备列表</text>
    <text x="520" y="786" font-size="14" fill="#475569" text-anchor="middle">14 200 OK</text>

    <!-- 图例 -->
    <line x1="150" y1="872" x2="208" y2="872" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <text x="220" y="877" font-size="16" fill="#475569">请求（Request）</text>
    <line x1="430" y1="872" x2="488" y2="872" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-teal)"/>
    <text x="500" y="877" font-size="16" fill="#475569">响应（Response）</text>
    <rect x="700" y="861" width="30" height="22" rx="5" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="742" y="877" font-size="16" fill="#475569">内部操作（自循环）</text>

    <!-- 图注 -->
    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图2-8 Auth 建立平台主体，Gateway 执行入口策略，Manager 仍按租户与资源语义授权查询。</text>
  </svg>
</svg>
  </main>
</body>
</html>
