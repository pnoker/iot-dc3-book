<!doctype html>

  <title>图2-14 学习路径三台阶与自检节点</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }

<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图2-14 学习路径三台阶与自检节点</title>
  <desc id="desc">三个递进学习阶段以自检节点为关卡：端到端协议链路、规则与 AI 边界、全链路部署分析，通过后进入下一阶段。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F97316"/></marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#D97706"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图2-14 学习路径三台阶与自检节点</text>
  <text x="88" y="64" font-size="12" fill="#64748B">三台阶前后依赖，自检节点是阶段跳转的阀门</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 入口 ===== -->
  <ellipse cx="120" cy="295" rx="70" ry="44" fill="#F8FAFC" stroke="#475569" stroke-width="1.8"/>
  <text x="120" y="290" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">学习</text>
  <text x="120" y="308" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">起点</text>

  <!-- ===== 第一阶段 ===== -->
  <rect x="240" y="250" width="380" height="92" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="430" y="282" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">第一台阶：经典四层底子</text>
  <text x="430" y="308" font-size="12" fill="#475569" text-anchor="middle">Modbus · OPC UA · MQTT · 时序数据库</text>
  <text x="430" y="330" font-size="11" fill="#94A3B8" text-anchor="middle">感知 → 网络 → 平台 → 应用</text>

  <!-- 自检 1 -->
  <rect x="240" y="440" width="380" height="84" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <rect x="240" y="440" width="8" height="84" rx="4" fill="#D97706"/>
  <text x="262" y="472" font-size="15" font-weight="700" fill="#0F172A">自检 ① 端到端协议链路</text>
  <text x="262" y="496" font-size="12" fill="#475569">传感器 → 存储全路径是否跑通</text>

  <!-- ===== 第二阶段 ===== -->
  <rect x="710" y="250" width="380" height="92" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
  <text x="900" y="282" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">第二台阶：智能层机制</text>
  <text x="900" y="308" font-size="12" fill="#475569" text-anchor="middle">Tool Calling · Spring AI · MCP</text>
  <text x="900" y="330" font-size="11" fill="#94A3B8" text-anchor="middle">理解 · 决策 · 受控工具调用</text>

  <!-- 自检 2 -->
  <rect x="710" y="440" width="380" height="84" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <rect x="710" y="440" width="8" height="84" rx="4" fill="#D97706"/>
  <text x="732" y="472" font-size="15" font-weight="700" fill="#0F172A">自检 ② 规则 vs AI 边界</text>
  <text x="732" y="496" font-size="12" fill="#475569">确定性逻辑与模型职责是否清晰</text>

  <!-- ===== 第三阶段 ===== -->
  <rect x="1180" y="250" width="380" height="92" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.8"/>
  <text x="1370" y="282" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">第三台阶：工程落地</text>
  <text x="1370" y="308" font-size="12" fill="#475569" text-anchor="middle">DC3 · ThingsBoard · StreamPipes</text>
  <text x="1370" y="330" font-size="11" fill="#94A3B8" text-anchor="middle">系统切分 · 部署 · 治理</text>

  <!-- 自检 3 -->
  <rect x="1180" y="440" width="380" height="84" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <rect x="1180" y="440" width="8" height="84" rx="4" fill="#D97706"/>
  <text x="1202" y="472" font-size="15" font-weight="700" fill="#0F172A">自检 ③ 全链路部署</text>
  <text x="1202" y="496" font-size="12" fill="#475569">切分与部署分析是否完整</text>

  <!-- ===== 出口 ===== -->
  <ellipse cx="1640" cy="295" rx="70" ry="44" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.8"/>
  <text x="1640" y="290" font-size="14" font-weight="700" fill="#0F766E" text-anchor="middle">工程</text>
  <text x="1640" y="308" font-size="12" font-weight="700" fill="#0F766E" text-anchor="middle">落地</text>

  <!-- ===== 流向连线（锯齿递进） ===== -->
  <!-- 入口 → 阶段1 -->
  <line x1="190" y1="295" x2="238" y2="295" stroke="#475569" stroke-width="2" marker-end="url(#ah-gray)"/>
  <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
  <!-- 阶段1 → 自检1 -->
  <line x1="430" y1="342" x2="430" y2="438" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="446" y="396" font-size="11" font-weight="700" fill="#2563EB">通过</text>
  <!-- 自检1 → 阶段2 -->
  <path d="M620 482 H660 V295 H708" stroke="#D97706" stroke-width="2" fill="none" marker-end="url(#ah-amber)"/>
  <!-- 阶段2 → 自检2 -->
  <line x1="900" y1="342" x2="900" y2="438" stroke="#F97316" stroke-width="2" marker-end="url(#ah-orange)"/>
  <text x="916" y="396" font-size="11" font-weight="700" fill="#D97706">通过</text>
  <!-- 自检2 → 阶段3 -->
  <path d="M1090 482 H1130 V295 H1178" stroke="#D97706" stroke-width="2" fill="none" marker-end="url(#ah-amber)"/>
  <!-- 阶段3 → 自检3 -->
  <line x1="1370" y1="342" x2="1370" y2="438" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
  <text x="1386" y="396" font-size="11" font-weight="700" fill="#D97706">通过</text>
  <!-- 自检3 → 出口 -->
  <path d="M1560 482 H1580 V295 H1570" stroke="#D97706" stroke-width="2" fill="none" marker-end="url(#ah-amber)"/>

  <!-- ===== 底部依赖说明 ===== -->
  <rect x="240" y="590" width="1320" height="110" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="900" y="624" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">三台阶前后依赖</text>
  <text x="900" y="652" font-size="12" fill="#475569" text-anchor="middle">第一台阶验收基础数据路径，第二台阶验收规则与 AI 边界，第三台阶完成系统切分与部署分析</text>
  <text x="900" y="678" font-size="12" fill="#475569" text-anchor="middle">必须通过上一台阶的自检才能进入下一阶段，防止基础不牢直接上手工程造成理解断层</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图2-14 三个台阶以自检为关卡，自检内容依次为端到端协议链路、规则 vs AI 边界、全链路部署分析，通过后方可进入下一阶段。</text>
