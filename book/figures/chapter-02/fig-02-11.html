<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图2-11 Data中心数据流示意</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图2-11 Data中心数据流示意</title>
  <desc id="desc">现场设备数据经 Driver 归一后进入消息端口，Data 消费并经时序存储端口持久化；图中的 RabbitMQ 与 PostgreSQL 表示默认适配器。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

    <defs>
      <marker id="mk-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#2563EB"/></marker>
      <marker id="mk-gray" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#64748B"/></marker>
    </defs>

    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图2-11 Data中心数据流示意</text>
    <text x="88" y="64" font-size="12" fill="#64748B">Driver 发布，Data 消费；Gateway 不在遥测主链</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 三个域边界 -->
    <rect x="60" y="170" width="580" height="450" rx="12" fill="none" stroke="#0F766E" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="84" y="202" font-size="18" font-weight="700" fill="#0F766E">设备与边缘域</text>
    <rect x="660" y="170" width="280" height="450" rx="12" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="684" y="202" font-size="18" font-weight="700" fill="#2563EB">消息与平台服务域</text>
    <rect x="960" y="170" width="830" height="590" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="8 5"/>
    <text x="984" y="202" font-size="18" font-weight="700" fill="#475569">数据资产域</text>

    <!-- 连线：先画 -->
    <line x1="310" y1="500" x2="390" y2="500" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="590" y1="500" x2="690" y2="500" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="890" y1="500" x2="990" y2="500" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="1190" y1="500" x2="1260" y2="500" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="1360" y1="560" x2="1360" y2="620" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>
    <line x1="1460" y1="500" x2="1560" y2="500" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>

    <!-- 连线标签 -->
    <text x="350" y="486" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">原始信号</text>
    <text x="640" y="486" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">发布位号值</text>
    <text x="940" y="486" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">消费消息</text>
    <text x="1225" y="486" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">持久化</text>
    <text x="1374" y="594" font-size="14" font-weight="700" fill="#64748B">归档扩展</text>
    <text x="1510" y="486" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">受权查询 / 订阅</text>

    <!-- 节点 -->
    <rect x="110" y="440" width="200" height="120" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <text x="210" y="492" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">现场设备</text>
    <text x="210" y="520" font-size="15" fill="#475569" text-anchor="middle">PLC · 电表 · 传感器</text>

    <rect x="390" y="440" width="200" height="120" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <text x="490" y="492" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">驱动模块</text>
    <text x="490" y="520" font-size="15" fill="#475569" text-anchor="middle">南向协议驱动</text>

    <rect x="690" y="440" width="200" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="790" y="492" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">RabbitMQ</text>
    <text x="790" y="520" font-size="15" fill="#475569" text-anchor="middle">位号值 Exchange</text>

    <rect x="990" y="440" width="200" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1090" y="492" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Data 中心</text>
    <text x="1090" y="520" font-size="15" fill="#475569" text-anchor="middle">消费、持久化与查询</text>

    <rect x="1260" y="440" width="200" height="120" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="1360" y="492" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">PostgreSQL</text>
    <text x="1360" y="520" font-size="15" fill="#475569" text-anchor="middle">当前默认存储</text>
    <line x1="1300" y1="470" x2="1300" y2="545" stroke="#F97316" stroke-width="2"/>
    <line x1="1360" y1="470" x2="1360" y2="545" stroke="#F97316" stroke-width="2"/>
    <line x1="1420" y1="470" x2="1420" y2="545" stroke="#F97316" stroke-width="2"/>

    <rect x="1260" y="620" width="200" height="100" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="1360" y="664" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">对象 / 冷存储</text>
    <text x="1360" y="692" font-size="15" fill="#475569" text-anchor="middle">可选归档扩展</text>

    <rect x="1560" y="440" width="200" height="120" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="1660" y="492" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">授权消费者</text>
    <text x="1660" y="520" font-size="15" fill="#475569" text-anchor="middle">API / WebSocket / Tool</text>

    <!-- 图例 -->
    <rect x="150" y="808" width="30" height="22" rx="5" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
    <text x="190" y="824" font-size="16" fill="#475569">设备与边缘</text>
    <rect x="390" y="808" width="30" height="22" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="430" y="824" font-size="16" fill="#475569">平台服务</text>
    <rect x="590" y="808" width="30" height="22" rx="5" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="630" y="824" font-size="16" fill="#475569">消息队列（缓冲）</text>
    <rect x="880" y="808" width="30" height="22" rx="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="920" y="824" font-size="16" fill="#475569">存储 / 订阅方</text>

    <line x1="1140" y1="819" x2="1198" y2="819" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <text x="1210" y="824" font-size="16" fill="#475569">同步 / 即时调用</text>
    <line x1="1420" y1="819" x2="1478" y2="819" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>
    <text x="1490" y="824" font-size="16" fill="#475569">异步 / 事件驱动</text>

    <!-- 图注 -->
    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图2-11 默认链路使用 RabbitMQ 与 TimescaleDB；消费者只通过受控出口访问。</text>
  </svg>
</svg>
  </main>
</body>
</html>
