<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图2-13 智能层引入决策流程</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图2-13 智能层引入决策流程</title>
  <desc id="desc">通过规则穷尽性与执行路径可编程性两条关键轴判断是否引入智能层，规则可穷举且路径可编程时优先用规则，否则按需接入智能层。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

    <defs>
      <marker id="mk-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#2563EB"/></marker>
      <marker id="mk-green" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#16A34A"/></marker>
      <marker id="mk-red" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#DC2626"/></marker>
      <marker id="mk-gray" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#64748B"/></marker>
    </defs>

    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图2-13 智能层引入决策流程</text>
    <text x="88" y="64" font-size="12" fill="#64748B">规则能处理的优先用规则，复杂上下文再引入智能层</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 连线：先画 -->
    <path d="M900 270 V330 H600 V370" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <path d="M900 270 V330 H1200 V370" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="440" y1="470" x2="440" y2="600" stroke="#16A34A" stroke-width="2.2" marker-end="url(#mk-green)"/>
    <line x1="760" y1="470" x2="760" y2="600" stroke="#DC2626" stroke-width="2.2" marker-end="url(#mk-red)"/>
    <line x1="1040" y1="470" x2="1040" y2="600" stroke="#16A34A" stroke-width="2.2" marker-end="url(#mk-green)"/>
    <line x1="1360" y1="470" x2="1360" y2="600" stroke="#DC2626" stroke-width="2.2" marker-end="url(#mk-red)"/>
    <path d="M430 680 V730 H760 V780" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>
    <path d="M770 680 V750 H860 V780" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>
    <path d="M1030 680 V750 H960 V780" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>
    <path d="M1370 680 V730 H1060 V780" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>

    <!-- 是/否 标签 -->
    <text x="452" y="540" font-size="16" font-weight="700" fill="#16A34A">是</text>
    <text x="772" y="540" font-size="16" font-weight="700" fill="#DC2626">否</text>
    <text x="1052" y="540" font-size="16" font-weight="700" fill="#16A34A">是</text>
    <text x="1372" y="540" font-size="16" font-weight="700" fill="#DC2626">否</text>

    <!-- 决策菱形 -->
    <polygon points="900,170 1060,220 900,270 740,220" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="900" y="218" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">需要智能层？</text>
    <text x="900" y="243" font-size="12" fill="#475569" text-anchor="middle">规则复杂度与上下文依赖</text>

    <polygon points="600,370 760,420 600,470 440,420" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="600" y="418" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">规则能否穷尽？</text>
    <text x="600" y="443" font-size="12" fill="#475569" text-anchor="middle">业务逻辑是否固定</text>

    <polygon points="1200,370 1360,420 1200,470 1040,420" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1200" y="418" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">执行路径可编程？</text>
    <text x="1200" y="443" font-size="12" fill="#475569" text-anchor="middle">逻辑能否固化为代码</text>

    <!-- 结果节点 -->
    <rect x="330" y="600" width="200" height="80" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="430" y="634" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">规则引擎即可</text>
    <text x="430" y="660" font-size="14" fill="#475569" text-anchor="middle">固定逻辑</text>

    <rect x="670" y="600" width="200" height="80" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="770" y="634" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">需接入智能层</text>
    <text x="770" y="660" font-size="14" fill="#475569" text-anchor="middle">上下文依赖</text>

    <rect x="930" y="600" width="200" height="80" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <text x="1030" y="634" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">规则引擎即可</text>
    <text x="1030" y="660" font-size="14" fill="#475569" text-anchor="middle">可编程路径</text>

    <rect x="1270" y="600" width="200" height="80" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="1370" y="634" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">需接入智能层</text>
    <text x="1370" y="660" font-size="14" fill="#475569" text-anchor="middle">无法预定义</text>

    <!-- 汇聚节点 -->
    <rect x="700" y="780" width="400" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="900" y="814" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">按需接入智能层</text>
    <text x="900" y="840" font-size="14" fill="#475569" text-anchor="middle">模块独立部署</text>

    <!-- 图例 -->
    <polygon points="150,872 180,862 210,872 180,882" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="222" y="877" font-size="16" fill="#475569">决策节点</text>
    <rect x="360" y="861" width="30" height="22" rx="5" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
    <text x="400" y="877" font-size="16" fill="#475569">规则引擎适用</text>
    <rect x="590" y="861" width="30" height="22" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
    <text x="630" y="877" font-size="16" fill="#475569">需引入智能层</text>

    <line x1="810" y1="872" x2="868" y2="872" stroke="#16A34A" stroke-width="2.2" marker-end="url(#mk-green)"/>
    <text x="880" y="877" font-size="16" fill="#475569">是（规则可用）</text>
    <line x1="1060" y1="872" x2="1118" y2="872" stroke="#DC2626" stroke-width="2.2" marker-end="url(#mk-red)"/>
    <text x="1130" y="877" font-size="16" fill="#475569">否（需要 AI）</text>
    <line x1="1310" y1="872" x2="1368" y2="872" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-gray)"/>
    <text x="1380" y="877" font-size="16" fill="#475569">汇总（按需接入）</text>

    <!-- 图注 -->
    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图2-13 通过规则穷尽性与执行路径可编程性两条关键轴判断是否引入 AI，避免为新技术而硬套技术。</text>
  </svg>
</svg>
  </main>
</body>
</html>
