<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图2-13 智能层引入决策流程</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">图2-13 智能层引入决策流程</title>
  <desc id="desc">帮助工程设计人员判断项目是否需要引入智能推理层，基于规则穷尽性与执行路径可编程性两个核心维度。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0F766E"/></marker>
    <marker id="bp-arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>

  <!-- 标题区 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">图2-13 智能层引入决策流程</text>
  <text x="82" y="70" fill="#64748B" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">帮助工程设计人员判断项目是否需要引入智能推理层，基于规则穷尽性与执行路径可编程性两个核心维度。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4" font-family="Arial, sans-serif">FLOWCHART</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>

  <g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">

    <!-- 起始→判断 折线 -->
    <polyline points="900,230 900,265 500,265 500,295" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#bp-arrow)"/>
    <polyline points="900,230 900,265 1300,265 1300,295" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#bp-arrow)"/>

    <!-- 区域框 rule_zone -->
    <rect x="60" y="475" width="660" height="160" rx="14" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="8,4"/>
    <text x="74" y="496" font-size="13" font-weight="bold" fill="#0F766E">规则引擎适用区域</text>
    <text x="74" y="514" font-size="10" fill="#475569">所有可穷举的业务规则场景</text>

    <!-- 区域框 ai_zone -->
    <rect x="900" y="475" width="660" height="160" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="8,4"/>
    <text x="914" y="496" font-size="13" font-weight="bold" fill="#DC2626">智能层适用区域</text>
    <text x="914" y="514" font-size="10" fill="#475569">规则无法穷尽或需要结合多源上下文的场景</text>

    <!-- 判断→结果 连线 -->
    <!-- rule_exhaust → rule_engine_1 "是" 青绿 -->
    <line x1="350" y1="350" x2="210" y2="520" stroke="#0F766E" stroke-width="2" marker-end="url(#bp-arrow-green)"/>
    <rect x="262" y="424" width="32" height="20" rx="3" fill="#FFFFFF"/>
    <text x="278" y="438" font-size="12" font-weight="bold" fill="#0F766E" text-anchor="middle">是</text>

    <!-- rule_exhaust → ai_need_1 "否" 红 -->
    <line x1="650" y1="350" x2="1050" y2="520" stroke="#DC2626" stroke-width="2" marker-end="url(#bp-arrow-red)"/>
    <rect x="765" y="404" width="32" height="20" rx="3" fill="#FFFFFF"/>
    <text x="781" y="418" font-size="12" font-weight="bold" fill="#DC2626" text-anchor="middle">否</text>

    <!-- path_program → rule_engine_2 "是" 青绿 -->
    <line x1="1150" y1="350" x2="560" y2="520" stroke="#0F766E" stroke-width="2" marker-end="url(#bp-arrow-green)"/>
    <rect x="935" y="404" width="32" height="20" rx="3" fill="#FFFFFF"/>
    <text x="951" y="418" font-size="12" font-weight="bold" fill="#0F766E" text-anchor="middle">是</text>

    <!-- path_program → ai_need_2 "否" 红 -->
    <line x1="1450" y1="350" x2="1400" y2="520" stroke="#DC2626" stroke-width="2" marker-end="url(#bp-arrow-red)"/>
    <rect x="1411" y="424" width="32" height="20" rx="3" fill="#FFFFFF"/>
    <text x="1427" y="438" font-size="12" font-weight="bold" fill="#DC2626" text-anchor="middle">否</text>

    <!-- 起始菱形 -->
    <polygon points="900,130 1050,180 900,230 750,180" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="900" y="176" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">需要智能层？</text>
    <text x="900" y="198" font-size="11" fill="#64748B" text-anchor="middle">规则复杂度与上下文依赖性</text>

    <!-- 判断菱形 rule_exhaust -->
    <polygon points="500,300 650,350 500,400 350,350" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="500" y="346" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">规则能否穷尽？</text>
    <text x="500" y="368" font-size="11" fill="#64748B" text-anchor="middle">业务逻辑是否固定</text>

    <!-- 判断菱形 path_program -->
    <polygon points="1300,300 1450,350 1300,400 1150,350" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="1300" y="346" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">执行路径可编程？</text>
    <text x="1300" y="368" font-size="11" fill="#64748B" text-anchor="middle">逻辑是否可固化为代码</text>

    <!-- 结果矩形 rule_engine_1 -->
    <rect x="90" y="525" width="240" height="100" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
    <text x="210" y="568" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">规则引擎即可</text>
    <text x="210" y="590" font-size="11" fill="#475569" text-anchor="middle">固定逻辑</text>

    <!-- 结果矩形 rule_engine_2 -->
    <rect x="440" y="525" width="240" height="100" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
    <text x="560" y="568" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">规则引擎即可</text>
    <text x="560" y="590" font-size="11" fill="#475569" text-anchor="middle">可编程路径</text>

    <!-- 结果矩形 ai_need_1 -->
    <rect x="930" y="525" width="240" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="1050" y="568" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">需接入智能层</text>
    <text x="1050" y="590" font-size="11" fill="#475569" text-anchor="middle">上下文依赖</text>

    <!-- 结果矩形 ai_need_2 -->
    <rect x="1280" y="525" width="240" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="1400" y="568" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">需接入智能层</text>
    <text x="1400" y="590" font-size="11" fill="#475569" text-anchor="middle">无法预定义</text>

    <!-- 汇聚虚线 -->
    <line x1="210" y1="625" x2="820" y2="680" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>
    <line x1="560" y1="625" x2="860" y2="680" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>
    <line x1="1050" y1="625" x2="940" y2="680" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>
    <line x1="1400" y1="625" x2="980" y2="680" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>

    <!-- 汇聚节点 -->
    <rect x="740" y="685" width="320" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="900" y="716" font-size="17" font-weight="bold" fill="#0F172A" text-anchor="middle">按需接入智能层</text>
    <text x="900" y="738" font-size="11" fill="#475569" text-anchor="middle">模块独立部署</text>

  </g>

  <!-- 图例 -->
  <line x1="64" y1="780" x2="1736" y2="780" stroke="#E2E8F0"/>
  <polygon points="96,808 80,800 64,808 80,816" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="108" y="812" fill="#64748B" font-size="10" font-weight="600" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">琥珀菱形 = 决策节点</text>
  <rect x="320" y="800" width="22" height="14" rx="3" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="350" y="812" fill="#64748B" font-size="10" font-weight="600" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">青绿矩形 = 规则引擎结果</text>
  <rect x="570" y="800" width="22" height="14" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="600" y="812" fill="#64748B" font-size="10" font-weight="600" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">红色矩形 = 需智能层结果</text>
  <rect x="830" y="800" width="22" height="14" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="860" y="812" fill="#64748B" font-size="10" font-weight="600" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">蓝色矩形 = 汇聚节点</text>
  <line x1="1090" y1="808" x2="1124" y2="808" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1132" y="812" fill="#64748B" font-size="10" font-weight="600" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">虚线 = 汇聚流向</text>

  <!-- 图注 -->
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-weight="600" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">图2-25 智能层引入决策流程。规则引擎适用于所有可穷举的业务规则场景；智能层仅在规则无法穷尽或需要综合上下文时才引入。</text>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">flowchart</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">自上而下流程图：起始菱形分两路到并列判断菱形，各分是/否到四个结果节点，底部汇聚到"按需接入智能层"。左侧青绿虚线框为规则引擎区域，右侧红虚线框为智能层区域。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
