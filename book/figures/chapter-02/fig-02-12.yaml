callouts:
- 第⑨步 Data 内部规则引擎触发，走最短路径。
- 第⑬步 Agentic 内部推理，外部请求需设超时降级。
- 第⑮步消息队列解耦，驱动先回“已接收”再等设备回执。
visual_constraints:
- 参与者不超过8个，每组标签用短名词。
- 图中橙色（AI）节点不超过1个，避免全图高亮。
- 图例放在图底部，不遮挡主体结构。
render_notes: HTML/SVG渲染。水平时序布局，参与者沿顶部排列。交互线垂直下行，阶段标签加在左侧（注册→配置→上报→推理→控制）。线型：实线同步调用，虚线异步返回或事件。配色：Gateway灰色，Auth紫色，Manager绿色，Data蓝色，Agentic橙色，驱动青绿。底部统一图例。
caption:
  zh: 图2-12 展示五大中心协同完成从设备注册到智能控制的完整流程。箭头上的编号对应正文中的步骤说明。
  en: 'Figure 2-12 The five centers working together from device registration to intelligent control. The numbers on the arrows correspond to the step-by-step description in the text.'
labels:
  en:
    图2-12 五大中心协同流程（智能灌溉场景）: Figure 2-12 Five-Center Collaboration (Smart Irrigation)
    五大中心通过 JWT、PointValue 与消息队列串联设备注册、数据上报、AI 推理与受控命令下发的完整闭环。: Linked by JWT, PointValue, and the message queue, the five centers chain device registration, data reporting, AI reasoning, and controlled command delivery into one closed loop.
    JWT、PointValue 与消息队列串联注册、配置、推理和控制: JWT, PointValue, and the message queue chain registration, configuration, reasoning, and control
    注册: Registration
    配置: Configuration
    上报: Reporting
    推理: Reasoning
    控制: Control
    现场设备: Field Device
    传感器+执行器: Sensors + Actuators
    协议接入: Protocol Access
    身份认证: Authentication
    运维人员: Operator
    配置管理: Configuration Mgmt
    元数据与规则: Metadata & Rules
    数据治理: Data Governance
    智能推理: AI Reasoning
    驱动服务: Driver Service
    协议执行: Protocol Execution
    ⑨ 规则检查: ⑨ Rule Check
    ⑬ LLM 推理: ⑬ LLM Reasoning
    ① 注册请求: ① Register Request
    ② 验证身份: ② Verify Identity
    ③ 返回 JWT: ③ Return JWT
    ④ 认证完成: ④ Auth Done
    ⑤ 配置规则: ⑤ Configure Rules
    ⑥ 同步规则: ⑥ Sync Rules
    ⑦ 上报数据: ⑦ Report Data
    ⑧ 转发 PointValue: ⑧ Forward PointValue
    ⑩ 条件触发: ⑩ Condition Met
    ⑪ 查历史数据: ⑪ Query History
    ⑫ 返回时序数据: ⑫ Return Time Series
    ⑭ 下发指令: ⑭ Send Command
    ⑮ 异步转消息队列: ⑮ Async to MQ
    ⑯ Modbus 写入: ⑯ Modbus Write
    同步调用: Sync Call
    异步返回 / 事件: Async Return / Event
    内部处理: Internal Processing
    图2-12 五大中心协同完成设备注册、数据上报、AI 推理与受控命令下发，箭头编号对应正文步骤说明。: Figure 2-12 The five centers work together on device registration, data reporting, AI reasoning, and controlled command delivery; the arrow numbers match the steps described in the text.
