<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图2-2 经典四层架构与五层架构对比</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="60.000" width="1152.000" height="640.000" viewBox="0 0 1800.000 1000.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <!-- ============ TITLE ============ -->
  <g id="title">
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="84" y="38" font-size="22" font-weight="700" fill="#0F172A">图2-3 智能层的数据采集→理解→决策→执行闭环</text>
    <text x="84" y="62" font-size="12" fill="#64748B">智能层在应用层内部的闭环：推理 · 规划 · 执行 与平台层和物理世界的交互</text>
    <rect x="1658" y="22" width="104" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1710" y="40" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">FLOWCHART</text>
    <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- ============ REGION BOUNDARY BOXES ============ -->
  <g id="regions" fill="none" stroke-width="1.5">
    <!-- 物理世界 -->
    <rect x="60" y="145" width="250" height="645" rx="12" stroke="#10B981" stroke-dasharray="8 4"/>
    <!-- 平台层 -->
    <rect x="355" y="145" width="250" height="645" rx="12" stroke="#2563EB" stroke-dasharray="8 4"/>
    <!-- 应用层 (outer, contains 智能层 + 业务应用) -->
    <rect x="650" y="145" width="1090" height="645" rx="12" stroke="#64748B" stroke-dasharray="8 4"/>
    <!-- 智能层 (inner) -->
    <rect x="670" y="185" width="490" height="535" rx="12" stroke="#F59E0B" stroke-dasharray="8 4"/>
    <!-- 业务应用 (inner) -->
    <rect x="1200" y="185" width="520" height="535" rx="12" stroke="#64748B" stroke-dasharray="8 4"/>
  </g>

  <!-- ============ REGION LABELS ============ -->
  <g id="region-labels" font-size="11" font-weight="700">
    <rect x="72" y="156" width="80" height="22" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
    <text x="112" y="171" fill="#10B981" text-anchor="middle">物理世界</text>

    <rect x="367" y="156" width="68" height="22" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
    <text x="401" y="171" fill="#2563EB" text-anchor="middle">平台层</text>

    <rect x="662" y="156" width="68" height="22" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
    <text x="696" y="171" fill="#64748B" text-anchor="middle">应用层</text>

    <rect x="682" y="196" width="188" height="22" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
    <text x="776" y="211" fill="#F59E0B" text-anchor="middle">智能层 · 推理 / 规划 / 执行</text>

    <rect x="1212" y="196" width="80" height="22" rx="4" fill="#FFFFFF" stroke="#64748B" stroke-width="1"/>
    <text x="1252" y="211" fill="#64748B" text-anchor="middle">业务应用</text>
  </g>

  <!-- ============ COMPONENT CARDS ============ -->
  <g id="cards">
    <!-- 物理世界 (green) -->
    <g>
      <rect x="85" y="235" width="200" height="135" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="103" y="269" font-size="15" font-weight="700" fill="#0F172A">传感器采集</text>
      <text x="103" y="289" font-size="10" fill="#64748B">Sensor</text>
      <text x="103" y="313" font-size="9" fill="#475569">温度 · 振动 · 电流 · 图像</text>
    </g>
    <g>
      <rect x="85" y="580" width="200" height="135" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="103" y="614" font-size="15" font-weight="700" fill="#0F172A">执行器驱动</text>
      <text x="103" y="634" font-size="10" fill="#64748B">Actuator</text>
      <text x="103" y="658" font-size="9" fill="#475569">电机 · 阀门 · 泵 · 机械臂</text>
    </g>

    <!-- 平台层 (blue) -->
    <g>
      <rect x="380" y="235" width="200" height="135" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <text x="398" y="269" font-size="15" font-weight="700" fill="#0F172A">数据中心</text>
      <text x="398" y="289" font-size="10" fill="#64748B">Data Hub</text>
      <text x="398" y="313" font-size="9" fill="#475569">时序 · 模型 · 设备上下文</text>
    </g>
    <g>
      <rect x="380" y="580" width="200" height="135" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <text x="398" y="614" font-size="15" font-weight="700" fill="#0F172A">命令服务</text>
      <text x="398" y="634" font-size="10" fill="#64748B">Command</text>
      <text x="398" y="658" font-size="9" fill="#475569">指令下发 · 状态回传</text>
    </g>

    <!-- 智能层 (orange) -->
    <g>
      <rect x="695" y="235" width="440" height="135" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
      <text x="713" y="269" font-size="15" font-weight="700" fill="#0F172A">推理</text>
      <text x="713" y="289" font-size="10" fill="#64748B">Reasoning</text>
      <text x="713" y="313" font-size="9" fill="#475569">感知理解 · 异常识别 · 意图判定 · 上下文融合</text>
    </g>
    <g>
      <rect x="695" y="405" width="440" height="135" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
      <text x="713" y="439" font-size="15" font-weight="700" fill="#0F172A">规划</text>
      <text x="713" y="459" font-size="10" fill="#64748B">Planning</text>
      <text x="713" y="483" font-size="9" fill="#475569">目标分解 · 动作排序 · 资源调度 · 风险评估</text>
    </g>
    <g>
      <rect x="695" y="580" width="440" height="135" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
      <text x="713" y="614" font-size="15" font-weight="700" fill="#0F172A">执行</text>
      <text x="713" y="634" font-size="10" fill="#64748B">Execution</text>
      <text x="713" y="658" font-size="9" fill="#475569">调度下发 · 过程监督 · 失败回滚 · 结果回收</text>
    </g>

    <!-- 业务应用 (gray) -->
    <g>
      <rect x="1260" y="235" width="400" height="135" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
      <text x="1278" y="269" font-size="15" font-weight="700" fill="#0F172A">告警</text>
      <text x="1278" y="289" font-size="10" fill="#64748B">Alert</text>
      <text x="1278" y="313" font-size="9" fill="#475569">阈值触发 · 异常升级 · 工单派发</text>
    </g>
    <g>
      <rect x="1260" y="405" width="400" height="135" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
      <text x="1278" y="439" font-size="15" font-weight="700" fill="#0F172A">报表</text>
      <text x="1278" y="459" font-size="10" fill="#64748B">Report</text>
      <text x="1278" y="483" font-size="9" fill="#475569">KPI 统计 · 效率分析 · 周期汇总</text>
    </g>
    <g>
      <rect x="1260" y="580" width="400" height="135" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
      <text x="1278" y="614" font-size="15" font-weight="700" fill="#0F172A">可视化</text>
      <text x="1278" y="634" font-size="10" fill="#64748B">Dashboard</text>
      <text x="1278" y="658" font-size="9" fill="#475569">实时曲线 · 状态大屏 · 拓扑监控</text>
    </g>
  </g>

  <!-- ============ ARROWS ============ -->
  <g id="arrows">
    <!-- A1 传感器→数据中心 : 上行采集 (solid blue, ①采集) -->
    <line x1="285" y1="300" x2="377" y2="300" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <!-- A2 数据中心→推理 : 结构化数据 (solid blue, ②理解) -->
    <line x1="580" y1="300" x2="692" y2="300" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <!-- A3 推理→规划 (solid orange) -->
    <line x1="915" y1="370" x2="915" y2="402" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
    <!-- A4 规划→执行 (solid orange, ③决策) -->
    <line x1="915" y1="540" x2="915" y2="577" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
    <!-- A5 执行→命令服务 : 设备指令 (dashed gray, async) -->
    <line x1="695" y1="647" x2="583" y2="647" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
    <!-- A6 命令服务→执行器 : 下行命令 (solid blue, ④执行) -->
    <line x1="380" y1="647" x2="288" y2="647" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <!-- A7 执行器→传感器 : 执行反馈闭环 (bold dashed, the loop) -->
    <path d="M85,647 L49,647 Q43,647 43,641 L43,306 Q43,300 49,300 L83,300"
          fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#ah-gray)"/>
    <!-- A8 智能层→业务应用 : 洞察/事件 (dashed gray, async) -->
    <line x1="1135" y1="472" x2="1257" y2="472" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  </g>

  <!-- ============ ARROW LABELS ============ -->
  <g id="arrow-labels">
    <!-- A1 -->
    <text x="331" y="288" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">① 采集</text>
    <text x="331" y="322" font-size="9" fill="#64748B" text-anchor="middle">上行数据</text>
    <!-- A2 -->
    <text x="636" y="288" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">② 理解</text>
    <text x="636" y="322" font-size="9" fill="#64748B" text-anchor="middle">结构化数据 · 上下文</text>
    <!-- A3 -->
    <text x="930" y="392" font-size="9" fill="#64748B" text-anchor="start">推理结果</text>
    <!-- A4 -->
    <text x="930" y="556" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="start">③ 决策</text>
    <text x="930" y="571" font-size="9" fill="#64748B" text-anchor="start">动作序列</text>
    <!-- A5 -->
    <text x="639" y="637" font-size="9" fill="#64748B" text-anchor="middle">设备指令 · 规划序列</text>
    <!-- A6 -->
    <text x="334" y="635" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">④ 执行</text>
    <text x="334" y="669" font-size="9" fill="#64748B" text-anchor="middle">下行命令</text>
    <!-- A7 feedback loop label (rotated, left side) -->
    <text x="28" y="474" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" transform="rotate(-90,28,474)">执行反馈 · 闭环回路</text>
    <!-- A8 -->
    <text x="1196" y="462" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">洞察 / 事件</text>
    <text x="1196" y="490" font-size="9" fill="#94A3B8" text-anchor="middle">异步推送</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g id="legend">
    <text x="60" y="822" font-size="10" font-weight="700" fill="#475569">图例</text>
    <line x1="60" y1="815" x2="1740" y2="815" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- sync data flow (blue solid) -->
    <line x1="80" y1="850" x2="116" y2="850" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <text x="126" y="854" font-size="11" fill="#475569">同步数据流（主链路）</text>

    <!-- smart internal (orange solid) -->
    <line x1="350" y1="850" x2="386" y2="850" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
    <text x="396" y="854" font-size="11" fill="#475569">智能层内部流转</text>

    <!-- async command/event (gray dashed) -->
    <line x1="580" y1="850" x2="616" y2="850" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
    <text x="626" y="854" font-size="11" fill="#475569">异步指令 / 事件驱动</text>

    <!-- feedback loop (bold dashed) -->
    <line x1="860" y1="850" x2="896" y2="850" stroke="#64748B" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#ah-gray)"/>
    <text x="906" y="854" font-size="11" fill="#475569">执行反馈 · 闭环回路</text>

    <!-- domain swatches -->
    <rect x="1160" y="844" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="1184" y="854" font-size="11" fill="#475569">物理域</text>
    <rect x="1240" y="844" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1264" y="854" font-size="11" fill="#475569">平台域</text>
    <rect x="1320" y="844" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="1344" y="854" font-size="11" fill="#475569">智能域</text>
    <rect x="1400" y="844" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <text x="1424" y="854" font-size="11" fill="#475569">应用域</text>
  </g>

  <!-- ============ CAPTION ============ -->
  <text x="900" y="925" font-size="10" fill="#94A3B8" text-anchor="middle">图2-3 智能层的闭环工作流。数据从物理世界采集，经平台层进入智能层进行推理与规划，规划结果通过平台层下发到执行器，执行反馈再回到推理模块开始下一轮循环。</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">layered</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">并排两列分层布局。左侧四层（应用/平台/网络/感知），右侧五层（应用/智能/平台/网络/感知）。两列水平对齐，相同层级等高。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
