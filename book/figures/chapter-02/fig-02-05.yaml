type: sequence
title: 图2-5 智能楼宇节能闭环的组件间交互时序示意图（例子）
purpose: 帮助读者理解闭环模式下各组件之间的消息交互顺序、数据流转格式以及指令下行的协议翻译过程。
audience_takeaway: 读者应理解闭环模式下智能层的“理解”与“决策”子组件如何协同，以及指令下行经过协议翻译才能在物理设备上执行。
visual_focus: 智能层内部的理解与决策子组件之间的顺序交互，以及从决策组件经指令调度器到空调设备的指令下行主链路。
design_level: implementation
layout: 垂直时间轴序列图，从左到右排列六个泳道：传感器/网关、时序数据库、智能层（内部虚线分隔理解与决策子组件）、指令调度器、空调设备。自上而下标注消息交互顺序。
elements:
- 传感器与网关、时序数据库
- 理解子组件与决策子组件
- 指令调度器与空调设备
relationships:
- 传感器与网关 → 时序数据库：持续上报 PointValue
- 时序数据库 ↔ 理解子组件：查询并返回历史位号值
- 理解子组件 → 决策子组件 → 指令调度器：状态摘要转化为动作序列
- 指令调度器 ↔ 空调设备：写入 Modbus 寄存器并接收回执
components:
- id: sensor_gw
  label: 传感器与网关
  type: edge
  subtitle: 数据采集与协议转换
  group: edge_domain
  priority: primary
  shape: card
- id: tsdb
  label: 时序数据库
  type: data
  subtitle: 位号值存储
  group: data_domain
  priority: primary
  shape: database
- id: understand_comp
  label: 理解子组件
  type: ai
  subtitle: 状态感知与趋势预测
  group: intelligence_domain
  priority: primary
  shape: card
- id: decide_comp
  label: 决策子组件
  type: ai
  subtitle: 规则引擎与AI规划
  group: intelligence_domain
  priority: primary
  shape: decision
- id: cmd_scheduler
  label: 指令调度器
  type: platform
  subtitle: 队列调度与重试
  group: platform_domain
  priority: primary
  shape: card
- id: hvac_device
  label: 空调设备
  type: edge
  subtitle: 上游与下游两台
  group: edge_domain
  priority: normal
  shape: card
regions:
- id: edge_domain
  label: 设备与边缘域
  role: 现场异构资源边界
- id: data_domain
  label: 数据资产域
  role: 数据沉淀与治理边界
- id: intelligence_domain
  label: 智能决策域
  role: 模型、规则与Agent边界
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
connections:
- from: sensor_gw
  to: tsdb
  label: 持续上报PointValue
  style: solid
  direction: bottom-to-top
- from: tsdb
  to: understand_comp
  label: 查询历史位号值
  style: dashed
  direction: request
- from: understand_comp
  to: tsdb
  label: 返回位号值JSON
  style: dashed
  direction: response
- from: understand_comp
  to: decide_comp
  label: 输出状态摘要
  style: solid
  direction: request
- from: decide_comp
  to: cmd_scheduler
  label: 发送动作序列指令
  style: solid
  direction: request
- from: cmd_scheduler
  to: hvac_device
  label: Modbus寄存器写入
  style: solid
  direction: request
- from: hvac_device
  to: cmd_scheduler
  label: 回执确认码
  style: dashed
  direction: response
callouts:
- 时序数据库同时接收写入（来自采集）和响应读取（来自智能层理解子组件）。
- 指令下行通道经过指令调度器完成协议翻译（抽象命令→Modbus寄存器写入）。
- 执行完成后智能层设置定时器，标记下一次闭环的开始。
render_notes: HTML/SVG 渲染，按时间轴将整段交互切分为三个段落展示，段落间加入横线分隔。消息箭头旁标注数据格式（JSON或Modbus帧）。智能层内部理解与决策两个子组件使用同一泳道并用虚线分隔。时序数据库泳道置于传感器/网关与智能层之间，体现其双向读写角色。
caption:
  zh: 图2-5 智能楼宇节能闭环的组件间交互时序示意图（例子）
  en: 'Figure 2-5 Sequence of component interactions in a smart-building energy-saving closed loop (example).'
labels:
  en:
    图2-5 智能楼宇节能闭环的组件间交互时序示意图（假设场景）: Figure 2-5 Component Interaction Sequence in a Smart-Building Energy-Saving Loop (example)
    传感器经网关持续上报位号值，智能层理解组件查询时序库并生成状态摘要，决策组件输出动作序列，指令调度器翻译为 Modbus 写入并接收设备回执。: Sensors report point values through the gateway; the understanding component queries the time-series DB and produces a state summary, the decision component outputs an action sequence, and the command scheduler translates it into Modbus writes and receives device acknowledgements.
    位号值读取、状态理解、协议翻译与设备回执: Point-value reads, state understanding, protocol translation, and device acknowledgement
    传感器/网关: Sensor / Gateway
    数据采集与协议转换: Data Collection & Protocol Conversion
    时序数据库: Time-Series DB
    位号值存储: Point-Value Storage
    理解组件: Understanding Component
    状态感知与趋势预测: State Awareness & Trend Prediction
    决策组件: Decision Component
    动作序列生成: Action Sequence Generation
    指令调度器: Command Scheduler
    协议翻译与下发: Protocol Translation & Delivery
    空调设备: HVAC Device
    Modbus 执行器: Modbus Actuator
    采集: Collect
    持续上报 PointValue: Report PointValue
    理解: Understand
    查询历史位号值: Query Point-Value History
    返回位号值 JSON: Return Point-Value JSON
    决策: Decide
    输出状态摘要: Output State Summary
    控制: Control
    发送动作序列: Send Action Sequence
    下发: Deliver
    Modbus 寄存器写入: Modbus Register Write
    反馈: Feedback
    返回确认码: Return ACK
    图2-5 理解组件查询时序库并生成状态摘要，决策组件输出动作序列，指令调度器翻译为 Modbus 写入并接收设备回执。: Figure 2-5 The understanding component queries the time-series DB and produces a state summary; the decision component outputs an action sequence; the command scheduler translates it into Modbus writes and receives device acknowledgements.
