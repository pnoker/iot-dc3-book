type: lifecycle
title: 图2-14 学习路径三台阶与自检节点
purpose: 展示从基础到落地的三个递进学习阶段，以及每个阶段的验收自检标准
audience_takeaway: 读者应明确三个台阶的前后依赖关系：必须通过上一台阶的自检才能进入下一阶段，防止基础不牢直接上手工程造成理解断层。
visual_focus: 从左到右的流向主链路，强调自检节点作为阶段跳转的阀门
design_level: logical
layout: 水平三阶段流向图，带入口（学习起点）和出口（工程落地）
elements:
- 经典四层基础、智能层机制、工程落地三个学习台阶
- 每个台阶对应的自检节点
relationships:
- 经典四层基础 → 端到端协议链路自检：验收基础数据路径
- 基础自检通过 → 智能层机制 → 规则与 AI 边界自检：进入并验收智能能力学习
- 边界自检通过 → 工程落地 → 全链路部署自检：完成系统切分与部署分析
regions:
- id: stage1_domain
  label: 第一阶段域
  role: 经典四层底子
- id: stage2_domain
  label: 第二阶段域
  role: 智能层工作机制
- id: stage3_domain
  label: 第三阶段域
  role: 工程落地与治理
components:
- id: stage1
  label: 第一台阶：经典四层底子
  type: process
  subtitle: Modbus / OPC UA / MQTT / 时序数据库
  group: stage1_domain
  priority: primary
  shape: card
- id: check1
  label: 自检：端到端协议链路
  type: decision
  subtitle: 传感器→存储全路径
  group: stage1_domain
  priority: primary
  shape: decision
- id: stage2
  label: 第二台阶：智能层工作机制
  type: process
  subtitle: Function Calling / LangChain / Spring AI / MCP
  group: stage2_domain
  priority: primary
  shape: card
- id: check2
  label: 自检：规则 vs AI 边界
  type: decision
  subtitle: 安全约束环节
  group: stage2_domain
  priority: primary
  shape: decision
- id: stage3
  label: 第三台阶：工程落地与治理
  type: process
  subtitle: IoT DC3 / ThingsBoard / StreamPipes
  group: stage3_domain
  priority: primary
  shape: card
- id: check3
  label: 自检：全链路部署分析
  type: decision
  subtitle: 书面系统切分报告
  group: stage3_domain
  priority: primary
  shape: decision
connections:
- from: stage1
  to: check1
  label: 完成后验收
  style: solid
  direction: left-to-right
- from: check1
  to: stage2
  label: 通过则进入
  style: solid
  direction: left-to-right
- from: stage2
  to: check2
  label: 完成后验收
  style: solid
  direction: left-to-right
- from: check2
  to: stage3
  label: 通过则进入
  style: solid
  direction: left-to-right
- from: stage3
  to: check3
  label: 完成后验收
  style: solid
  direction: left-to-right
callouts:
- 第一台阶参考书：《物联网：技术与应用》《数据密集型应用系统设计》
- 第二台阶阅读 OpenAI Function Calling、LangChain Tool、Spring AI @Tool、MCP 规范
- 第三台阶开源项目：IoT DC3、ThingsBoard、Apache StreamPipes
legend:
- 矩形=学习阶段，圆形=自检节点
- 实线箭头=顺序流转，自检通过后才能进入下一阶段
visual_constraints:
- 最多6个主节点，每个节点标签不超过14个汉字
- 三个域用不同背景色区别（经典绿/智能橙/工程蓝）
- 图例放置底部，不遮挡区域边界
render_notes: 水平流向图，三个矩形从左到右排布，中间嵌入圆形自检节点。书籍和项目精选标注在对应阶段下方，用灰色小字显示。箭头使用 SVG marker 渲染。
caption:
  zh: 图2-14 学习路径三台阶与自检节点。每个台阶完成对应自检后才能进入下一阶段，防止基础不牢直接上手工程造成理解断层。
  en: 'Figure 2-14 The three-step learning path with self-check gates. Each step must pass its self-check before moving on to the next stage, preventing a weak foundation from turning into gaps in understanding once engineering work begins.'
labels:
  en:
    图2-14 学习路径三台阶与自检节点: Figure 2-14 Three-Step Learning Path with Self-Check Gates
    三个递进学习阶段以自检节点为关卡：端到端协议链路、规则与 AI 边界、全链路部署分析，通过后进入下一阶段。: 'Three progressive stages gated by self-checks: end-to-end protocol chain, rules-vs-AI boundary, and full-chain deployment analysis; pass each one to move on.'
    三台阶前后依赖，自检节点是阶段跳转的阀门: The three steps depend on each other; self-checks gate each transition
    学习: Learning
    起点: Start
    第一台阶：经典四层底子: 'Step 1: Classic Four-Layer Foundation'
    Modbus · OPC UA · MQTT · 时序数据库: Modbus · OPC UA · MQTT · Time-Series DB
    感知 → 网络 → 平台 → 应用: Sensing → Network → Platform → Application
    自检 ① 端到端协议链路: Self-Check ① End-to-End Protocol Chain
    传感器 → 存储全路径是否跑通: Does the sensor-to-storage path run end to end?
    第二台阶：智能层机制: 'Step 2: Intelligence-Layer Mechanics'
    理解 · 决策 · 受控工具调用: Understanding · Decision · Controlled Tool Calls
    自检 ② 规则 vs AI 边界: Self-Check ② Rules vs AI Boundary
    确定性逻辑与模型职责是否清晰: Are deterministic logic and model duties clear?
    第三台阶：工程落地: 'Step 3: Engineering Implementation'
    系统切分 · 部署 · 治理: System Splits · Deployment · Governance
    自检 ③ 全链路部署: Self-Check ③ Full-Chain Deployment
    切分与部署分析是否完整: Is the split-and-deploy analysis complete?
    工程: Engineering
    落地: Delivery
    通过: Pass
    三台阶前后依赖: The Three Steps Build on Each Other
    第一台阶验收基础数据路径，第二台阶验收规则与 AI 边界，第三台阶完成系统切分与部署分析: Step 1 validates the basic data path, Step 2 the rules-vs-AI boundary, and Step 3 the system split and deployment analysis
    必须通过上一台阶的自检才能进入下一阶段，防止基础不牢直接上手工程造成理解断层: Each self-check must pass before the next stage, preventing a weak foundation from causing gaps once engineering starts
    图2-14 三个台阶以自检为关卡，自检内容依次为端到端协议链路、规则 vs AI 边界、全链路部署分析，通过后方可进入下一阶段。: Figure 2-14 The three steps are gated by self-checks — end-to-end protocol chain, rules vs AI boundary, then full-chain deployment analysis — and each must pass before the next stage.
