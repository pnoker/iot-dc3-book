<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图2-8 Data 中心数据流示意</title>
  <desc id="desc">展示 IoT DC3 Data 中心从设备采集到时序存储的核心数据流，说明消息队列如何缓冲和解耦。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
  <title id="title">图2-8 Data 中心数据流示意</title>
  <desc id="desc">展示 IoT DC3 Data 中心从设备采集到时序存储的核心数据流，说明消息队列如何缓冲和解耦。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <!-- Title area -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图2-8 Data 中心数据流示意</text>
  <text x="82" y="70" fill="#64748B" font-size="12">Data 中心「一次接收、两处分发」的数据管道：消息队列解耦写入与分发。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">DATAFLOW</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="dataflow" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">
  <!-- Region boundaries (dashed, transparent) -->
  <rect x="90" y="340" width="480" height="170" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="106" y="362" fill="#475569" font-size="13" font-weight="700">设备与边缘域</text>
  <rect x="590" y="340" width="220" height="170" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="606" y="362" fill="#475569" font-size="13" font-weight="700">平台服务域</text>
  <rect x="820" y="240" width="760" height="380" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="836" y="262" fill="#475569" font-size="13" font-weight="700">数据资产域</text>

  <!-- Connections (behind nodes) -->
  <line x1="300" y1="425" x2="360" y2="425" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="330" y="418" fill="#475569" font-size="11" text-anchor="middle">原始信号</text>
  <line x1="540" y1="425" x2="600" y2="425" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="570" y="418" fill="#475569" font-size="11" text-anchor="middle">PointValue</text>
  <line x1="780" y1="425" x2="840" y2="425" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="810" y="418" fill="#475569" font-size="11" text-anchor="middle">转发数据</text>
  <line x1="1020" y1="425" x2="1080" y2="425" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="1050" y="418" fill="#475569" font-size="11" text-anchor="middle">数据入队</text>
  <!-- MQ -> TSDB (dashed, async) -->
  <line x1="1260" y1="425" x2="1380" y2="305" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1294" y="352" width="54" height="14" fill="#FFFFFF"/>
  <text x="1321" y="363" fill="#475569" font-size="11" text-anchor="middle">异步写入</text>
  <!-- MQ -> Consumer (solid, realtime) -->
  <line x1="1260" y1="425" x2="1380" y2="545" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1294" y="478" width="54" height="14" fill="#FFFFFF"/>
  <text x="1321" y="489" fill="#475569" font-size="11" text-anchor="middle">实时推送</text>

  <!-- Nodes -->
  <!-- field_device (edge) -->
  <rect x="120" y="380" width="180" height="90" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="210" y="412" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">现场设备</text>
  <text x="210" y="436" fill="#64748B" font-size="12" text-anchor="middle">PLC、电表、传感器</text>

  <!-- driver (primary) -->
  <rect x="360" y="380" width="180" height="90" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="450" y="412" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">驱动模块</text>
  <text x="450" y="436" fill="#64748B" font-size="12" text-anchor="middle">南向协议驱动</text>

  <!-- gateway (primary) -->
  <rect x="600" y="380" width="180" height="90" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="690" y="412" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">Gateway</text>
  <text x="690" y="436" fill="#64748B" font-size="12" text-anchor="middle">鉴权与路由</text>

  <!-- data_center (data) -->
  <rect x="840" y="380" width="180" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="930" y="412" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">Data 中心</text>
  <text x="930" y="436" fill="#64748B" font-size="12" text-anchor="middle">数据接收与分发</text>

  <!-- mq (cloud/amber, bus shape, emphasized) -->
  <rect x="1080" y="370" width="180" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <rect x="1151" y="385" width="7" height="40" rx="1.5" fill="#D97706"/>
  <rect x="1167" y="385" width="7" height="40" rx="1.5" fill="#D97706"/>
  <rect x="1183" y="385" width="7" height="40" rx="1.5" fill="#D97706"/>
  <text x="1170" y="448" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">消息队列</text>
  <text x="1170" y="466" fill="#64748B" font-size="10" text-anchor="middle">RabbitMQ 缓冲层</text>

  <!-- tsdb (data) -->
  <rect x="1380" y="260" width="180" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1470" y="292" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">时序数据库</text>
  <text x="1470" y="316" fill="#64748B" font-size="12" text-anchor="middle">持久化存储</text>

  <!-- consumer (external) -->
  <rect x="1380" y="500" width="180" height="90" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1470" y="532" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">订阅方</text>
  <text x="1470" y="556" fill="#64748B" font-size="12" text-anchor="middle">监控/Agentic/告警</text>
  </g>

  <!-- Legend -->
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <line x1="80" y1="803" x2="108" y2="803" stroke="#2563EB" stroke-width="2.5"/>
  <text x="116" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600">实线 = 同步主链路</text>
  <line x1="400" y1="803" x2="428" y2="803" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="436" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600">虚线 = 异步写入</text>
  <rect x="720" y="797" width="18" height="12" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="746" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600">橙色 = 消息队列缓冲层</text>
  <rect x="1060" y="797" width="18" height="12" rx="2" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="1086" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600">青绿 = 设备与边缘</text>
  <rect x="1380" y="797" width="18" height="12" rx="2" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1406" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600">紫色 = 数据资产</text>

  <!-- Caption -->
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图2-8 IoT DC3 Data 中心数据流：现场设备 → 驱动 → Gateway → Data 中心 → 消息队列，再分流至时序数据库（异步写入）与订阅方（实时推送）。</text>
  </svg>
</svg>
