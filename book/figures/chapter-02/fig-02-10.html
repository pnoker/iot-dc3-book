  <desc id="desc">温度传感器上报事件，经 Gateway 与 Data 中心进入 Manager 规则引擎做 ECA 判断，触发告警通知或下发风扇调速命令，命令经 Data 中心转发回设备。</desc>

      <marker id="mk-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#2563EB"/></marker>
      <marker id="mk-red" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#DC2626"/></marker>

    <line x1="630" y1="510" x2="730" y2="510" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="930" y1="510" x2="910" y2="520" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="1080" y1="450" x2="1080" y2="280" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-red)"/>

    <text x="922" y="498" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">事件输入</text>

    <text x="1140" y="642" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">命令转发</text>

    <text x="1450" y="530" font-size="15" fill="#475569" text-anchor="middle">风扇调速</text>

    <rect x="970" y="160" width="200" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>

    <rect x="150" y="860" width="30" height="22" rx="5" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>

    <text x="1400" y="876" font-size="16" fill="#475569">告警流</text>

    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图2-10 黄红牌触发告警，红牌命令由 Data 中心转发回设备，规则引擎不直连硬件。</text>
