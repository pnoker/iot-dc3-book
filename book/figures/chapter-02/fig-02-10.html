  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }

  <main class="page" data-figure-root>

  <title id="title">图2-10 可选ECA Workflow：告警与受控动作</title>
  <desc id="desc">温度事件经 Driver 和 RabbitMQ 进入可选规则服务，告警可直接通知，设备写动作必须经过策略、确认和审计后回到命令总线。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>

    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

    <defs>
      <marker id="mk-blue" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#2563EB"/></marker>
      <marker id="mk-red" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#DC2626"/></marker>
    </defs>

    <!-- 标题区 -->
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图2-10 可选ECA Workflow：告警与受控动作</text>
    <text x="88" y="64" font-size="12" fill="#64748B">参考扩展，不代表 Manager 内置规则引擎</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 连线：先画 -->
    <line x1="330" y1="510" x2="430" y2="510" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="630" y1="510" x2="730" y2="510" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="930" y1="510" x2="910" y2="520" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>
    <line x1="1080" y1="450" x2="1080" y2="280" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mk-red)"/>
    <line x1="1250" y1="520" x2="1350" y2="510" stroke="#2563EB" stroke-width="2.2" marker-end="url(#mk-blue)"/>

    <text x="1266" y="498" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">候选 Action</text>
    <text x="1140" y="642" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">确认后进入命令总线</text>

    <text x="530" y="530" font-size="15" fill="#475569" text-anchor="middle">解析与位号映射</text>

    <text x="1450" y="530" font-size="15" fill="#475569" text-anchor="middle">值域 · 互锁 · 审批</text>

    <rect x="970" y="160" width="200" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>

    <text x="230" y="790" font-size="15" fill="#64748B">规则服务不直连硬件：写操作经策略确认后，由 Data 命令接口与 Driver 链路执行。</text>

    <!-- 图例 -->
    <rect x="150" y="860" width="30" height="22" rx="5" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>

    <rect x="330" y="860" width="30" height="22" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="370" y="876" font-size="16" fill="#475569">平台服务</text>
    <polygon points="520,871 550,860 580,871 550,882" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
    <text x="592" y="876" font-size="16" fill="#475569">决策节点</text>
    <rect x="710" y="860" width="30" height="22" rx="5" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>

    <text x="1400" y="876" font-size="16" fill="#475569">告警流</text>

    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图2-10 可选规则服务消费位号事件；告警走通知链，设备动作经策略与确认后回到命令总线。</text>
