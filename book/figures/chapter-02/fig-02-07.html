  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图2-7 IoT DC3 五大中心逻辑关系</title>
  <desc id="desc">展示 Gateway、Auth、Manager、Data、Agentic 五大微服务的调用依赖与数据流向，以及它们与消息队列、时序数据库等外部基础设施的关系。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="92" width="1152" height="576" viewBox="0 0 1800 900" preserveAspectRatio="xMidYMid meet">

  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="arr-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0F766E"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>

  <!-- 顶部标题区 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">图2-7 IoT DC3 五大中心逻辑关系</text>
  <text x="82" y="70" fill="#64748B" font-size="12" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">展示 Gateway、Auth、Manager、Data、Agentic 五大微服务的调用依赖与数据流向，以及它们与消息队列、时序数据库等外部基础设施的关系。</text>
  <rect x="1596" y="28" width="152" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1672" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4" font-family="Arial,sans-serif">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>

  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">

    <text x="440" y="432" fill="#64748B" font-size="12" font-weight="600" text-anchor="end">数据层</text>
    <text x="440" y="558" fill="#64748B" font-size="12" font-weight="600" text-anchor="end">存储层</text>

    <!-- 接入层：Gateway 中心 -->
    <rect x="620" y="130" width="460" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="850" y="161" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">Gateway 中心</text>
    <text x="850" y="184" fill="#475569" font-size="12" text-anchor="middle">路由 · 鉴权 · 限流</text>

    <!-- 基础服务层：Auth 中心 / Manager 中心 -->
    <rect x="480" y="260" width="330" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="645" y="291" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">Auth 中心</text>
    <text x="645" y="314" fill="#475569" font-size="12" text-anchor="middle">身份 · RBAC · 租户</text>

    <rect x="890" y="260" width="330" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1055" y="291" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">Manager 中心</text>
    <text x="1055" y="314" fill="#475569" font-size="12" text-anchor="middle">设备模板 · 位号定义</text>

    <text x="850" y="444" fill="#475569" font-size="12" text-anchor="middle">位号值写入 · 查询 · 命令</text>

    <text x="620" y="576" fill="#64748B" font-size="12" text-anchor="middle">AMQP</text>

    <path d="M 830 532 A 150 12 0 0 1 1130 532 L 1130 594 A 150 12 0 0 1 830 594 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M 830 532 A 150 12 0 0 1 1130 532" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="980" y="558" fill="#0F172A" font-size="15" font-weight="700" text-anchor="middle">时序数据库</text>
    <text x="980" y="576" fill="#64748B" font-size="12" text-anchor="middle">位号值存储</text>

    <rect x="1408" y="254" width="80" height="18" rx="9" fill="#F97316"/>
    <text x="1448" y="267" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">AI 能力层</text>
    <rect x="1408" y="270" width="292" height="134" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2.5"/>
    <text x="1554" y="312" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">Agentic 中心</text>
    <text x="1554" y="336" fill="#C2410C" font-size="12" text-anchor="middle">大模型 · 工具调用</text>

    <line x1="850" y1="210" x2="645" y2="260" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>
    <line x1="850" y1="210" x2="1055" y2="260" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>
    <line x1="850" y1="210" x2="850" y2="390" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>
    <line x1="1080" y1="170" x2="1408" y2="290" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>
    <line x1="940" y1="470" x2="980" y2="532" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- 连线：Agentic 内部调度 / 异步消息（虚线） -->
    <line x1="1440" y1="402" x2="1100" y2="430" stroke="#0F766E" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr-teal)"/>
    <line x1="1408" y1="320" x2="1220" y2="300" stroke="#0F766E" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr-teal)"/>
    <line x1="760" y1="470" x2="620" y2="532" stroke="#0F766E" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr-teal)"/>

    <!-- 连线标签 -->
    <rect x="719" y="217" width="56" height="16" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.5"/>
    <text x="747" y="229" fill="#0F172A" font-size="11" text-anchor="middle">令牌校验</text>

    <rect x="918" y="217" width="68" height="16" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.5"/>
    <text x="952" y="229" fill="#0F172A" font-size="11" text-anchor="middle">元数据查询</text>

    <rect x="804" y="290" width="92" height="16" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.5"/>
    <text x="850" y="302" fill="#0F172A" font-size="11" text-anchor="middle">数据读写/命令</text>

    <rect x="1212" y="213" width="64" height="16" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.5"/>
    <text x="1244" y="225" fill="#0F172A" font-size="11" text-anchor="middle">AI 请求</text>

    <rect x="1236" y="398" width="68" height="16" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.5"/>
    <text x="1270" y="410" fill="#0F172A" font-size="11" text-anchor="middle">查询/命令</text>

    <rect x="1280" y="293" width="68" height="16" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.5"/>
    <text x="1314" y="305" fill="#0F172A" font-size="11" text-anchor="middle">元数据查询</text>

    <rect x="634" y="483" width="112" height="16" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.5"/>
    <text x="690" y="495" fill="#0F172A" font-size="11" text-anchor="middle">驱动上报/命令回执</text>

    <rect x="926" y="483" width="68" height="16" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.5"/>
    <text x="960" y="495" fill="#0F172A" font-size="11" text-anchor="middle">写入/查询</text>

  </g>

  <!-- 底部图例 -->
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="80" y="795" width="16" height="12" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="104" y="806" fill="#64748B" font-size="10" font-weight="600" text-anchor="start">平台微服务节点</text>

    <rect x="250" y="795" width="16" height="12" rx="2" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="274" y="806" fill="#64748B" font-size="10" font-weight="600" text-anchor="start">Agentic 智能层</text>

    <path d="M 452 795 A 8 3 0 0 1 468 795 L 468 805 A 8 3 0 0 1 452 805 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M 452 795 A 8 3 0 0 1 468 795" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="478" y="806" fill="#64748B" font-size="10" font-weight="600" text-anchor="start">外部基础设施</text>

    <line x1="660" y1="801" x2="694" y2="801" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="704" y="806" fill="#64748B" font-size="10" font-weight="600" text-anchor="start">实线箭头 = REST API 同步调用</text>

    <line x1="900" y1="801" x2="934" y2="801" stroke="#0F766E" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr-teal)"/>
    <text x="944" y="806" fill="#64748B" font-size="10" font-weight="600" text-anchor="start">虚线箭头 = Agentic 内部 REST 调用 / AMQP 消息</text>
  </g>

  <!-- 图注 -->
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图2-7 IoT DC3 五大中心逻辑关系。Gateway 是北向唯一入口，Auth 提供鉴权上下文，Manager 提供元数据，Data 是数据核心枢纽，Agentic 是 AI 能力层。数据经消息队列解耦采集与命令下发。</text>

  </svg>
</svg>
    <section class="meta" style="display:none">
      <div class="card"><div class="label">图表类型</div><div class="value">architecture</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">自下而上分层：接入层（Gateway）→ 基础服务层（Auth、Manager）→ 数据层（Data）→ 存储层（消息队列、时序数据库）；Agentic 中心置于右侧、横挂数据层与基础服务层之间，独立于主链路。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产；Gateway/Auth/Manager/Data 蓝色系，Agentic 橙色，消息队列与 TSDB 灰色数据库图元；8 条连线带短标签，底部图例。</div></div>
