  <style>

  <desc id="desc">Gateway 是北向唯一入口，Auth 提供鉴权上下文，Manager 提供元数据，Data 是数据核心枢纽，Agentic 是 AI 能力层，数据经消息队列解耦采集与命令下发。</desc>
