    8 类显式注册 Tool: 8 explicitly registered tools
    Facade / 平台服务: Facade / platform services
    复用 Auth · Manager · Data 边界: Reuse Auth · Manager · Data boundaries
    不复制设备协议和业务逻辑: No duplicated protocols or business logic
    MCP 工具目录与白名单: MCP tool catalog & allowlist
    OAuth · 连接授权 · 工具裁剪: OAuth · connection auth · tool scoping
    供外部 Agent 发现平台能力: External agent capability discovery
    受控写入与平台链路: Controlled writes & platform chain
    确认后由 ActionService 下发: Issued by ActionService after confirmation
    点位写部分具备: Point writes partially available
    Driver · 设备: Driver · devices
    运行时治理旁路: Runtime governance lane
