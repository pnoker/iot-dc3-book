type: architecture
title: 图7-6 IoT DC3 Agentic Center 的 Runtime 能力映射
purpose: 把工业 Agent Runtime 四平面映射到 IoT DC3 当前实现，明确已具备、部分具备和尚未具备的能力，避免将目标架构误写为现状。
audience_takeaway: IoT DC3 已形成受治理的对话式 Tool 运行基础，并具备受控点位写入与 MCP 工具授权；通用 Workflow、长期任务状态机、调度恢复和统一 Skill 注册仍是后续建设项。
visual_focus: 左侧为四平面能力框架，中间为 DC3 当前组件，右侧用已具备、部分具备、待建设三种状态标记能力成熟度；底部显示 Data、RabbitMQ、Driver 与设备链路。
design_level: implementation
layout: 1200×760 分层架构图。自上而下为入口与会话、模型与上下文、Tool 与受控执行、平台与设备四层；右侧为运行时治理旁路。每个组件右上角带状态标签：已具备、部分具备、待建设。
elements:
- 入口：Web 对话、内部 API、Gateway MCP 客户端
- 模型适配：ChatClientFactory、Provider/Model 配置
- 上下文：会话消息、ToolContext、租户/用户/会话
- 能力：8 个已注册 Tool、Facade、MCP 工具目录与白名单
- 受控写入：PENDING Action、用户确认、ActionService
- 平台链路：Manager/Data/Auth、RabbitMQ、Driver、设备
- 部分具备：调用记录、会话回放、模型与 Tool Eval
- 待建设：统一 run_id、长期任务状态机、Workflow/Skill 注册、调度租约、恢复补偿、kill switch
relationships:
- 会话请求经 ChatClientFactory 选择模型并注入可见 Tool
- ToolContext 将身份与租户上下文带入 Facade 调用
- 只读 Tool 直接返回经过业务层授权的数据
- 点位写 Tool 先创建 Action，确认后再进入 Data—RabbitMQ—Driver 命令链路
- 外部 Agent 经 Gateway MCP 入口发现经过连接授权和白名单裁剪的工具
- 待建设能力不参与当前主调用链，用虚线表示演进方向
legend:
- 绿色标签：当前已具备
- 橙色标签：已有基础但尚未统一
- 灰色虚线：目标能力，当前未实现
render_notes: 遵循 style.yaml 的浅色技术出版风格。状态标签位置统一，已具备用 secondary/success，部分具备用 accent/warning，待建设用 neutral 虚线。当前调用链使用实线，目标演进使用虚线；避免将待建设组件画入当前数据主链路。
caption:
  zh: 图7-6 IoT DC3 Agentic Center 的 Runtime 能力映射。当前系统已经具备会话、模型适配、显式 Tool、租户上下文、MCP 授权和 Action 确认；长期任务编排、状态恢复与统一治理仍需继续建设。
  en: Figure 7-6 Runtime capability mapping of the IoT DC3 Agentic Center. The system already provides sessions, model adaptation, explicit tools, tenant context, MCP authorization, and Action confirmation; long-horizon task orchestration, state recovery, and unified governance still need further construction.
labels:
  en:
    图7-6 IoT DC3 Agentic Center 的 Runtime 能力映射: 'Figure 7-6 IoT DC3 Agentic Center: Runtime Capability Map'
