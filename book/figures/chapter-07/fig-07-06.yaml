    调用记录 · 会话回放: Call logs · session replay
    模型与 Tool Eval: Model & tool eval
    待建设: To build
    统一 run_id · 长期任务状态机: Unified run_id · long-task state machine
    Workflow / Skill 注册: Workflow / Skill registration
    调度租约 · 恢复补偿: Scheduling leases · recovery compensation
    图7-6 DC3 已形成受治理的对话式 Tool 运行基础与受控点位写入；通用 Workflow、长期状态机、调度恢复与统一 Skill 注册仍是后续建设项。: Figure 7-6 DC3 already provides a governed conversational tool runtime and controlled point writes; general workflows, long-horizon state machines, schedule recovery, and unified Skill registration remain future work.
