<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图7-11 RAG Eval 分层评测</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">图7-11 RAG Eval 分层评测</title>
  <desc id="desc">RAG 评测拆为数据集、检索、生成、端到端四层，分层定位问题，失败分类比总分更有行动价值。</desc>
  <rect width="1200" height="700" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="580" viewBox="0 0 1800 950" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="950" fill="#FFFFFF"/>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图7-11 RAG Eval 分层评测</text>
  <text x="88" y="64" font-size="12" fill="#64748B">一次回答可能检索错版本、也可能生成不忠实 · 分层定位才能修复</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 层1：数据集 -->
  <rect x="80" y="140" width="1640" height="130" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <rect x="80" y="140" width="120" height="130" rx="12" fill="#64748B"/>
  <rect x="140" y="140" width="60" height="130" fill="#64748B"/>
  <text x="140" y="212" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 140 205)">数据集层</text>
  <text x="240" y="172" font-size="14" font-weight="700" fill="#0F172A">先固定评测集，而不是先挑指标</text>
  <text x="240" y="198" font-size="12" fill="#475569">样本含：问题 · 预期证据 · 可接受答案要点 · 是否应拒答 · 租户 · 设备型号 · 文档版本 · 有效时间</text>
  <text x="240" y="224" font-size="12" fill="#475569">覆盖六类输入：可回答、库中不存在、新旧版本冲突、过期规程、跨租户相似文档、需组合多段证据</text>
  <text x="240" y="250" font-size="11" fill="#64748B">按时间与文档版本切分，避免近重复文本泄漏；评测集本身要版本化</text>

  <!-- 层2：检索 -->
  <rect x="80" y="286" width="1640" height="130" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="80" y="286" width="120" height="130" rx="12" fill="#2563EB"/>
  <rect x="140" y="286" width="60" height="130" fill="#2563EB"/>
  <text x="140" y="358" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 140 351)">检索层</text>
  <text x="240" y="318" font-size="14" font-weight="700" fill="#0F172A">是否拿到了正确证据（不评价文风）</text>
  <text x="240" y="344" font-size="12" fill="#475569">Recall@k · MRR · nDCG@k · Context Precision/Recall · 正确版本命中率 · 跨租户误检索率</text>
  <text x="240" y="370" font-size="12" fill="#475569">空检索率与 P50/P95 延迟 · 同时报告稀疏、向量、混合、混合+reranker 四类基线</text>
  <text x="240" y="396" font-size="11" fill="#64748B">任何不属于当前租户的内容进入上下文，都视为安全失败</text>

  <!-- 层3：生成 -->
  <rect x="80" y="432" width="1640" height="130" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="80" y="432" width="120" height="130" rx="12" fill="#16A34A"/>
  <rect x="140" y="432" width="60" height="130" fill="#16A34A"/>
  <text x="140" y="504" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 140 497)">生成层</text>
  <text x="240" y="464" font-size="14" font-weight="700" fill="#0F172A">回答是否忠实于证据</text>
  <text x="240" y="490" font-size="12" fill="#475569">Groundedness/Faithfulness · Answer Relevance · Citation Precision/Recall · 无证据回答率</text>
  <text x="240" y="516" font-size="12" fill="#475569">拒答准确率（本应拒答 / 本可回答） · 操作步骤完整性（停机、确认、回滚、安全条件）</text>
  <text x="240" y="542" font-size="11" fill="#64748B">自动评分器也可能偏差，高风险样本由领域专家抽检</text>

  <!-- 层4：端到端 -->
  <rect x="80" y="578" width="1640" height="130" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <rect x="80" y="578" width="120" height="130" rx="12" fill="#F97316"/>
  <rect x="140" y="578" width="60" height="130" fill="#F97316"/>
  <text x="140" y="650" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 140 643)">端到端层</text>
  <text x="240" y="610" font-size="14" font-weight="700" fill="#0F172A">是否解决了真实任务</text>
  <text x="240" y="636" font-size="12" fill="#475569">运维问题解决率 · 专家复核通过率 · 过期 SOP 使用率 · 拒答后转人工比例</text>
  <text x="240" y="662" font-size="12" fill="#475569">P50/P95 总时延 · token 消耗 · 单次成功任务成本 · 回答建议与实际设备状态一致性</text>
  <text x="240" y="688" font-size="11" fill="#64748B">Tool 执行轨迹不与 RAG 指标混评，由 7.5.4 节单独评测</text>

  <!-- 失败分类 -->
  <rect x="80" y="740" width="1640" height="100" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="772" font-size="14" font-weight="700" fill="#334155">失败分类比总分更有行动价值</text>
  <text x="120" y="802" font-size="12" fill="#475569">问题理解错误 / 检索不到 / 文档版本错误 / 上下文冲突 / 有证据但不忠实 / 本应拒答却给建议 —— 各自对应扩语料、改切分、调过滤、换 reranker、收紧 Prompt 等不同修复入口</text>

  <!-- Caption -->
  <text x="900" y="910" font-size="17" fill="#475569" text-anchor="middle">图7-11 RAG 评测拆为数据集、检索、生成、端到端四层，各层用独立指标定位问题；失败分类对应不同修复入口，比单一综合分数更能指导工程改进。</text>
  </svg>
</svg>
  </main>
</body>
</html>
