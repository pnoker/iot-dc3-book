<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图7-5 Function Calling 交互流程：从自然语言到设备操作</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#F8FAFC}body{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif;color:#0F172A}.figure{width:1200px;height:760px}svg{display:block}</style></head><body><main class="figure" data-figure-root><svg width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">图7-5 Function Calling 交互流程：从自然语言到设备操作</title><desc id="desc">LLM 只选择函数并生成结构化参数；ChatClient 调用业务 Tool，写操作经平台校验与用户确认后才进入设备链路。</desc><defs><marker id="q" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker><marker id="r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker></defs><rect width="1200" height="760" fill="#F8FAFC"/><circle cx="42" cy="42" r="6" fill="#2563EB"/><text x="58" y="49" font-size="24" font-weight="700">图7-5 Function Calling：从自然语言到受控设备操作</text><text x="58" y="76" fill="#475569" font-size="13">模型不执行代码；实际副作用由业务 Tool 和平台安全边界共同控制。</text><rect x="1038" y="30" width="122" height="28" rx="6" fill="#FFF" stroke="#CBD5E1"/><text x="1099" y="49" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">SEQUENCE</text><rect x="28" y="104" width="1144" height="570" rx="8" fill="#FFF" stroke="#E2E8F0"/><g font-size="14" font-weight="700" text-anchor="middle"><rect x="50" y="125" width="150" height="54" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text x="125" y="158">操作员</text><rect x="275" y="125" width="170" height="54" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text x="360" y="158">ChatClient</text><rect x="520" y="125" width="150" height="54" rx="8" fill="#FFF7ED" stroke="#F97316"/><text x="595" y="158">LLM</text><rect x="745" y="125" width="170" height="54" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text x="830" y="158">业务 Tool</text><rect x="990" y="125" width="160" height="54" rx="8" fill="#FEF2F2" stroke="#DC2626"/><text x="1070" y="151">平台安全边界</text><text x="1070" y="168" fill="#475569" font-size="11" font-weight="400">鉴权 · 校验 · Action</text></g><g stroke="#94A3B8" stroke-dasharray="6 5"><line x1="125" y1="179" x2="125" y2="625"/><line x1="360" y1="179" x2="360" y2="625"/><line x1="595" y1="179" x2="595" y2="625"/><line x1="830" y1="179" x2="830" y2="625"/><line x1="1070" y1="179" x2="1070" y2="625"/></g><g fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#q)"><line x1="125" y1="220" x2="360" y2="220"/><line x1="360" y1="275" x2="595" y2="275"/><line x1="360" y1="385" x2="830" y2="385"/><line x1="830" y1="440" x2="1070" y2="440"/><line x1="360" y1="550" x2="595" y2="550"/></g><g fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#r)"><line x1="595" y1="330" x2="360" y2="330"/><line x1="1070" y1="495" x2="830" y2="495"/><line x1="830" y1="522" x2="360" y2="522"/><line x1="595" y1="590" x2="360" y2="590"/><line x1="360" y1="620" x2="125" y2="620"/></g><g fill="#0F172A" font-size="11" text-anchor="middle"><text x="242" y="211">“将 A 区灯设为关闭”</text><text x="477" y="266">用户消息 + Tool schema</text><text x="477" y="321">结构化调用：toggleLight(A区,false)</text><text x="595" y="376">解析后调用；LLM 不执行代码</text><text x="950" y="431">主体、资源、参数与风险检查</text><text x="950" y="486">只读：执行；写入：创建待确认 Action</text><text x="595" y="513">返回待确认/执行结果</text><text x="477" y="541">将真实结果回填模型</text><text x="477" y="581">基于结果生成回复</text><text x="242" y="611">展示状态，不虚构成功</text></g><rect x="70" y="640" width="1060" height="26" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="7 5"/><text x="600" y="658" fill="#475569" font-size="11" text-anchor="middle">实时联锁与紧急控制不进入此对话链；它们继续由 PLC、边缘控制器和确定性规则承担。</text><line x1="40" y1="690" x2="1160" y2="690" stroke="#E2E8F0"/><line x1="100" y1="715" x2="132" y2="715" stroke="#2563EB" stroke-width="2" marker-end="url(#q)"/><text x="145" y="719" fill="#475569" font-size="11">请求 / 调用</text><line x1="280" y1="715" x2="312" y2="715" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5"/><text x="325" y="719" fill="#475569" font-size="11">返回 / 状态</text><text x="600" y="748" fill="#64748B" font-size="11" text-anchor="middle">图7-5 LLM 只生成函数名和参数；业务 Tool 与平台安全边界负责实际执行，高风险写入必须等待用户确认。</text></svg></main></body></html>
