<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图7-5 Function Calling 交互流程：从自然语言到设备操作</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图7-5 Function Calling 交互流程：从自然语言到设备操作</title>
  <desc id="desc">LLM 只生成函数名和参数，业务 Tool 与平台安全边界负责实际执行，高风险写入必须等待用户确认。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#DC2626"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图7-5 Function Calling 交互流程：从自然语言到设备操作</text>
  <text x="88" y="64" font-size="12" fill="#64748B">模型不执行代码；实际副作用由业务 Tool 和平台安全边界共同控制</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 五参与方 ===== -->
  <rect x="165" y="150" width="170" height="70" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="250" y="184" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">操作员</text>
  <text x="250" y="206" font-size="10" fill="#475569" text-anchor="middle">自然语言</text>

  <rect x="475" y="150" width="170" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="560" y="184" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">ChatClient</text>
  <text x="560" y="206" font-size="10" fill="#475569" text-anchor="middle">Spring AI</text>

  <rect x="785" y="150" width="170" height="70" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
  <text x="870" y="184" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">LLM</text>
  <text x="870" y="206" font-size="10" fill="#475569" text-anchor="middle">模型</text>

  <rect x="1095" y="150" width="170" height="70" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="1180" y="184" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">业务 Tool</text>
  <text x="1180" y="206" font-size="10" fill="#475569" text-anchor="middle">toggleLight</text>

  <rect x="1405" y="150" width="170" height="70" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="1490" y="184" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">平台安全边界</text>
  <text x="1490" y="206" font-size="10" fill="#475569" text-anchor="middle">鉴权 · 校验 · Action</text>

  <!-- 生命线 -->
  <line x1="250" y1="220" x2="250" y2="800" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="560" y1="220" x2="560" y2="800" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="870" y1="220" x2="870" y2="800" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="1180" y1="220" x2="1180" y2="800" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="1490" y1="220" x2="1490" y2="800" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- 1 操作员 → ChatClient -->
  <line x1="252" y1="260" x2="558" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="405" y="248" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">1 “将 A 区灯设为关闭”</text>
  <!-- 2 ChatClient → LLM -->
  <line x1="562" y1="315" x2="868" y2="315" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="715" y="303" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">2 用户消息 + Tool schema</text>
  <!-- 3 LLM → ChatClient -->
  <line x1="868" y1="370" x2="562" y2="370" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-teal)"/>
  <text x="715" y="358" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">3 结构化调用：toggleLight(A区,false)</text>
  <!-- 4 ChatClient → 业务Tool -->
  <line x1="562" y1="425" x2="1178" y2="425" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="870" y="413" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">4 解析后调用；LLM 不执行代码</text>
  <!-- 5 业务Tool → 安全边界 -->
  <line x1="1182" y1="480" x2="1488" y2="480" stroke="#F97316" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="1335" y="468" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">5 主体、资源、参数与风险检查</text>
  <!-- 6 安全边界 自循环 -->
  <rect x="1400" y="500" width="220" height="40" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="1490" y="526" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">6 只读：执行；写入：待确认 Action</text>
  <!-- 7 安全边界 → 业务Tool -->
  <line x1="1488" y1="570" x2="1182" y2="570" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-red)"/>
  <text x="1335" y="558" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">7 返回待确认 / 执行结果</text>
  <!-- 8 业务Tool → ChatClient -->
  <line x1="1178" y1="625" x2="562" y2="625" stroke="#F97316" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="870" y="613" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">8 将真实结果回填模型</text>
  <!-- 9 ChatClient → LLM -->
  <line x1="562" y1="680" x2="868" y2="680" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="715" y="668" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">9 基于结果生成回复</text>
  <!-- 10 LLM → ChatClient → 操作员 -->
  <line x1="868" y1="735" x2="562" y2="735" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-teal)"/>
  <line x1="558" y1="760" x2="252" y2="760" stroke="#475569" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="560" y="723" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">10 展示状态，不虚构成功</text>

  <!-- 说明 -->
  <text x="250" y="820" font-size="11" font-weight="600" fill="#475569">实时联锁与紧急控制不进入此对话链；它们继续由 PLC、边缘控制器和确定性规则承担。</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图7-5 LLM 只生成函数名和参数；业务 Tool 与平台安全边界负责实际执行，高风险写入必须等待用户确认。</text>
  </svg>
</svg>
  </main>
</body>
</html>
