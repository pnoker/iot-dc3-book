type: architecture
title: 图7-7 Agentic Center 当前能力与知识对齐边界
audience_takeaway: 读者应理解当前只有 @Tool、Web/HTTP 与 MCP Tools 属已实现边界，Skills 与 CLI 仅作知识对齐概念。
purpose: 区分当前已实现的 Tools、Web/HTTP 与 MCP Tools 端点，以及仅用于知识对齐的 Skills 和 CLI 概念。
layout: 左侧“当前已实现”区域包含 Agentic @Tool、Web/HTTP 对话和 MCP Tools；右侧“知识对齐（非现有功能）”区域包含 Skills 编排概念与 CLI 客户端概念，两侧用虚线关系箭头连接。
elements:
- Agentic @Tool、Web/HTTP 对话与 MCP Tools 端点
- Skills 编排概念与 CLI 客户端概念
- 当前已实现边界与知识对齐边界
relationships:
- Web/HTTP 对话 → Agentic @Tool：当前通过对话触发服务内工具
- MCP 客户端 → MCP Tools 端点：当前通过协议发现和调用网关工具
- Skills 概念 → 已实现 Tools：可作为未来编排参照，但当前未落地
- CLI 概念 → Web/HTTP 或 MCP 入口：可作为未来客户端参照，但当前未实现
render_notes: 左侧绿色实线框标“当前已实现”，右侧灰蓝虚线框标“知识对齐（非现有功能）”；禁止使用三层金字塔或未来路线措辞暗示三者均已上线。
caption:
  zh: 图7-7 当前以 Tools、Web/HTTP 对话和 MCP Tools 端点为实现边界；Skills 与 CLI 用于对齐通用 Agent 工程知识，尚不是 IoT DC3 已实现功能。
  en: Figure 7-7 The current implementation boundary covers Tools, the Web/HTTP chat, and the MCP Tools endpoint; Skills and CLI serve only to align general agent-engineering knowledge and are not yet implemented IoT DC3 features.
labels:
  en:
    图7-7 Agentic Center 当前能力与知识对齐边界: 'Figure 7-7 Agentic Center: implemented vs. knowledge-alignment boundary'
    读者应理解当前只有 @Tool、Web/HTTP 与 MCP Tools 属已实现边界，Skills 与 CLI 仅作知识对齐概念。: Only @Tool, Web/HTTP, and MCP Tools are implemented today; Skills and CLI are knowledge-alignment concepts only.
    Tools 是当前实现；Skills 与 CLI 用于对齐通用 Agent 工程概念，不代表 IoT DC3 已上线对应产品能力: Tools are implemented; Skills and CLI align general agent-engineering concepts and are not shipped IoT DC3 capabilities
    当前已实现: Currently implemented
    8 类 Tool 显式注册: 8 explicitly registered tools
    Device / Driver / PointValue 等: Device / Driver / PointValue, etc.
    Web / HTTP 对话: Web / HTTP chat
    OpenAI-compatible 接口: OpenAI-compatible API
    会话 · 消息 · 模型 Provider: Sessions · messages · model providers
    点位写 Action 确认: Point-write Action confirmation
    工具目录来自静态 OpenAPI 规格汇聚，不扫描 Agentic @Tool: Tool catalog from static OpenAPI specs, no @Tool scanning
    'capabilities: tools only · Resources / Prompts 当前未启用': 'capabilities: tools only · Resources / Prompts not enabled'
    知识对齐（非现有功能）: Knowledge alignment (not a feature)
    复合编排概念: Composite orchestration concept
    固定 Tool 顺序 + 提示模板: Fixed tool order + prompt templates
    输入输出契约 + 风险边界: I/O contracts + risk boundaries
    当前无 Skill 类型 / 注册器 / 执行器: No Skill type / registry / executor yet
    客户端形态概念: Client-form concept
    参数解析 · 认证 · 流式输出: Argument parsing · auth · streaming
    复用 HTTP 或 MCP Tools: Reuse HTTP or MCP Tools
    当前没有 dc3 agent 命令: No dc3 agent command today
    概念关系：CLI 调用服务端，Skills 编排原子 Tools: 'Concept: CLI calls the server; Skills orchestrate atomic tools'
    不复制业务逻辑 · 不绕过租户与 Action 确认: No duplicated logic · no tenant/Action bypass
    准确关系: Exact relationship
    Tools = 当前原子能力 · Skills = 知识对齐的复合编排概念 · CLI = 知识对齐的客户端形态: Tools = current atomic capabilities · Skills = knowledge-alignment orchestration concept · CLI = knowledge-alignment client form
    图7-7 左侧为当前源码可验证能力；右侧仅用于知识对齐。虚线不表示已上线，也不表示项目路线承诺。: Figure 7-7 The left side is verifiable in current source; the right side is knowledge alignment only. Dashed lines imply neither shipping nor roadmap commitment.
