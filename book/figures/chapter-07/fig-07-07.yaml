caption:
  zh: 图 7-7 展示了 Spring AI Function Calling 的完整调用链路，以“关A区灯”为例。操作员的自然语言请求首先到达 ChatClient，ChatClient 将消息连同 LightTool 的工具描述发送给 LLM。LLM 推理后返回 JSON 格式的函数调用请求，ChatClient 解析并调用对应的 @Tool 方法，将执行结果回填给 LLM 后，LLM 生成最终的自然语言回复返回给操作员。
  en: 'Figure 7-7 shows the complete call chain of Spring AI Function Calling, using "turn off the zone-A lights" as the example. The operator''s natural-language request first reaches the ChatClient, which sends the message together with the LightTool description to the LLM. After reasoning, the LLM returns a JSON function-call request; the ChatClient parses it, invokes the corresponding @Tool method, and feeds the execution result back to the LLM, which then generates the final natural-language reply for the operator.'
labels:
  en:
    图 7-7 Function Calling 交互流程：从自然语言到设备操作: 'Figure 7-7 Function Calling: from natural language to device operations'
    LLM 只生成函数名和参数，业务 Tool 与平台安全边界负责实际执行，高风险写入必须等待用户确认。: The LLM only emits function names and parameters; business tools and the platform safety boundary do the execution; high-risk writes must await user confirmation.
    模型不执行代码；实际副作用由业务 Tool 和平台安全边界共同控制: The model runs no code; side effects are controlled by tools and the platform safety boundary
    操作员: Operator
    自然语言: Natural language
    模型: Model
    业务 Tool: Business tool
    平台安全边界: Platform safety boundary
    鉴权 · 校验 · Action: Authorization · checks · Action
    1 “将 A 区灯设为关闭”: '1 "Set zone-A lights to off"'
    2 用户消息 + Tool schema: 2 User message + tool schema
    3 结构化调用：toggleLight(A区,false): '3 Structured call: toggleLight(zone A, false)'
    4 解析后调用；LLM 不执行代码: 4 Parsed then invoked; the LLM runs no code
    5 主体、资源、参数与风险检查: 5 Principal, resource, parameter & risk checks
    6 只读：执行；写入：待确认 Action: '6 Read-only: run; write: pending Action'
    7 返回待确认 / 执行结果: 7 Returns pending / executed result
    8 将真实结果回填模型: 8 Feed real results back to the model
    9 基于结果生成回复: 9 Generate reply from results
    10 展示状态，不虚构成功: 10 Show status; no faked success
    实时联锁与紧急控制不进入此对话链；它们继续由 PLC、边缘控制器和确定性规则承担。: Real-time interlocks and emergency control stay out of this chat chain, remaining with PLCs, edge controllers, and deterministic rules.
    图 7-7 LLM 只生成函数名和参数；业务 Tool 与平台安全边界负责实际执行，高风险写入必须等待用户确认。: Figure 7-7 The LLM only generates function names and parameters; business tools and the platform safety boundary perform the execution; high-risk writes must await user confirmation.
