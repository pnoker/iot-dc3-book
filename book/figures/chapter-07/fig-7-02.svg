<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="60.000" width="1152.000" height="640.000" viewBox="0 0 1800.000 1000.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <!-- ============ TITLE AREA ============ -->
  <circle cx="64" cy="42" r="6" fill="#2563EB"/>
  <text x="88" y="49" font-size="22" font-weight="700" fill="#0F172A">图7-2  Agent 架构与 ReAct 循环</text>
  <text x="88" y="73" font-size="12" fill="#64748B">Agent 四要素（LLM / 记忆 / 规划 / 工具）与 Thought → Action → Observation 闭环协作完成多步物联网任务</text>

  <rect x="1652" y="28" width="108" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1706" y="46" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">ARCHITECTURE</text>

  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0"/>

  <!-- ============ LEFT BOX : Agent 四要素 ============ -->
  <rect x="50" y="130" width="810" height="700" rx="12" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="8 4"/>
  <rect x="60" y="138" width="168" height="26" fill="#FFFFFF"/>
  <text x="72" y="157" font-size="14" font-weight="700" fill="#2563EB">① Agent 四要素</text>

  <!-- LLM ↔ capability connections (dashed, colored) -->
  <line x1="290" y1="320" x2="394" y2="421" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="312" y="368" font-size="9" fill="#7C3AED">读写</text>
  <line x1="620" y1="320" x2="524" y2="419" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="556" y="368" font-size="9" fill="#F59E0B">调用</text>
  <line x1="290" y1="688" x2="401" y2="556" stroke="#10B981" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="300" y="636" font-size="9" fill="#10B981">调用</text>

  <!-- Memory card (top-left, purple) -->
  <rect x="90" y="210" width="200" height="110" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="106" y="240" font-size="15" font-weight="700" fill="#7C3AED">记忆  Memory</text>
  <line x1="106" y1="250" x2="280" y2="250" stroke="#7C3AED" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
  <text x="106" y="272" font-size="11" fill="#475569">短期 / 长期上下文</text>
  <text x="106" y="292" font-size="9" fill="#64748B">向量库 · 会话历史</text>
  <text x="106" y="308" font-size="9" fill="#64748B">persist · recall</text>

  <!-- Planning card (top-right, orange) -->
  <rect x="620" y="210" width="200" height="110" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="636" y="240" font-size="15" font-weight="700" fill="#F59E0B">规划  Planning</text>
  <line x1="636" y1="250" x2="810" y2="250" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
  <text x="636" y="272" font-size="11" fill="#475569">任务分解 · 子目标</text>
  <text x="636" y="292" font-size="9" fill="#64748B">ReAct · 反思修正</text>
  <text x="636" y="308" font-size="9" fill="#64748B">decompose · reflect</text>

  <!-- Tools card (bottom-left, green) -->
  <rect x="90" y="688" width="200" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="106" y="718" font-size="15" font-weight="700" fill="#10B981">工具  Tools</text>
  <line x1="106" y1="728" x2="280" y2="728" stroke="#10B981" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
  <text x="106" y="750" font-size="11" fill="#475569">设备查询 · 控制</text>
  <text x="106" y="770" font-size="9" fill="#64748B">API · 函数调用</text>
  <text x="106" y="786" font-size="9" fill="#64748B">search · invoke</text>

  <!-- Callout (bottom-right) -->
  <rect x="600" y="648" width="226" height="92" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="713" y="673" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">大脑 × 能力</text>
  <text x="713" y="694" font-size="10" fill="#475569" text-anchor="middle">LLM 作为推理大脑，</text>
  <text x="713" y="711" font-size="10" fill="#475569" text-anchor="middle">按需调用记忆 / 规划 / 工具，</text>
  <text x="713" y="728" font-size="10" fill="#475569" text-anchor="middle">完成多步物联网任务</text>

  <!-- LLM core (center, blue) -->
  <circle cx="460" cy="485" r="92" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
  <circle cx="460" cy="485" r="92" fill="#2563EB" opacity="0.04"/>
  <text x="460" y="478" font-size="26" font-weight="700" fill="#2563EB" text-anchor="middle">LLM</text>
  <text x="460" y="502" font-size="11" font-weight="600" fill="#1D4ED8" text-anchor="middle">推理引擎</text>
  <text x="460" y="518" font-size="9" fill="#64748B" text-anchor="middle">Reasoning Core</text>

  <!-- ============ BRIDGE : LLM 驱动 ============ -->
  <line x1="860" y1="488" x2="950" y2="488" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <text x="905" y="480" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">LLM 驱动</text>

  <!-- ============ RIGHT BOX : ReAct 循环 ============ -->
  <rect x="950" y="130" width="810" height="700" rx="12" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="8 4"/>
  <rect x="960" y="138" width="220" height="26" fill="#FFFFFF"/>
  <text x="972" y="157" font-size="14" font-weight="700" fill="#475569">② ReAct 循环</text>

  <!-- Triangle loop arrows -->
  <!-- 1) Thought -> Action (blue) -->
  <line x1="1305" y1="290" x2="1410" y2="470" stroke="#2563EB" stroke-width="2.4" marker-end="url(#ah-blue)"/>
  <!-- 2) Action -> Observation (green) -->
  <line x1="1355" y1="510" x2="1155" y2="510" stroke="#10B981" stroke-width="2.4" marker-end="url(#ah-green)"/>
  <!-- 3) Observation -> diamond (orange) -->
  <line x1="1110" y1="550" x2="1200" y2="690" stroke="#F59E0B" stroke-width="2.4" marker-end="url(#ah-orange)"/>
  <!-- 5) diamond -> Thought : NO loop-back (gray dashed) -->
  <path d="M 1280 751 L 1280 792 L 975 792 L 975 250 L 1205 250" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <!-- 4) diamond -> Output : YES (blue, main exit) -->
  <line x1="1370" y1="698" x2="1570" y2="555" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ah-blue)"/>

  <!-- loop step badges -->
  <circle cx="1366" cy="384" r="11" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="1366" y="388" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">1</text>
  <circle cx="1255" cy="510" r="11" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <text x="1255" y="514" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">2</text>
  <circle cx="1148" cy="624" r="11" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="1148" y="628" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="middle">3</text>

  <!-- branch labels -->
  <text x="1392" y="690" font-size="12" font-weight="700" fill="#2563EB">是</text>
  <text x="1478" y="612" font-size="10" fill="#2563EB">完成 · 输出答案</text>
  <text x="1296" y="774" font-size="12" font-weight="700" fill="#64748B">否</text>
  <text x="1100" y="810" font-size="10" fill="#64748B" text-anchor="middle">未完成 · 继续迭代</text>

  <!-- Thought node (top, blue) -->
  <rect x="1205" y="210" width="150" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
  <text x="1280" y="246" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Thought  思考</text>
  <text x="1280" y="270" font-size="10" fill="#475569" text-anchor="middle">分析 · 推理下一步</text>

  <!-- Action node (bottom-right, green) -->
  <rect x="1355" y="470" width="150" height="80" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2.2"/>
  <text x="1430" y="506" font-size="15" font-weight="700" fill="#10B981" text-anchor="middle">Action  行动</text>
  <text x="1430" y="530" font-size="10" fill="#475569" text-anchor="middle">调用工具 / 设备</text>

  <!-- Observation node (bottom-left, orange) -->
  <rect x="1005" y="470" width="150" height="80" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.2"/>
  <text x="1080" y="506" font-size="15" font-weight="700" fill="#F59E0B" text-anchor="middle">Observation  观察</text>
  <text x="1080" y="530" font-size="10" fill="#475569" text-anchor="middle">读取执行结果</text>

  <!-- Decision diamond (red) -->
  <polygon points="1280,659 1368,705 1280,751 1192,705" fill="#FFF1F2" stroke="#E11D48" stroke-width="2.2"/>
  <text x="1280" y="701" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">是否完成?</text>
  <text x="1280" y="718" font-size="9" fill="#E11D48" text-anchor="middle">decision</text>

  <!-- Output node (blue) -->
  <rect x="1545" y="470" width="150" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
  <text x="1620" y="506" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">结果输出</text>
  <text x="1620" y="530" font-size="10" fill="#475569" text-anchor="middle">Final Answer</text>

  <!-- ============ LEGEND ============ -->
  <line x1="40" y1="850" x2="1760" y2="850" stroke="#E2E8F0"/>
  <text x="50" y="876" font-size="11" font-weight="700" fill="#475569">图例</text>

  <rect x="100" y="867" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="126" y="877" font-size="11" fill="#475569">主链路 / 推理</text>

  <rect x="270" y="867" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <text x="296" y="877" font-size="11" fill="#475569">行动 / 工具</text>

  <rect x="430" y="867" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="456" y="877" font-size="11" fill="#475569">观察 / 规划</text>

  <rect x="590" y="867" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="616" y="877" font-size="11" fill="#475569">记忆 / 数据</text>

  <rect x="750" y="867" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.6"/>
  <text x="776" y="877" font-size="11" fill="#475569">判断 / 分支</text>

  <line x1="918" y1="873" x2="944" y2="873" stroke="#64748B" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="952" y="877" font-size="11" fill="#475569">回退 / 异步循环</text>

  <!-- ============ CAPTION ============ -->
  <text x="900" y="950" font-size="11" fill="#94A3B8" text-anchor="middle">图7-2  Agent = LLM + 记忆 + 规划 + 工具；右侧 ReAct 循环中思考 → 行动 → 观察反复迭代，直到完成条件满足才输出最终答案，虚线为循环回退路径。</text>
  </svg>
</svg>