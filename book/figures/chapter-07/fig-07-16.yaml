type: layered
title: 图 7-16 Agent Eval：结果、轨迹、安全与代价四层
audience_takeaway: 最终状态以平台查询和命令回执为准，而非模型自述；越权、审批绕过、不可逆动作与敏感信息泄露四项为零是发布硬门槛，成本按每个成功任务核算。
purpose: 展示 Agent Eval 的四层评测结构与安全硬性阈值
visual_focus: 自上而下的四层评测结构。
design_level: layered
layout: 四层横向带（结果 / 轨迹 / 安全 / 代价），底部恢复场景说明
elements:
- 结果层：任务成功率、正确拒绝率、人工接管率、完成时限达标率
- 轨迹层：Tool/参数正确率、无效重复调用率、允许路径偏差、状态迁移正确率
- 安全层：Prompt Injection、跨租户读取、审批绕过、敏感信息回显（硬性阈值 0%）
- 代价层：P50/P95 时延、模型/Tool 调用次数、token 与成功任务成本
relationships:
- 四层自上而下：结果 → 轨迹 → 安全 → 代价，安全为发布门硬门槛
render_notes: HTML/SVG 渲染，四层纵向堆叠，蓝/绿/红/橙四色分层，左侧竖排层名。
caption:
  zh: 图 7-16 Agent Eval 从结果、轨迹、安全、代价四层评测：结果看目标状态是否达成、轨迹看过程是否合规、安全以零越权为硬门槛、代价看每成功任务的综合成本。
  en: 'Figure 7-16 Agent Eval evaluates across four layers — outcome, trajectory, safety, and cost: outcome checks whether the goal state is reached, trajectory whether the process is compliant, safety enforces zero cross-tenant violation as a hard gate, and cost measures the total cost per successful task.'
labels:
  en:
    图 7-16 Agent Eval：结果、轨迹、安全与代价四层: 'Figure 7-16 Agent Eval: outcome, trajectory, safety, cost'
    Agent 评测单位是目标-轨迹-最终状态-副作用，分结果、轨迹、安全、代价四层，安全硬性阈值为零越权。: 'Unit of eval: goal-trajectory-final state-side effects, across outcome/trajectory/safety/cost; hard threshold: zero violations'
    评测单位是“目标—轨迹—最终状态—副作用”，而非单轮文本: The unit of evaluation is goal-trajectory-final state-side effects, not a single turn
    结果层: Outcome layer
    模型说“已执行”，现场真的变了？: Model says done — did the field change?
    任务成功率 · 部分成功率 · 任务失败率与正确拒绝率: Task success · partial success · failure & correct-refusal rates
    人工接管率 · 完成时限达标率（有 SLI 约束的场景）: Takeover rate · deadline-meeting rate (SLI-bound scenes)
    判定依据来自平台状态查询、命令回执或工单，而非模型自述（防“幻觉确认”）: Judged by platform state, command receipts, or tickets — not model claims (no hallucinated confirmation)
    轨迹层: Trajectory layer
    过程是否合规、可追溯: Compliant, traceable process?
    Tool 选择正确率 · 参数正确率 · 无效或重复调用率: Tool-choice · parameter · useless/repeat-call rates
    允许路径偏差 · 状态迁移正确率（重试、验证、等待确认、人工接管）: Path deviation · state-transition correctness (retry, verify, await confirm, takeover)
    关键失败：越权 Tool、只读升级为写入、伪造 ID、重复不可逆副作用 —— 直接判 FAIL: 'Critical failures: unauthorized tools, read-escalated-to-write, forged IDs, repeated irreversible side effects — straight FAIL'
    安全层: Safety layer
    攻击者端测试是发布门的一部分: Attacker-side testing is a release gate
    Prompt Injection（直接/间接） · 跨租户读取 · 参数越界与上下文伪造 · 审批绕过: Prompt injection (direct/indirect) · cross-tenant reads · out-of-range params & forged context · approval bypass
    重放已确认动作 · 敏感信息回显 · 模型/Tool 超时 · 停止与接管: Replay of confirmed actions · sensitive-data echo · model/tool timeouts · stop & takeover
    硬性阈值：高风险写无审批执行、跨租户越权、不可逆动作自动执行、敏感信息泄露 —— 均为 0%: 'Hard thresholds: unapproved high-risk writes, cross-tenant violations, auto-executed irreversible actions, sensitive leaks — all 0%'
    代价层: Cost layer
    成功任务的综合成本: Total cost per successful task
    端到端时延 P50/P95 · 模型调用次数 · Tool 调用次数 · 人工介入次数: End-to-end P50/P95 · model calls · tool calls · human interventions
    Token 消费与货币成本 · 每个最终正确且无副作用任务的 token 消耗: Token usage & monetary cost · tokens per final correct, side-effect-free task
    分母应是“每最终成功任务”，而非“每请求”：成功任务可能经历多次调用与确认: 'Denominator: per finally-successful task, not per request — a success may span many calls and confirmations'
    评测集必须包含恢复场景: Eval sets must cover recovery
    Tool 超时 / 脏数据 / 权限不足 / 重复事件 / 中途重启 / 回执丢失 / 人工接管 / 注入越权 / 资源耗尽 / 日志审计，共十类韧性场景: Tool timeout / dirty data / missing permissions / duplicate events / mid-run restart / lost receipts / human takeover / injected privilege escalation / resource exhaustion / log audit — ten resilience scenarios
    图 7-16 Agent Eval 从结果、轨迹、安全、代价四层评测：结果看目标状态是否达成、轨迹看过程是否合规、安全以零越权为硬门槛、代价看每成功任务的综合成本。: 'Figure 7-16 Agent Eval evaluates across four layers — outcome, trajectory, safety, and cost: outcome checks whether the goal state is reached, trajectory whether the process is compliant, safety enforces zero cross-tenant violation as a hard gate, and cost measures the total cost per successful task.'
