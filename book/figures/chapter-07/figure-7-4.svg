<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PointValueTool 读写调用流程</title>
  <desc id="desc">水平泳道图：用户/LLM、PointValueTool、数据与驱动层三条泳道。读路径绿色直查直返；写路径橙色强制人工确认闸门。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="34.400" width="1152.000" height="691.200" viewBox="0 0 1800.000 1080.000" preserveAspectRatio="xMidYMid meet">
<title>PointValueTool 读写调用流程</title>
  <desc>水平泳道图：用户/LLM、PointValueTool、数据与驱动层三条泳道。读路径绿色直查直返；写路径橙色强制人工确认闸门。</desc>

  <defs>
    <marker id="ah-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#E11D48"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#64748B"/></marker>
    <marker id="ah-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#2563EB"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1080" fill="#FFFFFF"/>

  <!-- ===== Title ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="46" font-size="22" font-weight="700" fill="#0F172A">PointValueTool 读写调用流程</text>
  <text x="88" y="70" font-size="12" fill="#64748B">读路径无副作用直查直返 · 写路径强制人工确认为执行闸门</text>

  <rect x="1680" y="26" width="96" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1728" y="45" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">FLOWCHART</text>

  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Lane backgrounds ===== -->
  <rect x="40"   y="110" width="580" height="840" fill="#2563EB" opacity="0.04"/>
  <rect x="620"  y="110" width="560" height="840" fill="#F59E0B" opacity="0.04"/>
  <rect x="1180" y="110" width="580" height="840" fill="#7C3AED" opacity="0.04"/>

  <!-- lane separators -->
  <line x1="620"  y1="110" x2="620"  y2="950" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="8 4"/>
  <line x1="1180" y1="110" x2="1180" y2="950" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="8 4"/>

  <!-- ===== Lane headers ===== -->
  <rect x="200"  y="116" width="260" height="30" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="330" y="136" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">用户 / LLM</text>

  <rect x="770"  y="116" width="260" height="30" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="900" y="136" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">Agentic Center · PointValueTool</text>

  <rect x="1340" y="116" width="260" height="30" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1470" y="136" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">dc3-center-data / 驱动层</text>

  <!-- ===== READ PATH band ===== -->
  <rect x="740" y="150" width="320" height="28" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="900" y="169" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">读路径 · 无副作用（直查直返）</text>

  <!-- read boxes (lane-colored stroke by domain) -->
  <!-- R1 lane1 blue -->
  <rect x="245" y="190" width="170" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="330" y="214" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">① 用户读请求</text>
  <text x="330" y="231" font-size="10" fill="#64748B" text-anchor="middle">“读取某点位当前值”</text>

  <!-- R2 lane2 orange -->
  <rect x="815" y="190" width="170" height="50" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="900" y="214" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">② query 点位</text>
  <text x="900" y="231" font-size="10" fill="#64748B" text-anchor="middle">PointValueTool.read()</text>

  <!-- R3 lane3 purple -->
  <rect x="1385" y="190" width="170" height="50" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1470" y="214" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">③ 数据服务读取</text>
  <text x="1470" y="231" font-size="10" fill="#64748B" text-anchor="middle">dc3-center 查缓存/库</text>

  <!-- forward green arrows -->
  <line x1="415" y1="215" x2="812" y2="215" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <line x1="985" y1="215" x2="1382" y2="215" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>

  <!-- return dashed gray: R3 -> down -> left -> R4 -->
  <path d="M 1470 240 V 295 H 330 V 323" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="900" y="288" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">④ 返回点位值（同步响应）</text>

  <!-- R4 lane1 blue -->
  <rect x="245" y="325" width="170" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="330" y="349" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">⑤ 组织回复</text>
  <text x="330" y="366" font-size="10" fill="#64748B" text-anchor="middle">LLM 拼装自然语言 → 用户</text>

  <!-- band divider -->
  <line x1="40" y1="445" x2="1760" y2="445" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== WRITE PATH band ===== -->
  <rect x="740" y="460" width="320" height="28" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="900" y="479" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">写路径 · 需人工确认（强制闸门）</text>

  <!-- W1 lane1 -->
  <rect x="245" y="500" width="170" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="330" y="524" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">① 下发写指令</text>
  <text x="330" y="541" font-size="10" fill="#64748B" text-anchor="middle">“把点位 X 设为 Y”</text>

  <!-- W2 lane2 -->
  <rect x="815" y="500" width="170" height="50" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="900" y="524" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">② 参数校验</text>
  <text x="900" y="541" font-size="10" fill="#64748B" text-anchor="middle">越限 / 权限 / 类型检查</text>

  <!-- W1 -> W2 orange -->
  <line x1="415" y1="525" x2="812" y2="525" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>

  <!-- W3 lane2 -->
  <rect x="815" y="590" width="170" height="50" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="900" y="614" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">③ 生成摘要</text>
  <text x="900" y="631" font-size="10" fill="#64748B" text-anchor="middle">拟操作清单（dry-run）</text>

  <!-- W2 -> W3 vertical -->
  <line x1="900" y1="550" x2="900" y2="587" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>

  <!-- W4 lane1 -->
  <rect x="245" y="590" width="170" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="330" y="614" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">④ 返回待确认</text>
  <text x="330" y="631" font-size="10" fill="#64748B" text-anchor="middle">向用户出示拟操作摘要</text>

  <!-- W3 -> W4 (right to left) orange -->
  <line x1="812" y1="615" x2="418" y2="615" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>

  <!-- Diamond decision (red = risk gate) -->
  <polygon points="330,670 410,715 330,760 250,715" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="330" y="710" font-size="13" font-weight="700" fill="#E11D48" text-anchor="middle">用户确认?</text>
  <text x="330" y="726" font-size="10" fill="#64748B" text-anchor="middle">二次授权</text>

  <!-- W4 -> Diamond -->
  <line x1="330" y1="640" x2="330" y2="667" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>

  <!-- Cancel branch: diamond left -> C box -->
  <line x1="248" y1="715" x2="208" y2="715" stroke="#E11D48" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="228" y="704" font-size="11" font-weight="700" fill="#E11D48" text-anchor="middle">取消</text>
  <rect x="80" y="692" width="128" height="46" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="144" y="713" font-size="13" font-weight="700" fill="#E11D48" text-anchor="middle">✗ 终止</text>
  <text x="144" y="729" font-size="10" fill="#64748B" text-anchor="middle">不下发，回执取消</text>

  <!-- Confirm branch: diamond right -> W5 -->
  <line x1="412" y1="715" x2="812" y2="715" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="612" y="706" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">确认</text>

  <!-- W5 lane2 -->
  <rect x="815" y="690" width="170" height="50" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="900" y="714" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">⑤ 二次调用</text>
  <text x="900" y="731" font-size="10" fill="#64748B" text-anchor="middle">PointValueTool.write()</text>

  <!-- W6 lane3 purple -->
  <rect x="1385" y="690" width="170" height="50" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1470" y="714" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">⑥ 驱动执行</text>
  <text x="1470" y="731" font-size="10" fill="#64748B" text-anchor="middle">下发驱动层写物理设备</text>

  <!-- W5 -> W6 orange -->
  <line x1="985" y1="715" x2="1382" y2="715" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>

  <!-- success return dashed gray W6 -> R7 -->
  <path d="M 1470 740 V 805 H 330 V 833" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="900" y="798" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">⑦ 返回执行结果（同步响应）</text>

  <!-- R7 lane1 -->
  <rect x="245" y="835" width="170" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="330" y="859" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">⑧ 回执用户</text>
  <text x="330" y="876" font-size="10" fill="#64748B" text-anchor="middle">成功/失败 + 实际下发值</text>

  <!-- ===== Legend ===== -->
  <line x1="40" y1="970" x2="1760" y2="970" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="993" font-size="11" font-weight="700" fill="#475569">图例</text>

  <!-- green read -->
  <line x1="120" y1="1003" x2="150" y2="1003" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="158" y="1007" font-size="11" fill="#475569">读路径（直查直返）</text>

  <!-- orange write -->
  <line x1="330" y1="1003" x2="360" y2="1003" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
  <text x="368" y="1007" font-size="11" fill="#475569">写路径前向（需确认）</text>

  <!-- dashed return -->
  <line x1="548" y1="1003" x2="578" y2="1003" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="586" y="1007" font-size="11" fill="#475569">同步响应 / 回传</text>

  <!-- diamond -->
  <polygon points="752,995 768,1003 752,1011 736,1003" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="778" y="1007" font-size="11" fill="#475569">人工确认闸门</text>

  <!-- cancel -->
  <rect x="908" y="996" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="938" y="1007" font-size="11" fill="#475569">取消 / 终止</text>

  <!-- domain swatches -->
  <rect x="1060" y="996" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1090" y="1007" font-size="11" fill="#475569">用户/LLM 域</text>

  <rect x="1210" y="996" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1240" y="1007" font-size="11" fill="#475569">PointValueTool 域</text>

  <rect x="1380" y="996" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1410" y="1007" font-size="11" fill="#475569">数据/驱动层域</text>

  <!-- ===== Caption ===== -->
  <text x="900" y="1055" font-size="10" fill="#94A3B8" text-anchor="middle">图7-10 PointValueTool 读写调用流程：读路径一步直返，写路径以“拟操作摘要 + 用户确认”为执行闸门，确认后才下发驱动层</text>
  </svg>
</svg>