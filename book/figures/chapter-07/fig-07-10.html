<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图7-10 大模型在物联网中的角色：从感知到认知</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">图7-10 大模型在物联网中的角色：从感知到认知</title>
  <desc id="desc">规则引擎做数值判断，大模型叠加语义推理，带来自然语言穿透设备层、多模态融合与自动生成运维策略三层变化。</desc>
  <rect width="1200" height="700" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="580" viewBox="0 0 1800 950" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="950" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
  </defs>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图7-10 大模型在物联网中的角色：从感知到认知</text>
  <text x="88" y="64" font-size="12" fill="#64748B">在规则引擎之上叠加认知层 · 让机器从“检测”进化到“理解”</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 跃迁：规则引擎 → 大模型 -->
  <rect x="120" y="150" width="680" height="180" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="460" y="184" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">传统规则引擎 · 数值判断</text>
  <text x="160" y="220" font-size="13" fill="#0F172A">温度超阈值 → 告警；离线 → 通知</text>
  <text x="160" y="246" font-size="12" fill="#475569">只能处理明确定义的离散规则</text>
  <text x="160" y="278" font-size="12" fill="#64748B">“温度超限”四个字，无法理解“比昨天同期高”</text>

  <line x1="830" y1="240" x2="900" y2="240" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>

  <rect x="930" y="150" width="750" height="180" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1305" y="184" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">大模型介入 · 语义推理</text>
  <text x="970" y="220" font-size="13" fill="#0F172A">关联季节、负载、历史趋势、维修记录</text>
  <text x="970" y="246" font-size="12" fill="#475569">“负载下降时温度异常上升 → 冷却泵效率下降”</text>
  <text x="970" y="278" font-size="12" fill="#64748B">不取代规则引擎，而是在其上叠加一层认知能力</text>

  <!-- 三层变化 -->
  <text x="80" y="400" font-size="15" font-weight="700" fill="#334155">带来的三层变化</text>

  <rect x="80" y="424" width="520" height="180" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="340" y="458" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">① 自然语言穿透设备层</text>
  <text x="116" y="492" font-size="12" fill="#475569">“关掉一楼走廊灯” → 结构化候选动作</text>
  <text x="116" y="518" font-size="12" fill="#475569">经 Schema、权限、工况、风险校验</text>
  <text x="116" y="544" font-size="12" fill="#475569">副作用进入 Workflow / 人工确认后再执行</text>
  <text x="116" y="576" font-size="11" fill="#64748B">写操作创建待确认 Action，人始终在决策环内</text>

  <rect x="640" y="424" width="520" height="180" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="458" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">② 多模态融合</text>
  <text x="676" y="492" font-size="12" fill="#475569">照片里的闪烁灯模式、仪表指针位置</text>
  <text x="676" y="518" font-size="12" fill="#475569">电线烧焦的颜色都纳入推理范围</text>
  <text x="676" y="544" font-size="12" fill="#475569">大模型擅长语义推理</text>
  <text x="676" y="576" font-size="11" fill="#64748B">毫秒级实时控制仍由硬件控制器承担</text>

  <rect x="1200" y="424" width="520" height="180" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1460" y="458" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">③ 自动生成运维策略</text>
  <text x="1236" y="492" font-size="12" fill="#475569">拉取 7 天趋势、比对同期、查阅维修日志</text>
  <text x="1236" y="518" font-size="12" fill="#475569">输出带因果的诊断与处理步骤</text>
  <text x="1236" y="544" font-size="12" fill="#475569">支撑基础是工具调用能力（8 类 Tool）</text>
  <text x="1236" y="576" font-size="11" fill="#64748B">模型不具备实时数据权限，需经 Tool 获取</text>

  <!-- 分析跃迁 -->
  <rect x="80" y="650" width="1640" height="120" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="900" y="690" font-size="15" font-weight="700" fill="#16A34A" text-anchor="middle">分析能力跃迁</text>
  <text x="900" y="726" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">描述性分析（现在是多少）→ 诊断性分析（为什么高）→ 建议性分析（接下来怎么办）</text>

  <!-- Caption -->
  <text x="900" y="910" font-size="17" fill="#475569" text-anchor="middle">图7-10 大模型在规则引擎之上补上长期缺失的认知层：从数值判断跃迁到语义推理，带来自然语言穿透设备层、多模态融合与自动生成运维策略三层变化，且不取代实时控制逻辑。</text>
  </svg>
</svg>
  </main>
</body>
</html>
