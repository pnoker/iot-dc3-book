type: timeline
title: 图 7-1 AIoT 演进阶段示意
purpose: 展示 AIoT 从连接到自主决策的跃迁，突出每个阶段的核心特征与智能化水平。
audience_takeaway: AIoT 不是一蹴而就的技术堆叠，而是逐步将智能注入数据管道的系统工程。
visual_focus: 从“连接采集”到“自主决策”的主链路，以及“智能化程度曲线”的提升趋势。
design_level: conceptual
layout: 水平时间轴，从左到右标注三个阶段（示意时间范围），轴上方为三列，每列对应一个阶段。
elements:
- 列标题：连接采集、智能分析、自主决策（粗体居中）
- 特征描述框：第一阶段写“规则引擎、阈值告警、人看仪表盘”；第二阶段写“LLM + Tool-Calling、自然语言操作、人机协作”；第三阶段写“Agent 主动监测、诊断与建议、确认或经策略许可后执行”
- 智能化程度曲线：从第一阶段底部向左下斜升，到第二阶段中部，再到第三阶段顶部，渐变色箭头（灰色→蓝色）
relationships:
- 时间轴：三个阶段沿时间先后单向演进
- 特征框：每个阶段对应一组典型特征
- 智能化曲线：智能化水平随时间推移逐渐升高
regions:
- id: stage_one
  label: 连接采集（示意：约2010—2020）
  role: 核心产出是可读可查的数据
- id: stage_two
  label: 智能分析（示意：约2020—2025）
  role: 模型成为操作链路的参与者
- id: stage_three
  label: 自主决策（当前正在成形）
  role: 人类从操作员变为监督员
components:
- id: c1
  label: 连接采集
  type: edge
  subtitle: 规则引擎、阈值告警
  group: stage_one
  priority: primary
  shape: card
- id: c2
  label: 智能分析
  type: ai
  subtitle: LLM+Tool-Calling、自然语言操作
  group: stage_two
  priority: primary
  shape: card
- id: c3
  label: 自主决策
  type: ai
  subtitle: Agent主动监测、闭环执行
  group: stage_three
  priority: primary
  shape: card
- id: curve
  label: 智能化程度
  type: process
  subtitle: 灰色→蓝色渐变箭头
  group: null
  priority: normal
  shape: bus
- id: driver1
  label: 算力下沉
  type: platform
  subtitle: 边缘GPU/NPU
  group: null
  priority: supporting
  shape: decision
- id: driver2
  label: 大模型突破
  type: platform
  subtitle: LLM工具调用能力
  group: null
  priority: supporting
  shape: decision
- id: driver3
  label: 边缘智能普及
  type: edge
  subtitle: 端侧推理落地
  group: null
  priority: supporting
  shape: decision
connections:
- from: c1
  to: c2
  label: 时间演进
  style: solid
  direction: left-to-right
- from: c2
  to: c3
  label: 时间演进
  style: solid
  direction: left-to-right
- from: driver1
  to: c3
  label: 驱动力
  style: dashed
  direction: bottom-to-top
- from: driver2
  to: c3
  label: 驱动力
  style: dashed
  direction: bottom-to-top
- from: driver3
  to: c3
  label: 驱动力
  style: dashed
  direction: bottom-to-top
- from: curve
  to: c1
  label: 起点
  style: dashed
  direction: bottom-to-top
- from: curve
  to: c3
  label: 终点
  style: solid
  direction: bottom-to-top
callouts:
- 第一阶段核心是“人看仪表盘”；第二阶段模型参与操作；第三阶段 Runtime 支撑受约束执行。
- 智能化曲线是渐变连续过程，三个阶段之间没有清晰断点。
legend:
- 时间轴用实线两端箭头；特征框用圆角矩形，背景色分别为浅蓝、浅绿、浅橙；智能化曲线用贝塞尔曲线，渐变stroke。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
render_notes: 三个 .stage 水平 flex 布局，时间轴用 ::before 伪元素。特征框内可选用图标示意。智能化曲线用 SVG path。驱动力文字用 .driver 高亮。
caption:
  zh: 图 7-1 AIoT 从连接到受约束决策的演进示意。第一阶段设备上网，数据汇聚，人看仪表盘做判断；第二阶段 LLM 理解语义，通过受控工具查询设备并提出操作；第三阶段 Agent 主动监测、诊断与规划，Runtime 经策略、Workflow 或人工确认后执行，人类从逐步操作转向监督与接管。驱动因素包括算力下沉、大模型突破和边缘智能普及。
  en: Figure 7-1 The evolution of AIoT from connectivity to bounded decision-making. In stage one, devices come online and data converges while people judge from dashboards; in stage two, the LLM understands semantics and queries devices and proposes actions through controlled tools; in stage three, the AI agent proactively monitors, diagnoses, and plans while the Runtime executes after policy, workflow, or human confirmation, and humans shift from step-by-step operation to supervision and takeover. Drivers include compute moving to the edge, LLM breakthroughs, and pervasive edge intelligence.
labels:
  en:
    图 7-1 AIoT 演进阶段示意: Figure 7-1 AIoT Evolution Stages
    AIoT 从连接采集经智能分析到受约束决策逐步演进，智能化程度随时间持续升高。: From connectivity to analytics to bounded decision-making — intelligence rises over time.
    AIoT 不是一蹴而就的技术堆叠，而是逐步将智能注入数据管道的系统工程: Not a one-shot stack, but intelligence injected into data pipelines step by step
    连接采集: Connect & Collect
    阶段一 · 约 2010—2020: Stage 1 · ~2010–2020
    规则引擎 · 阈值告警: Rule engine · threshold alerts
    人看仪表盘: People read dashboards
    智能化程度：低: 'Intelligence: low'
    智能分析: Intelligent Analytics
    阶段二 · 约 2020—2025: Stage 2 · ~2020–2025
    自然语言操作 · 人机协作: Natural-language operation · human collaboration
    智能化程度：中: 'Intelligence: medium'
    受约束决策: Bounded Decision-Making
    阶段三 · 当前逐步成形: Stage 3 · taking shape now
    Agent 主动监测 · 诊断与建议: Agent monitors · diagnoses · advises
    确认或经策略许可后执行: Executed after confirmation or policy approval
    智能化程度：高（有界）: 'Intelligence: high (bounded)'
    连接: Connect
    分析: Analyze
    时间 / 能力成熟度: Time / capability maturity
    智能化程度上升: Intelligence rising
    算力下沉: Compute to the edge
    边缘 GPU / NPU: Edge GPU / NPU
    大模型突破: LLM breakthroughs
    LLM 工具调用能力: LLM tool-calling ability
    边缘智能普及: Edge intelligence spreads
    端侧推理与受控执行: On-device inference · controlled execution
    图 7-1 连接是起点，分析是跃迁，受约束决策才是面向真实现场的下一阶段。: Figure 7-1 Connectivity is the start and analytics the leap; bounded decision-making is the next stage for real-world sites.
