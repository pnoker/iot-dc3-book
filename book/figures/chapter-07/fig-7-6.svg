<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="27.200" width="1152.000" height="705.600" viewBox="0 0 1600.000 980.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1600" height="980" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="46" font-size="22" font-weight="700" fill="#0F172A">图7-6 Agentic Center 四层架构示意图</text>
  <text x="82" y="70" font-size="12" fill="#64748B">AI Agent 层叠加于 DC3 平台三层服务之上，工具调用必经鉴权，不做推理、不走旁路</text>
  <g>
    <rect x="1430" y="26" width="130" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1495" y="44" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">LAYERED · 4-TIER</text>
  </g>
  <line x1="60" y1="103" x2="1540" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Layer 1: 用户交互域 ===== -->
  <rect x="80" y="125" width="1440" height="130" rx="12" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="96" y="115" width="200" height="22" rx="4" fill="#FFFFFF"/>
  <text x="104" y="131" font-size="11" font-weight="700" fill="#64748B">用户交互域 · 对接各类客户端</text>

  <!-- Web 对话窗口 -->
  <g>
    <rect x="540" y="165" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="690" y="195" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Web 对话窗口</text>
    <text x="690" y="215" font-size="10" fill="#64748B" text-anchor="middle">平台内嵌界面</text>
    <text x="690" y="231" font-size="9" fill="#94A3B8" text-anchor="middle">/api/v3/agentic/v1/chat/completions</text>
  </g>
  <!-- 外部客户端 -->
  <g>
    <rect x="900" y="165" width="300" height="80" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="1050" y="195" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">外部客户端</text>
    <text x="1050" y="215" font-size="10" fill="#64748B" text-anchor="middle">CLI / 第三方应用</text>
    <text x="1050" y="231" font-size="9" fill="#94A3B8" text-anchor="middle">OpenAI 兼容协议</text>
  </g>

  <!-- ===== Layer 2: AI Agent域 ===== -->
  <rect x="80" y="290" width="1440" height="130" rx="12" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="96" y="280" width="250" height="22" rx="4" fill="#FFFFFF"/>
  <text x="104" y="296" font-size="11" font-weight="700" fill="#F59E0B">AI Agent 域 · 意图识别与工具调度</text>

  <!-- agentic 中心 (primary, orange) -->
  <g>
    <rect x="440" y="320" width="720" height="86" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="462" cy="340" r="5" fill="#F59E0B"/>
    <text x="800" y="349" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">agentic 中心（dc3-center-agentic）</text>
    <text x="800" y="370" font-size="11" fill="#475569" text-anchor="middle">ChatClient Bean · @Tool 工具 · MessageChatMemoryAdvisor 会话管理 · 模型路由</text>
    <text x="800" y="388" font-size="9" fill="#94A3B8" text-anchor="middle">调度层 · 本身不做模型推理</text>
  </g>

  <!-- ===== Layer 3: 平台服务域 ===== -->
  <rect x="80" y="455" width="1440" height="150" rx="12" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="96" y="445" width="220" height="22" rx="4" fill="#FFFFFF"/>
  <text x="104" y="461" font-size="11" font-weight="700" fill="#2563EB">平台服务域 · 数据与鉴权</text>

  <!-- 设备管理服务 -->
  <g>
    <rect x="150" y="495" width="340" height="88" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="320" y="525" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">设备管理服务</text>
    <text x="320" y="545" font-size="10" fill="#64748B" text-anchor="middle">dc3-center-manager</text>
    <text x="320" y="565" font-size="9" fill="#94A3B8" text-anchor="middle">设备 / 驱动 / 模板元数据</text>
  </g>
  <!-- 数据读写服务 -->
  <g>
    <rect x="630" y="495" width="340" height="88" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="800" y="525" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">数据读写服务</text>
    <text x="800" y="545" font-size="10" fill="#64748B" text-anchor="middle">dc3-center-data</text>
    <text x="800" y="565" font-size="9" fill="#94A3B8" text-anchor="middle">位号值 · 实时 / 历史读写</text>
  </g>
  <!-- 鉴权服务 -->
  <g>
    <rect x="1110" y="495" width="340" height="88" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
    <text x="1280" y="525" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">鉴权服务</text>
    <text x="1280" y="545" font-size="10" fill="#64748B" text-anchor="middle">dc3-center-auth</text>
    <text x="1280" y="565" font-size="9" fill="#94A3B8" text-anchor="middle">RBAC · 租户隔离</text>
  </g>

  <!-- ===== Layer 4: 数据设备域 ===== -->
  <rect x="80" y="640" width="1440" height="180" rx="12" fill="none" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="96" y="630" width="230" height="22" rx="4" fill="#FFFFFF"/>
  <text x="104" y="646" font-size="11" font-weight="700" fill="#7C3AED">数据设备域 · 存储与物理设备</text>

  <!-- PostgreSQL cylinder -->
  <g>
    <ellipse cx="270" cy="680" rx="120" ry="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <path d="M 150 680 L 150 760 A 120 14 0 0 0 390 760 L 390 680" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <ellipse cx="270" cy="680" rx="120" ry="14" fill="none" stroke="#7C3AED" stroke-width="2"/>
    <text x="270" y="718" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">PostgreSQL</text>
    <text x="270" y="740" font-size="10" fill="#64748B" text-anchor="middle">设备 / 用户 / 会话</text>
  </g>
  <!-- MongoDB cylinder -->
  <g>
    <ellipse cx="690" cy="680" rx="120" ry="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <path d="M 570 680 L 570 760 A 120 14 0 0 0 810 760 L 810 680" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <ellipse cx="690" cy="680" rx="120" ry="14" fill="none" stroke="#7C3AED" stroke-width="2"/>
    <text x="690" y="718" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">MongoDB</text>
    <text x="690" y="740" font-size="10" fill="#64748B" text-anchor="middle">位号时序历史</text>
  </g>
  <!-- 物理设备 (edge green) -->
  <g>
    <rect x="1090" y="685" width="320" height="80" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1250" y="715" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">物理设备</text>
    <text x="1250" y="735" font-size="10" fill="#64748B" text-anchor="middle">PLC / 传感器 / 执行器</text>
    <text x="1250" y="752" font-size="9" fill="#94A3B8" text-anchor="middle">经驱动网关接入</text>
  </g>

  <!-- ===== Connections ===== -->
  <!-- Web UI -> agentic (solid blue, HTTP/SSE 流式) -->
  <path d="M 690 245 L 690 290 L 700 320" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="600" y="282" font-size="10" fill="#2563EB" font-weight="600">HTTP / SSE 流式</text>

  <!-- 外部客户端 -> agentic (dashed gray, REST API) -->
  <path d="M 1050 245 L 1050 290 L 940 320" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1060" y="282" font-size="10" fill="#64748B" font-weight="600">REST API</text>

  <!-- agentic -> 设备管理服务 (Feign solid blue) -->
  <path d="M 560 406 L 560 460 L 320 495" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ah-blue)"/>
  <text x="370" y="438" font-size="10" fill="#2563EB" font-weight="700">Feign 调用</text>

  <!-- agentic -> 数据读写服务 (Feign solid blue, main path) -->
  <path d="M 800 406 L 800 495" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ah-blue)"/>
  <text x="812" y="452" font-size="10" fill="#2563EB" font-weight="700">Feign 调用（主链路）</text>

  <!-- agentic -> 鉴权服务 (Feign 鉴权 dashed red) -->
  <path d="M 1040 406 L 1040 460 L 1280 495" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-red)"/>
  <text x="1110" y="438" font-size="10" fill="#E11D48" font-weight="700">Feign 鉴权</text>

  <!-- 设备管理 -> PostgreSQL (JDBC solid purple) -->
  <path d="M 320 583 L 320 640 L 270 666" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="150" y="618" font-size="10" fill="#7C3AED" font-weight="600">JDBC</text>

  <!-- 数据读写 -> MongoDB (JDBC solid purple) -->
  <path d="M 800 583 L 800 640 L 690 666" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="820" y="618" font-size="10" fill="#7C3AED" font-weight="600">JDBC</text>

  <!-- 数据读写 -> 物理设备 (驱动网关 dashed green) -->
  <path d="M 880 583 L 1000 640 L 1180 685" fill="none" stroke="#10B981" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-green)"/>
  <text x="940" y="618" font-size="10" fill="#10B981" font-weight="600">驱动网关</text>

  <!-- ===== Callouts ===== -->
  <!-- Red callout: 权限校验不绕过 -->
  <g>
    <rect x="1140" y="408" width="260" height="40" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.4"/>
    <circle cx="1158" cy="428" r="5" fill="#E11D48"/>
    <text x="1170" y="425" font-size="11" font-weight="700" fill="#E11D48">权限校验不绕过 RBAC</text>
    <text x="1170" y="440" font-size="9" fill="#475569">AI 不能旁路 dc3-center-auth</text>
  </g>
  <!-- Gray callout: 推理说明 -->
  <g>
    <rect x="1180" y="332" width="240" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="1192" y="350" font-size="10" font-weight="700" fill="#334155">Agent 层不做推理</text>
    <text x="1192" y="365" font-size="9" fill="#475569">推理在远端 / 本地模型服务</text>
  </g>

  <!-- ===== Legend ===== -->
  <line x1="60" y1="845" x2="1540" y2="845" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="872" font-size="11" font-weight="700" fill="#475569">图例</text>
  <g font-size="10" fill="#475569">
    <rect x="130" y="862" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/><text x="152" y="872">AI Agent 层</text>
    <rect x="250" y="862" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="272" y="872">平台服务层</text>
    <rect x="370" y="862" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="392" y="872">数据存储</text>
    <rect x="470" y="862" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/><text x="492" y="872">物理设备 / 边缘</text>
    <rect x="620" y="862" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/><text x="642" y="872">鉴权 / 安全</text>
    <rect x="740" y="862" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="762" y="872">用户 / 外部</text>

    <line x1="880" y1="868" x2="918" y2="868" stroke="#2563EB" stroke-width="2.2"/><text x="924" y="872">同步调用（Feign / JDBC）</text>
    <line x1="1110" y1="868" x2="1148" y2="868" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4"/><text x="1154" y="872">异步 / 可选</text>
    <line x1="1260" y1="868" x2="1298" y2="868" stroke="#E11D48" stroke-width="2" stroke-dasharray="5 4"/><text x="1304" y="872">鉴权调用</text>
  </g>

  <!-- ===== Caption ===== -->
  <text x="800" y="945" font-size="10" fill="#94A3B8" text-anchor="middle">图7-6 Agentic Center 四层架构示意图。从上至下依次为用户交互层、AI Agent 层、平台服务层、数据设备层；AI Agent 层为调度层，所有数据操作经 Feign 走平台服务并经 dc3-center-auth 鉴权，不做推理、不走旁路。</text>
  </svg>
</svg>