    ? 敏感与简单查询留在本地引擎处理，复杂任务可出域走云端；换推理引擎通常只改 base-url，但按敏感度分流的策略路由仍需显式实现。
    : Sensitive and simple queries stay in the local engine; complex tasks may leave
      the site for the cloud. Switching inference engines usually means changing only
      the base-url, but policy-based routing by sensitivity still has to be implemented
      explicitly.
