- 本地推理引擎：Ollama / vLLM / LocalAI + 本地模型，青绿色块。
- 云端推理引擎：GPT-5 / Claude 4.5 等公有云服务，橙色块。
- 敏感数据边界虚线：圈住本地推理引擎及企业内部网络。
relationships:
- Agentic Center → 路由决策：请求带敏感标签或简单查询。
- 路由决策 → 本地推理引擎：数据安全路径，实线箭头。
- 路由决策 → 云端推理引擎：复杂任务路径，虚线箭头。
