type: lifecycle
title: 图7-9 IoT DC3 工业 Agent Runtime 四级演进路线
purpose: 展示 IoT DC3 从只读 Copilot、受控 Action、确定性 Workflow 到有界自治 Runtime 的渐进路线，并为每一级设置可验证的准入门槛。
audience_takeaway: 自主度不是随模型能力自然提升，而是通过权限、状态、恢复、评测和故障演练逐级获得；高风险安全联锁在所有阶段都不向通用 Agent 开放。
visual_focus: 四个成熟度阶段沿时间轴排列，每级包含能力、治理要求和晋级证据；底部红色安全基线贯穿全程，顶部显示当前 DC3 覆盖 L0 和部分 L1。
design_level: logical
layout: 1200×620 水平四阶段路线图：L0 只读 Copilot、L1 受控 Action、L2 Workflow Runtime、L3 有界自治 Runtime。阶段之间设置证据闸门；底部贯穿一条 PLC/SIS 与禁止能力红线。
elements:
- L0 只读 Copilot：会话、查询 Tool、MCP 发现、租户授权
- L1 受控 Action：风险分级、人工确认、幂等键、结果验证
- L2 Workflow Runtime：run_id、状态机、步骤编排、超时重试、补偿、人工接管
- L3 有界自治 Runtime：事件触发、调度租约、动态规划、跨系统 Skill、持续 Eval
- 证据闸门：任务成功率、越权率、重复副作用、接管成功率、恢复时间
- 安全基线：R3 动作、PLC/SIS 联锁、急停与故障保护始终不开放
- 当前定位：DC3 已具备 L0，并通过点位写 Action 覆盖 L1 的一部分
relationships:
- L0 通过只读正确性与权限隔离验证后进入 L1
- L1 通过审批、幂等和结果验证后进入 L2
- L2 通过故障恢复、补偿和人工接管演练后进入 L3
- 任一级未满足证据门槛时保持当前自主度或降级
- 安全基线贯穿所有阶段，不随成熟度提高而取消
legend:
- 绿色：当前已具备或可验证
- 蓝色：下一阶段运行时能力
- 橙色：晋级证据闸门
- 红色：永久禁止越过的控制边界
render_notes: 遵循 style.yaml 浅色技术出版风格。四阶段等宽排列，阶段间闸门不与箭头重叠。当前覆盖范围使用绿色顶部括号标记，L2/L3 使用蓝色；底部红色安全基线贯穿全图。
caption:
  zh: 图7-9 IoT DC3 工业 Agent Runtime 四级演进路线。平台先证明能安全读取，再证明能受控写入，随后补齐 Workflow 与恢复能力，最后才进入有界自治；自主度由证据获得，而不是由模型名称决定。
  en: 'Figure 7-9 The four-level evolution path of the IoT DC3 industrial AI agent Runtime. The platform first proves it can read safely, then that it can write under control, then completes workflow and recovery capabilities, and only afterward enters bounded autonomy; autonomy is earned through evidence, not decided by a model''s name.'
labels:
  en:
    图7-9 IoT DC3 工业 Agent Runtime 四级演进路线: 'Figure 7-9 IoT DC3 Industrial AI Agent Runtime: four-level roadmap'
    自主度由权限、状态、恢复与评测证据逐级获得，不由模型名称决定；安全联锁在所有阶段都不开放。: Autonomy is earned level by level through permission, state, recovery, and eval evidence — not by model name; safety interlocks never open.
    自主度由权限、状态、恢复与评测证据逐级获得，不由模型名称决定: Autonomy is earned by permission, state, recovery, and eval evidence — not model names
    当前 DC3：已具备 L0，并覆盖 L1 的部分关键链路: 'DC3 today: L0 in place, covering key parts of L1'
    L0 · 只读 Copilot: L0 · Read-Only Copilot
    先证明系统能安全看对: First prove it reads correctly
    能力: Capabilities
    会话 · 查询 Tool · MCP 发现: Sessions · query tools · MCP discovery
    设备状态解释 · 排查建议: Explain device state · suggest fixes
    证据门槛: Evidence gate
    Tool 选择与参数正确: Correct tool & parameter choice
    跨租户越权 = 0: Cross-tenant violations = 0
    当前已具备: Available today
    L1 · 受控 Action: L1 · Controlled Actions
    再证明系统能在约束下做对: Then prove correct action in bounds
    风险分级 · 人工确认: Risk tiering · human confirmation
    幂等键 · 执行后验证: Idempotency keys · post-execution checks
    无审批高风险执行 = 0: Unapproved high-risk executions = 0
    重复副作用 = 0: Duplicate side effects = 0
    点位写部分具备: Point writes partially available
    让任务可恢复、可补偿、可接管: Recoverable, compensable, takeover-ready
    run_id · 状态机 · 步骤编排: run_id · state machine · step orchestration
    超时重试 · 补偿 · 人工接管: Timeout retry · compensation · human takeover
    进程 / MQ / DB 故障恢复: Process / MQ / DB failure recovery
    副作用状态一致: Consistent side-effect state
    待建设: To build
    L3 · 有界自治 Runtime: L3 · Bounded-Autonomy Runtime
    在限定范围内持续完成任务: Sustained task completion in bounds
    事件触发 · 调度租约: Event triggers · scheduling leases
    动态规划 · 跨系统 Skill · 持续 Eval: Dynamic planning · cross-system Skills · continuous eval
    任务成功率 · 接管成功率: Task success rate · takeover success rate
    恢复时间达标: Meets recovery-time targets
    安全基线（全程贯穿）：R3 动作、PLC / SIS 联锁、急停与故障保护始终不向通用 Agent 开放: 'Safety baseline (always on): R3 actions, PLC/SIS interlocks, e-stops, and fault protection never open to general agents'
    图7-9 自主度通过权限、状态、恢复、评测与故障演练逐级获得；高风险安全联锁在所有阶段都不开放。: Figure 7-9 Autonomy is earned level by level through permissions, state, recovery, evaluation, and failure drills; high-risk safety interlocks stay closed at every stage.
