type: framework
title: 图 7-2 大模型在物联网中的角色：从感知到认知
audience_takeaway: 规则引擎继续承担秒级响应与离散事件，大模型补上语义推理、多模态理解与运维建议生成三层认知能力，实时控制逻辑不被取代。
purpose: 展示大模型对传统规则引擎的补充，突出从感知到认知的跃迁
visual_focus: 规则引擎 → 大模型的跃迁，及三层变化。
design_level: framework
layout: 上半规则引擎与大模型左右对比，下半三层变化卡片，底部分析跃迁
elements:
- 规则引擎：数值判断，只处理明确定义的离散规则
- 大模型：语义推理，关联季节、负载、历史趋势、维修记录
- 三层变化：自然语言穿透设备层（Action 确认）、多模态融合、自动生成运维策略
- 分析跃迁：描述性 → 诊断性 → 建议性
relationships:
- 规则引擎 → 大模型叠加认知层；三层变化支撑分析跃迁
render_notes: HTML/SVG 渲染，左右对比 + 三层卡片，蓝色主色，跃迁箭头居中。
caption:
  zh: 图 7-2 大模型在规则引擎之上补上长期缺失的认知层：从数值判断跃迁到语义推理，带来自然语言穿透设备层、多模态融合与自动生成运维策略三层变化，且不取代实时控制逻辑。
  en: 'Figure 7-2 The LLM supplies the long-missing cognition layer on top of the rule engine: the leap from numeric judgment to semantic reasoning brings three changes — natural language reaching the device layer, multimodal fusion, and automatically generated O&M strategies — without replacing real-time control logic.'
labels:
  en:
    图 7-2 大模型在物联网中的角色：从感知到认知: 'Figure 7-2 The LLM in IoT: from perception to cognition'
    规则引擎做数值判断，大模型叠加语义推理，带来自然语言穿透设备层、多模态融合与自动生成运维策略三层变化。: Rule engines judge numbers; the LLM adds semantic reasoning, bringing natural-language device access, multimodal fusion, and auto-generated O&M strategies.
    在规则引擎之上叠加认知层 · 让机器从“检测”进化到“理解”: A cognition layer atop the rule engine · from detecting to understanding
    传统规则引擎 · 数值判断: Traditional rule engine · numeric thresholds
    温度超阈值 → 告警；离线 → 通知: Temp over threshold → alarm; offline → notify
    只能处理明确定义的离散规则: Handles only explicitly defined rules
    “温度超限”四个字，无法理解“比昨天同期高”: 'Reads "temp high" but not "higher than yesterday"'
    大模型介入 · 语义推理: LLM steps in · semantic reasoning
    关联季节、负载、历史趋势、维修记录: Correlates season, load, trends, repair logs
    “负载下降时温度异常上升 → 冷却泵效率下降”: '"Temperature up while load drops → cooling pump losing efficiency"'
    不取代规则引擎，而是在其上叠加一层认知能力: Not replacing the rule engine — a cognition layer on top
    带来的三层变化: Three resulting changes
    ① 自然语言穿透设备层: ① Natural language reaches devices
    “关掉一楼走廊灯” → 结构化候选动作: '"Turn off the first-floor corridor lights" → structured candidate action'
    经 Schema、权限、工况、风险校验: Schema · permission · context · risk checks
    副作用进入 Workflow / 人工确认后再执行: Side effects execute after workflow / confirmation
    写操作创建待确认 Action，人始终在决策环内: Writes create pending Actions; humans stay in the loop
    ② 多模态融合: ② Multimodal fusion
    照片里的闪烁灯模式、仪表指针位置: Photo light-blink patterns, gauge positions
    电线烧焦的颜色都纳入推理范围: Scorched wire colors enter the reasoning
    大模型擅长语义推理: The LLM excels at semantic reasoning
    毫秒级实时控制仍由硬件控制器承担: Millisecond control stays on hardware controllers
    ③ 自动生成运维策略: ③ Auto-generated O&M strategies
    拉取 7 天趋势、比对同期、查阅维修日志: Pull 7-day trends, compare periods, read logs
    输出带因果的诊断与处理步骤: Output causal diagnosis & handling steps
    支撑基础是工具调用能力（8 类 Tool）: Grounded in tool calling (8 tool classes)
    模型不具备实时数据权限，需经 Tool 获取: Models lack live-data access; tools fetch it
    分析能力跃迁: The analytics leap
    描述性分析（现在是多少）→ 诊断性分析（为什么高）→ 建议性分析（接下来怎么办）: Descriptive (what is it now) → diagnostic (why is it high) → prescriptive (what next)
    图 7-2 大模型在规则引擎之上补上长期缺失的认知层：从数值判断跃迁到语义推理，带来自然语言穿透设备层、多模态融合与自动生成运维策略三层变化，且不取代实时控制逻辑。: 'Figure 7-2 The LLM supplies the long-missing cognition layer on top of the rule engine: the leap from numeric judgment to semantic reasoning brings natural-language device access, multimodal fusion, and auto-generated O&M strategies, without replacing real-time control logic.'
