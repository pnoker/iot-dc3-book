caption:
  zh: 图 7-4 RAG + Tool-Calling 联合工作流图。操作员发起任务后，LLM 先经 RAG 检索版本化 SOP，再读取平台实时状态形成操作建议；涉及写操作时仅创建待确认 Action，经用户确认并通过鉴权、参数与策略校验后，才由平台下发执行并回读状态。
  en: Figure 7-4 The combined RAG + tool-calling workflow. After the operator initiates a task, the LLM retrieves the versioned SOP via RAG and reads live platform state to draft an action proposal; any write only creates a pending Action, which the platform executes and verifies after user confirmation and authorization/parameter/policy checks.
labels:
  en:
    图 7-4 RAG + Tool-Calling 联合工作流: Figure 7-4 RAG + Tool-Calling Workflow
    RAG 提供版本化 SOP 证据，只读 Tool 获取平台状态；写入只创建待确认 Action，经用户确认与策略校验后才执行。: RAG supplies versioned SOP evidence; read-only tools fetch platform state; writes only create a pending Action, executed after user confirmation and policy checks.
    模型准备操作意图，平台确认边界决定设备写入是否发生: The model prepares intent; the platform confirmation boundary decides device writes
    证据与状态准备: Evidence & state preparation
    用户任务: User task
    重置 3 号泵: Reset Pump 3
    LLM 规划: LLM planning
    识别所需证据: Identify evidence needed
    RAG 检索: RAG retrieval
    版本化 SOP: Versioned SOP
    只读 Tool: Read-only tool
    读取平台状态: Read platform state
    形成操作建议: Draft action proposal
    证据 + 状态快照: Evidence + state snapshot
    进入受控写入边界: Enter controlled-write boundary
    受控写入: Controlled write
    创建待确认 Action: Create pending Action
    只保存参数，不执行设备写入: Save params only · no device write
    用户确认: User confirmation
    展示目标、参数与影响: Show target · params · impact
    鉴权与策略校验: Authorization & policy checks
    权限 · 参数 · 联锁边界: Permissions · params · interlocks
    控制器 / 执行点: Controller / actuator
    用户确认后才下发: Issued only after confirmation
    结果与审计：状态回读 · 全链路留痕: 'Result & audit: state read-back · full trace'
    未确认 / 校验失败：不执行，Action 保持待确认或被拒绝: 'Unconfirmed / failed checks: not executed; the Action stays pending or is rejected'
    图 7-4 RAG → 读状态 → 创建待确认 Action → 用户确认与策略校验 → 控制器执行；模型无直达设备写权限。: Figure 7-4 RAG → read state → create pending Action → user confirmation & policy checks → controller execution; the model has no direct device-write path.
