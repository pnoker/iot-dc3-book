<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }

<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图7-2 ReAct 循环在物联网 Agent 中的工作示意</title>
  <desc id="desc">读者应理解 ReAct 循环中思考、行动、观察三个环节的交替逻辑，以及完成判断与结果输出之间的关系。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">

  
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图7-2 ReAct 循环在物联网 Agent 中的工作示意</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解 ReAct 循环中思考、行动、观察三个环节的交替逻辑，以及完成判断与结果输出之间的关系。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
  <!-- 区域边界 -->
  <rect x="845" y="115" width="110" height="90" rx="6" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="850" y="130" fill="#64748B" font-size="12" font-weight="600">用户交互域</text>
  <rect x="845" y="585" width="110" height="90" rx="6" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  
  <rect x="655" y="210" width="490" height="215" rx="10" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="665" y="230" fill="#D97706" font-size="12" font-weight="600">Agent 内部循环域</text>
  
  <rect x="825" y="450" width="150" height="100" rx="6" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="835" y="468" fill="#64748B" font-size="12" font-weight="600">完成判断域</text>

  <!-- 连线（在节点之前，避免覆盖） -->
  <!-- user_input -> thought -->
  <path d="M 900 200 L 900 230" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="875" y="205" width="60" height="20" rx="4" fill="white" stroke="none"/>
  <text x="905" y="218" fill="#0F172A" font-size="11" text-anchor="middle">解析目标</text>

  <!-- thought -> action -->
  <path d="M 830 290 L 830 310 L 750 310 L 750 335" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="755" y="295" width="70" height="20" rx="4" fill="white" stroke="none"/>
  <text x="790" y="308" fill="#0F172A" font-size="11" text-anchor="middle">决定工具</text>

  <!-- action -> observation (虚线) -->
  <path d="M 820 370 L 980 370" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#bp-arrow-primary)"/>
  <rect x="865" y="355" width="70" height="20" rx="4" fill="white" stroke="none"/>
  <text x="900" y="368" fill="#0F172A" font-size="11" text-anchor="middle">返回数据</text>

  <!-- observation -> thought -->
  <path d="M 1050 335 L 1050 315 L 900 315 L 900 300" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="940" y="300" width="70" height="20" rx="4" fill="white" stroke="none"/>
  <text x="975" y="313" fill="#0F172A" font-size="11" text-anchor="middle">评估结果</text>

  <!-- thought -> done_check -->
  <path d="M 900 300 L 900 465" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="865" y="372" width="90" height="20" rx="4" fill="white" stroke="none"/>
  <text x="910" y="385" fill="#0F172A" font-size="11" text-anchor="middle">循环后检查</text>

  <!-- done_check -> thought (虚线回退) -->
  <path d="M 960 500 L 1000 500 L 1000 265 L 980 265" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#bp-arrow)"/>
  <rect x="945" y="485" width="70" height="20" rx="4" fill="white" stroke="none"/>
  <text x="980" y="498" fill="#0F172A" font-size="11" text-anchor="middle">继续循环</text>

  <!-- done_check -> final_output -->
  <path d="M 900 535 L 900 590" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="885" y="552" width="50" height="20" rx="4" fill="white" stroke="none"/>
  <text x="910" y="565" fill="#0F172A" font-size="11" text-anchor="middle">完成</text>

  <!-- 节点 -->
  <!-- 用户输入 -->
  <circle cx="900" cy="160" r="40" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="900" y="155" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">用户输入</text>
  <text x="900" y="172" fill="#64748B" font-size="11" text-anchor="middle">自然语言指令</text>

  <!-- 思考 -->
  <rect x="820" y="230" width="160" height="70" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="900" y="260" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">思考</text>
  <text x="900" y="280" fill="#475569" font-size="12" text-anchor="middle">需查设备状态</text>

  <!-- 行动 -->
  <rect x="680" y="335" width="140" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="750" y="365" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">行动</text>
  <text x="750" y="385" fill="#475569" font-size="12" text-anchor="middle">get_sensor_data()</text>

  <!-- 观察 -->
  <rect x="980" y="335" width="140" height="70" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1050" y="365" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">观察</text>
  <text x="1050" y="385" fill="#475569" font-size="12" text-anchor="middle">{temp:25, hum:60}</text>

  <!-- 是否完成 -->
  <polygon points="900,465 960,500 900,535 840,500" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="900" y="505" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">是否完成</text>
  <text x="900" y="522" fill="#64748B" font-size="11" text-anchor="middle">子任务是否完成？</text>

  <!-- 结果输出 -->
  <circle cx="900" cy="630" r="40" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="900" y="625" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">结果输出</text>
  <text x="900" y="642" fill="#64748B" font-size="11" text-anchor="middle">最终答案</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">圆形：用户交互边界</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色：AI 推理节点</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">绿色：工具调用节点</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图7-3 ReAct 循环在物联网 Agent 中的工作示意，展示自然语言指令如何通过推理-行动-观察循环完成多步任务。</text>
  </svg>
</svg>

      <div class="card"><div class="label">图表类型</div><div class="value">architecture</div></div>

      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
