<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图7-2 ReAct 循环在物联网 Agent 中的工作示意</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#F8FAFC}body{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif;color:#0F172A}.figure{width:1200px;height:620px}svg{display:block}</style></head><body><main class="figure" data-figure-root><svg width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">图7-2 ReAct 循环在物联网 Agent 中的工作示意</title><desc id="desc">Agent 在思考、行动和观察之间循环；工具由平台执行，每轮都检查完成、失败、预算和人工接管条件。</desc><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker><marker id="g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2E8F0" stroke-width=".5"/></pattern></defs><rect width="1200" height="620" fill="#F8FAFC"/><circle cx="42" cy="42" r="6" fill="#2563EB"/><text x="58" y="49" font-size="24" font-weight="700">图7-2 ReAct 循环在物联网 Agent 中的工作示意</text><text x="58" y="76" fill="#475569" font-size="13">模型决定下一步，平台执行受控 Tool；完成、失败、预算或人工接管都可终止循环。</text><rect x="1024" y="30" width="136" height="28" rx="6" fill="#FFF" stroke="#CBD5E1"/><text x="1092" y="49" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">ARCHITECTURE</text><rect x="28" y="104" width="1144" height="430" rx="8" fill="#FFF" stroke="#E2E8F0"/><rect x="29" y="105" width="1142" height="428" fill="url(#grid)"/><rect x="68" y="132" width="170" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="153" y="165" font-size="16" font-weight="700" text-anchor="middle">用户目标</text><text x="153" y="190" fill="#475569" font-size="12" text-anchor="middle">排查 1 号泵房离线</text><rect x="292" y="125" width="690" height="300" rx="14" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="8 4"/><text x="310" y="150" fill="#B45309" font-size="12" font-weight="700">Agent 循环边界</text><path d="M238 175H360" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#a)"/><path d="M525 205H650" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#a)"/><path d="M815 205V320H695" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#a)"/><path d="M530 320H430V250" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="360" y="165" width="165" height="80" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/><text x="442" y="196" font-size="16" font-weight="700" text-anchor="middle">思考</text><text x="442" y="220" fill="#475569" font-size="12" text-anchor="middle">选择下一步与 Tool</text><rect x="650" y="165" width="165" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="732" y="196" font-size="16" font-weight="700" text-anchor="middle">行动</text><text x="732" y="220" fill="#475569" font-size="12" text-anchor="middle">平台校验后执行 Tool</text><rect x="530" y="280" width="165" height="80" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/><text x="612" y="311" font-size="16" font-weight="700" text-anchor="middle">观察</text><text x="612" y="335" fill="#475569" font-size="12" text-anchor="middle">结构化结果或错误</text><polygon points="930,268 1015,320 930,372 845,320" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="930" y="313" font-size="13" font-weight="700" text-anchor="middle">继续循环？</text><text x="930" y="333" fill="#475569" font-size="11" text-anchor="middle">完成/失败/预算</text><path d="M695 320H845" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#a)"/><path d="M930 372V455H1040" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#g)"/><path d="M845 320H790V250H815" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#g)"/><text x="802" y="306" fill="#475569" font-size="11">继续</text><rect x="900" y="455" width="210" height="58" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/><text x="1005" y="480" font-size="15" font-weight="700" text-anchor="middle">输出结果或转人工</text><text x="1005" y="500" fill="#475569" font-size="11" text-anchor="middle">不虚构未执行的设备动作</text><rect x="68" y="435" width="720" height="78" rx="8" fill="#FFF" stroke="#94A3B8" stroke-dasharray="7 5"/><text x="88" y="460" font-size="12" font-weight="700">控制边界</text><text x="88" y="483" fill="#475569" font-size="11">LLM 负责目标理解与 Tool 选择；鉴权、参数校验、Action 确认、幂等和实时联锁由模型外的确定性系统承担。</text><text x="88" y="502" fill="#475569" font-size="11">工具返回空值、权限不足或达到步数预算时，循环应安全失败或转人工，不能无限重试。</text><line x1="40" y1="550" x2="1160" y2="550" stroke="#E2E8F0"/><text x="600" y="580" fill="#64748B" font-size="11" text-anchor="middle">实线表示主流程；虚线表示循环回退；菱形表示每轮必须执行的退出判断。</text><text x="600" y="607" fill="#64748B" font-size="11" text-anchor="middle">图7-2 ReAct 通过思考、行动、观察形成可干预循环，平台控制边界始终位于模型之外。</text></svg></main></body></html>
