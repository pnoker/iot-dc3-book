type: matrix
title: 图 7-14 从 Copilot 到 Agent：低自主度与高自主度对比
audience_takeaway: 低自主度下模型只组合只读 Tool，写入必须经 Action 确认；更高自主度需补齐事件触发、任务状态机、审批与补偿后才可开放，实时安全控制始终留在 PLC 与边缘控制器。
purpose: 对比 Copilot 与 Agent 两种模式的自主度边界
visual_focus: 左右并列的两种模式卡片。
design_level: matrix
layout: 左 Copilot（低自主度）、右 Agent（高自主度演进参考），底部共同安全边界
elements:
- Copilot：用户主动触发、查询与单次点位写 Action、写入等待确认、失败返回操作员处理
- Agent：事件/调度触发、多步长期任务、高风险继续确认或外部审批、运行状态与补偿接管
- 共同边界：模型可提出受控写入但不能绕过 Action；实时联锁由 PLC/边缘控制器承担
relationships:
- Copilot → Agent 自主度逐步放开，写入确认与确定性控制边界保持不变
render_notes: HTML/SVG 渲染，左右对比，蓝/绿两色，底部安全边界橙框。
caption:
  zh: 图 7-14 Copilot 是低自主度协作，模型辅助、人保留执行权；Agent 沿感知-规划-行动-反馈循环演进，当前以受控 Tool 调用和 Action 确认为边界，实时安全控制始终由确定性系统承担。
  en: 'Figure 7-14 Copilot is low-autonomy collaboration: the model assists while people retain execution authority; the AI agent evolves along the perceive-plan-act-feedback loop, currently bounded by controlled tool calls and Action confirmation, with real-time safety always carried by deterministic systems.'
labels:
  en:
    图 7-14 从 Copilot 到 Agent：低自主度与高自主度对比: 'Figure 7-14 Copilot to AI Agent: low vs. high autonomy'
    Copilot 模型辅助、人保留执行权；Agent 沿感知-规划-行动-反馈循环自主执行，当前以受控 Tool 调用为边界。: 'Copilot: the model assists, people keep execution; the AI agent loops perceive-plan-act-feedback, bounded today by controlled tool calls.'
    自主度是逐步放开的受控变量 · 实时安全控制始终由 PLC / 边缘控制器承担: Autonomy is a controlled variable released gradually · real-time safety stays with PLC / edge controllers
    Copilot 模式 · 低自主度（当前可实现）: Copilot mode · low autonomy (buildable today)
    模型负责查询、解释、生成建议，操作员保留最终判断与执行权: Model queries, explains, proposes; operator keeps final say and execution
    触发方式: Trigger
    用户主动发起对话: User-initiated conversation
    任务范围: Task scope
    已注册 Tool 的查询与单次点位写 Action: Registered-tool queries and one-shot point-write Actions
    写入控制: Write control
    点位写入等待用户确认: Point writes await user confirmation
    失败处理: On failure
    返回错误并由操作员处理: Error returned, operator handles it
    典型组合: Typical combo
    DeviceTool 查设备 + DriverTool 查驱动状态 + PointValueTool 查趋势: DeviceTool for devices + DriverTool for driver status + PointValueTool for trends
    价值：先验证模型能否稳定“看对”和“解释对”: 'Value: prove the model reliably reads and explains'
    Agent 模式 · 高自主度（演进参考）: Agent mode · high autonomy (evolution reference)
    围绕目标执行“感知—规划—行动—反馈”循环: Runs the perceive-plan-act-feedback loop toward goals
    事件或调度触发，需要新增实现: Event/schedule triggered — new build needed
    显式工作流中的多步长期任务: Multi-step long tasks in explicit workflows
    高风险与不可逆动作继续确认或接外部审批: 'High-risk / irreversible acts: confirm or external approval'
    运行状态、重试边界、补偿与人工接管: Run state, retry bounds, compensation, takeover
    待补能力: To add
    事件触发与显式工作流、场景白名单、外部审批、按动作设计补偿: Event triggers and explicit workflows, scene allowlists, external approval, per-action compensation
    不是当前已上线产品模式，需新增实现: Not a shipped product mode; needs new work
    当前安全边界（两种模式共同约束）: Current safety boundary (binds both modes)
    模型可以提出并准备受控写入，但不能绕过 Action 确认直接控制设备 · CommandTool / EventTool 当前未注册: Models may propose and stage controlled writes but cannot bypass Action confirmation to drive devices · CommandTool / EventTool not registered
    实时联锁、紧急停机、自动切换能源等确定性控制，始终由 PLC、边缘控制器或规则系统执行: Deterministic control — interlocks, e-stops, energy auto-switching — always runs on PLCs, edge controllers, or rules
    图 7-14 Copilot 是低自主度协作，模型辅助、人保留执行权；Agent 沿感知-规划-行动-反馈循环演进，当前以受控 Tool 调用和 Action 确认为边界，实时安全控制始终由确定性系统承担。: 'Figure 7-14 Copilot is low-autonomy collaboration: the model assists while people retain execution authority; the AI agent evolves along the perceive-plan-act-feedback loop, currently bounded by controlled tool calls and Action confirmation, with real-time safety always carried by deterministic systems.'
