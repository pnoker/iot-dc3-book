type: architecture
title: 图 7-3 工业 Agent Runtime 四平面架构
purpose: 建立工业 Agent Runtime 的统一概念模型，说明决策、上下文、执行与治理四个平面的职责，以及概率性推理如何经过确定性边界进入工业系统。
audience_takeaway: Agent 只是运行时中的决策主体；真正可进入生产环境的是由上下文、状态机、Workflow、Tool、权限、审批、恢复和审计共同构成的受治理 Runtime。
visual_focus: 中央主链路从任务入口依次经过上下文构建、Agent 决策、策略闸门、Workflow/Skill、Tool/MCP 和工业系统；治理平面以横向底座覆盖全链路，并突出概率性与确定性边界。
design_level: logical
layout: 1200×760 横向架构图。上部为任务入口；中部从左到右排列上下文平面、决策平面、执行平面，决策与执行之间设置醒目的确定性边界；底部为贯穿全宽的治理平面。右侧连接 IoT DC3、MES、ERP 和设备/PLC，PLC/SIS 实时联锁单独标为不可越过边界。
elements:
- 任务入口：用户意图、告警事件、定时任务
- 上下文平面：身份与租户、设备状态、会话、RAG 证据、任务记忆
- 决策平面：意图理解、规划、模型路由、完成判断
- 确定性边界：Schema 校验、策略判断、风险分级、人工确认
- 执行平面：Workflow、Skill、Tool、MCP、业务 API
- 工业系统：IoT DC3、MES/WMS/ERP、设备与 PLC
- 治理平面：任务状态机、超时重试、幂等补偿、审计 Trace、可观测性、人工接管
- 安全联锁：PLC/SIS 确定性控制，不由大模型替代
relationships:
- 任务入口触发上下文构建，再交给 Agent 生成候选计划
- 候选计划必须通过确定性边界，才可进入 Workflow、Skill 或 Tool
- MCP 用于发现和调用外部能力，不替代 Workflow、Tool 或设备协议
- 执行结果回到上下文平面，驱动验证、下一步决策或任务结束
- 治理平面记录和约束每一次状态迁移与副作用
- 高风险或不可逆动作转人工确认；实时联锁始终留在 PLC/SIS
legend:
- 蓝色：上下文与同步信息
- 紫色：概率性决策
- 青绿色：受控执行
- 橙色：策略闸门与人工确认
- 红色：不可越过的安全边界
render_notes: 遵循 style.yaml 的浅色技术出版风格，使用直角连线并先绘制连接线。四个平面边界清晰，文字以中文为主；Tool、Skill、Workflow、MCP 保留英文术语。确定性边界使用橙色竖向闸门，PLC/SIS 使用红色边界；避免线条穿过文字和卡片。
caption:
  zh: 图 7-3 工业 Agent Runtime 四平面架构。大模型负责提出候选决策，Runtime 负责把决策约束为有状态、可验证、可恢复、可审计的执行；PLC/SIS 继续承担确定性实时控制。
  en: Figure 7-3 The four-plane architecture of the industrial AI agent Runtime. The LLM proposes candidate decisions, and the Runtime constrains them into stateful, verifiable, recoverable, and auditable execution; PLC/SIS continues to carry deterministic real-time control.
labels:
  en:
    图 7-3 工业 Agent Runtime 四平面架构: Figure 7-3 Four-Plane Industrial AI Agent Runtime Architecture
    Agent 提出候选行动，Runtime 把它约束成有状态、可验证、可恢复、可审计的执行；概率性推理经确定性边界后才进入工业系统。: AI agents propose candidate actions; the Runtime constrains them into stateful, verifiable, recoverable, auditable execution — probabilistic reasoning enters industrial systems only past the deterministic boundary.
    Agent 提出候选行动，Runtime 把它约束成有状态、可验证、可恢复、可审计的执行: AI agents propose candidate actions; the Runtime constrains them into stateful, verifiable, recoverable, auditable execution
    任务入口: Task entry
    用户意图 · 告警事件 · 定时任务: User intent · alert events · scheduled jobs
    上下文平面: Context Plane
    构建可信工作集: Build a trusted working set
    身份 · 租户 · 目标范围: Identity · tenant · target scope
    设备状态 · 会话 · 任务状态: Device state · session · task state
    RAG 证据 · 领域 Memory: RAG evidence · domain memory
    只提供本次决策需要的信息: Only info needed for this decision
    决策平面: Decision Plane
    生成候选行动: Generate candidate actions
    意图理解 · 模型路由: Intent understanding · model routing
    动态规划 · 下一步选择: Dynamic planning · next-step choice
    完成判断 · 证据不足回退: Completion check · fallback on weak evidence
    概率性推理 · 不是执行许可: Probabilistic reasoning · not execution permission
    确定性边界: Deterministic Boundary
    概率性 → 确定性的闸门: 'Gate: probabilistic → deterministic'
    Schema 校验: Schema validation
    策略与权限 · 风险分级: Policy & permissions · risk tiers
    人工确认: Human confirmation
    执行平面: Execution Plane
    受控调用能力: Controlled invocation
    Workflow · 确定性步骤: Workflow · deterministic steps
    Skill · 领域能力包: Skill · domain capability packs
    Tool · MCP · 业务 API: Tool · MCP · business APIs
    原子能力产生可验证结果: Atomic calls yield verifiable results
    工业系统: Industrial Systems
    设备 · PLC: Devices · PLC
    结果回流验证: Results loop back for verification
    治理平面: Governance Plane
    贯穿每一次状态迁移与副作用: Spans every transition and side effect
    任务状态机 · run_id: Task state machine · run_id
    超时 · 重试 · 租约: Timeout · retry · leases
    幂等 · 补偿: Idempotency · compensation
    审计 Trace · 可观测性: Audit trace · observability
    人工接管: Human takeover
    回滚与恢复: Rollback & recovery
    策略评估记录: Policy evaluation records
    副作用留痕: Side effects logged
    安全联锁：PLC / SIS 确定性控制，不由大模型替代: Safety interlocks stay in PLC/SIS — not replaced by LLMs
    图 7-3 四平面把概率性推理约束成确定性执行，治理平面全程留痕，安全联锁始终独立于 Agent。: Figure 7-3 Four planes constrain probabilistic reasoning into deterministic execution, governance logs every step, and safety interlocks stay independent of the AI agent.
