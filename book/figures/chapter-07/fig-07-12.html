<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图7-12 对话记忆的三种策略</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">图7-12 对话记忆的三种策略</title>
  <desc id="desc">消息历史、摘要记忆、知识图谱记忆三种策略，由 ChatMemory 接口与 conversationId 隔离会话。</desc>
  <rect width="1200" height="640" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="520" viewBox="0 0 1800 850" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="850" fill="#FFFFFF"/>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图7-12 对话记忆的三种策略</text>
  <text x="88" y="64" font-size="12" fill="#64748B">无状态 API 与多轮交互的矛盾，由 ChatMemory 与应用层显式管理解决</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 策略1：消息历史 -->
  <rect x="80" y="150" width="520" height="360" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="80" y="150" width="520" height="48" rx="12" fill="#2563EB"/>
  <rect x="80" y="178" width="520" height="20" fill="#2563EB"/>
  <text x="340" y="182" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">消息历史</text>
  <text x="116" y="240" font-size="13" font-weight="700" fill="#0F172A">原理</text>
  <text x="116" y="268" font-size="12" fill="#475569">完整消息列表（用户 + 助手）直接</text>
  <text x="116" y="290" font-size="12" fill="#475569">附加到每次请求</text>
  <text x="116" y="328" font-size="13" font-weight="700" fill="#0F172A">适用场景</text>
  <text x="116" y="356" font-size="12" fill="#475569">短轮次对话（通常 10 轮以内），</text>
  <text x="116" y="378" font-size="12" fill="#475569">保留上下文且无信息损失</text>
  <text x="116" y="416" font-size="13" font-weight="700" fill="#0F172A">运维定位</text>
  <text x="116" y="444" font-size="12" fill="#475569">围绕有限设备和位号、轮数可控，</text>
  <text x="116" y="466" font-size="12" fill="#475569">最直接的默认选择</text>

  <!-- 策略2：摘要记忆 -->
  <rect x="640" y="150" width="520" height="360" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="640" y="150" width="520" height="48" rx="12" fill="#16A34A"/>
  <rect x="640" y="178" width="520" height="20" fill="#16A34A"/>
  <text x="900" y="182" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">摘要记忆</text>
  <text x="676" y="240" font-size="13" font-weight="700" fill="#0F172A">原理</text>
  <text x="676" y="268" font-size="12" fill="#475569">将历史压缩为一段摘要，</text>
  <text x="676" y="290" font-size="12" fill="#475569">避免 token 溢出</text>
  <text x="676" y="328" font-size="13" font-weight="700" fill="#0F172A">适用场景</text>
  <text x="676" y="356" font-size="12" fill="#475569">长轮次对话或 token 预算紧张时，</text>
  <text x="676" y="378" font-size="12" fill="#475569">需保留关键操作结果</text>
  <text x="676" y="416" font-size="13" font-weight="700" fill="#0F172A">运维定位</text>
  <text x="676" y="444" font-size="12" fill="#475569">操作类历史必须保留执行结果与状态码，</text>
  <text x="676" y="466" font-size="12" fill="#475569">避免模型重复执行相同下发指令</text>

  <!-- 策略3：知识图谱记忆 -->
  <rect x="1200" y="150" width="520" height="360" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <rect x="1200" y="150" width="520" height="48" rx="12" fill="#F97316"/>
  <rect x="1200" y="178" width="520" height="20" fill="#F97316"/>
  <text x="1460" y="182" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">知识图谱记忆</text>
  <text x="1236" y="240" font-size="13" font-weight="700" fill="#0F172A">原理</text>
  <text x="1236" y="268" font-size="12" fill="#475569">维护实体关系，仅检索相关实体</text>
  <text x="1236" y="290" font-size="12" fill="#475569">获得上下文</text>
  <text x="1236" y="328" font-size="13" font-weight="700" fill="#0F172A">适用场景</text>
  <text x="1236" y="356" font-size="12" fill="#475569">复杂推理，如追溯多台设备的</text>
  <text x="1236" y="378" font-size="12" fill="#475569">历史操作链</text>
  <text x="1236" y="416" font-size="13" font-weight="700" fill="#0F172A">运维定位</text>
  <text x="1236" y="444" font-size="12" fill="#475569">跨设备、跨会话的关联追溯，</text>
  <text x="1236" y="466" font-size="12" fill="#475569">适合复杂故障链分析</text>

  <!-- 关键实现 -->
  <rect x="80" y="550" width="1640" height="140" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="584" font-size="14" font-weight="700" fill="#334155">关键实现：MessageChatMemoryAdvisor + conversationId</text>
  <text x="120" y="616" font-size="12" fill="#475569">Advisor 每次 call 前从 ChatMemory 取出与 conversationId 关联的历史注入提示词，调用结束后再写回</text>
  <text x="120" y="642" font-size="12" fill="#475569">conversationId 是会话唯一标识，不同会话用不同 ID 隔离上下文 · 生产环境对接 Redis 跨进程共享 · 写入平台表支持会话回放与审计</text>
  <text x="120" y="668" font-size="11" fill="#64748B">工程折中：保留最近若干轮全量历史，更早历史由摘要器压缩为含关键操作结果与时间戳的结构化摘要</text>

  <!-- Caption -->
  <text x="900" y="810" font-size="17" fill="#475569" text-anchor="middle">图7-12 对话记忆有消息历史、摘要记忆、知识图谱记忆三种策略，由 ChatMemory 接口统一接入，conversationId 隔离会话，解决无状态 API 与多轮交互之间的结构性矛盾。</text>
  </svg>
</svg>
  </main>
</body>
</html>
