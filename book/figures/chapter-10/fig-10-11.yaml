    HTTP POST 请求: HTTP POST request
    工: WO
    创建维护工单: Create work order
    高优先级: High priority
    钉: Ding
    钉钉群通知: DingTalk group notice
    告警消息: Alarm message
    工单超时未关闭？: Work order timed out?
