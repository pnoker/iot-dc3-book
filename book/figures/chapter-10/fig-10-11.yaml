    图 10-11　IoT DC3平台微服务架构：物理设备经协议驱动接入，PointValue 归一化数据进入数据中心统一汇聚；规则引擎毫秒级快判，复杂上下文异步转智能中心深析，数据中心是唯一数据枢纽。: 'Figure 10-11 IoT DC3 platform microservice architecture: physical devices connect through protocol drivers; normalized PointValues converge in the data center; the rule engine decides in milliseconds while complex context goes async to the intelligence center — the data center is the sole data hub.'
