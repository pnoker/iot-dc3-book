    返回检查并继续订阅: Re-check, keep subscribing
    正常关闭: Normal close
    闭环控制要点: Closed-loop control points
    · 规则引擎订阅工单状态: · Rule engine subscribes to order status
    · 超时未关闭自动升级: · Auto-escalate if left open
    · 升级后持续跟踪状态: · Keep tracking after escalation
    · 关闭后流程终止: · Flow ends once closed
    · 形成闭环而非单向告警: · A closed loop, not one-way alarms
    并行动作互不阻塞：: 'Parallel actions never block:'
    即使 AI 推理超时，工单与通知仍照常发出: Even if AI times out, work orders and notices still fire
    工单状态回环：: 'Work order state loop:'
    持续订阅工单状态，超时升级后返回检查，直到工单关闭: Subscribes to status; escalates on timeout and re-checks until closed
    核心逻辑 · 主流程: Core logic · main flow
