type: flowchart
title: 图10-11 规则引擎告警触发与预测性维护工单闭环流程
purpose: 展示从设备温度数据流入到AI推理、工单创建、通知发出，以及工单状态回环的完整链路。
audience_takeaway: 读者应看到规则引擎在事件触发环节的可靠性价值，以及如何通过工单状态回环形成闭环控制，而非单向告警。
visual_focus: 从条件判定到三个并行动作的决策分支；工单状态回环升级路径用橙色强调。
design_level: logical
layout: 从左至右的流程图，起点为数据流入，终点为工单关闭。
elements:
- 数据流入：电机温度位号值持续更新，方形节点。
- 条件判定：温度>80°C持续10秒，菱形决策节点。
- 三个并行动作：AI推理（HTTP调用）、创建工单、钉钉通知，三个矩形节点并列。
- 工单状态回环：工单超时未关闭，触发升级路径，菱形节点。
- 升级动作：通知上级管理员，矩形节点。
- 流程终止：工单关闭，圆角矩形节点。
relationships:
- 数据流入 → 条件判定，实线箭头。
- 条件满足 → 三个并行动作，实线箭头从条件判定分出三条。
- 创建工单 → 工单状态回环，实线箭头。
- 工单状态回环：工单未关闭且持续超限 → 升级动作，虚线箭头。
- 升级动作 → 返回工单状态检查并继续订阅，直至工单关闭，虚线回环箭头。
- 工单状态回环：工单关闭 → 流程终止，实线箭头。
regions:
- id: event_detection
  label: 事件检测域
  role: 温度数据实时评估与条件判定
- id: auto_action
  label: 自动执行域
  role: AI推理、工单创建、通知分发
- id: closed_loop
  label: 闭环验证域
  role: 工单状态跟踪与升级
components:
- id: data_inflow
  label: 温度数据流入
  type: process
  subtitle: 位号持续更新
  group: event_detection
  priority: normal
  shape: card
- id: condition_check
  label: 持续超限判定
  type: decision
  subtitle: '>80°C且窗口≥10s'
  group: event_detection
  priority: primary
  shape: decision
- id: ai_inference
  label: 调用AI推理
  type: process
  subtitle: HTTP POST请求
  group: auto_action
  priority: primary
  shape: card
- id: create_work_order
  label: 创建维护工单
  type: process
  subtitle: 高优先级
  group: auto_action
  priority: primary
  shape: card
- id: send_notification
  label: 钉钉群通知
  type: process
  subtitle: 告警消息
  group: auto_action
  priority: normal
  shape: card
- id: wo_timeout_check
  label: 工单超时未关闭？
  type: decision
  subtitle: 规则引擎订阅状态
  group: closed_loop
  priority: primary
  shape: decision
- id: escalate
  label: 升级通知上级
  type: process
  subtitle: 升级告警级别
  group: closed_loop
  priority: supporting
  shape: card
- id: wo_closed
  label: 工单关闭
  type: process
  subtitle: 流程结束
  group: closed_loop
  priority: normal
  shape: card
connections:
- from: data_inflow
  to: condition_check
  label: 实时评估
  style: solid
  direction: left-to-right
- from: condition_check
  to: ai_inference
  label: 条件满足
  style: solid
  direction: bottom-to-top
- from: condition_check
  to: create_work_order
  label: 条件满足
  style: solid
  direction: left-to-right
- from: condition_check
  to: send_notification
  label: 条件满足
  style: solid
  direction: top-to-bottom
- from: create_work_order
  to: wo_timeout_check
  label: 待处理状态
  style: solid
  direction: left-to-right
- from: wo_timeout_check
  to: escalate
  label: 超时且持续超限
  style: dashed
  direction: left-to-right
- from: wo_timeout_check
  to: wo_closed
  label: 正常关闭
  style: solid
  direction: bottom-to-top
callouts:
- 三个并行动作不互相阻塞：即使AI推理超时，工单和通知仍会发出。
- 工单状态回环形成闭环控制，避免单向告警被遗忘。
legend:
- 蓝色=核心逻辑节点和主流程；橙色=闭环验证与升级路径；实线=稳定执行路径；虚线=有条件触发的升级路径。
- 菱形=决策节点；圆角矩形=流程终止节点。
visual_constraints:
- 最多7个主节点，节点标签保持简短。
- 三个并行动作节点应垂直对齐或水平均匀分布，避免连线交叉。
- 闭环升级路径使用虚线，从'创建工单'节点的右侧引出。
render_notes: 采用从左至右流程图布局，节点使用圆角矩形，决策节点使用菱形。颜色按图例对应，虚线路径使用箭头的虚线样式。底图例和出版级图注。
caption:
  zh: 图10-11 展示了从温度数据判定到AI推理、工单创建、通知发送，以及基于工单状态回环的完整闭环流程。橙色部分表示升级路径，是在等待回复超时后触发的二次决策。
  en: Figure 10-11 The complete closed loop from temperature data evaluation to AI inference, work order creation, and notification dispatch, plus the work order state loop. The orange part marks the escalation path — a second decision triggered after an acknowledgment times out.
labels:
  en:
    图10-11 规则引擎告警触发与预测性维护工单闭环流程: Figure 10-11 Rule Engine Alarm and Predictive Maintenance Work Order Closed Loop
    从设备温度数据流入到 AI 推理、工单创建、通知发出，以及工单状态回环的完整闭环链路。: The complete closed loop from temperature data inflow to AI inference, work order creation, notification dispatch, and work order state looping.
    从设备温度数据流入到 AI 推理、工单创建、通知发出，以及工单状态回环的完整闭环链路: The complete closed loop from temperature data inflow to AI inference, work order creation, notification dispatch, and work order state looping
    事件检测域 · 温度实时评估与条件判定: Event detection · live temperature checks
