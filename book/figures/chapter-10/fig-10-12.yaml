type: dataflow
title: 图 10-12 IoT DC3设备接入与数据采集数据流
audience_takeaway: 原始位号到展示曲线需三层改造:驱动归一为语义PointValue、数据中心对齐时间戳与单位、时序库按设备+位号分区。
purpose: 展示从设备注册、驱动绑定到实时上报和存储的端到端流程。
visual_focus: 从设备驱动绑定到Grafana大屏的主链路。
design_level: implementation
layout: 从左至右流向：设备层→IoT DC3驱动服务→数据中心→时序库→Grafana大屏。
elements:
- 设备层：SMT产线设备（回流焊炉、贴片机、锡膏印刷机），通过Modbus TCP输出位号值。
- 驱动服务：dc3-driver-modbus-tcp实例，轮询设备寄存器，将值归一为带语义标签的PointValue。
- 数据中心：接收PointValue流，做时间戳对齐和单位转换后写入时序库。
- 时序存储：TimescaleDB，按设备+位号分区存储。
- Grafana大屏：从TimescaleDB查询数据，按设备聚合，刷新间隔可配置（示例中设为5秒）。
relationships:
- 设备层通过Modbus TCP向驱动服务上报位号值（轮询周期可配置，示例中为2秒）。
- 驱动服务将Modbus寄存器值转成IoT DC3内部PointValue格式（含设备编号、位号、语义标签、单位、时间戳、租户ID），发往数据中心。
- 数据中心将PointValue写入TimescaleDB。
- Grafana通过PostgreSQL数据源连接TimescaleDB，按设备分组展示实时曲线。
