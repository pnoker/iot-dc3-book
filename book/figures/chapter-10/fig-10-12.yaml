caption:
  zh: 图 10-12 原始寄存器值需经驱动归一、数据中心对齐、时序库分区三层改造，才成为监控大屏上可直接消费的时序曲线。
  en: Figure 10-12 Raw register values must pass through three layers — driver normalization, Data Center alignment, and time-series partitioning — before becoming dashboard-ready curves.
labels:
  en:
    图 10-12 IoT DC3设备接入与数据采集数据流: Figure 10-12 IoT DC3 Device Access and Data Acquisition Flow
    从设备接入、驱动绑定到实时上报与存储的端到端流程：Modbus TCP 位号值 → 驱动归一为语义 PointValue → 数据中心对齐写入 → TimescaleDB 分区存储 → Grafana 大屏展示。: 'End to end from device registration and driver binding to live reporting and storage: Modbus TCP raw values → driver-normalized semantic PointValues → aligned writes in the data center → partitioned TimescaleDB storage → Grafana dashboard.'
    SMT产线设备经 Modbus TCP 上报位号值 → Modbus驱动归一为 PointValue → 数据中心对齐写入 TimescaleDB → Grafana 大屏实时展示。: SMT devices report raw values over Modbus TCP → the Modbus driver normalizes them into PointValues → the data center aligns and writes to TimescaleDB → Grafana shows live curves.
