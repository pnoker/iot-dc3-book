- 浅灰节点：前三次工业革命；蓝色高亮节点：工业4.0。
visual_constraints:
- 最多4个节点，节点标签简短，解释放入callouts。
- 工业4.0节点使用蓝色高亮，其他节点使用浅灰色。
render_notes: HTML/SVG渲染，浅色背景，时间轴箭头深色，节点圆形，工业4.0节点使用蓝色填充，其他节点浅灰，底部图例和出版级图注。不标注具体年份，仅示意时间相对位置。
caption:
  zh: 图10-1 展示了从工业化到数字化四个阶段的关键特征。阶段划分依据工业界公认的演进脉络。
  en: Figure 10-1 Key characteristics of the four stages from industrialization to digitalization. Stage divisions follow the evolution path commonly recognized in industry.
labels:
  en:
    图10-1 工业4.0发展阶段时间线: Figure 10-1 Industry 4.0 Development Timeline
    工业4.0建立在机械化、电气化和自动化基础上，并以数据驱动实现数字化与智能化跃迁。: Industry 4.0 builds on mechanization, electrification, and automation, then adds a data-driven leap to digital intelligence.
    前三次工业革命构成自动化基础；工业4.0使数据从事后记录转为实时决策要素。: The prior revolutions built automation; Industry 4.0 turns data into a real-time decision factor.
    前三次工业革命 · 自动化的演进基础: Prior revolutions · automation base
    工业4.0 · 数字化与智能化的跃迁: Industry 4.0 · digital & intelligent leap
    演进: Evolve
    范式跃迁: Paradigm shift
    工业1.0: Industry 1.0
    蒸汽机 · 机械化生产: Steam engine · mechanization
    瓦特改良蒸汽机投入纺织业: Watt's steam engine in textiles
    工业2.0: Industry 2.0
    电力 · 流水线 · 大规模生产: Power · assembly line · mass production
    福特 T 型车流水线为代表: Ford Model T assembly line
    工业3.0: Industry 3.0
    计算机 · PLC · 自动化控制: Computers · PLC · automated control
    PLC 在工业现场广泛部署: PLC deployed plant-wide
    工业4.0: Industry 4.0
    CPS · IoT · AI · 数字孪生 · 智能工厂: CPS · IoT · AI · digital twin · smart factory
    德国正式提出“工业4.0”概念为起点: Germany formally proposes 'Industry 4.0'
    工业4.0 与前三次的根本区别：数据从副产品变成了生产要素: 'Key difference: data turns from by-product into a production factor'
    浅灰节点：前三次工业革命: 'Gray nodes: first three revolutions'
    蓝色高亮节点：工业4.0: 'Blue highlight: Industry 4.0'
    图10-1 展示了从工业化到数字化四个阶段的关键特征。阶段划分依据工业界公认的演进脉络。: Figure 10-1 Key characteristics of the four stages from industrialization to digitalization; stage divisions follow the evolution path commonly recognized in industry.
