type: timeline
title: 图10-1 工业4.0发展阶段时间线
purpose: 标注前三次工业革命与工业4.0的关键特征和交汇时间点，帮助读者建立工业演进的历史脉络。
audience_takeaway: 读者应理解工业4.0不是突然出现的概念，而是在前三次工业革命（机械化、电气化、自动化）基础上的范式跃迁。
visual_focus: 四个节点从左到右依次排列，工业4.0节点用不同颜色或样式突出显示。
design_level: conceptual
layout: 单行横向时间轴，从左至右延伸。箭头下方等距放置四个圆形节点，节点内嵌白色数字1-4。
elements:
- 节点1（工业1.0）：蒸汽机示意图标，文字‘蒸汽机、机械化生产’。图注：以瓦特改良蒸汽机投入纺织业为象征起点。
- 节点2（工业2.0）：流水线示意图标，文字‘电力、流水线、大规模生产’。图注：以福特T型车流水线为代表。
- 节点3（工业3.0）：PLC机架示意图标，文字‘计算机、PLC、自动化控制’。图注：以PLC在工业现场广泛部署为标志。
- 节点4（工业4.0）：云与物联网节点示意图标，文字‘信息物理系统（CPS）、IoT、AI、数字孪生、智能工厂’。图注：以德国正式提出‘工业4.0’概念为起点。
relationships:
- 四个节点按时间顺序从左到右排列，节点之间用实线箭头连接。
