type: architecture
title: 图 10-4 三类维护策略长期运营效率对比（示意）
purpose: 对比被动、预防性和预测性维护策略在持续运营中的成本趋势与设备可用率差异，展示趋势关系而非精确数值。
audience_takeaway: 读者应理解三类维护策略在长期运行中成本与可用率的相对走势：被动维护成本快速攀升、可用率骤降；预防性维护成本周期性波动、可用率缓慢下滑；预测性维护成本逐步稳定低位、可用率几乎不衰减。
visual_focus: 从被动维护成本到预测性维护可用率的主链路，强调预测性维护的成本-可靠性平衡优势。
design_level: logical
layout: 双轴组合图。左侧纵轴为成本（条形图），右侧纵轴为设备可用率（折线图）。x轴为运行周期，象征持续运营时间跨度。
elements:
- 被动维护成本：条形图，最初较低，随后快速攀升至很高水平。
- 预防性维护成本：条形图，呈现周期性波动，每个周期中段出现高峰，低谷相对较低。
- 预测性维护成本：条形图，从初期投入逐渐下降并稳定在较低水平。
- 被动维护可用率：折线图，实线，从较高水平急剧下降至很低水平。
- 预防性维护可用率：折线图，虚线，从较高水平缓慢下降。
- 预测性维护可用率：折线图，点划线，始终保持在较高水平，仅轻微下降。
relationships:
- 被动维护成本随时间显著攀升，可用率急剧下降，形成最差的剪刀差。
- 预防性维护成本呈现周期性高点（对应计划大修），可用率缓慢下滑。
- 预测性维护成本在初期部署后逐步降低并维持低位，可用率几乎不衰减，展现最优的成本-可靠性平衡。
