callouts:
- 图例：红色条形=被动维护成本；蓝色条形=预防性维护成本；绿色条形=预测性维护成本；红色实线=被动维护可用率；蓝色虚线=预防性维护可用率；绿色点划线=预测性维护可用率。
- 本图为示意性对比，并非来自单一工厂的实际运营数据，旨在展示三种策略的成本与可用率相对趋势关系。
legend:
- 红色条形=被动维护成本；蓝色条形=预防性维护成本；绿色条形=预测性维护成本
- 红色实线=被动维护可用率；蓝色虚线=预防性维护可用率；绿色点划线=预测性维护可用率
visual_constraints:
- 所有元素使用相对趋势描述，不出现精确数值。
- 条形图高度仅表示相对大小关系，不标具体刻度。
- 折线图纵轴刻度仅标注高、中、低三个水平。
- 图例放在底部，清晰标注颜色与线型对应关系。
render_notes: 使用Web图表库（如ECharts或Highcharts）渲染，组合柱状图（主）与折线图（辅）。x轴：运行周期（1-6）。左侧y轴：年度维护成本（相对值，无刻度）。右侧y轴：设备可用率（相对值，无刻度）。折线采用不同线型（实线、虚线、点划线）以便灰度印刷区分。图表底部添加图例区域。标题明确标注“示意”。
caption:
  zh: 图 10-4 三类维护策略效率对比（示意）。本图展示三种维护策略在长期运营中的成本与可用率相对趋势：被动维护成本快速攀升、可用率骤降；预防性维护成本周期性波动、可用率缓慢下滑；预测性维护成本逐步稳定、可用率长期维持高位。
  en: 'Figure 10-4 Efficiency comparison of three maintenance strategies (illustrative). The chart shows the relative cost and availability trends of the three strategies in long-term operation: reactive maintenance cost climbs fast while availability plunges; preventive maintenance cost swings cyclically while availability slowly declines; predictive maintenance cost levels off and availability stays high over the long run.'
