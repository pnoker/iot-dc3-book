caption:
  zh: 图10-2 展示传统制造与工业4.0在关键维度上的本质差异。驱动要素和系统架构的转变是根本。
  en: Figure 10-2 The essential differences between traditional manufacturing and Industry 4.0 across key dimensions. The shifts in driving factors and system architecture are fundamental.
labels:
  en:
    图10-2 工业4.0与传统制造的核心特征对比: Figure 10-2 Industry 4.0 vs. Traditional Manufacturing
    六个维度并列比较传统制造与工业4.0，重点突出驱动要素和系统架构两个根本标尺。: 'Six dimensions compare traditional manufacturing with Industry 4.0, spotlighting the two fundamental yardsticks: driving factors and system architecture.'
    驱动要素与系统架构是根本标尺，其他差异由二者变化引发。: Driving factors and system architecture are the fundamental yardsticks; other differences follow from them.
    对比维度: Dimension
    传统制造模式: Traditional Manufacturing
    工业4.0 智能制造模式: Industry 4.0 Smart Manufacturing
    标尺1: Yardstick 1
    驱动要素: Driving Factors
    经验驱动: Experience-Driven
    师傅手感，知识高度个体化: Craft feel; knowledge stays personal
    数据驱动: Data-Driven
    实时采集、量化判断，经验显性化、可复制: Real-time capture, quantified judgment; replicable know-how
    生产方式: Production Mode
    大批量、少品种: High volume, low variety
    刚性产线难以换型: Rigid lines, slow changeover
    小批量、多品种: Low volume, high variety
    柔性产线快速换型，换型方案在数字孪生中预验证: Flexible lines, fast changeover pre-validated in the digital twin
    数据角色: Role of Data
    事后记录: After-the-Fact Records
    用于月度报表、质量追溯的问题复盘: Monthly reports, quality traceability reviews
    实时生产要素: Real-Time Production Factor
    在线采集、语义标注、流式计算，直接指导节拍与工艺调整: Online capture, semantic tags, streaming compute; guides takt and process tuning
    标尺2: Yardstick 2
    系统架构: System Architecture
    ISA-95 金字塔: ISA-95 Pyramid
    ERP/MES/SCADA/PLC 各层各自为政，数据分层串行流转: ERP/MES/SCADA/PLC silos; data hops serially across layers
    基于 CPS 的扁平化结构: Flat CPS-Based Structure
    横向集成（跨设备协同）与纵向集成（跨层级反馈）打通: Horizontal (cross-device) and vertical (cross-level) integration connected
    维护策略: Maintenance Strategy
    事后维修 / 计划预防: Reactive / scheduled preventive
    事后维修或基于日历的计划性预防维护: Reactive or calendar-based preventive maintenance
    预测性维护: Predictive Maintenance
    基于设备退化曲线与同类设备统计模型，前置规划维保窗口: Degradation curves and fleet models schedule maintenance windows ahead
    变更响应: Change Response
    停产数天换型调试: Days of downtime for changeover
    依赖资深工程师现场手动改参数: Engineers retune parameters on site
    数字孪生模拟换型: Digital twin simulates changeover
    试错在虚拟空间完成，实际停机时间大幅缩短: Trial and error in virtual space; far less real downtime
    标尺行（驱动要素、系统架构）以浅蓝底强调: Yardstick rows (drivers, architecture) tinted light blue
    图10-2 展示传统制造与工业4.0在关键维度上的本质差异。驱动要素和系统架构的转变是根本。: Figure 10-2 The essential differences between traditional manufacturing and Industry 4.0 across key dimensions; the shifts in driving factors and system architecture are fundamental.
