type: matrix
title: 图10-2 工业4.0与传统制造的核心特征对比
purpose: 通过六个维度的并列对比，直观展示传统制造与工业4.0在不同层面的根本差异，帮助读者建立辨别标准。
audience_takeaway: 读者应能明确区分传统制造（经验驱动、事后记录、刚性产线）与工业4.0（数据驱动、实时生产要素、柔性产线）的本质差异。
visual_focus: 第一行‘驱动要素’和第四行‘系统架构’是区分两种模式的根本标尺，应予以视觉强调。
design_level: conceptual
layout: 三列。左侧第1列为‘对比维度’，中间第2列为‘传统制造模式’，右侧第3列为‘工业4.0智能制造模式’。
elements:
- 行1 驱动要素：‘经验驱动：依赖老师傅长期积累的手感与直觉判断，知识高度个体化’；‘数据驱动：基于实时采集与历史建模的量化判断，经验显性化、可复制’
- 行2 生产方式：‘大批量、少品种、刚性产线难以换型’；‘小批量、多品种、柔性产线支持快速换型，换型方案在数字孪生中预验证’
- 行3 数据角色：‘事后记录：用于月度报表、质量追溯的问题复盘’；‘实时生产要素：在线采集、带语义标注、流式计算，直接指导生产节拍与工艺调整’
- 行4 系统架构：‘ISA-95金字塔结构：ERP/MES/SCADA/PLC各层各自为政，数据分层串行流转’；‘基于CPS的扁平化结构：横向集成（跨设备协同）与纵向集成（跨层级实时反馈）打通’
- 行5 维护策略：‘事后维修或基于日历的计划性预防维护’；‘预测性维护：基于设备退化曲线与同类设备统计模型，前置规划维保窗口’
- 行6 变更响应：‘停产数天用于换型调试，依赖资深工程师现场手动改参数’；‘数字孪生模拟换型过程，试错在虚拟空间完成，实际停机时间大幅缩短’
relationships:
- 六个维度按重要性自上而下排列。驱动要素和系统架构的差异是区分传统制造与工业4.0的两个核心标尺，其他四个维度的变化均由其引发。
