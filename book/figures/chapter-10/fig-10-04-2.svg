<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="175.200" width="1152.000" height="409.600" viewBox="0 0 1800.000 640.000" preserveAspectRatio="xMidYMid meet">
<defs>
<marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
<marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
</defs>
<rect x="0" y="0" width="1800" height="640" fill="#FFFFFF"/>
<circle cx="64" cy="40" r="6" fill="#2563EB"/>
<text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图10-4 预测性维护 AI 闭环</text>
<text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">原始信号经五层转换落地为维护工单，执行结果回流校准模型，飞轮闭合</text>
<rect x="1620" y="28" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="1680" y="45" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">FLOW</text>
<line x1="58" y1="103" x2="1742" y2="103" stroke="#E2E8F0" stroke-width="1"/>

<rect x="70" y="240" width="180" height="90" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<text x="160" y="280" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">采集层</text>
<text x="160" y="302" fill="#64748B" font-size="10" text-anchor="middle">振动/温度 PointValue</text>

<rect x="360" y="240" width="200" height="90" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="460" y="275" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">特征提取层</text>
<text x="460" y="296" fill="#64748B" font-size="10" text-anchor="middle">时域 RMS/峭度</text>
<text x="460" y="312" fill="#64748B" font-size="10" text-anchor="middle">频域 FFT 包络谱</text>

<rect x="670" y="240" width="200" height="90" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
<text x="770" y="275" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">健康评估层</text>
<text x="770" y="296" fill="#64748B" font-size="10" text-anchor="middle">HI 健康指标</text>
<text x="770" y="312" fill="#64748B" font-size="10" text-anchor="middle">RUL 预测 / TSFM</text>

<rect x="980" y="240" width="180" height="90" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="1070" y="280" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">决策层</text>
<text x="1070" y="302" fill="#64748B" font-size="10" text-anchor="middle">规则引擎 + 阈值</text>

<rect x="1270" y="240" width="180" height="90" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<text x="1360" y="280" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">执行层</text>
<text x="1360" y="302" fill="#64748B" font-size="10" text-anchor="middle">维护工单派发</text>

<!-- 主链路 -->
<line x1="250" y1="285" x2="356" y2="285" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="303" y="275" fill="#2563EB" font-size="9" text-anchor="middle">PointValue</text>
<line x1="560" y1="285" x2="666" y2="285" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="613" y="275" fill="#2563EB" font-size="9" text-anchor="middle">特征向量</text>
<line x1="870" y1="285" x2="976" y2="285" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="923" y="275" fill="#2563EB" font-size="9" text-anchor="middle">HI+RUL</text>
<line x1="1160" y1="285" x2="1266" y2="285" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="1213" y="275" fill="#2563EB" font-size="9" text-anchor="middle">维护工单</text>

<!-- 反馈回路（虚线加粗，执行→健康评估校准） -->
<path d="M 1360 330 L 1360 510 L 770 510 L 770 340" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ah-orange)"/>
<text x="1065" y="450" fill="#B45309" font-size="11" font-weight="600" text-anchor="middle">执行结果回流：校准 HI 阈值与 RUL 模型（飞轮闭合）</text>

<!-- 图例 -->
<line x1="58" y1="520" x2="1742" y2="520" stroke="#E2E8F0" stroke-width="1"/>
<line x1="80" y1="548" x2="116" y2="548" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
<text x="124" y="552" fill="#64748B" font-size="11" font-weight="600">主链路（数据流）</text>
<line x1="300" y1="548" x2="336" y2="548" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ah-orange)"/>
<text x="344" y="552" fill="#64748B" font-size="11" font-weight="600">反馈回路（模型校准）</text>

<text x="900" y="600" fill="#94A3B8" font-size="10" text-anchor="middle">图10-4 预测性维护五层流水线：采集→特征提取→健康评估(RUL/TSFM)→决策→执行工单；执行结果反哺校准模型，形成持续优化飞轮。</text>
  </svg>
</svg>