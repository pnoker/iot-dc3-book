type: flowchart
title: 图 10-9 预测性维护闭环数据流（示意）
purpose: 展示从设备采集到工单执行的完整数据转换路径，标注每一跳的输出格式和决策点。
audience_takeaway: 闭环中每层的职责边界与数据形态变化，工单生成不是终点而是反馈起点。
visual_focus: 从左到右的主链路（采集→特征提取→健康评估→决策→执行），以及从执行返回采集的虚线反馈回路。
design_level: implementation
layout: 从左到右流水线，五层模块串联，底部一条虚线反馈回路。
elements:
- 采集层：PLC/振动传感器 → 位号值流（PointValue）
- 特征提取层：时域（RMS、峰值、峭度）+ 频域（FFT包络谱）→ 特征向量（FeatureVector）
- 健康评估层：健康指数HI + RUL预测（天/小时），含置信区间
- 决策层：规则引擎 + 人工确认接口 → 维护建议（动作+优先级+窗口）
- 执行层：工单系统API → MES/ERP → 排程变更 → 现场执行 → 回执
relationships:
- 采集层 → 特征提取层：流式批处理，窗口大小视采样频率和故障特征频段而定
- 特征提取层 → 健康评估层：特征向量输入模型（ONNX推理）
- 健康评估层 → 决策层：HI低于预警线或RUL进入风险窗口时触发规则
- 决策层 → 执行层：通过工单API创建工单，含设备ID、措施、计划开工时间
- 执行层 → 采集层（反馈）：执行结果（已完成/未完成/备件缺货）回写设备档案
regions:
- id: edge_domain
  label: 设备与边缘域
  role: 现场异构资源边界
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
- id: intelligence_domain
  label: 智能决策域
  role: 模型、规则与Agent边界
components:
- id: acquisition
  label: 采集层
  type: edge
  subtitle: 位号值流
  group: edge_domain
  priority: primary
  shape: card
- id: feature_extract
  label: 特征提取层
  type: platform
  subtitle: 时域/频域特征
  group: platform_domain
  priority: primary
  shape: card
- id: health_estimate
  label: 健康评估层
  type: ai
  subtitle: HI+RUL概率
  group: intelligence_domain
  priority: primary
  shape: card
- id: decision
  label: 决策层
  type: ai
  subtitle: 规则+人工确认
  group: intelligence_domain
  priority: primary
  shape: decision
- id: execution
  label: 执行层
  type: platform
  subtitle: 工单API→MES
  group: platform_domain
  priority: normal
  shape: card
- id: feedback
  label: 反馈回路
  type: edge
  subtitle: 结果回写
  group: edge_domain
  priority: normal
  shape: card
connections:
- from: acquisition
  to: feature_extract
  label: PointValue
  style: solid
  direction: left-to-right
- from: feature_extract
  to: health_estimate
  label: FeatureVector
  style: solid
  direction: left-to-right
- from: health_estimate
  to: decision
  label: HI+RUL
  style: solid
  direction: left-to-right
- from: decision
  to: execution
  label: MaintenanceOrder
  style: solid
  direction: left-to-right
- from: execution
  to: feedback
  label: 结果回执
  style: dashed
  direction: left-to-right
callouts:
- 决策层的“人工确认”接口是可选项：当HI或RUL处于临界区时，先通知工程师确认再生成工单，避免误报。
- 反馈回路的价值：工单执行结果用于校准HI阈值和异常度量指标，形成持续改进的闭环。
legend:
- 蓝色：平台服务域；青绿色：设备与边缘域；橙色：AI智能决策域。
- 实线箭头：确定性数据流；虚线箭头：反馈回路。
visual_constraints:
- 节点标签用短名词；长解释放入callouts。
- 图例放在底部，不遮挡主体。
- 箭头标注数据格式缩写（PointValue、FeatureVector、HI、MaintenanceOrder）。
render_notes: HTML/SVG渲染，浅色背景，圆角矩形箭头，颜色遵循调色板约定。反馈回路用虚线加粗表示。
caption:
  zh: 图 10-9 预测性维护闭环的典型数据流（示意）：从原始振动信号到维护工单生成，经过五层转换，每层都有明确的输入输出格式和系统边界。图中阈值和窗口为示例，需根据具体设备校准。
  en: 'Figure 10-9 Typical data flow of the predictive maintenance closed loop (illustrative): from raw vibration signals to maintenance work order generation, through five transformation layers, each with explicit input/output formats and system boundaries. Thresholds and windows in the figure are examples and must be calibrated for each device.'
