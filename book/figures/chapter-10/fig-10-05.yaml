type: topology
title: 图 10-5 OPC UA地址空间树状结构
audience_takeaway: 读者应区分Variable Attributes与Property节点：NodeId、DataType、Description属于变量节点属性，仅EngineeringUnits等附加属性通过HasProperty引用。
purpose: 展示OPC UA服务端以对象模型组织的节点树结构，说明变量节点、对象节点和方法节点的层次关系。
visual_focus: 从根节点到方法节点的主链路。
design_level: logical
layout: 自上而下的树状图，根节点为Objects，下挂设备1、设备2等对象，每个对象包含变量、方法和子对象。
elements:
- 根节点：Objects，所有对象的容器。
- 设备对象：如“电机1”，包含有温度、转速、状态等变量节点。
- 变量节点：如“温度”，NodeId、DataType、Description属于Variable Attributes；EngineeringUnits等附加属性是Property节点。
- 方法节点：如“复位”，可被客户端远程调用，返回结果。
relationships:
- 根节点以Organizes引用方式包含设备对象。
- 设备对象以HasComponent引用方式包含变量节点和方法节点。
- 变量节点内建NodeId、DataType、Description等Attributes，并通过HasProperty引用EngineeringUnits等Property节点。
regions:
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
- id: edge_domain
  label: 设备与边缘域
  role: 现场异构资源边界
- id: data_domain
  label: 数据资产域
  role: 数据沉淀与治理边界
components:
- id: c1
  label: 根节点
  type: platform
  subtitle: Objects，所有对象的容器
  group: platform_domain
  priority: primary
  shape: card
- id: c2
  label: 设备对象
  type: edge
  subtitle: 如‘’，包含有温度、转速、状态等变量节点
  group: edge_domain
  priority: normal
  shape: card
- id: c3
  label: 变量节点
  type: data
  subtitle: 如‘温度’，内建NodeId、DataType、Description等Attributes
  group: data_domain
  priority: normal
  shape: database
- id: c4
  label: 方法节点
  type: platform
  subtitle: 如‘复位’，可被客户端远程调用，返回结果
  group: platform_domain
  priority: normal
  shape: card
connections:
- from: c1
  to: c2
  label: 根节点以Organizes引用方式…
  style: solid
  direction: left-to-right
- from: c2
  to: c3
  label: 设备对象以HasComponent…
  style: solid
  direction: left-to-right
- from: c3
  to: c4
  label: 变量与方法均由设备对象以HasComponent包含
  style: solid
  direction: left-to-right
callouts:
- 根节点以Organizes引用方式包含设备对象
- 设备对象以HasComponent引用方式包含变量节点和方法节点
- Variable Attributes直接属于变量节点；EngineeringUnits等Property节点通过HasProperty引用
legend:
- 蓝色框=对象节点；绿色框=变量节点；橙色框=方法节点；实线箭头=Organizes/HasComponent；虚线箭头=HasProperty。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: HTML/SVG渲染，浅色背景，矩形节点，统一12px间距，文字可读，避免重叠。
caption:
  zh: 图 10-5 OPC UA地址空间以引用组织节点；变量自身属性与通过HasProperty关联的附加属性必须区分。
  en: Figure 10-5 The OPC UA address space organizes nodes through references; a variable's own attributes must be distinguished from the additional properties linked through HasProperty.
labels:
  en:
    图 10-5 OPC UA地址空间树状结构: Figure 10-5 OPC UA Address Space Tree
    OPC UA以Organizes组织设备、以HasComponent包含变量和方法；NodeId、DataType、Description属于变量节点属性，仅EngineeringUnits等附加属性通过HasProperty引用。: OPC UA organizes devices with Organizes and contains variables and methods with HasComponent; NodeId, DataType, and Description are variable attributes; only extra properties like EngineeringUnits are referenced via HasProperty.
    NodeId、DataType、Description 是 Variable Attributes；仅 EngineeringUnits 等附加属性使用 HasProperty: NodeId, DataType, and Description are Variable Attributes; only extra properties like EngineeringUnits use HasProperty
    所有对象的容器: Container of all objects
    Organizes 组织: Organizes
    主链路: Main path
    电机1: Motor 1
    设备对象: Device object
    温度 · 转速 · 状态: Temperature · speed · status
    设备2: Device 2
    流量 · 压力: Flow · pressure
    HasComponent 包含: HasComponent
    温度: Temperature
    变量节点 · Float: Variable · Float
    转速: Speed
    变量节点 · Int: Variable · Int
    状态: Status
    变量节点 · Bool: Variable · Bool
    流量: Flow
    复位: Reset
    方法节点 · 可远程调用: Method · remotely callable
    'Description: 温度测量值': 'Description: temperature reading'
    HasProperty 引用附加属性: HasProperty → extra properties
    蓝色框=对象节点: Blue box = object node
    绿色框=变量节点: Green box = variable node
    橙色框=方法节点: Orange box = method node
    实线=HasComponent: Solid = HasComponent
    虚线=HasProperty: Dashed = HasProperty
    蓝色实线=Organizes: Blue solid = Organizes
    图 10-5 OPC UA地址空间以引用组织节点；变量自身属性与通过 HasProperty 关联的附加属性必须区分。: Figure 10-5 The OPC UA address space organizes nodes via references; a variable's own attributes must be distinguished from extra properties linked through HasProperty.
