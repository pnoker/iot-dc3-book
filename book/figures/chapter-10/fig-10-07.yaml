type: flowchart
title: 图 10-7 原始数据与清洗后数据对比
audience_takeaway: 清洗须先判异常成因:通信中断的缺失段用前向填充,电磁干扰的毛刺替换为平滑值,两类异常处理手段不同。
purpose: 展示清洗前后温度序列的变化，说明缺失填充和毛刺过滤的效果。
visual_focus: 从原始数据到清洗后数据的主链路。
design_level: implementation
layout: 上下两段折线图，上段为原始数据，下段为清洗后数据；横轴为时间，纵轴为温度值。
elements:
- 原始数据：包含一个空缺段和一个毛刺点，用红色虚线圆圈标出。
- 清洗后数据：空缺段通过前向填充补平，毛刺点被替换为平滑值。
relationships:
- 时间轴对齐，利于对比。
regions:
- id: data_domain
  label: 数据资产域
  role: 数据沉淀与治理边界
