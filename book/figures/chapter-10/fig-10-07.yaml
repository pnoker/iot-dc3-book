render_notes: HTML/SVG渲染，线条颜色使用全局配色规则，异常位置加红色标注框。
caption:
  zh: 图 10-7 某产线电机温度数据清洗前后的对比。左侧空白为通信中断导致的缺失，右侧尖峰为电磁干扰导致的毛刺。
  en: Figure 10-7 Motor temperature data from a production line before and after cleaning. The gap on the left is loss caused by a communication outage; the spike on the right is a glitch caused by electromagnetic interference.
labels:
  en:
    图 10-7 原始数据与清洗后数据对比: Figure 10-7 Raw vs. Cleaned Data
    上下对齐展示原始温度序列的缺失段和毛刺点，以及前向填充和平滑替换后的结果。: Aligned panels show the missing segment and spike in the raw temperature series, and the results after forward fill and smooth replacement.
    先标记异常成因，再选择处理方法；短时通信中断与单点电磁毛刺不能使用同一策略。: Label the root cause first, then pick the treatment; brief comms outages and single-point EMI spikes need different strategies.
    原始数据: Raw data
    包含一个空缺段和一个毛刺点: One missing segment, one spike
    温度: Temperature
    时间: Time
    通信中断 · 缺失段: Comms outage · missing segment
    电磁干扰 · 毛刺: EMI · spike
    清洗：缺失填充 + 毛刺平滑: 'Cleaning: gap fill + spike smoothing'
    清洗后数据: Cleaned data
    空缺段前向填充补平，毛刺点替换为平滑值: Gap forward-filled; spike replaced with a smooth value
    短缺失：前向填充: 'Short gap: forward fill'
    毛刺：替换为平滑值: 'Spike: replace with smooth value'
    蓝色实线：清洗后曲线: 'Blue solid: cleaned curve'
    灰色虚线：原始曲线: 'Gray dashed: raw curve'
    红色圆圈：异常位置: 'Red circle: anomaly location'
    图 10-7 某产线电机温度数据清洗前后的对比。左侧空白为通信中断导致的缺失，右侧尖峰为电磁干扰导致的毛刺。: 'Figure 10-7 Motor temperature data from a production line before and after cleaning: the left gap is loss from a communication outage; the right spike is a glitch from electromagnetic interference.'
