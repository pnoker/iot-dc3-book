- 时间轴对齐，利于对比
legend:
- 蓝色实线：清洗后曲线；灰色虚线：原始曲线；红色圆圈：异常位置。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
