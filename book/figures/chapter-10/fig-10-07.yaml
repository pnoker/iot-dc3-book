type: architecture
title: 图10-7 AI模型部署架构（从训练到边缘推理）
audience_takeaway: 读者应理解模型仓库一份模型可同时服务REST与专用推理,边缘只跑裁剪模型且仅上报结果,与云端分工避免重复工单。
purpose: 展示模型从训练环境产出、导出、部署到推理服务并接入IoT DC3平台的完整链路。
visual_focus: 从训练阶段经模型仓库到推理服务的主链路，以及边缘推理节点本地推理后上报结果到数据中心的虚线路径。
design_level: logical
layout: 从左至右三段式：训练阶段（建模平台）→ 推理阶段（服务层）→ 集成阶段（IoT DC3与边缘层）。
elements:
- 训练阶段：Jupyter/MLflow环境中导出ONNX或PMML模型文件。
- 模型仓库：存放导出的模型文件及其版本元信息。
- 推理服务：包括REST端点（Flask/FastAPI）和专用推理服务器（TensorFlow Serving / Triton），接收请求并返回预测。
- IoT DC3数据中心：存储实时位号值，供推理服务拉取。
- 边缘推理节点：在设备侧或网关侧运行精简模型，接收实时数据并输出结果。
- 规则引擎：接收推理结果，触发告警或工单。
relationships:
- 训练阶段导出模型文件存入模型仓库，实线箭头。
- 推理服务从模型仓库加载模型版本，实线箭头。
- IoT DC3数据中心通过消息队列/API向推理服务推送或提供实时数据，虚线箭头。
- 推理服务将预测结果写回IoT DC3数据中心或直接推送给规则引擎，虚线箭头。
- 边缘推理节点本地推理后上报结果到数据中心，虚线箭头。
