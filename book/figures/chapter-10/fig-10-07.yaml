callouts:
- 模型仓库可同时服务多个推理服务，避免重复部署。
- 边缘推理节点与云端推理服务应避免对同一设备发出重复工单。
legend:
- 蓝色=IoT DC3平台服务层；青绿色=边缘与设备侧；橙色=AI模型与推理能力；灰色=模型仓库与外部依赖。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: HTML/SVG渲染，浅色背景，三段式布局。训练阶段使用橙色块，推理服务使用蓝色块，边缘层使用青绿色块。数据流使用带标签的虚线箭头。
caption:
  zh: 图10-7 AI模型部署架构：从训练环境到工业物联网平台的完整链路，涉及模型导出、推理服务化和与IoT DC3的集成。
  en: 'Figure 10-7 AI model deployment architecture: the complete chain from the training environment to the industrial IoT platform, covering model export, model serving, and integration with IoT DC3.'
labels:
  en:
    图10-7 AI模型部署架构（从训练到边缘推理）: Figure 10-7 AI Model Deployment Architecture (Training to Edge Inference)
    模型仓库中的同一版本可供 REST 与专用推理服务加载；边缘仅运行裁剪模型并上报结果，需避免与平台推理产生重复工单。: The same registry version serves both REST and dedicated inference; the edge runs only a pruned model and reports results, avoiding duplicate work orders with the platform.
    模型训练域: Model Training Domain
    模型推理域: Model Inference Domain
    IoT平台域: IoT Platform Domain
    边缘推理域: Edge Inference Domain
    导出: Export
    加载: Load
    上下文输入: Context input
    预测结果: Predictions
    上报结果: Report results
    结果: Results
    建模与导出: Modeling & Export
    模型仓库: Model Registry
    REST端点: REST Endpoint
    专用推理: Dedicated Inference
    IoT DC3数据: IoT DC3 Data
    时序 / 状态: Time-series / State
    规则引擎: Rule Engine
    告警 / 工单: Alarms / Work Orders
    边缘推理: Edge Inference
    裁剪模型: Pruned model
    一份模型，多种服务形态: One model, many serving forms
    模型仓库统一版本，REST 与专用推理服务按部署需要分别加载。: The registry versions once; REST and dedicated servers load per deployment needs.
    边缘与平台去重: Edge–platform dedup
    同一设备、同一窗口只允许一个工单决策源，边缘仅上报结果。: One device, one window, one decision source; the edge only reports results.
    蓝=平台服务　青绿=边缘推理　橙=模型与推理　灰=模型仓库: Blue=platform · teal=edge inference · orange=model & inference · gray=registry
    实线=模型制品流　虚线=实时上下文或推理结果: Solid=model artifacts · dashed=real-time context or results
    图10-7 AI模型部署架构：模型由训练环境导出并进入版本仓库，平台推理服务消费实时上下文，边缘节点仅上报本地推理结果，最终由规则引擎统一触发告警或工单。: 'Figure 10-7 AI model deployment architecture: models are exported from training into a versioned registry, platform inference consumes real-time context, edge nodes only report local results, and the rule engine triggers alarms or work orders.'
