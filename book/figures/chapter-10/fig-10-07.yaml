  group: data_domain
  priority: primary
  shape: database
- id: c2
  label: 清洗后数据
  type: data
  subtitle: 空缺段通过前向填充补平，毛刺点被替换为平滑值
  group: data_domain
  priority: normal
  shape: database
connections:
