type: architecture
title: 图 10-3 数字孪生五维模型架构图
audience_takeaway: 连接层是数字孪生枢纽：传感器值经 CN 上行，获准指令经治理边界下行；模型输出只有经过验证、评测和受控发布，才能沉淀为可复用知识。
purpose: 展示数字孪生五个核心维度及其数据、知识与受控行动流，说明 CPS 的同步机制和确定性执行边界
visual_focus: 从PE到Data & Service的主链路。
design_level: logical
layout: 中心式五边形布局，以“连接层”为轴心，左右两侧对称放置“物理实体”和“虚拟模型”，“数据与服务”与“知识”位于顶部两个角落，连接线标识双向互动关系
elements:
- PE（物理实体）
- VM（虚拟模型）
- CN（连接层）
- Data & Service（数据与服务）
- Knowledge（知识）
relationships:
- PE → CN（设备状态、传感器值、事件）
- CN → VM（归一化位号值（PointValue））
- VM → CN（预测结果、参数调整候选）
- CN → PE（获准设备写指令、参数更新）
- VM → Knowledge（模型输出、异常模式）
- Knowledge → Data & Service（规则参数、故障案例）
