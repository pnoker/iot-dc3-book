- VM 向 Knowledge 和 Data & Service 的知识沉淀路径
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: 使用SVG绘制，物理实体与虚拟模型使用蓝色/绿色色系，连接层使用橙色居中，数据与服务与知识使用紫色系。双向箭头使用不同颜色区分数据流与控制流。底部添加图注，附一句话说明：五维模型的核心是连接层——它决定了数字孪生的实时性与可靠性。
caption:
  zh: 图 10-3 五维模型架构图。连接层（CN）承载物理实体与虚拟模型之间的状态同步和获准指令；同步精度、时延与可达性须由目标部署验证。模型输出经验证、评测和受控发布后，才可沉淀为服务业务的知识。
  en: 'Figure 10-3 shows the five-dimension architecture. The connection layer (CN) carries state synchronization and approved commands between the physical entity and virtual model; synchronization accuracy, latency, and reachability require validation in the target deployment. Model output becomes reusable business knowledge only after validation, evaluation, and controlled release.'
labels:
  en:
    图 10-3 数字孪生五维模型架构图: Figure 10-3 Five-Dimension Digital Twin Architecture
    连接层连接物理实体与虚拟模型，承载上行数据和受控下行指令，模型输出沉淀为知识并服务业务。: The connection layer links the physical entity and virtual model, carries uplink data and governed downlink commands, and settles model output into knowledge that serves the business.
    连接层 CN 统一协议、语义、频率与安全，是物理实体和虚拟模型持续同步的枢纽。: The CN unifies protocol, semantics, frequency, and security — the hub that keeps PE and VM in sync.
    数据资产域 · 数据沉淀与治理边界: Data asset domain · data & governance boundary
    平台服务域 · 核心服务能力边界: Platform service domain · core service boundary
    物理实体 PE: Physical Entity (PE)
    设备 · 产线 · 传感器: Devices · lines · sensors
    连接层 CN: Connection (CN)
    协议转换 · 数据归一 · 安全: Protocols · normalization · security
    双向同步枢纽: Two-way sync hub
    虚拟模型 VM: Virtual Model (VM)
    几何 · 物理 · 行为: Geometry · physics · behavior
    数据与服务: Data & Service
    历史数据 · 业务接口: History · business APIs
    知识: Knowledge
    规则参数 · 故障案例: Rule parameters · fault cases
    设备状态 · 传感器值 · 事件: Device status · sensor values · events
    获准写指令 · 参数更新: Approved writes · parameter updates
    归一化位号值 PointValue: Normalized PointValue
    预测结果 · 参数调整候选: Predictions · tuning candidates
    模型输出 · 异常模式: Model output · anomaly patterns
    安全边界：写请求须经鉴权、值域/变化率校验、策略约束与必要人工确认: 'Safety boundary: writes need auth, range/rate checks, policy limits, and sign-off when required'
    PLC / SIS / 硬联锁承担确定性控制与故障保护，模型不得绕过: PLC / SIS / hard interlocks own deterministic control and protection; models cannot bypass them
    图 10-3 连接层承载状态同步与获准指令；模型输出经验证、评测与受控发布后沉淀为知识。: Figure 10-3 The connection layer carries state synchronization and approved commands; model output becomes knowledge after validation, evaluation, and controlled release.
