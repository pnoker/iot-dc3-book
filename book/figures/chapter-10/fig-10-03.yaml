type: architecture
title: 图10-3 数字孪生五维模型架构图
audience_takeaway: 读者应理解连接层是数字孪生枢纽:传感器值经CN上行、控制指令下行,模型输出沉淀为知识反哺业务,形成自我进化的双向闭环。
purpose: 展示数字孪生的五个核心维度及它们之间的数据与控制流向，帮助读者理解CPS在工程层面的完整协作关系
visual_focus: 从PE到Data & Service的主链路。
design_level: logical
layout: 中心式五边形布局，以“连接层”为轴心，左右两侧对称放置“物理实体”和“虚拟模型”，“数据与服务”与“知识”位于顶部两个角落，连接线标识双向互动关系
elements:
- PE（物理实体）
- VM（虚拟模型）
- CN（连接层）
- Data & Service（数据与服务）
- Knowledge（知识）
relationships:
- PE → CN（设备状态、传感器值、事件）
- CN → VM（归一化位号值（PointValue））
- VM → CN（预测结果、参数调整指令）
- CN → PE（设备写指令、参数更新）
- VM → Knowledge（模型输出、异常模式）
- Knowledge → Data & Service（规则参数、故障案例）
