type: lifecycle
title: 图 10-10 工业模型的持续监控与更新闭环
audience_takeaway: 读者应理解区分数据漂移与概念漂移，用 KS 检验检测漂移，按轻量校准、主动学习、全量重训练三级响应，形成检测到再监控的闭环流水线。
purpose: 展示工业模型的持续监控指标、漂移检测与更新策略闭环
visual_focus: 两类漂移、三级响应与闭环流水线。
design_level: lifecycle
layout: 上半两类漂移，中部监控指标与三级响应，底部闭环流水线
elements:
- 数据漂移：特征分布变化、映射不变，增量训练校准
- 概念漂移：映射关系改变，重采集标注、调整结构
- 监控指标：误报率、漏报率，按设备类型/工况/产线切片
- KS 检验：滑动窗口分布 vs 训练基线，连续窗口统计超阈值比例
- 三级响应：轻量校准、主动学习、全量重训练
relationships:
- 漂移类型决定应对策略；检测→评估→校准/重训练→部署→再监控形成闭环
render_notes: HTML/SVG 渲染，两类漂移 + 三级响应 + 闭环流水线，蓝绿橙灰分层。
