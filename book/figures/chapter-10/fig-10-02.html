<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图10-2 工业4.0与传统制造的核心特征对比</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图10-2 工业4.0与传统制造的核心特征对比</title>
  <desc id="desc">六个维度并列比较传统制造与工业4.0，重点突出驱动要素和系统架构两个根本标尺。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图10-2 工业4.0与传统制造的核心特征对比</text>
    <text x="88" y="64" font-size="12" fill="#64748B">驱动要素与系统架构是根本标尺，其他差异由二者变化引发。</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 表头 -->
    <rect x="120" y="150" width="1560" height="52" rx="8" fill="#0F172A"/>
    <text x="260" y="182" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">对比维度</text>
    <text x="700" y="182" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">传统制造模式</text>
    <text x="1340" y="182" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">工业4.0 智能制造模式</text>

    <!-- 行1 驱动要素（标尺，强调） -->
    <rect x="120" y="206" width="1560" height="100" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1.4"/>
    <rect x="134" y="216" width="80" height="24" rx="12" fill="#2563EB"/>
    <text x="174" y="233" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">标尺1</text>
    <text x="260" y="278" font-size="20" font-weight="700" fill="#1D4ED8" text-anchor="middle">驱动要素</text>
    <text x="430" y="248" font-size="19" font-weight="700" fill="#475569">经验驱动</text>
    <text x="430" y="280" font-size="15" fill="#64748B">师傅手感，知识高度个体化</text>
    <text x="1030" y="248" font-size="19" font-weight="700" fill="#1D4ED8">数据驱动</text>
    <text x="1030" y="280" font-size="15" fill="#475569">实时采集、量化判断，经验显性化、可复制</text>

    <!-- 行2 生产方式 -->
    <rect x="120" y="306" width="1560" height="100" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="260" y="362" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">生产方式</text>
    <text x="430" y="348" font-size="19" font-weight="700" fill="#475569">大批量、少品种</text>
    <text x="430" y="380" font-size="15" fill="#64748B">刚性产线难以换型</text>
    <text x="1030" y="348" font-size="19" font-weight="700" fill="#0F172A">小批量、多品种</text>
    <text x="1030" y="380" font-size="15" fill="#475569">柔性产线快速换型，换型方案在数字孪生中预验证</text>

    <!-- 行3 数据角色 -->
    <rect x="120" y="406" width="1560" height="100" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="260" y="462" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">数据角色</text>
    <text x="430" y="448" font-size="19" font-weight="700" fill="#475569">事后记录</text>
    <text x="430" y="480" font-size="15" fill="#64748B">用于月度报表、质量追溯的问题复盘</text>
    <text x="1030" y="448" font-size="19" font-weight="700" fill="#0F172A">实时生产要素</text>
    <text x="1030" y="480" font-size="15" fill="#475569">在线采集、语义标注、流式计算，直接指导节拍与工艺调整</text>

    <!-- 行4 系统架构（标尺，强调） -->
    <rect x="120" y="506" width="1560" height="100" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1.4"/>
    <rect x="134" y="516" width="80" height="24" rx="12" fill="#2563EB"/>
    <text x="174" y="533" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">标尺2</text>
    <text x="260" y="578" font-size="20" font-weight="700" fill="#1D4ED8" text-anchor="middle">系统架构</text>
    <text x="430" y="548" font-size="19" font-weight="700" fill="#475569">ISA-95 金字塔</text>
    <text x="430" y="580" font-size="15" fill="#64748B">ERP/MES/SCADA/PLC 各层各自为政，数据分层串行流转</text>
    <text x="1030" y="548" font-size="19" font-weight="700" fill="#1D4ED8">基于 CPS 的扁平化结构</text>
    <text x="1030" y="580" font-size="15" fill="#475569">横向集成（跨设备协同）与纵向集成（跨层级反馈）打通</text>

    <!-- 行5 维护策略 -->
    <rect x="120" y="606" width="1560" height="100" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="260" y="662" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">维护策略</text>
    <text x="430" y="648" font-size="19" font-weight="700" fill="#475569">事后维修 / 计划预防</text>
    <text x="430" y="680" font-size="15" fill="#64748B">事后维修或基于日历的计划性预防维护</text>
    <text x="1030" y="648" font-size="19" font-weight="700" fill="#0F172A">预测性维护</text>
    <text x="1030" y="680" font-size="15" fill="#475569">基于设备退化曲线与同类设备统计模型，前置规划维保窗口</text>

    <!-- 行6 变更响应 -->
    <rect x="120" y="706" width="1560" height="100" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="260" y="762" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">变更响应</text>
    <text x="430" y="748" font-size="19" font-weight="700" fill="#475569">停产数天换型调试</text>
    <text x="430" y="780" font-size="15" fill="#64748B">依赖资深工程师现场手动改参数</text>
    <text x="1030" y="748" font-size="19" font-weight="700" fill="#0F172A">数字孪生模拟换型</text>
    <text x="1030" y="780" font-size="15" fill="#475569">试错在虚拟空间完成，实际停机时间大幅缩短</text>

    <line x1="400" y1="150" x2="400" y2="806" stroke="#CBD5E1" stroke-width="1.4"/>
    <line x1="1000" y1="150" x2="1000" y2="806" stroke="#CBD5E1" stroke-width="1.4"/>
    <!-- 结论 callout -->
    <rect x="440" y="832" width="920" height="58" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.4"/>
    <text x="900" y="868" font-size="18" font-weight="700" fill="#1D4ED8" text-anchor="middle">标尺行（驱动要素、系统架构）以浅蓝底强调</text>

    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图10-2 展示传统制造与工业4.0在关键维度上的本质差异。驱动要素和系统架构的转变是根本。</text>
  </svg>
</svg>
  </main>
</body>
</html>
