<text x="60" y="126" font-size="13" fill="#475569">驱动要素与系统架构是根本标尺，其他差异由二者变化引发。</text><rect x="60" y="150" width="1080" height="48" rx="8" fill="#0F172A"/><text x="165" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="white">对比维度</text><text x="520" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="white">传统制造模式</text><text x="930" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="white">工业4.0 智能制造模式</text><rect x="60" y="198" width="1080" height="72" fill="#EFF6FF" stroke="#CBD5E1"/><line x1="270" y1="198" x2="270" y2="270" stroke="#CBD5E1"/><line x1="750" y1="198" x2="750" y2="270" stroke="#CBD5E1"/><text x="165" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">驱动要素 · 核心标尺</text><text x="290" y="240" font-size="12" fill="#475569">经验驱动：师傅手感，知识个体化</text><text x="770" y="240" font-size="12" fill="#0F172A" font-weight="700">数据驱动：实时采集、量化判断，经验可复制</text><rect x="60" y="270" width="1080" height="72" fill="#FFFFFF" stroke="#CBD5E1"/><line x1="270" y1="270" x2="270" y2="342" stroke="#CBD5E1"/><line x1="750" y1="270" x2="750" y2="342" stroke="#CBD5E1"/><text x="165" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">生产方式</text><text x="290" y="312" font-size="12" fill="#475569">大批量、少品种，刚性产线</text><text x="770" y="312" font-size="12" fill="#0F172A" font-weight="400">小批量、多品种，柔性换型与孪生预验证</text><rect x="60" y="342" width="1080" height="72" fill="#F8FAFC" stroke="#CBD5E1"/><line x1="270" y1="342" x2="270" y2="414" stroke="#CBD5E1"/><line x1="750" y1="342" x2="750" y2="414" stroke="#CBD5E1"/><text x="165" y="384" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">数据角色</text><text x="290" y="384" font-size="12" fill="#475569">事后记录：报表与问题复盘</text><text x="770" y="384" font-size="12" fill="#0F172A" font-weight="400">实时生产要素：语义标注、流式计算、指导调整</text><rect x="60" y="414" width="1080" height="72" fill="#EFF6FF" stroke="#CBD5E1"/><line x1="270" y1="414" x2="270" y2="486" stroke="#CBD5E1"/><line x1="750" y1="414" x2="750" y2="486" stroke="#CBD5E1"/><text x="165" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">系统架构 · 核心标尺</text><text x="290" y="456" font-size="12" fill="#475569">ISA-95金字塔：分层串行、各层孤立</text><text x="770" y="456" font-size="12" fill="#0F172A" font-weight="700">CPS扁平化：横向协同、纵向实时反馈</text><rect x="60" y="486" width="1080" height="72" fill="#F8FAFC" stroke="#CBD5E1"/><line x1="270" y1="486" x2="270" y2="558" stroke="#CBD5E1"/><line x1="750" y1="486" x2="750" y2="558" stroke="#CBD5E1"/><text x="165" y="528" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">维护策略</text><text x="290" y="528" font-size="12" fill="#475569">事后维修或日历式预防维护</text><text x="770" y="528" font-size="12" fill="#0F172A" font-weight="400">基于退化曲线与统计模型的预测性维护</text><rect x="60" y="558" width="1080" height="72" fill="#FFFFFF" stroke="#CBD5E1"/><line x1="270" y1="558" x2="270" y2="630" stroke="#CBD5E1"/><line x1="750" y1="558" x2="750" y2="630" stroke="#CBD5E1"/><text x="165" y="600" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">变更响应</text><text x="290" y="600" font-size="12" fill="#475569">停产调试，依赖工程师手动改参</text><text x="770" y="600" font-size="12" fill="#0F172A" font-weight="400">虚拟空间试错，缩短实际换型停机</text><text x="600" y="668" text-anchor="middle" font-size="11" fill="#64748B">图10-2 传统制造与工业4.0的差异，根本在于经验到数据的驱动转换，以及分层孤立到横纵贯通的架构转换。</text>
