<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图10-4 三类维护策略长期运营效率对比（示意）</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图10-4 三类维护策略长期运营效率对比（示意）</title>
  <desc id="desc">以相对趋势比较被动、预防性和预测性维护的成本与设备可用率。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <defs>
      <marker id="arr-gray" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0 0 L11 4 L0 8 Z" fill="#475569"/></marker>
    </defs>
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图10-4 三类维护策略长期运营效率对比（示意）</text>
    <text x="88" y="64" font-size="12" fill="#64748B">示意趋势，不代表单一工厂实测数值；纵轴仅表达高、中、低相对水平。</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 坐标轴 -->
    <line x1="200" y1="170" x2="200" y2="620" stroke="#475569" stroke-width="2"/>
    <line x1="1560" y1="170" x2="1560" y2="620" stroke="#475569" stroke-width="2"/>
    <line x1="200" y1="620" x2="1560" y2="620" stroke="#475569" stroke-width="2"/>
    <!-- 横向参考线 -->
    <line x1="200" y1="220" x2="1560" y2="220" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="200" y1="395" x2="1560" y2="395" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="200" y1="570" x2="1560" y2="570" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- 纵轴标题 -->
    <text x="150" y="410" transform="rotate(-90 150 410)" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">维护成本（相对值）</text>
    <text x="1620" y="410" transform="rotate(90 1620 410)" font-size="16" font-weight="700" fill="#475569" text-anchor="middle">设备可用率（相对值）</text>
    <!-- 高低刻度 -->
    <text x="186" y="225" font-size="15" fill="#64748B" text-anchor="end">高</text>
    <text x="186" y="400" font-size="15" fill="#64748B" text-anchor="end">中</text>
    <text x="186" y="575" font-size="15" fill="#64748B" text-anchor="end">低</text>
    <text x="1574" y="225" font-size="15" fill="#64748B" text-anchor="start">高</text>
    <text x="1574" y="400" font-size="15" fill="#64748B" text-anchor="start">中</text>
    <text x="1574" y="575" font-size="15" fill="#64748B" text-anchor="start">低</text>

    <!-- 条形图（成本） -->
    <!-- 周期1 -->
    <rect x="269" y="580" width="30" height="40" fill="#DC2626" fill-opacity="0.22" stroke="#DC2626" stroke-width="1.6"/>
    <rect x="305" y="500" width="30" height="120" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="341" y="530" width="30" height="90" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="1.6"/>
    <!-- 周期2 -->
    <rect x="469" y="530" width="30" height="90" fill="#DC2626" fill-opacity="0.22" stroke="#DC2626" stroke-width="1.6"/>
    <rect x="505" y="550" width="30" height="70" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="541" y="550" width="30" height="70" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="1.6"/>
    <!-- 周期3 -->
    <rect x="669" y="480" width="30" height="140" fill="#DC2626" fill-opacity="0.22" stroke="#DC2626" stroke-width="1.6"/>
    <rect x="705" y="470" width="30" height="150" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="741" y="565" width="30" height="55" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="1.6"/>
    <!-- 周期4 -->
    <rect x="869" y="430" width="30" height="190" fill="#DC2626" fill-opacity="0.22" stroke="#DC2626" stroke-width="1.6"/>
    <rect x="905" y="530" width="30" height="90" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="941" y="575" width="30" height="45" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="1.6"/>
    <!-- 周期5 -->
    <rect x="1069" y="390" width="30" height="230" fill="#DC2626" fill-opacity="0.22" stroke="#DC2626" stroke-width="1.6"/>
    <rect x="1105" y="460" width="30" height="160" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="1141" y="580" width="30" height="40" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="1.6"/>
    <!-- 周期6 -->
    <rect x="1269" y="360" width="30" height="260" fill="#DC2626" fill-opacity="0.22" stroke="#DC2626" stroke-width="1.6"/>
    <rect x="1305" y="520" width="30" height="100" fill="#2563EB" fill-opacity="0.22" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="1341" y="585" width="30" height="35" fill="#16A34A" fill-opacity="0.22" stroke="#16A34A" stroke-width="1.6"/>

    <!-- x 轴刻度 -->
    <text x="320" y="648" font-size="16" fill="#475569" text-anchor="middle">周期1</text>
    <text x="520" y="648" font-size="16" fill="#475569" text-anchor="middle">周期2</text>
    <text x="720" y="648" font-size="16" fill="#475569" text-anchor="middle">周期3</text>
    <text x="920" y="648" font-size="16" fill="#475569" text-anchor="middle">周期4</text>
    <text x="1120" y="648" font-size="16" fill="#475569" text-anchor="middle">周期5</text>
    <text x="1320" y="648" font-size="16" fill="#475569" text-anchor="middle">周期6</text>

    <!-- 折线图（可用率） -->
    <polyline points="320,260 520,320 720,400 920,470 1120,530 1320,570" fill="none" stroke="#DC2626" stroke-width="2.4"/>
    <polyline points="320,270 520,320 720,370 920,420 1120,470 1320,510" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-dasharray="10 6"/>
    <polyline points="320,260 520,268 720,276 920,284 1120,292 1320,300" fill="none" stroke="#16A34A" stroke-width="2.4" stroke-dasharray="4 4 2 4"/>

    <!-- 图例 -->
    <rect x="160" y="690" width="1480" height="112" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
    <text x="184" y="726" font-size="16" font-weight="700" fill="#475569">成本（条形）</text>
    <rect x="300" y="712" width="22" height="15" fill="#DC2626" fill-opacity="0.5" stroke="#DC2626" stroke-width="1.6"/>
    <text x="332" y="726" font-size="15" fill="#475569">被动维护成本</text>
    <rect x="520" y="712" width="22" height="15" fill="#2563EB" fill-opacity="0.5" stroke="#2563EB" stroke-width="1.6"/>
    <text x="552" y="726" font-size="15" fill="#475569">预防性维护成本</text>
    <rect x="740" y="712" width="22" height="15" fill="#16A34A" fill-opacity="0.5" stroke="#16A34A" stroke-width="1.6"/>
    <text x="772" y="726" font-size="15" fill="#475569">预测性维护成本</text>

    <text x="184" y="774" font-size="16" font-weight="700" fill="#475569">可用率（折线）</text>
    <line x1="300" y1="770" x2="322" y2="770" stroke="#DC2626" stroke-width="2.4"/>
    <text x="332" y="774" font-size="15" fill="#475569">被动维护可用率（实线）</text>
    <line x1="560" y1="770" x2="582" y2="770" stroke="#2563EB" stroke-width="2.4" stroke-dasharray="10 6"/>
    <text x="592" y="774" font-size="15" fill="#475569">预防性维护可用率（虚线）</text>
    <line x1="820" y1="770" x2="842" y2="770" stroke="#16A34A" stroke-width="2.4" stroke-dasharray="4 4 2 4"/>
    <text x="852" y="774" font-size="15" fill="#475569">预测性维护可用率（点划线）</text>

    <!-- 示意说明 -->
    <text x="900" y="852" font-size="15" fill="#64748B" text-anchor="middle">本图为示意性对比，非单一工厂实测数据；条形高度与折线位置仅表示相对趋势关系。</text>

    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图10-4 三类维护策略效率对比（示意）：被动维护成本快速攀升、可用率骤降；预防性维护成本周期波动、可用率缓降；预测性维护成本稳定、可用率长期高位。</text>
  </svg>
</svg>
  </main>
</body>
</html>
