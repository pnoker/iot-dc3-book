<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图3-3 RFID系统工作示意图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图3-3 RFID系统工作示意图</title>
  <desc id="desc">上位机与读写器双向通信，读写器经天线发射射频，被动标签反向散射回复，主动标签独立发射。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图3-3 RFID系统工作示意图</text>
  <text x="88" y="64" font-size="12" fill="#64748B">天线是独立射频性能模块；标签类型决定取能方式与回传机制</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 系统域 ===== -->
  <rect x="120" y="140" width="300" height="470" rx="12" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="270" y="174" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">系统域</text>
  <rect x="140" y="330" width="260" height="110" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/>
  <text x="270" y="374" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">上位机</text>
  <text x="270" y="404" font-size="12" fill="#475569" text-anchor="middle">边缘节点 / IoT 平台</text>
  <text x="270" y="426" font-size="11" fill="#94A3B8" text-anchor="middle">数据消费与决策</text>

  <!-- ===== 射频域 ===== -->
  <rect x="460" y="140" width="520" height="470" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="720" y="174" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">射频域</text>
  <rect x="480" y="330" width="220" height="110" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="590" y="372" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">读写器</text>
  <text x="590" y="400" font-size="11.5" fill="#475569" text-anchor="middle">射频收发与解析</text>
  <text x="590" y="420" font-size="11.5" fill="#475569" text-anchor="middle">数据转发</text>
  <rect x="760" y="330" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="860" y="372" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">天线</text>
  <text x="860" y="400" font-size="11.5" fill="#475569" text-anchor="middle">辐射 / 接收</text>
  <text x="860" y="420" font-size="11.5" fill="#475569" text-anchor="middle">极化 · 增益</text>

  <!-- 上位机 ↔ 读写器 -->
  <line x1="400" y1="360" x2="478" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#ah-gray)"/>
  <line x1="478" y1="400" x2="400" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="440" y="348" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">数据上报</text>
  <text x="440" y="420" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">控制下发</text>

  <!-- 读写器 → 天线 -->
  <line x1="702" y1="385" x2="758" y2="385" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="730" y="373" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">射频信号</text>

  <!-- ===== 标签域 ===== -->
  <rect x="1020" y="140" width="660" height="470" rx="12" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="1350" y="174" font-size="15" font-weight="700" fill="#0F766E" text-anchor="middle">标签域</text>

  <!-- 被动标签 -->
  <rect x="1050" y="210" width="600" height="86" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/>
  <text x="1350" y="246" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">被动标签</text>
  <text x="1350" y="272" font-size="11" fill="#475569" text-anchor="middle">无源 · 从射频场取能 · 反向散射回复</text>

  <!-- 半主动标签 -->
  <rect x="1050" y="320" width="600" height="86" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/>
  <text x="1350" y="356" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">半主动标签</text>
  <text x="1350" y="382" font-size="11" fill="#475569" text-anchor="middle">电池为芯片供电 · 通信仍采用反向散射</text>

  <!-- 主动标签 -->
  <rect x="1050" y="430" width="600" height="86" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/>
  <text x="1350" y="466" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">主动标签</text>
  <text x="1350" y="492" font-size="11" fill="#475569" text-anchor="middle">有源收发 · 可主动发射射频信号</text>

  <!-- 天线 → 标签 -->
  <line x1="960" y1="253" x2="1048" y2="253" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-teal)"/>
  <line x1="1048" y1="253" x2="960" y2="253" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-teal)"/>
  <text x="1004" y="241" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">耦合能量/散射</text>
  <line x1="960" y1="363" x2="1048" y2="363" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-teal)"/>
  <line x1="1048" y1="363" x2="960" y2="363" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-teal)"/>
  <text x="1004" y="351" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">反向散射</text>
  <line x1="960" y1="473" x2="1048" y2="473" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
  <line x1="1048" y1="473" x2="960" y2="473" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
  <text x="1004" y="461" font-size="10.5" font-weight="700" fill="#0F766E" text-anchor="middle">主动发射射频</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图3-3 被动标签通过反向散射回复，主动标签则具备独立射频发射能力。</text>
  </svg>
</svg>
  </main>
</body>
</html>
