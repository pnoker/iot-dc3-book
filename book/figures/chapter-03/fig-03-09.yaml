type: architecture
title: 图3-9 物模型驱动设备互操作的示意图
purpose: 展示物模型作为中间抽象层，如何屏蔽异构设备的协议差异，为上层应用提供统一的数据和服务接口。
audience_takeaway: 读者应理解物模型的价值核心在于‘能力抽象’：上层应用只与物模型交互，无需感知底层设备是Modbus RTU、MQTT还是二进制协议。
visual_focus: 从dev-ax4（A公司温度传感器）和dev-bx4（B公司温度传感器）两条不同源的数据流，分别映射到物模型层中‘温度’属性节点，再汇聚为统一数据流到达应用层的这条主链路。
design_level: logical
layout: 垂直三层架构：顶部为应用层（两个应用节点），中部为物模型抽象层（属性、服务、事件三列），底部为设备层（四个不同协议/厂商的设备节点）。
elements:
- 能源管理与楼宇自控应用
- 物模型的属性、服务与事件
- JSON、Modbus、MQTT、二进制协议设备
relationships:
- 异构设备 → 物模型属性、服务、事件：将厂商协议映射为统一能力语义
- A、B 公司温度传感器 → 温度属性：不同数据源汇聚到同一标准属性
- 属性、服务、事件 → 上层应用：提供标准属性值、服务调用与事件推送
regions:
- id: app_domain
  label: 应用消费域
  role: 消费标准化能力的边界
- id: thing_model_domain
  label: 物模型抽象域
  role: 将设备能力语义化的核心边界，屏蔽底层差异
- id: device_domain
  label: 物理设备域
  role: 异构设备与协议的存在边界
components:
- id: energy_app
  label: 能源管理应用
  type: application
  subtitle: 统一消费物模型数据
  group: app_domain
  priority: primary
  shape: card
- id: building_app
  label: 楼宇自控应用
  type: application
  subtitle: 不关心底层设备厂商
  group: app_domain
  priority: normal
  shape: card
- id: properties
  label: 属性 (Property)
  type: platform
  subtitle: 温度、湿度、功率
  group: thing_model_domain
  priority: primary
  shape: card
- id: actions
  label: 服务 (Action)
  type: platform
  subtitle: 校准、重启、设定阈值
  group: thing_model_domain
  priority: normal
  shape: card
- id: events
  label: 事件 (Event)
  type: platform
  subtitle: 温度越界、设备离线
  group: thing_model_domain
  priority: normal
  shape: card
- id: dev_ax4
  label: 温度传感器(A公司,JSON)
  type: edge
  subtitle: HTTP上报
  group: device_domain
  priority: primary
  shape: card
- id: dev_bx4
  label: 温度传感器(B公司,Modbus)
  type: edge
  subtitle: RTU寄存器
  group: device_domain
  priority: primary
  shape: card
- id: dev_cx4
  label: 振动监测仪(C公司,MQTT)
  type: edge
  subtitle: Topic 订阅
  group: device_domain
  priority: normal
  shape: card
- id: dev_dx4
  label: RFID读写器(D公司,二进制)
  type: edge
  subtitle: Socket 报文
  group: device_domain
  priority: normal
  shape: card
connections:
- from: dev_ax4
  to: properties
  label: 映射到‘温度’属性
  style: solid
  direction: bottom-to-top
- from: dev_bx4
  to: properties
  label: 映射到‘温度’属性
  style: solid
  direction: bottom-to-top
- from: dev_cx4
  to: properties
  label: 映射到‘振动频率’属性
  style: solid
  direction: bottom-to-top
- from: dev_dx4
  to: actions
  label: 映射到‘读取标签’服务
  style: solid
  direction: bottom-to-top
- from: dev_dx4
  to: events
  label: 映射到‘标签碰撞’事件
  style: dashed
  direction: bottom-to-top
- from: properties
  to: energy_app
  label: 提供标准属性值
  style: solid
  direction: bottom-to-top
- from: properties
  to: building_app
  label: 提供标准属性值
  style: solid
  direction: bottom-to-top
- from: actions
  to: energy_app
  label: 触发标准服务
  style: solid
  direction: bottom-to-top
- from: events
  to: building_app
  label: 推送标准事件
  style: dashed
  direction: event
callouts:
- 核心矛盾：dev-ax4与dev-bx4都代表‘温度’，但因协议不同，应用层无法直接消费。
- 物模型层引入后，两条数据流在‘temperature’属性节点上统一，应用层不再接触底层协议。
legend:
- 蓝色=物模型抽象层元素，用统一色调表示标准化接口
- 青绿色=物理设备层元素，用不同色相表示协议差异
- 实线箭头=数据映射或服务调用，虚线箭头=事件推送
- 设备层到物模型层的箭头为‘能力映射’，物模型层到应用层的箭头为‘统一输出’
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts。
- 图例放在底部，不遮挡分组边界。
- 优先表达‘温度属性’的主汇聚链路，其他节点作为支撑。
render_notes: HTML/SVG渲染，浅色背景，设备层使用圆角矩形（颜色差异表示异构协议），物模型层使用圆角矩形加虚线边框（强调抽象），应用层使用圆角矩形。汇聚箭头在‘温度’属性节点处合并为一条粗箭头指向上方。底部图例和出版级图注。
caption:
  zh: 图3-9 物模型作为中间抽象层，将异构设备的能力映射到标准的属性、服务和事件，使上层应用可统一消费数据。
  en: 'Figure 3-9 The thing model as an intermediate abstraction layer: it maps heterogeneous device capabilities onto standard properties, services, and events so upper-layer applications can consume data uniformly.'
labels:
  en:
    图3-9 物模型驱动设备互操作的示意图: Figure 3-9 Thing-Model-Driven Device Interoperability
    读者应理解物模型的价值核心在于能力抽象：上层应用只与物模型交互，无需感知底层设备是Modbus RTU、MQTT还是二进制协议。: 'The core value of the thing model is capability abstraction: applications talk only to the thing model, never caring whether the device underneath speaks Modbus RTU, MQTT, or a binary protocol.'
    应用消费域: Application Consumption Domain
    · 消费标准化能力的边界: · boundary where standardized capabilities are consumed
    物模型抽象域: Thing Model Abstraction Domain
    · 将设备能力语义化，屏蔽底层差异: · turns device capabilities into semantics and hides underlying differences
    物理设备域: Physical Device Domain
    · 异构设备与协议的存在边界: · boundary where heterogeneous devices and protocols live
    能源管理应用: Energy Management App
    统一消费物模型数据: Consumes thing-model data uniformly
    楼宇自控应用: Building Automation App
    不关心底层设备厂商: Indifferent to device vendors
    属性汇聚: Property Aggregation
    属性 (Property): Property
    温度、湿度、功率: Temperature, humidity, power
    服务 (Action): Action
    校准、重启、设定阈值: Calibrate, restart, set thresholds
    事件 (Event): Event
    温度越界、设备离线: Temperature out of range, device offline
    温度传感器: Temperature Sensor
    (A公司 · JSON): (Vendor A · JSON)
    HTTP 上报: HTTP reporting
    (B公司 · Modbus): (Vendor B · Modbus)
    RTU 寄存器: RTU registers
    振动监测仪: Vibration Monitor
    (C公司 · MQTT): (Vendor C · MQTT)
    Topic 订阅: Topic subscription
    RFID 读写器: RFID Reader
    (D公司 · 二进制): (Vendor D · binary)
    Socket 报文: Socket messages
    温度: Temperature
    振动频率: Vibration frequency
    读取标签: Read tag
    标签碰撞: Tag collision
    统一输出 · 标准属性值: Unified output · standard property values
    标准属性值: Standard property values
    标准服务: Standard service
    事件推送: Event push
    核心矛盾: Core Tension
    dev-ax4 与 dev-bx4 都代表: dev-ax4 and dev-bx4 both
    温度属性，但因协议不同，: 'mean "temperature"; protocol gaps'
    应用层无法直接消费。: block direct app consumption.
    统一抽象: Unified Abstraction
    物模型层将两条数据流在: The thing model unifies both
    temperature 属性节点统一，: streams at the temperature node;
    应用层不再接触底层协议。: apps never touch protocols.
    蓝色＝物模型抽象层元素，统一色调表示标准化接口: Blue = thing-model abstraction elements; one hue for standardized interfaces
    青绿/紫/琥珀＝设备层元素，不同色相表示协议差异: Teal/purple/amber = device-layer elements; different hues for protocol differences
    实线＝能力映射与服务调用 · 虚线＝事件推送: Solid = capability mapping & service calls · dashed = event push
    粗箭头＝温度属性汇聚后的统一输出: Bold arrow = unified output after temperature aggregation
    图3-9 物模型作为中间抽象层，将异构设备的能力映射到标准的属性、服务和事件，使上层应用可统一消费数据。: 'Figure 3-9 The thing model as an intermediate abstraction layer: it maps heterogeneous device capabilities onto standard properties, services, and events so upper-layer applications can consume data uniformly.'
