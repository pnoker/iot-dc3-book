<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RFID系统工作示意图</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">RFID系统工作示意图</title>
  <desc id="desc">读者应理解RFID系统工作示意图中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">RFID系统工作示意图</title>
  <desc id="desc">读者应理解RFID系统工作示意图中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">RFID系统工作示意图</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解RFID系统工作示意图中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
  <rect x="800" y="250" width="240" height="190" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="920" y="275" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">RFID标签（被动式）</text>

  <!-- 连线层 -->
  <path d="M 430 340 H 500" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <path d="M 620 320 H 820" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <path d="M 820 370 H 620" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#bp-arrow-primary)"/>
  <path d="M 500 370 H 430" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#bp-arrow-primary)"/>
  <path d="M 340 380 V 430 H 175 V 500" fill="none" stroke="#D97706" stroke-width="1.5" marker-end="url(#bp-arrow)"/>

  <!-- 卡片层 -->
  <!-- 读写器 -->
  <rect x="250" y="300" width="180" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="340" y="332" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">读写器</text>
  <text x="340" y="352" fill="#475569" font-size="11" text-anchor="middle">数据接口（以太网）</text>

  <!-- 天线 -->
  <rect x="500" y="300" width="120" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="560" y="332" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">天线</text>
  <text x="560" y="352" fill="#475569" font-size="11" text-anchor="middle">射频辐射</text>

  <!-- 标签内部模块 -->
  <rect x="820" y="290" width="80" height="50" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="860" y="318" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">能量收集</text>

  <rect x="920" y="290" width="80" height="50" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="960" y="318" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">调制器</text>

  <rect x="820" y="360" width="180" height="60" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="910" y="384" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">存储区</text>
  <text x="910" y="404" fill="#475569" font-size="10" text-anchor="middle">TID / EPC / 用户数据</text>

  <!-- 后端系统 -->
  <rect x="100" y="500" width="150" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="175" y="535" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">后端系统</text>

  <!-- 时序编号标签 -->
  <rect x="660" y="310" width="100" height="20" rx="4" fill="white" stroke="none"/>
  <text x="710" y="325" fill="#0F172A" font-size="11" text-anchor="middle">① 能量传输</text>

  <rect x="660" y="360" width="100" height="20" rx="4" fill="white" stroke="none"/>
  <text x="710" y="375" fill="#0F172A" font-size="11" text-anchor="middle">② 数据返回</text>

  <rect x="220" y="420" width="120" height="20" rx="4" fill="white" stroke="none"/>
  <text x="280" y="435" fill="#0F172A" font-size="11" text-anchor="middle">③ 上报标签ID</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头：读写器通过天线向标签发射射频电磁波（能量 + 下行数据</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">虚线箭头：标签通过背向散射向读写器返回上行数据</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线方框：系统的三个主要物理组件（读写器、天线、标签）</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">RFID系统的完整工作循环分为两个阶段：第一阶段（图中①），读写器通过天线发射射频电磁波，被动标签接收电磁波并将其整流为直流电，为芯片供电；第二阶段（图中②），标签芯片调整输入阻抗，将待发送的编码数据以背向散射方式反射回读写器，读写器解调后获得标签ID与用户数据；读写器与后端通</text>
  <text x="900" y="870" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">信（图中③），将解析的数据传递给管理系统。</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">architecture</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">从左至右依次为“读写器”“天线”和“标签”三个主要模块，标签内部进一步分解为“能量收集”“调制器”“存储区”；能量路径以淡黄色虚线表示，数据路径以蓝色实线表示；图下方标注三个阶段的时序编号。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
