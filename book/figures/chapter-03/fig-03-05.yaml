type: timeline
title: 图3-5 室内外定位技术覆盖与精度光谱（示意）
purpose: 展示GNSS、Wi-Fi、BLE、UWB等主流定位技术在室外、室内及半室外环境下的典型精度区间，帮助读者建立直观的选型直觉。
audience_takeaway: 读者应能通过此图快速判断：给定精度需求和部署环境，应优先考虑哪种定位技术。
visual_focus: 从粗精度（左）向精精度（右）的连续光谱排列，颜色区分技术族类（蓝=卫星，绿=Wi-Fi，橙=蓝牙，红=UWB，灰=地磁）。
design_level: logical
layout: 水平光谱布局，横轴为对数刻度定位精度（0.1m到10m），各技术以水平矩形条表示，矩形宽度对应典型精度区间，左侧为室外域，右侧为室内域，背景色区分环境。
elements:
- GNSS 单频与 GNSS+RTK
- Wi-Fi 指纹、BLE 信标、UWB 与地磁指纹
- 室外、半室外和室内精度光谱
relationships:
- GNSS 单频 → GNSS+RTK：通过差分与载波相位提升室外定位精度
- Wi-Fi 指纹 → BLE 信标 → UWB：室内方案沿精度轴逐级提高
- 定位技术 → 环境与精度区间：部署条件和典型误差共同限定选型位置
components:
- id: gnss_single
  label: GNSS单频
  type: platform
  subtitle: 室外数米至十米级
  group: outdoor_zone
  priority: primary
  shape: card
- id: gnss_rtk
  label: GNSS+RTK
  type: platform
  subtitle: 室外厘米级
  group: outdoor_zone
  priority: normal
  shape: card
- id: wifi_fingerprint
  label: Wi-Fi指纹法
  type: platform
  subtitle: 室内米至十米级
  group: indoor_zone
  priority: normal
  shape: card
- id: ble_beacon
  label: BLE信标
  type: edge
  subtitle: 室内米级
  group: indoor_zone
  priority: normal
  shape: card
- id: uwb
  label: UWB
  type: edge
  subtitle: 室内分米级
  group: indoor_zone
  priority: primary
  shape: card
- id: geomagnetic
  label: 地磁指纹
  type: edge
  subtitle: 室内数米级
  group: indoor_zone
  priority: supporting
  shape: card
regions:
- id: outdoor_zone
  label: 室外覆盖域
  role: 无遮挡开阔环境，卫星信号可稳定接收
- id: semi_outdoor
  label: 半室外过渡区
  role: 街谷、天桥、敞篷等卫星信号受限区域，精度会显著退化
- id: indoor_zone
  label: 室内覆盖域
  role: 建筑内部，需依赖Wi-Fi/蓝牙/UWB/地磁等基础设施
connections:
- from: gnss_single
  to: gnss_rtk
  label: 精度递进
  style: solid
  direction: left-to-right
- from: wifi_fingerprint
  to: ble_beacon
  label: 精度递进
  style: solid
  direction: left-to-right
- from: ble_beacon
  to: uwb
  label: 精度递进
  style: solid
  direction: left-to-right
callouts:
- GNSS+RTK 提供室外最高精度，但基准站部署成本高昂。
- UWB 是室内精度冠军，但基站网络和标签成本限制了覆盖范围与部署密度。
- Wi-Fi和BLE的部署成本最低，适合区域级定位需求，无法支撑精细操作。
- 半室外过渡区（如物流月台）常需要用 GNSS 与 BLE 混合定位做平滑切换。
legend:
- 蓝色系节点=卫星定位技术；绿色=Wi-Fi；橙色=BLE；红色=UWB；灰色=地磁（备选方案）。
- 水平矩形宽度表示典型精度区间，矩形左边界对应最佳精度，右边界对应最差精度。
- 背景浅蓝色竖条区域=室外域；浅灰色区域=室内域；交界处的浅黄色竖条=半室外过渡区。
visual_constraints:
- 最多6个主节点，节点标签控制在14汉字以内。
- 颜色只用于区分技术族类，不宜超过6种。
- 图例放在图底部，不遮挡环境背景分区。
- 矩形宽度严格对应精度区间，不得随意拉伸。
render_notes: SVG/HTML 渲染，横轴采用对数刻度（0.1m、0.5m、1m、5m、10m处标辅助竖线）。各技术用圆角矩形水平放置，高度统一为40px，宽度按比例映射精度区间。背景：室外域（精度≥5m）涂浅蓝色（rgba(135,206,250,0.15)），半室外过渡区（1m～5m）涂浅黄色（rgba(255,255,0,0.10)），室内域（<1m）涂浅灰色（rgba(200,200,200,0.15)）。图例在底部，包含颜色与背景含义说明。
caption:
  zh: 图3-5 室内外定位技术覆盖与精度光谱示意。横轴为定位精度（米，对数刻度），各技术以水平矩形表示宽度对应的典型精度区间。背景色区分室外（浅蓝）、半室外过渡（浅黄）和室内（浅灰）三种环境域。
  en: 'Figure 3-5 Coverage and accuracy spectrum of indoor/outdoor positioning technologies. The horizontal axis is positioning accuracy in meters (log scale); each technology is a horizontal bar whose width spans its typical accuracy range. Background colors distinguish three environment zones: outdoor (light blue), semi-outdoor transition (light yellow), and indoor (light gray).'
labels:
  en:
    图3-5 室内外定位技术覆盖与精度光谱（示意）: 'Figure 3-5 Indoor/Outdoor Positioning: Coverage & Accuracy Spectrum (Illustrative)'
    展示GNSS、Wi-Fi、BLE、UWB等主流定位技术在室外、室内及半室外环境下的典型精度区间，横轴为对数刻度的定位精度（米），从左到右由粗到精，背景色区分室外、半室外过渡与室内三种环境域。: Typical accuracy ranges of mainstream positioning technologies — GNSS, Wi-Fi, BLE, UWB — across outdoor, indoor, and semi-outdoor environments. The axis is accuracy in meters on a log scale, coarse on the left to fine on the right; background colors mark outdoor, semi-outdoor transition, and indoor zones.
    展示GNSS、Wi-Fi、BLE、UWB等主流定位技术在室外、室内及半室外环境下的典型精度区间，帮助读者建立直观的选型直觉。: Typical accuracy ranges of mainstream positioning technologies — GNSS, Wi-Fi, BLE, UWB — across outdoor, indoor, and semi-outdoor environments, to build an intuitive sense for technology selection.
    室外覆盖域: Outdoor Coverage Zone
    无遮挡开阔，卫星信号稳定接收: Open and unobstructed; stable satellite reception
    半室外过渡区: Semi-Outdoor Transition Zone
    街谷、天桥等信号受限，精度显著退化: Street canyons and overpasses limit signals; accuracy degrades sharply
    室内覆盖域: Indoor Coverage Zone
    依赖 Wi-Fi / BLE / UWB / 地磁基础设施: Relies on Wi-Fi / BLE / UWB / geomagnetic infrastructure
    精度递进: Accuracy progression
    GNSS单频: GNSS Single-Frequency
    室外 · 数米至十米级: Outdoor · meters to 10s of meters
    室外 · 厘米级: Outdoor · centimeter level
    Wi-Fi指纹法: Wi-Fi Fingerprinting
    室内 · 米至十米级: Indoor · meters to 10s of meters
    BLE信标: BLE Beacon
    室内 · 米级: Indoor · meter level
    室内 · 分米级: Indoor · decimeter level
    地磁指纹: Geomagnetic Fingerprint
    室内 · 数米级: Indoor · several meters
    ← 粗精度: ← Coarse
    精精度 →: Fine →
    定位精度（米 · 对数刻度）: Positioning accuracy (m · log scale)
    GNSS+RTK 提供室外最高精度，但基准站部署成本高昂。: GNSS+RTK delivers the best outdoor accuracy, but base-station deployment is costly.
    UWB 是室内精度冠军，但基站网络与标签成本限制覆盖范围与部署密度。: UWB is the indoor accuracy champion, but anchor networks and tag costs limit coverage and density.
    Wi-Fi 与 BLE 部署成本最低，适合区域级定位，但难支撑精细操作。: Wi-Fi and BLE cost the least to deploy and suit zone-level positioning, but cannot support fine-grained operations.
    半室外过渡区（如物流月台）常用 GNSS 与 BLE 混合定位做平滑切换。: Semi-outdoor transition zones (e.g. loading docks) often blend GNSS and BLE for smooth handover.
    卫星定位（GNSS）: Satellite (GNSS)
    地磁（备选）: Geomagnetic (backup)
    浅蓝＝室外覆盖域: Light blue = outdoor zone
    浅黄＝半室外过渡区: Light yellow = semi-outdoor transition
    浅灰＝室内覆盖域: Light gray = indoor zone
    矩形宽度＝典型精度区间（左边界≈最粗精度，右边界≈最精精度）: Bar width = typical accuracy range (left edge ≈ coarsest, right edge ≈ finest)
