type: flowchart
title: 图 3-5 RFID 防碰撞两条路线与标签存储结构
audience_takeaway: 读者应理解帧时隙 ALOHA 用概率换取吞吐、二进制搜索树用确定性换取按序识别，EPC Gen2 标签分 Reserved/EPC/TID/User 四存储体。
purpose: 展示 RFID 防碰撞两条路线与标签四存储体
visual_focus: 概率路线与确定路线对比，标签四存储体。
design_level: flowchart
layout: 上半两条防碰撞路线卡片，下半标签四存储体，底部工程权衡
elements:
- 帧时隙 ALOHA：帧长 2^Q、标签随机选时隙、自适应 Q 值，适合标签量大场景
- 二进制搜索树：前缀掩码、对半拆分搜索，适合严格按序识别场景
- 四存储体：Reserved（口令）、EPC（唯一代码）、TID（厂商标识）、User（应用数据）
relationships:
- 两条路线分别以概率与确定性解决碰撞；四存储体各司安全、身份、厂商与应用
