caption:
  zh: 图 3-5 帧时隙 ALOHA 用概率换取高吞吐，二进制搜索树用确定性换取按序识别；EPC Gen2 标签分 Reserved/EPC/TID/User 四存储体，各司安全、身份、厂商与应用数据。
  en: Figure 3-5 Framed slotted ALOHA trades probability for high throughput, while the binary search tree trades determinism for ordered identification; EPC Gen2 tags have four memory banks — Reserved, EPC, TID, and User — handling security, identity, vendor, and application data respectively.
labels:
  en:
    图 3-5 RFID 防碰撞两条路线与标签存储结构: Figure 3-5 Two RFID Anti-Collision Routes & Tag Memory Layout
    帧时隙 ALOHA 用概率换取吞吐，二进制搜索树用确定性换取按序识别；标签分 Reserved/EPC/TID/User 四存储体。: Framed slotted ALOHA trades probability for throughput; the binary search tree trades determinism for ordered identification. Tags have Reserved/EPC/TID/User banks.
    防碰撞协议为大量标签在共享信道上制定有序发言规则: Anti-collision protocols give many tags orderly turns on a shared channel
    概率路线：帧时隙 ALOHA（FSA）: 'Probabilistic route: Framed Slotted ALOHA (FSA)'
    读写器设帧长 2^Q 个时隙，Q ∈ [0,15]: Reader sets frame length 2^Q slots, Q ∈ [0,15]
    标签随机选时隙回复：独占时隙 = 成功识别，多标签 = 碰撞: 'Tags reply in randomly chosen slots: sole occupant = success, multiple tags = collision'
    自适应 Q 值机制按碰撞/空闲比例估算标签量，动态调帧长: Adaptive Q estimates tag count from the collision/idle ratio and tunes frame length
    适合：仓库、物流等标签量大、动态性强的场景: 'Fits: warehouses, logistics — many tags, high dynamics'
    标签量接近帧长时吞吐率最高；远超帧长时碰撞时隙非线性上升: Throughput peaks when tag count ≈ frame length; far beyond it, collision slots rise non-linearly
    确定路线：二进制搜索树: 'Deterministic route: Binary Search Tree'
    查询指令携带前缀比特掩码，只邀请 ID 前缀匹配的标签回复: The query carries a prefix bit mask, inviting only tags whose IDs match to reply
    某比特位碰撞 → 对半拆分搜索空间，缩小前缀再问: A bit collision → halve the search space, narrow the prefix, ask again
    直至只剩唯一匹配标签，每张标签需多次往返通信: Until one tag remains; each tag needs many round trips
    适合：门禁、资产盘点等标签少但要求严格按序识别: 'Fits: access control, asset audit — few tags, strict ordering'
    标签量大时总耗时通常超过 FSA 方案: With many tags, total time usually exceeds FSA
    EPC Gen2 标签四存储体: Four Memory Banks of an EPC Gen2 Tag
    Reserved 区: Reserved Bank
    销毁口令 + 访问口令，各 32 位: Kill + access passwords, 32 bits each
    Kill 命令使标签永久失效，防隐私泄露: The Kill command permanently disables the tag against privacy leaks
    EPC 区: EPC Bank
    物品唯一电子产品代码，常见 96 位: Globally unique electronic product code, typically 96 bits
    标头/划分号/对象分类/序列号 + CRC-16: Header / partition / object class / serial + CRC-16
    TID 区: TID Bank
    芯片制造商预置全球唯一标识符: Globally unique ID preset by the chip maker
    64~96 位，出厂写入不可修改: 64–96 bits, written at the factory, read-only
    User 区（可选）: User Bank (optional)
    应用自定义数据：产品批号、生产日期: 'App-defined data: batch number, production date'
    工艺参数，长度由芯片制造商定义: Process parameters; length set by the chip maker
    读取速率与标签数量呈“先升后降”非线性关系；隐藏终端效应（强信号压制弱信号）使实测速率低于理论值: Read rate vs tag count is non-linear, first rising then falling; the hidden-terminal effect (strong signals masking weak ones) keeps measured rates below theory
    优化：设恰当 Q 初值、用 Session 机制分散负载、控制标签经过天线速度、适当倾斜标签分散天线方向: 'Optimizations: set a good initial Q, spread load with Sessions, control tag speed past the antenna, tilt tags to spread antenna direction'
    图 3-5 帧时隙 ALOHA 用概率换取高吞吐，二进制搜索树用确定性换取按序识别；EPC Gen2 标签分 Reserved/EPC/TID/User 四存储体，各司安全、身份、厂商与应用数据。: Figure 3-5 Framed slotted ALOHA trades probability for high throughput, while the binary search tree trades determinism for ordered identification; EPC Gen2 tags have four memory banks — Reserved, EPC, TID, and User — handling security, identity, vendor, and application data respectively.
