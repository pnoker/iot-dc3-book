  <desc id="desc">读者应理解物模型的价值核心在于能力抽象：上层应用只与物模型交互，无需感知底层设备是Modbus RTU、MQTT还是二进制协议。</desc>

  </style>

  <defs>

  <rect width="1800" height="900" fill="#FFFFFF"/>

  <text x="82" y="47" fill="#0F172A" font-size="36" font-weight="700">图 3-13 物模型驱动设备互操作的示意图</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解物模型的价值核心在于能力抽象：上层应用只与物模型交互，无需感知底层设备是Modbus RTU、MQTT还是二进制协议。</text>

  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">

  <!-- ============ 区域边界框（三层） ============ -->
  <!-- 应用消费域 -->
  <rect x="360" y="125" width="1080" height="160" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="8,4"/>
  <rect x="375" y="138" width="116" height="24" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="433" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">应用消费域</text>
  <text x="505" y="155" font-size="12" fill="#64748B">· 消费标准化能力的边界</text>

  <!-- 物模型抽象域 -->
  <rect x="360" y="325" width="1080" height="225" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="8,4"/>

  <text x="505" y="610" font-size="12" fill="#64748B">· 异构设备与协议的存在边界</text>

  <text x="715" y="230" text-anchor="middle" font-size="12" fill="#475569">统一消费物模型数据</text>

  <text x="1205" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">楼宇自控应用</text>
  <text x="1205" y="230" text-anchor="middle" font-size="12" fill="#475569">不关心底层设备厂商</text>

  <rect x="520" y="385" width="250" height="115" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="530" y="392" width="78" height="24" rx="12" fill="#2563EB"/>

  <text x="940" y="455" text-anchor="middle" font-size="12" fill="#475569">校准、重启、设定阈值</text>

  <rect x="1110" y="385" width="250" height="115" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>

  <text x="545" y="711" text-anchor="middle" font-size="12" fill="#64748B">HTTP 上报</text>

  <rect x="670" y="640" width="190" height="95" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="765" y="668" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">温度传感器</text>
  <text x="765" y="691" text-anchor="middle" font-size="12" fill="#475569">(B公司 · Modbus)</text>
  <text x="765" y="711" text-anchor="middle" font-size="12" fill="#64748B">RTU 寄存器</text>

  <rect x="890" y="640" width="190" height="95" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>

  <text x="985" y="711" text-anchor="middle" font-size="12" fill="#64748B">Topic 订阅</text>

  <rect x="1110" y="640" width="190" height="95" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1205" y="668" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">RFID 读写器</text>
  <text x="1205" y="691" text-anchor="middle" font-size="12" fill="#475569">(D公司 · 二进制)</text>
  <text x="1205" y="711" text-anchor="middle" font-size="12" fill="#64748B">Socket 报文</text>

  <rect x="538" y="560" width="44" height="20" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="560" y="576" text-anchor="middle" font-size="12" fill="#2563EB">温度</text>

  <line x1="765" y1="640" x2="655" y2="500" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="688" y="560" width="44" height="20" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="710" y="576" text-anchor="middle" font-size="12" fill="#2563EB">温度</text>

  <line x1="985" y1="640" x2="720" y2="500" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>

  <rect x="1173" y="560" width="84" height="20" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="1215" y="576" text-anchor="middle" font-size="12" fill="#64748B">标签碰撞</text>

  <!-- ============ 连线：物模型层 → 应用层（统一输出） ============ -->
  <!-- 温度属性汇聚后的统一输出（主链路粗箭头） -->
  <line x1="645" y1="385" x2="700" y2="260" stroke="#2563EB" stroke-width="4" marker-end="url(#bp-arrow-thick)"/>
  <rect x="610" y="312" width="126" height="22" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="673" y="327" text-anchor="middle" font-size="12" font-weight="600" fill="#2563EB">统一输出 · 标准属性值</text>

  <line x1="905" y1="385" x2="745" y2="260" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="792" y="312" width="64" height="20" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="824" y="327" text-anchor="middle" font-size="12" fill="#2563EB">标准服务</text>

  <!-- 事件 → 楼宇自控（事件推送，虚线） -->
  <line x1="1205" y1="385" x2="1130" y2="260" stroke="#64748B" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#bp-arrow-dashed)"/>
  <rect x="1127" y="312" width="80" height="20" rx="4" fill="#FFFFFF" stroke="none"/>
  <text x="1167" y="327" text-anchor="middle" font-size="12" fill="#64748B">事件推送</text>

  <!-- ============ 右侧注释（callouts） ============ -->
  <rect x="1500" y="330" width="240" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1515" y="355" font-size="12" font-weight="700" fill="#D97706">核心矛盾</text>
  <text x="1515" y="378" font-size="12" fill="#475569">dev-ax4 与 dev-bx4 都代表</text>

  <text x="1515" y="418" font-size="12" fill="#475569">应用层无法直接消费。</text>

  <text x="1515" y="533" font-size="12" fill="#475569">应用层不再接触底层协议。</text>

  <rect x="560" y="816" width="16" height="14" rx="2" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>

  <line x1="1040" y1="823" x2="1068" y2="823" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="1076" y="828" fill="#64748B" font-size="12" font-weight="600" text-anchor="start">实线＝能力映射与服务调用 · 虚线＝事件推送</text>
  <line x1="1430" y1="823" x2="1458" y2="823" stroke="#2563EB" stroke-width="4" marker-end="url(#bp-arrow-thick)"/>
  <text x="1466" y="828" fill="#64748B" font-size="12" font-weight="600" text-anchor="start">粗箭头＝温度属性汇聚后的统一输出</text>

  <text x="900" y="874" fill="#475569" font-size="17" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图 3-13 物模型作为中间抽象层，将异构设备的能力映射到标准的属性、服务和事件，使上层应用可统一消费数据。</text>
