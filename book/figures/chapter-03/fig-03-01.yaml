callouts:
- 感知层内部三大组件：传感器、识别设备、定位模块，各自负责不同维度的物理世界映射。
- 平台层的物模型管理是关键抽象，它将感知层的原始数据升维为可理解的设备属性与事件。
- 控制反馈链路（虚线）构成了从感知到决策再到执行的完整闭环。
legend:
- 蓝色系：感知层组件；蓝绿色：网络层；绿色系：平台层服务；橙色：应用层；灰色：物理世界
- 实线箭头：数据流方向（自下而上）；虚线箭头：控制流或事件驱动（自上而下）
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入callouts或正文。
- 图例放在底部，不遮挡主体结构。
- 平台层内部四个服务节点之间使用横向实线箭头表示处理顺序。
render_notes: HTML/SVG渲染，浅色背景，圆角矩形（半径6px），层间垂直间隔10px。字体参照全书配置。箭头颜色#888，线宽2px。
caption:
  zh: 图 3-1 感知层在物联网多层参考架构中的位置。感知层包含传感器、识别设备和定位模块三大组件，负责将物理世界信息转换为位号值流、身份码和坐标数据，通过网络层上传至平台层和应用层。实线箭头表示数据流方向，虚线箭头表示控制指令或事件驱动方向。
  en: Figure 3-1 Where the sensing layer sits in the multi-layer IoT reference architecture. The sensing layer comprises three component groups — sensors, identification devices, and positioning modules — which convert physical-world information into point-value streams, identity codes, and coordinate data, uploaded through the network layer to the platform and application layers. Solid arrows mark data flow; dashed arrows mark control commands or event-driven flow.
labels:
  en:
    图 3-1 感知层在物联网多层参考架构中的位置: Figure 3-1 The Sensing Layer in the Multi-Layer IoT Reference Architecture
    感知层连接物理世界与数字系统，传感器、识别设备和定位模块共同向上输出数据，控制流反向下行。: 'The sensing layer bridges the physical and digital worlds: sensors, identification devices, and positioning modules feed data upward while control flows back down.'
    物理世界: Physical World
    设备、环境、物品: Devices / Environment / Goods
    感知层: Sensing Layer
    传感器: Sensors
    温度、压力、振动、气体: Temp / Pressure / Vibration / Gas
    识别设备: Identification Devices
    RFID读写器、条码扫描器: RFID readers / barcode scanners
    定位模块: Positioning Modules
    GNSS接收机、UWB基站: GNSS receivers / UWB anchors
    网络层: Network Layer
    有线通信 / 无线通信: Wired / Wireless
    平台层: Platform Layer
    设备管理: Device Management
    物模型管理: Thing Model Management
    数据存储: Data Storage
    规则引擎: Rule Engine
    应用层: Application Layer
    工业监控 / 智慧园区 / 能源管理: Industrial Monitoring / Smart Park / Energy Mgmt
    汇聚节点中: In aggregation nodes,
    远距离通信: long-distance links
    功能属于网络层: are network-layer functions
    物理量 / 状态: Physical quantities / states
    位号值流 / 身份码 / 坐标: Point values / ID codes / coordinates
    传输协议 (MQTT/Modbus/OPC UA): Transport (MQTT/Modbus/OPC UA)
    API 与数据服务: API & Data Services
    控制指令: Control Commands
    实线箭头 = 数据流，虚线箭头 = 控制流: Solid arrows = data flow, dashed = control flow
    图 3-1 感知层在物联网多层参考架构中的位置。感知层包含传感器、识别设备和定位模块三大组件，负责将物理世界信息转换为位号值流、身份码和坐标数据，通过网络层上传至平台层和应用层。箭头方向表示数据流向（自下而上）或控制指令流向（自上而下虚线）。: Figure 3-1 The sensing layer in the multi-layer IoT reference architecture. Its three component groups — sensors, identification devices, and positioning modules — convert physical-world information into point-value streams, identity codes, and coordinate data, uploaded through the network layer to the platform and application layers. Arrows show data flow (bottom-up) and control-command flow (top-down, dashed).
