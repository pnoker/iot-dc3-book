type: layered
title: 图 3-1 感知层在物联网多层参考架构中的位置
purpose: 展示感知层在物联网多层参考架构中的底层位置，及其内部三大类组件（传感器、识别设备、定位模块）与上层网络层/平台层/应用层的接口关系。同时标注感知层的逻辑边界。
audience_takeaway: 感知层是物理世界与数字系统的桥梁，其核心产出是带语义的位号值流，四层架构的数据流与控制流方向相反。
visual_focus: 感知层内部三大组件（传感器、RFID、定位模块）共同向上输出数据的主链路；平台层内部四等分展示关键服务能力。
design_level: logical
layout: 自下而上分层架构：物理世界→感知层→网络层→平台层→应用层。感知层内部三等分展示传感器、识别设备、定位模块。平台层内部四等分展示设备管理、物模型管理、数据存储、规则引擎。
elements:
- 物理世界与感知层的传感器、识别设备、定位模块
- 网络层与平台层的设备管理、物模型、数据存储、规则引擎
- 应用层与控制指令
relationships:
- 物理世界 → 传感器、识别设备、定位模块：产生物理量、身份码与空间坐标
- 感知层组件 → 网络层 → 平台层 → 应用层：位号值、身份和位置数据逐层上行
- 应用层 → 控制指令 → 物理世界：决策下发并驱动执行或复位
regions:
- id: physical_world
  label: 物理世界域
  role: 设备、环境、物品等被监测对象
- id: perception_domain
  label: 感知层
  role: 数据采集、身份识别、位置感知与初步处理
- id: network_domain
  label: 网络层
  role: 远距离数据传输与协议封装
- id: platform_domain
  label: 平台层
  role: 设备管理、数据治理、规则引擎与物模型抽象
- id: application_domain
  label: 应用层
  role: 业务价值交付与决策执行
components:
