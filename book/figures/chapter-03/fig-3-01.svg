<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="41.176" width="1152.000" height="677.647" viewBox="0 0 1700.000 1000.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1700" height="1000" fill="#FFFFFF"/>

  <!-- ===================== TITLE ===================== -->
  <g id="title">
    <circle cx="64" cy="42" r="6" fill="#2563EB"/>
    <text x="84" y="48" font-size="22" font-weight="700" fill="#0F172A">图3-1 感知层在物联网架构中的位置</text>
    <text x="84" y="70" font-size="12" fill="#64748B">Perception Layer in the IoT Stack · 作为数据源头的底层入口与采集 / 识别 / 定位 / 处理四项基础能力</text>
    <rect x="1568" y="28" width="102" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1619" y="47" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.5">LAYERED</text>
    <line x1="40" y1="103" x2="1660" y2="103" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- ===================== OUTER BOUNDARY ===================== -->
  <g id="boundary">
    <rect x="120" y="130" width="1460" height="750" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="6 4"/>
    <rect x="132" y="120" width="216" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="240" y="136" font-size="11" fill="#64748B" text-anchor="middle">物联网（IoT）四层架构</text>
  </g>

  <!-- right-side vertical data-flow indicator -->
  <g id="flow-axis">
    <line x1="1605" y1="858" x2="1605" y2="172" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
    <text x="1628" y="515" font-size="10" fill="#94A3B8" text-anchor="middle" transform="rotate(-90 1628 515)">数据上行 · 价值递增</text>
  </g>

  <!-- ===================== LAYER 1 · 应用层 (blue) ===================== -->
  <g id="layer-application">
    <rect x="140" y="148" width="1420" height="110" rx="10" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
    <rect x="156" y="162" width="176" height="82" rx="8" fill="#2563EB"/>
    <text x="244" y="200" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">应用层</text>
    <text x="244" y="219" font-size="10" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle" letter-spacing="1">APPLICATION</text>
    <text x="244" y="235" font-size="9" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">业务 · 用户</text>
    <g font-size="13" fill="#0F172A" text-anchor="middle">
      <rect x="510" y="184" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/><text x="590" y="208">智慧城市</text>
      <rect x="690" y="184" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/><text x="770" y="208">工业互联网</text>
      <rect x="870" y="184" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/><text x="950" y="208">智慧农业</text>
      <rect x="1050" y="184" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/><text x="1130" y="208">智能家居</text>
      <rect x="1230" y="184" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/><text x="1310" y="208">智慧医疗</text>
    </g>
  </g>

  <!-- ===================== LAYER 2 · 平台层 (purple) ===================== -->
  <g id="layer-platform">
    <rect x="140" y="273" width="1420" height="110" rx="10" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2"/>
    <rect x="156" y="287" width="176" height="82" rx="8" fill="#7C3AED"/>
    <text x="244" y="325" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">平台层</text>
    <text x="244" y="344" font-size="10" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle" letter-spacing="1">PLATFORM</text>
    <text x="244" y="360" font-size="9" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">数据 · 服务</text>
    <g font-size="13" fill="#0F172A" text-anchor="middle">
      <rect x="510" y="309" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="590" y="333">设备建模</text>
      <rect x="690" y="309" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="770" y="333">数据中台</text>
      <rect x="870" y="309" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="950" y="333">规则引擎</text>
      <rect x="1050" y="309" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="1130" y="333">API 开放</text>
      <rect x="1230" y="309" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.3"/><text x="1310" y="333">身份鉴权</text>
    </g>
  </g>

  <!-- ===================== LAYER 3 · 网络层 (gray) ===================== -->
  <g id="layer-network">
    <rect x="140" y="398" width="1420" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <rect x="156" y="412" width="176" height="82" rx="8" fill="#64748B"/>
    <text x="244" y="450" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">网络层</text>
    <text x="244" y="469" font-size="10" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle" letter-spacing="1">NETWORK</text>
    <text x="244" y="485" font-size="9" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">传输 · 管道</text>
    <g font-size="13" fill="#0F172A" text-anchor="middle">
      <rect x="510" y="434" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/><text x="590" y="458">5G · NB-IoT</text>
      <rect x="690" y="434" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/><text x="770" y="458">Wi-Fi · 蓝牙</text>
      <rect x="870" y="434" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/><text x="950" y="458">LoRa · Zigbee</text>
      <rect x="1050" y="434" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/><text x="1130" y="458">工业以太网</text>
      <rect x="1230" y="434" width="160" height="38" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/><text x="1310" y="458">卫星 · 光纤</text>
    </g>
  </g>

  <!-- ===================== NETWORK ↔ PERCEPTION CONNECTION ===================== -->
  <g id="handoff">
    <line x1="830" y1="566" x2="830" y2="514" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
    <line x1="870" y1="514" x2="870" y2="566" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <rect x="898" y="520" width="176" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="910" cy="535" r="3" fill="#2563EB"/>
    <text x="920" y="539" font-size="11" fill="#0F172A">原始数据上行</text>
    <circle cx="910" cy="552" r="3" fill="#64748B"/>
    <text x="920" y="556" font-size="11" fill="#475569">控制指令下行</text>
  </g>

  <!-- ===================== LAYER 4 · 感知层 (green · HERO) ===================== -->
  <g id="layer-perception">
    <rect x="140" y="568" width="1420" height="302" rx="10" fill="#10B981" fill-opacity="0.07" stroke="#10B981" stroke-width="2.5"/>
    <rect x="156" y="582" width="176" height="274" rx="8" fill="#10B981"/>
    <text x="244" y="695" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">感知层</text>
    <text x="244" y="717" font-size="10" fill="#FFFFFF" fill-opacity="0.9" text-anchor="middle" letter-spacing="1">PERCEPTION</text>
    <line x1="184" y1="733" x2="304" y2="733" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
    <text x="244" y="753" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">数据源头</text>
    <text x="244" y="771" font-size="9" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">物理世界入口</text>

    <!-- Card 1 · 采集 -->
    <rect x="378" y="600" width="265" height="240" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <circle cx="400" cy="622" r="11" fill="#10B981"/>
    <text x="400" y="626" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="511" cy="650" r="26" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.5"/>
    <rect x="489" y="656" width="8" height="8" rx="1.5" fill="#10B981"/>
    <rect x="501" y="648" width="8" height="16" rx="1.5" fill="#10B981"/>
    <rect x="513" y="640" width="8" height="24" rx="1.5" fill="#10B981"/>
    <rect x="525" y="632" width="8" height="32" rx="1.5" fill="#10B981"/>
    <text x="511" y="706" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">数据采集</text>
    <text x="511" y="725" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="1">COLLECTION</text>
    <line x1="408" y1="742" x2="613" y2="742" stroke="#E2E8F0" stroke-width="1"/>
    <g font-size="11" fill="#475569" text-anchor="middle">
      <text x="511" y="766">温度 · 湿度 · 压力</text>
      <text x="511" y="786">振动 · 流量 · 光照</text>
      <text x="511" y="806">气体 · 电压 · 电流</text>
    </g>

    <!-- Card 2 · 识别 -->
    <rect x="671" y="600" width="265" height="240" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <circle cx="693" cy="622" r="11" fill="#10B981"/>
    <text x="693" y="626" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="804" cy="650" r="26" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.5"/>
    <g fill="#10B981">
      <rect x="786" y="634" width="3" height="32"/>
      <rect x="792" y="634" width="2" height="32"/>
      <rect x="798" y="634" width="4" height="32"/>
      <rect x="805" y="634" width="2" height="32"/>
      <rect x="810" y="634" width="3" height="32"/>
      <rect x="816" y="634" width="2" height="32"/>
      <rect x="821" y="634" width="2" height="32"/>
    </g>
    <text x="804" y="706" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">身份识别</text>
    <text x="804" y="725" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="1">RECOGNITION</text>
    <line x1="701" y1="742" x2="906" y2="742" stroke="#E2E8F0" stroke-width="1"/>
    <g font-size="11" fill="#475569" text-anchor="middle">
      <text x="804" y="766">RFID · 二维码</text>
      <text x="804" y="786">NFC · 生物特征</text>
      <text x="804" y="806">图像 · 声纹识别</text>
    </g>

    <!-- Card 3 · 定位 -->
    <rect x="964" y="600" width="265" height="240" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <circle cx="986" cy="622" r="11" fill="#10B981"/>
    <text x="986" y="626" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <circle cx="1097" cy="650" r="26" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.5"/>
    <path d="M 1097 628 C 1084 628 1084 650 1097 672 C 1110 650 1110 628 1097 628 Z" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="1097" cy="648" r="5" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1097" y="706" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">定位追踪</text>
    <text x="1097" y="725" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="1">POSITIONING</text>
    <line x1="994" y1="742" x2="1199" y2="742" stroke="#E2E8F0" stroke-width="1"/>
    <g font-size="11" fill="#475569" text-anchor="middle">
      <text x="1097" y="766">GPS · 北斗卫星</text>
      <text x="1097" y="786">UWB · 蓝牙信标</text>
      <text x="1097" y="806">Wi-Fi · 基站定位</text>
    </g>

    <!-- Card 4 · 处理 -->
    <rect x="1257" y="600" width="265" height="240" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <circle cx="1279" cy="622" r="11" fill="#10B981"/>
    <text x="1279" y="626" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <circle cx="1390" cy="650" r="26" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.5"/>
    <path d="M 1378 636 L 1402 636 L 1394 656 L 1394 672 L 1386 672 L 1386 656 Z" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="1390" y="706" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">初步处理</text>
    <text x="1390" y="725" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="1">PRE-PROCESS</text>
    <line x1="1287" y1="742" x2="1492" y2="742" stroke="#E2E8F0" stroke-width="1"/>
    <g font-size="11" fill="#475569" text-anchor="middle">
      <text x="1390" y="766">信号调理 · 滤波</text>
      <text x="1390" y="786">边缘计算 · 聚合</text>
      <text x="1390" y="806">协议转换 · 缓存</text>
    </g>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <line x1="40" y1="895" x2="1660" y2="895" stroke="#E2E8F0" stroke-width="1"/>
  <g id="legend" font-size="11" fill="#475569">
    <rect x="120" y="910" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/><text x="146" y="922">感知层 · 数据源头（高亮）</text>
    <rect x="372" y="910" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="398" y="922">网络层 · 传输管道</text>
    <rect x="586" y="910" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="612" y="922">平台层 · 数据与服务</text>
    <rect x="824" y="910" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="850" y="922">应用层 · 业务呈现</text>
    <line x1="1040" y1="917" x2="1066" y2="917" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/><text x="1076" y="922">原始数据上行</text>
    <line x1="1240" y1="917" x2="1266" y2="917" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/><text x="1276" y="922">控制指令回传</text>
  </g>

  <!-- ===================== CAPTION ===================== -->
  <text x="850" y="975" font-size="10" fill="#94A3B8" text-anchor="middle">图3-1　感知层是物理世界进入数字世界的入口，提供采集、识别、定位、初步处理四项能力，向上交接给网络层。</text>
  </svg>
</svg>