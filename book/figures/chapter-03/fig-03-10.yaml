type: architecture
title: 图3-10 物模型与设备实例的关系：属性、动作、事件的交互模式
purpose: 直观说明物模型作为“模板”如何被实例化，以及属性、动作、事件在平台侧的三种典型交互方式。
audience_takeaway: 读者应理解物模型是一类设备的能力契约，多个设备实例共享同一模板，平台无需关心设备内部差异。
visual_focus: 从物模型模板到告警服务的主链路。
design_level: logical
layout: 三层架构：顶部为“物模型模板”，中间为“设备实例层”，底部为“平台应用层”。
elements:
- T-100 温度传感器物模型模板
- 设备 A 与设备 B 实例
- 时序数据存储、远程控制与告警服务
relationships:
- T-100 模板 → 设备 A、设备 B：同一能力契约被多个实例复用
- 设备 A、设备 B → 数据存储：按模板上报属性值
- 远程控制 → 设备 A、设备 B：按模板下发动作
- 设备 A、设备 B → 告警服务：按模板推送事件
regions:
- id: model_domain
  label: 物模型域
  role: 能力契约与模板定义边界
- id: device_domain
  label: 设备实例域
  role: 现场设备实例集合
- id: platform_domain
  label: 平台应用域
  role: 数据处理与控制能力边界
components:
- id: thing_model_template
  label: 模版T-100
  type: platform
  subtitle: 温度传感器物模型
  group: model_domain
  priority: primary
  shape: card
- id: device_a
  label: 设备A
  type: edge
  subtitle: '实例ID: t-100-001'
  group: device_domain
  priority: normal
  shape: card
- id: device_b
  label: 设备B
  type: edge
  subtitle: '实例ID: t-100-002'
  group: device_domain
  priority: normal
  shape: card
- id: data_storage
  label: 数据存储
  type: data
  subtitle: 时序库
  group: platform_domain
  priority: primary
  shape: database
- id: remote_control
  label: 远程控制
  type: platform
  subtitle: 动作下发
  group: platform_domain
  priority: normal
  shape: card
- id: alarm_service
  label: 告警服务
  type: security
  subtitle: 事件处理
  group: platform_domain
  priority: normal
