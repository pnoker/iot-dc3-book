- from: thing_model_template
  to: device_a
  label: 复用
  style: dashed
  direction: bottom-to-top
- from: thing_model_template
  to: device_b
  label: 复用
  style: dashed
  direction: bottom-to-top
- from: device_a
  to: data_storage
  label: 上报属性
  style: solid
  direction: bottom-to-top
- from: device_b
  to: data_storage
  label: 上报属性
  style: solid
  direction: bottom-to-top
- from: remote_control
  to: device_a
  label: 下发动作
  style: solid
  direction: top-to-bottom
- from: remote_control
  to: device_b
  label: 下发动作
  style: solid
  direction: top-to-bottom
- from: device_a
  to: alarm_service
  label: 推送事件
  style: dashed
  direction: event
- from: device_b
  to: alarm_service
  label: 推送事件
  style: dashed
  direction: event
callouts:
- 物模型模板被多个设备实例复用，模板定义一次，实例各自履行。
- 平台侧的三个应用模块分别对应属性、动作、事件三种交互类型。
- 动作下发方向是从平台到设备，属性上报和事件推送是从设备到平台。
legend:
- 橙色=物模型模板；灰色=设备实例；蓝色=平台服务。
- 实线=同步或异步请求/响应；虚线=模板关联或事件推送。
visual_constraints:
- 最多6个主节点，节点标签短，解释放入 callouts。
- 图例放在图底部，不遮挡分组边界。
- 橙色只用于物模型模板，不扩散到设备实例。
render_notes: HTML/SVG 渲染，浅色背景，圆角矩形。三行布局，顶部一个橙色宽矩形（模版T-100），中间两个灰色窄矩形并列（设备A、设备B），底部三个蓝色窄矩形并列（数据存储、远程控制、告警服务）。底部图例和出版级图注。
caption:
  zh: 图3-10 物模型作为模板被多个设备实例复用，设备通过标准的三类接口与平台应用通信。平台无需关心设备内部差异，只需按照物模型定义的数据格式和协议进行交互。
  en: Figure 3-10 A thing model template reused by multiple device instances; devices talk to platform applications through three standard interface types. The platform never needs to care about internal device differences — it only interacts using the data formats and protocols defined by the thing model.
labels:
  en:
    图3-10 物模型与设备实例的关系：属性、动作、事件的交互模式: 'Figure 3-10 Thing Model and Device Instances: Property, Action, and Event Interactions'
    一份物模型模板被多台设备复用，设备与平台间通过属性上报、动作下发、事件推送三类接口交互。: One thing-model template is reused across many devices; device and platform interact through three interface types — property reporting, action delivery, and event push.
