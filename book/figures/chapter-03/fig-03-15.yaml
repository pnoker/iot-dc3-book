labels:
  en:
    图 3-15 物模型与状态模式在数据互通中的分工: Figure 3-15 Thing Models and State Patterns in Data Interoperability
    物模型统一异构数据语义；设备影子是可选状态同步模式，应用复用仍需验证数据与执行契约。: The thing model unifies heterogeneous data semantics; a device shadow is optional, and reuse still requires data and execution-contract validation.
    语义契约是基础；状态同步与应用复用需要分别验证: The semantic contract is the base; validate state synchronization and application reuse separately
    "“00 64” → 0x0064×0.1 = 10.0℃": '"00 64" → 0x0064 × 0.1 = 10.0°C'
    可选设备影子：显式管理状态同步: 'Optional Device Shadow: Explicit State Synchronization'
    复用物模型字段维护期望状态与已上报状态，但设备影子是独立运行时机制: Reuse thing-model fields for desired and reported state, while keeping the shadow a separate runtime mechanism
    离线写入转为带版本与有效期的待同步状态；上线后仍需校验、执行与回执: Offline writes become versioned pending state with an expiry; reconnect still requires validation, execution, and a receipt
    必须处理过期命令、冲突合并、重复执行、重启恢复与人工接管: Handle stale commands, conflict merging, duplicate execution, reboot recovery, and human takeover
    并非所有平台都实现通用影子；当前 IoT DC3 不能按通用 Device Shadow 描述: Not every platform implements a universal shadow; current IoT DC3 must not be described as one
    稳定契约：降低应用的协议耦合: 'Stable Contract: Reducing Protocol Coupling'
    兼容物模型可复用核心逻辑；单位、质量、采样周期与可写范围仍需现场验证: Compatible thing models can reuse core logic; units, quality, sampling intervals, and writable ranges still need field validation
    应用不处理总线字节，但仍依赖版本化数据契约，不能宣称与基础设施彻底解耦: Applications avoid bus bytes but still depend on versioned data contracts; infrastructure is not fully decoupled
    AI 经授权 Tool 读取位号值；写操作形成待确认 Action，不因语义统一而自动获准: AI reads point values through authorized Tools; writes create pending Actions and gain no automatic approval from shared semantics
    'IoT DC3 经 /profile REST API 管理 Profile：设备引用定义，同类设备可复用': 'IoT DC3 manages Profiles through the /profile REST API: devices reference definitions that peers can reuse'
    图 3-15 物模型统一异构数据语义；设备影子仅是可选状态模式，应用复用仍需验证契约与执行边界。: Figure 3-15 The thing model unifies heterogeneous data semantics; a device shadow is only an optional state pattern, and application reuse still requires contract and execution-boundary validation.
    语义适配层：消弭协议鸿沟: 'Semantic Adaptation Layer: Bridging Protocol Gaps'
    A 厂温湿度变送器: Vendor A temp/humidity transmitter
    温度在第 3~4 字节十六进制表达: Temperature in hex at bytes 3–4
    B 厂空调控制器: Vendor B AC controller
    KNX 总线: KNX Bus
    温度设定值对应通讯对象号: Temperature setpoint maps to a comms object number
    KNX 数据点“9.001”: KNX datapoint "9.001"
    C 厂智能电表: Vendor C smart meter
    DL/T645 协议: DL/T645 Protocol
    数据标识符层层嵌套: Data identifiers nested layer upon layer
    私有协议需逐个解析: Proprietary protocols parsed one by one
    统一物模型（语义空间）: Unified Thing Model (Semantic Space)
    属性（Property）· 服务（Service）· 事件（Event）: Properties (Property) · Services (Service)
      · Events (Event)
    三者的“温度”归入同一位号: All three fold their "temperature" into one point
    适配逻辑集成到设备接入模块，复用同一套映射: Adaptation logic lives in the access module and is reused
