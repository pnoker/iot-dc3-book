type: architecture
title: 图3-3 RFID系统工作示意图
purpose: 展示RFID系统核心部件——上位机、读写器、天线、标签之间的数据、控制与射频链路。
audience_takeaway: 读者应理解上位机与读写器之间既有数据上报也有控制下发；天线是独立性能模块，读写器通过耦合能量与标签交换数据。
visual_focus: 上位机与读写器双向通信；读写器通过天线发射射频信号，被动标签从场中取能并反向散射回复信号，主动标签主动发射。
design_level: logical
layout: 从左到右：上位机→读写器→天线→标签（三种类型并列表示）
elements:
- 上位机（边缘节点或平台）：通过有线协议与读写器通信。
- 读写器：射频收发与解析，数据转发。
- 天线：辐射/接收，极化与增益指示。
- 被动标签：无源，取能。
- 半主动标签：有源供电芯片，被动反射。
- 主动标签：有源收发。
relationships:
- 上位机 ↔ 读写器：数据/控制流，实线双向箭头。
- 读写器 → 天线：射频信号输出，实线箭头。
- 天线 <--> 被动标签：耦合能量与反射信号，虚线双向箭头。
- 天线 <--> 半主动标签：反射信号，虚线双向。
- 天线 <--> 主动标签：主动发射射频，实线双向。
regions:
- id: host_domain
  label: 系统域
  role: 数据消费与决策
- id: rf_domain
  label: 射频域
  role: 读写器与天线构成
- id: tag_domain
  label: 标签域
  role: 三种标签类型
components:
- id: host_system
  label: 上位机/边缘
  type: application
  subtitle: 数据汇聚与决策
  group: host_domain
  priority: normal
  shape: card
- id: reader_device
  label: 读写器
  type: edge
  subtitle: 射频收发与解析
  group: rf_domain
  priority: primary
  shape: card
- id: antenna_unit
  label: 天线
  type: edge
  subtitle: 辐射/接收模块
  group: rf_domain
  priority: primary
  shape: card
- id: passive_tag
  label: 被动标签
  type: edge
  subtitle: 无源取能
  group: tag_domain
  priority: normal
  shape: card
- id: semi_passive_tag
  label: 半主动标签
  type: edge
  subtitle: 有源供电芯片
  group: tag_domain
  priority: normal
  shape: card
- id: active_tag
  label: 主动标签
  type: edge
  subtitle: 有源主动发射
  group: tag_domain
  priority: normal
  shape: card
connections:
- from: host_system
  to: reader_device
  label: 数据/控制指令
  style: solid
  direction: left-to-right
- from: reader_device
  to: antenna_unit
  label: 射频信号输出
  style: solid
  direction: left-to-right
- from: antenna_unit
  to: passive_tag
  label: 能量耦合+反射
  style: dashed
  direction: bidirectional
- from: antenna_unit
  to: semi_passive_tag
  label: 反射信号
  style: dashed
  direction: bidirectional
- from: antenna_unit
  to: active_tag
  label: 主动射频传回
  style: solid
  direction: bidirectional
callouts:
- 被动标签通过能量耦合工作，距离越远能量越弱。
- 主动标签自带射频，读距最远但寿命受电池约束。
legend:
- 青绿色=射频域组件；灰色=宿主系统与标签域。
- 实线=强耦合或供电链路；虚线=被动反射链路。
visual_constraints:
- 最多6个主节点，标签三个并列。
- 双向虚线表示被动反射，双向实线表示主动发射。
- 天线需突出作为独立模块的地位。
render_notes: HTML/SVG渲染，浅色背景，圆角矩形，天线用天线图标示意，连线带方向标记和短标签。
caption:
  zh: 图3-3 RFID系统工作示意图，展示读写器、天线与三种标签之间的射频耦合关系。
  en: Figure 3-3 How an RFID system works, showing the RF coupling between the reader, the antenna, and the three tag types.
labels:
  en:
    图3-3 RFID系统工作示意图: Figure 3-3 How an RFID System Works
    上位机与读写器双向通信，读写器经天线发射射频，被动标签反向散射回复，主动标签独立发射。: The host and reader communicate both ways; the reader radiates RF through the antenna, passive tags reply by backscatter, and active tags transmit on their own.
    天线是独立射频性能模块；标签类型决定取能方式与回传机制: The antenna is a standalone RF performance module; tag type decides powering and how replies return
    系统域: System Domain
    上位机: Host
    边缘节点 / IoT 平台: Edge Node / IoT Platform
    数据消费与决策: Data Consumption & Decisions
    射频域: RF Domain
    读写器: Reader
    射频收发与解析: RF Tx/Rx & Parsing
    数据转发: Data Forwarding
    天线: Antenna
    辐射 / 接收: Radiate / Receive
    极化 · 增益: Polarization · Gain
    数据上报: Data Report
    控制下发: Control Downlink
    射频信号: RF Signal
    标签域: Tag Domain
    被动标签: Passive Tag
    无源 · 从射频场取能 · 反向散射回复: Unpowered · harvests the RF field · backscatter reply
    半主动标签: Semi-Passive Tag
    电池为芯片供电 · 通信仍采用反向散射: Battery powers the chip · still backscatter communication
    主动标签: Active Tag
    有源收发 · 可主动发射射频信号: Powered Tx/Rx · transmits RF on its own
    耦合能量/散射: Coupled energy / backscatter
    反向散射: Backscatter
    主动发射射频: Active RF transmit
    图3-3 被动标签通过反向散射回复，主动标签则具备独立射频发射能力。: Figure 3-3 Passive tags reply by backscatter, while active tags have independent RF transmitters.
