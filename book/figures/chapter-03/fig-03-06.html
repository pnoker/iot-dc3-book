  <desc id="desc">三个测距圆理想下交于一点，实测误差使交点退化为交叠区，最小二乘法在该区取误差平方和最小的点作为坐标。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">


  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="36" font-weight="700">图3-6 三角测量定位原理示意</text>
  <text x="82" y="70" fill="#64748B" font-size="12">三个测距圆理想下交于一点，实测误差使交点退化为交叠区，最小二乘法在该区取误差平方和最小的点作为坐标。</text>

  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture" transform="translate(250 65) scale(.76)">

  <g stroke="#E2E8F0" stroke-width="0.7">
    <path d="M450 160V650 M530 160V650 M610 160V650 M690 160V650 M770 160V650 M850 160V650 M930 160V650"/>
    <path d="M400 200H980 M400 280H980 M400 360H980 M400 440H980 M400 520H980 M400 600H980"/>
  </g>
  <g stroke="#64748B" stroke-width="1.5" fill="none">
    <path d="M410 600H1000" marker-end="url(#bp-arrow)"/>
    <path d="M450 650V135" marker-end="url(#bp-arrow)"/>
  </g>
  <g fill="#64748B" font-size="12" text-anchor="middle">
    <text x="450" y="622">0</text><text x="530" y="622">10</text><text x="610" y="622">20</text><text x="690" y="622">30</text><text x="770" y="622">40</text><text x="850" y="622">50</text><text x="930" y="622">60</text>
    <text x="1018" y="605">X (m)</text>

  <g fill="#64748B" font-size="12" text-anchor="end">
    <text x="438" y="604">0</text><text x="438" y="524">10</text><text x="438" y="444">20</text><text x="438" y="364">30</text><text x="438" y="284">40</text><text x="438" y="204">50</text><text x="440" y="140">Y (m)</text>
  </g>

  <g fill="rgba(249,115,22,0.07)" stroke="#F97316" stroke-width="2" stroke-dasharray="8,8">
    <circle cx="450" cy="600" r="288"/>
    <circle cx="930" cy="600" r="296"/>
    <circle cx="690" cy="200" r="232"/>
  </g>

    <line x1="930" y1="600" x2="685" y2="433"/>
    <line x1="690" y1="200" x2="685" y2="433"/>
  </g>
  <g fill="#F97316" font-size="12" font-weight="600">

  <!-- 参考点 -->
  <g fill="#EFF6FF" stroke="#2563EB" stroke-width="2">
    <circle cx="450" cy="600" r="9"/><circle cx="930" cy="600" r="9"/><circle cx="690" cy="200" r="9"/>
  </g>
  <g fill="#0F172A" font-size="13" font-weight="600">
    <text x="465" y="596">A (0, 0)</text><text x="945" y="596">B (60, 0)</text><text x="705" y="196">C (30, 50)</text>

  <ellipse cx="685" cy="433" rx="18" ry="14" fill="rgba(100,116,139,0.28)" stroke="#64748B" stroke-width="1"/>
  <circle cx="685" cy="433" r="6" fill="#2563EB"/>
  <path d="M690 440l8 8m0-8l-8 8" stroke="#DC2626" stroke-width="2"/>
  <text x="708" y="428" fill="#2563EB" font-size="12" font-weight="700">Q 最小二乘估计 (29.4, 20.9)</text>
  <text x="708" y="450" fill="#DC2626" font-size="12" font-weight="600">T 真实目标 (30, 20)</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="11" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色=核心能力；橙色=智能/风险路径</text>
  <text x="900" y="855" fill="#475569" font-size="17" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图3-6 三角测量定位原理示意图。三圆在理想条件下应精确交于一点，但实际测量存在RSSI波动或ToA时钟误差，导致交叠区域出现，可借助最小二乘法计算误差平方和最小的点作为最终坐标。</text>
