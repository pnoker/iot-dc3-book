<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图 3-15 物模型在数据互通中的三层角色</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">图 3-15 物模型在数据互通中的三层角色</title>
  <desc id="desc">物模型把异构协议归一为统一语义空间，设备影子拆解同步耦合，催生平台无关应用。</desc>
  <rect width="1200" height="700" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="580" viewBox="0 0 1800 950" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="950" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
  </defs>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 3-15 物模型在数据互通中的三层角色</text>
  <text x="88" y="64" font-size="12" fill="#64748B">让来源各异的物理量汇入同一个语义空间</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 异构数据归一 -->
  <text x="80" y="150" font-size="15" font-weight="700" fill="#334155">语义适配层：消弭协议鸿沟</text>

  <rect x="80" y="172" width="380" height="140" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="270" y="206" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">A 厂温湿度变送器</text>
  <text x="116" y="240" font-size="11" fill="#475569">Modbus RTU</text>
  <text x="116" y="264" font-size="11" fill="#475569">温度在第 3~4 字节十六进制表达</text>
  <text x="116" y="288" font-size="11" fill="#475569">“01 0A” → 高字节×0.1 = 10.0℃</text>

  <rect x="490" y="172" width="380" height="140" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="680" y="206" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">B 厂空调控制器</text>
  <text x="526" y="240" font-size="11" fill="#475569">KNX 总线</text>
  <text x="526" y="264" font-size="11" fill="#475569">温度设定值对应通讯对象号</text>
  <text x="526" y="288" font-size="11" fill="#475569">KNX 数据点“9.001”</text>

  <rect x="900" y="172" width="380" height="140" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1090" y="206" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">C 厂智能电表</text>
  <text x="936" y="240" font-size="11" fill="#475569">DL/T645 协议</text>
  <text x="936" y="264" font-size="11" fill="#475569">数据标识符层层嵌套</text>
  <text x="936" y="288" font-size="11" fill="#475569">私有协议需逐个解析</text>

  <rect x="1310" y="172" width="410" height="140" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1515" y="206" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">统一物模型（语义空间）</text>
  <text x="1346" y="244" font-size="12" fill="#475569">属性（Property）· 指令（Command）· 事件（Event）</text>
  <text x="1346" y="270" font-size="12" fill="#475569">三者的“温度”归入同一位号</text>
  <text x="1346" y="296" font-size="11" fill="#64748B">适配逻辑集成到设备接入模块，复用同一套映射</text>

  <!-- 设备影子 -->
  <rect x="80" y="360" width="1640" height="180" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="120" y="394" font-size="14" font-weight="700" fill="#0F172A">设备影子：拆解同步耦合</text>
  <text x="120" y="426" font-size="12" fill="#475569">平台持有设备最新物模型状态，应用写影子属性记录期望值，设备下次上线拉取影子对比差异并同步</text>
  <text x="120" y="452" font-size="12" fill="#475569">写操作不再被设备在线状况阻塞，同步问题转化为异步状态管理</text>
  <text x="120" y="488" font-size="12" fill="#475569">应用不感知设备在线状态，设备不感知应用调用时序</text>
  <text x="120" y="520" font-size="11" fill="#64748B">低功耗节点休眠或网络抖动时，业务流程不会被拖死</text>

  <!-- 平台无关应用 -->
  <rect x="80" y="590" width="1640" height="160" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="120" y="624" font-size="14" font-weight="700" fill="#0F172A">催生平台无关的应用开发</text>
  <text x="120" y="656" font-size="12" fill="#475569">同一物模型下，楼宇能源优化策略在 BACnet / Modbus / 自定义总线环境都能直接复用</text>
  <text x="120" y="682" font-size="12" fill="#475569">开发只依赖物模型属性与指令，不关心设备品牌或总线类型，业务逻辑与基础设施彻底解耦</text>
  <text x="120" y="708" font-size="12" fill="#475569">实时监控面板、告警规则、能源报表在统一语义空间直接对话，AI 层同样通过物模型读写能力</text>
  <text x="120" y="734" font-size="11" fill="#64748B">IoT DC3 经 /profile 系列 REST API 管理物模型：一设备一物模型，多同型号设备复用一个物模型</text>

  <!-- Caption -->
  <text x="900" y="910" font-size="17" fill="#475569" text-anchor="middle">图 3-15 物模型三层角色：语义适配层把 Modbus/KNX/DL/T645 异构数据归一，设备影子拆解同步耦合，平台无关应用实现一次编写多处部署，成为从感知层到智能层的数据语义锚点。</text>
  </svg>
</svg>
  </main>
</body>
</html>
