<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图3-1 感知层在物联网多层参考架构中的位置</title>
  <desc id="desc">读者应理解感知层在物联网多层参考架构中的位置中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">

  
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图3-1 感知层在物联网多层参考架构中的位置</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解感知层在物联网多层参考架构中的位置中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LAYERED</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="layered" transform="translate(0,0)">
  <!-- 物理世界 -->
  <rect x="160" y="660" width="1400" height="80" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="860" y="705" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">物理世界</text>
  <text x="860" y="725" fill="#0F172A" font-size="13" text-anchor="middle">设备、环境、物品</text>

  <!-- 感知层 -->
  <rect x="160" y="450" width="1400" height="200" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="860" y="478" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">感知层</text>
  <!-- 传感器 -->
  <rect x="160" y="490" width="460" height="150" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="390" y="540" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">传感器</text>
  <text x="390" y="560" fill="#0F172A" font-size="11" text-anchor="middle">温度、压力、振动、气体</text>
  <!-- 识别设备 -->
  <rect x="630" y="490" width="460" height="150" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="860" y="540" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">识别设备</text>
  <text x="860" y="560" fill="#0F172A" font-size="11" text-anchor="middle">RFID读写器、条码扫描器</text>
  <!-- 定位模块 -->
  <rect x="1100" y="490" width="460" height="150" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="1330" y="540" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">定位模块</text>
  <text x="1330" y="560" fill="#0F172A" font-size="11" text-anchor="middle">GNSS接收机、UWB基站</text>

  <!-- 网络层 -->
  <rect x="160" y="340" width="1400" height="100" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="860" y="395" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">网络层</text>
  <text x="860" y="415" fill="#0F172A" font-size="13" text-anchor="middle">有线通信 / 无线通信</text>

  <!-- 平台层 -->
  <rect x="160" y="230" width="1400" height="100" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="860" y="258" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">平台层</text>
  <!-- 设备管理 -->
  <rect x="160" y="270" width="350" height="50" rx="4" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="335" y="300" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">设备管理</text>
  <!-- 物模型管理 -->
  <rect x="510" y="270" width="350" height="50" rx="4" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="685" y="300" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">物模型管理</text>
  <!-- 数据存储 -->
  <rect x="860" y="270" width="350" height="50" rx="4" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="1035" y="300" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">数据存储</text>
  <!-- 规则引擎 -->
  <rect x="1210" y="270" width="350" height="50" rx="4" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="1385" y="300" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">规则引擎</text>

  <!-- 应用层 -->
  <rect x="160" y="140" width="1400" height="80" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="860" y="185" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">应用层</text>
  <text x="860" y="205" fill="#0F172A" font-size="13" text-anchor="middle">工业监控 / 智慧园区 / 能源管理</text>

  <!-- 注释框 -->
  <rect x="1580" y="520" width="130" height="60" rx="4" fill="white" stroke="#999" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="1645" y="540" fill="#0F172A" font-size="11" text-anchor="middle">汇聚节点中</text>
  <text x="1645" y="558" fill="#0F172A" font-size="11" text-anchor="middle">远距离通信</text>
  <text x="1645" y="576" fill="#0F172A" font-size="11" text-anchor="middle">功能属于网络层</text>

  <!-- 数据流箭头 (自下而上) -->
  <!-- 物理世界→感知层 -->
  <line x1="860" y1="660" x2="860" y2="652" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <rect x="800" y="645" width="120" height="18" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="860" y="658" fill="#0F172A" font-size="11" text-anchor="middle">物理量 / 状态</text>

  <!-- 感知层→网络层 -->
  <line x1="860" y1="450" x2="860" y2="442" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <rect x="770" y="435" width="180" height="18" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="860" y="448" fill="#0F172A" font-size="11" text-anchor="middle">位号值流 / 身份码 / 坐标</text>

  <!-- 网络层→平台层 -->
  <line x1="860" y1="340" x2="860" y2="332" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <rect x="730" y="325" width="260" height="18" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="860" y="338" fill="#0F172A" font-size="11" text-anchor="middle">传输协议 (MQTT/Modbus/OPC UA)</text>

  <!-- 平台层→应用层 -->
  <line x1="860" y1="230" x2="860" y2="222" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <rect x="790" y="215" width="140" height="18" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="860" y="228" fill="#0F172A" font-size="11" text-anchor="middle">API 与数据服务</text>

  <!-- 控制流箭头 (自上而下虚线) -->
  <!-- 应用层→物理世界 -->
  <line x1="140" y1="180" x2="140" y2="700" stroke="#64748B" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="100" y="425" width="80" height="18" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="140" y="438" fill="#0F172A" font-size="11" text-anchor="middle">控制指令</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头 = 数据流，虚线箭头 = 控制流</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图3-1 感知层在物联网多层参考架构中的位置。感知层包含传感器、识别设备和定位模块三大组件，负责将物理世界信息转换为位号值流、身份码和坐标数据，通过网络层上传至平台层和应用层。箭头方向表示数据流向（自下而上）或控制指令流向（自上而下虚线）。</text>
  </svg>
</svg>
    <section class="meta" style="display:none">
      <div class="card"><div class="label">图表类型</div><div class="value">layered</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">自下而上分层架构：物理世界→感知层→网络层→平台层→应用层。感知层内部三等分展示传感器、识别设备、定位模块。平台层内部四等分展示设备管理、物模型管理、数据存储、规则引擎。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
