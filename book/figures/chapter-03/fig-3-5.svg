<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">边缘计算节点典型部署架构</title>
  <desc id="desc">读者应理解边缘计算节点典型部署架构中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">边缘计算节点典型部署架构</title>
  <desc id="desc">读者应理解边缘计算节点典型部署架构中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">边缘计算节点典型部署架构</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解边缘计算节点典型部署架构中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LAYERED</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="layered">
    <!-- 区域边界：设备与边缘域 -->
    <rect x="450" y="340" width="900" height="370" rx="14" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>
    <text x="460" y="362" fill="#D97706" font-size="14" font-weight="600">设备与边缘域</text>

    <!-- 第3层：云平台 -->
    <rect x="500" y="150" width="800" height="150" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="900" y="180" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">第3层 云平台（远程管理与模型训练）</text>
    <text x="900" y="210" fill="#475569" font-size="12" text-anchor="middle">
      <tspan x="900" dy="0">云侧使用全量历史数据训练模型，下发至边缘网关；</tspan>
      <tspan x="900" dy="20">同时接收边缘上传的时序数据与告警事件。</tspan>
    </text>

    <!-- 第2层：边缘网关 -->
    <rect x="500" y="350" width="800" height="150" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
    <text x="900" y="380" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">第2层 边缘网关（靠近汇聚点）</text>
    <text x="900" y="410" fill="#475569" font-size="12" text-anchor="middle">
      <tspan x="900" dy="0">网关接收多条传感器链路的处理后数据，执行协议转换（格式标准化如MQTT）、</tspan>
      <tspan x="900" dy="20">跨传感器时间对齐，并运行轻量型AI推理模型。</tspan>
    </text>

    <!-- 第1层：传感器端 -->
    <rect x="500" y="550" width="800" height="150" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
    <text x="900" y="580" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">第1层 传感器端（靠近被监测对象）</text>
    <text x="900" y="610" fill="#475569" font-size="12" text-anchor="middle">
      <tspan x="900" dy="0">传感器接Cortex-M4级MCU，执行A/D转换、滑动去噪、阈值判断。</tspan>
      <tspan x="900" dy="20">只上传变化超限或离散事件，实现自适应采样。</tspan>
    </text>

    <!-- 连线（先于卡片绘制，但为了可见性，放在后面，使用偏移让箭头在卡片外） -->
    <!-- 第1层到第2层：实线，特征值/事件 -->
    <line x1="900" y1="545" x2="900" y2="505" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
    <rect x="830" y="517" width="80" height="20" rx="4" fill="white" opacity="0.9"/>
    <text x="870" y="531" fill="#2563EB" font-size="11" text-anchor="middle" font-weight="600">特征值/事件</text>

    <!-- 第2层到第3层：实线，聚合值/异常告警 -->
    <line x1="900" y1="345" x2="900" y2="305" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
    <rect x="820" y="317" width="90" height="20" rx="4" fill="white" opacity="0.9"/>
    <text x="865" y="331" fill="#2563EB" font-size="11" text-anchor="middle" font-weight="600">聚合值/异常告警</text>

    <!-- 第3层到第2层：虚线，训练后模型/阈值 -->
    <line x1="900" y1="305" x2="900" y2="345" stroke="#64748B" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>
    <rect x="920" y="317" width="90" height="20" rx="4" fill="white" opacity="0.9"/>
    <text x="965" y="331" fill="#64748B" font-size="11" text-anchor="middle" font-weight="600">训练后模型/阈值</text>

    <!-- 第2层到第1层：虚线，参数调整/唤醒指令 -->
    <line x1="900" y1="505" x2="900" y2="545" stroke="#64748B" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>
    <rect x="920" y="517" width="100" height="20" rx="4" fill="white" opacity="0.9"/>
    <text x="970" y="531" fill="#64748B" font-size="11" text-anchor="middle" font-weight="600">参数调整/唤醒指令</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">已处理数据或压缩数据上传方向</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">模型参数、阈值或配置下发方向</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">边缘计算节点典型部署架构。物理世界中各类传感器靠近被监测对象布放，附接MCU级节点完成首级处理（采样、滤波、阈值判断）；这些节点通过短距或长距无线链路（BLE、LoRa、RS-485）连接至边缘网关，网关汇聚数据后由应用处理器级节点执行协议转换与通道融合；网关再与云端IoT平台</text>
  <text x="900" y="870" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">（如IoT DC3）进行双向数据同步。云侧承担模型训练和高阶分析任务，推理结果可沿相同路径下发给现场，形成完整闭环。架构图中包含了从端侧到云侧的三层结构及其数据流方向。</text>
  </svg>
</svg>