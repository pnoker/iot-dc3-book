<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="860" viewBox="0 0 1800 860" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <rect x="0" y="0" width="1800" height="860" fill="#FFFFFF"/>
  <defs>
    <linearGradient id="grad-intel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="grad-intel-area" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.14"/>
    </linearGradient>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
  </defs>

  <!-- ===== 标题区 ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" font-size="22" font-weight="700" fill="#0F172A">图7-1 AIoT 从连接到自主决策的演进示意</text>
  <text x="82" y="70" font-size="12" fill="#64748B">三阶段演进路径 · 智能化程度趋势 · 核心驱动力</text>
  <rect x="1680" y="28" width="92" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1726" y="44" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="1.5">TIMELINE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>

  <!-- ===== 智能化程度曲线区 ===== -->
  <line x1="110" y1="250" x2="110" y2="128" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="98" y="132" font-size="10" fill="#64748B" text-anchor="end">高</text>
  <text x="98" y="254" font-size="10" fill="#64748B" text-anchor="end">低</text>
  <text x="84" y="189" font-size="11" fill="#475569" text-anchor="middle" transform="rotate(-90 84 189)">智能化程度</text>

  <path d="M 160,238 C 620,238 880,128 1640,128 L 1640,258 L 160,258 Z" fill="url(#grad-intel-area)"/>
  <path d="M 160,238 C 620,238 880,128 1640,128" fill="none" stroke="url(#grad-intel)" stroke-width="3" stroke-linecap="round"/>

  <!-- 阶段节点 -->
  <line x1="320" y1="242" x2="320" y2="273" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="900" y1="180" x2="900" y2="273" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="1480" y1="140" x2="1480" y2="273" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3"/>

  <circle cx="320" cy="233" r="7.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="320" cy="233" r="3" fill="#2563EB"/>
  <circle cx="900" cy="170" r="7.5" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
  <circle cx="900" cy="170" r="3" fill="#10B981"/>
  <circle cx="1480" cy="130" r="7.5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
  <circle cx="1480" cy="130" r="3" fill="#F59E0B"/>

  <text x="320" y="216" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">被动响应</text>
  <text x="900" y="153" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">人机协同</text>
  <text x="1480" y="113" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">自主闭环</text>

