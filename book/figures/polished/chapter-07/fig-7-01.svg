  <!-- Card 1: 连接采集 (蓝) -->
  <rect x="80" y="275" width="480" height="310" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="120" cy="317" r="22" fill="#2563EB"/>
  <text x="120" y="324" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="156" y="313" font-size="20" font-weight="700" fill="#0F172A">连接采集</text>
  <text x="156" y="335" font-size="11" fill="#64748B">IoT 1.0 · 连接时代</text>
  <line x1="104" y1="357" x2="536" y2="357" stroke="#E2E8F0"/>
  <rect x="104" y="367" width="3" height="11" fill="#2563EB"/>
  <text x="114" y="376" font-size="10.5" font-weight="700" fill="#475569">核心特征</text>
  <circle cx="120" cy="399" r="2.5" fill="#2563EB"/>
  <text x="132" y="403" font-size="13" fill="#334155">设备联网，数据实时上报</text>
  <circle cx="120" cy="424" r="2.5" fill="#2563EB"/>
  <text x="132" y="428" font-size="13" fill="#334155">仪表盘可视化，人工监控</text>
  <circle cx="120" cy="449" r="2.5" fill="#2563EB"/>
  <text x="132" y="453" font-size="13" fill="#334155">阈值告警，被动响应</text>
  <line x1="104" y1="468" x2="536" y2="468" stroke="#E2E8F0"/>
  <rect x="104" y="478" width="3" height="11" fill="#2563EB"/>
  <text x="114" y="487" font-size="10.5" font-weight="700" fill="#475569">代表技术</text>
  <text x="104" y="507" font-size="12" fill="#475569">MQTT · 时序数据库 · BI 仪表盘</text>
  <line x1="104" y1="525" x2="536" y2="525" stroke="#E2E8F0"/>
  <rect x="104" y="535" width="432" height="42" rx="6" fill="#2563EB" fill-opacity="0.07"/>
  <text x="124" y="552" font-size="10" fill="#64748B">人类角色</text>
  <text x="124" y="570" font-size="14" font-weight="700" fill="#2563EB">操作员 · 手动决策</text>

  <!-- Card 2: 智能分析 (绿) -->
  <rect x="660" y="275" width="480" height="310" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="700" cy="317" r="22" fill="#10B981"/>
  <text x="700" y="324" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="736" y="313" font-size="20" font-weight="700" fill="#0F172A">智能分析</text>
  <text x="736" y="335" font-size="11" fill="#64748B">AIoT 2.0 · 协同时代</text>
  <line x1="684" y1="357" x2="1116" y2="357" stroke="#E2E8F0"/>
  <rect x="684" y="367" width="3" height="11" fill="#10B981"/>
  <text x="694" y="376" font-size="10.5" font-weight="700" fill="#475569">核心特征</text>
  <circle cx="700" cy="399" r="2.5" fill="#10B981"/>
  <text x="712" y="403" font-size="13" fill="#334155">LLM 理解自然语言意图</text>
  <circle cx="700" cy="424" r="2.5" fill="#10B981"/>
  <text x="712" y="428" font-size="13" fill="#334155">Tool-Calling 调用设备能力</text>
  <circle cx="700" cy="449" r="2.5" fill="#10B981"/>
  <text x="712" y="453" font-size="13" fill="#334155">人机协作，半自动执行</text>
  <line x1="684" y1="468" x2="1116" y2="468" stroke="#E2E8F0"/>
  <rect x="684" y="478" width="3" height="11" fill="#10B981"/>
  <text x="694" y="487" font-size="10.5" font-weight="700" fill="#475569">代表技术</text>
  <text x="684" y="507" font-size="12" fill="#475569">LLM · Function Call · RAG 知识库</text>
  <line x1="684" y1="525" x2="1116" y2="525" stroke="#E2E8F0"/>
  <rect x="684" y="535" width="432" height="42" rx="6" fill="#10B981" fill-opacity="0.08"/>
  <text x="704" y="552" font-size="10" fill="#64748B">人类角色</text>
  <text x="704" y="570" font-size="14" font-weight="700" fill="#10B981">协作者 · 审核确认</text>

  <!-- Card 3: 自主决策 (橙) -->
  <rect x="1240" y="275" width="480" height="310" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="1280" cy="317" r="22" fill="#F59E0B"/>
  <text x="1280" y="324" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="1316" y="313" font-size="20" font-weight="700" fill="#0F172A">自主决策</text>
  <text x="1316" y="335" font-size="11" fill="#64748B">AIoT 3.0 · 自主时代</text>
  <line x1="1264" y1="357" x2="1696" y2="357" stroke="#E2E8F0"/>
  <rect x="1264" y="367" width="3" height="11" fill="#F59E0B"/>
  <text x="1274" y="376" font-size="10.5" font-weight="700" fill="#475569">核心特征</text>
  <circle cx="1280" cy="399" r="2.5" fill="#F59E0B"/>
  <text x="1292" y="403" font-size="13" fill="#334155">Agent 自主监测与诊断</text>
  <circle cx="1280" cy="424" r="2.5" fill="#F59E0B"/>
  <text x="1292" y="428" font-size="13" fill="#334155">多步规划，闭环控制</text>
  <circle cx="1280" cy="449" r="2.5" fill="#F59E0B"/>
  <text x="1292" y="453" font-size="13" fill="#334155">主动执行，自我纠错</text>
  <line x1="1264" y1="468" x2="1696" y2="468" stroke="#E2E8F0"/>
  <rect x="1264" y="478" width="3" height="11" fill="#F59E0B"/>
  <text x="1274" y="487" font-size="10.5" font-weight="700" fill="#475569">代表技术</text>
  <text x="1264" y="507" font-size="12" fill="#475569">Agent · 规划引擎 · 记忆与反思</text>
  <line x1="1264" y1="525" x2="1696" y2="525" stroke="#E2E8F0"/>
  <rect x="1264" y="535" width="432" height="42" rx="6" fill="#F59E0B" fill-opacity="0.09"/>
  <text x="1284" y="552" font-size="10" fill="#64748B">人类角色</text>
  <text x="1284" y="570" font-size="14" font-weight="700" fill="#D97706">监督员 · 例外介入</text>

  <!-- ===== 阶段演进箭头 ===== -->
  <line x1="560" y1="430" x2="652" y2="430" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="606" y="421" font-size="10.5" font-weight="600" fill="#2563EB" text-anchor="middle">演进</text>
  <line x1="1140" y1="430" x2="1232" y2="430" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1186" y="421" font-size="10.5" font-weight="600" fill="#2563EB" text-anchor="middle">演进</text>

  <!-- ===== 驱动力作用箭头（虚线指向第三阶段） ===== -->
  <line x1="1314" y1="638" x2="1314" y2="592" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <line x1="1460" y1="638" x2="1460" y2="592" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <line x1="1621" y1="638" x2="1621" y2="592" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>

  <!-- ===== 关键洞察 callout（左下） ===== -->
  <rect x="80" y="640" width="1060" height="115" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="106" cy="668" r="5" fill="#2563EB"/>
  <text x="120" y="672" font-size="13" font-weight="700" fill="#0F172A">关键洞察</text>
  <text x="106" y="700" font-size="13" fill="#334155">智能化每提升一级，设备更自主，人类逐步退居幕后——角色随之演变：</text>
  <rect x="106" y="715" width="78" height="26" rx="13" fill="#2563EB" fill-opacity="0.1" stroke="#2563EB"/>
  <text x="145" y="732" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">操作员</text>
  <line x1="188" y1="728" x2="210" y2="728" stroke="#64748B" stroke-width="1.2" marker-end="url(#ah-gray)"/>
  <rect x="214" y="715" width="78" height="26" rx="13" fill="#10B981" fill-opacity="0.1" stroke="#10B981"/>
  <text x="253" y="732" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">协作者</text>
  <line x1="296" y1="728" x2="318" y2="728" stroke="#64748B" stroke-width="1.2" marker-end="url(#ah-gray)"/>
  <rect x="322" y="715" width="78" height="26" rx="13" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B"/>
  <text x="361" y="732" font-size="11" font-weight="600" fill="#D97706" text-anchor="middle">监督员</text>

  <!-- ===== 核心驱动力（右下） ===== -->
  <rect x="1240" y="640" width="480" height="115" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 4"/>
  <circle cx="1266" cy="668" r="5" fill="#F59E0B"/>
  <text x="1280" y="672" font-size="13" font-weight="700" fill="#D97706">核心驱动力</text>
  <text x="1266" y="693" font-size="10.5" fill="#64748B">三项突破共同推动向自主决策演进</text>
  <rect x="1256" y="708" width="116" height="30" rx="15" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1314" y="728" font-size="11.5" font-weight="600" fill="#D97706" text-anchor="middle">算力下沉</text>
  <rect x="1390" y="708" width="140" height="30" rx="15" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1460" y="728" font-size="11.5" font-weight="600" fill="#D97706" text-anchor="middle">大模型突破</text>
  <rect x="1546" y="708" width="150" height="30" rx="15" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1621" y="728" font-size="11.5" font-weight="600" fill="#D97706" text-anchor="middle">边缘智能普及</text>

  <!-- ===== 图例（主体之外） ===== -->
  <line x1="80" y1="800" x2="108" y2="800" stroke="url(#grad-intel)" stroke-width="3" stroke-linecap="round"/>
  <text x="116" y="804" font-size="10.5" fill="#64748B">智能化程度曲线</text>
  <line x1="252" y1="800" x2="280" y2="800" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="288" y="804" font-size="10.5" fill="#64748B">演进方向</text>
  <line x1="392" y1="800" x2="420" y2="800" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="428" y="804" font-size="10.5" fill="#64748B">驱动力作用</text>
  <circle cx="551" cy="800" r="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="567" cy="800" r="4" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="583" cy="800" r="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="594" y="804" font-size="10.5" fill="#64748B">三阶段节点</text>

  <!-- ===== caption ===== -->
  <text x="900" y="836" font-size="10" fill="#94A3B8" text-anchor="middle">图7-1 AIoT 演进：设备上网、人看仪表盘 → LLM 经 Tool-Calling 协同操作设备 → Agent 自主监测诊断与执行；</text>
  <text x="900" y="852" font-size="10" fill="#94A3B8" text-anchor="middle">人类角色随之从「操作员」变为「协作者」，最终成为「监督员」，逐步退居幕后。</text>
</svg>
