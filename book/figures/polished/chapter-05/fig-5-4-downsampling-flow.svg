<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图5-4 降采样数据流程与数据量对比（假设场景）</title>
  <desc id="desc">读者应理解降采样通过分层聚合将数据量逐步压缩，不同层服务于不同时效性需求。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图5-4 降采样数据流程与数据量对比（假设场景）</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解降采样通过分层聚合将数据量逐步压缩，不同层服务于不同时效性需求。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">DATAFLOW</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="dataflow">
  <rect x="70" y="380" width="970" height="140" rx="14" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="85" y="400" fill="#D97706" font-size="14" font-weight="600">数据资产域</text>
  <path d="M 260,445 L 351,445" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)" fill="none"/>
  <path d="M 510,445 L 601,445" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)" fill="none"/>
  <path d="M 760,445 L 851,445" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)" fill="none"/>
  <path d="M 430,400 L 430,299" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow)" fill="none"/>
  <path d="M 680,400 L 680,299" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow)" fill="none"/>
  <path d="M 930,400 L 930,299" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow)" fill="none"/>
  <rect x="100" y="400" width="160" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="350" y="400" width="160" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="600" y="400" width="160" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="850" y="400" width="160" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="205" y="220" width="700" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="180" y="425" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">原始数据桶</text>
  <text x="180" y="460" fill="#475569" font-size="11" text-anchor="middle">10秒级精度，短保留窗口</text>
  <text x="180" y="500" fill="#64748B" font-size="12" text-anchor="middle">原始基准</text>
  <text x="430" y="425" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">分钟聚合桶</text>
  <text x="430" y="460" fill="#475569" font-size="11" text-anchor="middle">每分钟均值，数据量显著减少</text>
  <text x="430" y="500" fill="#64748B" font-size="12" text-anchor="middle">显著减少</text>
  <text x="680" y="425" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">小时聚合桶</text>
  <text x="680" y="460" fill="#475569" font-size="11" text-anchor="middle">每小时均值，数据量大幅降低</text>
  <text x="680" y="500" fill="#64748B" font-size="12" text-anchor="middle">大幅降低</text>
  <text x="930" y="425" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">天聚合桶</text>
  <text x="930" y="460" fill="#475569" font-size="11" text-anchor="middle">每天均值，数据量极小占比</text>
  <text x="930" y="500" fill="#64748B" font-size="12" text-anchor="middle">极小</text>
  <text x="555" y="245" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">查询仪表盘</text>
  <text x="555" y="270" fill="#475569" font-size="12" text-anchor="middle">应用层直接读取聚合数据</text>
  <rect x="262" y="428" width="86" height="20" rx="3" fill="white" stroke="none"/>
  <text x="305" y="443" fill="#0F172A" font-size="12" font-weight="500" text-anchor="middle">CQ：每分钟聚合</text>
  <rect x="512" y="428" width="86" height="20" rx="3" fill="white" stroke="none"/>
  <text x="555" y="443" fill="#0F172A" font-size="12" font-weight="500" text-anchor="middle">CQ：每小时聚合</text>
  <rect x="762" y="428" width="86" height="20" rx="3" fill="white" stroke="none"/>
  <text x="805" y="443" fill="#0F172A" font-size="12" font-weight="500" text-anchor="middle">CQ：每天聚合</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">各桶数据量描述基于假设场景估算，实际项目因设备数、上报频率、字段</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头：连续查询驱动自动化聚合</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">虚线箭头：应用层查询路径</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图5-4 假设场景：中等规模工厂设备上报温度和湿度。三级降采样策略：原始数据保留短暂时间，分钟聚合保留中期，小时聚合保留季度级，天聚合保留年。各阶段数据量比例为基于常见压缩比的定性描述，非精确数值。</text>
</svg>
