<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图5-3 异常检测性能对比示意：规则 vs 机器学习</title>
  <desc id="desc">机器学习在召回率和自适应方面占优，规则在低误报率（针对已知故障）和解释性上更强；混合策略结合两者优势。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图5-3 异常检测性能对比示意：规则 vs 机器学习</text>
  <text x="82" y="70" fill="#64748B" font-size="12">机器学习在召回率和自适应方面占优，规则在低误报率（针对已知故障）和解释性上更强；混合策略结合两者优势。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">MATRIX</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="matrix">
  <!-- 坐标轴 -->
  <line x1="400" y1="720" x2="1240" y2="720" stroke="#64748B" stroke-width="2"/>
  <line x1="400" y1="200" x2="400" y2="720" stroke="#64748B" stroke-width="2"/>
  <!-- 轴箭头 -->
  <polygon points="1240,720 1230,715 1230,725" fill="#64748B"/>
  <polygon points="400,200 395,210 405,210" fill="#64748B"/>
  <!-- 轴标签 -->
  <text x="820" y="750" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="600">适应性 →</text>
  <text x="360" y="460" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="600" transform="rotate(-90 360,460)">可解释性 ↓</text>
  <!-- 象限分割线 -->
  <line x1="820" y1="200" x2="820" y2="720" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <line x1="400" y1="460" x2="1240" y2="460" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <!-- 轴端点标签 -->
  <text x="400" y="740" text-anchor="middle" fill="#64748B" font-size="14">低</text>
  <text x="1240" y="740" text-anchor="middle" fill="#64748B" font-size="14">高</text>
  <text x="385" y="204" text-anchor="end" fill="#64748B" font-size="14">高</text>
  <text x="385" y="724" text-anchor="end" fill="#64748B" font-size="14">低</text>
  <!-- 区域边界 -->
  <rect x="400" y="200" width="840" height="260" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="8,4" rx="8"/>
  <text x="410" y="220" fill="#D97706" font-size="12" font-weight="600">高可解释区域</text>
  <rect x="400" y="460" width="840" height="260" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="8,4" rx="8"/>
  <text x="410" y="480" fill="#D97706" font-size="12" font-weight="600">低可解释区域</text>
  <!-- 连线（先于卡片绘制，避免遮挡） -->
  <!-- 规则->浅层ML -->
  <line x1="750" y1="325" x2="970" y2="325" stroke="#64748B" stroke-width="2"/>
  <polygon points="970,325 960,320 960,330" fill="#64748B"/>
  <rect x="800" y="310" width="120" height="30" fill="white" stroke="#94A3B8" stroke-width="0.5" rx="4" opacity="0.9"/>
  <text x="860" y="330" text-anchor="middle" fill="#0F172A" font-size="12">准确率高，召回率低</text>
  <!-- 浅层ML->深度学习 -->
  <line x1="1060" y1="380" x2="1060" y2="520" stroke="#64748B" stroke-width="2"/>
  <polygon points="1060,520 1055,530 1065,530" fill="#64748B"/>
  <rect x="1010" y="440" width="100" height="30" fill="white" stroke="#94A3B8" stroke-width="0.5" rx="4" opacity="0.9"/>
  <text x="1060" y="460" text-anchor="middle" fill="#0F172A" font-size="12">召回率较高，误报率可接受</text>
  <!-- 深度学习->混合策略 -->
  <line x1="970" y1="575" x2="950" y2="450" stroke="#64748B" stroke-width="2"/>
  <polygon points="950,450 943,457 957,457" fill="#64748B"/>
  <rect x="900" y="500" width="120" height="30" fill="white" stroke="#94A3B8" stroke-width="0.5" rx="4" opacity="0.9"/>
  <text x="960" y="520" text-anchor="middle" fill="#0F172A" font-size="12">深度学习：召回率最高，开销大</text>
  <!-- 节点卡片 -->
  <!-- 规则检测 -->
  <g>
    <rect x="520" y="275" width="180" height="110" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="610" y="301" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="600">规则检测</text>
    <text x="610" y="321" text-anchor="middle" fill="#64748B" font-size="12">阈值/EWMA/复合规则</text>
    <!-- 雷达图 -->
    <g transform="translate(680, 345)">
      <polygon points="16.2,0 0,5.4 -12.6,0 0,-3.6" fill="none" stroke="#475569" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#E2E8F0" stroke-width="0.5"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#E2E8F0" stroke-width="0.5"/>
    </g>
  </g>
  <!-- 浅层ML -->
  <g>
    <rect x="940" y="275" width="180" height="110" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
    <text x="1030" y="301" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="600">浅层ML</text>
    <text x="1030" y="321" text-anchor="middle" fill="#64748B" font-size="12">孤立森林/LOF</text>
    <g transform="translate(1100, 345)">
      <polygon points="12.6,0 0,12.6 -10.8,0 0,-9" fill="none" stroke="#475569" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#E2E8F0" stroke-width="0.5"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#E2E8F0" stroke-width="0.5"/>
    </g>
  </g>
  <!-- 深度学习 -->
  <g>
    <rect x="940" y="535" width="180" height="110" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
    <text x="1030" y="561" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="600">深度学习</text>
    <text x="1030" y="581" text-anchor="middle" fill="#64748B" font-size="12">LSTM/Transformer</text>
    <g transform="translate(1100, 605)">
      <polygon points="14.4,0 0,17.1 -14.4,0 0,-1.8" fill="none" stroke="#475569" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#E2E8F0" stroke-width="0.5"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#E2E8F0" stroke-width="0.5"/>
    </g>
  </g>
  <!-- 混合策略 -->
  <g>
    <rect x="730" y="405" width="180" height="110" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="820" y="431" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="600">混合策略</text>
    <text x="820" y="451" text-anchor="middle" fill="#64748B" font-size="12">边缘规则+云端ML</text>
    <g transform="translate(890, 475)">
      <polygon points="15.3,0 0,15.3 -16.2,0 0,-10.8" fill="none" stroke="#475569" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#E2E8F0" stroke-width="0.5"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#E2E8F0" stroke-width="0.5"/>
    </g>
  </g>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色=平台/架构组件；橙色=AI组件；灰色=规则/决策组件</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线框表示该象限的核心方法</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图5-3 异常检测性能对比示意：规则检测、浅层机器学习、深度学习与混合策略在适应性和可解释性上的定位。</text>
</svg>
