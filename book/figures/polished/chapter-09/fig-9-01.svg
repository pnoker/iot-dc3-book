<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <!-- ============== 标题区 ============== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="46" font-size="22" font-weight="700" fill="#0F172A">图 9-1　物联网应用层协议选型框架</text>
  <text x="84" y="72" font-size="12" fill="#64748B">通信模型 × 传输层：二维定位 MQTT / CoAP / HTTP / LwM2M / BLE GATT，MCP 横跨其上</text>
  <rect x="1560" y="24" width="200" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1660" y="44" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">LAYERED · MATRIX</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ============== MCP 语义层悬浮横带 ============== -->
  <rect x="240" y="115" width="1400" height="52" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 4"/>
  <circle cx="272" cy="141" r="6" fill="#F59E0B"/>
  <text x="290" y="137" font-size="14" font-weight="700" fill="#0F172A">MCP 语义层（Model Context Protocol）</text>
  <text x="290" y="156" font-size="11" fill="#92400E">横跨 MQTT · CoAP · HTTP · LwM2M · BLE GATT 之上，为 AI Agent 提供统一语义接口（不占独立象限）</text>
  <rect x="1490" y="128" width="130" height="26" rx="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1555" y="145" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">AI 语义叠加层</text>

  <!-- MCP 向下虚线连接各协议 -->
  <line x1="500" y1="167" x2="500" y2="298" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <line x1="1080" y1="167" x2="1080" y2="253" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <line x1="1400" y1="167" x2="1400" y2="318" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <polyline points="380,167 380,650 418,650" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>

  <!-- ============== 坐标轴标签 ============== -->
  <!-- 传输层 轴（顶部） -->
  <text x="252" y="200" font-size="10" fill="#94A3B8">传输层 Transport ▶</text>
  <rect x="540" y="184" width="100" height="26" rx="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="590" y="202" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">TCP</text>
  <rect x="1240" y="184" width="100" height="26" rx="13" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="1290" y="202" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">UDP</text>

  <!-- 通信模型 轴（左侧） -->
  <text x="40" y="508" font-size="10" fill="#94A3B8" transform="rotate(-90 40 508)" text-anchor="middle">▲ 通信模型 Model</text>
  <rect x="80" y="345" width="140" height="30" rx="15" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="150" y="365" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">请求-响应</text>
  <rect x="80" y="635" width="140" height="30" rx="15" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="150" y="655" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">发布-订阅</text>

  <!-- ============== 矩阵主体 ============== -->
  <!-- 象限淡色底（按传输层着色：左 TCP 蓝、右 UDP 绿） -->
  <rect x="242" y="217" width="696" height="286" fill="#EFF6FF" opacity="0.6"/>
  <rect x="942" y="217" width="696" height="286" fill="#ECFDF5" opacity="0.6"/>
  <rect x="242" y="507" width="696" height="286" fill="#EFF6FF" opacity="0.6"/>
  <rect x="942" y="507" width="696" height="286" fill="#ECFDF5" opacity="0.6"/>

  <!-- 矩阵分隔线 -->
  <line x1="940" y1="217" x2="940" y2="793" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="242" y1="505" x2="1638" y2="505" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="242" y1="250" x2="1638" y2="250" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 矩阵外框 -->
  <rect x="240" y="215" width="1400" height="580" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- ===== TL：HTTP（TCP + 请求-响应） ===== -->
  <rect x="440" y="295" width="300" height="130" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="590" y="325" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">HTTP / HTTPS</text>
  <text x="590" y="346" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">TCP · 请求-响应</text>
  <text x="590" y="372" font-size="10" fill="#475569" text-anchor="middle">配网 · 平台 API · 网关北向</text>
  <text x="590" y="390" font-size="9" fill="#64748B" text-anchor="middle">RESTful · 文本 / JSON · 文档下载</text>
  <text x="590" y="408" font-size="9" fill="#94A3B8" text-anchor="middle">端口 80 / 443（TLS）</text>

  <!-- ===== TR：CoAP（UDP + 请求-响应） ===== -->
  <rect x="1010" y="255" width="280" height="95" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1150" y="282" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">CoAP</text>
  <text x="1150" y="301" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">UDP · 请求-响应</text>
  <text x="1150" y="323" font-size="9" fill="#475569" text-anchor="middle">低功耗 constrained device 上报</text>
  <text x="1150" y="340" font-size="9" fill="#94A3B8" text-anchor="middle">端口 5683 / 5684（DTLS）</text>

  <!-- 架于 CoAP 连接（CoAP → LwM2M） -->
  <line x1="1150" y1="350" x2="1150" y2="393" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-purple)"/>
  <text x="1162" y="377" font-size="9" font-weight="700" fill="#7C3AED">架于 CoAP 之上</text>

  <!-- ===== TR：LwM2M（设备管理平面） ===== -->
  <rect x="1010" y="395" width="280" height="100" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1150" y="423" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">LwM2M</text>
  <text x="1150" y="442" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">架于 CoAP · 设备管理平面</text>
  <text x="1150" y="465" font-size="9" fill="#475569" text-anchor="middle">OMA 轻量设备管理（DM）</text>
  <text x="1150" y="482" font-size="9" fill="#64748B" text-anchor="middle">固件升级 · 远程配置 · 监控</text>

  <!-- ===== TR：BLE GATT（BLE 属性模型 · 请求-响应） ===== -->
  <rect x="1330" y="320" width="280" height="115" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1470" y="348" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">BLE GATT</text>
  <text x="1470" y="367" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">BLE 属性模型 · 请求-响应</text>
  <text x="1470" y="392" font-size="9" fill="#475569" text-anchor="middle">近距离穿戴 / 信标配对</text>
  <text x="1470" y="409" font-size="9" fill="#64748B" text-anchor="middle">Read / Write / Notify</text>
  <text x="1470" y="425" font-size="9" fill="#94A3B8" text-anchor="middle">非 IP（链路层，类比 UDP 侧）</text>

  <!-- ===== BL：MQTT（TCP + 发布-订阅） ===== -->
  <rect x="420" y="575" width="340" height="150" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <!-- broker 中转小图标 -->
  <circle cx="468" cy="650" r="16" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="468" y="654" font-size="9" fill="#2563EB" text-anchor="middle">Broker</text>
  <text x="600" y="608" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">MQTT / MQTT-SN</text>
  <text x="600" y="630" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">TCP · 发布-订阅（Broker 中转）</text>
  <text x="600" y="660" font-size="11" fill="#475569" text-anchor="middle">双向控制 · 大规模消息分发</text>
  <text x="600" y="680" font-size="9" fill="#64748B" text-anchor="middle">QoS 0 / 1 / 2 · 遗嘱 · 主题通配</text>
  <text x="600" y="698" font-size="9" fill="#64748B" text-anchor="middle">低带宽 · 长连接保活</text>
  <text x="600" y="715" font-size="9" fill="#94A3B8" text-anchor="middle">端口 1883 / 8883（TLS）</text>

  <!-- ===== BR：UDP + 发布-订阅（稀少） ===== -->
  <rect x="1000" y="585" width="600" height="125" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1300" y="615" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">UDP + 发布-订阅</text>
  <text x="1300" y="640" font-size="11" fill="#475569" text-anchor="middle">该组合在 IoT 选型中较少见</text>
  <text x="1300" y="662" font-size="10" fill="#64748B" text-anchor="middle">特定场景：BLE Mesh、CoAP observe（观察者模式）</text>
  <text x="1300" y="684" font-size="9" fill="#94A3B8" text-anchor="middle">多数发布-订阅需求落在 TCP 侧（MQTT）</text>
  <text x="1296" y="700" font-size="14" fill="#CBD5E1" text-anchor="middle">— 稀疏象限 —</text>

  <!-- ============== 图例 ============== -->
  <line x1="240" y1="820" x2="1640" y2="820" stroke="#E2E8F0" stroke-width="1"/>
  <text x="252" y="844" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">LEGEND</text>

  <rect x="350" y="833" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="374" y="844" font-size="10" fill="#475569">TCP · 主链路协议（HTTP·MQTT）</text>

  <rect x="640" y="833" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="664" y="844" font-size="10" fill="#475569">UDP · 边缘设备协议（CoAP·BLE）</text>

  <rect x="930" y="833" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="954" y="844" font-size="10" fill="#475569">设备管理平面（LwM2M）</text>

  <rect x="1180" y="833" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="1204" y="844" font-size="10" fill="#475569">MCP 语义叠加（虚线）</text>

  <rect x="1430" y="833" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="1454" y="844" font-size="10" fill="#475569">架于 / 依赖关系</text>

  <!-- ============== caption ============== -->
  <text x="900" y="958" font-size="10" fill="#94A3B8" text-anchor="middle">图 9-1 选型框架以"通信模型 × 传输层"两维定位协议：MQTT 在 TCP+发布订阅象限（双向控制、大规模消息）；CoAP 在 UDP+请求响应象限（低功耗上报）；</text>
  <text x="900" y="977" font-size="10" fill="#94A3B8" text-anchor="middle">HTTP 在 TCP+请求响应象限（配网、平台 API、网关北向）；LwM2M 架在 CoAP 之上做设备管理。MCP 不占独立象限，横跨各协议为 AI Agent 提供统一语义接口。</text>
</svg>
