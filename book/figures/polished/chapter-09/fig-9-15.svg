<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">表9-1 协议选型快速评估矩阵</title>
  <desc id="desc">读者应理解协议选型快速评估矩阵中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">表9-1 协议选型快速评估矩阵</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解协议选型快速评估矩阵中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture"><rect x="200" y="200" width="240" height="50" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" /><text x="320" y="225" fill="#0F172A" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">决策维度</text><rect x="440" y="200" width="300" height="50" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" /><text x="590" y="225" fill="#0F172A" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">倾向 MQTT</text><rect x="740" y="200" width="300" height="50" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" /><text x="890" y="225" fill="#0F172A" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">倾向 CoAP</text><rect x="1040" y="200" width="300" height="50" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" /><text x="1190" y="225" fill="#0F172A" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">倾向 LwM2M</text><rect x="1340" y="200" width="300" height="50" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" /><text x="1490" y="225" fill="#0F172A" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle">倾向 HTTP/HTTPS</text><rect x="200" y="250" width="240" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="320" y="285" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">功耗极严</text><rect x="440" y="250" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="590" y="285" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">功耗较高</text><rect x="740" y="250" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="890" y="285" fill="#0F172A" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle">推荐：UDP轻量</text><rect x="1040" y="250" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="1190" y="285" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">可选</text><rect x="1340" y="250" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="1490" y="285" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">不适用</text><rect x="200" y="320" width="240" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="320" y="355" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">需要推送</text><rect x="440" y="320" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="590" y="355" fill="#0F172A" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle">推荐：长连接</text><rect x="740" y="320" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="890" y="355" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">短轮询</text><rect x="1040" y="320" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="1190" y="355" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">支持推送</text><rect x="1340" y="320" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="1490" y="355" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">短轮询</text><rect x="200" y="390" width="240" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="320" y="425" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">设备管理</text><rect x="440" y="390" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="590" y="425" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">基础管理</text><rect x="740" y="390" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="890" y="425" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">有限</text><rect x="1040" y="390" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="1190" y="425" fill="#0F172A" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle">推荐：OMA标准</text><rect x="1340" y="390" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="1490" y="425" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">可用</text><rect x="200" y="460" width="240" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="320" y="495" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">Web集成</text><rect x="440" y="460" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="590" y="495" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">需要桥接</text><rect x="740" y="460" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="890" y="495" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">不易</text><rect x="1040" y="460" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="1190" y="495" fill="#0F172A" font-size="12" text-anchor="middle" dominant-baseline="middle">管理平台</text><rect x="1340" y="460" width="300" height="70" fill="white" stroke="#94A3B8" stroke-width="1.5" /><text x="1490" y="495" fill="#0F172A" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle">推荐：直接REST</text></g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">无额外图例，由表头名称和单元格文字明确含义</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">此矩阵基于第9章9.2–9.4节讨论的核心权衡整理，适用于典型物联网项目选型场景；若设备同时满足多列条件，需结合约束优先级排序（如功耗&gt;成本&gt;网络可用性）</text>
</svg>
