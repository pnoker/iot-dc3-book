<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"
     data-style="architecture-diagram-wireframe-white"
     font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <title>图9-3 CoAP 与 LwM2M 协议栈及交互</title>
  <desc>左侧自底向上的协议栈分层（NB-IoT 无线 / UDP / DTLS·OSCORE / CoAP / LwM2M），右侧 LwM2M Server 与 Client 之间引导、注册、观察通知、配置下发、固件升级五类交互时序。</desc>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2563EB"/>
    </marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#64748B"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <!-- ===== 标题区 ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="46" font-size="22" font-weight="700" fill="#0F172A">图9-3 CoAP 与 LwM2M 协议栈及交互</text>
  <text x="84" y="70" font-size="12" fill="#64748B">LwM2M 架在 CoAP/UDP 之上的分层结构与设备管理五类交互流程</text>
  <rect x="1646" y="26" width="104" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1698" y="44" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">LAYERED</text>
  <line x1="48" y1="100" x2="1752" y2="100" stroke="#E2E8F0"/>

  <!-- ===== 区域标题 ===== -->
  <text x="84" y="138" font-size="14" font-weight="700" fill="#0F172A">① 协议栈分层（自底向上承载）</text>
  <text x="866" y="138" font-size="14" font-weight="700" fill="#0F172A">② Server ↔ Client 交互时序（五类操作）</text>

  <!-- ===== 区域边界 ===== -->
  <rect x="64" y="152" width="760" height="660" rx="12" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="8 4"/>
  <rect x="846" y="152" width="890" height="660" rx="12" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="8 4"/>

  <!-- ===== 左栏：抽象层级轴 ===== -->
  <line x1="99" y1="798" x2="99" y2="210" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="99" y="198" font-size="9" fill="#64748B" text-anchor="middle">高 · 应用</text>
  <text x="99" y="816" font-size="9" fill="#64748B" text-anchor="middle">低 · 物理</text>
  <text transform="rotate(-90 84 504)" x="84" y="504" font-size="10" fill="#64748B" text-anchor="middle">抽象层级</text>

  <!-- ===== 左栏：协议栈分层卡片（自顶向下：LwM2M → CoAP → DTLS/OSCORE → UDP → NB-IoT） ===== -->

  <!-- LwM2M（蓝） -->
  <rect x="124" y="210" width="640" height="100" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <line x1="439" y1="226" x2="439" y2="294" stroke="#E2E8F0"/>
  <text x="144" y="248" font-size="17" font-weight="700" fill="#2563EB">LwM2M</text>
  <text x="144" y="270" font-size="11" fill="#475569">轻量设备管理 · 对象树抽象</text>
  <text x="144" y="292" font-size="9" fill="#64748B">应用 / 管理层（最上层）</text>
  <text x="458" y="246" font-size="15" font-weight="700" fill="#2563EB">/3303/0/5700</text>
  <text x="458" y="264" font-size="10" fill="#64748B">对象树资源寻址</text>
  <text x="458" y="288" font-size="10" fill="#475569">Bootstrap · Register · Observe · Write</text>

  <!-- CoAP（蓝） -->
  <rect x="124" y="332" width="640" height="100" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <line x1="439" y1="348" x2="439" y2="416" stroke="#E2E8F0"/>
  <text x="144" y="370" font-size="17" font-weight="700" fill="#2563EB">CoAP</text>
  <text x="144" y="392" font-size="11" fill="#475569">受限应用协议 · 请求 / 响应</text>
  <text x="144" y="414" font-size="9" fill="#64748B">可靠投递 + Observe 推送</text>
  <text x="458" y="368" font-size="15" font-weight="700" fill="#2563EB">4 B</text>
  <text x="458" y="386" font-size="10" fill="#64748B">最小报文头</text>
  <text x="458" y="410" font-size="10" fill="#475569">CON / NON · Blockwise 分块 · 端口 5683</text>

  <!-- DTLS / OSCORE（红） -->
  <rect x="124" y="454" width="640" height="100" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <line x1="439" y1="470" x2="439" y2="538" stroke="#E2E8F0"/>
  <text x="144" y="492" font-size="17" font-weight="700" fill="#E11D48">DTLS / OSCORE</text>
  <text x="144" y="514" font-size="11" fill="#475569">链路安全 · 加密与完整性保护</text>
  <text x="144" y="536" font-size="9" fill="#64748B">安全层</text>
  <text x="458" y="490" font-size="15" font-weight="700" fill="#E11D48">13 B+</text>
  <text x="458" y="508" font-size="10" fill="#64748B">DTLS 记录开销</text>
  <text x="458" y="532" font-size="10" fill="#475569">OSCORE 对象级安全 · 更精简</text>

  <!-- UDP（灰） -->
  <rect x="124" y="576" width="640" height="100" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <line x1="439" y1="592" x2="439" y2="660" stroke="#E2E8F0"/>
  <text x="144" y="614" font-size="17" font-weight="700" fill="#64748B">UDP</text>
  <text x="144" y="636" font-size="11" fill="#475569">用户数据报 · 无连接传输</text>
  <text x="144" y="658" font-size="9" fill="#64748B">传输层</text>
  <text x="458" y="612" font-size="15" font-weight="700" fill="#64748B">8 B</text>
  <text x="458" y="630" font-size="10" fill="#64748B">报文头</text>
  <text x="458" y="654" font-size="10" fill="#475569">无握手 · 适配受限网络</text>

  <!-- NB-IoT（绿） -->
  <rect x="124" y="698" width="640" height="100" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <line x1="439" y1="714" x2="439" y2="782" stroke="#E2E8F0"/>
  <text x="144" y="736" font-size="17" font-weight="700" fill="#10B981">NB-IoT 等无线</text>
  <text x="144" y="758" font-size="11" fill="#475569">低功耗广域网 · 物理接入</text>
  <text x="144" y="780" font-size="9" fill="#64748B">物理 / 接入层（最底层）</text>
  <text x="458" y="734" font-size="15" font-weight="700" fill="#10B981">PSM / eDRX</text>
  <text x="458" y="752" font-size="10" fill="#64748B">省电模式</text>
  <text x="458" y="776" font-size="10" fill="#475569">深覆盖 · 小流量上行</text>

  <!-- ===== 右栏：时序图 ===== -->
  <!-- 参与者头 -->
  <rect x="972" y="180" width="156" height="46" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1050" y="202" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">LwM2M Server</text>
  <text x="1050" y="218" font-size="10" fill="#64748B" text-anchor="middle">引导 + 管理（平台）</text>

  <rect x="1482" y="180" width="156" height="46" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1560" y="202" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">LwM2M Client</text>
  <text x="1560" y="218" font-size="10" fill="#64748B" text-anchor="middle">地磁车位传感器</text>

  <!-- 生命线 -->
  <line x1="1050" y1="226" x2="1050" y2="800" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="1560" y1="226" x2="1560" y2="800" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ① Bootstrap 引导：Client → Server（虚线 灰） -->
  <line x1="1548" y1="275" x2="1062" y2="275" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1305" y="263" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">①  Bootstrap 引导</text>
  <text x="1305" y="292" font-size="10" fill="#64748B" text-anchor="middle">Client 发起 · 下发服务器端点与安全密钥</text>

  <!-- ② Register / Update：Client → Server（实线 蓝） -->
  <line x1="1548" y1="358" x2="1062" y2="358" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1305" y="346" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">②  Register 注册 / Update 更新</text>
  <text x="1305" y="375" font-size="10" fill="#64748B" text-anchor="middle">POST /rd · 上报对象 /3 /3303 /5 与生命周期 TTL</text>

  <!-- ③ Observe：Server → Client（实线 蓝） -->
  <line x1="1062" y1="448" x2="1548" y2="448" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1305" y="436" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">③  Observe 观察（订阅资源）</text>
  <text x="1305" y="465" font-size="10" fill="#64748B" text-anchor="middle">GET /3303/0/5700 · Observe 选项（CON 订阅）</text>

  <!-- ③ Notify：Client → Server（虚线 灰） -->
  <line x1="1548" y1="515" x2="1062" y2="515" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1305" y="503" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Notify 通知（资源变化即推送）</text>
  <text x="1305" y="532" font-size="10" fill="#64748B" text-anchor="middle">5700 = 23.5 ℃ · NON 可丢包、省功耗</text>

  <!-- ④ Write 配置：Server → Client（实线 蓝） -->
  <line x1="1062" y1="602" x2="1548" y2="602" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1305" y="590" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">④  Write 配置（下发上报属性）</text>
  <text x="1305" y="619" font-size="10" fill="#64748B" text-anchor="middle">Write-Attributes /3303/0/5700 · pmin=60 · pmax=3600 s</text>

  <!-- ⑤ Firmware 固件升级：Server → Client（实线 蓝） -->
  <line x1="1062" y1="706" x2="1548" y2="706" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1305" y="694" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">⑤  Firmware 固件升级（对象 /5）</text>
  <text x="1305" y="723" font-size="10" fill="#64748B" text-anchor="middle">Write /5/0/1 包地址 → Exec /5/0/2 Update → 重启</text>

  <!-- ===== 图例 ===== -->
  <line x1="64" y1="836" x2="1736" y2="836" stroke="#E2E8F0"/>
  <text x="64" y="860" font-size="11" font-weight="600" fill="#64748B">图例</text>

  <line x1="120" y1="856" x2="160" y2="856" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="168" y="860" font-size="11" fill="#475569">请求 / 下发（主链路）</text>

  <line x1="408" y1="856" x2="448" y2="856" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="456" y="860" font-size="11" fill="#475569">通知 / 回传（异步）</text>

  <rect x="696" y="850" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="720" y="860" font-size="11" fill="#475569">应用 / 核心协议层</text>

  <rect x="984" y="850" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1008" y="860" font-size="11" fill="#475569">安全层</text>

  <rect x="1232" y="850" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="1256" y="860" font-size="11" fill="#475569">接入 / 设备层</text>

  <rect x="1480" y="850" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="1504" y="860" font-size="11" fill="#475569">传输层（UDP）</text>

  <!-- 场景 callout -->
  <rect x="600" y="884" width="600" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="900" y="906" font-size="11" fill="#334155" text-anchor="middle">假设场景：NB-IoT 地磁车位传感器（上报车位占用 / 温度，支持远程固件升级）</text>

  <!-- ===== caption ===== -->
  <text x="900" y="952" font-size="10" fill="#94A3B8" text-anchor="middle">图9-3 LwM2M 架在 CoAP 之上：CoAP 负责 CON/NON 的可靠投递与 Observe 推送，LwM2M 负责对象树抽象与设备管理。</text>
  <text x="900" y="970" font-size="10" fill="#94A3B8" text-anchor="middle">右侧时序串起引导→注册→观察/通知→读写配置→固件升级五类交互，所有交互本质都是对对象树资源（如 /3303/0/5700）的 CoAP 操作。</text>
</svg>
