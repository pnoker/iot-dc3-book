  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图13-2 展示设备从硬件密钥生成、DID注册到验证方自主验证的完整身份生命周期。链上操作以虚线区分。</text>
