<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="53.600" width="1152.000" height="652.800" viewBox="0 0 1200.000 680.000" preserveAspectRatio="xMidYMid meet">
<!-- 网格背景 -->
            <defs>
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="0.5" />
                </pattern>
                <!-- 箭头标记：主链路蓝色 -->
                <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
                <!-- 箭头标记：数据紫色 -->
                <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
                <!-- 箭头标记：外部灰色 -->
                <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94A3B8"/></marker>
                <!-- 浅投影 -->
                <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06" />
                </filter>
                <filter id="shadow-db" x="-4%" y="-4%" width="108%" height="112%">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06" />
                </filter>
            </defs>

            <!-- 背景网格 -->
            <rect x="0" y="0" width="1200" height="680" fill="url(#grid)" />

            <!-- ==================== 区域边界 (先绘制，让连线在之上、组件在更之上) ==================== -->
            <!-- 设备与边缘域 -->
            <rect x="18" y="85" width="212" height="290" rx="14" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.45" />
            <rect x="18" y="85" width="212" height="290" rx="14" fill="#0F766E" opacity="0.04" />
            <text x="34" y="112" font-size="13" font-weight="600" fill="#0F766E" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">设备与边缘域</text>
            <text x="34" y="130" font-size="10" fill="#64748B" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">现场异构资源边界</text>

            <!-- 数据资产域 -->
            <rect x="248" y="85" width="940" height="290" rx="14" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.35" />
            <rect x="248" y="85" width="940" height="290" rx="14" fill="#2563EB" opacity="0.025" />
            <text x="264" y="112" font-size="13" font-weight="600" fill="#2563EB" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">数据资产域</text>
            <text x="264" y="130" font-size="10" fill="#64748B" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">数据沉淀与治理边界</text>

            <!-- ==================== 连线 (在组件之前绘制，让箭头落在盒子背后) ==================== -->
            <!-- 1. 设备 → 驱动：Modbus TCP -->
            <line x1="182" y1="230" x2="268" y2="230" stroke="#2563EB" stroke-width="2.8" marker-end="url(#arrow-blue)" />
            <rect x="195" y="206" width="72" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.92" stroke="#E2E8F0" stroke-width="0.5" />
            <text x="231" y="219" font-size="11" font-weight="500" fill="#1E40AF" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">Modbus TCP</text>

            <!-- 2. 驱动 → 数据中心：PointValue流 -->
            <line x1="428" y1="230" x2="516" y2="230" stroke="#2563EB" stroke-width="2.8" marker-end="url(#arrow-blue)" />
            <rect x="441" y="206" width="72" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.92" stroke="#E2E8F0" stroke-width="0.5" />
            <text x="477" y="219" font-size="11" font-weight="500" fill="#1E40AF" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">PointValue流</text>

            <!-- 3. 数据中心 → TimescaleDB：写入 -->
            <line x1="676" y1="230" x2="764" y2="230" stroke="#7C3AED" stroke-width="2.8" marker-end="url(#arrow-purple)" />
            <rect x="693" y="206" width="56" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.92" stroke="#E2E8F0" stroke-width="0.5" />
            <text x="721" y="219" font-size="11" font-weight="500" fill="#6B21A8" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">写入</text>

            <!-- 4. TimescaleDB → Grafana：SQL查询 -->
            <line x1="926" y1="230" x2="1012" y2="230" stroke="#94A3B8" stroke-width="2.8" marker-end="url(#arrow-gray)" />
            <rect x="939" y="206" width="64" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.92" stroke="#E2E8F0" stroke-width="0.5" />
            <text x="971" y="219" font-size="11" font-weight="500" fill="#475569" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">SQL查询</text>

            <!-- 轮询周期标注 (设备上方) -->
            <text x="104" y="155" font-size="10" fill="#0F766E" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">轮询周期 2s</text>

            <!-- 刷新间隔标注 (Grafana上方) -->
            <text x="1096" y="155" font-size="10" fill="#64748B" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">刷新间隔 5s</text>

            <!-- ==================== 组件节点 ==================== -->

            <!-- 1. 设备层 (edge - 青绿) -->
            <g filter="url(#shadow)">
                <rect x="24" y="170" width="158" height="120" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.8" />
                <text x="103" y="212" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">SMT产线设备</text>
                <text x="103" y="234" font-size="12" fill="#0F766E" text-anchor="middle" font-weight="500" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">回流焊炉 / 贴片机</text>
                <text x="103" y="258" font-size="10" fill="#475569" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">锡膏印刷机</text>
                <!-- 小设备图标 -->
                <circle cx="42" cy="186" r="6" fill="#0F766E" opacity="0.15" />
                <text x="42" y="189" font-size="7" fill="#0F766E" text-anchor="middle" font-weight="700">⚙</text>
            </g>

            <!-- 2. Modbus驱动 (platform - 蓝) -->
            <g filter="url(#shadow)">
                <rect x="270" y="170" width="158" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" />
                <text x="349" y="212" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">Modbus驱动</text>
                <text x="349" y="234" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="500" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">轮询 · 归一 · 上报</text>
                <text x="349" y="258" font-size="10" fill="#475569" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">dc3-driver-modbus-tcp</text>
                <!-- 小图标 -->
                <circle cx="288" cy="186" r="6" fill="#2563EB" opacity="0.12" />
                <text x="288" y="189" font-size="7" fill="#2563EB" text-anchor="middle" font-weight="700">↻</text>
            </g>

            <!-- 3. 数据中心 (platform - 蓝) -->
            <g filter="url(#shadow)">
                <rect x="518" y="170" width="158" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" />
                <text x="597" y="212" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">数据中心</text>
                <text x="597" y="234" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="500" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">清洗 · 对齐 · 写入</text>
                <text x="597" y="258" font-size="10" fill="#475569" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">时间戳 + 单位转换</text>
                <!-- 小图标 -->
                <circle cx="536" cy="186" r="6" fill="#2563EB" opacity="0.12" />
                <text x="536" y="189" font-size="7" fill="#2563EB" text-anchor="middle" font-weight="700">◇</text>
            </g>

            <!-- 4. TimescaleDB (data - 紫 / 数据库圆柱体) -->
            <g filter="url(#shadow-db)">
                <!-- 底部椭圆 -->
                <ellipse cx="845" cy="286" rx="79" ry="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6" />
                <!-- 主体矩形 -->
                <rect x="766" y="170" width="158" height="116" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6" />
                <!-- 顶部椭圆 -->
                <ellipse cx="845" cy="170" rx="79" ry="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6" />
                <!-- 描边修补：底部椭圆与矩形衔接 -->
                <path d="M 766 286 L 766 170" stroke="#7C3AED" stroke-width="1.6" fill="none" />
                <path d="M 924 286 L 924 170" stroke="#7C3AED" stroke-width="1.6" fill="none" />

                <!-- 文字 (在顶层) -->
                <text x="845" y="218" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">TimescaleDB</text>
                <text x="845" y="238" font-size="12" fill="#7C3AED" text-anchor="middle" font-weight="500" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">时序分区存储</text>
                <text x="845" y="262" font-size="10" fill="#475569" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">按设备+位号分区</text>
                <!-- 小图标 -->
                <circle cx="784" cy="186" r="6" fill="#7C3AED" opacity="0.12" />
                <text x="784" y="189" font-size="7" fill="#7C3AED" text-anchor="middle" font-weight="700">⛁</text>
            </g>

            <!-- 5. Grafana大屏 (external - 白/灰) -->
            <g filter="url(#shadow)">
                <rect x="1014" y="170" width="158" height="120" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.8" />
                <text x="1093" y="212" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">Grafana大屏</text>
                <text x="1093" y="234" font-size="12" fill="#64748B" text-anchor="middle" font-weight="500" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">实时监控面板</text>
                <text x="1093" y="258" font-size="10" fill="#475569" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">按设备聚合曲线</text>
                <!-- 小图标 -->
                <circle cx="1032" cy="186" r="6" fill="#94A3B8" opacity="0.15" />
                <text x="1032" y="189" font-size="7" fill="#64748B" text-anchor="middle" font-weight="700">▦</text>
            </g>

            <!-- ==================== 图例 (放在区域边界之外，底部) ==================== -->
            <g transform="translate(0, 420)">
                <!-- 图例背景 -->
                <rect x="24" y="0" width="1152" height="46" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
                <text x="42" y="28" font-size="13" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">图例</text>

                <!-- 青绿色：设备与边缘 -->
                <rect x="90" y="12" width="18" height="18" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
                <text x="116" y="26" font-size="12" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">设备与边缘</text>

                <!-- 蓝色：平台核心服务 -->
                <rect x="218" y="12" width="18" height="18" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
                <text x="244" y="26" font-size="12" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">平台核心服务</text>

                <!-- 紫色：时序数据库 -->
                <rect x="354" y="12" width="18" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" />
                <text x="380" y="26" font-size="12" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">时序数据库</text>

                <!-- 白色+灰框：可视化层 -->
                <rect x="484" y="12" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
                <text x="510" y="26" font-size="12" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">可视化层</text>

                <!-- 连线图例 -->
                <line x1="610" y1="21" x2="650" y2="21" stroke="#2563EB" stroke-width="2.8" marker-end="url(#arrow-blue)" />
                <text x="658" y="26" font-size="12" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">数据/控制流</text>

                <!-- 虚线边界 -->
                <line x1="770" y1="21" x2="810" y2="21" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6" />
                <text x="818" y="26" font-size="12" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">系统边界</text>

                <!-- 轮询标注 -->
                <text x="910" y="26" font-size="11" fill="#475569" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">轮询周期 2s · 刷新间隔 5s</text>
            </g>

            <!-- ==================== 图注 ==================== -->
            <text x="24" y="495" font-size="11" fill="#64748B" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif">
                <tspan x="24" dy="0" font-weight="600" fill="#0F172A">图10-4</tspan>
                <tspan dy="0"> 示意SMT产线场景下IoT DC3从设备接入到监控大屏的数据流。驱动服务通过批量读减少网络往返，每周期读整段连续地址；</tspan>
                <tspan x="24" dy="18">数据中心处理时间戳对齐和单位转换，保证下游数据一致性。Grafana通过PostgreSQL数据源连接TimescaleDB，按设备分组展示实时曲线。</tspan>
            </text>
  </svg>
</svg>
