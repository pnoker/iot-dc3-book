<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图6-3 物联网REST API端点设计示例（示意）</title>
  <desc id="desc">读者应理解物联网REST API端点设计示例（示意）中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图6-3 物联网REST API端点设计示例（示意）</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解物联网REST API端点设计示例（示意）中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">DATAFLOW</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="dataflow">
  <!-- Connections (drawn before nodes) -->
  <!-- Main link: device → post_data → processing (blue bold) -->
  <line x1="270" y1="205" x2="450" y2="205" stroke="#2563EB" stroke-width="3" marker-end="url(#bp-arrow-primary)"/>
  <line x1="650" y1="205" x2="1000" y2="205" stroke="#2563EB" stroke-width="3" marker-end="url(#bp-arrow-primary)"/>
  
  <!-- frontend → get_devices -->
  <line x1="270" y1="305" x2="450" y2="305" stroke="#64748B" stroke-width="1.5" marker-end="url(#bp-arrow)"/>
  
  <!-- frontend → get_history (polyline) -->
  <polyline points="270,305 360,305 360,445 450,445" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#bp-arrow)"/>
  
  <!-- thirdparty → post_rule -->
  <polyline points="270,405 360,405 360,505 450,505" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#bp-arrow)"/>
  
  <!-- thirdparty → get_alarms -->
  <polyline points="270,405 360,405 360,585 450,585" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#bp-arrow)"/>
  
  <!-- post_command → control layer -->
  <polyline points="650,285 820,285 820,365 1000,365" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#bp-arrow)"/>
  
  <!-- Connection labels (white background rects for readability) -->
  <g font-size="11" fill="#0F172A" text-anchor="middle">
    <rect x="310" y="195" width="54" height="18" fill="white" rx="3"/>
    <text x="337" y="208">上报数据</text>
    <rect x="770" y="195" width="40" height="18" fill="white" rx="3"/>
    <text x="790" y="208">传入</text>
    <rect x="310" y="295" width="34" height="18" fill="white" rx="3"/>
    <text x="327" y="308">查询</text>
    <rect x="370" y="400" width="34" height="18" fill="white" rx="3"/>
    <text x="387" y="413">查询</text>
    <rect x="310" y="450" width="54" height="18" fill="white" rx="3"/>
    <text x="337" y="463">创建规则</text>
    <rect x="310" y="550" width="34" height="18" fill="white" rx="3"/>
    <text x="327" y="563">查询</text>
    <rect x="800" y="310" width="34" height="18" fill="white" rx="3"/>
    <text x="817" y="323">下发</text>
  </g>
  
  <!-- External Entities (ellipses) -->
  <!-- Device -->
  <ellipse cx="210" cy="205" rx="60" ry="25" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="210" y="203" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">设备</text>
  
  <!-- Frontend -->
  <ellipse cx="210" cy="305" rx="60" ry="25" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="210" y="303" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">前端/用户</text>
  
  <!-- Third-party -->
  <ellipse cx="210" cy="405" rx="60" ry="25" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="210" y="403" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">第三方系统</text>
  
  <!-- API Endpoints (rounded rectangles with method colors) -->
  <!-- POST data -->
  <rect x="450" y="180" width="200" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="550" y="206" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">POST</text>
  <text x="550" y="220" font-size="10" fill="#475569" text-anchor="middle">/devices/{id}/data</text>
  
  <!-- POST command -->
  <rect x="450" y="260" width="200" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="550" y="286" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">POST</text>
  <text x="550" y="300" font-size="10" fill="#475569" text-anchor="middle">/devices/{id}/command</text>
  
  <!-- GET devices -->
  <rect x="450" y="340" width="200" height="50" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="550" y="366" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">GET</text>
  <text x="550" y="380" font-size="10" fill="#475569" text-anchor="middle">/devices</text>
  
  <!-- GET history -->
  <rect x="450" y="420" width="200" height="50" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="550" y="446" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">GET</text>
  <text x="550" y="460" font-size="10" fill="#475569" text-anchor="middle">/devices/{id}/history</text>
  
  <!-- POST rules -->
  <rect x="450" y="500" width="200" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="550" y="526" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">POST</text>
  <text x="550" y="540" font-size="10" fill="#475569" text-anchor="middle">/alarms/rules</text>
  
  <!-- GET alarms -->
  <rect x="450" y="580" width="200" height="50" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="550" y="606" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">GET</text>
  <text x="550" y="620" font-size="10" fill="#475569" text-anchor="middle">/alarms/active</text>
  
  <!-- Internal Services (dashed rounded rectangles) -->
  <!-- Access layer -->
  <rect x="1000" y="175" width="220" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="1110" y="203" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">接入层</text>
  <text x="1110" y="220" font-size="10" fill="#475569" text-anchor="middle">校验、去重、队列</text>
  
  <!-- Control layer -->
  <rect x="1000" y="335" width="220" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="1110" y="363" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">控制层</text>
  <text x="1110" y="380" font-size="10" fill="#475569" text-anchor="middle">指令队列</text>
  
  <!-- Query layer -->
  <rect x="1000" y="495" width="220" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="1110" y="523" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">数据查询层</text>
  <text x="1110" y="540" font-size="10" fill="#475569" text-anchor="middle">时间序列>查询</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">外部实体</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">API端点</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">内部服务逻辑</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图6-3 物联网REST API端点设计示例（示意）</text>
</svg>
