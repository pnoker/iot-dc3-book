<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图6-1 单体到微服务演进阶段图</title>
  <desc id="desc">读者应理解单体到微服务演进阶段图中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图6-1 单体到微服务演进阶段图</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解单体到微服务演进阶段图中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LIFECYCLE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="lifecycle">
  <!-- Time indicator arrow -->
  <line x1="80" y1="420" x2="110" y2="420" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <text x="85" y="410" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="14" fill="#0F172A">时间</text>

  <!-- Arrow 1: Stage1 -> Stage2 -->
  <line x1="440" y1="420" x2="540" y2="420" stroke="#1565C0" stroke-width="3" marker-end="url(#bp-arrow-primary)"/>
  <rect x="435" y="405" width="110" height="20" rx="3" fill="#FFFFFF" stroke="none"/>
  <text x="490" y="420" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">单一变更影响全局</text>

  <!-- Arrow 2: Stage2 -> Stage3 -->
  <line x1="860" y1="420" x2="960" y2="420" stroke="#1565C0" stroke-width="3" marker-end="url(#bp-arrow-primary)"/>
  <rect x="865" y="405" width="90" height="20" rx="3" fill="#FFFFFF" stroke="none"/>
  <text x="910" y="420" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">功能耦合加剧</text>

  <!-- Arrow 3: Stage3 -> Stage4 -->
  <line x1="1300" y1="420" x2="1380" y2="420" stroke="#1565C0" stroke-width="3" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1295" y="405" width="90" height="20" rx="3" fill="#FFFFFF" stroke="none"/>
  <text x="1340" y="420" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">团队分工需求</text>

  <!-- Stage 1: Monolith Prototype -->
  <rect x="120" y="350" width="320" height="140" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="280" y="395" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">模块化包结构</text>
  <text x="280" y="415" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">快速验证</text>
  <text x="280" y="505" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle">团队 &lt;3人</text>
  <!-- Risk tag -->
  <rect x="240" y="326" width="80" height="24" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="280" y="342" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#DC2626" text-anchor="middle">部署效率低</text>

  <!-- Stage 2: Core Module Extraction (trapezoid) -->
  <polygon points="560,350 840,350 860,490 540,490" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="700" y="395" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">数据库隔离、</text>
  <text x="700" y="415" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">接口契约、容器化</text>
  <text x="700" y="505" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle">团队3-5人</text>
  <!-- Risk tag -->
  <rect x="660" y="326" width="80" height="24" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="700" y="342" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#DC2626" text-anchor="middle">单点故障</text>

  <!-- Stage 3: Event-Driven Transformation -->
  <rect x="960" y="350" width="320" height="140" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1120" y="395" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">MQTT Broker -&gt; 消息队列 -&gt;</text>
  <text x="1120" y="415" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">消费端扩容</text>
  <text x="1120" y="505" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle">团队5-8人</text>
  <!-- Risk tag -->
  <rect x="1080" y="326" width="80" height="24" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="1120" y="342" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#DC2626" text-anchor="middle">数据一致性</text>

  <!-- Stage 4: Continuous Evolution (dashed) -->
  <rect x="1380" y="350" width="320" height="140" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1540" y="395" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">按场景拆分、</text>
  <text x="1540" y="415" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">聚合服务整合</text>
  <text x="1540" y="505" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle">团队8-15人</text>
  <!-- Risk tag -->
  <rect x="1500" y="326" width="80" height="24" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="1540" y="342" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#DC2626" text-anchor="middle">分布式事务成本</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝=核心平台与主链路</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">青绿=设备、边缘与接入</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">橙=AI，紫=数据，红=安全</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图6-1 展示从单体原型到微服务持续演进的四个典型阶段。</text>
</svg>
