<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图4-8 IoT DC3 驱动启动与业务注册时序</title>
  <desc id="desc">展示 Driver 从进程启动到 Manager 业务注册、协议初始化、RabbitMQ 队列监听和状态上报的真实顺序</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图4-8 IoT DC3 驱动启动与业务注册时序</text>
  <text x="82" y="70" fill="#64748B" font-size="12">展示 Driver 从进程启动到 Manager 业务注册、协议初始化、RabbitMQ 队列监听和状态上报的真实顺序</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">SEQUENCE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="sequence">
  <!-- Participant boxes -->
  <rect x="470" y="140" width="140" height="60" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="540" y="168" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">DriverInitRunner</text>
  <text x="540" y="185" fill="#64748B" font-size="11" text-anchor="middle">启动器</text>

  <rect x="650" y="140" width="140" height="60" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="720" y="168" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">DriverRegisterService</text>
  <text x="720" y="185" fill="#64748B" font-size="11" text-anchor="middle">注册服务</text>

  <rect x="830" y="140" width="140" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="168" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">Manager</text>
  <text x="900" y="185" fill="#64748B" font-size="11" text-anchor="middle">gRPC服务</text>

  <rect x="1010" y="140" width="140" height="60" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1080" y="168" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">DriverCustomService</text>
  <text x="1080" y="185" fill="#64748B" font-size="11" text-anchor="middle">自定义服务</text>

  <rect x="1190" y="140" width="140" height="60" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1260" y="168" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">RabbitMQ</text>
  <text x="1260" y="185" fill="#64748B" font-size="11" text-anchor="middle">消息队列</text>

  <!-- Lifelines -->
  <line x1="540" y1="200" x2="540" y2="630" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="720" y1="200" x2="720" y2="630" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="900" y1="200" x2="900" y2="630" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1080" y1="200" x2="1080" y2="630" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1260" y1="200" x2="1260" y2="630" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Message 1: DriverInitRunner -> DriverRegisterService (sync) -->
  <line x1="540" y1="230" x2="720" y2="230" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="560" y="218" width="80" height="16" rx="3" fill="#F8FAFC" stroke="none"/>
  <text x="630" y="230" fill="#0F172A" font-size="11" text-anchor="middle">启动注册</text>

  <!-- Message 2: DriverRegisterService -> Manager (gRPC) -->
  <line x1="720" y1="280" x2="900" y2="280" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="750" y="268" width="100" height="16" rx="3" fill="#F8FAFC" stroke="none"/>
  <text x="810" y="280" fill="#0F172A" font-size="11" text-anchor="middle">gRPC Register</text>

  <!-- Message 3: Manager -> DriverRegisterService (return) -->
  <line x1="900" y1="330" x2="720" y2="330" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="750" y="318" width="100" height="16" rx="3" fill="#F8FAFC" stroke="none"/>
  <text x="810" y="330" fill="#0F172A" font-size="11" text-anchor="middle">RegisterResponse</text>

  <!-- Message 4: DriverRegisterService -> DriverCustomService (sync) -->
  <line x1="720" y1="380" x2="1080" y2="380" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="820" y="368" width="120" height="16" rx="3" fill="#F8FAFC" stroke="none"/>
  <text x="900" y="380" fill="#0F172A" font-size="11" text-anchor="middle">通知初始化协议</text>

  <!-- Message 5: DriverCustomService self-loop (init) -->
  <path d="M1080,430 L1140,430 L1140,480 L1080,480" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1100" y="445" width="80" height="16" rx="3" fill="#F8FAFC" stroke="none"/>
  <text x="1150" y="455" fill="#0F172A" font-size="11" text-anchor="middle">初始化调度</text>

  <!-- Message 6: DriverCustomService -> RabbitMQ (async) -->
  <line x1="1080" y1="520" x2="1260" y2="520" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="1120" y="508" width="100" height="16" rx="3" fill="#F8FAFC" stroke="none"/>
  <text x="1170" y="520" fill="#0F172A" font-size="11" text-anchor="middle">订阅命令队列</text>

  <!-- Message 7: RabbitMQ -> DriverCustomService (async) -->
  <line x1="1260" y1="560" x2="1080" y2="560" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="1120" y="548" width="100" height="16" rx="3" fill="#F8FAFC" stroke="none"/>
  <text x="1170" y="560" fill="#0F172A" font-size="11" text-anchor="middle">命令消息</text>

  <!-- Message 8: DriverCustomService -> Manager (gRPC status) -->
  <line x1="1080" y1="600" x2="900" y2="600" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="940" y="588" width="100" height="16" rx="3" fill="#F8FAFC" stroke="none"/>
  <text x="990" y="600" fill="#0F172A" font-size="11" text-anchor="middle">上报状态</text>

  <!-- Bottom annotation bar -->
  <rect x="470" y="635" width="860" height="35" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="900" y="657" fill="#64748B" font-size="12" text-anchor="middle">固定服务名、容器DNS与环境变量寻址</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝=核心平台与主链路</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">青绿=设备、边缘与接入</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">橙=AI，紫=数据，红=安全</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图4-8 驱动启动后先经 gRPC 向 Manager 同步业务元数据，再初始化协议资源与调度任务；运行时通过 RabbitMQ 收发命令、回执和状态。业务注册不等于服务注册中心。</text>
</svg>
