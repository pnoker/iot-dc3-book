<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif" text-rendering="geometricPrecision">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="980" fill="#FFFFFF"/>

  <!-- ============ 1. TITLE AREA ============ -->
  <g id="title">
    <circle cx="64" cy="42" r="6" fill="#2563EB"/>
    <text x="84" y="49" font-size="22" font-weight="700" fill="#0F172A">图4-4 物模型把 N×N 耦合削成 2N</text>
    <text x="84" y="72" font-size="12" fill="#64748B">物模型作为单一锚点，把协议互通复杂度从 O(N²) 降到 O(2N)</text>

    <rect x="1620" y="28" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1700" y="47" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">ARCHITECTURE</text>

    <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- ============ 2. BODY : PANEL BOUNDARIES ============ -->
  <g id="panels">
    <rect x="60" y="125" width="790" height="665" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="8 4"/>
    <rect x="950" y="125" width="790" height="665" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="8 4"/>

    <text x="80" y="154" font-size="13" font-weight="700" fill="#475569">① 无物模型 · 点对点全互联</text>
    <text x="80" y="172" font-size="10" fill="#94A3B8">每对协议各自翻译，耦合随协议数平方增长</text>

    <text x="970" y="154" font-size="13" font-weight="700" fill="#475569">② 引入物模型 · 星形锚点</text>
    <text x="970" y="172" font-size="10" fill="#94A3B8">所有协议只对接物模型，新增协议零侵入</text>
  </g>

  <!-- ============ LEFT : N×N FULL MESH — lines drawn first (under nodes) ============ -->
  <!-- pentagon centers: A(455,305) B(612,419) C(552,604) D(358,604) E(298,419) -->
  <g id="mesh-lines" stroke="#94A3B8" stroke-width="1.3" opacity="0.6" fill="none">
    <line x1="455" y1="305" x2="612" y2="419"/>
    <line x1="455" y1="305" x2="552" y2="604"/>
    <line x1="455" y1="305" x2="358" y2="604"/>
    <line x1="455" y1="305" x2="298" y2="419"/>
    <line x1="612" y1="419" x2="552" y2="604"/>
    <line x1="612" y1="419" x2="358" y2="604"/>
    <line x1="612" y1="419" x2="298" y2="419"/>
    <line x1="552" y1="604" x2="358" y2="604"/>
    <line x1="552" y1="604" x2="298" y2="419"/>
    <line x1="358" y1="604" x2="298" y2="419"/>
  </g>

  <!-- mesh edge-count badge at mesh center (455,470) -->
  <g id="mesh-badge">
    <circle cx="455" cy="470" r="30" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.4" opacity="0.97"/>
    <text x="455" y="468" text-anchor="middle" font-size="15" font-weight="700" fill="#E11D48">10</text>
    <text x="455" y="483" text-anchor="middle" font-size="8.5" fill="#E11D48">连线</text>
  </g>

  <g id="mesh-nodes">
    <!-- A · MQTT (top) -->
    <g>
      <rect x="400" y="283" width="110" height="44" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="455" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">MQTT</text>
      <text x="455" y="319" text-anchor="middle" font-size="9" fill="#64748B">发布订阅</text>
    </g>
    <!-- B · CoAP (upper-right) -->
    <g>
      <rect x="557" y="397" width="110" height="44" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="612" y="418" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">CoAP</text>
      <text x="612" y="433" text-anchor="middle" font-size="9" fill="#64748B">UDP 轻量</text>
    </g>
    <!-- C · HTTP (lower-right) -->
    <g>
      <rect x="497" y="582" width="110" height="44" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="552" y="603" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">HTTP</text>
      <text x="552" y="618" text-anchor="middle" font-size="9" fill="#64748B">请求响应</text>
    </g>
    <!-- D · Modbus (lower-left) -->
    <g>
      <rect x="303" y="582" width="110" height="44" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="358" y="603" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">Modbus</text>
      <text x="358" y="618" text-anchor="middle" font-size="9" fill="#64748B">寄存器</text>
    </g>
    <!-- E · OPC UA (upper-left) -->
    <g>
      <rect x="243" y="397" width="110" height="44" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="298" y="418" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">OPC UA</text>
      <text x="298" y="433" text-anchor="middle" font-size="9" fill="#64748B">信息建模</text>
    </g>
  </g>

  <!-- ============ MIDDLE TRANSFORMATION ============ -->
  <g id="transform">
    <text x="900" y="446" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">引入锚点</text>
    <line x1="860" y1="470" x2="940" y2="470" stroke="#2563EB" stroke-width="3" marker-end="url(#ah-blue)"/>
    <text x="900" y="500" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">N² → 2N</text>
  </g>

  <!-- ============ RIGHT : STAR TO ANCHOR — lines first (under nodes) ============ -->
  <!-- node centers: (1345,300) (1507,418) (1445,608) (1245,608) (1183,418) → anchor (1345,470) -->
  <g id="star-lines" stroke="#2563EB" stroke-width="2.4" fill="none">
    <line x1="1345" y1="300" x2="1345" y2="470"/>
    <line x1="1507" y1="418" x2="1345" y2="470"/>
    <line x1="1445" y1="608" x2="1345" y2="470"/>
    <line x1="1245" y1="608" x2="1345" y2="470"/>
    <line x1="1183" y1="418" x2="1345" y2="470"/>
  </g>

  <g id="star-nodes">
    <!-- MQTT (top) -->
    <g>
      <rect x="1290" y="278" width="110" height="44" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="1345" y="299" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">MQTT</text>
      <text x="1345" y="314" text-anchor="middle" font-size="9" fill="#64748B">发布订阅</text>
    </g>
    <!-- CoAP (upper-right) -->
    <g>
      <rect x="1452" y="396" width="110" height="44" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="1507" y="417" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">CoAP</text>
      <text x="1507" y="432" text-anchor="middle" font-size="9" fill="#64748B">UDP 轻量</text>
    </g>
    <!-- HTTP (lower-right) -->
    <g>
      <rect x="1390" y="586" width="110" height="44" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="1445" y="607" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">HTTP</text>
      <text x="1445" y="622" text-anchor="middle" font-size="9" fill="#64748B">请求响应</text>
    </g>
    <!-- Modbus (lower-left) -->
    <g>
      <rect x="1190" y="586" width="110" height="44" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="1245" y="607" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">Modbus</text>
      <text x="1245" y="622" text-anchor="middle" font-size="9" fill="#64748B">寄存器</text>
    </g>
    <!-- OPC UA (upper-left) -->
    <g>
      <rect x="1128" y="396" width="110" height="44" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <text x="1183" y="417" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">OPC UA</text>
      <text x="1183" y="432" text-anchor="middle" font-size="9" fill="#64748B">信息建模</text>
    </g>
    <!-- central Thing Model anchor (drawn on top) -->
    <g id="anchor">
      <rect x="1280" y="442" width="130" height="56" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
      <text x="1345" y="469" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">物模型</text>
      <text x="1345" y="487" text-anchor="middle" font-size="9" fill="#64748B">Thing Model · 锚点</text>
    </g>
    <!-- small edge-count tag beside anchor -->
    <g>
      <circle cx="1430" cy="470" r="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
      <text x="1430" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">5</text>
    </g>
  </g>

  <!-- ============ COMPLEXITY CALLOUTS ============ -->
  <g id="callouts">
    <!-- left: O(N^2) -->
    <rect x="335" y="710" width="240" height="58" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.4"/>
    <text x="455" y="734" text-anchor="middle" font-size="14" font-weight="700" fill="#E11D48">O(N²) · N×(N−1) 次翻译</text>
    <text x="455" y="754" text-anchor="middle" font-size="10" fill="#64748B">N=5 → 每协议需对接其他 4 个</text>

    <!-- right: O(2N) -->
    <rect x="1225" y="710" width="240" height="58" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
    <text x="1345" y="734" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">O(2N) · 2N 次翻译</text>
    <text x="1345" y="754" text-anchor="middle" font-size="10" fill="#64748B">N=5 → 每协议仅对接物模型 1 个</text>
  </g>

  <!-- ============ 3. LEGEND ============ -->
  <g id="legend" font-size="11" fill="#475569">
    <rect x="60" y="822" width="1680" height="1" fill="#E2E8F0"/>

    <rect x="80" y="840" width="24" height="14" rx="3" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="114" y="852">协议节点（接入域）</text>

    <rect x="330" y="840" width="24" height="14" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="364" y="852">物模型（核心锚点）</text>

    <line x1="600" y1="847" x2="636" y2="847" stroke="#2563EB" stroke-width="2.4"/>
    <text x="646" y="852">锚定链路（汇聚到锚点）</text>

    <line x1="900" y1="847" x2="936" y2="847" stroke="#94A3B8" stroke-width="1.3" opacity="0.7"/>
    <text x="946" y="852">点对点翻译（全互联）</text>

    <circle cx="1210" cy="847" r="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.2"/>
    <text x="1228" y="852">连线计数（直观呈现密集度）</text>
  </g>

  <!-- ============ 4. CAPTION ============ -->
  <text x="900" y="935" text-anchor="middle" font-size="11" fill="#94A3B8">图4-4 无物模型时 N 种协议两两互通需 N×(N−1) 次翻译；引入物模型作锚点后降为 2N（各协议↔物模型）。</text>
</svg>
