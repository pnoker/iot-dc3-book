<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图4-5 主流 IoT 无线技术选型雷达图（示意框架）</title>
  <desc id="desc">读者应理解主流 IoT 无线技术选型雷达图（示意框架）中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图4-5 主流 IoT 无线技术选型雷达图（示意框架）</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解主流 IoT 无线技术选型雷达图（示意框架）中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">MATRIX</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="matrix">
  <!-- 轴线和轴标签 -->
  <line x1="900" y1="430" x2="900" y2="150" stroke="#94A3B8" stroke-width="1.5" />
  <line x1="900" y1="430" x2="1166.3" y2="343.5" stroke="#94A3B8" stroke-width="1.5" />
  <line x1="900" y1="430" x2="1064.6" y2="656.5" stroke="#94A3B8" stroke-width="1.5" />
  <line x1="900" y1="430" x2="735.4" y2="656.5" stroke="#94A3B8" stroke-width="1.5" />
  <line x1="900" y1="430" x2="633.7" y2="343.5" stroke="#94A3B8" stroke-width="1.5" />
  
  <text x="900" y="140" text-anchor="middle" font-size="12" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">距离</text>
  <text x="1180" y="335" text-anchor="start" font-size="12" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">速率</text>
  <text x="1075" y="670" text-anchor="start" font-size="12" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">功耗</text>
  <text x="720" y="670" text-anchor="end" font-size="12" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">成本</text>
  <text x="620" y="335" text-anchor="end" font-size="12" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">部署便捷性</text>

  <!-- 多边形（先填充后描边） -->
  <!-- BLE 蓝色 -->
  <polygon points="900,374 1059.8,378.1 1064.6,656.5 768.3,611.2 633.7,343.5" fill="#2563EB" fill-opacity="0.25" stroke="#2563EB" stroke-width="2" />
  <!-- Zigbee 青色 -->
  <polygon points="900,374 1006.5,395.4 1064.6,656.5 768.3,611.2 740.2,378.1" fill="#0F766E" fill-opacity="0.25" stroke="#0F766E" stroke-width="2" />
  <!-- WiFi 橙色 -->
  <polygon points="900,262 1166.3,343.5 932.9,475.3 801.2,565.9 633.7,343.5" fill="#F97316" fill-opacity="0.25" stroke="#F97316" stroke-width="2" />
  <!-- LoRa 红色 -->
  <polygon points="900,150 953.3,412.7 1064.6,656.5 801.2,565.9 793.5,395.4" fill="#DC2626" fill-opacity="0.25" stroke="#DC2626" stroke-width="2" />
  <!-- NB-IoT 紫色 -->
  <polygon points="900,206 1006.5,395.4 1031.7,611.2 768.3,611.2 633.7,343.5" fill="#7C3AED" fill-opacity="0.25" stroke="#7C3AED" stroke-width="2" />
  <!-- 5G 灰色 -->
  <polygon points="900,206 1166.3,343.5 932.9,475.3 867.1,475.3 793.5,395.4" fill="#64748B" fill-opacity="0.25" stroke="#64748B" stroke-width="2" />
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色 = BLE</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图4-5 对六种技术基于五项工程约束的定性对比。所有描述基于工程经验归纳，非实测或标准化值。多边形面积越大不代表技术越优，只反映该技术在更多维度上处于高位。</text>
</svg>
