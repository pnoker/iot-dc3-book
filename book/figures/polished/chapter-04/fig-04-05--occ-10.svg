<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图4-5 IoT DC3整体架构及驱动层位置</title>
  <desc id="desc">读者应理解IoT DC3整体架构及驱动层位置中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图4-5 IoT DC3整体架构及驱动层位置</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解IoT DC3整体架构及驱动层位置中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
  <!-- 层背景 -->
  <rect x="300" y="260" width="1200" height="130" rx="10" fill="#ECFDF5" stroke="#19be6b" stroke-width="1.5"/>
  <rect x="300" y="430" width="1200" height="150" rx="10" fill="#FFFBEB" stroke="#e8a000" stroke-width="2.5"/>
  <rect x="300" y="620" width="1200" height="110" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  
  <!-- 顶层组件 -->
  <rect x="780" y="160" width="240" height="60" rx="10" fill="#EFF6FF" stroke="#2d8cf0" stroke-width="1.5"/>
  <text x="900" y="196" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">Vue.js Admin Console</text>
  
  <!-- 第二层标注 -->
  <text x="310" y="270" fill="#0F172A" font-size="11">固定服务名 + 容器 DNS + 环境变量</text>
  
  <!-- 第二层组件 -->
  <rect x="360" y="275" width="200" height="60" rx="8" fill="white" stroke="#19be6b" stroke-width="1.5"/>
  <text x="460" y="311" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">Gateway</text>
  <rect x="580" y="275" width="200" height="60" rx="8" fill="white" stroke="#19be6b" stroke-width="1.5"/>
  <text x="680" y="311" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">Auth</text>
  <rect x="800" y="275" width="200" height="60" rx="8" fill="white" stroke="#19be6b" stroke-width="1.5"/>
  <text x="900" y="311" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">Manager</text>
  <rect x="1020" y="275" width="200" height="60" rx="8" fill="white" stroke="#19be6b" stroke-width="1.5"/>
  <text x="1120" y="311" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">Data</text>
  <rect x="1240" y="275" width="200" height="60" rx="8" fill="white" stroke="#19be6b" stroke-width="1.5"/>
  <text x="1340" y="311" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">Agentic</text>
  
  <!-- 第三层标注 -->
  <text x="310" y="440" fill="#0F172A" font-size="11">独立JVM进程 + Driver SDK</text>
  
  <!-- 第三层驱动框 -->
  <rect x="400" y="445" width="130" height="50" rx="8" fill="white" stroke="#e8a000" stroke-width="1.5"/>
  <text x="465" y="474" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">Modbus驱动</text>
  <rect x="545" y="445" width="130" height="50" rx="8" fill="white" stroke="#e8a000" stroke-width="1.5"/>
  <text x="610" y="474" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">LoRa驱动</text>
  <rect x="690" y="445" width="130" height="50" rx="8" fill="white" stroke="#e8a000" stroke-width="1.5"/>
  <text x="755" y="474" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">NB-IoT驱动</text>
  <rect x="835" y="445" width="130" height="50" rx="8" fill="white" stroke="#e8a000" stroke-width="1.5"/>
  <text x="900" y="474" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">BLE驱动</text>
  <rect x="980" y="445" width="130" height="50" rx="8" fill="white" stroke="#e8a000" stroke-width="1.5"/>
  <text x="1045" y="474" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">Zigbee驱动</text>
  <rect x="1125" y="445" width="130" height="50" rx="8" fill="white" stroke="#e8a000" stroke-width="1.5"/>
  <text x="1190" y="474" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">PLC S7驱动</text>
  <rect x="1270" y="445" width="130" height="50" rx="8" fill="white" stroke="#e8a000" stroke-width="1.5"/>
  <text x="1335" y="474" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">MC协议驱动</text>
  
  <!-- 第四层设备 -->
  <rect x="560" y="635" width="120" height="50" rx="8" fill="white" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="664" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">PLC</text>
  <rect x="700" y="635" width="120" height="50" rx="8" fill="white" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="760" y="664" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">传感器</text>
  <rect x="840" y="635" width="120" height="50" rx="8" fill="white" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="900" y="664" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">水表</text>
  <rect x="980" y="635" width="120" height="50" rx="8" fill="white" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1040" y="664" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">工业仪表</text>
  <rect x="1120" y="635" width="120" height="50" rx="8" fill="white" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1180" y="664" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">执行器</text>
  
  <!-- 层间虚线箭头 -->
  <line x1="800" y1="390" x2="800" y2="430" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="780" y="410" fill="#0F172A" font-size="12" text-anchor="end">下发指令（MQ）</text>
  <line x1="1000" y1="430" x2="1000" y2="390" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="1020" y="410" fill="#0F172A" font-size="12" text-anchor="start">上报数据（MQ）</text>
  
  <!-- 设备到驱动实线箭头 -->
  <line x1="620" y1="635" x2="465" y2="495" stroke="#64748B" stroke-width="1.5"/>
  <text x="543" y="555" fill="#0F172A" font-size="10" text-anchor="middle">Modbus TCP</text>
  <line x1="760" y1="635" x2="610" y2="495" stroke="#64748B" stroke-width="1.5"/>
  <text x="685" y="555" fill="#0F172A" font-size="10" text-anchor="middle">LoRaWAN</text>
  <line x1="900" y1="635" x2="755" y2="495" stroke="#64748B" stroke-width="1.5"/>
  <text x="828" y="555" fill="#0F172A" font-size="10" text-anchor="middle">NB-IoT</text>
  <line x1="1040" y1="635" x2="900" y2="495" stroke="#64748B" stroke-width="1.5"/>
  <text x="970" y="555" fill="#0F172A" font-size="10" text-anchor="middle">BLE GATT</text>
  <line x1="1180" y1="635" x2="1045" y2="495" stroke="#64748B" stroke-width="1.5"/>
  <text x="1113" y="555" fill="#0F172A" font-size="10" text-anchor="middle">Zigbee</text>
  <line x1="610" y1="635" x2="1190" y2="495" stroke="#64748B" stroke-width="1.5"/>
  <text x="900" y="545" fill="#0F172A" font-size="10" text-anchor="middle">PLC S7</text>
  <line x1="750" y1="635" x2="1335" y2="495" stroke="#64748B" stroke-width="1.5"/>
  <text x="1043" y="545" fill="#0F172A" font-size="10" text-anchor="middle">MC协议</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头代表数据流（上行/下行）</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">虚线箭头代表通过消息队列进行的异步解耦通信</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">黄色背景的层代表驱动层，是整张图的焦点</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">驱动层进程彼此独立、互不依赖，通过消息队列与平台核心服务解耦，实现驱动故障时平台主体不中断。开发者新增驱动仅需在驱动层横向增加一个方框，平台其余层无需变化。</text>
</svg>
