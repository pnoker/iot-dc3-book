<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图4-4 统一接入层四层架构</title>
  <desc id="desc">读者应理解统一接入层四层架构中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图4-4 统一接入层四层架构</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解统一接入层四层架构中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LAYERED</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="layered">
  <!-- 左侧调用方向向下箭头 -->
  <line x1="460" y1="160" x2="460" y2="680" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <text x="455" y="690" fill="#64748B" font-size="13" text-anchor="end">调用方向向下</text>

  <!-- 右侧数据上报方向向上箭头（虚线） -->
  <line x1="1340" y1="680" x2="1340" y2="160" stroke="#64748B" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#bp-arrow)"/>
  <text x="1345" y="155" fill="#64748B" font-size="13" text-anchor="start">数据上报方向</text>

  <!-- 第一层：设备抽象层 -->
  <rect x="600" y="150" width="600" height="120" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="900" y="180" fill="#0F172A" font-size="18" font-weight="bold" text-anchor="middle">设备抽象层</text>
  <text x="900" y="200" fill="#475569" font-size="13" text-anchor="middle">(Property/Event/Service)</text>
  <text x="900" y="250" fill="#0F766E" font-size="14" text-anchor="middle">getDeviceShadow() / updateShadow()</text>

  <!-- 第二层：数据解析层 -->
  <rect x="600" y="290" width="600" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="900" y="320" fill="#0F172A" font-size="18" font-weight="bold" text-anchor="middle">数据解析层</text>
  <text x="900" y="340" fill="#475569" font-size="13" text-anchor="middle">字节流 ↔ JSON/Protobuf</text>
  <text x="900" y="390" fill="#7C3AED" font-size="14" text-anchor="middle">toStandardPayload() / fromStandardPayload()</text>

  <!-- 第三层：连接管理层 -->
  <rect x="600" y="430" width="600" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="900" y="460" fill="#0F172A" font-size="18" font-weight="bold" text-anchor="middle">连接管理层</text>
  <text x="900" y="480" fill="#475569" font-size="13" text-anchor="middle">会话/心跳/重连</text>
  <text x="900" y="530" fill="#D97706" font-size="14" text-anchor="middle">connect() / keepAlive() / onDisconnect()</text>

  <!-- 第四层：协议泛化层 -->
  <rect x="600" y="570" width="600" height="120" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="900" y="600" fill="#0F172A" font-size="18" font-weight="bold" text-anchor="middle">协议泛化层</text>
  <text x="900" y="620" fill="#475569" font-size="13" text-anchor="middle">具体协议驱动</text>
  <text x="900" y="670" fill="#F97316" font-size="14" text-anchor="middle">read(address, length) / write(address, value)</text>

  <!-- 层间实线分隔（虚线） -->
  <line x1="600" y1="270" x2="1200" y2="270" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="600" y1="410" x2="1200" y2="410" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="600" y1="550" x2="1200" y2="550" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- 层间调用箭头：设备抽象层 → 数据解析层 -->
  <line x1="900" y1="270" x2="900" y2="285" stroke="#0F766E" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="760" y="272" width="280" height="18" rx="4" fill="white" opacity="0.9"/>
  <text x="900" y="286" fill="#0F766E" font-size="12" text-anchor="middle">toStandardPayload() / fromStandardPayload()</text>

  <!-- 数据解析层 → 连接管理层 -->
  <line x1="900" y1="410" x2="900" y2="425" stroke="#7C3AED" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="745" y="412" width="310" height="18" rx="4" fill="white" opacity="0.9"/>
  <text x="900" y="426" fill="#7C3AED" font-size="12" text-anchor="middle">connect() / keepAlive() / onDisconnect()</text>

  <!-- 连接管理层 → 协议泛化层 -->
  <line x1="900" y1="550" x2="900" y2="565" stroke="#D97706" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="720" y="552" width="360" height="18" rx="4" fill="white" opacity="0.9"/>
  <text x="900" y="566" fill="#D97706" font-size="12" text-anchor="middle">read(address, length) / write(address, value)</text>

  <!-- 最上层向上宽箭头（上下衔接） -->
  <path d="M 900 145 L 900 130 L 885 140 M 900 130 L 915 140" fill="none" stroke="#0F766E" stroke-width="3"/>
  <text x="900" y="125" fill="#0F766E" font-size="12" text-anchor="middle">上游设备接入</text>

  <!-- 最下层向下宽箭头（上下衔接） -->
  <path d="M 900 690 L 900 705 L 885 695 M 900 705 L 915 695" fill="none" stroke="#F97316" stroke-width="3"/>
  <text x="900" y="720" fill="#F97316" font-size="12" text-anchor="middle">下游协议驱动</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">浅绿：设备抽象层</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头：同步调用依赖；虚线箭头：异步数据回调</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">最上层和最下层分别加指向外的宽箭头表示上下衔接</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图4-4 统一接入层通过四层解耦将协议差异逐层收口，上层对下层是调用依赖，下层对上层通过回调上送数据。</text>
</svg>
