<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"
  data-style="architecture-diagram-wireframe-white"
  font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1600" height="1000" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图3-2 RFID 系统组成</text>
  <text x="84" y="70" font-size="12" fill="#64748B">读写器 · 天线 · 标签 — 三大部件与射频信号 / 数据流</text>
  <rect x="1424" y="26" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1484" y="46" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.5">ARCHITECTURE</text>
  <line x1="40" y1="103" x2="1560" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Region boundary (RFID 系统) ===== -->
  <rect x="60" y="190" width="1480" height="540" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.55"/>
  <rect x="76" y="178" width="108" height="24" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <text x="130" y="194" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">RFID 系统</text>

  <!-- ===== Node 1: 标签 (green / edge) ===== -->
  <rect x="100" y="320" width="320" height="280" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="120" y="350" font-size="15" font-weight="700" fill="#0F172A">RFID 标签</text>
  <text x="120" y="370" font-size="10" fill="#64748B">Tag · 被动式 Passive</text>
  <rect x="350" y="332" width="58" height="20" rx="3" fill="#F8FAFC" stroke="#10B981" stroke-width="1.5"/>
  <text x="379" y="346" font-size="9" font-weight="600" fill="#10B981" text-anchor="middle">EDGE</text>

  <!-- tag illustration (inlay + dipole antenna + chip) -->
  <rect x="140" y="392" width="240" height="84" rx="10" fill="#F8FAFC" stroke="#10B981" stroke-width="1.5"/>
  <path d="M252 434 L240 434 L240 416 L220 416 L220 452 L200 452 L200 416 L180 416 L180 452 L160 452 L160 434 L150 434" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M268 434 L280 434 L280 416 L300 416 L300 452 L320 452 L320 416 L340 416 L340 452 L360 452 L360 434 L370 434" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="144" y="426" width="10" height="16" fill="#10B981"/>
  <rect x="366" y="426" width="10" height="16" fill="#10B981"/>
  <rect x="252" y="420" width="16" height="28" rx="2" fill="#475569"/>
  <text x="260" y="412" font-size="8" fill="#64748B" text-anchor="middle">chip</text>

  <text x="260" y="500" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">无源 · 靠读写器场区供电</text>
  <line x1="120" y1="518" x2="400" y2="518" stroke="#E2E8F0"/>
  <text x="120" y="540" font-size="9" fill="#64748B">· EPC 唯一物品编码</text>
  <text x="120" y="558" font-size="9" fill="#64748B">· 存储只读 / 可写（选型）</text>
  <text x="120" y="576" font-size="9" fill="#64748B">· 频段 LF / HF / UHF</text>

  <!-- ===== Node 2: 射频读写器 (blue / platform) ===== -->
  <rect x="620" y="220" width="360" height="480" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="640" y="252" font-size="15" font-weight="700" fill="#0F172A">射频读写器</text>
  <text x="640" y="272" font-size="10" fill="#64748B">Reader · 平台层 Platform</text>
  <rect x="894" y="232" width="66" height="20" rx="3" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
  <text x="927" y="246" font-size="9" font-weight="600" fill="#2563EB" text-anchor="middle">PLATFORM</text>

  <!-- 天线 sub-card (RF-facing toward tag) -->
  <rect x="640" y="298" width="320" height="90" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="660" y="325" font-size="12" font-weight="700" fill="#0F172A">天线 Antenna</text>
  <text x="660" y="345" font-size="9" fill="#64748B">发射 / 接收射频载波</text>
  <text x="660" y="362" font-size="9" fill="#64748B">构成场区 · 耦合标签</text>
  <path d="M884 344 q5 -9 10 0 t10 0 t10 0 t10 0" stroke="#2563EB" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- 射频前端 + 基带控制 sub-card -->
  <rect x="640" y="406" width="320" height="82" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="660" y="433" font-size="12" font-weight="700" fill="#0F172A">射频前端 + 基带控制</text>
  <text x="660" y="453" font-size="9" fill="#64748B">调制 / 解调 · 编解码 · 防碰撞</text>
  <text x="660" y="470" font-size="9" fill="#64748B">协议栈：ISO 18000 · EPC Gen2</text>

  <!-- 主机接口 sub-card (backend-facing) -->
  <rect x="640" y="506" width="320" height="82" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="660" y="533" font-size="12" font-weight="700" fill="#0F172A">主机接口 Host I/F</text>
  <text x="660" y="553" font-size="9" fill="#64748B">以太网 / 串口 / USB / Wi-Fi</text>
  <text x="660" y="570" font-size="9" fill="#64748B">上传解码数据至后台</text>

  <!-- internal signal path -->
  <line x1="800" y1="389" x2="800" y2="403" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <line x1="800" y1="489" x2="800" y2="503" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>

  <text x="800" y="618" font-size="9" fill="#64748B" text-anchor="middle">供电：有源（市电 / 电池）· 主动发射载波</text>
  <text x="800" y="636" font-size="9" fill="#64748B" text-anchor="middle">可多天线 · 支持多标签防碰撞读写</text>

  <!-- ===== Node 3: 后台系统 (purple / data) ===== -->
  <rect x="1180" y="220" width="320" height="480" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1200" y="252" font-size="15" font-weight="700" fill="#0F172A">后台系统</text>
  <text x="1200" y="272" font-size="10" fill="#64748B">Backend · 数据域</text>
  <rect x="1424" y="232" width="58" height="20" rx="3" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1453" y="246" font-size="9" font-weight="600" fill="#7C3AED" text-anchor="middle">DATA</text>

  <!-- database cylinder -->
  <rect x="1278" y="322" width="124" height="64" fill="#F8FAFC" stroke="none"/>
  <line x1="1278" y1="322" x2="1278" y2="386" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="1402" y1="322" x2="1402" y2="386" stroke="#7C3AED" stroke-width="1.5"/>
  <ellipse cx="1340" cy="322" rx="62" ry="12" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
  <path d="M1278 386 A62 12 0 0 0 1402 386" stroke="#7C3AED" stroke-width="1.5" fill="none"/>
  <text x="1340" y="358" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">EPC 数据库</text>
  <text x="1340" y="376" font-size="8" fill="#64748B" text-anchor="middle">事件 / 元数据</text>

  <!-- 解析 / 关联 sub-card -->
  <rect x="1200" y="420" width="280" height="70" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1220" y="447" font-size="12" font-weight="700" fill="#0F172A">解析 · 关联</text>
  <text x="1220" y="466" font-size="9" fill="#64748B">解析 EPC · 关联业务数据</text>
  <text x="1220" y="481" font-size="9" fill="#64748B">过滤去重 · 事件聚合</text>

  <!-- 接入 / 上报 sub-card (reader-facing entry) -->
  <rect x="1200" y="506" width="280" height="82" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1220" y="533" font-size="12" font-weight="700" fill="#0F172A">接入 · 上报</text>
  <text x="1220" y="553" font-size="9" fill="#64748B">事件接入（EPCIS）</text>
  <text x="1220" y="570" font-size="9" fill="#64748B">对接中间件 / 业务系统</text>

  <!-- internal data path (接入 → 解析 → DB) -->
  <line x1="1340" y1="504" x2="1340" y2="492" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <line x1="1340" y1="419" x2="1340" y2="398" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>

  <text x="1340" y="618" font-size="9" fill="#64748B" text-anchor="middle">存储 · 检索 · 业务系统对接</text>
  <text x="1340" y="636" font-size="9" fill="#64748B" text-anchor="middle">（数据库 / 中间件 / 应用层）</text>

  <!-- ===== Main flows ===== -->
  <!-- ① RF carrier: reader → tag (activate / power) -->
  <line x1="616" y1="325" x2="426" y2="325" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="521" y="316" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">① 射频载波（激活）</text>

  <!-- ② backscatter EPC: tag → reader -->
  <line x1="424" y1="365" x2="614" y2="365" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="521" y="385" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">② 反射调制 · 回传 EPC</text>

  <!-- ③ decoded data: reader → backend -->
  <line x1="982" y1="546" x2="1178" y2="546" stroke="#7C3AED" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="1080" y="537" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">③ 解码数据上传</text>

  <!-- ===== Callout: field powering ===== -->
  <rect x="438" y="448" width="164" height="74" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="520" y="470" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">场区供电</text>
  <text x="520" y="489" font-size="9" fill="#475569" text-anchor="middle">被动标签无需电池</text>
  <text x="520" y="506" font-size="9" fill="#475569" text-anchor="middle">能量取自读写器载波场</text>

  <!-- ===== Legend ===== -->
  <text x="40" y="778" font-size="11" font-weight="600" fill="#475569">图例 Legend</text>
  <line x1="40" y1="808" x2="72" y2="808" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="82" y="812" font-size="11" fill="#475569">射频载波（激活 / 供电）</text>
  <line x1="320" y1="808" x2="352" y2="808" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="362" y="812" font-size="11" fill="#475569">反射调制 · 回传 EPC</text>
  <line x1="600" y1="808" x2="632" y2="808" stroke="#7C3AED" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="642" y="812" font-size="11" fill="#475569">数据流（解码上传）</text>
  <rect x="890" y="802" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="914" y="812" font-size="11" fill="#475569">标签（边缘域）</text>
  <rect x="1100" y="802" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1124" y="812" font-size="11" fill="#475569">读写器（平台域）</text>
  <rect x="1330" y="802" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1354" y="812" font-size="11" fill="#475569">后台（数据域）</text>

  <line x1="40" y1="858" x2="1560" y2="858" stroke="#E2E8F0"/>

  <!-- ===== Caption ===== -->
  <text x="800" y="930" font-size="10" fill="#94A3B8" text-anchor="middle">图3-2 RFID 三大部件：读写器经天线发射射频激活标签，标签回传 EPC，读写器解码后送后台；被动标签由读写器场区供电。</text>
</svg>
