<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图3-7 EPC Gen2标签存储体分层结构</title>
  <desc id="desc">读者应理解EPC Gen2标签存储体分层结构中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图3-7 EPC Gen2标签存储体分层结构</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解EPC Gen2标签存储体分层结构中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LAYERED</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="layered">
  <rect x="220" y="145" width="1360" height="565" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="250" y="174" fill="#64748B" font-size="13" font-weight="600">EPC Gen2 标签存储器 · 四个逻辑 Bank</text>
  <line x1="355" y1="205" x2="355" y2="655" stroke="#94A3B8" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <text x="325" y="430" fill="#64748B" font-size="12" text-anchor="middle" transform="rotate(-90 325 430)">地址由低到高</text>

  <rect x="400" y="190" width="960" height="100" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="430" y="226" fill="#0F172A" font-size="18" font-weight="700">User · Bank 3</text>
  <text x="430" y="258" fill="#64748B" font-size="13">用户自定义数据 · 长度可选</text>
  <rect x="1388" y="217" width="132" height="34" rx="17" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1454" y="239" fill="#7C3AED" font-size="12" text-anchor="middle">应用扩展区</text>

  <rect x="400" y="305" width="960" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="430" y="341" fill="#0F172A" font-size="18" font-weight="700">TID · Bank 2</text>
  <text x="430" y="373" fill="#64748B" font-size="13">芯片厂商代码 + 型号 + 唯一序列号（64–96 bits）</text>
  <rect x="1388" y="332" width="132" height="34" rx="17" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1454" y="354" fill="#2563EB" font-size="12" text-anchor="middle">出厂只读身份</text>

  <rect x="400" y="420" width="960" height="100" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="430" y="456" fill="#0F172A" font-size="18" font-weight="700">EPC · Bank 1</text>
  <text x="430" y="488" fill="#64748B" font-size="13">PC bits + EPC 序列号（96 bits）+ CRC-16</text>
  <rect x="1388" y="447" width="132" height="34" rx="17" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1454" y="469" fill="#0F766E" font-size="12" text-anchor="middle">物品唯一标识</text>

  <rect x="400" y="535" width="960" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="430" y="571" fill="#0F172A" font-size="18" font-weight="700">Reserved · Bank 0</text>
  <text x="430" y="603" fill="#64748B" font-size="13">Kill Password（32 bits）+ Access Password（32 bits）</text>
  <rect x="1388" y="562" width="132" height="34" rx="17" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1454" y="584" fill="#DC2626" font-size="12" text-anchor="middle">安全控制基础</text>

  <path d="M365 585 L390 585" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="248" y="688" fill="#64748B" font-size="12">Reserved 位于最低地址，向上依次承载物品标识、芯片身份与应用扩展数据。</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">Reserved：红色系，表示安全</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">EPC：蓝色，表示标识</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">TID：绿色，表示身份</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图3-7 EPC Gen2标签存储体分层结构示意</text>
</svg>
