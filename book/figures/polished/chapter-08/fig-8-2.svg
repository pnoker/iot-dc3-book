<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图8-2 物联网纵深防御多层模型</title>
  <desc id="desc">读者应理解物联网纵深防御多层模型中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图8-2 物联网纵深防御多层模型</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解物联网纵深防御多层模型中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LAYERED</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="layered">
  <!-- 攻击路径（左侧蓝色箭头） -->
  <line x1="480" y1="720" x2="480" y2="140" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="460" y="430" transform="rotate(-90,460,430)" fill="#2563EB" font-size="12" font-weight="600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">攻击路径</text>

  <!-- 防御阻断（右侧灰色箭头） -->
  <line x1="1360" y1="140" x2="1360" y2="720" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <text x="1375" y="430" transform="rotate(90,1375,430)" fill="#64748B" font-size="12" font-weight="600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">防御阻断</text>

  <!-- 补偿控制（灰色虚线） -->
  <line x1="1280" y1="600" x2="1280" y2="515" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>
  <text x="1290" y="560" fill="#94A3B8" font-size="11" font-family="'PingFang SC','Microsoft YaHei',sans-serif">补偿控制</text>

  <!-- 区域边界：平台服务域 -->
  <rect x="440" y="110" width="840" height="630" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="460" y="135" fill="#64748B" font-size="13" font-weight="600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">平台服务域</text>

  <!-- 防御层卡片（自底向上） -->
  <!-- Layer 1: 物理安全 -->
  <rect x="520" y="650" width="760" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="676" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">物理安全</text>
  <text x="900" y="700" fill="#64748B" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">SE/TEE、防拆开关、JTAG锁定</text>

  <!-- Layer 2: 设备固件安全 -->
  <rect x="520" y="565" width="760" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="591" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">设备固件安全</text>
  <text x="900" y="615" fill="#64748B" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Secure Boot、OTA签名验证</text>

  <!-- Layer 3: 通信安全 -->
  <rect x="520" y="480" width="760" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="506" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">通信安全</text>
  <text x="900" y="530" fill="#64748B" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">TLS/DTLS、双向认证、防重放</text>

  <!-- Layer 4: 身份与访问控制 -->
  <rect x="520" y="395" width="760" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="421" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">身份与访问控制</text>
  <text x="900" y="445" fill="#64748B" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">JWT令牌、OAuth 2.0、RBAC</text>

  <!-- Layer 5: 平台安全 -->
  <rect x="520" y="310" width="760" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="336" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">平台安全</text>
  <text x="900" y="360" fill="#64748B" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">租户隔离、速率限制、审计日志</text>

  <!-- Layer 6: 数据安全 -->
  <rect x="520" y="225" width="760" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="251" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">数据安全</text>
  <text x="900" y="275" fill="#64748B" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">存储加密、字段级脱敏</text>

  <!-- Layer 7: 应用与AI安全 -->
  <rect x="520" y="140" width="760" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="166" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">应用与AI安全</text>
  <text x="900" y="190" fill="#64748B" font-size="12" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif">模型注入、Prompt威胁分类</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色矩形条：防御层，从上到下颜色由浅变深</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">红色箭头：攻击者逐层突破路径</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">绿色箭头：防御方反向阻断信号</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图8-2 展示了物联网系统中纵深防御的层次结构、攻击面与防御阻断方向，以及补偿控制的跨层连接。</text>
</svg>
