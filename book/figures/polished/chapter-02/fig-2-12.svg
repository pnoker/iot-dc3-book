<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">Agentic 中心决策执行流程</title>
  <desc id="desc">读者应理解Agentic 中心决策执行流程中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">Agentic 中心决策执行流程</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解Agentic 中心决策执行流程中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">SEQUENCE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="sequence">
  <!-- 生命线 -->
  <line x1="540" y1="210" x2="540" y2="720" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="620" y1="210" x2="620" y2="720" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="700" y1="210" x2="700" y2="720" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="780" y1="210" x2="780" y2="720" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="860" y1="210" x2="860" y2="720" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="940" y1="210" x2="940" y2="720" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1020" y1="210" x2="1020" y2="720" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- 消息线 -->
  <!-- 1. 用户→Agentic 意图解析 -->
  <line x1="540" y1="240" x2="620" y2="240" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="555" y="230" width="70" height="16" fill="white" rx="3"/>
  <text x="590" y="242" fill="#0F172A" font-size="11" text-anchor="middle">意图解析</text>
  
  <!-- 2. Agentic→Manager 获取元数据 -->
  <line x1="620" y1="290" x2="700" y2="290" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="635" y="280" width="70" height="16" fill="white" rx="3"/>
  <text x="670" y="292" fill="#0F172A" font-size="11" text-anchor="middle">获取元数据</text>
  
  <!-- 3. Manager→Agentic 返回元数据 -->
  <line x1="700" y1="340" x2="620" y2="340" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="635" y="330" width="70" height="16" fill="white" rx="3"/>
  <text x="670" y="342" fill="#0F172A" font-size="11" text-anchor="middle">返回元数据</text>
  
  <!-- 4. Agentic→Data 获取位号值 -->
  <line x1="620" y1="390" x2="780" y2="390" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="675" y="380" width="70" height="16" fill="white" rx="3"/>
  <text x="710" y="392" fill="#0F172A" font-size="11" text-anchor="middle">获取位号值</text>
  
  <!-- 5. Data→Agentic 返回位号值 -->
  <line x1="780" y1="440" x2="620" y2="440" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="675" y="430" width="70" height="16" fill="white" rx="3"/>
  <text x="710" y="442" fill="#0F172A" font-size="11" text-anchor="middle">返回位号值</text>
  
  <!-- 6. Agentic 自调用 LLM 推理 -->
  <path d="M 620 490 L 650 490 Q 660 490 660 500 Q 660 510 650 510 L 620 510" fill="none" stroke="#F97316" stroke-width="1.5" marker-end="url(#bp-arrow)"/>
  <rect x="655" y="495" width="55" height="16" fill="white" rx="3"/>
  <text x="682" y="507" fill="#0F172A" font-size="11" text-anchor="middle">LLM推理</text>
  
  <!-- 7. Agentic→Gateway 写指令 -->
  <line x1="620" y1="540" x2="860" y2="540" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="715" y="530" width="60" height="16" fill="white" rx="3"/>
  <text x="745" y="542" fill="#0F172A" font-size="11" text-anchor="middle">写指令</text>
  
  <!-- 8. Gateway→驱动 转发指令 -->
  <line x1="860" y1="590" x2="940" y2="590" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="875" y="580" width="60" height="16" fill="white" rx="3"/>
  <text x="905" y="592" fill="#0F172A" font-size="11" text-anchor="middle">转发指令</text>
  
  <!-- 9. 驱动→Gateway 回执 -->
  <line x1="940" y1="640" x2="860" y2="640" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="875" y="630" width="50" height="16" fill="white" rx="3"/>
  <text x="900" y="642" fill="#0F172A" font-size="11" text-anchor="middle">回执</text>
  
  <!-- 10. Gateway→Agentic 返回回执 -->
  <line x1="860" y1="690" x2="620" y2="690" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="715" y="680" width="70" height="16" fill="white" rx="3"/>
  <text x="750" y="692" fill="#0F172A" font-size="11" text-anchor="middle">返回回执</text>
  
  <!-- 参与者矩形 -->
  <!-- 用户/调度器 (蓝) -->
  <rect x="500" y="140" width="80" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="540" y="170" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">用户/调度器</text>
  <text x="540" y="188" fill="#64748B" font-size="11" text-anchor="middle">trigger</text>
  
  <!-- Agentic 中心 (橙) -->
  <rect x="580" y="140" width="80" height="70" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="620" y="170" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Agentic 中心</text>
  <text x="620" y="188" fill="#64748B" font-size="11" text-anchor="middle">orchestrator</text>
  
  <!-- Manager 中心 (琥珀) -->
  <rect x="660" y="140" width="80" height="70" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="700" y="170" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Manager 中心</text>
  <text x="700" y="188" fill="#64748B" font-size="11" text-anchor="middle">metadata</text>
  
  <!-- Data 中心 (紫) -->
  <rect x="740" y="140" width="80" height="70" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="780" y="170" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Data 中心</text>
  <text x="780" y="188" fill="#64748B" font-size="11" text-anchor="middle">data</text>
  
  <!-- Gateway (灰) -->
  <rect x="820" y="140" width="80" height="70" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="860" y="170" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">Gateway</text>
  <text x="860" y="188" fill="#64748B" font-size="11" text-anchor="middle">gateway</text>
  
  <!-- 设备驱动 (青绿) -->
  <rect x="900" y="140" width="80" height="70" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="940" y="170" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">设备驱动</text>
  <text x="940" y="188" fill="#64748B" font-size="11" text-anchor="middle">driver</text>
  
  <!-- 现场设备 (红) -->
  <rect x="980" y="140" width="80" height="70" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1020" y="170" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">现场设备</text>
  <text x="1020" y="188" fill="#64748B" font-size="11" text-anchor="middle">device</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">solid=请求/命令</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">dashed=响应/数据返回</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">self=内部处理</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图2-12 Agentic 中心决策执行流程</text>
</svg>
