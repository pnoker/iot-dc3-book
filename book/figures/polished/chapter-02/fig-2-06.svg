<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img" aria-label="图2-6 五大中心协同流程时序" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
<defs>
<marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
<marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
</defs>
<rect x="0" y="0" width="1800" height="820" fill="#FFFFFF"/>
<circle cx="64" cy="40" r="6" fill="#2563EB"/>
<text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图2-6 五大中心协同流程时序（智能灌溉场景）</text>
<text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">注册→配置→上报→推理→控制，闭环每步携带标准 PointValue</text>
<rect x="1620" y="28" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="1680" y="45" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">SEQUENCE</text>
<line x1="58" y1="103" x2="1742" y2="103" stroke="#E2E8F0" stroke-width="1"/>

<!-- 参与者（顶部）+ 生命线 -->
<!-- 设备/Gateway 暖色, 平台层冷色 -->
<g font-size="12" font-weight="700" text-anchor="middle">
<rect x="90" y="130" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/><text x="165" y="158" fill="#0F172A">现场设备</text>
<rect x="330" y="130" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/><text x="405" y="158" fill="#0F172A">Gateway</text>
<rect x="570" y="130" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/><text x="645" y="158" fill="#0F172A">Auth</text>
<rect x="810" y="130" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="885" y="158" fill="#0F172A">Manager</text>
<rect x="1050" y="130" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="1125" y="158" fill="#0F172A">Data</text>
<rect x="1290" y="130" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/><text x="1365" y="158" fill="#0F172A">Agentic</text>
<rect x="1530" y="130" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/><text x="1605" y="158" fill="#0F172A">驱动</text>
</g>
<g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4">
<line x1="165" y1="176" x2="165" y2="700"/><line x1="405" y1="176" x2="405" y2="700"/><line x1="645" y1="176" x2="645" y2="700"/><line x1="885" y1="176" x2="885" y2="700"/><line x1="1125" y1="176" x2="1125" y2="700"/><line x1="1365" y1="176" x2="1365" y2="700"/><line x1="1605" y1="176" x2="1605" y2="700"/>
</g>

<!-- 阶段标签(左) -->
<g font-size="10" fill="#94A3B8" font-weight="600">
<text x="70" y="235" text-anchor="end" transform="rotate(-90 70 235)">注册配置</text>
</g>

<!-- 交互 -->
<g font-size="10" fill="#334155">
<!-- 1 注册 -->
<line x1="405" y1="220" x2="883" y2="220" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<text x="644" y="212" text-anchor="middle" fill="#7C3AED">① 运维在 Manager 注册设备与规则</text>
<!-- 2 认证 -->
<line x1="165" y1="270" x2="643" y2="270" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<text x="404" y="262" text-anchor="middle" fill="#B45309">② 设备用 AccessKey 换 JWT</text>
<line x1="643" y1="300" x2="167" y2="300" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
<text x="404" y="292" text-anchor="middle" fill="#64748B">JWT 返回</text>
<!-- 3 上报 -->
<line x1="165" y1="360" x2="403" y2="360" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<text x="284" y="352" text-anchor="middle" fill="#B45309">③ 上报湿度</text>
<line x1="405" y1="390" x2="1123" y2="390" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<text x="764" y="382" text-anchor="middle" fill="#2563EB">④ 验票+注入租户上下文，转发 PointValue</text>
<!-- 4 存储触发 -->
<line x1="1125" y1="440" x2="883" y2="440" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
<text x="1004" y="432" text-anchor="middle" fill="#64748B">⑤ 命中 Manager 规则</text>
<!-- 5 推理 -->
<line x1="1125" y1="490" x2="1363" y2="490" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<text x="1244" y="482" text-anchor="middle" fill="#2563EB">⑥ 复杂情形转 Agentic 推理</text>
<line x1="1365" y1="520" x2="1127" y2="520" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
<text x="1246" y="512" text-anchor="middle" fill="#64748B">决策(开阀15min)</text>
<!-- 6 下发 -->
<line x1="1125" y1="580" x2="1603" y2="580" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<text x="1364" y="572" text-anchor="middle" fill="#2563EB">⑦ 经 Gateway 下发指令到驱动</text>
<line x1="1603" y1="610" x2="167" y2="610" stroke="#10B981" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
<text x="885" y="602" text-anchor="middle" fill="#10B981">⑧ 驱动执行开阀，回写新 PointValue（闭环）</text>
</g>

<!-- 图例 -->
<line x1="58" y1="700" x2="1742" y2="700" stroke="#E2E8F0" stroke-width="1"/>
<line x1="80" y1="728" x2="116" y2="728" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ah-blue)"/>
<text x="124" y="732" fill="#64748B" font-size="11" font-weight="600">同步调用</text>
<line x1="240" y1="728" x2="276" y2="728" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
<text x="284" y="732" fill="#64748B" font-size="11" font-weight="600">异步返回/内部处理</text>
<text x="520" y="732" fill="#64748B" font-size="11" font-weight="600">暖色=通信类(设备/Gateway/驱动) · 冷色=平台层(Auth/Manager/Data/Agentic)</text>

<text x="900" y="785" fill="#94A3B8" font-size="10" text-anchor="middle">图2-6 智能灌溉闭环：注册→认证→上报→存储触发→推理→下发回执，PointValue 贯穿五大中心，每步职责清晰、同步异步分明。</text>
</svg>
