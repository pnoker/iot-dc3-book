<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc" data-style="architecture-diagram-wireframe-white" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="title">图1-5 物联网平台市场格局示意</title>
  <desc id="desc">读者应理解平台市场并非一家独大，差异化定位决定了不同场景下的选型优先级。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图1-5 物联网平台市场格局示意</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解平台市场并非一家独大，差异化定位决定了不同场景下的选型优先级。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">FLOWCHART</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="flowchart">
  <!-- X-axis -->
  <line x1="200" y1="700" x2="1400" y2="700" stroke="#64748b" stroke-width="2" />
  <polygon points="1390,695 1400,700 1390,705" fill="#64748b" />
  <!-- Y-axis -->
  <line x1="200" y1="700" x2="200" y2="200" stroke="#64748b" stroke-width="2" />
  <polygon points="195,210 200,200 205,210" fill="#64748b" />

  <!-- X-axis ticks and labels -->
  <line x1="350" y1="695" x2="350" y2="705" stroke="#64748b" stroke-width="2" />
  <text x="350" y="720" fill="#0F172A" font-size="14" text-anchor="middle">有限</text>
  <line x1="700" y1="695" x2="700" y2="705" stroke="#64748b" stroke-width="2" />
  <text x="700" y="720" fill="#0F172A" font-size="14" text-anchor="middle">中等</text>
  <line x1="1050" y1="695" x2="1050" y2="705" stroke="#64748b" stroke-width="2" />
  <text x="1050" y="720" fill="#0F172A" font-size="14" text-anchor="middle">完整</text>

  <!-- Y-axis ticks and labels -->
  <line x1="195" y1="620" x2="205" y2="620" stroke="#64748b" stroke-width="2" />
  <text x="185" y="625" fill="#0F172A" font-size="14" text-anchor="end">弱</text>
  <line x1="195" y1="470" x2="205" y2="470" stroke="#64748b" stroke-width="2" />
  <text x="185" y="475" fill="#0F172A" font-size="14" text-anchor="end">中等</text>
  <line x1="195" y1="320" x2="205" y2="320" stroke="#64748b" stroke-width="2" />
  <text x="185" y="325" fill="#0F172A" font-size="14" text-anchor="end">强</text>

  <!-- Axis labels -->
  <text x="800" y="750" fill="#0F172A" font-size="16" font-weight="bold" text-anchor="middle">生态完整性</text>
  <text x="130" y="450" fill="#0F172A" font-size="16" font-weight="bold" text-anchor="middle" transform="rotate(-90,130,450)">运营商支持力度</text>

  <!-- Quadrant dividing lines (dashed) -->
  <line x1="650" y1="700" x2="650" y2="300" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8,4" />
  <line x1="200" y1="450" x2="1250" y2="450" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8,4" />

  <!-- Region labels -->
  <text x="1200" y="320" fill="#2563EB" font-size="16" font-weight="bold" text-anchor="middle">主导区</text>
  <text x="300" y="660" fill="#D97706" font-size="16" font-weight="bold" text-anchor="middle">细分区</text>

  <!-- Bubble: Platform A (生态高, 支持中等) -->
  <circle cx="1050" cy="470" r="45" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" opacity="0.9" />
  <text x="1050" y="460" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">平台A</text>
  <text x="1050" y="480" fill="#475569" font-size="11" text-anchor="middle">云原生厂商</text>

  <!-- Bubble: Platform B (生态中, 支持强) -->
  <circle cx="700" cy="320" r="50" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" opacity="0.9" />
  <text x="700" y="310" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">平台B</text>
  <text x="700" y="330" fill="#475569" font-size="11" text-anchor="middle">运营商平台</text>

  <!-- Bubble: Platform C (生态中, 支持中等) -->
  <circle cx="700" cy="470" r="35" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" opacity="0.9" />
  <text x="700" y="465" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">平台C</text>
  <text x="700" y="482" fill="#475569" font-size="11" text-anchor="middle">开源或行业平台</text>

  <!-- Bubble: Platform D (生态低, 支持弱) -->
  <circle cx="350" cy="620" r="25" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" opacity="0.9" />
  <text x="350" y="618" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">平台D</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色=云原生平台；青绿色=运营商平台；灰色=开源或垂直方案</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">气泡大小示意市场影响力（非真实数据）</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图1-5 示意展示2020年前后物联网平台市场在生态完整性与运营商支持力度两个维度的差异化定位。气泡位置与大小仅为教学示意，不代表真实市场份额。</text>
</svg>
