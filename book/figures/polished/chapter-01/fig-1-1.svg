<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" width="1800" height="900" data-style="architecture-diagram-wireframe-white" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="900" fill="#FFFFFF"/>

  <!-- ============ TITLE AREA ============ -->
  <g id="title">
    <circle cx="64" cy="42" r="6" fill="#2563EB"/>
    <text x="84" y="49" font-size="22" font-weight="700" fill="#0F172A">图1-1 三次浪潮演进时间线</text>
    <text x="84" y="73" font-size="12" fill="#64748B">连接主体 · 连接规模 · 核心驱动力的三阶段跃迁</text>

    <!-- type label -->
    <rect x="1678" y="28" width="94" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1725" y="47" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">TIMELINE</text>

    <!-- divider -->
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- ============ PHASE CARDS ============ -->
  <!-- ===== CARD 1 · PC 互联网 (blue) ===== -->
  <g id="card-1">
    <rect x="70" y="128" width="540" height="520" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <!-- header -->
    <circle cx="118" cy="178" r="24" fill="#2563EB"/>
    <text x="118" y="186" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="158" y="171" font-size="21" font-weight="700" fill="#2563EB">PC 互联网</text>
    <text x="158" y="195" font-size="13" fill="#64748B">1995 — 2010</text>
    <line x1="98" y1="218" x2="582" y2="218" stroke="#E2E8F0" stroke-width="1"/>

    <!-- B1 连接主体 -->
    <text x="98" y="244" font-size="11" fill="#64748B" letter-spacing="0.5">连接主体 · SUBJECT</text>
    <text x="98" y="282" font-size="22" font-weight="700" fill="#0F172A">信息</text>

    <!-- B2 连接规模 -->
    <text x="98" y="316" font-size="11" fill="#64748B" letter-spacing="0.5">连接规模 · SCALE</text>
    <text x="98" y="352" font-size="26" font-weight="700" fill="#2563EB">≈ 10 亿</text>
    <rect x="98" y="368" width="440" height="12" rx="6" fill="#F8FAFC"/>
    <rect x="98" y="368" width="15" height="12" rx="6" fill="#2563EB"/>

    <!-- B3 核心驱动力 -->
    <text x="98" y="412" font-size="11" fill="#64748B" letter-spacing="0.5">核心驱动力 · DRIVER</text>
    <text x="98" y="444" font-size="17" fill="#0F172A">信息数字化</text>

    <!-- B4 代表形态 -->
    <text x="98" y="478" font-size="11" fill="#64748B" letter-spacing="0.5">代表形态 · EXAMPLES</text>
    <g font-size="12" fill="#2563EB">
      <rect x="98" y="500" width="64" height="26" rx="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <text x="130" y="517" text-anchor="middle">浏览器</text>
      <rect x="172" y="500" width="76" height="26" rx="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <text x="210" y="517" text-anchor="middle">门户网站</text>
      <rect x="258" y="500" width="76" height="26" rx="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <text x="296" y="517" text-anchor="middle">搜索引擎</text>
    </g>

    <!-- footer -->
    <line x1="98" y1="548" x2="582" y2="548" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="102" cy="582" r="4" fill="#2563EB"/>
    <text x="114" y="586" font-size="12" fill="#475569">关键起点 · 1995 互联网商用化</text>
    <circle cx="102" cy="612" r="4" fill="#2563EB"/>
    <text x="114" y="616" font-size="12" fill="#475569">把现实世界的信息搬上网</text>
  </g>

  <!-- ===== CARD 2 · 移动互联网 (orange) ===== -->
  <g id="card-2">
    <rect x="630" y="128" width="540" height="520" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="678" cy="178" r="24" fill="#F59E0B"/>
    <text x="678" y="186" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="718" y="171" font-size="21" font-weight="700" fill="#F59E0B">移动互联网</text>
    <text x="718" y="195" font-size="13" fill="#64748B">2007 — 2020</text>
    <line x1="658" y1="218" x2="1142" y2="218" stroke="#E2E8F0" stroke-width="1"/>

    <text x="658" y="244" font-size="11" fill="#64748B" letter-spacing="0.5">连接主体 · SUBJECT</text>
    <text x="658" y="282" font-size="22" font-weight="700" fill="#0F172A">人</text>

    <text x="658" y="316" font-size="11" fill="#64748B" letter-spacing="0.5">连接规模 · SCALE</text>
    <text x="658" y="352" font-size="26" font-weight="700" fill="#F59E0B">≈ 58 亿</text>
    <rect x="658" y="368" width="440" height="12" rx="6" fill="#F8FAFC"/>
    <rect x="658" y="368" width="88" height="12" rx="6" fill="#F59E0B"/>

    <text x="658" y="412" font-size="11" fill="#64748B" letter-spacing="0.5">核心驱动力 · DRIVER</text>
    <text x="658" y="444" font-size="17" fill="#0F172A">人的移动性</text>

    <text x="658" y="478" font-size="11" fill="#64748B" letter-spacing="0.5">代表形态 · EXAMPLES</text>
    <g font-size="12" fill="#F59E0B">
      <rect x="658" y="500" width="76" height="26" rx="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="696" y="517" text-anchor="middle">智能手机</text>
      <rect x="744" y="500" width="76" height="26" rx="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="782" y="517" text-anchor="middle">应用商店</text>
      <rect x="830" y="500" width="76" height="26" rx="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="868" y="517" text-anchor="middle">移动支付</text>
      <rect x="916" y="500" width="76" height="26" rx="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="954" y="517" text-anchor="middle">社交网络</text>
    </g>

    <line x1="658" y1="548" x2="1142" y2="548" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="662" cy="582" r="4" fill="#F59E0B"/>
    <text x="674" y="586" font-size="12" fill="#475569">关键起点 · 2007 iPhone 问世</text>
    <circle cx="662" cy="612" r="4" fill="#F59E0B"/>
    <text x="674" y="616" font-size="12" fill="#475569">让人随时随地在线连接</text>
  </g>

  <!-- ===== CARD 3 · 万物互联 (green) ===== -->
  <g id="card-3">
    <rect x="1190" y="128" width="540" height="520" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <circle cx="1238" cy="178" r="24" fill="#10B981"/>
    <text x="1238" y="186" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="1278" y="171" font-size="21" font-weight="700" fill="#10B981">万物互联</text>
    <text x="1278" y="195" font-size="13" fill="#64748B">2015 — 2030 +</text>
    <line x1="1218" y1="218" x2="1702" y2="218" stroke="#E2E8F0" stroke-width="1"/>

    <text x="1218" y="244" font-size="11" fill="#64748B" letter-spacing="0.5">连接主体 · SUBJECT</text>
    <text x="1218" y="282" font-size="22" font-weight="700" fill="#0F172A">物</text>

    <text x="1218" y="316" font-size="11" fill="#64748B" letter-spacing="0.5">连接规模 · SCALE</text>
    <text x="1218" y="352" font-size="26" font-weight="700" fill="#10B981">≈ 290 亿 +</text>
    <rect x="1218" y="368" width="440" height="12" rx="6" fill="#F8FAFC"/>
    <rect x="1218" y="368" width="440" height="12" rx="6" fill="#10B981"/>

    <text x="1218" y="412" font-size="11" fill="#64748B" letter-spacing="0.5">核心驱动力 · DRIVER</text>
    <text x="1218" y="444" font-size="17" fill="#0F172A">物的数字化与智能化</text>

    <text x="1218" y="478" font-size="11" fill="#64748B" letter-spacing="0.5">代表形态 · EXAMPLES</text>
    <g font-size="12" fill="#10B981">
      <rect x="1218" y="500" width="75" height="26" rx="13" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
      <text x="1255" y="517" text-anchor="middle">IoT 终端</text>
      <rect x="1303" y="500" width="76" height="26" rx="13" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
      <text x="1341" y="517" text-anchor="middle">边缘智能</text>
      <rect x="1389" y="500" width="52" height="26" rx="13" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
      <text x="1415" y="517" text-anchor="middle">AIoT</text>
      <rect x="1451" y="500" width="76" height="26" rx="13" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
      <text x="1489" y="517" text-anchor="middle">数字孪生</text>
    </g>

    <line x1="1218" y1="548" x2="1702" y2="548" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="1222" cy="582" r="4" fill="#10B981"/>
    <text x="1234" y="586" font-size="12" fill="#475569">关键起点 · 2015 IoT 规模部署</text>
    <circle cx="1222" cy="612" r="4" fill="#10B981"/>
    <text x="1234" y="616" font-size="12" fill="#475569">让物自主感知与协同</text>
  </g>

  <!-- ============ EVOLUTION TIMELINE (legend + spine) ============ -->
  <g id="evolution">
    <!-- legend row -->
    <text x="750" y="702" font-size="11" fill="#94A3B8" letter-spacing="0.5">图例</text>
    <rect x="792" y="692" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="816" y="702" font-size="12" fill="#475569">PC 互联网</text>
    <rect x="900" y="692" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="924" y="702" font-size="12" fill="#475569">移动互联网</text>
    <rect x="1008" y="692" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="1032" y="702" font-size="12" fill="#475569">万物互联</text>

    <!-- row labels -->
    <text x="70" y="724" font-size="11" fill="#94A3B8">连接主体 →</text>
    <text x="70" y="830" font-size="10" fill="#94A3B8">圆点大小 ∝ 连接规模</text>

    <!-- subjects above nodes -->
    <text x="320" y="724" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">信息</text>
    <text x="880" y="724" font-size="16" font-weight="700" fill="#F59E0B" text-anchor="middle">人</text>
    <text x="1500" y="724" font-size="16" font-weight="700" fill="#10B981" text-anchor="middle">物</text>

    <!-- timeline spine (gray, through growing nodes) -->
    <line x1="120" y1="778" x2="304" y2="778" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="336" y1="778" x2="858" y2="778" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="902" y1="778" x2="1470" y2="778" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="1530" y1="778" x2="1740" y2="778" stroke="#CBD5E1" stroke-width="2" marker-end="url(#ah-gray)"/>

    <!-- year tails -->
    <text x="110" y="782" font-size="11" fill="#94A3B8" text-anchor="end">1995</text>
    <text x="1752" y="782" font-size="11" fill="#94A3B8" text-anchor="start">2030 +</text>

    <!-- growing nodes (size encodes scale) -->
    <circle cx="320" cy="778" r="16" fill="#2563EB"/>
    <text x="320" y="784" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <circle cx="880" cy="778" r="22" fill="#F59E0B"/>
    <text x="880" y="785" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <circle cx="1500" cy="778" r="30" fill="#10B981"/>
    <text x="1500" y="787" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

    <!-- scales below nodes -->
    <text x="320" y="830" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">≈ 10 亿</text>
    <text x="880" y="830" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">≈ 58 亿</text>
    <text x="1500" y="830" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">≈ 290 亿 +</text>
  </g>

  <!-- ============ CAPTION ============ -->
  <text x="900" y="864" font-size="10" fill="#94A3B8" text-anchor="middle">图1-1 三次浪潮：连接主体从信息→人→物，规模从 10 亿级迈向数百亿级，驱动力从信息数字化、人的移动性转向物的数字化与智能化。</text>
</svg>
