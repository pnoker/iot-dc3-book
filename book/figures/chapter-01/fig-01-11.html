<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图1-11 四层物联网参考架构示意图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图1-11 四层物联网参考架构示意图</title>
  <desc id="desc">四层物联网参考架构与层间数据/指令流</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图1-11 四层物联网参考架构示意图</text>
    <text x="88" y="64" font-size="12" fill="#64748B">感知—网络—平台—应用四层堆叠，安全贯穿，数据上行 / 指令下行</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>
<defs>
<marker id="ab" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#2563EB"/></marker>
<marker id="ao" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#F97316"/></marker>
<marker id="at" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#0F766E"/></marker>
<marker id="ar" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#DC2626"/></marker>
<marker id="ap" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#7C3AED"/></marker>
<marker id="ag" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#475569"/></marker>
</defs>
<!-- 安全条带 -->
<rect x="40" y="150" width="120" height="590" rx="10" fill="#FEFCE8" stroke="#D97706" stroke-width="2"/>
<text transform="rotate(-90 100 445)" x="100" y="445" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle">安全贯穿线</text>
<!-- 上行数据流（蓝实线） -->
<line x1="1660" y1="740" x2="1660" y2="176" stroke="#2563EB" stroke-width="2.8" marker-end="url(#ab)"/>
<text transform="rotate(-90 1688 445)" x="1688" y="445" font-size="16" fill="#2563EB" text-anchor="middle" font-weight="700">上行数据流</text>
<!-- 下行指令流（橙虚线） -->
<line x1="1720" y1="176" x2="1720" y2="740" stroke="#F97316" stroke-width="2.4" stroke-dasharray="8,6" marker-end="url(#ao)"/>
<text transform="rotate(90 1746 445)" x="1746" y="445" font-size="16" fill="#C2410C" text-anchor="middle" font-weight="700">下行指令流</text>
<!-- 应用层 -->
<rect x="180" y="150" width="1430" height="110" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="215" y="198" font-size="23" font-weight="700" fill="#6D28D9">应用层</text>
<text x="215" y="238" font-size="18" fill="#334155">仪表盘 · 移动 App · 业务后端</text>
<!-- 平台层 -->
<rect x="180" y="310" width="1430" height="110" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
<text x="215" y="358" font-size="23" font-weight="700" fill="#C2410C">平台层</text>
<text x="215" y="398" font-size="18" fill="#334155">设备管理 · 数据存储与流处理 · API 网关</text>
<!-- 网络层 -->
<rect x="180" y="470" width="1430" height="110" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
<text x="215" y="518" font-size="23" font-weight="700" fill="#0F766E">网络层</text>
<text x="215" y="558" font-size="18" fill="#334155">MQTT · CoAP · LoRaWAN · NB-IoT</text>
<!-- 感知层 -->
<rect x="180" y="630" width="1430" height="110" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="215" y="678" font-size="23" font-weight="700" fill="#1D4ED8">感知层</text>
<text x="215" y="718" font-size="18" fill="#334155">传感器 · 执行器</text>
<!-- 层间小箭头 -->
<line x1="300" y1="630" x2="300" y2="586" stroke="#2563EB" stroke-width="2" marker-end="url(#ab)"/>
<line x1="340" y1="470" x2="340" y2="426" stroke="#2563EB" stroke-width="2" marker-end="url(#ab)"/>
<line x1="380" y1="310" x2="380" y2="266" stroke="#2563EB" stroke-width="2" marker-end="url(#ab)"/>
<text x="900" y="960" font-size="18" fill="#475569" text-anchor="middle">图1-11 四层物联网参考架构。数据从感知层上行至应用层，指令反向下行至执行器，安全作为跨越所有层的约束条件贯穿始终。</text>
  </svg>
</svg>
  </main>
</body>
</html>
