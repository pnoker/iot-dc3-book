type: timeline
title: 图1-5 三次浪潮演进时间线示意
audience_takeaway: 读者应理解三次浪潮的核心驱动力依次从信息数字化、人的移动性转向物的数字化,连接规模从约10亿、20亿跃升一个数量级至百亿级。
purpose: 直观展示PC互联网、移动互联网、万物互联三个阶段的时间范围、连接主体、连接规模与核心驱动力
visual_focus: 从从移动互联网到万物互联：实线箭头，标注'技术演进'的主链路。
design_level: implementation
layout: 横向时间轴，从左到右排列三个阶段
elements:
- PC互联网：1990s，蓝色矩形，标注'信息数字化'，连接约10亿人
- 移动互联网：2000s-2010s，橙色矩形，标注'人的移动性'，连接约20亿人
- 万物互联：2010s至今，绿色矩形，标注'物的数字化'，连接数量有望增加10倍
relationships:
- 从PC互联网到移动互联网：实线箭头，标注'技术演进'
- 从移动互联网到万物互联：实线箭头，标注'技术演进'
