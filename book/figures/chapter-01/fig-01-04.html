<text x="60" y="168" font-size="22" font-weight="700" fill="#DC2626">工业软件 · 三条裂缝</text>
<text x="1150" y="168" font-size="22" font-weight="700" fill="#1D4ED8">物联网平台 · 三点补足</text>

<text x="90" y="270" font-size="17" fill="#475569">各层数据格式不一，跨层联动靠人</text>

<text x="90" y="440" font-size="17" fill="#475569">工况一变，就要重新编程</text>

<text x="1150" y="440" font-size="17" fill="#475569">REST / gRPC / MQTT 统一接口</text>

<text x="1150" y="572" font-size="21" font-weight="700" fill="#B45309">闭环自动化</text>
<text x="1150" y="610" font-size="17" fill="#475569">采集 → 理解 → 决策 → 执行 → 反馈</text>
