type: matrix
title: 图1-22 实践建议优先级矩阵
audience_takeaway: 应优先执行投入产出高且实施难度低的条目,如用三次浪潮框架重新定位项目、分隔感知值与推理值,而非先投原型搭建。
purpose: 将本章核心概念转化为5条可立即执行行动建议，并按投入产出和实施难度两个维度评估优先级，帮助读者快速决策从哪一条开始。
visual_focus: 从建议编号到建议3：评估规则引擎承载极限的主链路。
design_level: decision
layout: 矩阵布局，按比较维度分组呈现。
elements:
- 建议编号
- 投入产出（价值/时间）
- 实施难度（低/中/高）
- 建议1：用三次浪潮框架重新定位项目
- 高——半天思考可避免数月技术路线错误
- 低——仅需白板会议与团队讨论
- 建议2：分隔感知值与推理值
- 高——为未来AI引入节省大量数据清洗时间
- 低-中——调整数据库设计即可
- 建议3：评估规则引擎承载极限
- 中——避免规则膨胀失控
- 中——需要理解业务场景复杂度
- 建议4：动手搭建最小闭环原型
- 极高——一次实践胜过十篇文档
- 中——需要硬件采购与调试时间
- 建议5：预留AI接入点
- 高——一年后低摩擦接入新能力
- 低——设计API时遵循OpenAPI规范即可
relationships:
- 每一行对应一条实践建议
- 第一列是投入产出评估，第二列是实施难度评估
- 理想切入点：同时具备‘投入产出高’和‘实施难度低’的条目
