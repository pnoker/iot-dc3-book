caption:
  zh: 图1-22 实践建议优先级矩阵。每个建议的投入产出和实施难度一目了然，优先从绿色单元格的条目开始。
  en: Figure 1-22 A priority matrix of practice suggestions. The return and implementation difficulty of each suggestion are clear at a glance — start with the items in the green cells.
labels:
  en:
    图1-22 实践建议优先级矩阵: Figure 1-22 Practice-Suggestion Priority Matrix
    五条实践建议的优先级矩阵: Priority matrix for the five practice suggestions
    五条实践建议按投入产出与实施难度两维评估: Five suggestions scored on return vs. difficulty
    建议: Suggestion
    投入产出（价值/时间）: Return (value/effort)
    实施难度（低/中/高）: Difficulty (low/medium/high)
    建议 1 · 用三次浪潮框架重新定位项目: 1 · Reposition the project with the three-waves frame
    高 — 半天思考可避免数月技术路线错误: High — half a day's thought avoids months on the wrong track
    低 — 仅需白板会议与团队讨论: Low — just a whiteboard session with the team
    建议 2 · 分隔感知值与推理值: 2 · Separate sensed values from inferred values
    高 — 为未来 AI 引入节省大量数据清洗时间: High — saves heavy data cleaning when AI arrives
    低-中 — 调整数据库设计即可: Low-medium — a database redesign is enough
    建议 3 · 评估规则引擎承载极限: 3 · Assess the rule engine's carrying limit
    中 — 避免规则膨胀失控: Medium — keeps rule sprawl in check
    中 — 需要理解业务场景复杂度: Medium — requires grasping business complexity
    建议 4 · 动手搭建最小闭环原型: 4 · Build a minimal closed-loop prototype
    极高 — 一次实践胜过十篇文档: Very high — one build beats ten documents
    中 — 需要硬件采购与调试时间: Medium — needs hardware buying and debugging time
    建议 5 · 预留 AI 接入点: 5 · Reserve AI integration points
    高 — 一年后低摩擦接入新能力: High — low-friction access to new capabilities a year on
    低 — 设计 API 遵循 OpenAPI 规范即可: Low — just design APIs to the OpenAPI spec
    高投入产出 / 低实施难度: High return / low difficulty
    中等投入产出 / 中等实施难度: Medium return / medium difficulty
    优先从绿色单元格的条目开始（高价值、低难度）: Start with the green cells (high value, low difficulty)
    图1-22 实践建议优先级矩阵。每个建议的投入产出和实施难度一目了然，优先从绿色单元格的条目开始。: Figure 1-22 Practice-suggestion priority matrix. Return and difficulty at a glance — start with the green cells.
