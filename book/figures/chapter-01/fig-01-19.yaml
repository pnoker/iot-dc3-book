type: flowchart
title: 图1-19 AIoT数据闭环流程
audience_takeaway: AIoT把感知、推理、受控行动与反馈评估接成闭环；反馈只是演进证据，改进仍须经过评测、发布与回退治理。
purpose: 展示AIoT从感知、推理到受控行动和反馈评估的循环，说明其与传统单向数据流的差异及确定性执行边界。
visual_focus: 从step1到step1的主链路。
design_level: implementation
layout: 横向流程图，四个主要步骤从左至右排列，底部有箭头从“反馈评估”回到“感知”，表示证据循环。
elements:
- 感知 (Perception)
- 推理 (Reasoning)
- 受控行动 (Governed Action)
- 反馈评估 (Feedback Evaluation)
- step4 → step1（反馈 (Feedback)）
relationships:
- step1 → step2（数据流）
- step2 → step3（候选动作）
- step3 → step4（执行回执）
- step4 → step1（闭环反馈）
