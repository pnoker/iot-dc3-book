visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 决策节点必须写成可判断的问题或动作，分支标签保持短句。
render_notes: 使用HTML+SVG实现。主体为四个横向排列的圆角矩形，之间用带箭头的直线连接。反馈箭头从最右矩形底部弯曲回到最左矩形底部。每个矩形内部居中显示标签和说明。颜色：感知为绿色，推理为蓝色，受控行动为橙色，反馈评估为红色。整体背景为浅灰，箭头为黑色。
caption:
  zh: 图1-19 AIoT数据闭环流程——感知、推理、受控行动与反馈评估形成证据闭环；改进经过评测、发布和回退治理后才成为进化。
  en: Figure 1-19 The AIoT data loop — sensing, reasoning, governed action, and feedback evaluation form an evidence loop; improvement becomes evolution only after evaluation, release control, and rollback governance.
labels:
  en:
    图1-19 AIoT数据闭环流程: Figure 1-19 The AIoT Data Loop
    AIoT 感知-推理-受控行动-反馈评估的闭环流程: 'The AIoT loop: sense–reason–act under control–evaluate feedback'
    感知→推理→受控行动→反馈评估，结果形成下一轮证据: Sense→reason→act under control→evaluate feedback; results become evidence for the next cycle
    数据流: Data flow
    候选动作: Candidate action
    执行回执: Execution receipt
    证据回流（反馈进入评测，不直接改写生产系统）: Evidence feedback (results enter evaluation, not direct production changes)
    ① 感知: ① Sense
    传感器采集数据: Sensors collect data
    ② 推理: ② Reason
    模型生成候选判断: Model generates candidate judgments
    ③ 受控行动: ③ Act under control
    策略与控制器确定性执行: Policies and controllers execute deterministically
    ④ 反馈评估: ④ Evaluate feedback
    回执与现场状态形成证据: Receipts and field state form evidence
    感知—推理—受控行动形成闭环，进化发生在评测与发布之后: 'Sense–reason–act under control form the loop; evolution follows evaluation and release'
    反馈形成证据，不直接改写生产系统: Feedback creates evidence; it does not rewrite production systems directly
    图1-19 AIoT数据闭环流程——感知、推理、受控行动与反馈评估形成证据闭环；改进经过评测、发布和回退治理后才成为进化。: Figure 1-19 The AIoT data loop — sensing, reasoning, governed action, and feedback evaluation form an evidence loop; improvement becomes evolution only after evaluation, release control, and rollback governance.
