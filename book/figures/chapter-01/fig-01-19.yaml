type: flowchart
title: 图1-19 AIoT数据闭环流程
audience_takeaway: AIoT是感知-学习-决策-执行的循环,执行结果反馈回感知驱动持续自我优化,区别于传统IoT的单向数据管道。
purpose: 展示AIoT中从感知到学习、决策、执行，再到反馈优化的循环过程，直观区别于传统IoT的单向数据流。
visual_focus: 从step1到step1的主链路。
design_level: implementation
layout: 横向流程图，四个主要步骤从左至右排列，底部有箭头从“执行”回到“感知”，表示反馈循环。
elements:
- 感知 (Perception)
- 学习 (Learning)
- 决策 (Decision)
- 执行 (Execution)
- step4 → step1（反馈 (Feedback)）
relationships:
- step1 → step2（数据流）
- step2 → step3（推理结果）
- step3 → step4（控制指令）
- step4 → step1（闭环反馈）
