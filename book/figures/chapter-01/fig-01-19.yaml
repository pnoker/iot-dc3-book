visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 决策节点必须写成可判断的问题或动作，分支标签保持短句。
render_notes: 使用HTML+SVG实现。主体为四个横向排列的圆角矩形，之间用带箭头的直线连接。反馈箭头从最右矩形底部弯曲回到最左矩形底部。每个矩形内部居中显示标签和图标（如传感器图标、大脑图标、齿轮图标）。颜色：感知为绿色，学习为蓝色，决策为橙色，执行为红色。整体背景为浅灰，箭头为黑色。
caption:
  zh: 图1-19 AIoT数据闭环流程——感知、学习、决策、执行形成持续自我优化的循环，区别于传统IoT的单向数据管道。
  en: Figure 1-19 The AIoT data loop — sensing, learning, decision-making, and execution form a continuously self-optimizing cycle, distinct from the one-way data pipeline of traditional IoT.
labels:
  en:
    图1-19 AIoT数据闭环流程: Figure 1-19 The AIoT Data Loop
    AIoT 感知-学习-决策-执行的闭环流程: 'The AIoT loop: sense–learn–decide–execute'
    感知→学习→决策→执行四步循环，执行结果反馈回感知: Sense→learn→decide→execute; results feed back into sensing
    数据流: Data flow
    推理结果: Inference results
    控制指令: Control commands
    闭环反馈（执行结果回传感知，驱动持续自我优化）: Closed-loop feedback (results return to sensing, driving continuous self-optimization)
    ① 感知: ① Sense
    传感器采集数据: Sensors collect data
    ② 学习: ② Learn
    数据分析与建模: Data analysis and modeling
    ③ 决策: ③ Decide
    生成控制决策: Control decisions generated
    ④ 执行: ④ Execute
    设备执行动作: Devices act
    感知—学习—决策—执行形成持续自我优化的循环: 'Sense–learn–decide–execute: a continuously self-optimizing cycle'
    执行结果反馈回感知，区别于传统 IoT 的单向数据管道: Results feed back into sensing — unlike traditional IoT's one-way pipeline
    图1-19 AIoT数据闭环流程——感知、学习、决策、执行形成持续自我优化的循环，区别于传统IoT的单向数据管道。: Figure 1-19 The AIoT data loop — sense, learn, decide, execute form a self-optimizing cycle, unlike the one-way pipeline of traditional IoT.
