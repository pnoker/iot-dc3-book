    智慧工厂从感知到应用的闭环设备连接拓扑: Closed-loop device topology of a smart factory, sensing to applications
    感知—网络—平台—应用四层链路，实线数据流 / 虚线控制流: Sensing—network—platform—application chain; solid = data flow, dashed = control flow
    感知层: Sensing Layer
    冲压机床振动传感器: Press vibration sensor
    短距协议：BLE: 'Short-range: BLE'
    传送带光电计数器: Conveyor photoelectric counter
    短距协议：ZigBee: 'Short-range: ZigBee'
    仓库温湿度探头: Warehouse temp/humidity probe
    每小时上报一次均方根振动值: Reports RMS vibration hourly
    网络层: Network Layer
    车间边缘网关: Workshop edge gateway
    5G / NB-IoT 上联: 5G / NB-IoT uplink
    数据汇聚与预处理：: 'Data aggregation & preprocessing:'
    只上传均方根等: Upload only RMS and other
    统计特征: statistical features
    抓取异常波形后: On catching abnormal waveforms,
    直接触发告警: trigger alarms directly
    平台层: Platform Layer
    工业物联网云平台: Industrial IoT cloud platform
    时序数据库: Time-Series DB
    接收上万设备时序数据: Ingests time-series data from 10k+ devices
    趋势分析模型: Trend analysis model
    生成设备失效风险判断: Produces an equipment-failure risk assessment
    应用层: Application Layer
    预测性维护模块: Predictive maintenance module
    趋势分析 · 失效预警: Trend analysis · failure early warning
    自动告警系统: Automatic alarm system
    异常波形即时通知: Instant abnormal-waveform alerts
    受控行动: Governed action
    策略校验后下发减速指令: Sends a slowdown command after policy validation
    按风险自动批准或人工确认: Automatic approval or human confirmation by risk
    告警/决策: Alarm/decision
