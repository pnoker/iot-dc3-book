type: topology
title: 图1-8 智慧工厂设备连接拓扑示意
audience_takeaway: 边缘网关汇聚现场数据，云侧形成风险判断；告警通知与设备写动作具有不同治理边界，写动作必须经策略、确认、审计和结果验证。
purpose: 展示从感知层到应用层的设备连接链路，以及数据流与受控行动流的走向，说明工业智能闭环如何保留确定性执行和治理边界。
visual_focus: 从起点到至边缘网关的主链路。
design_level: logical
layout: 分层拓扑布局，从左至右依次排列“感知层 → 网络层 → 平台层 → 应用层”。
elements:
- '感知层: 冲压机床振动传感器（BLE）、传送带光电计数器（ZigBee）、仓库温湿度探头（ZigBee）'
- '网络层: 车间边缘网关（5G/NB-IoT），负责数据汇聚与预处理（只上传均方根等统计特征）'
- '平台层: 工业物联网云平台，接收上万设备时序数据，进行趋势分析'
- '应用层: 预测性维护模块、自动告警系统、受控行动（策略校验后下发减速指令）'
relationships:
- 感知层设备通过 BLE/ZigBee 短距无线协议连接至边缘网关。
- 边缘网关通过 5G/NB-IoT 上联至平台层云平台。
- 云平台分析后，向应用层输出告警或候选动作。
- 告警可直接通知；设备写动作须经权限、策略、确认和审计后，才可沿反向控制链路下发。
regions:
- id: edge_domain
  label: 设备与边缘域
  role: 现场异构资源边界
components:
- id: r1
  label: 现场传感器（BLE/ZigBee）
  subtitle: 振动传感器、光电计数器、温湿度探头
  type: edge
  group: edge_domain
  priority: primary
  shape: box
- id: r2
  label: 车间边缘网关
  subtitle: 数据汇聚与预处理，仅上传统计特征
  type: edge
  group: edge_domain
  priority: normal
  shape: box
connections:
- from: r1
  to: r2
  label: BLE/ZigBee 短距无线
  style: solid
  direction: request
callouts:
- 感知层设备通过 BLE/ZigBee 短距无线协议连接至边缘网关
- 边缘网关通过 5G/NB-IoT 上联至平台层云平台
- 云平台分析后，向应用层输出告警或决策
legend:
- '实线箭头: 数据流（传感器信号、统计特征、时序数据）。'
- '虚线箭头: 受控行动流（策略、确认、审计后的减速指令）。'
- '矩形图标: 设备/系统节点。'
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: 采用多层矩形叠加布局，从左至右按“感知层 -> 网络层 -> 平台层 -> 应用层”排列，各层内嵌入对应设备图标（传感器、网关、服务器、操作终端），用实线箭头标明数据流方向，虚线箭头标明控制流方向。感知层内部可适当标注三种传感器使用的短距协议（BLE、ZigBee），网络层标注 5G/NB-IoT 双连接。平台层可标注“时序数据库 + 趋势分析模型”字样。
caption:
  zh: 图 1-8 示意一场智慧工厂的物联连接拓扑。边缘网关汇聚数据，云侧模型形成设备失效风险判断；告警可以直接通知，而减速等设备写动作须经权限、策略、确认与审计后下发，并以设备回执或状态回读验证闭环。
  en: Figure 1-8 illustrates an IoT topology for a smart factory. The edge gateway aggregates data and a cloud model produces equipment-failure risk assessments. Alerts may notify directly, while device writes such as slowdown commands require authorization, policy checks, confirmation, and audit, followed by a device receipt or state readback to verify closure.
