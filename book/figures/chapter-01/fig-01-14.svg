<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">实践建议优先级矩阵</title>
  <desc id="desc">读者应理解实践建议优先级矩阵中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">实践建议优先级矩阵</title>
  <desc id="desc">读者应理解实践建议优先级矩阵中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">实践建议优先级矩阵</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解实践建议优先级矩阵中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">MATRIX</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="matrix">
  <!-- 表格主体 -->
  <!-- 表头行 -->
  <rect x="200" y="200" width="300" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="350" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">建议编号</text>
  <rect x="500" y="200" width="450" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="725" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">投入产出（价值/时间）</text>
  <rect x="950" y="200" width="450" height="50" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1175" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">实施难度（低/中/高）</text>

  <!-- 数据行 -->
  <!-- 行1: 建议1 -->
  <rect x="200" y="250" width="300" height="60" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="350" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">建议1：用三次浪潮框架重新定位项目</text>
  <rect x="500" y="250" width="450" height="60" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="725" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">高</text>
  <text x="725" y="295" text-anchor="middle" font-size="11" fill="#475569" font-family="'PingFang SC','Microsoft YaHei',sans-serif">半天思考可避免数月技术路线错误</text>
  <rect x="950" y="250" width="450" height="60" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1175" y="275" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">低</text>
  <text x="1175" y="295" text-anchor="middle" font-size="11" fill="#475569" font-family="'PingFang SC','Microsoft YaHei',sans-serif">仅需白板会议与团队讨论</text>

  <!-- 行2: 建议2 -->
  <rect x="200" y="310" width="300" height="60" rx="4" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="350" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">建议2：分隔感知值与推理值</text>
  <rect x="500" y="310" width="450" height="60" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="725" y="335" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">高</text>
  <text x="725" y="355" text-anchor="middle" font-size="11" fill="#475569" font-family="'PingFang SC','Microsoft YaHei',sans-serif">为未来AI引入节省大量数据清洗时间</text>
  <rect x="950" y="310" width="450" height="60" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1175" y="335" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">低-中</text>
  <text x="1175" y="355" text-anchor="middle" font-size="11" fill="#475569" font-family="'PingFang SC','Microsoft YaHei',sans-serif">调整数据库设计即可</text>

  <!-- 行3: 建议3 -->
  <rect x="200" y="370" width="300" height="60" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="350" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">建议3：评估规则引擎承载极限</text>
  <rect x="500" y="370" width="450" height="60" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="725" y="395" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中</text>
  <text x="725" y="415" text-anchor="middle" font-size="11" fill="#475569" font-family="'PingFang SC','Microsoft YaHei',sans-serif">避免规则膨胀失控</text>
  <rect x="950" y="370" width="450" height="60" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1175" y="395" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中</text>
  <text x="1175" y="415" text-anchor="middle" font-size="11" fill="#475569" font-family="'PingFang SC','Microsoft YaHei',sans-serif">需要理解业务场景复杂度</text>

  <!-- 行4: 建议4 -->
  <rect x="200" y="430" width="300" height="60" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="350" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">建议4：动手搭建最小闭环原型</text>
  <rect x="500" y="430" width="450" height="60" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="725" y="455" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">极高</text>
  <text x="725" y="475" text-anchor="middle" font-size="11" fill="#475569" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一次实践胜过十篇文档</text>
  <rect x="950" y="430" width="450" height="60" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1175" y="455" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">中</text>
  <text x="1175" y="475" text-anchor="middle" font-size="11" fill="#475569" font-family="'PingFang SC','Microsoft YaHei',sans-serif">需要硬件采购与调试时间</text>

  <!-- 行5: 建议5 -->
  <rect x="200" y="490" width="300" height="60" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="350" y="520" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">建议5：预留AI接入点</text>
  <rect x="500" y="490" width="450" height="60" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="725" y="515" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">高</text>
  <text x="725" y="535" text-anchor="middle" font-size="11" fill="#475569" font-family="'PingFang SC','Microsoft YaHei',sans-serif">一年后低摩擦接入新能力</text>
  <rect x="950" y="490" width="450" height="60" rx="4" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1175" y="515" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">低</text>
  <text x="1175" y="535" text-anchor="middle" font-size="11" fill="#475569" font-family="'PingFang SC','Microsoft YaHei',sans-serif">设计API时遵循OpenAPI规范即可</text>

  <!-- callouts 放在表格下方 -->
  <rect x="200" y="580" width="400" height="40" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="400" y="605" text-anchor="middle" font-size="12" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">每一行对应一条实践建议</text>
  <rect x="610" y="580" width="400" height="40" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="810" y="605" text-anchor="middle" font-size="12" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第一列是投入产出评估，第二列是实施难度评估</text>
  <rect x="1020" y="580" width="380" height="40" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="1210" y="605" text-anchor="middle" font-size="12" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">理想切入点：高产出低难度</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">高投入产出或低实施难度</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">中等投入产出或中等实施难度</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">低投入产出或高实施难度</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图1-16 实践建议优先级矩阵。每个建议的投入产出和实施难度一目了然，优先从绿色单元格的条目开始。</text>
  </svg>
</svg>