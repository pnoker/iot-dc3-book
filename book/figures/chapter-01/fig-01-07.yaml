callouts:
- 用户 → 即时通信（聊天/红包）
- 用户 → 社交媒体（分享/点赞）
- 用户 → 移动支付（扫码支付/转账）
legend:
- 中心节点：用户（圆形，黄色）；外围节点：应用模块（矩形，蓝绿色调）；实线箭头从用户指向各应用模块；虚线表示模块间的交叉连接。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: '采用Flexbox布局实现星形拓扑。中心图标使用FontAwesome fa-user，外围图标分别用 fa-comment-dots、fa-share-alt、fa-credit-card、fa-map-marked-alt、fa-video。连接线使用SVG的path绘制贝塞尔曲线，实现平滑放射状，每条连接线中部添加文本标签。模块间虚线用CSS的border-style: dashed实现。'
caption:
  zh: 该图展示移动互联网时代以用户为中心的应用生态。即时通信维系熟人关系，社交媒体扩大社交半径，移动支付将社交关系延伸至交易，地图/出行解决物理移动需求，短视频成为新的内容消费和社交入口。模块间交叉连接的含义是：一个应用内往往集成多种功能（例如社交媒体可以内嵌支付入口）。
  en: This figure shows the user-centered app ecosystem of the mobile-Internet era. Instant messaging maintains close relationships, social media widens the social radius, mobile payment extends social ties into transactions, maps/mobility meet physical travel needs, and short video becomes a new entry for content consumption and social life. The cross-links between modules mean that one app often bundles several functions (for example, social media can embed a payment entry).
