type: topology
title: 图1-7 移动互联网应用生态示意
audience_takeaway: 读者应理解移动互联网以用户为唯一中心,应用模块围绕用户辐射,且通过社交内嵌支付等交叉连接实现功能聚合而非各自孤立。
purpose: 展示移动互联网时代以用户为中心的星形应用生态，突出“人-应用-服务”的连接闭环。
visual_focus: 从用户到移动支付的主链路。
design_level: logical
layout: 星形拓扑布局。中心节点为用户，五个外围节点分别为即时通信、社交媒体、移动支付、地图/出行和短视频应用模块。各外围模块之间存在虚线连接（如社交平台内嵌支付功能）。
elements:
- 用户
- 即时通信
- 社交媒体
- 移动支付
- 地图/出行
- 短视频
relationships:
- 用户 → 即时通信（聊天/红包）
- 用户 → 社交媒体（分享/点赞）
- 用户 → 移动支付（扫码支付/转账）
- 用户 → 地图/出行（导航/约车）
- 用户 → 短视频（拍摄/发布）
- 社交媒体 → 移动支付（内嵌支付）
regions:
- id: application_domain
  label: 业务应用域
  role: 业务价值交付边界
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
