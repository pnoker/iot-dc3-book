type: framework
title: 图1-2 工业软件的核心能力与不可替代性
audience_takeaway: 读者应理解工业软件的三大核心能力——确定性实时控制、结构化数据建模、工业级可靠性与安全认证——它们构成不可替代的底座，是判断下一代平台「补什么、不动什么」的标尺。
purpose: 归纳工业软件做得足够好的三块能力，说明其不可替代性，为 1.1.3 的结构性局限与 1.1.4 的架构跃迁划清边界——物联网平台补短板，而非推倒重来。
visual_focus: 三列等宽卡片（确定性控制 / 结构化建模 / 可靠性与安全认证），每列标注关键标准与「为什么不可替代」。
design_level: logical
layout: 三列等宽卡片横向排列，顶部标题区，底部结论条与图注。
elements:
- 确定性实时控制：PLC 毫秒级扫描周期、二值逻辑、安全联锁/急停/紧急泄压、IEC 61131-3 + 硬件冗余
- 结构化数据建模：OPC UA 信息模型、ISA-88 批次控制、IEC 61850 电力模型、为物模型打基础
- 可靠性与安全认证：SIL 安全完整性等级、ATEX 防爆、IEC 61508 功能安全、法律准入门槛
relationships:
- 三项能力并列，共同构成工业软件不可替代的底座
- 任何叠加的智能层都不应替代确定性控制，而应在其之上补足
render_notes: 三列等宽卡片，语义色蓝/青/橙，每列含要点与「为什么不可替代」说明。完整 HTML 见 figures/chapter-01/fig-01-02.html。
caption:
  zh: 图1-2 工业软件的核心能力与不可替代性。确定性实时控制、结构化数据建模、工业级可靠性与安全认证构成不可替代的底座，是判断下一代平台「补什么、不动什么」的标尺。
  en: Figure 1-2 The core capabilities of industrial software and why they are irreplaceable. Deterministic real-time control, structured data modeling, and industrial-grade reliability with safety certification form a base that cannot be replaced — the yardstick for judging what the next-generation platform should add and what it must leave alone.
