<text x="80" y="510" font-size="15" fill="#64748B">低置信度或新类别样本附带原始特征值回传</text>

<text x="900" y="872" font-size="16" fill="#64748B" text-anchor="middle">云端评测发布 → 边缘实时推理 → 端侧受控响应 → 样本与回执返回评测</text>
<text x="900" y="948" font-size="18" fill="#475569" text-anchor="middle">图1-20 云边协同AIoT三级架构。云侧管理经过评测的模型版本，边缘侧承担实时推理与数据过滤，</text>
<text x="900" y="974" font-size="18" fill="#475569" text-anchor="middle">端侧在本地规则和控制器边界内响应，样本与回执回流后进入下一轮评测。</text>
