<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图1-7 RFID 系统基本组成</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图1-7 RFID 系统基本组成</title>
  <desc id="desc">RFID 系统由标签、读写器与后台系统三部分组成：标签承载 EPC 数据，通过射频信号与读写器通信（无源标签由场区供电），读写器将解码后的数据经有线或无线网络发送至后台系统处理。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">

  <defs>
    <marker id="rf-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0F766E"/></marker>
    <marker id="rf-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>

  <!-- canvas -->
  <rect width="1800" height="900" fill="#F8FAFC"/>

  <!-- ===== 标题区 ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" font-size="22" font-weight="700" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">图1-7 RFID 系统基本组成</text>
  <text x="82" y="70" font-size="12" fill="#64748B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">标签通过射频信号与读写器通信，读写器将解码后数据经网络送达后台系统——为物品赋予数字身份</text>
  <rect x="1560" y="28" width="176" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1648" y="46" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.6">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 区域边界（三节点拓扑） ===== -->
  <!-- 物理环境 -->
  <rect x="90" y="150" width="520" height="580" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,6"/>
  <text x="112" y="182" font-size="16" font-weight="700" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">物理环境</text>
  <text x="112" y="202" font-size="12" fill="#64748B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">标签被贴附的物品与环境边界</text>
  <rect x="504" y="158" width="66" height="22" rx="11" fill="#ECFDF5" stroke="#0F766E" stroke-width="1"/>
  <text x="537" y="173" font-size="10" font-weight="700" fill="#0F766E" text-anchor="middle" letter-spacing="1">EDGE</text>

  <!-- 接入层 -->
  <rect x="650" y="150" width="440" height="580" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,6"/>
  <text x="672" y="182" font-size="16" font-weight="700" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">接入层</text>
  <text x="672" y="202" font-size="12" fill="#64748B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">天线与解码</text>
  <rect x="976" y="158" width="78" height="22" rx="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="1015" y="173" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle" letter-spacing="1">ACCESS</text>

  <!-- 后台处理域 -->
  <rect x="1130" y="150" width="620" height="580" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,6"/>
  <text x="1152" y="182" font-size="16" font-weight="700" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">后台处理域</text>
  <text x="1152" y="202" font-size="12" fill="#64748B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">业务逻辑与数据持久化</text>
  <rect x="1636" y="158" width="84" height="22" rx="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="1678" y="173" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle" letter-spacing="1">BACKEND</text>

  <!-- ===== 节点卡片 ===== -->
  <!-- RFID 标签 -->
  <rect x="140" y="290" width="400" height="220" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <circle cx="170" cy="325" r="5" fill="#0F766E"/>
  <text x="186" y="331" font-size="22" font-weight="700" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">RFID 标签</text>
  <text x="170" y="357" font-size="13" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">有源 / 无源</text>
  <line x1="170" y1="373" x2="510" y2="373" stroke="#E2E8F0" stroke-width="1"/>
  <text x="178" y="400" font-size="13" font-weight="600" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">承载 EPC 数据，为物品赋予数字身份</text>
  <text x="178" y="426" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">有源标签：内置电池，读取距离更远</text>
  <text x="178" y="450" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">无源标签：依赖读写器场区取电</text>
  <!-- EPC 芯片图标 -->
  <rect x="470" y="306" width="52" height="52" rx="6" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="496" y="336" font-size="12" font-weight="700" fill="#0F766E" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">EPC</text>

  <!-- 读写器 -->
  <rect x="690" y="290" width="330" height="220" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="720" cy="325" r="5" fill="#2563EB"/>
  <text x="736" y="331" font-size="22" font-weight="700" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">读写器</text>
  <text x="720" y="357" font-size="13" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">射频收发 + 解码</text>
  <line x1="720" y1="373" x2="990" y2="373" stroke="#E2E8F0" stroke-width="1"/>
  <text x="728" y="400" font-size="13" font-weight="600" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">天线发射射频场区，激活无源标签</text>
  <text x="728" y="426" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">射频收发模块接收回传信号</text>
  <text x="728" y="450" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">解码单元还原 EPC 数据</text>
  <!-- 天线信号图标 -->
  <circle cx="971" cy="324" r="3.5" fill="#2563EB"/>
  <path d="M 959 313 a 13 13 0 0 1 24 0" fill="none" stroke="#2563EB" stroke-width="2"/>
  <path d="M 950 303 a 22 22 0 0 1 42 0" fill="none" stroke="#2563EB" stroke-width="2"/>

  <!-- 后台系统 -->
  <rect x="1190" y="290" width="500" height="220" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="1220" cy="325" r="5" fill="#2563EB"/>
  <text x="1236" y="331" font-size="22" font-weight="700" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">后台系统</text>
  <text x="1220" y="357" font-size="13" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">数据库 / ERP 系统</text>
  <line x1="1220" y1="373" x2="1660" y2="373" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1228" y="400" font-size="13" font-weight="600" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">接收读写器上报的识别结果</text>
  <text x="1228" y="426" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">数据库：持久化存储与查询</text>
  <text x="1228" y="450" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">ERP：联动库存、追溯等业务应用</text>
  <!-- 数据库图标 -->
  <ellipse cx="1658" cy="316" rx="28" ry="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <path d="M 1630 316 L 1630 356 A 28 11 0 0 0 1686 356 L 1686 316" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="1636" y1="334" x2="1680" y2="334" stroke="#2563EB" stroke-width="1.5" opacity="0.45"/>
  <line x1="1636" y1="346" x2="1680" y2="346" stroke="#2563EB" stroke-width="1.5" opacity="0.45"/>

  <!-- ===== 连接关系 ===== -->
  <!-- 标签 ⇄ 读写器：射频信号（场区供电 + 数据回传） -->
  <line x1="560" y1="385" x2="678" y2="385" stroke="#0F766E" stroke-width="2.5" marker-start="url(#rf-teal)" marker-end="url(#rf-teal)"/>
  <text x="619" y="370" font-size="12" font-weight="700" fill="#0F766E" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">射频信号</text>
  <text x="619" y="407" font-size="12" fill="#0F172A" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">场区供电 + 数据回传</text>

  <!-- 读写器 → 后台系统：解码后数据（有线/无线） -->
  <line x1="1040" y1="385" x2="1176" y2="385" stroke="#2563EB" stroke-width="2.5" marker-end="url(#rf-blue)"/>
  <text x="1108" y="370" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">解码后数据</text>
  <text x="1108" y="407" font-size="12" fill="#0F172A" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">有线 / 无线网络</text>

  <!-- ===== 说明标注（callouts） ===== -->
  <!-- 物理环境：无源标签 -->
  <rect x="110" y="568" width="480" height="88" rx="12" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <circle cx="136" cy="600" r="11" fill="#0F766E"/>
  <text x="136" y="605" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif">!</text>
  <text x="158" y="596" font-size="12" font-weight="600" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">无源标签自身不供电，</text>
  <text x="158" y="618" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">依赖读写器射频场区激活。</text>

  <!-- 接入层：翻译桥梁 -->
  <rect x="670" y="568" width="400" height="88" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <circle cx="696" cy="600" r="11" fill="#2563EB"/>
  <text x="696" y="605" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif">!</text>
  <text x="718" y="596" font-size="12" font-weight="600" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">读写器充当物理信号与</text>
  <text x="718" y="618" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">数字数据的翻译桥梁。</text>

  <!-- 后台处理域：业务处理 -->
  <rect x="1150" y="568" width="580" height="88" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="1176" cy="600" r="11" fill="#475569"/>
  <text x="1176" y="605" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif">!</text>
  <text x="1198" y="596" font-size="12" font-weight="600" fill="#0F172A" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">数据库 / ERP 处理识别结果，</text>
  <text x="1198" y="618" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">支撑库存、追溯等业务应用。</text>

  <!-- ===== 图例 ===== -->
  <line x1="64" y1="790" x2="1736" y2="790" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="90" y="806" width="18" height="12" rx="2" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="116" y="818" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">青绿色：RFID 标签（物理环境）</text>
  <rect x="420" y="806" width="18" height="12" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="446" y="818" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">蓝色：读写器 / 后台系统（接入 / 后台）</text>
  <line x1="872" y1="812" x2="912" y2="812" stroke="#0F766E" stroke-width="2.5" marker-start="url(#rf-teal)" marker-end="url(#rf-teal)"/>
  <text x="924" y="818" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">双向：射频信号（场区供电 + 数据回传）</text>
  <line x1="1300" y1="812" x2="1334" y2="812" stroke="#2563EB" stroke-width="2.5" marker-end="url(#rf-blue)"/>
  <text x="1346" y="818" font-size="12" fill="#475569" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">单向：解码后数据（有线 / 无线）</text>

  <!-- ===== 图注 ===== -->
  <text x="900" y="862" font-size="12" fill="#94A3B8" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">图1-7 RFID 系统基本组成：标签、读写器与后台系统的物理 / 逻辑关系。</text>
  </svg>
</svg>
    <section class="meta" style="display:none">
      <div class="card"><div class="label">图表类型</div><div class="value">architecture</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">从左到右的三节点拓扑：标签（左侧）→ 读写器（中间）→ 后台系统（右侧），标注信号方向与数据流方向。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
