<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图1-1 工业软件的版图：ISA-95 五层金字塔</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:#F8FAFC}
    main.figure{width:1200px;height:820px;margin:0;font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif}
    svg{display:block}text{letter-spacing:0}
  </style>
</head>
<body>
<main class="figure" data-figure-root>
<svg width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="ft fd" xmlns="http://www.w3.org/2000/svg">
  <title id="ft">图1-1 工业软件的版图：ISA-95 五层金字塔</title>
  <desc id="fd">ISA-95（IEC 62264）五层金字塔：自底向上 L0 物理过程（传感器/执行器）、L1 基础控制（PLC/DCS）、L2 过程监控（SCADA/HMI）、L3 制造运营管理（MES）、L4 业务规划（ERP），时效从毫秒到天；右侧标注其设计预设——数据由人查看、决策由人做出、指令由人下发。</desc>

  <rect width="1200" height="820" fill="#F8FAFC"/>

  <!-- 标题区 -->
  <circle cx="48" cy="42" r="6" fill="#2563EB"/>
  <text x="66" y="49" font-size="24" font-weight="700" fill="#0F172A">图1-1 工业软件的版图：ISA-95 五层金字塔</text>
  <text x="66" y="73" font-size="13" fill="#475569">自底向上五层，时效从毫秒到天——把物理生产过程纳入管理信息系统</text>
  <line x1="32" y1="88" x2="1168" y2="88" stroke="#CBD5E1"/>
  <rect x="24" y="104" width="1152" height="640" rx="8" fill="#FFFFFF"/>

  <!-- 左侧流向标注 -->
  <text x="58" y="375" font-size="12" font-weight="700" fill="#64748B" transform="rotate(-90 58 375)">数据上流</text>
  <text x="812" y="375" font-size="12" font-weight="700" fill="#64748B" transform="rotate(90 812 375)">指令下发</text>

  <!-- 金字塔 5 层（梯形，自底向上递减，中心 x=435）-->
  <!-- L4 ERP（顶） -->
  <path d="M295 150 L575 150 L605 240 L265 240 Z" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="435" y="176" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">LEVEL 4 · 企业业务规划</text>
  <text x="435" y="204" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">ERP</text>
  <text x="435" y="228" font-size="11" fill="#475569" text-anchor="middle">采购 · 财务 · 销售　｜　时效：天～周</text>

  <!-- L3 MES -->
  <path d="M265 240 L605 240 L635 330 L235 330 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="435" y="266" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">LEVEL 3 · 制造运营管理</text>
  <text x="435" y="294" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">MES</text>
  <text x="435" y="318" font-size="11" fill="#475569" text-anchor="middle">排程 · 工单 · 质量追溯　｜　时效：小时～天</text>

  <!-- L2 SCADA / HMI -->
  <path d="M235 330 L635 330 L665 420 L205 420 Z" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/>
  <text x="435" y="356" font-size="11" font-weight="700" fill="#0891B2" text-anchor="middle">LEVEL 2 · 过程监控</text>
  <text x="435" y="384" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">SCADA / HMI</text>
  <text x="435" y="408" font-size="11" fill="#475569" text-anchor="middle">大屏展示 · 简单告警　｜　时效：秒</text>

  <!-- L1 PLC / DCS -->
  <path d="M205 420 L665 420 L695 510 L175 510 Z" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="435" y="446" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">LEVEL 1 · 基础控制</text>
  <text x="435" y="474" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">PLC / DCS</text>
  <text x="435" y="498" font-size="11" fill="#475569" text-anchor="middle">确定性逻辑 · 固定扫描周期　｜　时效：毫秒</text>

  <!-- L0 物理过程（底） -->
  <path d="M175 510 L695 510 L725 600 L145 600 Z" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="435" y="536" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">LEVEL 0 · 物理过程</text>
  <text x="435" y="564" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">传感器 · 执行器 · 电机</text>
  <text x="435" y="588" font-size="11" fill="#475569" text-anchor="middle">不跑软件，只产生和接收信号　｜　时效：实时</text>

  <!-- 底部时间轴暗示（实时 → 天）-->
  <line x1="145" y1="630" x2="725" y2="630" stroke="#CBD5E1"/>
  <circle cx="725" cy="630" r="4" fill="#64748B"/><text x="725" y="652" font-size="11" fill="#64748B" text-anchor="middle">实时</text>
  <circle cx="145" cy="630" r="4" fill="#64748B"/><text x="145" y="652" font-size="11" fill="#64748B" text-anchor="middle">天 / 周</text>
  <text x="435" y="652" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">抽象层级升高 · 时效变慢</text>

  <!-- 右侧：设计预设 -->
  <rect x="840" y="150" width="312" height="450" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <rect x="840" y="150" width="312" height="44" rx="8" fill="#EFF6FF"/>
  <rect x="840" y="186" width="312" height="8" fill="#EFF6FF"/>
  <text x="860" y="179" font-size="14" font-weight="700" fill="#2563EB">ISA-95 的设计预设</text>
  <text x="860" y="226" font-size="12" fill="#334155">这套架构在 20 世纪 90 年代定型，</text>
  <text x="860" y="246" font-size="12" fill="#334155">支配了此后三十年的工业软件格局。</text>
  <text x="860" y="266" font-size="12" fill="#334155">它解决的核心问题是把物理生产</text>
  <text x="860" y="286" font-size="12" fill="#334155">过程纳入管理信息系统。</text>

  <line x1="860" y1="312" x2="1132" y2="312" stroke="#E2E8F0"/>
  <text x="860" y="340" font-size="13" font-weight="700" fill="#0F172A">但它的前提是：</text>
  <g><circle cx="868" cy="372" r="3" fill="#2563EB"/><text x="884" y="376" font-size="13" fill="#334155">数据由 <tspan font-weight="700" fill="#0F172A">人</tspan> 查看</text></g>
  <g><circle cx="868" cy="408" r="3" fill="#2563EB"/><text x="884" y="412" font-size="13" fill="#334155">决策由 <tspan font-weight="700" fill="#0F172A">人</tspan> 做出</text></g>
  <g><circle cx="868" cy="444" r="3" fill="#2563EB"/><text x="884" y="448" font-size="13" fill="#334155">指令由 <tspan font-weight="700" fill="#0F172A">人</tspan> 下发</text></g>

  <rect x="860" y="478" width="272" height="100" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-dasharray="4 3"/>
  <text x="876" y="504" font-size="12" font-weight="700" fill="#B45309">当"物"要自主感知、</text>
  <text x="876" y="524" font-size="12" font-weight="700" fill="#B45309">AI 要接入决策时——</text>
  <text x="876" y="550" font-size="11" fill="#92400E">这套以人为中心的信息架构</text>
  <text x="876" y="568" font-size="11" fill="#92400E">就显出结构性局限（见下一图）</text>

  <!-- 底部图题（居中，与 fig-01-03 等统一）-->
  <line x1="32" y1="742" x2="1168" y2="742" stroke="#CBD5E1"/>
  <text x="600" y="773" font-size="12" font-weight="700" text-anchor="middle" fill="#2563EB">自底向上五层：时效从毫秒到天，数据由人查看、决策由人做出</text>
  <text x="600" y="798" font-size="11" text-anchor="middle" fill="#475569">图1-1 五层自底向上抽象层级升高、时效从实时变慢到天/周，数据向上流、指令向下发；数据、决策、指令都预设由人承担。</text>
</svg>
</main>
</body>
</html>
