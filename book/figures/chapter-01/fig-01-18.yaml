    作为实时推理与决策枢纽，端侧与云侧通过边缘侧间接交互，云侧主要负责模型训练与知识更新并定期下推。: a hub for real-time inference and decisions; end and cloud interact via the edge, and the cloud trains models and pushes updates on a schedule.
