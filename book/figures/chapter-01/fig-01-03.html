  <title>图1-3 工业软件的结构性局限：三条裂缝</title>

  <title id="title">图1-3 工业软件的结构性局限：三条裂缝</title>
  <desc id="desc">ISA-95 金字塔的三条结构性裂缝</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图1-3 工业软件的结构性局限：三条裂缝</text>
    <text x="88" y="64" font-size="12" fill="#64748B">金字塔上的三道裂缝与详解卡片一一对应</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>
<defs>
<marker id="ab" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#2563EB"/></marker>
<marker id="ao" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#F97316"/></marker>
<marker id="at" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#0F766E"/></marker>
<marker id="ar" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#DC2626"/></marker>
<marker id="ap" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#7C3AED"/></marker>
<marker id="ag" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#475569"/></marker>
</defs>
<!-- 左：金字塔轮廓 -->
<polygon points="380,170 650,170 690,740 70,740" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
<line x1="164" y1="300" x2="596" y2="300" stroke="#E2E8F0" stroke-width="1.4"/>
<line x1="122" y1="440" x2="638" y2="440" stroke="#E2E8F0" stroke-width="1.4"/>
<line x1="90" y1="580" x2="670" y2="580" stroke="#E2E8F0" stroke-width="1.4"/>
<text x="380" y="740" font-size="18" fill="#64748B" text-anchor="middle">ISA-95 金字塔</text>
<!-- 裂缝折线 -->
<path d="M330,340 l30,-24 l30,24 l30,-24 l30,24" fill="none" stroke="#DC2626" stroke-width="4"/>
<text x="560" y="330" font-size="18" font-weight="700" fill="#DC2626">裂缝 1 数据隔断</text>
<path d="M300,470 l30,-24 l30,24 l30,-24 l30,24" fill="none" stroke="#F97316" stroke-width="4"/>
<text x="560" y="460" font-size="18" font-weight="700" fill="#C2410C">裂缝 2 规则写死</text>
<path d="M260,610 l30,-24 l30,24 l30,-24 l30,24" fill="none" stroke="#7C3AED" stroke-width="4"/>
<text x="560" y="600" font-size="18" font-weight="700" fill="#7C3AED">裂缝 3 封闭孤岛</text>
<!-- 指向右侧卡片的虚线 -->
<line x1="700" y1="330" x2="780" y2="260" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ar)"/>
<line x1="690" y1="470" x2="780" y2="450" stroke="#F97316" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ao)"/>
<line x1="675" y1="610" x2="780" y2="640" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ap)"/>
<!-- 右：三卡片详解 -->
<rect x="780" y="180" width="980" height="160" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
<text x="810" y="222" font-size="23" font-weight="700" fill="#B91C1C">裂缝 1 · 数据被层级隔断</text>
<text x="810" y="262" font-size="18" fill="#475569">振动数据在 SCADA、维护记录在 MES、备件成本在 ERP——</text>
<text x="810" y="294" font-size="18" fill="#475569">三者无自动通路，跨层联动全靠人工对齐。</text>
<rect x="780" y="360" width="980" height="160" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
<text x="810" y="402" font-size="23" font-weight="700" fill="#C2410C">裂缝 2 · 规则写死在代码里</text>
<text x="810" y="442" font-size="18" fill="#475569">PLC 梯形图、SCADA 告警、MES 排程在部署时写死，</text>
<text x="810" y="474" font-size="18" fill="#475569">工况一变、设备老化，就需要有人重新编程。</text>
<rect x="780" y="540" width="980" height="160" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="810" y="582" font-size="23" font-weight="700" fill="#6D28D9">裂缝 3 · 系统封闭为孤岛</text>
<text x="810" y="622" font-size="18" fill="#475569">私有网络 / 协议 / 格式，外部 AI 需为每个品牌 PLC 写适配器、</text>
<text x="810" y="654" font-size="18" fill="#475569">为每种数据库写 SQL——巴别塔式的语义翻译工程。</text>
<!-- 底部引出 -->
<rect x="40" y="720" width="1720" height="150" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
<text x="900" y="770" font-size="24" font-weight="700" fill="#0F766E" text-anchor="middle">三条裂缝均源自 ISA-95 信息架构本身，无法靠升级版本解决</text>
<text x="900" y="812" font-size="19" fill="#334155" text-anchor="middle">共同驱动「数据归一 · 能力开放 · 闭环自动化」的物联网平台跃迁</text>
<text x="900" y="948" font-size="18" fill="#475569" text-anchor="middle">图1-3 工业软件的结构性局限：三条裂缝。数据被层级隔断、规则写死在代码里、系统封闭为孤岛，</text>
<text x="900" y="974" font-size="18" fill="#475569" text-anchor="middle">共同驱动了从工业软件到物联网平台的架构跃迁。</text>
