<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图1-13 成长期：各国战略布局与产业落地</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:#F8FAFC}
    main.figure{width:1200px;height:820px;margin:0;font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif}
    svg{display:block}text{letter-spacing:0}
  </style>
</head>
<body>
<main class="figure" data-figure-root>
<svg width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="ft fd" xmlns="http://www.w3.org/2000/svg">
  <title id="ft">图1-13 成长期：各国战略布局与产业落地</title>
  <desc id="fd">2009-2019 年成长期：日本 u-Japan（2004）、美国智慧地球（2009）、中国感知中国（2009）三条战略路径，向下铺路到产业落地——智能家居与车联网两大消费引擎，最终指向可规模化复用的平台体系。</desc>

  <rect width="1200" height="820" fill="#F8FAFC"/>

  <circle cx="48" cy="42" r="6" fill="#2563EB"/>
  <text x="66" y="49" font-size="24" font-weight="700" fill="#0F172A">图1-13 成长期：各国战略布局与产业落地</text>
  <text x="66" y="73" font-size="13" fill="#475569">政策铺路与产业落地相互叠加：2009—2019</text>
  <line x1="32" y1="88" x2="1168" y2="88" stroke="#CBD5E1"/>
  <rect x="24" y="104" width="1152" height="640" rx="8" fill="#FFFFFF"/>

  <!-- 上半：三条战略路径 -->
  <rect x="110" y="150" width="300" height="150" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="260" y="184" font-size="16" font-weight="700" fill="#1D4ED8" text-anchor="middle">日本</text>
  <text x="260" y="210" font-size="12.5" fill="#334155" text-anchor="middle">u-Japan · 2004</text>
  <text x="260" y="236" font-size="12.5" fill="#334155" text-anchor="middle">泛在网络社会</text>
  <line x1="150" y1="256" x2="370" y2="256" stroke="#BFDBFE"/>
  <text x="260" y="282" font-size="11.5" fill="#64748B" text-anchor="middle">政府规划 + 产业协同</text>

  <rect x="450" y="150" width="300" height="150" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  <text x="600" y="184" font-size="16" font-weight="700" fill="#115E59" text-anchor="middle">美国</text>
  <text x="600" y="210" font-size="12.5" fill="#334155" text-anchor="middle">智慧地球 · 2009</text>
  <text x="600" y="236" font-size="12.5" fill="#334155" text-anchor="middle">智能基础设施</text>
  <line x1="490" y1="256" x2="710" y2="256" stroke="#99F6E4"/>
  <text x="600" y="282" font-size="11.5" fill="#64748B" text-anchor="middle">产业主导、政策辅助</text>

  <rect x="790" y="150" width="300" height="150" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="940" y="184" font-size="16" font-weight="700" fill="#C2410C" text-anchor="middle">中国</text>
  <text x="940" y="210" font-size="12.5" fill="#334155" text-anchor="middle">感知中国 · 2009</text>
  <text x="940" y="236" font-size="12.5" fill="#334155" text-anchor="middle">战略新兴产业</text>
  <line x1="830" y1="256" x2="1050" y2="256" stroke="#FED7AA"/>
  <text x="940" y="282" font-size="11.5" fill="#64748B" text-anchor="middle">顶层设计、行政推动</text>

  <!-- 向下承接带 -->
  <rect x="110" y="330" width="980" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="600" y="364" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">政策铺路 → 产业落地</text>
  <line x1="260" y1="300" x2="260" y2="330" stroke="#94A3B8" stroke-width="2"/>
  <line x1="600" y1="300" x2="600" y2="330" stroke="#94A3B8" stroke-width="2"/>
  <line x1="940" y1="300" x2="940" y2="330" stroke="#94A3B8" stroke-width="2"/>

  <!-- 下半：两大产业引擎 -->
  <rect x="170" y="420" width="400" height="130" rx="10" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  <text x="370" y="452" font-size="15" font-weight="700" fill="#115E59" text-anchor="middle">智能家居</text>
  <text x="370" y="480" font-size="12" fill="#334155" text-anchor="middle">智能温控器自主学习用户作息，无需设规则</text>
  <text x="370" y="504" font-size="11.5" fill="#64748B" text-anchor="middle">从手动配置 → 行为适应</text>
  <text x="370" y="528" font-size="11.5" fill="#64748B" text-anchor="middle">消费者首次大规模认可「物能省事」</text>

  <rect x="630" y="420" width="400" height="130" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="830" y="452" font-size="15" font-weight="700" fill="#C2410C" text-anchor="middle">车联网</text>
  <text x="830" y="480" font-size="12" fill="#334155" text-anchor="middle">3G/4G + GPS，汽车成为高速移动联网节点</text>
  <text x="830" y="504" font-size="11.5" fill="#64748B" text-anchor="middle">车辆数据平台 → OTA 在线升级</text>
  <text x="830" y="528" font-size="11.5" fill="#64748B" text-anchor="middle">支撑自动驾驶对真实路况数据的积累</text>

  <!-- 底部说明 -->
  <rect x="170" y="580" width="860" height="52" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="600" y="612" font-size="12.5" fill="#475569" text-anchor="middle">早期项目存在重复建设与标准不通——同一座城市可能建设多套路灯系统</text>

  <!-- 底部结论条 -->
  <rect x="24" y="664" width="1152" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="600" y="690" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">政策铺路之后：需要的不是更多演示项目，而是能规模化复用的平台体系</text>
  <text x="600" y="710" font-size="11" fill="#475569" text-anchor="middle">这个判断直接通向第 2 章的体系架构讨论</text>

  <line x1="32" y1="742" x2="1168" y2="742" stroke="#CBD5E1"/>
  <text x="600" y="773" font-size="12" font-weight="700" text-anchor="middle" fill="#2563EB">三条战略路径、两大产业引擎，共同把物联网推向工程部署</text>
  <text x="600" y="798" font-size="11" text-anchor="middle" fill="#475569">图1-13 成长期：各国战略布局与产业落地。u-Japan、智慧地球、感知中国三条路径向下铺路，智能家居与车联网两大引擎验证商业逻辑——但重复建设与标准不通，把问题指向平台体系。</text>
</svg>
</main>
