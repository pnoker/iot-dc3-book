type: architecture
title: 图1-12 RFID 系统基本组成
purpose: 展示标签、读写器与后台系统之间的物理信号与数据流关系，说明 RFID 如何为物品赋予数字身份。
audience_takeaway: RFID 的核心组态是标签-读写器-后台系统，工程关键在于标签类型（有源/无源）和读写器部署方案的选择。
visual_focus: 从标签到读写器的射频信号链路，以及从读写器到后台系统的数据流链路。
design_level: physical
layout: 从左到右的三节点拓扑：标签（左侧）→ 读写器（中间）→ 后台系统（右侧），标注信号方向与数据流方向。
elements:
- 左侧：RFID 标签（有源/无源），承载 EPC 数据。
- 中间：RFID 读写器，包含射频收发模块与解码单元。
- 右侧：后台系统（数据库/ERP 系统），处理识别结果。
relationships:
- 读写器通过射频场为无源标签供电并激活标签。
- 标签通过射频信号向读写器回传 EPC 数据。
- 读写器将解码后的数据通过有线或无线网络发送至后台系统。
regions:
- id: rfid_edge
  label: 物理环境
  role: 标签被贴附的物品与环境边界
- id: rfid_mid
  label: 接入层
  role: 天线与解码
- id: rfid_backend
  label: 后台处理域
  role: 业务逻辑与数据持久化
components:
- id: rfid_tag
  label: RFID 标签
  type: edge
  subtitle: 有源/无源，EPC
  group: rfid_edge
  priority: normal
  shape: card
- id: rfid_reader
  label: 读写器
  type: platform
  subtitle: 射频收发+解码
  group: rfid_mid
  priority: primary
  shape: card
- id: rfid_backend_sys
  label: 后台系统
  type: application
  subtitle: 数据库/ERP
  group: rfid_backend
  priority: normal
  shape: card
connections:
- from: rfid_reader
  to: rfid_tag
  label: 供电/激活
  style: solid
  direction: right-to-left
- from: rfid_tag
  to: rfid_reader
  label: 标签数据
  style: solid
  direction: left-to-right
- from: rfid_reader
  to: rfid_backend_sys
  label: 解码后数据（有线/无线）
  style: solid
  direction: request
callouts:
- 无源标签自身不供电，依赖读写器射频场区激活。
- 读写器充当物理信号与数字数据的翻译桥梁。
legend:
- 蓝色：后台系统；青绿色：边缘标签；蓝色：接入读写器。
- 实线：射频/数据链路。
visual_constraints:
- 三个节点，简洁布局，标签置于左侧。
- 图例放在底部，解释颜色与箭头含义。
- 避免过多的技术细节标注在图中，解释放入 callouts。
render_notes: HTML/SVG 渲染，浅色背景，圆角矩形，箭头带短标签，底部图例。
caption:
  zh: 图1-12 RFID 系统基本组成：标签、读写器与后台系统的物理/逻辑关系。
  en: 'Figure 1-12 The basic composition of an RFID system: the physical and logical relationships among tags, readers, and the backend system.'
labels:
  en:
    图1-12 RFID 系统基本组成: Figure 1-12 Basic Composition of an RFID System
    RFID 标签、读写器与后台系统的组成关系: How RFID tags, readers, and the backend system fit together
    标签—读写器—后台系统的物理信号与数据流关系: 'Physical-signal and data-flow relations: tag — reader — backend'
    供电 / 激活: Power / activate
    标签数据（EPC）: Tag data (EPC)
    解码后数据（有线/无线）: Decoded data (wired/wireless)
    RFID 标签: RFID Tag
    有源 / 无源 · EPC: Active / passive · EPC
    射频收发: RF transceiver
    解码单元: Decoding unit
    读写器: Reader
    物理信号 → 数字数据的翻译桥梁: The bridge from physical signals to digital data
    数据库 / ERP: Database / ERP
    后台系统: Backend System
    处理识别结果: Processes identification results
    要点: Key points
    · 无源标签自身不供电，依赖读写器射频场区激活。: · Passive tags carry no power; the reader's RF field activates them.
    · 读写器充当物理信号与数字数据的翻译桥梁，为物品赋予数字身份。: · The reader bridges physical signals and digital data, giving items a digital identity.
    图例：青绿=边缘标签 · 蓝色=接入读写器 / 链路 · 紫色=后台处理域；实线=射频 / 数据链路。: 'Legend: teal = edge tags · blue = reader/links · purple = backend domain; solid = RF/data links.'
    图1-12 RFID 系统基本组成：标签、读写器与后台系统的物理/逻辑关系。: 'Figure 1-12 Basic composition of an RFID system: the physical and logical relations among tags, readers, and the backend.'
