  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图1-7 传统物联网与大模型驱动物联网的对比示意。左侧为规则驱动的“感知-响应”模式，右侧为推理驱动的“理解-决策-确认”模式。大模型在决策层增加上下文理解和概率推理的能力，同时引入了执行前二次确认的安全机制。</text>
