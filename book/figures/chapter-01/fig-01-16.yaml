type: flowchart
title: 图1-16 传统物联网与大模型驱动物联网的对比
audience_takeaway: 传统物联网靠静态规则精确匹配、被动响应,大模型驱动改为上下文概率推理并新增执行前用户二次确认,从被动转向主动。
purpose: 直观对比两种物联网模式的决策链路与用户交互路径，突出大模型引入推理能力带来的架构变化。
visual_focus: 从大模型驱动物联网：用户自然语言描述到终点的主链路。
design_level: implementation
layout: 左右两列，每列从上到下分三层：用户交互层、决策层、执行层。左侧为传统物联网，右侧为大模型驱动物联网。两列之间用箭头标识转变方向，底部标注关键差异。
elements:
- 传统物联网（左侧）从上到下三层：用户交互层为矩形框，标注“手动控制面板或App”；决策层为钻石框，内部写“规则引擎：If CO₂>1000ppm → 开新风”，下方标注“人工编排，静态规则”；执行层为圆形，标注“温度/CO₂传感器 + 新风阀门”；反馈回路为简单闭合的直线箭头。
- 大模型驱动物联网（右侧）从上到下三层：用户交互层为矩形框，标注“自然语言输入（语音或文本）”；决策层为钻石框，内部写“LLM推理：湿度、温度、用户历史习惯综合决策”，下方标注“上下文理解，概率性输出”；执行层为圆形，标注“设备传感器与执行器”，但增加一个用户确认节点（黄色高亮椭圆框），位于决策与执行之间。
- 底部对比条：左侧标注“被动响应”，右侧标注“主动推理”。
relationships:
- 传统物联网：用户输入固定指令 → 规则引擎精确匹配 → 直接执行或报警（反馈为闭环箭头）。
- 大模型驱动物联网：用户自然语言描述 → LLM解析意图并查询设备实时状态 → 生成决策序列 → 用户二次确认后执行（虚线箭头表示概率性推荐路径）。
regions:
- id: application_domain
  label: 业务应用域
  role: 业务价值交付边界
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
- id: intelligence_domain
  label: 智能决策域
  role: 模型、规则与 Agent 边界
- id: edge_domain
  label: 设备与边缘域
  role: 现场异构资源边界
