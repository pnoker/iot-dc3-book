type: architecture
title: 图1-10 物联网系统五要素关系示意
source_note: 本书教学示意图
purpose: 直观展示感知、传输、处理、应用、安全五大要素的层次关系、数据流向与控制流，让读者快速建立物联网系统整体架构认知。
audience_takeaway: 读者应理解五要素之间的关系：数据从感知层经传输层到处理层和应用层，控制指令反向流动，安全机制贯穿全程。
visual_focus: 主链路从感知层起，经传输层到处理层，再到应用层；虚线表示控制指令逆向路径；安全层以贯穿式长条表示。
design_level: logical
layout: 水平分层架构图，顶层从左至右依次为感知→传输→处理→应用四个模块串联，安全层作为一个贯穿底部的横向长条矩形，垂直覆盖上方四个模块。
elements:
- 感知层（最左蓝色节点）：传感器与执行器，标注'S'和'A'图标。
- 传输层（左中蓝色节点）：协议汇聚，列出Wi-Fi、LoRa、BLE三种代表性协议。
- 处理层（右中橙色节点）：平台与边缘，标注规则引擎与时序库。
- 应用层（最右紫色节点）：人机界面，标注手机、大屏、告警。
- 安全层（底部灰色虚线矩形框）：纵向贯穿，标注认证、加密、审计。
relationships:
- 感知层→传输层：传感器数据上报，实线箭头带标注'数据上传'。
- 传输层→处理层：数据转发，实线箭头。
- 处理层→应用层：分析结果推送与告警，实线箭头。
- 应用层→传输层→感知层：控制指令下发路径（逆向），虚线箭头带标注'指令下发'。
- 安全层的虚线垂直分割线从底部向上连接上方四模块的底部中央，表示安全机制贯穿。
legend:
- 蓝色=感知与传输；橙色=处理；紫色=应用；灰色虚线矩形=安全贯穿层
- 实线箭头=数据上报；虚线箭头=控制指令下发；底部标注短线=安全通道
render_notes: SVG渲染，宽高比16:5。顶层四模块横向等距排列，间距18%。安全层高度为顶层模块高度40%，完全覆盖底层。采用圆角矩形（r=6px），线宽2px（虚线间隔6px）。配色：感知/传输用#2563EB主蓝，处理用#F97316橙，应用用#8B5CF6紫，安全层用#E2E8F0背景加#94A3B8虚线边框。图标用简单矢量符号，字号：模块中文16px，图例10px。
caption:
  zh: 图1-10 物联网系统五要素关系示意
  en: Figure 1-10 A schematic of how the five elements of an IoT system relate.
labels:
  en:
    图1-10 物联网系统五要素关系示意: Figure 1-10 Five Elements of an IoT System
    物联网感知/传输/处理/应用/安全五要素层次关系: How sensing, transmission, processing, application, and security stack up
    感知—传输—处理—应用四模块串联，安全层贯穿底部: Sensing—transmission—processing—application in series, security across the base
    数据上传: Data upload
    数据转发: Data forwarding
    分析/告警: Analysis / alarms
    指令下发（逆向：应用 → 传输 → 感知）: 'Command dispatch (reverse: application → transmission → sensing)'
    感知层: Sensing Layer
    传感器与执行器: Sensors and actuators
    S=采集  A=动作: 'S = sense  A = act'
    产生与接收信号: Generate and receive signals
    传输层: Transmission Layer
    协议汇聚: Protocol convergence
    三种代表性协议: Three representative protocols
    数据上报与转发: Data reporting and forwarding
    处理层: Processing Layer
    平台与边缘: Platform and edge
    规则引擎 + 时序库: Rule engine + time-series DB
    数据存储与规则处理: Storage and rule processing
    分析结果与告警: Analysis results and alarms
    应用层: Application Layer
    人机界面: Human-machine interface
    手机 · 大屏 · 告警: Phone · dashboard · alarms
    展示与交互: Display and interaction
    下发控制指令: Issues control commands
    安全层（贯穿全程）: Security Layer (end to end)
    认证 · 加密 · 审计: Authentication · encryption · audit
    纵向覆盖上方四模块，安全机制贯穿数据与指令全链路: Spans all four modules above — security runs through the whole data and command chain
    图1-10 物联网系统五要素关系示意。数据从感知层经传输层到处理层和应用层，控制指令反向流动，安全机制贯穿全程。: Figure 1-10 The five elements of an IoT system. Data flows from sensing through transmission to processing and application, control commands flow back, and security runs throughout.
