<style>

<main class="figure" data-figure-root>
<svg width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
<title id="title">图1-6 PC互联网时代连接架构</title>
<desc id="desc">PC互联网通过TCP/IP连接用户、浏览器、万维网与信息内容，搜索和门户组织信息入口；传感器与执行器仍处在互联网边界之外。</desc>
<defs>
  <marker id="arrowBlue" viewBox="0 0 12 9" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><path d="M0 0L12 4.5 0 9Z" fill="#2563EB"/></marker>
  <marker id="arrowSlate" viewBox="0 0 12 9" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><path d="M0 0L12 4.5 0 9Z" fill="#64748B"/></marker>
  <linearGradient id="tcpFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EFF6FF"/><stop offset="1" stop-color="#DBEAFE"/></linearGradient>
</defs>

<rect width="1200" height="680" fill="#F8FAFC"/>
<circle cx="45" cy="39" r="6" fill="#2563EB"/>

<text x="65" y="74" font-size="13" fill="#475569">互联网连接人和信息，但尚未把传感器与执行器纳入统一网络</text>
<line x1="32" y1="96" x2="1168" y2="96" stroke="#e2e8f0"/>

<rect x="32" y="112" width="1136" height="500" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

<rect x="56" y="136" width="1088" height="285" rx="15" fill="#FBFDFF" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="74" y="153" width="164" height="25" rx="12" fill="#DBEAFE"/>

<text x="1120" y="170" text-anchor="end" font-size="10.5" fill="#64748B">固定终端 · 有线接入 · 请求响应</text>

  <text x="615" y="329" text-anchor="middle" font-size="11.5" fill="#475569">HTTP · URL · HTML</text>
</g>

<!-- search and portal -->
<g>
  <rect x="780" y="205" width="190" height="137" rx="13" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
  <circle cx="827" cy="250" r="21" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>

  <text x="875" y="329" text-anchor="middle" font-size="11.5" fill="#475569">组织信息入口</text>
</g>

<g>
  <rect x="1020" y="205" width="105" height="137" rx="13" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>

</g>

<g font-size="10.5" font-weight="700">
  <rect x="189" y="253" width="58" height="21" rx="10" fill="#FFFFFF"/><text x="218" y="268" text-anchor="middle" fill="#2563EB">用户操作</text>
  <rect x="456" y="253" width="58" height="21" rx="10" fill="#FFFFFF"/><text x="485" y="268" text-anchor="middle" fill="#2563EB">HTTP</text>
  <rect x="716" y="253" width="58" height="21" rx="10" fill="#FFFFFF"/><text x="745" y="268" text-anchor="middle" fill="#2563EB">访问</text>
  <rect x="971" y="253" width="48" height="21" rx="10" fill="#FFFFFF"/><text x="995" y="268" text-anchor="middle" fill="#2563EB">检索</text>
  <rect x="971" y="294" width="48" height="21" rx="10" fill="#FFFFFF"/><text x="995" y="309" text-anchor="middle" fill="#64748B">返回</text>

<!-- tcp/ip substrate -->
<rect x="76" y="363" width="1048" height="42" rx="10" fill="url(#tcpFill)" stroke="#2563EB" stroke-width="1.5"/>
<text x="600" y="383" text-anchor="middle" font-size="14.5" font-weight="750" fill="#1D4ED8">TCP/IP 协议族</text>
<text x="600" y="398" text-anchor="middle" font-size="10.5" fill="#475569">让异构计算机共享统一寻址、路由与可靠传输基础</text>

<!-- physical devices outside the boundary -->
<rect x="76" y="452" width="1048" height="105" rx="14" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6" stroke-dasharray="8 6"/>
<rect x="94" y="468" width="155" height="24" rx="12" fill="#FEF3C7"/>
<text x="171" y="485" text-anchor="middle" font-size="11" font-weight="750" fill="#B45309">互联网边界之外</text>
<text x="94" y="523" font-size="18" font-weight="780" fill="#0F172A">物理设备没有网络身份</text>
<text x="94" y="545" font-size="11.5" fill="#475569">数据仍停留在专用总线或本地控制系统，网页无法直接感知和驱动现场</text>

<g>
  <rect x="708" y="472" width="162" height="66" rx="11" fill="#FFFFFF" stroke="#D97706"/>

  <text x="771" y="521" font-size="10.5" fill="#475569">采集值不进互联网</text>

  <rect x="894" y="472" width="162" height="66" rx="11" fill="#FFFFFF" stroke="#D97706"/>
  <circle cx="925" cy="505" r="15" fill="#FFF7ED" stroke="#F97316"/>
  <path d="M917 512L925 497 933 512ZM925 497V491" fill="none" stroke="#F97316" stroke-width="2" stroke-linejoin="round"/>
  <text x="957" y="501" font-size="14" font-weight="750" fill="#0F172A">执行器</text>
  <text x="957" y="521" font-size="10.5" fill="#475569">无法被网页直接调用</text>
</g>

<path d="M600 421V443" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="540" y="428" width="120" height="23" rx="11" fill="#FFFFFF"/>
<text x="600" y="444" text-anchor="middle" font-size="10.5" font-weight="750" fill="#B45309">连接在这里中断</text>

<text x="600" y="590" text-anchor="middle" font-size="12" font-weight="750" fill="#0F766E">阶段结论：PC 互联网完成“人找信息”，尚未进入“物被感知、物可协同”</text>
<text x="600" y="644" text-anchor="middle" font-size="11.5" fill="#475569">图1-6 TCP/IP 连接用户、浏览器、万维网与信息内容；传感器和执行器仍处于互联网边界之外。</text>
</svg>
