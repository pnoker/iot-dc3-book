<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图1-6 四层物联网参考架构示意图</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图1-6 四层物联网参考架构示意图</title>
  <desc id="desc">读者应理解物联网系统由四个职责清晰且相互依赖的层次构成，安全作为一个跨越所有层的约束条件存在。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">

  
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图1-6 四层物联网参考架构示意图</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解物联网系统由四个职责清晰且相互依赖的层次构成，安全作为一个跨越所有层的约束条件存在。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LAYERED</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="layered">
  <!-- 连线先于卡片绘制 -->
  <!-- 上行数据流：橙色 -->
  <!-- 感知层 -> 网络层 -->
  <line x1="750" y1="577.5" x2="750" y2="537.5" stroke="#F97316" stroke-width="2"/>
  <!-- 网络层 -> 平台层 -->
  <line x1="750" y1="457.5" x2="750" y2="417.5" stroke="#F97316" stroke-width="2"/>
  <!-- 平台层 -> 应用层 -->
  <line x1="750" y1="337.5" x2="750" y2="297.5" stroke="#F97316" stroke-width="2"/>
  <!-- 下行指令流：蓝色 -->
  <!-- 应用层 -> 平台层 -->
  <line x1="1050" y1="297.5" x2="1050" y2="337.5" stroke="#2563EB" stroke-width="2"/>
  <!-- 平台层 -> 网络层 -->
  <line x1="1050" y1="417.5" x2="1050" y2="457.5" stroke="#2563EB" stroke-width="2"/>
  <!-- 网络层 -> 感知层 -->
  <line x1="1050" y1="537.5" x2="1050" y2="577.5" stroke="#2563EB" stroke-width="2"/>

  <!-- 安全条带（金色竖条） -->
  <rect x="660" y="217.5" width="30" height="440" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" rx="4"/>
  <text x="675" y="440" transform="rotate(-90,675,440)" font-size="16" font-weight="bold" fill="#D97706" text-anchor="middle">安全</text>

  <!-- 层卡片 -->
  <!-- 应用层 -->
  <rect x="700" y="217.5" width="400" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="243.5" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">应用层</text>
  <text x="900" y="266.5" fill="#475569" font-size="12" text-anchor="middle">仪表盘、移动App、业务后端</text>

  <!-- 平台层 -->
  <rect x="700" y="337.5" width="400" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="900" y="363.5" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">平台层</text>
  <text x="900" y="386.5" fill="#475569" font-size="12" text-anchor="middle">设备管理、数据存储与流处理、API网关</text>

  <!-- 网络层 -->
  <rect x="700" y="457.5" width="400" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="900" y="483.5" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">网络层</text>
  <text x="900" y="506.5" fill="#475569" font-size="12" text-anchor="middle">MQTT、CoAP、LoRaWAN、NB-IoT</text>

  <!-- 感知层 -->
  <rect x="700" y="577.5" width="400" height="80" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="900" y="603.5" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">感知层</text>
  <text x="900" y="626.5" fill="#475569" font-size="12" text-anchor="middle">传感器、执行器</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">橙色箭头：上行数据流</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色箭头：下行指令流</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">金色竖条：安全贯穿线</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图1-4 四层物联网参考架构。数据从感知层上行至应用层，指令以相反方向下行，形成闭环控制。安全条带从左侧贯穿，跨越所有层次。</text>
  </svg>
</svg>
    <section class="meta" style="display:none">
      <div class="card"><div class="label">图表类型</div><div class="value">layered</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">从下到上垂直堆叠，左侧标出贯穿的安全条带</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
