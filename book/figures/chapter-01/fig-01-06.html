<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图1-6 PC互联网时代连接架构</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图1-6 PC互联网时代连接架构</title>
  <desc id="desc">PC互联网时代的四层连接架构与未连接的物理世界</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图1-6 PC互联网时代连接架构</text>
    <text x="88" y="64" font-size="12" fill="#64748B">用户—桌面PC—万维网—信息内容四层链路，物尚未接入</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>
<defs>
<marker id="ab" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#2563EB"/></marker>
<marker id="ao" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#F97316"/></marker>
<marker id="at" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#0F766E"/></marker>
<marker id="ar" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#DC2626"/></marker>
<marker id="ap" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#7C3AED"/></marker>
<marker id="ag" markerWidth="15" markerHeight="15" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7 L0,15 z" fill="#475569"/></marker>
</defs>
<!-- 用户 -->
<rect x="60" y="220" width="200" height="220" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<circle cx="160" cy="285" r="30" fill="#BFDBFE" stroke="#2563EB" stroke-width="2"/>
<path d="M100,360 q60,-55 120,0" fill="none" stroke="#2563EB" stroke-width="3"/>
<text x="160" y="415" font-size="22" font-weight="700" fill="#1D4ED8" text-anchor="middle">用户</text>
<!-- 桌面PC -->
<rect x="340" y="220" width="240" height="220" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<rect x="370" y="258" width="180" height="90" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<rect x="400" y="336" width="120" height="14" rx="4" fill="#94A3B8"/>
<text x="460" y="395" font-size="22" font-weight="700" fill="#1D4ED8" text-anchor="middle">桌面 PC</text>
<text x="460" y="425" font-size="16" fill="#475569" text-anchor="middle">浏览器 Netscape / IE</text>
<!-- 万维网 -->
<rect x="660" y="200" width="280" height="260" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
<ellipse cx="800" cy="300" rx="105" ry="70" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
<ellipse cx="800" cy="300" rx="60" ry="40" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="800" y="305" font-size="24" font-weight="700" fill="#334155" text-anchor="middle">WWW</text>
<text x="800" y="440" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">万维网</text>
<!-- 信息内容 -->
<rect x="1030" y="220" width="230" height="220" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<rect x="1060" y="260" width="170" height="26" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.4"/>
<rect x="1070" y="300" width="150" height="26" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.4"/>
<rect x="1080" y="340" width="130" height="26" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.4"/>
<text x="1145" y="405" font-size="22" font-weight="700" fill="#1D4ED8" text-anchor="middle">信息内容</text>
<text x="1145" y="433" font-size="15" fill="#475569" text-anchor="middle">多个网页</text>
<!-- 链路箭头 -->
<line x1="260" y1="330" x2="326" y2="330" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ab)"/>
<text x="293" y="305" font-size="15" fill="#475569" text-anchor="middle">用户操作</text>
<line x1="580" y1="330" x2="646" y2="330" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ab)"/>
<text x="613" y="305" font-size="15" fill="#475569" text-anchor="middle">HTTP 请求</text>
<line x1="940" y1="330" x2="1016" y2="330" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ab)"/>
<text x="978" y="305" font-size="15" fill="#475569" text-anchor="middle">检索返回</text>
<!-- 搜索引擎/门户 -->
<rect x="860" y="480" width="280" height="46" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/>
<text x="1000" y="510" font-size="18" fill="#334155" text-anchor="middle">搜索引擎 / 门户（索引与检索）</text>
<!-- TCP/IP 底座 -->
<rect x="60" y="560" width="1200" height="150" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" stroke-dasharray="8,6"/>
<text x="660" y="625" font-size="24" font-weight="700" fill="#1D4ED8" text-anchor="middle">TCP/IP 协议族</text>
<text x="660" y="665" font-size="18" fill="#475569" text-anchor="middle">为信息传输与设备互通提供通信基础</text>
<!-- 物（未连接） -->
<rect x="1340" y="560" width="420" height="150" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="2" stroke-dasharray="8,6"/>
<text x="1550" y="615" font-size="22" font-weight="700" fill="#C2410C" text-anchor="middle">物（未连接）</text>
<text x="1550" y="655" font-size="17" fill="#475569" text-anchor="middle">传感器 / 执行器</text>
<!-- 断开线 -->
<line x1="1260" y1="440" x2="1490" y2="556" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="7,6" marker-end="url(#ar)"/>
<text x="1340" y="500" font-size="16" fill="#DC2626" text-anchor="middle">尚未接入</text>
<!-- 图例 -->
<rect x="40" y="730" width="1720" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<line x1="90" y1="778" x2="150" y2="778" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ab)"/>
<text x="165" y="784" font-size="17" fill="#475569">实线单箭头：数据请求 / 响应路径</text>
<line x1="560" y1="778" x2="620" y2="778" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="7,6"/>
<text x="635" y="784" font-size="17" fill="#475569">虚线：尚未连接的物理世界</text>
<rect x="1090" y="760" width="26" height="26" rx="4" fill="#FFF7ED" stroke="#F97316" stroke-width="1.4"/>
<text x="1130" y="784" font-size="17" fill="#475569">浅橙填充：待纳入联网范围的区域</text>
<text x="900" y="948" font-size="18" fill="#475569" text-anchor="middle">图1-6 PC互联网时代连接架构。主链路为「用户—桌面PC（浏览器）—万维网—信息内容」，底层为 TCP/IP 协议族；</text>
<text x="900" y="974" font-size="18" fill="#475569" text-anchor="middle">右下角虚线框标注传感器 / 执行器尚未接入互联网，与后续物联网场景形成鲜明对比。</text>
  </svg>
</svg>
  </main>
</body>
</html>
