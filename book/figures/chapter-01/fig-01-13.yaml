type: framework
title: 图1-13 成长期：各国战略布局与产业落地
audience_takeaway: 读者应理解 2009—2019 成长期由政策铺路与产业落地叠加驱动，三条战略路径和两大产业引擎共同把物联网推向工程部署。
purpose: 对比日本 u-Japan、美国智慧地球、中国感知中国三条战略路径，并展示智能家居与车联网两大产业引擎。
visual_focus: 三条战略路径向下承接带，再到两大产业引擎的层级关系。
design_level: logical
layout: 上排三张战略卡片 + 中间承接带 + 下排两张产业卡片，底部结论条。
elements:
- 日本：u-Japan（2004），泛在网络社会，政府规划+产业协同
- 美国：智慧地球（2009），智能基础设施，产业主导、政策辅助
- 中国：感知中国（2009），战略新兴产业，顶层设计、行政推动
- 智能家居：智能温控器自主学习，消费者首次认可「物能省事」
- 车联网：3G/4G+GPS，OTA 升级支撑自动驾驶数据积累
relationships:
- 三条战略路径向下铺路，两大产业引擎向上验证商业逻辑
- 重复建设与标准不通，把问题指向可规模化复用的平台体系
render_notes: 战略卡片 + 产业卡片的分层框架，语义色蓝/青/橙。完整 HTML 见 figures/chapter-01/fig-01-13.html。
caption:
  zh: 图1-13 成长期：各国战略布局与产业落地。u-Japan、智慧地球、感知中国三条路径向下铺路，智能家居与车联网两大引擎验证商业逻辑——但重复建设与标准不通，把问题指向平台体系。
  en: 'Figure 1-13 The growth period: national strategies and industrial landing. u-Japan, Smarter Planet, and Sensing China paved the way downward while smart home and connected cars — the two industrial engines — validated the business logic. Yet duplicated construction and incompatible standards point the problem toward a platform system.'
