  <text x="600" y="798" font-size="11" text-anchor="middle" fill="#475569">图1-21 未来展望：AIoT 融合的三个方向。AGI 意图理解、数字孪生预测干预、M2M 自主协商，共同把设备从被动连接节点变为主动智能体。</text>
