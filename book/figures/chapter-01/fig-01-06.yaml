    用户操作: User operates
    HTTP 请求: HTTP request
    检索返回: Results returned
    搜索引擎 / 门户（索引与检索）: Search engine / portal (index & search)
    TCP/IP 协议族: TCP/IP Protocol Suite
    为信息传输与设备互通提供通信基础: Communication base for content delivery and device interop
    物（未连接）: Things (not connected)
    传感器 / 执行器: Sensors / Actuators
    尚未接入: Not yet connected
    实线单箭头：数据请求 / 响应路径: 'Solid arrow: data request/response path'
    虚线：尚未连接的物理世界: 'Dashed: physical world not yet connected'
    浅橙填充：待纳入联网范围的区域: 'Light orange: area yet to be brought online'
    图1-6 PC互联网时代连接架构。主链路为「用户—桌面PC（浏览器）—万维网—信息内容」，底层为 TCP/IP 协议族；: 'Figure 1-6 Connection architecture of the PC-Internet era. Main chain: user — desktop PC (browser) — WWW — content, on a base of the TCP/IP protocol suite;'
    右下角虚线框标注传感器 / 执行器尚未接入互联网，与后续物联网场景形成鲜明对比。: a dashed box marks sensors/actuators as not yet online — a sharp contrast with the IoT scenes that follow.
