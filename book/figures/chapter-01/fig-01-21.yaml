type: architecture
title: 图1-21 未来展望：AIoT 融合的三个方向
audience_takeaway: AIoT 的三个演进方向都必须落到受治理协作：模型生成候选，策略与确定性系统约束行动，反馈成为后续评测的证据。
purpose: 展示 AIoT 融合的三个方向，并用智慧城市闭环示意场景说明「感知→推理→受控协调→反馈」的治理边界。
visual_focus: 三个方向模块 + 智慧城市四节点闭环（含回传箭头）。
design_level: logical
layout: 上排三个方向卡片 + 下排智慧城市闭环四节点，底部结论条。
elements:
- AGI 进入物联网：从执行指令到理解意图，多模态中控解析模糊意图
- 数字孪生预测干预：从状态同步到主动干预，虚拟先推演再物理执行
- M2M 受控协同：从中心调度到策略协作，故障时按白名单调整
- 智慧城市闭环：感知（摄像头+地磁）→ 边缘决策 → M2M 协调（信号灯+公交）→ 孪生回传
relationships:
- 三方向并列，共同指向「泛在智联」
- 感知与候选生成可由事件触发，行动服从策略、授权与审计
render_notes: 三方向卡片 + 四节点闭环（含虚线回传箭头），语义色蓝/青/橙/紫。完整 HTML 见 figures/chapter-01/fig-01-21.html。
caption:
  zh: 图1-21 未来展望：AIoT 融合走向意图理解、数字孪生预测辅助与 M2M 受控协同；模型生成候选，确定性系统守住行动边界。
  en: 'Figure 1-21 Outlook: AIoT convergence advances toward intent understanding, digital-twin predictive assistance, and governed M2M collaboration; models generate candidates while deterministic systems preserve the action boundary.'
