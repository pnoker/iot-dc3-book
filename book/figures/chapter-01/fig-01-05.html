<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图1-5 物联网系统五要素关系示意</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图1-5 物联网系统五要素关系示意</title>
  <desc id="desc">左右两列对比：左侧规则驱动（蓝）为感知-响应，右侧大模型驱动（橙）为理解-决策-确认，并对高风险动作保留人工二次确认。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="66.400" width="1152.000" height="627.200" viewBox="0 0 1800.000 980.000" preserveAspectRatio="xMidYMid meet">

  

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1800" height="980" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="42" r="6" fill="#2563EB"/>
  <text x="84" y="48" font-size="22" font-weight="700" fill="#0F172A">图1-5 物联网系统五要素关系示意</text>
  <text x="84" y="72" font-size="12" fill="#64748B">对比传统规则引擎与大模型推理两种物联网决策链路，突出从被动响应到主动推理的范式变化</text>

  <rect x="1658" y="28" width="104" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1710" y="47" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">FLOWCHART</text>

  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Lane boundaries ===== -->
  <rect x="80" y="130" width="780" height="545" rx="12" fill="#2563EB" fill-opacity="0.022" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="940" y="130" width="780" height="545" rx="12" fill="#F59E0B" fill-opacity="0.028" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- Lane headers (overlap top border) -->
  <rect x="370" y="118" width="200" height="34" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="470" y="141" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">规则驱动 · RULE</text>
  <rect x="1180" y="118" width="200" height="34" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1280" y="141" font-size="14" font-weight="700" fill="#F59E0B" text-anchor="middle">大模型驱动 · LLM</text>

  <!-- ===== Layer tags (left rail) ===== -->
  <g font-size="11" font-weight="700">
    <!-- left lane -->
    <text x="100" y="219" fill="#2563EB">① 交互</text>
    <text x="100" y="374" fill="#2563EB">② 决策</text>
    <text x="100" y="549" fill="#2563EB">③ 执行</text>
    <!-- right lane -->
    <text x="960" y="219" fill="#F59E0B">① 交互</text>
    <text x="960" y="374" fill="#F59E0B">② 决策</text>
    <text x="960" y="549" fill="#F59E0B">③ 执行</text>
  </g>

  <!-- ===== LEFT LANE: 规则驱动 (blue) ===== -->
  <!-- Row 1: 设备事件感知 -->
  <rect x="310" y="180" width="320" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="470" y="210" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">设备事件感知</text>
  <text x="470" y="231" font-size="10" fill="#64748B" text-anchor="middle">阈值触发 · 状态变更 · 事件上报</text>

  <!-- arrow row1 -> diamond -->
  <line x1="470" y1="250" x2="470" y2="306" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- Row 2: 规则匹配 diamond -->
  <polygon points="470,310 610,370 470,430 330,370" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="470" y="366" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">规则匹配?</text>
  <text x="470" y="386" font-size="10" fill="#64748B" text-anchor="middle">IF-THEN 条件引擎</text>

  <!-- side branch: 未匹配 -> 记录/忽略 -->
  <line x1="330" y1="370" x2="296" y2="370" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="312" y="361" font-size="9" fill="#64748B" text-anchor="middle">未匹配</text>
  <rect x="180" y="350" width="116" height="40" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="238" y="367" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">记录 / 忽略</text>
  <text x="238" y="382" font-size="9" fill="#64748B" text-anchor="middle">不触发动作</text>

  <!-- arrow diamond -> row3 (匹配) -->
  <line x1="470" y1="430" x2="470" y2="506" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="486" y="471" font-size="10" font-weight="700" fill="#2563EB">匹配</text>

  <!-- Row 3: 自动执行 -->
  <rect x="310" y="510" width="320" height="70" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="470" y="540" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">自动执行</text>
  <text x="470" y="561" font-size="10" fill="#64748B" text-anchor="middle">开关 · 告警 · 场景联动</text>

  <!-- ===== RIGHT LANE: 大模型驱动 (orange) ===== -->
  <!-- Row 1: 意图理解 -->
  <rect x="1130" y="180" width="300" height="70" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1280" y="210" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">意图理解</text>
  <text x="1280" y="231" font-size="10" fill="#64748B" text-anchor="middle">自然语言 · 多模态输入</text>

  <!-- arrow row1 -> diamond -->
  <line x1="1280" y1="250" x2="1280" y2="306" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>

  <!-- Row 2: LLM 推理 diamond -->
  <polygon points="1280,310 1420,370 1280,430 1140,370" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1280" y="366" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">LLM 推理</text>
  <text x="1280" y="386" font-size="10" fill="#64748B" text-anchor="middle">上下文 + 概率决策</text>

  <!-- 用户确认 ellipse (high-risk branch) -->
  <ellipse cx="1600" cy="370" rx="100" ry="44" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-width="2"/>
  <text x="1600" y="366" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">用户确认</text>
  <text x="1600" y="385" font-size="10" fill="#64748B" text-anchor="middle">人工二次确认</text>

  <!-- branch diamond -> ellipse (高风险, dashed) -->
  <line x1="1420" y1="370" x2="1496" y2="370" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <text x="1458" y="361" font-size="9" font-weight="700" fill="#F59E0B" text-anchor="middle">高风险</text>

  <!-- arrow diamond -> row3 (低风险, solid) -->
  <line x1="1280" y1="430" x2="1280" y2="506" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
  <text x="1298" y="471" font-size="10" font-weight="700" fill="#F59E0B">低风险</text>

  <!-- ellipse return path -> execute (确认后执行, dashed) -->
  <path d="M 1600 414 L 1600 486 L 1316 486 L 1316 506" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <text x="1480" y="479" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">确认后执行</text>

  <!-- Row 3: 执行 / 委派 -->
  <rect x="1130" y="510" width="300" height="70" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1280" y="540" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">执行 / 委派</text>
  <text x="1280" y="561" font-size="10" fill="#64748B" text-anchor="middle">动作 + 可回溯 · 可解释</text>

  <!-- ===== Bottom comparison bar (paradigm shift) ===== -->
  <rect x="80" y="700" width="1640" height="78" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- left half: 被动响应 -->
  <rect x="100" y="716" width="760" height="46" rx="6" fill="#2563EB" fill-opacity="0.08"/>
  <text x="480" y="736" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">被动响应 — 感知 → 响应</text>
  <text x="480" y="754" font-size="10" fill="#475569" text-anchor="middle">规则引擎 · 确定性 · 即时触发</text>

  <!-- right half: 主动推理 -->
  <rect x="940" y="716" width="760" height="46" rx="6" fill="#F59E0B" fill-opacity="0.10"/>
  <text x="1320" y="736" font-size="15" font-weight="700" fill="#F59E0B" text-anchor="middle">主动推理 — 理解 → 决策 → 确认</text>
  <text x="1320" y="754" font-size="10" fill="#475569" text-anchor="middle">大模型 · 概率推理 · 高风险人工把关</text>

  <!-- center transition arrow -->
  <text x="900" y="694" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">范式转变</text>
  <line x1="870" y1="739" x2="928" y2="739" stroke="#64748B" stroke-width="2.5" marker-end="url(#ah-gray)"/>

  <!-- ===== Legend ===== -->
  <g font-size="11" fill="#475569">
    <rect x="120" y="812" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="144" y="823">规则驱动主链路</text>

    <rect x="320" y="812" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="344" y="823">大模型驱动主链路</text>

    <line x1="540" y1="818" x2="572" y2="818" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="580" y="823">异步 / 确认回传</text>

    <polygon points="760,810 774,818 760,826 746,818" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <text x="784" y="823">决策节点</text>

    <ellipse cx="900" cy="818" rx="14" ry="8" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="922" y="823">人工确认节点</text>

    <line x1="1060" y1="818" x2="1092" y2="818" stroke="#2563EB" stroke-width="2"/>
    <text x="1100" y="823">主链路（实线）</text>
  </g>

  <!-- ===== Caption ===== -->
  <text x="900" y="945" font-size="10" fill="#94A3B8" text-anchor="middle">图1-3 左侧规则驱动为“感知-响应”，右侧大模型驱动为“理解-决策-确认”。大模型在决策层引入上下文理解与概率推理，并对高风险动作保留人工二次确认。</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">architecture</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">水平分层架构图，顶层从左至右依次为感知→传输→处理→应用四个模块串联，安全层作为一个贯穿底部的横向长条矩形，垂直覆盖上方四个模块。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
