<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图1-2 工业软件的结构性局限：三条裂缝</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:#F8FAFC}
    main.figure{width:1200px;height:820px;margin:0;font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif}
    svg{display:block}text{letter-spacing:0}
  </style>
</head>
<body>
<main class="figure" data-figure-root>
<svg width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="ft fd" xmlns="http://www.w3.org/2000/svg">
  <title id="ft">图1-2 工业软件的结构性局限：三条裂缝</title>
  <desc id="fd">在 ISA-95 金字塔上标注三道无法靠升级版本解决的架构裂缝：数据被层级隔断、决策规则写死在代码里、系统封闭为孤岛；这三条裂缝驱动了从工业软件到物联网平台的跃迁。</desc>

  <rect width="1200" height="820" fill="#F8FAFC"/>

  <!-- 标题区 -->
  <circle cx="48" cy="42" r="6" fill="#2563EB"/>
  <text x="66" y="49" font-size="24" font-weight="700" fill="#0F172A">图1-2 工业软件的结构性局限：三条裂缝</text>
  <text x="66" y="73" font-size="13" fill="#475569">四层金字塔在 21 世纪暴露出三个无法靠"升级版本"解决的架构矛盾</text>
  <line x1="32" y1="88" x2="1168" y2="88" stroke="#CBD5E1"/>
  <rect x="24" y="104" width="1152" height="640" rx="8" fill="#FFFFFF"/>

  <!-- 左侧：金字塔轮廓（淡色）+ 三条裂缝 -->
  <!-- 裂缝③ 封闭孤岛：金字塔外围虚线墙（紫）-->
  <rect x="100" y="150" width="440" height="430" rx="10" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="140" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">私有网络 · 私有协议 · 私有格式</text>

  <!-- 金字塔 4 层（淡色轮廓，中心 x=320）-->
  <path d="M250 180 L390 180 L410 260 L230 260 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="226" font-size="12" fill="#94A3B8" text-anchor="middle">L4 ERP</text>
  <path d="M230 260 L410 260 L430 340 L210 340 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="306" font-size="12" fill="#94A3B8" text-anchor="middle">L3 MES</text>
  <path d="M210 340 L430 340 L450 420 L190 420 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="386" font-size="12" fill="#94A3B8" text-anchor="middle">L2 SCADA</text>
  <path d="M190 420 L450 420 L470 500 L170 500 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="320" y="466" font-size="12" fill="#94A3B8" text-anchor="middle">L1 PLC</text>

  <!-- 裂缝① 数据隔断：L2-L3 间横向锯齿断裂（红）-->
  <path d="M170 500 L470 500 L470 500" fill="none"/>
  <path d="M200 340 L210 332 L222 344 L234 332 L246 344 L258 332 L270 344 L282 332 L294 344 L306 332 L318 344 L330 332 L342 344 L354 332 L366 344 L378 332 L390 344 L402 332 L414 344 L426 332 L440 340"
        fill="none" stroke="#DC2626" stroke-width="3"/>
  <circle cx="470" cy="340" r="13" fill="#DC2626"/><text x="470" y="345" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- 裂缝② 规则写死：L1 层锁图标（橙）-->
  <g transform="translate(290 432)">
    <rect x="0" y="14" width="60" height="44" rx="5" fill="#EA580C"/>
    <path d="M12 14 V6 a18 18 0 0 1 36 0 V14" fill="none" stroke="#EA580C" stroke-width="5"/>
    <text x="30" y="42" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <circle cx="470" cy="466" r="13" fill="#EA580C"/><text x="470" y="471" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- 裂缝③ 标号（紫，在外墙上）-->
  <circle cx="520" cy="170" r="13" fill="#7C3AED"/><text x="520" y="175" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- 外部 AI 被隔绝在墙外 -->
  <g transform="translate(40 560)">
    <rect x="0" y="0" width="120" height="46" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <text x="60" y="20" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">外部 AI / 智能体</text>
    <text x="60" y="36" font-size="10" fill="#94A3B8" text-anchor="middle">无法安全接入</text>
  </g>
  <text x="175" y="588" font-size="20" fill="#94A3B8">⇠ ⃠</text>

  <!-- 右侧：三条裂缝详解卡片 -->
  <!-- 卡片① -->
  <rect x="600" y="130" width="552" height="160" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <circle cx="628" cy="160" r="16" fill="#DC2626"/><text x="628" y="166" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="658" y="166" font-size="16" font-weight="700" fill="#0F172A">数据被层级隔断，跨层联动靠人</text>
  <text x="624" y="200" font-size="12" fill="#334155">振动数据在 SCADA、维护记录在 MES、备件成本在 ERP——三者没有自动通路。</text>
  <text x="624" y="222" font-size="12" fill="#334155">想回答"换备件后电机振动有改善吗"，要从三个系统导出 CSV，用 Excel 手工对齐。</text>
  <text x="624" y="252" font-size="12" font-weight="700" fill="#B91C1C">层与层的格式转换、语义映射、时间对齐，全部依赖人工。</text>

  <!-- 卡片② -->
  <rect x="600" y="310" width="552" height="160" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <circle cx="628" cy="340" r="16" fill="#EA580C"/><text x="628" y="346" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="658" y="346" font-size="16" font-weight="700" fill="#0F172A">决策规则写死在代码里，环境一变就过时</text>
  <text x="624" y="380" font-size="12" fill="#334155">PLC 梯形图、SCADA 告警规则、MES 排程算法——部署时一行行写死。</text>
  <text x="624" y="402" font-size="12" fill="#334155">工况变了、产品换了、设备老了，就要有人重新编程；老师傅退休，经验无法"拷贝"。</text>
  <text x="624" y="432" font-size="12" font-weight="700" fill="#C2410C">只能匹配预设条件，不能自己归纳新规则。</text>

  <!-- 卡片③ -->
  <rect x="600" y="490" width="552" height="160" rx="8" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="628" cy="520" r="16" fill="#7C3AED"/><text x="628" y="526" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="658" y="526" font-size="16" font-weight="700" fill="#0F172A">系统是封闭孤岛，外部智能无法安全接入</text>
  <text x="624" y="560" font-size="12" fill="#334155">私有网络、私有协议、私有数据格式。外部 AI 想查设备状态、下发一条校验指令——</text>
  <text x="624" y="582" font-size="12" fill="#334155">要为每个品牌 PLC 写适配器、每种 SCADA 写 SQL、每个 MES API 写包装器。</text>
  <text x="624" y="612" font-size="12" font-weight="700" fill="#6D28D9">这不是技术对接，而是巴别塔式的语义翻译工程。</text>

  <!-- 底部：跃迁 -->
  <rect x="24" y="664" width="1152" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text x="600" y="690" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">正是这三条裂缝，驱动了"从工业软件到 IoT 平台"的跃迁：数据归一 · 能力开放 · 闭环自动化（见 1.1.4）</text>
  <text x="600" y="710" font-size="11" fill="#475569" text-anchor="middle">物联网平台要补的不是"把设备连上网"，而是把以人为中心的信息架构升级为以数据-智能为中心</text>

  <!-- 底部图题（居中，与 fig-01-03 等统一）-->
  <line x1="32" y1="742" x2="1168" y2="742" stroke="#CBD5E1"/>
  <text x="600" y="773" font-size="12" font-weight="700" text-anchor="middle" fill="#DC2626">三条无法靠"升级版本"解决的架构裂缝</text>
  <text x="600" y="798" font-size="11" text-anchor="middle" fill="#475569">图1-2 工业软件的结构性局限：三条裂缝。</text>
</svg>
</main>
</body>
</html>
