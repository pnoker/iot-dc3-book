<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图1-2 PC互联网时代连接架构</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图1-2 PC互联网时代连接架构</title>
  <desc id="desc">展示PC互联网时代用户—PC—万维网—信息的连接链路，突出物设备（传感器/执行器）尚未纳入联网范围，为后续物联网连接范式对比做铺垫。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="0" y="0" width="1200" height="760" viewBox="0 0 1800 900" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <linearGradient id="tcpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="55%" stop-color="#BFDBFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="cloudShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="5" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
</defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="900" fill="#F8FAFC"/>

  <!-- ===== title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="48" font-size="22" font-weight="700" fill="#0F172A">图1-2 PC互联网时代连接架构</text>
  <text x="84" y="72" font-size="12" fill="#64748B">用户—桌面PC（浏览器）—万维网—信息内容 四层连接链路；物（传感器/执行器）尚未接入互联网</text>
  <rect x="1560" y="30" width="170" height="34" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1645" y="51" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="2">ARCHITECTURE</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Node 1: 用户 ===== -->
  <g>
    <rect x="150" y="240" width="190" height="190" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <!-- abstract person icon -->
    <circle cx="245" cy="290" r="26" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
    <ellipse cx="245" cy="372" rx="38" ry="34" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="245" y="416" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">用户</text>
  </g>

  <!-- ===== Node 2: 桌面PC ===== -->
  <g>
    <rect x="400" y="190" width="280" height="260" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <!-- monitor -->
    <rect x="465" y="225" width="165" height="115" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="475" y="235" width="145" height="88" rx="4" fill="#F1F5F9"/>
    <rect x="475" y="235" width="145" height="16" rx="4" fill="#E2E8F0"/>
    <circle cx="486" cy="243" r="2.5" fill="#94A3B8"/>
    <circle cx="497" cy="243" r="2.5" fill="#94A3B8"/>
    <circle cx="508" cy="243" r="2.5" fill="#94A3B8"/>
    <!-- browser window glyph -->
    <rect x="535" y="258" width="24" height="18" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <circle cx="542" cy="267" r="2" fill="#2563EB"/>
    <line x1="550" y1="265" x2="555" y2="265" stroke="#2563EB" stroke-width="1.5"/>
    <text x="547" y="306" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Netscape / IE</text>
    <!-- monitor stand -->
    <rect x="535" y="340" width="24" height="14" fill="#94A3B8"/>
    <rect x="510" y="354" width="74" height="9" rx="3" fill="#94A3B8"/>
    <!-- tower -->
    <rect x="625" y="255" width="42" height="120" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="646" cy="280" r="5" fill="#2563EB"/>
    <rect x="632" y="300" width="28" height="5" rx="2" fill="#94A3B8"/>
    <line x1="634" y1="330" x2="658" y2="330" stroke="#94A3B8" stroke-width="2"/>
    <line x1="634" y1="340" x2="658" y2="340" stroke="#94A3B8" stroke-width="2"/>
    <text x="540" y="425" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">桌面PC</text>
  </g>

  <!-- ===== Node 3: 万维网 (cloud) ===== -->
  <g>
    <rect x="730" y="170" width="340" height="280" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <g filter="url(#cloudShadow)">
      <circle cx="975" cy="280" r="60" fill="#E2E8F0" fill-opacity="0.55" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="830" cy="285" r="55" fill="#E2E8F0" fill-opacity="0.55" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="900" cy="262" r="50" fill="#E2E8F0" fill-opacity="0.55" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="900" cy="315" r="140" fill="#E2E8F0" fill-opacity="0.55" stroke="#94A3B8" stroke-width="2"/>
    </g>
    <text x="900" y="335" font-size="34" font-weight="800" fill="#0F172A" text-anchor="middle">WWW</text>
    <text x="900" y="365" font-size="15" font-weight="600" fill="#475569" text-anchor="middle">万维网</text>
  </g>

  <!-- ===== Node 4: 搜索引擎/门户 ===== -->
  <g>
    <rect x="1100" y="230" width="160" height="200" rx="12" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
    <circle cx="1180" cy="278" r="13" fill="none" stroke="#F97316" stroke-width="3"/>
    <line x1="1189" y1="287" x2="1200" y2="298" stroke="#F97316" stroke-width="3" stroke-linecap="round"/>
    <text x="1180" y="342" font-size="16" font-weight="700" fill="#C2410C" text-anchor="middle">搜索引擎</text>
    <text x="1180" y="366" font-size="16" font-weight="700" fill="#C2410C" text-anchor="middle">门户</text>
  </g>

  <!-- ===== Node 5: 信息内容 ===== -->
  <g>
    <rect x="1290" y="190" width="250" height="260" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="1330" y="225" width="165" height="120" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="1350" y="245" width="165" height="120" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="1370" y="265" width="165" height="120" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
    <rect x="1390" y="285" width="90" height="8" rx="3" fill="#E2E8F0"/>
    <rect x="1390" y="305" width="125" height="8" rx="3" fill="#E2E8F0"/>
    <rect x="1390" y="325" width="70" height="8" rx="3" fill="#E2E8F0"/>
    <text x="1415" y="430" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">信息内容</text>
  </g>

  <!-- ===== relationships: solid data arrows ===== -->
  <line x1="340" y1="340" x2="400" y2="340" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="370" y="328" font-size="14" font-weight="600" fill="#2563EB" text-anchor="middle">操作</text>

  <line x1="680" y1="300" x2="730" y2="300" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="705" y="288" font-size="13" font-weight="600" fill="#2563EB" text-anchor="middle">HTTP 请求</text>

  <line x1="1070" y1="300" x2="1100" y2="300" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="1085" y="288" font-size="13" font-weight="600" fill="#2563EB" text-anchor="middle">检索</text>

  <line x1="1260" y1="300" x2="1290" y2="300" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="1275" y="288" font-size="13" font-weight="600" fill="#2563EB" text-anchor="middle">返回</text>

  <!-- ===== TCP/IP protocol family bar ===== -->
  <rect x="400" y="610" width="1140" height="100" rx="14" fill="url(#tcpGrad)" stroke="#3B82F6" stroke-width="2"/>
  <text x="970" y="665" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">TCP/IP 协议族</text>
  <text x="970" y="693" font-size="12" font-weight="500" fill="#1D4ED8" text-anchor="middle">TCP/IP Protocol Suite · 提供通信基础</text>
  <!-- support ticks from protocol bar up to nodes -->
  <line x1="540" y1="610" x2="540" y2="450" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>
  <line x1="900" y1="610" x2="900" y2="450" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>
  <line x1="1180" y1="610" x2="1180" y2="430" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>
  <line x1="1415" y1="610" x2="1415" y2="450" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>

  <!-- ===== 物（未连接）dashed region ===== -->
  <g>
    <rect x="1560" y="520" width="210" height="240" rx="14" fill="#FFF7ED" stroke="#F97316" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="1665" y="556" font-size="16" font-weight="700" fill="#C2410C" text-anchor="middle">物（未连接）</text>
    <text x="1665" y="574" font-size="9" font-weight="600" fill="#C2410C" text-anchor="middle" letter-spacing="1.5">THINGS · OFFLINE</text>
    <!-- sensor mini-panel -->
    <rect x="1585" y="596" width="160" height="66" rx="8" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
    <circle cx="1612" cy="629" r="9" fill="none" stroke="#F97316" stroke-width="2"/>
    <path d="M1604 622 a12 12 0 0 1 16 0 M1598 616 a19 19 0 0 1 28 0" fill="none" stroke="#F97316" stroke-width="2"/>
    <text x="1658" y="633" font-size="14" font-weight="600" fill="#C2410C" text-anchor="middle">传感器</text>
    <!-- actuator mini-panel -->
    <rect x="1585" y="676" width="160" height="66" rx="8" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
    <circle cx="1612" cy="709" r="10" fill="none" stroke="#F97316" stroke-width="2"/>
    <circle cx="1612" cy="709" r="3.5" fill="#F97316"/>
    <line x1="1612" y1="694" x2="1612" y2="688" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1625" y1="700" x2="1630" y2="696" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1625" y1="718" x2="1630" y2="722" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1658" y="713" font-size="14" font-weight="600" fill="#C2410C" text-anchor="middle">执行器</text>
    <!-- broken (disconnect) dashed line toward system, red X = no link -->
    <line x1="1665" y1="520" x2="1665" y2="405" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="1653" y1="467" x2="1677" y2="491" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <line x1="1677" y1="467" x2="1653" y2="491" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <text x="1678" y="452" font-size="13" font-weight="700" fill="#DC2626" text-anchor="middle">未连接</text>
  </g>

  <!-- ===== legend ===== -->
  <line x1="40" y1="800" x2="1760" y2="800" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="60" y1="828" x2="96" y2="828" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="104" y="832" font-size="13" fill="#475569">实线箭头：数据请求 / 响应路径</text>
  <line x1="320" y1="828" x2="356" y2="828" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="364" y="832" font-size="13" fill="#475569">虚线：尚未连接的物理世界</text>
  <rect x="640" y="820" width="18" height="15" rx="3" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="666" y="832" font-size="13" fill="#475569">浅橙框：待纳入联网范围的区域标签</text>

  <!-- ===== caption ===== -->
  <text x="900" y="874" font-size="12" fill="#64748B" text-anchor="middle">图1-2 主架构为“用户—桌面PC（浏览器）—万维网—信息内容”四层链路，底层 TCP/IP 协议族提供通信基础；右下角传感器、执行器以断开线标注尚未接入互联网。</text>
  </svg>
</svg>
    <section class="meta" style="display:none">
      <div class="card"><div class="label">图表类型</div><div class="value">architecture</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">从左至右四层：用户→桌面PC（含浏览器）→万维网云团→信息内容页图标；搜索引擎/门户竖框置于万维网与信息内容之间；底层为覆盖PC至信息内容的 TCP/IP 协议族蓝色渐变大矩形；右下角浅橙虚线框标注传感器与执行器。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">TCP/IP 区域蓝色系渐变，万维网浅灰半透明带阴影圆形，网页白色小矩形叠放；箭头 line 宽2.5px 末端三角形；虚线框 dasharray 8,5 浅橙填充；断开线加红色叉号表示未连接；中文标注 ≥14px。</div></div>
    </section>
  </main>
</body>
</html>
