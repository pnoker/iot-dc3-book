type: architecture
title: 图1-20 边云协同AIoT三级架构示意
audience_takeaway: 读者应理解云侧只下发量化剪枝模型并回收低置信度样本,边缘负责实时推理,端侧靠低功耗AI芯片本地响应,三层形成训练-推理-反馈闭环。
purpose: 展示AIoT中端、边、云三层之间的智能分工与数据流向，突出边缘计算作为实时推理载体的位置，以及模型下沉形成的闭环。
visual_focus: 从云层到边缘层：原始数据上报的主链路。
design_level: logical
layout: 自上而下三层水平带状布局。每层内放置矩形组件，层间用纵向箭头连接表示数据/模型流向。
elements:
- 云层：模型训练与更新、模型管理与分发、全局监控与运维
- 边缘层：边缘推理节点（如NVIDIA Jetson、华为Atlas）、本地数据缓存与预处理、样本回传通道
- 端层：智能传感器与执行器（含低功耗AI芯片）、数据采集与本地判断
relationships:
- 云层→边缘层：模型下发（经过量化、剪枝后的轻量模型通过安全信道下发）
- 边缘层→云层：样本回传（低置信度或新类别样本，附带原始特征值）
- 边缘层→端层：推理结果反馈（部分中间结果供端侧本地决策参考）
- 端层→边缘层：原始数据上报（经预处理后通过MQTT/CoAP协议上报）
