labels:
  en:
    图11-1 V2X通信技术选型决策路径图: 'Figure 11-1 V2X Technology Selection Decision Path'
    按时延划定技术代际，再由覆盖、演进与存量兼容条件收敛到 DSRC、LTE-V2X 或 NR-V2X 方案。: 'Latency sets the technology generation; coverage, evolution, and legacy fleets narrow it to DSRC, LTE-V2X, or NR-V2X.'
    按时延划定技术代际，再由覆盖、演进与存量兼容条件收敛方案: 'Latency sets the generation; coverage/evolution/legacy converge the choice'
    业务时延需求？: 'Required latency?'
    百毫秒级基础安全: '100 ms basic safety'
    安全预警 · 基础安全消息: 'Safety alerts · BSM'
    RSU 覆盖？: 'RSU coverage?'
    RSU 高密: 'Dense RSU'
    高密 RSU · 基础安全消息: 'Dense RSU · BSM'
    覆盖稀疏: 'Sparse coverage'
    Mode 4 直连 · 稀疏覆盖: 'Mode 4 direct · sparse coverage'
    毫秒级编队 / 高级驾驶: 'ms platooning / advanced driving'
    自动驾驶编队 · 高级驾驶: 'Platooning · advanced driving'
    演进预期？: 'Evolution plan?'
    三年内演进: 'Evolve in 3 yrs'
    毫秒级编队 · 高级驾驶: 'ms platooning · advanced driving'
    仅基础业务: 'Basic services'
    存量后装？: 'Legacy retrofit?'
    全新前装: 'All-new OEM fit'
    蜂窝直连 · 前装支持: 'Cellular direct · built-in'
    旧车队协同: 'Legacy fleet'
    多模方案: 'Multi-mode'
    DSRC / C-V2X 过渡兼容: 'DSRC / C-V2X transition'
    图11-1 时延决定技术代际，覆盖与存量条件进一步分流；频段合规和现场测试是所有结果的共同前提。: 'Figure 11-1 Latency sets the generation; coverage and legacy split the path — spectrum compliance and field tests apply to all outcomes.'
