type: sequence
title: 图11-5 火灾应急响应事件流转时序（假设场景）
purpose: 说明火灾事件从传感器报警到跨部门调度的消息传递顺序，突出边缘计算和自动路由对响应时间的压缩作用。
audience_takeaway: 自动化链路如何规避人工转接带来的延迟，以及边缘节点在压减感知到响应时间中的位置。
visual_focus: 从传感器报警到边缘判定再到自动路由的路径。
design_level: implementation
layout: 参与者横向排列，时间轴从上到下。主参与者在顶部，生命线向下延伸。
elements:
- 烟雾传感器
- 边缘计算节点
- 云端协同层
- 消防系统
- 交通系统
relationships:
- 烟雾传感器向边缘节点上报数据（温度、浓度）。
- 边缘节点运行规则引擎判定事件类型。
- 边缘节点向云端协同层推送事件摘要。
- 云端协同层根据事件路由表派发通知。
- 云端协同层分别向消防系统派单、向交通系统发送信号控制指令。
regions:
- id: seq_edge
  label: 设备与边缘域
  role: 现场探测与判断边界
- id: seq_cloud
  label: 云端协同域
  role: 跨部门路由边界
components:
- id: sensor
  label: 烟雾传感器
  type: edge
  subtitle: ''
  group: seq_edge
  priority: primary
  shape: actor
- id: edge_node
  label: 边缘计算节点
  type: edge
  subtitle: 本地规则引擎
  group: seq_edge
  priority: primary
  shape: card
- id: cloud_coord
  label: 云端协同层
  type: platform
  subtitle: 事件路由
  group: seq_cloud
  priority: primary
  shape: card
- id: fire_sys
  label: 消防系统
  type: application
  subtitle: ''
  group: seq_cloud
  priority: normal
  shape: card
- id: traffic_sys
  label: 交通系统
  type: application
  subtitle: ''
  group: seq_cloud
  priority: normal
  shape: card
connections:
- from: sensor
  to: edge_node
  label: 上报警值
  style: solid
  direction: request
- from: edge_node
  to: cloud_coord
  label: 推送事件摘要
  style: solid
  direction: request
- from: cloud_coord
  to: fire_sys
  label: 派单指令
  style: solid
  direction: request
- from: cloud_coord
  to: traffic_sys
  label: 信号控制指令
  style: solid
  direction: request
legend:
- 矩形=参与者；实线箭头=同步消息
visual_constraints:
- 最多6个参与者，标签简短。
- 图例放在底部。
render_notes: HTML/SVG渲染，参与者列于顶部，生命线向下延伸，实线箭头表示同步消息，内部处理使用自指虚线箭头。
caption:
  zh: 图11-5 自动化链路的关键在于边缘节点完成本地判定（第2步），云端协同层完成自动事件路由（第4步），两地均无人工转接环节。
  en: 'Figure 11-5 The key to the automated chain is local judgment at the edge node (step 2) and automatic event routing at the cloud coordination layer (step 4); neither step involves a manual hand-off.'
labels:
  en:
    图11-5 火灾应急响应事件流转时序（假设场景）: 'Figure 11-5 Fire Response Event Sequence (Hypothetical)'
    自动化链路如何规避人工转接带来的延迟，以及边缘节点在压减感知到响应时间中的位置。: 'How automation avoids manual hand-off delay, and where the edge node cuts sense-to-response time.'
    设备与边缘域: 'Device & Edge Domain'
    云端协同域: 'Cloud Coordination Domain'
    烟雾传感器: 'Smoke Sensor'
    边缘计算节点: 'Edge Node'
    本地规则引擎: 'Local rule engine'
    云端协同层: 'Cloud Coordination Layer'
    事件路由: 'Event routing'
    消防系统: 'Fire System'
    交通系统: 'Traffic System'
    1 上报警值: '1 Report alarm reading'
    3 推送事件摘要: '3 Push event summary'
    5a 派单指令: '5a Dispatch order'
    5b 信号控制指令: '5b Signal control command'
    2 判定事件类型: '2 Classify event type'
    4 自动事件路由: '4 Automatic event routing'
    矩形=参与者；实线箭头=同步消息: 'Boxes = participants; solid arrows = synchronous messages'
    图11-5 自动化链路的关键在于边缘节点完成本地判定（第2步），云端协同层完成自动事件路由（第4步），两地均无人工转接环节。: 'Figure 11-5 Local judgment at the edge node (step 2) and automatic routing in the cloud (step 4) — no manual hand-offs at either point.'
