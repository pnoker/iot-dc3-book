  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解新区城市大脑系统部署架构图中的主链路、责任边界和工程取舍。边的价值在于将延迟敏感的推理闭环做在本地，云的责任在于模型训练和跨部门路由。</text>
