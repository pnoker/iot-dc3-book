  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图11-10 新区城市大脑系统部署架构图（Project Horizon示意）。端-边-云三层结构，边缘节点承担推理与控制闭环，云层负责模型训练与跨部门协同。</text>
