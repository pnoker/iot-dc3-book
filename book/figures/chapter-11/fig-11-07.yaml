callouts:
- 消息队列作为缓冲层，允许消费端随意增减而不影响设备端写入。
- Flink检查点机制保证精确一次语义，是工程可恢复性的核心。
- Kafka traffic_raw Topic同时被Flink和Spark消费，体现了数据的单流多消费能力。
legend:
- 蓝色=平台层组件；青绿色=设备与边缘；橙色=AI/流处理；灰色=数据存储
- 实线箭头=主要数据流；虚线箭头=可选/归档路径
visual_constraints:
- 最多15个组件，跨四层；主要关注Kafka-traffic→Flink→Redis/TSDB的主链路。
- 图例在底部，不遮挡主体。
- 使用圆角矩形图标，箭头带短标签。
render_notes: HTML/SVG渲染，浅色背景，层用嵌入式背景框区分，节点间距适当，确保文字在移动端可读。箭头颜色与源节点一致，虚线用stroke-dasharray。图注置于底部。
caption:
  zh: 图11-7 展示设备层、消息队列、流处理层与存储服务层之间的数据流动。设备上报到Kafka，Flink消费后聚合写入Redis/时序DB；AI推理微服务通过RocketMQ接收控制指令。
  en: 'Figure 11-7 Data flows between the device layer, message queues, stream processing, and the storage/service layer. Devices report to Kafka; Flink consumes, aggregates, and writes to Redis and the time-series database; the AI inference microservice receives control commands through RocketMQ.'
