    灯杆: 'Poles'
    车载: 'Vehicle'
    负载均衡器: 'Load Balancer'
    MQTT Broker集群: 'MQTT Broker Cluster'
    Kafka 消息队列: 'Kafka Message Queue'
    持久化消息总线: 'Persistent message bus'
    流处理引擎: 'Stream Processing Engine'
    业务微服务: 'Business Microservices'
    时序数据库: 'Time-Series DB'
    实线箭头：数据流: 'Solid arrows: data flow'
    虚线箭头：控制流: 'Dashed arrows: control flow'
    圆形节点：终端设备: 'Circles: end devices'
    图11-6 百万级设备经负载均衡、消息队列和流处理分层接入，业务与时序数据按职责分流。: 'Figure 11-6 A million devices connect via load balancing, queues, and stream processing; business and time-series data split by duty.'
    设备侧发送心跳和订阅恢复指令。: 'Heartbeat & subscription-recovery commands to devices.'
