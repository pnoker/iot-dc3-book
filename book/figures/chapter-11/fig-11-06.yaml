- 实线箭头：数据流
- 虚线箭头：控制流
- 圆形节点：终端设备
- 矩形节点：服务端组件
- 菱形节点：消息队列
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: 使用SVG绘制三栏布局。设备层使用绿色圆形图标分组排列，每个图标标注“灯杆”“车载”“RSU”等。接入层使用三个橙色矩形，从左到右依次为“负载均衡器”“MQTT Broker集群”“消息队列”，矩形之间用实线箭头连接。处理层使用蓝色矩形（流处理引擎、时序数据库）和一个灰色矩形（业务微服务），箭头从消息队列同时指向流处理引擎和业务微服务，然后流处理引擎指向时序数据库。全图下方增加一条虚线控制流线，从MQTT集群回到设备层。颜色方案：设备层绿色，接入层橙色，处理层蓝色。建议在SVG中标注典型开源组件名称（EMQX、Kafka、Flink）。
caption:
  zh: 图11-6 城市物联网百万级接入系统架构图。负载均衡器按IP哈希分配设备连接到MQTT Broker集群；Broker将消息发布到Kafka分区；流处理引擎从Kafka消费并处理后写入时序数据库；业务微服务直接从Kafka消费特定主题处理非实时数据；虚线控制流表示Broker向设备侧发送心跳和订阅恢复指令。
  en: 'Figure 11-6 Architecture of a million-device city IoT access system. The load balancer assigns device connections to the MQTT broker cluster by IP hash; brokers publish messages into Kafka partitions; the stream processing engine consumes from Kafka and writes results to the time-series database; business microservices consume specific topics from Kafka directly for non-real-time data; the dashed control flow marks heartbeat and subscription-recovery messages from the broker to the device side.'
labels:
  en:
    图11-6 城市物联网百万级接入系统架构图: 'Figure 11-6 Million-Device City IoT Access Architecture'
    百万级设备经 NGINX 按 IP 哈希接入 EMQX 集群，消息入 Kafka 后双路分流——实时流经 Flink 聚合写入时序库，非实时流由业务微服务消费。: 'A million devices reach EMQX via NGINX IP hashing; after Kafka the flow splits — real-time through Flink into the TSDB, non-real-time to microservices.'
