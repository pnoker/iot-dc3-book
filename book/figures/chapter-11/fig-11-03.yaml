    云端层: 'Cloud Layer'
    照明控制 · 环境看板 · 安防告警 · 充电计费: 'Lighting control · env dashboard · security alerts · EV billing'
    图11-3 五类模块经边缘盒汇聚；高带宽视频就地推理，仅低频数据和结构化事件通过 MQTT 进入 IoT Hub。: 'Figure 11-3 Five module types converge on the edge box; high-bandwidth video is inferred in place, and only low-rate data and structured events reach the IoT Hub via MQTT.'
