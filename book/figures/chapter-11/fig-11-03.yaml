callouts:
- “环境传感器、照明、充电桩数据经边缘计算盒统一接入MQTT。”
- “AI摄像头视频流在边缘盒内完成推理，不上传裸流。”
legend:
- “青绿色 = 边缘设备；橙色 = AI推理；蓝色 = 平台服务。”
- “虚线 = 高频流本地终止；实线 = 数据上传或控制指令。”
visual_constraints:
- “节点标签用短名词，解释性文字放入callouts。”
- “图例置于底部，不遮挡主体。”
render_notes: “1. 标题行加‘(假设场景)’标识。2. 摄像头-边缘盒箭头中线标注‘本地推理’。3. 充电桩链路加锁图标表示TLS。4. IoT Hub与应用服务间用双向箭头。5. 三层用浅灰底色区分。6. 所有模块文字在14个汉字以内。”
caption:
  zh: 图11-3 视频等高频数据在杆内边缘计算盒本地消化，只输出结构化消息；低频传感与控制数据经MQTT上传——这是带宽与运维成本之间的工程折中。
  en: 'Figure 11-3 High-frequency video is digested locally by the on-pole edge box, which outputs structured messages only; low-frequency sensing and control data go up over MQTT — an engineering trade-off between bandwidth and operations cost.'
labels:
