    五类杆载模块经边缘盒汇聚，高带宽视频就地推理，仅低频数据和结构化事件通过 MQTT 进入 IoT Hub。: 'Five pole modules converge on the edge box; video is inferred locally; only low-rate data and structured events reach the IoT Hub.'
    多协议杆载设备在边缘汇聚，视频只上传推理后的结构化结果: 'Multi-protocol pole devices converge at the edge; only structured inference results are uploaded'
    挂载层 · 五类模块: 'Mounting Layer · Five Modules'
    智能照明: 'Smart Lighting'
    DALI · 调光执行: 'DALI · dimming actuator'
    AI 摄像头: 'AI Camera'
    环境传感器组: 'Env Sensor Array'
    充电桩: 'EV Charger'
    CAN · 计费鉴权: 'CAN · billing & auth'
    5G 微基站: '5G Micro Cell'
    SFP · 通信补盲: 'SFP · coverage fill-in'
    Modbus RTU · 1条/分钟: 'Modbus RTU · 1 msg/min'
    RTSP 本地推理（12 fps）: 'RTSP local inference (12 fps)'
    边缘计算层: 'Edge Computing Layer'
    边缘计算盒 · ARM + NPU: 'Edge Box · ARM + NPU'
    协议适配 · 本地控制 · 数据聚合: 'Protocol adaptation · local control · data aggregation'
    摄像头本地推理：视频不上传 → 车流统计 / 异常事件 / 特征码: 'Local camera inference: no video upload → traffic counts / events / feature codes'
