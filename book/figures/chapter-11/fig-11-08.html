  <desc id="desc">延迟敏感任务逐层就近处理，数据逐层上行，云端负责全域训练与策略协调并向边缘下发模型。</desc>

    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F97316"/></marker>

  <text x="1580" y="261" font-size="11" font-weight="700" fill="#2563EB">压缩统计 / 预测结果</text>
  <text x="1580" y="560" font-size="12" font-weight="700" fill="#2563EB">数据上行：逐层聚合压缩</text>

  <line x1="240" y1="235" x2="240" y2="273" stroke="#F97316" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah-orange)"/>
  <line x1="240" y1="360" x2="240" y2="398" stroke="#F97316" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah-orange)"/>
  <text x="212" y="305" font-size="11" font-weight="700" fill="#D97706" writing-mode="tb">下发模型、版本与调度策略</text>

  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图11-8 四层按延迟、数据量与算力分工：数据逐层上行，云端训练的模型和策略向边缘下发。</text>
