<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图11-3 智能路灯杆功能图（假设场景）</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图11-3 智能路灯杆功能图（假设场景）</title>
  <desc id="desc">五类杆载模块经边缘盒汇聚，高带宽视频就地推理，仅低频数据和结构化事件通过 MQTT 进入 IoT Hub。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图11-3 智能路灯杆功能图（假设场景）</text>
  <text x="88" y="64" font-size="12" fill="#64748B">多协议杆载设备在边缘汇聚，视频只上传推理后的结构化结果</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 挂载层 ===== -->
  <text x="120" y="144" font-size="15" font-weight="700" fill="#334155">挂载层 · 五类模块</text>
  <g font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">
    <rect x="120" y="158" width="300" height="88" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="270" y="192">智能照明</text>
    <text x="270" y="216" font-size="11" fill="#475569" font-weight="400">DALI · 调光执行</text>
    <rect x="440" y="158" width="300" height="88" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.6"/>
    <text x="590" y="192">AI 摄像头</text>
    <text x="590" y="216" font-size="11" fill="#475569" font-weight="400">RTSP · 12 fps</text>
    <rect x="760" y="158" width="300" height="88" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="910" y="192">环境传感器组</text>
    <text x="910" y="216" font-size="11" fill="#475569" font-weight="400">RS-485 Modbus</text>
    <rect x="1080" y="158" width="300" height="88" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
    <text x="1230" y="192">充电桩</text>
    <text x="1230" y="216" font-size="11" fill="#475569" font-weight="400">CAN · 计费鉴权</text>
    <rect x="1400" y="158" width="300" height="88" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
    <text x="1550" y="192">5G 微基站</text>
    <text x="1550" y="216" font-size="11" fill="#475569" font-weight="400">SFP · 通信补盲</text>
  </g>

  <!-- 挂载层 → 边缘计算盒 -->
  <line x1="910" y1="246" x2="900" y2="366" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="920" y="308" font-size="11" font-weight="700" fill="#2563EB">Modbus RTU · 1条/分钟</text>
  <line x1="590" y1="246" x2="700" y2="366" stroke="#F97316" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="600" y="300" font-size="11" font-weight="700" fill="#D97706">RTSP 本地推理（12 fps）</text>

  <!-- ===== 边缘计算层 ===== -->
  <text x="120" y="390" font-size="15" font-weight="700" fill="#F97316">边缘计算层</text>
  <rect x="500" y="368" width="800" height="116" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
  <text x="900" y="402" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">边缘计算盒 · ARM + NPU</text>
  <text x="900" y="430" font-size="12" fill="#475569" text-anchor="middle">协议适配 · 本地控制 · 数据聚合</text>
  <text x="900" y="458" font-size="11.5" fill="#C2410C" text-anchor="middle">摄像头本地推理：视频不上传 → 车流统计 / 异常事件 / 特征码</text>

  <!-- 充电桩直连云端 -->
  <line x1="1230" y1="246" x2="1230" y2="546" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-teal)"/>
  <text x="1248" y="390" font-size="11" font-weight="700" fill="#0F766E">MQTT + TLS · 计费数据</text>

  <!-- 边缘盒 → IoT Hub -->
  <line x1="900" y1="484" x2="900" y2="546" stroke="#2563EB" stroke-width="2.3" marker-end="url(#ah-blue)"/>
  <text x="918" y="518" font-size="11" font-weight="700" fill="#2563EB">MQTT · 结构化消息（&lt;1 KB/条）</text>

  <!-- ===== 云端层 ===== -->
  <text x="120" y="570" font-size="15" font-weight="700" fill="#475569">云端层</text>
  <rect x="500" y="548" width="800" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="900" y="582" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">IoT Hub · MQTT / CoAP Broker</text>
  <text x="900" y="608" font-size="11.5" fill="#475569" text-anchor="middle">照明控制 · 环境看板 · 安防告警 · 充电计费</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图11-3 五类模块经边缘盒汇聚；高带宽视频就地推理，仅低频数据和结构化事件通过 MQTT 进入 IoT Hub。</text>
  </svg>
</svg>
  </main>
</body>
</html>
