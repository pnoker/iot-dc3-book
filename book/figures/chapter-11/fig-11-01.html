<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图11-1 V2X通信技术选型决策路径图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图11-1 V2X通信技术选型决策路径图</title>
  <desc id="desc">按时延划定技术代际，再由覆盖、演进与存量兼容条件收敛到 DSRC、LTE-V2X 或 NR-V2X 方案。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图11-1 V2X通信技术选型决策路径图</text>
  <text x="88" y="64" font-size="12" fill="#64748B">按时延划定技术代际，再由覆盖、演进与存量兼容条件收敛方案</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 根节点 -->
  <polygon points="900,160 1080,200 900,240 720,200" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <text x="900" y="205" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">业务时延需求？</text>

  <!-- 左支：百毫秒级基础安全 -->
  <line x1="760" y1="215" x2="430" y2="275" stroke="#475569" stroke-width="2"/>
  <text x="560" y="230" font-size="12" font-weight="700" fill="#475569">百毫秒级基础安全</text>
  <rect x="250" y="278" width="360" height="54" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="430" y="310" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">安全预警 · 基础安全消息</text>

  <!-- 左支下：RSU覆盖 -->
  <line x1="430" y1="332" x2="430" y2="362" stroke="#475569" stroke-width="2"/>
  <polygon points="430,366 520,396 430,426 340,396" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="430" y="400" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">RSU 覆盖？</text>

  <!-- RSU高密 → DSRC -->
  <line x1="360" y1="418" x2="290" y2="470" stroke="#475569" stroke-width="2"/>
  <text x="300" y="448" font-size="11" font-weight="700" fill="#475569">RSU 高密</text>
  <rect x="140" y="472" width="300" height="72" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.8"/>
  <text x="290" y="502" font-size="15" font-weight="700" fill="#0F766E" text-anchor="middle">DSRC</text>
  <text x="290" y="526" font-size="11" fill="#475569" text-anchor="middle">高密 RSU · 基础安全消息</text>

  <!-- 覆盖稀疏 → Mode4 -->
  <line x1="500" y1="418" x2="570" y2="470" stroke="#475569" stroke-width="2"/>
  <text x="565" y="448" font-size="11" font-weight="700" fill="#475569">覆盖稀疏</text>
  <rect x="420" y="472" width="300" height="72" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.8"/>
  <text x="570" y="502" font-size="15" font-weight="700" fill="#0F766E" text-anchor="middle">NR-V2X Mode 4</text>
  <text x="570" y="526" font-size="11" fill="#475569" text-anchor="middle">Mode 4 直连 · 稀疏覆盖</text>

  <!-- 右支：毫秒级编队 -->
  <line x1="1040" y1="215" x2="1370" y2="275" stroke="#475569" stroke-width="2"/>
  <text x="1240" y="230" font-size="12" font-weight="700" fill="#475569">毫秒级编队 / 高级驾驶</text>
  <rect x="1190" y="278" width="360" height="54" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="1370" y="310" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">自动驾驶编队 · 高级驾驶</text>

  <!-- 右支下：演进预期 -->
  <line x1="1370" y1="332" x2="1370" y2="362" stroke="#475569" stroke-width="2"/>
  <polygon points="1370,366 1460,396 1370,426 1280,396" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="1370" y="400" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">演进预期？</text>

  <!-- 三年内演进 → NR-V2X -->
  <line x1="1300" y1="418" x2="1230" y2="470" stroke="#475569" stroke-width="2"/>
  <text x="1230" y="448" font-size="11" font-weight="700" fill="#475569">三年内演进</text>
  <rect x="1080" y="472" width="300" height="72" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="1230" y="502" font-size="15" font-weight="700" fill="#DC2626" text-anchor="middle">NR-V2X</text>
  <text x="1230" y="526" font-size="11" fill="#475569" text-anchor="middle">毫秒级编队 · 高级驾驶</text>

  <!-- 仅基础业务 → 存量后装 -->
  <line x1="1440" y1="418" x2="1510" y2="470" stroke="#475569" stroke-width="2"/>
  <text x="1510" y="448" font-size="11" font-weight="700" fill="#475569">仅基础业务</text>
  <polygon points="1510,476 1580,502 1510,528 1440,502" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="1510" y="506" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">存量后装？</text>

  <!-- 全新前装 → LTE-V2X -->
  <line x1="1460" y1="522" x2="1410" y2="570" stroke="#475569" stroke-width="2"/>
  <text x="1390" y="550" font-size="11" font-weight="700" fill="#475569">全新前装</text>
  <rect x="1270" y="572" width="280" height="68" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="1410" y="600" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">LTE-V2X</text>
  <text x="1410" y="624" font-size="11" fill="#475569" text-anchor="middle">蜂窝直连 · 前装支持</text>

  <!-- 旧车队协同 → 多模方案 -->
  <line x1="1580" y1="522" x2="1620" y2="570" stroke="#475569" stroke-width="2"/>
  <text x="1630" y="550" font-size="11" font-weight="700" fill="#475569">旧车队协同</text>
  <rect x="1490" y="572" width="290" height="68" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.8"/>
  <text x="1635" y="600" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">多模方案</text>
  <text x="1635" y="624" font-size="11" fill="#475569" text-anchor="middle">DSRC / C-V2X 过渡兼容</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图11-1 时延决定技术代际，覆盖与存量条件进一步分流；频段合规和现场测试是所有结果的共同前提。</text>
  </svg>
</svg>
  </main>
