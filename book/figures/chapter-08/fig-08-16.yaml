type: architecture
title: 图8-16 LLM 驱动的 IoT 操作：安全威胁与可解释性反馈架构
audience_takeaway: 输入端的指令白名单与输出端的参数校验分别拦截注入与越界调用，写操作必须经过人机确认环；LIME/SHAP 解释用于定位异常决策根因，审计日志串起完整追责链路。
purpose: 展示 LLM 驱动 IoT 操作时从输入到执行的安全过滤与可解释性反馈机制。
layout: 自下而上:输入层→输入端安全过滤→模型层→输出端安全过滤→执行层,审计日志贯穿。
elements:
- '顶层输入层: 用户输入(自然语言),可能含 Prompt 注入或越狱攻击。'
- '输入端安全过滤: 输入分类器(攻击模板检测),拦截已知攻击(红色路径)。'
- '中层模型层: LLM 推理,内嵌特征重要性条形图(如温度超限贡献度0.65),代表可解释性输出。'
- '输出端安全过滤: 输出过滤器(参数校验+敏感词匹配),拦截无效或越权调用。'
- '下层执行层: 工具调用(控制设备、读写位号),最终驱动物理设备。'
relationships:
- 攻击输入在输入端被拦截(红色路径);模型可能处理外部中毒数据(间接注入)。
- 输出过滤器对模型生成的工具调用参数校验,拦截越权;审计日志记录决策上下文。
- 执行层工具调用最终控制阀门、电机、门锁等物理设备。
render_notes: 五层架构,输入/输出过滤器用菱形,模型层内嵌条形图,审计日志侧挂;攻击路径红色,正常路径绿色。
caption:
  zh: 图8-16 LLM 驱动设备操作时,输入/输出两端安全过滤拦截攻击,模型层内嵌可解释性反馈,审计日志贯穿,形成可解释+可审计的安全闭环。
  en: Figure 8-16 When an LLM drives device operations, security filters at the input and output ends intercept attacks, the model layer embeds explainability feedback, and the audit log runs throughout — forming an explainable and auditable security loop.
labels:
  en:
    图8-16 LLM 驱动的 IoT 操作：安全威胁与可解释性反馈架构: 'Figure 8-16 LLM-Driven IoT Operations: Threats & Explainability Feedback'
    展示 LLM 驱动 IoT 操作时从输入到执行的安全过滤与可解释性反馈机制。: The security filtering and explainability feedback mechanism from input to execution when an LLM drives IoT operations.
    拦截已知攻击: Intercept Known Attacks
    外部中毒数据: Externally Poisoned Data
    （间接注入）: (Indirect Injection)
    拦截越权 / 无效调用: Intercept Unauthorized / Invalid Calls
    输入层 · 用户输入: Input Layer · User Input
    自然语言指令 · 可能含 Prompt 注入 / 越狱攻击: Natural-Language Commands · May Contain Prompt Injection / Jailbreaks
    输入分类器: Input Classifier
    攻击模板检测: Attack Pattern Detection
    模型层 · LLM 推理: Model Layer · LLM Inference
    可解释性输出 · 内嵌特征重要性反馈: Explainability Output · Embedded Feature Importance
    特征重要性: Feature Importance
    温度超限: Temperature Over Limit
    电压异常: Voltage Anomaly
    电流波动: Current Fluctuation
    输出过滤器: Output Filter
    参数校验 + 敏感词匹配: Parameter Validation + Sensitive-Word Matching
    执行层 · 工具调用: Execution Layer · Tool Calls
    控制设备 · 读写位号: Device Control · Tag Read/Write
    阀门: Valve
    电机: Motor
    门锁: Door Lock
    审计日志 · 贯穿全流程: Audit Log · Runs End to End
    记录输入过滤决策: Records Input Filtering Decisions
    记录模型决策上下文: Records Model Decision Context
    记录输出校验结果: Records Output Validation Results
    记录工具调用操作: Records Tool Call Operations
    记录设备控制动作: Records Device Control Actions
    示例 trace：: Example Trace
    输入过滤：拦截 Prompt 注入: 'Input Filter: Prompt Injection Blocked'
    LLM 决策：特征贡献 0.65: 'LLM Decision: Feature Contribution 0.65'
    输出校验：越权调用被拒: 'Output Check: Unauthorized Call Rejected'
    '工具执行：关闭阀门 #3': 'Tool Execution: Close Valve #3'
    审计时间戳：2026-08-01 10:32: 'Audit Timestamp: 2026-08-01 10:32'
    可解释 + 可审计 安全闭环: Explainable + Auditable Security Loop
    正常路径: Normal Path
    拦截 / 攻击路径: Intercepted / Attack Path
    外部中毒数据（间接注入）以红色虚线从侧方进入模型层: Externally poisoned data (indirect injection) enters the model layer from the side (red dashed)
    图8-16 LLM 驱动设备操作时，输入/输出两端安全过滤拦截攻击，模型层内嵌可解释性反馈，审计日志贯穿，形成可解释+可审计的安全闭环。: Figure 8-16 When an LLM drives device operations, security filters at the input and output ends intercept attacks, the model layer embeds explainability feedback, and the audit log runs throughout, forming an explainable + auditable security loop.
