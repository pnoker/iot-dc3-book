type: architecture
title: 图8-20 本章参考资料分类导图
audience_takeaway: 参考资料按设备、通信、协议、平台、AI 与测试六个主题域归档，每个条目再分为核心支撑与扩展实践；协议安全与 AI 安全两个主题的资料密度相对较薄，深入时应优先补齐这两块的一手规范。
purpose: 帮助读者快速定位本书研究资料包中 12 条参考资料对应的安全主题域，理解各参考资料的主要覆盖范围。
visual_focus: 从参考资料节点到各安全主题域的主链路。
design_level: logical
layout: 2×3 网格铺满主体区域，六个主题域等宽等高排列，每格直接展示资料编号与关系标签。
elements:
- 涵盖安全启动、密钥存储、设备身份认证
- 涵盖TLS/DTLS握手、双向认证、防重放
- 剖析 CoAP、LwM2M 等协议的固有缺陷
- 包含认证授权、多租户隔离、审计日志
- 讨论模型注入、Prompt 安全、权限范围约束
- 提供设备、云接口和移动端的安全测试清单
relationships:
- '核心支撑 → 设备安全与认证（核心支撑）'
- '扩展实践 → 设备安全与认证（扩展实践）'
- '核心定义 → 通信加密与认证（核心定义）'
- '实践要点 → 通信加密与认证（实践要点）'
- '协议细节 → 通信加密与认证（协议细节）'
- '原理剖析 → 协议安全问题（原理剖析）'
- '工程取舍 → 协议安全问题（工程取舍）'
- '核心方案 → 平台安全与 RBAC（核心方案）'
- '深度链接 → 平台安全与 RBAC（深度链接）'
- '接口规范 → AI 安全与隔离（接口规范）'
- '硬约束 → AI 安全与隔离（硬约束）'
- '实践清单 → 安全测试与评估（实践清单）'
