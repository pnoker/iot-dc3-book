visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: '建议使用 SVG 绘制。画布尺寸 700×480px。两列布局，每列 3 个矩形垂直排列。每个圆角矩形尺寸 200×60px，圆角半径 10px。左侧批量填充 #e3f2fd（浅蓝），边框 #1976d2。右侧批量填充 #f3e5f5（浅紫），边框 #7b1fa2。矩形内文字 14px 黑体。每个矩形右侧连接一个小圆圈（直径 22px），圆圈内标注参考资料的支撑类型标签（如 核心支撑），字体 11px Consolas，填充 #fff3e0，边框 #ef6c00。连线从圆圈引出，终点指向矩形右侧边。箭头和标签使用 12px 微软雅黑，颜色 #616161。避免重叠，必要时加曲线路径。左上角加标题 "本章参考资料分类导图"，字号 16px 黑体，颜色 #333。'
caption:
  zh: 图 8-20 本图将 8.7 节参考资料按安全主题域分类映射。左侧为设备层安全（硬件、通信、协议），右侧为平台与数据层安全（权限、AI、测试），从上到下覆盖从物理层到应用层的全栈。
  en: This figure maps the references in Section 8.7 to security theme domains. The left side covers device-layer security (hardware, communication, protocols), the right side platform- and data-layer security (permissions, AI, testing), spanning the full stack from the physical layer to the application layer.
labels:
  en:
    图8-20 本章参考资料分类导图: Figure 8-20 Chapter References Classification Map
    12 条参考资料以 2×3 网格铺满主体，映射到六个安全主题域。: The 12 references fill a 2×3 grid, mapped to six security theme domains.
    六个主题域覆盖设备、通信、协议、平台、AI 与安全测试，标签直接给出资料编号与作用。: Six theme domains cover devices, communication, protocols, platform, AI, and security testing; labels give the reference ID and its role.
    设备安全与认证: Device Security & Authentication
    安全启动 · 密钥存储 · 设备身份认证: Secure Boot · Key Storage · Device Identity Authentication
    核心支撑: Core Support
    扩展实践: Extended Practice
    平台安全与 RBAC: Platform Security & RBAC
    认证授权 · 多租户隔离 · 审计日志: Authentication & Authorization · Multi-Tenancy Isolation · Audit Logs
    核心方案: Core Scheme
    深度链接: Deep Dive
    通信加密与认证: Communication Encryption & Authentication
    TLS/DTLS 握手 · 双向认证 · 防重放: TLS/DTLS Handshake · Mutual Authentication · Anti-Replay
    核心定义: Core Definition
    实践要点: Practice Points
    协议细节: Protocol Details
    AI 安全与隔离: AI Security & Isolation
    模型注入 · Prompt 安全 · 权限范围约束: Model Injection · Prompt Security · Scope Constraints
    接口规范: Interface Specification
    硬约束: Hard Constraint
    协议安全问题: Protocol Security Issues
    CoAP · LwM2M 等协议的固有缺陷: CoAP · LwM2M Inherent Protocol Flaws
    原理剖析: Root-Cause Analysis
    工程取舍: Engineering Trade-offs
    安全测试与评估: Security Testing & Assessment
    设备 · 云接口 · 移动端安全测试清单: Device · Cloud API · Mobile Security Test Checklists
    实践清单: Practice Checklist
    资料覆盖密度：: Reference Coverage
    通信加密与认证 3 条；设备安全、协议安全、平台安全、AI 安全各 2 条；安全测试 1 条。: 'Communication encryption & authentication: 3; device, protocol, platform, and AI security: 2 each; security testing: 1.'
    '标签 = 参考资料支撑类型 · 连线 = 归属主题域': 'Tag = reference support type · link = theme domain'
    图8-20 研究资料包中的 12 条参考资料按安全主题域分类映射：左侧为设备层安全（硬件、通信、协议），右侧为平台与数据层安全（权限、AI、测试），覆盖从物理层到应用层的全栈。: 'Figure 8-20 The 12 references in the research pack mapped to security theme domains: device-layer security on the left (hardware, communication, protocols), platform- and data-layer security on the right (permissions, AI, testing), covering the full stack from physical to application layers.'
