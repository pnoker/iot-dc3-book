  <text x="1480" y="677" fill="#DC2626" font-size="13" font-weight="600" text-anchor="middle">拒绝启动</text>
</g>

  <text x="900" y="852" fill="#94A3B8" font-size="11" font-weight="600" text-anchor="middle">图8-4 安全启动的多层信任链流程：信任链根植于不可篡改的 BootROM（内含 OTP 公钥指纹），逐级签名验证 SBL → U-Boot → 内核 → 根文件系统（dm-verity），任一级失败即停机或回退恢复模式。</text>
