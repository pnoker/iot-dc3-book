<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图8-3 TLS 1.3与EDHOC握手流程对比</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图8-3 TLS 1.3与EDHOC握手流程对比</title>
  <desc id="desc">TLS 1.3 在 ServerHello 后加密握手 flight；EDHOC 以三条消息建立 OSCORE 安全上下文。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="50" font-size="36" font-weight="700" fill="#0F172A">图8-3 TLS 1.3与EDHOC握手流程对比</text>
    <text x="88" y="72" font-size="14" fill="#64748B">两者均基于临时密钥协商；TLS 的认证 flight 在 ServerHello 后加密，EDHOC 针对受限 CoAP 环境压缩为三条消息。</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <defs>
    <marker id="tls" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="edh" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#F97316"/></marker>
    <marker id="key" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0F766E"/></marker>
  </defs>
  <rect x="140" y="150" width="700" height="720" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="940" y="150" width="700" height="720" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="490" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#2563EB">TLS 1.3（双向认证）</text>
  <text x="1290" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#F97316">EDHOC（轻量认证）</text>
  <text x="290" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Client</text>
  <text x="730" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Server</text>
  <text x="1090" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Initiator</text>
  <text x="1530" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Responder</text>
  <line x1="290" y1="236" x2="290" y2="780" stroke="#94A3B8" stroke-dasharray="6 4"/>
  <line x1="730" y1="236" x2="730" y2="780" stroke="#94A3B8" stroke-dasharray="6 4"/>
  <line x1="1090" y1="236" x2="1090" y2="780" stroke="#94A3B8" stroke-dasharray="6 4"/>
  <line x1="1530" y1="236" x2="1530" y2="780" stroke="#94A3B8" stroke-dasharray="6 4"/>
  <!-- TLS messages -->
  <line x1="290" y1="270" x2="730" y2="270" stroke="#2563EB" stroke-width="2" marker-end="url(#tls)"/>
  <text x="510" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">ClientHello + key_share</text>
  <text x="510" y="238" text-anchor="middle" font-size="12" fill="#64748B">明文 · 版本 / 套件 / 客户端临时公钥</text>
  <line x1="730" y1="360" x2="290" y2="360" stroke="#2563EB" stroke-width="2" marker-end="url(#tls)"/>
  <text x="510" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">ServerHello + key_share</text>
  <text x="510" y="328" text-anchor="middle" font-size="12" fill="#64748B">明文 · 选定套件 / 服务端临时公钥</text>
  <text x="245" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#0F766E">导出握手流量密钥</text>
  <text x="245" y="430" text-anchor="middle" font-size="12" fill="#0F766E">▼ 以下消息加密</text>
  <line x1="730" y1="470" x2="290" y2="470" stroke="#2563EB" stroke-width="2.4" marker-end="url(#tls)"/>
  <text x="510" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">服务端加密 handshake flight</text>
  <text x="510" y="438" text-anchor="middle" font-size="12" fill="#64748B">EE · [CR] · Certificate · CertificateVerify · Finished</text>
  <line x1="290" y1="560" x2="730" y2="560" stroke="#2563EB" stroke-width="2.4" marker-end="url(#tls)"/>
  <text x="510" y="546" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">客户端加密 handshake flight</text>
  <text x="510" y="528" text-anchor="middle" font-size="12" fill="#64748B">[Certificate · CertificateVerify]（mTLS 可选）· Finished</text>
  <line x1="290" y1="650" x2="730" y2="650" stroke="#0F766E" stroke-width="2" marker-end="url(#key)"/>
  <text x="510" y="636" text-anchor="middle" font-size="14" font-weight="700" fill="#0F766E">会话密钥建立 · 应用数据加密</text>
  <!-- EDHOC messages -->
  <line x1="1090" y1="270" x2="1530" y2="270" stroke="#F97316" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#edh)"/>
  <text x="1310" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">message_1</text>
  <text x="1310" y="238" text-anchor="middle" font-size="12" fill="#64748B">临时公钥 + 身份选项</text>
  <line x1="1530" y1="380" x2="1090" y2="380" stroke="#F97316" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#edh)"/>
  <text x="1310" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">message_2</text>
  <text x="1310" y="348" text-anchor="middle" font-size="12" fill="#64748B">公钥 + 凭证 + 签名</text>
  <line x1="1090" y1="490" x2="1530" y2="490" stroke="#F97316" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#edh)"/>
  <text x="1310" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">message_3</text>
  <text x="1310" y="458" text-anchor="middle" font-size="12" fill="#64748B">公钥 + 签名确认</text>
  <line x1="1090" y1="610" x2="1530" y2="610" stroke="#0F766E" stroke-width="2" marker-end="url(#key)"/>
  <text x="1310" y="596" text-anchor="middle" font-size="14" font-weight="700" fill="#0F766E">三消息后导出 OSCORE 安全上下文</text>
  <text x="1310" y="700" text-anchor="middle" font-size="12" fill="#64748B">身份保护 · 前向保密 · 消息体积更小</text>
  <!-- legend -->
  <line x1="520" y1="906" x2="555" y2="906" stroke="#2563EB" stroke-width="2" marker-end="url(#tls)"/>
  <text x="565" y="912" fill="#64748B" font-size="13">TLS 1.3 消息</text>
  <line x1="700" y1="906" x2="735" y2="906" stroke="#F97316" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#edh)"/>
  <text x="745" y="912" fill="#64748B" font-size="13">EDHOC 消息</text>
  <line x1="890" y1="906" x2="925" y2="906" stroke="#0F766E" stroke-width="2" marker-end="url(#key)"/>
  <text x="935" y="912" fill="#64748B" font-size="13">会话密钥建立</text>
  <text x="1260" y="912" fill="#64748B" font-size="13">[方括号] = 可选消息（mTLS）</text>
    <text x="900" y="960" font-size="16" fill="#475569" text-anchor="middle">图8-3 展示 TLS 1.3 双向认证与 EDHOC 轻量认证的握手流程对比。TLS 需要两次往返且传输证书，EDHOC 仅需 3 条消息，体积更小。</text>
  </svg>
</svg>
  </main>
</body>
</html>
