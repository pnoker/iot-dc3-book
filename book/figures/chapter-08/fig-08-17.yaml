title: 物联网安全开发活动与阶段对应关系
type: lifecycle
purpose: 展示物联网安全活动如何嵌入需求、开发、测试、部署和运维阶段，并通过质量门禁阻止缺陷流入下一阶段。
layout: 横向五阶段生命周期；安全活动位于对应阶段下方，阶段之间设置质量门禁，不合格路径回退到上一阶段。
render_notes: 横向铺满五个阶段，开发阶段、安全活动和质量门禁通过边框、线型与文字标签共同区分，回退路径使用虚线并标明条件。
description: 本图以五阶段软件开发生命周期为主线，展示每个阶段应执行的核心安全活动，以及活动之间的串联关系。图中使用颜色区分“开发阶段”、“安全活动”和“质量门禁”，并用箭头表示流程推进方向。门禁处设置判定条件，不合格时回退至上阶段重做。
elements:
- type: timeline
  direction: horizontal
  nodes:
  - id: phase_req
    label: 需求与设计
    color: blue
  - id: phase_dev
    label: 开发
    color: blue
  - id: phase_test
    label: 测试
    color: blue
  - id: phase_deploy
    label: 部署
    color: blue
  - id: phase_ops
    label: 运维
    color: blue
- type: activity
  label: 威胁建模 (STRIDE)
  belongs_to: phase_req
  position: bottom
- type: activity
  label: 输出安全需求
  belongs_to: phase_req
  position: bottom
- type: gate
  label: 设计评审
  condition: 威胁模型与安全需求被采纳
  between: phase_req, phase_dev
- type: activity
  label: 代码安全审查
  belongs_to: phase_dev
  position: bottom
- type: activity
  label: 静态分析 (SAST)
  belongs_to: phase_dev
  position: bottom
- type: gate
  label: 构建门禁
  condition: SAST无高危漏洞
  between: phase_dev, phase_test
- type: activity
  label: 动态分析 (DAST)
  belongs_to: phase_test
  position: bottom
- type: activity
  label: 渗透测试
  belongs_to: phase_test
  position: bottom
- type: gate
  label: 安全验证门禁
  condition: 测试结果通过阈值
  between: phase_test, phase_deploy
- type: activity
  label: 依赖漏洞扫描
  belongs_to: phase_deploy
  position: bottom
- type: activity
  label: 最小化攻击面
  belongs_to: phase_deploy
  position: bottom
- type: gate
  label: 合规基线检查
  condition: 日志与监控正常
  between: phase_deploy, phase_ops
- type: feedback
  from: phase_ops
  to: phase_req
  label: 安全事件触发迭代
  style: dashed
relationships:
- from: phase_req
  to: activity_threat_model
  type: sequential
- from: activity_threat_model
  to: activity_security_req
  type: sequential
- from: activity_security_req
  to: gate_design_review
  type: sequential
- from: gate_design_review_ok
  to: phase_dev
  type: forward
- from: gate_design_review_fail
  to: activity_threat_model
  type: rework
- from: phase_dev
  to: activity_code_review
  type: sequential
- from: activity_code_review
  to: activity_sast
  type: optional
- from: activity_sast
  to: gate_build
  type: sequential
- from: gate_build_ok
  to: phase_test
  type: forward
- from: gate_build_fail
  to: phase_dev
  type: rework
- from: phase_test
  to: activity_dast
  type: sequential
- from: activity_dast
  to: activity_penetration
  type: optional
- from: activity_penetration
  to: gate_test
  type: sequential
- from: gate_test_ok
  to: phase_deploy
  type: forward
- from: gate_test_fail
  to: phase_test
  type: rework
- from: phase_deploy
  to: activity_dep_scan
  type: sequential
- from: activity_dep_scan
  to: activity_harden
  type: optional
- from: activity_harden
  to: gate_compliance
  type: sequential
- from: gate_compliance_ok
  to: phase_ops
  type: forward
- from: gate_compliance_fail
  to: phase_deploy
  type: rework
- from: phase_ops
  to: gate_ops
  type: sequential
- from: gate_ops_fail
  to: phase_req
  type: feedback
notes:
- “评审”和“门禁”的含义不同：评审由人工审查，门禁由自动化工具在CI/CD流水线中强制执行。
- 运维阶段收集的安全事件可能揭示新的威胁，应反馈到需求阶段更新威胁模型，形成持续改进的闭环。
