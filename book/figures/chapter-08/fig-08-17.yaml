\" font-size=\"12\">威胁建模</text>\n  <rect x=\"50\" y=\"160\" width=\"120\" height=\"30\" rx=\"5\" fill=\"#27AE60\" stroke=\"#1e8449\" stroke-width=\"1\"/>\n  <text x=\"110\" y=\"180\" text-anchor=\"middle\" fill=\"white\" font-size=\"12\">安全需求</text>\n  <rect x=\"240\" y=\"120\" width=\"100\" height=\"30\" rx=\"5\" fill=\"#27AE60\" stroke=\"#1e8449\" stroke-width=\"1\"/>\n  <text x=\"290\" y=\"140\" text-anchor=\"middle\" fill=\"white\" font-size=\"12\">代码审查</text>\n  <rect x=\"240\" y=\"160\" width=\"100\" height=\"30\" rx=\"5\" fill=\"#27AE60\" stroke=\"#1e8449\" stroke-width=\"1\"/>\n  <text x=\"290\" y=\"180\" text-anchor=\"middle\" fill=\"white\" font-size=\"12\">SAST</text>\n  <rect x=\"410\" y=\"120\" width=\"100\" height=\"30\" rx=\"5\" fill=\"#27AE60\" stroke=\"#1e8449\" stroke-width=\"1\"/>\n  <text x=\"460\" y=\"140\" text-anchor=\"middle\" fill=\"white\" font-size=\"12\">DAST</text>\n  <rect x=\"410\" y=\"160\" width=\"100\" height=\"30\" rx=\"5\" fill=\"#27AE60\" stroke=\"#1e8449\" stroke-width=\"1\"/>\n  <text x=\"460\" y=\"180\" text-anchor=\"middle\" fill=\"white\" font-size=\"12\">渗透测试</text>\n  <rect x=\"580\" y=\"120\" width=\"100\" height=\"30\" rx=\"5\" fill=\"#27AE60\" stroke=\"#1e8449\" stroke-width=\"1\"/>\n  <text x=\"630\" y=\"140\" text-anchor=\"middle\" fill=\"white\" font-size=\"12\">依赖扫描</text>\n  <rect x=\"580\" y=\"160\" width=\"100\" height=\"30\" rx=\"5\" fill=\"#27AE60\" stroke=\"#1e8449\" stroke-width=\"1\"/>\n  <text x=\"630\" y=\"180\" text-anchor=\"middle\" fill=\"white\" font-size=\"12\">最小化攻击面</text>\n  <rect x=\"750\" y=\"120\" width=\"100\" height=\"30\" rx=\"5\" fill=\"#27AE60\" stroke=\"#1e8449\" stroke-width=\"1\"/>\n  <text x=\"800\" y=\"140\" text-anchor=\"middle\" fill=\"white\" font-size=\"12\">日志与告警</text>\n  <!-- 门禁 -->\n  <rect x=\"180\" y=\"100\" width=\"40\" height=\"20\" rx=\"3\" fill=\"#f1c40f\" stroke=\"#f39c12\" stroke-width=\"1\"/>\n  <text x=\"200\" y=\"115\" text-anchor=\"middle\" fill=\"#2c3e50\" font-size=\"9\">评审</text>\n  <line x1=\"200\" y1=\"120\" x2=\"200\" y2=\"90\" stroke=\"#e74c3c\" stroke-width=\"1.5\" marker-end=\"url(#arrowHeadRed)\" stroke-dasharray=\"4,4\"/>\n  <rect x=\"350\" y=\"100\" width=\"40\" height=\"20\" rx=\"3\" fill=\"#f1c40f\" stroke=\"#f39c12\" stroke-width=\"1\"/>\n  <text x=\"370\" y=\"115\" text-anchor=\"middle\" fill=\"#2c3e50\" font-size=\"9\">门禁</text>\n  <!-- ... 后续 SVG 节点与箭头同前，此处省略以保持简洁 ... -->\n</svg>caption: \"图8-17 以五阶段软件开发生命周期为主线，展示每个阶段应执行的核心安全活动与质量门禁，门禁不合格时回退上阶段重做。\"\n"
caption:
  zh: 图8-17 安全不是上线前的一次检查，而是贯穿需求、开发、测试、部署与运维的持续工程活动；每个阶段的质量门禁负责阻止未达标产物继续流转。
  en: Figure 8-17 Security is not a one-off check before launch but a continuous engineering activity spanning requirements, development, testing, deployment, and operations; the quality gate at each stage stops non-conforming artifacts from flowing onward.
labels:
  en:
    图8-17 物联网安全开发活动与阶段对应关系: Figure 8-17 IoT Security Activities Mapped to SDLC Phases
    以五阶段软件开发生命周期为主线，展示每个阶段应执行的核心安全活动与质量门禁，门禁不合格时回退上阶段重做。: Along a five-phase SDLC, showing each phase's core security activities and quality gates; failing a gate sends work back to the previous phase.
    本图以五阶段软件开发生命周期为主线，展示每个阶段应执行的核心安全活动与质量门禁，门禁不合格时回退上阶段重做。: Along a five-phase SDLC, the figure shows each phase's core security activities and quality gates; failing a gate sends work back for rework.
    持续监测: Continuous Monitoring
    通过: Pass
    需求与设计: Requirements & Design
    开发: Development
    测试: Testing
    部署: Deployment
    运维: Operations
    设计评审: Design Review
    构建门禁: Build Gate
    安全验证: Security Verification
    合规基线: Compliance Baseline
    安全监测: Security Monitoring
    条件：威胁模型与安全需求被采纳: 'Condition: Threat Model & Security Requirements Accepted'
    条件：SAST无高危漏洞: 'Condition: No Critical SAST Vulnerabilities'
    条件：测试结果通过阈值: 'Condition: Test Results Meet Thresholds'
    条件：日志与监控正常: 'Condition: Logging & Monitoring Healthy'
    条件：安全事件超出阈值: 'Condition: Security Incidents Exceed Threshold'
    威胁建模 (STRIDE): Threat Modeling (STRIDE)
    输出安全需求: Produce Security Requirements
    代码安全审查: Secure Code Review
    静态分析 (SAST): Static Analysis (SAST)
    动态分析 (DAST): Dynamic Analysis (DAST)
    渗透测试: Penetration Testing
    依赖漏洞扫描: Dependency Vulnerability Scanning
    最小化攻击面: Minimize Attack Surface
    安全监测与告警: Security Monitoring & Alerting
    （可选）: (Optional)
    回退: Rework
    安全事件触发迭代: Security Incidents Trigger Iteration
    开发阶段: Development Phases
    安全活动: Security Activities
    质量门禁: Quality Gates
    可选路径: Optional Path
    回退重做: Rework
    安全反馈: Security Feedback
    注1：评审由人工审查；门禁由自动化工具在 CI/CD 流水线中强制执行。: 'Note 1: Reviews are manual; gates are enforced automatically in the CI/CD pipeline.'
    注2：运维阶段收集的安全事件可能揭示新威胁，反馈至需求阶段更新威胁模型，形成持续改进闭环。: 'Note 2: Incidents collected in operations may reveal new threats and feed back to requirements to update the threat model, closing the improvement loop.'
    图8-17 五阶段各配安全活动与质量门禁，门禁由 CI/CD 自动化强制执行、不合格即回退上阶段；运维阶段的安全事件经橙色闭环反馈至需求，更新威胁模型形成持续改进。: Figure 8-17 Each of the five phases pairs security activities with quality gates enforced automatically by CI/CD — failing a gate sends work back to the previous phase; incidents from operations feed back to requirements via the orange loop, updating the threat model for continuous improvement.
