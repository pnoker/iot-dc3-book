type: architecture
title: 图8-8 物联网微隔离架构示意图
audience_takeaway: 读者应理解微隔离把隔离规则下放到SDN微分段控制层，按设备级下发策略，使被攻陷设备无法在同一网络内横向移动。
purpose: 展示从设备层到策略编排层的四层分层模型，说明微分段如何通过SDN控制器实现逐设备级别的隔离规则，防止横向移动。
visual_focus: 从layer1到layer1的主链路。
design_level: logical
layout: 四层堆叠分层，自底向上依次为物理设备层、接入网关层、微分段控制层、全局策略编排层，层间用带箭头的实线或虚线连接。
elements:
- 物理设备层
- 接入网关层
- 微分段控制层
- 全局策略编排层
relationships:
- layer1 → layer2
- layer2 → layer3
- layer3 → layer2
- layer4 → layer3：编排层向微分段控制器下发策略
- layer3 → layer2：控制器向网关等策略执行点下发规则
- layer2 → layer1：执行点实施流量隔离，编排层不直达设备
