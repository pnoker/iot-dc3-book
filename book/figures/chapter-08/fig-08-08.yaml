caption:
  zh: 图8-8 物联网微隔离架构示意图。四层模型从设备到策略编排依次递进，微分段控制层是核心决策点。
  en: Figure 8-8 A micro-segmentation architecture for IoT. The four-layer model ascends from devices to policy orchestration, with the micro-segmentation control layer as the core decision point.
labels:
  en:
    图8-8 物联网微隔离架构示意图: Figure 8-8 IoT Micro-Segmentation Architecture
    读者应理解微隔离把隔离规则下放到SDN微分段控制层，按设备级下发策略，使被攻陷设备无法在同一网络内横向移动。: Micro-segmentation pushes isolation rules down to the SDN control layer and issues per-device policies, so a compromised device cannot move laterally within the network.
    平台服务域: Platform Service Domain
    策略下发: Policy Delivery
    规则下发: Rule Delivery
    状态上报: Status Reporting
    设备接入: Device Access
    全局策略编排层: Global Policy Orchestration Layer
    统一策略建模 · 全局编排 · 应急隔离决策: Unified Policy Modeling · Global Orchestration · Emergency Isolation
    微分段控制层: Micro-Segmentation Control Layer
    SDN 微分段控制器 · 生成逐设备隔离规则: SDN Micro-Segmentation Controller · Per-Device Isolation Rules
    核心决策点: Core Decision Point
    接入网关层: Access Gateway Layer
    策略执行点 · 身份认证 · 流量阻断与转发: Policy Enforcement Point · Authentication · Traffic Blocking & Forwarding
    物理设备层: Physical Device Layer
    海量感知/控制终端 · 被隔离保护对象: Massive Sensing/Control Endpoints · Protected Objects
    智能门锁: Smart Lock
    环境传感器: Environment Sensor
    PLC 控制: PLC Control
    摄像头终端: Camera Terminal
    分层组件（每个层包含多个功能实体）: Layered Components (Multiple Entities per Layer)
    策略或配置数据的流向（实线）: Policy/Config Data Flow (Solid)
    控制咨询或动态调整的流向（虚线）: Control Query / Dynamic Adjustment Flow (Dashed)
    图8-8 编排层只向微分段控制器下发策略，控制器再由网关等执行点实施隔离；编排不直达设备。: Figure 8-8 The orchestration layer delivers policies only to the micro-segmentation controller, which enforces isolation through gateways and other enforcement points; orchestration never reaches devices directly.
