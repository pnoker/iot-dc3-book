caption:
  zh: 图8-4 安全启动的多层信任链流程，展示从 BootROM 到文件系统的逐级签名验证关系。
  en: Figure 8-4 The multi-level chain of trust in secure boot, showing signature verification cascading level by level from BootROM to the file system.
labels:
  en:
    图8-4 安全启动多层信任链流程: Figure 8-4 Secure Boot Chain of Trust
    信任链根植于不可篡改的 BootROM（内含 OTP 公钥指纹），每一级验证下一级镜像，任一级失败即停机或回退恢复模式。: The chain of trust is rooted in the immutable BootROM (with an OTP public key fingerprint); each level verifies the next image, and any failure halts the boot or falls back to recovery mode.
    平台服务域 · 核心服务能力边界: Platform Domain · Core Service Boundary
    上电复位: Power-On Reset
    固化只读代码 · 内含 OTP 公钥指纹: Read-Only Code · Embeds OTP Public Key Fingerprint
    不可篡改 · 信任链的根（Root of Trust）: Immutable · Root of Trust
    验证 SBL 签名: Verify SBL Signature
    通过: Pass
    第一阶段 Bootloader (SBL): Stage-1 Bootloader (SBL)
    验证 U-Boot 签名: Verify U-Boot Signature
    第二阶段 Bootloader (U-Boot): Stage-2 Bootloader (U-Boot)
    验证 内核签名: Verify Kernel Signature
    操作系统内核镜像: OS Kernel Image
    校验根文件系统完整性 (dm-verity): Verify Rootfs Integrity (dm-verity)
    挂载根文件系统: Mount Root File System
    正常启动: Normal Boot
    失败: Fail
    停机: Halt
    回退恢复模式: Fall Back to Recovery Mode
    注：SBL 采用 A/B 双分区，验证失败回退至备用副本启动。: 'Note: SBL uses A/B partitions; on verification failure it falls back to the backup copy.'
    拒绝启动: Refuse to Boot
    绿色实线 = 验证通过路径: Green Solid = Verification Passed
    红色虚线 = 验证失败路径（停机 / 恢复模式）: Red Dashed = Verification Failed (Halt / Recovery)
    BootROM = Root of Trust（不可篡改）: BootROM = Root of Trust (Immutable)
    图8-4 信任链自 BootROM 起逐级验签至根文件系统；失败策略分级——SBL 凭 A/B 双分区回退恢复，BootROM、U-Boot、内核任一级失败即停机或拒绝启动，根文件系统由 dm-verity 校验完整性。: Figure 8-4 The chain of trust verifies signatures level by level from BootROM to the root file system; failure handling is tiered — SBL falls back via A/B partitions, failure at BootROM, U-Boot, or the kernel halts or refuses to boot, and rootfs integrity is checked by dm-verity.
