type: flowchart
title: 图8-4 安全启动多层信任链流程
audience_takeaway: 信任链根植于不可篡改的 BootROM（内含 OTP 公钥指纹），每一级验证下一级镜像，任一级失败即停机或回退恢复模式。
purpose: 展示从芯片上电到 Linux 内核启动的逐级验证过程，强调当前可信级验证下一级镜像后才移交执行。
visual_focus: 从BootROM 验证 SBL 签名到通过则挂载，否则拒绝启动的主链路。
design_level: implementation
layout: 自上而下链式流程，起点：上电复位，终点：正常启动或拒绝启动。
elements:
- BootROM（固化只读代码，含OTP公钥指纹）
- 第一阶段 Bootloader (SBL)
- 第二阶段 Bootloader (U-Boot)
- 操作系统内核镜像
- 根文件系统
relationships:
- BootROM 验证 SBL 签名 → 通过则加载，否则停机
- SBL 验证 第二阶段 Bootloader 签名 → 通过则加载，否则回退恢复模式
- 第二阶段 Bootloader 验证 内核镜像签名 → 通过则解压执行，否则停机
- 内核镜像 校验 根文件系统完整性（dm-verity） → 通过则挂载，否则拒绝启动
