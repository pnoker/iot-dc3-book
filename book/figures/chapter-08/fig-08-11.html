  <title id="fig811-title">图8-11 物联网平台 JWT 认证与授权架构</title>

  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="fig811-tt">图8-11 物联网平台 JWT 认证与授权架构</title>
  <desc id="fig811-dd">展示 JWT 认证与授权在物联网平台中的四层架构与鉴权流程。</desc>
  <defs>

    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="bp-arrow-success" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16A34A"/></marker>

  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图8-11 物联网平台 JWT 认证与授权架构</text>
  <text x="82" y="70" fill="#64748B" font-size="12">展示 JWT 认证与授权在物联网平台中的四层架构与鉴权流程：认证层颁发令牌、授权层执行 RBAC/ABAC 决策、审计日志记录上下文。</text>

  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LAYERED</text>

  <g data-layout="layered">
  <!-- 租户边界：垂直虚线屏障 -->

  <text x="1620" y="114" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">租户 B</text>

  <rect x="424" y="192" width="56" height="22" rx="11" fill="#DBEAFE" stroke="#2563EB"/><text x="452" y="208" fill="#2563EB" font-size="11" text-anchor="middle">权限</text>
  <rect x="488" y="192" width="92" height="22" rx="11" fill="#DBEAFE" stroke="#2563EB"/><text x="534" y="208" fill="#2563EB" font-size="11" text-anchor="middle">ABAC规则</text>
  <line x1="560" y1="216" x2="560" y2="270" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)" />
  <text x="572" y="246" fill="#2563EB" font-size="12" font-weight="600">策略下发</text>

  <text x="320" y="332" fill="#475569" font-size="12">执行 RBAC / ABAC 策略</text>
  <text x="320" y="350" fill="#475569" font-size="12">输出：允许 / 拒绝</text>
  <!-- 资源 -->
  <rect x="980" y="296" width="320" height="66" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.2" />
  <text x="1000" y="320" fill="#166534" font-size="15" font-weight="600">资源（设备 / 数据）</text>
  <text x="1000" y="342" fill="#475569" font-size="12">受保护资源</text>

  <text x="475" y="406" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">fail-closed · 拒绝</text>

  <line x1="860" y1="284" x2="1490" y2="284" stroke="#DC2626" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#bp-arrow-danger)" />

  <circle cx="1500" cy="284" r="8" fill="#DC2626"/><line x1="1496" y1="280" x2="1504" y2="288" stroke="#FFFFFF" stroke-width="2"/><line x1="1504" y1="280" x2="1496" y2="288" stroke="#FFFFFF" stroke-width="2"/>

  <line x1="715" y1="388" x2="715" y2="366" stroke="#16A34A" stroke-width="2" marker-end="url(#bp-arrow-success)" />

  <!-- ===== ③ 认证层 ===== -->

  <rect x="638" y="524" width="56" height="20" rx="10" fill="#CCFBF1" stroke="#0F766E"/><text x="666" y="538" fill="#0F766E" font-size="11" text-anchor="middle">role</text>
  <rect x="702" y="524" width="84" height="20" rx="10" fill="#CCFBF1" stroke="#0F766E"/><text x="744" y="538" fill="#0F766E" font-size="11" text-anchor="middle">tenant_id</text>
  <rect x="794" y="524" width="48" height="20" rx="10" fill="#CCFBF1" stroke="#0F766E"/><text x="818" y="538" fill="#0F766E" font-size="11" text-anchor="middle">exp</text>
  <line x1="460" y1="505" x2="540" y2="505" stroke="#16A34A" stroke-width="2" marker-end="url(#bp-arrow-success)" />
  <text x="500" y="497" fill="#16A34A" font-size="11" text-anchor="middle">提交身份</text>
  <line x1="715" y1="470" x2="715" y2="414" stroke="#16A34A" stroke-width="2" marker-end="url(#bp-arrow-success)" />
  <text x="727" y="446" fill="#16A34A" font-size="12" font-weight="600">颁发 JWT</text>

  <!-- ===== ④ 基础设施层 ===== -->
  <rect x="180" y="625" width="1460" height="133" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5" />
  <text x="200" y="647" fill="#475569" font-size="15" font-weight="700">④ 基础设施层</text>
  <rect x="300" y="642" width="560" height="92" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
  <text x="320" y="664" fill="#0F172A" font-size="15" font-weight="600">数据库</text>
  <text x="320" y="686" fill="#475569" font-size="12">· 用户凭证</text>
  <text x="320" y="702" fill="#475569" font-size="12">· 角色映射</text>
  <text x="320" y="718" fill="#475569" font-size="12">· 策略规则</text>
  <rect x="980" y="642" width="460" height="92" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
  <text x="1000" y="664" fill="#0F172A" font-size="15" font-weight="600">JWT 签发服务</text>

  <text x="940" y="682" fill="#475569" font-size="11" text-anchor="middle">签名密钥</text>

  <line x1="420" y1="642" x2="600" y2="554" stroke="#16A34A" stroke-width="2" marker-end="url(#bp-arrow-success)" />
  <text x="430" y="600" fill="#0F766E" font-size="12">用户凭证校验</text>
  <!-- 数据库 → 授权层：策略规则读取 -->
  <line x1="850" y1="642" x2="850" y2="415" stroke="#16A34A" stroke-width="2" marker-end="url(#bp-arrow-success)" />
  <text x="908" y="530" fill="#0F766E" font-size="12">策略规则读取</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="11" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色=策略配置 · 绿色=允许路径 · 红色=拒绝路径 · 虚线=租户边界</text>
  <text x="900" y="852" fill="#94A3B8" font-size="11" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图8-11 JWT 认证与授权架构：认证层颁发令牌、授权层执行 RBAC/ABAC 决策、审计日志记录上下文，租户边界贯穿始终，未明确授予的权限一律拒绝（fail-closed）。</text>
  </svg>
</svg>
