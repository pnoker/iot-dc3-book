caption:
  zh: 图 8-10 大多数项目的问题在于混淆脱敏和匿名化：做了一层掩盖就当成匿名化发布，导致重识别风险泄露。差异在于强匿名化必须通过重识别风险评估。
  en: 'The problem in most projects is confusing masking with anonymization: a single layer of masking is treated as anonymized and published, causing re-identification risk leaks. The difference is that strong anonymization must pass a re-identification risk assessment.'
labels:
  en:
    图8-10 数据脱敏与匿名化决策流程: Figure 8-10 Data Masking vs Anonymization Decision Flow
    数据发布先分级；内部受控使用可选择脱敏，对外发布必须达到匿名化目标并通过重识别风险评估。: Classify data before release; internal controlled use may rely on masking, but external release must meet anonymization goals and pass a re-identification risk assessment.
    “做过掩盖”不等于匿名化；对外发布必须通过重识别风险评估。: '"Masked" is not "anonymized"; external release must pass a re-identification risk assessment.'
    内部受控使用: Internal Controlled Use
    对外发布 / 开放数据: External Release / Open Data
    是: 'Yes'
    否: 'No'
    待发布数据: Data Pending Release
    字段 · 用途 · 接收方: Fields · Purpose · Recipients
    数据分级分类: Data Classification
    P0 直接标识符 · P1 准标识符 · P2 敏感 · P3 非敏感: P0 Direct ID · P1 Quasi-ID · P2 Sensitive · P3 Non-Sensitive
    使用边界？: Usage Boundary?
    内部 / 对外: Internal / External
    脱敏处理: Masking
    掩盖 · 置换 · 泛化: Masking · Substitution · Generalization
    受控交付: Controlled Delivery
    权限 · 审计 · 限用途: Permissions · Audit · Restricted Use
    匿名化处理: Anonymization
    泛化 · k-匿名: Generalization · k-Anonymity
    必要时注入差分隐私: Add Differential Privacy If Needed
    重识别风险: Re-Identification Risk
    可接受？: Acceptable?
    允许发布: Allow Release
    保存评估证据与版本: Keep Assessment Evidence & Version
    硬边界: Hard Boundary
    脱敏数据仍可能被重新识别，只适用于有权限、有限用途的内部场景。: Masked data can still be re-identified; it only fits internal scenarios with permissions and limited use.
    匿名化是否成立取决于重识别风险评估证据，不取决于处理步骤的名称。: Whether anonymization holds depends on evidence from a re-identification risk assessment, not on the name of the processing step.
    圆角矩形 = 开始 / 结束: Rounded Rect = Start / End
    矩形 = 处理动作: Rectangle = Processing Action
    菱形 = 可验证决策: Diamond = Verifiable Decision
    图8-10 大多数项目的问题在于混淆脱敏和匿名化：做了一层掩盖就当成匿名化发布，导致重识别风险泄露。差异在于强匿名化必须通过重识别风险评估。: 'Figure 8-10 The problem in most projects is confusing masking with anonymization: a single layer of masking gets published as anonymized, leaking re-identification risk; strong anonymization must pass a re-identification risk assessment.'
