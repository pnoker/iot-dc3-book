render_notes: HTML/SVG渲染，两段并列，左侧TLS右侧EDHOC。泳道标签清晰，消息箭头带文字名称。底部统一标注“会话密钥生成完成”。使用浅色背景，圆角矩形，12px间距。
caption:
  zh: 图8-3 展示TLS 1.3双向认证与EDHOC轻量认证的握手流程对比。TLS需要两次往返且传输证书，EDHOC仅需3条消息，体积更小。
  en: Figure 8-3 A comparison of the TLS 1.3 mutual-authentication handshake with the lightweight EDHOC handshake. TLS requires two round trips and transmits certificates, while EDHOC needs only three messages with a much smaller footprint.
labels:
  en:
    图8-3 TLS 1.3与EDHOC握手流程对比: Figure 8-3 TLS 1.3 vs EDHOC Handshake
    TLS 1.3 在 ServerHello 后加密握手 flight；EDHOC 以三条消息建立 OSCORE 安全上下文。: TLS 1.3 encrypts handshake flights after ServerHello; EDHOC establishes the OSCORE security context in three messages.
    两者均基于临时密钥协商；TLS 的认证 flight 在 ServerHello 后加密，EDHOC 针对受限 CoAP 环境压缩为三条消息。: Both use ephemeral key agreement; TLS authentication flights are encrypted after ServerHello, while EDHOC compresses to three messages for constrained CoAP environments.
    TLS 1.3（双向认证）: TLS 1.3 (Mutual Authentication)
    EDHOC（轻量认证）: EDHOC (Lightweight Authentication)
    明文 · 版本 / 套件 / 客户端临时公钥: Plaintext · Version / Suites / Client Ephemeral Key
    明文 · 选定套件 / 服务端临时公钥: Plaintext · Selected Suite / Server Ephemeral Key
    导出握手流量密钥: Derive Handshake Traffic Keys
    ▼ 以下消息加密: ▼ Messages Below Are Encrypted
    服务端加密 handshake flight: Server Encrypted Handshake Flight
    客户端加密 handshake flight: Client Encrypted Handshake Flight
    '[Certificate · CertificateVerify]（mTLS 可选）· Finished': '[Certificate · CertificateVerify] (optional mTLS) · Finished'
    会话密钥建立 · 应用数据加密: Session Key Established · App Data Encrypted
    临时公钥 + 身份选项: Ephemeral Key + Identity Option
    公钥 + 凭证 + 签名: Public Key + Credential + Signature
    公钥 + 签名确认: Public Key + Signature Confirmation
    三消息后导出 OSCORE 安全上下文: OSCORE Context After 3 Messages
    身份保护 · 前向保密 · 消息体积更小: Identity Protection · Forward Secrecy · Smaller Messages
    TLS 1.3 消息: TLS 1.3 Messages
    EDHOC 消息: EDHOC Messages
    会话密钥建立: Session Key Established
    '[方括号] = 可选消息（mTLS）': '[Brackets] = Optional Messages (mTLS)'
    图8-3 展示 TLS 1.3 双向认证与 EDHOC 轻量认证的握手流程对比。TLS 需要两次往返且传输证书，EDHOC 仅需 3 条消息，体积更小。: 'Figure 8-3 Comparing the TLS 1.3 mutual-authentication handshake with the lightweight EDHOC handshake: TLS needs two round trips and certificate transfer, while EDHOC needs only three messages with a smaller footprint.'
