callouts:
- 攻击路径（左侧红色箭头）从底向上穿过所有层
- 防御阻断（右侧绿色箭头）从顶向下触发
- 补偿控制（灰色虚线）连接不同层，用于降低部分剩余风险；即使 Layer 3 增加证书锁定与异常流量检测，也不能替代 Layer 2 缺失的硬件 Root of Trust
legend:
- 蓝色矩形条：防御层，从上到下颜色由浅变深
- 红色箭头：攻击者逐层突破路径
- 绿色箭头：防御方反向阻断信号
- 灰色虚线：补偿控制关系
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
