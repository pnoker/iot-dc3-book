render_notes: HTML/SVG渲染，浅色背景，多层不同深浅蓝色矩形条圆角垂直堆叠，左侧红色箭头贯穿、右侧绿色箭头贯穿，灰色虚线跨层连接。每层矩形条可点击展示详细描述。
caption:
  zh: 图8-2 展示了物联网系统中纵深防御的层次结构、攻击面与防御阻断方向，以及补偿控制的跨层连接。
  en: Figure 8-2 The layered structure of defense in depth in an IoT system, the attack surface and the direction of defensive blocking, and the cross-layer links of compensating controls.
labels:
  en:
    图8-2 物联网纵深防御多层模型: Figure 8-2 IoT Defense-in-Depth Model
    七层防御逐层拦截攻击；单层能力不足时，相邻层用补偿控制降低剩余风险。: Seven layers intercept attacks level by level; where one layer falls short, adjacent layers use compensating controls to cut residual risk.
    补偿控制只能降低部分剩余风险，不能替代硬件 Root of Trust 等基础安全能力。: Compensating controls only reduce part of the residual risk and cannot replace foundational capabilities such as a hardware Root of Trust.
    攻击路径 · 自底向上突破: Attack Path · Bottom-Up Breach
    防御阻断 · 自顶向下: Defense Blocking · Top-Down
    Layer 7 · 应用与 AI 安全: Layer 7 · Application & AI Security
    模型注入防护 · Prompt 威胁分类 · 输出过滤: Model Injection Defense · Prompt Threat Classification · Output Filtering
    Layer 6 · 数据安全: Layer 6 · Data Security
    存储加密 · 字段级脱敏 · 密钥生命周期: Storage Encryption · Field-Level Masking · Key Lifecycle
    Layer 5 · 平台安全: Layer 5 · Platform Security
    租户隔离 · 速率限制 · 审计日志: Tenant Isolation · Rate Limiting · Audit Logs
    Layer 4 · 身份与访问控制: Layer 4 · Identity & Access Control
    Layer 3 · 通信安全: Layer 3 · Communication Security
    TLS / DTLS · 双向认证 · 防重放: TLS / DTLS · Mutual Authentication · Anti-Replay
    Layer 2 · 设备固件安全: Layer 2 · Device Firmware Security
    Secure Boot · OTA 签名验证 · 回滚保护: Secure Boot · OTA Signature Verification · Rollback Protection
    Layer 1 · 物理安全: Layer 1 · Physical Security
    SE / TEE · 防拆开关 · JTAG 锁定: SE / TEE · Tamper Switches · JTAG Lockout
    补偿控制仅降低部分剩余风险: Compensating Controls Reduce Only Part of Residual Risk
    即使 Layer 3 增加证书锁定与异常流量检测，也不能替代 Layer 2 缺失的硬件 Root of Trust。: Even if Layer 3 adds certificate pinning and anomaly traffic detection, it cannot replace the hardware Root of Trust missing at Layer 2.
    攻击路径: Attack Path
    防御阻断: Defense Blocking
    补偿控制: Compensating Control
    图8-2 展示了物联网系统中纵深防御的层次结构、攻击面与防御阻断方向，以及补偿控制的跨层连接。: 'Figure 8-2 Defense in depth in an IoT system: the layered structure, the attack surface and blocking direction, and cross-layer compensating controls.'
