type: layered
title: 图8-2 物联网纵深防御多层模型
audience_takeaway: 补偿控制只能降低部分剩余风险；链路认证与监测不能替代设备缺失的硬件 Root of Trust。
purpose: 展示从物理安全到应用安全的多个防御面，以及补偿控制的跨层连接。
visual_focus: 从补偿控制（灰色虚线）到终点的主链路。
design_level: logical
layout: 垂直堆叠的矩形条，自底向上排列。左侧红色箭头标注攻击路径，右侧绿色箭头标注防御阻断路径，灰色虚线表示补偿控制连线。
elements:
- 'Layer 1: 物理安全（SE/TEE、防拆开关、JTAG锁定）'
- 'Layer 2: 设备固件安全（Secure Boot、OTA签名验证）'
- 'Layer 3: 通信安全（TLS/DTLS、双向认证、防重放）'
- 'Layer 4: 身份与访问控制（JWT令牌、OAuth 2.0、RBAC）'
- 'Layer 5: 平台安全（租户隔离、速率限制、审计日志）'
- 'Layer 6: 数据安全（存储加密、字段级脱敏）'
- 'Layer 7: 应用与AI安全（模型注入、Prompt威胁分类）'
relationships:
- 攻击路径（左侧红色箭头）从底向上穿过所有层
- 防御阻断（右侧绿色箭头）从顶向下触发
- 补偿控制（灰色虚线）连接不同层，用于降低部分剩余风险；即使 Layer 3 增加证书锁定与异常流量检测，也不能替代 Layer 2 缺失的硬件 Root of Trust
