<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图8-18 物联网安全日志收集与分析架构</title>
  <desc id="desc">该架构图展示从设备端、网关与平台服务到安全分析平台的日志流转路径，含实时告警与离线回溯双链路。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="ctx-end" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8"/></marker>
    <marker id="ctx-start" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto-start-reverse"><polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8"/></marker>

  <!-- 标题区 -->
  <text x="24" y="46" fill="#0F172A" font-size="22" font-weight="700">图8-18 物联网安全日志收集与分析架构</text>
  <text x="24" y="70" fill="#64748B" font-size="12">该架构图展示从设备端、网关与平台服务到安全分析平台的日志流转路径，含实时告警与离线回溯双链路。</text>

  <!-- 列标题 -->
  <text x="58" y="130" fill="#475569" font-size="14" font-weight="600">① 数据源层（设备 / 平台服务）</text>
  <text x="404" y="130" fill="#475569" font-size="14" font-weight="600">② 日志汇聚层</text>
  <text x="905" y="130" fill="#475569" font-size="14" font-weight="600" text-anchor="middle">③ 存储、分析与告警层</text>
  <line x1="382" y1="140" x2="382" y2="520" stroke="#E2E8F0" stroke-dasharray="6,4"/>
  <line x1="636" y1="140" x2="636" y2="520" stroke="#E2E8F0" stroke-dasharray="6,4"/>

  <!-- ===== 数据源层 ===== -->

  <text x="200" y="188" fill="#475569" font-size="12" text-anchor="middle">传感器 / 终端设备</text>

  <!-- 边缘网关 -->
  <rect x="48" y="212" width="304" height="58" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>

  <text x="200" y="258" fill="#475569" font-size="12" text-anchor="middle">syslog / MQTT 日志主题上报</text>

  <!-- 平台服务 -->
  <rect x="48" y="282" width="304" height="170" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>

  <rect x="64" y="366" width="272" height="38" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="200" y="390" fill="#0F172A" font-size="12" text-anchor="middle">认证服务（身份与权限）</text>
  <rect x="64" y="412" width="272" height="38" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="200" y="436" fill="#0F172A" font-size="12" text-anchor="middle">业务中心（核心业务逻辑）</text>

  <!-- ===== 日志汇聚层 ===== -->
  <!-- 消息队列 -->
  <rect x="392" y="142" width="216" height="130" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="500" y="172" fill="#C2410C" font-size="15" font-weight="700" text-anchor="middle">消息队列</text>
  <text x="500" y="194" fill="#9A3412" font-size="12" text-anchor="middle">Kafka / MQTT Broker</text>
  <text x="500" y="216" fill="#9A3412" font-size="12" text-anchor="middle">统一日志入口 · 高吞吐</text>
  <text x="500" y="238" fill="#9A3412" font-size="12" text-anchor="middle">削峰填谷</text>

  <text x="500" y="358" fill="#C2410C" font-size="15" font-weight="700" text-anchor="middle">日志采集代理</text>
  <text x="500" y="382" fill="#9A3412" font-size="12" text-anchor="middle">Sidecar 模式</text>
  <text x="500" y="404" fill="#9A3412" font-size="12" text-anchor="middle">部署于网关 / 平台服务侧</text>

  <rect x="650" y="300" width="200" height="110" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="750" y="328" fill="#065F46" font-size="15" font-weight="700" text-anchor="middle">离线数据湖</text>
  <text x="750" y="352" fill="#047857" font-size="12" text-anchor="middle">原始日志归档</text>
  <text x="750" y="376" fill="#047857" font-size="12" text-anchor="middle">支持回溯查询 / 取证</text>

  <rect x="910" y="142" width="250" height="120" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="1035" y="176" fill="#92400E" font-size="15" font-weight="700" text-anchor="middle">实时流处理引擎</text>

  <text x="372" y="162" fill="#475569" font-size="11" text-anchor="middle">syslog</text>

  <line x1="352" y1="240" x2="392" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="372" y="232" fill="#475569" font-size="11" text-anchor="middle">MQTT Log Topic</text>

  <line x1="352" y1="330" x2="470" y2="272" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="404" y="318" fill="#475569" font-size="11" text-anchor="middle">标准日志库</text>

  <line x1="392" y1="378" x2="352" y2="366" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="372" y="400" fill="#64748B" font-size="11" text-anchor="middle">Sidecar</text>

  <!-- 消息队列 → 实时流处理引擎（实时分流） -->
  <line x1="608" y1="160" x2="910" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="760" y="152" fill="#475569" font-size="11" text-anchor="middle">① 实时分流</text>

  <!-- 消息队列 → 离线数据湖（离线归档） -->
  <polyline points="608,250 625,250 625,344 650,344" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="318" fill="#475569" font-size="11" text-anchor="end">② 离线归档</text>

  <line x1="1035" y1="262" x2="1035" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1047" y="280" fill="#475569" font-size="11" text-anchor="start">触发告警</text>

  <line x1="1035" y1="380" x2="1035" y2="408" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1047" y="398" fill="#475569" font-size="11" text-anchor="start">告警推送</text>

  <!-- 集中索引库 ↔ 实时引擎（补充上下文，虚线双向） -->
  <line x1="850" y1="225" x2="910" y2="205" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4" marker-start="url(#ctx-start)" marker-end="url(#ctx-end)"/>
  <text x="880" y="238" fill="#64748B" font-size="11" text-anchor="middle">补充上下文</text>

  <!-- 集中索引库 ↔ 离线数据湖（补充上下文，虚线双向） -->
  <line x1="700" y1="280" x2="700" y2="300" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,4" marker-start="url(#ctx-start)" marker-end="url(#ctx-end)"/>
  <text x="680" y="294" fill="#64748B" font-size="11" text-anchor="end">补充上下文</text>

  <!-- 离线数据湖 → 回溯查询 -->
  <line x1="750" y1="410" x2="750" y2="428" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="762" y="426" fill="#475569" font-size="11" text-anchor="start">回溯查询 / 取证</text>

  <rect x="650" y="520" width="510" height="112" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="668" y="544" fill="#0F172A" font-size="13" font-weight="700">图注</text>
  <text x="668" y="570" fill="#475569" font-size="12">① 时间戳在设备端与平台侧统一格式，精确到毫秒。</text>
  <text x="668" y="594" fill="#475569" font-size="12">② 日志采集代理以 Sidecar 模式部署于网关和平台服务侧，避免业务代码侵入。</text>

  <line x1="24" y1="700" x2="1176" y2="700" stroke="#E2E8F0"/>

  <text x="62" y="726" fill="#64748B" font-size="11">设备</text>
  <rect x="120" y="716" width="16" height="12" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>

  <rect x="225" y="716" width="16" height="12" rx="2" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="247" y="726" fill="#64748B" font-size="11">日志汇聚</text>
  <rect x="325" y="716" width="16" height="12" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="347" y="726" fill="#64748B" font-size="11">实时流处理</text>
  <rect x="435" y="716" width="16" height="12" rx="2" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="457" y="726" fill="#64748B" font-size="11">存储与分析</text>
  <rect x="545" y="716" width="16" height="12" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="567" y="726" fill="#64748B" font-size="11">告警输出</text>
  <text x="600" y="748" fill="#475569" font-size="11" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">图8-18 物联网安全日志收集与分析架构：设备、网关与平台服务的日志经统一消息队列汇聚，分流为实时告警链路与离线归档链路，集中索引库为两条链路补充上下文。</text>
