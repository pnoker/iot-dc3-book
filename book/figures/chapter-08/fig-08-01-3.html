<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图8-1 TLS 1.3握手流程</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图8-1 TLS 1.3握手流程</title>
  <desc id="desc">读者应理解TLS 1.3握手流程中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">图8-1 TLS 1.3握手流程</title>
  <desc id="desc">读者应理解TLS 1.3握手流程中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图8-1 TLS 1.3握手流程</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解TLS 1.3握手流程中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">SEQUENCE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="sequence">
  <!-- 区域边界 -->
  <rect x="280" y="230" width="1140" height="170" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6,3" rx="8"/>
  <text x="295" y="255" fill="#64748B" font-size="12" font-weight="600">平台服务域</text>
  <rect x="280" y="400" width="1140" height="80" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6,3" rx="8"/>
  <text x="295" y="425" fill="#64748B" font-size="12" font-weight="600">治理与安全域</text>
  <rect x="280" y="480" width="1140" height="160" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6,3" rx="8"/>
  <text x="295" y="505" fill="#64748B" font-size="12" font-weight="600">数据资产域</text>

  <!-- 参与者盒子 -->
  <rect x="200" y="130" width="200" height="70" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="300" y="175" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">客户端</text>
  <rect x="1300" y="130" width="200" height="70" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1400" y="175" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">服务端</text>

  <!-- 生命线 -->
  <line x1="300" y1="200" x2="300" y2="660" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="1400" y1="200" x2="1400" y2="660" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- 消息1: ClientHello (明文) -->
  <line x1="300" y1="280" x2="1400" y2="280" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <rect x="750" y="256" width="200" height="20" rx="4" fill="white"/>
  <text x="850" y="270" fill="#0F172A" font-size="12" font-family="'Courier New',monospace" text-anchor="middle">ClientHello (版本/套件/random)</text>

  <!-- 消息2: ServerHello (明文) -->
  <line x1="1400" y1="350" x2="300" y2="350" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <rect x="730" y="358" width="240" height="20" rx="4" fill="white"/>
  <text x="850" y="372" fill="#0F172A" font-size="12" font-family="'Courier New',monospace" text-anchor="middle">ServerHello + 证书 + CertVerify</text>

  <!-- 消息3: 客户端证书 (加密) -->
  <line x1="300" y1="420" x2="1400" y2="420" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="740" y="396" width="220" height="20" rx="4" fill="white"/>
  <text x="850" y="410" fill="#0F172A" font-size="12" font-family="'Courier New',monospace" text-anchor="middle">客户端证书 + ECDHE参数</text>

  <!-- 消息4: Finished (客户端→服务端, 加密) -->
  <line x1="300" y1="490" x2="1400" y2="490" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="760" y="466" width="180" height="20" rx="4" fill="white"/>
  <text x="850" y="480" fill="#0F172A" font-size="12" font-family="'Courier New',monospace" text-anchor="middle">Finished (加密验证)</text>

  <!-- 消息5: Finished (服务端→客户端, 加密) -->
  <line x1="1400" y1="560" x2="300" y2="560" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="760" y="568" width="180" height="20" rx="4" fill="white"/>
  <text x="850" y="582" fill="#0F172A" font-size="12" font-family="'Courier New',monospace" text-anchor="middle">Finished (加密验证)</text>

  <!-- 消息6: 应用数据 (双向, 加密) -->
  <line x1="300" y1="630" x2="1400" y2="630" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <line x1="1400" y1="630" x2="300" y2="630" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="760" y="606" width="180" height="20" rx="4" fill="white"/>
  <text x="850" y="620" fill="#0F172A" font-size="12" font-family="'Courier New',monospace" text-anchor="middle">应用数据 (加密)</text>

  <!-- 关键说明callouts -->
  <rect x="400" y="710" width="280" height="36" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="540" y="733" fill="#0F172A" font-size="11" text-anchor="middle">明文交换: ClientHello和ServerHello</text>
  <rect x="700" y="710" width="280" height="36" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="840" y="733" fill="#0F172A" font-size="11" text-anchor="middle">加密通道: Finished及应用数据</text>
  <rect x="1000" y="710" width="280" height="36" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="1140" y="733" fill="#0F172A" font-size="11" text-anchor="middle">双向认证: 客户端需发送证书</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">白色箭头表示明文；阴影箭头表示加密</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">客户端节点使用蓝色，服务端节点使用蓝色，区分角色</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图8-1 TLS 1.3握手流程（含示意性的双向认证）：展示从ClientHello到应用数据全加密的主要步骤。</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">sequence</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">纵向时序，参与者包括客户端（设备）和服务端（平台）。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
