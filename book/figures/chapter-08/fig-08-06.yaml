type: sequence
title: 图8-6 TLS 1.3握手流程
audience_takeaway:  ClientHello 与 ServerHello 通过 key_share 协商后，ServerHello 之后的握手消息即加密；服务端先发加密 flight，客户端再发加密 flight。
purpose: 展示 TLS 1.3 从明文 key_share 交换、握手流量密钥建立到双方加密 handshake flight 和应用数据的正确时序，包含可选 mTLS。
visual_focus: 从客户端 → 服务端到客户端 ↔ 服务端的主链路。
design_level: implementation
layout: 纵向时序，参与者包括客户端（设备）和服务端（平台）。
elements:
- '客户端 → 服务端: ClientHello + key_share（明文，携带客户端临时公钥）'
- '服务端 → 客户端: ServerHello + key_share（明文，携带服务端临时公钥）'
- '服务端 → 客户端: 加密 handshake flight：EncryptedExtensions、可选 CertificateRequest、Certificate、CertificateVerify、Finished'
- '客户端 → 服务端: 加密 handshake flight：mTLS 时可选 Certificate 与 CertificateVerify，最后发送 Finished'
- '客户端 ↔ 服务端: 应用数据（使用应用流量密钥加密）'
relationships:
- ClientHello 和 ServerHello 携带 key_share 且为明文交换
- ServerHello 后双方导出握手流量密钥，后续握手消息均加密
- 服务端先发送加密 handshake flight，客户端随后发送加密 handshake flight
- mTLS 时客户端 Certificate 与 CertificateVerify 可选且成对出现；CertificateVerify 证明客户端持有证书对应私钥
regions:
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
- id: governance_domain
  label: 治理与安全域
  role: 风险控制与责任边界
- id: data_domain
  label: 数据资产域
  role: 数据沉淀与治理边界
components:
- id: c1
  label: 客户端 → 服务端
  type: platform
  subtitle: ClientHello（支持版本、密码套件列表、客户端临时公钥 key_share）
  group: platform_domain
  priority: primary
  shape: card
- id: c2
  label: 服务端 → 客户端
  type: platform
  subtitle: ServerHello（选定版本与套件、服务端临时公钥 key_share）
  group: platform_domain
  priority: normal
  shape: card
- id: c3
  label: 客户端 → 服务端
  type: security
  subtitle: 客户端证书（双向认证时）+ 密钥协商参数（ECDHE 共享密钥）
  group: governance_domain
  priority: normal
  shape: card
- id: c4
  label: 客户端 → 服务端
  type: platform
  subtitle: Finished（用导出会话密钥加密的验证消息）
  group: platform_domain
  priority: normal
  shape: bus
- id: c5
  label: 服务端 → 客户端
  type: platform
  subtitle: Finished（用导出会话密钥加密的验证消息）
  group: platform_domain
  priority: normal
  shape: bus
- id: c6
  label: 客户端 ↔ 服务端
  type: data
  subtitle: 应用数据（全部用会话密钥加密）
  group: data_domain
  priority: normal
  shape: database
connections:
- from: c1
  to: c2
  label: ClientHello 和 ServerHello 为明文交换
  style: solid
  direction: left-to-right
- from: c2
  to: c3
  label: Finished 及应用数据均为加密传输
  style: solid
  direction: left-to-right
- from: c3
  to: c4
  label: 双向认证时，客户端需额外发送客户端证书与 CertificateVerify
  style: solid
  direction: left-to-right
- from: c4
  to: c5
  label: ClientHello 和 ServerHello 为明文交换
  style: solid
  direction: left-to-right
- from: c5
  to: c6
  label: Finished 及应用数据均为加密传输
  style: solid
  direction: left-to-right
callouts:
- ClientHello和ServerHello为明文交换
- Finished及应用数据均为加密通道
- 双向认证时，客户端需额外发送客户端证书
legend:
- 白色箭头表示明文；阴影箭头表示加密。
- 客户端节点使用蓝色，服务端节点使用蓝色，区分角色。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
render_notes: 使用统一的浅色背景，圆角矩形标签，箭头带文字标签。客户端和服务端使用不同颜色区分。消息类型使用等宽字体。
caption:
  zh: 图8-6 TLS 1.3握手流程（含示意性的双向认证）：展示从ClientHello到应用数据全加密的主要步骤。
  en: Figure 8-6 The TLS 1.3 handshake (with an illustrative mutual authentication), showing the main steps from ClientHello to fully encrypted application data.
labels:
  en:
    图8-6 TLS 1.3握手流程: Figure 8-6 TLS 1.3 Handshake
    ClientHello 和 ServerHello 携带 key_share；ServerHello 后握手消息加密，服务端先发加密 flight，客户端再发加密 flight。: ClientHello and ServerHello carry key_share; after ServerHello the handshake is encrypted — the server sends its encrypted flight first, then the client.
    ServerHello 的 key_share 使双方导出握手流量密钥，其后的 Certificate 等 handshake flight 均受加密保护。: The ServerHello key_share lets both sides derive handshake traffic keys, so subsequent flights such as Certificate are encrypted.
    客户端（设备）: Client (Device)
    服务端（平台）: Server (Platform)
    握手流量密钥已导出 · 以下消息加密: Handshake Traffic Keys Derived · Messages Below Encrypted
    明文 · 版本 / 套件 / 客户端临时公钥: Plaintext · Version / Suites / Client Ephemeral Key
    明文 · 随后导出 handshake traffic secrets: Plaintext · Then Derive Handshake Traffic Secrets
    服务端加密 handshake flight: Server Encrypted Handshake Flight
    客户端加密 handshake flight: Client Encrypted Handshake Flight
    '[Certificate · CertificateVerify]（mTLS 可选）· Finished': '[Certificate · CertificateVerify] (optional mTLS) · Finished'
    加密 Application Data: Encrypted Application Data
    使用应用流量密钥 · 双向: App Traffic Keys · Both Ways
    明文: Plaintext
    加密 handshake flight: Encrypted Handshake Flight
    加密应用数据: Encrypted App Data
    '[方括号] = 可选消息（mTLS）': '[Brackets] = Optional Messages (mTLS)'
    图8-6 TLS 1.3 握手流程（含示意性的双向认证）：展示从 ClientHello 到应用数据全加密的主要步骤。: Figure 8-6 The TLS 1.3 handshake (with an illustrative mutual authentication), showing the main steps from ClientHello to fully encrypted application data.
