<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图8-8 物联网微隔离架构示意图</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图8-8 物联网微隔离架构示意图</title>
  <desc id="desc">读者应理解CoAP 的 OSCORE 安全处理流程示意中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">

  
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图8-8 物联网微隔离架构示意图</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解CoAP 的 OSCORE 安全处理流程示意中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">DATAFLOW</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="dataflow">
  <!-- 网络链路 -->
  <line x1="420" y1="350" x2="980" y2="350" stroke="#2563EB" stroke-width="3" marker-end="url(#bp-arrow-primary)"/>
  
  <!-- 通过分支 -->
  <path d="M 1280 325 L 1400 325 L 1400 200 L 1500 200" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow)"/>

  <!-- 拒绝分支 -->
  <path d="M 1280 325 L 1400 325 L 1400 500 L 1500 500" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#bp-arrow)"/>
  
  <!-- CoAP Client 大框 -->
  <rect x="120" y="250" width="300" height="200" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="270" y="280" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">CoAP Client（受限设备）</text>
  <text x="150" y="310" fill="#475569" font-size="12">发起请求，携带原始载荷</text>
  
  <!-- OSCORE 处理子框 -->
  <rect x="280" y="280" width="140" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="350" y="302" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">OSCORE 处理</text>
  <text x="350" y="322" fill="#64748B" font-size="11" text-anchor="middle">加密载荷</text>
  <text x="350" y="337" fill="#64748B" font-size="11" text-anchor="middle">→ 计算HMAC-MAC</text>
  <text x="350" y="352" fill="#64748B" font-size="11" text-anchor="middle">→ 打包Kid、序列号</text>
  
  <!-- CoAP Server 大框 -->
  <rect x="980" y="250" width="300" height="200" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="1130" y="280" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">CoAP Server（平台）</text>
  
  <!-- OSCORE 反处理子框 -->
  <rect x="1140" y="280" width="140" height="90" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1210" y="302" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">OSCORE 反处理</text>
  <text x="1210" y="322" fill="#64748B" font-size="11" text-anchor="middle">解密</text>
  <text x="1210" y="337" fill="#64748B" font-size="11" text-anchor="middle">→ 校验MAC</text>
  <text x="1210" y="352" fill="#64748B" font-size="11" text-anchor="middle">→ 检查序列号滑动窗口</text>
  
  <!-- 网络链路文字标签 -->
  <rect x="620" y="330" width="220" height="24" rx="4" fill="white" stroke="none" opacity="0.8"/>
  <text x="730" y="346" fill="#0F172A" font-size="13" text-anchor="middle" font-weight="500">CoAP 请求（/p/1.0/sensor/temp）</text>
  
  <!-- 通过分支文字 -->
  <text x="1350" y="195" fill="#0F172A" font-size="12" font-weight="500">完整性验证成功；</text>
  <text x="1350" y="210" fill="#0F172A" font-size="12" font-weight="500">序列号 seq=42 首次接收</text>
  
  <!-- 拒绝分支文字 -->
  <text x="1350" y="515" fill="#0F172A" font-size="12" font-weight="500">序列号已存在 / MAC 校验失败</text>
  
  <!-- 文档图标 -->
  <rect x="1500" y="170" width="50" height="60" rx="3" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <path d="M1550,170 L1550,195 L1525,195 Z" fill="#0F766E" opacity="0.3"/>
  <text x="1525" y="208" fill="#0F172A" font-size="10" text-anchor="middle">文档</text>
  
  <!-- 错误图标 -->
  <circle cx="1525" cy="500" r="25" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <line x1="1510" y1="485" x2="1540" y2="515" stroke="#DC2626" stroke-width="2"/>
  <line x1="1540" y1="485" x2="1510" y2="515" stroke="#DC2626" stroke-width="2"/>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">矩形框：实体或处理模块（实体框填白色，处理框填浅灰色）</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">水平粗箭头：网络数据传输（UDP，可加虚线表示）</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">细箭头：数据流向</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">OSCORE 处理模块先将 CoAP 请求载荷加密，再用 Client 与 Server 预共享的密钥计算基于 HMAC 的 MAC，然后将加密结果、密钥标识（Kid）和序列号打包为一条新的 CoAP 请求。Server 端解密并校验 MAC，同时检查序列号是否已在滑动窗口内。</text>
  <text x="900" y="870" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">设备睡眠后重新上线，序列号从上次持久化的递增位点继续，无需重新握手。</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">dataflow</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">水平流向，从左至右依次排列：CoAP Client 方框、OSCORE 处理子模块、网络链路线、CoAP Server 方框、OSCORE 反处理子模块、通过分支和拒绝分支。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
