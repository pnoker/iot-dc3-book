<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图8-8 物联网微隔离架构示意图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; }
    body { background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图8-8 物联网微隔离架构示意图</title>
  <desc id="desc">微隔离把隔离规则下放到SDN微分段控制层，按设备级下发策略，使被攻陷设备无法在同一网络内横向移动。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">

  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
    <marker id="bp-arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0F766E"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="36" font-weight="700">图8-8 物联网微隔离架构示意图</text>
  <text x="82" y="70" fill="#64748B" font-size="12">微隔离把隔离规则下放到SDN微分段控制层，按设备级下发策略，使被攻陷设备无法在同一网络内横向移动。</text>

  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">

  <!-- 平台服务域边界（接入网关层/微分段控制层/全局策略编排层） -->
  <rect x="310" y="165" width="1210" height="445" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="326" y="188" fill="#475569" font-size="12" font-weight="600">平台服务域</text>

  <!-- 连线（先画，箭头落在盒子后方） -->
  <!-- r4→r3 全局策略编排层→微分段控制层：策略下发（实线蓝） -->
  <line x1="700" y1="280" x2="700" y2="330" stroke="#2563EB" stroke-width="2.5" marker-end="url(#bp-arrow-primary)" />
  <!-- r3→r2 微分段控制层→接入网关层：规则下发（实线蓝） -->
  <line x1="700" y1="435" x2="700" y2="485" stroke="#2563EB" stroke-width="2.5" marker-end="url(#bp-arrow-primary)" />
  <!-- r2→r3 接入网关层→微分段控制层：状态上报（虚线青绿） -->
  <line x1="880" y1="485" x2="880" y2="435" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#bp-arrow-teal)" />
  <!-- r1→r2 物理设备层→接入网关层：设备接入（实线蓝） -->
  <line x1="700" y1="640" x2="700" y2="590" stroke="#2563EB" stroke-width="2.5" marker-end="url(#bp-arrow-primary)" />

  <!-- 连线标注 -->
  <text x="714" y="310" fill="#2563EB" font-size="12" font-weight="600">策略下发</text>
  <text x="714" y="465" fill="#2563EB" font-size="12" font-weight="600">规则下发</text>
  <text x="894" y="465" fill="#0F766E" font-size="12" font-weight="600">状态上报</text>
  <text x="714" y="620" fill="#2563EB" font-size="12" font-weight="600">设备接入</text>

  <!-- 全局策略编排层（layer4） -->
  <rect x="420" y="175" width="1060" height="105" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
  <text x="950" y="201" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">全局策略编排层</text>
  <text x="950" y="223" fill="#475569" font-size="12" text-anchor="middle">统一策略建模 · 全局编排 · 应急隔离决策</text>

  <!-- 微分段控制层（layer3，核心决策点） -->
  <rect x="420" y="330" width="1060" height="105" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
  <text x="950" y="356" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">微分段控制层</text>
  <text x="950" y="378" fill="#475569" font-size="12" text-anchor="middle">SDN 微分段控制器 · 生成逐设备隔离规则</text>
  <rect x="1358" y="340" width="108" height="24" rx="12" fill="#FFF7ED" stroke="#F97316"/>
  <text x="1412" y="357" fill="#F97316" font-size="11" font-weight="600" text-anchor="middle">核心决策点</text>

  <!-- 接入网关层（layer2） -->
  <rect x="420" y="485" width="1060" height="105" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
  <text x="950" y="511" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">接入网关层</text>
  <text x="950" y="533" fill="#475569" font-size="12" text-anchor="middle">策略执行点 · 身份认证 · 流量阻断与转发</text>

  <!-- 物理设备层（layer1，主链路起点，一对多被隔离对象） -->
  <rect x="420" y="640" width="1060" height="105" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
  <text x="950" y="666" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">物理设备层</text>
  <text x="950" y="686" fill="#475569" font-size="12" text-anchor="middle">海量感知/控制终端 · 被隔离保护对象</text>
  <rect x="574" y="700" width="170" height="32" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
  <text x="659" y="720" fill="#0F172A" font-size="12" text-anchor="middle">智能门锁</text>
  <rect x="768" y="700" width="170" height="32" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
  <text x="853" y="720" fill="#0F172A" font-size="12" text-anchor="middle">环境传感器</text>
  <rect x="962" y="700" width="170" height="32" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
  <text x="1047" y="720" fill="#0F172A" font-size="12" text-anchor="middle">PLC 控制</text>
  <rect x="1156" y="700" width="170" height="32" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
  <text x="1241" y="720" fill="#0F172A" font-size="12" text-anchor="middle">摄像头终端</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="792" width="16" height="14" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="106" y="804" fill="#64748B" font-size="10.5" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">分层组件（每个层包含多个功能实体）</text>
  <line x1="80" y1="822" x2="108" y2="822" stroke="#2563EB" stroke-width="2.5" marker-end="url(#bp-arrow-primary)" />
  <text x="118" y="826" fill="#64748B" font-size="10.5" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">策略或配置数据的流向（实线）</text>
  <line x1="80" y1="846" x2="108" y2="846" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#bp-arrow-teal)" />
  <text x="118" y="850" fill="#64748B" font-size="10.5" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">控制咨询或动态调整的流向（虚线）</text>
  <text x="900" y="878" fill="#475569" font-size="17" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图8-8 编排层只向微分段控制器下发策略，控制器再由网关等执行点实施隔离；编排不直达设备。</text>
  </svg>
</svg>

  </main>
</body>
</html>
