  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">图8-9 密钥生命周期管理与云边协同流程</title>
  <desc id="desc">密钥从生成、分发、轮换到撤销和销毁有明确状态；撤销后云端与边缘都必须停止使用。</desc>
  <rect width="1200" height="600" fill="#F8FAFC"/>
  <svg x="24" y="72" width="1152" height="456" viewBox="0 0 1800 700" preserveAspectRatio="xMidYMid meet">

  
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="700" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>

  <text x="82" y="70" fill="#64748B" font-size="12">密钥从生成、分发、轮换到撤销和销毁有明确状态；撤销后云端与边缘都必须停止使用。</text>

  <text x="80" y="450" font-size="16" font-weight="600" fill="#475569">边缘</text>

  <rect x="960" y="180" width="260" height="80" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>

  <rect x="1350" y="180" width="260" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>

  <rect x="570" y="405" width="260" height="80" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="700" y="441" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">密钥轮换</text><text x="700" y="463" font-size="12" fill="#475569" text-anchor="middle">轮换中</text>
  <rect x="960" y="405" width="260" height="80" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1090" y="441" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">密钥撤销</text><text x="1090" y="463" font-size="12" fill="#475569" text-anchor="middle">已撤销 · 停止使用</text>
  <rect x="1350" y="405" width="260" height="80" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1480" y="441" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">密钥销毁</text><text x="1480" y="463" font-size="12" fill="#475569" text-anchor="middle">待销毁</text>
</g>
  <line x1="64" y1="535" x2="1736" y2="535" stroke="#E2E8F0"/>
  <rect x="80" y="557" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="568" fill="#64748B" font-size="11" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">颜色=使用中（绿色）、轮换中（黄色）、已撤销/停用（红色）、待销毁（灰色）</text>
  <rect x="930" y="557" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="954" y="568" fill="#64748B" font-size="11" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">虚线箭头=通过 TLS 加密通道同步</text>
  <text x="900" y="630" fill="#94A3B8" font-size="11" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图8-9 密钥生命周期管理与云边协同流程</text>
