type: architecture
title: 图8-18 物联网安全日志收集与分析架构
audience_takeaway: 日志先统一汇聚再分流：实时路径负责秒级告警，离线路径负责回溯取证，集中索引把两条链路连成同一条证据链。
purpose: 展示设备、网关与平台日志从统一采集到实时告警和离线取证的双路径分析架构。
layout: 从左到右分为日志源、汇聚、实时与离线分析、告警输出四个区域，集中索引库为两条分析路径提供关联上下文。
render_notes: 横向数据流铺满版心，实时路径使用实线、离线路径使用虚线，日志来源与分析职责通过分组边界和文字标签区分。
elements:
- 端侧设备、边缘网关与平台服务
- 日志采集代理与消息队列
- 实时流处理引擎、集中索引库与离线数据湖
- 安全事件总线与通知通道
relationships:
- 端侧设备、边缘网关、平台服务 → 消息队列：通过 syslog、MQTT 日志主题或标准日志库统一汇聚
- 日志采集代理 → 消息队列：以 Sidecar 方式采集并转发平台日志
- 消息队列 → 实时流处理引擎 → 安全事件总线 → 通知通道：实时检测并推送告警
- 消息队列 → 离线数据湖：归档原始日志供回溯取证
- 集中索引库 ↔ 实时流处理引擎、离线数据湖：提供可检索的关联上下文
description: '该架构图展示从设备端到安全分析平台的日志流转路径。


  **图元与图例**：

  - 设备（灰色矩形）：端侧设备、边缘网关

  - 平台服务（蓝色矩形）：API网关、认证服务、业务中心

  - 日志汇聚层（橙色矩形）：消息队列（如Kafka）、日志采集代理

  - 存储与分析层（绿色矩形）：集中索引库（如Elasticsearch）、离线数据湖

  - 实时流处理引擎（黄色矩形）：规则引擎、异常检测模型

  - 告警输出（红色矩形）：安全事件总线、通知通道

  - 箭头：数据流方向


  **布局与连接**：

  - 左侧：设备、网关通过 syslog 或 MQTT 日志主题上报日志 → 消息队列

  - 中间：平台服务通过标准日志库写入同一消息队列

  - 消息队列 → 分流：一路进实时流处理引擎 → 触发告警 → 安全事件总线；另一路进离线存储 → 提供回溯查询

  - 集中索引库同时被实时引擎和离线引擎访问，用于补充上下文


  **图注**：

  - 时间戳必须在设备端和平台侧统一格式（精确到毫秒）

  - 日志采集代理推荐使用 Sidecar 模式部署在网关和平台服务侧，避免业务代码侵入


  **HTML/SVG 渲染说明**：

  使用三层分层布局：左半部分（设备层）到中部分布（汇聚层）到右部分布（分析层）。颜色区分组件类型。箭头标注“syslog”“MQTT Log Topic”。'
caption:
  zh: 图8-18 设备、网关与平台日志先统一汇聚，再分别进入实时检测与离线归档；集中索引把实时告警和事后取证连接为同一条证据链。
  en: Figure 8-18 Device, gateway, and platform logs are first aggregated uniformly, then split into real-time detection and offline archiving; the central index links real-time alerts and after-the-fact forensics into a single chain of evidence.
