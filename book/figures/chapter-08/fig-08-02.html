  <title id="title">图8-2 物联网纵深防御多层模型</title>
  <desc id="desc">七层防御逐层拦截攻击；单层能力不足时，相邻层用补偿控制降低剩余风险。</desc>
  <defs>

  <rect width="1200" height="680" fill="#F8FAFC"/><rect x="28" y="104" width="1144" height="500" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="42" cy="42" r="6" fill="#2563EB"/><text x="58" y="49" font-size="24" font-weight="700">图8-2 物联网纵深防御多层模型</text>
  <text x="58" y="76" fill="#475569" font-size="13">补偿控制只能降低部分剩余风险，不能替代硬件 Root of Trust 等基础安全能力。</text>


  <text x="118" y="128" fill="#DC2626" font-size="12" font-weight="700" text-anchor="middle">攻击逐层突破</text>

  <text x="1082" y="128" fill="#0F766E" font-size="12" font-weight="700" text-anchor="middle">逐层检测与阻断</text>
  <line x1="1082" y1="157" x2="1082" y2="550" stroke="#0F766E" stroke-width="3" marker-end="url(#defend)"/>

  <g font-size="12">
    <rect x="190" y="145" width="820" height="48" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/><text x="212" y="166" font-size="15" font-weight="700">Layer 7 · 应用与 AI 安全</text><text x="212" y="184" fill="#475569">输入隔离 · Tool 白名单 · 参数校验 · 人工确认</text>

    <rect x="190" y="316" width="820" height="48" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/><text x="212" y="337" font-size="15" font-weight="700">Layer 4 · 身份与访问控制</text><text x="212" y="355" fill="#475569">JWT / OAuth 2.0 · RBAC · fail-closed</text>

    <rect x="190" y="487" width="820" height="48" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/><text x="212" y="508" font-size="15" font-weight="700">Layer 1 · 物理安全</text><text x="212" y="526" fill="#475569">SE / TEE · 防拆 · JTAG 锁定</text>
  </g>

  <rect x="810" y="414" width="284" height="41" rx="6" fill="#FFFFFF" stroke="#94A3B8"/><text x="952" y="430" font-size="11" font-weight="700" text-anchor="middle">补偿控制仅降低部分风险</text><text x="952" y="446" fill="#475569" font-size="11" text-anchor="middle">不能替代缺失的硬件 Root of Trust</text>

  <line x1="126" y1="642" x2="158" y2="642" stroke="#DC2626" stroke-width="3" marker-end="url(#attack)"/><text x="170" y="646" fill="#475569" font-size="11">攻击路径</text>
  <line x1="300" y1="642" x2="332" y2="642" stroke="#0F766E" stroke-width="3" marker-end="url(#defend)"/><text x="344" y="646" fill="#475569" font-size="11">检测与阻断</text>

  <text x="600" y="670" fill="#475569" font-size="11" text-anchor="middle">图8-2 单层防御失守后仍由相邻层承接；补偿控制用于降低风险，不等于替代缺失的基础安全能力。</text>
