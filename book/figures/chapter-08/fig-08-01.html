<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图8-1 物联网安全威胁分层分类</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; }
    body { background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图8-1 物联网安全威胁分层分类</title>
  <desc id="desc">物理接触、链路攻击、平台越权与 Prompt 注入可跨层传导，安全必须覆盖设备到应用全链路。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">

  
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图8-1 物联网安全威胁分层分类</text>
  <text x="82" y="70" fill="#64748B" font-size="12">物理接触、链路攻击、平台越权与 Prompt 注入可跨层传导，安全必须覆盖设备到应用全链路。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LAYERED</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="layered">
  <!-- 左侧纵向箭头：AI模型攻击 -->
  <line x1="100" y1="125" x2="100" y2="405" stroke="#F97316" stroke-width="2" marker-end="url(#bp-arrow)" />
  <text x="78" y="265" fill="#F97316" font-size="14" font-weight="600" text-anchor="middle" transform="rotate(-90,78,265)">AI模型攻击</text>
  
  <!-- 右侧纵向箭头：数据泄露与隐私侵犯 -->
  <line x1="1680" y1="125" x2="1680" y2="705" stroke="#DC2626" stroke-width="2" marker-end="url(#bp-arrow)" />
  <text x="1660" y="415" fill="#DC2626" font-size="14" font-weight="600" text-anchor="middle" transform="rotate(-90,1660,415)">数据泄露与隐私侵犯</text>
  
  <!-- 跨层攻击路径（虚线红色） -->
  <polyline points="250,640 250,500 400,500 400,360 1680,360" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#bp-arrow)" />
  
  <!-- 应用层 -->
  <rect x="180" y="125" width="1460" height="130" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
  <text x="200" y="155" fill="#0F172A" font-size="16" font-weight="600">应用层（用户界面/业务逻辑）</text>
  <text x="220" y="175" fill="#475569" font-size="11">• XSS/CSRF</text>
  <text x="220" y="189" fill="#475569" font-size="11">• 不安全移动接口</text>
  <text x="220" y="203" fill="#475569" font-size="11">• 敏感信息暴露</text>
  <text x="220" y="217" fill="#475569" font-size="11">• Prompt注入</text>
  <text x="220" y="231" fill="#475569" font-size="11">• 模型窃取/投毒</text>
  
  <!-- 平台层 -->
  <rect x="180" y="275" width="1460" height="130" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
  <text x="200" y="305" fill="#0F172A" font-size="16" font-weight="600">平台层（云端/边缘/API）</text>
  <text x="220" y="325" fill="#475569" font-size="11">• 身份伪造</text>
  <text x="220" y="339" fill="#475569" font-size="11">• JWT泄露/伪造</text>
  <text x="220" y="353" fill="#475569" font-size="11">• 多租户逃逸</text>
  <text x="220" y="367" fill="#475569" font-size="11">• API滥用/无限流</text>
  <text x="220" y="381" fill="#475569" font-size="11">• SQL/NoSQL注入</text>
  <text x="220" y="395" fill="#475569" font-size="11">• 脆弱认证</text>
  
  <!-- 网络层 -->
  <rect x="180" y="425" width="1460" height="130" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
  <text x="200" y="455" fill="#0F172A" font-size="16" font-weight="600">网络层（通信/传输）</text>
  <text x="220" y="475" fill="#475569" font-size="11">• 窃听（明文传输）</text>
  <text x="220" y="489" fill="#475569" font-size="11">• 篡改（中间人）</text>
  <text x="220" y="503" fill="#475569" font-size="11">• 重放（未加nonce/时间戳）</text>
  <text x="220" y="517" fill="#475569" font-size="11">• 降级攻击（强制用弱加密算法）</text>
  <text x="220" y="531" fill="#475569" font-size="11">• DDoS（僵尸网络）</text>
  
  <!-- 感知层 -->
  <rect x="180" y="575" width="1460" height="130" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
  <text x="200" y="605" fill="#0F172A" font-size="16" font-weight="600">感知层（物理/感知设备）</text>
  <text x="220" y="625" fill="#475569" font-size="11">• 物理拆解</text>
  <text x="220" y="639" fill="#475569" font-size="11">• 调试接口（JTAG/SWD）</text>
  <text x="220" y="653" fill="#475569" font-size="11">• 固件提取（非加密Flash）</text>
  <text x="220" y="667" fill="#475569" font-size="11">• 侧信道攻击（功耗/电磁分析）</text>
  <text x="220" y="681" fill="#475569" font-size="11">• 默认弱口令</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="11" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色=核心平台服务</text>
  <text x="900" y="855" fill="#94A3B8" font-size="11" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图8-1 物联网安全威胁分层分类，展示威胁从物理层到应用层的分布及跨层攻击向量。数据泄露和AI模型攻击作为横切面威胁纵贯多个层次。</text>
  </svg>
</svg>

      <div class="card"><div class="label">图表类型</div><div class="value">layered</div></div>

      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
