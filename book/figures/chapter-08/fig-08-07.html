<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图8-7 CoAP 的 OSCORE 安全处理流程示意</title><style>*{box-sizing:border-box}html,body{margin:0;background:#F8FAFC}body{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.page{width:1200px}</style></head><body><main class="page" data-figure-root><svg width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">图8-7 CoAP 的 OSCORE 安全处理流程示意</title><desc id="desc">OSCORE 从安全上下文派生参数，以 AEAD 生成密文和认证标签；接收端检查重放窗口并完成 AEAD 验证解密，失败则丢弃或返回规范定义的错误。</desc><defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker><marker id="r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#DC2626"/></marker></defs><rect width="1200" height="680" fill="#F8FAFC"/><circle cx="42" cy="40" r="6" fill="#2563EB"/><text x="58" y="48" font-size="24" font-weight="700">图8-7 CoAP 的 OSCORE 安全处理流程</text><text x="58" y="76" font-size="13" fill="#475569">OSCORE 使用 AEAD 同时提供机密性与完整性，Partial IV 参与 nonce 构造并支撑重放检测。</text><rect x="28" y="104" width="1144" height="500" rx="8" fill="#FFF" stroke="#E2E8F0"/><g stroke-width="1.8"><rect x="55" y="170" width="180" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB"/><rect x="275" y="170" width="180" height="84" rx="8" fill="#ECFDF5" stroke="#0F766E"/><rect x="495" y="170" width="180" height="84" rx="8" fill="#FFF7ED" stroke="#F97316"/><rect x="735" y="170" width="180" height="84" rx="8" fill="#FFFBEB" stroke="#D97706"/><rect x="955" y="170" width="180" height="84" rx="8" fill="#F5F3FF" stroke="#7C3AED"/></g><g text-anchor="middle"><text x="145" y="199" font-size="15" font-weight="700">发送方安全上下文</text><text x="145" y="220" font-size="12" fill="#475569">Master Secret / Salt</text><text x="145" y="238" font-size="12" fill="#475569">Sender ID · Common IV</text><text x="365" y="199" font-size="15" font-weight="700">构造 nonce 与 AAD</text><text x="365" y="220" font-size="12" fill="#475569">分配 Partial IV</text><text x="365" y="238" font-size="12" fill="#475569">保护选项分类</text><text x="585" y="199" font-size="15" font-weight="700">AEAD 加密</text><text x="585" y="220" font-size="12" fill="#475569">密文 + 认证标签</text><text x="585" y="238" font-size="12" fill="#475569">形成 OSCORE 消息</text><text x="825" y="199" font-size="15" font-weight="700">重放窗口预检查</text><text x="825" y="220" font-size="12" fill="#475569">Partial IV 是否可接受</text><text x="825" y="238" font-size="12" fill="#475569">暂不提交窗口更新</text><text x="1045" y="199" font-size="15" font-weight="700">AEAD 验证解密</text><text x="1045" y="220" font-size="12" fill="#475569">认证标签通过</text><text x="1045" y="238" font-size="12" fill="#475569">恢复 CoAP 请求</text></g><g stroke="#2563EB" stroke-width="2.5" marker-end="url(#a)"><line x1="235" y1="212" x2="270" y2="212"/><line x1="455" y1="212" x2="490" y2="212"/><line x1="675" y1="212" x2="730" y2="212"/><line x1="915" y1="212" x2="950" y2="212"/></g><line x1="1045" y1="254" x2="1045" y2="330" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a)"/><rect x="895" y="335" width="300" height="72" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/><text x="1045" y="364" text-anchor="middle" font-size="15" font-weight="700">提交重放窗口更新</text><text x="1045" y="387" text-anchor="middle" font-size="12" fill="#475569">仅在 AEAD 验证成功后接受序号</text><path d="M825 254 V470 H720" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#r)"/><path d="M1045 407 V470 H720" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#r)"/><rect x="350" y="430" width="370" height="82" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/><text x="535" y="460" text-anchor="middle" font-size="15" font-weight="700" fill="#DC2626">失败处理</text><text x="535" y="482" text-anchor="middle" font-size="12" fill="#475569">重放 / AEAD 认证失败：丢弃消息</text><text x="535" y="500" text-anchor="middle" font-size="12" fill="#475569">需要响应时按 RFC 8613 规定返回错误</text><line x1="40" y1="620" x2="1160" y2="620" stroke="#E2E8F0"/><text x="600" y="650" text-anchor="middle" font-size="11" fill="#475569">图8-7 OSCORE 在 CoAP 应用层直接端到端加密，免去 DTLS 握手，适合受限设备；重放窗口仅在 AEAD 认证通过后才提交，认证或重放失败则丢弃并按 RFC 8613 返回错误。</text></svg></main></body></html>
