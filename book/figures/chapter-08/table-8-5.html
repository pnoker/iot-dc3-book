<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多租户隔离强度对比</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }

  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">多租户隔离强度对比</title>
  <desc id="desc">读者应理解多租户隔离强度对比中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">多租户隔离强度对比</title>
  <desc id="desc">读者应理解多租户隔离强度对比中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">多租户隔离强度对比</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解多租户隔离强度对比中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">MATRIX</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="matrix">
  <!-- 标题行背景 -->
  <rect x="100" y="150" width="180" height="50" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="190" y="180" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">维度</text>
  
  <!-- 低强度列标题 -->
  <rect x="280" y="150" width="440" height="50" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="500" y="180" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">低强度</text>
  
  <!-- 中强度列标题 -->
  <rect x="720" y="150" width="440" height="50" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="940" y="180" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">中强度</text>
  
  <!-- 高强度列标题 -->

  <text x="1380" y="180" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">高强度</text>

  <!-- 数据行1：数据隔离 -->
  <rect x="100" y="210" width="180" height="170" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="110" y="240" fill="#0F172A" font-size="14" font-weight="700">数据隔离</text>

  <text x="300" y="255" fill="#64748B" font-size="12">跨租户风险：高</text>
  <text x="300" y="275" fill="#64748B" font-size="12">资源效率：高</text>
  <text x="300" y="295" fill="#64748B" font-size="12">运维复杂度：低</text>

  <rect x="720" y="210" width="440" height="170" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="740" y="235" fill="#64748B" font-size="12">实现方式：表级隔离</text>
  <text x="740" y="255" fill="#64748B" font-size="12">跨租户风险：中</text>
  <text x="740" y="275" fill="#64748B" font-size="12">资源效率：中</text>
  <text x="740" y="295" fill="#64748B" font-size="12">运维复杂度：中</text>

  <rect x="1160" y="210" width="440" height="170" fill="#F5F3FF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1180" y="235" fill="#64748B" font-size="12">实现方式：独立数据库</text>
  <text x="1180" y="255" fill="#64748B" font-size="12">跨租户风险：低</text>
  <text x="1180" y="275" fill="#64748B" font-size="12">资源效率：低</text>
  <text x="1180" y="295" fill="#64748B" font-size="12">运维复杂度：高</text>

  <!-- 数据行2：计算资源隔离 -->
  <rect x="100" y="390" width="180" height="170" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="110" y="420" fill="#0F172A" font-size="14" font-weight="700">计算资源隔离</text>
  
  <rect x="280" y="390" width="440" height="170" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="300" y="415" fill="#64748B" font-size="12">实现方式：共享进程</text>
  <text x="300" y="435" fill="#64748B" font-size="12">跨租户风险：高</text>
  <text x="300" y="455" fill="#64748B" font-size="12">资源效率：高</text>
  <text x="300" y="475" fill="#64748B" font-size="12">运维复杂度：低</text>

  <rect x="720" y="390" width="440" height="170" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="740" y="415" fill="#64748B" font-size="12">实现方式：容器隔离</text>
  <text x="740" y="435" fill="#64748B" font-size="12">跨租户风险：中</text>
  <text x="740" y="455" fill="#64748B" font-size="12">资源效率：中</text>
  <text x="740" y="475" fill="#64748B" font-size="12">运维复杂度：中</text>

  <rect x="1160" y="390" width="440" height="170" fill="#F5F3FF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1180" y="415" fill="#64748B" font-size="12">实现方式：独立VM</text>
  <text x="1180" y="435" fill="#64748B" font-size="12">跨租户风险：低</text>
  <text x="1180" y="455" fill="#64748B" font-size="12">资源效率：低</text>
  <text x="1180" y="475" fill="#64748B" font-size="12">运维复杂度：高</text>

  <!-- 数据行3：网络隔离 -->
  <rect x="100" y="570" width="180" height="170" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="110" y="600" fill="#0F172A" font-size="14" font-weight="700">网络隔离</text>
  
  <rect x="280" y="570" width="440" height="170" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="300" y="595" fill="#64748B" font-size="12">实现方式：共享IP</text>
  <text x="300" y="615" fill="#64748B" font-size="12">跨租户风险：高</text>
  <text x="300" y="635" fill="#64748B" font-size="12">资源效率：高</text>
  <text x="300" y="655" fill="#64748B" font-size="12">运维复杂度：低</text>

  <rect x="720" y="570" width="440" height="170" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="740" y="595" fill="#64748B" font-size="12">实现方式：VLAN隔离</text>
  <text x="740" y="615" fill="#64748B" font-size="12">跨租户风险：中</text>
  <text x="740" y="635" fill="#64748B" font-size="12">资源效率：中</text>
  <text x="740" y="655" fill="#64748B" font-size="12">运维复杂度：中</text>

  <rect x="1160" y="570" width="440" height="170" fill="#F5F3FF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1180" y="595" fill="#64748B" font-size="12">实现方式：独立VPC</text>
  <text x="1180" y="615" fill="#64748B" font-size="12">跨租户风险：低</text>
  <text x="1180" y="635" fill="#64748B" font-size="12">资源效率：低</text>
  <text x="1180" y="655" fill="#64748B" font-size="12">运维复杂度：高</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">低强度使用灰色背景，中强度使用浅蓝色，高强度使用深蓝色</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">表8-5 多租户隔离强度对比（假设场景：智能家居平台“智家云”）</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">matrix</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">表格，行为三种维度（数据隔离、计算资源隔离、网络隔离），每行三个强度等级（低/中/高），列包含典型实现方式、跨租户风险、资源效率高低、运维复杂度高低四项指标</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
