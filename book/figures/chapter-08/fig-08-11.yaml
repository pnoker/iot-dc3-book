    图8-11 JWT 认证与授权架构：认证层颁发令牌、授权层执行 RBAC/ABAC 决策、审计日志记录上下文，租户边界贯穿始终，未明确授予的权限一律拒绝（fail-closed）。: 'Figure 8-11 The JWT authentication and authorization architecture: the authentication layer issues tokens, the authorization layer enforces RBAC/ABAC decisions, the audit log records context, the tenant boundary runs throughout, and anything not explicitly granted is denied (fail-closed).'
