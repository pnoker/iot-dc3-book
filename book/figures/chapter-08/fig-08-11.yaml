type: layered
title: 图8-11 物联网平台 JWT 认证与授权架构
audience_takeaway: JWT 携带 tenant_id 完成认证后，授权层的 RBAC/ABAC 决策与审计日志仍须在同一租户边界内执行；任何一环丢失租户上下文，都会成为跨租户越权的入口。
purpose: 展示 JWT 认证与授权在物联网平台中的四层架构与鉴权流程。
layout: 自下而上四层:基础设施层→认证层→授权层→策略层;租户边界以垂直虚线贯穿。
elements:
- 底部基础设施层:数据库(用户凭证、角色映射、策略规则)+ JWT 签发服务。
- 中部认证层:用户/设备提交身份信息,验证后颁发 JWT(含 user_id、role、tenant_id、exp)。
- 上部授权层:授权决策点接收 API 网关请求,执行 RBAC/ABAC 策略,决策记录到审计日志。
- 顶层策略层:运营人员通过管理控制台配置角色、权限与 ABAC 规则表达式。
relationships:
- 用户→认证层→JWT→授权层→资源(设备/数据)。
- 租户边界以垂直虚线屏障贯穿,确保跨租户请求被拒绝。
- 授权层输出端标注 fail-closed,未明确授予的权限一律拒绝。
render_notes: 四层自下而上分层绘制,不同背景色区分;成功路径绿色箭头、被拒绝红色箭头;授权层右侧放大镜图标代表审计日志。
caption:
  zh: 图8-11 JWT 认证与授权架构:认证层颁发令牌、授权层执行 RBAC/ABAC 决策、审计日志记录上下文,租户边界贯穿始终。
  en: 'Figure 8-11 The JWT authentication and authorization architecture: the authentication layer issues tokens, the authorization layer enforces RBAC/ABAC decisions, the audit log records context, and the tenant boundary runs throughout.'
