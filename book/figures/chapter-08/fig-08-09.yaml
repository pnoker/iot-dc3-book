type: flowchart
title: 图8-9 密钥生命周期管理与云边协同流程
audience_takeaway: 密钥状态沿生成、分发、轮换、撤销、销毁迁移，云端与边缘经TLS加密通道协同管理，撤销即从可用态剔除。
