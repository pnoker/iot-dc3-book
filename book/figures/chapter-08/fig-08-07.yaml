render_notes: HTML/SVG 渲染，水平布局，从左至右绘制主要实体和方框，实体间用带箭头的直线连接。左端矩形‘CoAP Client’右侧紧接矩形‘OSCORE 处理’，之后画一条粗箭线表示网络链路（可加虚线表示 UDP）。右端矩形‘CoAP Server’内部再划出一个子矩形‘OSCORE 反处理’。从该子矩形右侧分出两条分支线：一条向上指向文档图标，一条向下指向错误图标。各箭头旁标注相应文字。附注框以虚线边框矩形置于相应分支终点处。
caption:
  zh: 图8-7 OSCORE 从安全上下文派生 nonce 与 AAD，由 AEAD 一次生成密文和认证标签；接收方先做重放窗口预检查，再完成 AEAD 验证解密，仅在成功后提交窗口更新。重放或认证失败时丢弃消息，并按规范处理需要返回的错误。
  en: Figure 8-7 OSCORE derives the nonce and AAD from the security context and uses AEAD to produce the ciphertext and authentication tag in one pass; the receiver first pre-checks the replay window, then performs AEAD verification and decryption, and commits the window update only on success. On replay or authentication failure the message is dropped, and required error responses are handled per the specification.
labels:
  en:
    图8-7 CoAP 的 OSCORE 安全处理流程示意: Figure 8-7 OSCORE Security Processing for CoAP
    OSCORE 从安全上下文派生 nonce 与 AAD，以 AEAD 生成密文和认证标签；接收端先做重放窗口预检查，再完成 AEAD 验证解密，仅在成功后提交窗口更新。: OSCORE derives the nonce and AAD from the security context and uses AEAD to produce ciphertext and tag; the receiver pre-checks the replay window, then verifies and decrypts, committing the window only on success.
    OSCORE 使用 AEAD 同时提供机密性与完整性，Partial IV 参与 nonce 构造并支撑重放检测。: OSCORE uses AEAD for both confidentiality and integrity; the Partial IV builds the nonce and supports replay detection.
    发送方安全上下文: Sender Security Context
    接收方安全上下文: Receiver Security Context
    （Partial IV 预检查窗口）: (Partial IV Pre-Check Window)
    （受限设备）: (Constrained Device)
    发起请求: Send Request
    携带原始载荷: With Original Payload
    OSCORE 发送处理: OSCORE Send Processing
    ① 构造 nonce 与 AAD: ① Build Nonce and AAD
    ② AEAD 加密: ② AEAD Encryption
    生成密文 + 认证标签: Ciphertext + Auth Tag
    ③ 携带 OSCORE 选项: ③ Attach OSCORE Option
    （Kid / Partial IV / 序列号）: (Kid / Partial IV / Sequence Number)
    OSCORE 接收处理: OSCORE Receive Processing
    ① 重放窗口预检查（Partial IV）: ① Replay Window Pre-Check (Partial IV)
    ② AEAD 验证解密: ② AEAD Verify & Decrypt
    校验认证标签: Verify Auth Tag
    ③ 恢复 CoAP 消息: ③ Restore CoAP Message
    仅在验证成功后提交窗口: Commit Window Only After Success
    成功: Success
    恢复 CoAP 消息: Restore CoAP Message
    提交重放窗口更新: Commit Replay Window Update
    失败: Failure
    丢弃消息: Drop Message
    需响应时按 RFC 8613 返回错误: Return Error per RFC 8613 If Response Needed
    实体 / 请求方: Entity / Requester
    发送处理: Send Processing
    接收处理: Receive Processing
    网络链路（UDP）: Network Link (UDP)
    成功分支: Success Branch
    失败分支: Failure Branch
    图8-7 OSCORE 从安全上下文派生 nonce 与 AAD，由 AEAD 一次生成密文和认证标签；接收方先做重放窗口预检查，再完成 AEAD 验证解密，仅在成功后提交窗口更新，失败则丢弃并按 RFC 8613 返回错误。: Figure 8-7 OSCORE derives the nonce and AAD from the security context and uses AEAD to produce ciphertext and tag in one pass; the receiver pre-checks the replay window, then verifies and decrypts, committing the window update only on success — on failure the message is dropped and errors are returned per RFC 8613.
