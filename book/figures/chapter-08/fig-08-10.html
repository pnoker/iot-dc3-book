<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图8-10 数据脱敏与匿名化决策流程</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图8-10 数据脱敏与匿名化决策流程</title>
  <desc id="desc">读者应理解数据脱敏与匿名化决策流程中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">

  
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图8-10 数据脱敏与匿名化决策流程</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解数据脱敏与匿名化决策流程中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">FLOWCHART</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="flowchart">
  <!-- 左列节点：start, classify, deidentify, branch -->
  <!-- start -->
  <rect x="520" y="120" width="160" height="45" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="600" y="142" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">开始</text>
  <text x="600" y="157" fill="#475569" font-size="11" text-anchor="middle">Start</text>

  <!-- classify -->
  <rect x="520" y="190" width="160" height="45" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="600" y="212" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">数据分类</text>
  <text x="600" y="227" fill="#475569" font-size="11" text-anchor="middle">Classify</text>

  <!-- deidentify -->
  <rect x="520" y="260" width="160" height="45" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="600" y="282" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">脱敏处理</text>
  <text x="600" y="297" fill="#475569" font-size="11" text-anchor="middle">Deidentify</text>

  <!-- branch 菱形 -->
  <path d="M 600 330 L 700 370 L 600 410 L 500 370 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="600" y="372" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">敏感度分支</text>
  <text x="600" y="387" fill="#475569" font-size="11" text-anchor="middle">Branch</text>

  <!-- 右列节点：weak, strong, 匿名+差分隐私, risk, publish -->
  <!-- weak -->
  <rect x="1120" y="400" width="160" height="45" rx="8" fill="#EFF6FF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1200" y="422" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">弱脱敏</text>
  <text x="1200" y="437" fill="#475569" font-size="11" text-anchor="middle">Weak</text>

  <!-- strong -->
  <rect x="1110" y="470" width="180" height="45" rx="8" fill="#EFF6FF" stroke="#F97316" stroke-width="1.5"/>
  <text x="1200" y="492" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">强匿名化</text>
  <text x="1200" y="507" fill="#475569" font-size="11" text-anchor="middle">Strong</text>

  <!-- 匿名+差分隐私 -->
  <rect x="1080" y="540" width="240" height="45" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1200" y="562" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">匿名化 + 差分隐私注入</text>
  <text x="1200" y="577" fill="#475569" font-size="11" text-anchor="middle">Anonymization + DP</text>

  <!-- risk -->
  <rect x="1110" y="610" width="180" height="45" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1200" y="632" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">重识别风险评估</text>
  <text x="1200" y="647" fill="#475569" font-size="11" text-anchor="middle">Risk Assessment</text>

  <!-- publish -->
  <rect x="1120" y="680" width="160" height="45" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1200" y="702" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">发布</text>
  <text x="1200" y="717" fill="#475569" font-size="11" text-anchor="middle">Publish</text>

  <!-- 连线 -->
  <!-- start -> classify -->
  <line x1="600" y1="165" x2="600" y2="185" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="610" y="170" width="90" height="18" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="655" y="183" fill="#0F172A" font-size="10" text-anchor="middle">from: start</text>

  <!-- classify -> deidentify -->
  <line x1="600" y1="235" x2="600" y2="255" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="610" y="240" width="90" height="18" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="655" y="253" fill="#0F172A" font-size="10" text-anchor="middle">from: classify</text>

  <!-- deidentify -> branch -->
  <line x1="600" y1="305" x2="600" y2="325" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="610" y="310" width="90" height="18" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="655" y="323" fill="#0F172A" font-size="10" text-anchor="middle">from: classify</text>

  <!-- branch -> weak 斜线 -->
  <line x1="620" y1="404" x2="1115" y2="404" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="820" y="390" width="90" height="18" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="865" y="403" fill="#0F172A" font-size="10" text-anchor="middle">from: deidentify</text>

  <!-- branch -> strong 斜线 (实际没有直接连，但根据连接应有：branch->weak后weak->strong，但我们的布局是weak在strong上方，所以弱->强连线) -->
  <!-- 根据connections: c4->c5 (branch->weak) 和 c5->c6 (weak->strong)，所以我们添加weak->strong竖线 -->
  <line x1="1200" y1="445" x2="1200" y2="465" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1210" y="450" width="90" height="18" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="1255" y="463" fill="#0F172A" font-size="10" text-anchor="middle">from: branch</text>

  <!-- weak -> strong (c5->c6) 已在上面实现，但注意label是from: branch，根据connections，c5->c6 label是from: branch，我们已放置。 -->
  
  <!-- strong -> 匿名 竖线 -->
  <line x1="1200" y1="515" x2="1200" y2="535" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1210" y="520" width="90" height="18" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="1255" y="533" fill="#0F172A" font-size="10" text-anchor="middle">from: branch</text>

  <!-- 匿名 -> risk 竖线 -->
  <line x1="1200" y1="585" x2="1200" y2="605" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1210" y="590" width="90" height="18" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="1255" y="603" fill="#0F172A" font-size="10" text-anchor="middle">from: weak</text>

  <!-- risk -> publish 竖线 -->
  <line x1="1200" y1="655" x2="1200" y2="675" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1210" y="660" width="90" height="18" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="1255" y="673" fill="#0F172A" font-size="10" text-anchor="middle">from: strong</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">color: #gray</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">color: #blue</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">大多数项目的问题在于混淆脱敏和匿名化：做了一层掩盖就当成匿名化发布，导致重识别风险泄露。差异在于强匿名化必须通过重识别风险评估（资料：[S2]）。</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">flowchart</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">自上而下的正交流程图</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
