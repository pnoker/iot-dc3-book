<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图 13-9 物联网环境下的轻量级共识机制对比</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">图 13-9 物联网环境下的轻量级共识机制对比</title>
  <desc id="desc">PoW 算力开销不可行，PoA 用身份替代算力，Tangle 免交易费但稀疏网络难起跑，PBFT 变体适合封闭网络。</desc>
  <rect width="1200" height="660" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="540" viewBox="0 0 1800 870" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="870" fill="#FFFFFF"/>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 13-9 物联网环境下的轻量级共识机制对比</text>
  <text x="88" y="64" font-size="12" fill="#64748B">在计算、存储、能量三重约束下，共识要维持分布式信任而非烧光设备资源</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 对比表 -->
  <rect x="80" y="140" width="1640" height="46" fill="#94A3B8"/>
  <text x="285" y="170" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">PoW</text>
  <text x="695" y="170" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">PoA</text>
  <text x="1105" y="170" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tangle（DAG）</text>
  <text x="1515" y="170" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">PBFT 变体</text>

  <rect x="80" y="186" width="1640" height="56" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="210" font-size="12" font-weight="700" fill="#0F172A">能耗</text>
  <text x="285" y="222" font-size="12" fill="#DC2626" text-anchor="middle">极高</text>
  <text x="695" y="222" font-size="12" fill="#16A34A" text-anchor="middle">低</text>
  <text x="1105" y="222" font-size="12" fill="#16A34A" text-anchor="middle">极低</text>
  <text x="1515" y="222" font-size="12" fill="#D97706" text-anchor="middle">中等</text>

  <rect x="80" y="242" width="1640" height="56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="266" font-size="12" font-weight="700" fill="#0F172A">确认延迟</text>
  <text x="285" y="278" font-size="12" fill="#475569" text-anchor="middle">通常 10 分钟以上</text>
  <text x="695" y="278" font-size="12" fill="#475569" text-anchor="middle">秒级</text>
  <text x="1105" y="278" font-size="12" fill="#475569" text-anchor="middle">秒到分级</text>
  <text x="1515" y="278" font-size="12" fill="#475569" text-anchor="middle">秒级</text>

  <rect x="80" y="298" width="1640" height="56" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="322" font-size="12" font-weight="700" fill="#0F172A">吞吐量</text>
  <text x="285" y="334" font-size="12" fill="#475569" text-anchor="middle">低（约 7 TPS）</text>
  <text x="695" y="334" font-size="12" fill="#475569" text-anchor="middle">数百至数千 TPS</text>
  <text x="1105" y="334" font-size="12" fill="#475569" text-anchor="middle">数千 TPS（足够活跃时）</text>
  <text x="1515" y="334" font-size="12" fill="#475569" text-anchor="middle">数千 TPS（节点少时）</text>

  <rect x="80" y="354" width="1640" height="56" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="378" font-size="12" font-weight="700" fill="#0F172A">资源开销</text>
  <text x="285" y="390" font-size="12" fill="#DC2626" text-anchor="middle">极高</text>
  <text x="695" y="390" font-size="12" fill="#16A34A" text-anchor="middle">低</text>
  <text x="1105" y="390" font-size="12" fill="#16A34A" text-anchor="middle">极低</text>
  <text x="1515" y="390" font-size="12" fill="#D97706" text-anchor="middle">中</text>

  <rect x="80" y="410" width="1640" height="56" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="434" font-size="12" font-weight="700" fill="#0F172A">Token 依赖</text>
  <text x="285" y="446" font-size="12" fill="#475569" text-anchor="middle">是</text>
  <text x="695" y="446" font-size="12" fill="#475569" text-anchor="middle">是（或抵押机制）</text>
  <text x="1105" y="446" font-size="12" fill="#475569" text-anchor="middle">否（零交易费）</text>
  <text x="1515" y="446" font-size="12" fill="#475569" text-anchor="middle">否</text>

  <rect x="80" y="466" width="1640" height="70" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="496" font-size="12" font-weight="700" fill="#0F172A">典型场景</text>
  <text x="285" y="506" font-size="11" fill="#475569" text-anchor="middle">数字货币</text>
  <text x="695" y="506" font-size="11" fill="#475569" text-anchor="middle">联盟链、多边治理</text>
  <text x="1105" y="506" font-size="11" fill="#475569" text-anchor="middle">高密度微交易传感器网络</text>
  <text x="1515" y="506" font-size="11" fill="#475569" text-anchor="middle">工业联盟链、高一致性</text>

  <!-- 关键机制说明 -->
  <rect x="80" y="590" width="520" height="140" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="340" y="622" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">PoA：用身份替代算力</text>
  <text x="116" y="656" font-size="11" fill="#475569">预先选定验证者锁定声誉/抵押物，轮流出块</text>
  <text x="116" y="680" font-size="11" fill="#475569">身份公开、受监督，作恶被驱逐并损失抵押</text>
  <text x="116" y="706" font-size="11" fill="#64748B">ARM 边缘网关可跑数十到数百 TPS</text>

  <rect x="640" y="590" width="520" height="140" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="900" y="622" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Tangle：零交易费</text>
  <text x="676" y="656" font-size="11" fill="#475569">每笔新交易主动验证之前两笔，DAG 链接</text>
  <text x="676" y="680" font-size="11" fill="#475569">越活跃越安全，无矿工故无手续费</text>
  <text x="676" y="706" font-size="11" fill="#64748B">稀疏网络/启动初期安全性妥协，离线无法交易</text>

  <rect x="1200" y="590" width="520" height="140" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1460" y="622" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">PBFT 变体与安全芯片</text>
  <text x="1236" y="656" font-size="11" fill="#475569">标准 PBFT 通信复杂度 O(n²)，节点多性能下降</text>
  <text x="1236" y="680" font-size="11" fill="#475569">动态分片 + TEE 加速节点缩短确认时延</text>
  <text x="1236" y="706" font-size="11" fill="#64748B">私钥保护靠 TPM/安全元件，验证节点侧部署</text>

  <!-- Caption -->
  <text x="900" y="830" font-size="17" fill="#475569" text-anchor="middle">图 13-9 PoW 算力开销在物联网不可行；PoA 用身份替代算力、Tangle 免交易费但稀疏网络难起跑、PBFT 变体适合封闭网络。共识选型先识别信任模型再匹配，无通用方案。</text>
  </svg>
</svg>
  </main>
</body>
</html>
