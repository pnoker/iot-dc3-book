legend:
- 左侧橙色图标/文字代表痛点，右侧蓝色图标/文字代表区块链价值点。虚线箭头表示映射关系而非数据流。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
render_notes: 错位排列，每对映射下方可附加简短文字说明。采用HTML/SVG渲染，圆角矩形，背景浅色。
caption:
  zh: 图13-6 供应链协同中‘信任’是核心障碍。区块链通过去中心化共享和不可篡改记录提供解耦方案。
  en: 'Figure 13-6 In supply-chain collaboration, trust is the core obstacle. Blockchain offers a decoupling solution through decentralized sharing and tamper-proof records.'
labels:
  en:
    图13-6 供应链核心痛点与区块链价值点映射: Figure 13-6 Mapping Supply-Chain Pain Points to Blockchain Value
    四类供应链痛点分别映射到账本共享、签名存证、事件溯源与合约审计能力，其中信息孤岛到共享账本的解决力度最大。: Four pain points map to shared ledger, signed attestation, event tracing and contract audit; silos → shared ledger is the strongest fix.
    四类供应链痛点分别映射到账本共享、签名存证、事件溯源与合约审计能力: Four pain points map to ledger sharing, attestation, tracing and contract audit
    供应链核心痛点: Supply-Chain Pain Points
    区块链价值点: Blockchain Value Points
    信息孤岛: Information Silos
    数据不共享: Data not shared
    伪造与假冒: Counterfeiting & Fraud
    来源与真伪难以验证: Origin hard to verify
    溯源与召回困难: Difficult Tracing & Recall
    链路断裂，定位耗时: Broken chain, slow locating
    合规审计成本高: High Compliance-Audit Cost
    多方可信材料难以汇总: Trusted evidence hard to pool
    分布式账本: Distributed Ledger
    多方数据共享: Multi-party data sharing
    时间戳 + 数字签名: Timestamp + Digital Signature
    数据不可篡改: Tamper-proof data
    全链路事件日志: End-to-end event log
    可追踪: Traceable
    智能合约: Smart Contract
    自动化审计: Automated audit
    打破信息孤岛，实现共享: Break silos, enable sharing
    防伪验证，不可篡改: Tamper-proof verification
    全链路追踪，召回精准: Precise end-to-end tracing
    自动化审计，降低成本: Automated audit, lower cost
    左侧橙色为痛点，右侧蓝色为区块链价值点；线宽表示解决力度，信息孤岛 → 分布式账本的力度最大。: Left orange = pain points, right blue = blockchain value; line width = resolving power; silos → ledger is strongest.
    图13-6 供应链协同中「信任」是核心障碍，区块链通过去中心化共享和不可篡改记录提供解耦方案。: Figure 13-6 Trust is the core supply-chain obstacle; blockchain fixes it with decentralized sharing and tamper-proof records.
