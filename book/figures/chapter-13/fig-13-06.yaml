type: matrix
title: 图13-6 供应链核心痛点与区块链价值点映射
audience_takeaway: 读者应理解每个痛点都有对应价值点且为线性映射，最粗箭头表明'信息孤岛→多方共享账本'是区块链在供应链中力度最大的解。
purpose: 展示供应链场景的四个典型困难与区块链技术对应解耦方案的映射关系。
visual_focus: 从每一条痛点通过虚线箭头指向其直接对…到分布式账本的箭头最粗的主链路。
design_level: decision
layout: 左右双层映射结构，左侧为痛点井（橙色系），右侧为价值塔（蓝色系），中间以带圆点的虚线箭头连接。
elements:
- 左侧痛点层（从上到下）：信息孤岛，数据不共享；伪造与假冒；溯源与召回困难；合规审计成本高。
- 右侧价值层（从上到下）：分布式账本，多方数据共享；时间戳+数字签名，数据不可篡改；全链路事件日志，可追踪；智能合约，自动化审计。
relationships:
- 每一条痛点通过虚线箭头指向其直接对应的价值点，箭头线宽表示解决力度。信息孤岛→分布式账本的箭头最粗。
