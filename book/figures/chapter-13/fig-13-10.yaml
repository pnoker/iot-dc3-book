type: architecture
title: 图 13-10 异构区块链网络互联的三种方案
audience_takeaway: 读者应理解原子交换用哈希锁定做轻量凭证迁移，中继链用轻客户端做通用跨链消息，预言机做联盟链到公链的数据桥，异构互联不破坏各自共识安全边界。
purpose: 展示异构区块链互联的三种技术方案
visual_focus: 三列跨链方案卡片。
design_level: architecture
layout: 上半三列方案（原子交换/中继链/预言机），底部跨链桥案例
elements:
- 原子交换：哈希锁定，锁资产+超时退回，不依赖第三方中继
- 中继链：维护参与链轻节点，提交-确认两轮握手，解耦设备资源限制
- 预言机：读取外部数据+加密证明，多预言机聚合降风险
- 案例：跨链桥迁移设备身份（许可链→公链铸造可信令牌）
relationships:
- 三种方案按异构程度与信任模型选择，都不破坏各自链共识边界
render_notes: HTML/SVG 渲染，三列方案卡片 + 跨链桥案例，蓝绿橙分层。
caption:
  zh: 图 13-10 原子交换用哈希锁定做轻量凭证迁移，中继链用轻客户端做通用跨链消息，预言机做联盟链到公链的数据桥；异构互联不应破坏各自链的共识安全边界。
  en: 'Figure 13-10 Atomic swaps use hash locking for lightweight credential migration, relay chains use light clients for general cross-chain messaging, and oracles serve as data bridges from consortium chains to public chains; heterogeneous interconnection should not break the consensus security boundary of each chain.'
labels:
  en:
    图 13-10 异构区块链网络互联的三种方案: Figure 13-10 Three Ways to Interconnect Heterogeneous Blockchains
    原子交换用哈希锁定做轻量迁移，中继链用轻客户端做通用消息，预言机做联盟链到公链的数据桥。: Atomic swaps hash-lock migration; relays move general messages via light clients; oracles bridge data to public chains.
    让不同链相互理解并可信传递数据与资产，扩展可信范围: Let chains exchange trusted data and assets, widening trust
    原子交换（哈希锁定）: Atomic Swap (Hash Lock)
    链 A 锁定资产/凭证并生成哈希值: Chain A locks asset, computes hash
    链 B 创建对应哈希的锁定合约: Chain B creates matching lock contract
    提供原像才能解兑，超时自动退回: Preimage unlocks; timeout refunds
    特点: Traits
    不依赖第三方中继，只依赖散列 + 超时: No third-party relay; only hash + timeout
    依赖双方智能合约能力: Both chains need contracts
    不能跨任意数据格式或复杂状态: Not for arbitrary formats or state
    适用：少量跨链代币交换 / 凭证迁移: 'Use: small swaps / credential migration'
    中继链（跨链协议）: Relay Chain (Cross-Chain Protocol)
    独立区块链，维护参与链的轻节点/状态摘要: Holds light nodes / state roots of member chains
    链 A 提交交易 → 验证者跑轻客户端验证: Chain A submits tx → validators run light-client checks
    生成证明 → 链 B 获取证明并执行: Proof generated → Chain B fetches and executes
    Cosmos IBC 代表：“提交-确认”两轮握手: 'Cosmos IBC: commit–acknowledge two-round handshake'
    解耦跨链协议与设备资源限制: Decouples protocol from device limits
    参与链需维护轻客户端: Members must run light clients
    适用：通用跨链消息、高吞吐场景: 'Use: general messages, high throughput'
    预言机集成（数据桥）: Oracle Integration (Data Bridge)
    读取许可链外部数据（土壤湿度等）: Reads permissioned data (soil moisture)
    生成含背书签名 + 区块哈希的加密证明: Proof with endorser signature + block hash
    提交公链接收合约，验证签名与区块头: Public-chain contract checks signature + header
    适合联盟链到公链的“数据读取跨链”: Fits consortium-to-public "data read" crossings
    多预言机阈值签名/多数投票降单点风险: Multi-oracle thresholds/voting cut single-point risk
    预言机节点可信度是风险来源: Oracle trustworthiness is the risk
    适用：跨链触发合约的外部可验证数据: 'Use: verifiable external data for contracts'
    案例：跨链桥实现设备身份迁移（汽车零部件）: 'Case: bridge migrates device identity (auto parts)'
    ① 许可链质检完成触发交易（序列号、批次、哈希），多家授权节点背书: '① Permissioned QC tx (serial, batch, hash) endorsed by several nodes'
    ② 中继节点监听通道提取交易并生成 SPV 证明 → ③ 提交公链桥合约: '② Relay extracts tx, builds SPV proof → ③ submits to public bridge contract'
    ④ 桥合约验证背书签名与区块哈希，铸造代表零件身份的可信令牌，公链合约可验证来源: '④ Bridge checks endorsements + hash, mints a verifiable part-identity token on the public chain'
    互联目标：扩展可信范围，而不是用一个链的信任模型替换另一个链: 'Goal: widen trust, not swap one trust model for another'
    图 13-10 原子交换用哈希锁定做轻量凭证迁移，中继链用轻客户端做通用跨链消息，预言机做联盟链到公链的数据桥；异构互联不应破坏各自链的共识安全边界。: Figure 13-10 Atomic swaps hash-lock credential migration; relay chains move general messages via light clients; oracles bridge consortium→public data — without breaking consensus security boundaries.
