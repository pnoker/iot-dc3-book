<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图 13-2 区块链与物联网融合的信任三角</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图 13-2 区块链与物联网融合的信任三角</title>
  <desc id="desc">分布式账本、签名目录与智能合约可分别支持多方验证、来源校验与规则执行，但是否需要取决于信任模型。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 13-2 区块链与物联网融合的信任三角</text>
  <text x="88" y="64" font-size="12" fill="#64748B">三个维度各司其职，缺少任一维度都无法形成完整可信闭环</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 三角虚线骨架 -->
  <polygon points="900,250 300,580 1500,580" fill="none" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="8 6"/>

  <!-- ===== 顶部 ===== -->
  <rect x="700" y="180" width="400" height="110" rx="10" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="900" y="224" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">可信任的物联网系统行为</text>
  <text x="900" y="254" font-size="11.5" fill="#475569" text-anchor="middle">各方无须共同信任单一机构</text>

  <!-- ===== 左端：分布式账本 ===== -->
  <rect x="150" y="560" width="340" height="110" rx="10" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.8"/>
  <text x="320" y="604" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">分布式账本</text>
  <text x="320" y="632" font-size="11.5" fill="#475569" text-anchor="middle">多方验证状态 · 历史改写可发现</text>
  <rect x="170" y="648" width="300" height="30" rx="6" fill="#FEF9C3"/>
  <text x="320" y="668" font-size="12" font-weight="700" fill="#A16207" text-anchor="middle">可信数据基底</text>

  <!-- ===== 右端：数字签名与共识机制 ===== -->
  <rect x="1310" y="560" width="340" height="110" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
  <text x="1480" y="604" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">数字签名与共识机制</text>
  <text x="1480" y="632" font-size="11.5" fill="#475569" text-anchor="middle">设备身份可信 · 消息来源真实</text>
  <rect x="1330" y="648" width="300" height="30" rx="6" fill="#FFEDD5"/>
  <text x="1480" y="668" font-size="12" font-weight="700" fill="#C2410C" text-anchor="middle">可信来源证明</text>

  <!-- ===== 底部：智能合约 ===== -->
  <rect x="700" y="700" width="400" height="110" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.8"/>
  <text x="900" y="744" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">智能合约</text>
  <text x="900" y="772" font-size="11.5" fill="#475569" text-anchor="middle">信任规则代码化 · 条件满足自动执行</text>
  <rect x="720" y="788" width="360" height="30" rx="6" fill="#DCFCE7"/>
  <text x="900" y="808" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">可信业务逻辑</text>

  <!-- ===== 连接箭头 ===== -->
  <line x1="380" y1="560" x2="760" y2="290" stroke="#2563EB" stroke-width="2.3" marker-end="url(#ah-blue)"/>
  <text x="480" y="420" font-size="12" font-weight="700" fill="#2563EB">提供可信数据基底</text>
  <line x1="1420" y1="560" x2="1040" y2="290" stroke="#2563EB" stroke-width="2.3" marker-end="url(#ah-blue)"/>
  <text x="1300" y="420" font-size="12" font-weight="700" fill="#2563EB">确保数据来源可信</text>
  <line x1="900" y1="700" x2="900" y2="292" stroke="#0F766E" stroke-width="2.3" marker-end="url(#ah-blue)"/>
  <text x="912" y="500" font-size="12" font-weight="700" fill="#0F766E">驱动可信业务逻辑</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图 13-2 三类机制解决不同问题，不构成所有 IoT 系统的必选组合。</text>
  </svg>
</svg>
  </main>

</html>
