<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图13-8 中心化 vs 去中心化物联网架构对比图</title><style>body{margin:0;background:#F8FAFC;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.page{width:1200px;margin:auto}text{fill:#0F172A}</style></head><body><main class="page"><svg data-figure-root="fig-13-08" xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">图13-8 中心化 vs 去中心化物联网架构对比图</title><desc id="desc">中心化架构把认证和路由集中到单一平台，去中心化架构通过多个共识节点分散信任和故障影响。</desc><defs><marker id="b" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7Z" fill="#2563EB"/></marker></defs><rect width="1200" height="680" fill="#F8FAFC"/><circle cx="48" cy="42" r="6" fill="#2563EB"/><text x="66" y="49" font-size="24" font-weight="700">图13-8 中心化 vs 去中心化物联网架构对比图</text><text x="66" y="74" font-size="12" fill="#475569">核心差异是信任位置、数据流形态和故障影响域</text><line x1="48" y1="96" x2="1152" y2="96" stroke="#94A3B8"/>
<rect x="48" y="120" width="520" height="460" rx="8" fill="#FFFFFF" stroke="#94A3B8"/><text x="308" y="154" font-size="19" font-weight="700" text-anchor="middle">中心化架构</text><text x="308" y="177" font-size="12" fill="#475569" text-anchor="middle">汇聚数据流 · 单一可信中介</text><rect x="202" y="225" width="212" height="104" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/><text x="308" y="264" font-size="17" font-weight="700" text-anchor="middle">中心化云平台</text><text x="308" y="291" font-size="12" fill="#475569" text-anchor="middle">认证中心 · 消息路由</text><rect x="180" y="205" width="256" height="145" rx="10" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 5"/><text x="308" y="374" font-size="13" font-weight="700" fill="#DC2626" text-anchor="middle">单点失效 → 全网不可用</text><g fill="#FFFFFF" stroke="#0F766E"><rect x="80" y="450" width="90" height="46" rx="6"/><rect x="190" y="450" width="90" height="46" rx="6"/><rect x="300" y="450" width="90" height="46" rx="6"/><rect x="410" y="450" width="90" height="46" rx="6"/></g><g font-size="12" font-weight="700" text-anchor="middle"><text x="125" y="478">设备 1</text><text x="235" y="478">设备 2</text><text x="345" y="478">设备 3</text><text x="455" y="478">设备 4</text></g><g stroke="#2563EB" stroke-width="2" marker-end="url(#b)"><line x1="125" y1="450" x2="240" y2="330"/><line x1="235" y1="450" x2="280" y2="330"/><line x1="345" y1="450" x2="330" y2="330"/><line x1="455" y1="450" x2="375" y2="330"/></g><g font-size="12" fill="#DC2626" font-weight="700"><text x="90" y="415">单点信任</text><text x="250" y="415">全局瓶颈</text><text x="410" y="415">集中认证</text></g>
<rect x="632" y="120" width="520" height="460" rx="8" fill="#FFFFFF" stroke="#94A3B8"/><text x="892" y="154" font-size="19" font-weight="700" text-anchor="middle">去中心化架构</text><text x="892" y="177" font-size="12" fill="#475569" text-anchor="middle">P2P 通信 · 分布式共识</text><g stroke="#94A3B8" stroke-width="2"><line x1="760" y1="260" x2="892" y2="220"/><line x1="892" y1="220" x2="1024" y2="260"/><line x1="760" y1="260" x2="760" y2="390"/><line x1="1024" y1="260" x2="1024" y2="390"/><line x1="760" y1="390" x2="892" y2="430"/><line x1="892" y1="430" x2="1024" y2="390"/><line x1="760" y1="260" x2="1024" y2="390"/><line x1="1024" y1="260" x2="760" y2="390"/></g><g fill="#FFFFFF" stroke="#2563EB" stroke-width="2"><rect x="827" y="198" width="130" height="44" rx="7"/><rect x="695" y="238" width="130" height="44" rx="7"/><rect x="959" y="238" width="130" height="44" rx="7"/><rect x="695" y="368" width="130" height="44" rx="7"/><rect x="827" y="408" width="130" height="44" rx="7"/><rect x="959" y="368" width="130" height="44" rx="7"/></g><g font-size="12" font-weight="700" text-anchor="middle"><text x="892" y="225">共识节点</text><text x="760" y="265">共识节点</text><text x="1024" y="265">共识节点</text><text x="760" y="395">共识节点</text><text x="892" y="435">共识节点</text><text x="1024" y="395">共识节点</text></g><rect x="695" y="238" width="130" height="44" rx="7" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/><text x="760" y="265" font-size="12" font-weight="700" text-anchor="middle">节点失效</text><text x="892" y="480" font-size="13" fill="#16A34A" font-weight="700" text-anchor="middle">故障未超容错阈值且 quorum 可达时</text><text x="892" y="500" font-size="13" fill="#16A34A" font-weight="700" text-anchor="middle">单节点失效不影响全局运行</text><g fill="#FFFFFF" stroke="#0F766E"><rect x="700" y="515" width="130" height="42" rx="6"/><rect x="827" y="515" width="130" height="42" rx="6"/><rect x="954" y="515" width="130" height="42" rx="6"/></g><g font-size="12" font-weight="700" text-anchor="middle"><text x="765" y="541">轻节点设备</text><text x="892" y="541">P2P 设备</text><text x="1019" y="541">轻节点设备</text></g><text x="600" y="626" font-size="12" fill="#475569" text-anchor="middle">中心化依赖单一中介；去中心化以分布式账本和共识分散信任，但引入共识与 P2P 协作成本。</text></svg></main></body></html>
