<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图 13-8 中心化 vs 去中心化物联网架构对比图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图 13-8 中心化 vs 去中心化物联网架构对比图</title>
  <desc id="desc">未做冗余的中心服务存在单点故障；共识网络只有在故障未超容错阈值且 quorum 可达时才保持可用，两者都需要工程化容灾。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 13-8 中心化 vs 去中心化物联网架构对比图</text>
  <text x="88" y="64" font-size="12" fill="#64748B">核心差异是信任位置、数据流形态和故障影响域</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 左栏：中心化 ===== -->
  <rect x="120" y="130" width="760" height="500" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="500" y="164" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">中心化架构</text>
  <text x="500" y="188" font-size="11.5" fill="#475569" text-anchor="middle">汇聚数据流 · 单一可信中介</text>

  <!-- 中心化云平台 -->
  <rect x="350" y="220" width="300" height="90" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="500" y="258" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">中心化云平台</text>
  <text x="500" y="284" font-size="11" fill="#475569" text-anchor="middle">认证中心 · 消息路由</text>

  <!-- 单点失效红框 -->
  <rect x="330" y="205" width="340" height="122" rx="12" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="8 4"/>
  <text x="500" y="200" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">未做冗余 → 单点故障</text>

  <!-- 设备群 -->
  <g font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">
    <rect x="140" y="470" width="140" height="50" rx="6" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.5"/>
    <text x="210" y="500">设备 1</text>
    <rect x="360" y="470" width="140" height="50" rx="6" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.5"/>
    <text x="430" y="500">设备 2</text>
    <rect x="580" y="470" width="140" height="50" rx="6" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.5"/>
    <text x="650" y="500">设备 3</text>
    <rect x="800" y="470" width="140" height="50" rx="6" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.5"/>
    <text x="870" y="500">设备 4</text>
  </g>

  <!-- 星型连接 -->
  <line x1="210" y1="470" x2="440" y2="312" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="430" y1="470" x2="470" y2="312" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="650" y1="470" x2="530" y2="312" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="870" y1="470" x2="560" y2="312" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- 标注 -->
  <text x="500" y="430" font-size="11.5" font-weight="700" fill="#DC2626" text-anchor="middle">单点信任 · 集中认证 · 全局瓶颈</text>

  <!-- ===== 右栏：去中心化 ===== -->
  <rect x="920" y="130" width="760" height="500" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/>
  <text x="1300" y="164" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">去中心化架构</text>
  <text x="1300" y="188" font-size="11.5" fill="#475569" text-anchor="middle">P2P 通信 · 分布式共识</text>

  <!-- 6 共识节点 -->
  <g font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">
    <rect x="1000" y="220" width="140" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1070" y="248">共识节点</text>
    <rect x="1210" y="220" width="140" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1280" y="248">共识节点</text>
    <rect x="1420" y="220" width="140" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1490" y="248">共识节点</text>
    <rect x="1000" y="320" width="140" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1070" y="348">共识节点</text>
    <rect x="1210" y="320" width="140" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1280" y="348">共识节点</text>
    <rect x="1420" y="320" width="140" height="46" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1490" y="348">共识节点</text>
  </g>

  <!-- 网状连接 -->
  <line x1="1140" y1="243" x2="1210" y2="243" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="1350" y1="243" x2="1420" y2="243" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="1140" y1="343" x2="1210" y2="343" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="1350" y1="343" x2="1420" y2="343" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="1070" y1="266" x2="1070" y2="320" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="1280" y1="266" x2="1280" y2="320" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="1490" y1="266" x2="1490" y2="320" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="1210" y1="243" x2="1280" y2="320" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="1420" y1="243" x2="1280" y2="320" stroke="#2563EB" stroke-width="1.5"/>

  <!-- 设备 -->
  <g font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">
    <rect x="1000" y="470" width="170" height="50" rx="6" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.5"/>
    <text x="1085" y="500">P2P 设备</text>
    <rect x="1280" y="470" width="170" height="50" rx="6" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.5"/>
    <text x="1365" y="500">轻节点设备</text>
  </g>
  <line x1="1085" y1="470" x2="1070" y2="366" stroke="#0F766E" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <line x1="1365" y1="470" x2="1420" y2="366" stroke="#0F766E" stroke-width="1.8" marker-end="url(#ah-blue)"/>

  <!-- 标注 -->
  <text x="1300" y="430" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="middle">分布式共识 · P2P 通信 · 无单点失败</text>
  <text x="1300" y="560" font-size="10.5" fill="#475569" text-anchor="middle">故障未超容错阈值且 quorum 可达时，单节点失效不影响全局运行</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图 13-8 去中心化架构以分布式账本和共识分散信任与故障影响，同时引入共识和 P2P 协作成本。</text>
  </svg>
</svg>
  </main>
</body>
</html>
