  <text x="900" y="855" fill="#94A3B8" font-size="11" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图13-8 中心化与去中心化物联网架构的核心差异：中心化模型依赖单一可信中介，数据流汇聚、单点失效即全网瘫痪；去中心化模型通过分布式账本与共识机制将信任分散到网络节点，任一共识节点失效不影响全局。</text>
