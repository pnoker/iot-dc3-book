caption:
  zh: 图 13-2 区块链与物联网融合的信任三角：分布式账本提供数据一致性，数字签名与共识机制确保身份真实性，智能合约自动化执行信任规则。三者协同重塑物联网信任体系。
  en: 'Figure 13-2 The trust triangle of blockchain–IoT convergence: the distributed ledger provides data consistency, digital signatures and consensus mechanisms ensure identity authenticity, and smart contracts execute trust rules automatically. Working together, the three reshape the IoT trust system.'
labels:
  en:
    图 13-2 区块链与物联网融合的信任三角: Figure 13-2 The Blockchain–IoT Trust Triangle
    分布式账本、签名与共识、智能合约分别约束数据一致性、来源可信与规则执行，缺一不可。: Ledger, signatures and contracts govern consistency, provenance and execution — all essential.
    三个维度各司其职，缺少任一维度都无法形成完整可信闭环: Each plays its part; missing any breaks the trusted loop
    可信任的物联网系统行为: Trustworthy IoT System Behavior
    各方无须共同信任单一机构: No need to trust a single institution
    分布式账本: Distributed Ledger
    全网数据一致 · 记录不可篡改: Network-wide consistency · tamper-proof records
    可信数据基底: Trusted Data Foundation
    数字签名与共识机制: Digital Signatures & Consensus
    设备身份可信 · 消息来源真实: Trusted device identity · authentic message origin
    可信来源证明: Proof of Trusted Origin
    智能合约: Smart Contract
    信任规则代码化 · 条件满足自动执行: Trust rules as code · auto-executed on conditions
    可信业务逻辑: Trusted Business Logic
    提供可信数据基底: Provides the trusted data foundation
    确保数据来源可信: Ensures trusted data origin
    驱动可信业务逻辑: Drives trusted business logic
    图 13-2 分布式账本、签名与共识、智能合约分别约束数据一致性、来源可信与规则执行。: Figure 13-2 Ledger, signatures and contracts govern consistency, provenance and execution.
