type: pyramid
title: 图 13-2 区块链与物联网融合的信任三角
audience_takeaway: 读者应理解信任三角三个维度各司其职：账本保数据一致、签名与共识保来源可信、合约保规则自动执行，缺一不可。
purpose: 展示分布式账本、数字签名与共识机制、智能合约三者如何共同支撑物联网系统的可信基础。
visual_focus: 从左端到顶部：驱动可信业务逻辑的主链路。
design_level: decision
layout: 三角金字塔：顶部为'可信任的物联网系统行为'，三个角分别对应三个维度。
elements:
- 顶部：可信任的物联网系统行为（#2E86AB），描述去中心化架构下各方无须共同信任单一机构。
- 左端：分布式账本（#E9C46A），提供数据全网一致性、不可篡改。
- 右端：数字签名与共识机制（#F4A261），确保设备身份可信、消息来源真实。
- 底部：智能合约（#264653），代码化信任规则并自动执行。
relationships:
- 左端→顶部：提供可信数据基底（实线箭头）
- 右端→顶部：确保数据来源可信（实线箭头）
- 底部→顶部：驱动可信业务逻辑（实线箭头）
