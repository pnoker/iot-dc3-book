type: matrix
title: 图 13-9 物联网环境下的轻量级共识机制对比
audience_takeaway: 读者应理解 PoW 算力开销在物联网不可行，PoA 用身份替代算力、Tangle 免交易费但稀疏网络难起跑、PBFT 变体适合封闭网络，共识选型先识别信任模型再匹配。
purpose: 对比四种共识机制在物联网环境下的工程特性
visual_focus: 四列共识机制对比表。
design_level: matrix
layout: 上半四共识对比表，下半三种轻量级方案关键机制
elements:
- PoW：能耗极高、确认 10 分钟以上、吞吐低，物联网不可行
- PoA：身份替代算力、秒级、数百至数千 TPS，适合联盟链
- Tangle：零交易费、越活跃越安全，稀疏网络难起跑
- PBFT 变体：O(n²) 通信复杂度，动态分片 + TEE 加速，适合封闭网络
relationships:
- 四种共识在能耗/延迟/吞吐/资源开销上取舍，无通用方案
render_notes: HTML/SVG 渲染，四共识对比表 + 三种方案关键机制，蓝绿橙分层。
caption:
  zh: 图 13-9 PoW 算力开销在物联网不可行；PoA 用身份替代算力、Tangle 免交易费但稀疏网络难起跑、PBFT 变体适合封闭网络。共识选型先识别信任模型再匹配，无通用方案。
  en: 'Figure 13-9 PoW computing cost is infeasible for IoT; PoA replaces computing power with identity, Tangle charges no transaction fees but struggles to bootstrap in sparse networks, and PBFT variants suit closed networks. Consensus selection should first identify the trust model and then match it — there is no universal option.'
labels:
  en:
    图 13-9 物联网环境下的轻量级共识机制对比: Figure 13-9 Lightweight Consensus for IoT Compared
    PoW 算力开销不可行，PoA 用身份替代算力，Tangle 免交易费但稀疏网络难起跑，PBFT 变体适合封闭网络。: PoW infeasible; PoA swaps compute for identity; Tangle fee-free but weak when sparse; PBFT variants fit closed networks.
    在计算、存储、能量三重约束下，共识要维持分布式信任而非烧光设备资源: Consensus must sustain distributed trust under compute, storage and energy limits
    PBFT 变体: PBFT Variants
    能耗: Energy use
    极高: Very high
    低: Low
    极低: Very low
    中等: Medium
    确认延迟: Confirmation latency
    通常 10 分钟以上: Usually 10+ minutes
    秒级: Seconds
    秒到分级: Seconds to minutes
    吞吐量: Throughput
    低（约 7 TPS）: Low (~7 TPS)
    数百至数千 TPS: Hundreds to thousands TPS
    数千 TPS（足够活跃时）: Thousands TPS (when active)
    数千 TPS（节点少时）: Thousands TPS (few nodes)
    资源开销: Resource overhead
    中: Medium
    Token 依赖: Token required
    是: 'Yes'
    是（或抵押机制）: Yes (or staking)
    否（零交易费）: No (zero fees)
    否: 'No'
    典型场景: Typical scenarios
    数字货币: Cryptocurrencies
    联盟链、多边治理: Consortium chains, multi-party governance
    高密度微交易传感器网络: Dense micro-transaction sensor networks
    工业联盟链、高一致性: Industrial consortia, strong consistency
    PoA：用身份替代算力: 'PoA: identity replaces computation'
    预先选定验证者锁定声誉/抵押物，轮流出块: Chosen validators stake reputation, rotate blocks
    身份公开、受监督，作恶被驱逐并损失抵押: Public supervised identity; misbehavior loses stake
    ARM 边缘网关可跑数十到数百 TPS: ARM gateways run tens to hundreds of TPS
    Tangle：零交易费: 'Tangle: zero transaction fees'
    每笔新交易主动验证之前两笔，DAG 链接: Each new tx validates two prior ones (DAG)
    越活跃越安全，无矿工故无手续费: More active = safer; no miners, no fees
    稀疏网络/启动初期安全性妥协，离线无法交易: Weaker when sparse or booting; offline cannot transact
    PBFT 变体与安全芯片: PBFT Variants & Secure Chips
    标准 PBFT 通信复杂度 O(n²)，节点多性能下降: PBFT communication is O(n²); performance drops with nodes
    动态分片 + TEE 加速节点缩短确认时延: Dynamic sharding + TEE shorten confirmation
    私钥保护靠 TPM/安全元件，验证节点侧部署: Keys protected by TPM/secure elements at validators
    图 13-9 PoW 算力开销在物联网不可行；PoA 用身份替代算力、Tangle 免交易费但稀疏网络难起跑、PBFT 变体适合封闭网络。共识选型先识别信任模型再匹配，无通用方案。: Figure 13-9 PoW is infeasible for IoT; PoA replaces compute with identity, Tangle is fee-free but hard to bootstrap when sparse, PBFT variants suit closed networks. Match the trust model first — no universal option.
