callouts:
- 感知层通过有线/短距无线（RS-485、Zigbee、BLE）将原始数据传入边缘层
- 边缘层将计算出的数据哈希、数字签名和元数据打包成交易，发送到区块链网络层，实线箭头
- 区块链网络层将共识结果同步到应用层，实线箭头
legend:
- 蓝色=核心服务（区块链网络层）；青绿色=设备与边缘（感知层、边缘层）；橙色=终端应用（应用层）。
- 实线箭头：数据推送；虚线箭头：查询请求。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
render_notes: HTML/SVG渲染，浅色背景。四层自下而上堆叠，每层使用不同底色（青绿→蓝色→橙色），层名使用粗体白色字体。层间箭头用粗细区分，实线箭头表示数据推送，虚线箭头表示查询请求。
caption:
  zh: 图 13-7 原始数据由授权的链下数据服务保存和提供，摘要、签名与状态可写入账本，应用把两者结合完成独立复核。
  en: 'Figure 13-7 The responsibility boundaries and data flows of the four-layer structure. The edge layer hashes raw sensor data and puts it on-chain, while the raw data stays in edge storage or IPFS. The blockchain network layer is responsible for recording, consensus, and smart-contract execution.'
labels:
  en:
    图 13-7 基于区块链的供应链溯源系统分层架构: Figure 13-7 Layered Architecture of a Blockchain-Based Supply-Chain Traceability System
    原始数据经授权的数据服务保留链下，摘要与签名状态可写入账本；应用读取原文后可用账本证据复核。: Raw data remains in an authorized off-chain data service; summaries and signature status may be recorded on a ledger so applications can verify the original.
    业务数据走授权数据服务，账本提供独立验证证据: Business data uses an authorized data service; the ledger provides independent verification evidence
    应用层: Application Layer
    Web 溯源查询: Web traceability query
    移动端防伪验证: Mobile anti-counterfeit check
    企业 ERP 对接: Enterprise ERP integration
    数据报表: Data reports
    共识结果（实线）: Consensus results (solid)
    查询请求（虚线）: Query requests (dashed)
    区块链网络层: Blockchain Network Layer
    分布式账本: Distributed Ledger
    共识机制（Raft / PBFT）: Consensus (Raft / PBFT)
    智能合约: Smart Contract
    参与方节点: Participant nodes
    质检 / 预警 / 冻结规则；链上记录哈希、签名与元数据: Quality/alert/freeze rules; hash, signature & metadata on-chain
    哈希 + 签名 + 元数据: Hash + signature + metadata
    边缘层: Edge Layer
    边缘网关 / 嵌入式节点: Edge gateway / embedded nodes
    采集 · 格式化 · 数字签名 · 哈希运算 · 本地缓存: Collect · format · sign · hash · local cache
    原始数据 · RS-485 / Zigbee / BLE: Raw data · RS-485 / Zigbee / BLE
    感知层: Perception Layer
    温湿度传感器: Temp/humidity sensors
    RFID 读写器: RFID reader
    GPS 模块: GPS module
    工业采集设备: Industrial acquisition devices
    图 13-7 链下数据服务负责原文访问，账本负责多方可验证的摘要与状态。: Figure 13-7 The off-chain data service provides originals, while the ledger provides multiparty-verifiable summaries and state.
