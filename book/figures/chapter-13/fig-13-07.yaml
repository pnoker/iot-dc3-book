type: layered
title: 图 13-7 基于区块链的供应链溯源系统分层架构
audience_takeaway: 应用通过授权数据服务读取链下原文，并用账本中的摘要、签名与状态复核；账本不是唯一数据出口。
purpose: 展示从物理感知到业务展示的四层结构，以及数据在各层间的流动方向。
visual_focus: 从边缘层将计算出的数据哈希、数字签名和元数据发送到应用层（实线箭头），以及应用层发起的查询请求反向流入区块链网络层（虚线箭头）的主链路。
design_level: logical
layout: 自下而上四层叠加，左侧标注层名，右侧标注关键组件和职责。
elements:
- 感知层：温度传感器、湿度传感器、RFID读写器、GPS模块等物理硬件。
- 边缘层：边缘网关、嵌入式节点。负责数据采集、格式化、数字签名、哈希运算和本地缓存。
- 区块链网络层：分布式账本、共识机制（Raft或PBFT）、智能合约（质检、预警、冻结业务逻辑）。包含各参与方节点。
- 应用层：Web端溯源查询、移动端防伪验证、企业ERP对接、数据报表。
relationships:
- 感知层通过有线/短距无线（RS-485、Zigbee、BLE）将原始数据传入边缘层。
- 边缘层将计算出的数据哈希、数字签名和元数据打包成交易，发送到区块链网络层，实线箭头。
- 区块链网络层将共识结果同步到应用层，实线箭头
- 应用层发起的查询请求反向流入区块链网络层，虚线箭头。
- 应用层不直接访问现场设备；原文经授权数据服务提供，摘要与状态可经账本独立验证。
regions:
- id: edge_domain
  label: 设备与边缘域
  role: 现场异构资源边界
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
- id: application_domain
  label: 业务应用域
  role: 业务价值交付边界
