type: architecture
title: 图13-5 数据验证与溯源机制时序图
audience_takeaway: 读者应理解溯源依赖事件日志的链下索引：合约只存哈希与所有权映射，历史查询由监听器从DataStored事件重建而不重扫区块。
purpose: 展示数据从传感器产生到链上验证的完整流程，重点突出事件日志的索引作用和验证函数的调用路径。
visual_focus: 从1. 传感器到边缘节点：推送原始数据的主链路。
design_level: logical
layout: 纵向时间轴，沿时间顺序从上向下排列各参与方与操作步骤。
elements:
- 传感器（温度计图标）：产生原始数据，格式如 `{"device_id":"sensor001","temp":25.3,"ts":1700000000}`
- 边缘节点（网关图标）：接收原始数据，计算 keccak256 哈希，组装交易并调用智能合约
- 智能合约（带“合约”标签的矩形）：内部包含三个 mapping（dataHashes, dataTimestamps, dataOwners）和两个 Event（DataStored, DataVerified）
- 区块链网络（三个串接的区块，每个区块用锯齿形凹槽矩形表示）：打包交易、生成区块、存储状态
- 验证者（放大镜图标）：监听事件、从链下存储获取原始数据、发起验证调用
- 链下监听器（数据库符号）：订阅 Event 日志，记录索引信息供溯源查询
relationships:
- 1. 传感器 → 边缘节点：推送原始数据（实线箭头，标注“原始数据 JSON”） 2. 边缘节点 → 智能合约：调用 `storeDataHash(dataId, hash)` 交易（实线箭头，标注“上链交易”） 3. 智能合约 → 区块链网络：写入 mapping 并发出 `DataStored` 事件（实线箭头，标注“状态写入”） 4. 区块链网络 → 链下监听器：广播 `DataStored` 事件（虚线箭头，标注“事件索引”） 5. 验证者 → 智能合约：调用 `verifyData(dataId, rawData)`（实线箭头，标注“验证请求”） 6. 智能合约 → 验证者：返回 `DataVerified` 事件（虚线箭头，标注“结果广播”） 7. 链下监听器 → 验证者：提供历史 `DataStored` 事件列表（箭头，标注“历史查询”）
regions:
- id: edge_domain
  label: 设备与边缘域
  role: 现场异构资源边界
components:
- id: r1
  label: 1. 传感器
  type: edge
  subtitle: ''
  group: edge_domain
  priority: primary
  shape: card
- id: r2
  label: 边缘节点：推送原始数据
  type: edge
  subtitle: ''
  group: edge_domain
  priority: normal
  shape: database
connections:
- from: r1
  to: r2
  label: 实线箭头，标注“原始数据 JSON…
  style: solid
  direction: request
callouts:
- 1. 传感器 → 边缘节点：推送原始数据（实线箭头，标注“原始数据 JSON”） 2. 边缘节点 → 智能合约：调…
legend:
- 实线箭头：交易或直接调用
- 虚线箭头：事件广播或异步通知
- 带圆形标记箭头：验证请求与结果
- 锯齿矩形：区块
- 圆形图标：参与方
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: SVG 绘制，纵向布局，时间轴左侧标注时间刻度（T0, T1, …）；参与方列在左侧纵向排列；箭头使用不同颜色区分实线与虚线；合约内部用嵌套矩形展示 mapping；区块链网络用三个连续的锯齿矩形表示，区块之间用箭头连接；所有文本使用无衬线字体，关键参数（keccak256, dataId, indexed）用斜体。
caption:
  zh: 数据验证与溯源时序图。数据从传感器经边缘节点上链，合约记录指纹并发出事件；验证者通过对比哈希确认完整性，同时利用事件追溯历史操作。
  en: 'Data verification and traceability sequence diagram. Data flows from the sensor through the edge node onto the chain, where the contract records the fingerprint and emits events; the verifier confirms integrity by comparing hashes and uses the events to trace historical operations.'
labels:
  en:
    图13-5 数据验证与溯源机制时序图: Figure 13-5 Data Verification & Traceability Sequence
    数据经边缘节点生成指纹并上链，验证者通过哈希比对确认完整性，并沿事件日志追溯历史操作。: Edge node fingerprints data on-chain; verifier confirms integrity by hash and traces history via events.
    哈希验证确认数据完整性，事件索引串联历史操作: Hash checks confirm integrity; event indexes link history
    传感器: Sensor
    温度计: Thermometer
    边缘节点: Edge Node
    网关: Gateway
    智能合约: Smart Contract
    区块链网络: Blockchain Network
    区块: Block
    链下监听器: Off-chain Listener
    数据库: Database
    验证者: Verifier
    放大镜: Magnifier
    1 原始数据 JSON: 1 Raw data JSON
    2 上链交易 storeDataHash: 2 On-chain tx storeDataHash
    3 状态写入 · DataStored: 3 State write · DataStored
    4 事件索引（广播）: 4 Event index (broadcast)
    5 验证请求 verifyData(dataId, rawData): 5 Verify request verifyData(dataId, rawData)
    6 结果广播 DataVerified: 6 Result broadcast DataVerified
    7 历史查询: 7 History query
    图13-5 数据经边缘节点生成指纹并上链，验证者通过哈希比对确认完整性并沿事件追溯历史操作。: Figure 13-5 Edge node fingerprints data on-chain; verifier checks hashes and traces history via events.
