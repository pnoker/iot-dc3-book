render_notes: HTML/SVG渲染，浅色背景，流程穿越表示使用折线，避免交叉。关键节点加粗边框，箭头带文字标签。
caption:
  zh: 图 13-4 展示数据从传感器采样到链下存储和链上存证，最终验证方通过两侧数据比对确认完整性的典型流程。
  en: 'Figure 13-4 The typical flow in which data sampled by sensors goes to off-chain storage and on-chain attestation, and the verifier finally confirms integrity by comparing data from both sides.'
labels:
  en:
    图 13-4 数据上链流程图: Figure 13-4 Data On-Chain Flow
    数据从传感器采样，经边缘节点分两路：原始数据存入链下存储，哈希与元数据写入链上；验证方重算哈希与链上比对确认完整性。: 'Sensor data splits at the edge: raw data off-chain, hash + metadata on-chain; the verifier re-hashes and compares on-chain to confirm integrity.'
    存证是“链下存原文、链上存指纹”的分工，兼顾存储成本与不可篡改性: Originals off-chain, fingerprints on-chain — balancing cost and tamper resistance
    传感器: Sensor
    设备采样: Device sampling
    生成 JSON 记录: Generate JSON record
    边缘节点: Edge Node
    聚合数据 · 计算哈希: Aggregate data · compute hash
    （可构建 Merkle 树）: '(Merkle tree optional)'
    去中心化存储节点: Decentralized Storage Node
    链下存储: Off-chain Storage
    区块链: Blockchain
    智能合约接收哈希 · 写入日志事件: Contract takes hash · logs event
    链上存证: On-chain Attestation
    验证方: Verifier
    取原始数据 · 重算哈希: Fetch raw data · re-hash
    链上比对 · 确认完整性: Compare on-chain · confirm integrity
    采样数据: Sampled data
    原始数据: Raw data
    哈希+元数据: Hash + metadata
    提供原始数据: Provides raw data
    查询哈希是否存在: Query hash existence
    青绿 = 设备 / 传感器: Teal = Devices / Sensors
    蓝 = 核心处理 / 链上: Blue = Core Processing / On-chain
    灰 = 外部存储 / 链下: Gray = External Storage / Off-chain
    实线 = 同步推送 · 虚线 = 查询 / 读取: Solid = push · Dashed = query / read
    图 13-4 数据从传感器采样后，原始数据存链下、哈希指纹存链上，验证方通过两侧数据比对确认完整性。: Figure 13-4 Raw data off-chain, hash fingerprints on-chain; the verifier compares both to confirm integrity.
