type: flowchart
title: 图 13-4 数据上链流程图
audience_takeaway: 存证是'链下存原文、链上存指纹'的分工：验证时重算哈希与链上比对，兼顾存储成本与不可篡改性。
purpose: 展示从传感器采样到链上存证、链下存储、验证的完整流程，说明链下存储与链上指纹的协作关系。
visual_focus: 从传感器到终点的主链路。
design_level: implementation
layout: 自左向右的流程，传感器→边缘节点（聚合+哈希）→分支：左侧去往IPFS/Arweave（链下存储），右侧去往区块链（链上存证）→两侧再合并到验证方。
elements:
- 传感器：设备采样、生成JSON记录，用青绿色图标。
- 边缘节点：聚合数据、计算哈希（可构建Merkle树），用蓝色图标。
- IPFS/Arweave：去中心化存储节点，用灰色图标，标注‘链下存储’。
- 区块链：智能合约接收哈希，写入日志事件，用蓝色图标，标注‘链上存证’。
- 验证方：从链下获取原始数据、计算哈希，与链上查询比对，用蓝色图标。
relationships:
- 传感器 → 边缘节点：实线箭头，标注‘采样数据’。
- 边缘节点 → IPFS/Arweave：实线箭头，标注‘原始数据’。
- 边缘节点 → 区块链：实线箭头，标注‘哈希+元数据’。
- IPFS/Arweave → 验证方：实线箭头，标注‘提供原始数据’。
- 区块链 → 验证方：实线箭头，标注‘查询哈希是否存在’。
