caption:
  zh: 图 13-3 展示设备从硬件密钥生成、DID注册到挑战验证的完整身份生命周期；验证方以一次性nonce发起挑战，收到签名后查询最新DID状态并消费nonce，从而阻断重放。
  en: 'Figure 13-3 The complete device identity lifecycle, from hardware key generation and DID registration to challenge-based verification. The verifier issues a one-time nonce challenge, then queries the latest DID state upon receiving the signature and consumes the nonce, thereby blocking replay.'
labels:
  en:
    图 13-3 设备DID注册与验证流程: Figure 13-3 Device DID Registration & Verification
    设备注册 DID 与公钥哈希后，验证方结合一次性 nonce、签名和最新链上状态完成身份验证。: Device registers DID + key hash; verifier checks one-time nonce, signature and on-chain state.
    验证方发起一次性挑战，签名回复须结合最新 DID 状态验证: One-time challenge; reply verified against latest DID state
    设备 1 · 身份主体: Device 1 · Identity Subject
    安全飞地 · 私钥不可导出: Secure enclave · non-exportable private key
    智能合约 · 区块链: Smart Contract · Blockchain
    设备 2 · 验证方: Device 2 · Verifier
    生成并消费一次性 nonce: Generates & consumes one-time nonce
    1 生成 ECDSA 密钥对: 1 Generate ECDSA key pair
    2 公钥哈希 → DID: 2 Public-key hash → DID
    3 registerDevice(did, publicKeyHash) + 账户签名: 3 registerDevice(did, publicKeyHash) + account signature
    4 验证签名；写入 owner/hash/timestamp/isActive: 4 Verify signature; store owner/hash/timestamp/isActive
    5 记录 DIDRegistered 日志: 5 Emit DIDRegistered log
    注册阶段: Registration Phase
    6 生成并登记一次性 nonce: 6 Generate & register one-time nonce
    7 nonce 挑战 → 设备 1: 7 Nonce challenge → Device 1
    8 用设备私钥签名 nonce: 8 Sign nonce with device private key
    9 DID + nonce 签名 → 设备 2: 9 DID + nonce signature → Device 2
    10 查询最新 didDocs[didHash]: 10 Query latest didDocs[didHash]
    11 返回 owner / publicKeyHash / isActive: 11 Return owner / publicKeyHash / isActive
    12 校验签名与 isActive；消费 nonce，拒绝重放: 12 Verify signature & isActive; consume nonce, reject replay
    13 验证通过 / 失败: 13 Verification pass / fail
    链下操作：密钥生成、nonce 生成与签名: 'Off-chain: key generation, nonce creation & signing'
    链上操作 / 查询：注册交易、状态写入、DID 文档查询: 'On-chain ops / queries: registration tx, state writes, DID doc lookup'
    图 13-3 设备注册 DID 与公钥哈希后，验证方结合一次性 nonce、签名和最新链上状态完成身份验证。: Figure 13-3 Device registers DID + key hash; verifier uses one-time nonce, signature and on-chain state.
