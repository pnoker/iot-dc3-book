<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">数据验证与溯源机制时序图</title>
  <desc id="desc">读者应理解数据验证与溯源机制时序图中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">数据验证与溯源机制时序图</title>
  <desc id="desc">读者应理解数据验证与溯源机制时序图中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">数据验证与溯源机制时序图</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解数据验证与溯源机制时序图中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="sequence">
  <!-- Time axis -->
  <line x1="80" y1="150" x2="80" y2="700" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4" />
  
  <!-- Time labels -->
  <text x="70" y="284" fill="#64748B" font-size="12" text-anchor="end">T0</text>
  <text x="70" y="334" fill="#64748B" font-size="12" text-anchor="end">T1</text>
  <text x="70" y="384" fill="#64748B" font-size="12" text-anchor="end">T2</text>
  <text x="70" y="434" fill="#64748B" font-size="12" text-anchor="end">T3</text>
  <text x="70" y="484" fill="#64748B" font-size="12" text-anchor="end">T4</text>
  <text x="70" y="534" fill="#64748B" font-size="12" text-anchor="end">T5</text>
  <text x="70" y="584" fill="#64748B" font-size="12" text-anchor="end">T6</text>

  <!-- Participants (top boxes) -->
  <!-- Sensor -->
  <rect x="120" y="150" width="220" height="60" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
  <circle cx="170" cy="180" r="12" fill="none" stroke="#0F766E" stroke-width="2" />
  <line x1="170" y1="192" x2="170" y2="202" stroke="#0F766E" stroke-width="2" />
  <line x1="165" y1="198" x2="175" y2="198" stroke="#0F766E" stroke-width="2" />
  <text x="200" y="181" fill="#0F172A" font-size="15" font-weight="600">传感器</text>
  <text x="200" y="196" fill="#64748B" font-size="11">温度计</text>

  <!-- Edge Node -->
  <rect x="360" y="150" width="220" height="60" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
  <rect x="400" y="168" width="20" height="24" rx="3" fill="none" stroke="#0F766E" stroke-width="2" />
  <line x1="410" y1="162" x2="410" y2="168" stroke="#0F766E" stroke-width="2" />
  <line x1="403" y1="164" x2="417" y2="164" stroke="#0F766E" stroke-width="2" />
  <text x="440" y="181" fill="#0F172A" font-size="15" font-weight="600">边缘节点</text>
  <text x="440" y="196" fill="#64748B" font-size="11">网关</text>

  <!-- Smart Contract -->
  <rect x="600" y="150" width="220" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
  <text x="710" y="172" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">智能合约</text>
  <!-- Inside smart contract: mappings and events -->
  <rect x="620" y="185" width="180" height="20" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" />
  <text x="710" y="199" fill="#0F172A" font-size="11" text-anchor="middle">dataHashes mapping</text>
  <rect x="620" y="210" width="180" height="20" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" />
  <text x="710" y="224" fill="#0F172A" font-size="11" text-anchor="middle">dataTimestamps mapping</text>
  <rect x="620" y="235" width="180" height="20" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" />
  <text x="710" y="249" fill="#0F172A" font-size="11" text-anchor="middle">dataOwners mapping</text>
  <ellipse cx="640" cy="260" rx="20" ry="10" fill="#F0F9FF" stroke="#2563EB" stroke-width="1" />
  <text x="640" y="264" fill="#0F172A" font-size="10" text-anchor="middle">DataStored</text>
  <ellipse cx="780" cy="260" rx="20" ry="10" fill="#F0F9FF" stroke="#2563EB" stroke-width="1" />
  <text x="780" y="264" fill="#0F172A" font-size="10" text-anchor="middle">DataVerified</text>

  <!-- Blockchain Network -->
  <rect x="840" y="150" width="220" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
  <text x="950" y="172" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">区块链网络</text>
  <!-- Three blocks with sawtooth -->
  <rect x="855" y="180" width="60" height="40" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" />
  <path d="M855,180 L865,170 L875,180 L885,170 L895,180 L905,170 L915,180" fill="none" stroke="#2563EB" stroke-width="1.5" />
  <rect x="930" y="180" width="60" height="40" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" />
  <path d="M930,180 L940,170 L950,180 L960,170 L970,180 L980,170 L990,180" fill="none" stroke="#2563EB" stroke-width="1.5" />
  <rect x="1005" y="180" width="60" height="40" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1" />
  <path d="M1005,180 L1015,170 L1025,180 L1035,170 L1045,180 L1055,170 L1065,180" fill="none" stroke="#2563EB" stroke-width="1.5" />
  <line x1="915" y1="200" x2="930" y2="200" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)" />
  <line x1="990" y1="200" x2="1005" y2="200" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)" />

  <!-- Chain Listener -->
  <rect x="1080" y="150" width="220" height="60" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" />
  <ellipse cx="1120" cy="168" rx="12" ry="6" fill="none" stroke="#7C3AED" stroke-width="2" />
  <rect x="1108" y="168" width="24" height="24" fill="none" stroke="#7C3AED" stroke-width="2" />
  <ellipse cx="1120" cy="192" rx="12" ry="6" fill="none" stroke="#7C3AED" stroke-width="2" />
  <text x="1150" y="181" fill="#0F172A" font-size="15" font-weight="600">链下监听器</text>
  <text x="1150" y="196" fill="#64748B" font-size="11">数据库</text>

  <!-- Verifier -->
  <rect x="1320" y="150" width="220" height="60" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" />
  <circle cx="1360" cy="180" r="12" fill="none" stroke="#7C3AED" stroke-width="2" />
  <line x1="1368" y1="188" x2="1375" y2="195" stroke="#7C3AED" stroke-width="2" />
  <text x="1390" y="181" fill="#0F172A" font-size="15" font-weight="600">验证者</text>
  <text x="1390" y="196" fill="#64748B" font-size="11">放大镜</text>

  <!-- Lifelines (dashed vertical lines from participant bottom to y=700) -->
  <line x1="230" y1="210" x2="230" y2="700" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="470" y1="210" x2="470" y2="700" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="710" y1="270" x2="710" y2="700" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="950" y1="250" x2="950" y2="700" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="1190" y1="210" x2="1190" y2="700" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="1430" y1="210" x2="1430" y2="700" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Messages (arrows) -->
  <!-- T0: Sensor -> Edge Node -->
  <line x1="230" y1="280" x2="470" y2="280" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)" />
  <rect x="300" y="270" width="100" height="20" rx="3" fill="white" stroke="#CBD5E1" stroke-width="1" />
  <text x="350" y="284" fill="#0F172A" font-size="11" text-anchor="middle">原始数据 JSON</text>

  <!-- T1: Edge Node -> Smart Contract -->
  <line x1="470" y1="330" x2="710" y2="330" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)" />
  <rect x="540" y="320" width="100" height="20" rx="3" fill="white" stroke="#CBD5E1" stroke-width="1" />
  <text x="590" y="334" fill="#0F172A" font-size="11" text-anchor="middle">上链交易</text>

  <!-- T2: Smart Contract -> Blockchain -->
  <line x1="710" y1="380" x2="950" y2="380" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)" />
  <rect x="780" y="370" width="100" height="20" rx="3" fill="white" stroke="#CBD5E1" stroke-width="1" />
  <text x="830" y="384" fill="#0F172A" font-size="11" text-anchor="middle">状态写入</text>

  <!-- T3: Blockchain -> Chain Listener (dashed) -->
  <line x1="950" y1="430" x2="1190" y2="430" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#bp-arrow)" />
  <rect x="1020" y="420" width="100" height="20" rx="3" fill="white" stroke="#CBD5E1" stroke-width="1" />
  <text x="1070" y="434" fill="#0F172A" font-size="11" text-anchor="middle">事件索引</text>

  <!-- T4: Verifier -> Smart Contract -->
  <line x1="1430" y1="480" x2="710" y2="480" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)" />
  <rect x="1020" y="470" width="100" height="20" rx="3" fill="white" stroke="#CBD5E1" stroke-width="1" />
  <text x="1070" y="484" fill="#0F172A" font-size="11" text-anchor="middle">验证请求</text>

  <!-- T5: Smart Contract -> Verifier (dashed) -->
  <line x1="710" y1="530" x2="1430" y2="530" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#bp-arrow)" />
  <rect x="1020" y="520" width="100" height="20" rx="3" fill="white" stroke="#CBD5E1" stroke-width="1" />
  <text x="1070" y="534" fill="#0F172A" font-size="11" text-anchor="middle">结果广播</text>

  <!-- T6: Chain Listener -> Verifier -->
  <line x1="1190" y1="580" x2="1430" y2="580" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)" />
  <rect x="1250" y="570" width="120" height="20" rx="3" fill="white" stroke="#CBD5E1" stroke-width="1" />
  <text x="1310" y="584" fill="#0F172A" font-size="11" text-anchor="middle">历史查询</text>

  <!-- Dotted line for time axis decoration (optional) -->
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头：交易或直接调用</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">虚线箭头：事件广播或异步通知</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">带圆形标记箭头：验证请求与结果</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">数据验证与溯源时序图。数据从传感器经边缘节点上链，合约记录指纹并发出事件；验证者通过对比哈希确认完整性，同时利用事件追溯历史操作。</text>
  </svg>
</svg>