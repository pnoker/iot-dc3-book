<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图 13-5 数据验证与溯源机制时序图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图 13-5 数据验证与溯源机制时序图</title>
  <desc id="desc">数据经边缘节点生成指纹并上链，验证者通过哈希比对确认完整性，并沿事件日志追溯历史操作。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 13-5 数据验证与溯源机制时序图</text>
  <text x="88" y="64" font-size="12" fill="#64748B">哈希验证确认数据完整性，事件索引串联历史操作</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 六参与方头部 ===== -->
  <rect x="160" y="150" width="180" height="70" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
  <text x="250" y="184" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">传感器</text>
  <text x="250" y="206" font-size="10" fill="#475569" text-anchor="middle">温度计</text>

  <rect x="430" y="150" width="180" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="520" y="184" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">边缘节点</text>
  <text x="520" y="206" font-size="10" fill="#475569" text-anchor="middle">网关</text>

  <rect x="710" y="150" width="180" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="800" y="184" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">智能合约</text>
  <text x="800" y="206" font-size="10" fill="#475569" text-anchor="middle">3 mapping + 2 Event</text>

  <rect x="990" y="150" width="180" height="70" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="1080" y="184" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">区块链网络</text>
  <text x="1080" y="206" font-size="10" fill="#475569" text-anchor="middle">区块</text>

  <rect x="1260" y="150" width="180" height="70" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="1350" y="184" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">链下监听器</text>
  <text x="1350" y="206" font-size="10" fill="#475569" text-anchor="middle">数据库</text>

  <rect x="1510" y="150" width="180" height="70" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="1600" y="184" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">验证者</text>
  <text x="1600" y="206" font-size="10" fill="#475569" text-anchor="middle">放大镜</text>

  <!-- 生命线 -->
  <line x1="250" y1="220" x2="250" y2="760" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="520" y1="220" x2="520" y2="760" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="800" y1="220" x2="800" y2="760" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="1080" y1="220" x2="1080" y2="760" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="1350" y1="220" x2="1350" y2="760" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="1600" y1="220" x2="1600" y2="760" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- 时间轴 -->
  <g font-size="10.5" font-weight="700" fill="#94A3B8">
    <text x="120" y="284">T0</text>
    <text x="120" y="344">T1</text>
    <text x="120" y="404">T2</text>
    <text x="120" y="464">T3</text>
    <text x="120" y="534">T4</text>
    <text x="120" y="594">T5</text>
    <text x="120" y="654">T6</text>
  </g>

  <!-- 1 传感器 → 边缘节点 -->
  <line x1="252" y1="280" x2="518" y2="280" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
  <text x="385" y="268" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">1 原始数据 JSON</text>
  <!-- 2 边缘节点 → 智能合约 -->
  <line x1="522" y1="340" x2="798" y2="340" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="660" y="328" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">2 上链交易 storeDataHash</text>
  <!-- 3 智能合约 → 区块链 -->
  <line x1="802" y1="400" x2="1078" y2="400" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="940" y="388" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">3 状态写入 · DataStored</text>
  <!-- 4 区块链 → 监听器 -->
  <line x1="1078" y1="460" x2="1348" y2="460" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="1213" y="448" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">4 事件索引（广播）</text>
  <!-- 5 验证者 → 智能合约 -->
  <line x1="1598" y1="530" x2="802" y2="530" stroke="#F97316" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="1200" y="518" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">5 验证请求 verifyData(dataId, rawData)</text>
  <!-- 6 智能合约 → 验证者 -->
  <line x1="800" y1="590" x2="1598" y2="590" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
  <text x="1200" y="578" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">6 结果广播 DataVerified</text>
  <!-- 7 监听器 → 验证者 -->
  <line x1="1350" y1="650" x2="1598" y2="650" stroke="#475569" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="1475" y="638" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">7 历史查询</text>

  <!-- 智能合约内部说明 -->
  <rect x="700" y="700" width="360" height="54" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="880" y="722" font-size="10.5" fill="#475569" text-anchor="middle">mapping：dataHashes · dataTimestamps · dataOwners</text>
  <text x="880" y="742" font-size="10.5" fill="#475569" text-anchor="middle">Event：DataStored · DataVerified</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图 13-5 数据经边缘节点生成指纹并上链，验证者通过哈希比对确认完整性并沿事件追溯历史操作。</text>
  </svg>
</svg>
  </main>
</body>
</html>
