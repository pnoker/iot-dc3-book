<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图13-6 供应链核心痛点与区块链价值点映射</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图13-6 供应链核心痛点与区块链价值点映射</title>
  <desc id="desc">四类供应链痛点分别映射到账本共享、签名存证、事件溯源与合约审计能力，其中信息孤岛到共享账本的解决力度最大。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F97316"/></marker>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图13-6 供应链核心痛点与区块链价值点映射</text>
  <text x="88" y="64" font-size="12" fill="#64748B">四类供应链痛点分别映射到账本共享、签名存证、事件溯源与合约审计能力</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 栏标题 -->
  <text x="440" y="148" font-size="15" font-weight="700" fill="#C2410C" text-anchor="middle">供应链核心痛点</text>
  <text x="1360" y="148" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">区块链价值点</text>

  <!-- ===== 左栏：痛点 ===== -->
  <g font-size="14" font-weight="700" fill="#0F172A">
    <rect x="180" y="168" width="520" height="82" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
    <text x="440" y="202" text-anchor="middle">信息孤岛</text>
    <text x="440" y="228" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle">数据不共享</text>

    <rect x="180" y="278" width="520" height="82" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
    <text x="440" y="312" text-anchor="middle">伪造与假冒</text>
    <text x="440" y="338" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle">来源与真伪难以验证</text>

    <rect x="180" y="388" width="520" height="82" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
    <text x="440" y="422" text-anchor="middle">溯源与召回困难</text>
    <text x="440" y="448" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle">链路断裂，定位耗时</text>

    <rect x="180" y="498" width="520" height="82" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
    <text x="440" y="532" text-anchor="middle">合规审计成本高</text>
    <text x="440" y="558" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle">多方可信材料难以汇总</text>
  </g>

  <!-- ===== 右栏：价值点 ===== -->
  <g font-size="14" font-weight="700" fill="#0F172A">
    <rect x="1100" y="168" width="520" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
    <text x="1360" y="202" text-anchor="middle">分布式账本</text>
    <text x="1360" y="228" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle">多方数据共享</text>

    <rect x="1100" y="278" width="520" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
    <text x="1360" y="312" text-anchor="middle">时间戳 + 数字签名</text>
    <text x="1360" y="338" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle">数据不可篡改</text>

    <rect x="1100" y="388" width="520" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
    <text x="1360" y="422" text-anchor="middle">全链路事件日志</text>
    <text x="1360" y="448" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle">可追踪</text>

    <rect x="1100" y="498" width="520" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
    <text x="1360" y="532" text-anchor="middle">智能合约</text>
    <text x="1360" y="558" font-size="11.5" fill="#475569" font-weight="400" text-anchor="middle">自动化审计</text>
  </g>

  <!-- ===== 映射箭头 ===== -->
  <!-- 信息孤岛 → 分布式账本（最粗） -->
  <line x1="702" y1="209" x2="1098" y2="209" stroke="#2563EB" stroke-width="5" stroke-dasharray="8 4" marker-end="url(#ah-blue)"/>
  <text x="900" y="198" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="middle">打破信息孤岛，实现共享</text>
  <!-- 伪造与假冒 → 时间戳+数字签名 -->
  <line x1="702" y1="319" x2="1098" y2="319" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#ah-blue)"/>
  <text x="900" y="308" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="middle">防伪验证，不可篡改</text>
  <!-- 溯源困难 → 事件日志 -->
  <line x1="702" y1="429" x2="1098" y2="429" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#ah-blue)"/>
  <text x="900" y="418" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="middle">全链路追踪，召回精准</text>
  <!-- 审计成本高 → 智能合约 -->
  <line x1="702" y1="539" x2="1098" y2="539" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#ah-blue)"/>
  <text x="900" y="528" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="middle">自动化审计，降低成本</text>

  <!-- 说明 -->
  <text x="900" y="620" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">左侧橙色为痛点，右侧蓝色为区块链价值点；线宽表示解决力度，信息孤岛 → 分布式账本的力度最大。</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图13-6 供应链协同中「信任」是核心障碍，区块链通过去中心化共享和不可篡改记录提供解耦方案。</text>
  </svg>
</svg>
  </main>
</body>
</html>
