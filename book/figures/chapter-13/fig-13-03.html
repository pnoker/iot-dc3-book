<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图13-3 设备DID注册与验证流程</title><style>body{margin:0;background:#F8FAFC;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.page{width:1200px;margin:auto}text{fill:#0F172A}</style></head><body><main class="page"><svg data-figure-root="fig-13-03" xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">图13-3 设备DID注册与验证流程</title><desc id="desc">设备在安全飞地生成密钥并注册 DID。验证方设备生成一次性 nonce，身份设备签名回复；验证方随后查询最新 DID 状态并验证签名，同时消费 nonce 防止重放。</desc><defs><marker id="b" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7Z" fill="#2563EB"/></marker><marker id="g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5 0 7Z" fill="#0F766E"/></marker></defs><rect width="1200" height="780" fill="#F8FAFC"/><circle cx="48" cy="42" r="6" fill="#2563EB"/><text x="66" y="49" font-size="24" font-weight="700">图13-3 设备DID注册与验证流程</text><text x="66" y="74" font-size="12" fill="#475569">验证方发起一次性挑战，签名回复须结合最新 DID 状态验证</text><line x1="48" y1="96" x2="1152" y2="96" stroke="#94A3B8"/>
<g><rect x="90" y="120" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/><text x="210" y="147" font-size="16" font-weight="700" text-anchor="middle">设备 1 · 身份主体</text><text x="210" y="168" font-size="12" fill="#475569" text-anchor="middle">安全飞地 · 私钥不可导出</text><rect x="480" y="120" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="600" y="147" font-size="16" font-weight="700" text-anchor="middle">DeviceDIDRegistry</text><text x="600" y="168" font-size="12" fill="#475569" text-anchor="middle">智能合约 · 区块链</text><rect x="870" y="120" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="990" y="147" font-size="16" font-weight="700" text-anchor="middle">设备 2 · 验证方</text><text x="990" y="168" font-size="12" fill="#475569" text-anchor="middle">生成并消费一次性 nonce</text></g><g stroke="#94A3B8" stroke-dasharray="6 5"><line x1="210" y1="182" x2="210" y2="700"/><line x1="600" y1="182" x2="600" y2="700"/><line x1="990" y1="182" x2="990" y2="700"/></g>
<g font-size="12"><path d="M210 210h64v28h-56" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#g)"/><text x="286" y="229">1 生成 ECDSA 密钥对</text><path d="M210 258h64v28h-56" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#g)"/><text x="286" y="277">2 公钥哈希 → DID</text><line x1="218" y1="322" x2="592" y2="322" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="405" y="310" text-anchor="middle" fill="#2563EB" font-weight="700">3 registerDevice(did, publicKeyHash) + 账户签名</text><path d="M600 344h76v32h-68" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="688" y="362">4 验证签名；写入 owner / hash / timestamp / isActive</text><path d="M600 394h76v28h-68" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="688" y="412">5 记录 DIDRegistered 日志</text><path d="M990 442h-76v28h68" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#g)"/><text x="902" y="460" text-anchor="end">6 生成并登记一次性 nonce</text><line x1="982" y1="490" x2="218" y2="490" stroke="#0F766E" stroke-width="2" marker-end="url(#g)"/><text x="600" y="478" text-anchor="middle" fill="#0F766E" font-weight="700">7 nonce 挑战 → 设备 1</text><path d="M210 510h64v28h-56" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#g)"/><text x="286" y="528">8 用设备私钥签名 nonce</text><line x1="218" y1="558" x2="982" y2="558" stroke="#0F766E" stroke-width="2" marker-end="url(#g)"/><text x="600" y="546" text-anchor="middle" fill="#0F766E" font-weight="700">9 DID + nonce 签名 → 设备 2</text><line x1="982" y1="594" x2="608" y2="594" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="795" y="582" text-anchor="middle">10 查询最新 didDocs[didHash]</text><line x1="608" y1="628" x2="982" y2="628" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="795" y="616" text-anchor="middle">11 返回 owner / publicKeyHash / isActive</text><path d="M990 646h-76v34h68" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#g)"/><text x="902" y="663" text-anchor="end">12 校验签名与 isActive；消费 nonce，拒绝重放</text><line x1="982" y1="700" x2="218" y2="700" stroke="#0F766E" stroke-width="2" marker-end="url(#g)"/><text x="600" y="688" text-anchor="middle" font-weight="700">13 验证通过 / 失败（失败则终止握手）</text></g><g font-size="12" fill="#475569"><line x1="300" y1="738" x2="350" y2="738" stroke="#0F766E" stroke-width="2"/><text x="360" y="743">链下操作</text><line x1="510" y1="738" x2="560" y2="738" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5"/><text x="570" y="743">链上操作 / 查询</text></g></svg></main></body></html>
