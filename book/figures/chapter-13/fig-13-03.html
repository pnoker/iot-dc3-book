<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图 13-3 设备DID注册与验证流程</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图 13-3 设备DID注册与验证流程</title>
  <desc id="desc">设备注册 DID 与公钥哈希后，验证方结合一次性 nonce、签名和最新链上状态完成身份验证。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 13-3 设备DID注册与验证流程</text>
  <text x="88" y="64" font-size="12" fill="#64748B">验证方发起一次性挑战，签名回复须结合最新 DID 状态验证</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 三泳道头部 ===== -->
  <rect x="180" y="150" width="280" height="74" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.6"/>
  <text x="320" y="184" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">设备 1 · 身份主体</text>
  <text x="320" y="208" font-size="10.5" fill="#475569" text-anchor="middle">安全飞地 · 私钥不可导出</text>

  <rect x="760" y="150" width="280" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="900" y="184" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">DeviceDIDRegistry</text>
  <text x="900" y="208" font-size="10.5" fill="#475569" text-anchor="middle">智能合约 · 区块链</text>

  <rect x="1340" y="150" width="280" height="74" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="1480" y="184" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">设备 2 · 验证方</text>
  <text x="1480" y="208" font-size="10.5" fill="#475569" text-anchor="middle">生成并消费一次性 nonce</text>

  <!-- 生命线 -->
  <line x1="320" y1="224" x2="320" y2="820" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="900" y1="224" x2="900" y2="820" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="1480" y1="224" x2="1480" y2="820" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- 1 设备1 自循环 -->
  <rect x="300" y="244" width="200" height="26" rx="6" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.2"/>
  <text x="320" y="262" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">1 生成 ECDSA 密钥对</text>
  <!-- 2 设备1 自循环 -->
  <rect x="300" y="288" width="200" height="26" rx="6" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.2"/>
  <text x="320" y="306" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">2 公钥哈希 → DID</text>
  <!-- 3 设备1 → 合约 -->
  <line x1="322" y1="330" x2="898" y2="330" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="610" y="320" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">3 registerDevice(did, publicKeyHash) + 账户签名</text>
  <!-- 4 合约 自循环 -->
  <rect x="770" y="348" width="300" height="26" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="900" y="366" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">4 验证签名；写入 owner/hash/timestamp/isActive</text>
  <!-- 5 合约 自循环 -->
  <rect x="790" y="392" width="260" height="26" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="900" y="410" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">5 记录 DIDRegistered 日志</text>

  <!-- 阶段分隔 -->
  <line x1="120" y1="432" x2="1680" y2="432" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="140" y="452" font-size="11" font-weight="700" fill="#64748B">注册阶段</text>

  <!-- 6 设备2 自循环 -->
  <rect x="1350" y="462" width="300" height="26" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1.2"/>
  <text x="1480" y="480" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">6 生成并登记一次性 nonce</text>
  <!-- 7 设备2 → 设备1 -->
  <line x1="1478" y1="508" x2="322" y2="508" stroke="#F97316" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="900" y="498" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">7 nonce 挑战 → 设备 1</text>
  <!-- 8 设备1 自循环 -->
  <rect x="300" y="528" width="220" height="26" rx="6" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.2"/>
  <text x="320" y="546" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">8 用设备私钥签名 nonce</text>
  <!-- 9 设备1 → 设备2 -->
  <line x1="322" y1="572" x2="1478" y2="572" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
  <text x="900" y="562" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">9 DID + nonce 签名 → 设备 2</text>
  <!-- 10 设备2 → 合约 -->
  <line x1="1478" y1="618" x2="902" y2="618" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1190" y="608" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">10 查询最新 didDocs[didHash]</text>
  <!-- 11 合约 → 设备2 -->
  <line x1="900" y1="652" x2="1478" y2="652" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
  <text x="1190" y="642" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">11 返回 owner / publicKeyHash / isActive</text>
  <!-- 12 设备2 自循环 -->
  <rect x="1300" y="674" width="360" height="26" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1.2"/>
  <text x="1480" y="692" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">12 校验签名与 isActive；消费 nonce，拒绝重放</text>
  <!-- 13 验证结果 -->
  <rect x="1360" y="716" width="240" height="28" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="1480" y="735" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="middle">13 验证通过 / 失败</text>

  <!-- 图例 -->
  <text x="120" y="768" font-size="11" font-weight="700" fill="#475569">链下操作：密钥生成、nonce 生成与签名</text>
  <text x="120" y="792" font-size="11" font-weight="700" fill="#2563EB">链上操作 / 查询：注册交易、状态写入、DID 文档查询</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图 13-3 设备注册 DID 与公钥哈希后，验证方结合一次性 nonce、签名和最新链上状态完成身份验证。</text>
  </svg>
</svg>
  </main>
</body>
</html>
