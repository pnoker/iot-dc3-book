type: architecture
title: 图 13-11 AI+区块链+物联网三角范式关系图
audience_takeaway: 读者应理解三方构成闭环：IoT供数据、AI推理并上链存证、链上预言机回控设备，数据单向流入而信任反向锚定，闭环方可审计。
purpose: 展示AI、区块链、物联网三者之间的互补关系和核心交互链路。
visual_focus: 从IoT到终点的主链路。
design_level: logical
layout: 三个节点构成三角形，分别标注AI、Blockchain、IoT。三条边为交互关系：IoT→AI为数据供给，AI→Blockchain为可信推理，Blockchain→IoT为信任锚定。中心区域标注“可信智能闭环”。节点旁标注关键能力：IoT（感知、连接、数据采集）、AI（推理、预测、模型训练）、Blockchain（存证、共识、去中心化信任）。
elements:
- IoT节点（青绿色）：感知层设备、边缘节点、传感器数据流。
- AI节点（橙色）：推理引擎、联邦学习聚合器、模型服务。
- Blockchain节点（蓝色）：分布式账本、智能合约、共识节点、预言机。
- 中心区域（白色背景+绿色边框）：“可信智能闭环”。
relationships:
- IoT→AI：通过MQTT/HTTP/边缘网关提供原始数据和上下文，实线箭头，标签“数据供给”。
- AI→Blockchain：将模型推理结果、模型参数哈希、训练轮次摘要写入区块链，虚线箭头，标签“推理存证”。
- Blockchain→IoT：通过预言机触发智能合约执行动作（如设备远程控制、资产转移），虚线箭头，标签“信任执行”。
