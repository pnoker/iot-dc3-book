- IoT→AI：通过MQTT/HTTP/边缘网关提供原始数据和上下文，实线箭头，标签“数据供给”
- AI→Blockchain：将模型推理结果、模型参数哈希、训练轮次摘要写入区块链，虚线箭头，标签“推理存证”
- Blockchain→IoT：通过预言机触发智能合约执行动作（如设备远程控制、资产转移），虚线箭头，标签“信任执行”
legend:
- 青绿色=物联网设备与边缘；橙色=AI智能能力；蓝色=区块链平台层；绿色=闭环价值；实线箭头=数据流；虚线箭头=控制/审计流。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: HTML/SVG渲染，浅色背景，三角形布局，三节点等距分布，中心标注闭环区域，边标注交互关系。节点使用圆角矩形，颜色匹配palette。箭头使用不同纹理（实线和虚线）。
caption:
  zh: 图 13-11 展示AI、区块链、物联网三者如何形成数据可信→模型可靠→决策可审计的闭环。
  en: 'Figure 13-11 How AI, blockchain, and IoT together form a closed loop of trusted data → reliable models → auditable decisions.'
labels:
  en:
    图 13-11 AI+区块链+物联网三角范式关系图: Figure 13-11 The AI + Blockchain + IoT Triangle
    IoT 提供可信数据，AI 生成推理结果，区块链完成存证并约束受控执行，构成可审计的可信智能闭环。: IoT supplies trusted data, AI produces inference, blockchain attests and constrains execution — an auditable trusted-intelligence loop.
    数据可信 → 模型可靠 → 决策可审计，形成受控智能闭环: Trusted data → reliable models → auditable decisions
    推理 · 预测 · 模型训练: Inference · Prediction · Training
    推理引擎 · 联邦聚合 · 模型服务: Inference engine · federated aggregation · model serving
    感知 · 连接 · 数据采集: Sensing · Connectivity · Data capture
    设备 · 边缘节点 · 上下文: Devices · edge nodes · context
    存证 · 共识 · 去中心化信任: Attestation · consensus · decentralized trust
    账本 · 合约 · 共识节点 · 预言机: Ledger · contracts · consensus nodes · oracles
    可信智能闭环: Trusted Intelligence Loop
    可验证数据 · 可追溯推理 · 受控执行: Verifiable data · traceable inference · controlled execution
    数据供给: Data supply
    MQTT / HTTP / 边缘网关: MQTT / HTTP / edge gateway
    推理存证: Inference attestation
    结果 · 参数哈希 · 训练轮次摘要: Results · parameter hashes · round digests
    信任执行: Trusted execution
    预言机与智能合约仅触发经鉴权、策略校验和审计的设备操作: Only authenticated, policy-checked, audited device actions are triggered
    图 13-11 IoT 提供可信数据，AI 生成推理结果，区块链完成存证并约束受控执行。: Figure 13-11 IoT supplies trusted data, AI produces inference, blockchain attests and constrains execution.
