<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图13-4 数据上链流程图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图13-4 数据上链流程图</title>
  <desc id="desc">数据从传感器采样，经边缘节点分两路：原始数据存入链下存储，哈希与元数据写入链上；验证方重算哈希与链上比对确认完整性。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图13-4 数据上链流程图</text>
  <text x="88" y="64" font-size="12" fill="#64748B">存证是“链下存原文、链上存指纹”的分工，兼顾存储成本与不可篡改性</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 传感器 ===== -->
  <rect x="140" y="340" width="240" height="110" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.8"/>
  <text x="260" y="384" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">传感器</text>
  <text x="260" y="412" font-size="11.5" fill="#475569" text-anchor="middle">设备采样</text>
  <text x="260" y="432" font-size="11.5" fill="#475569" text-anchor="middle">生成 JSON 记录</text>

  <!-- ===== 边缘节点 ===== -->
  <rect x="470" y="340" width="260" height="110" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="600" y="382" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">边缘节点</text>
  <text x="600" y="410" font-size="11.5" fill="#475569" text-anchor="middle">聚合数据 · 计算哈希</text>
  <text x="600" y="432" font-size="11" fill="#475569" text-anchor="middle">（可构建 Merkle 树）</text>

  <!-- ===== IPFS / Arweave ===== -->
  <rect x="820" y="200" width="320" height="100" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="1.8"/>
  <text x="980" y="242" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">IPFS / Arweave</text>
  <text x="980" y="268" font-size="11" fill="#475569" text-anchor="middle">去中心化存储节点</text>
  <rect x="850" y="276" width="260" height="26" rx="6" fill="#E2E8F0"/>
  <text x="980" y="294" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">链下存储</text>

  <!-- ===== 区块链 ===== -->
  <rect x="820" y="490" width="320" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="980" y="530" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">区块链</text>
  <text x="980" y="556" font-size="11" fill="#475569" text-anchor="middle">智能合约接收哈希 · 写入日志事件</text>
  <rect x="850" y="566" width="260" height="26" rx="6" fill="#DBEAFE"/>
  <text x="980" y="584" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="middle">链上存证</text>

  <!-- ===== 验证方 ===== -->
  <rect x="1380" y="340" width="280" height="110" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="1520" y="382" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">验证方</text>
  <text x="1520" y="410" font-size="11.5" fill="#475569" text-anchor="middle">取原始数据 · 重算哈希</text>
  <text x="1520" y="432" font-size="11.5" fill="#475569" text-anchor="middle">链上比对 · 确认完整性</text>

  <!-- ===== 箭头 ===== -->
  <line x1="382" y1="395" x2="468" y2="395" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
  <text x="425" y="383" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">采样数据</text>
  <line x1="730" y1="360" x2="818" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="760" y="312" font-size="11" font-weight="700" fill="#475569">原始数据</text>
  <line x1="730" y1="430" x2="818" y2="510" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="760" y="482" font-size="11" font-weight="700" fill="#2563EB">哈希+元数据</text>
  <line x1="1140" y1="280" x2="1500" y2="350" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="1300" y="300" font-size="11" font-weight="700" fill="#475569">提供原始数据</text>
  <line x1="1140" y1="540" x2="1500" y2="440" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
  <text x="1300" y="505" font-size="11" font-weight="700" fill="#2563EB">查询哈希是否存在</text>

  <!-- 图例 -->
  <rect x="140" y="600" width="1520" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="170" y="636" font-size="11.5" font-weight="700" fill="#0F766E">青绿 = 设备 / 传感器</text>
  <text x="560" y="636" font-size="11.5" font-weight="700" fill="#2563EB">蓝 = 核心处理 / 链上</text>
  <text x="980" y="636" font-size="11.5" font-weight="700" fill="#475569">灰 = 外部存储 / 链下</text>
  <text x="1400" y="636" font-size="11.5" font-weight="700" fill="#334155">实线 = 同步推送 · 虚线 = 查询 / 读取</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图13-4 数据从传感器采样后，原始数据存链下、哈希指纹存链上，验证方通过两侧数据比对确认完整性。</text>
  </svg>
</svg>
  </main>
</body>
</html>
