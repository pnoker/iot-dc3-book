<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图13-4 数据上链流程图</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图13-4 数据上链流程图</title>
  <desc id="desc">读者应理解存证是“链下存原文、链上存指纹”的分工：验证时重算哈希与链上比对，兼顾存储成本与不可篡改性。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
    <defs>
      <marker id="f134-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0F766E"/></marker>
      <marker id="f134-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
      <marker id="f134-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
      <marker id="f134-accent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#F97316"/></marker>
      <marker id="f134-query" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/></marker>
    </defs>
    <rect width="1800" height="900" fill="#F8FAFC"/>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="47" fill="#0F172A" font-size="22" font-weight="700">图13-4 数据上链流程图</text>
    <text x="88" y="70" fill="#64748B" font-size="12">读者应理解存证是“链下存原文、链上存指纹”的分工：验证时重算哈希与链上比对，兼顾存储成本与不可篡改性。</text>
    <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">FLOWCHART</text>
    <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>

    <g data-layout="flowchart">
      <!-- ===== 主链路连线 ===== -->
      <!-- 传感器 → 边缘节点：采样数据 -->
      <line x1="430" y1="452" x2="536" y2="452" stroke="#0F766E" stroke-width="2" marker-end="url(#f134-teal)"/>
      <text x="483" y="442" fill="#0F766E" font-size="11.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">采样数据</text>

      <!-- 边缘节点 → 区块链：哈希+元数据（关键链上路径，accent 高亮） -->
      <path d="M 695,410 V 245 H 1046" fill="none" stroke="#F97316" stroke-width="2" marker-end="url(#f134-accent)"/>
      <text x="830" y="235" fill="#F97316" font-size="11.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">哈希+元数据</text>

      <!-- 边缘节点 → IPFS/Arweave：原始数据 -->
      <path d="M 695,494 V 635 H 1046" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#f134-gray)"/>
      <text x="830" y="625" fill="#475569" font-size="11.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">原始数据</text>

      <!-- 区块链 → 验证方：查询哈希是否存在（虚线=查询） -->
      <path d="M 1350,245 H 1440 V 452 H 1476" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#f134-query)"/>
      <text x="1395" y="238" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">查询哈希是否存在</text>

      <!-- IPFS/Arweave → 验证方：提供原始数据（虚线=读取） -->
      <path d="M 1350,635 H 1410 V 482 H 1476" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#f134-query)"/>
      <text x="1380" y="628" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="3">提供原始数据</text>

      <!-- ===== 节点：传感器（青绿） ===== -->
      <rect x="120" y="410" width="310" height="84" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
      <circle cx="164" cy="452" r="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
      <path d="M 155,452 H 160 L 163,447 L 166,457 L 169,449 L 171,452 H 175" fill="none" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="192" y="446" fill="#0F172A" font-size="15" font-weight="700">传感器</text>
      <text x="192" y="468" fill="#475569" font-size="11">设备采样 · 生成 JSON 记录</text>

      <!-- ===== 节点：边缘节点（蓝，关键节点加粗） ===== -->
      <rect x="540" y="410" width="310" height="84" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
      <circle cx="584" cy="452" r="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <rect x="575" y="444" width="18" height="15" rx="2.5" fill="none" stroke="#2563EB" stroke-width="1.7"/>
      <rect x="579" y="447" width="3" height="3" fill="#2563EB"/>
      <rect x="586" y="447" width="3" height="3" fill="#2563EB"/>
      <line x1="579" y1="452.5" x2="589" y2="452.5" stroke="#2563EB" stroke-width="1.5"/>
      <line x1="579" y1="456" x2="589" y2="456" stroke="#2563EB" stroke-width="1.5"/>
      <text x="612" y="446" fill="#0F172A" font-size="15" font-weight="700">边缘节点</text>
      <text x="612" y="468" fill="#475569" font-size="11">聚合数据 · 计算哈希</text>
      <text x="612" y="487" fill="#64748B" font-size="9.5">（可构建 Merkle 树）</text>

      <!-- ===== 节点：区块链（蓝，链上存证，关键节点加粗） ===== -->
      <rect x="1050" y="165" width="300" height="112" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
      <circle cx="1094" cy="221" r="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <rect x="1085" y="216" width="8" height="10" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
      <rect x="1092" y="216" width="8" height="10" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
      <rect x="1099" y="216" width="8" height="10" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
      <text x="1122" y="206" fill="#0F172A" font-size="15" font-weight="700">区块链</text>
      <text x="1122" y="228" fill="#475569" font-size="11">智能合约接收哈希 · 写入日志事件</text>
      <rect x="1156" y="240" width="88" height="20" rx="10" fill="#2563EB"/>
      <text x="1200" y="254" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">链上存证</text>

      <!-- ===== 节点：IPFS/Arweave（灰，链下存储） ===== -->
      <rect x="1050" y="585" width="300" height="112" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
      <circle cx="1094" cy="641" r="14" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
      <ellipse cx="1094" cy="635" rx="8" ry="3.2" fill="none" stroke="#475569" stroke-width="1.6"/>
      <path d="M 1086,635 V 646 A 8,3.2 0 0 0 1102,646 V 635" fill="none" stroke="#475569" stroke-width="1.6"/>
      <path d="M 1086,640.5 A 8,3.2 0 0 0 1102,640.5" fill="none" stroke="#475569" stroke-width="1.6"/>
      <text x="1122" y="626" fill="#0F172A" font-size="15" font-weight="700">IPFS / Arweave</text>
      <text x="1122" y="648" fill="#475569" font-size="11">去中心化存储节点</text>
      <rect x="1156" y="660" width="88" height="20" rx="10" fill="#475569"/>
      <text x="1200" y="674" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">链下存储</text>

      <!-- ===== 节点：验证方（蓝，关键节点加粗） ===== -->
      <rect x="1480" y="400" width="250" height="104" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
      <circle cx="1524" cy="452" r="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <path d="M 1516,452 L 1521,458 L 1532,445" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="1552" y="446" fill="#0F172A" font-size="15" font-weight="700">验证方</text>
      <text x="1552" y="470" fill="#475569" font-size="10.5">取原始数据 · 重算哈希 · 链上比对</text>
      <text x="1552" y="492" fill="#F97316" font-size="10" font-weight="600">比对一致 → 确认完整性</text>
    </g>

    <!-- ===== 图例 ===== -->
    <line x1="64" y1="800" x2="1736" y2="800" stroke="#E2E8F0"/>
    <g font-size="11" fill="#475569">
      <rect x="100" y="806" width="20" height="14" rx="2" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
      <text x="128" y="816">青绿 = 设备 / 传感器</text>

      <rect x="320" y="806" width="20" height="14" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
      <text x="348" y="816">蓝 = 核心处理 / 链上</text>

      <rect x="540" y="806" width="20" height="14" rx="2" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
      <text x="568" y="816">灰 = 外部存储 / 链下</text>

      <line x1="760" y1="813" x2="794" y2="813" stroke="#64748B" stroke-width="2"/>
      <polygon points="794,813 787,809 787,817" fill="#64748B"/>
      <text x="802" y="816">实线 = 同步 / 主动推送</text>

      <line x1="1000" y1="813" x2="1034" y2="813" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4"/>
      <polygon points="1034,813 1027,809 1027,817" fill="#64748B"/>
      <text x="1042" y="816">虚线 = 查询 / 读取</text>
    </g>

    <!-- ===== 说明 ===== -->
    <text x="900" y="852" fill="#94A3B8" font-size="10" text-anchor="middle">图13-4 展示数据从传感器采样到链下存储和链上存证，最终验证方通过两侧数据比对确认完整性的典型流程。</text>
  </svg>
</svg>
    <section class="meta" style="display:none">
      <div class="card"><div class="label">图表类型</div><div class="value">flowchart</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">自左向右：传感器→边缘节点（聚合+哈希）→分支至链下存储（IPFS/Arweave）与链上存证（区块链）→合并到验证方比对。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
