    问题蔓延: Problem Spread
    ？ 谁为数据可信性背书: '? Who vouches for data trustworthiness'
    结构根因：单一信任锚点: 'Root Cause: A Single Trust Anchor'
    图 13-1 单一信任锚点会把中心故障、数据篡改与跨主体互信成本连续放大。: Figure 13-1 A single trust anchor amplifies failure, tampering and trust costs.
