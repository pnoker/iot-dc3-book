type: architecture
title: 图 13-1 中心化物联网架构的信任困境
audience_takeaway: 星型拓扑把信任全部压向唯一云平台，三个困境沿'问题蔓延'层层叠加，根因是单一信任锚点。
purpose: 展示中心化架构下三个信任困境——单点故障、数据篡改、跨主体互信成本高——之间的关联，以及它们最终都指向信任缺失的根因。
visual_focus: 从左栏到右栏最下方的主链路。
design_level: logical
layout: 左右两栏对比布局。左栏：中心化架构示意图（云平台为中央枢纽，各设备通过实线箭头指向云平台，云平台外部标记“信任锚点唯一”）。右栏：三个困境区块纵向排列，区块间用带红叉的箭头连接，最下方引出问号图标。
elements:
- 左栏：中央大矩形“云平台/中心服务器”，使用蓝色；周围6个小矩形“设备A~F”，使用青绿色；每个设备发出实线箭头指向云平台。
- 左栏：云平台外围虚线方框，标注“信任锚点唯一”、“数据与日志同源”。
- 右栏：三个堆叠文本块，依次为“单点故障与安全风险”、“数据孤岛与篡改风险”、“跨主体互信成本高”，均使用红色/橙色渐变。
- 右栏：三个文本块之间用带红叉的箭头连接，箭头旁文字“问题蔓延”。
- 右栏最下方：带问号的灰色图标，标注“谁为数据可信性背书？”
relationships:
- 左栏：设备全部依赖云平台，形成星型拓扑，信任完全集中在中心。
- 右栏：三个困境依次传递并叠加，最终指向信任缺失问题。
- 左右栏之间用淡色渐变背景过渡，暗示中心化架构是困境的根源。
regions:
- id: edge_domain
  label: 设备与边缘域
  role: 现场异构资源边界
- id: data_domain
  label: 数据资产域
  role: 数据沉淀与治理边界
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
components:
- id: c1
  label: 设备A~F
  type: edge
  subtitle: 现场设备，青绿色小矩形
  group: edge_domain
  priority: primary
  shape: card
- id: c2
  label: 云平台/中心服务器
  type: platform
  subtitle: 信任锚点唯一、数据与日志同源
  group: platform_domain
  priority: primary
  shape: card
- id: c3
  label: 单点故障与安全风险
  type: data
  subtitle: 未做冗余时，中心故障域可能扩大
  group: data_domain
  priority: normal
  shape: card
- id: c4
  label: 数据孤岛与篡改风险
  type: data
  subtitle: 保管方同时控制数据与审计记录
  group: data_domain
  priority: normal
  shape: card
- id: c5
  label: 跨主体互信成本高
  type: data
  subtitle: 各方需反复对账并依赖中介背书
  group: data_domain
  priority: normal
  shape: card
connections:
- from: c1
  to: c2
  label: 设备接入与数据上报，星型拓扑
  style: solid
  direction: left-to-right
- from: c3
  to: c4
  label: 问题蔓延
  style: solid
  direction: left-to-right
- from: c4
  to: c5
  label: 问题蔓延
  style: solid
  direction: left-to-right
callouts:
- 左栏：设备全部依赖云平台，形成星型拓扑，信任完全集中在中心
- 右栏：三个困境依次传递并叠加，最终指向信任缺失问题
- 左右栏之间用淡色渐变背景过渡，暗示中心化架构是困境的根源
legend:
- 蓝色=中心平台/服务器；青绿色=物联网设备；红色/橙色=信任困境；灰色=未解决问题。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: HTML/SVG渲染，浅色背景，圆角矩形。左栏动画：设备依次出现并连接云平台。右栏动画：困境区块依次淡入，箭头带闪烁效果。右上角提供高亮/原始配色切换按钮。
caption:
  zh: 图 13-1 中心化物联网架构的信任困境。三个问题相互关联，共同指向单一信任锚点的结构性缺陷。
  en: 'Figure 13-1 The trust dilemma of the centralized IoT architecture. The three problems are interrelated and together point to the structural flaw of a single trust anchor.'
labels:
  en:
    图 13-1 中心化物联网架构的信任困境: Figure 13-1 Trust Dilemmas of Centralized IoT
    星型拓扑把信任全部压向唯一云平台，单点故障、数据篡改与跨主体互信成本沿问题蔓延层层叠加，根因是单一信任锚点。: 'A star topology pushes all trust onto one cloud; failure, tampering and cross-party trust costs pile up — root cause: one trust anchor.'
    唯一信任锚点使技术故障逐步演化为跨主体信任问题: 'One anchor: technical failure becomes cross-party distrust'
    中心化星型拓扑: Centralized Star Topology
    设备 A: Device A
    设备 B: Device B
    设备 C: Device C
    设备 D: Device D
    设备 E: Device E
    设备 F: Device F
    云平台 / 中心服务器: Cloud Platform / Central Server
    认证 · 路由 · 数据与日志: Auth · Routing · Data & Logs
    信任锚点唯一 · 数据与日志同源: Single trust anchor · shared data & logs
    单点故障与安全风险: Single Point of Failure & Security Risk
    未做冗余时，中心故障域可能扩大: Without redundancy, the central failure domain may expand
    数据孤岛与篡改风险: Data Silos & Tampering Risk
    保管方同时控制数据与审计记录: Custodian controls data and audit logs
