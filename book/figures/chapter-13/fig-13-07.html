  <style>

  <desc id="desc">原始数据保留链下，哈希、签名与元数据上链；应用层通过区块链网络查询可信记录，不直接绕过信任层访问设备。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>

  <!-- 标题 -->

  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图13-7 基于区块链的供应链溯源系统分层架构</text>
  <text x="88" y="64" font-size="12" fill="#64748B">应用只能经区块链网络查询可信记录，不直接绕过信任层访问设备</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 应用层 ===== -->
  <text x="400" y="142" font-size="14" font-weight="700" fill="#475569">应用层</text>
  <g font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">
    <rect x="420" y="152" width="290" height="56" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <text x="565" y="185">Web 溯源查询</text>
    <rect x="740" y="152" width="290" height="56" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <text x="885" y="185">移动端防伪验证</text>
    <rect x="1060" y="152" width="290" height="56" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>

    <rect x="1380" y="152" width="290" height="56" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <text x="1525" y="185">数据报表</text>

  <line x1="900" y1="208" x2="900" y2="248" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="700" y="232" font-size="11" font-weight="700" fill="#2563EB">共识结果（实线）</text>
  <line x1="1100" y1="248" x2="1100" y2="208" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="1120" y="232" font-size="11" font-weight="700" fill="#475569">查询请求（虚线）</text>

  <!-- ===== 区块链网络层 ===== -->
  <text x="400" y="272" font-size="14" font-weight="700" fill="#2563EB">区块链网络层</text>
  <g font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">
    <rect x="420" y="282" width="290" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>

    <rect x="740" y="282" width="290" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="885" y="316">共识机制（Raft / PBFT）</text>
    <rect x="1060" y="282" width="290" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>

    <rect x="1380" y="282" width="290" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>

  <line x1="900" y1="400" x2="900" y2="348" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="700" y="382" font-size="11" font-weight="700" fill="#2563EB">哈希 + 签名 + 元数据</text>

  <!-- ===== 边缘层 ===== -->
  <text x="400" y="424" font-size="14" font-weight="700" fill="#0F766E">边缘层</text>
  <rect x="420" y="434" width="1250" height="64" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1045" y="462" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">边缘网关 / 嵌入式节点</text>
  <text x="1045" y="484" font-size="11" fill="#475569" text-anchor="middle">采集 · 格式化 · 数字签名 · 哈希运算 · 本地缓存</text>

  <!-- 感知层 → 边缘层 -->
  <line x1="900" y1="498" x2="900" y2="538" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
  <text x="700" y="522" font-size="11" font-weight="700" fill="#0F766E">原始数据 · RS-485 / Zigbee / BLE</text>

  <text x="400" y="562" font-size="14" font-weight="700" fill="#0F766E">感知层</text>
  <g font-size="12.5" font-weight="700" fill="#0F172A" text-anchor="middle">
    <rect x="420" y="572" width="290" height="56" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="565" y="605">温湿度传感器</text>
    <rect x="740" y="572" width="290" height="56" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="885" y="605">RFID 读写器</text>
    <rect x="1060" y="572" width="290" height="56" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="1205" y="605">GPS 模块</text>
    <rect x="1380" y="572" width="290" height="56" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="1525" y="605">工业采集设备</text>
  </g>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图13-7 原始数据保留链下，哈希、签名与元数据上链；应用层通过区块链网络查询可信记录。</text>
