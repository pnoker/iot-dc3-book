<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图14-8 按硬件节拍编排的迭代与三层测试</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">图14-8 按硬件节拍编排的迭代与三层测试</title>
  <desc id="desc">四周迭代以硬件发布为锚点，CI/CD 分阶段统一集成验证，测试分单元、集成、端到端三层。</desc>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="560" viewBox="0 0 1800 900" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="900" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
  </defs>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图14-8 按硬件节拍编排的迭代与三层测试</text>
  <text x="88" y="64" font-size="12" fill="#64748B">把硬件发布节奏作为迭代锚点 · 每次集成都在同一已知版本快照下</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 四周迭代 -->
  <text x="80" y="150" font-size="15" font-weight="700" fill="#334155">四周迭代（固件固定四周发布一次）</text>

  <rect x="80" y="172" width="400" height="160" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="280" y="206" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">第 1 周 · 方案冻结</text>
  <text x="116" y="240" font-size="12" fill="#475569">确定固件新增物模型属性与命令</text>
  <text x="116" y="264" font-size="12" fill="#475569">前后端 + 嵌入式对齐接口契约</text>
  <text x="116" y="296" font-size="11" fill="#64748B">所有变更记录在统一契约文档</text>

  <line x1="480" y1="252" x2="512" y2="252" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="512" y="172" width="400" height="160" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="712" y="206" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">第 2～3 周 · 并行开发</text>
  <text x="548" y="240" font-size="12" fill="#475569">嵌入式：固件；后端：驱动 + API</text>
  <text x="548" y="264" font-size="12" fill="#475569">前端：人机交互界面</text>
  <text x="548" y="296" font-size="11" fill="#64748B">接口契约编码为自动化契约测试</text>

  <line x1="912" y1="252" x2="944" y2="252" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="944" y="172" width="400" height="160" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1144" y="206" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">第 4 周 · 集成与回归</text>
  <text x="980" y="240" font-size="12" fill="#475569">固件烧录测试设备，后端前端部署测试环境</text>
  <text x="980" y="264" font-size="12" fill="#475569">执行全链路联调</text>
  <text x="980" y="296" font-size="11" fill="#64748B">目标：通过全部集成测试用例</text>

  <rect x="1376" y="172" width="344" height="160" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1548" y="206" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">硬规则</text>
  <text x="1412" y="240" font-size="12" fill="#475569">主分支上所有模块</text>
  <text x="1412" y="264" font-size="12" fill="#475569">必须同时处在一个</text>
  <text x="1412" y="288" font-size="12" fill="#475569">可集成状态</text>

  <!-- CI/CD -->
  <rect x="80" y="380" width="1640" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="414" font-size="14" font-weight="700" fill="#334155">CI/CD：分阶段、分仓库、统一集成验证</text>
  <rect x="120" y="434" width="300" height="46" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="270" y="462" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">build 构建</text>
  <line x1="420" y1="457" x2="456" y2="457" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="456" y="434" width="300" height="46" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="606" y="462" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">integration 集成测试</text>
  <line x1="756" y1="457" x2="792" y2="457" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="792" y="434" width="300" height="46" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="942" y="462" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">package 打包（仅 master）</text>
  <text x="120" y="492" font-size="11" fill="#64748B">不要用一套工具链既编译固件又编译 Java 微服务：分开构建，只在集成测试阶段把产物拉到一起</text>

  <!-- 三层测试 -->
  <text x="80" y="560" font-size="15" font-weight="700" fill="#334155">三层测试策略</text>

  <rect x="80" y="582" width="520" height="150" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="340" y="616" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">单元测试 · 最快最多</text>
  <text x="116" y="650" font-size="12" fill="#475569">设备注册校验、告警条件计算、数据格式转换</text>
  <text x="116" y="676" font-size="12" fill="#475569">不依赖设备，覆盖核心业务逻辑绝大部分路径</text>

  <rect x="640" y="582" width="520" height="150" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="616" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">集成测试 · 模拟设备</text>
  <text x="676" y="650" font-size="12" fill="#475569">启动驱动、Broker、数据服务，模拟客户端收发报文</text>
  <text x="676" y="676" font-size="12" fill="#475569">最易识别物模型字段类型不匹配等跨团队问题</text>

  <rect x="1200" y="582" width="520" height="150" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="1460" y="616" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">端到端测试 · 真实固件</text>
  <text x="1236" y="650" font-size="12" fill="#475569">真实固件烧录测试板，验证上电注册到告警触发全链路</text>
  <text x="1236" y="676" font-size="12" fill="#475569">代价最高，仅关键提交与发布候选执行</text>

  <!-- Caption -->
  <text x="900" y="860" font-size="17" fill="#475569" text-anchor="middle">图14-8 迭代周期对齐硬件发布节奏，四周内完成方案冻结、并行开发、集成回归；CI/CD 分阶段统一集成验证，测试分单元、集成、端到端三层。</text>
  </svg>
</svg>
  </main>
</body>
</html>
