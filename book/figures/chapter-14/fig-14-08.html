  <style>

  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图 14-8 IoT DC3 容器化部署架构</title>
  <desc id="desc">外部入口经 Gateway 路由四中心，Data 经 RabbitMQ 与 Driver 双向通信，Driver 向 Manager 注册；PostgreSQL 与 RabbitMQ 使用持久化卷，配置由环境变量注入。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F97316"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 14-8 IoT DC3 容器化部署架构</text>
  <text x="88" y="64" font-size="12" fill="#64748B">Compose 拓扑聚焦入口、平台服务、消息链与持久化边界</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 顶部入口 ===== -->
  <rect x="300" y="130" width="340" height="66" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/>
  <text x="470" y="158" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">外部入口 · Web / Nginx</text>
  <text x="470" y="180" font-size="11" fill="#475569" text-anchor="middle">暴露 8080 / 8443</text>
  <rect x="760" y="130" width="340" height="66" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="930" y="158" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Gateway</text>
  <text x="930" y="180" font-size="11" fill="#475569" text-anchor="middle">内部端口 8000 · 统一路由</text>
  <line x1="642" y1="163" x2="758" y2="163" stroke="#2563EB" stroke-width="2.3" marker-end="url(#ah-blue)"/>
  <text x="700" y="152" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">入口请求</text>

  <!-- ===== 三列 ===== -->
  <!-- 左列：基础设施 -->
  <rect x="110" y="240" width="430" height="560" rx="12" fill="none" stroke="#475569" stroke-width="1.6"/>
  <text x="325" y="274" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">基础设施</text>
  <rect x="135" y="296" width="380" height="80" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.6"/>
  <text x="325" y="328" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">PostgreSQL</text>
  <text x="325" y="352" font-size="11" fill="#475569" text-anchor="middle">用户 · 元数据 · 历史值</text>
  <rect x="135" y="396" width="380" height="80" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.6"/>
  <text x="325" y="428" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">RabbitMQ</text>
  <text x="325" y="452" font-size="11" fill="#475569" text-anchor="middle">位号值 · 命令 · 状态 · 回执</text>
  <rect x="135" y="496" width="380" height="80" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.6"/>
  <text x="325" y="528" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">dc3net + ENV</text>
  <text x="325" y="552" font-size="11" fill="#475569" text-anchor="middle">固定服务名 · 运行时配置</text>
  <rect x="135" y="606" width="380" height="60" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="325" y="632" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">持久化卷（PG / MQ）</text>
  <text x="325" y="652" font-size="11" fill="#94A3B8" text-anchor="middle">敏感配置由环境变量注入</text>

  <!-- 中列：平台服务 -->
  <rect x="580" y="240" width="680" height="560" rx="12" fill="none" stroke="#2563EB" stroke-width="1.6"/>
  <text x="920" y="274" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">平台服务</text>
  <rect x="605" y="296" width="630" height="66" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="920" y="324" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">Gateway</text>
  <text x="920" y="346" font-size="11" fill="#475569" text-anchor="middle">REST 路由 · Token 校验</text>
  <rect x="605" y="386" width="300" height="86" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="755" y="418" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Auth</text>
  <text x="755" y="442" font-size="11" fill="#475569" text-anchor="middle">鉴权与令牌</text>
  <rect x="935" y="386" width="300" height="86" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="1085" y="418" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Manager</text>
  <text x="1085" y="442" font-size="11" fill="#475569" text-anchor="middle">设备与模型元数据</text>
  <rect x="605" y="496" width="300" height="86" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="755" y="528" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Data</text>
  <text x="755" y="552" font-size="11" fill="#475569" text-anchor="middle">最新值与历史值</text>
  <rect x="935" y="496" width="300" height="86" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/>
  <text x="1085" y="528" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Agentic</text>
  <text x="1085" y="552" font-size="11" fill="#475569" text-anchor="middle">对话与受控工具</text>
  <rect x="605" y="606" width="630" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="920" y="640" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">Compose DNS 固定服务名路由</text>

  <!-- 右列：南向 Driver -->
  <rect x="1300" y="240" width="390" height="560" rx="12" fill="none" stroke="#0F766E" stroke-width="1.6"/>
  <text x="1495" y="274" font-size="16" font-weight="700" fill="#0F766E" text-anchor="middle">南向 Driver</text>
  <rect x="1325" y="296" width="340" height="80" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
  <text x="1495" y="328" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">driver-mqtt</text>
  <text x="1495" y="352" font-size="11" fill="#475569" text-anchor="middle">MQTT 发布 / 订阅</text>
  <rect x="1325" y="396" width="340" height="80" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
  <text x="1495" y="428" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">driver-modbus</text>
  <text x="1495" y="452" font-size="11" fill="#475569" text-anchor="middle">TCP / RTU 轮询与写入</text>
  <rect x="1325" y="496" width="340" height="80" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
  <text x="1495" y="528" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">driver-opcua</text>
  <text x="1495" y="552" font-size="11" fill="#475569" text-anchor="middle">OPC UA 订阅采集</text>

  <!-- ===== 关系连线 ===== -->
  <!-- 顶部入口 → 中列 Gateway -->
  <line x1="930" y1="196" x2="930" y2="294" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>

  <!-- 中列 Gateway → 四中心 -->
  <path d="M755 362 V384" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M1085 362 V384" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M755 472 V494" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M1085 472 V494" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M1085 362 V376 H755 V384" stroke="#2563EB" stroke-width="2" fill="none"/>

  <!-- Driver → Manager（gRPC） -->
  <path d="M1325 336 H1092 V384" stroke="#F97316" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ah-orange)"/>
  <text x="1240" y="320" font-size="12" font-weight="700" fill="#D97706" text-anchor="middle">gRPC 注册 / 元数据</text>

  <!-- Data ↔ RabbitMQ ↔ Driver -->
  <path d="M605 540 H516" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-teal)"/>
  <path d="M516 560 H605" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
  <path d="M516 436 H1323" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-teal)"/>
  <path d="M1323 460 H516" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
  <text x="920" y="700" font-size="12" font-weight="700" fill="#0F766E" text-anchor="middle">Data ↔ RabbitMQ ↔ Driver：命令 / 数据 / 回执（异步）</text>

  <!-- 平台服务 → PostgreSQL -->
  <path d="M605 320 H516" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah-gray)"/>
  <text x="565" y="308" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">持久化</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图 14-8 IoT DC3 当前容器化部署：PostgreSQL 与 RabbitMQ 提供基础设施，Gateway 和四中心组成平台，协议 Driver 按需启用并通过固定服务名与消息契约接入。</text>
