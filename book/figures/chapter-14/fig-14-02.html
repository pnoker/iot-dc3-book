<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图14-2 IoT DC3 系统分层架构</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图14-2 IoT DC3 系统分层架构</title>
  <desc id="desc">北向请求经 Gateway 进入四中心，Driver 经 gRPC 对接 Manager，命令与数据经 RabbitMQ 在 Data 与 Driver 之间异步流转。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F97316"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#475569"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图14-2 IoT DC3 系统分层架构</text>
  <text x="88" y="64" font-size="12" fill="#64748B">北向 REST/gRPC 同步、南向 RabbitMQ 异步，构成三类真实通信边界</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 应用层 ===== -->
  <text x="140" y="148" font-size="15" font-weight="700" fill="#334155">应用层</text>
  <rect x="140" y="164" width="420" height="62" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/>
  <text x="350" y="190" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Web 控制台</text>
  <text x="350" y="212" font-size="11" fill="#475569" text-anchor="middle">运维 / 配置界面</text>
  <rect x="690" y="164" width="420" height="62" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/>
  <text x="900" y="190" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">第三方应用</text>
  <text x="900" y="212" font-size="11" fill="#475569" text-anchor="middle">REST API 集成</text>
  <rect x="1240" y="164" width="420" height="62" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.8"/>
  <text x="1450" y="190" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">API 客户端</text>
  <text x="1450" y="212" font-size="11" fill="#475569" text-anchor="middle">dc3-cli / 脚本</text>

  <!-- 应用 → Gateway -->
  <path d="M350 226 V268" stroke="#475569" stroke-width="2" marker-end="url(#ah-gray)"/>
  <path d="M900 226 V268" stroke="#475569" stroke-width="2" marker-end="url(#ah-gray)"/>
  <path d="M1450 226 V268" stroke="#475569" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="362" y="254" font-size="12" font-weight="700" fill="#475569">REST</text>

  <!-- ===== 接入层 ===== -->
  <text x="140" y="300" font-size="15" font-weight="700" fill="#334155">接入层</text>
  <rect x="140" y="316" width="1520" height="62" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="900" y="342" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">dc3-gateway</text>
  <text x="900" y="364" font-size="11" fill="#475569" text-anchor="middle">REST 路由 · Token 校验 · Compose DNS 寻址</text>

  <!-- Gateway → 四中心 -->
  <path d="M350 378 V420" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M900 378 V420" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M1450 378 V420" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <path d="M900 378 V392 H1450 V420" stroke="#2563EB" stroke-width="2" fill="none"/>
  <text x="560" y="408" font-size="12" font-weight="700" fill="#2563EB">REST 路由到四中心</text>

  <!-- ===== 平台服务层 ===== -->
  <text x="140" y="452" font-size="15" font-weight="700" fill="#334155">平台服务层</text>
  <rect x="140" y="468" width="360" height="130" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="320" y="502" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Auth</text>
  <text x="320" y="532" font-size="12" fill="#475569" text-anchor="middle">鉴权与令牌</text>
  <text x="320" y="556" font-size="11" fill="#94A3B8" text-anchor="middle">PostgreSQL</text>
  <rect x="530" y="468" width="360" height="130" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="710" y="502" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Manager</text>
  <text x="710" y="532" font-size="12" fill="#475569" text-anchor="middle">设备与模型元数据</text>
  <text x="710" y="556" font-size="11" fill="#94A3B8" text-anchor="middle">PostgreSQL</text>
  <rect x="920" y="468" width="360" height="130" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="1100" y="502" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Data</text>
  <text x="1100" y="532" font-size="12" fill="#475569" text-anchor="middle">最新值与历史值</text>
  <text x="1100" y="556" font-size="11" fill="#94A3B8" text-anchor="middle">Caffeine + PostgreSQL</text>
  <rect x="1310" y="468" width="360" height="130" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
  <text x="1490" y="502" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Agentic</text>
  <text x="1490" y="532" font-size="12" fill="#475569" text-anchor="middle">对话与受控工具</text>
  <text x="1490" y="556" font-size="11" fill="#94A3B8" text-anchor="middle">Facade / gRPC</text>

  <!-- Data ↔ RabbitMQ -->
  <path d="M1100 598 V636" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
  <path d="M1070 636 V598" stroke="#0F766E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-teal)"/>
  <text x="1300" y="608" font-size="12" font-weight="700" fill="#2563EB">Data → RabbitMQ → Driver：命令</text>
  <text x="1300" y="628" font-size="12" font-weight="700" fill="#0F766E">Driver → RabbitMQ → Data：数据 / 回执</text>

  <!-- ===== 消息总线 ===== -->
  <rect x="140" y="636" width="1520" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="900" y="670" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">RabbitMQ · PointValue / Status / Command / Receipt</text>

  <!-- ===== Driver 层 ===== -->
  <text x="140" y="730" font-size="15" font-weight="700" fill="#334155">Driver 层</text>
  <rect x="140" y="746" width="420" height="76" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/>
  <text x="350" y="778" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">driver-mqtt</text>
  <text x="350" y="800" font-size="11" fill="#475569" text-anchor="middle">MQTT 发布 / 订阅</text>
  <rect x="690" y="746" width="420" height="76" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/>
  <text x="900" y="778" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">driver-modbus</text>
  <text x="900" y="800" font-size="11" fill="#475569" text-anchor="middle">TCP / RTU 轮询与写入</text>
  <rect x="1240" y="746" width="420" height="76" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8"/>
  <text x="1450" y="778" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">driver-opcua</text>
  <text x="1450" y="800" font-size="11" fill="#475569" text-anchor="middle">OPC UA 订阅采集</text>

  <!-- Driver → Manager（gRPC） -->
  <path d="M880 746 V718 H710 V600" stroke="#F97316" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#ah-orange)"/>
  <text x="420" y="706" font-size="12" font-weight="700" fill="#D97706">Driver → Manager：gRPC 注册 / 元数据查询</text>

  <!-- ===== 设备层 ===== -->
  <rect x="140" y="856" width="1520" height="58" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.8"/>
  <text x="900" y="891" font-size="15" font-weight="700" fill="#0F766E" text-anchor="middle">设备层 · 传感器 / 控制器 / 执行器（可下沉边缘）</text>
  <path d="M350 822 V854" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
  <path d="M900 822 V854" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
  <path d="M1450 822 V854" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图14-2 IoT DC3 四层架构：北向请求经 Gateway 进入四中心，Driver 经 gRPC 对接 Manager，命令与数据经 RabbitMQ 在 Data 与 Driver 之间异步流转。</text>
  </svg>
</svg>
  </main>
</body>
</html>
