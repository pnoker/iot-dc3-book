<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图14-4 AGI时代物联网架构演进</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">

    <!-- 背景网格 -->
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
      </pattern>

      <!-- 实线箭头标记 (蓝色, 橙色, 红色, 青绿色) -->
      <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
      </marker>
      <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#F97316" />
      </marker>
      <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626" />
      </marker>
      <marker id="arrowhead-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#0F766E" />
      </marker>

      <!-- 虚线箭头标记 (蓝色, 红色, 橙色, 灰色) -->
      <marker id="arrowhead-dashed-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
      </marker>
      <marker id="arrowhead-dashed-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626" />
      </marker>
      <marker id="arrowhead-dashed-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#F97316" />
      </marker>
      <marker id="arrowhead-dashed-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748B" />
      </marker>
    </defs>

    <!-- 背景 -->
    <rect width="100%" height="100%" fill="url(#grid)" />

    <!-- 页面主标题 -->
    <text x="600" y="40" fill="#0F172A" font-size="28" font-weight="bold" text-anchor="middle">图14-4 AGI时代物联网架构演进</text>
    <text x="600" y="68" fill="#64748B" font-size="16" text-anchor="middle">左右对比：传统固定模型 vs. 动态Agent编排与安全护栏层</text>

    <!-- ==================== 区域边界 (帧) ==================== -->
    <!-- 左侧帧 (传统) -->
    <rect x="30" y="90" width="540" height="640" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4" />
    <text x="50" y="115" fill="#475569" font-size="14" font-weight="600">传统IoT平台</text>

    <!-- 右侧帧 (AGI) -->
    <rect x="630" y="90" width="540" height="640" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4" />
    <text x="650" y="115" fill="#475569" font-size="14" font-weight="600">AGI时代IoT平台</text>

    <!-- ==================== 连线和箭头 (在网格之后、半透明矩形之前绘制) ==================== -->

    <!-- 左侧连线 -->
    <!-- 设备层 -> 接入层 -->
    <line x1="310" y1="200" x2="310" y2="225" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)" />
    <!-- 接入层 -> 平台层 -->
    <line x1="310" y1="290" x2="310" y2="315" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)" />
    <!-- 平台层 -> 智能层 (提供数据) -->
    <line x1="310" y1="380" x2="310" y2="415" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)" />
    <text x="330" y="400" fill="#2563EB" font-size="11" font-weight="500">提供数据源</text>
    <!-- 智能层 -> 平台层 (告警/控制) -->
    <line x1="280" y1="510" x2="280" y2="385" stroke="#0F766E" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-teal)" />
    <text x="240" y="450" fill="#0F766E" font-size="11" font-weight="500" transform="rotate(-90 240 450)">告警/控制指令</text>
    <!-- 智能层 -> 应用层 -->
    <line x1="430" y1="510" x2="430" y2="545" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)" />

    <!-- 右侧连线 -->
    <!-- 设备层 -> 接入层 -->
    <line x1="890" y1="200" x2="890" y2="225" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)" />
    <!-- 接入层 -> 平台层 -->
    <line x1="890" y1="290" x2="890" y2="315" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)" />
    <!-- 平台层 -> 智能层 (提供数据) -->
    <line x1="890" y1="380" x2="890" y2="415" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)" />
    <text x="910" y="400" fill="#2563EB" font-size="11" font-weight="500">提供数据源</text>
    
    <!-- 内部智能层: Agent编排 -> 模型调度 -->
    <line x1="900" y1="480" x2="905" y2="480" stroke="#F97316" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowhead-dashed-orange)" />
    <text x="870" y="470" fill="#F97316" font-size="10" font-weight="500" text-anchor="end">调用</text>
    
    <!-- 模型调度 -> 云/边缘 -->
    <line x1="1020" y1="480" x2="1085" y2="480" stroke="#F97316" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowhead-dashed-orange)" />
    <text x="1050" y="468" fill="#F97316" font-size="10" font-weight="500">路由</text>
    
    <!-- 智能层 (Agent) -> 安全层 (自动决策) -->
    <line x1="790" y1="530" x2="790" y2="555" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)" />
    <text x="800" y="545" fill="#2563EB" font-size="11" font-weight="500">自动决策</text>
    
    <!-- 安全层 -> 平台层 (校验后指令) -->
    <line x1="760" y1="620" x2="760" y2="385" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-red)" />
    <text x="720" y="500" fill="#DC2626" font-size="11" font-weight="500" transform="rotate(-90 720 500)">校验后指令</text>
    
    <!-- 安全层 -> 应用层 (人工确认) -->
    <line x1="890" y1="620" x2="890" y2="645" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-dashed-red)" />
    <text x="910" y="634" fill="#DC2626" font-size="11" font-weight="500">人工确认</text>

    <!-- ==================== 组件盒子 (半透明填充) ==================== -->

    <!-- ===== 左侧组件 ===== -->
    <!-- 设备层 -->
    <g transform="translate(80, 140)">
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
      <text x="230" y="25" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">设备层</text>
      <text x="230" y="45" fill="#475569" font-size="11" text-anchor="middle">(传感器/执行器)</text>
    </g>
    <!-- 接入层 -->
    <g transform="translate(80, 230)">
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
      <text x="230" y="25" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">接入层</text>
      <text x="230" y="45" fill="#475569" font-size="11" text-anchor="middle">(MQTT/CoAP/Modbus)</text>
    </g>
    <!-- 平台层 -->
    <g transform="translate(80, 320)">
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
      <text x="230" y="25" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">平台层</text>
      <text x="230" y="45" fill="#475569" font-size="11" text-anchor="middle">(认证/设备管理/数据中心)</text>
    </g>
    <!-- 智能层 -->
    <g transform="translate(80, 420)">
      <rect x="0" y="0" width="460" height="90" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="460" height="90" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
      <text x="230" y="25" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">智能层</text>
      <text x="230" y="50" fill="#475569" font-size="11" text-anchor="middle">(规则引擎/预训练模型)</text>
    </g>
    <!-- 应用层 -->
    <g transform="translate(80, 550)">
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
      <text x="230" y="25" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">应用层</text>
      <text x="230" y="45" fill="#475569" font-size="11" text-anchor="middle">(可视化/告警)</text>
    </g>

    <!-- ===== 右侧组件 ===== -->
    <!-- 设备层 -->
    <g transform="translate(680, 140)">
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
      <text x="230" y="25" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">设备层</text>
      <text x="230" y="45" fill="#475569" font-size="11" text-anchor="middle">(传感器/执行器)</text>
    </g>
    <!-- 接入层 -->
    <g transform="translate(680, 230)">
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
      <text x="230" y="25" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">接入层</text>
      <text x="230" y="45" fill="#475569" font-size="11" text-anchor="middle">(MQTT/CoAP/Modbus)</text>
    </g>
    <!-- 平台层 -->
    <g transform="translate(680, 320)">
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
      <text x="230" y="25" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">平台层</text>
      <text x="230" y="45" fill="#475569" font-size="11" text-anchor="middle">(认证/设备管理/数据中心)</text>
    </g>
    
    <!-- 智能层 (AGI) -->
    <g transform="translate(660, 420)">
      <rect x="0" y="0" width="480" height="110" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="480" height="110" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
      <text x="240" y="22" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">智能层</text>
      
      <!-- Agent编排层子框 -->
      <g transform="translate(10, 35)">
        <rect x="0" y="0" width="220" height="65" rx="6" fill="#ffffff" />
        <rect x="0" y="0" width="220" height="65" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1" />
        <text x="110" y="28" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">Agent编排层</text>
        <text x="110" y="48" fill="#475569" font-size="10" text-anchor="middle">(多Agent调度/上下文管理)</text>
      </g>
      <!-- 模型调度网关子框 -->
      <g transform="translate(250, 35)">
        <rect x="0" y="0" width="220" height="65" rx="6" fill="#ffffff" />
        <rect x="0" y="0" width="220" height="65" rx="6" fill="#FFF7ED" stroke="#F97316" stroke-width="1" />
        <text x="110" y="28" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">模型调度网关</text>
        <text x="110" y="48" fill="#475569" font-size="10" text-anchor="middle">(端云路由/版本管理)</text>
      </g>
      <!-- 云/边缘节点 (在智能层边界内) -->
      <g transform="translate(430, 40)">
        <rect x="0" y="0" width="40" height="25" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1" />
        <text x="20" y="16" fill="#0F172A" font-size="9" font-weight="500" text-anchor="middle">云/边</text>
      </g>
    </g>

    <!-- 安全护栏层 -->
    <g transform="translate(680, 560)">
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" />
      <text x="230" y="25" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">安全护栏层</text>
      <text x="230" y="45" fill="#475569" font-size="11" text-anchor="middle">(决策校验/操作约束/人工接管)</text>
    </g>

    <!-- 应用层 -->
    <g transform="translate(680, 650)">
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="460" height="60" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
      <text x="230" y="25" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">应用层</text>
      <text x="230" y="45" fill="#475569" font-size="11" text-anchor="middle">(可视化/告警/人工确认)</text>
    </g>

    <!-- ==================== 图例 (放在底部边界之外) ==================== -->
    <g transform="translate(100, 718)">
      <rect x="0" y="0" width="1000" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      
      <!-- 图例项 -->
      <rect x="15" y="9" width="14" height="14" rx="2" fill="#ECFDF5" stroke="#0F766E" stroke-width="1" />
      <text x="34" y="20" fill="#0F172A" font-size="11">设备与边缘</text>
      
      <rect x="145" y="9" width="14" height="14" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1" />
      <text x="164" y="20" fill="#0F172A" font-size="11">接入与平台</text>
      
      <rect x="275" y="9" width="14" height="14" rx="2" fill="#FFF7ED" stroke="#F97316" stroke-width="1" />
      <text x="294" y="20" fill="#0F172A" font-size="11">AI与Agent</text>
      
      <rect x="405" y="9" width="14" height="14" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1" />
      <text x="424" y="20" fill="#0F172A" font-size="11">安全与管控</text>
      
      <rect x="535" y="9" width="14" height="14" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
      <text x="554" y="20" fill="#0F172A" font-size="11">应用与UI</text>

      <line x1="665" y1="16" x2="685" y2="16" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead-blue)" />
      <text x="695" y="20" fill="#0F172A" font-size="11">同步依赖</text>

      <line x1="805" y1="16" x2="825" y2="16" stroke="#64748B" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowhead-dashed-gray)" />
      <text x="835" y="20" fill="#0F172A" font-size="11">异步/路由</text>
    </g>

    <!-- ==================== 图注 (页脚) ==================== -->
    <text x="600" y="755" fill="#475569" font-size="11" text-anchor="middle">图14-4 AGI时代物联网架构演进。右半部分突出了独立的Agent编排层、动态模型调度网关以及旁路所有自动决策的安全护栏层，这是从传统规则+固定模型向自治系统演变的关键结构变化。</text>

  </svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">architecture</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">左右对比。左侧为传统IoT平台分层（设备层、接入层、平台层、应用层，智能层内嵌规则引擎与固定模型）。右侧为AGI时代平台分层（设备层、接入层、平台层、智能层、安全护栏层、应用层）。智能层细分为Agent编排层与模型调度网关；安全护栏层包含决策校验服务与人工接管接口。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
