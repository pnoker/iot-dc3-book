<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图 14-11 扩展性与成本控制的三个决策点</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">图 14-11 扩展性与成本控制的三个决策点</title>
  <desc id="desc">水平扩展优先无状态服务，数据库读写分离与热冷分层，边缘计算降低云端但引入管理成本。</desc>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="560" viewBox="0 0 1800 900" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图 14-11 扩展性与成本控制的三个决策点</text>
  <text x="88" y="64" font-size="12" fill="#64748B">把“扩展”和“成本”当作设计输入，而不是事后优化</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 决策点1：水平扩展 -->
  <rect x="80" y="140" width="520" height="300" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="80" y="140" width="520" height="48" rx="12" fill="#2563EB"/>
  <rect x="80" y="168" width="520" height="20" fill="#2563EB"/>
  <text x="340" y="172" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">① 水平扩展微服务</text>
  <text x="116" y="224" font-size="12" font-weight="700" fill="#0F172A">优先无状态服务</text>
  <text x="116" y="250" font-size="12" fill="#475569">数据清洗、规则匹配、告警计算</text>
  <text x="116" y="276" font-size="12" fill="#475569">多开实例 + 负载均衡即可摊开流量</text>
  <text x="116" y="314" font-size="12" font-weight="700" fill="#0F172A">有状态服务第二阶段</text>
  <text x="116" y="340" font-size="12" fill="#475569">维护长连接（MQTT）需连接亲和性</text>
  <text x="116" y="366" font-size="12" fill="#475569">会话迁移、心跳保活，配套分布式缓存</text>
  <text x="116" y="404" font-size="11" fill="#64748B">DC3：网关与驱动经 RabbitMQ 解耦，驱动不维持长连接，天然可水平扩展</text>

  <!-- 决策点2：读写分离分片 -->
  <rect x="640" y="140" width="520" height="300" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="640" y="140" width="520" height="48" rx="12" fill="#16A34A"/>
  <rect x="640" y="168" width="520" height="20" fill="#16A34A"/>
  <text x="900" y="172" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">② 读写分离与分片</text>
  <text x="676" y="224" font-size="12" font-weight="700" fill="#0F172A">写入持续大流量，查询间断</text>
  <text x="676" y="250" font-size="12" fill="#475569">主库写、从库读，缓解冲突</text>
  <text x="676" y="288" font-size="12" font-weight="700" fill="#0F172A">分片按设备 ID / 地域 / 时间区间</text>
  <text x="676" y="314" font-size="12" fill="#475569">代价：查询感知分片键，跨分片聚合复杂</text>
  <text x="676" y="352" font-size="12" font-weight="700" fill="#0F172A">热冷分层</text>
  <text x="676" y="378" font-size="12" fill="#475569">热数据（最近几小时）单库/少量分片</text>
  <text x="676" y="404" font-size="12" fill="#475569">冷数据（超一周）迁移低成本归档</text>

  <!-- 决策点3：边缘计算 -->
  <rect x="1200" y="140" width="520" height="300" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <rect x="1200" y="140" width="520" height="48" rx="12" fill="#F97316"/>
  <rect x="1200" y="168" width="520" height="20" fill="#F97316"/>
  <text x="1460" y="172" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">③ 边缘计算</text>
  <text x="1236" y="224" font-size="12" font-weight="700" fill="#0F172A">直接动机：减少上行带宽与云端负荷</text>
  <text x="1236" y="250" font-size="12" fill="#475569">驱动就近采集，过滤、聚合、规则判断本地做</text>
  <text x="1236" y="288" font-size="12" font-weight="700" fill="#0F172A">效益依赖数据筛选率与本地规则复杂度</text>
  <text x="1236" y="314" font-size="12" fill="#475569">只透传不省带宽；大量预处理显著降开销</text>
  <text x="1236" y="352" font-size="12" font-weight="700" fill="#0F172A">代价：引入管理成本</text>
  <text x="1236" y="378" font-size="12" fill="#475569">部署、监控、OTA、故障人工干预</text>
  <text x="1236" y="404" font-size="12" fill="#475569">数百节点分布不同地点，边缘运维本身是工程</text>

  <!-- 成本三维度 + 方案对比 -->
  <text x="80" y="500" font-size="15" font-weight="700" fill="#334155">成本估算：计算 / 存储 / 带宽 三维度，混合策略最优</text>

  <rect x="80" y="522" width="1640" height="180" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="556" font-size="13" font-weight="700" fill="#0F172A">混合策略（而非单一方案）</text>
  <text x="120" y="584" font-size="12" fill="#475569">热数据高性能存储 + 冷数据低成本对象存储 · 高频规则判断边缘处理 + 复杂推理云端 · 遥测走 QoS 0 + 关键状态走 QoS 1</text>
  <text x="120" y="620" font-size="12" fill="#475569">全量公有云：计算中/存储中/带宽高/无边缘维护 —— 快速验证</text>
  <text x="120" y="646" font-size="12" fill="#475569">混合边缘+公有云：计算低/存储中/带宽低/边缘维护中 —— 数据量大、带宽有限</text>
  <text x="120" y="672" font-size="12" fill="#475569">私有数据中心：计算高/存储高/带宽低/维护高 —— 合规与长期稳定</text>

  <!-- Caption -->
  <text x="900" y="860" font-size="17" fill="#475569" text-anchor="middle">图 14-11 扩展优先水平扩展无状态服务、数据库读写分离与热冷分层、边缘计算降低云端但引入管理成本；成本按计算/存储/带宽三维度，采用热冷分层、边缘预处理、分级 QoS 的混合策略。</text>
  </svg>
</svg>
  </main>
</body>
</html>
