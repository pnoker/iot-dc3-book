<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图14-11 连接可靠性：MQTT QoS 与消息链路闭环</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">图14-11 连接可靠性：MQTT QoS 与消息链路闭环</title>
  <desc id="desc">MQTT QoS 0/1/2 各司其职，RabbitMQ 链路靠持久化、死信、去重与设备级串行形成闭环。</desc>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="560" viewBox="0 0 1800 900" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="900" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
  </defs>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图14-11 连接可靠性：MQTT QoS 与消息链路闭环</text>
  <text x="88" y="64" font-size="12" fill="#64748B">可靠性不是“进了队列就安全”，而是从生产确认到结果回执的闭环</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- MQTT QoS -->
  <text x="80" y="150" font-size="15" font-weight="700" fill="#334155">MQTT QoS：三种等级各司其职</text>

  <rect x="80" y="172" width="520" height="150" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="340" y="206" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">QoS 0 · 至多一次</text>
  <text x="116" y="242" font-size="12" fill="#475569">适合可丢弃的高频遥测</text>
  <text x="116" y="268" font-size="12" fill="#475569">关键状态变更走此级降低带宽消耗</text>

  <rect x="640" y="172" width="520" height="150" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="900" y="206" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">QoS 1 · 至少一次</text>
  <text x="676" y="242" font-size="12" fill="#475569">适合多数关键上报，保证可靠</text>
  <text x="676" y="268" font-size="12" fill="#475569">消费者必须处理重复消息</text>

  <rect x="1200" y="172" width="520" height="150" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1460" y="206" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">QoS 2 · 恰好一次</text>
  <text x="1236" y="242" font-size="12" fill="#475569">成本更高，仅业务确实要求“仅一次”</text>
  <text x="1236" y="268" font-size="12" fill="#475569">设备、Broker 都能承受握手开销时采用</text>

  <!-- RabbitMQ 可靠性 -->
  <text x="80" y="380" font-size="15" font-weight="700" fill="#334155">RabbitMQ 命令与数据可靠性（当前唯一消息链路）</text>

  <rect x="80" y="402" width="800" height="220" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <g font-size="12" fill="#0F172A">
    <text x="116" y="434" font-weight="700">持久化与路由</text>
    <text x="116" y="458" fill="#475569">交换机、队列、消息持久化配置与丢失容忍度匹配</text>
    <text x="116" y="496" font-weight="700">TTL 与死信</text>
    <text x="116" y="520" fill="#475569">Driver 专属命令队列设 TTL 与死信交换机，过期命令不长期占用</text>
    <text x="116" y="558" font-weight="700">ack / nack</text>
    <text x="116" y="582" fill="#475569">成功后 ack，无效 reject，暂时失败按重投条件 nack/requeue</text>
  </g>

  <!-- 闭环 -->
  <rect x="920" y="402" width="800" height="220" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1320" y="434" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">可靠性闭环五要素</text>
  <g font-size="12">
    <circle cx="980" cy="480" r="12" fill="#2563EB"/>
    <text x="980" y="485" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="1002" y="485" fill="#0F172A">生产确认</text>
    <circle cx="980" cy="518" r="12" fill="#2563EB"/>
    <text x="980" y="523" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="1002" y="523" fill="#0F172A">路由</text>
    <circle cx="980" cy="556" r="12" fill="#2563EB"/>
    <text x="980" y="561" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="1002" y="561" fill="#0F172A">消费确认</text>
    <circle cx="1310" cy="480" r="12" fill="#2563EB"/>
    <text x="1310" y="485" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="1332" y="485" fill="#0F172A">幂等（commandId 去重 + expireAt）</text>
    <circle cx="1310" cy="518" r="12" fill="#2563EB"/>
    <text x="1310" y="523" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="1332" y="523" fill="#0F172A">结果回执</text>
    <text x="980" y="600" font-size="11" fill="#64748B">同一设备设备级锁串行执行，避免协议帧交错</text>
  </g>

  <!-- 底部提示 -->
  <rect x="80" y="680" width="1640" height="70" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="710" font-size="12" fill="#475569">断线重连用带抖动的指数退避，避免大量设备同时重连形成惊群；退避上限与心跳间隔必须按现场压测，不能写成全平台固定值</text>
  <text x="120" y="734" font-size="11" fill="#64748B">Kafka 的分区/副本/ISR 属于 Kafka 架构知识，不是当前 IoT DC3 部署参数；生产检查围绕 RabbitMQ 队列积压、未确认消息、死信数量、重投与磁盘水位</text>

  <!-- Caption -->
  <text x="900" y="860" font-size="17" fill="#475569" text-anchor="middle">图14-11 MQTT QoS 0/1/2 各司其职；RabbitMQ 链路依靠持久化、TTL 与死信、ack/nack、commandId 去重与设备级串行，形成“生产确认→路由→消费确认→幂等→结果回执”的可靠性闭环。</text>
  </svg>
</svg>
  </main>
</body>
</html>
