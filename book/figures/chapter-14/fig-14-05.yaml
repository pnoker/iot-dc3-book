type: architecture
title: 图 14-5 IoT DC3 系统分层架构
purpose: 展示 IoT DC3 的四层职责及 REST、gRPC、RabbitMQ 三类真实通信边界。
audience_takeaway: 当前服务寻址依赖固定服务名、容器 DNS 和环境变量；RabbitMQ 是默认消息适配器。
visual_focus: Gateway→四中心、Driver→Manager、Data↔RabbitMQ↔Driver。
design_level: logical
layout: 自下而上：设备层→Driver 层→平台服务层→应用层；RabbitMQ 横向位于 Data 与 Driver 之间。
elements:
- 应用层：Web、第三方应用、API 客户端。
- 接入层：dc3-gateway。
- 平台层：Auth、Manager、Data、Agentic。
- Driver 层：MQTT、Modbus、OPC UA 等独立协议服务，可下沉边缘。
- 基础设施：RabbitMQ、PostgreSQL、容器网络 DNS、环境变量配置。
relationships:
- 应用→Gateway→四中心：同步 REST 路由与认证。
- Driver→Manager：同步 gRPC 业务注册和元数据查询。
- Data→RabbitMQ→Driver：异步点位读写与自定义命令。
- Driver→RabbitMQ→Data：异步回执、位号值、状态与事件。
callouts:
- 当前没有独立 Command Service。
- 当前没有 Nacos；Kafka 等 Broker 可通过内部消息适配器选择，不应画成并行必选组件。
render_notes: 浅色 SVG 分层图。固定服务名与环境变量作为寻址说明，不绘制注册中心；RabbitMQ 作为默认消息适配器突出显示。
caption:
  zh: 图 14-5 IoT DC3 四层架构：北向请求经 Gateway 进入四中心，Driver 经 gRPC 对接 Manager，命令与数据经 RabbitMQ 在 Data 与 Driver 之间异步流转。
  en: 'Figure 14-5 The IoT DC3 four-layer architecture: northbound requests enter the four centers through the Gateway, drivers connect to the Manager over gRPC, and commands and data flow asynchronously between Data and drivers via RabbitMQ.'
