type: architecture
title: 图14-5 IoT DC3 容器化部署架构
purpose: 展示 PostgreSQL、RabbitMQ、Gateway、四中心和协议 Driver 的当前 Compose 拓扑。
audience_takeaway: 服务通过 dc3net 固定服务名和环境变量寻址，Driver 经 RabbitMQ 与 Data 异步通信。
visual_focus: PostgreSQL/RabbitMQ→平台服务→协议 Driver 与现场设备。
design_level: deployment
layout: 三列：基础设施、平台服务、协议 Driver；底部标注 dc3net、卷与 .env 注入。
elements:
- 基础设施：PostgreSQL、RabbitMQ。
- 平台：Web、Gateway、Auth、Manager、Data、Agentic。
- 南向：MQTT、Modbus、OPC UA 等按需启用的 Driver。
- 配置：dc3net 固定服务名、环境变量、持久化卷。
relationships:
- 外部入口→Gateway：Web/Nginx将北向请求转发到统一入口。
- Gateway→Auth/Manager/Data/Agentic：通过dc3net固定服务名分别路由到四中心。
- Driver→Manager：gRPC 业务注册与元数据查询。
- Data↔RabbitMQ↔Driver：命令、回执、位号值与状态。
- 平台服务→PostgreSQL：按职责持久化。
callouts:
- 当前没有 Nacos、Kafka、TDengine、Redis 或模型卷。
render_notes: 浅色三列 SVG；基础设施灰色、平台蓝色、Agentic 橙色、Driver 青绿。禁止绘制 Nacos、Kafka、TDengine、Redis 或独立模型服务。
caption:
  zh: 图14-5 IoT DC3 当前容器化部署：PostgreSQL 与 RabbitMQ 提供基础设施，Gateway 和四中心组成平台，协议 Driver 按需启用并通过固定服务名与消息契约接入。
  en: 'Figure 14-5 The current containerized IoT DC3 deployment: PostgreSQL and RabbitMQ provide the infrastructure, the Gateway and four centers form the platform, and protocol drivers are enabled on demand and connect through fixed service names and message contracts.'
labels:
  en:
    图14-5 IoT DC3 容器化部署架构: 'Figure 14-5 IoT DC3 Container Deployment Architecture'
    外部入口经 Gateway 路由四中心，Data 经 RabbitMQ 与 Driver 双向通信，Driver 向 Manager 注册；PostgreSQL 与 RabbitMQ 使用持久化卷，配置由环境变量注入。: 'External traffic is routed by the Gateway to the four centers, Data talks to drivers bidirectionally via RabbitMQ, and drivers register with the Manager; PostgreSQL and RabbitMQ use persistent volumes, and configuration is injected via environment variables.'
    Compose 拓扑聚焦入口、平台服务、消息链与持久化边界: 'The Compose topology highlights the entry point, platform services, message path, and persistence boundary'
