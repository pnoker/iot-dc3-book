<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图14-4 预测性维护扩展示例</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图14-4 预测性维护扩展示例</title>
  <desc id="desc">模型在平台外训练和部署，授权任务把推理结果作为衍生位号写回 Data，复用已有规则与通知链路。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F97316"/></marker>
  </defs>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图14-4 预测性维护扩展示例</text>
  <text x="88" y="64" font-size="12" fill="#64748B">外部模型通过受控读写边界接入，平台继续复用既有数据、规则与通知能力</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 顶部显著标注 -->
  <rect x="120" y="124" width="1560" height="46" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="900" y="153" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">工程扩展示例 · 非当前默认能力（当前 Compose 不含训练任务 / 模型服务 / 模型卷）</text>

  <!-- ===== 三阶段容器 ===== -->
  <!-- 训练 -->
  <rect x="120" y="196" width="500" height="330" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.6"/>
  <text x="370" y="228" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle">训练</text>
  <rect x="150" y="248" width="440" height="64" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="370" y="276" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Data 历史与实时查询</text>
  <text x="370" y="298" font-size="11" fill="#475569" text-anchor="middle">授权只读接口</text>
  <line x1="370" y1="312" x2="370" y2="330" stroke="#2563EB" stroke-width="1.8" marker-end="url(#ah-blue)"/>
  <rect x="150" y="332" width="440" height="64" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="370" y="360" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">特征工程与模型训练</text>
  <text x="370" y="382" font-size="11" fill="#475569" text-anchor="middle">算法、框架与版本由项目选择</text>

  <!-- 训练 → 部署 -->
  <line x1="620" y1="290" x2="682" y2="290" stroke="#2563EB" stroke-width="2.3" marker-end="url(#ah-blue)"/>
  <text x="650" y="278" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">模型制品</text>

  <!-- 部署 -->
  <rect x="650" y="196" width="500" height="330" rx="12" fill="#F8FAFC" stroke="#F97316" stroke-width="1.6"/>
  <text x="900" y="228" font-size="16" font-weight="700" fill="#D97706" text-anchor="middle">部署</text>
  <rect x="680" y="248" width="440" height="64" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <text x="900" y="276" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">独立推理服务</text>
  <text x="900" y="298" font-size="11" fill="#475569" text-anchor="middle">认证 · 限流 · 模型版本管理</text>
  <rect x="680" y="332" width="440" height="76" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <text x="900" y="360" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">与平台服务分开部署</text>
  <text x="900" y="384" font-size="11" fill="#475569" text-anchor="middle">失败时不影响基础采集链路</text>
  <rect x="680" y="424" width="440" height="54" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.2"/>
  <text x="900" y="456" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">推理 API（最小接入边界）</text>

  <!-- 部署 → 推理回写 -->
  <line x1="1150" y1="290" x2="1212" y2="290" stroke="#F97316" stroke-width="2.3" marker-end="url(#ah-orange)"/>
  <text x="1182" y="278" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">受控调用</text>

  <!-- 推理回写 -->
  <rect x="1180" y="196" width="500" height="330" rx="12" fill="#F8FAFC" stroke="#0F766E" stroke-width="1.6"/>
  <text x="1430" y="228" font-size="16" font-weight="700" fill="#0F766E" text-anchor="middle">推理回写</text>
  <rect x="1210" y="248" width="440" height="64" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1430" y="276" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">授权任务 / Agent Tool</text>
  <text x="1430" y="298" font-size="11" fill="#475569" text-anchor="middle">编排读取、推理与回写</text>
  <line x1="1430" y1="312" x2="1430" y2="330" stroke="#0F766E" stroke-width="1.8" marker-end="url(#ah-teal)"/>
  <rect x="1210" y="332" width="440" height="64" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1430" y="360" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Data 衍生位号</text>
  <text x="1430" y="382" font-size="11" fill="#475569" text-anchor="middle">推理结果按位号模型写回</text>
  <line x1="1430" y1="396" x2="1430" y2="414" stroke="#0F766E" stroke-width="1.8" marker-end="url(#ah-teal)"/>
  <rect x="1210" y="416" width="440" height="64" rx="8" fill="#F0FDF4" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1430" y="444" font-size="14" font-weight="700" fill="#0F766E" text-anchor="middle">现有规则与通知链路</text>
  <text x="1430" y="466" font-size="11" fill="#475569" text-anchor="middle">阈值判断 · 告警 · 工单</text>

  <!-- 底部边界说明 -->
  <rect x="120" y="558" width="1560" height="86" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="900" y="588" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">最小接入边界：授权读取 Data → 独立推理 → 衍生位号回写 → 复用规则与通知</text>
  <text x="900" y="614" font-size="12" fill="#475569" text-anchor="middle">模型服务不可用时停止扩展推理，但不阻断设备采集、数据持久化和确定性规则</text>
  <text x="900" y="636" font-size="11" fill="#94A3B8" text-anchor="middle">当前 MCP 只暴露 Tools，不承载实时数据订阅</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图14-4 模型服务不可用时停止扩展推理，但不阻断设备采集、数据持久化和确定性规则。</text>
  </svg>
</svg>
  </main>
</body>
</html>
