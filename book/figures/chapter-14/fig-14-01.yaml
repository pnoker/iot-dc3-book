type: framework
title: 图 14-1 需求分析的四个来源与资产生命周期检视
audience_takeaway: 需求来自访谈、现场勘查、存量系统、行业规范四个来源；用资产生命周期检视法从部署到退役逐阶段推导用例，再以 MoSCoW 划分优先级并量化非功能需求。
purpose: 展示需求获取的四个来源与资产生命周期检视法
visual_focus: 四个来源卡片与资产生命周期五阶段。
design_level: framework
layout: 上半四个来源卡片，中部生命周期五阶段流程，底部 MoSCoW 与非功能需求
elements:
- 四个来源：用户访谈（场景级需求）、现场勘查（物理约束）、存量系统（接口/字段映射）、行业规范（合规底线）
- 资产生命周期：部署 → 运行 → 告警 → 维护 → 退役，逐阶段推导用例
- MoSCoW：Must / Should / Could / Won't，把 Must 收窄到最少
- 非功能需求：可靠性、安全性、可扩展性、实时性，决定架构与成本
relationships:
- 四来源产出需求条目；生命周期法逐阶段推导用例；MoSCoW 划分优先级
render_notes: HTML/SVG 渲染，四来源卡片 + 生命周期五阶段流程 + 底部 MoSCoW 与非功能对比，蓝绿主色。
caption:
  zh: 图 14-1 需求来自访谈、现场勘查、存量系统、行业规范四个来源，用资产生命周期检视法从部署到退役逐阶段推导用例，再以 MoSCoW 划分优先级并量化非功能需求。
  en: 'Figure 14-1 Requirements come from four sources — interviews, site surveys, existing systems, and industry regulations; the asset-lifecycle review derives use cases stage by stage from deployment to retirement, MoSCoW then sets priorities, and non-functional requirements are quantified.'
labels:
  en:
    图 14-1 需求分析的四个来源与资产生命周期检视: 'Figure 14-1 Four Requirement Sources & the Asset Lifecycle Review'
    需求来自访谈、现场勘查、存量系统、行业规范四个来源，用资产生命周期检视法推导功能需求。: 'Requirements come from interviews, site surveys, existing systems, and industry regulations; the asset-lifecycle review derives functional requirements.'
    有效产出是可执行的需求基线，和明确的“不做什么”清单: 'The effective output is an actionable requirements baseline plus an explicit not-to-do list'
    需求获取的四个来源: 'Four Sources of Requirements'
    用户与业务方访谈: 'User & Business Interviews'
    运营、运维、业务决策者: 'Operations, ops staff, and business decision-makers'
    产出场景级需求: 'Yield scenario-level requirements'
    “设备离线 5 分钟内必须告警”: '"An offline device must alert within 5 minutes"'
    设备与现场勘查: 'Device & Site Surveys'
    物理约束：金属遮挡、供电方式: 'Physical constraints: metal shielding, power supply'
    直接决定协议选型与采集策略: 'Directly drive protocol and collection strategy'
    纯软件项目不会出现这类约束: 'Pure-software projects never face such constraints'
    存量系统分析: 'Existing-System Analysis'
    ERP / MES / SCADA 数据接口: 'ERP / MES / SCADA Data Interfaces'
    字段映射与历史数据迁移: 'Field mapping & historical data migration'
    接口文档常与实际不匹配: 'Interface docs often mismatch reality'
    行业规范与合规: 'Industry Regulations & Compliance'
    轨迹保存期限、安全等级认证: 'Trace retention periods, security certification'
    医疗数据隐私合规: 'Medical data privacy compliance'
    不是“能不能做”，而是“不做不能上线”: 'Not "can we do it" but "no launch without it"'
    资产生命周期检视法：从设备出厂到退役逐阶段推导用例: 'Asset lifecycle review: derive use cases stage by stage, from factory shipment to retirement'
    部署: 'Deployment'
    批量注册 · 网关自动发现: 'Bulk Registration · Gateway Auto-Discovery'
    固件版本校验: 'Firmware Version Check'
    运行: 'Operation'
    实时采集 · 在线状态监控: 'Real-Time Collection · Online Status'
    远程开关控制: 'Remote On/Off Control'
    告警: 'Alerting'
    温度超限 · 设备离线: 'Temperature Limits · Device Offline'
    告警分级与推送: 'Alert Grading & Push'
    维护: 'Maintenance'
    OTA 固件升级 · 参数下发: 'OTA Firmware Upgrades · Parameter Push'
    日志远程拉取: 'Remote Log Pull'
    退役: 'Retirement'
    设备注销 · 数据归档: 'Device Deregistration · Data Archiving'
    安全擦除: 'Secure Erasure'
    优先级划分（MoSCoW）与非功能需求: 'Prioritization (MoSCoW) & Non-Functional Requirements'
    缺则无法上线：设备身份认证、数据持久化、在线状态: 'Must-have or no launch: device identity auth, data persistence, online status'
    重要可延迟：告警规则灵活配置、设备分组管理: 'Important but deferrable: flexible alert rules, device grouping'
    锦上添花 / 本次明确排除，把 Must 列表收窄到最少: 'Nice-to-have / explicitly excluded this round; keep the Must list minimal'
    非功能需求（隐形杀手）: 'Non-Functional Requirements (the silent killer)'
    可靠性 · 安全性 · 可扩展性 · 实时性: 'Reliability · Security · Scalability · Real-Time'
    决定架构选型与成本结构，需量化定义: 'They drive architecture choices and cost structure, and must be quantified'
    图 14-1 需求来自访谈、现场勘查、存量系统、行业规范四个来源，用资产生命周期检视法从部署到退役逐阶段推导用例，再以 MoSCoW 划分优先级并量化非功能需求。: 'Figure 14-1 Requirements come from four sources — interviews, site surveys, existing systems, and industry regulations; the asset-lifecycle review derives use cases stage by stage from deployment to retirement, MoSCoW then sets priorities, and non-functional requirements are quantified.'
