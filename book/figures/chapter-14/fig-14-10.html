  <desc id="desc">可复现实验依次冻结 manifest、固定工作负载、定义指标字典、覆盖故障用例、沉淀出版证据包。</desc>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="560" viewBox="0 0 1800 900" preserveAspectRatio="xMidYMid meet">

  </defs>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图14-10 可复现实验的五个环节与证据包</text>
  <text x="88" y="64" font-size="12" fill="#64748B">没有实测就标记 NA，不用数值冒充结果 · 0 与 NA 含义不同</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 五个环节 -->
  <rect x="80" y="150" width="320" height="220" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="240" y="186" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">① 冻结 manifest</text>
  <text x="116" y="224" font-size="11" fill="#475569">commit/tag、镜像 digest、Compose 版本</text>
  <text x="116" y="248" font-size="11" fill="#475569">OS/CPU/内存/网络、JDK/Python</text>
  <text x="116" y="272" font-size="11" fill="#475569">PG/RabbitMQ/Driver 版本</text>
  <text x="116" y="296" font-size="11" fill="#475569">模型/Prompt/Tool/RAG 版本</text>
  <text x="116" y="320" font-size="11" fill="#64748B">密钥不入 manifest，用脱敏摘要</text>

  <line x1="400" y1="260" x2="432" y2="260" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="432" y="150" width="320" height="220" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="592" y="186" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">② 工作负载可重放</text>
  <text x="468" y="224" font-size="11" fill="#475569">固定设备数、位号数、上报频率</text>
  <text x="468" y="248" font-size="11" fill="#475569">payload 大小、读写比、命令比例</text>
  <text x="468" y="272" font-size="11" fill="#475569">持续时间、预热时间</text>
  <text x="468" y="296" font-size="11" fill="#475569">故障：延迟/丢包、断网窗口、重启时刻</text>
  <text x="468" y="320" font-size="11" fill="#64748B">一次比较只改变主要变量</text>

  <line x1="752" y1="260" x2="784" y2="260" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="784" y="150" width="320" height="220" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="944" y="186" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">③ 指标字典</text>
  <text x="820" y="224" font-size="11" fill="#475569">先定义分母，再报告数字</text>
  <text x="820" y="248" font-size="11" fill="#475569">设备接入 / 数据链路 / 命令链路</text>
  <text x="820" y="272" font-size="11" fill="#475569">存储 / 可靠性 / RAG / Agent / 成本</text>
  <text x="820" y="296" font-size="11" fill="#475569">时延起止点必须固定</text>
  <text x="820" y="320" font-size="11" fill="#64748B">多次独立运行，报告 P50/P95/P99</text>

  <line x1="1104" y1="260" x2="1136" y2="260" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="1136" y="150" width="320" height="220" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1296" y="186" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">④ 故障与安全用例</text>
  <text x="1172" y="224" font-size="11" fill="#475569">重复遥测、乱序时间戳</text>
  <text x="1172" y="248" font-size="11" fill="#475569">断开重连、积压恢复、数据库故障</text>
  <text x="1172" y="272" font-size="11" fill="#475569">权限不足、跨租户、模型超时</text>
  <text x="1172" y="296" font-size="11" fill="#475569">回执丢失、重放、人工接管</text>
  <text x="1172" y="320" font-size="11" fill="#64748B">优先模拟器，不绕过 PLC/SIS 联锁</text>

  <line x1="1456" y1="260" x2="1488" y2="260" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <rect x="1488" y="150" width="232" height="220" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1604" y="186" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">⑤ 证据包</text>
  <text x="1524" y="224" font-size="11" fill="#475569">README · manifest</text>
  <text x="1524" y="248" font-size="11" fill="#475569">workload · commands</text>
  <text x="1524" y="272" font-size="11" fill="#475569">raw · summary</text>
  <text x="1524" y="296" font-size="11" fill="#475569">failures · figures</text>
  <text x="1524" y="320" font-size="11" fill="#64748B">正文数字反链实验 ID</text>

  <rect x="80" y="430" width="1640" height="220" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>

  <g font-size="12" fill="#475569">

    <text x="170" y="576">版本、环境和数据哈希</text>
    <text x="140" y="604">├── workload.yaml / commands.txt</text>
    <text x="170" y="628">负载与故障参数 / 实际执行命令</text>
  </g>
  <g font-size="12" fill="#475569">

    <text x="890" y="576">指标定义和汇总</text>
    <text x="860" y="604">├── failures/ + figures/</text>
    <text x="890" y="628">失败样本与复盘 / 图表生成方法</text>
  </g>

  <!-- Caption -->
  <text x="900" y="860" font-size="17" fill="#475569" text-anchor="middle">图14-10 可复现实验依次冻结环境 manifest、固定可重放的工作负载、按指标字典先定义分母再报告、覆盖故障与安全用例，最终沉淀为结构化的出版证据包。</text>
