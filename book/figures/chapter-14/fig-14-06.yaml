  role: RabbitMQ 与 Data 中心
- id: data_domain
  label: 数据资产域
  role: 最新值缓存与 TsdbStore 持久化
- id: north_domain
  label: 北向应用域
  role: Gateway、Web、第三方 API 与 Grafana
