callouts:
- 当前没有 Kafka 分区模型、InfluxDB 或 MongoDB 服务。
- 同一设备命令由 Driver 侧设备锁与 commandId 去重保护。
render_notes: 浅色 SVG 双泳道图，RabbitMQ 作为唯一消息总线突出显示；禁止绘制 Kafka、InfluxDB、MongoDB 或同步 Data→Driver 直连。
caption:
  zh: 图 14-6 IoT DC3 设备数据链路：协议 Driver 将位号值经 RabbitMQ 交给 Data，Data 更新最新值缓存并写入 PostgreSQL；点位命令沿反向异步链路执行并回传结果。
  en: 'Figure 14-6 The IoT DC3 device data path: protocol drivers hand point values to Data via RabbitMQ, Data updates the latest-value cache and writes to PostgreSQL, and point commands run over the reverse asynchronous path and report results back.'
labels:
  en:
    图 14-6 设备接入与数据流: 'Figure 14-6 Device Access & Data Flow'
    ? 上行 Device→Driver→RabbitMQ→Data→Caffeine/PostgreSQL；下行 Client→Gateway→Data→RabbitMQ→Driver→Device，执行结果按 commandId 沿消息链回执到 Data。
    : 'Uplink Device→Driver→RabbitMQ→Data→Caffeine/PostgreSQL; downlink Client→Gateway→Data→RabbitMQ→Driver→Device, with execution results returned to Data by commandId along the message chain.'
    上行位号值与下行命令分泳道；执行回执沿消息链返回并更新命令状态: 'Uplink point values and downlink commands in separate lanes; execution receipts return along the message chain and update command status'
    上行：位号值与状态: 'Uplink: point values & status'
    设备: 'Device'
    协议 Driver: 'Protocol Driver'
    解析与映射: 'Parse & Map'
    异步队列: 'Async Queue'
    消费与批量: 'Consume & Batch'
    存储: 'Storage'
    查询: 'Query'
    发布: 'Publish'
    消费: 'Consume'
    缓存/落库: 'Cache / Persist'
    读取: 'Read'
    Data：更新 Caffeine 最新值，批量写 PostgreSQL，再处理告警规则: 'Data: update the Caffeine latest value, batch-write PostgreSQL, then process alarm rules'
    先保存再处理规则，保证告警基于已落库数据: 'Save first, then run rules, so alarms are based on persisted data'
    RabbitMQ 吸收上报洪峰，Driver 与 Data 不同步阻塞: 'RabbitMQ absorbs reporting peaks, so Driver and Data never block on each other'
    上行只向前推进，不等待消费端回执: 'Uplink only moves forward, never waiting for consumer receipts'
    下行：命令与执行回执: 'Downlink: commands & execution receipts'
    客户端: 'Client'
    POST 命令: 'POST command'
    鉴权 / 路由: 'Auth / Route'
    校验 / 发布: 'Validate / Publish'
    命令队列: 'Command Queue'
    协议写入: 'Protocol Write'
    执行: 'Execute'
    授权请求: 'Authorized Request'
    发布命令: 'Publish Command'
    设备写入: 'Device Write'
    执行回执（按 commandId 返回）: 'Execution receipt (returned by commandId)'
    完整回执：设备结果 → Driver → RabbitMQ → Data: 'Full receipt: device result → Driver → RabbitMQ → Data'
    Data 按 commandId 更新命令状态并供客户端查询或订阅: 'Data updates command status by commandId for clients to query or subscribe'
    客户端查询或订阅命令状态: 'Client queries or subscribes to command status'
    图 14-6 RabbitMQ 承载上行位号值、下行命令与执行回执，Data 统一维护数据和命令状态。: 'Figure 14-6 RabbitMQ carries uplink point values, downlink commands, and execution receipts; Data maintains data and command status uniformly.'
