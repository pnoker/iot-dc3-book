callouts:
- 图中仅画默认 RabbitMQ 与 TsdbStore 边界；其他适配器不是并行必选服务。
- 同一设备命令由 Driver 侧设备锁与 commandId 去重保护。
render_notes: 浅色 SVG 双泳道图，RabbitMQ 作为默认消息适配器突出显示；禁止绘制多个 Broker 并行运行或同步 Data→Driver 直连。
caption:
  zh: 图 14-6 IoT DC3 设备数据链路：协议 Driver 经消息端口把位号值交给 Data，Data 更新最新值缓存并经 TsdbStore 持久化；RabbitMQ 表示默认消息适配器。
  en: 'Figure 14-6 The IoT DC3 device data path: protocol Drivers pass point values to Data through the message port, Data updates the latest-value cache and persists through TsdbStore, and RabbitMQ depicts the default message adapter.'
labels:
  en:
    图 14-6 设备接入与数据流: 'Figure 14-6 Device Access & Data Flow'
    ? 上行 Device→Driver→消息端口→Data→Caffeine/TsdbStore；下行 Client→Gateway→Data→消息端口→Driver→Device，图中 RabbitMQ 表示默认适配器。
    : 'Uplink Device→Driver→message port→Data→Caffeine/TsdbStore; downlink Client→Gateway→Data→message port→Driver→Device, with RabbitMQ depicting the default adapter.'
    上行位号值与下行命令分泳道；执行回执沿消息链返回并更新命令状态: 'Uplink point values and downlink commands in separate lanes; execution receipts return along the message chain and update command status'
    上行：位号值与状态: 'Uplink: point values & status'
    设备: 'Device'
    协议 Driver: 'Protocol Driver'
    解析与映射: 'Parse & Map'
    异步队列: 'Async Queue'
    消费与批量: 'Consume & Batch'
    存储: 'Storage'
    Caffeine / TsdbStore: Caffeine / TsdbStore
    查询: 'Query'
    发布: 'Publish'
    消费: 'Consume'
    缓存/落库: 'Cache / Persist'
    读取: 'Read'
    Data：更新 Caffeine 最新值，经 TsdbStore 批量持久化: 'Data: update the Caffeine latest value and persist batches through TsdbStore'
    先保存再处理规则，保证告警基于已落库数据: 'Save first, then run rules, so alarms are based on persisted data'
    默认 RabbitMQ 解耦 Driver 与 Data；其他适配器需复验: 'Default RabbitMQ decouples Drivers and Data; other adapters require validation'
    上行只向前推进，不等待消费端回执: 'Uplink only moves forward, never waiting for consumer receipts'
    下行：命令与执行回执: 'Downlink: commands & execution receipts'
    客户端: 'Client'
    POST 命令: 'POST command'
    鉴权 / 路由: 'Auth / Route'
    校验 / 发布: 'Validate / Publish'
    命令队列: 'Command Queue'
    协议写入: 'Protocol Write'
    执行: 'Execute'
    授权请求: 'Authorized Request'
    发布命令: 'Publish Command'
    设备写入: 'Device Write'
    执行回执（按 commandId 返回）: 'Execution receipt (returned by commandId)'
    完整回执：设备结果 → Driver → RabbitMQ → Data: 'Full receipt: device result → Driver → RabbitMQ → Data'
    Data 按 commandId 更新命令状态并供客户端查询或订阅: 'Data updates command status by commandId for clients to query or subscribe'
    客户端查询或订阅命令状态: 'Client queries or subscribes to command status'
    图 14-6 消息端口承载上行、命令与回执；RabbitMQ 表示默认适配器。: 'Figure 14-6 The message port carries uplink values, commands, and receipts; RabbitMQ depicts the default adapter.'
