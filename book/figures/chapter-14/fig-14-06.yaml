type: dataflow
title: 图 14-6 设备接入与数据流
purpose: 展示设备、Driver、消息端口、Data、TsdbStore 与北向查询之间的上下行链路，并以 RabbitMQ 表示默认消息适配器。
audience_takeaway: 消息端口解耦上行位号值、下行命令和执行回执；Data 维护最新值、历史值、告警及按 commandId 关联的命令状态。
visual_focus: 上行 Device→Driver→消息端口→Data→Caffeine/TsdbStore；下行 Client→Gateway→Data→消息端口→Driver→Device，并有结果回执返回 Data。
design_level: implementation
layout: 上下两条水平泳道，上方上行数据，下方下行命令与回执。
elements:
- 设备与协议：MQTT、Modbus、OPC UA。
- Driver：协议解析、元数据映射、设备读写。
- RabbitMQ：位号值、点位命令、回执与状态。
- Data：消费、批量、最新值、历史与告警。
- 存储：本地 Caffeine 最新值缓存、TsdbStore 时序存储端口。
- 北向：Gateway、Web、第三方 API、Grafana PostgreSQL 数据源。
relationships:
- 设备→Driver→RabbitMQ→Data：异步上行位号值。
- Data→Caffeine/TsdbStore→告警规则：先保存再处理规则。
- 客户端→Gateway→Data→RabbitMQ→Driver→设备：异步下行命令。
- 设备→Driver→RabbitMQ→Data：执行结果按 commandId 完整回执，Data 更新命令状态并供客户端查询或订阅。
