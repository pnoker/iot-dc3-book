callouts:
- 左侧传统平台：智能层由规则引擎与预训练模型构成，告警与控制指令直接返回平台层。
- 右侧AGI时代平台：智能层升级为Agent编排层+模型调度网关，所有自动决策必经独立安全护栏层校验。
- 安全护栏层含人工接管接口，高风险操作可经应用层人工确认后执行。
legend:
- 青绿色=设备与边缘；蓝色=接入与平台基础服务；橙色=AI与Agent能力；红色=安全与管控；灰色=外部应用与UI。
- 实线箭头=同步调用/强依赖；虚线箭头=异步事件/可选路由。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: HTML/SVG渲染，左右对比布局，圆角矩形，12px间距，箭头带文字标签。颜色使用全书面板配色。左侧传统架构节点数6个，右侧AGI架构节点数8个，注意右侧安全护栏层使用红色边框填充。
caption:
  zh: 图 14-12 AGI时代物联网架构演进。基础数据沿设备、接入、平台、智能逐层向上；受控决策经独立安全护栏沿另一链路向下返回平台执行。
  en: 'Figure 14-12 IoT architecture evolution in the AGI era. Base data flows up through the device, access, platform, and intelligence layers; controlled decisions return down a separate path, through the independent safety guardrail, for platform execution.'
labels:
  en:
    图 14-12 AGI时代物联网架构演进: 'Figure 14-12 IoT Architecture Evolution in the AGI Era'
    左右对比：基础数据主链均由设备层经接入层、平台层向上进入智能层。右侧 AGI 时代平台将智能层升级为 Agent 编排层与模型调度网关，并以独立安全护栏承接受控决策；决策校验通过后沿另一条向下链路回到平台层执行。: 'Side by side: both base data chains run from the device layer up through the access and platform layers into the intelligence layer. The AGI-era platform (right) upgrades the intelligence layer into an Agent orchestration layer plus a model scheduling gateway, with an independent safety guardrail carrying controlled decisions; once validated, decisions return to the platform layer along a separate downlink path for execution.'
    基础数据由设备向智能层逐层上行，受控决策经独立安全护栏沿另一链路向下执行: 'Base data flows up from devices to the intelligence layer; controlled decisions flow down a separate path through the independent safety guardrail'
