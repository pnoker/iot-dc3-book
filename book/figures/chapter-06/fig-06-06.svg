  <!-- ========== Caption ========== -->
  <text x="850" y="1050" font-size="10" fill="#94A3B8" text-anchor="middle">图6-3  北向 Gateway 统一路由；Auth/Manager/Data/Agentic 分工协作；Driver 向 Manager 做 gRPC 业务注册，并经 RabbitMQ 与 Data 双向交换命令、位号值、状态和回执。</text>
