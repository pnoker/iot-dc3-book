<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图6-4 单体到微服务演进阶段图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图6-4 单体到微服务演进阶段图</title>
  <desc id="desc">每次演进都以真实瓶颈为触发点，并换来新的分布式风险。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <defs>
      <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    </defs>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图6-4 单体到微服务演进阶段图</text>
    <text x="88" y="64" font-size="12" fill="#64748B">每次演进都以真实瓶颈为触发点，并换来新的分布式风险。</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 时间轴（先画） -->
    <line x1="150" y1="660" x2="1620" y2="660" stroke="#94A3B8" stroke-width="2" marker-end="url(#ah-blue)"/>
    <text x="1640" y="666" font-size="15" fill="#475569">时间 →</text>
    <line x1="260" y1="653" x2="260" y2="667" stroke="#94A3B8" stroke-width="2"/>
    <line x1="690" y1="653" x2="690" y2="667" stroke="#94A3B8" stroke-width="2"/>
    <line x1="1120" y1="653" x2="1120" y2="667" stroke="#94A3B8" stroke-width="2"/>
    <line x1="1550" y1="653" x2="1550" y2="667" stroke="#94A3B8" stroke-width="2"/>

    <!-- 演进箭头 -->
    <line x1="432" y1="420" x2="516" y2="420" stroke="#2563EB" stroke-width="3" marker-end="url(#ah-blue)"/>
    <line x1="862" y1="420" x2="946" y2="420" stroke="#2563EB" stroke-width="3" marker-end="url(#ah-blue)"/>
    <line x1="1292" y1="420" x2="1376" y2="420" stroke="#2563EB" stroke-width="3" marker-end="url(#ah-blue)"/>
    <text x="474" y="405" font-size="15" fill="#2563EB" text-anchor="middle">耦合暴露</text>
    <text x="904" y="405" font-size="15" fill="#2563EB" text-anchor="middle">吞吐瓶颈</text>
    <text x="1334" y="405" font-size="15" fill="#2563EB" text-anchor="middle">团队分工</text>

    <!-- 风险标签（顶部） -->
    <rect x="110" y="250" width="300" height="36" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
    <text x="260" y="273" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">风险：全量部署</text>
    <rect x="540" y="250" width="300" height="36" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
    <text x="690" y="273" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">风险：单点迁移</text>
    <rect x="970" y="250" width="300" height="36" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
    <text x="1120" y="273" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">风险：最终一致</text>
    <rect x="1400" y="250" width="300" height="36" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
    <text x="1550" y="273" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">风险：事务成本</text>

    <!-- 阶段一：单体原型 -->
    <rect x="90" y="290" width="340" height="240" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="128" cy="350" r="18" fill="#94A3B8"/>
    <text x="128" y="356" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="160" y="360" font-size="22" font-weight="700" fill="#0F172A">单体原型</text>
    <line x1="110" y1="375" x2="410" y2="375" stroke="#E2E8F0"/>
    <circle cx="122" cy="405" r="4" fill="#94A3B8"/>
    <text x="136" y="411" font-size="15" fill="#475569">模块化包结构</text>
    <circle cx="122" cy="440" r="4" fill="#94A3B8"/>
    <text x="136" y="446" font-size="15" fill="#475569">快速验证业务闭环</text>
    <text x="260" y="560" font-size="14" fill="#64748B" text-anchor="middle">团队 &lt; 3 人</text>

    <!-- 阶段二：核心剥离 -->
    <rect x="520" y="290" width="340" height="240" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="558" cy="350" r="18" fill="#2563EB"/>
    <text x="558" y="356" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="590" y="360" font-size="22" font-weight="700" fill="#0F172A">核心剥离</text>
    <line x1="540" y1="375" x2="840" y2="375" stroke="#E2E8F0"/>
    <circle cx="552" cy="405" r="4" fill="#2563EB"/>
    <text x="566" y="411" font-size="15" fill="#475569">数据库隔离</text>
    <circle cx="552" cy="440" r="4" fill="#2563EB"/>
    <text x="566" y="446" font-size="15" fill="#475569">接口契约 · 容器化</text>
    <text x="690" y="560" font-size="14" fill="#64748B" text-anchor="middle">团队 3-5 人</text>

    <!-- 阶段三：事件驱动 -->
    <rect x="950" y="290" width="340" height="240" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <circle cx="988" cy="350" r="18" fill="#1D4ED8"/>
    <text x="988" y="356" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="1020" y="360" font-size="22" font-weight="700" fill="#0F172A">事件驱动</text>
    <line x1="970" y1="375" x2="1270" y2="375" stroke="#E2E8F0"/>
    <circle cx="982" cy="405" r="4" fill="#1D4ED8"/>
    <text x="996" y="411" font-size="15" fill="#475569">消息队列解耦</text>
    <circle cx="982" cy="440" r="4" fill="#1D4ED8"/>
    <text x="996" y="446" font-size="15" fill="#475569">消费端独立扩容</text>
    <text x="1120" y="560" font-size="14" fill="#64748B" text-anchor="middle">团队 5-8 人</text>

    <!-- 阶段四：持续演进（虚线） -->
    <rect x="1380" y="290" width="340" height="240" rx="10" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="8 4"/>
    <circle cx="1418" cy="350" r="18" fill="#1E40AF"/>
    <text x="1418" y="356" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="1450" y="360" font-size="22" font-weight="700" fill="#0F172A">持续演进</text>
    <line x1="1400" y1="375" x2="1700" y2="375" stroke="#E2E8F0"/>
    <circle cx="1412" cy="405" r="4" fill="#1E40AF"/>
    <text x="1426" y="411" font-size="15" fill="#475569">按领域拆分</text>
    <circle cx="1412" cy="440" r="4" fill="#1E40AF"/>
    <text x="1426" y="446" font-size="15" fill="#475569">独立部署 · 可回滚</text>
    <text x="1550" y="560" font-size="14" fill="#64748B" text-anchor="middle">团队 8-15 人</text>
    <text x="1550" y="475" font-size="13" fill="#1D4ED8" text-anchor="middle">无固定终点 · 持续调整</text>

    <!-- 图例 -->
    <rect x="60" y="720" width="22" height="14" rx="3" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
    <text x="90" y="732" font-size="14" fill="#475569">各阶段关键风险（浅红底）</text>
    <rect x="380" y="720" width="22" height="14" rx="3" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="410" y="732" font-size="14" fill="#475569">持续演进（虚线框 · 无终点）</text>
    <line x1="740" y1="727" x2="798" y2="727" stroke="#2563EB" stroke-width="3" marker-end="url(#ah-blue)"/>
    <text x="806" y="732" font-size="14" fill="#475569">演进动机（真实瓶颈触发）</text>
    <text x="260" y="790" font-size="13" fill="#64748B" text-anchor="middle">团队规模增长与协作摩擦驱动拆分；每前进一步都用新的分布式风险换取部署与分工收益。</text>

    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图6-4 微服务不是默认起点；拆分时机、验证周期和可回滚性比拆分数量更重要。</text>
  </svg>
</svg>
  </main>
</body>
</html>
