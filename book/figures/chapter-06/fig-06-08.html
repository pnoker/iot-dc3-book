<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图6-8 微服务可观测性分层架构</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图6-8 微服务可观测性分层架构</title>
  <desc id="desc">指标、日志与告警各走明确链路，Grafana 从两类存储查询展示。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <defs>
      <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
      <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
      <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F97316"/></marker>
      <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#DC2626"/></marker>
      <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
      <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    </defs>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图6-8 微服务可观测性分层架构</text>
    <text x="88" y="64" font-size="12" fill="#64748B">指标、日志与告警各走明确链路，Grafana 从两类存储查询展示。</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 列标题 -->
    <text x="350" y="170" font-size="26" font-weight="700" fill="#2563EB" text-anchor="middle">服务暴露层</text>
    <text x="890" y="170" font-size="26" font-weight="700" fill="#0F766E" text-anchor="middle">采集与存储层</text>
    <text x="1440" y="170" font-size="26" font-weight="700" fill="#7C3AED" text-anchor="middle">展示与告警层</text>

    <!-- ===== 连线（先画） ===== -->
    <line x1="1026" y1="265" x2="494" y2="265" stroke="#F97316" stroke-width="2" marker-end="url(#ah-orange)"/>
    <line x1="494" y1="525" x2="686" y2="515" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
    <line x1="860" y1="560" x2="860" y2="581" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
    <line x1="1030" y1="265" x2="1226" y2="265" stroke="#DC2626" stroke-width="2" marker-end="url(#ah-red)"/>
    <line x1="1400" y1="320" x2="1400" y2="466" stroke="#DC2626" stroke-width="2" marker-end="url(#ah-red)"/>
    <line x1="1230" y1="630" x2="1030" y2="265" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
    <line x1="1230" y1="630" x2="1030" y2="630" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>

    <!-- ===== 服务暴露层 ===== -->
    <rect x="150" y="210" width="340" height="110" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="172" y="252" font-size="16" font-weight="700" fill="#0F172A">微服务 / Driver</text>
    <text x="172" y="278" font-size="12" fill="#2563EB">/actuator/prometheus</text>
    <text x="172" y="298" font-size="12" fill="#475569">暴露指标端点</text>
    <rect x="150" y="470" width="340" height="110" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="172" y="512" font-size="16" font-weight="700" fill="#0F172A">日志服务</text>
    <text x="172" y="538" font-size="12" fill="#475569">结构化日志 · traceId</text>
    <text x="172" y="558" font-size="12" fill="#64748B">时间戳 · 租户 · 错误码</text>

    <!-- ===== 采集与存储层 ===== -->
    <rect x="690" y="210" width="340" height="110" rx="9" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="712" y="252" font-size="16" font-weight="700" fill="#0F172A">Prometheus</text>
    <text x="712" y="278" font-size="12" fill="#F97316">拉取指标 · 规则评估</text>
    <text x="712" y="298" font-size="12" fill="#475569">pull 模式</text>
    <rect x="690" y="470" width="340" height="90" rx="9" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <text x="712" y="510" font-size="16" font-weight="700" fill="#0F172A">日志采集器</text>
    <text x="712" y="534" font-size="12" fill="#0F766E">采集 · 解析</text>
    <rect x="690" y="585" width="340" height="90" rx="9" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <text x="712" y="625" font-size="16" font-weight="700" fill="#0F172A">Elasticsearch</text>
    <text x="712" y="649" font-size="12" fill="#0F766E">日志索引存储</text>

    <!-- ===== 展示与告警层 ===== -->
    <rect x="1230" y="210" width="340" height="110" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="1252" y="252" font-size="16" font-weight="700" fill="#0F172A">Alertmanager</text>
    <text x="1252" y="278" font-size="12" fill="#DC2626">分组 · 路由 · 抑制</text>
    <text x="1252" y="298" font-size="12" fill="#475569">接收 Prometheus 告警</text>
    <rect x="1230" y="470" width="340" height="90" rx="9" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="1252" y="510" font-size="16" font-weight="700" fill="#0F172A">钉钉 / 邮件 / 值班</text>
    <text x="1252" y="534" font-size="12" fill="#64748B">外部通知通道</text>
    <rect x="1230" y="585" width="340" height="90" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="1252" y="625" font-size="16" font-weight="700" fill="#0F172A">Grafana</text>
    <text x="1252" y="649" font-size="12" fill="#7C3AED">指标与日志查询</text>

    <!-- ===== 标签 ===== -->
    <text x="760" y="252" font-size="13" fill="#F97316" text-anchor="middle">Prometheus pull（拉取指标）</text>
    <text x="590" y="507" font-size="13" fill="#0F766E" text-anchor="middle">日志采集</text>
    <text x="872" y="575" font-size="13" fill="#0F766E">写入索引</text>
    <text x="1128" y="252" font-size="13" fill="#DC2626" text-anchor="middle">告警规则</text>
    <text x="1414" y="398" font-size="13" fill="#DC2626">通知路由</text>
    <text x="1115" y="440" font-size="13" fill="#64748B" text-anchor="middle">查询指标</text>
    <text x="1115" y="618" font-size="13" fill="#64748B" text-anchor="middle">查询日志</text>

    <!-- ===== 图例 ===== -->
    <line x1="60" y1="862" x2="118" y2="862" stroke="#F97316" stroke-width="2" marker-end="url(#ah-orange)"/>
    <text x="126" y="868" font-size="14" fill="#475569">指标拉取（pull）</text>
    <line x1="330" y1="862" x2="388" y2="862" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
    <text x="396" y="868" font-size="14" fill="#475569">日志链路</text>
    <line x1="540" y1="862" x2="598" y2="862" stroke="#DC2626" stroke-width="2" marker-end="url(#ah-red)"/>
    <text x="606" y="868" font-size="14" fill="#475569">告警与通知</text>
    <line x1="780" y1="862" x2="838" y2="862" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
    <text x="846" y="868" font-size="14" fill="#475569">Grafana 查询（虚线）</text>

    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图6-8 Prometheus 主动拉取指标并驱动告警；日志经采集器入 ES，Grafana 分别查询 Prometheus 与 ES。</text>
  </svg>
</svg>
  </main>
</body>
</html>
