type: architecture
title: 图6-6 IoT DC3 模块关系与数据流分层图
purpose: 展示 Gateway、四个中心、协议 Driver，以及默认 RabbitMQ 与 PostgreSQL/TimescaleDB 适配器的模块边界和通信方向。
audience_takeaway: 北向统一路由、Driver 与 Manager 的 gRPC 管理调用，以及 Data 与 Driver 之间的 RabbitMQ 异步命令和数据流。
visual_focus: Gateway→四中心、Driver→Manager、Data↔RabbitMQ↔Driver 三条主链路。
design_level: logical
layout: 自上而下四层：北向接入层、平台服务层、南向驱动层、基础设施层。
elements:
- 北向接入层：Web/第三方客户端与 dc3-gateway。
- 平台服务层：Auth、Manager、Data、Agentic 四个中心。
- 南向驱动层：MQTT Driver、Modbus Driver、OPC UA Driver 与现场设备。
- 基础设施层：默认 RabbitMQ、PostgreSQL/TimescaleDB 与 Caffeine。
relationships:
- 客户端→Gateway→四中心：同步 REST 路由与认证。
- Driver→Manager：同步 gRPC 业务注册和元数据查询。
- Data→RabbitMQ→Driver：异步点位读写与自定义命令。
- Driver→RabbitMQ→Data：异步回执、位号值、状态与事件。
- Auth/Manager/Agentic→PostgreSQL：业务数据；Data→TsdbStore：位号历史。
regions:
- id: north_domain
  label: 北向接入域
  role: 统一入口与安全边界
- id: platform_domain
  label: 平台服务域
  role: Auth、Manager、Data、Agentic
- id: south_domain
  label: 南向适配域
  role: 协议接入与设备通信
- id: infrastructure_domain
  label: 基础设施域
  role: 消息、存储与本地缓存
