callouts:
- 当前中心服务是 Auth、Manager、Data、Agentic，不存在独立 Command Service。
- RabbitMQ 是默认消息适配器；其他 Broker 由 DC3_MQ_TYPE 选择并需单独验证能力。
- 服务寻址使用固定服务名、容器 DNS 与环境变量，不包含 Nacos。
legend:
- 实线表示同步 REST/gRPC；虚线表示 RabbitMQ 异步消息。
- 蓝色表示平台服务；绿色表示 Driver；紫色表示消息；灰色表示存储。
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts。
- 图例放在底部，不遮挡主体结构。
render_notes: HTML/SVG 渲染，浅色背景，四层水平带；RabbitMQ 位于 Data 与 Driver 之间并作为默认消息适配器突出显示。
caption:
  zh: 图6-6 IoT DC3 模块关系与数据流：北向请求经 Gateway 进入四中心，Driver 经 gRPC 对接 Manager，命令与数据经 RabbitMQ 在 Data 和 Driver 之间异步流转。
  en: 'Figure 6-6 IoT DC3 module relationships and data flows: northbound requests enter the four centers through the Gateway, Drivers connect to Manager over gRPC, and commands and data flow asynchronously between Data and Drivers via RabbitMQ.'
