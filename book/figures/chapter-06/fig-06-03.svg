  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图6-3 展示智能楼宇系统中，南向设备通过边缘节点驱动接入，微服务层按领域拆分且各自持有独立数据存储，以及数据流与控制流分离的设计（示意）。</text>
