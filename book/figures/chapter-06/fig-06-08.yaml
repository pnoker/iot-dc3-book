type: layered
title: 图6-8 微服务可观测性分层架构
audience_takeaway: 可观测性中服务主动暴露端点、Prometheus以pull模式拉取指标、日志与指标分通道存储(ES/Prometheus)，健康状态并入业务指标统一告警。
purpose: 展示指标、日志、告警与可视化查询的完整可观测链路。
visual_focus: Prometheus拉取服务指标、日志经采集器进入ES、Prometheus发送告警到Alertmanager，以及Grafana查询两类存储。
design_level: logical
layout: 从左至右三层：服务暴露层、采集与存储层、展示与告警层。
elements:
- 服务暴露层：微服务和Driver暴露指标端点，日志服务输出结构化日志。
- 采集与存储层：Prometheus拉取指标，日志采集器将日志写入Elasticsearch。
- 展示与告警层：Grafana查询Prometheus和Elasticsearch，Alertmanager接收Prometheus告警并通知外部通道。
relationships:
- Prometheus → 微服务与Driver：定期pull metrics
- 日志服务 → 日志采集器 → Elasticsearch：采集、解析并建立日志索引
- Prometheus → Alertmanager → 外部通知通道：规则告警与通知路由
- Grafana → Prometheus：查询指标
- Grafana → Elasticsearch：查询日志
regions:
- id: governance_domain
  label: 治理与安全域
  role: 风险控制与责任边界
- id: data_domain
  label: 数据资产域
  role: 数据沉淀与治理边界
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
components:
- id: c1
  label: 展示与告警层
  type: security
  subtitle: Grafana 可视化，Alertmanager 通知钉钉/邮件/PagerDuty
  group: governance_domain
  priority: primary
  shape: card
- id: c2
  label: 采集与存储层
  type: data
  subtitle: Prometheus pull 指标，日志经采集器写入 Elasticsearch
  group: data_domain
  priority: normal
  shape: database
- id: c3
  label: 服务暴露层
  type: platform
  subtitle: 每个微服务/Driver 暴露指标端点并输出结构化日志
  group: platform_domain
  priority: normal
  shape: card
connections:
- from: c1
  to: c2
  label: 查询指标与日志
  style: solid
  direction: left-to-right
- from: c2
  to: c3
  label: 告警规则触发通知
  style: solid
  direction: left-to-right
callouts:
- Service A 和 Service B 的 metrics 被 Prometheus 定期拉取
- Prometheus 将聚合后的数据供给 Grafana 展示
- Alertmanager 根据 Prometheus 告警规则发送通知到外部通道
legend:
- 红色下层：微服务组件（指标提供方）
- 绿色中间层：基础设施（采集与存储）
- 灰色上层：终端展示（仪表盘与告警）
visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
render_notes: 三列分层绘制；Prometheus到服务的pull箭头必须指向服务，日志链路必须经过采集器，Grafana分别连接Prometheus与Elasticsearch，Prometheus连接Alertmanager。
caption:
  zh: 图6-8 Prometheus主动拉取服务指标并将告警发送给Alertmanager；日志经采集器进入Elasticsearch，Grafana分别查询Prometheus和Elasticsearch。
  en: 'Figure 6-8 Prometheus actively pulls service metrics and sends alerts to Alertmanager; logs flow through a collector into Elasticsearch, and Grafana queries Prometheus and Elasticsearch separately.'
