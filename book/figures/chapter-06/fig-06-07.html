  <title id="title">图6-7 IoT DC3 服务间通信架构图</title>
  <desc id="desc">Gateway 与 gRPC 负责管理和元数据调用；点位命令、自定义命令、执行回执、位号值和状态事件统一经 RabbitMQ 流转。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="71.671" width="1152.000" height="616.659" viewBox="0 0 1700.000 910.000" preserveAspectRatio="xMidYMid meet">
<rect x="0" y="0" width="1700" height="910" fill="#FFFFFF"/>
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>

    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- ========== 标题区 ========== -->
  <circle cx="64" cy="42" r="6" fill="#2563EB"/>
  <text x="86" y="49" font-size="22" font-weight="700" fill="#0F172A">图6-7 IoT DC3 服务间通信架构图</text>
  <text x="86" y="72" font-size="12" fill="#64748B">同步管理调用与异步设备消息分离 — REST / gRPC 管理链路 · RabbitMQ 命令、数据与回执</text>
  <rect x="1490" y="30" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1570" y="50" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">ARCHITECTURE</text>

  <text x="240" y="323" font-size="9" font-weight="600" fill="#E11D48" text-anchor="middle">■ 接入层 Gateway</text>

  <text x="700" y="293" font-size="9" fill="#94A3B8" text-anchor="middle">REST / gRPC · 请求内返回</text>
  <text x="700" y="323" font-size="9" font-weight="600" fill="#E11D48" text-anchor="middle">■ 服务层 Center</text>

  <text x="1160" y="209" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">PostgreSQL</text>
  <text x="1160" y="231" font-size="11" fill="#475569" text-anchor="middle">Platform Persistence</text>
  <line x1="1045" y1="247" x2="1275" y2="247" stroke="#F1F5F9"/>

  <text x="1160" y="293" font-size="9" fill="#94A3B8" text-anchor="middle">JDBC / MyBatis 持久化</text>
  <text x="1160" y="323" font-size="9" font-weight="600" fill="#10B981" text-anchor="middle">■ 持久化 Data</text>

  <text x="1362" y="262" font-size="15" font-weight="700" fill="#0F172A">管理请求同步返回</text>
  <text x="1362" y="288" font-size="11" fill="#475569">不等同设备命令已执行</text>

  <line x1="384" y1="252" x2="554" y2="252" stroke="#E11D48" stroke-width="2.5" marker-end="url(#ah-red)"/>

  <text x="929" y="243" font-size="11" font-weight="700" fill="#E11D48" text-anchor="middle">JDBC / MyBatis</text>
  <line x1="1014" y1="278" x2="844" y2="278" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="929" y="295" font-size="9" fill="#64748B" text-anchor="middle">查询结果</text>

  <text x="240" y="528" font-size="11" fill="#475569" text-anchor="middle">Southbound Driver</text>
  <line x1="125" y1="544" x2="355" y2="544" stroke="#F1F5F9"/>
  <text x="240" y="568" font-size="10" fill="#64748B" text-anchor="middle">消费命令 · 上报值 / 状态 / 回执</text>
  <text x="240" y="590" font-size="9" fill="#94A3B8" text-anchor="middle">设备侧异步收发</text>
  <text x="240" y="620" font-size="9" font-weight="600" fill="#10B981" text-anchor="middle">■ 驱动层 Edge</text>

  <!-- Card2: RabbitMQ（设备消息面） -->
  <rect x="560" y="472" width="280" height="164" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="700" y="506" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">RabbitMQ</text>
  <text x="700" y="528" font-size="11" fill="#475569" text-anchor="middle">设备消息总线</text>
  <line x1="585" y1="544" x2="815" y2="544" stroke="#F1F5F9"/>
  <text x="700" y="568" font-size="10" fill="#64748B" text-anchor="middle">命令 · 位号值 · 状态 · 回执</text>
  <text x="700" y="590" font-size="9" fill="#94A3B8" text-anchor="middle">路由 · 缓冲 · 可靠投递</text>
  <text x="700" y="620" font-size="9" font-weight="600" fill="#2563EB" text-anchor="middle">■ 消息总线 Broker</text>

  <rect x="1020" y="472" width="280" height="164" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1160" y="506" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Data Center</text>
  <text x="1160" y="528" font-size="11" fill="#475569" text-anchor="middle">Point Value / Command</text>
  <line x1="1045" y1="544" x2="1275" y2="544" stroke="#F1F5F9"/>
  <text x="1160" y="568" font-size="10" fill="#64748B" text-anchor="middle">发布命令 · 消费数据与回执</text>
  <text x="1160" y="590" font-size="9" fill="#94A3B8" text-anchor="middle">Caffeine 最新值 · PostgreSQL 历史</text>
  <text x="1160" y="620" font-size="9" font-weight="600" fill="#7C3AED" text-anchor="middle">■ 数据域 Data</text>

  <!-- 数据面 outcome -->
  <rect x="1340" y="502" width="270" height="104" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1362" y="529" font-size="9" font-weight="700" fill="#2563EB" letter-spacing="1.5">OUTCOME</text>
  <text x="1362" y="559" font-size="15" font-weight="700" fill="#0F172A">命令与数据异步解耦</text>
  <text x="1362" y="585" font-size="11" fill="#475569">执行结果以回执 / 查询确认</text>

  <line x1="384" y1="554" x2="554" y2="554" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="469" y="545" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">数据 / 回执 →</text>
  <text x="469" y="573" font-size="9" fill="#64748B" text-anchor="middle">异步上行</text>

  <line x1="844" y1="554" x2="1014" y2="554" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="929" y="545" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">路由至 Data →</text>
  <text x="929" y="573" font-size="9" fill="#64748B" text-anchor="middle">消费数据 / 回执</text>

  <line x1="1014" y1="605" x2="844" y2="605" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ah-purple)"/>
  <text x="929" y="623" font-size="9" fill="#7C3AED" text-anchor="middle">← 发布位号命令</text>
  <line x1="554" y1="605" x2="384" y2="605" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ah-purple)"/>
  <text x="469" y="623" font-size="9" fill="#7C3AED" text-anchor="middle">← Driver 消费命令</text>

  <!-- ========== 隔离价值 callout ========== -->
  <rect x="120" y="722" width="1460" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="150" cy="754" r="6" fill="#2563EB"/>
  <text x="174" y="749" font-size="13" font-weight="700" fill="#0F172A">同步管理面与异步设备面</text>
  <text x="174" y="772" font-size="11" fill="#334155">REST / gRPC 处理鉴权、元数据与查询；设备命令、位号值、状态和回执统一经 RabbitMQ 异步传递，管理请求返回不代表设备动作已完成。</text>

  <rect x="80" y="830" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="104" y="840" font-size="11" fill="#475569">管理面 · 同步调用</text>
  <rect x="270" y="830" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>

  <rect x="478" y="830" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="502" y="840" font-size="11" fill="#475569">边缘 / 驱动 Edge</text>
  <rect x="650" y="830" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="674" y="840" font-size="11" fill="#475569">Data / PostgreSQL</text>
  <line x1="850" y1="836" x2="876" y2="836" stroke="#E11D48" stroke-width="2.5" marker-end="url(#ah-red)"/>
  <text x="884" y="840" font-size="11" fill="#475569">同步管理调用</text>
  <line x1="1080" y1="836" x2="1106" y2="836" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1114" y="840" font-size="11" fill="#475569">查询响应</text>
  <rect x="1230" y="830" width="18" height="12" rx="2" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="1254" y="840" font-size="11" fill="#475569">同步 / 异步责任边界</text>

  <!-- ========== Caption ========== -->
  <text x="850" y="882" font-size="10" fill="#94A3B8" text-anchor="middle">图6-4  管理链路通过 REST / gRPC 同步返回；设备命令、位号值、状态与回执通过 RabbitMQ 双向异步传递，调用返回与设备执行结果明确分离。</text>
