<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图6-2 物联网平台协议分层架构</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图6-2 物联网平台协议分层架构</title>
  <desc id="desc">读者应理解设备、平台、北向三个层次的责任边界，以及各层次应选择的“最佳”协议。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">

  
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图6-2 物联网平台协议分层架构</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解设备、平台、北向三个层次的责任边界，以及各层次应选择的“最佳”协议。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
  <!-- 区域边界框 -->
  <!-- 设备与边缘域 -->
  <rect x="465" y="545" width="990" height="230" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="8,4" rx="10"/>
  <text x="475" y="565" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="14" fill="#D97706" font-weight="600">设备与边缘域</text>
  
  <!-- 数据资产域 -->
  <rect x="520" y="385" width="280" height="140" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="8,4" rx="10"/>
  <text x="530" y="405" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="14" fill="#D97706" font-weight="600">数据资产域</text>
  
  <!-- 平台服务域 -->
  <rect x="800" y="385" width="610" height="140" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="8,4" rx="10"/>
  <text x="810" y="405" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="14" fill="#D97706" font-weight="600">平台服务域</text>

  <!-- 连线（先于节点绘制，避免箭头被遮） -->
  <!-- 设备层→网关层（实线） -->
  <line x1="960" y1="760" x2="960" y2="640" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="975" y="690" width="140" height="22" fill="white" rx="4"/>
  <text x="985" y="706" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#2563EB">设备数据上报 (MQTT)</text>
  
  <!-- 网关层→MQTT节点（实线） -->
  <path d="M 845 560 L 845 530 L 670 530 L 670 500" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="780" y="520" width="130" height="22" fill="white" rx="4"/>
  <text x="790" y="536" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#2563EB">持续数据流 (MQTT)</text>
  
  <!-- MQTT节点→gRPC节点（实线） -->
  <line x1="795" y1="450" x2="835" y2="450" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="800" y="430" width="30" height="22" fill="white" rx="4"/>
  <text x="805" y="446" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#2563EB">gRPC</text>
  
  <!-- gRPC节点→REST节点（实线） -->
  <line x1="1085" y1="450" x2="1125" y2="450" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1090" y="430" width="30" height="22" fill="white" rx="4"/>
  <text x="1095" y="446" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#2563EB">REST</text>
  
  <!-- REST节点→北向应用层（实线） -->
  <path d="M 1250 400 L 1250 360 L 1050 360 L 1050 320" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="1060" y="350" width="90" height="22" fill="white" rx="4"/>
  <text x="1070" y="366" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#2563EB">RESTful API</text>
  
  <!-- gRPC节点→北向应用层（虚线） -->
  <line x1="960" y1="400" x2="960" y2="320" stroke="#64748B" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="870" y="350" width="80" height="22" fill="white" rx="4"/>
  <text x="880" y="366" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#64748B">gRPC-Web</text>
  
  <!-- 网关层→REST节点（虚线） -->
  <path d="M 1075 560 L 1075 530 L 1250 530 L 1250 500" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <rect x="1050" y="520" width="100" height="22" fill="white" rx="4"/>
  <text x="1060" y="536" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#64748B">配置更新 (REST)</text>

  <!-- 节点 -->
  <!-- 设备层节点 -->
  <rect x="485" y="680" width="950" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="960" y="716" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">设备层</text>
  <text x="960" y="740" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="13" fill="#64748B" text-anchor="middle">传感器、PLC、执行器</text>
  
  <!-- 网关/边缘层节点 -->
  <rect x="485" y="560" width="950" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
  <text x="960" y="596" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">网关/边缘层</text>
  <text x="960" y="620" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="13" fill="#64748B" text-anchor="middle">MQTT Broker、协议适配</text>
  
  <!-- MQTT节点 -->
  <rect x="545" y="400" width="250" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="670" y="450" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">MQTT</text>
  <text x="670" y="472" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle">发布/订阅、持续数据流</text>
  
  <!-- gRPC节点 -->
  <rect x="835" y="400" width="250" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="960" y="450" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">gRPC</text>
  <text x="960" y="472" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle">服务间同步调用</text>
  
  <!-- REST节点 -->
  <rect x="1125" y="400" width="250" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="1250" y="450" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">REST</text>
  <text x="1250" y="472" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle">北向API</text>
  
  <!-- 北向应用层节点 -->
  <rect x="485" y="230" width="950" height="90" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="960" y="275" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle">北向应用层</text>
  <text x="960" y="298" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Web前端、移动App、第三方系统</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色=核心通信路径；青色=设备与边缘节点</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头=主要通信链路；虚线箭头=辅助或可选的通信路径</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图6-1 展示MQTT、REST、gRPC在物联网平台各层次中的部署位置与交互关系。</text>
  </svg>
</svg>
    <section class="meta" style="display:none">
      <div class="card"><div class="label">图表类型</div><div class="value">architecture</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">自下而上四层：设备层、网关/边缘层、平台服务层、北向应用层。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
