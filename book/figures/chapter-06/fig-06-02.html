<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图6-2 物联网平台协议分层架构</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图6-2 物联网平台协议分层架构</title>
  <desc id="desc">MQTT 服务南向设备，gRPC 服务内部调用，REST 服务北向开放。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <defs>
      <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
      <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
      <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
      <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    </defs>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图6-2 物联网平台协议分层架构</text>
    <text x="88" y="64" font-size="12" fill="#64748B">MQTT 服务南向设备，gRPC 服务内部调用，REST 服务北向开放。</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 层间协议箭头（先画） -->
    <line x1="400" y1="720" x2="400" y2="680" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
    <line x1="400" y1="510" x2="400" y2="490" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
    <line x1="940" y1="510" x2="940" y2="490" stroke="#64748B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
    <line x1="400" y1="310" x2="400" y2="290" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <line x1="940" y1="310" x2="940" y2="290" stroke="#64748B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>

    <!-- 设备层（青绿） -->
    <rect x="120" y="740" width="1560" height="120" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <circle cx="150" cy="774" r="6" fill="#0F766E"/>
    <text x="168" y="782" font-size="20" font-weight="700" fill="#0F766E">设备层</text>
    <rect x="340" y="790" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="356" y="816" font-size="15" font-weight="700" fill="#0F172A">传感器</text>
    <text x="356" y="835" font-size="12" fill="#64748B">运行 MQTT 客户端</text>
    <rect x="610" y="790" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="626" y="816" font-size="15" font-weight="700" fill="#0F172A">PLC</text>
    <text x="626" y="835" font-size="12" fill="#64748B">运行 MQTT 客户端</text>
    <rect x="880" y="790" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="896" y="816" font-size="15" font-weight="700" fill="#0F172A">执行器</text>
    <text x="896" y="835" font-size="12" fill="#64748B">运行 MQTT 客户端</text>

    <!-- 网关/边缘层（青绿） -->
    <rect x="120" y="540" width="1560" height="120" rx="10" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <circle cx="150" cy="574" r="6" fill="#0F766E"/>
    <text x="168" y="582" font-size="20" font-weight="700" fill="#0F766E">网关 / 边缘层</text>
    <rect x="340" y="590" width="260" height="56" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
    <text x="356" y="616" font-size="15" font-weight="700" fill="#0F172A">MQTT Broker</text>
    <text x="356" y="635" font-size="12" fill="#0F766E">离线缓存 · 订阅分发</text>
    <rect x="660" y="590" width="260" height="56" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
    <text x="676" y="616" font-size="15" font-weight="700" fill="#0F172A">协议适配模块</text>
    <text x="676" y="635" font-size="12" fill="#0F766E">Modbus / OPC UA 等</text>

    <!-- 平台服务层（蓝） -->
    <rect x="120" y="340" width="1560" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="150" cy="374" r="6" fill="#2563EB"/>
    <text x="168" y="382" font-size="20" font-weight="700" fill="#2563EB">平台服务层</text>
    <rect x="340" y="390" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="356" y="416" font-size="15" font-weight="700" fill="#0F172A">设备管理</text>
    <text x="356" y="435" font-size="12" fill="#2563EB">gRPC 服务</text>
    <rect x="610" y="390" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="626" y="416" font-size="15" font-weight="700" fill="#0F172A">数据存储</text>
    <text x="626" y="435" font-size="12" fill="#2563EB">gRPC 服务</text>
    <rect x="880" y="390" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="896" y="416" font-size="15" font-weight="700" fill="#0F172A">规则引擎</text>
    <text x="896" y="435" font-size="12" fill="#2563EB">gRPC 服务</text>
    <text x="1180" y="414" font-size="14" fill="#475569">服务间：gRPC 同步 + 消息队列异步</text>

    <!-- 北向应用层（紫） -->
    <rect x="120" y="140" width="1560" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="150" cy="174" r="6" fill="#7C3AED"/>
    <text x="168" y="182" font-size="20" font-weight="700" fill="#7C3AED">北向应用层</text>
    <rect x="340" y="190" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
    <text x="356" y="216" font-size="15" font-weight="700" fill="#0F172A">Web 前端</text>
    <text x="356" y="235" font-size="12" fill="#7C3AED">REST</text>
    <rect x="610" y="190" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
    <text x="626" y="216" font-size="15" font-weight="700" fill="#0F172A">移动 App</text>
    <text x="626" y="235" font-size="12" fill="#7C3AED">REST</text>
    <rect x="880" y="190" width="240" height="56" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
    <text x="896" y="216" font-size="15" font-weight="700" fill="#0F172A">第三方系统</text>
    <text x="896" y="235" font-size="12" fill="#7C3AED">REST</text>

    <!-- 层间协议标签 -->
    <text x="412" y="702" font-size="15" fill="#0F766E">MQTT 发布/订阅</text>
    <text x="412" y="503" font-size="15" fill="#0F766E">MQTT 持续数据流</text>
    <text x="952" y="503" font-size="15" fill="#64748B">REST 状态注册</text>
    <text x="412" y="303" font-size="15" fill="#2563EB">REST 北向 API</text>
    <text x="952" y="303" font-size="15" fill="#64748B">gRPC-Web 辅助</text>

    <!-- 图例 -->
    <line x1="60" y1="890" x2="118" y2="890" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
    <text x="126" y="895" font-size="14" fill="#475569">MQTT（设备/边缘）</text>
    <line x1="360" y1="890" x2="418" y2="890" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <text x="426" y="895" font-size="14" fill="#475569">REST（北向）</text>
    <line x1="590" y1="890" x2="648" y2="890" stroke="#64748B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
    <text x="656" y="895" font-size="14" fill="#475569">辅助 / 可选路径</text>
    <rect x="830" y="881" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="852" y="895" font-size="14" fill="#475569">平台服务（gRPC 内部）</text>

    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图6-2 协议按层次互补，不以单一协议强行覆盖设备、服务与外部系统。</text>
  </svg>
</svg>
  </main>
</body>
</html>
