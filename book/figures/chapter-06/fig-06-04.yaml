type: lifecycle
title: 图6-4 单体到微服务演进阶段图
audience_takeaway: 微服务演进由团队规模与协作摩擦驱动，每前进一步都要用新架构问题(单点故障、数据一致性、分布式事务成本)换取部署与分工的收益。
purpose: 展示物联网项目从单体原型到多服务演进的典型路径，标注各阶段关键特征与风险。
visual_focus: 从阶段一（单体原型）到阶段四（持续演进）的时间轴主链路。
design_level: implementation
layout: 四个阶段节点沿水平时间轴从左至右排列，节点下方标注关键里程碑，左侧标注时间线示意。
elements:
- 阶段一：单体原型，矩形，标签 '模块化包结构、快速验证'；下方注 '团队 <3人'；顶部风险 '部署效率低'。
- 阶段二：核心模块剥离，梯形，标签 '数据库隔离、接口契约、容器化'；下方注 '团队3-5人'；顶部风险 '单点故障'。
- 阶段三：事件驱动改造，圆角矩形，标签 'MQTT Broker -> 消息队列 -> 消费端扩容'；下方注 '团队5-8人'；顶部风险 '数据一致性'。
- 阶段四：持续演进，虚线矩形，标签 '按场景拆分、聚合服务整合'；下方注 '团队8-15人'；顶部风险 '分布式事务成本'。
relationships:
- 阶段节点间用粗箭头连接，箭头上方标注演进动机：第一支箭 '单一变更影响全局'，中间箭 '功能耦合加剧'，右侧箭 '团队分工需求'。
regions:
- id: platform_domain
  label: 平台服务域
  role: 核心服务能力边界
components:
- id: stage1
  label: 阶段一：单体原型
  type: platform
  subtitle: 模块化包结构、快速验证；团队 <3 人；风险：部署效率低
  group: platform_domain
  priority: primary
  shape: card
- id: stage2
  label: 阶段二：核心模块剥离
  type: platform
  subtitle: 数据库隔离、接口契约、容器化；团队 3-5 人；风险：单点故障
  group: platform_domain
  priority: normal
  shape: card
- id: stage3
  label: 阶段三：事件驱动改造
  type: platform
  subtitle: MQTT Broker → 消息队列 → 消费端扩容；团队 5-8 人；风险：数据一致性
  group: platform_domain
  priority: normal
  shape: card
- id: stage4
  label: 阶段四：持续演进
  type: platform
  subtitle: 按场景拆分、聚合服务整合；团队 8-15 人；风险：分布式事务成本
  group: platform_domain
  priority: normal
  shape: card
