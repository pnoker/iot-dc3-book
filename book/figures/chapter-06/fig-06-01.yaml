visual_constraints:
- 节点标签使用短名词短语，解释性文字放入 callouts 或正文。
- 图例放在底部，不遮挡主体结构。
- 优先表达边界和主链路，不把所有概念塞进一张图。
render_notes: 整体采用横向泳道布局：左侧外部实体（椭圆形状），中间API端点列（圆角矩形，根据HTTP方法着色：GET绿色，POST蓝色，PUT橙色，DELETE红色），右侧内部服务（虚线圆角矩形）。数据流从左向右流动。端点按功能分组：设备上报数据用POST，指令下发用POST（但语义不同，路径不同），数据查询用GET，告警规则按标准CRUD。所有端点统一前缀/api/v1。图中省略了鉴权和错误处理细节，这些由Spring Security和全局异常处理器实现。本图为示意性设计，非具体项目截图。
caption:
  zh: 图6-1 外部实体（设备、前端、第三方）经统一的 /api/v1 前缀访问资源型端点：数据上报与指令下发走写路径并进入接入层校验、去重与队列，历史查询走读路径并按时间窗参数化。
  en: 'Figure 6-1 An illustrative example of REST API endpoint design for an IoT platform.'
labels:
  en:
    图6-1 物联网 REST API 端点设计示例（示意）: Figure 6-1 IoT REST API Endpoint Design (Illustrative)
    统一版本前缀下，设备写路径与历史读路径按资源语义分离。: Under one version prefix, device write and history read paths split by resource semantics.
    调用方: Callers
    统一 /api/v1 资源端点: Unified /api/v1 Resource Endpoints
    内部服务: Internal Services
    设备: Device
    上报 / 指令: Report / Command
    前端用户: Frontend User
    查询设备与历史: Query Devices & History
    第三方系统: Third-Party System
    规则与告警: Rules & Alarms
    写路径：校验 · 去重 · 入队: 'Write path: validate · dedupe · enqueue'
    202 Accepted · 异步下发: 202 Accepted · Async Dispatch
    规则创建与活动告警查询: Rule Creation & Active Alarms
    接入层: Access Layer
    认证 · 校验 · 去重 · 队列: Auth · Validate · Dedupe · Queue
    控制层: Control Layer
    指令队列与回执: Command Queue & Receipts
    查询层: Query Layer
    时间窗与分页: Time Window & Paging
    历史数据按时间窗参数化: History Parameterized by Time Window
    活动告警实时查询: Real-Time Active Alarms
    上报数据: Report Data
    下发命令: Send Command
    历史查询: History Query
    规则 / 告警: Rules / Alarms
    写入: Write
    下发: Dispatch
    查询: Query
    路由: Route
    写路径 / 指令（POST）: 'Write path / commands (POST)'
    读路径 / 查询（GET）: 'Read path / queries (GET)'
    图6-1 上报、命令和查询端点共享版本契约，但分别进入接入、控制与查询服务。: 'Figure 6-1 Report, command, and query endpoints share one versioned contract but enter the access, control, and query services separately.'
