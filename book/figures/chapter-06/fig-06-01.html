<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图6-1 物联网 REST API 端点设计示例（示意）</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图6-1 物联网 REST API 端点设计示例（示意）</title>
  <desc id="desc">统一版本前缀下，设备写路径与历史读路径按资源语义分离。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>
    <defs>
      <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
      <marker id="ah-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0F766E"/></marker>
      <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F97316"/></marker>
      <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
      <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    </defs>
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图6-1 物联网 REST API 端点设计示例（示意）</text>
    <text x="88" y="64" font-size="12" fill="#64748B">统一版本前缀下，设备写路径与历史读路径按资源语义分离。</text>
    <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

    <!-- 三个泳道（背景） -->
    <rect x="40" y="130" width="360" height="690" rx="10" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="455" y="130" width="675" height="690" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="1185" y="130" width="575" height="690" rx="10" fill="#F0FDF4" stroke="#CBD5E1" stroke-width="2"/>
    <text x="220" y="172" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">调用方</text>
    <text x="792" y="172" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">统一 /api/v1 资源端点</text>
    <text x="1472" y="172" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">内部服务</text>

    <!-- 连线（先画） -->
    <line x1="370" y1="250" x2="480" y2="260" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <line x1="370" y1="295" x2="480" y2="415" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <line x1="370" y1="415" x2="480" y2="570" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
    <line x1="370" y1="570" x2="480" y2="725" stroke="#F97316" stroke-width="2" marker-end="url(#ah-orange)"/>
    <line x1="1105" y1="260" x2="1210" y2="260" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <line x1="1105" y1="415" x2="1210" y2="415" stroke="#F97316" stroke-width="2" marker-end="url(#ah-orange)"/>
    <line x1="1105" y1="570" x2="1210" y2="570" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
    <line x1="1105" y1="725" x2="1210" y2="650" stroke="#F97316" stroke-width="2" marker-end="url(#ah-orange)"/>

    <!-- 左侧调用方卡片 -->
    <rect x="70" y="195" width="300" height="130" rx="9" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <text x="95" y="247" font-size="23" font-weight="700" fill="#0F172A">设备</text>
    <text x="95" y="286" font-size="16" fill="#0F766E">上报 / 指令</text>
    <rect x="70" y="350" width="300" height="130" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="95" y="402" font-size="23" font-weight="700" fill="#0F172A">前端用户</text>
    <text x="95" y="441" font-size="16" fill="#2563EB">查询设备与历史</text>
    <rect x="70" y="505" width="300" height="130" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="95" y="557" font-size="23" font-weight="700" fill="#0F172A">第三方系统</text>
    <text x="95" y="596" font-size="16" fill="#7C3AED">规则与告警</text>

    <!-- 中间 API 端点卡片 -->
    <rect x="480" y="195" width="625" height="130" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="502" y="246" font-size="21" font-weight="700" fill="#0F172A">POST /devices/{id}/data</text>
    <text x="502" y="285" font-size="15" fill="#2563EB">写路径：校验 · 去重 · 入队</text>
    <rect x="480" y="350" width="625" height="130" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="502" y="401" font-size="21" font-weight="700" fill="#0F172A">POST /devices/{id}/command</text>
    <text x="502" y="440" font-size="15" fill="#2563EB">202 Accepted · 异步下发</text>
    <rect x="480" y="505" width="625" height="130" rx="9" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <text x="502" y="556" font-size="21" font-weight="700" fill="#0F172A">GET /devices/{id}/points/{pid}/history</text>
    <text x="502" y="595" font-size="15" fill="#0F766E">startTime · endTime · page · size</text>
    <rect x="480" y="660" width="625" height="130" rx="9" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="502" y="711" font-size="21" font-weight="700" fill="#0F172A">POST /alarms/rules · GET /alarms/active</text>
    <text x="502" y="750" font-size="15" fill="#F97316">规则创建与活动告警查询</text>

    <!-- 右侧内部服务卡片 -->
    <rect x="1210" y="195" width="525" height="130" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="1235" y="247" font-size="23" font-weight="700" fill="#0F172A">接入层</text>
    <text x="1235" y="286" font-size="16" fill="#2563EB">认证 · 校验 · 去重 · 队列</text>
    <rect x="1210" y="350" width="525" height="130" rx="9" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
    <text x="1235" y="402" font-size="23" font-weight="700" fill="#0F172A">控制层</text>
    <text x="1235" y="441" font-size="16" fill="#F97316">指令队列与回执</text>
    <rect x="1210" y="505" width="525" height="285" rx="9" fill="#F0FDF4" stroke="#0F766E" stroke-width="2"/>
    <text x="1235" y="557" font-size="23" font-weight="700" fill="#0F172A">查询层</text>
    <text x="1235" y="596" font-size="16" fill="#0F766E">时间窗与分页</text>
    <circle cx="1241" cy="648" r="4" fill="#0F766E"/>
    <text x="1256" y="654" font-size="15" fill="#475569">历史数据按时间窗参数化</text>
    <circle cx="1241" cy="688" r="4" fill="#0F766E"/>
    <text x="1256" y="694" font-size="15" fill="#475569">活动告警实时查询</text>

    <!-- 连线标签（后画） -->
    <text x="425" y="240" font-size="15" fill="#475569" text-anchor="middle">上报数据</text>
    <text x="425" y="345" font-size="15" fill="#475569" text-anchor="middle">下发命令</text>
    <text x="425" y="488" font-size="15" fill="#475569" text-anchor="middle">历史查询</text>
    <text x="425" y="648" font-size="15" fill="#475569" text-anchor="middle">规则 / 告警</text>
    <text x="1157" y="250" font-size="15" fill="#475569" text-anchor="middle">写入</text>
    <text x="1157" y="405" font-size="15" fill="#475569" text-anchor="middle">下发</text>
    <text x="1157" y="560" font-size="15" fill="#475569" text-anchor="middle">查询</text>
    <text x="1157" y="700" font-size="15" fill="#475569" text-anchor="middle">路由</text>

    <!-- 图例 -->
    <line x1="60" y1="850" x2="118" y2="850" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <text x="126" y="855" font-size="15" fill="#475569">写路径 / 指令（POST）</text>
    <line x1="330" y1="850" x2="388" y2="850" stroke="#0F766E" stroke-width="2" marker-end="url(#ah-teal)"/>
    <text x="396" y="855" font-size="15" fill="#475569">读路径 / 查询（GET）</text>
    <line x1="600" y1="850" x2="658" y2="850" stroke="#F97316" stroke-width="2" marker-end="url(#ah-orange)"/>
    <text x="666" y="855" font-size="15" fill="#475569">规则与告警</text>

    <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图6-1 上报、命令和查询端点共享版本契约，但分别进入接入、控制与查询服务。</text>
  </svg>
</svg>
  </main>
</body>
</html>
