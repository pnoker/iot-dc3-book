    边缘计算层 · 按规模选择 k3s / 轻量容器: Edge tier · k3s / lightweight containers by scale
    边缘节点 1 · k3s: Edge Node 1 · k3s
    边缘网关 Pod: Edge Gateway Pod
    协议适配 Pod: Protocol Adapter Pod
    本地缓冲/规则: Local Buffer / Rules
    边缘节点 2 · k3s: Edge Node 2 · k3s
    边缘节点 3 · k3s: Edge Node 3 · k3s
    端设备层: End Device Layer
    传感器: Sensors
    无线 Zigbee / LoRa: Wireless Zigbee / LoRa
    现场总线 Modbus RTU / CAN: Fieldbus Modbus RTU / CAN
    执行器: Actuators
    现场总线 · 无线控制: Fieldbus · Wireless Control
    数据 / 状态上行: Data / Status Uplink
    配置 / 模型下发: Config / Model Delivery
    本地采集: Local Acquisition
    确定性控制: Deterministic Control
    实时采集 / 控制回路 · 不经云端: Real-time control loop · not via cloud
    云端中心（K8s）: 'Cloud core (K8s)'
    边缘计算（k3s）: 'Edge (k3s)'
    端设备与现场总线: Devices & Fieldbus
    实时数据 / 控制（实线）: 'Real-time data / control (solid)'
    可选同步（虚线）: 'Optional sync (dashed)'
    图6-5 云端承担集中编排，边缘承担离线自治；是否引入 k3s 取决于节点规模与运维收益。: 'Figure 6-5 The cloud centralizes orchestration while the edge runs offline autonomously; adopting k3s depends on node scale and ops payoff.'
