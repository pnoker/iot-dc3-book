<!doctype html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图12-7 产量预测：ARIMA 与 LSTM 两条路线对比</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">图12-7 产量预测：ARIMA 与 LSTM 两条路线对比</title>
  <desc id="desc">ARIMA 只利用目标变量历史值，LSTM 融合温度、降水、土壤湿度、生长天数多变量；两条路线最终都以 RMSE、MAE 评估。</desc>
  <rect width="1200" height="720" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="600" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16A34A"/></marker>
  </defs>

  <!-- Title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图12-7 产量预测：ARIMA 与 LSTM 两条路线对比</text>
  <text x="88" y="64" font-size="12" fill="#64748B">统计模型看自身历史 · 深度学习融合多源环境 · 输出连续产量值（公斤/公顷）</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 左：ARIMA -->
  <rect x="80" y="140" width="800" height="470" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="80" y="140" width="800" height="44" rx="12" fill="#2563EB"/>
  <rect x="80" y="164" width="800" height="20" fill="#2563EB"/>
  <text x="480" y="170" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">统计模型 · ARIMA（自回归积分滑动平均）</text>
  <text x="120" y="220" font-size="12" fill="#475569">只利用目标变量自身的历史值，结构简单、可解释性强</text>

  <g font-size="13">
    <circle cx="140" cy="272" r="14" fill="#2563EB"/>
    <text x="140" y="277" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="172" y="270" font-weight="700" fill="#0F172A">平稳性检验</text>
    <text x="172" y="290" font-size="11" fill="#475569">ADF 检验 · p&gt;0.05 序列非平稳</text>

    <circle cx="140" cy="338" r="14" fill="#2563EB"/>
    <text x="140" y="343" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="172" y="336" font-weight="700" fill="#0F172A">差分</text>
    <text x="172" y="356" font-size="11" fill="#475569">一阶差分 y_t − y_{t−1} 消除趋势，d=1</text>

    <circle cx="140" cy="404" r="14" fill="#2563EB"/>
    <text x="140" y="409" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="172" y="402" font-weight="700" fill="#0F172A">模型识别</text>
    <text x="172" y="422" font-size="11" fill="#475569">ACF / PACF 拖尾截尾特征定 p、q 阶数</text>

    <circle cx="140" cy="470" r="14" fill="#2563EB"/>
    <text x="140" y="475" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="172" y="468" font-weight="700" fill="#0F172A">参数估计与诊断</text>
    <text x="172" y="488" font-size="11" fill="#475569">极大似然估计 · Ljung-Box 检验残差白噪声</text>

    <circle cx="140" cy="536" r="14" fill="#2563EB"/>
    <text x="140" y="541" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="172" y="534" font-weight="700" fill="#0F172A">预测</text>
    <text x="172" y="554" font-size="11" fill="#475569">点预测值 + 置信区间，依赖历史模式延续</text>
  </g>
  <line x1="140" y1="286" x2="140" y2="324" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ah-blue)"/>
  <line x1="140" y1="352" x2="140" y2="390" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ah-blue)"/>
  <line x1="140" y1="418" x2="140" y2="456" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ah-blue)"/>
  <line x1="140" y1="484" x2="140" y2="522" stroke="#2563EB" stroke-width="1.5" marker-end="url(#ah-blue)"/>

  <!-- 右：LSTM -->
  <rect x="920" y="140" width="800" height="470" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <rect x="920" y="140" width="800" height="44" rx="12" fill="#16A34A"/>
  <rect x="920" y="164" width="800" height="20" fill="#16A34A"/>
  <text x="1320" y="170" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">深度学习 · LSTM（长短期记忆网络）</text>
  <text x="960" y="220" font-size="12" fill="#475569">融合多个外生变量，学习环境与产量的非线性关系</text>

  <g font-size="13">
    <rect x="960" y="250" width="720" height="64" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <text x="980" y="276" font-weight="700" fill="#0F172A">输入：多维环境特征序列</text>
    <text x="980" y="298" font-size="11" fill="#475569">温度 · 降水 · 土壤湿度 · 生长天数（n_features=4）</text>

    <rect x="960" y="330" width="720" height="64" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <text x="980" y="356" font-weight="700" fill="#0F172A">滑动窗口：过去 T 天（30～60 天）</text>
    <text x="980" y="378" font-size="11" fill="#475569">覆盖灌浆期等完整生长期，转为三维张量输入</text>

    <rect x="960" y="410" width="720" height="64" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <text x="980" y="436" font-weight="700" fill="#0F172A">LSTM 层 + Dropout</text>
    <text x="980" y="458" font-size="11" fill="#475569">记忆单元与门控机制解决梯度消失，Dropout 防过拟合</text>

    <rect x="960" y="490" width="720" height="64" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <text x="980" y="516" font-weight="700" fill="#0F172A">Dense 回归输出</text>
    <text x="980" y="538" font-size="11" fill="#475569">linear 激活，输出未来产量（公斤/公顷）</text>
  </g>
  <line x1="1320" y1="314" x2="1320" y2="330" stroke="#16A34A" stroke-width="1.5" marker-end="url(#ah-green)"/>
  <line x1="1320" y1="394" x2="1320" y2="410" stroke="#16A34A" stroke-width="1.5" marker-end="url(#ah-green)"/>
  <line x1="1320" y1="474" x2="1320" y2="490" stroke="#16A34A" stroke-width="1.5" marker-end="url(#ah-green)"/>

  <!-- 底部：评估指标 -->
  <rect x="80" y="650" width="1640" height="110" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="120" y="684" font-size="14" font-weight="700" fill="#334155">共同评估指标</text>
  <rect x="120" y="700" width="760" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="140" y="725" font-size="12" font-weight="700" fill="#0F172A">RMSE 均方根误差 · 对大误差惩罚更重</text>
  <rect x="920" y="700" width="760" height="40" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="940" y="725" font-size="12" font-weight="700" fill="#0F172A">MAE 平均绝对误差 · 反映平均偏离更直观</text>

  <!-- Legend -->
  <line x1="40" y1="810" x2="1760" y2="810" stroke="#E2E8F0" stroke-width="1"/>
  <g font-size="11" fill="#475569">
    <rect x="60" y="835" width="16" height="14" rx="2" fill="#2563EB"/>
    <text x="84" y="844" dominant-baseline="middle">ARIMA · 统计路线</text>
    <rect x="200" y="835" width="16" height="14" rx="2" fill="#16A34A"/>
    <text x="224" y="844" dominant-baseline="middle">LSTM · 深度学习路线</text>
    <text x="400" y="844" dominant-baseline="middle">团队资源有限时先从 ARIMA 建立基线，跨入 LSTM 前需积累 2～3 个完整生长周期数据</text>
  </g>

  <!-- Caption -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图12-7 产量预测有两条路线：ARIMA 只利用产量自身历史值、可解释性强；LSTM 融合温度、降水、土壤湿度、生长天数多变量、能捕捉非线性关系，两条路线最终都以 RMSE、MAE 评估。</text>
  </svg>
</svg>
  </main>
