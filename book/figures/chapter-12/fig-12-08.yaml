labels:
  en:
    图 12-8 LoRa / NB-IoT / Sigfox 技术维度对比雷达图: Figure 12-8 LoRa / NB-IoT / Sigfox Radar Comparison
    三种技术在覆盖、速率、功耗、成本、生态开放性、穿透能力六维度的相对强弱（1–5 刻度，1 最弱、5 最强）。: Relative strength of the three technologies across coverage, rate, power, cost, ecosystem openness, and penetration (1–5 scale; 1 weakest, 5 strongest).
    六个维度采用同一 1–5 相对刻度，辅助识别各技术优势与短板: One shared 1–5 relative scale across six dimensions to reveal strengths and gaps
    覆盖: Coverage
    速率: Rate
    功耗: Power
    成本: Cost
    生态: Ecosystem
    穿透: Penetration
    技术对比图例: Technology Legend
    覆盖4 · 速率3 · 功耗3 · 成本4 · 生态5 · 穿透4: Coverage 4 · rate 3 · power 3 · cost 4 · eco 5 · penetration 4
    覆盖4 · 速率4 · 功耗2 · 成本3 · 生态2 · 穿透3: Coverage 4 · rate 4 · power 2 · cost 3 · eco 2 · penetration 3
    覆盖4 · 速率1 · 功耗4 · 成本4 · 生态1 · 穿透4: Coverage 4 · rate 1 · power 4 · cost 4 · eco 1 · penetration 4
    读图要点: How to read
    1–5 相对刻度，1=最弱、5=最强；功耗与成本轴已转换为「越低越优」。: 1–5 relative scale, 1 = weakest, 5 = strongest; power and cost axes are flipped so higher is better.
    NB-IoT 速率最高(4)但功耗最差(2)；Sigfox 功耗最优(4)但速率最低(1)。: NB-IoT tops rate (4) but lags on power (2); Sigfox tops power (4) but bottoms on rate (1).
    LoRa 生态开放性最强(5)，覆盖、成本、穿透均衡，属居中平衡选择。: LoRa leads ecosystem openness (5) with balanced coverage, cost, and penetration — the middle-ground choice.
    图 12-8 三项技术在覆盖与成本上接近，主要差异在速率、功耗与生态开放性：LoRa 生态开放居中，NB-IoT 速率优先，Sigfox 功耗优先。: 'Figure 12-8 The three technologies are close on coverage and cost; they differ mainly in rate, power, and ecosystem openness: LoRa is open and balanced, NB-IoT prioritizes rate, Sigfox prioritizes power.'
