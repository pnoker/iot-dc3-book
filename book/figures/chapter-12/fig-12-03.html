<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图12-3 LoRa / NB-IoT / Sigfox 技术维度对比雷达图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { width: 1200px; margin: 0; padding: 0; background: #F8FAFC; overflow: hidden; }
  </style>
</head>
<body>
  <main class="page" data-figure-root>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图12-3 LoRa / NB-IoT / Sigfox 技术维度对比雷达图</title>
  <desc id="desc">三种技术在覆盖、速率、功耗、成本、生态开放性、穿透能力六维度的相对强弱（1–5 刻度，1 最弱、5 最强）。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24" y="60" width="1152" height="640" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid meet">

  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <!-- 标题 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="38" font-size="36" font-weight="700" fill="#0F172A">图12-3 LoRa / NB-IoT / Sigfox 技术维度对比雷达图</text>
  <text x="88" y="64" font-size="12" fill="#64748B">六个维度采用同一 1–5 相对刻度，辅助识别各技术优势与短板</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 雷达图（中心 720,470，R=250，刻度 1–5） ===== -->
  <g transform="translate(720 470)">
    <!-- 同心圆网格 -->
    <circle r="50" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <circle r="100" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <circle r="150" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    <circle r="200" fill="none" stroke="#CBD5E1" stroke-width="1"/>
    <circle r="250" fill="none" stroke="#94A3B8" stroke-width="1.4"/>
    <!-- 六轴辐射线 -->
    <line x1="0" y1="0" x2="0" y2="-250" stroke="#94A3B8" stroke-width="1"/>
    <line x1="0" y1="0" x2="216.5" y2="-125" stroke="#94A3B8" stroke-width="1"/>
    <line x1="0" y1="0" x2="216.5" y2="125" stroke="#94A3B8" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="250" stroke="#94A3B8" stroke-width="1"/>
    <line x1="0" y1="0" x2="-216.5" y2="125" stroke="#94A3B8" stroke-width="1"/>
    <line x1="0" y1="0" x2="-216.5" y2="-125" stroke="#94A3B8" stroke-width="1"/>

    <!-- 三种技术多边形 -->
    <polygon points="0,-200 129.9,-75 129.9,75 0,200 -216.5,125 -173.2,-100" fill="#F97316" fill-opacity=".12" stroke="#F97316" stroke-width="2.4"/>
    <polygon points="0,-200 173.2,-100 86.6,50 0,150 -86.6,50 -129.9,-75" fill="#2563EB" fill-opacity=".10" stroke="#2563EB" stroke-width="2.4"/>
    <polygon points="0,-200 43.3,-25 173.2,100 0,200 -43.3,25 -173.2,-100" fill="#0F766E" fill-opacity=".10" stroke="#0F766E" stroke-width="2.4"/>

    <!-- 顶点圆点（LoRa 橙） -->
    <g fill="#F97316" stroke="#FFFFFF" stroke-width="1.6">
      <circle cx="0" cy="-200" r="6"/><circle cx="129.9" cy="-75" r="6"/><circle cx="129.9" cy="75" r="6"/><circle cx="0" cy="200" r="6"/><circle cx="-216.5" cy="125" r="6"/><circle cx="-173.2" cy="-100" r="6"/>
    </g>
    <!-- 顶点圆点（NB-IoT 蓝） -->
    <g fill="#2563EB" stroke="#FFFFFF" stroke-width="1.6">
      <circle cx="0" cy="-200" r="6"/><circle cx="173.2" cy="-100" r="6"/><circle cx="86.6" cy="50" r="6"/><circle cx="0" cy="150" r="6"/><circle cx="-86.6" cy="50" r="6"/><circle cx="-129.9" cy="-75" r="6"/>
    </g>
    <!-- 顶点圆点（Sigfox 青绿） -->
    <g fill="#0F766E" stroke="#FFFFFF" stroke-width="1.6">
      <circle cx="0" cy="-200" r="6"/><circle cx="43.3" cy="-25" r="6"/><circle cx="173.2" cy="100" r="6"/><circle cx="0" cy="200" r="6"/><circle cx="-43.3" cy="25" r="6"/><circle cx="-173.2" cy="-100" r="6"/>
    </g>

    <!-- 轴名 + 三技术值 -->
    <text x="0" y="-278" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">覆盖</text>
    <text x="0" y="-258" text-anchor="middle" font-size="10.5" fill="#64748B">(4/4/4)</text>
    <text x="238" y="-137" font-size="14" font-weight="700" fill="#0F172A">速率</text>
    <text x="238" y="-117" font-size="10.5" fill="#64748B">(3/4/1)</text>
    <text x="238" y="160" font-size="14" font-weight="700" fill="#0F172A">功耗</text>
    <text x="238" y="180" font-size="10.5" fill="#64748B">(3/2/4)</text>
    <text x="0" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">成本</text>
    <text x="0" y="322" text-anchor="middle" font-size="10.5" fill="#64748B">(4/3/4)</text>
    <text x="-238" y="160" text-anchor="end" font-size="14" font-weight="700" fill="#0F172A">生态</text>
    <text x="-238" y="180" text-anchor="end" font-size="10.5" fill="#64748B">(5/2/1)</text>
    <text x="-238" y="-137" text-anchor="end" font-size="14" font-weight="700" fill="#0F172A">穿透</text>
    <text x="-238" y="-117" text-anchor="end" font-size="10.5" fill="#64748B">(4/3/4)</text>
  </g>

  <!-- ===== 右侧图例 ===== -->
  <text x="1390" y="200" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">技术对比图例</text>
  <line x1="1030" y1="250" x2="1090" y2="250" stroke="#F97316" stroke-width="3"/>
  <text x="1110" y="255" font-size="13" font-weight="700" fill="#0F172A">LoRa / LoRaWAN</text>
  <text x="1110" y="276" font-size="11" fill="#475569">覆盖4 · 速率3 · 功耗3 · 成本4 · 生态5 · 穿透4</text>
  <line x1="1030" y1="320" x2="1090" y2="320" stroke="#2563EB" stroke-width="3"/>
  <text x="1110" y="325" font-size="13" font-weight="700" fill="#0F172A">NB-IoT</text>
  <text x="1110" y="346" font-size="11" fill="#475569">覆盖4 · 速率4 · 功耗2 · 成本3 · 生态2 · 穿透3</text>
  <line x1="1030" y1="390" x2="1090" y2="390" stroke="#0F766E" stroke-width="3"/>
  <text x="1110" y="395" font-size="13" font-weight="700" fill="#0F172A">Sigfox</text>
  <text x="1110" y="416" font-size="11" fill="#475569">覆盖4 · 速率1 · 功耗4 · 成本4 · 生态1 · 穿透4</text>

  <!-- 读图要点 -->
  <rect x="1030" y="460" width="700" height="130" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="1060" y="494" font-size="14" font-weight="700" fill="#334155">读图要点</text>
  <text x="1060" y="522" font-size="12" fill="#475569">1–5 相对刻度，1=最弱、5=最强；功耗与成本轴已转换为「越低越优」。</text>
  <text x="1060" y="548" font-size="12" fill="#475569">NB-IoT 速率最高(4)但功耗最差(2)；Sigfox 功耗最优(4)但速率最低(1)。</text>
  <text x="1060" y="574" font-size="12" fill="#475569">LoRa 生态开放性最强(5)，覆盖、成本、穿透均衡，属居中平衡选择。</text>

  <!-- 图注 -->
  <text x="900" y="960" font-size="17" fill="#475569" text-anchor="middle">图12-3 三项技术在覆盖与成本上接近，主要差异在速率、功耗与生态开放性：LoRa 生态开放居中，NB-IoT 速率优先，Sigfox 功耗优先。</text>
  </svg>
</svg>
  </main>
</body>
</html>
