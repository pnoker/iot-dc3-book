type: flowchart
title: 图12-2 作物病害识别CNN处理流程（架构示意）
purpose: 展示一张作物叶片图像从输入到输出病害分类概率的完整CNN推理流程。
audience_takeaway: 读者应理解CNN推理的主链路——从输入图像经多次卷积池化、展平到全连接分类，以及各层的数据尺寸变化。
visual_focus: 从输入图像经过三个卷积池化模块流向展平层，再经全连接层到输出概率条，实线箭头方向清晰。
design_level: implementation
layout: 从左至右七个方框，依次为输入图像、三个卷积池化模块、展平层、全连接层、输出概率条。框间带箭头实线连接，框下方标注特征图尺寸变化。
elements:
- 输入图像框（224×224×3 RGB）。
- 三个卷积池化模块框，标注“Conv2D + ReLU + MaxPool2D”，框下分别标注输出尺寸：16×112×112、32×56×56、64×28×28。
- 展平层框，宽矩形，标注“展平（Flatten）”。
- 全连接层框，标注“128神经元 (ReLU)”。
- 输出层框，标注“C个节点 (Softmax)”，C=病害类别数+1。
- '输出概率条，垂直堆叠条，示例内容：“健康: 0.01, 白粉病: 0.88, 锈病: 0.05, 叶斑病: 0.06”。'
relationships:
- 输入图像 → 第一个卷积池化模块（实线箭头）。
- 第一个卷积池化模块 → 第二个卷积池化模块（实线箭头）。
- 第二个卷积池化模块 → 第三个卷积池化模块（实线箭头）。
- 第三个卷积池化模块 → 展平层（实线箭头）。
- 展平层 → 全连接层（实线箭头）。
- 全连接层 → 输出层（实线箭头）。
- 输出层 → 概率条（实线箭头）。
