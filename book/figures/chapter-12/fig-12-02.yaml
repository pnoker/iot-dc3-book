callouts:
- 卷积核数量递增（16→32→64）对应特征抽象层次加深，空间分辨率递减（112→56→28）由池化操作实现。
- MobileNet、EfficientNet等轻量化架构可大幅压缩此通用结构的参数量与推理延时，具体选型见下文。
legend:
- 方框：处理步骤或网络层。
- 实线箭头：数据流向（前向推理）。
visual_constraints:
