- 图例放在底部，不遮挡主体结构。
- 输出概率条用垂直堆叠条表示，最高概率项颜色加深。
render_notes: SVG渲染：浅色背景，圆角矩形框，统一6px间距。箭头带文字标签'前向传播'。输出概率条示意三个病害概率。
caption:
  zh: 图12-2 展示作物病害识别CNN从输入到输出的主要网络层与数据变换过程。工程实践中，卷积核数量与网络深度依据训练数据集规模和计算资源调整。
  en: Figure 12-2 The main network layers and data transformations of a crop disease recognition CNN from input to output. In engineering practice, the number of convolution kernels and the network depth are tuned to the training dataset size and the compute budget.
labels:
  en:
    图12-2 作物病害识别CNN处理流程（架构示意）: Figure 12-2 Crop Disease Recognition CNN Pipeline (Architecture)
    叶片图像经三级卷积池化提取层次特征、逐级降采样，展平后进入全连接层，Softmax 输出健康与各病害概率。: Leaf images go through three conv-pool stages for hierarchical features and progressive downsampling, then flatten into dense layers; Softmax outputs health and disease probabilities.
    卷积提取层次特征，池化逐级降采样，全连接层输出病害概率: Convolution extracts hierarchical features, pooling downsamples stage by stage, dense layers output disease probabilities
    叶片图像: Leaf image
    卷积 + 池化 ①: Conv + Pool ①
    卷积 + 池化 ②: Conv + Pool ②
    卷积 + 池化 ③: Conv + Pool ③
    展平为一维: Flatten to 1-D
    128 神经元 · ReLU: 128 units · ReLU
    病害概率: Disease probabilities
    Softmax · C 类: Softmax · C classes
    健康 0.01: Healthy 0.01
    白粉病 0.88: Powdery mildew 0.88
    锈病 0.05 · 叶斑 0.06: Rust 0.05 · leaf spot 0.06
    输入: Input
    特征提取与降采样: Feature extraction & downsampling
    分类决策: Classification decision
    概率输出: Probability output
    三级特征提取：边缘 → 纹理 → 形状: 'Three feature stages: edges → texture → shape'
    空间分辨率逐级降低、通道数逐级增加；C = 病害类别数 + 健康类别: Spatial resolution falls and channels rise stage by stage; C = disease classes + healthy
    图12-2 三级卷积池化把空间分辨率从 224 逐级压缩到 28、通道数由 3 增至 64，特征由边缘、纹理过渡到形状；Softmax 输出健康与各病害概率，取最大者为识别结果。: Figure 12-2 Three conv-pool stages shrink spatial resolution from 224 to 28 while channels grow from 3 to 64, moving features from edges and texture to shape; Softmax outputs health and disease probabilities, and the largest wins as the recognition result.
