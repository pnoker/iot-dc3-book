<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>微服务可观测性分层架构</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="41.569" y="24.000" width="1116.863" height="712.000" viewBox="0 0 1600.000 1020.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#D97706"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1600" height="1020" fill="#FFFFFF"/>

  <!-- ===== Title ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="88" y="46" font-size="22" font-weight="700" fill="#0F172A">微服务可观测性分层架构</text>
  <text x="88" y="68" font-size="12" fill="#64748B">从服务暴露、采集存储到展示告警的完整监控链路</text>
  <rect x="1478" y="26" width="98" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1527" y="46" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="1.5">LAYERED</text>
  <line x1="40" y1="103" x2="1560" y2="103" stroke="#E2E8F0"/>

  <!-- ===== Layer bands ===== -->
  <!-- Layer 1: display & alert -->
  <rect x="50" y="128" width="1500" height="200" rx="12" fill="#F8FAFC" fill-opacity="0.6" stroke="#64748B" stroke-width="1.4" stroke-dasharray="8 4"/>
  <!-- Layer 2: collect & store -->
  <rect x="50" y="368" width="1500" height="180" rx="12" fill="#F8FAFC" fill-opacity="0.6" stroke="#10B981" stroke-width="1.4" stroke-dasharray="8 4"/>
  <!-- Layer 3: service exposure -->
  <rect x="50" y="598" width="1500" height="210" rx="12" fill="#F8FAFC" fill-opacity="0.6" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="8 4"/>

  <!-- band tabs -->
  <rect x="70" y="116" width="232" height="26" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
  <text x="186" y="134" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle">上层 · 展示与告警</text>

  <rect x="70" y="356" width="232" height="26" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.4"/>
  <text x="186" y="374" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">中间层 · 采集与存储</text>

  <rect x="70" y="586" width="232" height="26" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="186" y="604" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">下层 · 服务暴露</text>

  <!-- ===== Layer 1 components ===== -->
  <!-- Grafana (blue, primary display) -->
  <rect x="480" y="160" width="300" height="130" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="630" y="190" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Grafana</text>
  <text x="630" y="212" font-size="10" fill="#475569" text-anchor="middle">可视化指标面板 · 仪表盘</text>
  <text x="630" y="232" font-size="9" fill="#64748B" text-anchor="middle">PromQL 指标查询 + 日志查询</text>
  <text x="630" y="250" font-size="9" fill="#64748B" text-anchor="middle">告警视图 / 聚合报表</text>

  <!-- Alertmanager (red, alert) -->
  <rect x="860" y="160" width="280" height="130" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="1000" y="190" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Alertmanager</text>
  <text x="1000" y="212" font-size="10" fill="#475569" text-anchor="middle">告警规则触发与去重</text>
  <text x="1000" y="232" font-size="9" fill="#64748B" text-anchor="middle">分组 / 抑制 / 静默</text>
  <text x="1000" y="250" font-size="9" fill="#64748B" text-anchor="middle">路由至外部通知通道</text>

  <!-- Notification channels (amber, external) -->
  <rect x="1200" y="160" width="300" height="130" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="1350" y="190" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">通知通道</text>
  <text x="1350" y="212" font-size="10" fill="#475569" text-anchor="middle">外部告警触达</text>
  <text x="1350" y="234" font-size="9" fill="#64748B" text-anchor="middle">钉钉 · 邮件</text>
  <text x="1350" y="252" font-size="9" fill="#64748B" text-anchor="middle">PagerDuty · Webhook</text>

  <!-- ===== Layer 2 components ===== -->
  <!-- Prometheus (green, collect) -->
  <rect x="490" y="395" width="320" height="130" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="650" y="425" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Prometheus</text>
  <text x="650" y="447" font-size="10" fill="#475569" text-anchor="middle">pull 模式定期拉取 metrics</text>
  <text x="650" y="467" font-size="9" fill="#64748B" text-anchor="middle">TSDB 时序存储 · PromQL</text>
  <text x="650" y="485" font-size="9" fill="#64748B" text-anchor="middle">告警规则评估 (15s)</text>

  <!-- Elasticsearch cylinder (purple, log store) -->
  <path d="M 960 411 L 960 505 A 140 16 0 0 0 1240 505 L 1240 411" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <ellipse cx="1100" cy="411" rx="140" ry="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1100" y="450" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Elasticsearch</text>
  <text x="1100" y="472" font-size="10" fill="#475569" text-anchor="middle">日志聚合存储</text>
  <text x="1100" y="491" font-size="9" fill="#64748B" text-anchor="middle">全文检索 / 聚合分析</text>

  <!-- Fluentd inline node (gray) -->
  <rect x="930" y="395" width="0" height="0" fill="none"/>
  <rect x="838" y="420" width="96" height="40" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
  <text x="886" y="438" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Fluentd</text>
  <text x="886" y="453" font-size="9" fill="#64748B" text-anchor="middle">日志管道</text>

  <!-- ===== Layer 3 components ===== -->
  <!-- Service A -->
  <rect x="230" y="635" width="250" height="150" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="355" y="665" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Service A</text>
  <text x="355" y="687" font-size="10" fill="#475569" text-anchor="middle">业务微服务</text>
  <text x="355" y="710" font-size="9" fill="#64748B" text-anchor="middle">/metrics</text>
  <text x="355" y="726" font-size="9" fill="#64748B" text-anchor="middle">/actuator/health</text>
  <text x="355" y="752" font-size="9" fill="#94A3B8" text-anchor="middle">K8s 就绪探针</text>

  <!-- Service B -->
  <rect x="545" y="635" width="250" height="150" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="670" y="665" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Service B</text>
  <text x="670" y="687" font-size="10" fill="#475569" text-anchor="middle">业务微服务</text>
  <text x="670" y="710" font-size="9" fill="#64748B" text-anchor="middle">/metrics</text>
  <text x="670" y="726" font-size="9" fill="#64748B" text-anchor="middle">/actuator/health</text>
  <text x="670" y="752" font-size="9" fill="#94A3B8" text-anchor="middle">自定义业务指标</text>

  <!-- Device Driver -->
  <rect x="860" y="635" width="250" height="150" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="985" y="665" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Device Driver</text>
  <text x="985" y="687" font-size="10" fill="#475569" text-anchor="middle">设备驱动</text>
  <text x="985" y="710" font-size="9" fill="#64748B" text-anchor="middle">HealthIndicator</text>
  <text x="985" y="726" font-size="9" fill="#64748B" text-anchor="middle">健康态 → 业务指标</text>
  <text x="985" y="752" font-size="9" fill="#94A3B8" text-anchor="middle">设备状态可观测</text>

  <!-- ===== Connectors ===== -->
  <!-- Layer3 -> Layer2 collection bus (gray) -->
  <line x1="355" y1="635" x2="355" y2="610" stroke="#64748B" stroke-width="1.6"/>
  <line x1="670" y1="635" x2="670" y2="610" stroke="#64748B" stroke-width="1.6"/>
  <line x1="985" y1="635" x2="985" y2="610" stroke="#64748B" stroke-width="1.6"/>
  <line x1="355" y1="610" x2="985" y2="610" stroke="#64748B" stroke-width="1.6"/>
  <!-- bus -> Prometheus (green, pull metrics) -->
  <line x1="650" y1="608" x2="650" y2="529" stroke="#10B981" stroke-width="2.2" marker-end="url(#ah-green)"/>
  <text x="660" y="572" font-size="10" fill="#10B981">pull /metrics</text>
  <text x="660" y="586" font-size="9" fill="#64748B">采集 15s</text>

  <!-- logs: services -> Fluentd -> ES (gray dashed) -->
  <line x1="985" y1="610" x2="886" y2="462" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="886" y1="460" x2="1020" y2="430" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="900" y="500" font-size="9" fill="#64748B">日志 → Fluentd → ES</text>

  <!-- Prometheus -> Grafana (blue, main chain highlight) -->
  <line x1="630" y1="393" x2="630" y2="294" stroke="#2563EB" stroke-width="3" marker-end="url(#ah-blue)"/>
  <text x="640" y="346" font-size="11" font-weight="700" fill="#2563EB">PromQL 查询</text>

  <!-- Prometheus -> Alertmanager (red, fire alerts) -->
  <line x1="780" y1="410" x2="970" y2="294" stroke="#E11D48" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="820" y="372" font-size="10" fill="#E11D48">告警触发</text>

  <!-- Alertmanager -> notification channels (amber) -->
  <line x1="1140" y1="225" x2="1196" y2="225" stroke="#D97706" stroke-width="2.2" marker-end="url(#ah-amber)"/>
  <text x="1168" y="216" font-size="9" fill="#D97706" text-anchor="middle">路由</text>

  <!-- ===== Separator before legend ===== -->
  <line x1="40" y1="838" x2="1560" y2="838" stroke="#E2E8F0"/>

  <!-- ===== Legend ===== -->
  <text x="60" y="864" font-size="11" font-weight="700" fill="#475569">图例</text>

  <rect x="120" y="856" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="144" y="866" font-size="11" fill="#475569">主链路 · 指标查询</text>

  <rect x="300" y="856" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="324" y="866" font-size="11" fill="#475569">Prometheus 采集</text>

  <rect x="470" y="856" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="494" y="866" font-size="11" fill="#475569">Elasticsearch 日志存储</text>

  <rect x="690" y="856" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="714" y="866" font-size="11" fill="#475569">告警链路</text>

  <rect x="820" y="856" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="844" y="866" font-size="11" fill="#475569">外部通知通道</text>

  <rect x="990" y="856" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6" stroke-dasharray="3 2"/>
  <text x="1014" y="866" font-size="11" fill="#475569">采集总线 / 异步日志管道</text>

  <!-- ===== Callout ===== -->
  <rect x="50" y="892" width="1500" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="800" y="916" font-size="11" fill="#334155" text-anchor="middle">
    Prometheus 以 pull 模式从各微服务 /metrics 端点采集指标，聚合后供 Grafana 展示并驱动 Alertmanager 告警规则；
  </text>
  <text x="800" y="934" font-size="11" fill="#334155" text-anchor="middle">
    业务日志经 Fluentd 管道写入 Elasticsearch；Device Driver 通过 HealthIndicator 将设备健康状态暴露为业务指标。
  </text>

  <!-- ===== Caption ===== -->
  <text x="800" y="985" font-size="10" fill="#94A3B8" text-anchor="middle">图 6-7　微服务可观测性分层架构：服务暴露 → 采集与存储 → 展示与告警</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">layered</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">三层从左到右堆叠，每层包含对应组件框</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
