<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图6-6 物联网微服务容器部署的端-边-云分层架构</title>
  <desc id="desc">读者应理解物联网微服务容器部署的端-边-云分层架构中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">图6-6 物联网微服务容器部署的端-边-云分层架构</title>
  <desc id="desc">读者应理解物联网微服务容器部署的端-边-云分层架构中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图6-6 物联网微服务容器部署的端-边-云分层架构</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解物联网微服务容器部署的端-边-云分层架构中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">LAYERED</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="layered">
  <!-- 区域边界 -->
  <rect x="130" y="130" width="1440" height="175" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="145" y="150" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#64748B">平台服务域</text>
  <rect x="130" y="310" width="1440" height="330" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="145" y="325" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#64748B">设备与边缘域</text>

  <!-- 连线（先于卡片） -->
  <!-- 云端→边缘 正向（实线蓝色） -->
  <line x1="500" y1="285" x2="500" y2="310" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <line x1="530" y1="285" x2="530" y2="310" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 边缘→云端 反向（实线蓝色） -->
  <line x1="560" y1="310" x2="560" y2="285" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <line x1="590" y1="310" x2="590" y2="285" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  
  <!-- 边缘→设备 正向（实线蓝色） -->
  <line x1="500" y1="450" x2="500" y2="480" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <line x1="530" y1="450" x2="530" y2="480" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 设备→边缘 反向（实线蓝色） -->
  <line x1="560" y1="480" x2="560" y2="450" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <line x1="590" y1="480" x2="590" y2="450" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>

  <!-- 边缘→云端 异步虚线（灰色） -->
  <line x1="400" y1="310" x2="400" y2="285" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>

  <!-- 连线标签 -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#0F172A">
    <!-- 云端-边缘 MQTT -->
    <rect x="505" y="288" width="75" height="18" rx="3" fill="#FFFFFF" stroke="none"/>
    <text x="510" y="300">MQTT Broker</text>
    <!-- 边缘-设备 实时采集 -->
    <rect x="505" y="458" width="90" height="18" rx="3" fill="#FFFFFF" stroke="none"/>
    <text x="510" y="470">实时采集/控制回路</text>
    <!-- 异步虚线标签 -->
    <rect x="385" y="288" width="105" height="18" rx="3" fill="#FFFFFF" stroke="none"/>
    <text x="390" y="300">gRPC/MQTT QoS1</text>
  </g>

  <!-- 云端层卡片 -->
  <rect x="150" y="145" width="1400" height="140" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" filter="url(#drop-shadow)"/>
  <text x="170" y="170" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A">云端层</text>
  <text x="170" y="188" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#64748B">完整 Kubernetes 集群（控制平面 + 中心服务）</text>
  <!-- 控制平面组 -->
  <rect x="200" y="155" width="300" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="210" y="168" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#64748B">控制平面</text>
  <rect x="210" y="180" width="60" height="30" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="240" y="198" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#0F172A">API Server</text>
  <rect x="280" y="180" width="60" height="30" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="310" y="198" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#0F172A">Scheduler</text>
  <rect x="350" y="180" width="60" height="30" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="380" y="198" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#0F172A">Controller Mgr</text>
  <!-- 中心服务Pod组 -->
  <rect x="550" y="155" width="400" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="560" y="168" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#64748B">中心服务 Pod</text>
  <rect x="560" y="180" width="60" height="30" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="590" y="198" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#0F172A">manager</text>
  <rect x="630" y="180" width="60" height="30" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="660" y="198" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#0F172A">data</text>
  <rect x="700" y="180" width="60" height="30" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="730" y="198" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="13" text-anchor="middle" fill="#0F172A">notify</text>

  <!-- 边缘层卡片 -->
  <rect x="150" y="310" width="1400" height="140" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" filter="url(#drop-shadow)"/>
  <text x="170" y="335" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A">边缘层</text>
  <text x="170" y="353" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#64748B">k3s 集群：网关、协议适配、本地缓冲、规则进程</text>
  <!-- 边缘 Pod 列表 -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#0F172A" text-anchor="middle">
    <rect x="200" y="370" width="80" height="35" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="240" y="391">边缘网关 Pod</text>
    <rect x="300" y="370" width="80" height="35" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="340" y="391">Modbus Driver</text>
    <rect x="400" y="370" width="80" height="35" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="440" y="391">MQTT Driver</text>
    <rect x="500" y="370" width="80" height="35" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="540" y="391">本地缓冲</text>
    <rect x="600" y="370" width="80" height="35" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="640" y="391">确定规则</text>
  </g>

  <!-- 端设备层卡片 -->
  <rect x="150" y="480" width="1400" height="130" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" filter="url(#drop-shadow)"/>
  <text x="170" y="505" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#0F172A">端设备层</text>
  <text x="170" y="523" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="12" fill="#64748B">传感器、PLC、执行器，及现场总线/无线连接</text>
  <!-- 设备列表 -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="11" fill="#0F172A" text-anchor="middle">
    <rect x="200" y="540" width="70" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="235" y="558">传感器</text>
    <rect x="285" y="540" width="70" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="320" y="558">PLC</text>
    <rect x="370" y="540" width="70" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="405" y="558">执行器</text>
    <rect x="455" y="540" width="70" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="490" y="558">Modbus RTU</text>
    <rect x="540" y="540" width="70" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="575" y="558">CAN</text>
    <rect x="625" y="540" width="70" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
    <text x="660" y="558">Zigbee/LoRa</text>
  </g>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色=核心平台中心服务</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头=同步调用或强依赖；虚线箭头=异步消息或可选同步</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图6-6 展示物联网微服务从端设备到边缘节点再到云端的容器部署分层架构。边缘层运行 k3s 轻量集群处理协议适配和本地缓存，云端运行完整 K8s 集群承载中心服务。</text>
  </svg>
</svg>