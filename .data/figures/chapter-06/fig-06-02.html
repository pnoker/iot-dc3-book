<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图6-2 采集层数据上报时序</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="52.308" y="24.000" width="1095.385" height="712.000" viewBox="0 0 1600.000 1040.000" preserveAspectRatio="xMidYMid meet">
<rect x="0" y="0" width="1600" height="1040" fill="#FFFFFF"/>

  <!-- ===== DEFS ===== -->
  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
  </defs>

  <!-- ===== 标题区 ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图6-2 采集层数据上报时序</text>
  <text x="84" y="70" font-size="12" fill="#64748B">设备原始报文 → 两级缓存 → 批量调度 → 消息队列的异步批处理路径</text>
  <rect x="1462" y="26" width="98" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1511" y="43" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.2">SEQUENCE</text>
  <line x1="40" y1="103" x2="1560" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== 参与者生命线 ===== -->
  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4">
    <line x1="150" y1="210" x2="150" y2="920"/>
    <line x1="400" y1="210" x2="400" y2="920"/>
    <line x1="660" y1="210" x2="660" y2="920"/>
    <line x1="920" y1="210" x2="920" y2="920"/>
    <line x1="1180" y1="210" x2="1180" y2="920"/>
    <line x1="1440" y1="210" x2="1440" y2="920"/>
  </g>

  <!-- ===== 参与者卡 ===== -->
  <!-- 设备 -->
  <g>
    <rect x="75" y="140" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="150" y="166" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">设备</text>
    <text x="150" y="186" font-size="10" fill="#64748B" text-anchor="middle">MQTT / Modbus / OPC UA</text>
  </g>
  <!-- 采集适配器 -->
  <g>
    <rect x="325" y="140" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="400" y="166" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">采集适配器</text>
    <text x="400" y="186" font-size="10" fill="#64748B" text-anchor="middle">协议解析 · PointValue</text>
  </g>
  <!-- Caffeine -->
  <g>
    <rect x="585" y="140" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="660" y="166" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Caffeine</text>
    <text x="660" y="186" font-size="10" fill="#64748B" text-anchor="middle">一级本地缓存 · 亚秒写</text>
  </g>
  <!-- Redis -->
  <g>
    <rect x="845" y="140" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="920" y="166" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Redis</text>
    <text x="920" y="186" font-size="10" fill="#64748B" text-anchor="middle">二级缓存 · 增量同步</text>
  </g>
  <!-- 批量调度器 -->
  <g>
    <rect x="1105" y="140" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1180" y="166" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">批量调度器</text>
    <text x="1180" y="186" font-size="10" fill="#64748B" text-anchor="middle">定时窗口 · 批量提取</text>
  </g>
  <!-- 消息队列 -->
  <g>
    <rect x="1365" y="140" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="1440" y="166" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">消息队列</text>
    <text x="1440" y="186" font-size="10" fill="#64748B" text-anchor="middle">批量消息 · 持久化</text>
  </g>

  <!-- ===== 区域边界：两级缓存 ===== -->
  <rect x="560" y="120" width="420" height="800" rx="12" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"/>
  <rect x="572" y="110" width="150" height="22" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="647" y="125" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">两级缓存域</text>

  <!-- ===== 激活条 (activation bars) ===== -->
  <!-- 采集适配器: 解析+写 -->
  <rect x="396" y="340" width="8" height="170" fill="#2563EB" opacity="0.18"/>
  <!-- Caffeine: 写入 -->
  <rect x="656" y="345" width="8" height="40" fill="#7C3AED" opacity="0.20"/>
  <!-- Redis: 同步 -->
  <rect x="916" y="425" width="8" height="40" fill="#7C3AED" opacity="0.20"/>
  <!-- 批量调度器: 拉取+投递 -->
  <rect x="1176" y="535" width="8" height="160" fill="#2563EB" opacity="0.18"/>
  <!-- Caffeine: 增量拉取 -->
  <rect x="656" y="540" width="8" height="55" fill="#7C3AED" opacity="0.20"/>

  <!-- ===== 消息 ===== -->
  <!-- m1: 设备 → 采集适配器  原始报文 (异步主链路) -->
  <line x1="158" y1="265" x2="392" y2="265" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="275" y="256" font-size="12" fill="#0F172A" text-anchor="middle">①原始协议报文</text>
  <text x="275" y="280" font-size="9" fill="#64748B" text-anchor="middle">异步上报</text>

  <!-- m2: 采集适配器 → Caffeine  PointValue 写入 -->
  <line x1="408" y1="350" x2="652" y2="350" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="530" y="341" font-size="12" fill="#0F172A" text-anchor="middle">②解析 → 写入 PointValue</text>
  <text x="530" y="365" font-size="9" fill="#64748B" text-anchor="middle">亚秒级</text>

  <!-- m3: 采集适配器 → Redis  周期增量同步 (异步反馈) -->
  <line x1="408" y1="440" x2="912" y2="440" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="660" y="431" font-size="12" fill="#0F172A" text-anchor="middle">③周期增量同步</text>
  <text x="660" y="455" font-size="9" fill="#64748B" text-anchor="middle">定时任务 · 数秒间隔</text>

  <!-- m4: 批量调度器 → Caffeine  拉取增量 (窗口触发) -->
  <line x1="1172" y1="555" x2="668" y2="555" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="920" y="546" font-size="12" fill="#0F172A" text-anchor="middle">④拉取增量数据</text>
  <text x="920" y="570" font-size="9" fill="#64748B" text-anchor="middle">每个调度窗口触发</text>

  <!-- m5: Caffeine → 批量调度器  返回增量 (响应虚线) -->
  <line x1="664" y1="590" x2="1172" y2="590" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="918" y="584" font-size="10" fill="#475569" text-anchor="middle">返回窗口内增量</text>

  <!-- m6: 批量调度器 → 消息队列  投递批量消息 -->
  <line x1="1188" y1="680" x2="1432" y2="680" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1310" y="671" font-size="12" fill="#0F172A" text-anchor="middle">⑤投递批量消息</text>
  <text x="1310" y="695" font-size="9" fill="#64748B" text-anchor="middle">持久化</text>

  <!-- ===== callout: 两级缓存解耦 ===== -->
  <rect x="1135" y="755" width="400" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1152" y="778" font-size="11" font-weight="700" fill="#334155">缓存解耦上下游速率</text>
  <text x="1152" y="797" font-size="10" fill="#475569">· Caffeine 承接适配器高频写入，缓冲上游毛刺</text>
  <text x="1152" y="813" font-size="10" fill="#475569">· 调度器按窗口批量拉取，吸收下游处理速率</text>
  <text x="1152" y="829" font-size="10" fill="#475569">· Redis 作为反馈路径，提供增量同步与可见性</text>

  <!-- ===== 时间轴提示 (左侧) ===== -->
  <g>
    <line x1="38" y1="240" x2="38" y2="710" stroke="#94A3B8" stroke-width="1"/>
    <polygon points="38,716 34,706 42,706" fill="#94A3B8"/>
    <text x="30" y="478" font-size="10" fill="#94A3B8" text-anchor="middle" transform="rotate(-90 30 478)">时间</text>
  </g>

  <!-- ===== 图例 ===== -->
  <line x1="40" y1="945" x2="1560" y2="945" stroke="#E2E8F0" stroke-width="1"/>
  <g font-size="11" fill="#475569">
    <!-- 实线 -->
    <line x1="80" y1="972" x2="116" y2="972" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <text x="126" y="976">同步 / 强依赖（主链路）</text>
    <!-- 虚线 -->
    <line x1="340" y1="972" x2="376" y2="972" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <text x="386" y="976">异步 / 反馈</text>
    <!-- 蓝 -->
    <rect x="510" y="966" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="534" y="976">平台核心组件</text>
    <!-- 绿 -->
    <rect x="662" y="966" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="686" y="976">设备 / 边缘</text>
    <!-- 紫 -->
    <rect x="800" y="966" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="824" y="976">数据 / 缓存域</text>
    <!-- 灰 -->
    <rect x="948" y="966" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <text x="972" y="976">外部系统 / 消息队列</text>
  </g>

  <!-- ===== caption ===== -->
  <text x="800" y="1020" font-size="10" fill="#94A3B8" text-anchor="middle">图6-2  展示一条设备数据从原始报文到消息队列的完整异步批处理流程；两级缓存解耦上下游速率。</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">sequence</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">自左至右参与者：设备 → 采集适配器 → Caffeine → Redis → 批量调度器 → 消息队列</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
