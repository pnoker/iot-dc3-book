<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="72.800" width="1152.000" height="614.400" viewBox="0 0 1800.000 960.000" preserveAspectRatio="xMidYMid meet">
<defs>
<marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
<marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
<marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
</defs>

<rect x="0" y="0" width="1800" height="960" fill="#FFFFFF"/>

<!-- 标题区 -->
<circle cx="64" cy="40" r="6" fill="#2563EB"/>
<text x="84" y="48" fill="#0F172A" font-size="22" font-weight="700">图6-5 物联网系统关键决策三元组</text>
<text x="84" y="74" fill="#64748B" font-size="12" font-weight="500">语言 · 协议 · 架构：从原型到生产的最短迁移路径</text>
<rect x="1620" y="28" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="1680" y="45" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MATRIX</text>
<line x1="40" y1="100" x2="1760" y2="100" stroke="#E2E8F0" stroke-width="1"/>

<!-- ===== 三栏：语言 / 协议 / 架构 ===== -->

<!-- 栏 1：语言决策 -->
<text x="330" y="138" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">语言决策</text>
<text x="330" y="158" fill="#64748B" font-size="10" text-anchor="middle">Python → Java</text>
<!-- 原型区 -->
<rect x="90" y="175" width="480" height="150" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="110" y="200" fill="#2563EB" font-size="11" font-weight="700">原型阶段</text>
<text x="330" y="252" fill="#0F172A" font-size="26" font-weight="700" text-anchor="middle">Python</text>
<text x="330" y="288" fill="#475569" font-size="11" text-anchor="middle">快速原型 · 丰富生态库 · 开发优先</text>
<!-- 迁移箭头 -->
<line x1="330" y1="330" x2="330" y2="412" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ah-orange)"/>
<rect x="360" y="358" width="150" height="26" rx="4" fill="#FFFFFF" stroke="#FED7AA"/>
<text x="435" y="375" fill="#B45309" font-size="10" font-weight="600" text-anchor="middle">重写 I/O 层</text>
<!-- 生产区 -->
<rect x="90" y="420" width="480" height="150" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="110" y="445" fill="#1D4ED8" font-size="11" font-weight="700">生产阶段</text>
<text x="330" y="497" fill="#0F172A" font-size="26" font-weight="700" text-anchor="middle">Java</text>
<text x="330" y="533" fill="#475569" font-size="11" text-anchor="middle">Netty · 高并发 · 长期可维护</text>

<!-- 栏 2：协议决策 -->
<text x="840" y="138" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">协议决策</text>
<text x="840" y="158" fill="#64748B" font-size="10" text-anchor="middle">MQTT + REST → + gRPC</text>
<rect x="600" y="175" width="480" height="150" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="200" fill="#2563EB" font-size="11" font-weight="700">原型阶段</text>
<text x="840" y="252" fill="#0F172A" font-size="22" font-weight="700" text-anchor="middle">MQTT + REST</text>
<text x="840" y="288" fill="#475569" font-size="11" text-anchor="middle">消息 + 请求响应 · 够用即止</text>
<line x1="840" y1="330" x2="840" y2="412" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ah-orange)"/>
<rect x="870" y="358" width="160" height="26" rx="4" fill="#FFFFFF" stroke="#FED7AA"/>
<text x="950" y="375" fill="#B45309" font-size="10" font-weight="600" text-anchor="middle">引入 API 网关</text>
<rect x="600" y="420" width="480" height="150" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="620" y="445" fill="#1D4ED8" font-size="11" font-weight="700">生产阶段</text>
<text x="840" y="497" fill="#0F172A" font-size="22" font-weight="700" text-anchor="middle">MQTT + REST + gRPC</text>
<text x="840" y="533" fill="#475569" font-size="11" text-anchor="middle">流式 · 网关统一接入 · 多协议并存</text>

<!-- 栏 3：架构决策 -->
<text x="1350" y="138" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">架构决策</text>
<text x="1350" y="158" fill="#64748B" font-size="10" text-anchor="middle">单体 → 微服务</text>
<rect x="1110" y="175" width="480" height="150" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="1130" y="200" fill="#2563EB" font-size="11" font-weight="700">原型阶段</text>
<text x="1350" y="252" fill="#0F172A" font-size="26" font-weight="700" text-anchor="middle">单体模块</text>
<text x="1350" y="288" fill="#475569" font-size="11" text-anchor="middle">一个进程 · 直接调用 · 无网络开销</text>
<line x1="1350" y1="330" x2="1350" y2="412" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ah-orange)"/>
<rect x="1380" y="358" width="160" height="26" rx="4" fill="#FFFFFF" stroke="#FED7AA"/>
<text x="1460" y="375" fill="#B45309" font-size="10" font-weight="600" text-anchor="middle">提取独立服务</text>
<rect x="1110" y="420" width="480" height="150" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="1130" y="445" fill="#1D4ED8" font-size="11" font-weight="700">生产阶段</text>
<text x="1350" y="497" fill="#0F172A" font-size="26" font-weight="700" text-anchor="middle">微服务集</text>
<text x="1350" y="533" fill="#475569" font-size="11" text-anchor="middle">独立扩缩容 · 按域拆分 · 故障隔离</text>

<!-- ===== 底部影响链：语言 → 协议 → 架构 ===== -->
<rect x="90" y="615" width="1500" height="80" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="120" y="640" fill="#64748B" font-size="11" font-weight="700">影响链</text>
<line x1="300" y1="660" x2="540" y2="660" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah-gray)"/>
<text x="420" y="652" fill="#475569" font-size="10" text-anchor="middle">影响协议实现复杂度</text>
<line x1="840" y1="660" x2="1080" y2="660" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah-gray)"/>
<text x="960" y="652" fill="#475569" font-size="10" text-anchor="middle">影响架构边界划分</text>
<text x="240" y="666" fill="#0F172A" font-size="11" font-weight="600" text-anchor="middle">语言</text>
<text x="780" y="666" fill="#0F172A" font-size="11" font-weight="600" text-anchor="middle">协议</text>
<text x="1290" y="666" fill="#0F172A" font-size="11" font-weight="600" text-anchor="middle">架构</text>

<!-- 图例 -->
<line x1="40" y1="720" x2="1760" y2="720" stroke="#E2E8F0" stroke-width="1"/>
<rect x="80" y="745" width="20" height="14" rx="3" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="108" y="757" fill="#64748B" font-size="11" font-weight="600">原型阶段</text>
<rect x="210" y="745" width="20" height="14" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="238" y="757" fill="#64748B" font-size="11" font-weight="600">生产阶段</text>
<line x1="340" y1="752" x2="376" y2="752" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#ah-orange)"/>
<text x="384" y="757" fill="#64748B" font-size="11" font-weight="600">迁移路径（最短工程动作）</text>
<line x1="600" y1="752" x2="636" y2="752" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah-gray)"/>
<text x="644" y="757" fill="#64748B" font-size="11" font-weight="600">维度影响链</text>

<!-- callout -->
<rect x="80" y="785" width="1640" height="74" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="100" y="810" fill="#334155" font-size="11" font-weight="500">· 语言选型影响协议实现复杂度：Python 的 GIL 在高并发 gRPC 流场景易成瓶颈，Java/Netty 更适合服务端流。</text>
<text x="100" y="830" fill="#334155" font-size="11" font-weight="500">· 协议选型直接影响架构边界：不同协议需不同接入点，必须由 API 网关统一管理。</text>
<text x="100" y="850" fill="#334155" font-size="11" font-weight="500">· 架构选型决定各协议层能否独立扩缩容：设备接入层按设备数水平扩展，数据服务层按消息量扩展。</text>

<!-- caption -->
<text x="900" y="908" fill="#94A3B8" font-size="10" text-anchor="middle">图6-5 从原型到生产的三元决策矩阵：语言、协议、架构三维度各自的原型选项、生产升级与最短迁移路径，三者构成互相影响的系统工程（对应 6.1 语言、6.2 协议、6.3 架构实践）。</text>
  </svg>
</svg>