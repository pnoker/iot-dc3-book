<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="50.400" width="1152.000" height="659.200" viewBox="0 0 1800.000 1030.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1800" height="1030" fill="#FFFFFF"/>

  <!-- ============ TITLE AREA ============ -->
  <circle cx="64" cy="44" r="6" fill="#2563EB"/>
  <text x="84" y="40" font-size="22" font-weight="700" fill="#0F172A">图9-6 从协议适配到语义互操作的演进</text>
  <text x="84" y="64" font-size="12.5" fill="#64748B">互操作三层（语法 · 结构 · 语义）及工程载体 —— MCP 将语义层从平台推进到设备-AI 直连</text>
  <rect x="1648" y="30" width="112" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1704" y="48" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="2">LAYERED</text>
  <line x1="60" y1="92" x2="1740" y2="92" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ============ MCP TOP BAND (full width) ============ -->
  <rect x="80" y="110" width="1640" height="54" rx="8" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="98" y="122" width="92" height="30" rx="6" fill="#7C3AED"/>
  <text x="144" y="142" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">MCP</text>
  <text x="206" y="141" font-size="15" font-weight="600" fill="#0F172A">横贯三层互操作 · 把语义层从平台推进到设备-AI 直连</text>
  <text x="206" y="157" font-size="10" fill="#64748B">Top band: MCP permeates the three layers and upgrades the semantic layer to a direct device-AI channel</text>
  <rect x="1500" y="122" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="1600" y="142" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">贯穿三层 + 升级语义层</text>

  <!-- ============ DASHED CONNECTORS: band -> three layers (left spine) ============ -->
  <line x1="92" y1="164" x2="92" y2="630" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="92" y1="270" x2="106" y2="270" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-purple)"/>
  <line x1="92" y1="450" x2="106" y2="450" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-purple)"/>
  <line x1="92" y1="630" x2="106" y2="630" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-purple)"/>

  <!-- dashed connector: band -> MCP node (right) -->
  <line x1="1360" y1="164" x2="1360" y2="200" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-purple)"/>

  <!-- ============ LEFT COLUMN: three layers stacked (top=semantic) ============ -->

  <!-- ===== 语义层 (purple) y 190-350 ===== -->
  <rect x="110" y="190" width="820" height="160" rx="12" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="126" y="204" width="180" height="32" rx="6" fill="#7C3AED"/>
  <text x="216" y="225" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">语义层 Semantic</text>
  <!-- carrier card -->
  <rect x="330" y="206" width="240" height="128" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="450" y="238" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">本体 Ontology</text>
  <text x="450" y="261" font-size="11" fill="#475569" text-anchor="middle">SSN · SOSA · SAREF</text>
  <line x1="360" y1="273" x2="540" y2="273" stroke="#E2E8F0" stroke-width="1"/>
  <text x="450" y="293" font-size="9" fill="#64748B" text-anchor="middle">Sensor · Observation · Property</text>
  <text x="450" y="317" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="middle">机器可推理</text>
  <!-- notes -->
  <text x="600" y="236" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">载 体</text>
  <text x="600" y="258" font-size="12.5" fill="#0F172A">用本体标注真实含义与概念关系</text>
  <text x="600" y="294" font-size="10" font-weight="700" fill="#7C3AED" letter-spacing="1">突 破</text>
  <text x="600" y="316" font-size="12.5" fill="#0F172A">含义对齐，设备-AI 可直接互相理解</text>

  <!-- ===== 结构层 (green) y 370-530 ===== -->
  <rect x="110" y="370" width="820" height="160" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="126" y="384" width="180" height="32" rx="6" fill="#10B981"/>
  <text x="216" y="405" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">结构层 Structural</text>
  <rect x="330" y="386" width="240" height="128" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="450" y="418" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">物模型 Thing Model</text>
  <text x="450" y="441" font-size="11" fill="#475569" text-anchor="middle">property · event · action</text>
  <line x1="360" y1="453" x2="540" y2="453" stroke="#E2E8F0" stroke-width="1"/>
  <text x="450" y="473" font-size="9" fill="#64748B" text-anchor="middle">统一字段 · 类型 · 单位</text>
  <text x="450" y="497" font-size="10.5" font-weight="700" fill="#10B981" text-anchor="middle">字段对齐</text>
  <text x="600" y="416" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">载 体</text>
  <text x="600" y="438" font-size="12.5" fill="#0F172A">统一字段名/类型/单位，跨设备可比</text>
  <text x="600" y="474" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">局 限</text>
  <text x="600" y="496" font-size="12" fill="#475569">字段对齐，但“温度”含义仍可能不同</text>

  <!-- ===== 语法层 (blue) y 550-710 ===== -->
  <rect x="110" y="550" width="820" height="160" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="126" y="564" width="180" height="32" rx="6" fill="#2563EB"/>
  <text x="216" y="585" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">语法层 Syntactic</text>
  <rect x="330" y="566" width="240" height="128" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="450" y="598" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">适配网关 Adapter</text>
  <text x="450" y="621" font-size="11" fill="#475569" text-anchor="middle">MQTT · HTTP · CoAP</text>
  <line x1="360" y1="633" x2="540" y2="633" stroke="#E2E8F0" stroke-width="1"/>
  <text x="450" y="653" font-size="9" fill="#64748B" text-anchor="middle">JSON / Protobuf 编解码</text>
  <text x="450" y="677" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">格式一致</text>
  <text x="600" y="596" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">载 体</text>
  <text x="600" y="618" font-size="12.5" fill="#0F172A">统一消息格式与协议编解码</text>
  <text x="600" y="654" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">局 限</text>
  <text x="600" y="676" font-size="12" fill="#475569">仅保证格式一致，不保证含义一致</text>

  <!-- abstraction arrow (left column, far right) -->
  <line x1="948" y1="725" x2="948" y2="182" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="966" y="455" font-size="10" fill="#64748B" text-anchor="middle" transform="rotate(-90 966 455)">抽象度 / 语义丰富度递增</text>

  <!-- ============ RIGHT COLUMN: evolution (upward) ============ -->

  <!-- ===== MCP node (purple, highlighted, largest) y 200-330 ===== -->
  <rect x="1100" y="200" width="520" height="130" rx="10" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2.5"/>
  <rect x="1116" y="214" width="96" height="30" rx="6" fill="#7C3AED"/>
  <text x="1164" y="234" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">MCP</text>
  <text x="1228" y="235" font-size="16" font-weight="700" fill="#0F172A">Model Context Protocol</text>
  <text x="1228" y="257" font-size="12" font-weight="700" fill="#7C3AED">设备-AI 直连 · 语义级互操作</text>
  <text x="1116" y="289" font-size="11" fill="#475569">AI 直接发现并调用设备能力，无需平台中转；</text>
  <text x="1116" y="309" font-size="11" fill="#475569">把语义层从“平台内部”推进到“设备-AI 之间”。</text>
  <rect x="1492" y="212" width="116" height="26" rx="13" fill="#7C3AED"/>
  <text x="1550" y="230" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">★ 演进终点</text>

  <!-- ===== W3C WoT node (blue) y 440-550 ===== -->
  <rect x="1140" y="440" width="440" height="110" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <rect x="1156" y="454" width="80" height="28" rx="6" fill="#2563EB"/>
  <text x="1196" y="473" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">W3C</text>
  <text x="1250" y="473" font-size="14" font-weight="700" fill="#0F172A">WoT Thing Description</text>
  <text x="1156" y="503" font-size="12" font-weight="700" fill="#2563EB">机器可读描述</text>
  <text x="1156" y="525" font-size="10.5" fill="#475569">用 TD 统一描述设备接口，支持自动发现与绑定</text>

  <!-- ===== oneM2M node (gray) y 660-760 ===== -->
  <rect x="1180" y="660" width="360" height="100" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <rect x="1196" y="674" width="110" height="28" rx="6" fill="#64748B"/>
  <text x="1251" y="693" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">oneM2M</text>
  <text x="1320" y="693" font-size="13" font-weight="700" fill="#0F172A">跨平台互通标准</text>
  <text x="1196" y="723" font-size="11" fill="#475569">水平整合 · 系统间两两对接</text>
  <text x="1196" y="743" font-size="10" fill="#64748B">物联网早期互通标准 · 平台中心化</text>

  <!-- evolution arrows (upward, purple) -->
  <line x1="1085" y1="658" x2="1085" y2="556" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ah-purple)"/>
  <line x1="1085" y1="438" x2="1085" y2="334" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ah-purple)"/>
  <text x="1078" y="612" font-size="10" fill="#475569" text-anchor="end">↑ 机器可读化</text>
  <text x="1078" y="390" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="end">↑ 语义直连</text>

  <!-- evolution conclusion annotation -->
  <text x="1360" y="784" font-size="12.5" font-weight="700" font-style="italic" fill="#7C3AED" text-anchor="middle">标准化从“对接系统” → 走向“对接 AI”</text>

  <!-- ============ Ontology badges (bottom-right) ============ -->
  <text x="1360" y="806" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">本体族 · 语义层载体</text>
  <!-- SSN -->
  <rect x="1100" y="814" width="160" height="66" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1180" y="840" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">SSN</text>
  <text x="1180" y="858" font-size="8.5" fill="#64748B" text-anchor="middle">Semantic Sensor</text>
  <text x="1180" y="871" font-size="8.5" fill="#64748B" text-anchor="middle">Network Ontology</text>
  <!-- SOSA -->
  <rect x="1280" y="814" width="160" height="66" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1360" y="840" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">SOSA</text>
  <text x="1360" y="858" font-size="8.5" fill="#64748B" text-anchor="middle">Sensor / Observation /</text>
  <text x="1360" y="871" font-size="8.5" fill="#64748B" text-anchor="middle">Sample / Actuator</text>
  <!-- SAREF -->
  <rect x="1460" y="814" width="160" height="66" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1540" y="840" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">SAREF</text>
  <text x="1540" y="858" font-size="8.5" fill="#64748B" text-anchor="middle">Smart Applications</text>
  <text x="1540" y="871" font-size="8.5" fill="#64748B" text-anchor="middle">Reference Ontology</text>

  <!-- ============ LEGEND (centered row) ============ -->
  <rect x="300" y="912" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="322" y="923" font-size="10.5" fill="#475569">语法层 / 主链路</text>
  <rect x="470" y="912" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="492" y="923" font-size="10.5" fill="#475569">结构层</text>
  <rect x="600" y="912" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="622" y="923" font-size="10.5" fill="#475569">语义层 / MCP</text>
  <rect x="800" y="912" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="822" y="923" font-size="10.5" fill="#475569">早期标准</text>
  <line x1="930" y1="918" x2="962" y2="918" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="970" y="923" font-size="10.5" fill="#475569">贯穿 / 升级关系</text>
  <rect x="1130" y="912" width="16" height="12" rx="2" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="1152" y="923" font-size="10.5" fill="#475569">演进终点（高亮）</text>

  <!-- ============ CAPTION ============ -->
  <text x="900" y="970" font-size="10" fill="#94A3B8" text-anchor="middle">图9-6 互操作三层递进：语法层（适配网关）保证消息格式一致，结构层（物模型）统一字段与类型，</text>
  <text x="900" y="988" font-size="10" fill="#94A3B8" text-anchor="middle">语义层（本体 SSN/SOSA/SAREF）标注真实含义；演进线 oneM2M → W3C WoT TD → MCP：从“对接系统”走向“对接 AI”。</text>
  </svg>
</svg>