  <style>

<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图9-3 CoAP消息格式与选项示意</title>

  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">图9-3 CoAP消息格式与选项示意</title>
  <desc id="desc">读者应理解CoAP消息格式与选项示意中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图9-3 CoAP消息格式与选项示意</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解CoAP消息格式与选项示意中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
  <!-- HTTP部分 -->
  <rect x="200" y="150" width="1300" height="120" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="215" y="172" font-size="16" font-weight="bold" fill="#0F172A">HTTP部分</text>
  <text x="215" y="200" font-size="14" fill="#0F172A">GET /temperature HTTP/1.1</text>
  <text x="215" y="222" font-size="14" fill="#0F172A">Host: example.com</text>
  <text x="215" y="244" font-size="14" fill="#0F172A">User-Agent: CoAP-Client</text>
  <text x="215" y="266" font-size="14" fill="#0F172A">Accept: application/json</text>
  <!-- HTTP对比气泡 -->
  <rect x="1520" y="165" width="80" height="30" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1560" y="185" font-size="14" fill="#0F172A" text-anchor="middle">~300 bytes</text>

  <!-- CoAP部分 -->
  <text x="215" y="435" font-size="16" font-weight="bold" fill="#0F172A">CoAP部分</text>
  <!-- CoAP外框 -->
  <rect x="200" y="450" width="1300" height="100" rx="10" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <!-- 内部字段填充 -->
  <rect x="202" y="452" width="259" height="96" fill="#EFF6FF"/>
  <rect x="461" y="452" width="130" height="96" fill="#ECFDF5"/>
  <rect x="591" y="452" width="389" height="96" fill="#FFF7ED"/>
  <rect x="980" y="452" width="518" height="96" fill="#F8FAFC"/>
  <!-- 分割线 -->
  <line x1="461" y1="452" x2="461" y2="548" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="591" y1="452" x2="591" y2="548" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="980" y1="452" x2="980" y2="548" stroke="#2563EB" stroke-width="1.5"/>
  <!-- 字段文字 -->
  <text x="331" y="492" font-size="12" fill="#0F172A" text-anchor="middle">固定头部</text>
  <text x="331" y="510" font-size="12" fill="#0F172A" text-anchor="middle">4 Bytes</text>
  <text x="526" y="492" font-size="12" fill="#0F172A" text-anchor="middle">Token</text>
  <text x="526" y="510" font-size="12" fill="#0F172A" text-anchor="middle">2 Bytes</text>
  <text x="786" y="492" font-size="12" fill="#0F172A" text-anchor="middle">Options</text>
  <text x="786" y="510" font-size="12" fill="#0F172A" text-anchor="middle">6 Bytes</text>
  <text x="1239" y="492" font-size="12" fill="#0F172A" text-anchor="middle">Payload</text>
  <text x="1239" y="510" font-size="12" fill="#0F172A" text-anchor="middle">8 Bytes</text>
  <!-- CoAP对比气泡 -->
  <rect x="1520" y="465" width="80" height="30" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1560" y="485" font-size="14" fill="#0F172A" text-anchor="middle">~20 bytes</text>

  <!-- 箭头连线 -->
  <line x1="850" y1="270" x2="850" y2="450" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <!-- 箭头标签 -->
  <rect x="870" y="330" width="180" height="50" rx="5" fill="white" stroke="#64748B" stroke-width="1"/>
  <text x="880" y="350" font-size="12" fill="#0F172A">完成相同的</text>
  <text x="880" y="370" font-size="12" fill="#0F172A">“查询温度资源”功能</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">CoAP头部各字段用不同颜色区分：固定头部（蓝色）、Token（</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">CoAP固定头最小4字节，典型请求头在10–20字节之间（资料：[S1]）；HTTP即使最简请求也超过100字节。</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">architecture</div></div>

      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
