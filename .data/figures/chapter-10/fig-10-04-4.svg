<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
            <!-- Definitions -->
            <defs>
                <!-- Grid Pattern -->
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="0.5" opacity="0.6"/>
                </pattern>
                <!-- Solid Arrow (Slate) -->
                <marker id="arrow-solid" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#64748B" />
                </marker>
                <!-- Dashed Arrow (Red for escalation) -->
                <marker id="arrow-dashed-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626" />
                </marker>
                <!-- Drop Shadow Filter -->
                <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04"/>
                </filter>
            </defs>

            <!-- Background -->
            <rect width="1200" height="760" fill="#F8FAFC" />
            <rect width="1200" height="760" fill="url(#grid)" />

            <!-- Regions / Domain Boundaries -->
            <!-- 1. 事件检测域 -->
            <rect x="50" y="80" width="220" height="560" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4" />
            <text x="65" y="105" fill="#475569" font-size="14" font-weight="700">事件检测域</text>
            <text x="65" y="122" fill="#64748B" font-size="11">温度数据实时评估与条件判定</text>

            <!-- 2. 自动执行域 -->
            <rect x="290" y="80" width="340" height="560" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4" />
            <text x="305" y="105" fill="#475569" font-size="14" font-weight="700">自动执行域</text>
            <text x="305" y="122" fill="#64748B" font-size="11">AI推理、工单创建、通知分发</text>

            <!-- 3. 闭环验证域 -->
            <rect x="650" y="80" width="500" height="560" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4" />
            <text x="665" y="105" fill="#475569" font-size="14" font-weight="700">闭环验证域</text>
            <text x="665" y="122" fill="#64748B" font-size="11">工单状态跟踪与升级</text>

            <!-- Connections (Arrows - drawn first to be behind nodes) -->
            <!-- 1. 数据流入 -> 条件判定 -->
            <path d="M 150 380 L 150 430" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-solid)" />
            <text x="160" y="410" fill="#64748B" font-size="11">实时评估</text>

            <!-- 2. 条件判定 -> AI推理 (分支1) -->
            <path d="M 210 480 L 270 480 L 270 212 L 300 212" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-solid)" />
            <text x="275" y="345" fill="#64748B" font-size="11">条件满足</text>

            <!-- 3. 条件判定 -> 创建工单 (分支2) -->
            <path d="M 210 480 L 270 480 L 270 342 L 300 342" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-solid)" />
            <text x="245" y="415" fill="#64748B" font-size="11">条件满足</text>

            <!-- 4. 条件判定 -> 钉钉通知 (分支3) -->
            <path d="M 210 480 L 270 480 L 270 472 L 300 472" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-solid)" />
            <text x="275" y="490" fill="#64748B" font-size="11">条件满足</text>

            <!-- 5. 创建工单 -> 工单超时判定 -->
            <path d="M 470 342 L 720 342 L 720 350" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-solid)" />
            <text x="590" y="355" fill="#64748B" font-size="11">待处理状态</text>

            <!-- 6. 工单超时判定 -> 升级通知上级 (虚线) -->
            <path d="M 870 360 L 900 360 L 900 212 L 910 212" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed-red)" />
            <text x="905" y="290" fill="#DC2626" font-size="11" text-anchor="end">超时且持续超限</text>

            <!-- 7. 工单超时判定 -> 工单关闭 -->
            <path d="M 800 400 L 800 410 L 920 410 L 920 420" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-solid)" />
            <text x="860" y="420" fill="#64748B" font-size="11" text-anchor="middle">正常关闭</text>

            <!-- 8. 闭环虚线: 升级通知上级 -> 工单超时判定 -->
            <path d="M 920 212 L 800 212 L 800 310" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed-red)" />
            <text x="860" y="265" fill="#DC2626" font-size="11" text-anchor="middle">持续监控闭环</text>

            <!-- Nodes -->
            <!-- Node 1: 数据流入 (Edge/Data) -->
            <g filter="url(#shadow)">
                <rect x="80" y="310" width="140" height="70" rx="10" fill="#FFFFFF" />
                <rect x="80" y="310" width="140" height="70" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
                <text x="150" y="336" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">温度数据流入</text>
                <text x="150" y="356" fill="#475569" font-size="11" text-anchor="middle">位号持续更新</text>
            </g>

            <!-- Node 2: 条件判定 (Decision - Primary) -->
            <g filter="url(#shadow)">
                <path d="M 150 400 L 210 440 L 150 480 L 90 440 Z" fill="#FFFFFF" />
                <path d="M 150 400 L 210 440 L 150 480 L 90 440 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
                <text x="150" y="440" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">持续超限判定</text>
                <text x="150" y="458" fill="#475569" font-size="10" text-anchor="middle">&gt;80°C且窗口≥10s</text>
            </g>

            <!-- Node 3: AI推理 (AI/Intelligence) -->
            <g filter="url(#shadow)">
                <rect x="310" y="180" width="160" height="64" rx="10" fill="#FFFFFF" />
                <rect x="310" y="180" width="160" height="64" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
                <text x="390" y="206" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">调用AI推理</text>
                <text x="390" y="226" fill="#475569" font-size="11" text-anchor="middle">HTTP POST请求</text>
            </g>

            <!-- Node 4: 创建工单 (Primary) -->
            <g filter="url(#shadow)">
                <rect x="310" y="310" width="160" height="64" rx="10" fill="#FFFFFF" />
                <rect x="310" y="310" width="160" height="64" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
                <text x="390" y="336" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">创建维护工单</text>
                <text x="390" y="356" fill="#475569" font-size="11" text-anchor="middle">高优先级</text>
            </g>

            <!-- Node 5: 钉钉通知 (Cloud/External) -->
            <g filter="url(#shadow)">
                <rect x="310" y="440" width="160" height="64" rx="10" fill="#FFFFFF" />
                <rect x="310" y="440" width="160" height="64" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
                <text x="390" y="466" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">钉钉群通知</text>
                <text x="390" y="486" fill="#475569" font-size="11" text-anchor="middle">告警消息</text>
            </g>

            <!-- Node 6: 工单超时判定 (Decision - Escalation) -->
            <g filter="url(#shadow)">
                <path d="M 800 320 L 870 360 L 800 400 L 730 360 Z" fill="#FFFFFF" />
                <path d="M 800 320 L 870 360 L 800 400 L 730 360 Z" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
                <text x="800" y="358" fill="#0F172A" font-size="13" font-weight="600" text-anchor="middle">工单超时未关闭？</text>
                <text x="800" y="376" fill="#475569" font-size="10" text-anchor="middle">规则引擎订阅状态</text>
            </g>

            <!-- Node 7: 升级通知上级 (Security/Risk) -->
            <g filter="url(#shadow)">
                <rect x="920" y="180" width="140" height="64" rx="10" fill="#FFFFFF" />
                <rect x="920" y="180" width="140" height="64" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" />
                <text x="990" y="206" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">升级通知上级</text>
                <text x="990" y="226" fill="#475569" font-size="11" text-anchor="middle">升级告警级别</text>
            </g>

            <!-- Node 8: 工单关闭 (External/Terminal) -->
            <g filter="url(#shadow)">
                <rect x="920" y="420" width="140" height="64" rx="20" fill="#FFFFFF" />
                <rect x="920" y="420" width="140" height="64" rx="20" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
                <text x="990" y="446" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">工单关闭</text>
                <text x="990" y="466" fill="#475569" font-size="11" text-anchor="middle">流程结束</text>
            </g>

            <!-- Legend -->
            <g transform="translate(0, 0)">
                <rect x="320" y="640" width="560" height="100" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
                
                <!-- Legend Title -->
                <text x="340" y="660" fill="#0F172A" font-size="13" font-weight="700">图例</text>

                <!-- Legend Row 1: Node Types -->
                <!-- 1. 核心逻辑节点 -->
                <rect x="340" y="668" width="14" height="14" rx="3" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
                <text x="360" y="680" fill="#334155" font-size="12">核心逻辑节点</text>

                <!-- 2. AI/升级路径 -->
                <rect x="480" y="668" width="14" height="14" rx="3" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" />
                <text x="500" y="680" fill="#334155" font-size="12">AI/升级路径</text>

                <!-- 3. 流程终止节点 -->
                <rect x="620" y="668" width="14" height="14" rx="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
                <text x="640" y="680" fill="#334155" font-size="12">流程终止节点</text>

                <!-- Legend Row 2: Connection Types -->
                <!-- 1. 实线路径 -->
                <path d="M 340 698 L 354 698" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-solid)" />
                <text x="360" y="702" fill="#334155" font-size="12">稳定执行路径</text>

                <!-- 2. 虚线路径 -->
                <path d="M 480 698 L 494 698" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow-dashed-red)" />
                <text x="500" y="702" fill="#334155" font-size="12">有条件触发的升级路径</text>

                <!-- 3. 决策节点 -->
                <path d="M 620 692 L 627 698 L 620 704 L 613 698 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
                <text x="640" y="702" fill="#334155" font-size="12">决策节点</text>
            </g>
        </svg>