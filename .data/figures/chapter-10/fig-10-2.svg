<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="34.400" width="1152.000" height="691.200" viewBox="0 0 1600.000 960.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="960" fill="#FFFFFF"/>

  <!-- 标题区 -->
  <circle cx="64" cy="42" r="6" fill="#2563EB"/>
  <text x="82" y="50" fill="#0F172A" font-size="22" font-weight="700">图10-3 三类维护策略长期运营效率对比（示意）</text>
  <text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">对比三类维护策略长期运营中的成本趋势与设备可用率差异</text>
  <rect x="1426" y="28" width="108" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1480" y="46" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">ARCHITECTURE</text>

  <!-- 标题分隔线 -->
  <line x1="58" y1="103" x2="1542" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 策略演进主链路（趋势对比连接箭头，先绘置于节点下层） -->
  <line x1="552" y1="157" x2="696" y2="157" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="624" y="148" fill="#64748B" font-size="10" font-weight="500" text-anchor="middle">趋势对比</text>
  <line x1="902" y1="157" x2="1046" y2="157" stroke="#10B981" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-green)"/>
  <text x="974" y="148" fill="#10B981" font-size="10" font-weight="600" text-anchor="middle">趋势对比</text>

  <!-- 策略芯片节点 -->
  <rect x="350" y="130" width="200" height="54" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="450" y="156" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">被动维护</text>
  <text x="450" y="174" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">成本攀升 · 可用率骤降</text>

  <rect x="700" y="130" width="200" height="54" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="800" y="156" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">预防性维护</text>
  <text x="800" y="174" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">成本波动 · 可用率缓降</text>

  <rect x="1050" y="130" width="200" height="54" rx="6" fill="#10B981" fill-opacity="0.05" stroke="#10B981" stroke-width="2.5"/>
  <text x="1150" y="156" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">预测性维护</text>
  <text x="1150" y="174" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">成本稳定 · 可用率高位</text>

  <!-- 对比域边界框 -->
  <rect x="80" y="215" width="1440" height="600" rx="12" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="8 4"/>
  <text x="100" y="234" fill="#64748B" font-size="11" font-weight="600">三类维护策略长期运营效率对比域</text>

  <!-- 主链路标注框 + 连接器（指向预测性可用率折线） -->
  <rect x="540" y="250" width="340" height="42" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="710" y="268" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">预测性维护 · 成本-可靠性平衡优势</text>
  <text x="710" y="284" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">成本稳定低位 · 可用率长期维持高位</text>
  <line x1="710" y1="292" x2="710" y2="324" stroke="#10B981" stroke-width="1.5" marker-end="url(#ah-green)"/>

  <!-- 示意性说明 callout -->
  <rect x="1232" y="248" width="200" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1332" y="267" fill="#334155" font-size="10" font-weight="500" text-anchor="middle">示意性对比 · 非实际运营数据</text>

  <!-- 网格线（极淡） -->
  <line x1="180" y1="310" x2="1440" y2="310" stroke="#F1F5F9" stroke-width="0.5"/>
  <line x1="180" y1="525" x2="1440" y2="525" stroke="#F1F5F9" stroke-width="0.5"/>
  <line x1="180" y1="740" x2="1440" y2="740" stroke="#F1F5F9" stroke-width="0.5"/>

  <!-- 坐标轴 -->
  <line x1="180" y1="310" x2="180" y2="740" stroke="#94A3B8" stroke-width="1"/>
  <line x1="1440" y1="310" x2="1440" y2="740" stroke="#94A3B8" stroke-width="1"/>
  <line x1="180" y1="740" x2="1440" y2="740" stroke="#94A3B8" stroke-width="1"/>

  <!-- 左轴刻度（成本） -->
  <line x1="176" y1="310" x2="180" y2="310" stroke="#94A3B8" stroke-width="1"/>
  <line x1="176" y1="525" x2="180" y2="525" stroke="#94A3B8" stroke-width="1"/>
  <line x1="176" y1="740" x2="180" y2="740" stroke="#94A3B8" stroke-width="1"/>
  <text x="172" y="314" fill="#64748B" font-size="10" font-weight="500" text-anchor="end">高</text>
  <text x="172" y="529" fill="#64748B" font-size="10" font-weight="500" text-anchor="end">中</text>
  <text x="172" y="744" fill="#64748B" font-size="10" font-weight="500" text-anchor="end">低</text>
  <text x="180" y="300" fill="#475569" font-size="12" font-weight="700" text-anchor="start">成本</text>

  <!-- 右轴刻度（可用率） -->
  <line x1="1440" y1="310" x2="1444" y2="310" stroke="#94A3B8" stroke-width="1"/>
  <line x1="1440" y1="525" x2="1444" y2="525" stroke="#94A3B8" stroke-width="1"/>
  <line x1="1440" y1="740" x2="1444" y2="740" stroke="#94A3B8" stroke-width="1"/>
  <text x="1448" y="314" fill="#64748B" font-size="10" font-weight="500" text-anchor="start">高</text>
  <text x="1448" y="529" fill="#64748B" font-size="10" font-weight="500" text-anchor="start">中</text>
  <text x="1448" y="744" fill="#64748B" font-size="10" font-weight="500" text-anchor="start">低</text>
  <text x="1440" y="300" fill="#475569" font-size="12" font-weight="700" text-anchor="end">可用率</text>

  <!-- X 轴周期标签 -->
  <text x="285" y="758" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">T1</text>
  <text x="495" y="758" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">T2</text>
  <text x="705" y="758" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">T3</text>
  <text x="915" y="758" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">T4</text>
  <text x="1125" y="758" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">T5</text>
  <text x="1335" y="758" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">T6</text>
  <text x="810" y="788" fill="#475569" font-size="11" font-weight="500" text-anchor="middle">运行周期（持续运营时间跨度）</text>

  <!-- 成本条形图（18 根，3 策略 × 6 周期） -->
  <!-- T1 -->
  <rect x="227" y="685" width="36" height="55" rx="1" fill="#E11D48" fill-opacity="0.16" stroke="#E11D48" stroke-width="1.5"/>
  <rect x="267" y="645" width="36" height="95" rx="1" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="307" y="610" width="36" height="130" rx="1" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-width="2"/>
  <!-- T2 -->
  <rect x="437" y="640" width="36" height="100" rx="1" fill="#E11D48" fill-opacity="0.16" stroke="#E11D48" stroke-width="1.5"/>
  <rect x="477" y="600" width="36" height="140" rx="1" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="517" y="635" width="36" height="105" rx="1" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-width="2"/>
  <!-- T3 -->
  <rect x="647" y="575" width="36" height="165" rx="1" fill="#E11D48" fill-opacity="0.16" stroke="#E11D48" stroke-width="1.5"/>
  <rect x="687" y="630" width="36" height="110" rx="1" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="727" y="655" width="36" height="85" rx="1" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-width="2"/>
  <!-- T4 -->
  <rect x="857" y="500" width="36" height="240" rx="1" fill="#E11D48" fill-opacity="0.16" stroke="#E11D48" stroke-width="1.5"/>
  <rect x="897" y="570" width="36" height="170" rx="1" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="937" y="668" width="36" height="72" rx="1" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-width="2"/>
  <!-- T5 -->
  <rect x="1067" y="410" width="36" height="330" rx="1" fill="#E11D48" fill-opacity="0.16" stroke="#E11D48" stroke-width="1.5"/>
  <rect x="1107" y="610" width="36" height="130" rx="1" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="1147" y="674" width="36" height="66" rx="1" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-width="2"/>
  <!-- T6 -->
  <rect x="1277" y="330" width="36" height="410" rx="1" fill="#E11D48" fill-opacity="0.16" stroke="#E11D48" stroke-width="1.5"/>
  <rect x="1317" y="555" width="36" height="185" rx="1" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="1357" y="678" width="36" height="62" rx="1" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-width="2"/>

  <!-- 可用率折线（右轴，绘于条形之上） -->
  <polyline points="285,330 495,365 705,425 915,520 1125,620 1335,710" fill="none" stroke="#E11D48" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="285,335 495,360 705,390 915,425 1125,465 1335,500" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="285,318 495,322 705,326 915,330 1125,335 1335,340" fill="none" stroke="#10B981" stroke-width="2.8" stroke-dasharray="9 3 2 3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 折线端点小圆点 -->
  <circle cx="285" cy="330" r="2.5" fill="#E11D48"/>
  <circle cx="1335" cy="710" r="2.5" fill="#E11D48"/>
  <circle cx="285" cy="335" r="2.5" fill="#2563EB"/>
  <circle cx="1335" cy="500" r="2.5" fill="#2563EB"/>
  <circle cx="285" cy="318" r="3" fill="#10B981"/>
  <circle cx="1335" cy="340" r="3" fill="#10B981"/>

  <!-- 图例区（置于边界框之外） -->
  <line x1="58" y1="835" x2="1542" y2="835" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="852" fill="#475569" font-size="11" font-weight="700">图例</text>

  <!-- 条形图例 -->
  <rect x="120" y="858" width="14" height="10" rx="1" fill="#E11D48" fill-opacity="0.16" stroke="#E11D48" stroke-width="1.5"/>
  <text x="142" y="867" fill="#64748B" font-size="11" font-weight="600">被动维护成本（条形）</text>
  <rect x="400" y="858" width="14" height="10" rx="1" fill="#2563EB" fill-opacity="0.16" stroke="#2563EB" stroke-width="1.5"/>
  <text x="422" y="867" fill="#64748B" font-size="11" font-weight="600">预防性维护成本（条形）</text>
  <rect x="700" y="858" width="14" height="10" rx="1" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-width="2"/>
  <text x="722" y="867" fill="#64748B" font-size="11" font-weight="600">预测性维护成本（条形）</text>

  <!-- 折线图例 -->
  <line x1="120" y1="893" x2="148" y2="893" stroke="#E11D48" stroke-width="1.8"/>
  <text x="156" y="897" fill="#64748B" font-size="11" font-weight="600">被动维护可用率（实线）</text>
  <line x1="400" y1="893" x2="428" y2="893" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="436" y="897" fill="#64748B" font-size="11" font-weight="600">预防性维护可用率（虚线）</text>
  <line x1="700" y1="893" x2="728" y2="893" stroke="#10B981" stroke-width="2.8" stroke-dasharray="9 3 2 3"/>
  <text x="736" y="897" fill="#64748B" font-size="11" font-weight="600">预测性维护可用率（点划线）</text>

  <!-- caption -->
  <text x="800" y="935" fill="#94A3B8" font-size="10" text-anchor="middle">图10-3 三类维护策略长期运营效率对比（示意）。被动维护成本快速攀升、可用率骤降；预防性维护成本周期性波动、可用率缓慢下滑；预测性维护成本稳定低位、可用率长期维持高位。</text>
  </svg>
</svg>