<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图5-5 降采样与冷热分层：数据生命周期</title>
  <desc id="desc">原始高精度数据经 CQ 多级降采样（分钟/小时/天）后数据量逐级缩减，并按访问频率分层到热（SSD）/温/冷（对象存储 Parquet）存储。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="66.400" width="1152.000" height="627.200" viewBox="0 0 1800.000 980.000" preserveAspectRatio="xMidYMid meet">
<title>图5-5 降采样与冷热分层：数据生命周期</title>
  <desc>原始高精度数据经 CQ 多级降采样（分钟/小时/天）后数据量逐级缩减，并按访问频率分层到热（SSD）/温/冷（对象存储 Parquet）存储。</desc>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>

    <clipPath id="cyl1-clip"><path d="M 135,200 L 135,440 A 95,22 0 0 0 325,440 L 325,200 A 95,22 0 0 0 135,200 Z"/></clipPath>
    <clipPath id="cyl2-clip"><path d="M 545,200 L 545,440 A 95,22 0 0 0 735,440 L 735,200 A 95,22 0 0 0 545,200 Z"/></clipPath>
    <clipPath id="cyl3-clip"><path d="M 955,200 L 955,440 A 95,22 0 0 0 1145,440 L 1145,200 A 95,22 0 0 0 955,200 Z"/></clipPath>
    <clipPath id="cyl4-clip"><path d="M 1365,200 L 1365,440 A 95,22 0 0 0 1555,440 L 1555,200 A 95,22 0 0 0 1365,200 Z"/></clipPath>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="980" fill="#FFFFFF"/>

  <!-- ========== Title ========== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图5-5 降采样与冷热分层：数据生命周期</text>
  <text x="84" y="73" font-size="12" fill="#64748B">Downsampling &amp; Hot-Warm-Cold Tiering · Data Lifecycle</text>
  <rect x="1610" y="24" width="130" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1675" y="43" font-size="11" font-weight="600" letter-spacing="1.5" fill="#64748B" text-anchor="middle">DATAFLOW</text>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0"/>

  <!-- ========== Storage tier bands ========== -->
  <rect x="110" y="150" width="240" height="540" rx="12" fill="none" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="230" y="172" font-size="12" font-weight="700" fill="#E11D48" text-anchor="middle">热存储 · SSD</text>

  <rect x="525" y="150" width="620" height="540" rx="12" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="835" y="172" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">温存储 · 标准磁盘</text>

  <rect x="1345" y="150" width="230" height="540" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="1460" y="172" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">冷存储 · 对象存储</text>

  <!-- ========== Cylinders (data buckets) — fill level encodes relative volume ========== -->
  <!-- Cylinder 1: Raw / Hot (100%) cx=230 -->
  <g>
    <rect x="135" y="200" width="190" height="240" fill="#E11D48" fill-opacity="0.13" clip-path="url(#cyl1-clip)"/>
    <path d="M 135,200 L 135,440 A 95,22 0 0 0 325,440 L 325,200" fill="none" stroke="#E11D48" stroke-width="2"/>
    <ellipse cx="230" cy="200" rx="95" ry="22" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
    <text x="230" y="298" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">原始数据</text>
    <text x="230" y="325" font-size="11" font-weight="600" fill="#E11D48" text-anchor="middle">10 秒级</text>
    <text x="230" y="350" font-size="9" fill="#94A3B8" text-anchor="middle">Raw Metrics</text>
  </g>

  <!-- Cylinder 2: Minute / Warm (~45%) cx=640 -->
  <g>
    <rect x="545" y="332" width="190" height="108" fill="#F59E0B" fill-opacity="0.16" clip-path="url(#cyl2-clip)"/>
    <path d="M 545,200 L 545,440 A 95,22 0 0 0 735,440 L 735,200" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <ellipse cx="640" cy="200" rx="95" ry="22" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="640" y="298" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">分钟聚合</text>
    <text x="640" y="325" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle">1 分钟级</text>
    <text x="640" y="350" font-size="9" fill="#94A3B8" text-anchor="middle">CQ 1m</text>
  </g>

  <!-- Cylinder 3: Hour / Warm (~18%) cx=1050 -->
  <g>
    <rect x="955" y="397" width="190" height="43" fill="#F59E0B" fill-opacity="0.16" clip-path="url(#cyl3-clip)"/>
    <path d="M 955,200 L 955,440 A 95,22 0 0 0 1145,440 L 1145,200" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <ellipse cx="1050" cy="200" rx="95" ry="22" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="1050" y="298" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">小时聚合</text>
    <text x="1050" y="325" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle">1 小时级</text>
    <text x="1050" y="350" font-size="9" fill="#94A3B8" text-anchor="middle">CQ 1h</text>
  </g>

  <!-- Cylinder 4: Day / Cold (~8%) cx=1460 -->
  <g>
    <rect x="1365" y="421" width="190" height="19" fill="#2563EB" fill-opacity="0.16" clip-path="url(#cyl4-clip)"/>
    <path d="M 1365,200 L 1365,440 A 95,22 0 0 0 1555,440 L 1555,200" fill="none" stroke="#2563EB" stroke-width="2"/>
    <ellipse cx="1460" cy="200" rx="95" ry="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1460" y="298" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">天聚合</text>
    <text x="1460" y="325" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">1 天级</text>
    <text x="1460" y="350" font-size="9" fill="#94A3B8" text-anchor="middle">CQ 1d · Parquet</text>
  </g>

  <!-- ========== Pipeline arrows (CQ aggregation, main link) ========== -->
  <line x1="335" y1="320" x2="539" y2="320" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <line x1="745" y1="320" x2="949" y2="320" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <line x1="1155" y1="320" x2="1359" y2="320" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>

  <text x="437" y="305" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">CQ 分钟聚合</text>
  <text x="437" y="342" font-size="9" fill="#64748B" text-anchor="middle">10s → 1min</text>

  <text x="847" y="305" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">CQ 小时聚合</text>
  <text x="847" y="342" font-size="9" fill="#64748B" text-anchor="middle">1min → 1h</text>

  <text x="1257" y="305" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">CQ 天聚合</text>
  <text x="1257" y="342" font-size="9" fill="#64748B" text-anchor="middle">1h → 1d</text>

  <!-- ========== Per-bucket info blocks ========== -->
  <!-- Bucket 1 -->
  <text x="230" y="462" font-size="9" fill="#94A3B8" text-anchor="middle">相对数据量</text>
  <rect x="160" y="478" width="140" height="14" rx="3" fill="#EFF2F7"/>
  <rect x="160" y="478" width="140" height="14" rx="3" fill="#E11D48" fill-opacity="0.85"/>
  <text x="230" y="513" font-size="11" font-weight="700" fill="#E11D48" text-anchor="middle">基准 100%</text>
  <text x="230" y="542" font-size="9" fill="#94A3B8" text-anchor="middle">保留窗口</text>
  <text x="230" y="562" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">7 天</text>
  <text x="230" y="588" font-size="9" fill="#94A3B8" text-anchor="middle">响应延迟</text>
  <text x="230" y="607" font-size="11" fill="#475569" text-anchor="middle">毫秒级</text>
  <text x="230" y="640" font-size="9" fill="#64748B" text-anchor="middle">故障回放 · 实时仪表盘</text>

  <!-- Bucket 2 -->
  <text x="640" y="462" font-size="9" fill="#94A3B8" text-anchor="middle">相对数据量</text>
  <rect x="570" y="478" width="140" height="14" rx="3" fill="#EFF2F7"/>
  <rect x="570" y="478" width="63" height="14" rx="3" fill="#F59E0B" fill-opacity="0.85"/>
  <text x="640" y="513" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="middle">显著减少</text>
  <text x="640" y="542" font-size="9" fill="#94A3B8" text-anchor="middle">保留窗口</text>
  <text x="640" y="562" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">30 天</text>
  <text x="640" y="588" font-size="9" fill="#94A3B8" text-anchor="middle">响应延迟</text>
  <text x="640" y="607" font-size="11" fill="#475569" text-anchor="middle">十毫秒级</text>
  <text x="640" y="640" font-size="9" fill="#64748B" text-anchor="middle">短时趋势 · 告警</text>

  <!-- Bucket 3 -->
  <text x="1050" y="462" font-size="9" fill="#94A3B8" text-anchor="middle">相对数据量</text>
  <rect x="980" y="478" width="140" height="14" rx="3" fill="#EFF2F7"/>
  <rect x="980" y="478" width="25" height="14" rx="3" fill="#F59E0B" fill-opacity="0.85"/>
  <text x="1050" y="513" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="middle">大幅降低</text>
  <text x="1050" y="542" font-size="9" fill="#94A3B8" text-anchor="middle">保留窗口</text>
  <text x="1050" y="562" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">1 年</text>
  <text x="1050" y="588" font-size="9" fill="#94A3B8" text-anchor="middle">响应延迟</text>
  <text x="1050" y="607" font-size="11" fill="#475569" text-anchor="middle">百毫秒级</text>
  <text x="1050" y="640" font-size="9" fill="#64748B" text-anchor="middle">日报 · 周报</text>

  <!-- Bucket 4 -->
  <text x="1460" y="462" font-size="9" fill="#94A3B8" text-anchor="middle">相对数据量</text>
  <rect x="1390" y="478" width="140" height="14" rx="3" fill="#EFF2F7"/>
  <rect x="1390" y="478" width="11" height="14" rx="3" fill="#2563EB" fill-opacity="0.85"/>
  <text x="1460" y="513" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">极小</text>
  <text x="1460" y="542" font-size="9" fill="#94A3B8" text-anchor="middle">保留窗口</text>
  <text x="1460" y="562" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">5 年+</text>
  <text x="1460" y="588" font-size="9" fill="#94A3B8" text-anchor="middle">响应延迟</text>
  <text x="1460" y="607" font-size="11" fill="#475569" text-anchor="middle">秒级</text>
  <text x="1460" y="640" font-size="9" fill="#64748B" text-anchor="middle">年度趋势 · 审计归档</text>

  <!-- ========== Legend ========== -->
  <line x1="60" y1="708" x2="1740" y2="708" stroke="#E2E8F0"/>

  <rect x="110" y="742" width="18" height="14" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="136" y="754" font-size="11" fill="#334155">热存储 SSD</text>

  <rect x="290" y="742" width="18" height="14" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="316" y="754" font-size="11" fill="#334155">温存储 标准磁盘</text>

  <rect x="500" y="742" width="18" height="14" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="526" y="754" font-size="11" fill="#334155">冷存储 对象存储 Parquet</text>

  <line x1="820" y1="749" x2="852" y2="749" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="862" y="754" font-size="11" fill="#334155">CQ 连续查询聚合（主链路降采样）</text>

  <rect x="1180" y="744" width="34" height="10" rx="2" fill="#EFF2F7"/>
  <rect x="1180" y="744" width="10" height="10" rx="2" fill="#64748B" fill-opacity="0.85"/>
  <text x="1222" y="754" font-size="11" fill="#334155">柱长 / 桶内液位 ≈ 相对数据量</text>

  <text x="1720" y="754" font-size="10" fill="#94A3B8" text-anchor="end">数据量比为常见压缩比的定性描述</text>

  <!-- ========== Callout (main conclusion) ========== -->
  <rect x="110" y="790" width="1580" height="92" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="110" y="790" width="5" height="92" fill="#2563EB"/>
  <text x="140" y="820" font-size="12" font-weight="700" fill="#0F172A">主结论</text>
  <text x="140" y="846" font-size="11" fill="#334155">· 每经过一级 CQ 聚合，数据量约下降一个数量级（基准 → 显著减少 → 大幅降低 → 极小）。</text>
  <text x="140" y="868" font-size="11" fill="#334155">· 原始层用 SSD 保毫秒级响应，支撑实时仪表盘与故障回放；天级冷数据归档为 Parquet 落对象存储，存储成本可下降一个数量级以上。</text>

  <!-- ========== Caption ========== -->
  <text x="900" y="945" font-size="10" fill="#94A3B8" text-anchor="middle">图5-5  原始层保留短窗口用于故障回放，分钟层支撑短时趋势，小时层服务日报，天层服务年度趋势；热存储（SSD）毫秒级响应仪表盘，冷数据归档为 Parquet 到对象存储大幅降低成本。</text>
  </svg>
</svg>