<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="900" fill="#FFFFFF"/>

  <!-- ===== Title ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图5-4 降采样数据流程与数据量对比（假设场景）</text>
  <text x="84" y="70" font-size="12" fill="#64748B">三级连续查询驱动的逐级聚合 · 数据量定性压缩示意</text>
  <g>
    <rect x="1640" y="24" width="120" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1700" y="43" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">DATAFLOW</text>
  </g>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0"/>

  <!-- ===== Region: data domain ===== -->
  <rect x="60" y="140" width="1680" height="400" rx="12" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="8 4"/>
  <g>
    <rect x="76" y="150" width="290" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED"/>
    <text x="221" y="167" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">数据资产域 · 数据沉淀与治理边界</text>
  </g>

  <!-- ===== Cylinders (databases) ===== -->
  <!-- c1 原始数据桶 cx=240 -->
  <g>
    <path d="M150,250 L150,360 A90,18 0 0 0 330,360 L330,250 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <path d="M150,360 A90,18 0 0 1 330,360" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <ellipse cx="240" cy="250" rx="90" ry="18" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="240" y="300" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">原始数据桶</text>
    <text x="240" y="322" font-size="10" fill="#64748B" text-anchor="middle">10秒级 · 短保留</text>
  </g>
  <!-- c2 分钟聚合桶 cx=600 -->
  <g>
    <path d="M510,250 L510,360 A90,18 0 0 0 690,360 L690,250 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <path d="M510,360 A90,18 0 0 1 690,360" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <ellipse cx="600" cy="250" rx="90" ry="18" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="600" y="300" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">分钟聚合桶</text>
    <text x="600" y="322" font-size="10" fill="#64748B" text-anchor="middle">每分钟均值</text>
  </g>
  <!-- c3 小时聚合桶 cx=960 -->
  <g>
    <path d="M870,250 L870,360 A90,18 0 0 0 1050,360 L1050,250 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <path d="M870,360 A90,18 0 0 1 1050,360" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <ellipse cx="960" cy="250" rx="90" ry="18" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="960" y="300" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">小时聚合桶</text>
    <text x="960" y="322" font-size="10" fill="#64748B" text-anchor="middle">每小时均值</text>
  </g>
  <!-- c4 天聚合桶 cx=1320 -->
  <g>
    <path d="M1230,250 L1230,360 A90,18 0 0 0 1410,360 L1410,250 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <path d="M1230,360 A90,18 0 0 1 1410,360" fill="none" stroke="#7C3AED" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <ellipse cx="1320" cy="250" rx="90" ry="18" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="1320" y="300" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">天聚合桶</text>
    <text x="1320" y="322" font-size="10" fill="#64748B" text-anchor="middle">每天均值</text>
  </g>

  <!-- ===== CQ main-link arrows (blue, highlighted) ===== -->
  <line x1="332" y1="332" x2="506" y2="332" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="419" y="322" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">CQ：每分钟聚合</text>

  <line x1="692" y1="332" x2="866" y2="332" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="779" y="322" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">CQ：每小时聚合</text>

  <line x1="1052" y1="332" x2="1226" y2="332" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="1139" y="322" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">CQ：每天聚合</text>

  <!-- ===== Volume bars + descriptors ===== -->
  <!-- c1 -->
  <rect x="140" y="390" width="200" height="14" rx="3" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="240" y="426" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">原始基准</text>
  <!-- c2 -->
  <rect x="542" y="390" width="116" height="14" rx="3" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="600" y="426" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">显著减少</text>
  <!-- c3 -->
  <rect x="929" y="390" width="62" height="14" rx="3" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="960" y="426" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">大幅降低</text>
  <!-- c4 -->
  <rect x="1307" y="390" width="26" height="14" rx="3" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
  <text x="1320" y="426" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">极小占比</text>

  <!-- trend hint -->
  <text x="900" y="470" font-size="10" fill="#94A3B8" text-anchor="middle">数据量随聚合层级递减 · 定性示意，非精确数值</text>

  <!-- ===== Application lane (query dashboard) ===== -->
  <rect x="60" y="560" width="1680" height="56" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 4"/>
  <g>
    <rect x="76" y="572" width="84" height="32" rx="4" fill="#FFFFFF" stroke="#64748B"/>
    <text x="118" y="792" font-size="0" fill="#FFFFFF"/>
    <text x="118" y="592" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">应用层</text>
  </g>
  <text x="900" y="593" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">查询仪表盘 · 直接读取 分钟 / 小时 / 天 聚合桶（原始桶不对外查询）</text>

  <!-- dashed query connectors from aggregation buckets to app lane -->
  <line x1="600" y1="436" x2="600" y2="558" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <line x1="960" y1="436" x2="960" y2="558" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <line x1="1320" y1="436" x2="1320" y2="558" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>

  <!-- ===== Legend ===== -->
  <line x1="60" y1="648" x2="1740" y2="648" stroke="#E2E8F0"/>
  <text x="60" y="674" font-size="11" font-weight="700" fill="#475569">图例</text>

  <g transform="translate(120,664)">
    <ellipse cx="14" cy="6" rx="14" ry="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="0" y="6" width="28" height="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="14" cy="18" rx="14" ry="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="40" y="15" font-size="11" fill="#475569">各级数据桶（data 域）</text>
  </g>

  <g transform="translate(360,664)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
    <text x="52" y="14" font-size="11" fill="#475569">连续查询（CQ）驱动自动化聚合</text>
  </g>

  <g transform="translate(680,664)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <text x="52" y="14" font-size="11" fill="#475569">应用层查询读取路径（虚线）</text>
  </g>

  <g transform="translate(1000,664)">
    <rect x="0" y="4" width="44" height="12" rx="2" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
    <rect x="48" y="4" width="26" height="12" rx="2" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
    <rect x="78" y="4" width="14" height="12" rx="2" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1"/>
    <text x="100" y="14" font-size="11" fill="#475569">体积条 · 数据量相对大小（左→右递减）</text>
  </g>

  <!-- ===== Callout ===== -->
  <g>
    <rect x="60" y="710" width="1680" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="80" y="734" font-size="11" font-weight="700" fill="#334155">分层保留与时效性</text>
    <text x="80" y="754" font-size="11" fill="#334155">· 原始层：按天保留，用于故障回放与根因定位（高精度、高成本）。</text>
    <text x="80" y="772" font-size="11" fill="#334155">· 分钟层 → 短时趋势告警；小时层 → 日报与看板；天层 → 年度/季度趋势对比（长保留、极小占用）。</text>
    <text x="900" y="772" font-size="11" fill="#94A3B8" text-anchor="middle"></text>
  </g>

  <!-- ===== Caption ===== -->
  <text x="900" y="822" font-size="10" fill="#94A3B8" text-anchor="middle">图5-4 假设场景：中等规模工厂设备上报温度与湿度。三级降采样逐级压缩数据量，不同层级服务不同时效性需求；</text>
  <text x="900" y="838" font-size="10" fill="#94A3B8" text-anchor="middle">体积条比例为基于常见压缩比的定性描述，实际值因设备数、上报频率、字段数量而异。</text>
  </svg>
</svg>