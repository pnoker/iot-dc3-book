<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="72.800" width="1152.000" height="614.400" viewBox="0 0 1800.000 960.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="960" fill="#FFFFFF"/>

  <!-- ===== Header ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" font-size="22" font-weight="700" fill="#0F172A">十字路口强化学习框架</text>
  <text x="82" y="68" font-size="12" fill="#64748B">DQN 智能体与环境交互闭环：状态观测 · 动作执行 · 奖励反馈 · 经验回放 · 参数更新</text>
  <rect x="1670" y="26" width="96" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1718" y="44" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">FLOWCHART</text>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Region: Environment Domain ===== -->
  <rect x="60" y="140" width="760" height="650" rx="12" fill="#F0F8FF" fill-opacity="0.5" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="76" y="152" width="84" height="24" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
  <text x="118" y="169" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">环境域</text>
  <text x="170" y="169" font-size="11" fill="#64748B">物理路口与信号灯执行边界</text>

  <!-- ===== Region: Intelligence Domain ===== -->
  <rect x="840" y="140" width="900" height="650" rx="12" fill="#FFF8DC" fill-opacity="0.45" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="856" y="152" width="108" height="24" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="910" y="169" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">智能决策域</text>
  <text x="976" y="169" font-size="11" fill="#64748B">模型训练与推理边界</text>

  <!-- ===== Environment components ===== -->
  <!-- 十字路口环境 -->
  <rect x="290" y="180" width="240" height="62" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="410" y="207" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">十字路口环境</text>
  <text x="410" y="227" font-size="10" fill="#64748B" text-anchor="middle">路网拓扑 · 车流 · 排队</text>

  <!-- 车流生成 (decision) -->
  <polygon points="410,285 488,330 410,375 332,330" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="410" y="327" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">车流生成</text>
  <text x="410" y="344" font-size="9" fill="#64748B" text-anchor="middle">到达模型</text>

  <!-- 信号灯执行器 -->
  <rect x="290" y="460" width="240" height="62" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="410" y="487" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">信号灯执行器</text>
  <text x="410" y="507" font-size="10" fill="#64748B" text-anchor="middle">相位切换与计时</text>

  <!-- ===== Intelligence components ===== -->
  <!-- 状态构建 -->
  <rect x="930" y="180" width="240" height="62" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1050" y="207" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">状态构建</text>
  <text x="1050" y="227" font-size="10" fill="#64748B" text-anchor="middle">排队 · 相位时间 · 时段</text>

  <!-- 在线Q网络 -->
  <rect x="930" y="300" width="240" height="62" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1050" y="327" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">在线 Q 网络</text>
  <text x="1050" y="347" font-size="10" fill="#64748B" text-anchor="middle">全连接层 · 输出 Q 值</text>

  <!-- 目标Q网络 -->
  <rect x="1330" y="300" width="240" height="62" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1450" y="327" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">目标 Q 网络</text>
  <text x="1450" y="347" font-size="10" fill="#64748B" text-anchor="middle">定期软更新参数</text>

  <!-- 经验回放缓冲区 (database cylinder) -->
  <path d="M 930 440 a 120 12 0 0 0 240 0 L 1170 530 a 120 12 0 0 1 -240 0 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <ellipse cx="1050" cy="440" rx="120" ry="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1050" y="483" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">经验回放缓冲区</text>
  <text x="1050" y="503" font-size="10" fill="#64748B" text-anchor="middle">(S, a, r, S′) 四元组</text>

  <!-- 权重更新 (decision) -->
  <polygon points="1050,572 1140,620 1050,668 960,620" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1050" y="617" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">权重更新</text>
  <text x="1050" y="634" font-size="9" fill="#64748B" text-anchor="middle">小批量 · TD 误差</text>

  <!-- ===== Connections ===== -->
  <!-- 1. 状态S_t : 十字路口环境 -> 状态构建 (blue solid, main) -->
  <line x1="530" y1="211" x2="924" y2="211" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="700" y="196" width="74" height="16" rx="2" fill="#FFFFFF"/>
  <text x="737" y="208" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">状态 S_t</text>

  <!-- 2. 状态构建 -> 在线Q网络 (blue solid) -->
  <line x1="1050" y1="242" x2="1050" y2="294" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1060" y="272" font-size="11" fill="#475569">输入状态</text>

  <!-- 3. 动作a_t : 在线Q网络 -> 信号灯执行器 (blue solid, main) -->
  <path d="M 930 340 L 820 340 L 820 491 L 536 491" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="640" y="476" width="74" height="16" rx="2" fill="#FFFFFF"/>
  <text x="677" y="488" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">动作 a_t</text>

  <!-- 4. 奖励r_t : 十字路口环境 -> 经验回放 (orange dashed) -->
  <path d="M 530 225 L 750 225 L 750 485 L 924 485" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <rect x="600" y="210" width="74" height="16" rx="2" fill="#FFFFFF"/>
  <text x="637" y="222" font-size="11" font-weight="600" fill="#D97706" text-anchor="middle">奖励 r_t</text>

  <!-- 5. 经验回放 -> 权重更新 (blue solid, 采样) -->
  <line x1="1050" y1="542" x2="1050" y2="566" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1060" y="560" font-size="11" fill="#475569">采样小批量</text>

  <!-- 6. 权重更新 -> 在线Q网络 (orange dashed, 梯度更新) -->
  <path d="M 960 620 L 888 620 L 888 331 L 924 331" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-orange)"/>
  <rect x="846" y="468" width="74" height="16" rx="2" fill="#FFFFFF"/>
  <text x="883" y="480" font-size="11" font-weight="600" fill="#D97706" text-anchor="middle">梯度更新</text>

  <!-- 7. 在线Q网络 -> 目标Q网络 (gray dashed, 每C步复制) -->
  <line x1="1170" y1="331" x2="1324" y2="331" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1247" y="323" font-size="11" fill="#64748B" text-anchor="middle">每 C 步参数复制</text>

  <!-- 8. 车流生成 -> 十字路口环境 (green solid, internal) -->
  <line x1="410" y1="285" x2="410" y2="246" stroke="#10B981" stroke-width="1.5" marker-end="url(#ah-green)"/>
  <text x="420" y="268" font-size="10" fill="#10B981">注入车流</text>

  <!-- ===== Callouts ===== -->
  <rect x="60" y="808" width="540" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="76" y="828" font-size="11" font-weight="700" fill="#2563EB">状态 S_t</text>
  <text x="76" y="844" font-size="11" fill="#334155">排队长度 + 相位剩余时间 + 时段编码，是动作决策的全部依据。</text>

  <rect x="620" y="808" width="540" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="636" y="828" font-size="11" font-weight="700" fill="#7C3AED">经验回放</text>
  <text x="636" y="844" font-size="11" fill="#334155">切断样本时间相关性，使在线 Q 网络训练更稳定。</text>

  <rect x="1180" y="808" width="560" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1196" y="828" font-size="11" font-weight="700" fill="#F59E0B">目标 Q 网络</text>
  <text x="1196" y="844" font-size="11" fill="#334155">为 TD 误差提供固定目标，避免训练震荡。</text>

  <!-- ===== Legend ===== -->
  <line x1="60" y1="876" x2="1740" y2="876" stroke="#E2E8F0" stroke-width="1"/>
  <text x="60" y="898" font-size="11" font-weight="700" fill="#475569">图例</text>

  <line x1="120" y1="911" x2="152" y2="911" stroke="#2563EB" stroke-width="2"/>
  <polygon points="148,907 158,911 148,915" fill="#2563EB"/>
  <text x="166" y="915" font-size="11" fill="#475569">蓝色实线 — 状态 / 动作主交互与训练链路</text>

  <line x1="540" y1="911" x2="572" y2="911" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="568,907 578,911 568,915" fill="#F59E0B"/>
  <text x="586" y="915" font-size="11" fill="#475569">橙色虚线 — 奖励反馈与梯度回传</text>

  <line x1="930" y1="911" x2="962" y2="911" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="958,907 968,911 958,915" fill="#64748B"/>
  <text x="976" y="915" font-size="11" fill="#475569">灰色虚线 — 目标网络周期同步</text>

  <rect x="1300" y="905" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="1322" y="915" font-size="11" fill="#475569">环境域</text>
  <rect x="1390" y="905" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1412" y="915" font-size="11" fill="#475569">决策域</text>
  <rect x="1486" y="905" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1508" y="915" font-size="11" fill="#475569">数据存储</text>

  <!-- ===== Caption ===== -->
  <text x="900" y="948" font-size="10" fill="#94A3B8" text-anchor="middle">图11-8 十字路口强化学习框架图。RL 智能体通过状态观测、动作执行、奖励反馈及经验回放训练 DQN 网络的闭环过程。</text>
  </svg>
</svg>