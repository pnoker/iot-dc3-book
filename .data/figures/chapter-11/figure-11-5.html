<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>城市物联网百万级接入系统架构图</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="85.600" width="1152.000" height="588.800" viewBox="0 0 1800.000 920.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="920" fill="#FFFFFF"/>

  <!-- ===== Title ===== -->
  <circle cx="64" cy="42" r="6" fill="#2563EB"/>
  <text x="88" y="48" font-size="22" font-weight="700" fill="#0F172A">城市物联网百万级接入系统架构图</text>
  <text x="88" y="72" font-size="12" fill="#64748B">百万级设备接入拓扑 · 主链路 · 责任边界 · 水平扩展</text>
  <rect x="1640" y="26" width="130" height="32" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1705" y="46" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">ARCHITECTURE</text>
  <line x1="64" y1="103" x2="1736" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Region boundaries ===== -->
  <!-- edge domain -->
  <rect x="90" y="140" width="280" height="560" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="106" y="128" width="150" height="24" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  <text x="181" y="145" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">设备与边缘域</text>
  <text x="106" y="180" font-size="10" fill="#64748B">现场异构资源边界</text>

  <!-- access / buffer region -->
  <rect x="400" y="140" width="620" height="560" rx="12" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="416" y="128" width="150" height="24" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
  <text x="491" y="145" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="middle">接入与缓冲层</text>
  <text x="416" y="180" font-size="10" fill="#64748B">连接分配 · 消息洪峰削峰</text>

  <!-- processing / storage region -->
  <rect x="1060" y="140" width="660" height="560" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="1076" y="128" width="150" height="24" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="1151" y="145" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">处理与存储层</text>
  <text x="1076" y="180" font-size="10" fill="#64748B">实时计算 · 数据沉淀 · 业务交付</text>

  <!-- ===== Devices (green circles) ===== -->
  <g>
    <circle cx="230" cy="300" r="44" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
    <text x="230" y="298" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">灯杆</text>
    <text x="230" y="316" font-size="9" fill="#64748B" text-anchor="middle">Lighting</text>

    <circle cx="230" cy="430" r="44" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
    <text x="230" y="428" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">车载</text>
    <text x="230" y="446" font-size="9" fill="#64748B" text-anchor="middle">Vehicle</text>

    <circle cx="230" cy="560" r="44" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
    <text x="230" y="558" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">RSU</text>
    <text x="230" y="576" font-size="9" fill="#64748B" text-anchor="middle">路侧单元</text>

    <text x="230" y="650" font-size="10" fill="#94A3B8" text-anchor="middle">×10⁶ 终端</text>
  </g>

  <!-- ===== Access layer cards ===== -->
  <!-- 负载均衡器 -->
  <rect x="425" y="390" width="150" height="90" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="500" y="420" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">负载均衡器</text>
  <text x="500" y="442" font-size="10" fill="#64748B" text-anchor="middle">Nginx / LVS</text>
  <text x="500" y="462" font-size="9" fill="#94A3B8" text-anchor="middle">IP哈希 · 会话保持</text>

  <!-- MQTT Broker 集群 -->
  <rect x="625" y="390" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="710" y="420" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">MQTT Broker集群</text>
  <text x="710" y="442" font-size="10" fill="#64748B" text-anchor="middle">EMQX</text>
  <text x="710" y="462" font-size="9" fill="#94A3B8" text-anchor="middle">水平扩展 · 共享订阅</text>

  <!-- 消息队列 -->
  <rect x="845" y="390" width="150" height="90" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="920" y="420" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">消息队列</text>
  <text x="920" y="442" font-size="10" fill="#64748B" text-anchor="middle">Kafka</text>
  <text x="920" y="462" font-size="9" fill="#94A3B8" text-anchor="middle">分区 · 削峰</text>

  <!-- ===== Processing layer ===== -->
  <!-- 流处理引擎 -->
  <rect x="1090" y="290" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1175" y="320" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">流处理引擎</text>
  <text x="1175" y="342" font-size="10" fill="#64748B" text-anchor="middle">Flink</text>
  <text x="1175" y="362" font-size="9" fill="#94A3B8" text-anchor="middle">实时聚合 · 窗口计算</text>

  <!-- 业务微服务 -->
  <rect x="1090" y="500" width="170" height="90" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="1175" y="530" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">业务微服务</text>
  <text x="1175" y="552" font-size="10" fill="#64748B" text-anchor="middle">Spring Cloud</text>
  <text x="1175" y="572" font-size="9" fill="#94A3B8" text-anchor="middle">非实时主题消费</text>

  <!-- 时序数据库 (cylinder) -->
  <g>
    <path d="M 1352,310 L 1352,380 A 78,14 0 0 0 1508,380 L 1508,310" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <ellipse cx="1430" cy="310" rx="78" ry="14" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2"/>
    <text x="1430" y="345" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">时序数据库</text>
    <text x="1430" y="365" font-size="10" fill="#64748B" text-anchor="middle">TDengine / InfluxDB</text>
    <text x="1430" y="412" font-size="9" fill="#94A3B8" text-anchor="middle">聚合结果持久化</text>
  </g>

  <!-- ===== Connections ===== -->
  <!-- devices -> 负载均衡器 (green, edge origin) -->
  <line x1="274" y1="430" x2="421" y2="430" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="347" y="420" font-size="10" fill="#475569" text-anchor="middle">海量连接</text>

  <!-- 负载均衡器 -> MQTT (blue main) -->
  <line x1="575" y1="435" x2="621" y2="435" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ah-blue)"/>
  <text x="598" y="425" font-size="10" fill="#2563EB" text-anchor="middle">连接分配</text>

  <!-- MQTT -> 消息队列 (blue main) -->
  <line x1="795" y1="435" x2="841" y2="435" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ah-blue)"/>
  <text x="818" y="425" font-size="10" fill="#2563EB" text-anchor="middle">消息发布</text>

  <!-- 消息队列 -> 流处理引擎 (blue main, branch up) -->
  <line x1="995" y1="415" x2="1086" y2="350" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ah-blue)"/>
  <text x="1062" y="372" font-size="10" fill="#2563EB" text-anchor="middle">数据消费</text>
  <text x="1062" y="386" font-size="9" fill="#94A3B8" text-anchor="middle">实时处理</text>

  <!-- 流处理引擎 -> 时序数据库 (blue main) -->
  <line x1="1260" y1="335" x2="1356" y2="335" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ah-blue)"/>
  <text x="1308" y="326" font-size="10" fill="#2563EB" text-anchor="middle">聚合写入</text>

  <!-- 消息队列 -> 业务微服务 (gray, application) -->
  <line x1="995" y1="460" x2="1086" y2="528" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah-gray)"/>
  <text x="1062" y="508" font-size="10" fill="#475569" text-anchor="middle">主题消费</text>
  <text x="1062" y="521" font-size="9" fill="#94A3B8" text-anchor="middle">非实时</text>

  <!-- MQTT -> 设备层 (dashed gray control: heartbeat / subscribe restore) -->
  <path d="M 710,480 L 710,740 L 230,740 L 230,606" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <rect x="385" y="724" width="310" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="540" y="741" font-size="11" fill="#334155" text-anchor="middle">控制流：心跳保活 / 订阅恢复（Broker → 设备）</text>

  <!-- main-chain highlight badge -->
  <rect x="818" y="226" width="260" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="834" cy="239" r="4" fill="#2563EB"/>
  <text x="846" y="243" font-size="11" fill="#334155">主链路：LB → Broker → Kafka → Flink → TSDB</text>

  <!-- ===== Legend ===== -->
  <line x1="64" y1="788" x2="1736" y2="788" stroke="#E2E8F0" stroke-width="1"/>
  <text x="64" y="812" font-size="11" font-weight="700" fill="#475569">图例</text>

  <g font-size="11" fill="#475569">
    <!-- domain colors -->
    <rect x="120" y="803" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="142" y="813">设备/边缘</text>

    <rect x="230" y="803" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="252" y="813">接入缓冲</text>

    <rect x="340" y="803" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="362" y="813">平台主链路</text>

    <rect x="460" y="803" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="482" y="813">数据存储</text>

    <rect x="570" y="803" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <text x="592" y="813">业务应用</text>

    <!-- line styles -->
    <line x1="680" y1="809" x2="712" y2="809" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <text x="720" y="813">数据流（实线）</text>

    <line x1="850" y1="809" x2="882" y2="809" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <text x="890" y="813">控制流（虚线）</text>

    <!-- shapes -->
    <circle cx="1029" cy="809" r="7" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="1042" y="813">终端设备</text>

    <rect x="1120" y="802" width="16" height="14" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1142" y="813">服务组件</text>

    <path d="M 1232,803 L 1232,815 A 8,3 0 0 0 1248,815 L 1248,803" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1240" cy="803" rx="8" ry="3" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="1254" y="813">数据库（圆柱）</text>
  </g>

  <!-- ===== Caption ===== -->
  <text x="900" y="868" font-size="10" fill="#94A3B8" text-anchor="middle">图11-6 城市物联网百万级接入系统架构图。负载均衡器按 IP 哈希将海量设备连接分配到 MQTT Broker 集群（EMQX）；Broker 把消息发布到 Kafka 分区完成削峰；流处理引擎（Flink）实时消费并聚合后写入时序数据库；业务微服务直接消费 Kafka 的非实时主题；虚线控制流表示 Broker 向设备侧下发心跳保活与订阅恢复指令。</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">architecture</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">left-to-right three-layer</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
