<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图11-5 智慧交通系统集成部署工程检查流程</title>
  <desc id="desc">读者应理解智慧交通系统集成部署工程检查流程中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">图11-5 智慧交通系统集成部署工程检查流程</title>
  <desc id="desc">读者应理解智慧交通系统集成部署工程检查流程中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图11-5 智慧交通系统集成部署工程检查流程</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解智慧交通系统集成部署工程检查流程中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">FLOWCHART</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="flowchart">
  <!-- 泳道背景 -->
  <rect x="100" y="145" width="660" height="90" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3" rx="6"/>
  <rect x="100" y="285" width="660" height="90" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3" rx="6"/>
  <rect x="100" y="425" width="660" height="90" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3" rx="6"/>
  <rect x="100" y="565" width="660" height="90" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5,3" rx="6"/>
  <!-- 泳道标题 -->
  <text x="110" y="165" fill="#0F172A" font-size="14" font-weight="bold">设备与协议兼容性检查</text>
  <text x="110" y="305" fill="#0F172A" font-size="14" font-weight="bold">通信与一致性检查</text>
  <text x="110" y="445" fill="#0F172A" font-size="14" font-weight="bold">数据安全与认证检查</text>
  <text x="110" y="585" fill="#0F172A" font-size="14" font-weight="bold">跨部门协同与灾备检查</text>

  <!-- 连线（先画） -->
  <!-- 泳道1水平连线 -->
  <line x1="300" y1="195" x2="350" y2="195" stroke="#22C55E" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="325" y="188" fill="#22C55E" font-size="12" text-anchor="middle">是</text>
  <line x1="500" y1="195" x2="550" y2="195" stroke="#22C55E" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="525" y="188" fill="#22C55E" font-size="12" text-anchor="middle">是</text>
  <!-- 泳道2水平连线 -->
  <line x1="300" y1="335" x2="350" y2="335" stroke="#22C55E" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="325" y="328" fill="#22C55E" font-size="12" text-anchor="middle">是</text>
  <line x1="500" y1="335" x2="550" y2="335" stroke="#22C55E" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="525" y="328" fill="#22C55E" font-size="12" text-anchor="middle">是</text>
  <!-- 泳道3水平连线 -->
  <line x1="300" y1="475" x2="350" y2="475" stroke="#22C55E" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="325" y="468" fill="#22C55E" font-size="12" text-anchor="middle">是</text>
  <!-- 泳道4水平连线 -->
  <line x1="300" y1="615" x2="350" y2="615" stroke="#22C55E" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="325" y="608" fill="#22C55E" font-size="12" text-anchor="middle">是</text>

  <!-- 垂直连线 -->
  <path d="M 700,195 L 700,335 L 150,335" fill="none" stroke="#22C55E" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="425" y="328" fill="#22C55E" font-size="12" text-anchor="middle">是</text>
  <path d="M 700,335 L 700,475 L 150,475" fill="none" stroke="#22C55E" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="425" y="468" fill="#22C55E" font-size="12" text-anchor="middle">是</text>
  <path d="M 500,475 L 500,615 L 150,615" fill="none" stroke="#22C55E" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="325" y="608" fill="#22C55E" font-size="12" text-anchor="middle">是</text>
  <line x1="425" y1="660" x2="425" y2="690" stroke="#22C55E" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <text x="430" y="675" fill="#22C55E" font-size="12" text-anchor="start">是</text>

  <!-- 回路（否） -->
  <!-- 泳道1回路 -->
  <path d="M 225,240 V 255 H 130 V 195 H 150" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#bp-arrow)"/>
  <text x="190" y="248" fill="#DC2626" font-size="12" text-anchor="middle">否</text>
  <path d="M 425,240 V 255 H 330 V 195 H 350" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#bp-arrow)"/>
  <text x="390" y="248" fill="#DC2626" font-size="12" text-anchor="middle">否</text>
  <path d="M 625,240 V 255 H 530 V 195 H 550" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#bp-arrow)"/>
  <text x="590" y="248" fill="#DC2626" font-size="12" text-anchor="middle">否</text>
  <!-- 泳道2回路 -->
  <path d="M 225,380 V 395 H 130 V 335 H 150" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#bp-arrow)"/>
  <text x="190" y="388" fill="#DC2626" font-size="12" text-anchor="middle">否</text>
  <path d="M 425,380 V 395 H 330 V 335 H 350" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#bp-arrow)"/>
  <text x="390" y="388" fill="#DC2626" font-size="12" text-anchor="middle">否</text>
  <path d="M 625,380 V 395 H 530 V 335 H 550" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#bp-arrow)"/>
  <text x="590" y="388" fill="#DC2626" font-size="12" text-anchor="middle">否</text>
  <!-- 泳道3回路 -->
  <path d="M 225,520 V 535 H 130 V 475 H 150" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#bp-arrow)"/>
  <text x="190" y="528" fill="#DC2626" font-size="12" text-anchor="middle">否</text>
  <path d="M 425,520 V 535 H 330 V 475 H 350" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#bp-arrow)"/>
  <text x="390" y="528" fill="#DC2626" font-size="12" text-anchor="middle">否</text>
  <!-- 泳道4回路 -->
  <path d="M 225,660 V 675 H 130 V 615 H 150" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#bp-arrow)"/>
  <text x="190" y="668" fill="#DC2626" font-size="12" text-anchor="middle">否</text>
  <path d="M 425,660 V 675 H 330 V 615 H 350" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#bp-arrow)"/>
  <text x="390" y="668" fill="#DC2626" font-size="12" text-anchor="middle">否</text>

  <!-- 节点（后画） -->
  <!-- 泳道1菱形 -->
  <polygon points="225,150 300,195 225,240 150,195" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="225" y="200" fill="#0F172A" font-size="14" text-anchor="middle">通信制式一致？</text>
  <polygon points="425,150 500,195 425,240 350,195" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="425" y="200" fill="#0F172A" font-size="14" text-anchor="middle">接口一致？</text>
  <polygon points="625,150 700,195 625,240 550,195" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="625" y="200" fill="#0F172A" font-size="14" text-anchor="middle">物模型兼容？</text>
  <!-- 泳道2菱形 -->
  <polygon points="225,290 300,335 225,380 150,335" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="225" y="340" fill="#0F172A" font-size="14" text-anchor="middle">网关压测通过？</text>
  <polygon points="425,290 500,335 425,380 350,335" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="425" y="340" fill="#0F172A" font-size="14" text-anchor="middle">加密认证启用？</text>
  <polygon points="625,290 700,335 625,380 550,335" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="625" y="340" fill="#0F172A" font-size="14" text-anchor="middle">QoS配置正确？</text>
  <!-- 泳道3菱形 -->
  <polygon points="225,430 300,475 225,520 150,475" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="225" y="480" fill="#0F172A" font-size="14" text-anchor="middle">PKI部署完成？</text>
  <polygon points="425,430 500,475 425,520 350,475" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="425" y="480" fill="#0F172A" font-size="14" text-anchor="middle">签名验证正常？</text>
  <!-- 泳道4菱形 -->
  <polygon points="225,570 300,615 225,660 150,615" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="225" y="620" fill="#0F172A" font-size="14" text-anchor="middle">数据总线就绪？</text>
  <polygon points="425,570 500,615 425,660 350,615" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="425" y="620" fill="#0F172A" font-size="14" text-anchor="middle">灾备降级已验证？</text>
  <!-- 终端节点 -->
  <rect x="250" y="690" width="200" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="350" y="725" fill="#0F172A" font-size="16" font-weight="bold" text-anchor="middle">部署上线</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">绿色菱形：检查项通过</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">红色菱形：检查项未通过，需返回上一步调整</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色圆角矩形：操作节点或最终状态</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图11-5 智慧交通系统集成部署工程检查流程</text>
  </svg>
