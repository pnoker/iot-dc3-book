<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图11-5 火灾应急响应事件流转时序（假设场景）</title>
  <desc id="desc">读者应理解自动化链路如何规避人工转接带来的延迟，以及边缘节点在压减感知到响应时间中的位置。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">图11-5 火灾应急响应事件流转时序（假设场景）</title>
  <desc id="desc">读者应理解自动化链路如何规避人工转接带来的延迟，以及边缘节点在压减感知到响应时间中的位置。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图11-5 火灾应急响应事件流转时序（假设场景）</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解自动化链路如何规避人工转接带来的延迟，以及边缘节点在压减感知到响应时间中的位置。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">SEQUENCE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="sequence">
  <!-- 区域边界 -->
  <rect x="140" y="120" width="440" height="550" rx="14" fill="none" stroke="#E2E8F0" stroke-dasharray="8,4" />
  <text x="155" y="138" fill="#64748B" font-size="14" font-weight="600">设备与边缘域</text>
  <rect x="620" y="120" width="700" height="550" rx="14" fill="none" stroke="#E2E8F0" stroke-dasharray="8,4" />
  <text x="635" y="138" fill="#64748B" font-size="14" font-weight="600">云端协同域</text>

  <!-- 生命线 -->
  <line x1="260" y1="195" x2="260" y2="650" stroke="#64748B" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="440" y1="195" x2="440" y2="650" stroke="#64748B" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="780" y1="195" x2="780" y2="650" stroke="#64748B" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="1000" y1="195" x2="1000" y2="650" stroke="#64748B" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="1200" y1="195" x2="1200" y2="650" stroke="#64748B" stroke-width="1" stroke-dasharray="4,4" />

  <!-- 参与者卡片 -->
  <rect x="200" y="135" width="120" height="60" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
  <text x="260" y="163" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">烟雾传感器</text>

  <rect x="360" y="135" width="160" height="60" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" />
  <text x="440" y="163" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">边缘计算节点</text>
  <text x="440" y="180" fill="#475569" font-size="12" text-anchor="middle">本地规则引擎</text>

  <rect x="700" y="135" width="160" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" />
  <text x="780" y="163" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">云端协同层</text>
  <text x="780" y="180" fill="#475569" font-size="12" text-anchor="middle">事件路由</text>

  <rect x="940" y="135" width="120" height="60" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
  <text x="1000" y="163" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">消防系统</text>

  <rect x="1140" y="135" width="120" height="60" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
  <text x="1200" y="163" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">交通系统</text>

  <!-- 消息箭头 -->
  <line x1="260" y1="230" x2="440" y2="230" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)" />
  <rect x="315" y="218" width="70" height="20" rx="3" fill="white" fill-opacity="0.9" />
  <text x="350" y="232" fill="#0F172A" font-size="12" text-anchor="middle">上报警值</text>

  <line x1="440" y1="300" x2="780" y2="300" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)" />
  <rect x="555" y="288" width="110" height="20" rx="3" fill="white" fill-opacity="0.9" />
  <text x="610" y="302" fill="#0F172A" font-size="12" text-anchor="middle">推送事件摘要</text>

  <line x1="780" y1="370" x2="1000" y2="370" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)" />
  <rect x="850" y="358" width="80" height="20" rx="3" fill="white" fill-opacity="0.9" />
  <text x="890" y="372" fill="#0F172A" font-size="12" text-anchor="middle">派单指令</text>

  <line x1="780" y1="440" x2="1200" y2="440" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)" />
  <rect x="940" y="428" width="100" height="20" rx="3" fill="white" fill-opacity="0.9" />
  <text x="990" y="442" fill="#0F172A" font-size="12" text-anchor="middle">信号控制指令</text>

  <!-- 自调用：边缘节点判定事件类型 -->
  <path d="M440,250 L470,250 L470,270 L440,270" fill="none" stroke="#0F766E" stroke-width="1.5" marker-end="url(#bp-arrow-primary)" stroke-dasharray="4,2" />
  <text x="480" y="265" fill="#0F172A" font-size="11">判定事件类型</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">矩形=参与者；实线箭头=同步消息</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图11-5 自动化链路的关键在于边缘节点完成本地判定（第2步），云端协同层完成自动事件路由（第4步），两地均无人工转接环节。</text>
  </svg>
</svg>