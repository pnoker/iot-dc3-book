<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图3-5 边缘节点数据预处理与过滤流程</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="282.143" y="24.000" width="635.714" height="712.000" viewBox="0 0 1000.000 1120.000" preserveAspectRatio="xMidYMid meet">
<rect x="0" y="0" width="1000" height="1120" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- Title area -->
  <circle cx="64" cy="44" r="6" fill="#2563EB"/>
  <text x="84" y="50" font-size="22" font-weight="700" fill="#0F172A">图3-5 边缘节点数据预处理与过滤流程</text>
  <text x="84" y="72" font-size="12" fill="#64748B">Edge node data preprocessing &amp; filtering pipeline · 传感器 → 滤波 → 聚合 → 异常判定 → 云平台</text>
  <rect x="892" y="30" width="84" height="24" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="934" y="46" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">FLOWCHART</text>
  <line x1="40" y1="103" x2="960" y2="103" stroke="#E2E8F0"/>

  <!-- Region boundary: edge node platform domain -->
  <rect x="120" y="120" width="760" height="790" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.55"/>
  <rect x="138" y="110" width="190" height="22" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
  <text x="233" y="126" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">边缘节点 · 平台服务域</text>

  <!-- Nodes: vertical main chain -->
  <!-- r1 raw -->
  <rect x="390" y="150" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="500" y="178" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">原始传感器数据</text>
  <text x="500" y="196" font-size="10" fill="#64748B" text-anchor="middle">raw · 时间序列输入</text>

  <!-- r2 filter -->
  <rect x="390" y="240" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="500" y="268" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">滑动平均滤波</text>
  <text x="500" y="286" font-size="10" fill="#64748B" text-anchor="middle">filter · 窗口 N = 5</text>

  <!-- r3 filtered -->
  <rect x="390" y="330" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="500" y="358" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">干净数值序列</text>
  <text x="500" y="376" font-size="10" fill="#64748B" text-anchor="middle">filtered · 去噪后</text>

  <!-- r4 aggregate -->
  <rect x="390" y="420" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="500" y="448" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">数据聚合</text>
  <text x="500" y="466" font-size="10" fill="#64748B" text-anchor="middle">aggregate · 时间窗降采样</text>

  <!-- r5 aggregated -->
  <rect x="390" y="510" width="220" height="60" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="500" y="538" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">压缩后状态值</text>
  <text x="500" y="556" font-size="10" fill="#64748B" text-anchor="middle">aggregated · 特征向量</text>

  <!-- r6 anomaly decision diamond -->
  <polygon points="500,600 600,660 500,720 400,660" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="500" y="657" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">异常判定</text>
  <text x="500" y="675" font-size="10" fill="#64748B" text-anchor="middle">anomaly · 阈值 / 规则</text>

  <!-- r7 normal_path -->
  <rect x="200" y="760" width="200" height="60" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="300" y="788" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">正常数据</text>
  <text x="300" y="806" font-size="10" fill="#64748B" text-anchor="middle">normal_path · 周期推送</text>

  <!-- r8 alert_path -->
  <rect x="600" y="760" width="200" height="60" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="700" y="788" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">异常事件</text>
  <text x="700" y="806" font-size="10" fill="#64748B" text-anchor="middle">alert_path · 本地动作 + 打标</text>

  <!-- r9 cloud -->
  <rect x="360" y="880" width="280" height="64" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="500" y="908" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">云平台数据流 / 告警流</text>
  <text x="500" y="927" font-size="10" fill="#64748B" text-anchor="middle">cloud · 数据与告警汇聚</text>

  <!-- Main chain arrows (blue, solid) -->
  <line x1="500" y1="210" x2="500" y2="237" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="500" y1="300" x2="500" y2="327" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="500" y1="390" x2="500" y2="417" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="500" y1="480" x2="500" y2="507" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="500" y1="570" x2="500" y2="597" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- Branch labels -->
  <!-- anomaly -> normal (left): 否（正常）green -->
  <path d="M400,660 H300 V757" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <rect x="318" y="642" width="74" height="20" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="355" y="656" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">否（正常）</text>

  <!-- anomaly -> alert (right): 是（异常）red risk -->
  <path d="M600,660 H700 V757" fill="none" stroke="#E11D48" stroke-width="2" marker-end="url(#ah-red)"/>
  <rect x="610" y="642" width="74" height="20" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="647" y="656" font-size="10" font-weight="700" fill="#E11D48" text-anchor="middle">是（异常）</text>

  <!-- normal -> cloud (blue solid) -->
  <path d="M300,820 V850 H420 V877" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="338" y="844" font-size="10" fill="#2563EB">主链路</text>

  <!-- alert -> cloud (gray dashed, event with id) -->
  <path d="M700,820 V850 H580 V877" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="600" y="844" font-size="10" fill="#64748B">带事件编号</text>

  <!-- Callouts -->
  <rect x="640" y="150" width="230" height="68" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="652" y="170" font-size="11" font-weight="700" fill="#334155">滤波窗口 N=5</text>
  <text x="652" y="187" font-size="10" fill="#475569">5 点滑动平均，抑制高频噪声，</text>
  <text x="652" y="201" font-size="10" fill="#475569">保留趋势，延迟 ≤ 2 个采样点。</text>

  <rect x="640" y="510" width="230" height="68" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="652" y="530" font-size="11" font-weight="700" fill="#334155">聚合粒度</text>
  <text x="652" y="547" font-size="10" fill="#475569">按固定时间窗降采样为均值 /</text>
  <text x="652" y="561" font-size="10" fill="#475569">极值，压缩上行带宽。</text>

  <rect x="130" y="600" width="240" height="68" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="142" y="620" font-size="11" font-weight="700" fill="#334155">判定条件</text>
  <text x="142" y="637" font-size="10" fill="#475569">超出动态阈值或命中规则，</text>
  <text x="142" y="651" font-size="10" fill="#475569">即判定为异常事件。</text>

  <!-- Legend separator -->
  <line x1="40" y1="975" x2="960" y2="975" stroke="#E2E8F0"/>

  <!-- Legend -->
  <g font-size="11" fill="#475569">
    <rect x="60" y="1000" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="84" y="1010">蓝色 = 核心平台 / 主链路</text>

    <rect x="270" y="1000" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="294" y="1010">青绿色 = 设备与边缘</text>

    <rect x="460" y="1000" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="484" y="1010">橙色 = AI / 关键决策</text>

    <rect x="640" y="1000" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
    <text x="664" y="1010">红色 = 风险 / 异常分支</text>

    <rect x="810" y="1000" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="834" y="1010">琥珀 = 云平台</text>

    <line x1="60" y1="1035" x2="90" y2="1035" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="98" y="1039">灰色虚线 = 异步事件回传（带事件编号）</text>
  </g>

  <!-- Caption -->
  <text x="500" y="1085" font-size="10" fill="#94A3B8" text-anchor="middle">图3-5 边缘节点数据预处理与过滤流程。原始数据先经滑动平均滤波去噪，再聚合为特征值，最后进行异常判定；正常数据按固定周期推送云平台，异常数据触发本地动作并打标上传。</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">flowchart</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">从上至下，数据流方向用箭头连接各处理节点</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
