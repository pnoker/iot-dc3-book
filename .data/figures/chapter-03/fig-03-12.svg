  <text x="682.5" y="248" text-anchor="middle" font-size="11" fill="#64748B">轻量级</text>
  
  <rect x="582.5" y="280" width="200" height="60" rx="8" fill="white" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="682.5" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">模型训练</text>
  <text x="682.5" y="328" text-anchor="middle" font-size="11" fill="#64748B">云端</text>
  
  <rect x="582.5" y="360" width="200" height="60" rx="8" fill="white" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="682.5" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">float32模型</text>
  <text x="682.5" y="408" text-anchor="middle" font-size="11" fill="#64748B">全精度</text>
  
  <!-- 内部节点：阶段3 -->
  <rect x="997.5" y="200" width="200" height="60" rx="8" fill="white" stroke="#F97316" stroke-width="1.5"/>
  <text x="1097.5" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">模型量化</text>
  <text x="1097.5" y="248" text-anchor="middle" font-size="11" fill="#64748B">float32→int8</text>
  
  <rect x="997.5" y="280" width="200" height="60" rx="8" fill="white" stroke="#F97316" stroke-width="1.5"/>
  <text x="1097.5" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">模型剪枝</text>
  <text x="1097.5" y="328" text-anchor="middle" font-size="11" fill="#64748B">稀疏化</text>
  
  <!-- 判定菱形 -->
