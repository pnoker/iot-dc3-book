  <rect x="167.5" y="360" width="200" height="60" rx="8" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="267.5" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">标注数据集</text>
  <text x="267.5" y="408" text-anchor="middle" font-size="11" fill="#64748B">训练/验证/测试</text>
  
  <!-- 内部节点：阶段2 -->
