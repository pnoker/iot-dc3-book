  <text x="1097.5" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">精度验证</text>
  
  <!-- 内部节点：阶段4 -->
  <rect x="1412.5" y="200" width="200" height="60" rx="8" fill="white" stroke="#16A34A" stroke-width="1.5"/>
  <text x="1512.5" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">模型编译</text>
  <text x="1512.5" y="248" text-anchor="middle" font-size="11" fill="#64748B">C代码</text>
  
  <rect x="1412.5" y="280" width="200" height="60" rx="8" fill="white" stroke="#16A34A" stroke-width="1.5"/>
  <text x="1512.5" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">固件烧录</text>
  <text x="1512.5" y="328" text-anchor="middle" font-size="11" fill="#64748B">MCU</text>
  
  <rect x="1412.5" y="360" width="200" height="60" rx="8" fill="white" stroke="#16A34A" stroke-width="1.5"/>
  <text x="1512.5" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">本地推理</text>
  <text x="1512.5" y="408" text-anchor="middle" font-size="11" fill="#64748B">传感器节点</text>
  
  <!-- 内部连线 -->
  <line x1="267.5" y1="260" x2="267.5" y2="280" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <line x1="267.5" y1="340" x2="267.5" y2="360" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <line x1="682.5" y1="260" x2="682.5" y2="280" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <line x1="682.5" y1="340" x2="682.5" y2="360" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <line x1="1097.5" y1="260" x2="1097.5" y2="280" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <line x1="1097.5" y1="340" x2="1097.5" y2="365" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <line x1="1512.5" y1="260" x2="1512.5" y2="280" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  <line x1="1512.5" y1="340" x2="1512.5" y2="360" stroke="#64748B" stroke-width="2" marker-end="url(#bp-arrow)"/>
  
  <!-- 阶段间主箭头 -->
  <!-- 阶段1->2 -->
  <path d="M 367.5 390 L 475 390 L 475 230 L 582.5 230" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#bp-arrow-primary)"/>
  <!-- 阶段2->3 -->
  <path d="M 782.5 390 L 890 390 L 890 230 L 997.5 230" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#bp-arrow-primary)"/>
  <!-- 阶段3->4（精度通过） -->
  <path d="M 1147.5 400 L 1305 400 L 1305 230 L 1412.5 230" fill="none" stroke="#16A34A" stroke-width="3" marker-end="url(#bp-arrow-primary)"/>
  
  <!-- 回退路径 -->
  <path d="M 1047.5,400 L 850,400 L 850,280 L 782.5,280" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#bp-arrow)"/>
  
  <!-- 箭头标签 -->
  <!-- 阶段1->2标签 -->
  <rect x="440" y="295" width="70" height="20" rx="4" fill="white" stroke="none"/>
  <text x="475" y="309" text-anchor="middle" font-size="11" fill="#2563EB">正向数据流</text>
  
  <!-- 阶段2->3标签 -->
  <rect x="855" y="295" width="70" height="20" rx="4" fill="white" stroke="none"/>
  <text x="890" y="309" text-anchor="middle" font-size="11" fill="#2563EB">正向数据流</text>
  
  <!-- 阶段3->4标签 -->
  <rect x="1270" y="310" width="70" height="20" rx="4" fill="white" stroke="none"/>
  <text x="1305" y="324" text-anchor="middle" font-size="11" fill="#16A34A">精度达标</text>
  
  <!-- 回退标签 -->
  <rect x="860" y="385" width="80" height="20" rx="4" fill="white" stroke="none"/>
  <text x="900" y="399" text-anchor="middle" font-size="11" fill="#DC2626">精度损失>2%</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色：数据准备；紫色：云端训练；橙色：模型优化；绿色：端侧部署</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">粗实线箭头：正向数据流；虚线箭头：回退迭代路径</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">菱形：判定节点，表示精度验证</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图3-12 展示了TinyML从数据采集到端侧推理的完整工程流程，其中模型优化与云端训练之间的回退反馈是保证落地精度的关键环节。</text>
