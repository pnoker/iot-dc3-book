<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图3-12 TinyML模型训练与部署全流程</title>
  <desc id="desc">读者应理解TinyML模型训练与部署全流程中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">图3-12 TinyML模型训练与部署全流程</title>
  <desc id="desc">读者应理解TinyML模型训练与部署全流程中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图3-12 TinyML模型训练与部署全流程</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解TinyML模型训练与部署全流程中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">FLOWCHART</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="flowchart">
  <!-- 阶段框背景 -->
  <rect x="80" y="150" width="375" height="380" rx="10" fill="white" stroke="#2563EB" stroke-dasharray="8,4" stroke-width="1.5"/>
  <rect x="495" y="150" width="375" height="380" rx="10" fill="white" stroke="#7C3AED" stroke-dasharray="8,4" stroke-width="1.5"/>
  <rect x="910" y="150" width="375" height="380" rx="10" fill="white" stroke="#F97316" stroke-dasharray="8,4" stroke-width="1.5"/>
  <rect x="1325" y="150" width="375" height="380" rx="10" fill="white" stroke="#16A34A" stroke-dasharray="8,4" stroke-width="1.5"/>
  
  <!-- 阶段框标题 -->
  <text x="267.5" y="178" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">阶段1：数据准备</text>
  <text x="682.5" y="178" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">阶段2：云端训练</text>
  <text x="1097.5" y="178" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">阶段3：模型优化</text>
  <text x="1512.5" y="178" text-anchor="middle" font-size="18" font-weight="bold" fill="#0F172A">阶段4：端侧部署</text>
  
  <!-- 内部节点：阶段1 -->
  <rect x="167.5" y="200" width="200" height="60" rx="8" fill="white" stroke="#2563EB" stroke-width="1.5"/>
