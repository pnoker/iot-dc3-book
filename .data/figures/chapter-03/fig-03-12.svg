  <text x="267.5" y="248" text-anchor="middle" font-size="11" fill="#64748B">传感器</text>
  
  <rect x="167.5" y="280" width="200" height="60" rx="8" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <text x="267.5" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">数据标注</text>
