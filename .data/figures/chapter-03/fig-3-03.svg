<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="60.000" width="1152.000" height="640.000" viewBox="0 0 1800.000 1000.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <!-- ===================== TITLE ===================== -->
  <g id="title">
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="84" y="46" font-size="22" font-weight="700" fill="#0F172A">图3-3 室内外定位技术精度光谱</text>
    <text x="84" y="68" font-size="12" fill="#64748B">Positioning Precision Spectrum · 横轴为精度（厘米→米→十米，对数刻度），各技术按典型精度区间定位</text>
    <rect x="1560" y="28" width="200" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1660" y="44" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.5">PRECISION SPECTRUM</text>
    <line x1="44" y1="103" x2="1756" y2="103" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- ===================== GRIDLINES (precision scale, behind everything) ===================== -->
  <g id="gridlines" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4">
    <line x1="220" y1="140" x2="220" y2="715"/>
    <line x1="565" y1="140" x2="565" y2="715"/>
    <line x1="713" y1="140" x2="713" y2="715"/>
    <line x1="949" y1="140" x2="949" y2="715"/>
    <line x1="1207" y1="140" x2="1207" y2="715"/>
    <line x1="1442" y1="140" x2="1442" y2="715"/>
    <line x1="1700" y1="140" x2="1700" y2="715"/>
  </g>
  <!-- 厘米级 / 米级 tier divider (slightly stronger at 1 m) -->
  <line x1="1207" y1="140" x2="1207" y2="715" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- ===================== DOMAIN BOUNDARY BOXES ===================== -->
  <!-- 室内定位域 — green dashed -->
  <g id="band-indoor">
    <rect x="40" y="125" width="1720" height="330" rx="12" fill="#10B981" fill-opacity="0.035" stroke="#10B981" stroke-width="1.6" stroke-dasharray="8 4"/>
    <rect x="56" y="112" width="248" height="26" rx="13" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="180" y="130" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">室内定位域 · INDOOR</text>
  </g>
  <!-- 室外定位域 — orange dashed -->
  <g id="band-outdoor">
    <rect x="40" y="475" width="1720" height="210" rx="12" fill="#F59E0B" fill-opacity="0.035" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="8 4"/>
    <rect x="56" y="462" width="248" height="26" rx="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="180" y="480" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">室外定位域 · OUTDOOR</text>
  </g>

  <!-- ===================== TRACKS (faint full-width baselines) ===================== -->
  <g id="tracks" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round">
    <line x1="220" x2="1700" y1="190" y2="190"/>
    <line x1="220" x2="1700" y1="280" y2="280"/>
    <line x1="220" x2="1700" y1="370" y2="370"/>
    <line x1="220" x2="1700" y1="545" y2="545"/>
    <line x1="220" x2="1700" y1="635" y2="635"/>
  </g>

  <!-- ===================== ROW 1: UWB (green, 10–30 cm, 室内高精) ===================== -->
  <g id="row-uwb">
    <text x="205" y="187" font-size="15" font-weight="700" fill="#0F172A" text-anchor="end">UWB</text>
    <text x="205" y="204" font-size="10" fill="#64748B" text-anchor="end">超宽带</text>
    <rect x="713" y="178" width="236" height="24" rx="12" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="2"/>
    <circle cx="713" cy="190" r="4.5" fill="#10B981"/>
    <circle cx="949" cy="190" r="4.5" fill="#10B981"/>
    <text x="831" y="190" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">±10–30 cm</text>
    <text x="965" y="190" font-size="10" font-weight="600" fill="#10B981" dominant-baseline="central">室内高精</text>
  </g>

  <!-- ===================== ROW 2: BLE (blue, 1–3 m, 室内通用) ===================== -->
  <g id="row-ble">
    <text x="205" y="277" font-size="15" font-weight="700" fill="#0F172A" text-anchor="end">BLE</text>
    <text x="205" y="294" font-size="10" fill="#64748B" text-anchor="end">蓝牙信标</text>
    <rect x="1207" y="268" width="235" height="24" rx="12" fill="#2563EB" fill-opacity="0.18" stroke="#2563EB" stroke-width="2"/>
    <circle cx="1207" cy="280" r="4.5" fill="#2563EB"/>
    <circle cx="1442" cy="280" r="4.5" fill="#2563EB"/>
    <text x="1324" y="280" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">±1–3 m</text>
    <text x="1458" y="280" font-size="10" font-weight="600" fill="#2563EB" dominant-baseline="central">室内通用</text>
  </g>

  <!-- ===================== ROW 3: Wi-Fi (gray, 3–10 m, 室内通用) ===================== -->
  <g id="row-wifi">
    <text x="205" y="367" font-size="15" font-weight="700" fill="#0F172A" text-anchor="end">Wi-Fi</text>
    <text x="205" y="384" font-size="10" fill="#64748B" text-anchor="end">无线指纹</text>
    <rect x="1442" y="358" width="258" height="24" rx="12" fill="#64748B" fill-opacity="0.18" stroke="#64748B" stroke-width="2"/>
    <circle cx="1442" cy="370" r="4.5" fill="#64748B"/>
    <circle cx="1700" cy="370" r="4.5" fill="#64748B"/>
    <text x="1571" y="370" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">±3–10 m</text>
    <text x="1432" y="370" font-size="10" font-weight="600" fill="#64748B" text-anchor="end" dominant-baseline="central">室内通用</text>
  </g>

  <!-- ===================== ROW 4: GNSS RTK (orange, 1–5 cm, 室外高精) ===================== -->
  <g id="row-gnss-rtk">
    <text x="205" y="542" font-size="15" font-weight="700" fill="#0F172A" text-anchor="end">GNSS</text>
    <text x="205" y="559" font-size="10" fill="#64748B" text-anchor="end">RTK 差分增强</text>
    <rect x="220" y="533" width="345" height="24" rx="12" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="220" cy="545" r="4.5" fill="#F59E0B"/>
    <circle cx="565" cy="545" r="4.5" fill="#F59E0B"/>
    <text x="392" y="545" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">±1–5 cm</text>
    <text x="581" y="545" font-size="10" font-weight="600" fill="#F59E0B" dominant-baseline="central">室外高精</text>
  </g>

  <!-- ===================== ROW 5: GNSS 标准 (orange, 3–10 m, 室外通用) ===================== -->
  <g id="row-gnss-std">
    <text x="205" y="632" font-size="15" font-weight="700" fill="#0F172A" text-anchor="end">GNSS</text>
    <text x="205" y="649" font-size="10" fill="#64748B" text-anchor="end">标准单点定位</text>
    <rect x="1442" y="623" width="258" height="24" rx="12" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="1442" cy="635" r="4.5" fill="#F59E0B"/>
    <circle cx="1700" cy="635" r="4.5" fill="#F59E0B"/>
    <text x="1571" y="635" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="central">±3–10 m</text>
    <text x="1432" y="635" font-size="10" font-weight="600" fill="#F59E0B" text-anchor="end" dominant-baseline="central">室外通用</text>
  </g>

  <!-- ===================== CALLOUT (key insight, fills empty mid space) ===================== -->
  <g id="callout">
    <rect x="640" y="512" width="548" height="66" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="640" y="512" width="4" height="66" rx="2" fill="#F59E0B"/>
    <text x="658" y="535" font-size="11" font-weight="700" fill="#0F172A">核心结论</text>
    <text x="658" y="554" font-size="11" fill="#334155">RTK 增强下 GNSS 可达 ±1–5 cm，精度追平室内 UWB；</text>
    <text x="658" y="571" font-size="11" fill="#334155">无 RTK 时 GNSS 回落至 3–10 m，与 Wi-Fi 指纹定位相当。</text>
  </g>

  <!-- ===================== PRECISION AXIS ===================== -->
  <g id="axis">
    <!-- direction labels -->
    <text x="160" y="724" font-size="10" font-weight="700" fill="#64748B" text-anchor="end" dominant-baseline="central">高精度</text>
    <text x="1760" y="724" font-size="10" font-weight="700" fill="#64748B" text-anchor="start" dominant-baseline="central">低精度</text>
    <!-- axis line with outward arrows -->
    <line x1="220" y1="720" x2="1700" y2="720" stroke="#475569" stroke-width="1.6" marker-start="url(#ah-gray)" marker-end="url(#ah-gray)"/>
    <!-- ticks -->
    <g stroke="#475569" stroke-width="1.4">
      <line x1="220" y1="720" x2="220" y2="732"/>
      <line x1="565" y1="720" x2="565" y2="730"/>
      <line x1="713" y1="720" x2="713" y2="732"/>
      <line x1="949" y1="720" x2="949" y2="730"/>
      <line x1="1207" y1="720" x2="1207" y2="732"/>
      <line x1="1442" y1="720" x2="1442" y2="730"/>
      <line x1="1700" y1="720" x2="1700" y2="732"/>
    </g>
    <!-- tick labels -->
    <g font-size="11" fill="#475569" text-anchor="middle">
      <text x="220" y="750">1 cm</text>
      <text x="565" y="750">5 cm</text>
      <text x="713" y="750">10 cm</text>
      <text x="949" y="750">30 cm</text>
      <text x="1207" y="750">1 m</text>
      <text x="1442" y="750">3 m</text>
      <text x="1700" y="750">10 m</text>
    </g>
    <!-- tier labels -->
    <text x="467" y="775" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">厘米级 · centimeter</text>
    <text x="1207" y="775" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">米级 · meter</text>
    <text x="1620" y="775" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">十米级</text>
    <!-- axis title -->
    <text x="960" y="797" font-size="10" fill="#94A3B8" text-anchor="middle">定位精度（对数刻度，数值越小越精确）</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g id="legend">
    <rect x="44" y="820" width="1712" height="76" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="64" y="842" font-size="11" font-weight="700" fill="#475569">图例</text>

    <!-- tech swatches row -->
    <rect x="120" y="850" width="18" height="14" rx="3" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="1.5"/>
    <text x="144" y="861" font-size="11" fill="#475569">UWB · 室内厘米级</text>

    <rect x="320" y="850" width="18" height="14" rx="3" fill="#2563EB" fill-opacity="0.18" stroke="#2563EB" stroke-width="1.5"/>
    <text x="344" y="861" font-size="11" fill="#475569">BLE · 室内米级</text>

    <rect x="500" y="850" width="18" height="14" rx="3" fill="#64748B" fill-opacity="0.18" stroke="#64748B" stroke-width="1.5"/>
    <text x="524" y="861" font-size="11" fill="#475569">Wi-Fi · 室内米级</text>

    <rect x="680" y="850" width="18" height="14" rx="3" fill="#F59E0B" fill-opacity="0.18" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="704" y="861" font-size="11" fill="#475569">GNSS · 室外（RTK 厘米级 / 标准 3–10 m）</text>

    <!-- boundary + encoding row -->
    <rect x="120" y="874" width="18" height="14" rx="3" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="144" y="885" font-size="11" fill="#475569">室内定位域</text>

    <rect x="280" y="874" width="18" height="14" rx="3" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="304" y="885" font-size="11" fill="#475569">室外定位域</text>

    <line x1="440" y1="881" x2="478" y2="881" stroke="#E2E8F0" stroke-width="2"/>
    <text x="486" y="885" font-size="11" fill="#475569">精度光谱基线</text>

    <rect x="610" y="875" width="40" height="12" rx="6" fill="#94A3B8" fill-opacity="0.18" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="610" cy="881" r="3" fill="#94A3B8"/>
    <circle cx="650" cy="881" r="3" fill="#94A3B8"/>
    <text x="660" y="885" font-size="11" fill="#475569">彩色条 = 典型精度区间，端点圆点 = 上下限</text>

    <text x="1736" y="885" font-size="10" fill="#64748B" text-anchor="end">横轴对数刻度 · 左高精 → 右低精</text>
  </g>

  <!-- ===================== CAPTION ===================== -->
  <g id="caption">
    <text x="900" y="932" font-size="10" fill="#94A3B8" text-anchor="middle">图3-3 定位技术精度光谱：UWB 厘米级（室内高精）、BLE/Wi-Fi 米级（室内通用）、GNSS 米至厘米级（室外，RTK 厘米级）。</text>
    <text x="900" y="950" font-size="10" fill="#94A3B8" text-anchor="middle">室内域以 UWB 最精、Wi-Fi 最粗；室外 GNSS 跨度最大——RTK 增强可达厘米级，标准单点定位仅 3–10 m。</text>
  </g>
  </svg>
</svg>