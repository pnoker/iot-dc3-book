<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图3-11 振动传感器自适应采样状态机</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图3-11 振动传感器自适应采样状态机</title>
  <desc id="desc">振动传感器在三种工作模式（稳态低功率、加速监听、数据上传）之间的切换逻辑，状态转移由模型预测误差的连续放大驱动。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="85.600" width="1152.000" height="588.800" viewBox="0 0 1800.000 920.000" preserveAspectRatio="xMidYMid meet">
<title>图3-11 振动传感器自适应采样状态机</title>
  <desc>振动传感器在三种工作模式（稳态低功率、加速监听、数据上传）之间的切换逻辑，状态转移由模型预测误差的连续放大驱动。</desc>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="920" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图3-11 振动传感器自适应采样状态机</text>
  <text x="84" y="70" font-size="12" fill="#64748B">自适应采样状态机：三种工作模式由模型预测误差的连续放大驱动切换</text>

  <!-- type tag -->
  <rect x="1612" y="26" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1687" y="46" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.5">STATE MACHINE</text>

  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Region boundary ===== -->
  <rect x="90" y="250" width="1620" height="320" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="106" y="240" width="150" height="22" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="181" y="256" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">平台服务域 · 状态机</text>

  <!-- ===== State cards ===== -->
  <!-- S1 -->
  <g>
    <rect x="130" y="300" width="340" height="220" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="130" y="300" width="340" height="46" rx="8" fill="#2563EB"/>
    <rect x="130" y="338" width="340" height="8" fill="#2563EB"/>
    <text x="300" y="328" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">S1 · 稳态低功率</text>
    <text x="300" y="376" font-size="10" fill="#64748B" text-anchor="middle">state-1　低频采样 · 射频关闭</text>
    <line x1="150" y1="392" x2="450" y2="392" stroke="#E2E8F0" stroke-width="1"/>
    <text x="155" y="416" font-size="12" fill="#0F172A">采样间隔</text>
    <text x="445" y="416" font-size="12" font-weight="600" fill="#2563EB" text-anchor="end">10 min</text>
    <text x="155" y="442" font-size="12" fill="#0F172A">处理方式</text>
    <text x="445" y="442" font-size="12" font-weight="600" fill="#2563EB" text-anchor="end">模型预测</text>
    <text x="155" y="468" font-size="12" fill="#0F172A">射频功耗</text>
    <text x="445" y="468" font-size="12" font-weight="600" fill="#2563EB" text-anchor="end">关闭</text>
    <text x="155" y="498" font-size="10" fill="#64748B">基线态 · 占空比最低</text>
  </g>

  <!-- S2 -->
  <g>
    <rect x="730" y="300" width="340" height="220" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="730" y="300" width="340" height="46" rx="8" fill="#2563EB"/>
    <rect x="730" y="338" width="340" height="8" fill="#2563EB"/>
    <text x="900" y="328" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">S2 · 加速监听</text>
    <text x="900" y="376" font-size="10" fill="#64748B" text-anchor="middle">state-2　疑似启动 · 残差监测</text>
    <line x1="750" y1="392" x2="1050" y2="392" stroke="#E2E8F0" stroke-width="1"/>
    <text x="755" y="416" font-size="12" fill="#0F172A">采样间隔</text>
    <text x="1045" y="416" font-size="12" font-weight="600" fill="#2563EB" text-anchor="end">1 s</text>
    <text x="755" y="442" font-size="12" fill="#0F172A">处理方式</text>
    <text x="1045" y="442" font-size="12" font-weight="600" fill="#2563EB" text-anchor="end">残差检测</text>
    <text x="755" y="468" font-size="12" fill="#0F172A">射频功耗</text>
    <text x="1045" y="468" font-size="12" font-weight="600" fill="#2563EB" text-anchor="end">待机</text>
    <text x="755" y="498" font-size="10" fill="#64748B">过渡态 · 确认是否故障</text>
  </g>

  <!-- S3 -->
  <g>
    <rect x="1330" y="300" width="340" height="220" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="1330" y="300" width="340" height="46" rx="8" fill="#2563EB"/>
    <rect x="1330" y="338" width="340" height="8" fill="#2563EB"/>
    <text x="1500" y="328" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">S3 · 数据上传</text>
    <text x="1500" y="376" font-size="10" fill="#64748B" text-anchor="middle">state-3　确认故障 · 上报回传</text>
    <line x1="1350" y1="392" x2="1650" y2="392" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1355" y="416" font-size="12" fill="#0F172A">采样间隔</text>
    <text x="1645" y="416" font-size="12" font-weight="600" fill="#2563EB" text-anchor="end">100 ms</text>
    <text x="1355" y="442" font-size="12" fill="#0F172A">处理方式</text>
    <text x="1645" y="442" font-size="12" font-weight="600" fill="#2563EB" text-anchor="end">打包上传</text>
    <text x="1355" y="468" font-size="12" fill="#0F172A">射频功耗</text>
    <text x="1645" y="468" font-size="12" font-weight="600" fill="#2563EB" text-anchor="end">开启</text>
    <text x="1355" y="498" font-size="10" fill="#64748B">动作态 · 触发云端告警</text>
  </g>

  <!-- ===== Transitions ===== -->
  <!-- S1 -> S2 main forward -->
  <line x1="470" y1="410" x2="722" y2="410" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="498" y="380" width="196" height="34" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="596" y="395" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">误差连续 3 次 &gt; 2×thresh</text>
  <text x="596" y="408" font-size="10" fill="#64748B" text-anchor="middle">疑似启动 · 进入监听</text>

  <!-- S2 -> S3 main forward -->
  <line x1="1070" y1="410" x2="1322" y2="410" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="1098" y="380" width="196" height="34" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="1196" y="395" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">连续 5 次残差 &gt; thresh</text>
  <text x="1196" y="408" font-size="10" fill="#64748B" text-anchor="middle">确认故障 · 触发上传</text>

  <!-- S3 -> S1 return arc (main cycle completion) -->
  <path d="M 1500 540 C 1500 650, 900 680, 900 640 C 900 680, 300 650, 300 540" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
  <rect x="780" y="650" width="240" height="34" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="900" y="665" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">上传完成 · 复位至稳态</text>
  <text x="900" y="678" font-size="10" fill="#64748B" text-anchor="middle">任务结束 · 回到 state-1</text>

  <!-- S1 -> S1 self loop (steady hold) -->
  <path d="M 210 300 C 210 215, 390 215, 390 300" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <rect x="222" y="194" width="156" height="26" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <text x="300" y="212" font-size="11" fill="#475569" text-anchor="middle">误差 &lt; thresh · 稳态持续</text>

  <!-- ===== Legend ===== -->
  <line x1="60" y1="710" x2="1740" y2="710" stroke="#E2E8F0" stroke-width="1"/>

  <text x="60" y="738" font-size="12" font-weight="700" fill="#0F172A">图例</text>

  <rect x="120" y="726" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="144" y="736" font-size="11" fill="#475569">主链路转移（蓝实线）</text>

  <rect x="320" y="726" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="344" y="736" font-size="11" fill="#475569">主循环复位（蓝虚线）</text>

  <rect x="520" y="726" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="544" y="736" font-size="11" fill="#475569">稳态保持 / 自循环（灰虚线）</text>

  <text x="60" y="762" font-size="11" fill="#475569">注：thresh 为预设模型误差阈值，需根据离线数据标定；状态转移混合了事件驱动（超阈值）与变化率（连续次数）策略。</text>

  <!-- ===== Callout ===== -->
  <rect x="60" y="786" width="1680" height="58" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="80" y="810" font-size="11" font-weight="700" fill="#0F172A">工程取舍</text>
  <text x="80" y="830" font-size="11" fill="#334155">S1 以长间隔（10 min）+ 射频关闭把占空比压到最低；S2 在 1 s 监听窗内只开残差检测、射频保持待机；只有确认为故障才进入 S3 开启射频上传。三态分级避免了"长时间高频采样 + 射频常开"的功耗陷阱。</text>

  <!-- ===== Caption ===== -->
  <text x="900" y="894" font-size="10" fill="#94A3B8" text-anchor="middle">图3-13　振动传感器自适应采样状态机。状态转移由模型预测误差的连续放大驱动，混合了事件驱动与变化率策略。</text>
  </svg>
</svg>

      <div class="card"><div class="label">图表类型</div><div class="value">architecture</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">三个圆角矩形状态框呈横向排列，箭头标注转移条件。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
