<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="30.400" y="24.000" width="1139.200" height="712.000" viewBox="0 0 1600.000 1000.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1600" height="1000" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图3-7 EPC Gen2 标签存储体分层结构</text>
  <text x="84" y="70" font-size="12" fill="#64748B">Reserved / EPC / TID / User 四个存储区的堆叠关系与各区域典型内容</text>
  <rect x="1448" y="24" width="108" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1502" y="44" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">LAYERED</text>
  <line x1="60" y1="103" x2="1540" y2="103" stroke="#E2E8F0"/>

  <!-- ===== Body: region boundary ===== -->
  <rect x="392" y="295" width="816" height="580" rx="12" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="408" y="284" width="200" height="22" rx="4" fill="#FFFFFF"/>
  <text x="416" y="300" font-size="11" font-weight="700" fill="#7C3AED">EPC Gen2 标签芯片存储体</text>
  <!-- left vertical guide: bottom->top -->
  <text x="372" y="320" font-size="10" fill="#94A3B8" text-anchor="end">顶层（高位）</text>
  <text x="372" y="868" font-size="10" fill="#94A3B8" text-anchor="end">底层（安全根）</text>

  <!-- ============================================================ -->
  <!-- Layer 1 (bottom): Reserved  Bank 00  red  h=90  y=770-860    -->
  <!-- ============================================================ -->
  <g id="layer-reserved">
    <rect x="420" y="770" width="760" height="90" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
    <!-- left band -->
    <rect x="421" y="771" width="160" height="88" rx="8" fill="#E11D48" fill-opacity="0.09"/>
    <rect x="436" y="784" width="62" height="18" rx="3" fill="#FFFFFF" stroke="#E11D48"/>
    <text x="467" y="797" font-size="10" font-weight="700" fill="#E11D48" text-anchor="middle">Bank 00</text>
    <text x="500" y="828" font-size="22" font-weight="700" fill="#E11D48">Reserved</text>
    <text x="500" y="848" font-size="10" fill="#64748B">安全根 · 64 bits</text>
    <!-- fields -->
    <rect x="610" y="790" width="250" height="50" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.2"/>
    <text x="735" y="812" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Kill Password</text>
    <text x="735" y="830" font-size="10" fill="#64748B" text-anchor="middle">灭活口令 · 32 bits</text>
    <rect x="880" y="790" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.2"/>
    <text x="1020" y="812" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Access Password</text>
    <text x="1020" y="830" font-size="10" fill="#64748B" text-anchor="middle">访问口令 · 32 bits</text>
  </g>

  <!-- arrow Reserved -> EPC -->
  <line x1="800" y1="769" x2="800" y2="733" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ah-blue)"/>

  <!-- ============================================================ -->
  <!-- Layer 2: EPC  Bank 01  blue  h=150  y=580-730  (main link)   -->
  <!-- ============================================================ -->
  <g id="layer-epc">
    <rect x="420" y="580" width="760" height="150" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.4"/>
    <rect x="421" y="581" width="160" height="148" rx="8" fill="#2563EB" fill-opacity="0.09"/>
    <rect x="436" y="594" width="62" height="18" rx="3" fill="#FFFFFF" stroke="#2563EB"/>
    <text x="467" y="607" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">Bank 01</text>
    <text x="500" y="652" font-size="26" font-weight="700" fill="#2563EB">EPC</text>
    <text x="500" y="676" font-size="11" fill="#0F172A" font-weight="600">物品标识 · 主链路</text>
    <text x="500" y="694" font-size="10" fill="#64748B">~128 bits</text>
    <!-- fields: PC / EPC序列号(highlighted) / CRC-16 -->
    <rect x="610" y="625" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
    <text x="670" y="650" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">PC bits</text>
    <text x="670" y="668" font-size="10" fill="#64748B" text-anchor="middle">协议控制 · 16</text>
    <rect x="745" y="615" width="300" height="80" rx="6" fill="#2563EB" fill-opacity="0.08" stroke="#2563EB" stroke-width="1.6"/>
    <text x="895" y="648" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">EPC 序列号</text>
    <text x="895" y="670" font-size="11" fill="#475569" text-anchor="middle">物品唯一编码 · 96 bits</text>
    <text x="895" y="686" font-size="9" fill="#64748B" text-anchor="middle">主链路核心数据</text>
    <rect x="1060" y="625" width="100" height="60" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
    <text x="1110" y="650" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">CRC-16</text>
    <text x="1110" y="668" font-size="10" fill="#64748B" text-anchor="middle">校验 · 16</text>
  </g>

  <!-- arrow EPC -> TID -->
  <line x1="800" y1="579" x2="800" y2="543" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ah-blue)"/>

  <!-- ============================================================ -->
  <!-- Layer 3: TID  Bank 10  green  h=110  y=430-540               -->
  <!-- ============================================================ -->
  <g id="layer-tid">
    <rect x="420" y="430" width="760" height="110" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <rect x="421" y="431" width="160" height="108" rx="8" fill="#10B981" fill-opacity="0.09"/>
    <rect x="436" y="444" width="62" height="18" rx="3" fill="#FFFFFF" stroke="#10B981"/>
    <text x="467" y="457" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">Bank 10</text>
    <text x="500" y="494" font-size="24" font-weight="700" fill="#10B981">TID</text>
    <text x="500" y="516" font-size="11" fill="#0F172A" font-weight="600">芯片身份</text>
    <text x="500" y="532" font-size="10" fill="#64748B">64–96 bits</text>
    <!-- fields -->
    <rect x="610" y="460" width="170" height="50" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
    <text x="695" y="482" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">厂商代码</text>
    <text x="695" y="500" font-size="10" fill="#64748B" text-anchor="middle">Class ID</text>
    <rect x="795" y="460" width="150" height="50" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
    <text x="870" y="482" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">型号</text>
    <text x="870" y="500" font-size="10" fill="#64748B" text-anchor="middle">Chip Model</text>
    <rect x="960" y="460" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
    <text x="1060" y="482" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">唯一序列号</text>
    <text x="1060" y="500" font-size="10" fill="#64748B" text-anchor="middle">Serial · 出厂固化</text>
  </g>

  <!-- arrow TID -> User -->
  <line x1="800" y1="429" x2="800" y2="403" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ah-blue)"/>

  <!-- ============================================================ -->
  <!-- Layer 4 (top): User  Bank 11  gray  h=80  y=320-400          -->
  <!-- ============================================================ -->
  <g id="layer-user">
    <rect x="420" y="320" width="760" height="80" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <rect x="421" y="321" width="160" height="78" rx="8" fill="#64748B" fill-opacity="0.09"/>
    <rect x="436" y="334" width="62" height="18" rx="3" fill="#FFFFFF" stroke="#64748B"/>
    <text x="467" y="347" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle">Bank 11</text>
    <text x="500" y="380" font-size="22" font-weight="700" fill="#64748B">User</text>
    <!-- cylinder glyph for user data bank -->
    <g transform="translate(548,360)">
      <ellipse cx="0" cy="0" rx="9" ry="3" fill="none" stroke="#64748B" stroke-width="1.3"/>
      <path d="M -9 0 L -9 14 A 9 3 0 0 0 9 14 L 9 0" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/>
      <ellipse cx="0" cy="0" rx="9" ry="3" fill="none" stroke="#64748B" stroke-width="1.3"/>
    </g>
    <!-- field -->
    <rect x="610" y="340" width="550" height="44" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="885" y="360" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">用户自定义数据</text>
    <text x="885" y="376" font-size="10" fill="#64748B" text-anchor="middle">长度可选 · 应用扩展区</text>
  </g>

  <!-- ===== Right-side callouts ===== -->
  <!-- connectors -->
  <line x1="1180" y1="815" x2="1235" y2="815" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="1180" y1="655" x2="1235" y2="655" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="1180" y1="485" x2="1235" y2="485" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="1180" y1="360" x2="1235" y2="360" stroke="#CBD5E1" stroke-width="1"/>

  <!-- callout User -->
  <rect x="1235" y="338" width="300" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="1235" y="338" width="4" height="44" fill="#64748B"/>
  <text x="1252" y="357" font-size="11" font-weight="700" fill="#334155">应用扩展</text>
  <text x="1252" y="373" font-size="10" fill="#64748B">顶层预留空间，承载用户自定义数据</text>
  <!-- callout TID -->
  <rect x="1235" y="463" width="300" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="1235" y="463" width="4" height="44" fill="#10B981"/>
  <text x="1252" y="482" font-size="11" font-weight="700" fill="#334155">芯片身份</text>
  <text x="1252" y="498" font-size="10" fill="#64748B">位于 EPC 之上，存储芯片唯一身份</text>
  <!-- callout EPC -->
  <rect x="1235" y="633" width="300" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="1235" y="633" width="4" height="44" fill="#2563EB"/>
  <text x="1252" y="652" font-size="11" font-weight="700" fill="#334155">物品标识 · 主链路</text>
  <text x="1252" y="668" font-size="10" fill="#64748B">位于 Reserved 之上，承载 EPC 编码</text>
  <!-- callout Reserved -->
  <rect x="1235" y="793" width="300" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="1235" y="793" width="4" height="44" fill="#E11D48"/>
  <text x="1252" y="812" font-size="11" font-weight="700" fill="#334155">安全基础</text>
  <text x="1252" y="828" font-size="10" fill="#64748B">最底层，为其他存储体提供安全口令</text>

  <!-- build-up direction hint -->
  <text x="822" y="760" font-size="9" fill="#94A3B8">堆叠方向</text>

  <!-- ===== Legend ===== -->
  <line x1="60" y1="895" x2="1540" y2="895" stroke="#E2E8F0"/>
  <text x="60" y="922" font-size="11" font-weight="700" fill="#475569">图例</text>

  <rect x="120" y="912" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
  <text x="142" y="922" font-size="11" fill="#334155">Reserved · 安全</text>

  <rect x="262" y="912" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="284" y="922" font-size="11" fill="#334155">EPC · 标识（主链路）</text>

  <rect x="430" y="912" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="452" y="922" font-size="11" fill="#334155">TID · 身份</text>

  <rect x="552" y="912" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="574" y="922" font-size="11" fill="#334155">User · 扩展</text>

  <line x1="690" y1="918" x2="722" y2="918" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ah-blue)"/>
  <text x="730" y="922" font-size="11" fill="#334155">主链路（自底向上构建）</text>

  <!-- ===== Caption ===== -->
  <text x="800" y="970" font-size="10" fill="#94A3B8" text-anchor="middle">图3-7 EPC Gen2 标签存储体分层结构示意 · 四个存储区按 Bank 00–11 自底向上堆叠，EPC 序列号为标识主链路核心</text>
  </svg>
</svg>