<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图3-8 物模型驱动设备互操作示意图</title>
  <desc id="desc">读者应理解物模型驱动设备互操作的示意图中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">图3-8 物模型驱动设备互操作示意图</title>
  <desc id="desc">读者应理解物模型驱动设备互操作的示意图中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图3-8 物模型驱动设备互操作示意图</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解物模型驱动设备互操作的示意图中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
  <!-- 物模型层虚线框 -->
  <rect x="590" y="330" width="620" height="140" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  
  <!-- 应用层圆形 -->
  <circle cx="840" cy="210" r="40" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <circle cx="960" cy="210" r="40" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  
  <!-- 物模型层小框 -->
  <rect x="610" y="350" width="180" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="810" y="350" width="180" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="1010" y="350" width="180" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  
  <!-- 设备层矩形（不同颜色） -->
  <rect x="590" y="520" width="140" height="80" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="750" y="520" width="140" height="80" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="910" y="520" width="140" height="80" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="1070" y="520" width="140" height="80" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  
  <!-- 设备层文字 -->
  <text x="660" y="555" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#0F172A">温度传感器</text>
  <text x="660" y="575" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#475569">(A公司, JSON)</text>
  <text x="820" y="555" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#0F172A">温度传感器</text>
  <text x="820" y="575" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#475569">(B公司, Modbus)</text>
  <text x="980" y="555" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#0F172A">振动监测仪</text>
  <text x="980" y="575" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#475569">(C公司, MQTT)</text>
  <text x="1140" y="555" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#0F172A">RFID读写器</text>
  <text x="1140" y="575" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#475569">(D公司, 二进制)</text>
  
  <!-- 物模型层小框文字 -->
  <text x="700" y="380" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#0F172A">属性 (Properties)</text>
  <text x="700" y="400" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#475569">温度、湿度、功率</text>
  <text x="900" y="380" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#0F172A">服务 (Actions)</text>
  <text x="900" y="400" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#475569">校准、重启、设定阈值</text>
  <text x="1100" y="380" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="14" font-weight="600" fill="#0F172A">事件 (Events)</text>
  <text x="1100" y="400" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#475569">温度越界、设备离线</text>
  
  <!-- 应用层圆形文字 -->
  <text x="840" y="205" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#0F172A">能源管理</text>
  <text x="840" y="222" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#475569">应用</text>
  <text x="960" y="205" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#0F172A">楼宇自控</text>
  <text x="960" y="222" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="11" fill="#475569">应用</text>
  
  <!-- 连线（先画节点后画线） -->
  <!-- dev-a -> properties (左下) -->
  <line x1="660" y1="520" x2="650" y2="450" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- dev-b -> properties (中) -->
  <line x1="820" y1="520" x2="700" y2="450" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- dev-c -> properties (右下) -->
  <line x1="980" y1="520" x2="750" y2="450" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- dev-d -> actions -->
  <line x1="1140" y1="520" x2="900" y2="450" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  
  <!-- properties -> 汇聚点 -->
  <line x1="700" y1="350" x2="900" y2="280" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- services -> 汇聚点 (实际是主线) -->
  <line x1="900" y1="350" x2="900" y2="250" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- events -> 汇聚点 (虚线) -->
  <line x1="1100" y1="350" x2="900" y2="280" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#bp-arrow-primary)"/>
  
  <!-- 汇聚箭头标签 -->
  <rect x="870" y="265" width="60" height="20" rx="4" fill="white" stroke="none"/>
  <text x="900" y="279" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#2563EB">统一输出</text>
  
  <!-- 连线标签（白底小矩形） -->
  <rect x="640" y="475" width="30" height="18" rx="3" fill="white" stroke="none"/>
  <text x="655" y="488" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#2563EB">温度</text>
  <rect x="745" y="475" width="30" height="18" rx="3" fill="white" stroke="none"/>
  <text x="760" y="488" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#2563EB">温度</text>
  <rect x="850" y="475" width="50" height="18" rx="3" fill="white" stroke="none"/>
  <text x="875" y="488" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#2563EB">振动频率</text>
  <rect x="1010" y="475" width="50" height="18" rx="3" fill="white" stroke="none"/>
  <text x="1035" y="488" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#2563EB">读取标签</text>
  
  <rect x="780" y="305" width="50" height="18" rx="3" fill="white" stroke="none"/>
  <text x="805" y="318" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#2563EB">标准属性</text>
  <rect x="875" y="290" width="50" height="18" rx="3" fill="white" stroke="none"/>
  <text x="900" y="303" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#2563EB">标准服务</text>
  <rect x="980" y="305" width="50" height="18" rx="3" fill="white" stroke="none"/>
  <text x="1005" y="318" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="10" fill="#2563EB">标准事件</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">形状=设备层用矩形表示异构设备，物模型层用虚线圆角矩形表示抽象层</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">箭头=从设备到物模型层的箭头表示“能力映射”</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">颜色=物模型层元素使用统一色调表示标准化</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图3-8 物模型作为中间抽象层，将异构设备的能力标准化，为上层应用提供统一接口。</text>
  </svg>
</svg>