<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="156.679" y="24.000" width="886.642" height="712.000" viewBox="0 0 1320.000 1060.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <rect x="0" y="0" width="1320" height="1060" fill="#FFFFFF"/>

  <!-- 标题区 -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图3-5 传感器选型决策流程</text>
  <text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">显式化智能温室选型中的隐性决策逻辑与回退路径</text>
  <rect x="1188" y="28" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1238" y="41" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle">FLOWCHART</text>
  <line x1="58" y1="103" x2="1262" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 主链路箭头(节点下层) -->
  <line x1="480" y1="183" x2="480" y2="213" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="480" y1="327" x2="480" y2="363" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="490" y="348" fill="#2563EB" font-size="11" font-weight="700">是</text>
  <line x1="480" y1="477" x2="480" y2="513" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="490" y="498" fill="#2563EB" font-size="11" font-weight="700">是</text>
  <line x1="480" y1="627" x2="480" y2="663" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="490" y="648" fill="#2563EB" font-size="11" font-weight="700">是</text>
  <line x1="480" y1="777" x2="480" y2="808" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="490" y="795" fill="#2563EB" font-size="11" font-weight="700">是</text>

  <!-- 回退箭头(虚线灰) -->
  <line x1="582" y1="270" x2="728" y2="270" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="600" y="262" fill="#64748B" font-size="11" font-weight="700">否</text>
  <line x1="582" y1="420" x2="728" y2="420" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="600" y="412" fill="#64748B" font-size="11" font-weight="700">否</text>
  <line x1="582" y1="570" x2="728" y2="570" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="600" y="562" fill="#64748B" font-size="11" font-weight="700">否</text>
  <path d="M 582 720 L 1000 720 L 1000 153 L 572 153" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="600" y="712" fill="#64748B" font-size="11" font-weight="700">否</text>
  <text x="786" y="144" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle">候选不足·扩大搜索范围</text>

  <!-- 节点 -->
  <rect x="390" y="125" width="180" height="56" rx="28" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="480" y="153" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">明确测量目标</text>

  <polygon points="480,215 580,270 480,325 380,270" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="480" y="263" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle">量程覆盖?</text>
  <text x="480" y="282" fill="#475569" font-size="9" font-weight="500" text-anchor="middle" dominant-baseline="middle">覆盖测量范围</text>

  <polygon points="480,365 580,420 480,475 380,420" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="480" y="413" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle">精度达标?</text>
  <text x="480" y="432" fill="#475569" font-size="9" font-weight="500" text-anchor="middle" dominant-baseline="middle">满足误差限</text>

  <polygon points="480,515 580,570 480,625 380,570" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="480" y="563" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle">环境耐受?</text>
  <text x="480" y="582" fill="#475569" font-size="9" font-weight="500" text-anchor="middle" dominant-baseline="middle">温湿度·IP防护</text>

  <polygon points="480,665 580,720 480,775 380,720" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="480" y="713" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle">候选充足?</text>
  <text x="480" y="732" fill="#475569" font-size="9" font-weight="500" text-anchor="middle" dominant-baseline="middle">≥3款可选型</text>

  <rect x="390" y="810" width="180" height="56" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="480" y="831" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle">输出选型清单</text>
  <text x="480" y="850" fill="#475569" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle">型号·厂商·规格</text>

  <!-- 回退调整 callout -->
  <rect x="730" y="252" width="210" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="835" y="270" fill="#334155" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle">扩大量程档位</text>
  <rect x="730" y="402" width="210" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="835" y="420" fill="#334155" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle">放宽精度要求</text>
  <rect x="730" y="552" width="210" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="835" y="570" fill="#334155" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="middle">提升防护等级</text>

  <!-- 图例 -->
  <line x1="58" y1="975" x2="1262" y2="975" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="120" y="990" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="148" y="996" fill="#64748B" font-size="11" font-weight="600" dominant-baseline="middle">步骤/动作框</text>
  <polygon points="300,988 314,996 300,1004 286,996" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="322" y="996" fill="#64748B" font-size="11" font-weight="600" dominant-baseline="middle">决策点</text>
  <line x1="440" y1="996" x2="476" y2="996" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="484" y="996" fill="#64748B" font-size="11" font-weight="600" dominant-baseline="middle">正向流程</text>
  <line x1="600" y1="996" x2="636" y2="996" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ah-gray)"/>
  <text x="644" y="996" fill="#64748B" font-size="11" font-weight="600" dominant-baseline="middle">回退调整</text>

  <text x="660" y="1040" fill="#94A3B8" font-size="10" text-anchor="middle">图3-5 传感器选型的一般性决策流程，适用于各类IoT项目。</text>
  </svg>
</svg>