  <desc id="desc">读者应理解RFID在智能仓储中的应用拓扑示意中的主链路、责任边界和工程取舍。</desc>

  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图3-3 RFID在智能仓储中的应用拓扑示意</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解RFID在智能仓储中的应用拓扑示意中的主链路、责任边界和工程取舍。</text>

  <g data-layout="layered">
  <!-- 区域边界 -->
  <!-- 云端层 -->
  <rect x="110" y="130" width="1560" height="130" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="120" y="150" fill="#0F172A" font-size="14" font-weight="600">云端层</text>
  <!-- 边缘层 -->
  <rect x="110" y="290" width="1560" height="130" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- 现场层 -->
  <rect x="110" y="450" width="1560" height="270" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="120" y="470" fill="#0F172A" font-size="14" font-weight="600">现场层</text>
  <!-- 入库区 -->
  <rect x="130" y="470" width="420" height="230" rx="8" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="140" y="488" fill="#64748B" font-size="12">入库区</text>
  <!-- 货架区 -->

  <text x="1140" y="488" fill="#64748B" font-size="12">出库区</text>

  <!-- RFID标签 → 固定式读写器A（双向） -->
  <line x1="840" y1="630" x2="340" y2="540" stroke="#2563EB" stroke-width="1.5"/>
  <polygon points="840,635 835,620 845,620" fill="#2563EB" transform="rotate(-26.6,840,630)"/>
  <polygon points="340,545 335,530 345,530" fill="#2563EB" transform="rotate(153.4,340,540)"/>
  <!-- RFID标签 → 固定式读写器B（双向） -->
  <line x1="840" y1="630" x2="1390" y2="540" stroke="#2563EB" stroke-width="1.5"/>
  <polygon points="840,635 835,620 845,620" fill="#2563EB" transform="rotate(26.6,840,630)"/>
  <polygon points="1390,545 1385,530 1395,530" fill="#2563EB" transform="rotate(-153.4,1390,540)"/>
  <!-- RFID标签 → 手持终端（双向） -->
  <line x1="840" y1="630" x2="840" y2="520" stroke="#2563EB" stroke-width="1.5"/>
  <polygon points="840,635 835,620 845,620" fill="#2563EB"/>
  <polygon points="840,515 835,530 845,530" fill="#2563EB"/>
  <!-- 固定式读写器A → RFID中间件（有线，实线） -->
  <line x1="340" y1="500" x2="850" y2="400" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="8,4"/>
  <polygon points="850,405 835,395 845,390" fill="#0F766E" transform="rotate(-135,850,400)"/>
  <!-- 固定式读写器B → RFID中间件（有线，实线） -->
  <line x1="1390" y1="500" x2="850" y2="400" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="8,4"/>
  <polygon points="850,405 835,395 845,390" fill="#0F766E" transform="rotate(-45,850,400)"/>
  <!-- 手持终端 → RFID中间件（无线，虚线） -->
  <line x1="840" y1="480" x2="840" y2="400" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="840,405 835,395 845,395" fill="#2563EB"/>
  <!-- RFID中间件 → 仓库管理系统（虚线，事件） -->
  <line x1="850" y1="320" x2="850" y2="250" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="850,255 845,245 855,245" fill="#2563EB"/>

  <!-- 节点 -->
  <!-- 仓库管理系统 (WMS/ERP) -->
  <g>
    <rect x="700" y="170" width="300" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="700" y="170" width="300" height="80" rx="10" fill="white" fill-opacity="0.5"/>
    <text x="850" y="200" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">仓库管理系统 (WMS/ERP)</text>
    <text x="850" y="220" fill="#64748B" font-size="12" text-anchor="middle">应用服务器 + 数据库</text>
  </g>
  <!-- RFID中间件 -->
  <g>
    <rect x="740" y="320" width="220" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="740" y="320" width="220" height="80" rx="10" fill="white" fill-opacity="0.5"/>
    <text x="850" y="350" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">RFID中间件</text>
    <text x="850" y="370" fill="#64748B" font-size="12" text-anchor="middle">边缘服务器/工控机</text>
  </g>
  <!-- 固定式读写器A（入库） -->
  <g>
    <rect x="230" y="500" width="220" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="230" y="500" width="220" height="80" rx="10" fill="white" fill-opacity="0.5"/>
    <text x="340" y="530" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">固定式读写器A</text>
    <text x="340" y="550" fill="#64748B" font-size="11" text-anchor="middle">天线×2 · 入库门禁</text>
  </g>
  <!-- 固定式读写器B（出库） -->
  <g>
    <rect x="1280" y="500" width="220" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="1280" y="500" width="220" height="80" rx="10" fill="white" fill-opacity="0.5"/>
    <text x="1390" y="530" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">固定式读写器B</text>
    <text x="1390" y="550" fill="#64748B" font-size="11" text-anchor="middle">天线×2 · 出库门禁</text>
  </g>
  <!-- 手持终端（货架区） -->
  <g>
    <rect x="730" y="440" width="220" height="80" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="730" y="440" width="220" height="80" rx="10" fill="white" fill-opacity="0.5"/>
    <text x="840" y="470" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle">手持终端</text>
    <text x="840" y="490" fill="#64748B" font-size="11" text-anchor="middle">移动式UHF手持机</text>
  </g>
  <!-- RFID标签 -->
  <g>
    <rect x="765" y="600" width="150" height="60" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="765" y="600" width="150" height="60" rx="8" fill="white" fill-opacity="0.5"/>
    <text x="840" y="625" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">RFID标签</text>
    <text x="840" y="645" fill="#64748B" font-size="11" text-anchor="middle">EPC Gen2 无源</text>
  </g>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">云端层：深蓝色背景</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">有线连接：实线箭头；无线连接：虚线箭头</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">读写器元件：主机带天线图标；手持机元件：手持设备图标</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图3-3 展示UHF RFID在仓储场景中固定式门禁与手持终端配合使用的典型部署模式。假设场景：固定式读写器在数秒内可读取约50-100个标签（取决于标签密度与天线安装角度）。不同区域用不同颜色标识。</text>
  </svg>
</svg>
