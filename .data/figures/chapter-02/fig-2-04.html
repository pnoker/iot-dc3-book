<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图2-04 IoT DC3 五大中心逻辑关系</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="37.788" width="1152.000" height="684.424" viewBox="0 0 1700.000 1010.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1700" height="1010" fill="#FFFFFF"/>

  <!-- ===================== TITLE ===================== -->
  <g id="title">
    <circle cx="64" cy="40" r="6" fill="#2563EB"/>
    <text x="84" y="46" font-size="22" font-weight="700" fill="#0F172A">图2-4 IoT DC3 五大中心逻辑关系</text>
    <text x="84" y="68" font-size="12" fill="#64748B">IoT DC3 Five Centers · 自上而下分层，Gateway 作为北向唯一入口统一下层调用</text>
    <rect x="1500" y="28" width="140" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1570" y="44" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.5">ARCHITECTURE</text>
    <line x1="44" y1="103" x2="1656" y2="103" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- ===================== LAYER BANDS (dashed boundary + tint) ===================== -->
  <!-- 接入层 — purple -->
  <g id="band-access">
    <rect x="44" y="118" width="1228" height="148" rx="8" fill="#7C3AED" fill-opacity="0.04" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="8 4"/>
    <rect x="60" y="130" width="92" height="26" rx="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="106" y="148" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="middle">接入层</text>
  </g>
  <!-- 基础服务层 — gray -->
  <g id="band-base">
    <rect x="44" y="284" width="1228" height="154" rx="8" fill="#64748B" fill-opacity="0.04" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8 4"/>
    <rect x="60" y="296" width="116" height="26" rx="13" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <text x="118" y="314" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle">基础服务层</text>
  </g>
  <!-- 核心数据层 — blue -->
  <g id="band-data">
    <rect x="44" y="456" width="1228" height="194" rx="8" fill="#2563EB" fill-opacity="0.04" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
    <rect x="60" y="468" width="116" height="26" rx="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="118" y="486" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">核心数据层</text>
  </g>
  <!-- 智能层 — orange -->
  <g id="band-agentic">
    <rect x="44" y="668" width="1228" height="150" rx="8" fill="#F59E0B" fill-opacity="0.04" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 4"/>
    <rect x="60" y="680" width="92" height="26" rx="13" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="106" y="698" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">智能层</text>
  </g>
  <!-- 外部基础设施 — gray (right column) -->
  <g id="band-external">
    <rect x="1296" y="456" width="356" height="272" rx="8" fill="#64748B" fill-opacity="0.04" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8 4"/>
    <rect x="1312" y="468" width="140" height="26" rx="13" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <text x="1382" y="486" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle">外部基础设施</text>
  </g>

  <!-- ===================== COMPONENT CARDS ===================== -->
  <!-- Gateway 中心 (接入层) — purple -->
  <g id="c-gateway">
    <rect x="456" y="148" width="420" height="90" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="666" y="178" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Gateway 中心</text>
    <text x="666" y="198" font-size="10" fill="#64748B" text-anchor="middle">北向唯一入口</text>
    <text x="666" y="218" font-size="9" fill="#94A3B8" text-anchor="middle">路由 · 鉴权 · 限流</text>
  </g>
  <!-- Auth 中心 (基础服务层) — red -->
  <g id="c-auth">
    <rect x="328" y="318" width="240" height="90" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
    <text x="448" y="348" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Auth 中心</text>
    <text x="448" y="368" font-size="10" fill="#64748B" text-anchor="middle">身份认证</text>
    <text x="448" y="388" font-size="9" fill="#94A3B8" text-anchor="middle">RBAC 权限管理</text>
  </g>
  <!-- Manager 中心 (基础服务层) — green -->
  <g id="c-manager">
    <rect x="766" y="318" width="240" height="90" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="886" y="348" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Manager 中心</text>
    <text x="886" y="368" font-size="10" fill="#64748B" text-anchor="middle">元数据管理</text>
    <text x="886" y="388" font-size="9" fill="#94A3B8" text-anchor="middle">设备模板 · 位号 · 规则</text>
  </g>
  <!-- Data 中心 (核心数据层) — blue, 数据枢纽 -->
  <g id="c-data">
    <rect x="541" y="490" width="250" height="122" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.4"/>
    <text x="666" y="522" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Data 中心</text>
    <text x="666" y="542" font-size="10" fill="#475569" text-anchor="middle">数据核心枢纽</text>
    <line x1="561" y1="554" x2="771" y2="554" stroke="#E2E8F0" stroke-width="1"/>
    <text x="666" y="574" font-size="9" fill="#64748B" text-anchor="middle">位号写入 · 查询 · 命令下发</text>
    <text x="666" y="594" font-size="9" fill="#94A3B8" text-anchor="middle">REST + AMQP</text>
  </g>
  <!-- Agentic 中心 (智能层) — orange -->
  <g id="c-agentic">
    <rect x="541" y="694" width="250" height="90" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="666" y="724" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Agentic 中心</text>
    <text x="666" y="744" font-size="10" fill="#64748B" text-anchor="middle">AI 推理编排</text>
    <text x="666" y="764" font-size="9" fill="#94A3B8" text-anchor="middle">Spring AI · 大模型</text>
  </g>
  <!-- 消息队列 (外部) — gray -->
  <g id="c-mq">
    <rect x="1326" y="514" width="296" height="76" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="1474" y="544" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">消息队列</text>
    <text x="1474" y="566" font-size="10" fill="#64748B" text-anchor="middle">AMQP · 解耦采集与下发</text>
  </g>
  <!-- 时序数据库 (外部) — gray, cylinder -->
  <g id="c-tsdb">
    <rect x="1362" y="624" width="224" height="94" fill="#FFFFFF"/>
    <line x1="1362" y1="624" x2="1362" y2="718" stroke="#64748B" stroke-width="2"/>
    <line x1="1586" y1="624" x2="1586" y2="718" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="1474" cy="624" rx="112" ry="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <path d="M 1362 718 A 112 12 0 0 0 1586 718" fill="none" stroke="#64748B" stroke-width="2"/>
    <text x="1474" y="672" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">时序数据库</text>
    <text x="1474" y="692" font-size="10" fill="#64748B" text-anchor="middle">持久化位号时序值</text>
  </g>

  <!-- ===================== ARROWS ===================== -->
  <g id="arrows">
    <!-- Gateway → Auth (REST, solid blue) -->
    <line x1="556" y1="238" x2="450" y2="312" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <!-- Gateway → Manager (REST, solid blue) -->
    <line x1="776" y1="238" x2="884" y2="312" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <!-- Gateway → Data (REST, main link, solid blue highlighted) -->
    <line x1="666" y1="238" x2="666" y2="484" stroke="#2563EB" stroke-width="2.4" marker-end="url(#ah-blue)"/>
    <text x="676" y="372" font-size="9" fill="#475569">REST</text>
    <!-- Gateway → Agentic (REST, solid blue, left channel) -->
    <path d="M 456 193 L 208 193 L 208 748 L 535 748" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <text x="332" y="186" font-size="9" fill="#475569" text-anchor="middle">REST · AI 请求</text>

    <!-- Agentic → Data (internal, dashed gray) -->
    <line x1="646" y1="694" x2="646" y2="618" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <text x="640" y="660" font-size="9" fill="#64748B" text-anchor="end">内部调用</text>
    <!-- Agentic → Manager (internal, dashed gray, right-inner channel) -->
    <path d="M 791 748 L 886 748 L 886 414" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <text x="894" y="560" font-size="9" fill="#64748B">内部调用</text>

    <!-- Data ↔ 消息队列 (AMQP, double line, bidirectional gray) -->
    <line x1="791" y1="542" x2="1320" y2="542" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah-gray)"/>
    <line x1="1326" y1="554" x2="797" y2="554" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah-gray)"/>
    <text x="1056" y="534" font-size="9" fill="#64748B" text-anchor="middle">AMQP（双线）</text>

    <!-- Data → 时序数据库 (client, solid blue, write/query) -->
    <path d="M 791 588 L 1272 588 L 1272 666 L 1356 666" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <text x="1030" y="580" font-size="9" fill="#475569" text-anchor="middle">写入 / 查询</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g id="legend">
    <rect x="44" y="842" width="1612" height="46" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <!-- component swatches -->
    <rect x="64" y="864" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="86" y="874" font-size="11" fill="#475569">接入 Gateway</text>
    <rect x="210" y="864" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
    <text x="232" y="874" font-size="11" fill="#475569">鉴权 Auth</text>
    <rect x="338" y="864" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="360" y="874" font-size="11" fill="#475569">元数据 Manager</text>
    <rect x="500" y="864" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="522" y="874" font-size="11" fill="#475569">数据枢纽 Data</text>
    <rect x="662" y="864" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="684" y="874" font-size="11" fill="#475569">AI Agentic</text>
    <rect x="798" y="864" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <text x="820" y="874" font-size="11" fill="#475569">外部基础设施</text>
    <!-- line styles -->
    <line x1="970" y1="870" x2="1000" y2="870" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <text x="1008" y="874" font-size="11" fill="#475569">REST 调用</text>
    <line x1="1110" y1="870" x2="1140" y2="870" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <text x="1148" y="874" font-size="11" fill="#475569">Agentic 内部调用</text>
    <line x1="1290" y1="867" x2="1320" y2="867" stroke="#64748B" stroke-width="1.6"/>
    <line x1="1290" y1="875" x2="1320" y2="875" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah-gray)"/>
    <text x="1328" y="874" font-size="11" fill="#475569">AMQP 消息（双线）</text>
    <text x="1640" y="874" font-size="10" fill="#64748B" text-anchor="end">北向入口 ↓ 下层调用 · 数据经由 MQ 解耦</text>
  </g>

  <!-- ===================== CAPTION ===================== -->
  <g id="caption">
    <text x="850" y="918" font-size="10" fill="#94A3B8" text-anchor="middle">图2-4 IoT DC3 五大中心逻辑关系。Gateway 是北向唯一入口，统一路由并调用下层服务；Auth 提供鉴权上下文，Manager 提供设备/位号/规则元数据。</text>
    <text x="850" y="936" font-size="10" fill="#94A3B8" text-anchor="middle">Data 是数据核心枢纽，承担位号读写与命令下发；Agentic 是 AI 推理编排层；消息队列解耦采集与下发，时序数据库持久化位号值。</text>
  </g>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">architecture</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">自上而下分层。接入层（Gateway 中心）→ 基础服务层（Auth 中心、Manager 中心）→ 核心数据层（Data 中心）→ 智能层（Agentic 中心）；外部基础设施（消息队列、时序数据库）位于右侧。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
