<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五大中心协同流程时序图（智能灌溉场景）</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="96.226" y="24.000" width="1007.547" height="712.000" viewBox="0 0 1500.000 1060.000" preserveAspectRatio="xMidYMid meet">
<rect x="0" y="0" width="1500" height="1060" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- ========= 标题区 ========= -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="80" y="47" font-size="22" font-weight="700" fill="#0F172A">五大中心协同流程时序图（智能灌溉场景）</text>
  <text x="80" y="70" font-size="12" fill="#64748B">从设备注册到 Agentic 推理的完整时序 · 主链路：现场设备 → Gateway → Data → Agentic</text>
  <rect x="1360" y="24" width="110" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1415" y="40" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="1">SEQUENCE</text>
  <line x1="56" y1="103" x2="1444" y2="103" stroke="#E2E8F0"/>

  <!-- ========= 域分组背景带（顶部） ========= -->
  <g opacity="0.55">
    <rect x="110" y="118" width="120" height="72" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2" stroke-dasharray="6 3"/>
    <rect x="310" y="118" width="720" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="6 3"/>
    <rect x="1110" y="118" width="120" height="72" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="6 3"/>
    <rect x="1310" y="118" width="120" height="72" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="6 3"/>
  </g>
  <text x="170" y="133" font-size="9.5" fill="#10B981" text-anchor="middle" font-weight="700">设备与边缘域</text>
  <text x="670" y="133" font-size="9.5" fill="#2563EB" text-anchor="middle" font-weight="700">平台服务域</text>
  <text x="1170" y="133" font-size="9.5" fill="#7C3AED" text-anchor="middle" font-weight="700">数据资产域</text>
  <text x="1370" y="133" font-size="9.5" fill="#F59E0B" text-anchor="middle" font-weight="700">智能决策域</text>

  <!-- ========= 阶段标签（左侧） ========= -->
  <g>
    <rect x="14" y="200" width="78" height="220" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="53" y="313" font-size="12" fill="#2563EB" text-anchor="middle" font-weight="700">注册</text>
    <text x="53" y="332" font-size="9" fill="#64748B" text-anchor="middle">①②③④</text>

    <rect x="14" y="425" width="78" height="115" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="53" y="478" font-size="12" fill="#10B981" text-anchor="middle" font-weight="700">配置</text>
    <text x="53" y="497" font-size="9" fill="#64748B" text-anchor="middle">⑤⑥</text>

    <rect x="14" y="545" width="78" height="155" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="53" y="617" font-size="12" fill="#7C3AED" text-anchor="middle" font-weight="700">上报</text>
    <text x="53" y="636" font-size="9" fill="#64748B" text-anchor="middle">⑦⑧⑨</text>

    <rect x="14" y="705" width="78" height="145" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="53" y="770" font-size="12" fill="#F59E0B" text-anchor="middle" font-weight="700">推理</text>
    <text x="53" y="789" font-size="9" fill="#64748B" text-anchor="middle">⑩⑪⑫</text>
  </g>

  <!-- ========= 参与者头部卡 ========= -->
  <!-- 现场设备 (edge/绿) -->
  <rect x="120" y="146" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="170" y="165" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">现场设备</text>
  <text x="170" y="179" font-size="9" fill="#64748B" text-anchor="middle">edge · 传感器/阀门</text>

  <!-- Gateway (platform/蓝) -->
  <rect x="320" y="146" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="370" y="165" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Gateway</text>
  <text x="370" y="179" font-size="9" fill="#64748B" text-anchor="middle">接入网关</text>

  <!-- Auth (platform/蓝) -->
  <rect x="520" y="146" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="570" y="165" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Auth</text>
  <text x="570" y="179" font-size="9" fill="#64748B" text-anchor="middle">认证中心</text>

  <!-- 运维人员 (platform/蓝) -->
  <rect x="720" y="146" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="770" y="165" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">运维人员</text>
  <text x="770" y="179" font-size="9" fill="#64748B" text-anchor="middle">actor</text>

  <!-- Manager (platform/蓝) -->
  <rect x="920" y="146" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="970" y="165" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Manager</text>
  <text x="970" y="179" font-size="9" fill="#64748B" text-anchor="middle">设备元数据</text>

  <!-- Data (data/紫) -->
  <rect x="1120" y="146" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1170" y="165" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Data</text>
  <text x="1170" y="179" font-size="9" fill="#64748B" text-anchor="middle">时序数据</text>

  <!-- Agentic (ai/橙) -->
  <rect x="1320" y="146" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1370" y="165" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Agentic</text>
  <text x="1370" y="179" font-size="9" fill="#64748B" text-anchor="middle">推理中心</text>

  <!-- ========= 生命线 ========= -->
  <g stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="170" y1="186" x2="170" y2="870"/>
    <line x1="370" y1="186" x2="370" y2="870"/>
    <line x1="570" y1="186" x2="570" y2="870"/>
    <line x1="770" y1="186" x2="770" y2="870"/>
    <line x1="970" y1="186" x2="970" y2="870"/>
    <line x1="1170" y1="186" x2="1170" y2="870"/>
    <line x1="1370" y1="186" x2="1370" y2="870"/>
  </g>

  <!-- ========= 消息（编号时序） ========= -->
  <!-- ① 现场设备→Gateway 注册请求 (主链路 蓝) -->
  <line x1="170" y1="235" x2="365" y2="235" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="270" y="227" font-size="11.5" fill="#0F172A" text-anchor="middle" font-weight="600">① 注册请求（设备ID / 初始令牌）</text>

  <!-- ② Gateway→Auth 验证设备身份 -->
  <line x1="370" y1="290" x2="565" y2="290" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="470" y="282" font-size="11" fill="#334155" text-anchor="middle">② 验证设备身份</text>

  <!-- ③ Auth→Gateway 返回JWT (虚线响应) -->
  <line x1="570" y1="345" x2="375" y2="345" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="470" y="337" font-size="11" fill="#334155" text-anchor="middle">③ 返回 JWT 凭证</text>

  <!-- ④ Gateway→现场设备 认证成功 -->
  <line x1="370" y1="400" x2="175" y2="400" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="270" y="392" font-size="11" fill="#334155" text-anchor="middle">④ 认证成功，允许接入</text>

  <!-- ⑤ 运维人员→Manager 创建元数据/位号/规则 -->
  <line x1="770" y1="455" x2="965" y2="455" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="870" y="447" font-size="11" fill="#334155" text-anchor="middle">⑤ 创建设备元数据 / 位号 / 规则</text>

  <!-- ⑥ Manager→Data 同步规则配置 -->
  <line x1="970" y1="510" x2="1165" y2="510" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="1070" y="502" font-size="11" fill="#334155" text-anchor="middle">⑥ 同步规则配置</text>

  <!-- ⑦ 现场设备→Gateway 上报传感器数据 (主链路 蓝) -->
  <line x1="170" y1="575" x2="365" y2="575" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="270" y="567" font-size="11.5" fill="#0F172A" text-anchor="middle" font-weight="600">⑦ 上报传感器数据（原始值）</text>

  <!-- ⑧ Gateway→Data 转发归一化PointValue (主链路 蓝) -->
  <line x1="370" y1="630" x2="1165" y2="630" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="770" y="622" font-size="11.5" fill="#0F172A" text-anchor="middle" font-weight="600">⑧ 转发归一化数据（PointValue）</text>

  <!-- ⑨ Data→Data 自调用 写入时序库+规则检查 (self) -->
  <path d="M 1170 670 L 1235 670 L 1235 700 L 1175 700" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#ah-gray)"/>
  <text x="1245" y="679" font-size="11" fill="#334155">⑨ 写入时序库 + 触发规则</text>
  <text x="1245" y="694" font-size="9" fill="#64748B">（内部处理 ..）</text>

  <!-- ⑩ Data→Agentic 推送推理 (主链路 蓝) -->
  <line x1="1170" y1="735" x2="1365" y2="735" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="1270" y="727" font-size="11.5" fill="#0F172A" text-anchor="middle" font-weight="600">⑩ 推送，推理由中心介入</text>

  <!-- ⑪ Agentic→Data 查询历史湿度 Tool-Calling -->
  <line x1="1370" y1="790" x2="1175" y2="790" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#ah-gray)"/>
  <text x="1270" y="782" font-size="11" fill="#334155" text-anchor="middle">⑪ 查询历史湿度（Tool-Calling）</text>

  <!-- ⑫ Data→Agentic 返回时序数据 (虚线响应) -->
  <line x1="1170" y1="835" x2="1365" y2="835" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1270" y="827" font-size="11" fill="#334155" text-anchor="middle">⑫ 返回时序数据</text>

  <!-- 主链路强调注释 callout -->
  <rect x="980" y="892" width="446" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="996" y="910" font-size="11" fill="#334155">闭环主链路（蓝）：现场设备 → Gateway → Data → Agentic。</text>
  <text x="996" y="926" font-size="11" fill="#334155">位号值 PointValue 沿此路径逐跳传递至推理中心。</text>

  <!-- ========= 分隔线 ========= -->
  <line x1="56" y1="955" x2="1444" y2="955" stroke="#E2E8F0"/>

  <!-- ========= 图例 ========= -->
  <g>
    <text x="64" y="978" font-size="11" font-weight="700" fill="#475569">图例</text>

    <line x1="110" y1="975" x2="150" y2="975" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
    <text x="158" y="979" font-size="10.5" fill="#475569">实线（主链路/同步调用）</text>

    <line x1="330" y1="975" x2="370" y2="975" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
    <text x="378" y="979" font-size="10.5" fill="#475569">实线（普通同步调用）</text>

    <line x1="540" y1="975" x2="580" y2="975" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <text x="588" y="979" font-size="10.5" fill="#475569">虚线（异步返回 / 响应）</text>

    <line x1="760" y1="975" x2="800" y2="975" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2 3"/>
    <text x="808" y="979" font-size="10.5" fill="#475569">点线（内部处理 ..）</text>

    <!-- 域色块 -->
    <rect x="950" y="968" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="972" y="979" font-size="10.5" fill="#475569">edge</text>
    <rect x="1010" y="968" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1032" y="979" font-size="10.5" fill="#475569">platform</text>
    <rect x="1098" y="968" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="1120" y="979" font-size="10.5" fill="#475569">data</text>
    <rect x="1168" y="968" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="1190" y="979" font-size="10.5" fill="#475569">ai</text>
  </g>

  <!-- ========= caption ========= -->
  <text x="750" y="1018" font-size="10" fill="#94A3B8" text-anchor="middle">图2-10 五大中心协同流程时序图（智能灌溉场景）｜来源：本书教学示意图，数值仅用于说明结构关系。</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">sequence</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">horizontal</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
