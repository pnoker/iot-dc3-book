<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Data中心数据流示意：从设备采集到时序存储</title>
  <desc id="desc">读者应理解Data中心数据流示意：从设备采集到时序存储中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">Data中心数据流示意：从设备采集到时序存储</title>
  <desc id="desc">读者应理解Data中心数据流示意：从设备采集到时序存储中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">Data中心数据流示意：从设备采集到时序存储</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解Data中心数据流示意：从设备采集到时序存储中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">DATAFLOW</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="dataflow">
  <!-- Regions -->
  <rect x='130' y='390' width='220' height='120' rx='8' fill='none' stroke='#94A3B8' stroke-width='1.5' stroke-dasharray='8,4'/>
  <text x='140' y='405' fill='#475569' font-size='14' font-weight='600'>设备与边缘域</text>
  <rect x='350' y='390' width='460' height='120' rx='8' fill='none' stroke='#94A3B8' stroke-width='1.5' stroke-dasharray='8,4'/>
  <text x='360' y='405' fill='#475569' font-size='14' font-weight='600'>平台服务域</text>
  <rect x='810' y='390' width='920' height='120' rx='8' fill='none' stroke='#94A3B8' stroke-width='1.5' stroke-dasharray='8,4'/>
  <text x='820' y='405' fill='#475569' font-size='14' font-weight='600'>数据资产域</text>

  <!-- Connections (behind nodes) -->
  <line x1='330' y1='450' x2='380' y2='450' stroke='#2563EB' stroke-width='2' marker-end='url(#bp-arrow-primary)'/>
  <line x1='560' y1='450' x2='610' y2='450' stroke='#2563EB' stroke-width='2' marker-end='url(#bp-arrow-primary)'/>
  <line x1='790' y1='450' x2='840' y2='450' stroke='#2563EB' stroke-width='2' marker-end='url(#bp-arrow-primary)'/>
  <line x1='1020' y1='450' x2='1070' y2='450' stroke='#2563EB' stroke-width='2' marker-end='url(#bp-arrow-primary)'/>
  <line x1='1250' y1='450' x2='1300' y2='450' stroke='#2563EB' stroke-width='2' marker-end='url(#bp-arrow-primary)'/>
  <line x1='1480' y1='450' x2='1530' y2='450' stroke='#2563EB' stroke-width='2' marker-end='url(#bp-arrow-primary)'/>

  <!-- Nodes -->
  <!-- device -->
  <rect x='150' y='410' width='180' height='80' rx='10' fill='#EFF6FF' stroke='#4A90D9' stroke-width='1.5'/>
  <text x='240' y='436' fill='#0F172A' font-size='16' font-weight='600' text-anchor='middle'>现场设备</text>
  <text x='240' y='456' fill='#64748B' font-size='13' text-anchor='middle'>物理设备，如PLC、电表、传感器</text>

  <!-- driver -->
  <rect x='380' y='410' width='180' height='80' rx='10' fill='#FFF7ED' stroke='#E67E22' stroke-width='1.5'/>
  <text x='470' y='436' fill='#0F172A' font-size='16' font-weight='600' text-anchor='middle'>驱动 dc3-driver-*</text>
  <text x='470' y='456' fill='#64748B' font-size='13' text-anchor='middle'>
    <tspan x='470' dy='0'>南向协议驱动</tspan>
    <tspan x='470' dy='18'>将原始信号归一为PointVal</tspan>
  </text>

  <!-- gateway -->
  <rect x='610' y='410' width='180' height='80' rx='10' fill='#ECFDF5' stroke='#27AE60' stroke-width='1.5'/>
  <text x='700' y='436' fill='#0F172A' font-size='16' font-weight='600' text-anchor='middle'>Gateway</text>
  <text x='700' y='456' fill='#64748B' font-size='13' text-anchor='middle'>唯一对外HTTP入口，完成鉴权与路由</text>

  <!-- datacenter -->
  <rect x='840' y='410' width='180' height='80' rx='10' fill='#F5F3FF' stroke='#8E44AD' stroke-width='1.5'/>
  <text x='930' y='436' fill='#0F172A' font-size='16' font-weight='600' text-anchor='middle'>Data中心 dc3-center-data</text>
  <text x='930' y='456' fill='#64748B' font-size='13' text-anchor='middle'>负责数据接收、缓冲与分发的核心服务</text>

  <!-- mq -->
  <rect x='1070' y='410' width='180' height='80' rx='10' fill='#F8FAFC' stroke='#7F8C8D' stroke-width='1.5'/>
  <text x='1160' y='436' fill='#0F172A' font-size='16' font-weight='600' text-anchor='middle'>RabbitMQ 消息队列</text>
  <text x='1160' y='456' fill='#64748B' font-size='13' text-anchor='middle'>
    <tspan x='1160' dy='0'>异步缓冲层，削峰填谷</tspan>
    <tspan x='1160' dy='18'>解耦写入与消费</tspan>
  </text>

  <!-- store -->
  <rect x='1300' y='410' width='180' height='80' rx='10' fill='#FFFBEB' stroke='#F1C40F' stroke-width='1.5'/>
  <text x='1390' y='436' fill='#0F172A' font-size='16' font-weight='600' text-anchor='middle'>时序数据库 TimescaleDB</text>
  <text x='1390' y='456' fill='#64748B' font-size='13' text-anchor='middle'>持久化存储，支持时间范围查询与聚合</text>

  <!-- consumer -->
  <rect x='1530' y='410' width='180' height='80' rx='10' fill='#F5F3FF' stroke='#8E44AD' stroke-width='1.5'/>
  <text x='1620' y='436' fill='#0F172A' font-size='16' font-weight='600' text-anchor='middle'>订阅方（监控/Agentic/告警）</text>
  <text x='1620' y='456' fill='#64748B' font-size='13' text-anchor='middle'>消费数据的下游服务</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝=核心平台与主链路</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">青绿=设备、边缘与接入</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">橙=AI，紫=数据，红=安全</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">Data中心数据流示意图</text>
  </svg>
</svg>