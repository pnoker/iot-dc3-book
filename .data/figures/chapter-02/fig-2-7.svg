<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">五大中心协同流程时序图（智能灌溉场景）</title>
  <desc id="desc">读者应理解五大中心协同流程时序图（智能灌溉场景）中的主链路、责任边界和工程取舍。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">五大中心协同流程时序图（智能灌溉场景）</title>
  <desc id="desc">读者应理解五大中心协同流程时序图（智能灌溉场景）中的主链路、责任边界和工程取舍。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">五大中心协同流程时序图（智能灌溉场景）</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解五大中心协同流程时序图（智能灌溉场景）中的主链路、责任边界和工程取舍。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">SEQUENCE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="sequence">
  <!-- 区域边界 -->
  <rect x="230" y="110" width="240" height="590" rx="8" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="240" y="130" fill="#0F766E" font-size="12" font-weight="600">设备与边缘域</text>
  <rect x="470" y="110" width="350" height="590" rx="8" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="480" y="130" fill="#2563EB" font-size="12" font-weight="600">平台服务域</text>
  <rect x="820" y="110" width="110" height="590" rx="8" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="830" y="130" fill="#7C3AED" font-size="12" font-weight="600">数据资产域</text>
  <rect x="930" y="110" width="110" height="590" rx="8" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="940" y="130" fill="#F97316" font-size="12" font-weight="600">智能决策域</text>

  <!-- 生命线 -->
  <line x1="295" y1="210" x2="295" y2="700" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="405" y1="210" x2="405" y2="700" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="515" y1="210" x2="515" y2="700" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="625" y1="210" x2="625" y2="700" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="735" y1="210" x2="735" y2="700" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="845" y1="210" x2="845" y2="700" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="955" y1="210" x2="955" y2="700" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1065" y1="210" x2="1065" y2="700" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 参与者框 -->
  <!-- 现场设备 -->
  <rect x="250" y="130" width="90" height="80" rx="10" fill="white" stroke="#0F766E" stroke-width="1.5"/>
  <rect x="250" y="130" width="90" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="295" y="168" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">现场设备</text>
  <!-- Gateway -->
  <rect x="360" y="130" width="90" height="80" rx="10" fill="white" stroke="#F97316" stroke-width="1.5"/>
  <rect x="360" y="130" width="90" height="80" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="405" y="168" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">Gateway</text>
  <!-- Auth -->
  <rect x="470" y="130" width="90" height="80" rx="10" fill="white" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="470" y="130" width="90" height="80" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="515" y="168" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">Auth</text>
  <!-- 运维人员 -->
  <rect x="580" y="130" width="90" height="80" rx="10" fill="white" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="580" y="130" width="90" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="625" y="168" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">运维人员</text>
  <!-- Manager -->
  <rect x="690" y="130" width="90" height="80" rx="10" fill="white" stroke="#059669" stroke-width="1.5"/>
  <rect x="690" y="130" width="90" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="735" y="168" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">Manager</text>
  <!-- Data -->
  <rect x="800" y="130" width="90" height="80" rx="10" fill="white" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="800" y="130" width="90" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="845" y="168" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">Data</text>
  <!-- Agentic -->
  <rect x="910" y="130" width="90" height="80" rx="10" fill="white" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="910" y="130" width="90" height="80" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="955" y="168" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">Agentic</text>
  <!-- 驱动 -->
  <rect x="1020" y="130" width="90" height="80" rx="10" fill="white" stroke="#0D9488" stroke-width="1.5"/>
  <rect x="1020" y="130" width="90" height="80" rx="10" fill="#ECFDF5" stroke="#0D9488" stroke-width="1.5"/>
  <text x="1065" y="168" fill="#0F172A" font-size="16" font-weight="600" text-anchor="middle">驱动</text>

  <!-- 消息线 -->
  <!-- ① 注册请求（设备ID/初始令牌）: 现场设备 -> Gateway, y=220 -->
  <line x1="295" y1="220" x2="405" y2="220" stroke="#64748B" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="310" y="210" width="160" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="390" y="225" fill="#0F172A" font-size="11" text-anchor="middle">① 注册请求（设备ID/初始令牌）</text>

  <!-- ② 验证设备身份: Gateway -> Auth, y=260 -->
  <line x1="405" y1="260" x2="515" y2="260" stroke="#64748B" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="425" y="250" width="140" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="495" y="265" fill="#0F172A" font-size="11" text-anchor="middle">② 验证设备身份</text>

  <!-- ③ 返回JWT凭证: Auth -> Gateway, 虚线, y=300 -->
  <line x1="515" y1="300" x2="405" y2="300" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow-primary)"/>
  <rect x="425" y="290" width="140" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="495" y="305" fill="#0F172A" font-size="11" text-anchor="middle">③ 返回JWT凭证</text>

  <!-- ④ 认证成功允许接入: Gateway -> 现场设备, y=340 -->
  <line x1="405" y1="340" x2="295" y2="340" stroke="#64748B" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="310" y="330" width="160" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="390" y="345" fill="#0F172A" font-size="11" text-anchor="middle">④ 认证成功允许接入</text>

  <!-- ⑤ 创建设备元数据/位号/规则: 运维人员 -> Manager, y=380 -->
  <line x1="625" y1="380" x2="735" y2="380" stroke="#64748B" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="640" y="370" width="180" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="730" y="385" fill="#0F172A" font-size="11" text-anchor="middle">⑤ 创建设备元数据/位号/规则</text>

  <!-- ⑥ 同步规则配置: Manager -> Data, y=420 -->
  <line x1="735" y1="420" x2="845" y2="420" stroke="#64748B" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="750" y="410" width="140" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="820" y="425" fill="#0F172A" font-size="11" text-anchor="middle">⑥ 同步规则配置</text>

  <!-- ⑦ 上报传感器数据（原始值）: 现场设备 -> Gateway, y=460 -->
  <line x1="295" y1="460" x2="405" y2="460" stroke="#64748B" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="310" y="450" width="180" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="400" y="465" fill="#0F172A" font-size="11" text-anchor="middle">⑦ 上报传感器数据（原始值）</text>

  <!-- ⑧ 转发归一化数据（PointValue）: Gateway -> Data, y=500 -->
  <line x1="405" y1="500" x2="845" y2="500" stroke="#64748B" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="550" y="490" width="180" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="640" y="505" fill="#0F172A" font-size="11" text-anchor="middle">⑧ 转发归一化数据（PointValue）</text>

  <!-- ⑨ 写入时序库并触发规则检查: Data自调用, y=540 -->
  <path d="M 845 540 L 890 540 L 890 580 L 845 580" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="855" y="535" width="180" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="945" y="550" fill="#0F172A" font-size="11" text-anchor="middle">⑨ 写入时序库并触发规则检查</text>

  <!-- ⑩ 推送推理由中心介入: Data -> Agentic, y=580 -->
  <line x1="845" y1="580" x2="955" y2="580" stroke="#64748B" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="860" y="570" width="160" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="940" y="585" fill="#0F172A" font-size="11" text-anchor="middle">⑩ 推送推理由中心介入</text>

  <!-- ⑪ 查询历史湿度（Tool-Calling）: Agentic -> Data, y=620 -->
  <line x1="955" y1="620" x2="845" y2="620" stroke="#64748B" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <rect x="860" y="610" width="180" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="950" y="625" fill="#0F172A" font-size="11" text-anchor="middle">⑪ 查询历史湿度（Tool-Calling）</text>

  <!-- ⑫ 返回时序数据: Data -> Agentic, 虚线, y=660 -->
  <line x1="845" y1="660" x2="955" y2="660" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow-primary)"/>
  <rect x="865" y="650" width="140" height="20" rx="4" fill="white" opacity="0.9"/>
  <text x="935" y="665" fill="#0F172A" font-size="11" text-anchor="middle">⑫ 返回时序数据</text>

  <!-- 阶段标签（左侧） -->
  <text x="150" y="285" fill="#475569" font-size="13" font-weight="600" text-anchor="end">注册阶段</text>
  <text x="150" y="405" fill="#475569" font-size="13" font-weight="600" text-anchor="end">配置阶段</text>
  <text x="150" y="505" fill="#475569" font-size="13" font-weight="600" text-anchor="end">上报阶段</text>
  <text x="150" y="625" fill="#475569" font-size="13" font-weight="600" text-anchor="end">推理阶段</text>
  <text x="150" y="700" fill="#475569" font-size="13" font-weight="600" text-anchor="end">控制阶段</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">description=箭头线型说明：实线 `-&gt;` 表示同步调</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图2-7 五大中心协同流程时序图（智能灌溉场景）</text>
  </svg>
</svg>