    <text x="1108" y="223" font-size="9" fill="#64748B">配置与运维管理</text>
  </g>

  <!-- ============ L2 COMPONENT CARDS (orange, emphasized) ============ -->
  <g>
    <rect x="240" y="325" width="270" height="110" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
