    <text x="572" y="418" font-size="9" fill="#64748B">映射平台服务能力</text>
  </g>
  <g>
    <rect x="872" y="325" width="270" height="110" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="888" y="355" font-size="15" font-weight="700" fill="#0F172A">会话管理</text>
    <text x="888" y="380" font-size="10" fill="#475569">Session / Memory</text>
    <text x="888" y="400" font-size="9" fill="#64748B">多轮上下文记忆</text>
    <text x="888" y="418" font-size="9" fill="#64748B">意图识别与状态</text>
  </g>
  <g>
    <rect x="1188" y="325" width="270" height="110" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="1204" y="355" font-size="15" font-weight="700" fill="#0F172A">模型路由</text>
    <text x="1204" y="380" font-size="10" fill="#475569">Model Routing</text>
