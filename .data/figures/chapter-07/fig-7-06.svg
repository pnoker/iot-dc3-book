  <text x="850" y="275" font-size="11" fill="#475569" text-anchor="middle">HTTP / WebSocket</text>

  <!-- gap2: L2 -> L3 (three Feign calls) -->
  <line x1="425" y1="472" x2="425" y2="505" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="850" y1="472" x2="850" y2="505" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="1275" y1="472" x2="1275" y2="505" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="715" y="481" width="270" height="17" fill="#FFFFFF"/>
  <text x="850" y="495" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">Feign · @Tool 工具调用</text>

