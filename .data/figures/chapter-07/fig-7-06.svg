  <text x="900" y="990" font-size="10" fill="#94A3B8" text-anchor="middle">图7-6 四层架构：AI Agent 层只做意图识别与工具调度不做推理；所有工具调用经 Feign 走平台服务层，鉴权服务不绕过 RBAC，数据设备层物理设备对 AI 不可见。</text>
