<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图7-6 Agentic Center 四层架构</title>
  <desc id="desc">DC3 现有三层平台服务之上叠加 AI Agent 层形成四层结构。AI Agent 层只做意图识别与工具调度，所有工具调用经 Feign 走平台服务层，鉴权服务不绕过 RBAC，数据设备层物理设备对 AI 不可见。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="53.600" width="1152.000" height="652.800" viewBox="0 0 1800.000 1020.000" preserveAspectRatio="xMidYMid meet">
<title>图7-6 Agentic Center 四层架构</title>
  <desc>DC3 现有三层平台服务之上叠加 AI Agent 层形成四层结构。AI Agent 层只做意图识别与工具调度，所有工具调用经 Feign 走平台服务层，鉴权服务不绕过 RBAC，数据设备层物理设备对 AI 不可见。</desc>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1020" fill="#FFFFFF"/>

  <!-- ============ TITLE ============ -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图7-6 Agentic Center 四层架构</text>
  <text x="84" y="71" font-size="12" fill="#64748B">DC3 现有三层平台服务之上叠加 AI Agent 层 · 权限校验贯穿全链路</text>

  <rect x="1598" y="28" width="172" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1684" y="45" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">LAYERED · 4-TIER</text>

  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0"/>

  <!-- ============ LAYER CONTAINERS ============ -->
  <!-- L1 用户交互层 -->
  <rect x="60" y="130" width="1420" height="120" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <!-- L2 AI Agent 层 (emphasized) -->
  <rect x="60" y="290" width="1420" height="180" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8 4"/>
  <!-- L3 平台服务层 -->
  <rect x="60" y="510" width="1420" height="180" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <!-- L4 数据设备层 -->
  <rect x="60" y="730" width="1420" height="180" rx="12" fill="#F8FAFC" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- ============ LAYER LABEL TAGS (left column) ============ -->
  <!-- L1 -->
  <rect x="76" y="165" width="144" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="148" y="187" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">用户交互层</text>
  <text x="148" y="204" font-size="9" fill="#64748B" text-anchor="middle">User Interaction</text>
  <!-- L2 -->
  <rect x="76" y="355" width="144" height="50" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="148" y="377" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">AI Agent 层</text>
  <text x="148" y="394" font-size="9" fill="#64748B" text-anchor="middle">dc3-center-agentic</text>
  <!-- L3 -->
  <rect x="76" y="575" width="144" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="148" y="597" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">平台服务层</text>
  <text x="148" y="614" font-size="9" fill="#64748B" text-anchor="middle">Platform Services</text>
  <!-- L4 -->
  <rect x="76" y="795" width="144" height="50" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="148" y="817" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">数据设备层</text>
  <text x="148" y="834" font-size="9" fill="#64748B" text-anchor="middle">Data / Device</text>

  <!-- L2 "新增" badge -->
  <rect x="1400" y="300" width="56" height="22" rx="11" fill="#F59E0B"/>
  <text x="1428" y="316" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">新增</text>

  <!-- ============ L1 COMPONENT CARDS (blue) ============ -->
  <g>
    <rect x="240" y="155" width="370" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="258" y="185" font-size="15" font-weight="700" fill="#0F172A">Web 对话窗口</text>
    <text x="258" y="205" font-size="10" fill="#475569">Chat UI · 浏览器端</text>
    <text x="258" y="223" font-size="9" fill="#64748B">自然语言交互入口</text>
  </g>
  <g>
    <rect x="665" y="155" width="370" height="80" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
