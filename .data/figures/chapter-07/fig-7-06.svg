  <g>
    <rect x="240" y="765" width="370" height="110" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <path d="M 260,798 L 260,842 A 25,8 0 0 0 310,842 L 310,798 Z" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <ellipse cx="285" cy="798" rx="25" ry="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
