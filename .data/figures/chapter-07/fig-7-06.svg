  <line x1="425" y1="692" x2="425" y2="725" stroke="#64748B" stroke-width="2" marker-end="url(#ah-gray)"/>
  <line x1="850" y1="692" x2="850" y2="725" stroke="#64748B" stroke-width="2" marker-end="url(#ah-gray)"/>
  <rect x="772" y="702" width="156" height="16" fill="#FFFFFF"/>
