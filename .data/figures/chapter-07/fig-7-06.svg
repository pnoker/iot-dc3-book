    <text x="1204" y="418" font-size="9" fill="#64748B">外部模型 API</text>
  </g>

  <!-- ============ L3 COMPONENT CARDS (blue / auth=red) ============ -->
  <g>
    <rect x="240" y="545" width="370" height="110" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="258" y="575" font-size="15" font-weight="700" fill="#0F172A">dc3-center-manager</text>
    <text x="258" y="600" font-size="10" fill="#475569">设备元数据服务</text>
    <text x="258" y="620" font-size="9" fill="#64748B">设备 / 模型 / 点位管理</text>
    <text x="258" y="638" font-size="9" fill="#64748B">Feign 暴露 @Tool 能力</text>
  </g>
  <g>
    <rect x="665" y="545" width="370" height="110" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="683" y="575" font-size="15" font-weight="700" fill="#0F172A">dc3-center-data</text>
    <text x="683" y="600" font-size="10" fill="#475569">位号实时值服务</text>
    <text x="683" y="620" font-size="9" fill="#64748B">读写设备位号数据</text>
    <text x="683" y="638" font-size="9" fill="#64748B">Feign 暴露 @Tool 能力</text>
  </g>
  <g>
    <rect x="1090" y="545" width="370" height="110" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
    <text x="1108" y="575" font-size="15" font-weight="700" fill="#0F172A">dc3-center-auth</text>
    <text x="1108" y="600" font-size="10" fill="#475569">RBAC 鉴权服务</text>
    <text x="1108" y="620" font-size="9" fill="#64748B">用户 / 角色 / 权限校验</text>
    <text x="1108" y="638" font-size="9" fill="#E11D48">所有工具调用强制过鉴权</text>
  </g>

