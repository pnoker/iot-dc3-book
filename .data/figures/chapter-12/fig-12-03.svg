<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="72.800" width="1152.000" height="614.400" viewBox="0 0 1800.000 960.000" preserveAspectRatio="xMidYMid meet">
<rect x="0" y="0" width="1800" height="960" fill="#FFFFFF"/>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图12-03　农业场景 LPWAN 选型决策</text>
  <text x="84" y="72" font-size="12" fill="#64748B">按蜂窝覆盖与单次数据量分流的连接技术路径，图像类大数据须独立承载</text>
  <rect x="1652" y="28" width="112" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1708" y="46" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1.5">FLOWCHART</text>
  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Region: decision ===== -->
  <rect x="120" y="200" width="960" height="560" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="138" y="188" width="108" height="26" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="192" y="206" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">选型判定</text>
  <text x="256" y="206" font-size="10" fill="#94A3B8">按覆盖与数据量分流</text>

  <!-- ===== Region: options ===== -->
  <rect x="1120" y="200" width="580" height="560" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="1138" y="188" width="108" height="26" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <text x="1192" y="206" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">技术选项</text>
  <text x="1256" y="206" font-size="10" fill="#94A3B8">主流连接技术</text>

  <!-- ===== Start card ===== -->
  <rect x="160" y="430" width="200" height="90" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="260" y="468" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">农业连接选型</text>
  <text x="260" y="492" font-size="11" fill="#64748B" text-anchor="middle">覆盖 + 数据量评估</text>
  <text x="260" y="508" font-size="9" fill="#94A3B8" text-anchor="middle">起点 · 输入需求</text>

  <!-- ===== q1 decision diamond ===== -->
  <polygon points="560,400 660,475 560,550 460,475" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="560" y="470" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">蜂窝覆盖良好？</text>
  <text x="560" y="494" font-size="10" fill="#64748B" text-anchor="middle">NB-IoT 可用性</text>

  <!-- ===== q2 decision diamond ===== -->
  <polygon points="900,400 1000,475 900,550 800,475" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="900" y="470" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">数据量 &gt; 100KB？</text>
  <text x="900" y="494" font-size="10" fill="#64748B" text-anchor="middle">是否含图像 / 视频</text>

  <!-- ===== Option: 4G / 5G (amber / cloud-broadband) ===== -->
  <rect x="1300" y="240" width="220" height="100" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="1410" y="282" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">4G / 5G</text>
  <text x="1410" y="306" font-size="11" fill="#64748B" text-anchor="middle">宽带蜂窝 · 承载图像</text>
  <text x="1410" y="324" font-size="9" fill="#94A3B8" text-anchor="middle">高带宽 · 运营商网络</text>

  <!-- ===== Option: NB-IoT (blue / primary) ===== -->
  <rect x="1300" y="425" width="220" height="100" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1410" y="467" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">NB-IoT</text>
  <text x="1410" y="491" font-size="11" fill="#64748B" text-anchor="middle">授权频段 · 运营商托管</text>
  <text x="1410" y="509" font-size="9" fill="#94A3B8" text-anchor="middle">低频小包 · 广覆盖</text>

  <!-- ===== Option: LoRa (green / edge) ===== -->
  <rect x="1300" y="610" width="220" height="100" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1410" y="652" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">LoRa</text>
  <text x="1410" y="676" font-size="11" fill="#64748B" text-anchor="middle">免授权频段 · 自建网关</text>
  <text x="1410" y="694" font-size="9" fill="#94A3B8" text-anchor="middle">无蜂窝覆盖 · 私有部署</text>

  <!-- ===== Connections (all main flow = blue) ===== -->
  <!-- start -> q1 -->
  <line x1="360" y1="475" x2="456" y2="475" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="392" y="455" width="36" height="16" rx="3" fill="#FFFFFF"/>
  <text x="410" y="467" font-size="10" fill="#475569" text-anchor="middle">评估</text>

  <!-- q1 -> q2  (是) -->
  <line x1="660" y1="475" x2="796" y2="475" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="713" y="455" width="34" height="16" rx="3" fill="#FFFFFF"/>
  <text x="730" y="467" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">是</text>

  <!-- q1 -> lora  (否 / 无覆盖): down then right -->
  <polyline points="560,550 560,660 1296,660" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="636" y="650" width="128" height="16" rx="3" fill="#FFFFFF"/>
  <text x="700" y="662" font-size="10" fill="#475569" text-anchor="middle"><tspan font-weight="700" fill="#E11D48">否</tspan>（无蜂窝覆盖）</text>

  <!-- q2 -> cellular  (是 / 图像): up then right -->
  <polyline points="900,400 900,290 1296,290" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="1018" y="280" width="144" height="16" rx="3" fill="#FFFFFF"/>
  <text x="1090" y="292" font-size="10" fill="#475569" text-anchor="middle"><tspan font-weight="700" fill="#10B981">是</tspan>（图像 / 视频流）</text>

  <!-- q2 -> nbiot  (否 / 低频小包): right -->
  <line x1="1000" y1="475" x2="1296" y2="475" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <rect x="1078" y="465" width="140" height="16" rx="3" fill="#FFFFFF"/>
  <text x="1148" y="477" font-size="10" fill="#475569" text-anchor="middle"><tspan font-weight="700" fill="#E11D48">否</tspan>（低频小包数据）</text>

  <!-- ===== Legend (bottom-left, outside main body) ===== -->
  <rect x="120" y="790" width="780" height="56" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="138" y="822" font-size="11" font-weight="700" fill="#64748B">图例</text>
  <rect x="186" y="812" width="24" height="16" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="218" y="824" font-size="11" fill="#475569">方框 · 终点选项</text>
  <polygon points="340,820 354,812 368,820 354,828" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="378" y="824" font-size="11" fill="#475569">菱形 · 判定分支</text>
  <line x1="488" y1="820" x2="524" y2="820" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="534" y="824" font-size="11" fill="#475569">实线 · 决策主链路</text>
  <line x1="676" y1="820" x2="712" y2="820" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="722" y="824" font-size="11" fill="#475569">灰虚线 · 退场弱化</text>

  <!-- ===== Sigfox callout (bottom-right, gray dashed, weakened) ===== -->
  <rect x="940" y="782" width="760" height="64" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="960" y="810" font-size="14" font-weight="700" fill="#64748B">Sigfox</text>
  <line x1="1008" y1="800" x2="1052" y2="800" stroke="#94A3B8" stroke-width="1"/>
  <rect x="1010" y="796" width="58" height="20" rx="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="1"/>
  <text x="1039" y="810" font-size="10" font-weight="600" fill="#E11D48" text-anchor="middle">已退场</text>
  <text x="1082" y="810" font-size="11" fill="#64748B">2022 司法重组，UnaBiz 收购后退场</text>
  <text x="960" y="834" font-size="11" fill="#64748B">新项目勿选；存量节点可迁移至 LoRa（私有）或 NB-IoT（运营商托管）。</text>

  <!-- ===== Caption ===== -->
  <text x="900" y="908" font-size="10" fill="#94A3B8" text-anchor="middle">图12-03　按蜂窝覆盖与数据量分流的 LPWAN 选型决策，Sigfox 已退场。</text>
  </svg>
</svg>