<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图12-4 智慧果园综合监测系统架构（示意）</title>
  <desc id="desc">读者应理解混合组网不是技术妥协，而是在低频小包和高频大包两类数据需求之间的理性切口。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">图12-4 智慧果园综合监测系统架构（示意）</title>
  <desc id="desc">读者应理解混合组网不是技术妥协，而是在低频小包和高频大包两类数据需求之间的理性切口。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图12-4 智慧果园综合监测系统架构（示意）</text>
  <text x="82" y="70" fill="#64748B" font-size="12">读者应理解混合组网不是技术妥协，而是在低频小包和高频大包两类数据需求之间的理性切口。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
  <!-- 上行实线：土壤->网关 -->
  <path d="M 240,615 V 405 H 450 V 405" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 上行实线：气象->网关 -->
  <path d="M 540,615 V 405 H 450 V 405" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 上行实线：图像->基站 -->
  <path d="M 1050,470 V 405" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 上行实线：基站->规则引擎 -->
  <path d="M 1050,325 V 260 H 780 V 260" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 上行实线：网关->规则引擎 -->
  <path d="M 450,325 V 260 H 780 V 260" fill="none" stroke="#2563EB" stroke-width="1.5" marker-end="url(#bp-arrow-primary)"/>
  <!-- 下行虚线：规则引擎->网关 -->
  <path d="M 750,260 V 325 H 400 V 325" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>
  <!-- 下行虚线：网关->电磁阀 -->
  <path d="M 400,405 V 615 H 840 V 615" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#bp-arrow)"/>

  <!-- 连线标签（白色背景） -->
  <!-- 土壤->网关 -->
  <rect x="230" y="490" width="100" height="20" fill="white" rx="3"/>
  <text x="280" y="504" fill="#0F172A" font-size="11" text-anchor="middle">定时上报(200B)</text>
  <!-- 气象->网关 -->
  <rect x="525" y="490" width="100" height="20" fill="white" rx="3"/>
  <text x="575" y="504" fill="#0F172A" font-size="11" text-anchor="middle">定时上报(200B)</text>
  <!-- 图像->基站 -->
  <rect x="1040" y="425" width="120" height="20" fill="white" rx="3"/>
  <text x="1100" y="439" fill="#0F172A" font-size="11" text-anchor="middle">异常图像(200-300KB)</text>
  <!-- 基站->规则引擎 -->
  <rect x="1040" y="280" width="40" height="20" fill="white" rx="3"/>
  <text x="1060" y="294" fill="#0F172A" font-size="11" text-anchor="middle">回传</text>
  <!-- 网关->规则引擎 -->
  <rect x="440" y="280" width="80" height="20" fill="white" rx="3"/>
  <text x="480" y="294" fill="#0F172A" font-size="11" text-anchor="middle">环境数据汇聚</text>
  <!-- 规则引擎->网关 -->
  <rect x="580" y="305" width="120" height="20" fill="white" rx="3"/>
  <text x="640" y="319" fill="#0F172A" font-size="11" text-anchor="middle">下行: 电磁阀指令</text>
  <!-- 网关->电磁阀 -->
  <rect x="390" y="500" width="70" height="20" fill="white" rx="3"/>
  <text x="425" y="514" fill="#0F172A" font-size="11" text-anchor="middle">开关控制</text>

  <!-- 四层区域虚线框 -->
  <!-- 层1：田间感知层 -->
  <rect x="120" y="590" width="1560" height="130" fill="transparent" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4" rx="8"/>
  <text x="130" y="610" fill="#64748B" font-size="13" font-weight="600">田间感知层</text>
  <!-- 层2：边缘处理层 -->
  <rect x="120" y="445" width="1560" height="130" fill="transparent" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4" rx="8"/>
  <text x="130" y="465" fill="#64748B" font-size="13" font-weight="600">边缘处理层</text>
  <!-- 层3：混合通信层 -->
  <rect x="120" y="300" width="1560" height="130" fill="transparent" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4" rx="8"/>
  <text x="130" y="320" fill="#64748B" font-size="13" font-weight="600">混合通信层</text>
  <!-- 层4：云端平台层 -->
  <rect x="120" y="155" width="1560" height="130" fill="transparent" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4" rx="8"/>
  <text x="130" y="175" fill="#64748B" font-size="13" font-weight="600">云端平台层</text>

  <!-- 组件卡片 -->
  <!-- 层1：土壤传感器节点 -->
  <rect x="150" y="615" width="180" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="240" y="641" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">土壤传感器节点</text>
  <text x="240" y="659" fill="#475569" font-size="11" text-anchor="middle">LoRaWAN, 20个</text>
  <!-- 层1：气象站 -->
  <rect x="450" y="615" width="180" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="540" y="641" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">气象站</text>
  <text x="540" y="659" fill="#475569" font-size="11" text-anchor="middle">LoRaWAN, 1个</text>
  <!-- 层1：电磁阀节点 -->
  <rect x="750" y="615" width="180" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="840" y="641" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">电磁阀节点</text>
  <text x="840" y="659" fill="#475569" font-size="11" text-anchor="middle">LoRaWAN, 5个</text>
  <!-- 层2：图像采集节点 -->
  <rect x="950" y="470" width="200" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1050" y="496" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">图像采集节点</text>
  <text x="1050" y="514" fill="#475569" font-size="11" text-anchor="middle">内置AI推理, 5个</text>
  <!-- 层3：LoRaWAN网关 -->
  <rect x="350" y="325" width="200" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="450" y="351" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">LoRaWAN网关</text>
  <text x="450" y="369" fill="#475569" font-size="11" text-anchor="middle">8通道, 以太网/4G回传</text>
  <!-- 层3：4G基站 -->
  <rect x="950" y="325" width="200" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1050" y="351" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">4G基站</text>
  <text x="1050" y="369" fill="#475569" font-size="11" text-anchor="middle">运营商网络</text>
  <!-- 层4：云规则引擎 -->
  <rect x="650" y="180" width="260" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="780" y="206" fill="#0F172A" font-size="14" font-weight="600" text-anchor="middle">云规则引擎</text>
  <text x="780" y="224" fill="#475569" font-size="11" text-anchor="middle">灌溉决策 + 告警</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">青绿色：田间感知设备及数据源</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色：网关、云平台及通信基础设施</text>
  <rect x="1190" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
  <text x="1214" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线箭头：同步数据上行</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图12-4 展示智慧果园混合组网的完整数据路径。土壤与气象数据通过LoRaWAN统一周期上报；图像数据在边缘完成病害推理后通过4G回传；灌溉指令由云端规则引擎通过LoRaWAN下行通道执行。</text>
  </svg>
</svg>