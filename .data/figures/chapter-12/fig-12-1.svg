  <line x1="750" y1="312" x2="750" y2="378" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <!-- gateway -> terminals : dashed, LoRa star uplink (no arrow per legend) -->
  <line x1="750" y1="452" x2="390" y2="623" stroke="#10B981" stroke-width="2" stroke-dasharray="8 4"/>
  <line x1="750" y1="452" x2="630" y2="623" stroke="#10B981" stroke-width="2" stroke-dasharray="8 4"/>
  <line x1="750" y1="452" x2="870" y2="623" stroke="#10B981" stroke-width="2" stroke-dasharray="8 4"/>
  <line x1="750" y1="452" x2="1110" y2="623" stroke="#10B981" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- cloud platform node -->
  <rect x="520" y="160" width="460" height="150" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="750" y="188" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">云平台</text>
  <rect x="545" y="210" width="95" height="80" rx="5" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="592" y="248" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">数据库</text>
  <text x="592" y="268" fill="#64748B" font-size="9" text-anchor="middle">时序存储</text>
  <rect x="650" y="210" width="95" height="80" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="697" y="248" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">AI模型</text>
  <text x="697" y="268" fill="#64748B" font-size="9" text-anchor="middle">病害预测</text>
  <rect x="755" y="210" width="95" height="80" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="802" y="248" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">可视化</text>
  <text x="802" y="268" fill="#64748B" font-size="9" text-anchor="middle">大屏监控</text>
  <rect x="860" y="210" width="95" height="80" rx="5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
  <text x="907" y="248" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">告警</text>
  <text x="907" y="268" fill="#64748B" font-size="9" text-anchor="middle">阈值触发</text>

  <!-- gateway node -->
  <rect x="640" y="380" width="220" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="750" y="408" fill="#0F172A" font-size="14" font-weight="700" text-anchor="middle">边缘网关</text>
  <text x="750" y="430" fill="#475569" font-size="10" font-weight="500" text-anchor="middle">立杆/温室顶部 · 4G/5G/有线</text>

  <!-- terminal nodes -->
  <rect x="305" y="625" width="170" height="75" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="390" y="653" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">土壤水分</text>
  <text x="390" y="673" fill="#475569" font-size="10" text-anchor="middle">水滴·体积含水率</text>

  <rect x="545" y="625" width="170" height="75" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="630" y="653" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">叶面湿度</text>
  <text x="630" y="673" fill="#475569" font-size="10" text-anchor="middle">树叶·结露湿润</text>

  <rect x="785" y="625" width="170" height="75" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="870" y="653" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">光照强度</text>
  <text x="870" y="673" fill="#475569" font-size="10" text-anchor="middle">太阳·PAR照度</text>

  <rect x="1025" y="625" width="170" height="75" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="1110" y="653" fill="#0F172A" font-size="13" font-weight="700" text-anchor="middle">空气温湿度</text>
  <text x="1110" y="673" fill="#475569" font-size="10" text-anchor="middle">温度计·气温湿度</text>

  <!-- callouts -->
  <rect x="780" y="342" width="140" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="850" y="358" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">4G/有线回传链路</text>

  <rect x="1190" y="515" width="140" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1260" y="532" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">LoRa星型上行链路</text>

  <!-- legend -->
  <line x1="58" y1="790" x2="1442" y2="790" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="80" y1="817" x2="108" y2="817" stroke="#10B981" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="116" y="821" fill="#64748B" font-size="11" font-weight="600">虚线：LoRa星型上行</text>
  <line x1="300" y1="817" x2="328" y2="817" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="344" y="821" fill="#64748B" font-size="11" font-weight="600">实线+箭头：4G/有线回传</text>
  <rect x="540" y="812" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="560" y="821" fill="#64748B" font-size="11" font-weight="600">土壤水分</text>
  <rect x="650" y="812" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="670" y="821" fill="#64748B" font-size="11" font-weight="600">叶面湿度</text>
  <rect x="760" y="812" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="780" y="821" fill="#64748B" font-size="11" font-weight="600">光照强度</text>
  <rect x="870" y="812" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="890" y="821" fill="#64748B" font-size="11" font-weight="600">空气温湿度</text>

  <text x="750" y="915" fill="#94A3B8" font-size="10" text-anchor="middle">图12-1 环境传感网络部署拓扑示意，展示了从终端节点到云平台的星型连接关系。</text>
  </svg>
</svg>