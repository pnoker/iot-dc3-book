<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="37.895" y="24.000" width="1124.211" height="712.000" viewBox="0 0 1500.000 950.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <rect x="0" y="0" width="1500" height="950" fill="#FFFFFF"/>

  <!-- title -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="48" fill="#0F172A" font-size="22" font-weight="700">图12-1 环境传感网络部署拓扑示意</text>
  <text x="82" y="78" fill="#64748B" font-size="12" font-weight="500">农业环境传感网络的星型拓扑：终端节点经网关回传至云平台</text>
  <rect x="1380" y="28" width="92" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1426" y="44" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">TOPOLOGY</text>

  <line x1="58" y1="103" x2="1442" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- regions -->
  <rect x="470" y="138" width="560" height="200" rx="12" fill="none" stroke="#7C3AED" stroke-dasharray="8 4" stroke-width="1.2"/>
  <text x="486" y="158" fill="#7C3AED" font-size="11" font-weight="600">数据资产域</text>
  <text x="486" y="173" fill="#94A3B8" font-size="9" font-weight="500">数据沉淀与治理边界</text>

  <rect x="110" y="370" width="1280" height="395" rx="12" fill="none" stroke="#10B981" stroke-dasharray="8 4" stroke-width="1.2"/>
  <text x="126" y="388" fill="#10B981" font-size="11" font-weight="600">设备与边缘域</text>
  <text x="126" y="403" fill="#94A3B8" font-size="9" font-weight="500">现场异构资源边界</text>

  <!-- connections (main chain, drawn before nodes) -->
