<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="60.000" width="1152.000" height="640.000" viewBox="0 0 1800.000 1000.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1000" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图8-5 密钥生命周期管理与云边协同流程</text>
  <text x="84" y="70" font-size="12" fill="#64748B">Key Lifecycle Management &amp; Cloud-Edge Collaboration — 生成 / 分发 / 使用 / 轮换 / 撤销 / 销毁</text>

  <rect x="1596" y="24" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1686" y="46" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">FLOWCHART · SWIMLANE</text>

  <line x1="40" y1="103" x2="1760" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Swimlane bands ===== -->
  <!-- Lane 1: 云端 KMS -->
  <rect x="40" y="115" width="1720" height="228" rx="10" fill="#EFF6FF" opacity="0.5"/>
  <!-- Lane 2: 边缘网关 -->
  <rect x="40" y="351" width="1720" height="228" rx="10" fill="#ECFDF5" opacity="0.5"/>
  <!-- Lane 3: 设备端 -->
  <rect x="40" y="587" width="1720" height="228" rx="10" fill="#ECFDF5" opacity="0.5"/>

  <!-- dashed dividers -->
  <line x1="40" y1="349" x2="1760" y2="349" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="8 4"/>
  <line x1="40" y1="585" x2="1760" y2="585" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="8 4"/>

  <!-- Lane label cards (left) -->
  <rect x="56" y="195" width="120" height="68" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="116" y="224" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">云端 KMS</text>
  <text x="116" y="244" font-size="10" fill="#64748B" text-anchor="middle">Cloud · 平台服务域</text>

  <rect x="56" y="431" width="120" height="68" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="116" y="460" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">边缘网关</text>
  <text x="116" y="480" font-size="10" fill="#64748B" text-anchor="middle">Edge · 接入域</text>

  <rect x="56" y="667" width="120" height="68" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="116" y="696" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">设备端</text>
  <text x="116" y="716" font-size="10" fill="#64748B" text-anchor="middle">Device · 终端</text>

  <!-- ===== Nodes ===== -->
  <!-- N1 密钥生成 (cloud lane, blue primary) -->
  <rect x="230" y="192" width="200" height="86" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="330" y="222" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">密钥生成</text>
  <text x="330" y="242" font-size="10" fill="#475569" text-anchor="middle">KMS · 主密钥 / 根密钥</text>
  <text x="330" y="260" font-size="9" fill="#64748B" text-anchor="middle">状态：新生成</text>

  <!-- N2 边缘接入 (edge lane, green) -->
  <rect x="470" y="428" width="200" height="86" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="570" y="458" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">边缘接入</text>
  <text x="570" y="478" font-size="10" fill="#475569" text-anchor="middle">TLS 接收 · 密钥缓存</text>
  <text x="570" y="496" font-size="9" fill="#64748B" text-anchor="middle">状态：分发中</text>

  <!-- N3 密钥注入 (device lane, green) -->
  <rect x="710" y="664" width="200" height="86" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="810" y="694" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">密钥注入</text>
  <text x="810" y="714" font-size="10" fill="#475569" text-anchor="middle">安全存储 · SE/TEE</text>
  <text x="810" y="732" font-size="9" fill="#64748B" text-anchor="middle">状态：待启用</text>

  <!-- N4 加密/解密 使用中 (device lane, green) — main path -->
  <rect x="950" y="664" width="200" height="86" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
  <text x="1050" y="694" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">加密 / 解密</text>
  <text x="1050" y="714" font-size="10" fill="#475569" text-anchor="middle">业务数据 · 端到端</text>
  <text x="1050" y="732" font-size="9" fill="#64748B" text-anchor="middle">状态：使用中</text>

  <!-- N5 密钥轮换 (cloud lane, orange = 轮换中) -->
  <rect x="1190" y="192" width="200" height="86" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="1290" y="222" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">密钥轮换</text>
  <text x="1290" y="242" font-size="10" fill="#475569" text-anchor="middle">周期触发 · 滚动更新</text>
  <text x="1290" y="260" font-size="9" fill="#64748B" text-anchor="middle">状态：轮换中</text>

  <!-- N6 撤销与销毁 (cloud lane, red = 高危) -->
  <rect x="1440" y="192" width="200" height="86" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2.5"/>
  <text x="1540" y="222" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">撤销与销毁</text>
  <text x="1540" y="242" font-size="10" fill="#475569" text-anchor="middle">CRL/OCSP · 抹除</text>
  <text x="1540" y="260" font-size="9" fill="#64748B" text-anchor="middle">状态：已撤销 / 待销毁</text>

  <!-- ===== Arrows ===== -->
  <!-- A1: N1 → N2  TLS分发 (dashed gray, cross lane1→lane2) -->
  <path d="M 330 278 L 330 320 L 570 320 L 570 428" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="450" y="313" font-size="11" fill="#475569">分发 · TLS</text>

  <!-- A2: N2 → N3  TLS分发 (dashed gray, cross lane2→lane3) -->
  <path d="M 570 514 L 570 556 L 810 556 L 810 664" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="680" y="549" font-size="11" fill="#475569">分发 · TLS</text>

  <!-- A3: N3 → N4  main path solid blue (within device lane) -->
  <line x1="910" y1="707" x2="950" y2="707" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ah-blue)"/>
  <text x="930" y="697" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">启用</text>

  <!-- A4: N4 → N5  main path solid blue (cross lane3→lane1) 轮换触发 -->
  <path d="M 1150 664 L 1150 622 L 1290 622 L 1290 278" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ah-blue)"/>
  <text x="1180" y="615" font-size="11" font-weight="600" fill="#2563EB">轮换触发 · 主链路</text>

  <!-- A5: N5 → N6  solid red 高危 撤销→销毁 -->
  <line x1="1390" y1="235" x2="1440" y2="235" stroke="#E11D48" stroke-width="2.2" marker-end="url(#ah-red)"/>
  <text x="1415" y="225" font-size="11" font-weight="600" fill="#E11D48" text-anchor="middle">撤销</text>

  <!-- A6: N5 → N1  feedback loop dashed gray 轮换后重新生成 -->
  <path d="M 1190 220 L 1190 160 L 330 160 L 330 192" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="700" y="152" font-size="11" fill="#64748B">轮换完成 · 重新生成（回传）</text>

  <!-- ===== Separator before legend ===== -->
  <line x1="40" y1="835" x2="1760" y2="835" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Legend ===== -->
  <text x="56" y="862" font-size="12" font-weight="700" fill="#0F172A">图例</text>

  <!-- state color swatches -->
  <rect x="110" y="852" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="132" y="862" font-size="11" fill="#334155">使用中</text>

  <rect x="200" y="852" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="222" y="862" font-size="11" fill="#334155">轮换中</text>

  <rect x="290" y="852" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <text x="312" y="862" font-size="11" fill="#334155">已撤销 / 停用</text>

  <rect x="402" y="852" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="424" y="862" font-size="11" fill="#334155">待销毁</text>

  <rect x="490" y="852" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="512" y="862" font-size="11" fill="#334155">新生成 / 主链路</text>

  <!-- arrow types -->
  <line x1="640" y1="858" x2="676" y2="858" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="686" y="862" font-size="11" fill="#334155">实线 · 直接操作</text>

  <line x1="820" y1="858" x2="856" y2="858" stroke="#64748B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="866" y="862" font-size="11" fill="#334155">虚线 · TLS 加密传输</text>

  <line x1="1030" y1="858" x2="1066" y2="858" stroke="#E11D48" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="1076" y="862" font-size="11" fill="#334155">红色 · 高危确认操作</text>

  <!-- ===== Callout ===== -->
  <rect x="56" y="888" width="1688" height="62" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="72" y="910" font-size="11" fill="#334155">主结论：密钥沿「云端生成 → TLS 分发 → 边缘缓存 → 设备注入 → 使用」主链路流动，轮换由云端周期触发并回传重新生成，撤销与销毁为需确认的高危收尾操作。</text>
  <text x="72" y="932" font-size="11" fill="#334155">责任边界：云端 KMS 负责生成 / 轮换 / 撤销 / 销毁，边缘网关负责缓存与转发，设备端负责安全存储与业务加解密；跨域一律经 TLS 加密通道。</text>

  <!-- ===== Caption ===== -->
  <text x="900" y="978" font-size="10" fill="#94A3B8" text-anchor="middle">图8-5 密钥生命周期管理与云边协同流程</text>
  </svg>
</svg>