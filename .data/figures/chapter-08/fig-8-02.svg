<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图8-2 安全启动信任链与回滚防护</title>
  <desc id="desc">自上而下信任链：上电复位→BootROM(RoT)→SBL→U-Boot→dm-verity→正常启动，逐级签名验证，绿色实线为通过、红色虚线汇聚到拒绝启动。右上 A/B 双副本分区展示无缝升级与回滚，右下 SVN 单调计数器与镜像版本比较，阻止降级到有漏洞旧版本。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="76.000" width="1152.000" height="608.000" viewBox="0 0 1800.000 950.000" preserveAspectRatio="xMidYMid meet">
<title>图8-2 安全启动信任链与回滚防护</title>
  <desc>自上而下信任链：上电复位→BootROM(RoT)→SBL→U-Boot→dm-verity→正常启动，逐级签名验证，绿色实线为通过、红色虚线汇聚到拒绝启动。右上 A/B 双副本分区展示无缝升级与回滚，右下 SVN 单调计数器与镜像版本比较，阻止降级到有漏洞旧版本。</desc>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="950" fill="#FFFFFF"/>

  <!-- ========= TITLE ========= -->
  <circle cx="64" cy="44" r="6" fill="#2563EB"/>
  <text x="84" y="50" font-size="22" font-weight="700" fill="#0F172A">图8-2  安全启动信任链与回滚防护</text>
  <text x="84" y="72" font-size="12" fill="#64748B">Secure Boot Trust Chain &amp; Rollback Protection · 逐级签名验证建立信任链，SVN 单调递增阻止版本降级</text>
  <rect x="1632" y="30" width="136" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1700" y="48" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="1.5">FLOWCHART</text>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ====================================================== -->
  <!-- LEFT: TRUST CHAIN (逐级签名验证)                        -->
  <!-- ====================================================== -->
  <rect x="50" y="120" width="640" height="725" rx="12" fill="none" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="66" y="130" width="232" height="26" rx="13" fill="#FFFFFF" stroke="#E11D48" stroke-width="1"/>
  <text x="182" y="148" font-size="12" font-weight="600" fill="#E11D48" text-anchor="middle">信任链 · 逐级签名验证</text>

  <!-- node 1 上电复位 -->
  <rect x="80" y="168" width="300" height="64" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="230" y="196" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">上电复位</text>
  <text x="230" y="218" font-size="10" fill="#64748B" text-anchor="middle">Power-on Reset</text>

  <!-- node 2 BootROM (RoT) -->
  <rect x="80" y="282" width="300" height="64" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <rect x="80" y="282" width="4" height="64" fill="#E11D48"/>
  <text x="232" y="310" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">BootROM (RoT)</text>
  <text x="232" y="332" font-size="10" fill="#64748B" text-anchor="middle">片内固化 · 根信任锚</text>

  <!-- node 3 SBL -->
  <rect x="80" y="396" width="300" height="64" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <rect x="80" y="396" width="4" height="64" fill="#E11D48"/>
  <text x="232" y="424" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">SBL</text>
  <text x="232" y="446" font-size="10" fill="#64748B" text-anchor="middle">二级引导加载器</text>

  <!-- node 4 U-Boot -->
  <rect x="80" y="510" width="300" height="64" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <rect x="80" y="510" width="4" height="64" fill="#E11D48"/>
  <text x="232" y="538" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">U-Boot</text>
  <text x="232" y="560" font-size="10" fill="#64748B" text-anchor="middle">通用引导加载器</text>

  <!-- node 5 dm-verity -->
  <rect x="80" y="624" width="300" height="64" rx="6" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
  <rect x="80" y="624" width="4" height="64" fill="#E11D48"/>
  <text x="232" y="652" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">dm-verity</text>
  <text x="232" y="674" font-size="10" fill="#64748B" text-anchor="middle">根文件系统哈希校验</text>

  <!-- node 6 正常启动 (success) -->
  <rect x="80" y="760" width="300" height="64" rx="6" fill="#10B981" fill-opacity="0.06" stroke="#10B981" stroke-width="2"/>
  <text x="230" y="788" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">正常启动 ✓</text>
  <text x="230" y="810" font-size="10" fill="#64748B" text-anchor="middle">系统进入可信运行</text>

  <!-- pass / reset arrows (x=230) -->
  <line x1="230" y1="232" x2="230" y2="278" stroke="#64748B" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="218" y="261" font-size="10" fill="#64748B" text-anchor="end">上电 / 复位</text>

  <line x1="230" y1="346" x2="230" y2="392" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="218" y="375" font-size="10" font-weight="600" fill="#10B981" text-anchor="end">验证 SBL 签名 ✓</text>

  <line x1="230" y1="460" x2="230" y2="506" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="218" y="491" font-size="10" font-weight="600" fill="#10B981" text-anchor="end">验证 U-Boot 签名 ✓</text>

  <line x1="230" y1="574" x2="230" y2="620" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="218" y="605" font-size="10" font-weight="600" fill="#10B981" text-anchor="end">验证内核镜像 ✓</text>

  <line x1="230" y1="688" x2="230" y2="756" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="218" y="728" font-size="10" font-weight="600" fill="#10B981" text-anchor="end">校验 rootfs 哈希树 ✓</text>

  <!-- fail bus: stubs (x380 -> rail x545) at each verify gap -->
  <text x="462" y="362" font-size="10" font-weight="600" fill="#E11D48" text-anchor="middle">任一级校验失败</text>
  <line x1="380" y1="371" x2="538" y2="371" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-red)"/>
  <line x1="380" y1="485" x2="538" y2="485" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-red)"/>
  <line x1="380" y1="599" x2="538" y2="599" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-red)"/>
  <line x1="380" y1="728" x2="538" y2="728" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-red)"/>
  <text x="392" y="365" font-size="11" fill="#E11D48">✗</text>
  <text x="392" y="479" font-size="11" fill="#E11D48">✗</text>
  <text x="392" y="593" font-size="11" fill="#E11D48">✗</text>
  <text x="392" y="722" font-size="11" fill="#E11D48">✗</text>
  <!-- vertical fail rail -->
  <line x1="545" y1="371" x2="545" y2="756" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-red)"/>
  <circle cx="545" cy="371" r="3" fill="#E11D48"/>
  <circle cx="545" cy="485" r="3" fill="#E11D48"/>
  <circle cx="545" cy="599" r="3" fill="#E11D48"/>
  <circle cx="545" cy="728" r="3" fill="#E11D48"/>

  <!-- 拒绝启动 (halt) -->
  <rect x="430" y="760" width="230" height="64" rx="6" fill="#E11D48" fill-opacity="0.05" stroke="#E11D48" stroke-width="2"/>
  <text x="545" y="788" font-size="15" font-weight="700" fill="#E11D48" text-anchor="middle">拒绝启动 · 停机</text>
  <text x="545" y="810" font-size="10" fill="#64748B" text-anchor="middle">进入恢复 / 重刷模式</text>

  <!-- ====================================================== -->
  <!-- RIGHT PANEL 1: A/B 双副本分区                            -->
  <!-- ====================================================== -->
  <rect x="730" y="120" width="1010" height="345" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="746" y="130" width="312" height="26" rx="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="902" y="148" font-size="12" font-weight="600" fill="#2563EB" text-anchor="middle">A/B 双副本分区 · 无缝升级与回滚</text>

  <!-- boot selector -->
  <rect x="1010" y="173" width="280" height="40" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1150" y="198" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">引导加载器读取启动标志</text>
  <line x1="1078" y1="213" x2="985" y2="246" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="1222" y1="213" x2="1335" y2="246" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1010" y="240" font-size="9" font-weight="600" fill="#2563EB">● 选中</text>
  <text x="1282" y="240" font-size="9" fill="#64748B">○ 待命</text>

  <!-- slot A (active) -->
  <rect x="830" y="250" width="300" height="160" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <rect x="830" y="250" width="300" height="26" rx="6" fill="#2563EB" fill-opacity="0.06"/>
  <text x="980" y="269" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">槽位 A · 当前运行</text>
  <text x="980" y="298" font-size="11" fill="#475569" text-anchor="middle">kernel-A  +  rootfs-A</text>
  <line x1="860" y1="314" x2="1100" y2="314" stroke="#E2E8F0" stroke-width="1"/>
  <text x="980" y="338" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">安全版本号 SVN = 3</text>
  <text x="980" y="362" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">● active   启动标志置位</text>
  <text x="980" y="384" font-size="9" fill="#94A3B8" text-anchor="middle">上次升级成功并验证</text>

  <!-- slot B (standby) -->
  <rect x="1190" y="250" width="300" height="160" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 3"/>
  <rect x="1190" y="250" width="300" height="26" rx="6" fill="#2563EB" fill-opacity="0.04"/>
  <text x="1340" y="269" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">槽位 B · 备用 / 升级目标</text>
  <text x="1340" y="298" font-size="11" fill="#475569" text-anchor="middle">kernel-B  +  rootfs-B</text>
  <line x1="1220" y1="314" x2="1460" y2="314" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1340" y="338" font-size="12" font-weight="600" fill="#0F172A" text-anchor="middle">安全版本号 SVN = 4</text>
  <text x="1340" y="362" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">○ standby   待验证切换</text>
  <text x="1340" y="384" font-size="9" fill="#94A3B8" text-anchor="middle">OTA 写入完成、待置位</text>

  <!-- swap indicator between slots -->
  <line x1="1138" y1="332" x2="1178" y2="332" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <line x1="1178" y1="344" x2="1138" y2="344" stroke="#64748B" stroke-width="1.5" marker-end="url(#ah-gray)"/>
  <text x="1158" y="324" font-size="9" fill="#64748B" text-anchor="middle">角色互换</text>

  <!-- bottom flow callout -->
  <rect x="830" y="422" width="660" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1160" y="443" font-size="11" fill="#334155" text-anchor="middle">① OTA 写入备用槽并验证签名 / SVN   →   ② 启动成功置位切换   →   ③ 新槽启动失败自动回滚</text>

  <!-- ====================================================== -->
  <!-- RIGHT PANEL 2: SVN 防降级                                -->
  <!-- ====================================================== -->
  <rect x="730" y="488" width="1010" height="357" rx="12" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="746" y="498" width="332" height="26" rx="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="912" y="516" font-size="12" font-weight="600" fill="#7C3AED" text-anchor="middle">SVN 防降级 · 安全版本号单调递增</text>
  <text x="750" y="543" font-size="11" fill="#475569">设备 SVN 固化于 eFuse / OTP，单向递增、不可回退</text>

  <!-- monotonic counter strip -->
  <rect x="800" y="556" width="900" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <!-- cells SVN 1..6 -->
  <rect x="820" y="564" width="120" height="32" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="880" y="585" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">SVN 1</text>
  <rect x="968" y="564" width="120" height="32" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="1028" y="585" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">SVN 2</text>
  <rect x="1116" y="564" width="120" height="32" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="1176" y="585" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">SVN 3</text>
  <rect x="1264" y="564" width="120" height="32" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="1324" y="585" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">SVN 4</text>
  <rect x="1412" y="564" width="120" height="32" rx="4" fill="#7C3AED" stroke="#7C3AED" stroke-width="1"/>
  <text x="1472" y="585" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SVN 5  ● 当前</text>
  <rect x="1560" y="564" width="120" height="32" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1620" y="585" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">SVN 6</text>
  <!-- one-way arrow -->
  <line x1="824" y1="616" x2="1666" y2="616" stroke="#7C3AED" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="1245" y="634" font-size="10" font-weight="600" fill="#7C3AED" text-anchor="middle">单向递增 · 一次性熔丝 · 只进不退 🔒</text>

  <!-- comparison: image SVN -> decision <- device SVN -->
  <!-- image SVN card -->
  <rect x="800" y="655" width="200" height="100" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="800" y="655" width="4" height="100" fill="#7C3AED"/>
  <text x="902" y="683" font-size="12" font-weight="600" fill="#7C3AED" text-anchor="middle">镜像 SVN</text>
  <text x="902" y="718" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">= 3</text>
  <text x="902" y="742" font-size="9" fill="#64748B" text-anchor="middle">旧签名镜像（含已知漏洞）</text>

  <!-- decision -->
  <rect x="1060" y="655" width="240" height="100" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1180" y="698" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">SVN_img ≥ SVN_dev ?</text>
  <text x="1180" y="722" font-size="9" fill="#64748B" text-anchor="middle">单调比较 · 决定是否放行</text>
  <line x1="1000" y1="705" x2="1056" y2="705" stroke="#7C3AED" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="1028" y="699" font-size="9" fill="#7C3AED" text-anchor="middle">img</text>
  <line x1="1360" y1="705" x2="1304" y2="705" stroke="#7C3AED" stroke-width="2" marker-end="url(#ah-purple)"/>
  <text x="1332" y="699" font-size="9" fill="#7C3AED" text-anchor="middle">dev</text>

  <!-- device SVN card -->
  <rect x="1360" y="655" width="200" height="100" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="1360" y="655" width="4" height="100" fill="#7C3AED"/>
  <text x="1462" y="683" font-size="12" font-weight="600" fill="#7C3AED" text-anchor="middle">设备 SVN</text>
  <text x="1462" y="718" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">= 5</text>
  <text x="1462" y="742" font-size="9" fill="#64748B" text-anchor="middle">eFuse 当前固化值</text>

  <!-- outcome branches -->
  <path d="M 1140 755 C 1140 778 910 778 910 792" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <path d="M 1220 755 C 1220 778 1460 778 1460 792" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-red)"/>
  <rect x="780" y="794" width="260" height="40" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
  <text x="910" y="812" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">✓ img ≥ dev：允许启动</text>
  <text x="910" y="828" font-size="9.5" fill="#10B981" text-anchor="middle">放行并写入新 SVN</text>
  <rect x="1320" y="794" width="280" height="40" rx="6" fill="#FEF2F2" stroke="#E11D48" stroke-width="1.5"/>
  <text x="1460" y="812" font-size="11" font-weight="600" fill="#E11D48" text-anchor="middle">✗ img &lt; dev：拒绝启动</text>
  <text x="1460" y="828" font-size="9.5" fill="#E11D48" text-anchor="middle">阻止降级攻击（本例 3 &lt; 5）</text>

  <!-- ====================================================== -->
