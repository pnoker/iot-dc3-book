  <!-- ===== Caption ===== -->
  <text x="900" y="908" font-size="10" fill="#94A3B8" text-anchor="middle">图 8-13　本图将研究资料包中的 12 条参考资料按安全主题域分类映射：左侧为设备层安全（硬件 / 通信 / 协议），右侧为平台与数据层安全（权限 / AI / 测试），自上而下覆盖从物理层到应用层的全栈。</text>
