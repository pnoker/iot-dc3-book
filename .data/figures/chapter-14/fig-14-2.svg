<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="76.000" width="1152.000" height="608.000" viewBox="0 0 1800.000 950.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="950" fill="#FFFFFF"/>

  <!-- ===== Title region ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图14-3 IoT DC3 数据流链路（MQTT 接入）</text>
  <text x="84" y="72" font-size="12" fill="#64748B">设备上报 → 接入转发 → 异步削峰 → 处理落库 → 查询可视化</text>

  <!-- type label -->
  <rect x="1690" y="26" width="86" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1733" y="43" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">DATAFLOW</text>

  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Region boundary bands ===== -->
  <!-- edge domain -->
  <rect x="30" y="150" width="220" height="480" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="42" y="138" width="150" height="24" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  <text x="117" y="154" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">设备与边缘域</text>

  <!-- platform domain -->
  <rect x="290" y="150" width="940" height="480" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="302" y="138" width="150" height="24" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1"/>
  <text x="377" y="154" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">平台服务域</text>

  <!-- data domain -->
  <rect x="1260" y="150" width="490" height="480" rx="12" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="1272" y="138" width="150" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="1347" y="154" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">数据资产域</text>

  <!-- domain role notes -->
  <text x="140" y="180" font-size="10" fill="#94A3B8" text-anchor="middle">现场异构资源边界</text>
  <text x="760" y="180" font-size="10" fill="#94A3B8" text-anchor="middle">核心服务能力边界</text>
  <text x="1505" y="180" font-size="10" fill="#94A3B8" text-anchor="middle">数据沉淀与治理边界</text>

  <!-- ===== Nodes (cards) y 305-445 ===== -->
  <!-- n1 设备端 (edge / green) -->
  <g>
    <rect x="55" y="305" width="170" height="140" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <rect x="55" y="305" width="170" height="6" rx="3" fill="#10B981"/>
    <text x="140" y="360" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">设备端</text>
    <text x="140" y="386" font-size="10" fill="#475569" text-anchor="middle">MQTT 客户端 / 硬件</text>
    <text x="140" y="408" font-size="9" fill="#64748B" text-anchor="middle">发布 JSON 报文</text>
    <text x="140" y="424" font-size="9" fill="#64748B" text-anchor="middle">Topic 上行</text>
  </g>

  <!-- n2 Broker (platform / blue) -->
  <g>
    <rect x="320" y="305" width="170" height="140" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="320" y="305" width="170" height="6" rx="3" fill="#2563EB"/>
    <text x="405" y="360" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">Broker</text>
    <text x="405" y="386" font-size="10" fill="#475569" text-anchor="middle">EMQX / Mosquitto</text>
    <text x="405" y="408" font-size="9" fill="#64748B" text-anchor="middle">接受连接 · ACL 校验</text>
    <text x="405" y="424" font-size="9" fill="#64748B" text-anchor="middle">转发至订阅者</text>
  </g>

  <!-- n3 数据接入服务 (platform / blue) -->
  <g>
    <rect x="560" y="305" width="170" height="140" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="560" y="305" width="170" height="6" rx="3" fill="#2563EB"/>
    <text x="645" y="360" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">数据接入服务</text>
    <text x="645" y="386" font-size="10" fill="#475569" text-anchor="middle">dc3-gateway</text>
    <text x="645" y="408" font-size="9" fill="#64748B" text-anchor="middle">订阅 Topic</text>
    <text x="645" y="424" font-size="9" fill="#64748B" text-anchor="middle">反序列化报文</text>
  </g>

  <!-- n4 消息队列 (data buffer / purple) -->
  <g>
    <rect x="800" y="305" width="170" height="140" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="800" y="305" width="170" height="6" rx="3" fill="#7C3AED"/>
    <text x="885" y="360" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">消息队列</text>
    <text x="885" y="386" font-size="10" fill="#475569" text-anchor="middle">RabbitMQ / Kafka</text>
    <text x="885" y="408" font-size="9" fill="#64748B" text-anchor="middle">缓冲 · 削峰填谷</text>
    <text x="885" y="424" font-size="9" fill="#64748B" text-anchor="middle">异步解耦</text>
  </g>

  <!-- n5 数据处理服务 (platform / blue) -->
  <g>
    <rect x="1040" y="305" width="170" height="140" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="1040" y="305" width="170" height="6" rx="3" fill="#2563EB"/>
    <text x="1125" y="360" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">数据处理服务</text>
    <text x="1125" y="386" font-size="10" fill="#475569" text-anchor="middle">dc3-center-data</text>
    <text x="1125" y="408" font-size="9" fill="#64748B" text-anchor="middle">清洗 · 物模型校验</text>
    <text x="1125" y="424" font-size="9" fill="#64748B" text-anchor="middle">规则引擎 · 告警判断</text>
  </g>

  <!-- n6 数据库 (data / purple cylinder) -->
  <g>
    <path d="M 1290 322 a 85 14 0 0 0 170 0 L 1460 432 a 85 14 0 0 1 -170 0 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <ellipse cx="1375" cy="322" rx="85" ry="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="1375" y="372" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">数据库</text>
    <text x="1375" y="396" font-size="10" fill="#475569" text-anchor="middle">InfluxDB 时序</text>
    <text x="1375" y="412" font-size="10" fill="#475569" text-anchor="middle">MongoDB 文档</text>
    <text x="1375" y="428" font-size="9" fill="#64748B" text-anchor="middle">时序数据 · 设备快照</text>
  </g>

  <!-- n7 查询与可视化 (application / gray) -->
  <g>
    <rect x="1530" y="305" width="170" height="140" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <rect x="1530" y="305" width="170" height="6" rx="3" fill="#64748B"/>
    <text x="1615" y="360" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">查询与可视化</text>
    <text x="1615" y="386" font-size="10" fill="#475569" text-anchor="middle">REST API · Grafana</text>
    <text x="1615" y="408" font-size="9" fill="#64748B" text-anchor="middle">Web 控制台</text>
    <text x="1615" y="424" font-size="9" fill="#64748B" text-anchor="middle">仪表盘 · 告警视图</text>
  </g>

  <!-- ===== Arrows (main chain y=375) ===== -->
  <!-- n1 -> n2 solid blue -->
  <line x1="226" y1="375" x2="316" y2="375" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="271" y="365" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="600">MQTT 发布</text>

  <!-- n2 -> n3 solid blue -->
  <line x1="491" y1="375" x2="556" y2="375" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="523" y="365" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="600">订阅转发</text>

  <!-- n3 -> n4 dashed gray (async) -->
  <line x1="731" y1="375" x2="796" y2="375" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="763" y="365" font-size="10" fill="#64748B" text-anchor="middle">Raw Data</text>

  <!-- n4 -> n5 dashed gray (async pull) -->
  <line x1="971" y1="375" x2="1036" y2="375" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1003" y="365" font-size="10" fill="#64748B" text-anchor="middle">拉取</text>

  <!-- n5 -> n6 solid blue (write) -->
  <line x1="1211" y1="375" x2="1288" y2="375" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1249" y="365" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="600">写入</text>

  <!-- n6 -> n7 solid blue (read) -->
  <line x1="1461" y1="375" x2="1526" y2="375" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="1493" y="365" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="600">读取</text>

  <!-- ===== callout boxes ===== -->
  <g>
    <rect x="60" y="500" width="820" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="78" y="525" font-size="12" font-weight="700" fill="#2563EB">主链路 · 同步转发（蓝实线）</text>
    <text x="78" y="548" font-size="11" fill="#334155">设备端经 MQTT 协议直推 Broker，Broker 校验 ACL 后将消息路由给订阅的数据接入服务；</text>
    <text x="78" y="566" font-size="11" fill="#334155">处理服务完成清洗与物模型校验后写入数据库，查询接口读取数据供可视化层呈现。</text>
    <text x="78" y="584" font-size="11" fill="#334155">该路径追求低延迟与可追溯，是数据上报的主干通路。</text>
  </g>

  <g>
    <rect x="900" y="500" width="800" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="918" y="525" font-size="12" font-weight="700" fill="#64748B">异步削峰 · 解耦缓冲（灰虚线）</text>
    <text x="918" y="548" font-size="11" fill="#334155">数据接入服务将 Raw Data 投递到消息队列，处理服务按消费能力拉取；</text>
    <text x="918" y="566" font-size="11" fill="#334155">在设备上报洪峰下起到削峰填谷作用，同时解耦接入与处理两端的伸缩节奏。</text>
    <text x="918" y="584" font-size="11" fill="#334155">这是整条链路关键的工程取舍点。</text>
  </g>

  <!-- ===== Legend ===== -->
  <line x1="60" y1="650" x2="1740" y2="650" stroke="#E2E8F0" stroke-width="1"/>
  <text x="60" y="680" font-size="12" font-weight="700" fill="#0F172A">图例</text>

  <g font-size="11" fill="#475569">
    <!-- sync line -->
    <line x1="130" y1="722" x2="180" y2="722" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <text x="192" y="726">同步链路（主链路）</text>

    <!-- async line -->
    <line x1="360" y1="722" x2="410" y2="722" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <text x="422" y="726">异步消息（削峰解耦）</text>

    <!-- green box -->
    <rect x="610" y="714" width="18" height="14" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="636" y="726">边缘设备</text>

    <!-- blue box -->
    <rect x="730" y="714" width="18" height="14" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="756" y="726">平台服务</text>

    <!-- purple box -->
    <rect x="850" y="714" width="18" height="14" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="876" y="726">数据存储 / 消息队列</text>

    <!-- gray box -->
    <rect x="1040" y="714" width="18" height="14" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <text x="1066" y="726">应用 / 查询可视化</text>
  </g>

  <!-- ===== Caption ===== -->
  <text x="900" y="910" font-size="10" fill="#94A3B8" text-anchor="middle">图14-3 IoT DC3 平台 MQTT 接入数据流：消息队列实现削峰与异步解耦，是整条链路的工程关键。</text>
  </svg>
</svg>