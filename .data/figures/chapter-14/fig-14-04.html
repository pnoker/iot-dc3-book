<body>

  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="79.200" width="1152.000" height="601.600" viewBox="0 0 1800.000 940.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>

  <!-- canvas -->

  <text x="84" y="38" font-size="22" font-weight="700" fill="#0F172A">图14-4 AI 运维闭环：训练 → 部署 → 推理</text>
  <text x="84" y="62" font-size="12" fill="#64748B">AI Operations Closed Loop · 异常检测模型从训练到在线推理，并与规则引擎联动</text>
  <rect x="1666" y="24" width="110" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>

  <line x1="315" y1="269" x2="315" y2="301" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>

  <text x="315" y="556" font-size="10" fill="#475569" text-anchor="middle">SavedModel / ONNX</text>

  <rect x="665" y="300" width="370" height="205" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>

  <text x="850" y="486" font-size="9" fill="#64748B" text-anchor="middle" font-style="italic">无状态 · 水平扩展</text>

  <text x="538" y="497" font-size="10" fill="#475569">模型制品</text>

  <text x="1435" y="347" font-size="9" fill="#64748B" text-anchor="middle">组合位号窗口 · 调用模型推理 · 输出衍生位号</text>

  <rect x="1190" y="395" width="490" height="68" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="1435" y="423" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">组合窗口 · 调用推理</text>

  <text x="1572" y="589" font-size="9" fill="#475569">告警事件</text>

  <text x="1562" y="626" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">运维通知 / 工单</text>

  <line x1="1188" y1="322" x2="1042" y2="322" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>

  <text x="1115" y="357" font-size="9" fill="#64748B" text-anchor="middle">推理请求 / 结果</text>

  <path d="M 1190 429 L 1145 429 L 1145 700 L 315 700 L 315 270" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="430" y="692" font-size="11" font-weight="600" fill="#475569">衍生位号回写数据中心</text>
  <text x="430" y="720" font-size="9" fill="#64748B">规则只判数值，不问来源是物理传感器还是 AI 模型</text>

    <text x="1254" y="846">模型服务 TF Serving</text>
  </g>

  <!-- ============ CAPTION ============ -->
  <text x="900" y="905" font-size="10" fill="#94A3B8" text-anchor="middle">图14-4 AI 运维闭环：推理结果作为衍生位号回写数据中心，规则引擎只判数值、不关心来源是物理传感器还是 AI 模型，AI 复用已有告警管道而非另起一套。智能中心以 Spring AI 2.0 编排 Agent、以 MCP 标准化对外暴露平台能力。</text>

</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">flowchart</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">从左到右三阶段。训练阶段：Data 历史数据 → 特征工程 → 项目自选模型训练 → 模型导出。部署阶段：外部推理服务加载模型并暴露受控端点。推理阶段：授权任务读取 Data 数据 → 调用推理 → 将结果作为衍生位号写回 Data → 复用规则与通知链路。整条链路标注“可选扩展，非当前 Compose 默认能力”。</div></div>
