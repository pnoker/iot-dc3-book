<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图13-1 中心化物联网架构的信任困境</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="76.000" width="1152.000" height="608.000" viewBox="0 0 1800.000 950.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <linearGradient id="coltrans" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="950" fill="#FFFFFF"/>

  <!-- ===== title ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="46" font-size="22" font-weight="700" fill="#0F172A">图13-1 中心化物联网架构的信任困境</text>
  <text x="84" y="70" font-size="12" fill="#64748B">单点故障 · 数据篡改 · 跨主体互信——三个问题同源于“信任锚点唯一”</text>
  <g>
    <rect x="1640" y="26" width="120" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1700" y="44" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="1.5">ARCHITECTURE</text>
  </g>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0"/>

  <!-- ===== bridge band between columns ===== -->
  <rect x="60" y="120" width="1680" height="700" fill="url(#coltrans)" opacity="0.6"/>

  <!-- ===== LEFT column: centralized star topology ===== -->
  <rect x="70" y="125" width="800" height="690" rx="12" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="8 4"/>
  <g>
    <rect x="90" y="138" width="220" height="24" rx="4" fill="#FFFFFF" stroke="#2563EB"/>
    <text x="200" y="154" font-size="11" fill="#2563EB" text-anchor="middle" font-weight="600">中心化架构 · 星型拓扑</text>
  </g>

  <!-- trust boundary around platform -->
  <rect x="320" y="378" width="300" height="184" rx="10" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="332" y="372" font-size="10" fill="#2563EB" font-weight="600">信任锚点唯一</text>
  <text x="586" y="576" font-size="10" fill="#2563EB" text-anchor="end" font-weight="600">数据 · 日志同源</text>

  <!-- central platform -->
  <g>
    <rect x="360" y="422" width="220" height="96" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="360" y="422" width="6" height="96" fill="#2563EB"/>
    <text x="470" y="462" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">云平台 / 中心服务器</text>
    <text x="470" y="484" font-size="10" fill="#64748B" text-anchor="middle">汇聚 · 鉴权 · 存储中心</text>
    <text x="470" y="504" font-size="9" fill="#94A3B8" text-anchor="middle">唯一可信裁决方</text>
  </g>

  <!-- devices (green) -->
  <!-- A top -->
  <g>
    <rect x="415" y="174" width="110" height="52" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="470" y="198" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">设备 A</text>
    <text x="470" y="216" font-size="9" fill="#64748B" text-anchor="middle">温湿度传感</text>
  </g>
  <!-- B top-right -->
  <g>
    <rect x="665" y="314" width="110" height="52" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="720" y="338" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">设备 B</text>
    <text x="720" y="356" font-size="9" fill="#64748B" text-anchor="middle">智能网关</text>
  </g>
  <!-- C bottom-right -->
  <g>
    <rect x="665" y="574" width="110" height="52" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="720" y="598" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">设备 C</text>
    <text x="720" y="616" font-size="9" fill="#64748B" text-anchor="middle">视频终端</text>
  </g>
  <!-- D bottom -->
  <g>
    <rect x="415" y="714" width="110" height="52" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="470" y="738" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">设备 D</text>
    <text x="470" y="756" font-size="9" fill="#64748B" text-anchor="middle">计量仪表</text>
  </g>
  <!-- E bottom-left -->
  <g>
    <rect x="165" y="574" width="110" height="52" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="220" y="598" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">设备 E</text>
    <text x="220" y="616" font-size="9" fill="#64748B" text-anchor="middle">执行器</text>
  </g>
  <!-- F top-left -->
  <g>
    <rect x="165" y="314" width="110" height="52" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="220" y="338" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">设备 F</text>
    <text x="220" y="356" font-size="9" fill="#64748B" text-anchor="middle">控制器</text>
  </g>

  <!-- device -> platform arrows (main link, blue) -->
  <line x1="470" y1="226" x2="470" y2="418" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="678" y1="362" x2="572" y2="424" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="678" y1="578" x2="572" y2="516" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="470" y1="714" x2="470" y2="522" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="272" y1="578" x2="368" y2="516" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <line x1="272" y1="362" x2="368" y2="424" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>

  <!-- left callout -->
  <g>
    <rect x="90" y="770" width="760" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="108" y="791" font-size="11" fill="#334155">所有设备仅信任中心 → 信任完全集中于单一节点，形成星型依赖</text>
  </g>

  <!-- ===== bridge connector left -> right ===== -->
  <line x1="870" y1="470" x2="935" y2="470" stroke="#64748B" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="902" y="462" font-size="10" fill="#64748B" text-anchor="middle">信任过度集中</text>

  <!-- ===== RIGHT column: three dilemmas ===== -->
  <rect x="940" y="125" width="800" height="690" rx="12" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="8 4"/>
  <g>
    <rect x="960" y="138" width="220" height="24" rx="4" fill="#FFFFFF" stroke="#E11D48"/>
    <text x="1070" y="154" font-size="11" fill="#E11D48" text-anchor="middle" font-weight="600">信任困境 · 逐级叠加</text>
  </g>

  <!-- dilemma 1 -->
  <g>
    <rect x="1010" y="180" width="660" height="118" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
    <rect x="1010" y="180" width="6" height="118" fill="#E11D48"/>
    <circle cx="1050" cy="218" r="16" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
    <text x="1050" y="224" font-size="14" font-weight="700" fill="#E11D48" text-anchor="middle">1</text>
    <text x="1080" y="222" font-size="16" font-weight="700" fill="#0F172A">单点故障与安全风险</text>
    <text x="1080" y="252" font-size="11" fill="#475569">中心宕机即全网瘫痪，鉴权与控制面高度集中</text>
    <text x="1080" y="274" font-size="11" fill="#475569">攻击面收敛于单一节点 → 越核心越致命</text>
  </g>

  <!-- cross arrow 1 -> 2 -->
  <line x1="1340" y1="298" x2="1340" y2="362" stroke="#E11D48" stroke-width="2" marker-end="url(#ah-red)"/>
  <g transform="translate(1340,330)">
    <circle r="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#E11D48" stroke-width="2"/>
    <line x1="-5" y1="5" x2="5" y2="-5" stroke="#E11D48" stroke-width="2"/>
  </g>
  <text x="1362" y="334" font-size="10" fill="#E11D48" font-weight="600">问题蔓延</text>

  <!-- dilemma 2 -->
  <g>
    <rect x="1010" y="365" width="660" height="118" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
    <rect x="1010" y="365" width="6" height="118" fill="#E11D48"/>
    <circle cx="1050" cy="403" r="16" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
    <text x="1050" y="409" font-size="14" font-weight="700" fill="#E11D48" text-anchor="middle">2</text>
    <text x="1080" y="407" font-size="16" font-weight="700" fill="#0F172A">数据孤岛与篡改风险</text>
    <text x="1080" y="437" font-size="11" fill="#475569">数据与日志同源、同库，单方可静默修改</text>
    <text x="1080" y="459" font-size="11" fill="#475569">事后无法独立自证 → 历史可信性归零</text>
  </g>

  <!-- cross arrow 2 -> 3 -->
  <line x1="1340" y1="483" x2="1340" y2="547" stroke="#E11D48" stroke-width="2" marker-end="url(#ah-red)"/>
  <g transform="translate(1340,515)">
    <circle r="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#E11D48" stroke-width="2"/>
    <line x1="-5" y1="5" x2="5" y2="-5" stroke="#E11D48" stroke-width="2"/>
  </g>
  <text x="1362" y="519" font-size="10" fill="#E11D48" font-weight="600">叠加放大</text>

  <!-- dilemma 3 -->
  <g>
    <rect x="1010" y="550" width="660" height="118" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="2"/>
    <rect x="1010" y="550" width="6" height="118" fill="#E11D48"/>
    <circle cx="1050" cy="588" r="16" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
    <text x="1050" y="594" font-size="14" font-weight="700" fill="#E11D48" text-anchor="middle">3</text>
    <text x="1080" y="592" font-size="16" font-weight="700" fill="#0F172A">跨主体互信成本高</text>
    <text x="1080" y="622" font-size="11" fill="#475569">多主体协作需逐双边互信，N 方需 O(N²) 协定</text>
    <text x="1080" y="644" font-size="11" fill="#475569">扩展性差 → 数据流转被平台卡点</text>
  </g>

  <!-- final arrow to question -->
  <line x1="1340" y1="668" x2="1340" y2="724" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>

  <!-- question node -->
  <g>
    <circle cx="1340" cy="762" r="30" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
    <text x="1340" y="773" font-size="28" font-weight="700" fill="#64748B" text-anchor="middle">?</text>
    <text x="1340" y="812" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">谁为数据可信性背书？</text>
  </g>

  <!-- right callout -->
  <g>
    <rect x="960" y="770" width="240" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="978" y="791" font-size="11" fill="#334155">三困境同根 → 信任缺失</text>
  </g>

  <!-- ===== legend ===== -->
  <line x1="60" y1="838" x2="1740" y2="838" stroke="#E2E8F0"/>
  <g font-size="11" fill="#475569">
    <rect x="280" y="856" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="304" y="866">中心平台 / 服务器</text>

    <rect x="480" y="856" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="504" y="866">物联网设备（边缘）</text>

    <rect x="700" y="856" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/>
    <text x="724" y="866">信任困境</text>

    <rect x="880" y="856" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <text x="904" y="866">未解决问题</text>

    <line x1="1080" y1="862" x2="1116" y2="862" stroke="#2563EB" stroke-width="2"/>
    <text x="1124" y="866">主链路（设备→平台）</text>

    <line x1="1320" y1="862" x2="1356" y2="862" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="1364" y="866">回传 / 未决</text>
  </g>

  <!-- ===== caption ===== -->
  <text x="900" y="918" font-size="10" fill="#94A3B8" text-anchor="middle">图13-1 中心化物联网架构的信任困境。单点故障、数据篡改、跨主体互信三个问题相互关联，共同指向“单一信任锚点”的结构性缺陷。</text>
  </svg>
</svg>
