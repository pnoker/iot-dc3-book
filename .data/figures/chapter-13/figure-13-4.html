<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据验证与溯源机制时序图</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">数据验证与溯源机制时序图</title>
  <desc id="desc">数据从传感器经边缘节点上链，合约记录指纹并发出事件；验证者通过对比哈希确认完整性，同时利用事件追溯历史操作。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="28.000" width="1152.000" height="704.000" viewBox="0 0 1800.000 1100.000" preserveAspectRatio="xMidYMid meet">
<title>数据验证与溯源机制时序图</title>
  <desc>数据从传感器经边缘节点上链，合约记录指纹并发出事件；验证者通过对比哈希确认完整性，同时利用事件追溯历史操作。</desc>

  <defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="1100" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">数据验证与溯源机制时序图</text>
  <text x="84" y="70" font-size="12" fill="#64748B">传感器 → 边缘节点 → 合约上链 → 事件索引 → 验证者比对哈希确认完整性，事件日志可追溯历史操作</text>
  <rect x="1666" y="26" width="110" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1721" y="43" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">SEQUENCE</text>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Time axis (left) ===== -->
  <text x="60" y="125" font-size="10" font-weight="700" fill="#64748B">时间</text>
  <line x1="86" y1="195" x2="86" y2="800" stroke="#94A3B8" stroke-width="1"/>
  <!-- T0..T6 ticks aligned with message rows -->
  <g font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">
    <line x1="78" y1="300" x2="94" y2="300" stroke="#94A3B8"/><text x="56" y="304">T0</text>
    <line x1="78" y1="370" x2="94" y2="370" stroke="#94A3B8"/><text x="56" y="374">T1</text>
    <line x1="78" y1="445" x2="94" y2="445" stroke="#94A3B8"/><text x="56" y="449">T2</text>
    <line x1="78" y1="520" x2="94" y2="520" stroke="#94A3B8"/><text x="56" y="524">T3</text>
    <line x1="78" y1="605" x2="94" y2="605" stroke="#94A3B8"/><text x="56" y="609">T4</text>
    <line x1="78" y1="680" x2="94" y2="680" stroke="#94A3B8"/><text x="56" y="684">T5</text>
    <line x1="78" y1="760" x2="94" y2="760" stroke="#94A3B8"/><text x="56" y="764">T6</text>
  </g>
  <text x="86" y="822" font-size="10" fill="#94A3B8" text-anchor="middle">↓</text>

  <!-- ===== Edge domain boundary (传感器 + 边缘节点) ===== -->
  <rect x="128" y="120" width="386" height="78" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="138" y="111" width="124" height="18" rx="4" fill="#FFFFFF" stroke="#10B981" stroke-width="1"/>
  <text x="200" y="124" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">设备与边缘域 · edge</text>

  <!-- ===== Lifelines ===== -->
  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4">
    <line x1="200" y1="190" x2="200" y2="800"/>
    <line x1="440" y1="190" x2="440" y2="800"/>
    <line x1="720" y1="190" x2="720" y2="800"/>
    <line x1="1000" y1="190" x2="1000" y2="800"/>
    <line x1="1280" y1="190" x2="1280" y2="800"/>
    <line x1="1560" y1="190" x2="1560" y2="800"/>
  </g>

  <!-- ===== Participant headers ===== -->
  <!-- 1. 传感器 (edge/green) -->
  <g>
    <rect x="135" y="135" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <!-- thermometer icon -->
    <circle cx="180" cy="156" r="6" fill="none" stroke="#10B981" stroke-width="1.6"/>
    <rect x="177" y="146" width="6" height="14" rx="3" fill="none" stroke="#10B981" stroke-width="1.6"/>
    <text x="200" y="178" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">传感器</text>
  </g>

  <!-- 2. 边缘节点 (edge/green) -->
  <g>
    <rect x="375" y="135" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <!-- gateway icon -->
    <rect x="407" y="148" width="22" height="14" rx="2" fill="none" stroke="#10B981" stroke-width="1.6"/>
    <line x1="411" y1="166" x2="411" y2="170" stroke="#10B981" stroke-width="1.6"/>
    <line x1="418" y1="166" x2="418" y2="170" stroke="#10B981" stroke-width="1.6"/>
    <line x1="425" y1="166" x2="425" y2="170" stroke="#10B981" stroke-width="1.6"/>
    <text x="440" y="178" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">边缘节点</text>
  </g>

  <!-- 3. 智能合约 (platform/blue) -->
  <g>
    <rect x="655" y="135" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <!-- contract icon -->
    <rect x="688" y="148" width="18" height="16" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="692" y1="153" x2="702" y2="153" stroke="#2563EB" stroke-width="1.4"/>
    <line x1="692" y1="157" x2="702" y2="157" stroke="#2563EB" stroke-width="1.4"/>
    <line x1="692" y1="161" x2="700" y2="161" stroke="#2563EB" stroke-width="1.4"/>
    <text x="720" y="178" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">智能合约</text>
  </g>

  <!-- 4. 区块链网络 (cloud/amber) — three chained blocks -->
  <g>
    <rect x="935" y="135" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <!-- 3 zigzag blocks -->
    <g fill="#FFFFFF" stroke="#D97706" stroke-width="1.5">
      <rect x="956" y="144" width="30" height="16" rx="2"/>
      <rect x="987" y="144" width="30" height="16" rx="2"/>
      <rect x="1018" y="144" width="30" height="16" rx="2"/>
      <line x1="986" y1="148" x2="987" y2="148" stroke="#D97706"/>
    </g>
    <line x1="986" y1="152" x2="987" y2="152" stroke="#D97706"/>
    <text x="1000" y="178" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">区块链网络</text>
  </g>

  <!-- 5. 链下监听器 (data/purple) -->
  <g>
    <rect x="1215" y="135" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <!-- database cylinder icon -->
    <ellipse cx="1248" cy="148" rx="10" ry="3.5" fill="none" stroke="#7C3AED" stroke-width="1.6"/>
    <path d="M 1238 148 V 162 A 10 3.5 0 0 0 1258 162 V 148" fill="none" stroke="#7C3AED" stroke-width="1.6"/>
    <text x="1280" y="178" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">链下监听器</text>
  </g>

  <!-- 6. 验证者 (ai/orange) -->
  <g>
    <rect x="1495" y="135" width="130" height="52" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <!-- magnifier icon -->
    <circle cx="1528" cy="154" r="6" fill="none" stroke="#F59E0B" stroke-width="1.6"/>
    <line x1="1532" y1="158" x2="1538" y2="164" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="1560" y="178" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">验证者</text>
  </g>

  <!-- ===== Smart contract internal detail box (on contract lifeline) ===== -->
  <g>
    <rect x="612" y="205" width="216" height="76" rx="6" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="720" y="221" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">合约内部状态</text>
    <text x="624" y="238" font-size="9.5" fill="#475569">mapping · dataHashes</text>
    <text x="624" y="251" font-size="9.5" fill="#475569">mapping · dataTimestamps</text>
    <text x="624" y="264" font-size="9.5" fill="#475569">mapping · dataOwners</text>
    <text x="624" y="276" font-size="9.5" fill="#475569">event · DataStored / DataVerified</text>
  </g>

  <!-- ===== Activation bars (thin colored rects on lifelines during activity) ===== -->
  <g>
    <rect x="197" y="290" width="6" height="20" fill="#10B981" opacity="0.5"/>
    <rect x="437" y="290" width="6" height="90" fill="#10B981" opacity="0.5"/>
    <rect x="717" y="360" width="6" height="95" fill="#2563EB" opacity="0.5"/>
    <rect x="997" y="440" width="6" height="90" fill="#D97706" opacity="0.5"/>
    <rect x="1277" y="512" width="6" height="20" fill="#7C3AED" opacity="0.5"/>
    <rect x="1557" y="598" width="6" height="90" fill="#F59E0B" opacity="0.5"/>
  </g>

  <!-- ===== Messages ===== -->
  <!-- T0: 传感器 → 边缘节点  原始数据 JSON (solid green) -->
  <g>
    <line x1="207" y1="300" x2="432" y2="300" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
    <circle cx="210" cy="288" r="8" fill="#10B981"/>
    <text x="210" y="291" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="320" y="293" font-size="12" fill="#475569" text-anchor="middle">原始数据 JSON</text>
    <text x="320" y="316" font-size="9" fill="#64748B" text-anchor="middle" font-style="italic">{device_id, temp, ts}</text>
  </g>

  <!-- T1: 边缘节点 → 智能合约  上链交易 storeDataHash (solid blue MAIN) -->
  <g>
    <line x1="447" y1="370" x2="712" y2="370" stroke="#2563EB" stroke-width="2.4" marker-end="url(#ah-blue)"/>
    <circle cx="450" cy="358" r="8" fill="#2563EB"/>
    <text x="450" y="361" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="580" y="363" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">上链交易 · storeDataHash(<tspan font-style="italic">dataId, hash</tspan>)</text>
    <text x="580" y="386" font-size="9" fill="#64748B" text-anchor="middle">边缘节点计算 <tspan font-style="italic">keccak256</tspan> 后签名提交</text>
  </g>

  <!-- T2: 智能合约 → 区块链网络  状态写入 mapping (solid blue) -->
  <g>
    <line x1="727" y1="445" x2="992" y2="445" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
    <circle cx="730" cy="433" r="8" fill="#2563EB"/>
    <text x="730" y="436" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="860" y="438" font-size="12" fill="#475569" text-anchor="middle">状态写入 · 打包交易 / 生成区块</text>
  </g>

  <!-- T3: 区块链网络 → 链下监听器  事件索引 DataStored (dashed gray) -->
  <g>
    <line x1="1007" y1="520" x2="1272" y2="520" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <circle cx="1010" cy="508" r="8" fill="#64748B"/>
    <text x="1010" y="511" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="1140" y="513" font-size="12" fill="#475569" text-anchor="middle">事件索引 · DataStored (<tspan font-style="italic">indexed</tspan>)</text>
  </g>

  <!-- T4: 验证者 → 智能合约  验证请求 verifyData (solid orange, right-to-left) -->
  <g>
    <line x1="1553" y1="605" x2="728" y2="605" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
    <circle cx="1550" cy="593" r="8" fill="#F59E0B"/>
    <text x="1550" y="596" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="1140" y="598" font-size="12" fill="#475569" text-anchor="middle">验证请求 · verifyData(<tspan font-style="italic">dataId, rawData</tspan>)</text>
  </g>

  <!-- T5: 智能合约 → 验证者  结果广播 DataVerified (dashed gray) -->
  <g>
    <line x1="727" y1="680" x2="1552" y2="680" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <circle cx="730" cy="668" r="8" fill="#64748B"/>
    <text x="730" y="671" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="1140" y="673" font-size="12" fill="#475569" text-anchor="middle">结果广播 · DataVerified（比对哈希一致）</text>
  </g>

  <!-- T6: 链下监听器 → 验证者  历史查询 (solid purple) -->
  <g>
    <line x1="1287" y1="760" x2="1552" y2="760" stroke="#7C3AED" stroke-width="2" marker-end="url(#ah-purple)"/>
    <circle cx="1290" cy="748" r="8" fill="#7C3AED"/>
    <text x="1290" y="751" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
    <text x="1420" y="753" font-size="12" fill="#475569" text-anchor="middle">历史查询 · DataStored 列表</text>
  </g>

  <!-- ===== Legend ===== -->
  <line x1="60" y1="845" x2="1740" y2="845" stroke="#E2E8F0" stroke-width="1"/>
  <text x="60" y="872" font-size="11" font-weight="700" fill="#475569">图例</text>
  <g font-size="11" fill="#475569">
    <!-- solid blue: 交易/直接调用 -->
    <line x1="130" y1="888" x2="170" y2="888" stroke="#2563EB" stroke-width="2.4" marker-end="url(#ah-blue)"/>
    <text x="182" y="892">交易 / 直接调用（主链路）</text>
    <!-- dashed gray: 事件广播 -->
    <line x1="400" y1="888" x2="440" y2="888" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
    <text x="452" y="892">事件广播 / 异步通知</text>
    <!-- orange: 验证请求 -->
    <line x1="650" y1="888" x2="690" y2="888" stroke="#F59E0B" stroke-width="2" marker-end="url(#ah-orange)"/>
    <text x="702" y="892">验证请求（带编号圆点）</text>
    <!-- purple: 历史查询 -->
    <line x1="900" y1="888" x2="940" y2="888" stroke="#7C3AED" stroke-width="2" marker-end="url(#ah-purple)"/>
    <text x="952" y="892">历史溯源查询</text>
    <!-- zigzag block: 区块 -->
    <rect x="1130" y="881" width="20" height="14" rx="2" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <rect x="1152" y="881" width="20" height="14" rx="2" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <text x="1182" y="892">锯齿矩形 · 区块</text>
    <!-- circle icon: 参与方 -->
    <circle cx="1340" cy="888" r="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
    <text x="1354" y="892">圆形图标 · 参与方</text>
    <!-- cylinder: 数据/事件库 -->
    <ellipse cx="1500" cy="884" rx="9" ry="3" fill="none" stroke="#7C3AED" stroke-width="1.4"/>
    <path d="M 1491 884 V 892 A 9 3 0 0 0 1509 892 V 884" fill="none" stroke="#7C3AED" stroke-width="1.4"/>
    <text x="1518" y="892">圆柱 · 链下事件库</text>
  </g>

  <!-- ===== Callout ===== -->
  <g>
    <rect x="60" y="935" width="1680" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="78" y="958" font-size="11" fill="#334155">
      <tspan font-weight="700" fill="#0F172A">责任边界 · </tspan>边缘域负责采集成指纹（<tspan font-style="italic">keccak256</tspan>）与签名，合约仅存储哈希指纹与时间戳，原始数据留链下；
    </text>
    <text x="78" y="976" font-size="11" fill="#334155">
      <tspan font-weight="700" fill="#0F172A">溯源闭环 · </tspan>DataStored 事件被链下监听器索引，验证者既能实时比对哈希（步骤 5→6），也能经监听器回溯历史（步骤 7）。
    </text>
  </g>

  <!-- ===== Caption ===== -->
  <text x="900" y="1028" font-size="10" fill="#94A3B8" text-anchor="middle">图 13-5 · 数据验证与溯源时序图。数据从传感器经边缘节点上链，合约记录指纹并发出事件；验证者通过对比哈希确认完整性，同时利用事件追溯历史操作。</text>
  </svg>
