<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图13-2 数据上链流程图</title>
  <style>
    body { margin: 0; background: #F8FAFC; color: #0F172A; font-family: Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .page { max-width: 1220px; margin: 24px auto; padding: 0 20px 28px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .card { background: #FFFFFF; border: 1px solid #94A3B8; border-radius: 14px; padding: 14px 16px; }
    .label { color: #475569; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 14px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="page">
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="72.800" width="1152.000" height="614.400" viewBox="0 0 1800.000 960.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="960" fill="#FFFFFF"/>

  <!-- ===== Title region ===== -->
  <circle cx="64" cy="44" r="6" fill="#2563EB"/>
  <text x="84" y="51" font-size="22" font-weight="700" fill="#0F172A">图13-2 数据上链流程图</text>
  <text x="84" y="74" font-size="12" fill="#64748B">数据上链主链路 · 链下原始数据与链上指纹的协作验证</text>
  <rect x="1640" y="30" width="120" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1700" y="48" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="1.5">FLOWCHART</text>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0"/>

  <!-- ===== Region boundaries ===== -->
  <!-- 设备与边缘域 (edge / green) -->
  <rect x="70" y="448" width="620" height="186" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"/>
  <text x="84" y="470" font-size="12" font-weight="600" fill="#10B981">设备与边缘域</text>
  <text x="84" y="486" font-size="9" fill="#64748B">现场异构资源边界</text>

  <!-- 链下存储 (gray) -->
  <rect x="840" y="306" width="280" height="158" rx="12" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"/>
  <text x="854" y="328" font-size="12" font-weight="600" fill="#64748B">链下存储</text>
  <text x="854" y="344" font-size="9" fill="#94A3B8">去中心化原始数据沉淀</text>

  <!-- 链上存证 (blue) -->
  <rect x="840" y="606" width="280" height="158" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"/>
  <text x="854" y="628" font-size="12" font-weight="600" fill="#2563EB">链上存证</text>
  <text x="854" y="644" font-size="9" fill="#64748B">智能合约 · 日志事件</text>

  <!-- 验证 (decision / blue) -->
  <rect x="1340" y="448" width="240" height="186" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"/>
  <text x="1354" y="470" font-size="12" font-weight="600" fill="#2563EB">验证</text>
  <text x="1354" y="486" font-size="9" fill="#64748B">决策判断域 · 双侧比对</text>

  <!-- ===== Components ===== -->
  <!-- r1 传感器 (edge / green) -->
  <rect x="100" y="492" width="200" height="96" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="200" y="524" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">传感器</text>
  <text x="200" y="546" font-size="10" fill="#475569" text-anchor="middle">设备采样</text>
  <text x="200" y="564" font-size="9" fill="#64748B" text-anchor="middle">生成 JSON 记录</text>

  <!-- r3 边缘节点 (platform / blue, primary) -->
  <rect x="460" y="492" width="200" height="96" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="560" y="524" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">边缘节点</text>
  <text x="560" y="546" font-size="10" fill="#475569" text-anchor="middle">聚合 · 计算哈希</text>
  <text x="560" y="564" font-size="9" fill="#64748B" text-anchor="middle">可构建 Merkle 树</text>

  <!-- IPFS/Arweave (cylinder, gray, 链下存储) -->
  <path d="M880,350 v80 a100,14 0 0 0 200,0 v-80" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <ellipse cx="980" cy="350" rx="100" ry="14" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="980" y="395" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">IPFS / Arweave</text>
  <text x="980" y="415" font-size="10" fill="#475569" text-anchor="middle">去中心化存储 · 链下</text>

  <!-- 区块链 (cylinder, blue, 链上存证) -->
  <path d="M880,650 v80 a100,14 0 0 0 200,0 v-80" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <ellipse cx="980" cy="650" rx="100" ry="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="980" y="695" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">区块链</text>
  <text x="980" y="715" font-size="10" fill="#475569" text-anchor="middle">智能合约 · 链上存证</text>

  <!-- 验证方 (platform / blue) -->
  <rect x="1360" y="492" width="200" height="96" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1460" y="524" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">验证方</text>
  <text x="1460" y="546" font-size="10" fill="#475569" text-anchor="middle">哈希比对</text>
  <text x="1460" y="564" font-size="9" fill="#64748B" text-anchor="middle">链下重算 ↔ 链上查询</text>

  <!-- ===== Arrows ===== -->
  <!-- 1. 传感器 → 边缘节点 : 采样数据 (green solid) -->
  <line x1="300" y1="540" x2="452" y2="540" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="376" y="532" font-size="11" fill="#0F172A" text-anchor="middle">采样数据</text>

  <!-- 2. 边缘节点 → IPFS : 原始数据 (gray solid) -->
  <polyline points="660,520 770,520 770,400 872,400" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="722" y="512" font-size="11" fill="#0F172A" text-anchor="middle">原始数据</text>

  <!-- 3. 边缘节点 → 区块链 : 哈希+元数据 (blue solid, MAIN on-chain path) -->
  <polyline points="660,560 770,560 770,680 872,680" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="722" y="576" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">哈希 + 元数据</text>

  <!-- 4. IPFS → 验证方 : 提供原始数据 (gray solid) -->
  <polyline points="1080,400 1230,400 1230,520 1352,520" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="1155" y="392" font-size="11" fill="#0F172A" text-anchor="middle">提供原始数据</text>

  <!-- 5. 区块链 → 验证方 : 查询哈希 (blue dashed query) -->
  <polyline points="1080,680 1230,680 1230,560 1352,560" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-blue)"/>
  <text x="1155" y="672" font-size="11" fill="#2563EB" text-anchor="middle">查询哈希是否存在</text>

  <!-- ===== Callout ===== -->
  <rect x="540" y="798" width="720" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="560" y="821" font-size="11" fill="#334155" font-weight="600">主结论 · 链下存储与链上指纹协作</text>
  <text x="560" y="841" font-size="11" fill="#334155">验证方重新计算链下原始数据的哈希，与链上存证的指纹比对——一致即证明数据自上链后未被篡改。</text>

  <!-- ===== Legend ===== -->
  <line x1="60" y1="876" x2="1740" y2="876" stroke="#E2E8F0"/>
  <rect x="120" y="896" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
  <text x="146" y="906" font-size="11" fill="#475569">设备 / 传感器</text>
  <rect x="290" y="896" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="316" y="906" font-size="11" fill="#475569">核心处理 / 链上</text>
  <rect x="470" y="896" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="496" y="906" font-size="11" fill="#475569">外部存储</text>
  <line x1="640" y1="902" x2="688" y2="902" stroke="#2563EB" stroke-width="2"/>
  <text x="696" y="906" font-size="11" fill="#475569">同步 / 主动推送</text>
  <line x1="850" y1="902" x2="898" y2="902" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="906" y="906" font-size="11" fill="#475569">查询 / 读取</text>

  <!-- ===== Caption ===== -->
  <text x="900" y="942" font-size="10" fill="#94A3B8" text-anchor="middle">图13-2 数据从传感器采样，经边缘节点分流至链下存储与链上存证，验证方通过两侧数据比对确认数据完整性。</text>
  </svg>
</svg>
    <section class="meta">
      <div class="card"><div class="label">图表类型</div><div class="value">flowchart</div></div>
      <div class="card"><div class="label">布局说明</div><div class="value">自左向右的流程，传感器→边缘节点（聚合+哈希）→分支：左侧去往IPFS/Arweave（链下存储），右侧去往区块链（链上存证）→两侧再合并到验证方。</div></div>
      <div class="card"><div class="label">渲染说明</div><div class="value">出版级精品图资产</div></div>
    </section>
  </main>
</body>
</html>
