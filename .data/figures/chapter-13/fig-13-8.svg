    <text x="395" y="191" font-size="10" fill="#475569" text-anchor="middle">面向消费者 / 监管方</text>
  </g>
  <g>
    <rect x="620" y="150" width="330" height="50" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="785" y="173" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">移动端防伪验证</text>
    <text x="785" y="191" font-size="10" fill="#475569" text-anchor="middle">扫码验真 · 批次追踪</text>
  </g>
  <g>
    <rect x="1010" y="150" width="330" height="50" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="1175" y="173" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">企业 ERP 对接</text>
    <text x="1175" y="191" font-size="10" fill="#475569" text-anchor="middle">供应链协同 · 对账</text>
  </g>
  <g>
    <rect x="1400" y="150" width="330" height="50" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="1565" y="173" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">数据报表</text>
    <text x="1565" y="191" font-size="10" fill="#475569" text-anchor="middle">风险预警 · 合规审计</text>
  </g>

  <!-- ===== 区块链网络层 components (blue, primary) ===== -->
  <!-- 分布式账本 (database cylinder) -->
  <g>
    <ellipse cx="395" cy="278" rx="165" ry="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="230" y="278" width="330" height="104" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <ellipse cx="395" cy="382" rx="165" ry="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <line x1="230" y1="290" x2="560" y2="290" stroke="#2563EB" stroke-width="1" opacity="0.4"/>
    <text x="395" y="334" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">分布式账本</text>
    <text x="395" y="356" font-size="10" fill="#475569" text-anchor="middle">不可篡改 · 全节点复制</text>
  </g>
  <g>
    <rect x="620" y="270" width="330" height="120" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="785" y="296" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">共识机制</text>
    <text x="785" y="318" font-size="10" fill="#475569" text-anchor="middle">Raft / PBFT</text>
    <text x="785" y="348" font-size="9" fill="#64748B" text-anchor="middle">交易排序 · 最终一致性</text>
    <text x="785" y="368" font-size="9" fill="#64748B" text-anchor="middle">拜占庭容错 · 少数作恶可容忍</text>
  </g>
  <g>
    <rect x="1010" y="270" width="330" height="120" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1175" y="296" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">智能合约</text>
    <text x="1175" y="318" font-size="10" fill="#475569" text-anchor="middle">质检 · 预警 · 冻结</text>
    <text x="1175" y="348" font-size="9" fill="#64748B" text-anchor="middle">阈值校验 · 自动告警</text>
    <text x="1175" y="368" font-size="9" fill="#64748B" text-anchor="middle">异常批次链上冻结</text>
  </g>
  <g>
    <rect x="1400" y="270" width="330" height="120" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="1565" y="296" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">参与方节点</text>
    <text x="1565" y="318" font-size="10" fill="#475569" text-anchor="middle">生产 · 物流 · 仓储 · 零售</text>
    <text x="1565" y="348" font-size="9" fill="#64748B" text-anchor="middle">多方共同维护账本</text>
    <text x="1565" y="368" font-size="9" fill="#64748B" text-anchor="middle">权限隔离 · 身份证书</text>
  </g>

  <!-- ===== 边缘层 components (green) ===== -->
  <g>
    <rect x="230" y="465" width="330" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="395" y="493" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">边缘网关</text>
    <text x="395" y="515" font-size="10" fill="#475569" text-anchor="middle">协议适配 · 数据汇聚</text>
  </g>
  <g>
    <rect x="620" y="465" width="330" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="785" y="493" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">嵌入式节点</text>
    <text x="785" y="515" font-size="10" fill="#475569" text-anchor="middle">本地格式化 · 时间戳</text>
  </g>
  <g>
    <rect x="1010" y="465" width="330" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1175" y="493" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">哈希 &amp; 数字签名</text>
    <text x="1175" y="515" font-size="10" fill="#475569" text-anchor="middle">SHA-256 · 私钥签名</text>
  </g>
  <!-- 本地缓存/IPFS (cylinder) -->
  <g>
    <ellipse cx="1565" cy="475" rx="165" ry="9" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <rect x="1400" y="475" width="330" height="50" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <ellipse cx="1565" cy="525" rx="165" ry="9" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1565" y="503" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">本地缓存 / IPFS</text>
    <text x="1565" y="520" font-size="10" fill="#475569" text-anchor="middle">原始数据留存</text>
  </g>

  <!-- ===== 感知层 components (green) ===== -->
  <g>
    <rect x="230" y="605" width="330" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="395" y="633" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">温度传感器</text>
    <text x="395" y="655" font-size="10" fill="#475569" text-anchor="middle">冷链温区监测</text>
  </g>
  <g>
    <rect x="620" y="605" width="330" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="785" y="633" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">湿度传感器</text>
    <text x="785" y="655" font-size="10" fill="#475569" text-anchor="middle">仓储环境监测</text>
  </g>
  <g>
    <rect x="1010" y="605" width="330" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1175" y="633" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">RFID 读写器</text>
    <text x="1175" y="655" font-size="10" fill="#475569" text-anchor="middle">批次身份识别</text>
  </g>
  <g>
    <rect x="1400" y="605" width="330" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="1565" y="633" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">GPS 模块</text>
    <text x="1565" y="655" font-size="10" fill="#475569" text-anchor="middle">运输轨迹定位</text>
  </g>

  <!-- ===== Inter-layer arrows (main uplink chain, center x=900) ===== -->
  <!-- 感知层 -> 边缘层 (green, solid) -->
  <line x1="900" y1="595" x2="900" y2="540" stroke="#10B981" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="918" y="572" font-size="11" fill="#475569">原始数据 · RS-485 / Zigbee / BLE</text>

  <!-- 边缘层 -> 区块链网络层 (PRIMARY: blue, bold) -->
  <line x1="900" y1="455" x2="900" y2="402" stroke="#2563EB" stroke-width="3" marker-end="url(#ah-blue)"/>
  <text x="918" y="425" font-size="12" font-weight="700" fill="#2563EB">哈希 + 签名 + 元数据 · 打包上链</text>
  <circle cx="900" cy="428" r="4" fill="#2563EB"/>

  <!-- 区块链网络层 -> 应用层 (blue, solid, data push) -->
  <line x1="820" y1="255" x2="820" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="838" y="234" font-size="11" fill="#475569">共识结果同步</text>

  <!-- 应用层 -> 区块链网络层 (gray, dashed, query request, reverse) -->
  <line x1="1080" y1="205" x2="1080" y2="252" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1098" y="234" font-size="11" fill="#64748B">溯源查询请求</text>

  <!-- no-direct-access indicator: 应用层 dashed to 边缘/感知 with X mark -->
  <g opacity="0.55">
    <line x1="720" y1="205" x2="720" y2="605" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="3 5"/>
    <line x1="708" y1="400" x2="732" y2="416" stroke="#E11D48" stroke-width="2"/>
    <line x1="732" y1="400" x2="708" y2="416" stroke="#E11D48" stroke-width="2"/>
    <text x="640" y="408" font-size="10" fill="#E11D48" text-anchor="middle">禁止跨层直读</text>
  </g>

  <!-- ===== Legend ===== -->
  <line x1="60" y1="730" x2="1740" y2="730" stroke="#E2E8F0" stroke-width="1"/>

  <text x="60" y="755" font-size="12" font-weight="700" fill="#0F172A">图例</text>

  <!-- swatches -->
  <rect x="120" y="745" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="144" y="755" font-size="11" fill="#475569">设备与边缘（感知层 · 边缘层）</text>

  <rect x="370" y="745" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="394" y="755" font-size="11" fill="#475569">核心服务（区块链网络层）</text>

  <rect x="620" y="745" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="644" y="755" font-size="11" fill="#475569">终端应用（应用层）</text>

  <line x1="850" y1="751" x2="890" y2="751" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="900" y="755" font-size="11" fill="#475569">实线：数据推送</text>

  <line x1="1080" y1="751" x2="1120" y2="751" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-gray)"/>
  <text x="1130" y="755" font-size="11" fill="#475569">虚线：查询请求</text>

  <!-- callout -->
  <rect x="1320" y="738" width="420" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1530" y="757" font-size="11" fill="#334155" text-anchor="middle">应用层不直接访问感知/边缘层，原始数据留存于边缘或 IPFS，链上仅存哈希。</text>

  <!-- ===== Caption ===== -->
  <text x="900" y="800" font-size="10" fill="#94A3B8" text-anchor="middle">图13-8 展示四层结构的职责边界与数据流向：边缘层将原始传感器数据哈希化后上链，区块链网络层负责记录、共识与智能合约执行，应用层仅通过链上数据完成溯源与防伪。</text>
  </svg>
</svg>