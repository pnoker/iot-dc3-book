<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
    <marker id="ah-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#E11D48"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="900" fill="#FFFFFF"/>

  <!-- ===== Title area ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="84" y="47" font-size="22" font-weight="700" fill="#0F172A">图13-8 基于区块链的供应链溯源系统分层架构</text>
  <text x="84" y="71" font-size="12" fill="#64748B">四层结构 · 自下而上的数据流动与责任边界</text>

  <rect x="1670" y="26" width="100" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1720" y="46" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">LAYERED</text>

  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Region boundaries (dashed) ===== -->
  <rect x="40" y="118" width="1720" height="102" rx="12" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="1744" y="0" visibility="hidden">spacer</text>
  <text x="1720" y="136" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="end">业务应用域 · 业务价值交付边界</text>

  <rect x="40" y="238" width="1720" height="186" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="1720" y="256" font-size="11" font-weight="700" fill="#2563EB" text-anchor="end">平台服务域 · 核心服务能力边界</text>

  <rect x="40" y="448" width="1720" height="262" rx="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="1720" y="466" font-size="11" font-weight="700" fill="#10B981" text-anchor="end">设备与边缘域 · 现场异构资源边界</text>

  <!-- ===== Layer band fills ===== -->
  <rect x="220" y="135" width="1520" height="80" fill="#F59E0B" opacity="0.06"/>
  <rect x="220" y="255" width="1520" height="150" fill="#2563EB" opacity="0.06"/>
  <rect x="220" y="455" width="1520" height="90" fill="#10B981" opacity="0.06"/>
  <rect x="220" y="595" width="1520" height="90" fill="#10B981" opacity="0.06"/>

  <!-- ===== Layer label cards (left) ===== -->
  <!-- 应用层 -->
  <rect x="56" y="150" width="150" height="50" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="131" y="174" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">应用层</text>
  <text x="131" y="191" font-size="10" fill="#64748B" text-anchor="middle">Application</text>

  <!-- 区块链网络层 -->
  <rect x="56" y="280" width="150" height="100" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="131" y="316" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">区块链</text>
  <text x="131" y="336" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">网络层</text>
  <text x="131" y="358" font-size="10" fill="#64748B" text-anchor="middle">Blockchain</text>

  <!-- 边缘层 -->
  <rect x="56" y="465" width="150" height="70" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="131" y="495" font-size="15" font-weight="700" fill="#0F172A" text-anchor="middle">边缘层</text>
  <text x="131" y="515" font-size="10" fill="#64748B" text-anchor="middle">Edge</text>

