  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">示意一场智慧工厂的典型物联连接拓扑。车间传感器每小时上报一次均方根振动值，边缘网关抓取异常波形后直接触发告警，同时上传至云平台做趋势分析。云平台模型判断当前设备即将失效，自动向传送带控制器下发减速指令，避免带病运行产生残次品。整个过程无需人工介入，数据在物与系统之间循环流动。</text>
