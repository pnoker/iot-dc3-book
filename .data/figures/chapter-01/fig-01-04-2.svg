<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">图1-4 RFID 系统基本组成</title>
  <desc id="desc">RFID 的核心组态是标签-读写器-后台系统，工程关键在于标签类型（有源/无源）和读写器部署方案的选择。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="92.000" width="1152.000" height="576.000" viewBox="0 0 1800.000 900.000" preserveAspectRatio="xMidYMid meet">
<title id="title">图1-4 RFID 系统基本组成</title>
  <desc id="desc">RFID 的核心组态是标签-读写器-后台系统，工程关键在于标签类型（有源/无源）和读写器部署方案的选择。</desc>
  <defs>
    <marker id="bp-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#475569"/></marker>
    <marker id="bp-arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/></marker>
  </defs>
  <rect width="1800" height="900" fill="#FFFFFF"/>
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" fill="#0F172A" font-size="22" font-weight="700">图1-4 RFID 系统基本组成</text>
  <text x="82" y="70" fill="#64748B" font-size="12">RFID 的核心组态是标签-读写器-后台系统，工程关键在于标签类型（有源/无源）和读写器部署方案的选择。</text>
  <rect x="1624" y="28" width="132" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1690" y="44" fill="#64748B" font-size="11" text-anchor="middle" letter-spacing="1.4">ARCHITECTURE</text>
  <line x1="64" y1="100" x2="1736" y2="100" stroke="#E2E8F0"/>
  <g data-layout="architecture">
  <!-- Regions -->
  <rect x="120" y="240" width="340" height="200" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="130" y="260" fill="#64748B" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif" font-weight="500">物理环境</text>
  
  <rect x="540" y="240" width="340" height="200" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="550" y="260" fill="#64748B" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif" font-weight="500">接入层</text>
  
  <rect x="1000" y="240" width="340" height="200" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="1010" y="260" fill="#64748B" font-size="12" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif" font-weight="500">后台处理域</text>
  
  <!-- Lines -->
  <line x1="380" y1="340" x2="600" y2="340" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="440" y="328" width="110" height="20" rx="4" fill="white" stroke="none"/>
  <text x="495" y="342" fill="#0F172A" font-size="11" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">射频信号</text>
  
  <line x1="820" y1="340" x2="1050" y2="340" stroke="#2563EB" stroke-width="2" marker-end="url(#bp-arrow-primary)"/>
  <rect x="880" y="328" width="120" height="20" rx="4" fill="white" stroke="none"/>
  <text x="940" y="342" fill="#0F172A" font-size="11" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">解码后数据</text>
  
  <!-- Nodes -->
  <rect x="200" y="300" width="180" height="80" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="290" y="330" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">RFID 标签</text>
  <text x="290" y="350" fill="#475569" font-size="11" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">有源/无源，EPC</text>
  
  <rect x="600" y="300" width="220" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="710" y="330" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">读写器</text>
  <text x="710" y="350" fill="#475569" font-size="11" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">射频收发+解码</text>
  
  <rect x="1050" y="300" width="220" height="80" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1160" y="330" fill="#0F172A" font-size="15" font-weight="600" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">后台系统</text>
  <text x="1160" y="350" fill="#475569" font-size="11" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif">数据库/ERP</text>
</g>
  <line x1="64" y1="775" x2="1736" y2="775" stroke="#E2E8F0"/>
  <rect x="80" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">蓝色：后台系统；青绿色：边缘标签；蓝色：接入读写器</text>
  <rect x="635" y="797" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="659" y="808" fill="#64748B" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="start">实线：射频/数据链路</text>
  <text x="900" y="855" fill="#94A3B8" font-size="10" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="600" text-anchor="middle">图1-4 RFID 系统基本组成：标签、读写器与后台系统的物理/逻辑关系。</text>
  </svg>
</svg>