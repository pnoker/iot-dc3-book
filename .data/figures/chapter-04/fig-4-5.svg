<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">出版级插图</title>
  <desc id="desc">统一横向画布，适配书籍正文排版。</desc>
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <svg x="24.000" y="85.600" width="1152.000" height="588.800" viewBox="0 0 1800.000 920.000" preserveAspectRatio="xMidYMid meet">
<defs>
    <marker id="ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563EB"/></marker>
    <marker id="ah-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748B"/></marker>
    <marker id="ah-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#10B981"/></marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#F59E0B"/></marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7C3AED"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1800" height="920" fill="#FFFFFF"/>

  <!-- ===== Title region ===== -->
  <circle cx="64" cy="40" r="6" fill="#2563EB"/>
  <text x="82" y="47" font-size="22" font-weight="700" fill="#0F172A">图4-5 设备抽象与物模型映射示意图</text>
  <text x="82" y="70" font-size="12" fill="#64748B">从原生协议数据到统一物模型实例的映射链路 · 设备抽象层屏蔽协议差异</text>
  <rect x="1680" y="24" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1730" y="41" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">DATAFLOW</text>
  <line x1="60" y1="103" x2="1740" y2="103" stroke="#E2E8F0"/>

  <!-- ===== Region boundaries ===== -->
  <!-- data asset domain (mapping layer + thing model) -->
  <rect x="660" y="130" width="660" height="540" rx="12" fill="none" stroke="#7C3AED" stroke-width="1.4" stroke-dasharray="8 4" opacity="0.7"/>
  <rect x="676" y="120" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="736" y="135" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">数据资产域</text>

  <!-- platform service domain (apps) -->
  <rect x="1370" y="140" width="300" height="530" rx="12" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-dasharray="8 4" opacity="0.7"/>
  <rect x="1386" y="130" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="1446" y="145" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">平台服务域</text>

  <!-- ===== Column 1: native data sources (blue) ===== -->
  <!-- r1 Modbus (primary / main path) -->
  <rect x="90" y="170" width="210" height="100" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <rect x="90" y="170" width="6" height="100" rx="2" fill="#2563EB"/>
  <text x="108" y="196" font-size="15" font-weight="700" fill="#0F172A">Modbus 寄存器值</text>
  <text x="108" y="216" font-size="10" fill="#64748B">地址 0x0001</text>
  <text x="108" y="234" font-size="10" fill="#64748B">原始值 0x0A</text>
  <text x="108" y="256" font-size="9" fill="#94A3B8">主链路 · 原生数据</text>

  <!-- r5 BLE -->
  <rect x="90" y="360" width="210" height="100" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <rect x="90" y="360" width="6" height="100" rx="2" fill="#2563EB"/>
  <text x="108" y="386" font-size="15" font-weight="700" fill="#0F172A">BLE 特征值</text>
  <text x="108" y="406" font-size="10" fill="#64748B">UUID 0x2A6E</text>
  <text x="108" y="424" font-size="10" fill="#64748B">原始值 0x419A0000</text>
  <text x="108" y="446" font-size="9" fill="#94A3B8">原生数据</text>

  <!-- r8 LoRaWAN -->
  <rect x="90" y="550" width="210" height="100" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <rect x="90" y="550" width="6" height="100" rx="2" fill="#2563EB"/>
  <text x="108" y="576" font-size="15" font-weight="700" fill="#0F172A">LoRaWAN 负载</text>
  <text x="108" y="596" font-size="10" fill="#64748B">FPort 负载</text>
  <text x="108" y="614" font-size="10" fill="#64748B">0x02 0xFD 0x00 0x27</text>
  <text x="108" y="636" font-size="9" fill="#94A3B8">原生数据</text>

  <!-- ===== Column 2: protocol drivers (green) ===== -->
  <!-- Modbus Driver -->
  <rect x="390" y="170" width="210" height="100" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <rect x="390" y="170" width="6" height="100" rx="2" fill="#10B981"/>
  <text x="408" y="196" font-size="15" font-weight="700" fill="#0F172A">Modbus Driver</text>
  <text x="408" y="216" font-size="10" fill="#64748B">0x0A → 整数 10</text>
  <text x="408" y="234" font-size="10" fill="#64748B">+ 偏移 15.3 → 25.3℃</text>
  <text x="408" y="256" font-size="9" fill="#94A3B8">寄存器解析</text>

  <!-- BLE Driver -->
  <rect x="390" y="360" width="210" height="100" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <rect x="390" y="360" width="6" height="100" rx="2" fill="#10B981"/>
  <text x="408" y="386" font-size="15" font-weight="700" fill="#0F172A">BLE Driver</text>
  <text x="408" y="406" font-size="10" fill="#64748B">IEEE-754 解码</text>
  <text x="408" y="424" font-size="10" fill="#64748B">0x419A0000 → 19.0</text>
  <text x="408" y="446" font-size="9" fill="#94A3B8">特征值解析</text>

  <!-- LoRaWAN Driver -->
  <rect x="390" y="550" width="210" height="100" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <rect x="390" y="550" width="6" height="100" rx="2" fill="#10B981"/>
  <text x="408" y="576" font-size="15" font-weight="700" fill="#0F172A">LoRaWAN Driver</text>
  <text x="408" y="596" font-size="10" fill="#64748B">十六进制解码</text>
  <text x="408" y="614" font-size="10" fill="#64748B">按 FPort 拆字段</text>
  <text x="408" y="636" font-size="9" fill="#94A3B8">负载解析</text>

  <!-- ===== Column 3: data mapping layer (orange, cylinder) ===== -->
  <!-- cylinder body -->
  <path d="M 690 210 L 690 600 A 125 22 0 0 0 940 600 L 940 210 A 125 22 0 0 1 690 210 Z" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <!-- top ellipse emphasis -->
  <ellipse cx="815" cy="210" rx="125" ry="22" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="815" y="250" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">数据映射层</text>
  <text x="815" y="272" font-size="11" fill="#64748B" text-anchor="middle">JSON Schema 字段映射</text>
  <line x1="720" y1="292" x2="910" y2="292" stroke="#F59E0B" stroke-width="0.8" opacity="0.5"/>
  <text x="815" y="316" font-size="11" fill="#475569" text-anchor="middle">· 类型统一（int/float/hex）</text>
  <text x="815" y="338" font-size="11" fill="#475569" text-anchor="middle">· 单位归一化（℃/%RH）</text>
  <text x="815" y="360" font-size="11" fill="#475569" text-anchor="middle">· 字段名标准化</text>
  <text x="815" y="382" font-size="11" fill="#475569" text-anchor="middle">· Schema 校验</text>
  <line x1="720" y1="404" x2="910" y2="404" stroke="#F59E0B" stroke-width="0.8" opacity="0.5"/>
  <text x="815" y="540" font-size="11" font-weight="600" fill="#F59E0B" text-anchor="middle">核心抽象层</text>
  <text x="815" y="560" font-size="9" fill="#94A3B8" text-anchor="middle">屏蔽协议差异 · 输出标准模型</text>

  <!-- ===== Column 4: thing model instance (purple) ===== -->
  <rect x="1030" y="300" width="260" height="200" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="1030" y="300" width="6" height="200" rx="2" fill="#7C3AED"/>
  <text x="1048" y="328" font-size="15" font-weight="700" fill="#0F172A">物模型实例</text>
  <text x="1048" y="346" font-size="10" fill="#64748B">ThingModel · JSON</text>
  <rect x="1048" y="358" width="224" height="86" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="1058" y="378" font-size="11" fill="#0F172A">{</text>
  <text x="1072" y="396" font-size="11" fill="#475569">"temperature": 25.3,</text>
  <text x="1072" y="414" font-size="11" fill="#475569">"humidity": 45.0,</text>
  <text x="1072" y="432" font-size="11" fill="#475569">"ts": 1731673200</text>
  <text x="1058" y="438" font-size="11" fill="#0F172A"></text>
  <text x="1266" y="438" font-size="11" fill="#0F172A" text-anchor="end">}</text>
  <rect x="1048" y="454" width="74" height="20" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="1085" y="468" font-size="9" font-weight="600" fill="#7C3AED" text-anchor="middle">统一模型</text>
  <rect x="1130" y="454" width="86" height="20" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/>
  <text x="1173" y="468" font-size="9" font-weight="600" fill="#7C3AED" text-anchor="middle">与协议无关</text>

  <!-- ===== Column 5: platform applications (gray/blue) ===== -->
  <rect x="1410" y="180" width="230" height="92" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
  <rect x="1410" y="180" width="6" height="92" rx="2" fill="#64748B"/>
  <text x="1428" y="208" font-size="15" font-weight="700" fill="#0F172A">告警引擎</text>
  <text x="1428" y="228" font-size="10" fill="#64748B">阈值越限触发</text>
  <text x="1428" y="246" font-size="10" fill="#64748B">温度 ≥ 30℃ 告警</text>
  <text x="1428" y="262" font-size="9" fill="#94A3B8">Alarm</text>

  <rect x="1410" y="364" width="230" height="92" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
  <rect x="1410" y="364" width="6" height="92" rx="2" fill="#64748B"/>
  <text x="1428" y="392" font-size="15" font-weight="700" fill="#0F172A">规则引擎</text>
  <text x="1428" y="412" font-size="10" fill="#64748B">条件组合编排</text>
  <text x="1428" y="430" font-size="10" fill="#64748B">联动 / 自动化</text>
  <text x="1428" y="446" font-size="9" fill="#94A3B8">Rule</text>

  <rect x="1410" y="548" width="230" height="92" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
  <rect x="1410" y="548" width="6" height="92" rx="2" fill="#64748B"/>
  <text x="1428" y="576" font-size="15" font-weight="700" fill="#0F172A">实时仪表盘</text>
  <text x="1428" y="596" font-size="10" fill="#64748B">属性可视化</text>
  <text x="1428" y="614" font-size="10" fill="#64748B">趋势 / 分布</text>
  <text x="1428" y="630" font-size="9" fill="#94A3B8">Dashboard</text>

  <!-- ===== Arrows: Col1 -> Col2 (原始帧) ===== -->
  <!-- Modbus main path (blue, highlighted) -->
  <line x1="300" y1="220" x2="384" y2="220" stroke="#2563EB" stroke-width="2.4" marker-end="url(#ah-blue)"/>
  <text x="342" y="212" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">原始帧</text>
  <!-- BLE -->
  <line x1="300" y1="410" x2="384" y2="410" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah-gray)"/>
  <text x="342" y="402" font-size="10" fill="#64748B" text-anchor="middle">原始帧</text>
  <!-- LoRaWAN -->
  <line x1="300" y1="600" x2="384" y2="600" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah-gray)"/>
  <text x="342" y="592" font-size="10" fill="#64748B" text-anchor="middle">原始帧</text>

  <!-- ===== Arrows: Col2 -> Col3 mapping layer (converge) ===== -->
  <!-- Modbus -> mapping : 整型 (main path, blue highlighted) -->
  <path d="M 600 220 C 640 220, 650 300, 686 300" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#ah-blue)"/>
  <text x="628" y="258" font-size="10" font-weight="600" fill="#2563EB">整型</text>
  <!-- BLE -> mapping : 浮点 -->
  <line x1="600" y1="410" x2="686" y2="410" stroke="#10B981" stroke-width="1.8" marker-end="url(#ah-green)"/>
  <text x="628" y="402" font-size="10" fill="#10B981" text-anchor="middle">浮点</text>
  <!-- LoRaWAN -> mapping : hex解码 -->
  <path d="M 600 600 C 640 600, 650 520, 686 520" fill="none" stroke="#10B981" stroke-width="1.8" marker-end="url(#ah-green)"/>
  <text x="612" y="566" font-size="10" fill="#10B981">十六进制</text>

  <!-- ===== Arrow: mapping -> thing model (归一化, main link blue) ===== -->
  <line x1="940" y1="400" x2="1024" y2="400" stroke="#2563EB" stroke-width="2.6" marker-end="url(#ah-blue)"/>
  <text x="982" y="392" font-size="10" font-weight="600" fill="#2563EB" text-anchor="middle">Schema 归一化</text>

  <!-- ===== Arrows: thing model -> apps (fan out, gray) ===== -->
  <path d="M 1290 400 C 1340 400, 1360 226, 1404 226" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah-gray)"/>
  <line x1="1290" y1="400" x2="1404" y2="410" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah-gray)"/>
  <path d="M 1290 400 C 1340 400, 1360 594, 1404 594" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#ah-gray)"/>
  <text x="1330" y="320" font-size="10" fill="#64748B">语义化属性</text>
  <text x="1340" y="438" font-size="10" fill="#64748B">事件</text>
  <text x="1330" y="504" font-size="10" fill="#64748B">服务</text>

  <!-- main-path highlight callout -->
  <rect x="90" y="706" width="700" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="110" cy="724" r="4" fill="#2563EB"/>
  <text x="124" y="728" font-size="11" fill="#334155">主链路（蓝色高亮）：Modbus 寄存器值 → Modbus Driver 解析为整型 → 数据映射层归一化 → 物模型实例。</text>

  <!-- ===== Legend ===== -->
  <line x1="60" y1="762" x2="1740" y2="762" stroke="#E2E8F0"/>
  <text x="64" y="786" font-size="11" font-weight="700" fill="#475569">图例</text>

  <rect x="110" y="776" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="134" y="786" font-size="11" fill="#475569">原生数据源</text>

  <rect x="232" y="776" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <text x="256" y="786" font-size="11" fill="#475569">协议驱动</text>

  <rect x="340" y="776" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="364" y="786" font-size="11" fill="#475569">数据映射层（核心抽象）</text>

  <rect x="540" y="776" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="564" y="786" font-size="11" fill="#475569">统一物模型实例</text>

  <rect x="700" y="776" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
  <text x="724" y="786" font-size="11" fill="#475569">平台应用</text>

  <line x1="824" y1="782" x2="864" y2="782" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ah-blue)"/>
  <text x="872" y="786" font-size="11" fill="#475569">主链路（高亮）</text>

  <line x1="980" y1="782" x2="1020" y2="782" stroke="#64748B" stroke-width="1.6" marker-end="url(#ah-gray)"/>
  <text x="1028" y="786" font-size="11" fill="#475569">数据流（标注转换步骤）</text>

  <!-- ===== Caption ===== -->
  <text x="900" y="906" font-size="10" fill="#94A3B8" text-anchor="middle">图4-5 三种协议传感器数据经驱动解析与数据映射层，统一转换为相同结构的物模型实例，上层应用消费时无需感知底层协议差异</text>
  </svg>
</svg>